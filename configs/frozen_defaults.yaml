# Frozen methodology defaults (end of Phase 1, 2026-09-26). Spec: docs/PROJECT_SPECIFICATION.md.
# Any change after this point is a new trial in the trial registry (spec §9.8) and a row in the
# spec's decision log. tests/test_config.py keeps code defaults and this file in sync.

snapshot: sharadar_2026-09-25

periods:
  warmup: [1998-01-01, 1999-12-31]
  development: [2000-01-01, 2019-12-31]
  holdout: [2020-01-01, 2026-09-25]      # 6.7 years; opened once via the vault (spec §9.7)

universe:
  primary: liq1000
  categories: [Domestic Common Stock, Domestic Common Stock Primary Class]
  exclude_sic: 6770                      # SPAC / blank check, point in time
  min_price: 5.0                         # unadjusted close
  min_history: 252                       # bars
  dv_window: 63                          # trailing median dollar volume
  top_n: 1000
  robustness: sp500_pit                  # S&P 500 membership at t (secondary classes/ADRs missing)

delisting:                               # terminal return vs. last close (spec §4.5)
  acquisition: consideration             # cash + stock ratio x acquirer close; 0 if unknown
  max_consideration_deviation: 0.5
  spac_liquidation: 0.0
  bankruptcy: -1.0
  performance: -0.30
  voluntary: 0.0
  unknown_low_price: 1.0                 # unknown below this price -> performance return
  sensitivity:
    optimistic: {all: 0.0}
    pessimistic: {unknown: -0.5, performance: -1.0}

costs:                                   # per side, bps of traded value (spec §7.3)
  commission_bps: 0.0
  floor_bps: 5.0
  tiers: [[200, 3.0], [500, 6.0], [1000, 12.0]]   # liquidity rank -> half-spread
  default_bps: 25.0
  pre_decimal_multiplier: 2.5
  decimalization: 2001-04-09
  sensitivity_multipliers: [1, 2, 3]

cash:
  series: FRED DTB3
  convention: previous trading day's rate, act/360

wfo:
  scheme: expanding
  train_start: 2000-01-01
  min_train_years: 5
  refit_months: 12
  test_months: 12
  first_test_year: 2005
  last_test_year: 2019
  embargo_days: 21

hard_filters:                            # inside select(), on the training window (spec §9.4)
  max_drawdown: 0.45
  max_turnover_annual: 20.0
  min_avg_positions: 8
  min_sharpe: 0.0
  min_share_positive_years: 0.6

ranking:
  score: min(sharpe, neighbourhood_median_sharpe)
  dedup_correlation: 0.85

ensemble:
  primary: {k: 2, weights: equal}
  secondary: {k: 3, weights: equal}
  rebalance: monthly

grid:                                    # spec §6, §19; ~3000 candidates
  families:
    xs_momentum: {lookback: [63, 126, 252], skip: [0, 21]}
    ts_trend: {sma: [50, 100, 200]}
    breakout: {lookback: [55, 126, 252], recent_days: [1, 5]}
    st_reversal: {lookback: [3, 5, 10]}
    low_vol: {lookback: [63, 126, 252]}
    regime_market: {sma: [100, 150, 200]}
  portfolio:
    top_n: [10, 20, 30, 50]
    weighting: [equal, inverse_vol]
    rebalance: [weekly, monthly]
    hysteresis: [1.0, 1.5, 2.0]
    overlay: [none, trend_filter, vol_target]
  max_weight: 0.10

gates:
  phase2_pbo_max: 0.30
  phase3_dsr_min: 0.90
  phase3_ci_vs_ew_univ_lower_bound_min: 0.0
