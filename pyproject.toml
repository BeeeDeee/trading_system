[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.1.0"
description = "Multi-asset trading opportunity engine"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyarrow==18.1.0",
    "duckdb==1.1.3",
    "pydantic==2.10.3",
    "PyYAML==6.0.2",
    "matplotlib==3.9.3",
    "scipy==1.14.1",
    "httpx==0.28.1",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.122.3",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[project.scripts]
scout = "scout.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "DTZ", "PD"]
# DTZ: flake8-datetimez -- catches naive datetimes. Non-negotiable here.
# PD:  pandas-vet -- catches inplace=True and other footguns.

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
[[tool.mypy.overrides]]
module = ["scout.research.*", "scout.cli.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]
