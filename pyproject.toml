[project]
name = "qlab"
version = "0.0.1"
description = "Research framework for long-only US equity strategies (Sharadar)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
    "scipy>=1.11",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "jsonschema>=4.20",
]

[project.scripts]
lab = "lab.framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlab", "lab"]

[tool.pytest.ini_options]
testpaths = ["tests", "lab/tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8"]
