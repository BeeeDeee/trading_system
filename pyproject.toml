[project]
name = "arena5m"
version = "0.1.0"
description = "Experimentální framework pro 5m crypto strategie na Binance USDⓈ-M futures"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=43",
    "pyyaml>=6",
    "numpy>=2",
]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["net: síťový test (živé API), defaultně přeskočen"]
addopts = "-m 'not net'"
