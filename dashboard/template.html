<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!--__CSP__-->
<title>Crypto paper bot</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--wash:rgba(11,11,11,.04);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--other:#c3c2b7;
  --good:#0ca30c;--goodtext:#006300;--warn:#fab219;--crit:#d03b3b;--badtext:#b42323;
  --dpos2:#2a78d6;--dpos1:#9ec5f4;--dmid:#f0efec;--dneg1:#f3b0af;--dneg2:#e34948;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--wash:rgba(255,255,255,.05);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--other:#4a4a46;
  --goodtext:#0ca30c;--badtext:#e66767;
  --dpos2:#3987e5;--dpos1:#1c5cab;--dmid:#383835;--dneg1:#8f3232;--dneg2:#e66767;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--wash:rgba(255,255,255,.05);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--other:#4a4a46;
  --goodtext:#0ca30c;--badtext:#e66767;
  --dpos2:#3987e5;--dpos1:#1c5cab;--dmid:#383835;--dneg1:#8f3232;--dneg2:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:0 16px 48px}
h1{font-size:18px;margin:0;font-weight:650}
h2{font-size:16px;margin:0 0 4px;font-weight:650}
.sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
section{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;margin-top:16px}
.top{position:sticky;top:0;z-index:5;background:var(--page);padding:10px 0 8px;border-bottom:1px solid var(--grid)}
.toprow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:650;font-size:13px;border:1px solid var(--ring)}
.pill i{width:10px;height:10px;border-radius:50%;display:inline-block}
.meta{color:var(--ink2);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.banner{background:var(--warn);color:#0b0b0b;border-radius:8px;padding:6px 10px;font-weight:650;margin-top:8px;font-size:13px}
a{color:var(--s1)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ring);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink2);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--ink);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);border:1px solid var(--ring);border-radius:999px;padding:2px 8px;background:transparent;cursor:pointer;font-family:inherit}
.chip .key{width:14px;height:0;border-top:2px solid}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;min-width:150px;z-index:3}
.tip .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .row span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .key{width:12px;height:0;border-top:2px solid}
.tip strong{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{color:var(--ink2);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
td{font-variant-numeric:tabular-nums}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--hl,transparent)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--wash)}
.pos{color:var(--goodtext)}.neg{color:var(--badtext)}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--grid);border-radius:10px;padding:10px}
.card h3{font-size:13px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.bar{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--grid);gap:2px;margin:4px 0 6px}
.bar span{background:var(--s1);height:100%}
.bar span.cash{background:transparent}
.plist{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 10px}
.plist b{color:var(--ink);font-weight:600}
.heat td.c{width:44px;text-align:center;border-radius:4px;border:2px solid var(--surface)}
.heat td.note{text-align:left;white-space:normal;min-width:220px;color:var(--ink2);font-size:12px}
.heat td.coin{font-weight:650}
.legend-div{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);margin:6px 0}
.legend-div span.sw{width:22px;height:10px;border-radius:3px;display:inline-block}
.list{margin:0;padding-left:18px;font-size:13px}
.list li{margin:3px 0}
.kv{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv div:nth-child(odd){color:var(--ink2)}
.flag{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--crit);color:var(--badtext);margin-left:4px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>div{min-width:0}
@media (max-width:760px){.top{position:static}.two{grid-template-columns:1fr}th,td{padding:5px 6px}}
.empty{color:var(--ink2);padding:24px 0;text-align:center}
.srcs a{font-size:11px;margin-right:6px;word-break:break-all}
</style>
</head>
<body>
<div class="top"><main style="padding-bottom:0">
  <div class="toprow">
    <h1>Crypto paper bot</h1>
    <span id="status" class="pill"></span>
    <span class="meta" id="meta"></span>
  </div>
  <div id="banner"></div>
</main></div>
<main id="app"><p class="empty">Načítám…</p></main>

<script>
(function(){
"use strict";
var INLINE = /*__INLINE_DATA__*/null;
var SLOTS = ["--s1","--s2","--s3"];
var SCN = {base:"Čistý", stress:"Stresový", gross:"Hrubý"};
var LENS = {trend:"Trend", mr:"Reverze", news:"Zprávy", conviction:"Přesvědčení", composite:"Composite", p_outperform_btc_7d:"P(překoná BTC)", expected_move_7d_pct:"Očekávaný pohyb"};
var STATUS = {ok:["OK","var(--good)"], warning:["UPOZORNĚNÍ","var(--warn)"], catchup:["DOPLNĚNO","var(--warn)"], failed:["CHYBA","var(--crit)"]};
var D, state = {scn:"base", hl:[], colorOf:{}, show:"all", sortKey:"ret", sortDir:-1, lens:"composite"};

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "text") e.textContent = attrs[k];
    else if (k === "cls") e.className = attrs[k];
    else if (k === "style") e.setAttribute("style", attrs[k]);
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(c){ if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function svg(tag, attrs){ var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function pct(x, d){ if (x == null || isNaN(x)) return "–"; d = d == null ? 1 : d; return (x >= 0 ? "+" : "−") + Math.abs(x*100).toFixed(d).replace(".", ",") + " %"; }
function pct0(x, d){ if (x == null || isNaN(x)) return "–"; d = d == null ? 0 : d; return (x*100).toFixed(d).replace(".", ",") + " %"; }
function num(x, d){ if (x == null || isNaN(x)) return "–"; return x.toFixed(d == null ? 2 : d).replace(".", ",").replace("-", "−"); }
function usd(x){ if (x == null) return "–"; return "$" + Math.round(x).toLocaleString("cs-CZ"); }
function signCls(x){ return x == null ? "" : (x > 0 ? "pos" : x < 0 ? "neg" : ""); }
function safeUrl(u){ return /^https?:\/\//i.test(u) ? u : null; }
function pname(id){ var p = D.portfolios.find(function(p){ return p.id === id; }); return p ? p.name : id; }

function load(){
  if (INLINE) return Promise.resolve(INLINE);
  return fetch("data.json", {cache:"no-store", credentials:"same-origin"}).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}

function header(){
  var lr = D.last_run || (D.runs && D.runs[D.runs.length-1]) || {};
  var st = STATUS[lr.status] || ["?", "var(--muted)"];
  var s = document.getElementById("status");
  s.textContent = "";
  s.appendChild(el("i", {style:"background:" + st[1]}));
  s.appendChild(document.createTextNode(st[0]));
  var m = document.getElementById("meta");
  var v = lr.version || {};
  var commit = v.code_commit;
  var kids = [el("b",{text: lr.date || "–"}), " · verze " + (v.tag || "–") + " · model " + (lr.llm_model_pinned || "–") + " · řetězec "];
  var ch = D.chain || {};
  kids.push(el("span", {style:"color:" + (ch.ok ? "var(--goodtext)" : "var(--badtext)") + ";font-weight:650", text: ch.ok ? "✓ neporušen (" + ch.records + ")" : "✗ PORUŠEN"}));
  if (commit) { kids.push(" · "); kids.push(el("a", {href: D.repo_url + "/commit/" + commit, rel:"noopener noreferrer", target:"_blank", text:"kód " + commit.slice(0,7)})); }
  kids.push(" · "); kids.push(el("a", {href: D.repo_url + "/tree/crypto-paper-bot", rel:"noopener noreferrer", target:"_blank", text:"data"}));
  m.textContent = ""; kids.forEach(function(k){ m.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
  var b = document.getElementById("banner"); b.textContent = "";
  if (D.label) b.appendChild(el("div", {cls:"banner", text: D.label}));
  if (lr.status === "failed") b.appendChild(el("div", {cls:"banner", style:"background:var(--crit);color:#fff", text:"Poslední běh selhal: " + (lr.error || "")}));
}

// ------------------------------------------------------------------ equity chart
function equitySection(){
  var sec = el("section", null, [el("h2",{text:"Vývoj kapitálu"}),
    el("p",{cls:"sub", text:"Hodnota portfolií k 00:00 UTC (hodinové varianty podle prvního hodinového běhu dne); poslední bod je aktuální hodnota stejná jako v tabulce. Logaritmická osa. Barevně až 3 zvýrazněná portfolia (klepnutím v legendě nebo v tabulce), BTC HOLD přerušovaně, ostatní šedě."})]);
  var ctr = el("div",{cls:"controls"});
  var seg = el("div",{cls:"seg", role:"group", "aria-label":"Scénář nákladů"});
  Object.keys(SCN).forEach(function(k){ seg.appendChild(el("button",{"aria-pressed": String(state.scn===k), text:SCN[k], onclick:function(){ state.scn=k; render(); }})); });
  var seg2 = el("div",{cls:"seg", role:"group", "aria-label":"Zobrazit"});
  [["all","Vše"],["hl","Jen zvýrazněné + benchmarky"]].forEach(function(o){ seg2.appendChild(el("button",{"aria-pressed": String(state.show===o[0]), text:o[1], onclick:function(){ state.show=o[0]; render(); }})); });
  ctr.appendChild(seg); ctr.appendChild(seg2); sec.appendChild(ctr);
  var chips = el("div",{cls:"chips"});
  D.portfolios.forEach(function(p){
    var on = state.hl.indexOf(p.id) >= 0, isBtc = p.id === "b_btc";
    var col = on ? "var(" + state.colorOf[p.id] + ")" : (isBtc ? "var(--ink)" : "var(--other)");
    chips.appendChild(el("button",{cls:"chip", "aria-pressed":String(on), style: on ? "border-color:" + col + ";color:var(--ink)" : "",
      onclick:function(){ toggleHl(p.id); }}, [el("span",{cls:"key", style:"border-top-color:" + col + (isBtc ? ";border-top-style:dashed" : "")}), p.name]));
  });
  sec.appendChild(chips);
  var wrap = el("div",{cls:"chart"}); sec.appendChild(wrap);
  requestAnimationFrame(function(){ drawEquity(wrap); });
  return sec;
}
function toggleHl(id){
  var i = state.hl.indexOf(id);
  if (i >= 0) { state.hl.splice(i,1); delete state.colorOf[id]; }
  else {
    if (state.hl.length >= 3) { var old = state.hl.shift(); delete state.colorOf[old]; }
    var used = state.hl.map(function(h){ return state.colorOf[h]; });
    state.colorOf[id] = SLOTS.find(function(s){ return used.indexOf(s) < 0; });
    state.hl.push(id);
  }
  render();
}
function drawEquity(wrap){
  var S = D.series, dates = S.dates, n = dates.length;
  var W = Math.max(320, wrap.clientWidth), H = W < 600 ? 260 : 340, m = {l:52, r:12, t:10, b:28};
  var ids = D.portfolios.map(function(p){ return p.id; }).filter(function(id){
    return S.equity[id] && (state.show === "all" || state.hl.indexOf(id) >= 0 || id.indexOf("b_") === 0); });
  var lo = Infinity, hi = -Infinity;
  ids.forEach(function(id){ S.equity[id][state.scn].forEach(function(v){ if (v != null && v > 0){ lo = Math.min(lo, v); hi = Math.max(hi, v);} }); });
  lo = Math.log(lo*0.98); hi = Math.log(hi*1.02);
  var x = function(i){ return m.l + (n > 1 ? i/(n-1) : 0.5) * (W-m.l-m.r); };
  var y = function(v){ return m.t + (1 - (Math.log(v)-lo)/(hi-lo)) * (H-m.t-m.b); };
  var s = svg("svg",{viewBox:"0 0 " + W + " " + H, role:"img", "aria-label":"Vývoj kapitálu portfolií"});
  // gridlines (log ticks)
  var ticks = niceLogTicks(Math.exp(lo), Math.exp(hi));
  ticks.forEach(function(t){ var yy = y(t);
    s.appendChild(svg("line",{x1:m.l, x2:W-m.r, y1:yy, y2:yy, stroke:css("--grid"), "stroke-width":1}));
    var tx = svg("text",{x:m.l-6, y:yy+4, "text-anchor":"end", "font-size":11, fill:css("--muted")}); tx.textContent = pct(t / D.start_capital - 1, 0); s.appendChild(tx); });
  var step = Math.max(1, Math.ceil(n / (W < 600 ? 4 : 8)));
  for (var i = 0; i < n; i += step){ var tx = svg("text",{x:x(i), y:H-8, "text-anchor":"middle", "font-size":11, fill:css("--muted")}); tx.textContent = dates[i].slice(5,10).split("-").reverse().join(". ") + "." + (i === n-1 && dates[i].length > 10 ? " (nyní)" : ""); s.appendChild(tx); }
  // segments (release/model change)
  (S.segments||[]).forEach(function(sg, k){ if (k > 0 && (sg.tag !== S.segments[k-1].tag || sg.model !== S.segments[k-1].model)){
    var xi = x(dates.indexOf(sg.date)); s.appendChild(svg("line",{x1:xi, x2:xi, y1:m.t, y2:H-m.b, stroke:css("--axis"), "stroke-dasharray":"4 3"}));
    var t = svg("text",{x:xi+4, y:m.t+10, "font-size":10, fill:css("--muted")}); t.textContent = (sg.tag||"") + " " + (sg.model||""); s.appendChild(t); } });
  function path(vals){ var d = "", pen = false; vals.forEach(function(v,i){ if (v == null){ pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; }); return d; }
  function lastIdx(vals){ for (var i = vals.length - 1; i >= 0; i--) if (vals[i] != null) return i; return -1; }
  var order = ids.filter(function(id){ return state.hl.indexOf(id) < 0 && id !== "b_btc"; }).concat(ids.indexOf("b_btc") >= 0 ? ["b_btc"] : []).concat(state.hl.filter(function(h){ return ids.indexOf(h) >= 0; }));
  order.forEach(function(id){
    var on = state.hl.indexOf(id) >= 0, btc = id === "b_btc";
    var col = on ? css(state.colorOf[id]) : btc ? css("--ink") : css("--other");
    if (on) s.appendChild(svg("path",{d:path(S.equity[id][state.scn]), fill:"none", stroke:css("--surface"), "stroke-width":5, "stroke-linejoin":"round"}));
    s.appendChild(svg("path",{d:path(S.equity[id][state.scn]), fill:"none", stroke:col, "stroke-width": on ? 2.25 : btc ? 1.75 : 1.25, "stroke-dasharray": btc && !on ? "5 4" : "", "stroke-linejoin":"round", "stroke-linecap":"round", opacity: on || btc ? 1 : 0.9}));
  });
  // direct labels for highlighted at the end
  state.hl.forEach(function(id){ if (!S.equity[id]) return; var vals = S.equity[id][state.scn], k = lastIdx(vals); if (k < 0) return;
    s.appendChild(svg("circle",{cx:x(k), cy:y(vals[k]), r:3.5, fill:css(state.colorOf[id]), stroke:css("--surface"), "stroke-width":2})); });
  // crosshair + tooltip
  var cross = svg("line",{y1:m.t, y2:H-m.b, stroke:css("--axis"), "stroke-width":1, visibility:"hidden"}); s.appendChild(cross);
  var hit = svg("rect",{x:m.l, y:m.t, width:W-m.l-m.r, height:H-m.t-m.b, fill:"transparent"}); s.appendChild(hit);
  var tip = el("div",{cls:"tip"});
  function move(ev){
    var r = s.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    var i = Math.max(0, Math.min(n-1, Math.round((px - m.l) / (W-m.l-m.r) * (n-1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility","visible");
    tip.textContent = ""; tip.appendChild(el("div",{style:"font-weight:650;margin-bottom:4px", text: dates[i] + " (" + SCN[state.scn].toLowerCase() + ")"}));
    var show = state.hl.concat(["b_btc"]).filter(function(id, k, a){ return S.equity[id] && a.indexOf(id) === k && S.equity[id][state.scn][i] != null; });
    show.sort(function(a,b){ return S.equity[b][state.scn][i] - S.equity[a][state.scn][i]; }).forEach(function(id){
      var v = S.equity[id][state.scn][i], col = state.colorOf[id] ? "var(" + state.colorOf[id] + ")" : "var(--ink)";
      tip.appendChild(el("div",{cls:"row"},[el("span",null,[el("i",{cls:"key", style:"border-top-color:" + col + (id === "b_btc" ? ";border-top-style:dashed" : "")}), pname(id)]), el("strong",{text: pct(v / D.start_capital - 1)})])); });
    tip.style.display = "block";
    var tx = (x(i) / W) * r.width; tip.style.left = Math.min(r.width - tip.offsetWidth, Math.max(0, tx + 12)) + "px"; tip.style.top = "8px";
  }
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", function(){ tip.style.display = "none"; cross.setAttribute("visibility","hidden"); });
  wrap.textContent = ""; wrap.appendChild(s); wrap.appendChild(tip);
}
function niceLogTicks(a, b){
  // ticks at round % returns from the start capital (log axis)
  var c = D.start_capital, lo = a / c - 1, hi = b / c - 1, span = hi - lo;
  var st = [0.01,0.02,0.05,0.1,0.2,0.25,0.5,1,2,5].find(function(s){ return span / s <= 6; }) || 10;
  var out = [];
  for (var r = Math.ceil(lo / st) * st; r <= hi + 1e-9; r += st) if (r > -1) out.push(c * (1 + r));
  return out;
}

// ------------------------------------------------------------------ metrics table
function metricsSection(){
  var sec = el("section", null, [el("h2",{text:"Varianty a benchmarky"}),

function render(){

  [equitySection(), metricsSection(), positionsSection(), scoresSection(), analyticsSection(), runSection()].forEach(function(s){ app.appendChild(s); });
}

load().then(function(d){
  D = d;
  ["zaklad","mech_momentum","claude_volne"].forEach(function(id){ if (D.portfolios.some(function(p){ return p.id === id; })){ state.colorOf[id] = SLOTS[state.hl.length]; state.hl.push(id); } });
  render();
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(render, 200); });

}).catch(function(e){ document.getElementById("app").textContent = "Data se nepodařilo načíst: " + e.message; });
})();
