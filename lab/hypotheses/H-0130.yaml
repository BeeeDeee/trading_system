title: TradFi risk shifts re-order the crypto risk ladder, learned - Binance spot top-20 long-only 5-day cohorts,
  LightGBM on beta/ivol/liquidity x VIX and real-yield shifts
author_agent: scout
family: crypto-flight-to-quality
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Levered and VaR-constrained altcoin holders (margin traders, crypto funds facing redemptions from
    TradFi allocators) who must sell high-beta, illiquid coins with a lag after a US risk-off shift and accept the
    price concession over several days; on risk-on shifts, late re-risking buyers who chase high-beta coins after
    BTC has already moved.
  why: 'Crypto holdings form a risk ladder: BTC (deepest market, the collateral asset), then ETH and large coins,
    then high-beta, high-idiosyncratic-risk, thinner altcoins held by levered retail and by crypto funds whose capital
    comes partly from TradFi allocators. When US risk appetite shifts (US implied equity volatility jumps, or the
    US real yield jumps, which tightens dollar funding), VaR- and margin-constrained holders cut risk, and they
    cut it from the top of the ladder: high-beta, illiquid altcoins are sold and capital moves toward BTC or stablecoins
    (flight to quality and to liquidity, Brunnermeier and Pedersen 2009). Margin limits are updated on trailing
    volatility and fund redemptions are processed with a lag, so the rotation is spread over several days after
    the shift and the TradFi signal is still informative one to two days late. After a risk-on shift (VIX or real
    yield falling) the reverse rotation runs: re-risking capital enters through BTC and moves up the ladder over
    the following days. The claim is therefore conditional: which coins win over the next five days depends on the
    interaction of a date-level TradFi shift with the coin''s place on the ladder, and the sign of the ladder premium
    flips between risk-off and risk-on shifts.'
  why_not_arbitraged: 'Front-running the rotation requires shorting altcoins (borrow is scarce on spot, perp funding
    and squeeze risk are high) or holding concentrated altcoin longs into stress; the arbitrage capital that could
    do it is itself funding-constrained in exactly these states (funding-liquidity spiral). Daily crypto lead-lag
    to US macro series is not the claim: the information is a slow-moving constraint on holders, not news to be
    priced.'
signal:
  description: 'Data: Binance spot USDT pairs (binance_spot_1d), point-in-time top 20 by 30-day quote volume (framework
    crypto_top_n; stablecoins excluded by the loader; BTCUSDT is a member and is scored like any other coin). FRED
    series VIXCLS and DFII10 (fred_macro, clock next_morning, signal only). Decisions after the 00:00 UTC close
    of crypto day t using data up to that close; trades at the open of day t+1. FRED values enter through the framework''s
    clock alignment (a US value of day d is usable from the next day on); on days without a new FRED value (weekends,
    US holidays) the last value is carried, so the TradFi features are constant over a weekend. Features per coin
    and date (3 coin-level, cross-sectionally z-scored over the scored universe members of the date with the framework
    helper): (1) beta60 = OLS slope of the coin''s daily total return on BTCUSDT''s daily total return over the
    last 60 days (at least 45 valid pairs, else missing; BTC''s own beta is 1); (2) ivol60 = standard deviation
    of the residuals of that regression; (3) liq30 = log of the median daily quote volume over the last 30 days.
    Date-level features (3, identical for every coin on a date, NOT z-scored across coins, which would make them
    identically zero; fed raw, trees are scale-free): (4) dvix5 = log(VIX) of the latest usable observation minus
    log(VIX) five published observations earlier; (5) dry5 = DFII10 latest usable observation minus the value five
    published observations earlier, in percentage points; (6) lvix = log(VIX) of the latest usable observation.
    A row (date x coin) is scored and used for training only when all six features exist; no feature uses more than
    60 days of history, so no long warm-up beyond the model''s own minimum training sample. Label (framework): total
    return from the next open to the open 5 rows later, ranked across the universe members on each date. Model:
    framework walk_forward with gbm (LightGBM), expanding window, refit every 63 rows, num_leaves 8, learning_rate
    0.05, min_child_samples 200, subsample 0.8, other settings framework defaults; n_estimators from params. Book
    (score_weights): long-only daily cohorts; at each decision date the coins in the top `top` fraction of the gbm
    score among scored members (top 0.2 = 4 of 20) form a cohort that gets 1/5 of the book, equal weight within
    the cohort, held 5 days; the book is the sum of the 5 live cohorts (always invested once scores exist, cash
    before). Fewer than 10 scored members on a date means that date''s cohort is cash. A coin that leaves the point-in-time
    universe is closed at the first decision row outside it (K-0051). No shock filter in the book: on calm dates
    the gbm score is close to the unconditional ladder, on shock dates the interaction can re-order it, so the book
    is an always-invested tilt, not a rare-state book (K-0147). Ridge control (diagnostic only): framework ridge,
    alpha 1.0, same six features, same label, rows and refit schedule; used only to define the mechanism event.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.15
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
mechanism_test:
  event: On a decision date where the TradFi state shifted (|dvix5| >= 0.15, a 5-observation log change of VIX of
    at least 15 %, or |dry5| >= 0.15 percentage points, a 5-observation change of the 10-year real yield), a coin
    is in the top `top` fraction (0.2 = top fifth) of the gbm score but not in the same top fraction of the ridge
    score on the same features (side +1), or in the ridge's top fraction but not the gbm's (side -1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'beta60: 60-day OLS beta of the coin''s daily total return on BTCUSDT, z-scored across members (place on the
    crypto risk ladder: how much the coin is sold per unit of crypto-wide de-risking)'
  - 'ivol60: 60-day residual volatility from the same regression, z-scored (idiosyncratic risk that margin and VaR
    systems penalize and that a BTC hedge cannot remove)'
  - 'liq30: log 30-day median daily quote volume, z-scored (liquidity ladder: flight to liquidity hits thin coins
    hardest)'
  - 'dvix5: 5-observation log change of VIX (FRED VIXCLS, next_morning clock), date-level, raw (US equity risk-appetite
    shift)'
  - 'dry5: 5-observation change of the 10-year TIPS real yield (FRED DFII10, next_morning clock), date-level, raw
    (dollar funding / discount-rate tightening shift)'
  - 'lvix: log VIX level, date-level, raw (whether the shift happens in a calm or an already stressed state, where
    VaR limits bind harder)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The label is ranked across coins on each date, so a date-level input (dvix5, dry5, lvix) adds
    the same constant to every coin''s linear score and cannot change the ranking: a ridge on these six features
    can only learn the unconditional ladder premium from beta60, ivol60 and liq30 and is blind to the TradFi state
    by construction. The mechanism says the ladder premium changes sign with the direction of the TradFi shift (risk-off:
    low beta, low ivol, liquid coins win; risk-on: the reverse) and is larger when VIX is already high, which is
    a state x characteristic interaction that a tree expresses with a split on dvix5 or dry5 followed by a split
    on beta60 or liq30. The ridge on the same features is therefore the exact control for ''the TradFi state adds
    nothing''. Who pays: the margin- and VaR-constrained altcoin holders who de-risk with a lag (risk-off) and the
    late chasers of high-beta coins (risk-on).'
