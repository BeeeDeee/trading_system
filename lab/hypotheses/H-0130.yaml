falsification_criteria:
- 'Mechanism: on TradFi shock dates the gbm-only picks (side +1) minus ridge-only picks (side -1) do not beat the
  95th percentile of the time-shifted placebos at 5 days, or the gross abnormal return per event is below the round-trip
  cost, or fewer than two of three blocks have the predicted sign.'
- 'Mechanism kill condition (K-0060): the latest third of dev (which holds the real-yield tightening of the dev
  window) has the wrong sign, even if the pooled test passes.'
- 'Ridge on the same features is as good: the ridge-only picks earn as much as or more than the gbm-only picks on
  shock dates (event average at or below zero), i.e. the TradFi state does not re-order the ladder.'
- If the disagreement average on calm dates (descriptive, not gated) is as large as on shock dates, the gain is
  coin-feature nonlinearity, not the cross-asset channel, and the card's mechanism is refuted even if the event
  test passes.
- Net Sharpe on dev below BTC buy-and-hold Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or
  below zero.
- Fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat BTC buy-and-hold, or Sharpe at doubled costs
  below BTC buy-and-hold.
notes: 'Why this fits the brief: signals from the US equity-options and Treasury markets (FRED VIX and real yield),
  trades in crypto spot; 5-day horizon; a walk-forward gbm whose only possible gain over a ridge on the same features
  is the state x characteristic interaction (ranked labels make date-level inputs invisible to a linear score).
  Difference from earlier cards: H-0081 sorted on the day''s BTC-residual return under a VIX-level gate and bet
  on reversal (liquidity provision); this card has no return feature at all, sorts on the ex-ante ladder position
  (beta, idiosyncratic risk, liquidity) and claims that the sign of the ladder premium follows the direction of
  the TradFi shift; it is neither the H-0081 sort nor its mirror. H-0124 switched coin momentum by VIX and BTC-trend
  states and never produced a score (K-0170); this card shares the VIX input, so the Chair may merge families if
  it reads them as one mechanism (state-switched crypto sort), and I would accept that. Scoring safeguards against
  the H-0124 failure modes (inferred, not verified): no feature needs more than 60 days, the date-level features
  must not be passed through the cross-sectional z-score helper (that would make them zero or NaN on every row and
  could leave no complete rows), spot data from mid-2018 gives about 4.5 years of dev so the first refit has data,
  and the walk-forward runs on all columns with non-members masked per row (K-0134). A zero-event G0 should be read
  as a bug, not a mechanism result. Universe start: from memory Binance listed few USDT pairs before 2018, so the
  period starts mid-2018; if lab check or G0 shows fewer than about 15 members early on, the fewer-than-10 rule
  keeps those cohorts in cash. Forecasts (K-0120, K-0165): scored dates about 1200-1300 after the model''s first
  fit; shock dates (|dvix5| >= 0.15 or |dry5| >= 0.15 pp, weekends included because the feature is carried) about
  35-40 % of them, i.e. 400-500 dates; disagreement events are model-defined, range 300-2500 (1-3 coins per side
  per shock date). If the gbm almost never disagrees with the ridge the event count fails: that reads as ''no state
  dependence found'', the same verdict as a failed placebo. Round trip for top-20 spot pairs about 30-60 bps (10
  bps fee per side plus slippage); gross per event central about 60 bps, pessimistic 0, optimistic 150 at 5 days,
  so the cost check is likely to bind (K-0053). Blocks: the first third (mid-2018 to early 2020) is partly empty
  from model warm-up (K-0163), so both later thirds must be positive. Beta confound (K-0074): on risk-off dates
  the gbm-only picks are probably lower beta than the ridge-only picks, so if crypto keeps falling after US risk-off
  shifts the test is positive partly through market direction; that continuation is part of the claimed de-risking,
  but a pure crypto time-series drift after US shocks would look the same and is not separated here. Please report
  the event average separately for risk-off shifts (dvix5 or dry5 up) and risk-on shifts, and for calm dates. Book
  arithmetic: always invested, exposure about 1.0, daily cohorts of 4 coins at 5 % each; on calm days the score
  is persistent, so expected turnover is roughly 20-40x a year and cost drag 6-15 % a year at 30-60 bps round trip,
  i.e. about 0.1-0.2 Sharpe at crypto volatility. The book must beat BTC buy-and-hold by 0.10 Sharpe with a long-only
  altcoin-heavy book over a window with two altcoin bear phases; that is the likeliest death after the mechanism
  test. No date literals, no named coins except BTCUSDT as the beta factor, which is a universe member.'
