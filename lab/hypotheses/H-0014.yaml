id: H-0014
version: 1
title: High-volume visibility premium - LIQ-500 market-neutral, weekly, long abnormal-volume stocks and short abnormally
  quiet stocks matched on past-week return, hold 5 days
author_agent: scout
family: high-volume-visibility-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders who sell into the shock-day liquidity at prices that do not yet reflect the coming demand
    of new, attention-driven buyers, and later buyers who arrive with that delayed visibility demand and pay the
    higher price. On the short side, holders of neglected, quiet stocks receive no new demand.
  why: 'An unusual burst of trading activity in a stock without an extreme price move makes the stock more visible:
    it shows up on most-active lists, screens and news feeds, and gets put in front of investors who did not follow
    it before. Under incomplete information (Merton 1987 investor recognition), a wider investor base raises demand
    and lowers the required return. Because short-selling is costly for most of these new investors, more visibility
    mostly adds buyers, not sellers. That is why stocks with abnormally high volume over a day or a week appreciate
    in the following weeks, and abnormally quiet stocks drift down (Gervais, Kaniel, Mingelgrin 2001; Kaniel, Ozoguz,
    Starks 2012 cross-country). The claim tested here is that the demand shift starts within the first week, so
    a 5-day hold earns part of the premium.'
  why_not_arbitraged: The premium per event is small relative to the spread of a weekly-rebalanced book. It is spread
    over hundreds of names, mixed with the much larger reversal and news-drift effects of the same days, and the
    short leg holds neglected stocks with idiosyncratic jump risk. Statistical arbitrage desks usually condition
    on returns, not on volume relative to the stock's own history with returns held fixed.
signal:
  description: 'Decision once a week after the close of the last trading day of each calendar week (day t), trades
    at the next open (t+1), positions held until the next weekly decision (about 5 trading days). Eligible stocks
    on day t: in the LIQ-500 universe and tradable on t, with dollar_volume present on at least 80 % of the days
    of both windows below. Abnormal volume AV = ln(mean dollar_volume over days t-4..t) - ln(mean dollar_volume
    over the reference window of the reference_days trading days before that, i.e. t-4-reference_days..t-5). Past-week
    return R5 = product over days t-4..t of (1+ret_co)(1+ret_oc) - 1. Sort the eligible stocks into five quintiles
    by R5 on day t. Within each R5 quintile, rank by AV: the top leg_quantile fraction goes to the long leg, the
    bottom leg_quantile fraction to the short leg (rounded down, at least one name per side per quintile). Because
    both legs take the same share of every R5 quintile, they are matched on past-week return, which neutralizes
    short-term reversal and news-drift exposure by construction. Weights: long leg equal-weighted to +0.5 in total,
    short leg equal-weighted to -0.5 in total (gross 1, dollar-neutral). A stock that stops trading or is delisted
    while held keeps the engine''s terminal-return treatment. Its weight is not redistributed until the next weekly
    decision. Stocks with missing inputs on t are simply not eligible that week. No other filters, no market-timing.'
  params:
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    reference_days:
      grid:
      - 25
      - 50
      - 100
      value: 50
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a weekly decision date t (last trading day of the calendar week), a stock enters the long leg (its abnormal
    5-day dollar volume AV is in the top leg_quantile within its past-week-return quintile; side +1) or the short
    leg (AV in the bottom leg_quantile within its quintile; side -1), with the primary parameters reference_days
    50 and leg_quantile 0.2.
  horizons:
  - 1
  - 5
  - 10
  - 20
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sep
  fields:
  - ret_co
  - ret_oc
