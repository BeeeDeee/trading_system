  typical_days: 5
market_exposure: market_neutral
references:
- cite: Gervais, Kaniel, Mingelgrin (2001) The high-volume return premium, Journal of Finance
  year: 2001
- cite: 'Kaniel, Ozoguz, Starks (2012) The high volume return premium: Cross-country evidence, Journal of Financial
    Economics'
  year: 2012
- cite: Merton (1987) A simple model of capital market equilibrium with incomplete information, Journal of Finance
  year: 1987
falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events (next open to close of t+5, minus the same-date
  mean of the other stocks) does not beat the 95th percentile of the time-shifted placebos, or keeps its sign in
  fewer than 2 of 3 sub-periods, or is smaller per event than the round-trip cost.'
- 'Mechanism: the long side (high abnormal volume) does not earn a positive 5-day abnormal return on its own. If
  all of the spread comes from the quiet short leg, the visibility (new-demand) mechanism is not supported, even
  if the book makes money.'
- Net Sharpe of the primary configuration on dev below 0.5 (benchmark T-bill), or the one-sided bootstrap bound
  of the Sharpe difference vs T-bill not above zero.
- Fewer than 75 % of the neighbor configurations (reference_days 25/100, leg_quantile 0.1/0.3, and their combinations)
  reach the benchmark bar, or their median Sharpe is below 0.70 of the primary.
- Net Sharpe at costs x2 below the T-bill bar, or more than 60 % of the dev log return comes from one of three sub-periods.
- S&P 500 alt-universe Sharpe below half of the LIQ-500 Sharpe.
notes: 'Fit to the brief: cross-sectional US single stocks, 5-day hold, weekly decisions on daily inputs. The source
  papers find the premium builds over 20-50 days, so a 5-day horizon is the brief''s constraint, not the papers''
  optimum. The mechanism test is the check that the premium already shows up in week one. If it does not, the lab
  learns that the visibility effect is too slow for a short-horizon book (horizons 10 and 20 are reported descriptively
  for exactly this). How it differs from dead cards: H-0009 (disposition-news-drift) followed the direction of volume-shock
  moves, and studies 5, 7 and H-0007 bet on reversal of past returns. Here the long and short legs are drawn from
  the same past-week-return quintiles, so return direction is held fixed and only volume relative to the stock''s
  own history differs. Both high-volume up-movers and high-volume down-movers are bought. H-0008 used volume 52
  and 13 weeks ago to predict earnings weeks. This card uses the realized volume of the past week and makes no claim
  about announcements. H-0011 was a breakout through a price anchor. New family because the mechanism (investor
  recognition / visibility from trading activity) is not in the registry or the prior studies. Costs: about 100
  % of each leg turns over per week. At LIQ-500 half-spreads (3-6 bps, x2.5 before 2001-04) that is roughly 5 %/year,
  10 % at costs x2. The gross spread must be large enough, which is the main risk. The primary is the paper''s natural
  round setup (about 50-day reference, one-week formation, quintile legs), not a tuned value. Known risks: the premium
  may be concentrated in small, less-visible firms (smaller in LIQ-500 and the S&P 500), and the publication-decay
  check uses 2001 inside dev with a short pre-period. High-volume names may carry a beta tilt in a dollar-neutral
  book. The legs are not beta-matched, on purpose (one fewer degree of freedom), and the Skeptic can check realized
  beta. No new data needed.'
