falsification_criteria:
- 'Mechanism: new entries into the ridge legs earn a side-adjusted 5-session abnormal return at or below the 95th
  percentile of the time-shifted placebos: there is no linear reversal concession in the high-volatility half of
  LIQ-300.'
- 'Mechanism: gross abnormal return per entry below the round-trip cost (cost ratio < 1): the linear concession
  exists at most below taker cost, so learned reversal cards on these features in liquid stocks have nothing to
  build on (answers the H-0103 open question).'
- 'The latest third of dev has a negative mean abnormal return for the entries (K-0060 decay): the concession is
  gone in recent years whatever the pooled number says.'
- 'The one-session abnormal return is about zero and the ten-session one is larger than the five-session one: slow
  drift, not a liquidity concession that reverts within the week.'
- Net Sharpe of the dollar-neutral book on dev below 0.5, or the bootstrap bound of the Sharpe difference against
  T-bills not above zero.
- Neighbors of alpha 10 (1, 100) or of top 0.2 (0.1, 0.3) fail to beat the benchmark in more than a quarter of the
  combinations, or doubled costs leave the Sharpe below the T-bill benchmark.
notes: 'Closest fit to the brief, said plainly. The brief asks for a learned 1-5 day card on US single stocks. The
  lab has nearly closed every loadable short-horizon signal in liquid US stocks: return sorts and their conditioners
  (K-0133, K-0152), learned state and calendar interactions (K-0137), learned earnings-reaction and filing scores
  (K-0139, K-0143), volume and attention stories (H-0014, H-0067), macro-exposure continuation (H-0075 avoid line,
  H-0114 pending), and the remaining flow events are pending (H-0112, H-0113). The one explicit open question inside
  the brief is the linear baseline H-0103 and K-0135 ask for: does a plain ridge on the same 10-day path information
  find a reversal concession in the high-volatility half of LIQ-300, and how large is it relative to cost? This
  card answers it. It is not a new conditioner on a reversal sort (no state variable, no new tier, H-0099 avoid
  line), and it stays in short-term-reversal so its trial counts there. Forecasts, written before any data (K-0120,
  K-0151): the high-volatility half holds about 150 names, each leg about 30 at top 0.2; with weekly persistence
  of the score about half of each leg is a new entry, so about 25-35 entries per weekly date on about 900 weekly
  dates after the warm-up, i.e. 20,000-30,000 events. Round trip about 11-12 bps (half-spread tier 5-6 bps for ranks
  up to 300). Gross per entry: optimistic about 15 bps (the high-volatility half raises the 5-day dispersion to
  about 6 % weekly, so a rank IC of 0.02 would give about 15 bps), central 4-8 bps, pessimistic 1-2 bps (the lab''s
  measured grosses for weekly sorts in LIQ-500 were 2-5 bps). The central case dies at G1 on the cost ratio; the
  card is filed because that number is the baseline every later learned reversal card in liquid stocks needs, and
  a pass would be the first linear evidence that the concession survives taker cost in volatile large caps. Expected
  mean exposure about 1.0 gross (always invested after the warm-up), far more than 100 entries and 36 decision dates.
  Placebo bar: with about 30 entries per date and both sides marked it should sit well under the round trip (H-0103
  had a narrow cloud on the same universe), so a failure will be a real negative, not a power problem. The period
  starts in 2002 to stay out of the fractional-quote cost regime and to match H-0103 row for row; the first fit
  needs the framework''s minimum training sample, so the earliest weeks are flat. No hand-written rule sits on top
  of the model other than the leg fractions and the flat-if-few rule.'
