title: Linear liquidity-provision baseline in volatile large caps, learned - LIQ-300 high-volatility half, weekly
  dollar-neutral, ridge on 10-day intraday/overnight/volume summaries, hold 5 days
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 300
mechanism:
  counterparty: Traders who demand immediacy in volatile large caps (institutional order splitting, attention-driven
    buying and selling) and accept a temporary price concession to trade now; the liquidity providers (market makers,
    statistical-arbitrage desks) earn it when the price reverts.
  why: Investors who demand immediacy in a stock (institutions working large orders, attention-driven traders) push
    its price away from value over a few sessions; liquidity providers who absorb the imbalance demand a price concession
    that is paid back as the price reverts over the following week (Lehmann 1990; Nagel 2012). The concession per
    unit of order imbalance is largest where the providers' inventory risk is largest, i.e. in the most volatile
    names, and it should show in the intraday component of the move (where the imbalance trades) more than in the
    overnight component (where news arrives). This card measures that concession with the simplest learned model,
    a ridge regression, on the same 10-day intraday, overnight and volume information that H-0103 gave a TCN. H-0103
    found that the picks only the network made were wrong-signed, but the plain linear score was never reported,
    so whether a linear reversal exists in this half at all is unknown (H-0103 open question, K-0135, K-0142). This
    card is that baseline, run as a full hypothesis.
  why_not_arbitraged: The concession is small per name and per week, close to the spread a taker pays, so only low-cost
    liquidity providers harvest it; inventory risk is highest exactly in volatile names, and provider capital shrinks
    when volatility rises (Nagel 2012). A taker book collects it only if the gross per entry clears the round trip,
    which is the open question here.
signal:
  description: 'Universe and scoring set: on each decision date t, the point-in-time LIQ-300 members with at least
    63 sessions of total returns; the high-volatility half are the members whose 63-session realized volatility
    of daily close-to-close total returns is at or above the cross-sectional median of the members at t. Only the
    high-volatility half is scored and traded. Membership is evaluated per row; no column list is built from future
    membership (K-0134). Features at the close of t (each z-scored across the high-volatility half on that date
    with the framework helper): (1) sum of the intraday open-to-close returns ret_oc over sessions t-4..t; (2) sum
    of the overnight close-to-open returns ret_co over sessions t-4..t; (3) total return over sessions t-9..t-5
    (the week before); (4) log of mean dollar volume over t-4..t divided by mean dollar volume over t-67..t-5; (5)
    the 63-session realized volatility itself. Label: total return from the open of t+1 to the open of t+1+horizon
    (horizon = 5 rows), cross-sectionally ranked among the high-volatility half on each date. Model: ridge (framework
    `ridge`, regularization `alpha`) trained only through lab.framework.ml.walk_forward on all (date x stock) rows
    of the high-volatility half, expanding window, refit every 63 rows, purge and label handling by the framework.
    Decision dates: the last trading session of each calendar week, after the close; trades at the next open. Book:
    rank the ridge scores of the high-volatility half; long the top `top` fraction and short the bottom `top` fraction,
    equal weight within each leg, 0.5 gross per leg (dollar-neutral, gross 1.0); held until the next weekly decision,
    where the legs are rebuilt (names that stay in a leg keep their position, so only changes trade). Stocks without
    a complete feature vector are not scored. If fewer than 20 stocks are scored on a decision date, or before the
    first model fit, the book is flat. A held stock that leaves the universe is closed at the first decision row
    on which it is no longer a member.'
  params:
    alpha:
      grid:
      - 1
      - 10
      - 100
      value: 10
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a weekly decision date, a stock in the high-volatility half of LIQ-300 enters the top `top` fraction
    of the ridge score (side +1) or the bottom `top` fraction (side -1) when it was not in that leg at the previous
    weekly decision.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'Sum of intraday open-to-close returns (ret_oc) over the last 5 sessions: where an order imbalance trades and
    the concession is paid (sharadar_sep, known at the close of t)'
  - 'Sum of overnight close-to-open returns (ret_co) over the last 5 sessions: where news mostly arrives, expected
    to revert less than the intraday part (sharadar_sep)'
  - 'Total return of the week before (sessions t-9..t-5): whether an older imbalance is already reverting or still
    building, the rest of the 10-day path H-0103 saw (sharadar_sep)'
  - 'Log ratio of 5-session to prior 63-session mean dollar volume: size of the recent imbalance relative to normal
    trading (sharadar_sep dollar_volume)'
  - '63-session realized volatility of daily total returns: providers'' inventory risk, which scales the concession
    inside the high-volatility half (sharadar_sep)'
  horizon_days: 5
  model: ridge
  retrain_every_days: 63
  why_not_linear: 'This card is the linear model on purpose. It is the baseline the lab has asked for and never
    ran: H-0103 gave the same 10-day intraday, overnight and volume information to a TCN and found its own picks
    wrong-signed, but did not report what a ridge does on the same half (K-0135, K-0142). The claim tested here
    is linear: the concession is a weighted sum of the recent intraday move (strongly reverting), the overnight
    move (weakly reverting) and the volume shock, with volatility as a scale. Any later learned reversal card on
    liquid stocks should be judged against this card''s gross per entry, not against zero.'
