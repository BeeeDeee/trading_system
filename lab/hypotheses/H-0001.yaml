falsification_criteria:
- Net Sharpe on dev (primary k=2, m=3) below the 60/40 SPY/IEF Sharpe + 0.10, or the one-sided 90 % bootstrap CI
  of the Sharpe difference includes 0.
- At costs x2 the primary configuration no longer beats the 60/40 Sharpe.
- Fewer than 75 % of the neighbor configurations (days_before 1/3, days_after 2/4 and their combinations) beat the
  60/40 Sharpe.
- Fewer than 2 of 3 dev sub-periods beat the 60/40 Sharpe, or one block holds more than 60 % of the log return.
- 'Mechanism: the strategy does not beat the 95th percentile of random-entry runs with the same exposure and turnover,
  i.e. holding SPY on 5 random trading days per month earns as much as holding it in the turn-of-month window.'
- 'Mechanism: on dev, the mean daily SPY return inside the window minus the mean daily SPY return outside the window
  is not positive; or the post-2008 (after McConnell-Xu) Sharpe excess over 60/40 is less than half the pre-2008
  excess.'
notes: 'Gap named in prior_studies: calendar and flow effects were never tested by the owner; nothing in the registry.
  Differences from killed studies: no trend, momentum, inverse vol or regime filter (studies 2, 9, 10); no stock
  selection (1, 5, 11); the timing input is the exchange calendar only, so there are no estimated signals to overfit
  and no look-ahead path. Primary window k=2, m=3 is chosen a priori between the classic Lakonishok-Smidt/McConnell-Xu
  window (-1..+3) and the Etula et al. account in which the month-end selling pressure peaks a few days before the
  last trading day and reverts afterwards; the grid brackets both. Expected SPY share ~5/21 = 24 % of days, IEF
  the rest; total exposure 100 %. Cost risk: ~24 full switches per year (one-way turnover ~48x/y) is only plausible
  because SPY and IEF are the cheapest tier; costs x2 is the most likely gate to fail. References: the first three
  predate dev; McConnell-Xu (2008) is inside dev and is the meaningful publication-decay split. Etula et al. was
  published in 2020 (working paper circulated years earlier), so its post-publication slice of dev is under a year
  and uninformative. Suggested alternative universe for G2: IVV for SPY and TLT or AGG for IEF (same mechanism,
  different instruments). Most likely death: the window premium has decayed since the effect became widely known
  and IEF-outside-window does not compensate, so the Sharpe excess over 60/40 is below +0.10, or it hinges on one
  sub-period.'
