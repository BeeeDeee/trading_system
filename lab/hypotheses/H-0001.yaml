title: Turn-of-month equity timing - SPY during the month-end/month-start flow window, IEF otherwise
author_agent: scout
family: turn-of-month-flows
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  kind: instruments
mechanism:
  counterparty: 'Liquidity-driven sellers (mutual funds, pension plans, institutions meeting month-end cash needs)
    who sell at temporarily depressed prices before the turn, and the market makers/intermediaries who absorb that
    flow and are paid for it; plus investors holding equities through the rest of the month who bear full equity
    risk for little premium. The sellers keep doing it because their payment dates and mandates are fixed: they
    cannot postpone payouts, and holding large cash buffers all month costs them more than the price impact.'
  why: The monthly payment cycle creates predictable, market-wide price pressure. Institutions that must deliver
    cash for month-end payments (pension and benefit payouts, fund redemptions, distributions) sell liquid equities
    and bonds in the days before month end, when settlement still guarantees cash by the last day; prices are pushed
    down and revert as the payment date passes. Right after the turn, payroll-driven retirement contributions and
    reinvested coupons/dividends arrive and are invested in equities in the first days of the new month. Both effects
    concentrate the equity premium in a short window around the turn of the month (last trading days of month M
    plus first trading days of M+1); outside the window the equity premium is small, so holding intermediate Treasuries
    there gives a better risk/return trade-off than holding equities all month. This is a long-only timing of the
    equity sleeve of a stock/bond portfolio by a calendar that is known in advance, not a forecast.
  why_not_arbitraged: 'The pressure is market-wide, so it cannot be hedged cross-sectionally: harvesting it means
    carrying full directional equity risk for a premium of roughly a tenth of a percent per day, which ties up risk
    capital of intermediaries with balance-sheet limits. Most investors are mandate-bound to stay invested (benchmark-relative
    funds) or rebalance far less often than twice a month. The anomaly is old and well-known, so the risk is decay,
    which the publication-decay and holdout checks test.'
signal:
  description: 'Instruments: SPY (equity sleeve) and IEF (bond sleeve). Calendar: XNYS trading days; the calendar
    (including holidays) is known in advance, so the window membership of every day is known before it starts and
    no price data is used to decide anything. For every calendar month M, label the trading days around the turn:
    the last trading day of M is day -1, the second-to-last is day -2, ...; the first trading day of M+1 is day
    +1, the second is day +2, .... The turn-of-month window of M is the set of trading days {-k, ..., -1, +1, ...,
    +m} (k = days_before, m = days_after), i.e. k + m consecutive trading days. Target weights: on every trading
    day inside a window hold 100 % SPY and 0 % IEF; on every other trading day hold 0 % SPY and 100 % IEF. Execution:
    the target of trading day d is decided after the close of the previous trading day d-1 and traded at the open
    of d. Concretely, sell IEF and buy SPY at the open of day -k (decision after the close of day -k-1); hold SPY
    through the close of day +m; sell SPY and buy IEF at the open of day +m+1 (decision after the close of day +m).
    The P&L of the switch day therefore uses ret_oc of the instrument bought and ret_co of the instrument sold.
    Two switches per month, about 24 per year, both legs fully switched (no partial weights, no volatility scaling,
    no other filter). Start: the first full month after both SPY and IEF have prices (IEF starts in mid 2002); before
    that the strategy holds nothing and is not evaluated. Missing data: if either instrument has no tradable price
    on a scheduled switch day, keep the current position and switch at the next open where both are tradable; if
    the window has already ended by then, skip that window. No other instruments are ever traded.'
  params:
    days_after:
      grid:
      - 2
      - 3
      - 4
      value: 3
    days_before:
      grid:
      - 1
      - 2
      - 3
      value: 2
