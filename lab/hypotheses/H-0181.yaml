falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the events is below the 95th percentile of the 200
  time-shifted placebos, or below the round-trip cost.'
- 'Mechanism (slow build, the reason for this card): the 60-session mean is not larger than the 21-session mean;
  then the reversal is not slow and the year-long hold has no basis.'
- 'Mechanism (decay, K-0060/K-0093): the latest third of dev (about 2013-2020) is wrong-signed; even if two thirds
  pass, a latest third near zero is read as decay, not support.'
- 'Strategy: net Sharpe on dev below T-bill + 0.5, or the 75 % bootstrap bound of the Sharpe difference below zero.'
- 'Robustness: the hold_days neighbors 126 or 378 do not beat T-bill + 0.5 (the effect must not hinge on one hold
  length).'
- 'Leg split (if G1 reports it): the deletion leg alone has a Sharpe at or below zero; the literature puts most
  of the effect there, so a book paid only by shorting additions is momentum or valuation exposure, not the index
  mechanism.'
notes: 'Brief fit: long horizon (12-month hold, 6 and 18 months as neighbors), US single stocks, cross-sectional,
  mechanism test declared. Family: index-inclusion-price-pressure, reused on purpose (H-0017, H-0018, H-0022, H-0113
  are its trials). Why this is not a retry of H-0022: K-0093 says further tests on the same membership events are
  retries unless ''a slower horizon argued from the build-up''; both earlier cards showed the effect small in the
  first sessions and largest at their longest horizon, and the literature (Chen-Noronha-Singal for deletions recovering
  over about two months, Arnott et al. for the following year) places it at months. The primary horizon moves from
  5 to 60 sessions and the book from 5 days to a year; the event set is the same, so the event study is a pre-registered
  re-measurement at a different horizon, counted as a new family trial. Placebo reading (K-0025): the same stocks
  on shifted dates should NOT carry the effect, because deletions spend the year before the event falling and additions
  rising; a placebo shifted into that window is wrong-signed. A placebo mean near or below zero is expected; if
  the placebo mean is about as large as the event mean, the sort picks stock identity and the card is dead. Confound
  I cannot remove at G1: deleted stocks are past-year losers and additions past-year winners, so part of any effect
  may be generic long-term reversal or value; a control matched on prior-year return would separate it (not available
  in the judge). Beta (K-0074): both sides are higher-volatility names than the average member (distressed deletions,
  high-momentum additions), so the side-adjusted pooled average roughly cancels market direction; the book hedges
  the net with the other members. Forecasts (K-0120, K-0098): G1 of H-0022 counted 395 events on the same rule,
  so expect about 350-420 events on roughly 250-300 dates (fewer at the end of dev because of the 60-session window),
  about 40 % deletions (deleted names often fall out of LIQ-500 at once; acquisition deletions are included and
  dilute the deletion side, since they cannot be excluded without look-ahead). Open slots: about 8-10 additions
  and 4-7 deletions a year inside LIQ-500, so with a 252-session hold about 12-17 slots open (0.05 each), slots
  gross about 0.6-0.85 plus the hedge of the net, mean exposure (as slots gross) about 0.6, so the 0.2 floor and
  100 entries are met; at least 36 decision dates is trivially met. Expected gross: if a third to a half of the
  literature spread survives LIQ-500, forced exits and the hedge, about 7-10 % per unit of spread a year, i.e. 3-5
  % a year on the book, against book volatility of about 7-9 % (concentrated idiosyncratic slots): Sharpe 0.4-0.6,
  so the absolute floor of 0.5 is the most likely strategy failure. Round trip per slot is about 10-20 bps on US
  equity tiers, paid once a year; the hedge basket is re-weighted on slot changes only, so cost x2 is not the binding
  gate. Forced exits: deletions that drop out of LIQ-500 are closed early by the engine rule; this shortens the
  deletion leg but uses only point-in-time information.'
