id: H-0181
version: 1
title: Slow S&P 500 change reversal held for a year - LIQ-500, long liquid stocks just deleted from the index, short
  just-added ones, equal slots hedged dollar-neutral with the other members, 12-month hold
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Index funds and benchmarked managers who trade on the effective date to minimize tracking error,
    i.e. knowingly accept a bad price; and active managers who cannot hold a stock once it is off their S&P 500
    benchmark (career and mandate risk), which keeps the deleted stock without natural buyers for months. On the
    addition side, momentum and growth buyers who extrapolate the run-up that earned the inclusion.
  why: 'When a stock leaves (enters) the S&P 500, index funds, enhanced-index and benchmark-hugging active funds
    and the derivatives desks hedging them must sell (buy) it around the effective date regardless of price. Demand
    curves for single stocks slope down (Shleifer 1986), so the forced trade pushes the deleted stock below and
    the added stock above its value. The selection rule amplifies it: deletions are the index''s biggest recent
    losers and additions its biggest recent winners, so the forced trade lands on top of a year of extrapolation
    in the same direction (the added names trade far richer than the market on every multiple). The lab''s two five-session
    tests of exactly these events (H-0017, H-0022) found the right sign, gross well above cost and a placebo mean
    near zero, but the abnormal return was small in the first sessions and still growing at the longest horizon
    measured: the reversal is slower than a week. Practitioner and academic evidence puts it at months: the deleted
    stock recovers as the off-benchmark discount fades and value buyers step in, and the added stock gives back
    its inclusion premium and its valuation gap over the following year (Arnott, Brightman, Kalesnik and Wu report
    discretionary deletions beating additions by about twenty percent over the following year, most of it from the
    deletion side). This card tests the slow form: the event study at 60 sessions and a book that holds each side
    for a year.'
  why_not_arbitraged: 'The trade must be held for months in a handful of names at a time: a concentrated, idiosyncratic,
    off-benchmark long in unloved former members and a short in hot new members (squeeze risk, borrow, momentum).
    Event arbitrageurs work the announcement-to-effective window (days), not the year after; long-horizon capital
    that could hold it is benchmarked to the very index that forces the trade. Capacity is small (a few dozen events
    a year), too small for large quant funds.'
signal:
  description: 'Universe: LIQ-500 (point-in-time liquidity rank), with the point-in-time S&P 500 membership flag
    extras[''sp500_member''] (1.0/0.0) read as an input. Decisions after the close of day t using data up to that
    close, trades at the open of day t+1. EVENTS: a deletion event for stock j on day t when sp500_member[t-1, j]
    == 1 and sp500_member[t, j] == 0; an addition event when sp500_member[t-1, j] == 0 and sp500_member[t, j] ==
    1. An event counts only if j is a LIQ-500 member and tradable on day t (a stock outside LIQ-500 has no event;
    nothing is ever weighted outside the declared universe). The first 5 sessions of the view are ignored (no t-1
    flag). BOOK: each event opens a slot from the open of t+1: long for a deletion, short for an addition, fixed
    slot weight 0.05 of capital. A slot is closed at the open after hold_days sessions have passed, or earlier at
    the first decision after the stock leaves LIQ-500, stops being tradable or delists (forced exit, the engine''s
    universe rule); a new opposite event on a stock that already holds a slot closes the old slot and opens the
    new one. If the long slots or the short slots together would exceed 0.45 gross, all slots of that side are scaled
    down pro rata to 0.45. HEDGE: the net dollar exposure of the slots (long slots minus short slots) is offset
    by an equal-weight basket of all other LIQ-500 members that hold no slot and are tradable (short the basket
    when the slots are net long, long it when net short), so the book is dollar-neutral at all times and gross never
    exceeds 1. The hedge basket is re-weighted only on days the slot book changes and on the first session of each
    month (membership refresh), not daily, to keep turnover low. With no open slot the book is flat (cash). Missing
    prices: a stock with no price on t+1 skips the entry; no other filters, no fundamentals.'
  params:
    hold_days:
      grid:
      - 126
      - 252
      - 378
      value: 252
  timeframes:
  - 1d
mechanism_test:
  event: 'A LIQ-500 stock''s point-in-time S&P 500 membership flag changes after the close of day t: 1 -> 0 (deletion,
    side +1, should outperform the other members afterwards) or 0 -> 1 (addition, side -1, should underperform).
    Same event set as H-0022; the claim tested here is the slow horizon.'
