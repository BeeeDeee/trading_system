id: H-0089
version: 1
title: Absorbed taker flow on Binance perps - after an hour of extreme one-sided taker volume that failed to move
  the price, trade with the passive absorber, both sides, hold 6 hours
author_agent: scout
family: taker-flow-absorption
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: 'The aggressive takers of the absorbed hour and their followers: leveraged traders whose market
    orders or stop/liquidation orders hit a wall of resting liquidity, and short-horizon momentum traders who read
    heavy taker buying (selling) as bullish (bearish) and keep paying the spread in that direction. They lose the
    spread plus the subsequent move in the absorber''s direction.'
  why: 'In a limit-order market an aggressive (taker) order flow normally moves the price in its own direction;
    that is why taker imbalance explains contemporaneous returns so well. When an hour of unusually one-sided, high-volume
    taker flow leaves the price unchanged or moved against the flow, someone resting passive orders absorbed it:
    a large patient trader (a fund or market maker working a big order with limit orders, an arbitrageur hedging
    a spot or cross-venue position, an OTC desk unwinding inventory) whose demand exceeds the aggressive supply
    at that price. Two things follow. (1) The absorber is still there and still has size to do, so the price drifts
    in the absorber''s direction over the next hours once the aggressive side stops. (2) The aggressive side (stop
    and liquidation orders, momentum chasers, traders who pay the spread to get out) has spent its ammunition without
    moving the price and, if leveraged, is now on the wrong side of a level that held, so its exits add to the move.
    The strategy enters only after the absorption is visible in a closed hour and the price has NOT yet moved in
    the absorber''s direction, so, unlike the taker-move cards of K-0077 (H-0035, H-0063), the payoff is not front-loaded
    into the signal candle: the information (hidden passive demand) is not yet in the price.'
  why_not_arbitraged: Exchange data feeds show taker volume and price, but not who rests the passive size; inferring
    an absorber from hourly flow is noisy, the effect is small per hour relative to crypto volatility, and it sits
    in mid-cap perps where a fast desk's capacity is limited and taker costs are high. Large absorbers deliberately
    hide size (iceberg-like slicing), and the obvious public reading of heavy taker flow is the opposite one (follow
    the aggressors), so the crowd trades against this signal rather than with it. Capacity is a few hundred thousand
    dollars per event at most.
signal:
  description: "Data: binance_perp_15m candles of the point-in-time top-20 perps by 30-day quote volume (the judge's\
    \ crypto_top_n universe). Decisions are taken after the close of every 15-minute candle t using data up to and\
    \ including candle t; fills at the open of candle t+1 (engine default).\n1. Hourly window. For every symbol\
    \ and every candle t, take the last 4 candles t-3..t (one hour). QV_t = sum of qv over the 4 candles, TB_t =\
    \ sum of tbq over the 4 candles, imbalance I_t = 2*TB_t/QV_t - 1 (in [-1, 1]; positive = takers bought). R_t\
    \ = c_t / c_(t-4) - 1 (close four candles back to close of t).\n2. Baselines (strictly past, no overlap with\
    \ the window): mu_I and sd_I = mean and standard deviation of I over the 2880 candles (30 days) ending at candle\
    \ t-4; QVbar = mean of QV (the rolling 4-candle sum) over the same 2880 candles. A symbol needs at least 2400\
    \ real candles (real == True) in that baseline and all 4 window candles real with qv > 0; otherwise no event.\
    \ z_t = (I_t - mu_I) / sd_I.\n3. Event (absorption) at candle t for symbol j, all three conditions:\n  (a) |z_t|\
    \ >= k (parameter imbalance_z);\n  (b) QV_t >= 2 * QVbar (fixed, not a parameter: the hour carried real size);\n\
    \  (c) s * R_t <= 0 with s = sign(z_t): the hour's close-to-close return was zero or went AGAINST the aggressive\n\
    \      flow (taker buying with a flat or falling price, or taker selling with a flat or rising price).\nSide\
    \ = -s: long after absorbed taker selling, short after absorbed taker buying.\n4. Positions. Five slots of 0.20\
    \ of equity each (gross <= 1). On an event, if the symbol has no open position and a slot is free, open the\
    \ position at the open of t+1 with weight 0.20 * side. If more events than free slots occur at the same decision,\
    \ take them in order of |z_t| (largest first); the rest are dropped, not queued. A symbol with an open position\
    \ ignores new events (no pyramiding, no reversal) until it is closed.\n5. Exit. Close at the open of candle\
    \ t+1+H, i.e. after H candles (parameter hold_candles). Exit tolerant of the universe rule (K-0051): if the\
    \ symbol leaves the point-in-time universe or its candle is not real before the scheduled exit, close at the\
    \ first decision at which that happens. No stop-loss, no profit target. Funding is charged by the engine on\
    \ positions open at settlement.\n6. Nothing else: no trend or regime filter, no BTC leader, no funding condition.\
    \ Symbols not yet listed or without 30 days of history cannot produce events."
  params:
    hold_candles:
      grid:
      - 12
      - 24
      - 48
      value: 24
    imbalance_z:
      grid:
      - 2.0
      - 2.5
      - 3.0
      value: 2.5
  timeframes:
  - 15m
  - 1h
