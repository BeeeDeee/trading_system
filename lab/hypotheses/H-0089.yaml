falsification_criteria:
- 'Fewer than 300 trades in the 2020-2022 dev period at the primary configuration: absorption hours of this kind
  are too rare to be a strategy.'
- Net Sharpe below 0.5 on dev, or the bootstrap bound of the mean net trade not above zero (G1).
- 'Mechanism-level: Sharpe with a one-candle later fill below 50 % of the primary Sharpe. The card claims the price
  has not yet moved when the event is seen, so the edge must not be front-loaded; failing this puts the card with
  K-0077 (taker moves consumed within a candle) and refutes the absorption reading.'
- Net Sharpe at doubled costs not positive.
- Fewer than 2 of 3 dev sub-periods positive, more than 60 % of profit in one third, or the latest third of dev
  negative (K-0060 decay stated as a kill condition).
- 'Neighbours of imbalance_z (2.0, 3.0) or hold_candles (12, 48): fewer than 75 % positive or median Sharpe below
  70 % of the primary.'
- The same trades placed at random times do not beat the 95th percentile of the random-entry null.
- 'Mechanism control (Builder diagnostic, reported in the build log): the mirror event set (same imbalance and volume
  conditions but s * R_t > 0, i.e. the flow DID move the price) traded the same way (against the flow) must earn
  less gross per trade than the absorption set. If absorption events earn no more than flow-driven events, the edge
  is generic reversal against taker flow (short-term-reversal family, H-0035), not absorption.'
- 'Mechanism control: if the long side (absorbed selling) and the short side (absorbed buying) have mean gross trades
  of opposite sign, the symmetric absorption claim is false and any profit is market drift in one direction.'
notes: 'Brief: SCALPING on binance_perp_15m, holding a few hours; no mechanism_test (intraday judge has none).

  Why this is not a near-copy of earlier intraday cards. H-0035 faded hours with a 4-sigma PRICE move on taker-
  dominated volume (liquidity provision after an overshoot); H-0063 followed taker-dominated breakouts; both selected
  candles in which the aggressive flow had already moved the price, and both lost the edge to a one-candle delay
  (K-0077). This card requires the opposite: extreme taker imbalance with NO price move in its direction. The claim
  is about hidden passive demand that has not yet reached the price, not about a price overshoot reverting, so the
  family is a new mechanism (taker-flow-absorption), not short-term-reversal. I flag the overlap honestly: both
  this card and H-0035 end up trading against the aggressive side, and if the Chair judges that the same mechanism
  the family should be merged into short-term-reversal (stricter penalty, which I accept). The mirror control in
  the falsification criteria is meant to settle exactly that question. Not tested in study 16 (ORB, funding extreme,
  BTC lead-lag, CME gap, squeeze, pullback, shock, range) or study 15 (price-structure triggers).

  Related literature (not cited in references because it is not the source of this claim and does not test it):
  Kitron and Wengrowicz (2026, arXiv 2608.21888) report that 15-minute crypto reversal concentrates after moves
  driven by aggressive taker flow, i.e. the flow-driven set; this card trades the complementary flow-opposed set
  at a much longer horizon. Kim and Hansen (2026, arXiv 2607.09426) show taker imbalance at quarter-hour boundaries
  forecasts 4-12 hour returns in Binance perps, but with a gross far below cost when traded every quarter hour,
  which is why this card trades only rare, extreme, high-volume hours.

  Costs and expected gross (K-0077 asks for the gross after a one-candle delay). Top-20 perps in 2020-2022 sit mostly
  in the 1.5-6 bps slippage tiers, so a round trip costs about 13-22 bps and 26-44 bps at doubled costs. The card
  needs a mean gross of roughly 45 bps or more per trade over 6 hours to survive doubled costs, about 0.2 standard
  deviations of a 6-hour alt return; I expect the delayed fill to lose little because the price has not moved at
  the signal. Honest prior: the gross may well be 20-30 bps, in which case it dies on doubled costs like H-0035.

  Choices fixed in advance, not tuned: one-hour window (the lab''s hourly feature scale), 30-day baseline, volume
  at least 2x its 30-day mean, return condition at exactly zero (no tolerance band), five equal slots. Only the
  imbalance threshold and the hold are on the grid (9 configurations). Trade count is the main design risk: conditions
  (a)-(c) are jointly rare; my rough estimate is several hundred to about 1500 trades in dev at the primary, and
  the 3.0 neighbour will have fewer. Events cluster in market-wide flush hours; the slot ranking and the no-pyramiding
  rule limit that clustering. A sustained crash (2022) is where absorbers can be overrun; the latest-third criterion
  will show it.

  Why most likely to die: doubled costs (thin per-trade gross on alts), or the latest third of dev (K-0060). An
  informative death: if the one-candle delay kills it, absorption is just another front-loaded taker effect; if
  the mirror control earns as much, it is generic reversal.'
