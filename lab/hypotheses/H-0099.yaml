id: H-0099
version: 1
title: State-dependent liquidity provision, learned - LIQ-200 long-only, weekly top fifth of a LightGBM 5-day score
  on residual reversal, idiosyncratic vol and beta, switched by VIX and market-drawdown state
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 200
mechanism:
  counterparty: 'Liquidity demanders who sell into idiosyncratic drops when the market is stressed: de-risking funds
    facing redemptions or margin and risk-limit cuts, and investors who sell the most volatile names first. They
    pay the concession to the provider, and they keep doing it because their trades are forced by flows and risk
    limits, not by a view on the stock.'
  why: 'Short-term reversal is the price of liquidity: investors who must sell (or buy) quickly push prices away
    from value and pay a concession to whoever takes the other side. Nagel (2012) shows that the expected return
    of reversal strategies is not constant but rises with market-wide uncertainty (VIX), because liquidity providers''
    capital and risk budgets shrink exactly when demand for immediacy is high; Hameed, Kang and Viswanathan (2010)
    show the same after market declines. The claim of this card is about the cross-sectional RANKING, not the market:
    in calm states the next-week ranking of liquid stocks is dominated by slow characteristics (low idiosyncratic
    volatility does well, last week''s idiosyncratic move carries little), while in stressed states (VIX high against
    its own year, market down over the past month) the stocks with large idiosyncratic losses and high idiosyncratic
    volatility carry the largest concession and outperform over the following week. Which stocks belong in the top
    fifth therefore switches with a date-level state, an interaction a linear score cannot express.'
  why_not_arbitraged: The concession is largest exactly when intermediaries' capital is scarce and the positions
    look like falling knives (high-volatility losers in a falling market); providers who could take it face the
    same funding and risk-limit constraints. In calm states the effect is too small to pay taker costs, so only
    a state-dependent book can harvest it, and the state switches rarely enough that a fixed rule-of-thumb book
    (always reversal or never) dominates practice.
signal:
  description: 'Universe: point-in-time LIQ-200 (the 200 most liquid stocks of sharadar_sep on each date; all are
    in the lowest cost tier, 3 bps per side after decimalization). Decisions once a week, after the close of the
    FIRST trading session of each calendar week (normally Monday; chosen so that the hold does not start with the
    weekend gap and the Monday weekday effect of H-0036); trades at the next open; positions are held until the
    next weekly decision''s open (about 5 sessions). Daily total return of each stock = (1 + ret_co) * (1 + ret_oc)
    - 1. Market return m_t = equal-weight mean of the daily total returns of the universe members on day t. Features
    at decision date t, all from data up to the close of t: (1) res5: residual return over the 5 sessions t-4..t
    = compounded stock return minus beta126 times the compounded market return over the same 5 sessions; (2) res21x:
    residual return over the 21 sessions ending at t-5 (t-25..t-5), same construction; (3) ivol63: standard deviation
    of daily residuals (r_i - beta126 * m) over the 63 sessions to t; (4) beta126: OLS slope of the stock''s daily
    return on m over the 126 sessions to t (at least 100 valid days); features (1)-(4) are z-scored across the scored
    universe members of date t by the framework helper; (5) vix_state: log(VIX_last / median VIX over the trailing
    252 sessions), where VIX_last is the latest fred_macro VIXCLS value usable at the close of t under the dataset''s
    next_morning clock (the framework alignment, i.e. the value of the previous session); (6) mkt21: compounded
    market return over the 21 sessions to t divided by the standard deviation of 21-session market returns over
    the trailing 252 sessions. Features (5) and (6) are date-level states: the same value for every member on a
    date, NOT z-scored across the universe (that would make them constant); they enter the model as they are. A
    stock is scored only if all six features are finite and it is a universe member at t. Model: lab.framework.ml.walk_forward
    with model gbm (LightGBM), label = total return from the open of t+1 to the open of t+6 (horizon 5) ranked across
    the universe on each date (framework label, purge and seeds), expanding training window, refit every 126 rows;
    fixed hyperparameters num_leaves 15, learning_rate 0.05, min_child_samples 500, subsample 0.8, colsample 1.0;
    n_estimators from the grid. Book (long-only, fully invested): at each weekly decision let N = number of scored
    members and K = round(top * N). Rank members by score. Keep every currently held stock whose rank is within
    the top 2 * top * N (buffer, to cut turnover), at most K of them by score; fill the remaining slots with the
    highest- ranked stocks not held. Equal weight 1/K, rebalanced to equal weight at each weekly decision. Fewer
    than 50 scored members, or no fitted model yet (before the framework''s minimum training sample), means flat.
    A stock that leaves the universe between decisions is closed at the first row where the engine requires it and
    its weight stays in cash until the next weekly decision. No shorts, no leverage, gross 1.0.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At a weekly decision date t (after the close of the first session of the week), a universe member''s walk-forward
    GBM score enters the top fifth of the scored members, having not been in the top fifth at the previous weekly
    decision (or not scored then): side +1. A member''s score enters the bottom fifth under the same rule: side
    -1. Entries only, not continuing holdings; no buffer rule in the event definition.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'res5: 5-session market-residual return to t (size and sign of last week''s idiosyncratic liquidity shock),
    z-scored across members'
  - 'res21x: 21-session residual return ending at t-5 (separates a one-week shock from a month-long drift that may
    be news), z-scored'
  - 'ivol63: 63-session idiosyncratic volatility (how large a concession a shock of a given size carries; the calm-state
    low-volatility effect), z-scored'
  - 'beta126: 126-session beta to the equal-weight universe return (keeps market-driven moves apart from idiosyncratic
    ones, K-0074), z-scored'
  - 'vix_state: log of the latest usable VIX over its trailing 252-session median (liquidity providers'' risk budget,
    Nagel 2012), date-level, not z-scored'
  - 'mkt21: 21-session equal-weight universe return over its own trailing 252-session volatility (market decline
    state, Hameed-Kang-Viswanathan 2010), date-level, not z-scored'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The two state variables are the same for every stock on a date, so in a ridge regression they
    add a constant to every score and cannot change which stocks are in the top fifth: a ridge on these six features
    is by construction a fixed, state-independent mix of reversal, volatility and beta tilts. The mechanism says
    the mix must switch with the state: in calm weeks low idiosyncratic volatility ranks high and last week''s residual
    move matters little; in stressed weeks (VIX above its own year, market down) high-volatility idiosyncratic losers
    carry the concession, so both the slope on res5 and the sign of the ivol63 effect flip. A tree can split on
    vix_state or mkt21 and use different stock-level rules on each side; ridge cannot. The payer is the forced seller
    of volatile names in stressed weeks. If ridge on the same features (same schedule, same book) does as well,
    the state dependence is not what pays and the card reduces to the plain reversal already counted in this family.'
