falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of top-fifth (+1) and bottom-fifth (-1) score entries
  is not above the 95th percentile of the time-shifted placebos, or the gross per event is below the round-trip
  cost (about 6 bps for LIQ-200 after decimalization).'
- 'Mechanism: the latest third of dev (roughly 2014-2020) has the wrong sign; then the effect is an early-era artefact
  (K-0060) and the card is wrong even if the pooled test passes.'
- 'Mechanism (descriptive, if the gate can split it): entries on weeks with vix_state <= 0 earn as much as entries
  on weeks with vix_state > 0; then the state channel of Nagel (2012) is absent.'
- 'Nonlinearity: a ridge regression on the same six features (framework ridge, same label, schedule and book) gives
  the same or a better entry abnormal return or book Sharpe; then the interaction is not what pays.'
- 'Strategy: net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat SPY_TR, or the book does not
  beat SPY_TR at doubled costs.'
- More than 60 % of the dev log return in one of the three sub-periods (e.g. only the 2008-2009 block pays).
notes: 'Why this is not a refile of earlier reversal cards. Studies 6 and 7 tested reversal when VIX > 25 as a long-only
  market position and found the market bounce, not stock selection; here the label is ranked across stocks on each
  date, so the market bounce cannot be learned, only the cross-sectional ranking. H-0081 was a VIX gate on crypto
  perps. H-0094 combined own-move, earnings-release, volume and volatility features over LIQ-500 with daily cohorts;
  this card has no earnings or volume features, adds the two date-level states that are the whole claim, uses weekly
  decisions with a turnover buffer, and trades only the LIQ-200 cost tier. H-0030 (S&P 500 daily no-news reversal)
  and K-0133 say return-sort effects in liquid stocks sit below cost; the answer here is (a) half the round-trip
  cost of LIQ-500 (6 bps instead of about 12 after decimalization), and (b) concentrating the reversal bet in the
  weeks where cross-sectional dispersion is two to three times its calm level, so the same rank skill earns two
  to three times the bps. Honest forecast: rank IC of the score about 0.01-0.02 pooled, cross-sectional 5-session
  dispersion about 4 % (much higher in stressed weeks), so a side-adjusted gross of about 5-12 bps per entry against
  a cost of about 6-7 bps (15 bps before 2001-04): near cost. If it dies on the cost check, the lab learns that
  even the cheapest tier and the state-dependent form cannot carry liquidity provision as a taker, which closes
  this family for US stocks. Events: about 1,000 weekly decision dates once the model is fitted (around 2000-2020),
  about 20-25 top-fifth and 20-25 bottom-fifth entries per date, so roughly 30,000-50,000 events; the placebo cloud
  should be narrow and its bar below cost, so a failure will be a real negative, not a power problem (K-0034). Book
  arithmetic: always invested (exposure about 0.9 including the flat warm-up), 40 names at top 0.2; one-way turnover
  about 40-50 % per week with the buffer, so cost drag about 1.2-1.6 % a year after decimalization and twice that
  at doubled costs. To beat SPY_TR by 0.10 Sharpe the top fifth must earn about 3-4 % a year gross over the universe,
  i.e. about 7 bps per week, consistent with the upper half of the mechanism forecast; the doubled- cost check of
  G2 is the most likely strategy death. Beta confound (K-0074): in stressed weeks the top fifth leans to high-beta
  losers, and the G1 abnormal return is raw, so part of a pass could be the market rebound through beta. The bottom
  fifth in those weeks should also be high-volatility (recent winners), which offsets some of it; a by-side and
  by-state report would separate them. Expected beta gap of the long leg over the universe: about +0.1 to +0.3 in
  stressed weeks, about -0.1 in calm weeks (low-volatility tilt). Ridge control: K-0135 says the named ridge baseline
  has never run. Please run the same pipeline with model ridge as a descriptive control at G1 if the framework allows;
  a pass without it should be read as reversal skill, not as evidence of nonlinearity. Cost regime: dev starts 1998
  with fractional quotes (cost x2.5 until 2001-04); the card keeps the full dev period rather than choosing a start,
  and the first refit needs a year of labels anyway, so only about a year of trading falls in the x2.5 era.'
