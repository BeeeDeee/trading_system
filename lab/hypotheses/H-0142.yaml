id: H-0142
version: 1
title: Altcoins in play at the US open - 15m perps, top-20 PIT universe ex BTC/ETH, US-open 30-minute range breakout
  only on the top-k alts by coin-specific opening relative volume, exit 16:00 ET, both sides
author_agent: scout
family: us-open-range-breakout-crypto
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Traders who fade the opening move in a coin with fresh news (mean-reversion scalpers and market
    makers quoting around a stale reference price, range traders) and late attention-driven buyers or sellers who
    enter after the move is already under way and pay the continuation; on the short side, holders who sell into
    a breakdown after bad coin-specific news reaches the US session.
  why: 'Crypto analogue of "stocks in play" (Zarattini, Barbon and Aziz 2024): an opening-range breakout carries
    information only when the instrument has its own news that day. When the US cash session opens, US desks, funds
    and retail start trading; a coin whose volume in the first 30 minutes of that session is far above its own normal
    level for the same window, and far above what the rest of the market shows that day, is being repriced on coin-specific
    information (listing, unlock, protocol or exchange news, a large holder moving). The information is absorbed
    over hours, not minutes: late participants (US retail, slower funds, momentum and attention traders who find
    the coin on top-gainer and most-active screens) keep trading in the direction the first informed flow set, so
    a break of the opening range in an in-play coin tends to continue to the end of the US session. The earlier
    cards of this family (H-0137 to H-0140) traded the same breakout on BTC and ETH, where the US open carries market-wide
    flow only, and gross per trade stayed at or under the taker round trip. The claim here is that the coin-specific
    volume selection, not the clock, is what carries the move, so the selected alts should show a gross move per
    trade well above that of the unselected breakout.'
  why_not_arbitraged: The effect is small in capacity (a few alts per day, a few hours, top-20 perps), lives at
    a horizon where taker costs take most of the edge, and needs intraday monitoring of a changing cross-section;
    high-frequency firms trade much shorter horizons and funds with daily processes do not hold intraday positions.
    The equity version itself is a recent result whose pre-registered out-of-sample test after 2023 was negative,
    so the edge, if any, may be small and crowded; this card measures whether anything of it exists in crypto 2020-2022.
signal:
  description: 'Data: binance_perp_15m candles (o, h, l, c, qv, real, listed, universe); a row is a closed 15-minute
    candle, the decision of row t is filled at the open of candle t+1. Clock: US Eastern time with the US daylight-saving
    rule (EDT from the second Sunday of March 02:00 local to the first Sunday of November 02:00 local, UTC-4; otherwise
    EST, UTC-5). 09:30 ET is 13:30 UTC in EDT and 14:30 UTC in EST. Sessions: Monday to Friday only (by the ET date);
    NYSE holidays are not removed (no exchange calendar in the intraday view; about 4 % of weekdays, dilution only).
    Eligible coins on session d: members of the point-in-time top-20 by 30-day quote volume (the framework''s universe
    mask) at the decision row at 10:00 ET, excluding BTCUSDT and ETHUSDT (the instruments of H-0137 to H-0140; they
    are not tradable in this card but stay in the median below), with both opening-range candles (09:30-09:45 and
    09:45-10:00 ET) real (not gap rows). Opening-range volume OV(j, d) = sum of qv of coin j over the two opening-range
    candles of session d. Baseline B(j, d) = mean of OV(j, d'') over the previous 20 weekday sessions d'' before
    d on which both candles of j were real; at least 15 such sessions are required, else j is not eligible on d.
    Relative volume RVOL(j, d) = OV(j, d) / B(j, d). Market level M(d) = median of RVOL over all universe members
    with a valid RVOL on d (BTCUSDT and ETHUSDT included). Uses only candles closed at or before 10:00 ET of d.
    In-play selection (decision after the close of the 09:45-10:00 ET candle): eligible alts with RVOL(j, d) >=
    rvol_mult * max(1, M(d)) are candidates (coin-specific: at least rvol_mult times its own normal opening volume
    and at least rvol_mult times the median coin''s relative volume that day); rank candidates by RVOL descending
    and keep the top top_k (fewer or none if fewer qualify; ties by higher OV). Range: H(j, d) = max high, L(j,
    d) = min low of the two opening-range candles. Entry: for each selected coin, on the candles closing from 10:15
    ET through 15:00 ET, the first candle whose close is above H opens a long, the first whose close is below L
    opens a short, filled at the next candle''s open; only the first breakout of the day is taken, no re-entry and
    no reversal on the same coin and day. Breakouts after the 15:00 ET close are ignored. Exit: (a) stop: a candle
    close beyond the opposite range boundary (close < L for a long, close > H for a short) closes the position at
    the next open; (b) time: at the close of the 15:45-16:00 ET candle every open position is closed (filled at
    the 16:00 ET open); (c) if the coin leaves the point-in-time universe while a position is open, it is closed
    at the first decision row outside the universe (K-0051); (d) a gap row in an open position is held through and
    the position is closed at the next real candle if an exit was due. Weights: each position is 1 / top_k of equity,
    long +1/top_k, short -1/top_k, constant inside the trade; gross <= 1 always; no position is opened on a coin
    whose selection or range uses a gap row. Funding is charged by the engine (the 16:00 UTC settlement falls inside
    the holding window). Nothing is fitted: rvol_mult, top_k and the 20-session baseline are the only choices.'
  params:
