falsification_criteria:
- 'Fewer than 300 trades in dev 2020-2022 at the primary configuration (forecast 450-1000): the in-play event is
  too rare to judge and the card dies on count, not on merit.'
- Net Sharpe on dev below 0.5, or the one-sided 75 % bootstrap bound of the mean net trade at or below zero (G1).
- 'Gross mean per trade (derived from mean net trade and cost share) below the modeled round trip (about 16-22 bps
  for top-20 alts): the coin-specific volume selection does not lift the breakout above cost, which is the core
  claim of the card.'
- Fewer than 75 % of the parameter neighbors (rvol_mult 1.5 / 2.5, top_k 2 / 4) with positive Sharpe, or median
  neighbor Sharpe below 0.70 of the primary (G2).
- Sharpe with a one-candle later fill below 0.50 of the primary, or Sharpe at doubled costs not positive (G2).
- 'Fewer than 2 of 3 dev blocks positive, or one block carrying more than 60 % of the return (G2): a single regime
  (2021 alt season or the 2022 bear) would explain the result.'
- 'The rule does not beat the same trades placed at random times (random-entry percentile below 95, G2): the in-play
  selection and breakout timing carry no information beyond exposure to volatile alts.'
- 'Mechanism (owner check, not judge-run): if the same rule on all eligible alts without the relative-volume filter,
  or on the top_k alts with the lowest RVOL, has a gross per trade as high as the in-play selection, the volume
  selection adds nothing and the ''in play'' claim is refuted even if the card passes.'
notes: 'owner_seed: ORB-C6

  Provenance and trial count. Owner queue item ORB-C6: the crypto analogue of the equity "stocks in play" ORB (Zarattini,
  Barbon and Aziz 2024; in-sample 2016-2023 Sharpe 2.81 with no slippage; the owner reports a pre-registered out-of-sample
  test negative after 2023 even before costs). Family us-open-range-breakout-crypto, reused on purpose: this is
  the same clock-anchored breakout (H-0137 rule: 09:30-10:00 ET range, first 15m close beyond it, exit at the 16:00
  ET close) and every variant counts with H-0137 to H-0141 and study 16. The literature prior adds 20 trials; the
  bar is correspondingly high, and the 2024 publication date is after the whole dev window, so the publication-decay
  check sees only pre-publication data.

  Why this is not a fifth conditioner of the BTC/ETH breakout (K-0192, lessons of H-0137 to H-0140). Those cards
  conditioned one market-wide instrument pair on a market state (volatility, narrow range, pre-session move); none
  changed which information the breakout trades. This card changes the cross-section: it trades only alts (BTC and
  ETH excluded) and only on days when the coin has its own volume shock at the US open. The study-16 "bull-market
  artefact" verdict was about a BTC/ETH long bias; here the selection is coin-specific, both sides are traded, and
  the threshold is relative to the market''s own relative volume that day, so a market-wide day (a BTC crash, a
  macro release, the H-0141 events) does not select coins unless one stands out against the rest. H-0141 (top-10
  perps on macro release days) selects by a market-wide calendar event; this card selects by a coin-specific volume
  event, the opposite end. Not a duplicate.

  Deviation from the owner text, and why. The owner proposed RVOL >= threshold (absolute). Crypto alts carry a large
  common factor: on market-wide days nearly every coin has RVOL above 2, and the top 3 by RVOL are then just the
  highest-beta coins doing the BTC breakout that already failed at cost. The bar rvol_mult * max(1, median RVOL)
  equals the owner''s absolute rule on ordinary days (median <= 1) and rises with the market on market-wide days,
  which is the closest honest form of "in play" in a factor-driven market. One parameter, no extra trial. The 20-session
  baseline is the upper end of the owner''s 10-20 range (one month of US sessions, stabler denominator) and is fixed,
  not gridded, to keep the neighbor set small (H-0139 died on one neighbor). top_k grid 2-4 instead of 3-5: 5 positions
  of 1/5 equity in alts with 15m candles would dilute per-trade conviction and add lower-RVOL coins, against the
  mechanism. n = 20, not 30: ranks 21-30 fall more often into the 6 bps and 15 bps slippage tiers, which would kill
  a taker rule on its own; the cost tiers of the engine apply to each coin by its own 30-day median volume.

  Forecasts (lead with the pessimistic case, K-0181). Trades: about 450-1000 at the primary (roughly one in-play
  alt per weekday after warm-up, about 85 % of selected coins break their range before 15:00 ET); at rvol_mult 2.5
  possibly 300-500, so the high neighbor may be thin. Round trip: about 16 bps (5 bps fee + 3 bps slippage per side
  for most top-20 alts in 2021-2022), up to 22 bps for coins in the 6 bps tier, about double at stress. Gross per
  trade: pessimistic 10 bps (no better than the BTC/ETH breakout: dies at G1 on Sharpe and the bootstrap bound,
  the likeliest outcome given H-0137 and the equity out-of-sample result); central 30 bps (net about +10 bps, net
  Sharpe about 0.5-0.7, fragile at doubled costs); optimistic 60 bps. Exposure is low (a few hours on part of the
  weekdays), which dilutes Sharpe; the intraday judge has no exposure floor.

  Known risks. (1) Costs: alts pay more slippage than BTC; at doubled costs the round trip is 32-44 bps. (2) Gap
  rows and thin early-2020 history: the baseline needs 15 valid sessions, so the first weeks of 2020 and newly listed
  coins are skipped. (3) The basket is the 107 symbols ever in the monthly top 10 (survivorship toward coins that
  became liquid); an in-play coin that later became a top coin is over-represented, which biases toward long-side
  continuation in 2021. (4) No NYSE holiday calendar: holiday weekdays are traded as sessions without a US open
  (dilution). (5) The US daylight-saving switch has to be coded by hand (K-0193). (6) Single venue volumes (Binance
  perps) proxy attention imperfectly; wash volume is less of an issue in the top-20 perps than in small spot pairs.

  Controls the owner may want (K-0193: the judge will not run them, so the verdict rests on the judge''s gates):
  the same rule on all eligible alts without the RVOL filter (does selection add gross?), on the top_k alts with
  the lowest RVOL (dose response), and the long/short split with gross per trade by side. If the owner can run them
  on dev, the mechanism criterion in falsification_criteria is decided by them.

  No mechanism_test: the intraday judge has none (instructions for 15m cards). No new data needed: everything is
  in binance_perp_15m.'
