title: '52-week-high anchoring net of momentum and volatility - LIQ-500 long-only, monthly: hold the stocks nearest
  their 52-week high within matched 12-month-return x volatility cells'
author_agent: scout
family: 52-week-high-anchoring
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Anchoring traders: investors who sell (or hold back buying) because the price is ''at resistance''
    near the 52-week high, and who hold or buy falling stocks because they are ''cheap versus the high''. Retail
    investors, whose trading spikes around price extremes (Huddart, Lang and Yetman 2009), and rule-of-thumb technical
    sellers at the high are the natural losers; the strategy buys what they sell near the high.'
  why: 'Anchoring on a salient reference price (George and Hwang 2004). The 52-week high is printed in every quote
    screen and newspaper table, and traders use it as a reference point: when good news pushes a stock close to
    its 52-week high they are reluctant to bid it through that level (it looks ''expensive'' relative to the anchor),
    and when bad news pushes a stock far below its high they are reluctant to sell further (it looks ''cheap'' relative
    to the anchor). Both reactions are incomplete, so the information is impounded slowly: stocks near their high
    drift up over the following months and stocks far below it drift down. The distinctive claim, and what this
    card tests, is that nearness to the high predicts returns AMONG STOCKS WITH THE SAME PAST 12-MONTH RETURN AND
    THE SAME VOLATILITY, i.e. it is not ordinary momentum, not the low-volatility premium (low-vol stocks sit closer
    to their highs mechanically) and not a stock-identity drift.'
  why_not_arbitraged: The drift is slow (months), small per month relative to single-stock idiosyncratic risk, and
    it is a second-order sort inside momentum buckets, so it shares momentum's crash risk in sharp rebounds; capital
    that would arbitrage it faces long horizons, tracking error and career risk. It also requires holding stocks
    that look 'expensive' versus their recent range, which value-oriented mandates avoid.
signal:
  description: 'Data: daily close-to-close total return r_t = (1+ret_co_t)(1+ret_oc_t) - 1 of each sharadar_sep
    stock; a total-return price index P_t = cumulative product of (1+r_t). Formation date f = the last XNYS session
    of each calendar month; decisions use data up to the close of f, trades at the open of the next session. Eligible
    stocks on f: LIQ-500 members on f (point-in-time liq_rank) with tradable == 1 on f and a valid return on at
    least 240 of the last 252 sessions (missing days are skipped, never filled with later data). For each eligible
    stock on f compute: (1) PTH = P_f / max(P_s for s in the last H sessions including f), with H = high_window_days;
    (2) MOM = P_f / P_(f-252) - 1, the 12-month total return (fixed window, not a parameter); (3) VOL = standard
    deviation of daily r over the last 252 sessions (fixed window). Matching cells: split the eligible stocks into
    terciles of MOM and, independently, terciles of VOL (cross-sectional cut points on f), giving 9 cells. Inside
    each cell rank stocks by PTH; the top leg_fraction of the cell (rounded down, at least 1 stock, cell skipped
    if it has fewer than 5 stocks) forms the NEAR-HIGH leg and the bottom leg_fraction the FAR-FROM-HIGH leg (used
    only by the mechanism test). Ties in PTH (e.g. several stocks exactly at their high, PTH = 1) are broken by
    the smaller VOL first, then by the instrument id, deterministically. Strategy (long-only): from the open after
    f until the next formation, hold the union of NEAR-HIGH legs of all 9 cells with equal weights summing to 1.0
    (about 100 stocks at leg_fraction 0.2). No shorts. A stock that leaves the LIQ-500 universe or stops being tradable
    during the month is sold at the next open allowed by the engine and its weight stays in cash until the next
    formation; a delisting earns the dataset''s terminal return. No other intra-month trading (weights drift with
    prices between formations).'
  params:
    high_window_days:
      grid:
      - 189
      - 252
      - 315
      value: 252
    leg_fraction:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  selection_procedure: 'Pre-registered primary configuration (252, 0.2): 52 weeks is the anchor named by the mechanism
    and 0.2 is the standard quintile cut. The grid exists only for G2 neighbours; no value was chosen on data.'
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'At each monthly formation date f (last XNYS session of the month), every eligible LIQ-500 stock assigned
    to a leg inside its 12-month-return tercile x volatility tercile cell: the NEAR-HIGH leg (top leg_fraction of
    PTH in the cell) is an event with side +1, the FAR-FROM-HIGH leg (bottom leg_fraction of PTH in the cell) is
    an event with side -1. Portfolios are formed afresh each month, so a stock that stays in a leg is marked again
    at the next formation. Both sides are marked in every cell, so momentum, volatility (beta) and stock-identity
    drift are matched between the +1 and -1 sets; the middle of each cell (about 60 % of the universe) stays unmarked
    as peers.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
