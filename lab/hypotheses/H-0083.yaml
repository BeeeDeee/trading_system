falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the matched NEAR-HIGH (+1) / FAR-FROM-HIGH (-1) events
  does not exceed the 95th percentile of the 200 time-shifted placebos, or is not above round-trip cost.'
- 'Mechanism: the pooled abnormal return is negative in the latest third of dev (about 2014-2020) - read as decay
  or absence even if the pooled test passes (K-0060).'
- 'Mechanism shape: the 21-, 42- and 60-session abnormal returns do not increase with the horizon (a slow anchoring
  drift must build over months; a one-week bump that fades is not this mechanism).'
- 'Strategy G1: net Sharpe of the long-only book on dev below SPY total return Sharpe + 0.10, or the bootstrap bound
  of the Sharpe difference at or below zero.'
- 'Strategy G2: fewer than 6 of the 8 neighbours (high_window_days 189/315, leg_fraction 0.1/0.3) beat SPY, or the
  book does not beat 95 % of random books with the same turnover and exposure (then the edge is the equal-weight
  liquid core, not the anchor).'
- 'Publication: post-2004 excess Sharpe over SPY below half of the pre-2004 excess (G2 publication decay).'
notes: 'Brief: medium horizon (1-6 months), US single stocks, cross-sectional, with a mechanism test. This card
  answers the open question of H-0011 (lessons.md): ''a fair test of the anchoring story must net out stock-identity
  drift, for instance comparing breakout stocks with stocks matched on prior-year return ... and probably needs
  a monthly horizon where the literature places the effect''. Why this is not a refile of H-0011 or a near-high
  variant of momentum: H-0011 marked only breakouts through a STALE high (side +1) against all other stocks at a
  5-day hold, so its event set carried winner drift and lost to same-stock placebos (K-0025). Here (a) both sides
  are marked inside cells matched on 12-month return AND volatility, so momentum and the low-volatility premium
  (low-vol stocks sit mechanically closer to their highs) cancel between +1 and -1, and the beta gap of K-0074 is
  removed by construction; (b) the event is the level of nearness to the high, not the crossing day; (c) the horizon
  is the months-long drift the paper documents. The family is reused (52-week-high-anchoring) so the H-0011 trial
  counts, and the card is NOT filed as momentum: momentum is neutralized, not traded. If the Chair rules the family
  should carry momentum trials, so be it. Expected numbers (stated before any run, K-0069/K-0098): about 200 marked
  events per formation (2 legs x 0.2 x ~495 eligible stocks), about 262 formation dates in dev with the 252-session
  warm-up (1999-01 to 2020-10), so roughly 50 000 events on ~262 dates; unmarked peers per date about 300. Effect
  size: George and Hwang report a 52-week-high spread of roughly half a percent per month in all stocks 1963-2001;
  inside momentum x volatility cells and in large caps I expect perhaps a third to a half of that, i.e. a matched
  spread of about 0.5-1 % over 60 sessions and a side-adjusted per-event abnormal return of about 0.25-0.5 % (half
  the spread), against a LIQ-500 round trip of about 6-24 bps, so cost should not bind; the placebo bar is the binding
  test (K-0034, K-0076: H-0054''s monthly residual-momentum near miss had a bar far above cost). Strategy arithmetic:
  the book is fully invested (mean exposure about 0.95-1.0), about 100 equal-weighted names spread evenly over all
  momentum and volatility terciles, so it is close to an equal-weight LIQ-500 book plus the near-high tilt; if the
  long leg earns 0.1-0.25 % per month over the universe, that is +1-3 %/y at ~18 % volatility, i.e. +0.07 to +0.17
  Sharpe over the equal-weight core, about the size of the +0.10 G1 margin over SPY. So the strategy is a borderline
  G1 case even if the mechanism is real; monthly turnover of the near-high leg should be about 30-45 % one way (persistent
  ranking), costs about 0.3-0.6 %/y. Most likely deaths: (1) the mechanism test lands under the placebo bar (monthly
  dates, overlapping 60-session windows, wide cloud), which would say there is no anchoring drift beyond momentum
  and volatility in liquid US stocks; (2) the sign holds early but fades or flips in the latest third (K-0060);
  (3) sharp junk rallies (losers far from their highs rebounding) make one third negative. The equal-weight core
  vs cap-weighted SPY confound (K-0064, H-0025) is real for the strategy gate; the random-entry check in G2 is the
  control for it. No new data needed; four sharadar_sep fields only. ETF-free, no named instruments, no dates in
  the rule.'
