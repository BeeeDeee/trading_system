  - '2020-12-31'
holding_period:
  rebalance: weekly
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Chan, L. K. C. and Lakonishok, J. (1995) The Behavior of Stock Prices around Institutional Trades, Journal
    of Finance
  year: 1995
- cite: Jiang, J., Kelly, B. and Xiu, D. (2023) (Re-)Imag(in)ing Price Trends, Journal of Finance
