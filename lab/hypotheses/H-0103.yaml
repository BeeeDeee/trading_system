falsification_criteria:
- 'Mechanism (G1): the TCN-only picks do not beat the 95th percentile of the time-shifted placebos at 5 sessions,
  or their gross abnormal return per event is below the round-trip cost: path shape adds nothing tradable beyond
  the linear features, so the claim is false in this form.'
- 'Mechanism shape: the 1-session abnormal return is zero or wrong-signed while the 10-session one exceeds twice
  the 5-session one. That is slow drift, not decay of temporary impact.'
- Latest third of the dev event sample has the wrong sign (K-0060), even if the pooled result passes.
- 'Linear baseline: ridge on the same five features is as good. This is tested directly by the mechanism event (picks
  the ridge does not make) and fails with it.'
- 'Strategy (G1): net Sharpe on dev below 0.5, or below T-bill Sharpe + 0.10, or bootstrap bound of the Sharpe difference
  against T-bills not above zero.'
- 'G2: fewer than 75 % of the neighbours of seq_len 10 and top 0.2 beat the benchmark, or the book is not above
  T-bills at doubled costs.'
notes: 'Expected numbers, written before any run. Weekly decision dates 2002-2020: about 990, of which roughly 850
  are scored after the first training window. Eligible stocks per date: about 150. With top 0.2 that is 30 per side,
  and if TCN and ridge disagree on 30-50 % of picks, about 10-15 TCN-only stocks per side per date, so 15,000-25,000
  events on about 850 dates (well above 200 events on 30 dates). Round trip: LIQ ranks 1-200 pay 5 bps per side
  (floor) and 201-300 pay 6 bps, so about 10-12 bps. My central forecast of gross per TCN-only event is 3-8 bps,
  below cost (K-0140: forecasts in the lab have run high). So the likeliest verdict is a G1 death on cost or placebo.
  If the effect comes in at a quarter of that, the conclusion is that daily price/volume path shape carries no tradable
  information beyond linear features in large caps, and the learned price/volume line for LIQ stocks can be closed.
  For the book to clear the 0.5 Sharpe floor: weekly turnover about 70 % per leg costs about 0.7 x 2 x 5.5 bps,
  roughly 8 bps a week or 4 %/yr on gross 1. With book volatility of about 6-8 %/yr it needs about 7-8 %/yr gross,
  i.e. each leg about 15 bps a week above the universe mean. That is above the event cost bar, so a narrow mechanism
  pass would probably still die at the strategy gate (K-0064). How this differs from dead cards. H-0007: a static
  weekly sort on intraday reversal and 12-month intraday momentum, no volume path. H-0094: gbm on own move, earnings
  flag, volume and volatility at session t, daily cohorts, ridge never run. H-0099: date-level VIX/drawdown state.
  H-0069: one-session extreme movers. New here: (a) the first sequence model in the lab, with the claim placed in
  the order of events, not in a new state variable; (b) the mechanism event is the TCN-minus-ridge disagreement
  on both sides, the design K-0138 asks for, so the linear control actually runs and the death says whether the
  learner or the features failed; (c) entries only in the high-volatility half, because cost is fixed per trade
  and gross is not; (d) the dev sample starts in 2002, after decimalization: pre-2001 quotes carry 2.5x costs that
  no weekly taker book can carry, and the lab''s reversal profits sat in 1998-2002 (study 5, K-0012), so dropping
  those years makes the test harder, not easier. The family is short-term-reversal because the economics is liquidity
  provision against temporary impact; its large trial count is accepted. Rival explanations: the intraday inventory
  pressure of Hendershott and Menkveld (Price Pressures, JFE) decays within about a day, so by the next open little
  may be left; and the network may learn volatility-scaled reversal only. Both make the event fail. If lab check
  says the sandbox has no torch, the card should not be silently moved to gbm: a gbm on session-t features is the
  H-0094 design.'
