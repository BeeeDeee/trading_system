title: Metaorder footprint, learned path shape - LIQ-300 dollar-neutral weekly, TCN on 10-day intraday/overnight/volume
  paths; mechanism = TCN-only vs ridge picks
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 300
mechanism:
  counterparty: 'The institution executing a multi-day order (fund flows, rebalancing, index and benchmark trades).
    It pays a temporary impact concession: to the liquidity provider who takes the other side after the package
    ends, and to traders who trade alongside it while it is still running. Its mandate makes it trade whatever the
    price impact.'
  why: 'Institutions split large orders over several sessions (Chan and Lakonishok 1995): while the package is being
    worked, its temporary price impact builds up in the same direction, and once it is complete part of that impact
    reverses. In daily bars the package shows up as a path: several sessions with intraday moves of the same sign
    (execution algorithms trade during continuous trading, not overnight) on dollar volume above the stock''s normal
    level. Whether the stock should then continue or reverse depends on the *shape* of that path. Volume still high
    on the last day means the order is probably still running, so the price keeps going. Volume back to normal after
    a run of same-sign intraday moves means it is probably done, so the price reverses. A gap move overnight with
    no intraday follow-through is news, not execution, and shows neither pattern. The claim is that a small temporal
    convolutional network on the last sessions of five price/volume features can tell these states apart, and a
    linear model on the same features cannot, because the sign of the response to the accumulated move flips with
    how volume developed over the path.'
  why_not_arbitraged: Daily data cannot show metaorders, and the same daily path is consistent with news, so detecting
    them is noisy. Intraday detectors (high-frequency traders anticipating order flow) take part of the continuation
    within the day. The leftover is small per stock and needs weekly turnover in many names, which costs a taker
    about a round trip per name per week. Capital for this sits with market makers and stat-arb desks that hold
    it for hours, not days. The likeliest outcome is that little is left at a five-session horizon in large caps.
    The card is built so that this outcome comes out as a clear negative.
signal:
  description: 'Data: sharadar_sep daily ret_co (previous close to open), ret_oc (open to close) and dollar_volume,
    LIQ-300 point-in-time members, period 2002-01-02 to the end of dev (after decimalization, see notes). Daily
    total return r_t = (1+ret_co_t)(1+ret_oc_t) - 1. Features per stock and session t, each using data up to the
    close of t only and each z-scored across that day''s universe members by the framework helper: (1) ret_oc_t;
    (2) ret_co_t; (3) abnormal dollar volume log(dollar_volume_t / median of dollar_volume over t-63..t-1); (4)
    5-session total return prod(1+r) over t-4..t minus 1; (5) 21-session realized volatility (standard deviation
    of r over t-20..t). A stock with any feature missing on a session of the sequence is not scored on that date.
    Label: the framework label, total return from the open of t+1 to the open of t+6 (horizon_days 5), ranked across
    the universe on each date. Model: lab.framework.ml.walk_forward with model tcn on the last seq_len sessions
    of the five-feature vectors, hidden 16 and the framework defaults for the other TCN hyperparameters (levels,
    epochs, lr, dropout, weight_decay), expanding training window, refit every 252 rows, purge and seeds owned by
    the framework. The model trains on all member rows; there is no subset chosen with end-of-view information (K-0134):
    use all columns and mask non-members per row. Linear control: the same walk_forward call with model ridge (framework
    default alpha) on the same five features at session t only, same rows, same label, same refit schedule. It is
    used only by the mechanism test and is never traded. Eligibility on a decision date: members with a TCN score
    whose 21-session realized volatility (feature 5 before z-scoring) is at or above the median of scored members
    that day (the high-volatility half). This fixed rule is there because gross moves scale with volatility while
    the per-trade cost does not. Book: decisions after the close of the first trading session of each week, trades
    at the next open. Among eligible stocks, long the top `top` fraction of the TCN score at equal weights summing
    to +0.5, short the bottom `top` fraction at equal weights summing to -0.5 (gross 1.0, dollar-neutral). Positions
    are held to the next weekly decision. A stock that leaves the universe or stops trading is closed at the first
    decision row where the engine requires it (K-0051). Fewer than 20 eligible scored stocks, or no fitted model
    yet: flat.'
  params:
    seq_len:
      grid:
      - 5
      - 10
      - 20
      value: 10
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At a weekly decision date, an eligible stock (high-volatility half of scored LIQ-300 members) is in the
    top `top` fraction of the TCN score but not in the top `top` fraction of the ridge score computed on the same
    eligible set: side +1. It is in the bottom `top` fraction of the TCN score but not in the bottom `top` fraction
    of the ridge score: side -1. Both models come from walk_forward on the same rows and schedule. The event isolates
    the picks that only the temporal nonlinearity makes, marked on both sides so that the beta of the high-volatility
    half cancels against unmarked peers.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'ret_oc_t, open-to-close return of session t: the leg traded in continuous trading, where execution algorithms
    work multi-day orders (sharadar_sep ret_oc)'
  - 'ret_co_t, previous-close-to-open return of session t: overnight news and opening-auction orders; separates
    information moves from execution pressure (sharadar_sep ret_co)'
  - 'abnormal dollar volume, log(dollar_volume_t / median dollar_volume over t-63..t-1): participation footprint
    of a metaorder; whether it is still elevated or has normalized marks an ongoing or a finished order'
  - '5-session total return over t-4..t: accumulated pressure, the state a linear reversal rule reads'
  - '21-session realized volatility of daily total returns: scale of temporary impact and of the concession a liquidity
    provider demands'
  horizon_days: 5
  model: tcn
  retrain_every_days: 252
  why_not_linear: The predicted response to the accumulated move (feature 4) changes sign with the volume trajectory
    over the preceding sessions. Same-sign intraday moves on volume that is still elevated on the last day mean
    the order is running and the price continues. The same moves with volume back to normal mean the order is finished
    and the price reverses. An overnight gap with flat intraday trading is news and shows neither. A ridge on the
    five features at session t can only add a reversal slope to a volume slope. It cannot flip the slope with the
    order of events in the path, so it averages continuation and reversal into a diluted reversal. A TCN on the
    last seq_len sessions can learn this conjunction of order and level. The executing institution pays in both
    states. If the network finds only plain reversal, its picks will match the ridge's picks, and the mechanism
    test below (picks only the TCN makes) will show nothing.
