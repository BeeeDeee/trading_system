id: H-0126
version: 1
title: Credit-market news into levered equities, learned - LIQ-500 beta-neutral legs in weeks of a credit-specific
  Baa spread move, LightGBM on leverage x shock, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity investors in levered firms who trade on equity-market information only (equity mandates,
    analysts who follow earnings, not the bond market) and keep buying or holding levered stocks at prices that
    have not absorbed the credit market's repricing of default risk; after tightening, those who sell levered names
    too cheaply.
  why: 'The equity of a levered firm is a call on its assets (Merton 1974): its value depends on credit conditions,
    and the dependence is small for low-leverage firms and steep near default (high debt relative to equity value,
    high equity volatility, thin interest coverage). When the corporate bond market reprices default risk by more
    than the stock market and Treasuries explain (a credit-specific widening or tightening of the Moody''s Baa yield
    over the 10-year Treasury), that is news about the value of levered equity that equity-only investors do not
    watch. Equity and credit markets are often out of line because their investor bases are separate and arbitrage
    between them is limited (Kapadia and Pu 2012). The claim: in the week after a large credit-specific spread move,
    highly levered, low-coverage, volatile stocks move in the direction the credit news implies (down after widening,
    up after tightening) relative to stocks of the same market beta, and the response is concentrated in that corner
    of the balance-sheet space, which the model is asked to find.'
  why_not_arbitraged: Capital-structure arbitrage desks trade single-name CDS against single-name equity, not an
    aggregate credit index against a balance-sheet cross-section; the signal is a macro credit move that needs a
    cross-market mandate, it fires in a minority of weeks, and its legs carry idiosyncratic and crash risk (levered
    stocks), so it is capital-intensive and lumpy. Kapadia and Pu relate equity-credit dislocation to exactly these
    impediments (idiosyncratic risk, liquidity, investor heterogeneity).
signal:
  description: 'Data: LIQ-500 point-in-time members (sharadar_sep total returns from ret_co and ret_oc), quarterly
    and TTM fundamentals from sharadar_sf1 (usable from the day after the filing, as the loader delivers them),
    Moody''s Baa yield DBAA (fred_moody_yields_1d) and the 10-year Treasury yield DGS10 (fred_macro), both with
    clock next_morning, so at the close of day t the latest usable values are those of day t-1 or earlier. (1) Market
    return: the equal-weight mean daily total return of the LIQ-500 members of each day (no ETF needed). (2) Credit
    shock, date-level, computed at the close of each decision day t: spread S = DBAA - DGS10 (last value at or before
    t-1; if either series has no new value for more than 5 sessions, no shock that day). dS = change of S over the
    5 sessions ending t-1; dY = change of DGS10 over the same 5 sessions; M = compounded equal-weight market return
    over the same 5 sessions. Regress dS on M and dY over the trailing 252 sessions of such overlapping 5-session
    windows (ending at t-1, OLS with intercept); the credit shock is today''s residual divided by the standard deviation
    of the trailing 252 residuals (z). Needs 252 sessions of history, so the first shock is about a year after the
    data start. Positive z = credit-specific widening. (3) Decision dates: the first trading session of each week.
    A decision date is a credit-news date when |z| >= z_news. Only credit-news dates are used for training and trading.
    (4) Features per stock and decision date, each z-scored across that date''s members by the framework helper
    (stocks with any missing feature are not scored): (a) market leverage = sf1_arq_debt / (sf1_arq_debt + E), where
    E = sf1_arq_marketcap of the latest usable filing rolled forward with the stock''s compounded total return since
    the first session that filing was usable; missing debt counts as 0, missing marketcap means not scored; (b)
    interest coverage = sf1_art_ebit / sf1_art_intexp, winsorized to [-5, 30]; interest expense missing or <= 0
    gives 30; (c) equity volatility = standard deviation of the last 63 daily total returns; (d) signed leverage
    = market leverage x z (the helper''s cross-sectional z-scoring keeps its sign and ranking: levered names point
    in the direction of the credit news); (e) own response = the stock''s compounded total return over the same
    5 sessions as the shock window plus day t, minus its beta x the market return over those sessions; (f) beta
    = OLS slope of the stock''s daily total return on the market return over the last 252 sessions (at least 200
    valid days, else not scored). (5) Label (framework): total return from the next open to the open 5 sessions
    later, ranked across members. (6) Model: lab.framework.ml.walk_forward with model gbm (LightGBM), num_leaves
    15, learning_rate 0.05, min_child_samples 200, n_estimators as in params; trained only on rows of credit-news
    decision dates whose labels are fully realized by the decision date (framework purge), expanding window, refit
    every 252 rows, framework seeds. The first fit needs at least 40 credit-news dates of training rows; before
    that nothing is scored or traded. Run on all columns and mask non-members per row (no ever-member column list,
    K-0134). (7) Book (score_weights, only_on credit-news dates): split scored members into terciles of feature
    (f) beta; in each tercile take the top tenth of the score long and the bottom tenth short (rounded down, at
    least 3 names per side per tercile, else that tercile is skipped). Equal weight: the long names share +0.5,
    the short names -0.5 (gross 1.0, dollar-neutral, beta balanced by construction). Enter at the next open, hold
    to the next weekly decision (5 sessions), then close; on a decision date that is not a credit-news date the
    book is flat. A stock that leaves the universe during the hold is closed at the first decision row outside the
    universe (K-0051). Fewer than 60 scored members on a news date means flat.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    z_news:
      grid:
      - 0.75
      - 1.0
      - 1.5
      value: 1.0
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'On a credit-news decision date (first session of a week with |credit-shock z| >= z_news), a stock enters
    the long leg (side +1) or the short leg (side -1) of the book: the top or bottom tenth of the gbm score within
    its tercile of 252-session market beta.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
ml:
  features:
  - 'Market leverage: quarterly total debt (sf1_arq_debt) over debt plus equity value (sf1_arq_marketcap at the
    filing, rolled forward with the stock''s total return); the Merton exposure of equity to credit conditions'
  - 'Interest coverage: TTM EBIT over TTM interest expense (sf1_art_ebit, sf1_art_intexp), winsorized; near-term
    debt-service capacity, which decides whether a spread move is about this firm'
  - 'Equity volatility: 63-session realized volatility of daily total returns; with leverage it forms a distance
    to default (Bharath-Shumway style), the convexity of equity to credit'
  - 'Signed leverage: market leverage times the credit-shock z (residual 5-session change of Baa minus 10y Treasury
    after the equal-weight stock market and the 10y yield); the direction in which the credit news pushes a levered
    equity'
  - 'Own response: the stock''s return over the shock window minus beta times the market; whether the levered name
    has already priced the credit news (the underreaction gap)'
  - 'Market beta: 252-session beta to the equal-weight LIQ-500 return; separates leverage from market exposure (K-0074);
    legs are also built within beta terciles'
  horizon_days: 5
  model: gbm
  retrain_every_days: 252
  why_not_linear: 'Merton equity is convex in firm value: its sensitivity to credit conditions is near zero for
    the many low-leverage, investment-grade members and rises steeply only where leverage is high AND equity volatility
    is high AND coverage is thin, and only if the stock has not already moved (own response near zero or against
    the news). That is a three- or four-way corner. A ridge on the same six features applies one slope on signed
    leverage to the whole cross-section, so its legs are filled with levered but safe names (utilities, financially
    strong issuers) where the credit news is irrelevant, and it cannot switch the slope off where the stock already
    responded. The gbm can isolate the corner. If the ridge on the same rows, label and schedule does as well, the
    claim that convexity pays is false and what remains is a plain leverage sort signed by the credit shock. The
    payer is the equity-only holder of a near-distress levered stock who does not read the bond market.'
