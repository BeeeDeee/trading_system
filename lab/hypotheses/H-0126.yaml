falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the leg entries on credit-news dates does not exceed
  the 95th percentile of the time-shifted placebos, or its gross per event is below the round-trip cost.'
- 'Mechanism decay: the latest third of dev has the wrong sign (K-0060), even if the pooled test passes.'
- 'Mechanism shape: the 1- and 3-session averages are about zero or wrong-signed and the effect appears only at
  20 sessions; that is a slow leverage style drift, not diffusion of credit news within the week.'
- 'Linear baseline: a ridge (framework ridge) on the same six features, same training rows, label and refit schedule
  gives the same or a larger event gross; then the convexity claim is false.'
- 'Strategy: net Sharpe below 0.5, or the bootstrap bound of the Sharpe difference to T-bills at or below zero,
  or net Sharpe at 2x costs not above T-bills.'
- 'Robustness: fewer than 75 % of the neighbors of z_news 1.0 and n_estimators 100 beat the benchmark, or one third
  of dev carries more than 60 % of the log return.'
notes: 'Why this is not a rerun of H-0116 (same family, counted there on purpose: exposure to a macro shock, delayed
  stock response): H-0116 pooled rate, dollar and credit shocks and mapped stocks to them with one-year statistical
  betas, which its lesson calls noisy; its open question was an explicit economic mapping. This card uses credit
  only, maps stocks by balance sheet (market leverage, coverage, volatility; Merton) instead of a return regression,
  measures the shock as the Baa-minus-Treasury move not explained by the stock market and by Treasuries (so it is
  not equity stress, K-0084), and builds the legs within beta terciles (K-0074). K-0164 asks why the series is clean
  and the link large: Moody''s yields are market-based daily averages (not revised), and the link is structural
  for exactly the corner the model targets; for the rest of LIQ-500 it is small, which is why the card is a learned
  corner and not a linear sort. Dev-seen motivation, stated for the Skeptic: H-0080 found credit ETFs kept falling
  after credit-specific residual drops (wrong sign for its reversal claim); that hints credit-specific news persists,
  but it is a different claim on different instruments, not evidence for this card. Forecasts (K-0098, K-0120, K-0165):
  |z| >= 1 on a fat-tailed residual should mark about 20-30 % of weeks. Scoring starts after the 252-session shock
  warm-up plus 40 news dates of training (about 2001-2002), so about 950-1000 weeks remain and 200-300 news dates;
  with about 450-480 scored members, 2 x 10 % legs give about 90 entries per date, 18000 to 27000 events. The first
  third of dev (to mid-2005) holds only its last 3-4 years of scores (K-0163), including the 2001-2002 credit episode.
  Round trip about 11-12 bps (LIQ-500 tiers, K-0171). Gross per event: central 6 bps (any effect in large caps is
  small), optimistic 25 bps, pessimistic zero or below (credit-specific moves are bond-market liquidity, not news,
  and levered stocks do nothing). Mean exposure by the K-0104 formula: about 22000 entries x 5 sessions / 5800 sessions
  x about 0.011 weight = 0.21-0.27, close to the floor of 0.20; a thinner news share would fail it. Likeliest death:
  the mechanism gross stays under cost (central case); next, a pass whose part-time book misses the absolute Sharpe
  floor (K-0027, as H-0114). If it dies, the lab learns whether credit news reaches levered large caps within a
  week at all, which neither H-0116 nor H-0080 could say. The ridge control: please report the ridge event gross
  and percentile next to the gbm''s if the framework can (K-0135); the card''s convexity claim depends on it.'
