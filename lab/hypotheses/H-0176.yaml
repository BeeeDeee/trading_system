mechanism:
  counterparty: Volatility-scaled and VaR-constrained holders who sell after the volatility spike and re-buy late
    as their trailing estimate decays, and investors forced out during the spike by margin calls or redemptions;
    they pay the liquidity provider who holds the asset through the re-risking phase.
  why: 'A large share of institutional risk is sized by trailing realized volatility: volatility-targeting funds,
    risk-parity books, trend followers that scale positions by inverse volatility, and dealers and levered funds
    bound by VaR limits (Adrian and Shin; Brunnermeier and Pedersen 2009). When an asset''s volatility jumps, these
    holders must cut it mechanically, and because their volatility estimate uses a window of one to several months
    they keep cutting while the shock unfolds and buy back only slowly as the shock rolls out of the window. The
    prediction is state dependent. While short-run volatility is still above its medium-run level (the shock is
    unfolding) a drawdown continues, because the de-risking flow is still arriving. Once short-run volatility has
    fallen back below the medium-run level while the asset is still well below its high and its volatility is still
    elevated against its own long-run norm, the forced selling is over but the re-risking is slow, so the asset
    should earn a higher return than the rest of the cross-section over the following one to three months, the time
    it takes the elevated volatility to leave a typical estimation window. Outside drawdowns the same inputs should
    show only mild trend continuation. The horizon of 42 sessions is set by that mechanism (the roll-off of a one-to-three-month
    volatility window), not by a search.'
  why_not_arbitraged: Capital that could absorb the de-risking is itself volatility- and VaR-constrained at the
    same moment (funding liquidity spirals), the trade must be held for months through still-elevated volatility
    with career risk, and the episodes are few, so the premium cannot be verified quickly by any single desk.
signal:
  description: 'Data: daily total returns of the 28 ETFs from sharadar_sfp (daily total return = (1 + ret_co) x
    (1 + ret_oc) - 1, compounded into a total-return index TR per ETF); no other dataset. All features use data
    up to the close of the decision day t. Features per ETF and day (log returns for volatility, annualization irrelevant
    because everything is z-scored): (1) dd = TR_t / max(TR over the last 252 sessions) - 1; (2) vr = log(std of
    daily log returns over the last 21 sessions / std over the last 126 sessions); (3) vlev = log(std over the last
    63 sessions / std over the last 504 sessions), requiring at least 378 valid returns in the 504 window; (4) r21
    = TR_t / TR_{t-21} - 1; (5) r12_1 = TR_{t-21} / TR_{t-252} - 1. An ETF is scored on day t only if all five features
    are finite and it has a bar on t; features are z-scored across the scored ETFs of that day with the framework
    helper (columns are all 28 ETFs, non-listed ones masked per row, never an ever-listed subset). Label: total
    return from the open of t+1 to the open of t+43 (horizon 42 sessions), ranked across the scored ETFs of day
    t (framework label). Model: LightGBM (framework gbm) with num_leaves 8, learning_rate 0.05, min_child_samples
    400, subsample 0.8, colsample 1.0, n_estimators from params, trained inside lab.framework.ml.walk_forward on
    all scored (day x ETF) rows with an expanding window, refit every 63 rows, labels purged by the framework; no
    score before the first fit. Book (long-only, always invested, two overlapping sleeves): decisions after the
    close of the last trading day of each month, trades at the next open. At each decision a new sleeve with half
    of the capital is formed and the sleeve formed two decisions earlier is closed, so every sleeve is held about
    42 sessions. The new sleeve holds the top fraction `top` (rounded to the nearest integer, at least 3) of the
    scored ETFs by model score, weights proportional to 1 / (63-session realized volatility), normalized to the
    sleeve''s half of the capital; weights inside a sleeve are not re-equalized until it closes. If fewer than 10
    ETFs are scored, or no model has been fit yet, the new sleeve holds 60 % SPY and 40 % IEF (the benchmark mix)
    instead. An ETF that loses its bar while held keeps its weight until it trades again; gross never exceeds 1.'
