  primary_horizon_days: 42
ml:
  features:
  - 'dd: drawdown of the ETF''s total-return index from its trailing 252-session high (how much forced selling the
    asset has absorbed); sharadar_sfp ret_co/ret_oc up to the close of t'
  - 'vr: log ratio of 21-session to 126-session realized volatility (shock still unfolding above 0, decaying below
    0: whether the de-risking flow is still arriving)'
  - 'vlev: log ratio of 63-session to 504-session realized volatility (how elevated the asset''s risk is against
    its own norm, i.e. how far volatility-scaled holders have cut it and how much re-risking is pending); own-history,
    so not an identity marker'
  - 'r21: 21-session total return (recent move; separates a fresh shock from an old one)'
  - 'r12_1: total return from 252 to 21 sessions ago (trend state that trend followers trade; baseline continuation
    outside drawdowns)'
  horizon_days: 42
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is a sign flip: a deep drawdown predicts continuation while vr > 0 (de-risking still
    arriving) and a rebound when vr < 0 with vlev still high (forced selling over, re-risking pending), and outside
    drawdowns only mild trend continuation. A ridge on the same five z-scores is additive: it gives the drawdown
    one coefficient in every volatility state, so it averages the continuation and rebound states toward zero and
    cannot condition the drawdown on volatility direction and elevation. A small tree ensemble (8 leaves, large
    leaves) can split drawdown on vr and vlev. If the ridge on the same features with the same book is as good,
    the interaction is not what pays and the de-risking-cycle claim is refuted. The payers are the volatility-scaled
    sellers who re-buy late.'
