falsification_criteria:
- 'Mechanism: new top-fifth entries do not beat the 95th percentile of the time-shifted placebos at 42 sessions,
  or their gross abnormal return per event is below the round-trip cost, or fewer than 2 of 3 dev thirds have the
  predicted sign.'
- The latest third of dev has a negative event average (the decay pattern of K-0060), even if the pooled test passes.
- Net Sharpe on dev below 60/40 SPY/IEF + 0.10, or the bootstrap bound of the Sharpe difference at or below zero.
- Fewer than 75 % of the neighbors of top 0.2 and n_estimators 100 beat the benchmark.
- 'A ridge (framework ridge) on the same five features with the same schedule and book is as good as or better than
  the gbm: the state interaction is not what pays, and the card reduces to a linear drawdown/trend sort.'
- 'Mechanism-specific split (requested from the Builder as a by-state report of the event test): entries with dd
  below the cross-sectional median and vr < 0 earn no more at 42 sessions than the other entries; then the de-risking-cycle
  reading is refuted even if the pooled event test passes.'
notes: 'Brief fit: medium horizon (42 sessions, two-month sleeves), US ETFs across equity, bond, commodity and currency
  classes, learned model. The instrument list is the long-lived liquid representative ETF of each class, region
  and major sector, chosen by class coverage and listing age, not by performance; ETFs listed later (HYG, DBC, USO,
  SLV, FXY, FXE, GLD) are simply unscored until their 504-session volatility window fills. Family: the mechanism
  is mechanical de-risking by volatility-scaled systematic holders, the same economic channel as H-0169 (trend-follower-deleveraging,
  CTA books sized by inverse volatility), so the trials are filed there; the Librarian may prefer volatility-managed-exposure
  (H-0003), whose investors are the counterparty here. Why this is not another stress-rebound card (K-0084, H-0041,
  H-0168, H-0169): those were 5-session holds after one shock day and asked for a measure of volatility-target leverage,
  which this card builds from prices (vr, vlev); the horizon here is the roll-off of the volatility window, and
  the claim is two-sided in state (continuation while volatility rises, rebound after it peaks), which a stress-day
  trigger cannot see. Why not H-0143 (frog-in-the-pan momentum in ETFs): the inputs are drawdown and volatility-cycle
  state measured against each ETF''s own history, and momentum enters only as a control feature. Identity trap (K-0025,
  K-0195): vr and vlev are own-history ratios, so the same ETF should be in and out of the top fifth over time;
  if the placebo mean is about as large as the event mean, the score picks identity and the card is dead. Beta gap
  (K-0074): in the post-peak state the picks are risk assets after a drawdown, so the marked set has a higher market
  beta than the peer mix of bonds and equities; the expected beta gap is positive in post-shock months and about
  zero otherwise, which the by-state split separates. Forecasts (K-0120): scoring starts around the first full 504-session
  window plus the first fit, roughly two to three years into dev, so the first third is partly warm-up with about
  10-15 scored equity ETFs (K-0163); about 180-200 monthly decision dates with scores, 2-3 new top-fifth entries
  per date, so about 400-550 events. Round trip: most of these ETFs are in the most liquid ETF tiers, a few (FXY,
  EWZ, DBC, FXE) cost more; take about 5-20 bps per round trip, against a 42-session gross that should be tens of
  bps if the effect exists. Book: always invested (exposure 1.0), half the book turns over monthly, inverse-volatility
  weights keep drawdown near the benchmark''s. Expected result by part: if it passes, most of the gain should come
  from a few post-shock windows per decade, so the G2 sub-period check is the likely binding gate. Model capacity
  is deliberately small (8 leaves, 400-row leaves, 50-200 trees, five features) because 28 ETFs give few independent
  names per date.'
