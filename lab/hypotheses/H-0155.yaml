id: H-0155
version: 1
title: Aggregate-volatility risk premium from the options market into stocks - LIQ-500 long-only, 6-month monthly
  cohorts of the stocks most hurt by VIX innovations (market beta and idio vol matched)
author_agent: scout
family: variance-risk-premium-timing
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Holders who pay for volatility insurance through stock selection: long-only managers with drawdown
    and tracking limits, risk-parity and volatility-targeting books that are forced to de-risk when volatility jumps
    and therefore prefer names that hold up then, and investors who cannot buy index options (mandate constraints)
    and tilt to ''defensive in a vol spike'' stocks instead. They accept a lower expected return on those names,
    which the holder of the vol-sensitive names collects.'
  why: 'Innovations in aggregate volatility carry a negative price of risk (Ang, Hodrick, Xing, Zhang 2006): investors
    value assets that rise, or fall less, when market volatility jumps, because those are the states in which their
    wealth, margin capacity and risk budgets are hit. Stocks whose returns load negatively on VIX innovations, after
    controlling for the market return, lose exactly in those states and must offer a higher expected return; stocks
    that hedge volatility jumps earn less. The signal is measured in one market (the S&P 500 index-option market,
    through the VIX) and traded in another (single US stocks): the stock''s sensitivity to the option-implied volatility
    shock, not its own volatility or its own implied volatility. The claim is a slow risk premium, so it should
    accrue over months while the exposure persists, not in a few days.'
  why_not_arbitraged: 'It is compensation for a real risk, not a free lunch: the long side loses precisely in volatility
    spikes, when arbitrage capital is margin-constrained and redemptions force sales (limits to arbitrage, Shleifer-Vishny).
    The exposure is estimated with noise from a collinear regression, so it is hard to scale, and the payoff arrives
    over quarters with crash-like drawdowns that career-risk managers avoid.'
signal:
  description: 'Inputs: daily close-to-close total returns of LIQ-500 stocks (from ret_co and ret_oc of sharadar_sep),
    the point-in-time LIQ-500 membership, and the daily VIX close (fred_macro VIXCLS, clock next_morning, so the
    VIX of day d is used only from day d+1 on). Formation dates: after the close of the last session of each calendar
    month t. All estimation uses data up to and including session t-1 (one session earlier than the stock data would
    allow, so that every VIX value used is known at the decision), and trades are executed at the open of session
    t+1. Step 1, market factor: MKT_d = equal-weighted mean of the close-to-close total returns on day d of the
    stocks that are LIQ-500 members on day d. Step 2, VIX innovation: dVIX_d = VIXCLS_d - VIXCLS_(d-1) in index
    points, defined only when both values exist for consecutive XNYS sessions; otherwise NaN and the day is dropped
    from the regression. Step 3, exposures: for every stock that is a LIQ-500 member on formation date t, run OLS
    over the last est_days sessions ending t-1: r_j,d = a + b_mkt * MKT_d + b_vix * dVIX_d + e_j,d, using only days
    where r_j,d, MKT_d and dVIX_d all exist. Require at least 80 % of est_days valid days, else the stock is not
    eligible this month. ivol_j = standard deviation of the residuals e_j,d. Step 4, matched cells: split the eligible
    stocks into terciles of b_mkt; inside each tercile split at the median of ivol_j, giving 6 cells. Inside each
    cell, the long leg is the 20 % of stocks with the lowest (most negative) b_vix (floor of 0.2 x cell size, at
    least 1). Ties broken by ticker id. Step 5, cohorts: the long names of formation date t form one cohort, equal-weighted,
    with capital share 1 / hold_months. A cohort is held for hold_months monthly formation dates and replaced by
    the new cohort of the same slot (6 overlapping cohorts at the primary value). The book weight of a stock is
    the sum over live cohorts. Target weights change only on monthly formation dates. Start-up: until hold_months
    cohorts exist, the existing cohorts are scaled up equally so the book is fully invested from the first formation
    date. Exits and missing data: a stock that leaves LIQ-500 gets weight zero from the first decision row on which
    it is no longer a member (the engine refuses weights outside the universe); its cohort share is held in cash
    until the next monthly formation date, when every live cohort is re-equal-weighted over its remaining members
    at its 1 / hold_months share. Delistings follow the engine''s policy. No shorts, no leverage, gross exposure
    1 after start-up.'
  params:
    est_days:
      grid:
      - 126
      - 252
      - 504
      value: 252
    hold_months:
      grid:
      - 3
      - 6
      - 12
      value: 6
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'A stock enters the long leg at a monthly formation date: it is in the bottom b_vix quintile of its market-beta
    x idio-vol cell at month-end t and was not in the long leg at the previous month-end formation (new entries
    only, so that persistent stock identity is not counted as an event). Side +1 (the mechanism says these vol-sensitive
    stocks should outperform the other LIQ-500 members over the following months). All other LIQ-500 members on
    that date are unmarked peers. Because the cells are balanced across market-beta terciles and idio-vol halves,
    marked and unmarked stocks have about the same market beta, which limits the raw-peer beta confound (K-0074).'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
