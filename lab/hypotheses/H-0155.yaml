falsification_criteria:
- 'Mechanism: the 60-session side-adjusted abnormal return of new long-leg entries against unmarked LIQ-500 peers
  is not above the 95th percentile of the 200 time-shifted placebos, or gross per event is below the round-trip
  cost.'
- 'Mechanism kill condition: the latest third of dev has a negative abnormal return (K-0060), or the 5-session abnormal
  return is larger than the 60-session one (a quick rebound after a VIX spike is short-term reversal, not a slow
  risk premium).'
- 'Mechanism kill condition: the event average is not above the placebo mean by more than the placebo mean itself
  is above zero (the sort only picks stocks that do well in any quarter, K-0025).'
- 'Strategy: net Sharpe on dev below SPY_TR Sharpe + 0.10, or the one-sided bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Strategy control: the book does not beat the 95th percentile of G2 random-entry books with the same turnover
  and exposure drawn from the same LIQ-500 members, i.e. the margin over SPY_TR is equal-weight-versus-cap-weight,
  not volatility risk.'
- 'Robustness: fewer than 75 % of the grid neighbors (est_days 126 / 504, hold_months 3 / 12 and combinations) beat
  SPY_TR, or doubled costs remove the margin.'
- 'Publication decay: Sharpe excess over SPY_TR after the 2006 publication is less than half of the excess before
  it.'
notes: 'Brief fit: long horizon (6-month cohorts, 12-month estimation; grid to 12-month holds) and cross-asset (signal
  from the index-option market via FRED VIXCLS, traded in single stocks). The judge caps the mechanism horizon at
  60 sessions, so G1 sees the first quarter of a half-year hold (K-0076). Family: filed under variance-risk-premium-timing
  on purpose. The economic premium is the same one the family has tested (a negative price of volatility risk),
  only measured as a stock''s exposure to the aggregate volatility shock instead of timing a short-volatility position
  or ranking assets on their own implied-over-realized ratio. K-0129 read the earlier failures as ''any premium
  is global and common to assets, which an own-vol ranking cancels''; this card is the cross-sectional test of exactly
  that global premium: loading on the common shock, not own richness. The family''s trial count stays with it. Difference
  from study 1 (low-vol ensemble) and the idio-vol puzzle: the sort is on the VIX-innovation loading inside cells
  that hold market beta and idiosyncratic volatility fixed, so it is neither a low-beta nor a low-ivol tilt. AHXZ
  report the two effects as separate; if the long leg were just high ivol it would be expected to lose, which the
  matching removes. Why long-only: K-0172 found that short legs of neutral stock books lose; the long-only book
  avoids a short leg and a T-bill Sharpe floor. Its known confound is equal-weight versus cap-weight SPY_TR (K-0153);
  the G2 random-entry check with the same turnover from the same members is named above as the control, and a pass
  of G1 alone should not be read as support. Forecasts (K-0098, K-0120, K-0181): eligible stocks about 450-490 per
  month; long leg about 90-95 names per cohort (6 cells x 20 %). With a 252-day window that moves 21 sessions per
  month I expect 60-75 % of long-leg names to stay, so about 25-40 new entries a month: roughly 6000-10000 events
  on about 260 monthly dates (1999-2020; first formation once 80 % of the window is valid, about early 1999; the
  est_days 504 neighbor starts about a year later). Round trip from the LIQ-500 tier about 11-12 bps (x2.5 before
  2001-04). Gross per event at 60 sessions: pessimistic 0, central 30-50 bps (AHXZ quintile spread of about 1 %
  a month in 1986-2000, the long leg against all peers taking about a third of it, halved after publication), optimistic
  about 100 bps. K-0109 says the placebo bar of slow monthly stock sorts is about the size of the literature''s
  spread and entry-only events widen it (K-0111), so my central case is near the bar: the honest prior is a pass
  of perhaps one in five. Book: mean exposure about 1.0 after the first month, about 260 decision dates, one-way
  turnover about 2x a year (one sixth of the book each month plus re-weighting), cost drag about 0.3 % a year. Expected
  deaths, in order: (1) mechanism inside the placebo cloud (K-0109); (2) a negative block that holds a volatility
  spike (2000-2002, 2008, 2020), since the long side is by construction what loses in spikes - the premium is paid
  for that; (3) G2 random entry or publication decay. A death at (1) with a placebo mean near zero says the aggregate-volatility
  loading carries no premium in large liquid stocks after 1998; a death with a positive placebo mean says the sort
  picks persistent identity. No new dataset is needed. No date literals; the universe is the PIT LIQ-500.'
