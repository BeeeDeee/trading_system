id: H-0113
version: 1
title: Quarterly index share-update pressure, learned - S&P 500 core switched for 5 sessions before each quarterly
  rebalance into top LightGBM-scored pending share changes
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Passive S&P 500 trackers (index mutual funds and ETFs) with a tracking-error mandate. They trade
    the share updates at the rebalance close whatever the price, and pay a concession to the liquidity providers
    and pre-positioners who take the other side in the days before.
  why: Cap-weighted index funds hold each S&P 500 member in proportion to its index share count. The index provider
    updates share counts on a fixed quarterly schedule (effective after the close of the third Friday of March,
    June, September and December), apart from large changes from qualifying corporate actions, which it puts in
    when they happen. A member whose shares outstanding rose since the last update (stock compensation, small issuance,
    conversions) must be bought by every passive tracker at that close, and one whose share count shrank (buybacks)
    must be sold. The trade size is known in advance from public filings, the date is fixed, and the trackers cannot
    trade early without tracking error. So price pressure should build in the days before the rebalance close, in
    the direction of the pending share change and scaled by the trade size in days of volume, and should partly
    reverse afterwards. The same downward-sloping demand curve is behind the index-inclusion effect, but here the
    demand is spread over hundreds of members at every quarterly date.
  why_not_arbitraged: Pre-positioning is done by index-arbitrage desks with limited balance sheet across all members
    at once. The per-name demand is small next to normal volume for most members and large only for a few illiquid,
    high-change names, so the effect is a cross-sectional detail that is not worth a dedicated book for most managers.
    The passive share of the index grew over the dev period, so demand per unit of share change grew too.
signal:
  description: 'Calendar: for each quarter-end month (March, June, September, December), R is the last XNYS session
    on or before the third Friday of that month, computed from the trading calendar (no date literals). The decision
    date D is the 5th session before R (D + 5 sessions = R). All inputs are as of the close of D; trades happen
    at the open of the next session. Inputs per point-in-time S&P 500 member: S_t = sf1_arq_sharesbas as usable
    at the close of t (framework attach: from the session after the filing); daily total return r_t = (1 + ret_co_t)
    * (1 + ret_oc_t) - 1; close_u; dollar_volume. Split screen: a member with any split-like session in the 252
    sessions up to D (|log(close_u_t / close_u_{t-1}) - log(1 + r_t)| > 0.10) is not scored at D, because unadjusted
    share counts jump at splits. A member with missing S at D, at the previous decision date or at the one before,
    or with fewer than 63 sessions of returns, is not scored. Features at D (six, each z-scored across the scored
    members of D by the framework helper): (1) dq = log(S_D / S_Dprev), where Dprev is the previous quarterly decision
    date (pending share change since the last update); (2) dq_prev = log(S_Dprev / S_Dprev2), the change of the
    quarter before (persistent buyback or issuance style, and changes the provider may already have put in); (3)
    demand_days = dq * S_D * close_u_D / median(dollar_volume over the 63 sessions to D) (pending index trade in
    days of volume, signed); (4) filing_age = sessions since S last changed value, capped at 252 (a filing that
    arrived too late for the provider''s cut-off carries no demand at this update); (5) vol63 = standard deviation
    of daily log total returns over the 63 sessions to D (price impact per unit of demand); (6) ret5 = total return
    over the 5 sessions to D (pre-positioning already in the price). Label: total return from the open of D+1 to
    the open 5 sessions later (= the open after R), ranked across members (framework label, horizon_days 5). Model:
    framework walk_forward with gbm (LightGBM), trained only on decision-date rows (one row per scored member per
    quarter), expanding window, refit every 63 rows; fixed hyperparameters learning_rate 0.05, num_leaves 8, min_child_samples
    200, subsample 0.8, colsample 1.0; n_estimators from params. The first decision date with a score is the first
    at which walk_forward has its minimum training sample; before it the book holds the core only. Book (long-only,
    gross 1.0): outside the windows the book holds the core, all members with a valid S, weight proportional to
    S_t * close_u_t, weights reset at the first session of each week and on each switch-back day and held constant
    in between. Window: after the close of D, if at least 50 members are scored, the book switches at the open of
    D+1 entirely into the top `top` fraction of scored members by model score, equal weight, and holds them for
    5 sessions; after the close of R it switches back to the core at the open of R+1. A window member that leaves
    the S&P 500 inside the window is sold at the next open and its weight goes to cash. If fewer than 50 members
    are scored at D, the book stays in the core for that quarter.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'At each quarterly decision date D (5 sessions before the S&P quarterly rebalance close R), an S&P 500
    member scored by the model is in the top `top` fraction of the score (side +1: predicted net index buying) or
    in the bottom `top` fraction (side -1: predicted net index selling).'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'dq: log change of sf1_arq_sharesbas between the previous quarterly decision date and this one (pending index
    share update, signed)'
  - 'dq_prev: log change of sf1_arq_sharesbas over the quarter before (persistent buyback or issuance style; changes
    the provider may already have applied)'
  - 'demand_days: dq times market value (S x close_u) over the 63-session median dollar volume (signed size of the
    trackers'' trade in days of volume)'
  - 'filing_age: sessions since sf1_arq_sharesbas last changed, capped at 252 (filings after the provider''s cut-off
    carry no demand this quarter)'
  - 'vol63: 63-session standard deviation of daily log total returns (price impact per unit of demand)'
  - 'ret5: total return over the 5 sessions to the decision date (pre-positioning already in the price)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The quarterly demand is not linear in the share change. The provider puts large changes from
    qualifying corporate actions in when they happen, with thresholds that are not public in a form the card can
    code and that changed over the period. So the pending demand rises with |dq| for ordinary changes and falls
    back to zero above an unknown size, unless dq_prev shows the change was already applied. It is also zero when
    the filing came after the cut-off (a threshold in filing_age). Price impact is the product of the trade in days
    of volume and volatility, not their sum. A ridge on the same z-scored features can only add slopes: it would
    put the most weight on the largest issuers and buyback firms, which are where the pending demand is most often
    already gone, and it cannot switch dq off by filing age. A small tree model can learn the hump in dq, the cut-off
    in filing_age and the demand x volatility product. The passive trackers pay for it at the rebalance close.'
