  frequency: 1q
holding_period:
  rebalance: event
  typical_days: 5
market_exposure: long_only
falsification_criteria:
- 'Mechanism: at the 5-session horizon, side-adjusted abnormal returns of the top- and bottom-`top` entries at the
  quarterly decision dates do not beat the 95th percentile of the time-shifted placebos, or gross per event is below
  the round-trip cost.'
- 'Mechanism decay: the latest third of dev is not positive. The passive share of the index grew over the period,
  so an index-demand effect should be at least as large lately; a fade means it is not this flow.'
- 'Mechanism shape: the descriptive 10-session abnormal return is larger than the 5-session one (no give-back after
  the rebalance close). That is drift or issuance style, not price pressure.'
- 'Linear baseline: a ridge (framework ridge) on the same six features, rows, label and refit schedule gives an
  equal or larger event mean at the 5-session horizon, so the nonlinearity is not what pays.'
- 'Strategy: net Sharpe on dev below SPY_TR + 0.10, or the bootstrap bound of the Sharpe difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors of n_estimators 100 and top 0.1 beat SPY_TR, or costs x2 remove
  the margin.'
notes: 'Closest fit to the brief. Short horizon (5 sessions), US single stocks, cross-sectional, learned. The lab''s
  record (K-0024, K-0133, K-0152) says one-week sorts of liquid US stocks on information, attention, reversal or
  fundamentals stay below cost, and the only near-passes are mandated flows. So this card takes a mandated flow
  that has not been tested. Family: reuses index-inclusion-price-pressure because the channel is the same (passive
  trackers'' demand curve). It is not a retry of H-0017/H-0022: those used S&P membership changes (a few hundred
  sparse events). This uses quarterly share-count updates of existing members, about 80-90 scored decision dates,
  with entries on every one, the many more events K-0093 asked for. Not trading-window-flows (H-0019/H-0027/H-0086):
  those sorted repurchasers against issuers at filing or release dates. Here the date is the index calendar, the
  input is the pending share change since the last index update, and the time-shifted same-stock placebo removes
  the issuance-style level (K-0025), so only the timing at the rebalance is tested. Not the option-expiration card
  H-0020: it sorted on liquidity, not on a member-specific pending trade. Option expiry falls on the same day, but
  a generic expiry effect has no reason to line up with the sign of each member''s share change. Forecast (K-0120,
  K-0151): R dates in dev about 92, scored dates about 80-88 after warm-up and the 2-quarter feature lag; scored
  members per date about 430-470 after the split and missing-data screens; events per date 2 x 0.1 x ~450 = ~90;
  total about 7000-8000 events on about 85 dates. Round trip in S&P 500 members about 10-12 bps. My central gross
  per event at 5 sessions is 8-20 bps. At a quarter of that (2-5 bps) it dies on cost; at a tenth it is inside the
  placebo cloud. Placebo bar: per-date noise of the decile spread is about 0.4 %, so the bar should be roughly 5-8
  bps over 85 dates. That is below cost, so a miss means not tradable, not a power problem (K-0034). Book arithmetic
  (K-0064, K-0098): exposure 1.0 (always invested). Four windows a year; each switch out of and back into the core
  trades about 1.7 times the book, about 20 bps per window. Annual gain over the core is about 4 x (a - 0.20 %),
  where a is the top-decile excess over the cap-weighted core per window. A +0.10 Sharpe margin over SPY_TR at about
  18 % volatility needs about +1.8 %/yr, i.e. a of about 0.65 % per window. That is far above my central gross,
  so if the mechanism passes the book most likely dies at the G1 margin. It would still tell the lab that index
  share-update demand exists but a daily-open taker cannot harvest it. A dollar-neutral window book would be cleaner
  but is invested about 8 % of the time and would fail the exposure floor by construction (K-0027). Caveats: (1)
  the provider''s exact rules (cut-off date, threshold for off-cycle changes, float factors) are not in the data.
  The model is there to learn them; if it cannot, the ridge criterion shows it. (2) sf1_arq_sharesbas may lag the
  share count the provider uses; filing_age is the guard. (3) Other providers (CRSP, Russell quarterly updates)
  rebalance around the same dates on similar share data and push the same way, so the effect measured is passive
  demand in general, not the S&P alone. (4) Beta gap between legs (K-0074): issuers may carry somewhat higher beta
  than buyback firms. The event is side-adjusted against the other members over the same week, and the placebo nets
  the average, but a market-direction tilt over these 4 weeks a year is not removed. (5) No forward data for US
  stocks, so G4 is the ceiling. No references: practitioner notes describe quarterly rebalance pressure, but I could
  not verify an academic paper on quarterly share updates and cite none.'
