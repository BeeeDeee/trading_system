id: H-0064
version: 1
title: Pre-announcement liquidity-provision reversal - LIQ-500, long 3-session losers / short winners just before
  their predicted 8-K earnings release, hold 5 sessions
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Impatient traders who push a stock in the sessions right before its earnings release (position squaring,
    pre-earnings hedging and de-risking, retail positioning into the event) and must trade against thin pre-announcement
    depth; they pay the enlarged concession to whoever holds the other side through the release.
  why: 'Short-term reversal is the return to liquidity provision: market makers and other short-horizon liquidity
    suppliers absorb non-informational order imbalances and are paid by the subsequent price reversal (Nagel 2012).
    The compensation they demand rises with inventory risk. Just before a scheduled earnings release, any net position
    a liquidity supplier takes on will be carried through a large, unpredictable jump, so they quote less depth
    and require a larger price concession to absorb the same imbalance. So and Wang (2014) document that the reversal
    of returns over the few days before an earnings announcement, measured over the announcement window, is several
    times larger than the reversal in non-announcement periods. The lab already knows (H-0030, K-0044) that ordinary
    large-cap reversal exists but is a fraction of round-trip cost; this card claims that the pre-announcement subset
    is not a significance conditioner but a magnitude conditioner: the concession per event is larger by a multiple,
    which is exactly the gap to cost.'
  why_not_arbitraged: 'Collecting the concession means carrying a concentrated position through the earnings jump,
    the very inventory risk that sets the price: market makers and stat-arb desks with risk limits on event exposure
    stay out or size down. The reward per unit of jump risk is modest and only diversifiable with many simultaneous
    names, which limits capacity and makes the trade unattractive for leveraged short-horizon capital.'
signal:
  description: 'Inputs: sharadar_sep daily total returns (ret_co, ret_oc), tradable flag and the point-in-time LIQ-500
    membership; sec_8k_item202 field ea_reaction_day (1 on the reaction session of an earnings-release 8-K, known
    at the close of that session). Decisions after the close of session t using data up to that close; trades at
    the open of session t+1. (1) Predicted release session. For every stock j and every past reaction session L
    of j (ea_reaction_day == 1), the predicted next-year release session is P = the first XNYS session on or after
    the calendar date L + 364 days (52 weeks, same weekday). Only reaction days already observed are used, so P
    is known about a year in advance. (2) Candidate. Stock j is a candidate at the close of session t if t is exactly
    lead_sessions = 3 sessions before a predicted session P of j (t = P - 3 in session index), j is a LIQ-500 member
    and tradable at t, j has a total return over the formation window, and j has NO ea_reaction_day == 1 in the
    20 sessions up to and including t (if the firm has already released this quarter, it is not a pre-announcement
    stock). (3) Formation return. r_j = compounded total return of j over the last formation_days sessions ending
    at the close of t (close of t - formation_days to close of t). On the same date compute the same return for
    every LIQ-500 member with data, and its leg_quantile and 1 - leg_quantile cross-sectional quantiles q_lo and
    q_hi. (4) Event and side. A candidate with r_j <= q_lo is a loser event, side +1 (expected to rebound); a candidate
    with r_j >= q_hi is a winner event, side -1 (expected to give back). Other candidates are ignored. (5) Book.
    Each event opens a slot at the open of t+1 with weight side x 0.05 of equity and is closed at the open of session
    t+1+hold_days (hold_days = 5, so the position spans predicted sessions P-2 .. P+2 and the reaction session if
    the release comes within two sessions of the prediction). Slots are fixed; no re-weighting of open slots except:
    if the sum of absolute weights would exceed 1.0, all slots are scaled down proportionally on that day so gross
    = 1.0 (no leverage). No hedge basket: longs and shorts come from the same candidate pool and roughly offset;
    the net dollar exposure is left as it is. A stock that has an open slot is not given a second one. If a stock
    leaves the LIQ-500 universe or becomes untradable while a slot is open, the slot is closed at the first open
    where the engine allows it (the engine refuses weights outside the universe, K-0032/K-0051). Cash earns the
    T-bill rate in the engine. Missing returns in the formation window: no event. Stocks without any 8-K Item 2.02
    history never become candidates.'
  params:
    formation_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    hold_days:
      grid:
      - 4
      - 5
      - 6
      value: 5
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  selection_procedure: Primary configuration fixed in advance from So and Wang's design (3-day formation, quintile
    extremes), with the hold set to cover a two-session error of the 52-week date prediction on either side. No
    values were chosen on lab data.
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: After the close of session t, a LIQ-500 stock whose predicted earnings-release session (first session on
    or after one of its past 8-K Item 2.02 reaction days + 364 calendar days) is exactly 3 sessions ahead, that
    has not had a reaction day in the last 20 sessions, and whose total return over the last 3 sessions is in the
    bottom quintile (side +1) or top quintile (side -1) of the LIQ-500 cross-section on that date. Unmarked peers
    are all other LIQ-500 members with data on the date.
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 5
