falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost (cost ratio < 1). Since H-0030 showed ordinary
  large-cap reversal at a fraction of cost, a cost ratio below 1 means the pre-announcement amplification is absent
  (or the date prediction misses) in LIQ-500.'
- 'Mechanism: the latest third of the dev events has a negative side-adjusted abnormal return (decay or regime,
  K-0060), even if the pooled result passes.'
- 'Mechanism shape: if the 10-session abnormal return is more than 1.5 times the 5-session one, the effect is generic
  slow drift rather than a concession repaid around the release, and the card''s mechanism is wrong.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors (formation 2/5, quantile 0.1/0.3, hold 4/6) beat T-bills, or the
  book''s Sharpe at doubled costs does not beat T-bills.'
- 'Publication: the post-2014 part of dev earns less than half of the pre-2014 Sharpe excess.'
notes: 'Brief fit: US single stocks, cross-sectional, 5-session hold, mechanism test declared. Family: this is a
  short-term reversal claim (liquidity provision), so it is filed under short-term-reversal with its full trial
  count, not under a new name. Why it is not another ''reversal + conditioner'' that K-0044 rules out: K-0044 says
  conditioners on the one-month sort changed significance, not size relative to cost. The pre-announcement condition
  is the one conditioner whose published effect is on the size of the reversal (several-fold, tied to a priced inventory
  risk), and the event study''s cost ratio checks exactly that against H-0030''s no-news reversal, which cleared
  the placebo but earned a fraction of cost. If this card''s gross per event is still below cost, the lab can close
  large-cap daily reversal at the 5-session horizon for good. The date predictor (last year''s reaction day + 52
  weeks) is the one used by H-0023, H-0026 and H-0032; the Chair may want to count this card in the earnings-announcement-premium
  trials as well. Its hit rate has never been reported (K-0035); a miss dilutes the effect toward ordinary reversal,
  so it biases against a pass, not toward it. Helpful descriptive output if the Builder can produce it: share of
  events with a real ea_reaction_day in sessions P-2..P+2. The 20-session ''already released'' filter uses only
  past data and removes known misses. Expected scale (forecast, not measured): about 500 stocks x 4 predictions
  a year x ~15 years, reduced by 8-K coverage gaps and the already-released filter, gives roughly 15,000-25,000
  candidates and, at quintile extremes, 6,000-10,000 events on 2,000-3,500 event dates, all from 2005-08 on (first
  predictions one year after the 8-K data starts; no events 1998-2005). Events cluster in earnings seasons, so the
  book is fuller in season and light between seasons; average gross around 0.4-0.6, above the 0.20 floor. Round-trip
  cost for LIQ-500 names is about 6-12 bps a side pair after decimalization. So and Wang report a 3-day long-short
  spread of well over one percent across all stocks; the card needs roughly a fifth of that per leg in large caps
  (about 25-30 bps per event over 5 sessions) to clear cost by a factor of two and reach a Sharpe near the bar.
  The noise is high because every position is held through an earnings jump; that, not the placebo, is the most
  likely strategy death. Beta: losers and winners are both drawn from the extremes of the same candidate pool, so
  both sides carry similar volatility and the side-adjusted average is roughly beta-neutral (K-0074); there is no
  one-sided marked bucket. No date literals, no named stocks.'
