- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - TLT
  - SHY
  - AGG
  kind: instruments
mechanism:
  counterparty: 'Holders who must or want to shed risk when credit conditions are poor and who add it when they
    are calm: dealers and leveraged intermediaries cutting balance sheets, funds facing redemptions after losses,
    insurers and pensions bound by rating or funding constraints, and investors with procyclical risk appetite who
    sell equities after bad news and buy after quiet years. They pay a premium to unload risk in bad states and
    accept a low one in good states; the tilt takes the other side in both.'
  why: 'Fama and French (1989) and Keim and Stambaugh (1986): the default spread (Baa minus Aaa corporate yields)
    tracks long-term business conditions, and expected returns on risky assets are high when conditions are poor
    and low when they are good. The spread is a price set in the corporate bond market; the trade is in a different
    market, US equities against Treasuries. In the intermediary reading (Gilchrist and Zakrajsek 2012), a wide spread
    marks low risk-bearing capacity of the marginal holders of risk, so the compensation for holding equity risk
    over the next months is high; a tight spread marks abundant risk capacity and compressed premia. The claim is
    slow: the premium is earned over months to years, not in a quick rebound after a shock.'
  why_not_arbitraged: It is a risk premium, not a free lunch. The overweight arrives in high-volatility, recession-risk
    states, when equities can keep falling for months, so it requires sitting through deeper drawdowns and long
    tracking error against a fixed mix; the signal is slow with few independent episodes per decade, so it cannot
    be confirmed quickly, and career and mandate constraints (fixed strategic weights, drawdown limits) stop most
    allocators from taking it. Capacity is not the limit; holding power is.
signal:
  description: 'Inputs: Moody''s seasoned Aaa and Baa corporate bond yields, daily (new dataset fred_moody_yields_1d,
    keys DAAA and DBAA, clock next_morning, so the value stamped day d is usable from the close of d+1); SPY and
    IEF total returns from sharadar_sfp. Default spread DS_d = DBAA_d - DAAA_d in percentage points, defined only
    on days where both are present. Decision dates: the last XNYS session of each calendar month t. At the close
    of t take the latest usable DS value (the most recent valid value stamped on or before t-1; if the latest valid
    value is more than 5 sessions old, treat the signal as missing). Percentile p_t = (number of the trailing window_days
    valid DS observations ending with that value, inclusive, that are strictly below it + 0.5 x number equal to
    it) / number of observations in the window, so p_t is in [0, 1]. Target weights: w_SPY = 0.60 + tilt x (2 p_t
    - 1), w_IEF = 1 - w_SPY (primary: tilt 0.20, so SPY moves continuously between 40 % and 80 %, 60 % at the median).
    TLT, SHY and AGG are in the universe only as unmarked peers of the mechanism test and always carry weight 0.
    Trades at the open of the next session (t+1) to the target weights; positions are then held without drift rebalancing
    until the next month-end decision. If the signal is missing or fewer than 756 valid DS observations exist in
    the window, the target is the plain 60/40 (no tilt). No other filter, threshold or state machine. Because p_t
    is persistent, the direction of the tilt typically lasts many months (6-24), while the size is re-set monthly.'
  params:
    tilt:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    window_days:
      grid:
      - 756
      - 1260
      - 1764
      value: 1260
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'On the last XNYS session of each calendar week, SPY is marked when the latest usable Moody''s Baa-minus-Aaa
    default spread is in the top third of its own trailing 1260 valid daily observations (p >= 2/3, side +1: SPY
    should beat the Treasury peers over the next months) or in the bottom third (p <= 1/3, side -1: SPY should lag
    them). Middle third: no event. IEF, TLT, SHY and AGG are never marked and are the peer basket on every date
    (four unmarked peers, see K-0055). Exactly one marked instrument per event date.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
