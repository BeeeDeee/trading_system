falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of SPY against the Treasury peer basket after weekly
  default-spread events is not above the 95th percentile of the time-shifted placebos, or has the same sign in fewer
  than 2 of 3 dev blocks.'
- 'Mechanism: the latest third of the dev period has a negative side-adjusted mean at the 60-session horizon (decay
  or regime change, K-0060), even if the pooled test passes.'
- 'Mechanism shape: if the descriptive abnormal return at 5 sessions is larger than at 60 sessions, the effect is
  a short stress bounce (K-0056), not the slow business-conditions premium claimed, and the claim counts as refuted
  even if the gate passes.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Strategy: maximum drawdown more than 1.5 times the 60/40 drawdown (the overweight in wide-spread states caught
  a persistent crash).'
- 'Robustness: fewer than 75 % of the neighbors (window_days 756/1764, tilt 0.10/0.30) beat the 60/40 benchmark,
  or the book does not beat it at doubled costs.'
- 'Robustness: more than 60 % of the dev log return excess comes from one of three sub-periods, or the post-2012
  excess over 60/40 is less than half the pre-2012 excess.'
notes: 'Brief fit: long horizon, cross-asset (corporate-bond-market signal, equity/Treasury trades). The mechanism
  test is capped at 60 sessions, so it measures the first quarter of a premium the card says lasts 6-24 months;
  the book re-sets the tilt size monthly but its direction is persistent. Events are weekly (not monthly) only to
  reach the 200-event minimum: about 900 dev weeks x 2/3 marked = roughly 550-650 marked events on as many dates.
  They are heavily overlapping and come from perhaps 10-15 independent spread regimes, so the placebo cloud will
  be wide (K-0071, K-0026). Both sides are marked, so generic equity-over-bond drift largely cancels in the placebo
  mean (K-0063). Expected numbers, stated before the run as K-0064 and the H-0055 lesson ask: at the magnitude of
  the original studies (top versus bottom tercile annual SPY-minus-Treasury expected return differing by roughly
  8-10 points), the side-adjusted 60-session gross is around 1-1.5 %, many times the round-trip cost of SPY and
  IEF (a few bps), but likely near or under a placebo bar of a few percent: a coin flip unless the effect is larger
  than in the original papers. Strategy: at that magnitude a 0.20 tilt adds only about 0.3 %/y and roughly +0.03
  to +0.05 Sharpe, under the required +0.10 margin; the tilt is capped by the drawdown gate (an 80 % SPY book in
  a long crash is about 1.3-1.4 times the 60/40 drawdown). So the strategy passes only if the dev effect is two
  to three times the original estimate. Why it could be larger: the signal is the spread against its own 5-year
  history, which removes the slow secular level shifts of Baa-Aaa that blur full-sample regressions, and the intermediary
  view predicts that premia rise most in balance-sheet crunches, which is how credit stress has propagated in dealer-intermediated
  markets. I file it mainly as a pre-registered, out-of-publication test of a classic cross-asset predictor: FF
  1989 used 1926-1987, so the dev period 2003-2020 is entirely out of their sample. Differences from dead cards:
  H-0055 (variance risk premium from VIX, weekly, about two months) is a different state variable from a different
  market (equity options versus corporate bonds) and a faster claim; H-0003 was a binary SPY/IEF switch on SPY''s
  own volatility (here a continuous tilt with the benchmark''s average weight, K-0005); study 2 and H-0041 are trend
  and stress-rebound designs, and the shape criterion above separates this claim from the stress bounce of K-0056.
  The family is new because no lab card has used credit spreads to time equities; if the Chair judges it the same
  mechanism as variance-risk-premium-timing (both are time-varying risk premia on SPY/IEF), the trials should be
  counted there. Most likely death: the mechanism test lands under the placebo bar (cannot tell), or the strategy
  misses the Sharpe margin as estimated above. A clean wrong sign would be a real finding: credit spreads then mark
  persistent crashes, not premia, in this era. No date or episode is used; window and tilt are round values.'
