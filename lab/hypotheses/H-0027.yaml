falsification_criteria:
- 'Mechanism: side-adjusted 5-day abnormal return of the events below the 95th percentile of the 200 time-shifted
  placebos, or the same sign in fewer than 2 of 3 sub-periods, or gross per event below the round-trip cost.'
- 'Mechanism: the latest third of the events (the last sub-period block) has a negative side-adjusted abnormal return;
  a window flow that is still operating must not reverse.'
- 'Mechanism: the descriptive 21-day abnormal return is more than twice the 5-day one, i.e. the spread is a slow
  drift (news/style) rather than a flow concentrated in the first week after the window opens.'
- 'Strategy: net Sharpe on dev below 0.5 or below T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  vs T-bill at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (hold_days 3/7, leg_quantile 0.1/0.3) beat the T-bill bar, or the
  book does not beat it at costs x2.'
notes: 'Brief: short horizon (5 days), US single stocks, cross-sectional, mechanism test declared. Family reused
  on purpose: this is the same economic mechanism as H-0019 (trading-window-flows), so its trials count together.
  What is new is the event clock, which is exactly H-0019''s open question: H-0019 anchored on the quarterly SEC
  filing, which arrives days to weeks after the earnings release, after much of the window flow has already happened,
  and could not tell flow from filing-linked news. Real release dates (sec_8k_item202, K-0035) put the entry at
  the window opening. Reading of outcomes: (a) mechanism passes and the 1-3 day horizons carry most of the 21-day
  effect -> window flow is real and fast; (b) mechanism fails here although H-0019 passed -> H-0019 was filing/news
  drift, not window flow, and the family should be closed; (c) passes but strategy fails like H-0019 -> the flow
  exists but is too small for a stand-alone book (K-0027/K-0030), next step a tilt. Lessons applied: K-0024 (only
  mandated/structural flow events survived in large caps, this is one), K-0032 (event subject is a current LIQ-500
  member on the event date, every input is delivered for liq_n: sf1 and 8-K are sep-attached), K-0025 (placebo keeps
  the same stocks, so the repurchaser-vs-issuer style drift - value vs growth - is netted out by the placebo; only
  the timing at the release is tested). Not a refile of buyback yield or net issuance (H-0019 avoid list): the claim
  is about the post-release window, the score only signs the expected flow. Thresholds are quantiles, no tuned levels;
  leg_quantile 0.2 and hold 5 are round defaults. Known risks: ea_reaction_day misses firms that file releases under
  Item 7.01 (fewer events, survivor tilt); 10b5-1 plans dilute the window concentration; release-day news is not
  side-related by construction, but repurchasers may have systematically different earnings news (the placebo cannot
  remove a date-specific correlation of score and surprise; the 1-day horizon would show it as an immediate jump
  before flows build). Events start with the 8-K reform in 2004-08, so dev here is 2004-09 to 2020; with roughly
  500 members x 4 releases x 40 % in the legs, several thousand events on hundreds of dates are expected. No forward
  data for stocks: at most G4.'
