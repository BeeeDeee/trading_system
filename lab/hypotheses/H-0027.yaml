id: H-0027
version: 1
title: Release-anchored trading-window net flow - LIQ-500 dollar-neutral, at each real 8-K earnings release long
  net repurchasers and short net stock-compensation suppliers, hold 5 days
author_agent: scout
family: trading-window-flows
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Liquidity providers and short-horizon traders who sell to the repurchasing firm (or buy from selling
    employees and insiders) at a small price concession without conditioning on the corporate calendar; and the
    employees and insiders themselves, who sell vested shares for diversification, liquidity and taxes when the
    window opens, regardless of price.
  why: 'Most US firms forbid insiders and discretionary buyback desks to trade during a blackout that runs from
    a few weeks before the earnings release until one or two sessions after it (Bettis, Coles, Lemmon 2000: 78 %
    of firms have explicit blackout periods, and they suppress insider trading). Discretionary share repurchases,
    employee and insider sales of vested equity, and grants/vesting are therefore scheduled right after the release,
    when the window opens (Dittmann, Li, Obernberger, Zheng: the corporate calendar sets the timing of repurchases
    and equity compensation). A firm that is a large net buyer of its own stock (repurchases exceed issuance and
    stock compensation) re-enters the market as a price-insensitive buyer in the days after its release; a firm
    whose stock compensation is large relative to buybacks releases a wave of price-insensitive employee and insider
    selling at the same moment. Each wave is concentrated in a few sessions, so it should push prices (buyer up,
    supplier down) relative to other stocks over the first week after the release. H-0019 saw this spread when anchored
    to the 10-Q filing date, which lags the release by days to weeks; anchoring to the real release date (sec_8k_item202)
    puts the entry where the flow actually starts and separates window flow from filing-linked news.'
  why_not_arbitraged: The flow is a small share of daily volume in liquid names, so the concession per stock is
    a few tens of basis points at most; exact repurchase execution dates are not disclosed (only quarterly totals,
    months later), the spread requires shorting single stocks with idiosyncratic earnings-season risk, and capacity
    per name is small. 10b5-1 plans spread part of the flow across the blackout, which weakens but does not remove
    the post-release concentration.
signal:
  description: 'Inputs (all point-in-time, known at the close of day t): LIQ-500 membership on t; ea_reaction_day
    from sec_8k_item202 (1 on the first session whose close is at or after the EDGAR acceptance time of a primary
    8-K with Item 2.02); trailing-twelve-month fundamentals sf1_art_ncfcommon (net cash flow from issuance (+) /
    repurchase (-) of common equity), sf1_art_sbcomp (share-based compensation) and sf1_art_marketcap, as usable
    on t (day after the SEC filing date; on a release day these are still the previous filing''s values, by construction).
    Score: for every LIQ-500 member on t, net_flow = (-ncfcommon - sbcomp) / marketcap. Positive = the firm retires
    more stock than it hands out (net buyer); negative = net supplier of stock through compensation and issuance.
    sbcomp missing is treated as 0 (not reported before expensing became mandatory); ncfcommon or marketcap missing,
    or marketcap <= 0, means no score. If fewer than 100 members have a score on t, no event fires on t. Leg thresholds:
    the leg_quantile and 1 - leg_quantile cross-sectional quantiles of net_flow over ALL LIQ-500 members with a
    score on t (not only the announcers, so the thresholds do not depend on who reports that day). Event: after
    the close of t, stock j is an event if it is a LIQ-500 member on t, ea_reaction_day[t, j] = 1 and its net_flow
    is >= the upper threshold (side +1, long) or <= the lower threshold (side -1, short). Positions: an event enters
    at the open of t+1 and is held for hold_days sessions (exits at the open of t+1+hold_days). A new event on a
    stock already held restarts its clock with the new side. A stock that stops being tradable is closed at the
    next possible open; delisting returns as provided by the engine. Weights, recomputed after every close: long
    event names get +w_L each and short event names -w_S each, with w_L = min(0.05, 0.5 / n_long) and w_S = min(0.05,
    0.5 / n_short) (n = number of names currently held in the leg). The residual net exposure (sum of event weights)
    is offset by an equal-weight basket of all other LIQ-500 members (each gets -net / M), so the book is dollar-neutral
    and gross <= 1. With no open event the book is in cash. Decisions daily after the close, trades at the next
    open.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: After the close of day t, a LIQ-500 member has its earnings-release reaction session (ea_reaction_day =
    1) and its trailing net equity flow (-ncfcommon - sbcomp) / marketcap is in the top leg_quantile (side +1, net
    repurchaser) or bottom leg_quantile (side -1, net stock-compensation supplier) of all LIQ-500 members with a
    score on t.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
