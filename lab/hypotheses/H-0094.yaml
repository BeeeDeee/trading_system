falsification_criteria:
- 'Mechanism: entries to the top and bottom score legs (side +1 / -1) do not beat the 95th percentile of the time-shifted
  placebos at 5 sessions, or their gross side-adjusted abnormal return per event is below the round-trip cost (cost
  ratio < 1): the combination did not lift the sub-cost effects above cost, which extends K-0079 to a nonlinear
  composite.'
- 'Mechanism: the latest third of dev (about 2015-2020) has the wrong sign (K-0060 kill condition).'
- 'Mechanism shape: the 1-session horizon carries no part of the 5-session effect (the attention and drift components
  are front-loaded; a pure slow build means the score found a style, not the events).'
- Net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference below zero.
- Neighbors of n_estimators 100 or leg_fraction 0.1 fail G2 (fewer than 75 % beat the benchmark, or median neighbor
  Sharpe below 0.7 x primary).
- Net Sharpe at doubled costs below the T-bill benchmark (the book turns over about fully every five sessions).
- 'A ridge regression (framework ridge) on the same six features with the same label, refit schedule and book gives
  a net Sharpe within 0.10 of the gbm or better: the nonlinearity is not what pays.'
notes: 'Why this is not a re-run of dead cards: H-0030 (no-news reversal), H-0069 (attention give-back) and H-0028/H-0031
  (earnings-reaction drift) each tested one effect with a hand-written sort; the first two cleared the placebo bar
  but stayed under cost, the drift books lost to T-bills. K-0079 says conditioners changed significance, not size
  relative to cost. This card asks the one question those cards could not: whether a learned score that lets the
  slope of the move depend on the news state, volume and volatility is large enough at its extremes to clear cost.
  It is the lab''s first learned-model card and names its linear baseline. Family: filed under short-term-reversal
  because most non-release-season scores will be reversal of no-news moves; the earnings-drift part shares events
  with post-earnings-announcement-drift, so the Chair may prefer to count it there too. Forecasts (written before
  any result): scored members about 450-500 per day from late 2006 (the expanding window needs about two years of
  labels before the first fit; the exact start is the framework''s), legs of about 45-50 names each, so roughly
  90-100 events per date on about 3,300-3,500 dates in dev, i.e. 300,000-350,000 events. Round trip 6-12 bps (half-spread
  3 bps to rank 200, 6 bps to rank 500; the legs lean to ranks 200-500, so take about 10 bps). Expected gross side-adjusted
  abnormal return per event at 5 sessions: 8-20 bps (central 12), i.e. near cost; the placebo bar for a dense daily
  set should lie well below cost, so a failure will be a cost verdict, not a power one. Book arithmetic: with 12
  bps per 5 sessions per side the dollar-neutral gross-1 book earns about 6 %/yr gross; full turnover every five
  sessions at about 10 bps round trip costs about 4-5 %/yr, minus less for names that persist in a leg; net excess
  about 1-3 %/yr at 4-6 % volatility, Sharpe 0.2-0.6 against the 0.5 bar. So the most likely death is G1 on the
  absolute Sharpe floor or G2 on doubled costs, even if the mechanism passes. Mean exposure about 0.85 (flat until
  the first fit). Beta: the long leg will lean toward high-volatility recent losers, so the dollar-neutral book
  likely carries a small positive beta (K-0074); the event study compares raw returns with unmarked peers, so a
  beta gap between legs partly cancels because both sides are marked. G2''s alternative universe (S&P 500) will
  likely be weaker, as in H-0007. The publication-decay check (Chan 2003 precedes the period; Barber and Odean 2008
  falls inside) will compare 2004-2008 with later years. No dates, episodes or named stocks are used. Fixed hyperparameters
  (learning_rate, num_leaves, min_child_samples, subsample) are chosen small and round in advance, not tuned; only
  n_estimators and leg_fraction get a grid, so G2 refits the model only along n_estimators.'
