  kind: liq_n
  n: 500
mechanism:
  counterparty: On no-news days, impatient traders who demand liquidity with market orders and pay the concession
    to whoever takes the other side; after extreme moves, attention-driven buyers at the next open; after earnings
    releases, investors who underreact to the news and sell (buy) too early into good (bad) news.
  why: 'The sign of what follows a large stock-specific move depends on why it moved. Moves on an earnings-release
    session carry information that investors underreact to, so they drift in the same direction for days (the lab
    reproduced this on real 8-K dates: H-0028, H-0031, H-0033). Moves without an earnings release are on average
    order-flow pressure, so they partly reverse as liquidity providers who absorbed the imbalance are paid (H-0030
    cleared the placebo bar). Extreme moves of either sign also draw attention buying at the next open that gives
    back over the next sessions (H-0069 cleared the placebo bar in all thirds). Each of these effects is real in
    LIQ-500 but alone sits at or below the round-trip cost. They are partly independent and act on the same variable
    (the recent move) with opposite signs depending on the news state, so a single score that conditions the slope
    of the move on the release flag, on abnormal volume and on volatility should be larger at its extremes than
    any one-variable sort. The card tests whether that combination lifts the per-event gross above cost.'
  why_not_arbitraged: Each piece is small relative to the spread of a taker, so a single-signal book does not pay
    (K-0079); bearing the inventory risk of a high-volatility stock for a week is capital-intensive and rationed
    exactly when the concession is largest; telling news from no-news moves at scale needs filing-time data that
    many short-horizon traders do not condition on.
signal:
  description: 'Universe: point-in-time LIQ-500 members on date t. Timing: decisions after the close of day t with
    data up to that close (the 8-K flag of day t is known at the close of t by construction of the dataset); trades
    at the open of t+1. Daily total return r = (1+ret_co)(1+ret_oc)-1; residual return e = r minus the equal-weight
    mean r of the LIQ-500 members that day; vol63 = standard deviation of r over the last 63 sessions. FEATURES
    per stock and date (six, each z-scored across the members of that date by the framework helper; the 0/1 flag
    may be passed unscaled if the helper allows): (1) z1 = e_t / vol63; (2) z5 = sum of e over t-4..t / (vol63 *
    sqrt(5)); (3) ea5 = 1 if ea_reaction_day equals 1 on any session t-4..t, else 0 (NaN, i.e. before the firm''s
    first EDGAR filing, counts as 0); (4) ea_z = e / vol63 on the most recent session within t-4..t with ea_reaction_day
    = 1, 0 if there is none; (5) dv_ab = log(mean dollar_volume over t-4..t / mean dollar_volume over t-67..t-5);
    (6) lvol = log(vol63). A stock needs 68 sessions of history and a complete feature vector to be scored. LABEL:
    framework label, total return from the open of t+1 to the open 5 sessions later, ranked across the universe
    on each date (horizon_days 5, purge handled by walk_forward). MODEL: lab.framework.ml.walk_forward with model
    gbm (LightGBM), expanding training window, refit every 63 rows; fixed hyperparameters learning_rate 0.05, num_leaves
    8, min_child_samples 1000, subsample 0.5, colsample 1.0; n_estimators from the grid. Before the framework''s
    first fit there are no scores and the book is flat. BOOK (score_weights + only_on): every trading day a new
    cohort is formed from that day''s scores: long the top leg_fraction of scored members, short the bottom leg_fraction,
    equal weight inside each leg, each cohort carrying 1/5 of the book (0.1 long, 0.1 short gross per cohort), held
    for 5 sessions and then dropped; the book is the sum of the 5 live cohorts (gross 1.0, dollar-neutral). The
    engine trades only net weight changes, so a stock that stays in a leg across days is not traded again. Fewer
    than 50 scored members on a date: no new cohort that day. A stock that leaves LIQ-500 while held is closed at
    the first decision row on which it is not a member (K-0051). No other filters.'
  params:
    leg_fraction:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
  timeframes:
  - 1d
mechanism_test:
  event: After the close of t the stock is in the top leg_fraction (side +1) or the bottom leg_fraction (side -1)
    of the walk-forward model score among scored LIQ-500 members, i.e. it enters that day's long or short cohort.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'z1: day-t residual return (stock minus LIQ-500 equal-weight mean) divided by 63-day volatility; the size and
    sign of today''s stock-specific move, the variable whose next-week slope the mechanism says flips with the news
    state'
  - 'z5: residual return over t-4..t scaled by 63-day volatility times sqrt(5); slower order-flow pressure that
    liquidity providers are still unwinding over the week'
  - 'ea5: 1 if an 8-K Item 2.02 earnings-release reaction session (sec_8k_item202 ea_reaction_day) fell in t-4..t;
    the news state that separates information-driven moves (drift) from no-news pressure (reversal)'
  - 'ea_z: volatility-scaled residual return on the most recent release session in t-4..t, 0 if none; the market''s
    own measure of the earnings surprise (the reaction-drift input of H-0028)'
  - 'dv_ab: log of 5-day mean dollar volume over the prior 63-session mean; attention and order-imbalance intensity
    (an extreme move on heavy volume without news is the attention give-back case)'
  - 'lvol: log 63-day realized volatility of daily total returns; inventory risk of the liquidity provider, which
    scales the concession demanded for absorbing flow'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The mechanism is a sign flip and a V shape, which a ridge on the same six features cannot represent.
    (a) The slope of next-week return on the recent move z1/z5 is negative (reversal) when ea5 = 0 and positive
    (drift) when a release was in the window: a linear model fits one average slope that partly cancels the two.
    (b) The attention give-back hits both tails (extreme up and extreme down moves underperform next), a function
    of |z1| that is invisible to a linear term in signed z1; combined with reversal, large up-moves should be the
    clearest shorts and large down-moves weaker longs, an asymmetry. (c) The concession should grow with volatility
    and with abnormal volume only for no-news moves (a three-way interaction). Depth-3 trees (8 leaves) can express
    each of these; who pays is the same as in the mechanism (liquidity demanders on no-news days, attention buyers,
    earnings underreactors). If ridge on the same features with the same schedule and book is as good, the claim
    is false and the card measured plain reversal.'
