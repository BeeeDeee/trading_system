title: Macro-cleaned liquidity concession, learned - LIQ-500 beta-neutral weekly, ridge on 5-day returns split into
  a cross-asset ETF part and a residual, hold 5 days
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Traders who demand immediacy in a single stock for reasons unrelated to macro news (fund redemptions
    and inflows, index and risk rebalancing, stop and margin selling) and accept a temporary price concession; the
    liquidity provider who buys their sales and sells into their purchases for about a week collects it.
  why: 'A weekly stock move has two parts with different futures. The part explained by the stock''s exposure to
    other markets (Treasury yields, gold, commodities, the dollar) is public macro news that is priced by macro
    investors and should not revert (the lab''s only cross-asset stock pass, H-0114, even found a delayed continuation
    for oil). The part left after removing the market and the cross-asset factors is mostly non-macro order flow:
    fire sales, rebalancing and impatient trades in a single name, for which liquidity providers demand a price
    concession that reverts over days. Da, Liu and Schaumburg (2014) show that returns unexplained by fundamental
    news reverse far more than raw returns. A plain market-adjusted reversal sort mixes the two parts, so it fades
    informed macro moves in energy, miners, rate-sensitive and dollar-sensitive names and dilutes the concession.
    Using the other markets to clean the move should concentrate the book on the non-macro concession, which is
    the claim tested here.'
  why_not_arbitraged: Liquidity provision ties up capital in volatile names and its payoff is a small spread per
    trade that is roughly the size of trading costs; market makers hold inventory for minutes, not a week, and statistical
    arbitrage capital is scarce exactly when concessions are largest. Separating macro from non-macro moves needs
    per-stock exposures to several asset classes, which simple reversal funds do not compute.
signal:
  description: 'Data: daily total returns of the LIQ-500 point-in-time members (sharadar_sep) and of five signal-only
    ETFs from sharadar_sfp: SPY (US equity market), IEF (7-10y Treasuries), GLD (gold), DBC (commodity index) and
    UUP (US dollar). Daily total return = (1 + ret_co) * (1 + ret_oc) - 1 for stocks and ETFs alike; all inputs
    are known at the close of day t. Features are computed for all stock columns and masked per row to the members
    of that date (no ever-member column subsets, K-0134). (1) Exposures: on each weekly decision date t, for each
    stock, an OLS regression with intercept of its daily returns on the five ETF daily returns over the last beta_days
    sessions ending at t (at least 80 % of the window with valid stock and ETF returns, otherwise the stock is not
    scored that week). This gives beta_SPY, beta_IEF, beta_GLD, beta_DBC, beta_UUP and the daily residuals. (2)
    Features per stock at t, all from data up to the close of t: (a) cross-asset part of the 5-day move = sum over
    IEF, GLD, DBC, UUP of beta_k times the ETF''s 5-session cumulative return (sum of daily returns over sessions
    t-4..t); (b) non-macro residual 5-day return = stock''s 5-session summed daily return minus the summed fitted
    return of all five factors (intercept excluded); (c) non-macro residual 21-day return, same construction over
    sessions t-20..t; (d) idiosyncratic volatility = standard deviation of the regression residuals over the last
    63 sessions; (e) volume shock = log of mean daily dollar volume over sessions t-4..t divided by mean daily dollar
    volume over sessions t-67..t-5. Each feature is z-scored across that date''s scored members by the framework
    helper (winsorized at +-3 by the helper if it does). (3) Model: framework `ridge` (lab.framework.ml.walk_forward),
    alpha = framework default, label = total return from the open of t+1 to the open of t+6 (horizon 5), ranked
    across members per date by the framework, expanding training window, refit every 63 rows, training only on labels
    fully realized by the decision date (framework purge). Training rows are the weekly decision dates only. (4)
    Book: on the first trading session of each ISO week, after its close, score all scored members; long the top
    `top` fraction, short the bottom `top` fraction, equal weight within a leg. Beta-neutral leg sizes from the
    same regressions: with mean beta_SPY of the long leg bL and of the short leg bS, long gross a = bS / (bL + bS)
    and short gross 1 - a, a clipped to [0.3, 0.7]; if bL or bS is below 0.1 use 0.5 / 0.5. Gross exposure is 1.
    Trade at the next open, hold until the next weekly decision (about 5 sessions). A stock that leaves the universe
    mid-week is closed at the first decision row where it is no longer a member (engine rule, K-0051). Fewer than
    20 scored members, or no fitted model yet: flat (cash).'
  params:
    beta_days:
      grid:
      - 126
      - 252
      - 378
      value: 252
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a weekly decision date, a stock enters the long (top `top` fraction) or short (bottom `top` fraction)
    leg of the ridge score and was not in that same leg at the previous weekly decision; side +1 for long-leg entries,
    -1 for short-leg entries.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'Cross-asset part of the 5-day move: sum over IEF, GLD, DBC, UUP of the stock''s 252-day regression beta times
    the ETF''s 5-session return (macro news the stock carries; claim: no reversal, possibly drift as for oil in
    H-0114)'
  - 'Non-macro residual 5-day return: 5-session stock return minus the fitted return of SPY, IEF, GLD, DBC, UUP
    (order flow without macro news; claim: reverses)'
  - Non-macro residual 21-day return, same regression (slower part of the concession and separation from 1-month
    momentum)
  - 'Idiosyncratic volatility: 63-session std of the regression residuals (concessions scale with the risk the liquidity
    provider bears, Nagel 2012)'
  - 'Volume shock: log of 5-session over prior 63-session mean dollar volume (moves on heavy volume are more liquidity-driven,
    Campbell-Grossman-Wang 1993)'
  horizon_days: 5
  model: ridge
  retrain_every_days: 63
  why_not_linear: 'The claim is additive, so the model is linear on purpose: the non-macro residual should carry
    a negative weight, the cross-asset part a weight near zero or positive, and the split itself is the information
    taken from the other markets. The lab''s evidence in this exact area points the same way: the linear liquidity-provision
    score H-0115 cleared its mechanism test while nonlinear scores on similar inputs (H-0094 gbm, H-0103 TCN, H-0112
    gbm) found nothing or went wrong-signed, and K-0142 found no nonlinear gain over a ridge control in four cards.
    A gbm on these five features is the comparison, not the primary; if a tree were needed the claim would not be
    the simple decomposition stated here.'
