falsification_criteria:
- 'Mechanism: new entries into the long and short fifths of the ridge score do not beat the 95th percentile of time-shifted
  placebos at 5 sessions, or their gross side-adjusted abnormal return is below the round-trip cost.'
- 'Mechanism: the latest third of the dev window has the opposite sign to the pooled average (decay, K-0060), or
  fewer than two thirds share the sign.'
- 'Mechanism shape: the effect is largest at 10 sessions and still growing (slow drift), rather than building over
  the first sessions and easing by 10 (a concession).'
- Net Sharpe on dev below 0.5, or not above T-bills + 0.10, or the bootstrap bound of the difference below zero.
- Neighbors of top 0.2 or beta_days 252 fail the benchmark in more than a quarter of cases, or the median neighbor
  Sharpe is below 0.7 of the primary.
- Doubled costs leave net Sharpe below the T-bill bar.
- 'Cross-asset claim: a ridge on the plain market-adjusted 5-day and 21-day returns (beta to SPY only, same vol
  and volume features, same schedule) gives the same or a better entry gross; then the information from the other
  markets adds nothing and the card is plain reversal.'
- 'Cross-asset claim: the ridge weight on the cross-asset part of the move is as negative as the weight on the non-macro
  residual (both revert), so the split carries no information.'
notes: 'Closest fit to the brief (cross-asset, 1-5 days, learned): the signals from the Treasury, gold, commodity
  and dollar markets are what separates informed macro moves from non-macro order flow in US stocks, and the trade
  is in US stocks. I looked for a purer cross-asset transmission card and did not find one with a mechanism the
  lab has not already refuted: exposure-times-shock diffusion failed for rates, dollar, credit and non-oil commodities
  (H-0116, H-0119, K-0164), daily cross-market lead-lag died out of sample (mrel, K-0072), the TradFi-to-crypto
  stress gate died (H-0081), and crypto learned cards on a three-year dev window lose their first third to warm-up
  and have a placebo bar several times above a high round trip (H-0120, K-0163). US stocks give 2007-2020, about
  650 weekly dates and round trips near 10-12 bps. Family: short-term-reversal on purpose (liquidity provision),
  so the trials count there; this is a different information source as K-0160 asks (a cross-asset decomposition,
  not the intraday/overnight split of H-0115), plus a beta-neutral book (the short leg of H-0115 lost money, K-0074).
  Ridge, not gbm, because the lab''s nonlinear reversal scores all lost to linear (K-0142, K-0155); the brief''s
  interaction requirement is answered in why_not_linear by saying the claim is additive. Not a news filter on daily
  sorts (H-0030): weekly formation and hold, where H-0115 cleared cost. Forecasts (K-0120, K-0159): scoring starts
  about 2009 after the 252-session beta window and the first fit, so the first third (2007-03 to about 2011-09)
  holds about two and a half years of events. Events: about 500 members x 0.2 x 2 legs = 200 leg names a week, about
  80 % new entries, so roughly 160 a week x 600 weeks = 90000-100000 events on about 600 dates. Round trip about
  10-12 bps (half-spread 5 bps floor up to rank 200, 6 bps to 500). Gross per entry at 5 sessions: central 15 bps,
  pessimistic 3 bps, and about zero or negative if the concession in LIQ-500 is only the H-0115 volatile-half effect
  diluted. Book: always invested, gross 1, weekly; turnover about 80 % per leg per week, cost drag about 8-10 %
  a year of gross, so a net Sharpe of 0.5 needs a gross spread of roughly 15-20 % a year. Most likely death: like
  H-0115, mechanism passes and the net book misses the 0.5 floor; second, gross per entry under cost as in H-0117.
  Builder diagnostics I ask for (descriptive, if a channel exists): the ridge coefficients per refit; the share
  of leg entries that differ from a plain SPY-only residual sort and their mean 5-day return; event gross by third
  and by side. No date literals; ETF tickers are signal-only inputs declared above.'
