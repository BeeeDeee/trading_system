falsification_criteria:
- 'Mechanism: the 5-session abnormal return of entries (top-scored release rows, side +1) is not above the 95th
  percentile of the time-shifted placebos, or gross per entry is below the round-trip cost.'
- 'Mechanism: the latest third of dev has a negative mean abnormal return for entries (decay, K-0060), even if the
  pooled test passes.'
- Net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or below zero.
- Fewer than 75 % of the grid neighbours of n_estimators 100 and top 0.3 beat the benchmark, or doubled costs leave
  the Sharpe below SPY_TR.
- 'Ridge (framework ridge) on the same six features, rows, label and refit schedule gives entries with the same
  or higher 5-session gross: the nonlinearity (the attention interaction) is not what pays.'
- 'Entries on high-load sessions (load rank >= 0.5) or end-of-week sessions do not earn more than entries on the
  other sessions: the attention channel is absent and only plain reaction drift is left.'
notes: 'Why this is not a refile of H-0095 / H-0100 (same family, counted there): those cards ranked releases on
  the stock''s own reaction, gap and volume, with a cap-weighted core; K-0136 says a further learned release card
  needs a new information source, not a new learner. The new source here is the market-wide release load of the
  session and the end-of-week flag, a published attention channel never used in the lab, and the book has no core
  (the H-0100 lesson: a small sleeve on a core cannot move the margin). Expected sizes, stated before the run (K-0140):
  release rows in LIQ-500 about 1500-1800 per year with first scores roughly two years after the flag starts, so
  about 6000-8000 entries at top 0.3 on several hundred dates; round trip about 11-12 bps (pooled LIQ-500 tier).
  Exposure: about 85 % of releases fall in roughly 24 season weeks a year, so the book is near gross 1 in season
  and near 0.1-0.3 outside it: mean exposure about 0.45-0.55, entries far above 100, daily decision dates. Forecast
  gross per entry 15-35 bps over 5 sessions (an upper bound, K-0140). The Sharpe bar needs roughly 35 bps or more:
  the part-time book''s Sharpe is about its in-season Sharpe times the square root of the invested share. If the
  entries earn about a quarter of the forecast (5-8 bps), the card dies at the G1 cost check, and the lesson is
  that market attention load adds nothing to reaction drift in large caps. Beta: entries skew to positive reactions
  with roughly market beta, so the raw abnormal return against unmarked peers carries little market direction (K-0074);
  stated so a reader can judge it. Confounds named in advance: firms that report on quiet sessions are often late
  reporters (bad-news timing), and busy sessions are mid-season large firms; the coverage and volatility features
  absorb part of it, not all. Ridge control: the Builder should, if the framework allows, report the ridge entries''
  gross next to the gbm''s in G1 (K-0135); a load/end-of-week split of entries would answer the last criterion.
  No date literals; dates only through the data. No web search was needed for the two references.'
