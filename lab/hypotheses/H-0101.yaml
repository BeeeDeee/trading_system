id: H-0101
version: 1
title: Distraction-conditioned earnings-reaction drift, learned - LIQ-500 long-only 5-day slots in 8-K reactions
  ranked by LightGBM on reaction x market-wide release load
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors whose attention is used up by competing releases (and by the weekend) and who trade on
    the news days later at prices that have only partly adjusted; the strategy buys from those still selling the
    stale price after good news.
  why: 'Investors have limited attention. When an earnings release competes with many other releases on the same
    session, or falls on the last session of the week, less of the news is priced on the reaction session and more
    of it arrives over the following days (Hirshleifer, Lim and Teoh 2009; DellaVigna and Pollet 2009). In the lab,
    following the release-session reaction is the one short-horizon effect in liquid US stocks that cleared the
    placebo bar with gross above cost in every third of dev (K-0046, K-0083). Learned selections of which reactions
    drift (H-0095, H-0100) used only the stock''s own reaction, gap and volume. This card adds an information source
    never used in the lab: the market-wide attention load of the reaction session (how many other liquid firms report
    the same session) and the end-of-week flag. The prediction is a slope change: the same reaction drifts more
    in its own direction when attention is scarce.'
  why_not_arbitraged: Busy release sessions are the sessions when analysts, desks and liquidity providers are spread
    over the most names, so the capital and attention to correct each reaction is scarcest exactly then. The drift
    is small per name next to the round trip, so only a selective, part-time book can take it, which caps capacity.
signal:
  description: 'Decisions after the close of each session t using data up to that close; trades at the open of t+1.
    Release rows: universe members (PIT LIQ-500) with ea_reaction_day == 1 on session t (sec_8k_item202). Six features
    per release row: (1) standardized reaction = close-to-close total return of session t, (1+ret_co)(1+ret_oc)-1,
    minus the equal-weight mean of all universe members that session, divided by the standard deviation of the stock''s
    daily excess returns (same definition) over sessions t-63..t-1; (2) abnormal release volume = log of dollar_volume
    on t over the median dollar_volume of t-63..t-1; (3) log of the median dollar_volume of t-63..t-1 (coverage
    / size proxy); (4) 63-session realized volatility of daily total returns up to t-1. Features 1-4 are z-scored
    across the universe members of date t with the framework helper. (5) release load (date-level, not z-scored):
    n_t = number of universe members with ea_reaction_day == 1 on t; feature = percentile rank of n_t among the
    counts of sessions t-251..t (ties averaged), in [0, 1]; NaN until 252 sessions of flag history exist. (6) end-of-week
    flag (date-level, not z-scored): 1 if session t is the last XNYS session of its calendar week, else 0. Label
    (framework): total return from the open of t+1 to the open of t+1+horizon, ranked across the universe on each
    date, horizon = 5. Model: lab.framework.ml.walk_forward with gbm (LightGBM), num_leaves 8, learning_rate 0.05,
    min_child_samples 200, n_estimators from the grid, expanding window, refit every 63 rows, training and scoring
    restricted to release rows with all six features finite (row mask known at t; no column or row subset chosen
    with future information, K-0134); the framework purges unrealized labels and sets the minimum training sample,
    rows before the first fit are not scored. Entry: a release row on t is an entry if its score is at or above
    the (1 - top) quantile of the scores of all scored release rows in sessions t-62..t (this session included).
    Book (score_weights / only_on): each entry is held long for 5 sessions (bought at the open of t+1, sold at the
    open of t+6). Every active name gets weight min(0.10, 1 / n_active), recomputed each session, so gross is at
    most 1 and the rest is cash; no shorts, no hedge, no core. A name that leaves the universe is closed at the
    next decision row. Missing price or volume on t: the row is not scored.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.2
      - 0.3
      - 0.4
      value: 0.3
  timeframes:
  - 1d
mechanism_test:
  event: A universe member's 8-K earnings-release reaction session t on which its walk-forward gbm score is at or
    above the (1 - top) quantile of the scores of all scored release rows in sessions t-62..t (a book entry); side
    +1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'standardized release-session reaction: session-t close-to-close total return minus the universe equal-weight
    mean, over the stock''s 63-session excess-return volatility (the news the market priced on the release session)'
  - 'abnormal release volume: log(dollar_volume_t / median dollar_volume over t-63..t-1) (stock-level attention
    to this release)'
  - 'log median dollar_volume over t-63..t-1 (coverage and size: drift should be larger in less followed names)'
  - 63-session realized volatility of daily total returns to t-1 (uncertainty about value; scales how slowly news
    is absorbed)
  - 'release load: percentile rank of the number of LIQ-500 members reporting on session t within the trailing 252
    sessions, date-level (market-wide competition for attention, Hirshleifer-Lim-Teoh)'
  - 'end-of-week flag: session t is the last session of its calendar week, date-level (weekend inattention, DellaVigna-Pollet)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The attention claim is a change of slope, not a shift of level: on a busy or end-of-week session
    the drift should follow the sign and size of the reaction more strongly, and drift is expected only beyond a
    reaction threshold. A ridge on the same six features adds main effects: the release-load and Friday features
    are the same for every release on a session, so in ridge they move all of that session''s releases up or down
    together, whatever the sign of the reaction, and cannot make a good-news release more attractive and a bad-news
    release less attractive on busy days. A small tree ensemble can split on the reaction first and on attention
    second (reaction x load, reaction x low release volume). Who pays: inattentive investors who trade days later
    at stale prices. If ridge on the same rows does as well, the attention interaction is absent and the card is
    plain reaction drift already known to the lab.'
