falsification_criteria:
- 'Fewer than 300 trades in dev for the primary configuration (conservative, vwap target, x = 0.5): the setup is
  too rare to judge, and the card is dead as specified (not refuted).'
- Net Sharpe of the primary configuration on dev below 0.5, or the one-sided 75 % bootstrap bound of the mean net
  trade at or below zero.
- Costs take more than 60 % of gross per trade (cost share > 0.6). Gross per trade then sits too close to the 13
  bps round trip to survive doubled costs; this would match H-0137/H-0148 and say that VWAP re-entries carry no
  more than generic intraday noise.
- 'Mechanism: the same trades placed at random times (G2 random-entry control) do as well, i.e. the primary run
  is below the 95th percentile of random timing. A rotation toward VWAP that random entries with the same holding
  and direction mix also earn is not caused by the failed excursion.'
- 'Mechanism: fewer than 75 % of the grid neighbors are positive. In particular, if the aggressive entry or the
  opposite-band target loses while the primary wins, the effect is an artefact of one exit or entry rule, not a
  rotation through value.'
- A one-candle later fill keeps less than half of the primary Sharpe. The edge would then live in the first 5 minutes
  after the trigger, which a taker cannot capture.
- 'Fewer than 2 of 3 dev sub-periods positive, or one sub-period carrying over 60 % of the return: one regime (e.g.
  the 2021 range days) rather than a repeatable pattern.'
notes: 'owner_seed: VWAP-C3


  Relation to the family. This is the third card of session-vwap-bands-crypto after H-0147 (setup 1, continuation
  after acceptance outside value, rejected G1 g1_sharpe) and H-0148 (setup 2, fade a rejected test of the band edge
  from inside value toward VWAP, rejected G1 g1_sharpe). No Librarian lesson exists yet for either, so I do not
  know whether they failed on gross below cost (the pattern of K-0187/K-0189 for 15m taker rules) or on something
  else. The family name is kept, so this card''s trials count with theirs. What is new is the conditioning event.
  Setup 3 trades only after a completed excursion outside value (at least 3 closes outside plus a 0.5-sigma extension),
  followed by a re-entry and acceptance back inside. Its counterparty is the trapped excursion trader, not the band-edge
  tester of H-0148. If H-0148 died because fading the band edge from inside has no edge at taker cost, this card
  asks whether the stronger, rarer event (a failed excursion) carries more gross per trade. A failure here with
  H-0148 would close the "rotate back to VWAP" half of the owner''s VWAP Wave framework on BTC/ETH at taker cost.


  Choices I made where the owner''s text was open (fixed before any data, not tuned): (a) bands at V +/- 1.0 sigma,
  with sigma the volume-weighted standard deviation of the typical price around the session VWAP, session = UTC
  day, weights = estimated base volume qv/tp. If H-0147/H-0148 used another multiplier, this card still uses 1.0
  as written. (b) Bands valid from 02:00 UTC, because early-session sigma is near zero and would make every candle
  an excursion. (c) "At least 2 closes >= L since the return" is read as including the return candle, so the pullback
  b can be r+2 at the earliest. (d) tol = 0.25 sigma. (e) ATR = 14-candle simple mean of the true range. (f) Stops
  and targets trigger on intrabar touch and are filled at the next open (the engine is taker-only; a resting limit
  at the target would do better, so target exits are pessimistic). A same-candle stop and target counts as a stop.
  (g) Time exit at the session end and no signals after 22:00 UTC, because the target is a session-VWAP level. (h)
  Weight 0.5 per instrument, so gross <= 1. The owner''s two grid alternatives (aggressive entry, opposite-band
  target) are G2 neighbors together with the excursion distance (0.25 / 0.75 sigma): 11 neighbor runs. If G1 passes,
  the judge runs them, so they act as the owner''s controls (K-0193: controls exist only if the judge executes them).


  Forecasts (dev 2020-2022, 2 instruments, about 2190 instrument-sessions). Excursions with a re-entry: I guess
  0.4-0.8 per instrument-session over both sides, so about 900-1700 returns. The aggressive mode would trade most
  of them. The conservative primary needs acceptance, a held pullback and a trigger within 24 candles, which I put
  at 25-45 % of returns: about 250-700 trades (central about 450). The 300-trade minimum can therefore bind, and
  that is my second most likely death. Round trip on BTC/ETH: 2 x (5 + 1.5) = 13 bps plus funding. Gross per trade:
  the distance from entry near L to V is about 0.7-0.9 sigma, i.e. roughly 30-60 bps on BTC in 2020-2022, against
  a stop roughly 20-40 bps away. A fade needs a hit rate near 60 % to earn 15-20 bps gross. Central gross forecast
  12 bps per trade, pessimistic 0-5 bps, optimistic 25 bps. Holding about 1-3 hours. Most likely death: G1 with
  net Sharpe under 0.5 and gross per trade near the round trip, the same way the 15m taker rules (K-0187, K-0189)
  and probably H-0148 died. If G1 passes, the likeliest G2 failures are the one-candle delay (entries on a trigger
  close are momentum-sensitive) and the opposite-band neighbor (a far target turns a rotation trade into a trend
  bet).


  No mechanism_test: the intraday judge has none. The mechanism claim is checked by the random-timing control, the
  neighbor runs (aggressive entry, opposite-band target) and the sub-periods (see falsification criteria). No references:
  the idea comes from the auction-market / Market Profile trading literature (failed auction, return to value),
  not from a peer-reviewed paper with a decay date, and I do not want to cite a book edition I cannot verify. Data:
  binance_perp_5m is in the catalog with an intraday loader; nothing is missing. Explicit two-instrument list, so
  no point-in-time universe exits (K-0051). Intraday data has no forward source: the card can pass at most G4.'
