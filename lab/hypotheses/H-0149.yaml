mechanism:
  counterparty: Late breakout and momentum traders who entered in the excursion's direction once price had already
    closed outside the band (stop-entry orders, band-breakout and trend-following bots, liquidation-driven chasers
    on perps). After the re-entry their positions are under water against the session's value and they cover. The
    strategy is short that crowd's stop flow and long the responsive-value flow.
  why: 'Failed price discovery. The UTC-session VWAP and its volume-weighted standard-deviation bands mark where
    the session''s volume has transacted ("value"). When price leaves value, closes outside it for several candles
    and extends further, it is testing whether new prices attract trade. If that push then fails, so that price
    closes back inside the band and holds there, the move outside has been rejected. Participants who sold the breakdown
    below L (or bought the breakout above U) are trapped on the wrong side of value. Their stops and exits, together
    with responsive buyers (sellers) who treat the session VWAP as fair price, rotate price back through the value
    area toward V. The claim is conditional and sequential: excursion (time AND distance) -> re-entry -> acceptance
    back inside (two closes and a held pullback to the band edge) -> rotation toward VWAP. It is the mirror of setup
    1 (H-0147: acceptance outside continues) and differs from setup 2 (H-0148: fading a test from inside value with
    no prior excursion), because the trade needs trapped excursion participants.'
  why_not_arbitraged: The edge, if it exists, is small per event, needs intraday monitoring and taker execution
    through 13+ bps round trips, and is mixed with the opposite regime (H-0147's continuation days), where the same
    re-entry fails and the stop is hit. That makes it a noisy, low-capacity retail-style pattern that large arbitrage
    capital has little reason to harvest. On perps, leverage and liquidation keep making the overshoot-and- trap
    pattern happen.
signal:
  description: 'Data: Binance USD-M perps BTCUSDT and ETHUSDT, 5-minute candles (o, h, l, c, qv). Each instrument
    is handled independently. Decisions are made after every closed candle t using data up to and including t; fills
    are at the open of candle t+1. (1) Session VWAP and bands. A session is the UTC day 00:00-24:00. For each candle
    i of the session take the typical price tp_i = (h_i + l_i + c_i)/3 and the base-volume weight w_i = qv_i / tp_i.
    From the first candle of the session through candle t: V_t = sum(w_i tp_i) / sum(w_i); sigma_t = sqrt( sum(w_i
    (tp_i - V_t)^2) / sum(w_i) ); U_t = V_t + 1.0 sigma_t; L_t = V_t - 1.0 sigma_t. Bands are valid only from the
    24th candle of the session on (02:00 UTC). Before that no candle counts toward any setup. ATR_t = simple mean
    of the true range over the last 14 candles (true range = max(h, prev c) - min(l, prev c)); it rolls across sessions.
    (2) Long setup. All comparisons use each candle''s own bands. Excursion: a run of at least 3 consecutive valid
    candles with c_i < L_i in which at least one candle has l_i <= L_i - x * sigma_i (x = min_excursion_sigma).
    Return candle r: the first candle after such a run with c_r >= L_r. The run ends there, and the setup is armed
    on that return. (3) Entry, entry_mode = conservative (primary). After the return, every candle must close >=
    its L. The first close < L cancels the setup, and that candle may start a new excursion run. A pullback candle
    b is any candle with index >= r + 2 (so r and r+1 both closed at or above L) with l_b <= L_b + 0.25 sigma_b
    and c_b >= L_b. If a newer candle qualifies as a pullback before the trigger, b moves to it. The entry signal
    is the first candle s with b < s <= b + 6 and c_s > h_b. The setup expires if no signal happens by candle r
    + 24. At most one trade per return. entry_mode = aggressive (grid): the entry signal is the return candle itself
    (s = r). (4) Levels fixed at the signal. Stop: conservative = min(l_i for i in [b, s]) - 0.25 ATR_s; aggressive
    = l_r - 0.25 ATR_r. Target: V_s (target = vwap, primary) or U_s (target = opposite_band, grid). If c_s is already
    at or above the target, or at or below the stop, skip the signal (no trade). (5) Position: from the open of
    s+1, long with weight 0.5 of equity in that instrument (two instruments, so gross <= 1). Exit decisions are
    made after each closed candle k > s and filled at the open of k+1: stop if l_k <= stop; target if h_k >= target;
    if both happen in the same candle, treat it as a stop. Time exit at the end of the session: the decision after
    the 23:55 candle, filled at the 00:00 open. No new signal is taken whose candle s closes after 22:00 UTC. Any
    armed setup is cancelled at the session end, because bands reset. While a position is open in an instrument,
    new setups on that instrument are ignored. (6) Short setup: the exact mirror, with closes > U, a high >= U +
    x sigma, a return close <= U, a pullback h_b >= U - 0.25 sigma with c_b <= U, a trigger close < l_b, stop =
    max high since b + 0.25 ATR, and target V_s or L_s. (7) Missing or gap candles (repeated close, not tradable)
    do not count as excursion or acceptance closes. A gap breaks a run, and no fill happens on a non-tradable candle
    (the fill waits for the next real open). Funding is charged by the engine on positions held over a settlement
    candle.'
