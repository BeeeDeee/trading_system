title: BTC-led catch-up in non-following altcoins - after a 1-hour BTC jump of 3+ sigma, long each top-volume altcoin
  that did not rise (flat or down over the same hour), hold 4 hours
author_agent: human
family: btc-lead-altcoin-lag
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 12
mechanism:
  counterparty: Passive resting liquidity and slow market-maker quotes in the altcoin books, which sell at yesterday's
    relation to BTC while the leader has already moved, plus traders who sell the altcoin into the BTC move because
    it "has not moved yet" (and so fade the catch-up).
  why: 'BTC is the most liquid crypto market and the first one to absorb market-wide news and flows (macro surprises,
    ETF flows, large buyers). Altcoin perpetuals follow BTC with a beta above one, but a part of their order flow
    is slower: market makers re-quote less often on thinner books, and retail and momentum traders in smaller names
    react to their own chart rather than to BTC. When BTC makes an unusually large one-hour jump (3 or more of its
    own one-hour standard deviations), the altcoins that have not moved at all or have even fallen are priced off
    the new BTC level not at all; the unfinished adjustment is expected to be completed over the following hours.
    The deeper the divergence the larger the expected catch-up (in research 17 history trades with alt/BTC ratio
    < -0.5 averaged +1.2%, those with ratio 0-0.25 averaged -0.1%), so the strategy buys only the clearest non-followers
    and holds them for 4 hours.'
  why_not_arbitraged: Closing the gap needs fast quoting on dozens of thin books at once; market makers protect
    themselves by widening spreads exactly when BTC jumps, so the realised catch-up is partly eaten by spread and
    adverse selection. The gap is small relative to a 10-20 bps round trip, which is why most participants do not
    trade it. The edge, if real, is capacity-limited and probably decays (the pattern is easy to find and arbitrageurs
    are faster than a taker order filled at the next candle's open).
signal:
  description: 'Data: binance_perp_15m candles (o, h, l, c, real, listed, universe). Everything uses only candles
    closed up to and including candle t; the decision is made after the close of candle t and filled at the open
    of candle t+1. Leader = the BTC perpetual (instrument BTCUSDT). Followers = every instrument that is a member
    of the point-in-time universe at t (data.universe) except BTCUSDT and ETHUSDT (ETH is excluded on purpose: the
    rule was first found on ETH, see notes). Leader quantities at t: r_L = ln(c[t] / c[t-4]), the 1-hour log return
    of BTC; sigma = sample standard deviation (ddof = 1) of the 672 one-candle log returns ln(c[s] / c[s-1]) of
    BTC for s = t-671 .. t (7 days; no signal at t unless all 672 candles in the window are real); s_1h = 2 * sigma
    (the normal 1-hour volatility, sqrt(4) = 2). Follower quantity at t: r_F = ln(c_j[t] / c_j[t-4]). Entry signal
    for follower j at t (all must hold): r_L >= k_sigma * s_1h (a BTC jump UP; no short side); r_F < 0 (the follower
    fell over the same hour; r_F / r_L < 0 since r_L > 0. A follower with exactly r_F = 0 gives no signal); j is
    in the universe at t and listed; and the five candles t-4 .. t of j are all real (a gap-filled candle never
    produces a signal). Position (exact rows): if j is flat and its signal fires at row t, the target weight of
    j is +0.1 (one tenth of equity) on rows t .. t+hold_candles-1, i.e. exactly hold_candles decision rows, and
    0 on row t+hold_candles. The engine therefore fills at the open of t+1 and exits at the open of t+1+hold_candles
    (time exit only; no stop, no target). A signal on a follower that already holds a position is ignored (the hold
    is neither extended nor restarted); this includes a signal on row t+hold_candles, the exit row, so the earliest
    next entry decision for j is row t+hold_candles+1. Weight 0.1 per active follower keeps gross exposure at or
    below 1 with up to 10 followers (apply the framework''s gross normalisation only if more than 10 are held at
    once). Long-only. Funding is charged by the engine when a position spans a settlement candle; fees and slippage
    are the engine''s. The framework forbids holding non-members: on every row where j is not in the universe the
    target of j is 0 (a held follower that drops out of the top-12 ranking is closed at that row; the hold clock
    keeps running, so the entry-ignore rule above is unchanged and the position does not resume if j re-enters).
    Constants fixed by design and not on the grid: lag ratio 0.0 (do not widen it to 0.25 or 0.5 on purpose to pass
    a neighbour test), 4-candle (1-hour) window, 672-candle volatility window, weight 0.1.'
