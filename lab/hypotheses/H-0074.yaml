falsification_criteria:
- Net Sharpe on the 2020-2022 dev period is below 0.5 after the lab's costs, or there are fewer than 300 trades
  (G1).
- The mean net return per trade is not positive at the lab's bootstrap bound (G1).
- The result is not stable across the neighbours of k_sigma and hold_candles, or is not better than the same positions
  placed at random times (G2).
- Doubling the costs or filling one candle later removes the profit (G2).
- The effect lives in one of the three dev sub-periods only (G2).
- The 2023-2026 holdout shows a clearly negative net result (G4).
notes: 'PROVENANCE (read before the verdict). This is a post hoc selection. Research 17 fixed the rule LEAD_K3_LONG
  (lag ratio < 0.5) and the owner then back-tested 30 variants of it on 2020-05..2026-09 (qlab.research17.variants,
  docs/research17/FORWARD.md section 9). The best variant, V05_lag0 (this card), had 345 events, net Sharpe 1.25,
  bootstrap 90% CI 0.66-1.80, 0.88 at 20 bps per side, 0.89 with a fill two candles later and 0.90 in 2023-2026,
  but DSR is only 0.69 after correcting for 77 trials, and every variant is negative in 2022 and 2025. The pattern
  behind it (the weaker the altcoin''s reaction, the better the trade) is the reason for the card, not the number.
  Cumulative trials on these data are at least 89 (47 + 30 + 12), so the lab''s trial count undercounts, and the
  lab''s holdout 2023-2026 is not unseen. The rule is pre-registered for a separate forward test as research 18
  H1 (docs/research18/PREREGISTRATION.md, T0 2026-10-20, first decision 2027-10-19); this card does not touch it.
  PREDECESSOR: H-0040 (the same rule with lag ratio < 0.5) was rejected at G2 on the median neighbour Sharpe ratio.
  Expect the same fragility; this card tests whether the narrower condition fixes it. DEVIATIONS from research 18
  H1, imposed by the lab''s contract: (1) leader is the BTC perpetual, not BTC spot; (2) membership is the lab''s
  universe re-ranked daily by trailing 30-day quote volume, top 12 minus BTC and ETH (about 10 followers), not the
  fixed monthly top 10; (3) costs are the lab''s tiers (5 bps fee + 1.5-15 bps slippage) instead of a flat 10 bps
  per side; (4) fill at the next candle''s open instead of the signal candle''s close; (5) a follower that leaves
  the universe is closed early. The grid keeps k_sigma 2.5 and 3.5 and hold 12 and 24; do not narrow it.'
