id: H-0010
version: 1
title: Ex-dividend price pressure - LIQ-500 neutral, long payers before predicted ex-day, short just after, 5 days
author_agent: scout
family: dividend-month-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Dividend-seeking buyers who pay up to own the stock before the record date and then sell or stop
    buying after it, i.e. investors who treat the dividend as "free income" (the free-dividends fallacy) rather
    than a transfer of their own capital; the strategy sells to them before the ex-day and buys back from them after
    it.
  why: Investors who want dividends as income (retail income seekers, dividend-focused funds, dividend-capture traders,
    holders with tax or mandate reasons to own the dividend) concentrate their buying in the days before a stock
    goes ex-dividend and sell after it. This predictable, news-free demand pushes the price up as the ex-day approaches
    and lets it fall back afterwards. Hartzmark and Solomon document higher abnormal returns in predicted dividend
    months, with daily returns that rise into the ex-day and turn negative after it, larger where dividend demand
    is higher and liquidity lower; Lakonishok and Vermaelen show abnormal volume and the same pre/post ex-day return
    pattern from short-term trading. The dividend schedule is a slow (quarterly) clock that is predictable from
    the stock's own past distributions, so the slow timeframe tells which stocks are about to face this demand and
    the daily timeframe times the short entry and exit.
  why_not_arbitraged: The pressure is small (tens of basis points per stock per event) and spread over hundreds
    of names at staggered dates, so it needs a high-turnover, diversified book whose spread costs eat a large part
    of the edge; capturing it across the ex-day exposes arbitrageurs to dividend taxation and to idiosyncratic risk;
    the demand comes from investors with non-return motives (income, tax, mandate) that do not respond to the small
    price concession.
signal:
  description: 'Inputs per stock j (LIQ-500 point-in-time members, daily bars): total returns ret_co and ret_oc
    and the unadjusted close close_u. All decisions after the close of day t using data up to that close; trades
    at the open of day t+1. Trading days are XNYS sessions (row indices of the panel). (1) Distribution detection:
    total close-to-close return R(t) = (1+ret_co(t))*(1+ret_oc(t)) - 1; implied cash distribution d(t) = (1+R(t))
    * close_u(t-1)/close_u(t) - 1, computed only when j has bars on t-1 and t, both closes > 0 and |log(close_u(t)/close_u(t-1))|
    < 0.25 (no split day). Day t is a detected ex-day of j if 0.001 <= d(t) <= 0.10. (2) Regular quarterly payer
    (slow, 1q/1y timeframe): at a day t, j is a regular payer if it has between 3 and 5 detected ex-days in the
    last 252 trading days (inclusive of t) and its last two detected ex-days are 55 to 71 trading days apart. Predicted
    next ex-day E = last detected ex-day + (gap between the last two detected ex-days, in trading days). (3) Long
    set after the close of t (pre-ex window, daily timeframe): regular payers with E - W <= t+1 <= E - 1 and no
    detected ex-day after the one E was predicted from; they are held from the open of E - W to the open of E (W
    sessions). If an ex-day is detected earlier than E, j leaves the long set at the next open. (4) Short set after
    the close of t (post-ex window): stocks whose most recent detected ex-day x satisfies 1 <= t+1-x <= W and that
    are regular payers when evaluated at x (the detection at x included); they are held short from the open of x+1
    to the open of x+W+1 (W sessions). (5) Weights: +0.5 split equally across the long set and -0.5 split equally
    across the short set, re-equalized at each daily decision (gross 1, dollar neutral). If a leg has fewer than
    5 names, that leg is replaced by the equal-weighted basket of all other tradable LIQ-500 members not in either
    set (with the same sign and weight 0.5), so the remaining leg is hedged against the market; if both legs have
    fewer than 5 names the book is flat. A stock that is not tradable or leaves the universe is dropped at the next
    decision. Missing returns or closes mean no detection that day (never a filled value). If the loader''s ret_co/ret_oc
    do not contain dividends (total returns), detection is impossible and the Builder must raise rather than run.'
  params:
    window_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
  timeframes:
  - 1d
  - 1q
  - 1y
mechanism_test:
  event: 'Two event types on regular quarterly payers in LIQ-500. Pre-ex (side +1): after the close of day t, t+1
    is the first session of the W-session window before the stock''s predicted next ex-dividend day (t+1 = E - W).
    Post-ex (side -1): day t is a detected ex-dividend day (implied cash distribution from total vs unadjusted price
    return between 0.1 % and 10 %) of a regular payer. W = window_days.'
  horizons:
  - 1
  - 3
  - 5
  - 8
  - 10
  primary_horizon_days: 5
