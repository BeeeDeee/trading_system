falsification_criteria:
- 'Mechanism test: the side-adjusted 5-day abnormal return of the pre-ex and post-ex events does not exceed the
  95th percentile of the time-shifted placebos, keeps its sign in fewer than 2 of 3 sub-periods, or is smaller than
  the round-trip cost per event.'
- 'Mechanism: the pre-ex (side +1) events alone have a non-positive mean 5-day abnormal return on dev, i.e. there
  is no run-up into the ex-day (reported in the diagnostic by side).'
- Net Sharpe on dev below 0.5 (T-bill benchmark), or the bootstrap bound of the Sharpe difference vs T-bill is not
  above 0.
- 'Neighbors window_days 3 and 8: fewer than 75 % beat the benchmark, or median neighbor Sharpe below 0.70 of the
  primary.'
- Costs x2 leave a net Sharpe that does not beat the benchmark.
- 'Publication decay: Sharpe excess after the publication year 2013 is below half of the excess before it.'
- S&P 500 alt universe Sharpe below half of the LIQ-500 Sharpe.
notes: 'Brief fit: short horizon (5 trading days), US single stocks, cross-sectional, and multi-timeframe by construction:
  a slow quarterly/yearly clock (the stock''s own dividend schedule over the past 252 days) gates a daily entry
  and exit. Not in prior studies or the registry; calendar and flow effects are listed as untested in prior_studies.md.
  It is not a reversal of past returns (H-0007, studies 5-7: entries do not depend on any past return) and not a
  news-following event book (H-0009: the pre-ex window is predicted from the schedule before the event, and the
  dividend amount carries no news by then since it was declared weeks earlier). Unlike H-0008 (earnings dates proxied
  by volume seasonality, unvalidated), ex-dividend days are read exactly from the data: an ex-day is the only day
  on which the total return and the unadjusted price return differ by a small positive amount; the regularity rule
  (3-5 detections in a year, last gap 55-71 sessions) discards rounding noise and irregular special payouts. The
  Builder should report the share of LIQ-500 members flagged as regular payers per year as a sanity check. Placebo
  note: shifts of the event set by a multiple of about 63 rows land on the same dividend cycle, so part of the placebos
  are contaminated; this makes the mechanism gate stricter, not looser. Known risks: (a) costs - every event is
  a full round trip in about 5 sessions, so the edge per event must clear about 6-12 bps of spread (x2.5 before
  decimalization), x2 in G2; (b) the 2003 dividend tax cut and the growth of dividend ETFs may have changed the
  pressure over the dev period (sub-period gate); (c) the dividend cycle clusters by calendar month (many payers
  go ex in the same weeks), so leg sizes vary and the market-hedge fallback is needed in thin weeks; (d) publication
  2013 is inside dev, so the decay check bites. No date literals, no named stocks; universe is the point-in-time
  LIQ-500.'
