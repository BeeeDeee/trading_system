falsification_criteria:
- 'Mechanism: the 5-session abnormal return of the model''s top-half entries (side +1) against other members is
  at or below the 95th percentile of the time-shifted placebos, or its gross per event is below the round-trip cost,
  or fewer than 2 of the 3 dev blocks have the predicted sign.'
- 'Decay: the latest third of dev has a negative mean abnormal return for the entries (K-0060 kill condition), even
  if the pooled test passes.'
- Net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills at or below zero.
- Fewer than 75 % of the neighbors of top 0.5 and n_estimators 100 beat the T-bill bar, or their median Sharpe is
  below 0.7 of the primary.
- 'A ridge regression (framework ridge) on the same seven features, same event rows, same schedule and same top-half
  entry rule gives the same or a higher event gross and Sharpe: the nonlinearity is not what pays.'
- Post-publication (after 2012) Sharpe excess below half of the pre-publication excess (publication-decay check
  of Cohen, Malloy and Pomorski).
notes: 'Relation to the family. H-0012 (all first purchases after a quiet half-year, no selection) found no drift,
  which this card reads as dilution; H-0193 (91-day buying first above a fixed dollar amount, liquid-basket hedge,
  5 days) passed G1 and failed G2 because its threshold neighbors did not beat the bar. This card does not re-tune
  that threshold: it uses every new purchase filing as a candidate, replaces the hand threshold with a learned,
  size-relative and context-aware ranking, adds a beta-scaled hedge, and is filed in the same family so the trials
  count. H-0121''s ''no refile with insiders as an asymmetry marker'' concerns volume moves conditioned on insiders;
  here the filing itself is the event. FORECASTS (pessimistic first, K-0181): new purchase-filing events in LIQ-500
  about 250-700 per year; features need the 365-day window (filled from about 2009-01) and the first gbm fit, so
  scored events start about 2010; top-half entries about 125-350 per year, 1300-3500 over dev on several hundred
  dates. Round trip about 12 bps on the stock leg (us_equity tier), plus about 6-8 bps on the liquid hedge. Gross
  per entry: pessimistic 0-10 bps (H-0012 level, the model finds nothing), central 30-50 bps (H-0193 level for large
  buys). Book arithmetic (K-0098): about 2.5-7 open slots of 0.08 + hedge, mean exposure about 0.3-0.7 (lower in
  peak post-earnings weeks after the gross cap); per entry net about gross minus 18 bps on slot notional, so net
  Sharpe 0.5 needs a central-case gross; at 30 bps the book earns about 1-2 %/yr over T-bills with 4-6 %/yr vol,
  near the floor. Blocks: the first third of dev (2008 to about 2012-05) holds scored events only from about 2010,
  so it is thin and both later thirds should be positive (K-0163). Beta gap of entries vs unmarked peers in the
  raw event study: entries are recent losers with insider buying, expected beta about 1.1-1.2 against about 1.0,
  worth a few bps per week in up markets; the same-stock placebo absorbs stock identity (K-0025). If the ridge control
  wins, the conclusion is that insider information in large caps is the plain size and novelty effect; the card''s
  model claim is then dead and only a linear rule should follow. Likely deaths: gross under cost (large-cap filings
  priced within the two sessions before entry) or a weak latest third.'
