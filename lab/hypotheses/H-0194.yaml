id: H-0194
version: 1
title: Which insider purchases are informative, learned - LIQ-500, LightGBM ranks new purchase filings (size vs
  firm, routine buyer, sales, prior drop), long top half 5 days, hedged
author_agent: scout
family: insider-purchase-information
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'The sellers in the days after the filing: holders exiting a stock that has just fallen (trend and
    de-risking sellers, funds trimming losers), and investors who treat every Form 4 alike and so underreact to
    the informative ones. The insider is on the other side of them, with private information about earnings and
    value.'
  why: 'Open-market purchases by insiders are voluntary bets of their own money, and part of them is informed about
    firm value. But most purchase filings in large caps are not informative: token alignment buys by directors,
    routine buyers who purchase on a schedule every year, buys offset by other insiders'' sales. Averaged over all
    filings the signal is diluted to nothing (H-0012: first purchases after a quiet half-year, no drift), while
    a hand-picked large-purchase subset passed G1 in the lab (H-0193: trailing 91-day buying first above a fixed
    dollar threshold) and then failed because its threshold neighbors did not hold. The claim here is that the informative
    subset is identifiable from the filing itself (size relative to the firm, novelty of the buyer, absence of offsetting
    sales, a contrarian buy after a drop) and that the market prices filings of this subset incompletely in the
    first week after they become public, because investors do not separate opportunistic from routine insider trades
    (Cohen, Malloy and Pomorski 2012). The model''s job is to rank the filings; the mechanism claim is that its
    top half drifts up over the next five sessions against other members.'
  why_not_arbitraged: Each event is a single-name, idiosyncratic bet with a small expected gain against a large
    variance, events are sparse and cluster in post-earnings trading windows, and in large caps the gain per event
    is close to the round-trip cost, so dedicated capital is small; insider composites used by quant funds work
    at monthly horizons and do not separate routine from opportunistic filings at the filing week.
signal:
  description: 'Data: daily LIQ-500 point-in-time members (sharadar_sep total returns, dollar volume), sharadar_insiders
    open-market purchase/sale matrices (usable from the day after the SEC filing date, as the loader delivers them),
    sharadar_sf1 quarterly market cap (as reported, usable the day after its filing). Decisions after the close
    of day t with data up to that close; trades at the open of t+1. EVENT ROWS: stock j is an event at t if it is
    a LIQ-500 member and tradable at t, ins_buy_n_91d[t, j] > ins_buy_n_91d[t-1, j] (a newly filed open-market purchase
    became usable at t), and j had no event in the 5 sessions t-5..t-1 (a burst of filings counts once). Only event
    rows are scored, trained on and traded. FEATURES at event row (t, j), seven: (1) log(1 + ins_buy_value_91d);
    (2) ins_buy_value_91d / sf1_arq_marketcap; (3) ins_buy_n_91d; (4) ins_buy_n_365d - ins_buy_n_91d (purchase transactions
    92-365 days earlier, routine-buyer marker); (5) ins_sell_value_182d / sf1_arq_marketcap; (6) 21-session total
    return of j up to the close of t minus the median 21-session return of the members at t; (7) 63-session realized
    volatility of j''s daily total returns. Features 6 and 7 are z-scored across all members at t with the framework
    helper; the insider features (1-5) are fed raw because the training sample is event rows only. An event row
    with a missing feature (no market cap yet, under 63 sessions of returns, insider windows not yet filled in 2008)
    is neither scored nor used for training. LABEL: framework label, total return from the open of t+1 to the open
    of t+6 (horizon 5), ranked across all LIQ-500 members on date t; only labels fully realized by the decision
    date enter training (framework purge). MODEL: lab.framework.ml.walk_forward, model gbm (LightGBM), n_estimators
    per params (primary 100), num_leaves 8, min_child_samples 50, learning_rate 0.05, other settings framework defaults;
    expanding window, refit every 63 rows, trained on event rows only; framework seeds and minimum training sample
    (no score before the first fit). ENTRY: an event row with out-of-sample score s enters if s is at or above the
    (1 - top) quantile of the out-of-sample scores of all event rows in the 252 sessions strictly before t (primary
    top = 0.5, the top half); at least 50 such prior scored events are required, else no entry. BOOK (only_on the
    entries): at the open of t+1 buy j with weight 0.08 and short a hedge of 0.08 x beta_j spread equally over the
    50 LIQ-500 members with the highest 63-day median dollar volume at t (excluding stocks currently held long by
    the book); beta_j = 252-session OLS beta of j''s daily total return on the hedge basket''s equal-weight return,
    clipped to [0.5, 1.5], 1.0 if fewer than 126 sessions. Exit long and hedge at the open of t+6. A new event of
    a stock already held does not extend or add to the slot. If j leaves the universe or is not tradable, its slot
    closes at the first possible open. Gross cap 1.0: when open slots (long plus hedge) exceed it, all slots are
    scaled down pro rata that day. No position otherwise (cash earns T-bill).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.33
      - 0.5
      - 0.67
      value: 0.5
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 member with a newly usable open-market insider purchase filing at close t (no other such event
    in the prior 5 sessions) whose out-of-sample gbm score is in the top half of the scores of all such events in
    the trailing 252 sessions, i.e. exactly the book's entries; side +1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'log(1 + ins_buy_value_91d): dollar size of open-market purchases filed in the trailing 91 days (insider''s
    own-wealth conviction); sharadar_insiders, usable day after filing'
  - 'ins_buy_value_91d / sf1_arq_marketcap: purchase size relative to firm value (a large stake for the firm, not
    just a large check); sf1 market cap as of its last filing'
  - 'ins_buy_n_91d: number of purchase transactions in the trailing 91 days (repeated or clustered buying)'
  - 'ins_buy_n_365d - ins_buy_n_91d: purchase transactions 92-365 days earlier, routine-buyer marker (a buyer who
    buys every quarter is not trading on news)'
  - 'ins_sell_value_182d / sf1_arq_marketcap: offsetting insider sales in the trailing 182 days (other insiders
    disagree)'
  - '21-session total return minus the members'' median, up to close t: contrarian context (a buy after a drop is
    a disagreement with the market, a buy after a run-up is not)'
  - '63-session realized volatility of daily total returns: information asymmetry and arbitrage risk of the name'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The information in a purchase is expected to switch on, not to grow linearly: token buys carry
    nothing and the effect appears above a conviction size that depends on firm size (H-0193 found a fixed dollar
    threshold fragile; a tree can place the cut on size relative to market cap), the routine-buyer marker should
    switch the size effect off rather than subtract a constant, offsetting sales should cancel it, and the prior
    drop should matter only for large, non-routine buys (a contrarian bet), not for every buyer. A ridge on the
    same seven features can only add these effects, so it would credit a small routine buy after a drop and a large
    buy offset by sales as half-informative. Who pays: sellers of the beaten-down stock in the filing week and investors
    who price all Form 4 filings alike. If a ridge on the same features and events does as well, the information
    is the monotone size and novelty effect and the next card should be that plain linear score, not a tree.'
