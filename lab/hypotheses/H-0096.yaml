falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of window entrants placed in the long or short leg, open of t+1
  to close of t+5, is not above the 95th percentile of the time-shifted placebos, or gross per event is below the
  round-trip cost (about 10-12 bps in LIQ-500), or fewer than 2 of 3 blocks have the predicted sign.'
- 'Mechanism: the latest third of the dev event sample has a negative side-adjusted mean (K-0060): the card is then
  treated as dead even if the pooled test passes.'
- Net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference to T-bills at or
  below zero.
- Fewer than 75 % of the G2 neighbors of num_leaves 8 and leg_fraction 0.33 still pass, or the median neighbor Sharpe
  is below 0.7 of the primary.
- 'A ridge regression (framework ridge, same six features, same rolling window, refit schedule, book and leg_fraction)
  reaches the same or a higher net Sharpe and event abnormal return: the window-interaction claim is false and the
  effect, if any, is linear.'
- Net Sharpe at 2x costs not above 0.5 against T-bills (G2 cost stress).
notes: 'Why this is not a near copy. H-0093 (same family) used the same predicted-window rule with one sort on earnings
  seasonality and ended with gross about equal to cost; H-0064 (short-term-reversal) sorted on the 3-session pre-release
  return and passed the mechanism above cost but faded in the latest third; H-0094 combined reversal and news features
  on all days and stayed under cost. This card asks a different question that none of them could: whether earnings-information
  and liquidity features have a different slope INSIDE predicted release windows than on ordinary days, which is
  what both Bernard-Thomas and So-Wang imply and what a single sort cannot show. The pre10 feature overlaps H-0064''s
  mechanism; the Chair may count this card against short-term-reversal too. The family is anomalies-at-earnings-news
  because the core claim (known earnings information is priced at the next release) is that family''s mechanism.
  Linear baseline: ridge on the same six features with the same schedule and book; the card names it as a falsification
  criterion and asks the Skeptic or Librarian to have it run. Useful descriptive control if the framework allows:
  the same gbm score traded on non-window rows at the same count per date (should earn clearly less). Arithmetic
  written in advance (K-0053, K-0098, K-0120, K-0130). Events: LIQ-500 members with a real release one year earlier,
  about 1500-1800 window entrants a year from 2005-08 on (8-K data start 2004-08 plus one year), about half to two
  thirds placed in a leg at leg_fraction 0.33 and on days with both sides present: roughly 800-1100 events a year,
  12000-16000 in dev on about 2000-2600 dates (clustered in earnings seasons, few in the quiet weeks). Round trip
  from the cost tiers: 6 bps per side for ranks 200-500, 5 bps floor, so about 10-12 bps. The 5-session window return
  of an announcer has a standard deviation of roughly 6-8 %; a score with a rank IC of 0.03-0.05 among window entrants
  gives a side-adjusted gross of about 20-35 bps per event, 2-3 times cost; literature spreads are an upper bound
  and the realistic case is the low end. If gross is only about 15 bps the book cannot reach the 0.5 Sharpe floor:
  that is the most likely death. Exposure: cohort gross min(0.20, 0.02 x marked) with 5 overlapping cohorts; peak-season
  days hit the cap, quiet weeks are flat, so mean gross exposure is expected around 0.25-0.40 (forecast from the
  busiest and quietest weeks, K-0125), above the 0.20 floor. Expected net Sharpe if gross is 25 bps: about 0.8-1.0;
  at 15 bps: about 0.3. Hit rate of the predicted date is unknown (K-0035, K-0036): large caps keep stable release
  calendars, so the 364-day rule with a window covering P-1 to P+2 is expected to contain the real release for most
  entrants, but early 2005-2006 coverage gaps and firms that changed their calendar dilute it. A release that happens
  before the entry is removed by the 20-session rule. SF1 net income is as reported (ARQ) and stale values after
  400 days are NaN. Runtime: rolling 1260-row window on about 500 members is about 600k training rows, about 70
  refits from 2003 on, 100 trees of at most 16 leaves: a few minutes per run on the lab machine. RAM: three attached
  fields. The 1q timeframe refers to the quarterly fundamentals and the yearly release anchor; decisions are daily.'
