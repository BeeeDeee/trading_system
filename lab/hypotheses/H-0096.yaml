id: H-0096
version: 1
title: Release-window concentration of earnings information, learned - LIQ-500 dollar-neutral, LightGBM score with
  a predicted-8-K-window flag, trade only window entrants, hold 5 days
author_agent: scout
family: anomalies-at-earnings-news
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who anchor on a seasonal random-walk earnings expectation and are surprised in a predictable
    direction at the release, and traders who demand immediacy in the sessions before a release (pre-positioning,
    hedging, de-risking) and pay the inventory concession to whoever takes the other side.
  why: 'Prices underweight the time-series properties of quarterly earnings: seasonal earnings changes are positively
    autocorrelated at a one-quarter lag and negatively at a four-quarter lag, and a large part of the resulting
    mispricing is corrected at the next earnings release, when the actual number replaces the naive seasonal expectation
    (Bernard and Thomas 1990). Separately, liquidity providers demand a larger concession for absorbing order flow
    just before a release, because their inventory then carries jump risk, so pre-release price moves reverse more
    than moves at other times (So and Wang 2014). Both claims say the same features have a different, stronger slope
    inside the few sessions around a release than on ordinary days, and that the payoff scales with how large the
    release jump of the firm usually is. The card tests exactly that conditional structure: one model is trained
    on all stock-days with a release-window flag as a feature, and only window entrants are traded.'
  why_not_arbitraged: 'The trade is a short, jumpy bet on single-stock release sessions: idiosyncratic jump risk
    is large relative to the expected edge, it needs both legs (shorting announcers before a release is costly and
    risky), it is spread over thousands of small positions clustered in earnings seasons, and market makers'' capital
    is the scarce resource the reversal part is paying for.'
signal:
  description: 'Data up to the close of day t, decision after the close of t, trades at the open of t+1. Universe:
    point-in-time LIQ-500 members on t. PREDICTED RELEASE: for each stock, every past session r with ea_reaction_day
    = 1 predicts a release session P = the first XNYS session on or after r + 364 calendar days (same weekday one
    year later). WINDOW ENTRY FLAG win[t, j] = 1 if (a) session t is exactly 3 sessions before a predicted P of
    stock j (so the 5-session hold from the open of t+1 to the open of t+6 spans the reaction sessions P-1 .. P+2),
    and (b) stock j had no ea_reaction_day = 1 in the 20 sessions up to and including t (otherwise it already reported
    this quarter); win = 0 on every other row, and 0 where ea_reaction_day is NaN. FEATURES (six, per stock and
    date, all from data known at the close of t; the five continuous ones are cross-sectionally rank-normalized
    and z-scored across the members of date t with the framework helper; win is passed as 0/1 unscaled): win; sue1;
    sue4; ear1; pre10; vol63 (definitions in ml.features). A stock with any missing continuous feature is not scored
    on that date. LABEL: total return from the open of t+1 to the open of t+6 (horizon 5), ranked across the universe
    on each date (framework label). MODEL: lab.framework.ml.walk_forward with model gbm (LightGBM), trained on ALL
    member rows (window and non-window), rolling training window of 1260 rows, refit every 63 rows, framework purge
    and seeds. Fixed settings: n_estimators 100, learning_rate 0.05, min_child_samples 200; num_leaves is the grid
    parameter. BOOK (score_weights + only_on): each day t, candidates = members with win = 1 and a score. For each
    candidate take the percentile of its score among the scores of all members on t. Long the candidates with percentile
    >= 1 - leg_fraction, short those with percentile <= leg_fraction. A cohort is opened only if it has at least
    one long and one short; its gross is g = min(0.20, 0.02 x number of marked names), +g/2 split equally across
    the longs and -g/2 equally across the shorts (dollar-neutral per cohort). Each cohort is held 5 sessions (open
    of t+1 to open of t+6) and then closed; at most 5 overlapping cohorts, so gross <= 1.0. Weights of a stock in
    several cohorts add. A position whose stock leaves the universe is closed at the first decision row where it
    is no longer a member. No trades on non-window rows: the model''s score is used only for window entrants.'
  params:
    leg_fraction:
      grid:
      - 0.25
      - 0.33
      - 0.5
      value: 0.33
    num_leaves:
      grid:
      - 4
      - 8
      - 16
      value: 8
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: A LIQ-500 member is a release-window entrant (t is the third session before its predicted 8-K earnings
    release, last year's reaction session + 364 days, no release in the last 20 sessions) and its gbm score percentile
    among all members on t puts it in the long leg (side +1, percentile >= 1 - leg_fraction) or the short leg (side
    -1, percentile <= leg_fraction), on a day when both legs are non-empty.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'win: 0/1 flag, t is the third session before the stock''s predicted release (last year''s real 8-K Item 2.02
    reaction session + 364 calendar days) and no release in the last 20 sessions; the state in which the mechanism
    says the other features matter (sec_8k_item202)'
  - 'sue1: seasonal change in quarterly net income of the latest filed quarter, (sf1_arq_netinc as of t - sf1_arq_netinc
    as of 252 sessions earlier) / sf1_arq_assets as of t; the lag-1 surprise whose positive autocorrelation the
    market underweights (sharadar_sf1, usable the day after filing)'
  - 'sue4: the same quantity as known 189 sessions earlier (the seasonal change of the quarter one year before the
    quarter about to be reported); the lag-4 surprise with negative autocorrelation (sharadar_sf1)'
  - 'ear1: the stock''s return minus the universe mean return on its most recent ea_reaction_day session, divided
    by vol63 at that session; the market''s own measure of the last surprise, which also underreacts (sharadar_sep
    + sec_8k_item202)'
  - 'pre10: total return over the 10 sessions up to the close of t; pre-release liquidity demand that should reverse
    into the release (sharadar_sep)'
  - 'vol63: realized volatility of daily total returns over 63 sessions; the typical size of the stock''s release
    jump, which scales every payoff above (sharadar_sep)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  train_days: 1260
  why_not_linear: 'A ridge on the same six features applies one slope per feature to every stock-day; the win flag
    can only shift the level of window rows, and that level is cancelled by the cross-sectional label ranking and
    the dollar-neutral book. The mechanism is a slope change: sue1, sue4 and ear1 should predict much more strongly
    inside the release window (the mispricing is corrected at the release) than on the ~98 % of ordinary rows, pre10
    should reverse more strongly inside the window (inventory risk of liquidity providers before a jump), and all
    of it should grow with vol63 (a product, not a sum). Trees that split on win and vol63 first can express exactly
    these interactions with 8 leaves; a linear model cannot. Who pays: seasonal-random-walk anchored investors at
    the release and pre-release liquidity demanders. If ridge on the same features does as well, the window concentration
    claim is wrong.'
