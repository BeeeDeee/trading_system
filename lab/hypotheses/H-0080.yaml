falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of the events is below the 95th percentile of the time-shifted
  placebos, or gross per event is below the round-trip cost (G1 mechanism gate).'
- 'Mechanism: the abnormal return is negative in the latest third of dev (the decay pattern of K-0060); the card
  treats that as a refutation even if the pooled test passes.'
- 'Mechanism: the 10-session abnormal return is negative (the residual drop kept going: credit-specific news or
  persistent flow, not an overshoot).'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Strategy: max drawdown above 1.5 times the 60/40 drawdown (the slots buy credit during stress; this checks the
  falling-knife risk).'
- 'Robustness: fewer than 75 % of the neighbors (k_sigma 1.5 / 2.5, hold_days 3 / 7 and their combinations) beat
  60/40, or the book does not beat 60/40 at doubled costs, or one third of dev carries more than 60 % of the log
  excess return.'
notes: 'Brief fit: short hold (5 sessions, grid 3-7), cross-asset (the signal is the equity and Treasury markets''
  implied value, the trade is in credit/EM/muni/loan ETFs); FRED is not needed because same-close ETF anchors avoid
  the one-day next_morning lag of FRED yields.

  Family and difference from earlier cards: this is the etf-premium-arbitrage mechanism (wrapper price vs value
  of the claim), so it carries that family''s trials (H-0037, H-0043, H-0077, H-0078, H-0079). (1) H-0043 asked
  the same question with ICE BofA OAS as the anchor and got zero events because those series are empty in dev (K-0096).
  That anchor cannot be fixed, so this card replaces it with liquid, real-time anchors. This also removes the confound
  the H-0043 lesson named, an ETF that leads a stale evaluated index. The new main rival is genuine credit-specific
  news that SPY/IEF do not span, which predicts a negative sign (criterion 3). (2) H-0037 compared two wrappers
  of the same illiquid basket. Both carry the same discount, so the gap netted out exactly the common wrapper pressure
  this card targets (the lesson called it mostly noise). (3) The closed-end fund cards passed the mechanism test
  where no arbitrage exists. Here arbitrage exists but is constrained precisely on event days. This is the open
  question of whether the reversion also appears in ETFs.

  Known confounds, stated in advance: (a) K-0074 beta gap. The marked credit ETFs have a higher equity beta (roughly
  0.3-0.5 for HYG/JNK/EMB/BKLN, less for LQD/MUB) than the peer mean (SPY, IEF, SHY, AGG and the unmarked candidates,
  roughly 0.1-0.2). Events cluster in equity stress, so a generic equity rebound (K-0084) would also look positive.
  The 1- and 3-session horizons and the latest-third sign are the best available discriminators. (b) HYG and JNK
  are near-twins and will often fire on the same date, so the events are fewer independent dates than marked events.
  (c) The trailing-year sigma reacts slowly, so the first weeks of a stress episode can produce several events in
  a row (the falling-knife risk, criterion 5).

  Forecast, so the Librarian can check: first signals from about 2004 (LQD, the period starts 2003-01-02 and warm-up
  uses the card''s own period, K-0075), about 2008-2009 for HYG, JNK, EMB and MUB, about 2012 for BKLN; roughly
  75 instrument-years in total. Expected 300-450 marked events on 150-250 distinct dates (4-6 per instrument-year
  at z <= -2 with fat tails). The 3 unmarked peers per date (K-0086) are always met because SPY, IEF and SHY exist
  from the start. Book: mean exposure 1.0 (always invested, so the entry and decision-date minimums count rebalances),
  about 15-20 slot entries per year after the 2-slot cap.

  Expected gain against the required margin: if a slot earns about 0.3 % over IEF per 5-session hold, the tilt adds
  about 15-20 x 0.20 x 0.3 % = 0.9-1.2 %/yr gross. Slot costs are about 4 legs x 2-3 bps x 0.20 per slot, about
  0.05 %/yr, so they are negligible because these ETFs trade 0.3-2 bn a day. On a 60/40 book with about 9 % vol
  that is +0.10 to +0.13 Sharpe before the added stress-period risk of holding credit instead of IEF. The margin
  is reachable only if the per-event effect is at least about 0.3 %. A real effect below that is the most likely
  strategy death (the H-0033 / H-0046 pattern), and the mechanism verdict is the main output. No dates, episodes
  or tickers were chosen from performance knowledge. The candidate list is every liquid US ETF on an OTC-traded
  fixed-income basket with history in dev, except twins of the same index beyond HYG/JNK.'
