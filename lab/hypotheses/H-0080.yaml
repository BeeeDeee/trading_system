id: H-0080
version: 1
title: Credit-ETF liquidity overshoot vs SPY/IEF anchors - tilt a 60/40 book's IEF sleeve into a credit, EM, muni
  or loan ETF for 5 days after a 2-sigma residual drop
author_agent: scout
family: etf-premium-arbitrage
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - SHY
  - AGG
  - LQD
  - HYG
  - JNK
  - EMB
  - MUB
  - BKLN
  kind: instruments
mechanism:
  counterparty: Liquidity-demanding ETF sellers (tactical and retail investors, funds raising cash) who accept a
    price below the liquid-market-implied value to get out the same day, and positive-feedback ETF traders (Dannhauser
    and Hoseinzade) who amplify the move. The strategy is paid for providing them liquidity.
  why: ETFs on illiquid fixed-income baskets (high-yield and investment-grade corporates, EM sovereigns, municipals,
    leveraged loans) are liquid wrappers on assets that trade by dealer quote. Investors who need liquidity in a
    hurry (tactical allocators, retail, funds meeting redemptions) sell the ETF, not the bonds. The authorized participants
    who would close the gap are also the bond dealers. Redeeming means taking bonds onto a balance sheet that is
    already constrained in exactly these episodes, so arbitrage capacity falls when volatility and bond illiquidity
    rise (Pan and Zeng), and the ETF price is pushed below the value of the claim. The liquid markets that carry
    the same systematic risks, US equities (credit-risk factor) and Treasuries (rate factor), are not under that
    wrapper-specific pressure. A move of the credit ETF far below what the same-days SPY and IEF moves imply therefore
    contains a temporary non-fundamental part. It should recover over the following days as dealers redeem and as
    slower capital (bond funds, insurers, crossover investors) buys the discount. The signal comes from the equity
    and Treasury markets and the trade is in the credit-type ETF, so this is a cross-asset relative-value claim.
  why_not_arbitraged: The natural arbitrageurs (APs, dealers) are balance-sheet constrained exactly when the gap
    opens. Redemption delivers illiquid bonds that must be warehoused or sold into a one-sided market. Relative-value
    capital that could hedge with SPY/Treasuries faces basis risk (credit-specific news can keep going) and funding
    stress in the same episodes. Most bond holders have mandates that bar them from switching into the ETF for days.
signal:
  description: 'Inputs: daily total returns of all ten instruments from sharadar_sfp (close-to-close return of session
    s = (1 + ret_co_s) * (1 + ret_oc_s) - 1, ret_co_s being previous close to open of s and ret_oc_s open to close
    of s). Marked candidates (credit-type ETFs) C = {LQD, HYG, JNK, EMB, MUB, BKLN}. Anchors: SPY (equity / credit-risk
    factor) and IEF (rate factor). SHY and AGG are never traded by the book; they are in the universe only as unmarked
    peers for the event study.

    Residual model, per candidate j, after the close of each session t: estimate by OLS with intercept r_j,s = a_j
    + b1_j * r_SPY,s + b2_j * r_IEF,s + e_j,s on the 252 sessions s = t-256 .. t-5. The window ends before the 5-session
    signal window, so the signal window does not enter its own fit. Require at least 200 of these 252 sessions with
    all three returns present, else j has no signal at t. Residual sigma_j,t = standard deviation of the fitted
    residuals in that window. Signal window: sessions t-4 .. t (5 sessions). S_j,t = sum over the window of (r_j,s
    - a_j - b1_j r_SPY,s - b2_j r_IEF,s). All three returns must be present on all 5 sessions, else no signal. z_j,t
    = S_j,t / (sigma_j,t * sqrt(5)).

    Event: z_j,t <= -k_sigma, and j has had no event in the previous hold_days sessions (an event is counted whether
    or not the book takes it). A candidate that has fewer than 257 sessions of price history has no signal. Before
    that it is simply not eligible.

    Book (long-only, always fully invested): base target weights SPY 0.60, IEF 0.40 (the benchmark mix). Up to 2
    tilt slots of slot_weight = 0.20 each are taken out of IEF, so IEF is never below 0 and SPY always stays at
    0.60. On decision day t, new events are sorted by z ascending (most negative first) and fill free slots. A slot
    holds candidate j at weight 0.20 from the open of t+1 to the open of session t+1+hold_days, then returns to
    IEF. Events that find no free slot are dropped from the book. An instrument already held in a slot cannot take
    a second slot. If j stops having a price (not tradable) during a hold, its slot goes back to IEF at the next
    open. Targets are constant between slot changes, and the core is rebalanced to target on slot changes and at
    the first session of each month. Decisions after the close of t use only data up to that close and trade at
    the open of t+1.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    k_sigma:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: Credit-type ETF j (LQD, HYG, JNK, EMB, MUB or BKLN) closes session t with its 5-session total return at
    least k_sigma = 2 residual sigmas below what its trailing-year regression on SPY and IEF returns implies (z_j,t
    <= -2 as defined in the signal, fit window ending 5 sessions before t), with no event for j in the previous
    5 sessions. side = +1 (j should outperform the unmarked instruments). The unmarked peers on each date are SPY,
    IEF, SHY, AGG and the candidates without an event.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
