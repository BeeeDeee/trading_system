id: H-0032
version: 1
title: Fundamental anomalies resolved at earnings news - LIQ-500 dollar-neutral, long good-composite / short bad-composite
  stocks only in a 5-session window around their predicted 8-K release, hold 5 days
author_agent: scout
family: anomalies-at-earnings-news
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who anchor on headline earnings and past growth (earnings-fixated and growth-extrapolating
    holders, including retail and benchmark-hugging funds that do not trade on earnings quality); they are surprised
    in a predictable direction at the release and reprice the stock then.
  why: 'Several accounting anomalies (high accruals, low gross profitability, high asset growth) are best explained
    by biased expectations: investors extrapolate reported earnings and growth without weighting earnings quality
    and profitability, so firms with poor fundamentals are priced too optimistically and firms with good fundamentals
    too pessimistically. The bias is corrected when new earnings information arrives, so the anomaly spread is concentrated
    around earnings announcements (Engelberg, McLean and Pontiff 2018: anomaly returns about six times higher on
    announcement days; La Porta et al. 1997 and Sloan 1996 found the same concentration for value and accruals).
    If that holds in liquid stocks, a long/short composite held only in the few sessions around each stock''s own
    release earns a multiple of the always-on spread per day held, with a cost profile set by the window, not by
    monthly rebalancing.'
  why_not_arbitraged: The always-on anomaly spreads are slow, crowded at the monthly horizon and suffer long drawdowns;
    harvesting the concentrated part requires holding single names through earnings releases, which carries jump
    risk that risk-managed books avoid, and the window per stock is short, so capacity is limited. Large-cap effects
    are smaller than in all stocks, which is exactly what this card tests.
signal:
  description: 'Inputs (all point-in-time, decision after the close of session t, trades at the open of t+1): ea_reaction_day
    from sec_8k_item202; sf1 ART fields netinc, ncfo, assets, gp (usable from the day after filing, as delivered
    by the loader); universe membership of LIQ-500 at t. (1) Predicted release windows. For every stock, each session
    r with ea_reaction_day = 1 is a past release (known at the close of r). If two release sessions of the same
    stock lie within 10 sessions of each other, keep only the first. Predicted next-year release P(r) = the first
    XNYS session whose calendar date is on or after date(r) + 364 calendar days. The window is the 2*half_window+1
    sessions [P - half_window, P + half_window]. (2) Event date. The decision session is t = P - half_window - 1
    (the session before the window opens). The stock is eligible only if it is a LIQ-500 member at t, ea_reaction_day
    has no 1 in the 30 sessions up to and including t (the quarter''s release has not already happened early), and
    all three scores below exist at t. (3) Composite score at t, cross-sectional over all LIQ-500 members at t with
    all three inputs (no events on a date with fewer than 100 such members): accruals ACC = (netinc - ncfo) / assets;
    profitability GPA = gp / assets; asset growth AG = assets(t) / assets(t - 252 sessions) - 1 (both values as
    visible at those dates). Convert each to a percentile rank in [0, 1] among those members; SCORE = (1 - rank(ACC)
    + rank(GPA) + 1 - rank(AG)) / 3. Side +1 if SCORE is at or above the (1 - leg_quantile) cross-sectional quantile
    of SCORE on date t, side -1 if at or below the leg_quantile quantile, otherwise no event. The score is frozen
    at t for the whole window. (4) Positions. A stock with an event is held from the open of P - half_window to
    the open of P + half_window + 1 (2*half_window+1 sessions), long if side +1, short if side -1, regardless of
    when the actual release occurs. Each day after the close the book is: long leg = all open long windows, short
    leg = all open short windows; each leg gets 0.5 gross split equally among its names (dollar-neutral, gross 1).
    If either leg has fewer than 3 names the whole book is flat that day (no unhedged leg). Weights change only
    when a name enters or leaves a leg. A stock that delists inside its window takes the engine''s terminal return;
    a stock that leaves LIQ-500 inside its window is closed at the next open. Missing inputs (no 8-K history, no
    sf1 values) mean no event, never a silent zero weight elsewhere.'
  params:
    half_window:
      grid:
      - 1
      - 2
      - 3
      value: 2
    leg_quantile:
      grid:
      - 0.2
      - 0.3
      - 0.4
      value: 0.3
  selection_procedure: Primary configuration fixed in advance (half_window 2, leg_quantile 0.3); neighbors only
    for G2.
  timeframes:
  - 1d
  - 1q
  - 1y
mechanism_test:
  event: After the close of session t = P - half_window - 1, where P is a stock's predicted earnings-release session
    (last year's Item 2.02 reaction session + 364 calendar days, no release in the last 30 sessions), the stock's
    composite fundamental score (low accruals, high gross profitability, low asset growth) is in the top leg_quantile
    of LIQ-500 (side +1, should outperform over the window) or the bottom leg_quantile (side -1, should underperform).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
