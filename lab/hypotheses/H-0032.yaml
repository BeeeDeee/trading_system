falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is at or below the 95th percentile of the
  200 time-shifted placebos (same stocks and sides on other dates), i.e. the composite spread is not concentrated
  in the release window.'
- 'Mechanism: fewer than 2 of 3 sub-periods with a positive side-adjusted abnormal return, or the latest third negative
  (the anomalies are dead in liquid stocks after publication).'
- 'Mechanism: gross abnormal return per event below the round-trip cost of trading it.'
- 'Mechanism (read from the report, not a gate): event average no more than twice the placebo average; then the
  window adds nothing over an always-on composite and the concentration claim is refuted even if the gate passes.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills at or below
  zero.'
- 'Robustness: fewer than 75 % of the neighbors (half_window 1 and 3, leg_quantile 0.2 and 0.4) beat the benchmark,
  or costs x2 leave Sharpe below the T-bill bar.'
notes: 'Brief: short horizon (5 sessions), US single stocks, cross-sectional, mechanism test declared. Why this
  is not a near-copy: the event dates reuse H-0023''s date prediction (last year''s 8-K Item 2.02 + 52 weeks), but
  the claim is different. H-0023 (earnings-announcement-premium) went long all predicted announcers; here both legs
  are announcers in the same windows, so a premium common to announcers cancels, and the side comes from accounting
  fundamentals, not from the date. It is not post-earnings-announcement-drift either: no reaction or surprise is
  used, the position is taken before the release. If the Chair judges that the shared date prediction should count
  these trials with earnings-announcement-premium (as the Librarian argued for H-0026), I accept that; the economic
  mechanism (expectation errors on fundamentals corrected by news) is why I filed a new family. What the placebo
  tests: it keeps the same stocks and sides and shifts dates, so the always-on drift of the composite (the ordinary
  anomaly premium) sits in the placebo average; only concentration in the release window can beat it (K-0025). That
  is exactly the Engelberg-McLean-Pontiff claim, and the answer is useful beyond this card: if anomaly returns do
  concentrate at releases in LIQ-500, slow anomaly tilts could time their trades around releases. Known risks, stated
  in advance: (1) accruals and asset growth are reported to have weakened after the early 2000s, and dev here starts
  2005 (8-K data), so the latest third may be negative; (2) the date proxy''s hit rate is unknown (K-0035); a miss
  puts the window off the release and dilutes the effect toward the placebo; the Builder should log the share of
  windows containing an actual reaction session if any channel exists; (3) cost arithmetic (K-0042): about 1 000
  events a year, each about 1/24 of gross for 5 sessions; the book reaches the T-bill bar only if the effect is
  roughly two to three times the round-trip cost, so a mechanism pass with a strategy fail is a likely outcome and
  should be read as ''concentration exists, not tradable as a stand-alone window book''. Banks and others without
  gross profit in SF1 are not eligible (all three inputs required). Five attached fields (limit six). No date literals
  in the logic; the period only starts the data at the 8-K reform.'
