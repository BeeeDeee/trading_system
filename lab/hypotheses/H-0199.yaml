falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of events is not above the 95th percentile of the time-shifted
  placebos, or gross per event is below the round-trip cost: the disclosure is priced on the filing session in liquid
  US stocks and there is no tradable follower flow.'
- 'Mechanism: the latest third of dev (about 2014-2020) has a negative event average (declared kill condition, K-0060),
  even if the pooled average passes.'
- 'Mechanism shape: the 1-session average is negative and the 10- and 20-session averages are below the 5-session
  average; that is a reversal of the filing-day jump, the opposite of the claim.'
- 'Strategy: net Sharpe on dev below the T-bill benchmark Sharpe + 0.5 (absolute floor for a market-neutral book),
  or the bootstrap bound of the Sharpe difference at or below zero.'
- 'Robustness: the hold_days neighbours (3 and 8) do not beat T-bills by the floor, or net Sharpe at doubled costs
  is below the benchmark.'
- 'Count tripwire: fewer than 200 events or fewer than 30 event dates in dev, or mean exposure below 0.20; the card
  is then parked as untestable, not loosened (no change of the 252-session rule, the pinned filter or slot weight
  after seeing counts).'
notes: 'BRIEF FIT. The brief asks for 1-5 day cross-sectional US single stocks. After more than a hundred lab cards
  in that cell, dense price, volume, calendar, earnings-date, filing, insider, ownership and macro-mapping events
  are exhausted or under cost in LIQ-500 (K-0024, K-0083, K-0169, K-0201, K-0235, K-0237). K-0235 and K-0237 both
  say a further card there needs a NEW INFORMATION SOURCE. This card keeps the brief (LIQ-500, 5-day hold, mechanism
  test) and brings one: the third-party Schedule 13D disclosure, never used in the lab. It is a dated event with
  a public, time-stamped filing and an argued flow (wolf-pack followers buying after disclosure), the kind of non-earnings
  event K-0024 says still has a chance. WHY THE NEW DATASET IS ESSENTIAL: no loadable dataset identifies blockholder
  disclosures. sec_8k_items does not contain 13D (8-Ks are filed by the company itself); sharadar_13f is quarterly,
  lagged 46 days and starts 2013; sharadar_insiders holds Form 4 of officers and directors, mostly not 13D filers.
  A volume or price proxy would repeat the H-0008/H-0015 mistake. The data comes from the same free EDGAR source
  the framework already fetches for sec_8k_items. DIFFERENCE FROM DEAD FAMILIES: insider purchases (H-0012, H-0193,
  H-0194) are trades by managers with no stated intent to change the firm, filed within two days of routine trades;
  a 13D is an outside blockholder''s public statement of intent to influence, after a ten-day accumulation window.
  Non-earnings 8-K reaction drift (H-0034) followed the sign of a company-filed news day; this card does not condition
  on the reaction at all (long every first disclosure), so it is not reaction drift. Not the disposition, attention-volume
  or peer families either. FORECASTS (written before any data, K-0120): initial 13Ds on LIQ-500 subject companies
  are rare because 5 % of a large cap is expensive; I expect 15-50 events per year, 350-1000 in 1999-2020, on almost
  as many distinct dates (13Ds rarely share a date on the same universe). The 252-session first-disclosure rule
  and the pinned filter remove perhaps a fifth. Gross 5-session abnormal return: central +0.6 %, pessimistic 0,
  optimistic +1.2 % (the literature''s post-filing part of the 7 % window, smaller in large caps). Round trip of
  the event leg about 12 bps (5-6 bps half-spread tier, x2.5 before 2001-04), so the cost ratio is about 5 at the
  central case; the hedge adds about 10 bps per slot in the book only. Per-event 5-session abnormal standard deviation
  about 5 %, so with about 600 events the placebo 95th percentile should sit near +0.3-0.4 %, above cost: the central
  case clears it, the pessimistic does not; a miss with the bar above cost is a ''cannot tell'' (K-0034), a miss
  with a negative or zero average is a refutation for large caps. Beta gap (K-0074): 13D targets are typically underperforming,
  value-tilted mid and large caps with market beta near one, so the raw peer comparison should not lean much either
  way; the pinned filter removes the low-beta deal targets that would bias it down. BOOK ARITHMETIC (K-0064, K-0147):
  slot 0.20 long + 0.20 hedge; at 30 events a year and 5 sessions mean gross exposure is about 2 x 0.20 x 30 x 5
  / 252 = 0.24 (0.16 at 20 events a year, which would fail the 0.20 floor; this is the main structural risk, stated
  in advance). At a central net gain of 0.6 % - 0.22 % costs per event the book earns about 0.08 % of equity per
  event, 2.3 % a year, with about 1 % of equity idiosyncratic risk per event, about 5.5 % a year: Sharpe about 0.4-0.5,
  so the strategy needs the effect at the upper half of the forecast to clear the market-neutral floor of 0.5. Expected
  result by leg (K-0207): the long event leg earns, the liquid hedge earns about the market minus cash and costs
  a little. MOST LIKELY DEATHS: (1) the disclosure is fully priced on the filing session in liquid stocks (inside
  the placebo cloud); (2) too few events in LIQ-500 (count tripwire); (3) mechanism passes but the sparse book misses
  exposure or the Sharpe floor, as other sparse event books did. Holdout: stocks have no forward data, so G4 is
  the ceiling. Data caveats for the Archivist: the form-type change to SCHEDULE 13D in December 2024 is outside
  dev; CIK changes and reused CIKs can drop or mix filings, as in sec_8k_items (leans to survivors); some 13Ds are
  filed by founders, parents or lenders rather than activists, which dilutes the event set but does not bias its
  sign.'
