id: H-0199
version: 1
title: Activist 13D disclosure drift - LIQ-500, long a stock the session after an original Schedule 13D first names
  it as subject, liquid-basket hedge, hold 5 days
author_agent: scout
family: activist-13d-disclosure
asset_classes:
- us_equity
- alt
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Existing holders who sell into the filing-day jump or keep selling in the following days (index
    and long-only funds that do not trade on governance news, holders anchored to the pre-filing price) and liquidity
    providers who sell to the arriving followers and copycats at a price that does not yet reflect the expected
    campaign value.
  why: 'An original Schedule 13D tells the market that an outside holder has crossed 5 % of the shares with the
    intent to influence the company (board seats, buybacks, a sale, a break-up). The value of that intent depends
    on who the filer is, on the size of the stake and on whether other funds will join, and this is resolved slowly:
    Brav, Jiang, Partnoy and Thomas (2008) find abnormal returns of about 7 % over the window from 20 days before
    to 20 days after the filing, with no reversal over the next year. Wolf-pack theory (Brav, Dasgupta and Mathews
    2022) adds a flow: part of the followers of a lead activist buy only after the stake is public, so the days
    after the filing carry predictable follower buying. The claim of this card is the part that comes after the
    filing session: from the next open, a stock first named in a 13D outperforms the other liquid stocks over a
    week, because the disclosure is not fully priced on the filing session and follower demand arrives afterwards.'
  why_not_arbitraged: The campaign value is hard to judge within a session (filer quality, stake size, demands in
    Item 4 of the filing are text, not numbers), the outcome is uncertain and lumpy (failed campaigns, withdrawals),
    each event is a single-stock idiosyncratic bet that a diversified arbitrageur cannot pool quickly, and events
    are rare in large caps, so few desks specialize in trading 13D disclosures in liquid names. Whether this is
    still true for the most liquid US stocks is exactly what the mechanism test decides.
signal:
  description: 'Data: sharadar_sep total returns (ret_co, ret_oc), close_u, dollar_volume, tradable and extras liq_rank;
    sec_13d_initial flag sc13d_reaction_day (new dataset, see data_requirements); sec_8k_item202 flag ea_reaction_day.
    Decisions after the close of each session t using data up to that close; trades at the open of t+1. EVENT on
    stock j at t: (1) sc13d_reaction_day[t, j] == 1 (an original Schedule 13D, not an amendment, naming j as subject
    company, accepted by EDGAR after the close of t-1 and at or before the close of t); (2) j is a LIQ-500 member
    and tradable at t; (3) no earlier original 13D on j in the 252 sessions before t (only the first disclosure
    of a campaign or wolf pack counts; later filers on the same stock are ignored for 252 sessions); (4) ea_reaction_day
    of j is not 1 on t or t-1 (NaN, before 8-K coverage, counts as not 1); (5) pinned-price filter: j is not an
    event if the standard deviation of its daily total returns over sessions t-4..t is below one third of the standard
    deviation over sessions t-80..t-21 (a price pinned to a deal price is the signature of a pending cash takeover,
    where the 13D comes from the acquirer, not from an activist). Missing returns in either window make the stock
    not an event. BOOK (dollar-neutral event slots): at the open of t+1 buy each new event stock with weight 0.20
    of equity and short 0.20 of equity spread equally over the 100 most liquid LIQ-500 members at t by liq_rank,
    excluding stocks currently held long by the book (the hedge of a slot is fixed at entry). Each slot is held
    hold_days sessions and closed at the open of session t+1+hold_days (long and its hedge together). If the sum
    of open long slots would exceed 0.50 of equity, all slots are scaled down proportionally so that gross exposure
    stays at or below 1.0. If an event stock (or a hedge name) leaves the universe or stops being tradable before
    the scheduled exit, its weight is closed at the next open on which the engine accepts it; a delisting is settled
    by the engine''s terminal return. Between events the book is in cash. No other parameter is fitted.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
  timeframes:
  - 1d
mechanism_test:
  event: 'Stock j is an EVENT at t as defined in the signal (first original Schedule 13D in 252 sessions naming
    j as subject, reaction session t, j a tradable LIQ-500 member, not an earnings-release session at t or t-1,
    price not pinned). side = +1 for every event: the mechanism says j outperforms the other members from the open
    of t+1. No stock is marked -1; the unmarked members are the comparison.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
