- dataset: sec_13d_initial
  description: 'NEW stock-attached dataset (free, public SEC EDGAR), built like sec_8k_items. Original Schedule
    13D filings (form type SC 13D, and SCHEDULE 13D after the 2024 EDGAR form change; all amendments SC 13D/A excluded;
    13G filings excluded) assigned to the SUBJECT company''s CIK, mapped to sharadar_sep stocks through the same
    CIK mapping as sec_8k_item202 / sec_8k_items. Daily (T, N) flag sc13d_reaction_day: 1 on the reaction session
    (first XNYS session whose 16:00 ET close is at or after the EDGAR acceptance time of the filing), 0 on other
    sessions, NaN before the company''s first EDGAR filing. The subject role matters: a stock whose company is only
    the FILER of a 13D on another company must not be flagged (take the role from the filing header SUBJECT COMPANY
    block, or from EDGAR''s subject/filer role in the index). Candidate sources: the per-CIK submissions files already
    fetched for sec_8k_items (they list 13D filings made about the company) plus the filing header for the role,
    or the EDGAR quarterly full index (form.idx) plus headers. Coverage wanted from the start of electronic 13D
    filing (1996-1998) to 2020 at least.'
