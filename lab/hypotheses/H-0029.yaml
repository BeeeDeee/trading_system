title: 'Turnover-conditioned short-term momentum - LIQ-500 dollar-neutral, weekly: among the highest-turnover stocks
  of the past month, long the past-month winners and short the past-month losers, hold 5 days'
author_agent: scout
family: short-term-momentum
asset_classes:
