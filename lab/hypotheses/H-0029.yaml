universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors who treat every monthly move as noise and trade against it: disposition-prone holders
    who sell recent winners early and hold losers, contrarian liquidity providers and mean-reversion books that
    fade large moves, and slow-updating investors who anchor on old prices instead of reading the information in
    heavy trading. They keep doing it because fading moves pays on average in the low-turnover majority of the market,
    and the two kinds of move are hard to tell apart without conditioning on turnover.'
  why: 'Medhat and Schmeling (2022) show that the one-month return effect splits by share turnover: low-turnover
    stocks show the familiar short-term reversal, while high-turnover stocks show short-term momentum, and the momentum
    is strongest among the largest, most liquid, most covered stocks. The reading (with Llorente, Michaely, Saar
    and Wang 2002) is that a month of heavy trading signals that the price move was driven by information, not by
    a liquidity shock. Part of the market does not extract that information from prices and order flow, so prices
    under-react and the move continues. A low-turnover move is a liquidity shock that reverses. This also fits the
    lab''s own record: reversal books in liquid stocks were fragile and vanished among S&P members (study 5, H-0007,
    K-0012). In a universe where most monthly moves are high-turnover, the continuation part offsets the reversal.'
  why_not_arbitraged: 'It is a momentum-type bet with the same crash risk as price momentum: sharp losses when beaten-down,
    heavily traded losers rebound in market recoveries. That limits how much leverage arbitrageurs can put on it.
    It needs weekly or monthly turnover in a long/short book, so capacity is limited and costs matter. It is also
    crowded together with conventional momentum and reversal factors, which pull in opposite directions at a one-month
    horizon. The publication is recent, so it has not been arbitraged for long.'
signal:
  description: 'Decision dates: the last trading session of each calendar week (normally Friday), after its close,
    using data up to that close only; trades at the open of the next session. Eligible stocks at decision date t:
    members of the point-in-time LIQ-500 universe on t that are tradable on t, have total returns for each of the
    last formation_days sessions and have a usable sf1_arq_marketcap value on t. (1) Formation return R: compounded
    total return over the last formation_days sessions, from the close of t - formation_days to the close of t,
    built from ret_co and ret_oc. (2) Market cap M_t: sharadar_sf1 marketcap is frozen at the filing date, so roll
    it forward with the stock''s own price: M_t = sf1_arq_marketcap(t) x I(t) / I(s), where I is the stock''s cumulative
    total-return index (product of (1+ret_co)(1+ret_oc)) and s is the first session on which the current marketcap
    value was usable. This makes M_t split-invariant and current. (3) Turnover TO: sum of dollar_volume over the
    same formation_days sessions divided by M_t (share turnover of the formation window, in dollars). (4) Dependent
    sort: take the eligible stocks whose TO is in the top `quantile` of the eligible cross-section (the high-turnover
    group). Within that group, the long leg is the stocks whose R is in the top `quantile` of the group and the
    short leg is the stocks whose R is in the bottom `quantile` of the group. Ties are broken by stock id. (5) Weights:
    long leg +0.5 / n_long each, short leg -0.5 / n_short each (dollar-neutral, gross 1). If either leg has fewer
    than 5 stocks, hold nothing until the next decision date. Target weights are set only on decision dates and
    carried forward unchanged until the next one (no intra-week re-selection). A stock that becomes untradable or
    leaves the universe between decision dates is closed by the engine at the next possible open and not replaced
    until the next decision date. Delistings take the dataset''s terminal return. No other filters, no beta or sector
    neutralisation, no market-timing overlay.'
  params:
    formation_days:
      grid:
      - 15
      - 21
      - 30
      value: 21
    quantile:
      grid:
      - 0.15
      - 0.2
      - 0.25
      value: 0.2
  timeframes:
  - 1d
  - 1w
  - 1mo
mechanism_test:
  event: 'At a weekly decision date t (last session of the week, after the close), a stock is selected into the
    long leg (side +1: high past-month turnover and top past-month return within the high-turnover group) or into
    the short leg (side -1: high past-month turnover and bottom past-month return within that group), exactly as
    in the signal with the primary parameters (formation_days 21, quantile 0.2). Every selected member counts as
    one event on that date, whether it is new to the leg or held over.'
