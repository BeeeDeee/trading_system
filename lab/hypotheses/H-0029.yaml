falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of leg members (next open to close of t+5, minus the same-date
  mean of other stocks) is below the 95th percentile of the 200 time-shifted placebos, or has the same sign in fewer
  than 2 of 3 sub-periods, or its gross per event is below the round-trip cost.'
- 'Mechanism (turnover conditioning): the same winner-minus-loser sort run inside the lowest-turnover group at the
  same dates earns a 5-day side-adjusted return at least as high as inside the highest-turnover group. If so, turnover
  does not separate continuation from reversal and the claim is false (descriptive, reported if the framework has
  a channel for it).'
- 'Mechanism (era): the latest of the three sub-periods has a negative side-adjusted 5-day abnormal return. That
  would mean the effect is a pre-decimalization or early-era artefact like the reversal studies.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the one-sided bootstrap bound of
  the Sharpe difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (formation_days 15/30, quantile 0.15/0.25 and their combinations)
  beat the benchmark, or the median neighbour Sharpe is below 0.7 x the primary.'
- 'Costs: at 2x costs the net Sharpe no longer clears the benchmark bar.'
- 'Concentration: more than 60 % of the dev log return comes from one of three sub-periods.'
notes: 'Brief fit: US single stocks, cross-sectional (LIQ-500), decided once a week, each selection held 5 sessions,
  mechanism horizon 5 days. The source paper measures a one-month formation and a one-month hold. Here the formation
  window rolls weekly, so decisions and the gated horizon are short. Held-over names stay in the book, so the effective
  holding of a persistent name can be longer and turnover is below a full weekly rotation. Horizons 10 and 21 are
  descriptive, to show whether the effect is still building at 5 days. Relation to dead families (please check).
  (a) Short-term reversal (study 5, H-0006, H-0007): this is the opposite sign claim, on the subset where the paper
  says reversal is replaced by continuation. It is not a reversal with a new filter. The family is named short-term-momentum
  for that reason. If the Chair prefers to count it with short-term-reversal (same formation return), I accept that.
  (b) H-0009 (follow single-day volume-shock moves, 5-day hold, lost): different formation. A one-day news shock
  is noisy and partly reverses, while a month of high share turnover is the paper''s information signal. H-0009
  is still a warning that the first week after a high-volume move can reverse, which is why the mechanism criterion
  on the 5-day horizon is decisive and the longer horizons are reported. (c) H-0014 (abnormal-volume visibility
  premium, flat): here turnover predicts no direction by itself. It only conditions the sign of the return effect,
  and both legs are high-turnover stocks, so a pure volume or attention premium cancels. (d) Study 1 (momentum/reversal
  ensembles): those used conventional 12-1 momentum and plain reversal, not the turnover split. Turnover uses sf1_arq_marketcap
  rolled forward by the stock''s own total-return index, because SF1 valuation fields are frozen at the filing date
  and raw shares x unadjusted price breaks at splits. One attached field only. Known risk: momentum-type crashes
  in sharp market rebounds, when heavily traded losers rally. The book is dollar-neutral, not beta-neutral, so in
  such episodes the short leg carries more beta. This is part of the test, not something to tune away. The reference
  year (2022) is after dev, so G2''s publication-decay check cannot run in dev. The holdout is the only out-of-publication
  check, and the literature prior adds its trials in G3. No new datasets needed.'
