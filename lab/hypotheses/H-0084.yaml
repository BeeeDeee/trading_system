falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the leg members versus the other eligible ETFs is
  not above the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of the dev event study has the wrong sign (the decay pattern of K-0060): the card
  is then considered refuted even if the pooled result passes.'
- 'Mechanism shape: if the 5-session abnormal return is larger than the 60-session one, the effect is a quick post-stress
  bounce or reversal (K-0084), not a premium earned over months, and the card''s mechanism is wrong.'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference to T-bills
  not above zero.'
- 'Robustness: fewer than 75 % of the parameter neighbors (n_per_leg 2 and 4, rv_days 10 and 42) reach the T-bill
  bar, or the result turns negative at doubled costs.'
- 'Sub-periods: fewer than two of three dev blocks beat T-bills, or one block carries more than 60 % of the log
  return.'
notes: 'Brief fit: horizon medium (cohorts held three months, primary horizon 60 sessions), cross-asset (signal
  from the options market via FRED/CBOE implied-vol indices, trades in the underlying ETFs of five asset classes:
  US equity, EM equity, energy, precious metals and miners, the euro). Long/short across classes with gross <= 1,
  a gap listed in prior_studies. Relation to earlier work and honest family: H-0055 (VRP tilt of SPY against IEF)
  is the same mechanism and ended as a near miss with the right sign in every third, gross well above cost, but
  too few independent episodes; its lesson says more equity-bond pairs add events but not episodes and that implied
  variance measured directly was the missing input. This card measures implied vol directly per asset and uses asset-specific
  fear episodes for breadth; it is filed under variance-risk-premium-timing so the trials count together. It is
  not a short-VIXY carry rule (K-0088): nothing here holds a volatility product, and the relative design nets the
  common component. It does not use VIX level, realized-vol-only or calendar rules (H-0055 avoid list). Why the
  new dataset is essential: four of the twelve indices are already in fred_macro; with four assets the cross-section
  cannot leave three unmarked peers per date (K-0086), so the eight other CBOE ETF indices are needed. They come
  from the same FRED route as fred_vxv_1d, which the Archivist ingested before. Effective sample: the six 2011-03
  series need 252 + rv_days sessions before their first z, and a cohort needs at least 9 eligible instruments, so
  trading and events start about 2012-04. Dev therefore holds about 104 monthly decisions; events about 104 x 6
  = 620 on about 104 dates (above the 200 / 30 minimum); peers 6 per date. Entries about 620 (each cohort opens
  6 positions), mean gross about 1 (0.5 long, 0.5 short) once three cohorts are live, so exposure and entry floors
  are not binding. Period starts 2010-01-04 so that the 2009 references lie before dev and the warm-up of the earlier
  series is complete before the others become eligible. Expected size and the likely death, written down before
  the run: if the relative premium is real at, say, 1 to 1.5 % per event over 60 sessions (side-adjusted, raw ETF
  returns), the placebo bar is probably of the same order because GDX, EWZ, USO and SLV are noisy, so the mechanism
  test is close to a coin flip even if the effect exists; round-trip cost of these liquid ETFs is a few basis points,
  so the cost check should not bind. With inverse-vol legs the book would earn roughly 2.5 to 4 % a year at 6 to
  8 % volatility, a Sharpe around the 0.5 floor: the most likely strategy death is the absolute Sharpe floor against
  T-bills, as for H-0062. The most likely mechanism death, and why it would still be informative: Bollerslev, Marrone,
  Xu, Zhou (2014, JFQA, ''Stock return predictability and variance risk premia: statistical inference and international
  evidence'') find that a global VRP predicts country equity returns more strongly than local ones. If only the
  common (global) premium predicts, the relative ranking here is flat, which tells the lab that VRP information
  is not asset-specific and that VRP cards need a time-series design with many markets. That paper and Byun, Frijns,
  Roh (2018, Journal of Futures Markets, VRP predictability for stocks, currencies and credit) are not listed as
  references because their years fall inside the short effective dev window (pre-publication blocks of under two
  and about six years), which would make the publication-decay check a test of a handful of months; the Skeptic
  may add them if the lab prefers. Known confounds, stated in advance: (1) beta and stress timing (K-0074, K-0084):
  the ratio is low when realized vol spikes at the start of a selloff and high a month later when realized vol has
  calmed but implied vol lags, so the long leg can hold recently stressed assets in their rebound and the short
  leg can hold fresh crashers; the horizon-shape criterion above is meant to catch a bounce. (2) USO carries futures
  roll: oil fear episodes coincide with steep contango, so the long leg in USO loses roll yield, a bias against
  the hypothesis. (3) The four US equity ETFs share one fear factor and can fill a leg together, which is a single
  bet on those dates. (4) CBOE created the ETF vol indices for popular ETFs; the selection is of liquidity, not
  of later returns, and all twelve ETFs exist throughout the effective dev window. Holdout caveat: several of the
  new series were discontinued around 2020-2022, so in the 2021-2026 holdout fewer than nine instruments may be
  eligible and the book may form few or no cohorts; G4 would then have little to judge. ETFs have no forward source,
  so G4 is the ceiling in any case. No date literals or instruments outside the list are used by the rule.'
