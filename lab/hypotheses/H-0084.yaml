mechanism:
  counterparty: Holders of the asset who, while fear about it is elevated, pay up for protection and keep less of
    the asset than they would at normal fear (selling the underlying cheap or hedging it); on the short side, holders
    of assets whose protection is unusually cheap relative to their realized risk (complacency) who accept a low
    premium. The strategy supplies risk-bearing capacity in the feared asset and withdraws it from the complacent
    one.
  why: 'Option prices carry a variance risk premium: hedgers (portfolio insurers, oil producers and consumers, gold
    and currency hedgers, EM allocators) buy protection, and the capital-constrained dealers and option writers
    who absorb that demand price the inventory risk into implied volatility (Garleanu, Pedersen, Poteshman 2009).
    When implied volatility is high relative to the volatility the asset is actually showing, the marginal holders
    of that asset''s risk are unusually fearful, so the compensation they demand for holding it is high too, and
    the underlying earns a higher expected return over the next months (Bollerslev, Tauchen, Zhou 2009, for the
    S&P 500, strongest at a quarterly horizon). The signal comes from the options market and the trade is in the
    underlying ETFs, across asset classes. Fear episodes are often asset-specific (oil, gold and miners, China,
    Brazil, the euro, US small caps), so a cross-section of twelve assets with their own implied-vol indices has
    many more independent episodes than a single US equity timing rule (H-0055). Normalising each asset''s implied/realized
    ratio by its own past year removes the structural level differences between assets (equity indices always carry
    a larger premium than gold or the euro), so the ranking rotates over time and the time-shifted placebo can test
    the timing, not the asset selection.'
  why_not_arbitraged: 'It is a risk premium, not a free lunch: the long leg holds exactly the assets whose crash
    risk is feared most, and a crash would hit it. Dealer and cross-asset macro capital is limited and itself retreats
    in fear episodes. Most allocators do not combine option-implied volatility with holdings decisions across asset
    classes, and the premium is spread over months, which does not suit short-horizon arbitrage capital.'
signal:
  description: 'Inputs per instrument i (each ETF is paired with one CBOE 30-day implied-volatility index): SPY-VIXCLS,
    QQQ-VXNCLS, IWM-RVXCLS, EEM-VXEEMCLS, EWZ-VXEWZCLS, FXI-VXFXICLS, XLE-VXXLECLS, GDX-VXGDXCLS, GLD-GVZCLS, SLV-VXSLVCLS,
    USO-OVXCLS, FXE-EVZCLS (VIXCLS, VXNCLS, GVZCLS, OVXCLS from fred_macro; the other eight from the new dataset
    cboe_etf_vol_1d). Daily ETF total return r = (1+ret_co)*(1+ret_oc)-1. (1) Implied vol IV_i,t = the latest index
    value the data layer makes available at the decision after the close of day t (both FRED datasets have clock
    next_morning, so this is normally the index close of the previous session); if the latest available value is
    more than 5 sessions old, i is ineligible on t. (2) Realized vol RV_i,t = sqrt(252) x standard deviation of
    the daily log total returns of ETF i over the rv_days sessions ending at the session of that IV value (normally
    t-1); needs at least 80 % of the rv_days returns present, otherwise ineligible. (3) x_i,t = ln(IV_i,t / (100
    x RV_i,t)) (the index is in percentage points). (4) z_i,t = (x_i,t - mean of x_i over the previous 252 sessions
    including t) / standard deviation over the same window; needs at least 200 valid x values in the window, otherwise
    ineligible. No data before the card''s period is used; instruments simply become eligible once their window
    is filled. Rebalance: after the close of the last XNYS session of each month. Eligible = instruments with a
    valid z_i,t that are tradable on t and on the next session. If the number of eligible instruments is below 3
    x n_per_leg + 3 (so that at least three unmarked instruments remain), no new cohort is formed that month. Otherwise
    rank by z: the n_per_leg highest z form the long leg, the n_per_leg lowest the short leg (ties broken by ticker
    order). Cohort weights: within each leg, weight proportional to 1 / sigma_i, sigma_i = annualized standard deviation
    of i''s daily log total returns over the 63 sessions ending t (at least 50 present); long leg scaled to sum
    to +1/6, short leg to -1/6 (each cohort is dollar-neutral with gross 1/3). The book holds the three most recent
    cohorts (each cohort is held for three monthly periods, about 63 sessions, then dropped); target weights are
    the sum of the cohort weights, so total gross is at most 1. In the first two months the book holds only one
    or two cohorts (gross 1/3 or 2/3). A month without a new cohort leaves its slot empty (cash) for three months.
    Trades at the open of the next session after each month-end decision; target weights are constant between decisions.
    If a held instrument becomes non-tradable, its weight goes to zero (cash) until the cohort ends. Missing inputs
    must raise, not silently empty the book (K-0010): a ticker or series that is absent from the data entirely is
    an error.'
