mechanism_test:
  event: 'At each month-end rebalance on which at least 3 x n_per_leg + 3 instruments are eligible, instrument i
    is in the top n_per_leg (=3) of the cross-sectional ranking of z_i,t, its implied-over-realized volatility log
    ratio standardized by its own previous 252 sessions (side +1: rich fear premium, should outperform the other
    eligible ETFs), or in the bottom n_per_leg (side -1: cheap fear premium, should underperform). Every month''s
    leg membership is an event (each is a fresh forecast); the remaining eligible instruments are the unmarked peers
    (at least three on every event date by construction). Exact signal as in signal.description.'
