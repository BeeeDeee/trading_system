id: H-0008
version: 1
title: Earnings-announcement premium via volume seasonality - weekly LIQ-500 long/short, long stocks whose volume
  52 and 13 weeks ago predicts an announcement next week
author_agent: scout
family: earnings-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Attention-driven buyers (retail and momentum-chasing traders) who buy announcers at elevated prices
    around the event, and holders who keep announcement risk without being paid for it; on the short side, nobody
    in particular - the short leg is the rest of the liquid universe and hedges market and size exposure.
  why: 'Stocks earn abnormally high returns in the few days around their scheduled earnings announcements (Frazzini
    and Lamont 2007; Savor and Wilson 2016; Barber, De George, Lehavy and Trueman 2013). Two non-exclusive explanations:
    (1) attention-driven buying - the announcement puts the stock in the news, small investors who buy what catches
    their attention (Barber and Odean 2008) but rarely sell short push prices up around the event, and the premium
    is largest in stocks whose past announcements drew the most abnormal volume (Frazzini-Lamont); (2) a priced
    risk - announcers'' cash-flow news is informative about the market, so their covariance with the market spikes
    and investors demand a premium to hold them through the event (Savor-Wilson). Announcement dates are highly
    persistent: a firm reports in the same week of the same fiscal quarter year after year, and its announcement
    day is usually the highest-volume day of its quarter. So a stock''s own daily dollar volume, read on two slower
    clocks (the same week one year ago and about one quarter ago), predicts next week''s announcers point-in-time
    without any announcement-date data. The annual lag pins the calendar; the quarterly lag confirms that the past
    spike was a recurring scheduled event and not one-off news (M&A, guidance shock, index inclusion).'
  why_not_arbitraged: 'The premium is small per event and is paid for bearing event risk: announcer returns have
    fat-tailed idiosyncratic jumps, so a concentrated weekly book has high idiosyncratic volatility and needs breadth
    and constant turnover; short-horizon capital (stat-arb desks) tends to cut gross exposure into announcements
    precisely because of jump risk, and long-only mandates cannot hold the hedged spread. If the Savor-Wilson risk
    explanation is right, the premium is compensation and should persist.'
signal:
  description: 'Inputs: daily dollar_volume, ret_co, ret_oc, tradable of sharadar_sep stocks (all history the loader
    provides for each stock, also before it entered the universe). Decision once a week after the close of the last
    trading day of the calendar week (normally Friday), using data up to that close; trades at the open of the first
    trading day of the next week; positions are held until the next weekly rebalance (5 trading days in a normal
    week). Step 1, daily abnormal volume (1d with a ~1q baseline): for stock i on trading day d, AV(i,d) = dollar_volume(i,d)
    / median(dollar_volume(i, d-63 .. d-1)) (needs at least 40 valid days in the 63-day window, else undefined).
    Normalize by the market: AVn(i,d) = AV(i,d) / median over all stocks of the LIQ-500 universe on day d of AV(j,d)
    (removes market-wide spikes such as option-expiry, index-rebalance and crash days). Step 2, event days: d is
    an event day of stock i if AVn(i,d) >= av_threshold AND AVn(i,d) is the maximum of AVn(i, .) over trading days
    d-21 .. d+21 of that stock (the highest-volume day of its ~quarter). Only days with d+21 <= t are ever evaluated,
    which holds for all lags below (no look-ahead). Step 3, predicted announcers for next week: let D1 .. D5 be
    the calendar dates Monday .. Friday of the holding week. Stock i is a predicted announcer if (a) annual lag
    (1y): it had an event day with calendar date in [D1 - 364 - tol_days, D5 - 364 + tol_days] (364 days = 52 weeks,
    same weekdays), AND (b) quarterly confirmation (1q): it had an event day with calendar date in [D1 - 91 - 10,
    D5 - 91 + 10] (91 days = 13 weeks; fixed +-10 days because fourth-quarter reports come later than interim reports).
    Step 4, eligibility: stocks that are LIQ-500 members at the decision close, tradable, and have defined AVn on
    at least 80 % of trading days in the last 380 calendar days. Stocks failing this are in neither leg. Step 5,
    weights (dollar-neutral, gross <= 1): long leg = predicted announcers, equal weight w = min(0.05, 0.5 / N_long)
    each, so long gross L = min(0.5, 0.05 * N_long) (with fewer than 10 names the long leg is scaled down, the rest
    is cash). Short leg = all other eligible stocks, equal weight, total short gross = L. If N_long = 0 the book
    is flat that week. Weights are reset to target at each weekly rebalance. A stock that becomes untradable or
    delists during the week is handled by the engine (terminal return); no intra-week replacement.'
  params:
    av_threshold:
      grid:
      - 1.5
      - 2.0
      - 3.0
      value: 2.0
    tol_days:
      grid:
      - 1
      - 3
      - 5
      value: 3
  timeframes:
  - 1d
  - 1w
  - 1q
  - 1y
