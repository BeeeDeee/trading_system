falsification_criteria:
- Net Sharpe on dev (costs x1) below 0.5 versus T-bill, or the one-sided 90 % bootstrap lower bound of the Sharpe
  excess is at or below zero.
- At costs x2 the net Sharpe falls below the T-bill benchmark bar (the premium per event is smaller than twice the
  round-trip half-spread).
- Fewer than 75 % of the neighbors (av_threshold 1.5 / 3.0, tol_days 1 / 5 and their combinations) beat the benchmark,
  or their median Sharpe is below 0.7 x the primary.
- Mechanism (the predictor) - in the holding weeks, the median over weeks of the long basket's mean max-AVn over
  the 5 holding days is not at least 1.5 x that of the short leg; then the rule does not identify announcements
  and the test is uninformative about the premium.
- Mechanism (timing placebo) - the same rule with both lags shifted by 6 weeks (annual lag 364+42 days, quarterly
  lag 91+42 days, i.e. mid-quarter, non-announcement weeks) earns a Sharpe of at least half the primary; then the
  return does not come from announcement timing but from selecting high-volume stocks.
- The strategy does not beat the 95th percentile of 200 random-entry baskets with the same number of names, turnover
  and exposure.
- More than 60 % of the log return comes from one of the three dev sub-periods, or the post-2007 (post-publication)
  Sharpe is below half the pre-2007 Sharpe.
notes: 'Fit to the brief: holding 5 trading days, US single stocks, cross-sectional in LIQ-500 (ticker-blind, uses
  only each stock''s own volume history), and genuinely multi-timeframe: a daily volume event measured against a
  quarterly baseline, located on an annual (52-week) calendar and confirmed on a quarterly (13-week) one, traded
  weekly. Not the short-term-reversal family (study 5, H-0007): the signal uses no past returns at all, only the
  timing of scheduled information events. Not turn-of-month / calendar timing of the market (H-0001, H-0002): the
  calendar is stock-specific and the book is dollar-neutral, so it isolates the cross-sectional premium rather than
  market timing. No new data needed: sharadar_sf1 has filing dates (no loader, and 10-Q filing dates lag the earnings
  press release by weeks, so they would be the wrong clock anyway); inferring the announcement calendar from volume
  seasonality is point-in-time by construction. av_threshold carries the Frazzini-Lamont attention channel (higher
  past announcement volume -> larger premium); 2.0 and the grid are round values, not fitted. Honest cost arithmetic:
  each event costs about 2 x half-spread (3-6 bps tiers) on the long weight, so the strategy needs a weekly announcer-minus-rest
  spread of roughly 20-30 bps per event to survive costs x2; the literature premium is of that order in broad samples
  but is reported to be stronger in smaller stocks than in LIQ-500 names, and pre-decimalization costs (x2.5 until
  2001-04) hit the first sub-period. Most likely death: G1/G2 cost stress (premium in large caps smaller than costs
  x2) or G1 Sharpe below 0.5 because the idiosyncratic jump risk of a 10-40 name announcer basket swamps a small
  premium. Either way the predictor check and the timing placebo make the death informative.'
