falsification_criteria:
- 'Intraday G1: fewer than 300 trades in dev, net Sharpe below 0.5, or the bootstrap bound of the mean net trade
  not above 0 (forecast: about 1300-1500 trades, mean gross per trade 15-40 bps against a 13 bps round trip).'
- 'Net Sharpe at doubled costs (26 bps round trip) not positive: the continuation is smaller than the cost of taking
  it as a taker.'
- 'With a one-candle later fill the Sharpe falls below half of the primary: the move is front-loaded (the H-0063
  / K-0077 shape), contrary to the claim of a flow that keeps executing for hours. Expected gross after one-candle
  delay: at least 70 % of the next-open gross.'
- Fewer than 75 % of the parameter neighbors (range_minutes 15 and 60, stop on/off) positive, or fewer than 2 of
  3 dev sub-periods positive, or one sub-period carrying more than 60 % of the profit.
- Not better than the same trades placed at random times (random-entry percentile below 95).
- 'Mechanism (US-open specificity, owner control): the same rule anchored at 00:00 UTC (anchor = utc_midnight, same
  params) earns a net Sharpe at least as high as the 09:30 New York anchor on dev. Then the effect is generic crypto
  intraday momentum or volatility clustering, not the US cash open, and the US-open claim is wrong even if the card
  passes the gates.'
- 'Mechanism (bull-drift artefact, the study-16 verdict): the long side earns and the short side loses over dev,
  or the bear sub-period (the last third of dev) is negative. A real flow-continuation effect must pay on both sides.'
notes: 'owner_seed: ORB-C1

  PRIOR WORK, stated plainly: study 16 (owner''s intraday batch 1) already tested an opening-range breakout on BTC/ETH
  15m; it passed dev and was rejected on the 2023-2026 holdout (0 of 6) as a bull-market artefact. Its anchor and
  exit rules are not documented in prior_studies.md. This card is therefore NOT a fresh family on fresh data: the
  family should carry study 16''s ORB configurations as prior trials (lab prior-trials, owner), and the holdout
  of binance_perp_15m has already been opened once for an ORB rule, so a G4 pass here would be weak evidence. What
  is different and worth one trial: (a) the anchor is the DST-aware US cash open, a named flow event, with an explicit
  00:00 UTC control that can refute the US-open claim; (b) symmetric long/short with a both-sides falsification
  aimed at the ''bull artefact'' verdict; (c) hold to the US close (hours, not minutes), which is designed to survive
  the one-candle delay that killed H-0063 and H-0035 (K-0077).

  Instruments: the owner wrote BTCUSDT.P / ETHUSDT.P; the intraday dataset ids carry no .P suffix, so the universe
  lists BTCUSDT and ETHUSDT. An explicit list avoids the forced universe exits of K-0051.

  Grid: the owner asked for range 15 or 30 minutes. The checker needs a neighbor on each side of the primary, so
  the grid is [15, 30, 60] with 30 primary (60 minutes is the other classic opening-range length; it was not chosen
  from any result). stop_opposite [false, true] is the owner''s exit-design question kept inside the grid; primary
  = true because a close beyond the opposite side means the flow read was wrong, which is the mechanism''s own exit.
  6 configurations in total. The 15:00 New York entry cut-off and 0.5 weight are fixed design choices, not tuned.

  Control: the 00:00 UTC anchor is deliberately a strong rival: Shen, Urquhart and Wang (Financial Review, 2022,
  Bitcoin intraday time-series momentum) report first-half-hour momentum in bitcoin on a UTC-day clock. The intraday
  judge has no channel for a second anchor, so the control is implemented as a non-grid `anchor` switch in strategy.py
  and should be run once by the Chair/owner on dev with the primary params and reported with the G1/G2 result. A
  random-anchor variant (each whole UTC hour as anchor, 24 runs, US-open should rank near the top) is welcome if
  cheap, but is not required. Long-side and short-side net results should be reported separately (falsification
  7).

  No mechanism_test block: the intraday judge has none (instructions). Funding settlement at 16:00 UTC falls inside
  the US-session hold in both DST regimes, so funding is a small cost/credit on most trades; the 00:00 UTC control
  window (00:00-06:30 UTC) contains no settlement after entry, a minor asymmetry.

  Expected outcome: modest. Most likely death: doubled costs (BTC/ETH round trip 13 bps, 26 bps stressed, against
  a per-trade standard deviation of roughly 150-250 bps), or sub-period instability between the 2020-21 bull and
  the 2022 bear, or the 00:00 UTC control doing as well. Intraday data has no forward source, so the ceiling is
  G4.'
