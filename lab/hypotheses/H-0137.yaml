  kind: instruments
mechanism:
  counterparty: (1) The metaorder executors themselves, who knowingly pay impact to complete size over the session
    and leave a predictable path; (2) range/mean-reversion traders and market makers who fade the first break of
    the opening range and are run over when the flow persists; (3) leveraged traders positioned during the Asia/Europe
    session whose stops and liquidations sit just beyond the morning range and add fuel to the break.
  why: 'Since US institutions and US-session retail became a large share of crypto volume, the US equity cash open
    (09:30 New York) is a daily information and flow event for BTC and ETH: overnight macro news, the equity opening
    auction and the risk tone of the day are priced by US-hours desks (CME basis traders, ETF/fund desks, US exchange
    flow, macro funds hedging equity risk with crypto) whose orders arrive as metaorders sliced over the US session
    (TWAP/VWAP to the 16:00 close). The first 15-60 minutes after the open are the price-discovery window; a 15-minute
    close beyond that window''s high or low reveals the sign of the day''s net US-session order flow, and because
    the sliced metaorders keep executing for hours, price continues in that direction until the US close (intraday
    momentum, the crypto analogue of Gao, Han, Li and Zhou''s market intraday momentum and of the published opening-range
    breakout on QQQ). The rule is the owner''s base ORB: one trade per instrument per US session, both sides, hold
    to the 16:00 New York close.'
  why_not_arbitraged: The edge per trade is small relative to the daily variance of crypto (most single days are
    noise, false breakouts are frequent), so it needs many days and tolerance for long losing streaks; the capacity
    of an intraday taker rule is limited by impact; desks that could front-run the metaorders face the same uncertainty
    about which days carry real flow. It may also be crowded (ORB is a popular retail rule), which is exactly what
    the gate and the 00:00 UTC control should reveal.
signal:
  description: 'Data: binance_perp_15m candles for BTCUSDT and ETHUSDT (no .P in the intraday ids), dev 2020-01-01
    to 2022-12-31. Clock: convert each candle''s start time from the intraday view `times` (UTC) to America/New_York
    with the tz database (zoneinfo), so 09:30 New York is 13:30 UTC in US daylight time and 14:30 UTC in US standard
    time; never a fixed UTC hour. (If `times` stamps candle close rather than candle open, shift by 15 minutes so
    that ''the 09:30 candle'' is the one covering 09:30-09:45 New York.) Sessions: every Monday-Friday New York
    date (no exchange-holiday calendar; the ~9 US holidays a year are traded like any weekday, a small dilution
    accepted for simplicity). Weekends are never traded. Per instrument and session, independently: (1) Opening
    range: the candles whose New York start time lies in [09:30, 09:30 + range_minutes) (range_minutes 30 = the
    09:30 and 09:45 candles). Range high H = max of their highs, range low L = min of their lows. If any of these
    candles is not real (gap row, `real` false), skip the session for that instrument. (2) Entry: starting with
    the first candle after the range, check each closed candle whose New York start time is before 14:45 (i.e. signal
    candles closing at or before 15:00 New York, a fixed rule so every trade can last at least one hour). The FIRST
    candle whose close is > H gives a long, the first whose close is < L gives a short; the decision is taken after
    that candle closes and filled at the open of the next candle (no fill at the range boundary). Only one entry
    per instrument per session: after the first trade (or after the entry window closes without a break) nothing
    else happens that session; there is no re-entry and no reversal. (3) Exit: the position is closed with a decision
    after the candle that ends at 16:00 New York (the 15:45 candle), filled at the open of the 16:00 candle. If
    stop_opposite is true it is closed earlier, at the open of the candle after the first candle that closes beyond
    the opposite side of the range (a long whose candle close is < L, a short whose close is > H). If the exit candle
    is a gap row, exit at the next real candle''s open. Weights: each open position is 0.5 of equity (+0.5 long,
    -0.5 short), so gross <= 1 with both instruments in a trade; flat otherwise. Funding is charged by the engine
    on positions open at the 16:00 UTC settlement (inside the US session in both DST regimes); no other carry. Control
    (owner request, not part of the G2 grid): the same code with anchor = utc_midnight uses 00:00 UTC instead of
    09:30 New York as the range start, the entry cut-off at anchor + 5h15m, the exit at anchor + 6h30m (same session
    length as 09:30-16:00), the same Monday-Friday dates (UTC weekday) and the same parameters. strategy.py must
    expose `anchor` (default us_open) so the Chair/owner can run the control with identical code; it is not a tunable
    parameter.'
  params:
    range_minutes:
      grid:
      - 15
      - 30
      - 60
      value: 30
    stop_opposite:
      grid:
      - false
      - true
      value: true
  timeframes:
  - 15m
