  typical_days: 60
market_exposure: long_only
references:
- cite: 'Piotroski (2000) Value Investing: The Use of Historical Financial Statement Information to Separate Winners
    from Losers, Journal of Accounting Research'
  year: 2000
- cite: Lakonishok, Shleifer and Vishny (1994) Contrarian Investment, Extrapolation, and Risk, Journal of Finance
  year: 1994
- cite: 'Novy-Marx (2013) The Other Side of Value: The Gross Profitability Premium, Journal of Financial Economics'
  year: 2013
falsification_criteria:
- 'Mechanism: the 60-day side-adjusted abnormal return of fresh long-book entries is not above the 95th percentile
  of the time-shifted placebos, or gross per event is below the round-trip cost, or fewer than 2 of 3 blocks are
  positive.'
- 'Mechanism, timing vs identity: the placebo mean is at least as large as the event mean, i.e. the same stocks
  on shifted dates earn as much (the score picks a persistent style, not mispriced timing).'
- 'Mechanism, era: the event average in the latest third of dev is zero or negative (K-0060 decay).'
- 'Mechanism, horizon shape: the 5-day abnormal return is more than half of the 60-day one, so entries ride the
  short-term reversal of the price drop that made them cheap, not a slow fundamental correction.'
- 'Strategy: net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat SPY_TR, or the book fails SPY_TR
  at doubled costs, or one third of dev carries more than 60 % of the log return.'
- 'Nonlinearity: ridge (framework `ridge`, alpha 1.0) on the same five features with the same book gives a Sharpe
  within 0.05 of the gbm or better; then the conditional claim is false and only the linear value-plus-quality premium
  remains.'
notes: 'Brief fit: the brief asks for a 6-24 month hold; the schema caps the label (and mechanism) horizon at 60
  days, so the model predicts a 60-day return while the monthly buffered book keeps a name about 6-12 months on
  average (slow fundamental features plus the 2 x top exit buffer). typical_days is set to the label horizon as
  the instructions require; the realized holding is longer. Turnover forecast: about 60-120 % one-way per year,
  cost drag about 0.1-0.2 %/yr at a 12 bps round trip, so costs x2 is not the binding gate. Family: the mechanism
  is extrapolative overreaction priced into cheap stocks (LSV), the same overreaction/value reversion as the long-term-reversal
  family (H-0060, H-0062, H-0088), so the trials are counted there. Inputs overlap other dead cards and I say how
  this differs: H-0032/H-0092/H-0097 (accruals and profitability at earnings news, 5-day windows, anomalies-at-earnings-news)
  tested short windows around filings, not a quarter-long conditional value claim; H-0146 (asset growth x cash-flow
  discretion x ROA change, learned, 6-month cohorts) is an overinvestment claim with no valuation input; H-0059/H-0086
  were single-variable level sorts that equalled their same-stock placebos. Study 11 (LightGBM on many fundamentals,
  insiders and 13F, 50 of LIQ1000 monthly, turnover 15x/y) failed; this card differs by a five-feature conditional
  claim, a 60-day label instead of a short one, a buffered low-turnover book of about 100-150 names, and a ridge
  baseline as a kill condition. Mechanism test forecast (K-0098, K-0120, K-0165): event = fresh entry (score in
  top fifth, not in the top two fifths at the previous monthly decision). Scored members about 380-430 of 500 (banks
  drop out); fresh entries about 3-10 per month from the first scored month (about 2000-2001) to 2020-12, so about
  700-2300 events on about 230 monthly dates; if the call rate were a tenth of that the event minimum would bind
  and the card should be read as untested. Round trip about 12 bps (x2.5 before 2001-04 decimalization). Gross per
  event over 60 days: pessimistic 0, central 50 bps, optimistic 120 bps. The placebo bar for a 60-day horizon with
  entry events is likely several times cost (K-0076, K-0111), so even the central case may land in the cloud: a
  miss with a bar above cost is a ''cannot tell''; a placebo mean equal to the event mean is a refutation of the
  timing claim. Beta gap (K-0074): profitable cheap low-vol picks probably carry beta somewhat below the LIQ-500
  average (about 0.85-0.95 vs 1), which costs raw abnormal return in bull markets (roughly 0.1 x the market''s 60-day
  move) and helps in crashes; financial-crisis years can flip it if cheap cyclicals score high. Warm-up (K-0163):
  features need 252 rows and the first fit needs realized 60-day labels, so the first scored decisions come about
  two to three years into dev; the first G1 third will be thin. The book is flat until then; that cash period overlaps
  part of the 2000-2002 market decline and would flatter the full-dev Sharpe against SPY_TR, so the judge or Skeptic
  should compare from the first scored decision date if the gate allows it. Benchmark confound (K-0153): an equal-weighted
  book of ~100-150 liquid stocks against cap-weighted SPY_TR carries a size tilt; no core-only control exists. Hindsight:
  the long weak spell of value in the 2010s is common knowledge; it is why the latest-third condition is a kill
  condition, not a reason for the design. Decision timing: after the close of the last trading day of each month,
  trades at the next open; fundamentals enter from the day after filing per the loader.'
