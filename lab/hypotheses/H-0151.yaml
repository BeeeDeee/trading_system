id: H-0151
version: 1
title: Healthy cheap stocks vs value traps, learned - LIQ-500 long-only monthly buffered top fifth of a LightGBM
  60-day score on B/M x profitability x accruals x ROA change x vol
author_agent: scout
family: long-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Extrapolating investors and institutions that sell or avoid out-of-favor, cheap names because of
    career risk and 'prudent' holding norms (LSV 1994), and indiscriminate value buyers whose demand is spread over
    traps and healthy firms alike; the seller of a healthy cheap stock at a depressed price is the one who pays.
  why: 'Cheap stocks are cheap because investors extrapolate poor past performance and fear distress (Lakonishok,
    Shleifer and Vishny 1994). Most cheap stocks deserve it (value traps: falling profitability, earnings not backed
    by cash, high risk), but a minority are fundamentally healthy firms priced like traps. The financial statements
    separate the two (Piotroski 2000: within high book-to-market firms, profitability, cash-backed earnings and
    improving returns on assets predict the next year''s return; the gain is realized gradually, largely around
    the following earnings releases). The claim is conditional: fundamental health matters for cheap stocks, where
    the market prices distress, and cheapness pays only when health is present. A learned score on a few fundamentals
    finds that corner; its fresh entries should drift up relative to the other liquid stocks over the following
    quarter as subsequent reports confirm the health the price ignored.'
  why_not_arbitraged: The correction takes quarters, the positions look ugly, and value-style drawdowns can last
    years (noise-trader and career risk; limits to arbitrage). Statement-based screening of cheap stocks gets little
    analyst attention. Large liquid stocks are where this is weakest, which is the main risk of the card.
signal:
  description: 'Universe: point-in-time LIQ-500 members. Data: sharadar_sep total returns (ret_co, ret_oc) and the
    attached sharadar_sf1 fields sf1_arq_pb, sf1_arq_assets, sf1_art_gp, sf1_art_netinc, sf1_art_ncfo (as reported,
    usable from the day after the filing, stale after 400 days per the loader). Features per stock and day t, using
    data up to the close of t, each winsorized at the 1st/99th percentile and z-scored across that day''s members
    by the framework helper: (1) BM = book-to-market updated with the price: (1 / sf1_arq_pb) divided by the stock''s
    cumulative total return from the first day the current pb value was usable to t (pb is frozen at the filing
    date, so this moves it with the price; never multiply share counts by close_u, K-0168). pb <= 0 or missing ->
    feature missing. (2) GPA = sf1_art_gp / sf1_arq_assets (gross profitability). (3) ACC = (sf1_art_netinc - sf1_art_ncfo)
    / sf1_arq_assets (accruals: earnings not backed by cash). (4) DROA = sf1_art_netinc / sf1_arq_assets at t minus
    the same ratio 252 rows earlier (fundamental trend). (5) VOL = standard deviation of daily total returns over
    the last 252 rows, at least 200 valid (distress risk). A stock with any feature missing is not scored that day
    (this drops most banks, whose gp is not reported). Label: framework label, total return from the open of t+1
    to the open of t+61 (horizon_days 60), ranked across members. Model: LightGBM (framework `gbm`) via lab.framework.ml.walk_forward
    on all member rows, expanding window, refit every 126 rows, fixed settings learning_rate 0.05, num_leaves 8,
    min_child_samples 1000, subsample 0.5, colsample 1.0; n_estimators from params. No other tuning, no feature
    selection. Book (score_weights + only_on): decisions after the close of the last trading day of each month,
    trades at the next open. Rank the scored members by the model score. A stock not held is bought if its score
    is in the top `top` fraction; a held stock is kept while its score stays in the top 2 x `top` fraction (buffer,
    exit at the 40th percentile for top 0.2), and sold otherwise, or when it is unscored at a decision, or when
    it leaves the universe (at the first decision row outside, as the engine requires). Held stocks are equal-weighted
    at each monthly decision, gross 1.0, long only. Before the first model fit, or with fewer than 20 scored members,
    the book is flat (see notes on the warm-up). Expected realized holding per name with the buffer: about 6-12
    months; the label horizon is capped at 60 days by the schema.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.15
      - 0.2
      - 0.25
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'At a monthly decision date (close of the last trading day of the month), a scored LIQ-500 member enters
    the long book fresh: its model score is in the top fifth of scored members and it was not in the top two fifths
    at the previous monthly decision. side = +1 (it should outperform the other members over the next 60 sessions).'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
ml:
  features:
  - 'BM: book-to-market from sf1_arq_pb at the last filing, moved with the stock''s total return since then (how
    cheap the market prices the firm; where extrapolation shows)'
  - 'GPA: trailing gross profit / quarterly total assets (Novy-Marx''s gross profitability; the cleanest accounting
    measure of current economic health)'
  - 'ACC: (trailing net income - trailing operating cash flow) / assets (Sloan accruals; earnings not backed by
    cash mark traps and later disappointments)'
  - 'DROA: change over 252 rows of trailing net income / assets (Piotroski''s ROA trend; separates recovering from
    deteriorating cheap firms)'
  - 'VOL: 252-day realized volatility of daily total returns (market-priced distress risk; cheap and volatile is
    the classic trap)'
  horizon_days: 60
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The expected effect is a corner, not a sum: cheapness pays only when profitability is high, accruals
    low and ROA not deteriorating, and these health signals matter mainly among cheap stocks (Piotroski''s within-value
    result); among expensive stocks they matter little, and cheap-but-unhealthy volatile stocks continue to lag
    (distress). So the BM slope changes sign with health and VOL. A ridge on the same five features can only add
    a BM slope and a health slope: it buys cheap traps and expensive quality, both outside the corner. A shallow
    tree finds the corner in two or three splits (BM high, then GPA/ACC/DROA, then VOL low). Who pays: sellers of
    healthy cheap firms who extrapolate the past and avoid ugly names. If ridge or a plain rank-sum of BM and GPA
    does as well, the card has found the known linear value-plus-quality premium, not the conditional mispricing.'
