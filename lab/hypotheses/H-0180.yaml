id: H-0180
version: 1
title: Network adoption not yet in the price - Binance spot top-50 long-only, monthly 6-month cohorts of coins whose
  on-chain active-address growth most exceeds what their own price run implies
author_agent: scout
family: crypto-network-adoption
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 50
mechanism:
  counterparty: Narrative and momentum traders who rotate out of coins whose users grow while the price lags into
    coins whose price runs without users, and late buyers of those pumped coins; also holders who sell unexciting
    coins to fund the hot theme. They keep doing it because on-chain usage data are costly to clean and are not
    part of the price-and-attention information set most of them trade on.
  why: 'A token''s long-run value is the value of the transactional demand of its users (Cong, Li, Wang 2021, tokenomics:
    adoption drives token value with feedback), and Cong, Karolyi, Tang, Zhao document a network-adoption and an
    active-address ''value'' premium in the crypto cross-section. Growth of a network''s user base is visible only
    on-chain, is noisy (exchange wallets, spam) and is not shown on any exchange screen; the marginal crypto trader
    prices coins from price action, narrative and social attention. So when a coin''s active-address base grows
    faster than its price has moved over half a year, the price is expected to catch up over the following months
    (slow diffusion of a costly-to-read fundamental), and when a coin''s price has run far ahead of a stagnant or
    shrinking user base, it is expected to lag. The signal is the within-coin GROWTH of users net of the coin''s
    own price run, not a level, so it is not a persistent coin-identity sort (the failure of K-0128, K-0184, K-0196).'
  why_not_arbitraged: The catch-up takes months and sits inside 100 %+ annual volatility, so the information ratio
    of any single position is low; shorting the price-ahead coins is costly or impossible on spot and squeezes are
    violent; most institutional mandates cannot hold mid-cap tokens; and on-chain address data at daily frequency
    for many assets was until recently a paid product.
signal:
  description: 'Data: Binance spot daily bars (close, quote_volume, ret_co, ret_oc) for the point-in-time crypto_top_n
    universe (n = 50, by 30-day quote volume), and the daily Coin Metrics active-address count AA_j(d) (new signal
    dataset coinmetrics_adractcnt_1d, key convention of coinmetrics_supply_1d: spot pair <ID>USDT maps to key <ID>USDT.P;
    a pair without a key is ineligible). Clock: the crypto daily close is 00:00 UTC; for a decision after the close
    of day t only address values stamped day t-1 or earlier are used (one day conservative against end-of-day stamping),
    and prices up to the close of day t. Formation dates: the first UTC day t of every calendar month (decision
    after the close that ends the previous month''s last day is equivalent; use the first day whose close is in
    the new month), trades at the next daily open. Eligibility at t: member of the top-50 universe at t; at least
    L + 30 days of valid closes (L = lookback_days); an address series whose first value is at least 365 days before
    t (excludes the token-launch phase where address counts explode mechanically); at least 25 non-missing address
    values in each of the two 30-day windows below and both window means > 0. If fewer than 8 coins are eligible,
    no cohort is formed that month (that sleeve stays in cash). Adoption growth g_j = log(mean AA_j over days t-30..t-1)
    - log(mean AA_j over days t-L-30..t-L-1). Price run r_j = log(close_j(t) / close_j(t-L)). Across the eligible
    coins at t, convert g and r to cross-sectional ranks scaled to [0, 1] (average ranks for ties), regress rank(g)
    on rank(r) with an intercept by OLS, and take the residual e_j (adoption growth the price run does not explain;
    ranks make it robust to address spam spikes). Long group = the ceil(N/3) coins with the highest e_j; the bottom
    ceil(N/3) form the short-side event group of the mechanism test only (not traded: spot cannot be shorted). Book
    (long-only, spot, overlapping cohorts): K = hold_days / 30.44 rounded (182 -> 6, 126 -> 4, 273 -> 9). Each formation
    date opens a cohort of weight 1/K split equally over its long group; a cohort is closed at the K-th formation
    date after its opening. Target weight of coin j = sum over open cohorts of its cohort weight; the book is rebalanced
    to these targets only on formation dates (weights drift in between). Sleeves not yet opened (first K-1 months)
    and cohorts of months with fewer than 8 eligible coins are cash. A held coin that stops trading or is delisted
    is handled by the engine''s delisting rule and its proceeds stay in cash until the next formation date. BTC
    and ETH are eligible like any other coin. Gross exposure <= 1, no leverage, no shorts.'
  params:
    hold_days:
      grid:
      - 126
      - 182
      - 273
      value: 182
    lookback_days:
      grid:
      - 120
      - 180
      - 240
      value: 180
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At each monthly formation date t (after the close of day t), coin j is in the top third (side +1) or the
    bottom third (side -1) of the residual adoption growth e_j among the eligible coins (rank of 180-day active-address
    growth net of the rank of the 180-day price run, as in the signal). Mask is True for both groups on formation
    dates only, False for the middle third, for non-eligible coins and on all other days. The mechanism says top-third
    coins outperform and bottom-third coins underperform the other universe members over the following months.
  horizons:
  - 10
  - 21
  - 42
  - 60
  primary_horizon_days: 60
