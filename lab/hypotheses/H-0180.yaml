falsification_criteria:
- 'Mechanism: the side-adjusted 60-day abnormal return of the top- and bottom-third events is below the 95th percentile
  of the time-shifted placebos, or has the predicted sign in fewer than 2 of the 3 dev blocks.'
- 'Mechanism (coin identity): the event mean is positive but no larger than the placebo mean, i.e. the same coins
  on shifted dates earn the same; then adoption growth carries no timing information.'
- 'Mechanism (cost): gross abnormal return per event at 60 days below the spot round-trip cost of the traded coins.'
- Net Sharpe of the long-only book on dev below BTC buy-and-hold Sharpe + 0.10, or the stationary-bootstrap bound
  of the Sharpe difference below zero.
- Fewer than 75 % of the grid neighbors (lookback 120/240, hold 126/273 and their combinations) beat BTC buy-and-hold,
  or the book fails BTC at doubled costs.
- More than 60 % of the dev log return comes from one of the three sub-periods (one boom).
notes: 'Revision v2 (G0 g0_series_empty): the coinmetrics_adractcnt_1d requirement now lists explicit fields, the
  57 plain-id keys of the catalog; the 8 keys without dev values (all chain-suffixed: SDAI_ETH, FDUSD_ETH, CRVUSD_ETH,
  EURCV_ETH, POL_ETH, SUSDE_ETH, BUIDL_ETH, FLOW_NATIVE) and all other suffixed, stablecoin, gold and wrapped-BTC
  keys are dropped. The signal logic is unchanged: those keys could never match a Binance spot pair under the card''s
  key convention (or are stablecoins/wrappers that the strategy treats as ineligible anyway). Brief: long horizon
  crypto. The book holds each cohort about six months (182 days, grid 126-273) in overlapping monthly cohorts; the
  mechanism test can only see the first 60 days (schema cap), the descriptive horizons show the build-up. Why this
  is not a repeat of dead crypto sorts: supply-side sorts (K-0128) and trend or near-high sorts (K-0184, K-0196)
  failed because they sort on persistent coin characteristics that the same-coin placebo absorbs; this card sorts
  on within-coin CHANGE of a demand-side fundamental (users) and removes the coin''s own price run by construction,
  so it is neither trend nor long-term reversal; it uses on-chain data the lab has never used. Not the new-listing-overhang
  family (supply, listing age) nor perp-leverage-crowding (funding, basis). New family name because no lab card
  or prior study uses user-adoption data; if the Librarian sees it as a variant of an existing family, file it there.
  Known caveats (see catalog): Coin Metrics backfills and revises network data and serves only the current vintage
  (possible look-ahead in levels, smaller in growth rates over 180 days); address counts are inflated by spam, airdrops
  and fee changes (ranks and 30-day means damp this); coverage is skewed to older coins and the community tier lacks
  several large coins (XRP, XLM, SOL, TRX, AVAX, BNB, ATOM), so the eligible set is smaller than first forecast.
  Forecasts (K-0120, K-0125): eligible coins about 6-9 in 2018 (BTC, ETH, LTC, BCH, NEO, ADA, ETC, EOS, DASH as
  USDT pairs with seasoned address data), about 10-14 in 2019, 14-18 in 2020, 18-25 in 2021-2022; formation dates
  with a cohort maybe 45-55 of the 64 dev months (early 2018 months may fall below 8 eligible coins and stay cash);
  events (top plus bottom thirds) about 500-700; the first dev block will be thin. Round trip for these spot pairs
  probably 20-60 bps by tier; if the effect exists a 60-day spread of several percent per event is plausible, so
  cost should not bind; the placebo cloud will be wide (one boom-and-bust cycle, overlapping 60-day windows, K-0006,
  K-0145), which is the main risk at the mechanism gate. Book: mean exposure ramps from 1/6 to 1 over the first
  six months, then near 1 except cash months; position entries about 50 cohorts x 3-8 coins = 200-350; 45+ rebalancing
  dates. The likely strategy death is G1 against BTC: a long-only basket that is mostly altcoins carries alt beta
  through the 2018 and 2022 bear markets.'
