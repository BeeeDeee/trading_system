- dataset: coinmetrics_adractcnt_1d
  description: NEW dataset to ingest. Coin Metrics Community API v4, https://community-api.coinmetrics.io/v4/timeseries/asset-metrics
    with metrics=AdrActCnt (number of unique addresses active in the network, as sender or receiver, on the UTC
    day), frequency=1d, free, no key, Coin Metrics community data license (attribution). Same asset list, same ticker-identity
    map, same dropped ambiguous tickers and the same key convention (<ID>USDT.P) as the existing coinmetrics_supply_1d
    ingest, full history from each asset's first value (needed for the 365-day seasoning and the lookback). Signal
    only, not tradable, clock crypto, holdout from 2023-01-01 like the other crypto data. Assets for which the community
    tier serves no AdrActCnt (e.g. privacy coins) are simply absent.
  frequency: 1d
holding_period:
  rebalance: monthly
  typical_days: 182
