references:
- cite: Cong, Karolyi, Tang, Zhao - Value Premium, Network Adoption, and Factor Pricing of Crypto Assets (working
    paper, first draft 2021; published in Management Science as 'Crypto Value, Factor Pricing, and Market Segmentation')
  year: 2021
- cite: 'Cong, Li, Wang (2021) Tokenomics: Dynamic Adoption and Valuation, Review of Financial Studies'
  year: 2021
falsification_criteria:
- 'Mechanism: the side-adjusted 60-day abnormal return of the top- and bottom-third events is below the 95th percentile
  of the time-shifted placebos, or has the predicted sign in fewer than 2 of the 3 dev blocks.'
- 'Mechanism (coin identity): the event mean is positive but no larger than the placebo mean, i.e. the same coins
  on shifted dates earn the same; then adoption growth carries no timing information.'
- 'Mechanism (cost): gross abnormal return per event at 60 days below the spot round-trip cost of the traded coins.'
- Net Sharpe of the long-only book on dev below BTC buy-and-hold Sharpe + 0.10, or the stationary-bootstrap bound
  of the Sharpe difference below zero.
- Fewer than 75 % of the grid neighbors (lookback 120/240, hold 126/273 and their combinations) beat BTC buy-and-hold,
  or the book fails BTC at doubled costs.
- More than 60 % of the dev log return comes from one of the three sub-periods (one boom).
notes: 'Brief: long horizon crypto. The book holds each cohort about six months (182 days, grid 126-273) in overlapping
  monthly cohorts; the mechanism test can only see the first 60 days (schema cap), the descriptive horizons show
  the build-up. Why this is not a repeat of dead crypto sorts: supply-side sorts (K-0128) and trend or near-high
  sorts (K-0184, K-0196) failed because they sort on persistent coin characteristics that the same-coin placebo
  absorbs; this card sorts on within-coin CHANGE of a demand-side fundamental (users) and removes the coin''s own
  price run by construction, so it is neither trend nor long-term reversal; it uses on-chain data the lab has never
  used. Not the new-listing-overhang family (supply, listing age) nor perp-leverage-crowding (funding, basis). New
  family name because no lab card or prior study uses user-adoption data; if the Librarian sees it as a variant
  of an existing family, file it there. Data request (essential): there is no adoption proxy in the loadable data
  (exchange quote volume is trading, not network usage; SplyCur is supply). Coin Metrics already serves SplyCur
  to the lab from the same community endpoint, so the existing fetcher should need only the metric name. Known caveats
  to record in the catalog: Coin Metrics backfills and revises network data and serves only the current vintage
  (possible look-ahead in levels, smaller in growth rates over 180 days); address counts are inflated by spam, airdrops
  and fee changes (ranks and 30-day means damp this); coverage is skewed to older coins (survivorship toward assets
  that lasted). Forecasts (K-0120, K-0125): eligible coins about 8-10 in 2018 (BTC, ETH, LTC, BCH, NEO, ADA, XRP,
  XLM, ETC as USDT pairs with address data), about 12-15 in 2019, 17-20 in 2020, 22-30 in 2021-2022; formation dates
  with a cohort about 55 of the 64 dev months (first date needs L + 30 days of prices, about 2018-03); events (top
  plus bottom thirds) about 600-800 on about 55 dates; the first dev block (2017-08 to about 2019-04) will be thin
  (about 80-120 events). Round trip for these spot pairs probably 20-60 bps by tier; if the effect exists at all
  a 60-day spread of several percent per event is plausible, so cost should not bind; the placebo cloud will be
  wide (one boom-and-bust cycle, overlapping 60-day windows, K-0006, K-0145), which is the main risk at the mechanism
  gate. Expected beta gap between marked and peers: small, because the sort is residual to the price run and both
  sides are marked, but early DeFi tokens could put higher-beta names in the top third; the 365-day address seasoning
  rule is there to keep token launches out. Book: mean exposure ramps from 1/6 to 1 over the first six months, then
  about 1 (cash only in months with fewer than 8 eligible coins); position entries about 55 cohorts x 3-10 coins
  = 250-400; 55+ rebalancing dates. The likely strategy death is G1 against BTC: a long-only basket that is mostly
  altcoins carries alt beta through the 2018 and 2022 bear markets, so the adoption effect has to pay for that beta
  gap; that is the honest benchmark for a long-only crypto card.'
