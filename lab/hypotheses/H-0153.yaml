mechanism:
  counterparty: 'Global and regional allocators who cut a country after losses: performance-chasing flows into country
    ETFs and funds, risk-budget and volatility rules that sell markets after drawdowns, mandates with home bias
    that pull foreign capital first in a crisis, and local investors forced to sell. On the rich side, flows that
    chase recent country winners and pay up for them. They accept a lower long-run return for liquidity, safety
    or career comfort now.'
  why: 'A stock market''s dividend yield moves for two reasons: news about future dividends and changes in the return
    investors require (Campbell and Shiller 1988). When a country''s trailing dividend yield rises far above its
    own recent history, the price has fallen by more than its dividends. That gap is a higher required return, often
    set after crises, capital flight and forced de-risking by foreign holders. It is earned over the following one
    to three years as the required return comes back toward normal, so a cross-section of countries sorted on yield
    against their own history should show cheap markets beating rich ones over a year (country value: Asness, Liew
    and Stevens 1997; Asness, Moskowitz and Pedersen 2013). Measured as USD dividends over USD price, the yield
    does not depend on the currency: a currency move changes both terms equally. So unlike the USD price reversal
    of H-0060, the sort sees valuation, not exchange-rate swings. Standardizing by the country''s own 36-month history
    removes persistent identity (the US always yields less than Australia), and forming legs inside halves of past
    12-month return removes the momentum loading that a recent price fall carries.'
  why_not_arbitraged: The payoff takes years and comes with deep drawdowns in crises, when cheap markets get cheaper.
    That is career and tracking-error risk that benchmarked managers avoid, and capital is slow to move into it.
    Value traps (a yield rise followed by a dividend cut) make each bet noisy. There are only about twenty markets,
    so few independent bets exist per year. Capital controls, withholding taxes and home bias add cross-border frictions.
    Shorting rich country ETFs for a year carries borrow and recall risk.
signal:
  description: 'Data: daily total return r_t = (1+ret_co_t)(1+ret_oc_t)-1 and unadjusted close close_u of each of
    the 22 ETFs. (1) Daily distribution yield d_t = (1+r_t) / (close_u_t/close_u_{t-1}) - 1 (the distribution paid
    on the ex-day as a fraction of that day''s price). Set d_t = 0 when it is missing, negative or above 0.15 (split
    days, vendor errors); on such days the price return is taken equal to the total return. (2) Split-consistent
    price index PI_t = PI_{t-1} * (1+r_t)/(1+d_t), PI = 1 on the first valid day. Distribution in index units D_t
    = d_t * PI_t. (3) Trailing yield Y_t = (sum of D over the last 504 sessions / 2) / PI_t. The 24-month window
    is fixed, not a parameter: semiannual and annual payers need two years to avoid payment dates sliding in and
    out of the window. (4) Own-history cheapness at each month-end t: z_t = (log Y_t - mean of log Y at the previous
    lookback_months month-ends) / (standard deviation of the same). (5) Momentum: total return over the last 252
    sessions to t. Eligibility at month-end t: a valid close on t, at least 504 + 21*lookback_months sessions of
    total-return history, and Y > 0 at t and at all month-ends in the lookback. A ticker not yet listed is simply
    ineligible. Formation: after the close of the last session of each month (decision at t, trades at the open
    of t+1). If at least 10 ETFs are eligible, split them by 12-month return into a lower half (the floor(n/2) lowest)
    and an upper half (the rest). In each half, mark the 2 ETFs with the highest z as long and the 2 with the lowest
    z as short (4 long, 4 short in total). Cohort weights: within each leg, proportional to 1 / (standard deviation
    of daily total returns over the last 252 sessions), scaled so the long leg sums to +0.5 and the short leg to
    -0.5 (gross 1, dollar-neutral). With fewer than 10 eligible ETFs no cohort is formed that month. Book: each
    cohort stays active for hold_months formation dates (formed at m, retired at the formation hold_months later).
    The book weight of each ETF is the average of its weight over all active cohorts (up to hold_months of them;
    fewer at the start), so gross stays at most 1. Weights change only at month-end decisions. If an ETF has no
    tradable price, its weight is held in cash until it trades again. If no cohort is active, the book is in cash.
    The Builder should fail loudly if d_t is zero for every ETF over a whole 504-session window: that would mean
    the total returns carry no distributions and the signal is undefined.'
