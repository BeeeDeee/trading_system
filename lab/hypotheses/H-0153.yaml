mechanism_test:
  event: At each monthly formation date t (after the close of the last session of the month, primary lookback_months
    = 36), split the eligible ETFs into halves by 12-month total return. In each half, the 2 ETFs with the highest
    own-history dividend-yield z are marked side +1 (cheap, should outperform the other ETFs) and the 2 with the
    lowest z side -1 (rich, should underperform). That gives 8 marked ETFs per date; the other 10-14 eligible ETFs
    are the unmarked peers.
  horizons:
