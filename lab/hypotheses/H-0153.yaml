falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the marked ETFs is not above the 95th percentile of
  the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of dev (about 2013-2020) is wrong-signed in the event study (the decay of K-0060),
  even if the pooled average passes.'
- 'Mechanism: the same-ETF placebo mean is more than half of the event average. The own-history z is built to remove
  country identity, so a large placebo mean would mean the sort picks persistent winners, not cheapness.'
- 'Mechanism: the horizon profile peaks at 5-21 sessions and shrinks by 60. That would be short-term reversal after
  a price drop, not slow valuation reversion; the claim needs the 42- and 60-session averages at or above the 21-session
  one.'
- 'Strategy: net Sharpe on dev below 0.5, or not at least T-bill Sharpe + 0.10, or the one-sided bootstrap bound
  of the Sharpe difference at or below zero.'
- 'Strategy: in the G1 leg split the long (cheap) leg has a non-positive Sharpe. The claim is that cheap markets
  earn more; a book paid only by the short leg would be paid by a different mechanism (rich-market crashes, or beta).'
- 'Robustness: fewer than 75 % of the neighbors (lookback_months 24/48, hold_months 6/18 and their combinations)
  beat the T-bill benchmark, or one third of dev carries more than 60 % of the log return.'
notes: 'Brief fit: the brief asks for a 6-24 month hold on US ETFs across asset classes. This card holds 12-month
  cohorts of US-listed ETFs, but within one asset class (country equity). Reason: a yield is a valuation only relative
  to a comparable cash flow. Dividend yields, bond yields and REIT payouts across classes differ in growth and duration,
  and bond ETF yields trended down over the whole dev period, so a mixed ranking would sort on asset class, not
  on cheapness. Country equities are the one ETF class with about twenty comparable, currency-free yields.

  Why this is not H-0060 again (family long-term-reversal, honestly reused; H-0060, H-0062, H-0088, H-0151 count
  against it): H-0060 sorted on USD price return over 48 months, skipping the last year, so currency and fundamental
  declines were mixed in. Its lesson named currency as an unseparated confound. This card (1) uses USD dividends
  over USD price, which is currency-free; (2) nets dividend changes out, so a price fall that matches a dividend
  cut does not mark the ETF cheap. That is the Campbell-Shiller discount-rate part, the part theory says predicts
  returns; (3) standardizes by own history, which removes persistent identity (K-0025, K-0184) the way the passing
  currency value cards did (H-0062, H-0088); (4) matches legs on past 12-month return instead of skipping it, as
  K-0121 and K-0128 asked. That removes the momentum loading of a recent fall, the likely reason a raw reversal
  sort is wrong-signed in the first quarter. Not a retune of H-0060: different input, different normalization, different
  leg construction.

  Forecasts (K-0098, K-0120, K-0181). Eligibility: about 18 ETFs from early 2003 (17 original 1996 country ETFs
  + SPY, after 504 + 756 sessions of warm-up), 21 once EWZ, EWY and EWT have five years (about 2005), and all 22
  from about 2008 (EZA). Events: 8 per month on about 210 dates, about 1600-1750 events. The first G1 third (1998
  to mid-2005) holds only about 2.5 years of events, so it is thin but not empty. Round trip: about 10 bps for SPY,
  EWJ, EWZ and EWY and 20-40 bps for thin early-era funds (EWO, EWK, EWD, EWN): take about 20 bps as the mean. Gross
  per event at 60 sessions: central +80 to +120 bps (a cheap-minus-rich country spread of several percent a year,
  60/252 of it per leg, larger at the extremes); pessimistic 0 to +20 bps. Placebo bar: country ETF relative returns
  over 60 sessions have a standard deviation of about 7 %, the 8 marks per date are correlated and the monthly windows
  overlap. My rough estimate is a bar of 100-150 bps, so the central case sits near the bar. The likeliest death
  is a ''cannot tell'' at the percentile with the bar above cost (K-0034, K-0076). The second likeliest is a wrong
  sign in the 2008 or euro-crisis era, when cheap markets kept falling. The judge sees only 60 of the 252 claimed
  sessions; the book run covers the full hold.

  Leg betas (K-0074): z-scores (not raw log-yield gaps) keep volatile emerging markets from filling both extremes,
  and the momentum halves balance past return. Still, after a crisis the cheap leg may tilt toward higher-beta markets.
  The book uses inverse-volatility weights within legs, while the event study compares raw returns against raw peers,
  so a remaining beta gap would show as a cycle-dependent sign by third. Short legs of country ETFs carry no modeled
  borrow cost. These are large, easy-to-borrow funds, but rich-market shorts held for a year are flattered.

  Data dependence: the signal needs sharadar_sfp total returns that include distributions (closeadj adjusted for
  dividends). If they do not, d_t is zero and the strategy must fail at G0, not trade silently. Year-end capital-gains
  distributions of a country fund inflate D for one year; the own-history z and the 24-month window dampen this.
  ETFs have no forward data, so G4 is the ceiling (K-0014). Universe chosen by a structural rule (every US-listed
  single-country equity ETF with a price before 2004, plus SPY for the US), not by later performance. Ticker coverage
  in SFP is checked only at G0 (K-0102). A missing ticker should be dropped and reported, not replaced.'
