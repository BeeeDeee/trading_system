id: H-0076
version: 1
title: Korean-exchange premium transmission - Binance perps dollar-neutral, long coins whose Upbit KRW price runs
  abnormally rich versus Binance, short the abnormally cheap, hold 3 days
author_agent: scout
family: segmented-venue-premium-transmission
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Offshore liquidity providers and holders on Binance who sell to (or buy from) the arbitrage flow
    at prices that do not yet include the Korean demand, because they do not watch the KRW order books or cannot
    act on them. Korean retail pays the premium itself, but the strategy earns the offshore catch-up, not the premium.
  why: 'Korean crypto exchanges are a segmented market: foreigners cannot open accounts, residents need real-name
    bank accounts and face foreign-exchange limits, so KRW cannot be moved freely in and out. Makarov and Schoar
    (JFE 2020) document that this lets Korean prices sit well above offshore prices for long periods (the ''kimchi
    premium''). When Korean retail demand concentrates on particular coins, the Upbit KRW price of those coins runs
    ahead of their offshore price. The only way the excess demand reaches the offshore market is through capacity-limited
    arbitrageurs who buy the coin offshore, ship it to Korea and sell it for KRW. They then hold KRW that is hard
    to bring back out, so each arbitrageur can only repeat the trade slowly. That offshore buying is spread over
    days, so a coin whose Korean price is abnormally rich relative to its Binance price should outperform other
    coins on Binance over the next few days. Coins that are abnormally cheap in Korea get offshore selling (coins
    bought in Korea with KRW and sold offshore for USDT) and should underperform. Comparing across coins removes
    the KRW/USDT exchange rate and the market-wide Korean premium. What is left is coin-specific Korean demand pressure
    that has not yet passed through to the offshore price.'
  why_not_arbitraged: The full arbitrage needs both venues, KRW banking access and repatriation of KRW, which capital
    controls and exchange KYC limit. Front-running only the offshore leg across many altcoins needs perp shorts,
    pays 25-40 bps per round trip on mid-cap perps, carries crypto-sized idiosyncratic risk and has little capacity,
    so large funds do not bother. Withdrawal suspensions on the Korean venue can block the arbitrage path at times,
    which makes the premium noisy rather than clearly profitable.
signal:
  description: 'Daily decision after the 00:00 UTC close of day t, using only data up to that close; trades at the
    open of day t+1 (00:00 UTC). Inputs per coin j: the Binance USD-M perp close P_j and basis b_j (extras basis
    = perp/spot - 1) from binance_perp_1d, and the Upbit KRW close U_j and KRW traded value V_j of the same UTC
    day from upbit_krw_1d. Upbit day candles span 00:00-24:00 UTC, the same day boundary as Binance. Coins are matched
    by base asset: perp id <BASE>USDT.P matches Upbit key <BASE>. Ids with a numeric multiplier prefix (e.g. 1000SHIB)
    do not match and are never eligible. Spot-equivalent Binance price S_j = P_j / (1 + b_j); if basis is missing,
    S_j = P_j. Step 1 (relative premium): for every coin in the point-in-time top-30 perp universe with P_j, U_j
    present on day t and V_j >= 1,000,000,000 KRW, compute k_j = ln(U_j) - ln(S_j) (the KRW per USDT implied by
    coin j). Let m(t) be the cross-sectional median of k_j over these coins. Relative premium r_j(t) = k_j - m(t).
    Coins with |r_j(t)| > 0.20 are dropped for the day (likely token mismatch, redenomination or frozen wallets).
    Step 2 (abnormal premium): a_j(t) = r_j(t) minus the median of r_j over days t-B .. t-1 (B = baseline_days).
    This needs at least two thirds of those B days with a valid r_j, otherwise j is ineligible on day t. Step 3
    (legs): if at least 10 coins are eligible on day t, rank them by a_j(t). Long leg = the n_leg highest, short
    leg = the n_leg lowest. With fewer than 10 eligible coins no cohort is formed that day. Step 4 (book): each
    day''s cohort has gross 1/H (H = hold_days): +0.5/(H*n_leg) on each long coin and -0.5/(H*n_leg) on each short
    coin, entered at the open of t+1 and closed at the open of t+1+H. The portfolio is the sum of the live cohorts,
    netted per coin, so it is dollar-neutral with gross <= 1. If a coin leaves the universe or its perp data is
    missing, its weight in all cohorts is closed at the next decision and not replaced. Funding is charged by the
    engine.'
  params:
    baseline_days:
      grid:
      - 14
      - 30
      - 60
      value: 30
    hold_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    n_leg:
      grid:
      - 2
      - 3
      - 4
      value: 3
  timeframes:
  - 1d
mechanism_test:
  event: 'Coin j is placed in the long leg (side +1: among the n_leg highest abnormal Korean relative premiums a_j(t))
    or the short leg (side -1: among the n_leg lowest) of the cohort formed after the close of day t, exactly as
    in signal steps 1-3. Other universe coins on that date are the unmarked peers.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 3
data_requirements:
- dataset: binance_perp_1d
  description: Tradable perps (PIT top-30 by 30-day quote volume); extras basis and funding are used.
  fields:
  - ret_co
  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2019-12-01'
  - '2022-12-31'
- dataset: upbit_krw_1d
  description: 'NEW DATASET (free, public, no key). Upbit (South Korea''s largest exchange) KRW-market daily candles
    from the public REST API GET https://api.upbit.com/v1/candles/days?market=KRW-<BASE>&count=200&to=<UTC timestamp>
    (paginate backwards, max 200 candles per call, rate limit about 10 requests/s). Day candles start at candle_date_time_utc
    00:00 (09:00 KST), the same UTC day boundary as Binance daily bars. One series per base asset: <BASE>.close
    = trade_price (last trade of the UTC day, KRW) and <BASE>.value_krw = candle_acc_trade_price (KRW traded value
    of the day). All KRW markets the API serves (market list from GET https://api.upbit.com/v1/market/all), plus
    delisted KRW markets wherever the API still returns their history; please report which delisted markets could
    not be fetched. History from the first Upbit candle (late 2017) to today. Signal only, not tradable; clock crypto
    (the candle of UTC day d is known at 00:00 UTC of d+1). Forward source: the same endpoint, refetched daily.'
  fields:
  - close
  - value_krw
  frequency: 1d
holding_period:
  rebalance: daily
  typical_days: 3
market_exposure: market_neutral
falsification_criteria:
- 'Mechanism: the side-adjusted 3-day abnormal return of leg entries does not exceed the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism sign: if the pooled 3-day abnormal return is negative (rich-in-Korea coins underperform on Binance),
  the transmission story is refuted. The mirror trade (fade the Korean premium) is dev-selected and must not be
  refiled.'
- 'Mechanism shape: if the 1-day horizon is zero or wrong-signed and the effect appears only at 10 days, it is slow
  drift, not capacity-limited arbitrage flow, and the card is wrong.'
- 'Era: the latest third of dev with a negative abnormal return kills the card, whatever the pooled result (K-0060).'
- 'Strategy: net Sharpe on dev below 0.5, or not at least 0.10 above T-bills, or the one-sided bootstrap bound of
  the Sharpe difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (hold_days 2/5, n_leg 2/4, baseline_days 14/60 and their combinations)
  beat T-bills with Sharpe >= 0.5, or net Sharpe at doubled costs below the T-bill bar.'
notes: 'Brief fit: the brief asks for cross-asset signals with a 1-5 day hold. The signal comes from a different
  market (the Korean won exchange market, cut off by capital controls) and the trade is in another (Binance USD-M
  perps). Both are crypto, so this is cross-market rather than cross-asset-class. I chose it because every cross-asset-class
  channel loadable today is already dead or crowded in this lab: daily lead-lag across stocks, ETFs, FX, macro and
  crypto (mrel; K-0080), stress rebounds (K-0084), macro calendars (K-0070), and rate and oil shocks (H-0056, H-0075).
  This card does answer K-0080''s demand to say why information travels slowly through this particular channel:
  capital controls and KRW repatriation limits cap arbitrage capacity. FRED KRW/USD (noon fixing, stale) is deliberately
  not used: the cross-sectional median removes the exchange rate and the market-wide premium exactly, at the same
  00:00 UTC timestamp. New data: upbit_krw_1d is essential, because the Korean price is the signal and no catalog
  dataset holds it. It is free, public and has a forward source, so unlike ETF and stock cards this one could reach
  G5. Data risks for the Archivist and the Skeptic: (1) survivorship in the signal, since the API may not serve
  markets Upbit delisted (several waves of delistings), and those are the pump-prone coins; (2) ticker collisions
  or redenominations (same symbol, different token), handled by the |r| > 20 % exclusion; (3) withdrawal suspensions
  freeze the arbitrage path and create premiums that cannot transmit, which adds noise against the card. Relation
  to existing families: not btc-lead-altcoin-lag (no BTC trigger; same coin, two venues), and not a sort on own
  return, funding or volume (short-term-reversal / perp-leverage-crowding). It is related to etf-premium-arbitrage
  (H-0037, twin-ETF gap), because it bets on convergence of a cross-venue gap. It differs in that only the offshore
  leg is traded, and the claim is that the segmented venue leads because arbitrage capacity is capped by capital
  controls, not by AP creation and redemption. If the Chair judges it the same mechanism, merge the family; I would
  not object. References: Makarov and Schoar (2020, JFE, ''Trading and arbitrage in cryptocurrency markets'') is
  cited in the mechanism text only as evidence that the segmentation and the premium exist. It does not claim the
  cross-sectional offshore catch-up tested here, so I did not list it under references, where it would add the 20-trial
  literature prior meant for published return anomalies and a publication split at the start of the dev window.
  The Skeptic may add it if they disagree. Expected numbers (priors, not data): about 12-25 eligible coins per day
  in 2020-2022 (Binance top-30 perps that also trade on Upbit KRW; BNB and others do not). Events = 2 x n_leg per
  date, so about 6 per date on roughly 1,000 dates, about 6,000 events, with at least 4 unmarked peers per date
  by the 10-coin rule. Round trip on top-30 perps is about 25-40 bps. For the book to clear Sharpe 0.5 after costs,
  the 3-day abnormal return per leg entry must be roughly 0.5 % or more. At 0.3 % costs (turnover about 0.4-0.6
  of gross per day, lower when premiums persist) eat most of it. Both legs are mostly mid-cap alts, so the beta
  gap between marked coins and peers should be small (K-0074), but high-premium coins may be higher beta during
  manias. The dev window holds one boom and bust (K-0006), so a near miss means ''cannot tell''. The asymmetry of
  the mechanism (premiums are harder to arbitrage than discounts) predicts a stronger long leg. A by-side report,
  if the gate offers one, would test that.'
