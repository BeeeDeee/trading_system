id: H-0020
version: 1
title: Option-expiration hedge-unwind cycle - LIQ-500 beta-neutral, long the most option-active (most liquid) names
  and short the least liquid through the monthly expiration week, reversed the week after
author_agent: scout
family: option-expiration-hedging-flows
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Option market makers and delta-hedging dealers, who trade the underlying on a mandate (stay delta-neutral)
    regardless of price and accept small predictable impact as part of the cost of making markets; plus the stock
    sellers on the other side of the post-expiration hedge rebuild.
  why: Option market makers who are net short stock to hedge the options public investors hold (public investors
    are net long puts and protective structures on large, option-active stocks) must buy back those short-stock
    hedges as the front-month options lose delta into the third-Friday expiration. The resulting buy-side hedge
    flow is concentrated in the expiration (OE) week and in the stocks with the most option open interest, so these
    stocks earn abnormally high returns in the OE week relative to stocks with less option activity (Stivers and
    Sun 2013, S&P 100 stocks; Ni, Pearson and Poteshman 2005 show market-maker hedge rebalancing moves stock prices
    around expiration). In the following week new front-month positions are opened and market makers re-establish
    short hedges, so the same stocks should give part of it back (Stivers and Sun report modest underperformance
    in the week after). Within LIQ-500 every stock has listed options, but option open interest scales with stock
    trading activity, so the most traded names carry by far the largest hedge books; the least traded LIQ-500 names
    are the control group with less option activity.
  why_not_arbitraged: The pressure is small per stock (tens of basis points over a week), sits in a long/short book
    that must turn over completely twice a month, and competes with spread costs; the dealers' hedging is non-discretionary,
    so it recurs each month. Capacity is limited because a large arbitrageur would itself become the price impact
    it trades against.
signal:
  description: 'Calendar (known in advance, no data): the monthly expiration Friday is the third Friday of each
    calendar month (the Friday whose day of month is 15-21). The OE week is the set of XNYS trading days from the
    Monday to the Friday of that calendar week (if the Friday is a holiday the week ends on the Thursday). The POST
    week is the set of XNYS trading days of the following calendar week (Monday to Friday). Decision dates, all
    after the close of day t with data up to that close, trades at the open of t+1: (D1) t = last trading day before
    the first trading day of the OE week: open the OE book; (D2) t = last trading day of the OE week: replace it
    with the POST book (sides reversed); (D3) t = last trading day of the POST week: go flat. Outside these two
    weeks the book is in cash. Groups (computed at D1 and kept unchanged for D2, so the same stocks are reversed):
    eligible = stocks in the point-in-time LIQ-500 universe at t, tradable at t, with dollar_volume on at least
    80 % of the last lookback_days trading days. Rank eligible stocks by mean daily dollar_volume over the last
    lookback_days trading days up to t. HIGH = the leg_n highest, LOW = the leg_n lowest. At D2, drop any group
    member that is no longer tradable (no replacement). Beta neutrality: for each eligible stock, beta = OLS slope
    of its daily total returns ((1+ret_co)*(1+ret_oc)-1) on the equal-weight mean return of the eligible stocks
    over the last 252 trading days up to t (at least 126 observations, otherwise beta = 1); clip each beta to [0.3,
    3]. Leg betas b_H, b_L = mean beta of the leg members, each clipped to [0.5, 2]. Leg gross weights g_H = b_L
    / (b_H + b_L) and g_L = b_H / (b_H + b_L) (sum 1, net beta zero). Weights are equal within a leg: OE book =
    +g_H/leg_n per HIGH stock and -g_L/leg_n per LOW stock; POST book = the exact negative of the OE book (same
    stocks, same magnitudes, re-scaled to the D2 tradable members so gross stays 1). Positions are not rebalanced
    inside a week; a stock that delists during the week takes its terminal return and its weight goes to cash. Gross
    exposure is 1 during both weeks, 0 otherwise.'
  params:
    leg_n:
      grid:
      - 50
      - 100
      - 150
      value: 100
    lookback_days:
      grid:
      - 21
      - 63
      - 126
      value: 63
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At D1 (last trading day before the monthly option-expiration week) the HIGH group (leg_n most liquid LIQ-500
    stocks by mean dollar volume over lookback_days) is an event with side +1 and the LOW group (leg_n least liquid)
    an event with side -1; at D2 (last trading day of the expiration week) the same stocks are events again with
    the sides reversed (HIGH -1, LOW +1), i.e. the post-expiration hedge rebuild. Primary configuration leg_n =
    100, lookback_days = 63.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
