falsification_criteria:
- 'Mechanism test fails: side-adjusted 5-day abnormal return of the D1/D2 events at or below the 95th percentile
  of the time-shifted placebos, sign kept in fewer than 2 of 3 sub-periods, or gross abnormal return per event below
  the round-trip cost.'
- 'Mechanism-specific: if the OE-week events alone (D1, HIGH +1 / LOW -1) have a non-positive mean side-adjusted
  5-day abnormal return, the hedge-unwind story is refuted even if the pooled test passes (the POST-week reversal
  alone is not the claimed mechanism).'
- Net Sharpe on dev below 0.5 against T-bills, or the one-sided bootstrap bound of the Sharpe difference vs T-bills
  at or below zero.
- Fewer than 75 % of the neighbors (leg_n 50/150, lookback_days 21/126 and their combinations) beat the T-bill benchmark,
  or the strategy does not beat T-bills at costs x2.
- 'Publication decay: excess Sharpe after 2013 below half of the excess Sharpe before (the effect was published
  in 2013 and weekly options spread after 2010, both of which should dilute a monthly third-Friday cycle).'
- S&P 500 alt universe Sharpe below half of the LIQ-500 Sharpe.
notes: 'Brief fit: US single stocks, cross-sectional, 5-day holds, mechanism test declared. Why this is not a near-copy
  of dead families: K-0024 found that information/sentiment events in large caps vanish at short horizons while
  mandated-flow events (month-turn beta spread H-0016, index inclusion H-0017) were the only ones near or above
  the placebo bar; dealer delta hedging is a mandated flow on a fixed, pre-known calendar, and option expiry is
  listed as untested in prior_studies.md and in the H-0001/H-0016 open questions. It is not short-term reversal
  (no return-based selection: groups are formed on dollar volume only, and the placebo keeps the same stocks, so
  any liquidity or size drift is netted out; only the calendar timing is tested) and not a volume-attention book
  (H-0014: volume level is a fixed proxy for option open interest, not a volume shock). The window book is deliberately
  two-sided (OE week plus the reversed POST week) so the book is invested about 45-50 % of trading days, avoiding
  the 20 %-exposure ceiling K-0027 describes for single-window books, and so the event set is large (about 200 events
  on each of ~550 dates), the power fix K-0026 recommends. Beta-neutral leg scaling keeps the market-wide OE-week
  effect (index option hedging) from posing as a cross-sectional one. Weakness to read honestly: dollar volume is
  only a proxy for option open interest (no options data is loadable), so a failure cannot fully separate "no hedge
  pressure" from "bad proxy"; a Builder diagnostic splitting the pooled abnormal return into D1 and D2 events would
  help, if the output channel exists. Expected cost: about 4 units of gross turnover per month at 3-6 bps half-spread,
  roughly 2 %/year at x1, which the spread must clear. No new dataset needed.'
