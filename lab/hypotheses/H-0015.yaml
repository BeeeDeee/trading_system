id: H-0015
version: 1
title: Filing-anchored earnings-announcement premium - LIQ-500 dollar-neutral, long stocks whose predicted announcement
  (last year's SF1-validated reaction day) is 3 days ahead, hold 5 days
author_agent: scout
family: earnings-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Institutional holders that cut or hedge single-name exposure before binary events because of risk
    limits, and attention-driven (mostly retail) buyers who buy at the elevated post-announcement price; the strategy
    holds the event risk the first group sheds and sells into the demand of the second.
  why: 'Stocks earn abnormally high returns in the days around their scheduled earnings announcements (Beaver-style
    information events; Frazzini and Lamont; Barber, De George, Lehavy and Trueman; Savor and Wilson). Two non-exclusive
    channels: (1) risk - announcements resolve lumpy, partly systematic uncertainty (announcer returns covary with
    aggregate earnings news), so holders are paid for bearing it; (2) attention - the announcement draws attention
    and volume, attention-driven buyers are net buyers and short-sale-constrained pessimists stay out, so prices
    are pushed up into and on the announcement. Firms keep a very stable reporting calendar (Johnson and So: the
    same fiscal quarter of last year is a strong predictor of the date), so the event is predictable without paid
    calendar data, and the premium accrues within a few days of it, which fits the 1-5 day horizon of this brief.'
  why_not_arbitraged: Harvesting it means carrying many concentrated earnings-day jumps (several percent per name)
    every season; it needs broad diversification and capital that tolerates large idiosyncratic swings, capacity
    is limited to a few days per name per quarter, and many funds' risk rules forbid exactly this exposure.
signal:
  description: 'Inputs: sharadar_sep ret_co, ret_oc, dollar_volume, tradable for the LIQ-500 (point-in-time membership);
    sharadar_sf1 sf1_arq_revenue and sf1_arq_netinc as daily matrices (usable from the day after the SEC filing).
    All decisions after the close of day t with data up to that close; trades at the open of t+1. Step 1, filing
    days: for each stock, a quarterly filing day F is a trading day on which sf1_arq_revenue or sf1_arq_netinc differs
    from its value on the previous trading day (NaN-to-value counts; NaN-to-NaN does not). If two filing days of
    a stock are fewer than 40 trading days apart, keep only the first (amendments). Step 2, last year''s reaction
    day: for each filing day F, take the trading day s* with the largest dollar_volume among the 30 trading days
    ending on F (F included). Keep s* only if its dollar_volume is at least min_spike times the median dollar_volume
    of the 63 trading days ending the day before s*; otherwise that quarter yields no prediction. Step 3, predicted
    reaction day: r = the first trading day whose calendar date is on or after the calendar date of s* plus 364
    days (same weekday one year later). Step 4, event: stock j has an event at the close of day t if t is exactly
    lead_days trading days before its predicted r (r = t + lead_days) and j is a LIQ-500 member and tradable at
    t. Everything used (F, s*) lies roughly a year before t, so no future data enters. Step 5, positions: each event
    opens a long position at the open of t+1, held for 5 trading days (exit decided after the close of t+5, traded
    at the open of t+6). With lead_days 3 the hold spans r-2 .. r+2 and includes the overnight gap into r. Long
    leg: every active event name gets weight min(0.05, 0.5 / n_long), where n_long is the number of active event
    names, so the long leg totals min(0.5, 0.05 * n_long). Short leg: the same total, equally weighted across all
    other LIQ-500 members tradable at t without an active event. Dollar-neutral, gross <= 1. Weights are recomputed
    every day (event-driven); when there are no active events the book is flat (off-season weeks). Missing data:
    a stock with no SF1 history or no filing day in the relevant window has no event and can only be in the short
    leg; a name that becomes untradable or leaves the universe during a hold is closed at the next open. Diagnostic
    (reported, not a gate): for every event, the ratio of the largest dollar_volume within t+1..t+5 to the median
    dollar_volume of t-62..t; the median over events tells whether the prediction hits real announcement days.'
  params:
    lead_days:
      grid:
      - 2
      - 3
      - 4
      value: 3
    min_spike:
      grid:
      - 1.5
      - 2.0
      - 3.0
      value: 2.0
  selection_procedure: Primary configuration fixed in advance (lead_days 3 centres the 5-day hold on the predicted
    reaction day; min_spike 2 is a round 'clearly abnormal volume' level); no selection on dev.
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: After the close of day t, stock j's predicted earnings reaction day (the trading day 364 calendar days
    after its highest-volume day in the 30 trading days up to a quarterly SF1 filing one year earlier, that day
    having at least min_spike times its 63-day median dollar volume) is exactly lead_days trading days ahead. side
    = +1 (the stock should outperform the other universe stocks).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
