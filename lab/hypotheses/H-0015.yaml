  typical_days: 5
market_exposure: market_neutral
references:
- cite: Frazzini, Lamont (2007) The earnings announcement premium and trading volume, NBER Working Paper 13090
  year: 2007
- cite: Barber, De George, Lehavy, Trueman (2013) The earnings announcement premium around the globe, Journal of
    Financial Economics
  year: 2013
- cite: Savor, Wilson (2016) Earnings announcements and systematic risk, Journal of Finance
  year: 2016
- cite: 'Johnson, So (2018) Time will tell: information in the timing of scheduled earnings news, Journal of Financial
    and Quantitative Analysis'
  year: 2018
falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events does not beat the 95th percentile of the time-shifted
  placebos, keeps its sign in fewer than 2 of 3 sub-periods, or earns less gross per event than its round-trip cost
  -> no exploitable announcement premium in LIQ-500 with a validated date proxy.'
- 'Proxy check (diagnostic, read by the Skeptic and Librarian): if the median over events of max dollar_volume in
  t+1..t+5 / 63-day median dollar_volume is below 2.0, the date prediction failed and a death says nothing about
  the premium itself.'
- Net Sharpe on dev below 0.5 or below the T-bill benchmark + 0.10; or the bootstrap bound of the Sharpe difference
  below zero.
- 'Neighbors lead_days 2 and 4 or min_spike 1.5 and 3.0: fewer than 75 % beat the benchmark (an isolated peak).'
- At costs x2 the Sharpe no longer beats the benchmark bar.
- More than 60 % of the dev log return comes from one of the three sub-periods (e.g. only the pre-decimalization
  era).
notes: 'Same family as H-0008 on purpose (second trial of earnings-announcement-premium). H-0008 died as a real
  negative but its lesson names the unresolved question: whether its proxy (volume 52 and 13 weeks ago) hit announcement
  weeks at all, since volume seasonality also catches index rebalances and option expiries. This card changes the
  proxy, not the threshold: last year''s reaction day must lie in the 30 trading days up to an actual quarterly
  SEC filing (dated by the SF1 as-reported values changing), which excludes recurring non-earnings volume spikes;
  the prediction uses only the same fiscal quarter one year back (the Johnson-So convention, which keeps Q4/10-K
  delays aligned); the 5-day hold is centred on the predicted day instead of a full following week, because the
  premium lives in a few days around the event; and the long leg is diversified (max 5 % per name) against an equal-weight
  short of the rest of the same universe, so size and beta are not systematically mismatched. K-0004 notes that
  SF1 filing dates lag the press release: that is why the filing is used only as an anchor (the reaction day is
  searched in the 30 trading days up to it), never as the event date. The mechanism test runs first; the volume
  diagnostic lets the lab tell a failed proxy from an absent premium. Exposure: earnings seasons cover roughly half
  of the weeks, and the gross scales with the number of active events, so mean exposure should clear 20 %. No forward
  data for US stocks: the card can pass at most G4.'
