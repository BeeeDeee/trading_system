id: H-0011
version: 1
title: 52-week-high anchoring - LIQ-500 market-neutral, long stocks that just broke through a stale 52-week high
  (not on a top-decile move day), short the rest, hold 5 days
author_agent: scout
family: 52-week-high-anchoring
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Individual investors and limit-order sellers who sell at or just below the old 52-week high because
    it is a round psychological target (disposition / anchoring), providing liquidity to buyers too cheaply just
    before the price breaks through; they keep doing it because the 52-week high is printed in every quote screen
    and the behaviour is a stable bias, not a learnable one-off mistake.
  why: 'Investors anchor on the 52-week high as a salient reference price. As a stock approaches a high it has not
    touched for weeks, individual holders (disposition effect, "get out at the old high") and resting sell limit
    orders placed at the old high absorb buying pressure, so the price is held back below the anchor even when information
    justifies a higher value. When the price finally closes above the old high, that supply is exhausted and the
    under-reaction resolves over the following days: the stock drifts up relative to other stocks. Huddart, Lang
    and Yetman (2009) document elevated volume at the crossing and positive excess returns in the following week
    (smaller but positive in large caps); George and Hwang (2004) show that nearness to the 52-week high predicts
    returns, consistent with anchoring-driven under-reaction. The effect should be strongest when the old high is
    stale (set weeks ago), because more anchored sellers have accumulated at that level.'
  why_not_arbitraged: The edge per event is small (a few tenths of a percent over a week in large caps), spread
    over many names and short-lived, so it needs a diversified high-turnover book whose spread costs eat a large
    part of it; the long leg is concentrated in recent winners, which carry short-term reversal risk, so the trade
    is noisy and capacity is limited for a fund that needs size.
signal:
  description: 'Data: sharadar_sep, universe LIQ-500 (point-in-time liquidity rank), dev rows only. For every stock
    build a total-return index P from the daily total returns (ret_co and ret_oc combined into the close-to-close
    return; P is the split- and dividend-adjusted closing level). Decision after the close of day t using data up
    to that close only: (1) Old high: H_t = max of P over the 252 trading days t-252 .. t-1 (the stock must have
    a P value on at least 240 of those 252 days, otherwise no event). Let s_t = the number of trading days since
    the day on which H_t was set (the most recent day in t-252 .. t-1 where P equalled H_t). (2) Event (breakthrough)
    on day t for stock j: P_t > H_t AND s_t >= gap_days (the old high is stale: the stock spent at least gap_days
    trading days below it) AND the stock''s close-to-close return on day t is NOT in the top decile of the LIQ-500
    cross-section of that day (excludes big news/overreaction days, which belong to the short-term-reversal and
    news-drift families) AND the stock is in LIQ-500 and tradable on day t. (3) Long set on day t = all stocks with
    an event on any of the days t-hold_days+1 .. t that are tradable at the next open. Each event is therefore held
    for hold_days trading days: bought at the open of t+1, sold at the open of t+1+hold_days. A stock with a new
    event while already held simply extends its holding to hold_days after the newest event. (4) Weights for the
    open of t+1: long leg = +0.5 split equally over the long set; short leg = -0.5 split equally over all other
    LIQ-500 stocks that are tradable on t+1 and have a price on t. Gross = 1, dollar-neutral. If the long set is
    empty, hold nothing (flat, cash). (5) A held stock that drops out of LIQ-500 keeps its long position until its
    scheduled exit; a delisted stock gets the dataset''s terminal return. Missing returns are not filled: a stock
    without a price on t cannot generate an event on t. Rebalancing is daily (the long set changes as events enter
    and age out; the short leg is re-equal-weighted daily).'
  params:
    gap_days:
      grid:
      - 10
      - 21
      - 42
      value: 21
    hold_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
  timeframes:
  - 1d
mechanism_test:
  event: Stock j in LIQ-500 closes on day t above the maximum of its total-return index over t-252 .. t-1, that
    old maximum was set at least gap_days (21) trading days before t, and j's close-to-close return on t is not
    in the top decile of the LIQ-500 cross-section that day (a breakthrough of a stale 52-week high on a non-news
    day). side = +1 (the mechanism says j outperforms the other stocks afterwards).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
