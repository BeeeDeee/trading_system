  year: 2009
- cite: George, Hwang (2004) The 52-Week High and Momentum Investing, Journal of Finance
  year: 2004
falsification_criteria:
- 'Mechanism test: the side-adjusted 5-day abnormal return after breakthrough events does not exceed the 95th percentile
  of the 200 time-shifted placebos, or keeps its sign in fewer than 2 of 3 sub-periods.'
- 'Mechanism test: the gross 5-day abnormal return per event is below the round-trip cost of trading the event (cost
  ratio < 1).'
- Net Sharpe on dev below the T-bill bar (Sharpe 0.5) or bootstrap bound of the excess below zero at G1.
- Fewer than 75 % of the neighbors (gap_days 10/42, hold_days 3/10 and their combinations) clear the T-bill bar
  at G2.
- Post-publication (2009 onward) excess Sharpe less than half of the pre-publication excess Sharpe (publication
  decay).
- In the S&P 500 alt universe the Sharpe is below half of the LIQ-500 Sharpe or below the bar (the effect would
  then be a less-liquid-name artifact, like H-0007).
- Doubling costs pushes the Sharpe below the T-bill bar.
notes: 'Brief: short horizon (1-5 days), US single stocks, cross-sectional - followed exactly (5-day hold, daily
  overlapping events). Why this is not a re-run of a killed family: (a) short-term-reversal (studies 5-7, H-0006,
  H-0007) bets against recent moves; this bets WITH a move, and the event is defined by a reference price, not by
  the size of the move; top-decile move days are excluded on purpose so the event does not overlap the overreaction/news
  days where reversal (H-0007) and the losing news-drift book (H-0009) live. (b) H-0009 (disposition-news-drift)
  conditioned on volume shocks and on the sign of the 12-month capital gain; this card uses no volume and no gain
  sign, only the crossing of a stale anchor. (c) Study 1 contained generic breakout rules inside a walk-forward
  ensemble of 3 027 candidates; the anchoring event at a stale 52-week high was never tested in isolation, with
  a mechanism test, as an event-driven market-neutral book. If the Skeptic judges this to be the breakout family
  of study 1, I accept that family name instead. The 252-day window is the definition of the anchor (the 52-week
  high shown on quote screens), not a tuned parameter; the top-decile exclusion is a fixed convention, not tuned.
  Known approximation: investors see the split-adjusted price high, which excludes dividends; the total-return index
  high differs by at most the dividends of a year and is used so that splits cannot create fake breakthroughs. Most
  likely death: costs - the large-cap effect reported in the literature is about 0.2 % per week, only about 1.5-2x
  the round trip in LIQ-500, and the long leg (recent winners) carries reversal risk; the publication-decay check
  (2009 in dev) is the second risk. Expected to be invested most days (breakthroughs occur daily in LIQ-500 except
  in deep bear phases), so exposure and entry minimums should be met.'
