falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the event at 5 sessions is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost: the diffusion seen for oil does not extend
  to other direct commodity links.'
- 'Mechanism: the latest third of dev has the wrong sign (K-0060): treated as a kill, not as noise.'
- 'Mechanism shape: the abnormal return is at its largest at 1 session and gone or reversed by 5 (a liquidity bounce,
  not diffusion), or it keeps growing to 21 sessions while the placebo mean grows with it (stock-identity drift,
  not news timing).'
- 'Model: a ridge on the same features, rows, label and refit schedule (framework ridge) gives the same or a larger
  event gross, so the conjunction the gbm is claimed to find is not what pays.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference to T-bills not above zero.'
- 'Robustness: fewer than 75 % of the neighbors of shock_z 1.5 and top 0.1 beat the benchmark, or one third of dev
  carries more than 60 % of the log return.'
notes: 'Why this is not a retry of H-0114 or H-0116: same construction (estimated exposure x commodity-specific
  move, gbm, weekly 5-day legs) on new information, with oil removed on purpose. Crude oil enters only as a control
  regressor (USO), so every shock is net of oil and of the S&P 500 and the event set does not reuse H-0114''s oil
  episodes; it answers K-0158''s open question (''oil passed once; is it a property of direct links?'') instead
  of re-testing oil. Rates, dollar and credit (H-0116) had no direct producer/user link; gold, gas, grains and base
  metals do. The family is reused on purpose so the trials count together (3 earlier: H-0056, H-0114, H-0116). Forecasts
  (written before any result, K-0120/K-0159): weekly decision dates in the usable window about 600 (features from
  about 2008-05 after the 252-session warm-up, model scores from the first fit about a year later); shock dates
  (any of four commodities at |z| >= 1.5) about 35-45 % of weeks, i.e. 180-280 dates; events (leg members whose
  implied move agrees with the side) about 50-80 per date, 6000-18000 in total. Round trip about 6-12 bps (LIQ-500
  half-spread tiers 3/6 bps). Gross per event at 5 sessions: central 10 bps, pessimistic 1 bp, mechanism absent
  at or below 0. The central case is about the round-trip cost, so the cost check is a coin flip even if the mechanism
  exists; with about 200 shock dates the placebo cloud will be wider than for daily cards (K-0026), so a ''cannot
  tell'' is possible. Book arithmetic: invested only in shock weeks, mean exposure about 0.3 (0.35-0.45 of weeks
  x about 0.85 of the window after the first fit), full rebuild each shock week; at 10 bps gross per entry the book
  earns roughly its own cost, so the absolute Sharpe floor of 0.5 is the most likely strategy death (as in H-0114),
  and only a gross per event of 25 bps or more would leave a tradable book. Leg betas: the commodity moves are residual
  to SPY, so the sign of a shock is uncorrelated with the market''s direction and a beta gap between the long and
  short legs (K-0074) averages out over shocks rather than tracking the market; both sides are marked, so the placebo
  mean should sit near zero. Requests to the Builder/gate (diagnostics, not part of the rule): events and abnormal
  return by commodity (gold, gas, agriculture, base metals) and by side, and the ridge control''s event gross next
  to the gbm''s (K-0135). If natural gas alone carries the result, the reading is ''energy again'', not ''direct
  links in general''. Brief fit: US single stocks, LIQ-500 cross-section, 5-day hold, walk-forward gbm with a stated
  ridge baseline. No date literals in code; the period start is after the last signal ETF exists.'
