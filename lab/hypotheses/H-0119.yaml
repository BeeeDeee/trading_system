id: H-0119
version: 1
title: Delayed stock response to non-oil commodity news (gold, gas, grains, metals), learned - LIQ-500 neutral 5-day
  legs in shock weeks, LightGBM on implied move x exposure
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Holders and liquidity providers in commodity-linked stocks who trade at prices that have not yet
    absorbed a commodity-specific move: generalist and index-like investors who sell a fertilizer or gold-mining
    stock into a week of commodity gains (or buy a gas-consuming utility after a gas spike) at a stale price.'
  why: 'Gradual information diffusion (Hong and Stein 1999): news that changes a firm''s value only through a commodity
    it produces or consumes reaches the stock with a lag, because the generalist investors who set most large-cap
    prices do not watch commodity markets, and the specialists who do are too few or too constrained to move every
    linked stock at once. Industry and commodity returns lead the stock market (Hong, Torous and Valkanov 2007;
    Driesprong, Jacobsen and Maat 2008). Inside the lab the stock-level form of this passed the mechanism test once,
    for crude oil (H-0114: oil-exposed tails beat same-stock placebos after oil-specific moves, gross above cost,
    response peaking within days), while the same construction on rates, the dollar and credit spreads failed (H-0116),
    and K-0158 asks for a direct, visible economic link before trying other prices. Commodities other than oil give
    exactly such links: gold, natural gas, grains/softs and base metals are revenue for producers (miners, gas producers,
    fertilizer and agribusiness) and input costs for users (utilities and chemicals on gas, food processors on grains,
    industrials on metals). This card tests whether the diffusion seen for oil is a property of direct commodity
    links in general, on commodity shocks that are independent of oil (each commodity''s move is taken net of the
    S&P 500 and of oil), so the episodes are new and not the few oil episodes behind H-0114.'
  why_not_arbitraged: For any single non-oil commodity only a handful of liquid stocks carry a material exposure,
    the exposures are estimated with error, shocks are episodic (a few dozen per commodity in the sample) and a
    specialist book on them carries large idiosyncratic risk per name; dedicated commodity investors hold futures,
    not the linked equities, so little capital is set up to trade the link at a weekly horizon.
signal:
  description: 'All inputs are known at the close of the decision day t; trades at the open of t+1. Tradable: LIQ-500
    stocks (sharadar_sep daily total returns from ret_co and ret_oc, dollar_volume). Signal only, never traded:
    the sharadar_sfp ETFs SPY (market), USO (oil control), GLD (gold), UNG (natural gas), DBA (agriculture), DBB
    (base metals), daily total returns. Decision dates: the last trading session of each calendar week. (1) Commodity-specific
    moves: on each decision date t and for each commodity ETF k in {GLD, UNG, DBA, DBB}, fit OLS of its daily return
    on SPY and USO daily returns over the 252 sessions ending at t; daily residuals e_k. R_k = sum of e_k over the
    last 10 sessions (t-9..t); z_k = R_k / (std of the 252 daily residuals x sqrt(10)). Shocked set S_t = {k : |z_k|
    >= shock_z}. t is a shock date if S_t is not empty; otherwise the book is flat for the week and no row is scored.
    (2) Stock exposures: for every universe member i on t with at least 200 valid daily returns in the 252 sessions
    ending at t, OLS of its daily total return on SPY, USO and the four residual series e_GLD, e_UNG, e_DBA, e_DBB
    over those sessions (residuals as in step 1, same window); coefficients b_ik and t-statistics t_ik; regression
    residual std = idiosyncratic volatility. (3) Features on shock dates (members with all inputs; others not scored):
    F1 implied move IM_i = sum over k in S_t of b_ik x R_k; F2 exposure reliability = max over k in S_t of |t_ik|;
    F3 idiosyncratic volatility from step 2 (last 63 sessions of the residuals); F4 log of the 21-session mean dollar
    volume; F5 shock size = max over k in S_t of |z_k| (a date-level value, the same for every stock, passed raw,
    not z-scored). F1-F4 are z-scored across the scored members of the date (framework helper). (4) Model: framework
    walk_forward with LightGBM (gbm: n_estimators 100, num_leaves 15, learning_rate 0.05, min_child_samples 200,
    subsample 0.8, colsample 1.0), label = cross-sectional rank of the total return from the open of t+1 to the
    open 5 sessions later, training rows = scored rows of past shock dates only, expanding window, refit every 63
    trading rows, purge by the framework. Before the first fit the book is flat. (5) Book: on each shock date with
    at least 100 scored members, long the top `top` fraction of the model score and short the bottom `top` fraction,
    equal weights, 0.5 gross per side (dollar-neutral, gross 1), held to the next weekly decision; on the next decision
    date the book is rebuilt if that date is a shock date and closed otherwise. A stock that leaves the universe
    is closed at the first decision row outside it (engine rule). No literal dates in the code; instruments outside
    the universe are only the six signal ETFs declared below.'
  params:
    shock_z:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
    top:
      grid:
      - 0.05
      - 0.1
      - 0.15
      value: 0.1
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: On a shock date (at least one of GLD, UNG, DBA, DBB has a 10-session move net of SPY and USO of |z| >=
    shock_z), a member stock is in the model's top `top` fraction with a positive implied move (side +1) or in the
    bottom `top` fraction with a negative implied move (side -1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'Implied move: sum over shocked commodities of the stock''s 252-session exposure b_ik (to the commodity''s return
    net of SPY and USO) times the commodity''s 10-session net move; the news the stock should price'
  - 'Exposure reliability: largest |t-statistic| of the stock''s exposures to the shocked commodities (252 sessions);
    separates producer/user links from estimation noise'
  - 'Idiosyncratic volatility: std of the stock''s regression residuals over the last 63 sessions; arbitrage cost
    of trading the link (limits to arbitrage)'
  - Log of the 21-session mean dollar volume; attention and analyst coverage proxy, slower diffusion expected in
    less traded names
  - 'Shock size: largest |z| of the shocked commodities on the date (date-level, raw); attention threshold of the
    commodity news'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The diffusion claim is a conjunction: the delayed response should be proportional to the implied
    move only where the exposure is real (a producer or user, high t-statistic) and the commodity move is large
    enough to be news. Most of the 500 stocks have no true link, so their implied moves are pure estimation noise.
    A ridge on the same features adds implied move, reliability and size, so a large implied move built from a noisy
    beta in a 1.5-sigma week ranks like one from a miner''s or fertilizer producer''s reliable beta after a 3-sigma
    move; and the shock size is constant across stocks on a date, so a ridge on cross-sectional ranks cannot use
    it at all. A small tree ensemble can scale the implied move by reliability and shock size. Who pays: the stale-price
    traders named in the mechanism. If the ridge on the same rows does as well, the plain implied move is the signal
    and the trees added nothing (falsification below).'
