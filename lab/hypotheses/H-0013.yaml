falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the event set (next open to close of t+5, minus the mean
  of the other stocks) is not above the 95th percentile of the 200 time-shifted placebos, or keeps its sign in fewer
  than 2 of 3 sub-periods.'
- 'Mechanism: the gross abnormal return per event is below the round-trip cost of trading it (the diffusion exists
  but is too small to harvest in LIQ-500).'
- 'Mechanism: the abnormal return at horizon 1 and 2 days is not of the same sign as at 5 days (no gradual catch-up,
  the pattern is noise around zero).'
- 'Strategy: net Sharpe on dev below 0.5 or its bootstrap difference vs T-bill not above zero at the 90 % level.'
- 'Robustness: fewer than 75 % of the neighbors (peers_k 5/20, formation_days 3/10, corr_window 126/504 and their
  combinations) beat the T-bill bar, or net Sharpe at costs x2 falls below the bar.'
- 'Era: more than 60 % of the log return comes from one of three dev sub-periods (the early-era pattern of research
  5 and H-0007), or the S&P 500 alternative universe keeps less than half the Sharpe.'
notes: 'Brief: short horizon (5 days), US single stocks, cross-sectional, with a mechanism test. Why this is not
  the short-term-reversal family again (research 5, 7, H-0007, K-0012): the traded names are selected to have an
  unremarkable own return (middle 60 %), so own reversal is neutralised by construction; the signal is the move
  of other, correlated stocks, and the predicted sign is continuation of the peers'' move (momentum-like), the opposite
  of reversal. Chen et al. (2019) show the two components have different dynamics. Why not H-0009 (volume-shock
  news drift): no own news event is needed; the information is in peers'' prices. Related lab evidence: the mrel
  cross-market daily lead-lag scan found nothing out of sample, but it was between liquid index-level markets (ETFs,
  FX, macro, crypto) where diffusion is fastest; within-stock peer diffusion is a different, attention-based channel
  and the literature locates it in stocks with less coverage, so the honest risk is that LIQ-500 names are too well
  covered. Correlation peers are computed only from past returns up to t (point-in-time, ticker-blind, no industry
  codes needed). Peer map cost: one 500 x 500 correlation per week on <= 504 x 500 floats, cheap. Expected cost:
  the book rotates most of its names weekly (round trip ~6-12 bps per name at LIQ-500 tiers), which is why the mechanism
  test''s cost ratio is the decisive first check. Three parameters, round values, grid symmetric around the primary.
  References are cited honestly (adds the literature prior); Hou 2007 is inside dev, so the publication-decay check
  applies.'
