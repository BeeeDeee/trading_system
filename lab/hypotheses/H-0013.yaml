id: H-0013
version: 1
title: Peer lead-lag catch-up - LIQ-500 market-neutral, long stocks whose return-correlated peers rose last week
  while they themselves did not move much, short the mirror, hold 5 days
author_agent: scout
family: peer-lead-lag-diffusion
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors and market makers who price each stock from its own recent news and order flow: they
    sell (or fail to bid up) the laggard whose peers just repriced up, and keep buying the laggard whose peers just
    repriced down, so they trade against information that is already public in related prices.'
  why: Common news (industry demand, input prices, regulation, a competitor's results) hits a group of economically
    related stocks at the same time, but it is incorporated into their prices at different speeds. Attention is
    limited and many investors (and analysts) follow a stock mainly through its own news flow, so a stock whose
    close peers have repriced, but which has not moved itself, tends to catch up over the following days. In the
    literature this shows up as industry and connected-firm lead-lag (Hou 2007; Cohen and Frazzini 2008) and as
    the "pairs momentum" component of pairs trading, which Chen, Chen, Chen and Li (2019) show is largely one-month
    industry momentum and has different dynamics from own-stock short-term reversal. Peers here are found statistically
    (highest correlation of market-demeaned daily returns), because the lab is ticker-blind and has no industry
    codes; correlation peers capture industry, supply-chain and style links in one step. The card deliberately removes
    the own-reversal component (only stocks whose own weekly return is unremarkable can be traded), so what is tested
    is the diffusion from peers, not reversal again.
  why_not_arbitraged: The signal needs a large peer map and a weekly, fully rotating long/short book of ~120 names;
    the per-trade edge is small relative to the spread for anyone but low-cost liquidity providers, it is a noisy
    statistical relation (peers change, correlations are unstable), and it carries industry and style exposure that
    stat-arb desks usually hedge away, removing exactly this component. Capacity is limited by weekly turnover.
signal:
  description: 'Data: daily total return of stock j on day d, r[d,j] = (1 + ret_co[d,j]) * (1 + ret_oc[d,j]) - 1
    (ret_co is the overnight return from the close of d-1 to the open of d, ret_oc the open-to-close return of d).
    Decision dates: the last trading day of each calendar week (t), after the close, using data up to and including
    the close of t; trades execute at the open of the next trading day t+1; positions are held until the next decision
    date (about 5 trading days). Eligible set E(t): stocks that are members of LIQ-500 on t, tradable on t, have
    a non-missing return on each of the last formation_days days, and at least 75 % non-missing daily returns in
    the last corr_window days. Step 1 (peer map, recomputed at every decision date): over the trailing corr_window
    trading days ending at t, take r[d,j] for j in E(t), subtract each day''s cross-sectional equal-weighted mean
    over E(t) (market-demeaned returns), and compute the pairwise Pearson correlation on overlapping non-missing
    days (pairs with fewer than 60 % overlapping days get correlation NaN and are never peers). The peers P(j) of
    stock j are the peers_k other stocks in E(t) with the highest correlation to j. Step 2 (formation returns):
    own[j] = compounded return of j over the last formation_days trading days ending at t (days t-formation_days+1
    .. t); peer[j] = equal-weighted mean of own[p] over p in P(j). Both are demeaned by subtracting their cross-sectional
    mean over E(t). Step 3 (remove own reversal): keep only stocks whose own[j] cross-sectional percentile rank
    within E(t) is between 0.2 and 0.8 inclusive (the middle 60 %, stocks that did not move much themselves). Call
    this set M(t). Step 4 (rank): within M(t), rank by peer[j]. Long the top quintile of M(t) (peers rose most),
    short the bottom quintile (peers fell most). Ties broken by stock id. Weights: long names equal weight +0.5
    / n_long, short names equal weight -0.5 / n_short (gross 1, net 0). Names that stay in the same leg keep their
    target weight (rebalanced to equal weight); names that leave are closed at the open of t+1. A stock that delists
    while held takes its terminal return and the weight is held in cash until the next decision date. If fewer than
    50 stocks are in M(t) the book is flat for that week (only possible at the very start). No other filters, no
    volatility scaling, no thresholds fitted to history.'
  params:
    corr_window:
      grid:
      - 126
      - 252
      - 504
      value: 252
    formation_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
    peers_k:
      grid:
      - 5
      - 10
      - 20
      value: 10
  timeframes:
  - 1d
  - 1w
  - 1y
mechanism_test:
  event: 'At a weekly decision date t (last trading day of the calendar week), a stock is in M(t) (eligible, own
    formation_days return between the 20th and 80th cross-sectional percentile) and its peer return peer[j] (equal-weighted
    formation return of its peers_k most correlated peers, market-demeaned correlations over corr_window days) is
    in the top quintile of M(t): side +1; or in the bottom quintile of M(t): side -1. Exactly the entry set of the
    long and short legs at that rebalance, primary parameters.'
  horizons:
  - 1
  - 2
  - 5
  - 10
  - 21
  primary_horizon_days: 5
