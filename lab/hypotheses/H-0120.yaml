  typical_days: 5
market_exposure: market_neutral
falsification_criteria:
- Net Sharpe on dev below 0.5 or not above the T-bill benchmark (bootstrap bound of the difference at or below zero).
- Neighbors of n_estimators 100 or top 0.2 do not keep at least 75 % of configurations above the benchmark.
- A ridge regression on the same six features (framework ridge, same label, rows and refit schedule) gives the same
  or a better top-minus-bottom 5-day gross than the gbm, so the threshold interaction is not what pays.
- The mechanism event (a coin enters the top fifth of the score, side +1, or the bottom fifth, side -1, at a decision
  date) shows no abnormal 5-day return beyond the 95th percentile of the time-shifted placebos, or the gross per
  event is below the round-trip cost.
- The latest third of the dev period has the wrong sign (decay or regime dependence, K-0060).
- The abnormal return is already at its full size at the 1-day horizon and gone by 5 days (a one-day bounce that
  a taker cannot keep, K-0049), or grows steadily to 10 and 20 days (generic momentum, not session origin).
notes: 'Brief deviation, stated on purpose. The brief asked for US single stocks. I did not find a US-stock learned
  idea with a real mechanism that is not already closed by the lab: at 1-5 days in LIQ-500 only short-term reversal
  and earnings-reaction drift have cleared cost, and both are closed to further learned cards (H-0099, H-0115 and
  H-0117 avoid lists, K-0155, K-0160; K-0143 for release reactions). Fundamentals, ownership, attention, calendar,
  tax clock and distribution-shape conditioners did not lift one-week large-cap sorts above cost (K-0133, K-0137,
  K-0152). Macro exposures need a direct link and the open candidates are already queued (H-0119), and index and
  ETF flow cards are closed (K-0148, H-0112, H-0113). The closest fit kept the horizon, the learned form and the
  cross-sectional scoring and changed the asset group to Binance perps, which the brief itself names as a domain
  with enough samples for a model. All 26 earlier learned cards are US stocks, so this also serves the diversity
  aim. The Chair can park it if the asset group is binding. Family: filed under short-term-reversal on purpose.
  The question (does a recent move revert or persist, depending on who made it) is the forced-versus-informational
  question the Chair merged into this family (K-0087), so its trials count there. Difference from the dead daily
  perp conditioners (funding level H-0039, funding change H-0049, perp/spot volume H-0071, VIX gate H-0081; K-0119):
  the conditioner is the session decomposition of the move and the US volume share from hourly-derived features
  (binance_1h_features), an information source no card has used. The K-0119 missing control (the unconditional daily
  reversal among these perps) is in effect the ridge baseline here. Forecasts, written before any result (K-0098,
  K-0120, K-0159): about 210 decision dates in 2020-2022, of which about 160-180 after the model warm-up; 8 names
  in the legs per date, about 55-70 % of them new entries, so about 700-1000 mechanism events on 160-180 dates.
  Round trip from the crypto perp tier of the weakest top-20 names: 40-90 bps (K-0120 saw about 91 bps in a top-30
  card). Gross per event: central 80 bps, pessimistic 8 bps, absent case 0. Coin-specific 5-day standard deviation
  is about 8-12 %, so the placebo bar will probably sit above cost: a near miss would be a ''cannot tell'' (K-0034,
  K-0006), not support. The first third of dev (2020) is mostly model warm-up and thin in events; a thin or empty
  first block cannot count (K-0145), so both later thirds must be positive. Data caveats: binance_1h_features covers
  105 spot pairs chosen by liquidity at download time (survivorship toward coins that stayed liquid); a top-20 perp
  without a spot key is not scored, so the scored set can fall below 20 on some dates. Sessions are fixed UTC blocks,
  so the US session misses the 13:30-16:00 UTC US morning and US daylight-saving shifts move it by an hour. Hourly
  features are parts of the same daily return (not independent). G0 may again receive no crypto_top_n universe on
  daily perps (K-0131): the Builder should use top 20 by trailing 30-day quote volume and say so. Rolling windows
  must accept views shorter than the window (K-0131). No mechanism-level reference is cited: the session pattern
  is documented for BTC returns in practitioner research, not as a peer-reviewed cross-sectional result, so the
  card carries no literature prior. Likeliest death: gross below the perp round trip, or a single-regime pass in
  one dev third (one boom-and-bust cycle, K-0006, K-0060).'
