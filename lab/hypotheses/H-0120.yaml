id: H-0120
version: 1
title: Session origin of coin-specific moves, learned - Binance top-20 perps dollar-neutral, LightGBM on Asia/Europe/US-session
  BTC-residual returns and US volume share, 5-day cohorts
author_agent: scout
family: short-term-reversal
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Session-local leveraged retail traders who chase coin-specific moves during the Asian session and
    pay the concession when it reverts, and traders who fade information-driven US-session moves too early.
  why: 'Binance altcoin trading is split across clienteles by clock: the Asian session (00-08 UTC) is dominated
    by leveraged retail flow, the US session (16-24 UTC) carries US investors and the US macro and company news
    flow. A coin-specific move (net of BTC) that was made in the Asian session with little US participation is more
    likely to be a flow-driven price concession that liquidity providers are paid to absorb and that partly reverts
    over the next days; a coin-specific move made in the US session on an abnormally high US share of volume is
    more likely to carry information and to persist. Whether a recent move reverts or persists therefore depends
    on where it was made and who traded it, not on its size alone.'
  why_not_arbitraged: Market makers in altcoins are capital- and inventory-constrained, the trade needs a short
    leg in perps with funding risk, the edge per coin is small relative to altcoin volatility and taker costs, and
    it lives in a 24/7 market split across time zones where no single desk sees all sessions as one book.
signal:
  description: 'Data: binance_perp_1d for prices, funding and the point-in-time top-20 universe by 30-day quote
    volume (crypto_top_n, n = 20); binance_1h_features for the session decomposition, matched by symbol (perp id
    XXXUSDT.P -> spot pair key XXXUSDT). Decision after the 00:00 UTC close of day t using data up to that close,
    trades at the open of day t+1. Features per coin and day t (each z-scored across the universe members of that
    day by the framework helper): (1) Asia-session coin return minus BTCUSDT Asia-session return (ret_asia), summed
    over days t-2..t; (2) the same for the Europe session (ret_europe); (3) the same for the US session (ret_us);
    (4) US volume share: mean of vshare_us over t-2..t minus its mean over t-31..t-3; (5) volatility state: mean
    of rv over t-6..t divided by its mean over t-59..t-7; (6) funding: sum of the daily funding extra over t-2..t.
    Label (framework): total return from the open of t+1 to the open of t+6 (horizon 5 days), ranked across the
    universe. Model: LightGBM (framework gbm), num_leaves 15, learning_rate 0.05, n_estimators from the grid, refit
    every 63 rows on an expanding window through lab.framework.ml.walk_forward (purge and minimum training sample
    owned by the framework). Book (score_weights, only_on): every fifth day (rows where the day count since the
    panel start is divisible by 5) rank the scored members; long the top fraction `top`, short the bottom fraction
    `top` (rounded down, at least 2 names per leg), equal weight, gross 1.0 (0.5 per leg), dollar-neutral, held
    until the next decision date 5 days later. A coin without a complete feature vector (missing hourly features,
    fewer than 60 days of history) is not scored; fewer than 10 scored members on a decision date means flat. A
    coin that leaves the point-in-time universe before the next decision date is closed at the first decision row
    where it is outside the universe (engine rule). BTCUSDT.P and ETHUSDT.P are scored like any other member; BTCUSDT
    is read only as the residual reference for features (1)-(3). Funding is charged by the engine.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.15
      - 0.2
      - 0.25
      value: 0.2
  timeframes:
  - 1h
  - 1d
mechanism_test:
  event: A coin enters the top fifth of the gbm score (side +1) or the bottom fifth (side -1) at a decision date,
    i.e. it was not in that leg at the previous decision date.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
ml:
  features:
  - Asia-session BTC-residual return over the last 3 days (flow-driven, retail-hours component of the recent move)
  - Europe-session BTC-residual return over the last 3 days (intermediate clientele; control for the session split)
  - US-session BTC-residual return over the last 3 days (component made while US investors and US news are active)
  - Abnormal US-session volume share (US participation in the recent move, against the coin's own month)
  - Realized-volatility state, 7-day vs 60-day hourly realized vol (how stressed the coin's market is; concession
    size)
  - Trailing 3-day funding (price of leverage; crowding of the longs that make Asian-session moves)
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'A ridge on the three session returns can already give each session its own sign, so the card
    claims less than a session split: it claims that the sign and size of the response to a session''s move depend
    on the US volume share and on the volatility state. An Asian-session move is expected to revert only when it
    was made with a low US share of volume and in an elevated volatility state (a concession to leveraged flow),
    and a US-session move to persist only when US volume share was abnormally high (information traded by the US
    clientele); in between the response is near zero. That is a conjunction of thresholds across three features,
    which a ridge on the same six features can only approximate by adding main effects. The payer of the conditional
    reversal is the session-local leveraged retail flow; the payer of the conditional persistence is whoever fades
    informed US-session moves.'
data_requirements:
