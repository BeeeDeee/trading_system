market_exposure: market_neutral
references:
- cite: 'Harris, Gurel (1986) Price and volume effects associated with changes in the S&P 500 list: New evidence
    for the existence of price pressures, Journal of Finance'
  year: 1986
- cite: Shleifer (1986) Do demand curves for stocks slope down?, Journal of Finance
  year: 1986
- cite: 'Chen, Noronha, Singal (2004) The price response to S&P 500 index additions and deletions: Evidence of asymmetry
    and a new explanation, Journal of Finance'
  year: 2004
falsification_criteria:
- 'Mechanism: side-adjusted 5-day abnormal return of the pooled addition+deletion events is below the 95th percentile
  of the 200 time-shifted placebos, or has the same sign in fewer than 2 of 3 sub-periods, or the gross per event
  does not cover the round-trip cost.'
- 'Mechanism, deletion leg: if the diagnostic is reported by side, the deletion events alone have a side-adjusted
  5-day abnormal return at or below their placebo average (the new leg adds nothing to H-0017).'
- Fewer than 200 events or 30 event dates in dev (the widened set is still too sparse to test).
- Net Sharpe on dev below 0.5 against T-bills, or the one-sided bootstrap bound of the excess is not above zero.
- 'Neighbors hold_days 3 and 7: fewer than 75 % still clear the T-bill bar, or median neighbor Sharpe below 0.7
  x primary.'
- With costs x2 the Sharpe no longer beats the T-bill bar.
- 'Publication decay: Sharpe excess after the 2004 reference is less than half of the excess before it.'
notes: 'Second trial of the family index-inclusion-price-pressure (H-0017), filed under the same name on purpose.
  This is not a retuning of H-0017: hold stays at 5 (the brief''s horizon and H-0017''s), the addition events are
  meant to be identical, and the only change is the second direction that the H-0017 lesson and K-0026 name as the
  honest way to raise power for a sparse event ("widen the event set, both directions, instead of tweaking hold
  or filters"). H-0017 died by a hair on the placebo percentile with the right sign in every sub-period and gross
  far above cost; deletions are the side where the literature (Chen, Noronha, Singal 2004) finds full reversal,
  so they should add signal, not only events. K-0024: the only large-cap short-horizon events with an effect were
  mandated flows; this card stays inside that class and inside the brief (US single stocks, cross-sectional, 5 days).
  Known risks: (1) feasibility of holding former members for a few sessions in an sp500-universe card - if impossible,
  G0 should fail loudly (not a trial) and the Chair can decide whether a liq_n card that reads S&P membership is
  worth it (it would lose many additions outside LIQ-500); (2) fading across eras, as H-0017 saw - the publication-decay
  check will catch it; (3) concentrated single-name book, capped at 0.25 per name; (4) exposure: the book is flat
  between event windows, roughly 30-45 % of sessions with live events, so mean exposure may sit near the 0.20 floor;
  (5) entry at the open of the session after the first new-status session misses the first day of the reversal,
  which is the price of point-in-time membership (the announcement date is not in the data). Placebos keep the same
  stocks at shifted dates; pre-deletion losers and pre-addition winners drift, so read the event against the placebo
  average (K-0025).'
