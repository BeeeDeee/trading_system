id: H-0018
version: 1
title: Index-change price-pressure reversal, both directions - S&P 500, short new members and long just-deleted
  stocks, hedged with other members, hold 5 days
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Index funds and index-benchmarked institutions that must buy additions and sell deletions at the
    effective close regardless of price (tracking-error mandate); they pay the temporary premium/discount that the
    reversal returns to whoever takes the other side afterwards.
  why: 'Index funds and closely benchmarked managers must trade a stock at the close of the day before an S&P 500
    change becomes effective, whatever the price: they buy additions and sell deletions in size. Downward-sloping
    demand for individual stocks (Shleifer 1986) means this mandated flow pushes the price above (additions) or
    below (deletions) its value at that close, and liquidity providers who absorbed the flow unload it over the
    following days, so part of the move reverses (Harris and Gurel 1986). Chen, Noronha and Singal (2004) find the
    deletion side reverses fully after the effective date, while the addition side is more persistent; H-0017 nevertheless
    saw the addition reversal with the right sign in every sub-period. Testing both directions in one event set
    doubles the occurrences of the same mandated-flow mechanism.'
  why_not_arbitraged: The trade is a few concentrated single-name positions with large idiosyncratic risk; deleted
    stocks are usually distressed, falling and shunned by benchmarked managers (career risk of holding a name the
    index just dropped); additions are crowded shorts with borrow demand. Arbitrage capital that front-runs the
    change is limited and must exit after the effective date, which is itself part of the pressure.
signal:
  description: 'Inputs: daily point-in-time S&P 500 membership m[t,j] (universe sp500), the bar/tradable flag of
    each stock, total returns ret_co/ret_oc. Decisions after the close of every session t using data up to that
    close; trades at the open of t+1. Events at t: (a) ADDITION of j: m[t,j] = 1, m[t-1,j] = 0, and j has a price
    bar on each of the 252 sessions before t (excludes spin-offs and new listings added at listing; if the H-0017
    implementation used a different seasoning rule for additions, reuse that rule so the addition events are identical
    to H-0017''s and only the deletions are new). Side -1. (b) DELETION of j: m[t,j] = 0, m[t-1,j] = 1, j was a
    member on each of the 21 sessions before t (no data glitch), and j has a tradable bar on t (it still trades
    after removal; companies removed because they were acquired stop trading and therefore are not events). Side
    +1. Live events: an event of day t is held from the open of t+1 for hold_days sessions (closed at the open of
    t+1+hold_days, i.e. by the decision after the close of t+hold_days). A stock with two events uses the most recent
    one. Weights: let n = number of live event names; each live event name gets weight side * min(0.25, 0.5 / n)
    (event legs together never exceed 0.5 gross, no single name above 0.25). Hedge: minus the net event weight,
    spread equally over all current members that are tradable and not live event names, so the book is dollar-neutral.
    No events live: book flat (cash). Deleted stocks are no longer members but stay in the loaded panel as former
    members; the strategy must be able to hold them for hold_days sessions after removal. If the engine forbids
    weights on non-members, the Builder must raise at G0 (K-0010) instead of silently dropping the deletion leg.
    Missing data: a live name that stops trading takes its terminal return (delisting policy) and is removed; weights
    are recomputed only when the live set changes (otherwise targets are kept).'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
  timeframes:
  - 1d
mechanism_test:
  event: After the close of day t, stock j is in its first session as an S&P 500 member after not being one (seasoned
    by 252 sessions of prices; side -1, additions should underperform) or in its first session as a non-member after
    at least 21 sessions as a member while still trading (side +1, deletions should outperform).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
