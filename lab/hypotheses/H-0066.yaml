id: H-0066
version: 1
title: Earnings-news transfer to not-yet-reporting peers - LIQ-500 long/short, follow a large 8-K release reaction
  in the announcer's correlated peers, hold 5 days
author_agent: scout
family: peer-lead-lag-diffusion
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders and liquidity providers in the peer stock who price it from its own news only. They sell
    to the strategy too cheaply after good rival news and buy from it too dearly after bad rival news, until the
    peer's own release or analyst revisions make the transfer obvious.
  why: 'One firm''s earnings release carries news about its peers: industry demand, input costs, pricing, the business
    cycle (Foster 1981, intra-industry information transfer). Ramnath (2002) finds that investors and analysts of
    firms that have not reported yet do not fully use the first announcers'' news, so the non-announcers'' returns
    can be predicted in the days after the announcement. The rival''s release is a sharp, dated news event in the
    related stock, which itself has no filing that day. Limited attention (Hou 2007, Cohen and Frazzini 2008) predicts
    that the related stock prices that news slowly: investors in stock i watch i''s own news flow, not each rival''s
    release. The claim: after a large release-session reaction of announcer j (real 8-K Item 2.02 dates), j''s most
    return-correlated peers that have not reported yet this season keep moving in the direction of j''s reaction
    over the next sessions. The announcer itself is not traded, so this is not the announcer''s own drift (H-0028/H-0033).'
  why_not_arbitraged: The signal per peer is a fraction of the announcer's move and is noisy. The transfer can go
    either way (common industry news vs competitive gain), and it is spread over many small positions during crowded
    earnings seasons, so it uses up attention and capital in exactly those weeks. Thomas and Zhang (2008) even find
    overreaction that is corrected at the late announcer's own release weeks later, so the short-horizon sign is
    disputed in the literature and not obviously crowded. In the most liquid names it may well be arbitraged already;
    this card tests whether it is.
signal:
  description: 'Decisions after the close of each session t using data up to that close; trades at the open of t+1.
    (1) Returns: daily close-to-close total return r = (1+ret_co)*(1+ret_oc)-1. Market-adjusted return a_i,t = r_i,t
    minus the equal-weighted mean r of all universe members with a return on t. (2) Peer map, recomputed after the
    close of the last session of each month and used for the whole next month: for every universe member j, its
    peers_k peers are the other members with the highest Pearson correlation of a over the 252 sessions ending that
    day (both stocks need at least 200 common valid observations; fewer than peers_k qualifying stocks -> take those
    that qualify). (3) Announcers at t: members j with ea_reaction_day[t, j] == 1 and |z_j,t| >= z_threshold, where
    z_j,t = a_j,t / sd(a_j over the 63 sessions ending t-1), at least 40 valid observations, otherwise j is skipped.
    (4) Peer events at t: for every member i that is not itself an announcer at t, that has no ea_reaction_day ==
    1 in the 40 sessions ending t (it has not reported yet this season) and whose ea_reaction_day is not NaN on
    t (covered by the 8-K data), compute S_i,t = sum over announcers j at t with i in peers(j) of sign(z_j,t). An
    event fires if S_i,t != 0, with side = sign(S_i,t). (5) Book: each event opens a position in i with sign = side
    at the open of t+1, held for hold_days sessions (exit at the open of t+1+hold_days). A new event in the same
    stock replaces the old one (new side, new clock). The position is also closed at the next open after i''s own
    ea_reaction_day == 1 (its own news ends the transfer claim), and at the first decision after i leaves the universe
    or stops trading. Weights: every open position has weight side * 0.01 of equity; if more than 100 positions
    are open, all are scaled to side / N_open so that gross <= 1. No hedge basket, no leverage; the net exposure
    is whatever the long and short events add up to. Missing returns: a stock without a valid return on t cannot
    be an announcer or receive an event on t.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    peers_k:
      grid:
      - 5
      - 10
      - 20
      value: 10
    z_threshold:
      grid:
      - 2.0
      - 3.0
      - 4.0
      value: 3.0
  selection_procedure: Primary configuration fixed before any run (round values); the grid exists only for the G2
    neighbor test.
  timeframes:
  - 1d
  - 1q
  - 1y
mechanism_test:
  event: 'After the close of session t, stock i (a LIQ-500 member that is not reporting itself, has had no 8-K Item
    2.02 reaction session in the last 40 sessions, and is covered by the 8-K data) is among the peers_k most return-correlated
    peers of at least one member j whose release-session market-adjusted reaction on t is at least z_threshold standard
    deviations. side = sign of the sum of sign(reaction) over such announcers (+1: the announcers'' news was good,
    i should outperform; -1: bad, i should underperform). No event where the sum is zero. Announcers themselves
    are never marked, so they stay among the unmarked peers.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
