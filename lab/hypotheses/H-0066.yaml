falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the peer events is not above the 95th percentile of
  the time-shifted placebos -> the transfer drift does not exist in LIQ-500.'
- 'Mechanism: gross abnormal return per event at 5 sessions below the round-trip cost of the LIQ-500 tier (cost
  ratio < 1) -> not tradable in this form.'
- 'Mechanism: the latest third of the dev period has the wrong sign (decay or arbitrage, K-0060), or fewer than
  two of three thirds have the right sign.'
- 'Mechanism shape: the abnormal return at the 1-session horizon is larger than at 5 sessions -> diffusion is complete
  within a day (as K-0072 and H-0013 suggest), not a multi-day underreaction.'
- 'Mechanism sign: a clearly negative 5-session abnormal return supports Thomas-Zhang overreaction; it is reported
  as such and must not be traded as a mirror card in this family.'
- 'Strategy: net Sharpe on dev below the T-bill Sharpe bar (0.5 over T-bills) or the bootstrap bound of the difference
  not above zero.'
- 'Robustness: fewer than 75 % of the z_threshold / peers_k / hold_days neighbors pass the T-bill bar, or the strategy
  fails at doubled costs.'
notes: 'Brief fit: US single stocks, LIQ-500 cross-section, 5-session hold, daily decisions, mechanism test declared.
  Family: reuses peer-lead-lag-diffusion (H-0013) because the economic claim is the same - news about one firm reaches
  related firms late - so the trials count together. Why this is not H-0013 again: H-0013 traded any weekly move
  of statistical peers (mostly noise and flows) and found nothing; this card fires only on a dated, verified information
  event (a large reaction on a real 8-K earnings release) and only in peers that have not reported yet, which is
  the setting where the accounting literature reports the transfer (Ramnath 2002). The peer map is still statistical
  (correlation of market-adjusted returns; no industry codes are loadable), which is the main dilution risk. It
  is also not the PEAD family: the announcer is never traded, and its own drift (K-0046) is not the object. If the
  test passes it adds a new, much larger event set built on the one event type that has repeatedly passed the lab''s
  placebo test. Expected size, stated before the run (K-0053, K-0064): a z >= 3 release reaction in LIQ-500 is roughly
  a 5-10 % move; same-day peer co-movement in the literature is a small fraction of it, so the remaining 5-session
  drift per peer event is plausibly 10-30 bps. The LIQ-500 round trip is roughly 10-12 bps, so the mechanism can
  clear cost only at the upper half of that range, and the market-neutral strategy needs about 20 bps or more per
  event to reach Sharpe 0.5 over T-bills (1 % slots, about 2,000-3,000 events per year, invested mostly in earnings
  seasons). Most likely death: diffusion in the most liquid names is complete within the release session (K-0072),
  so the gross after the next open is below cost; second most likely: the strategy bar even if the mechanism passes,
  as with the announcer drift itself. Feasibility: events exist only from 2004-08 (8-K data); I expect several hundred
  announcers with |z| >= 3 per year and a few thousand peer events per year on several hundred distinct dates, far
  above the G1 minimums, concentrated in the four earnings seasons; the first third of dev starts around 2004-09.
  The 40-session ''not reported yet'' filter halves the events in peak weeks. Coverage gaps of the 8-K data (K-0035)
  mean some peers that did report are not excluded; that dilutes but does not bias the sign. Diagnostics the Builder
  should report if it can (K-0036): events and dates per year, share of long vs short events, and the by-side abnormal
  return.'
