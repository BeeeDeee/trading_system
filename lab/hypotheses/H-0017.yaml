id: H-0017
version: 1
title: Index-inclusion price-pressure reversal - S&P 500 universe, short stocks in their first days as index members,
  long the other members, hold 5 days
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Index funds and closet indexers that must buy at the effective-date close (they accept a known tracking-cost
    transfer by mandate), and late momentum/attention buyers who buy the newly famous index member after inclusion
    and pay the inflated price.
  why: 'When a stock is added to the S&P 500, index funds and benchmarked managers must own it at the close before
    the effective date, regardless of price. This one-off, information-free demand shock pushes the price above
    its pre-announcement level (downward-sloping demand curves for stocks). Once the forced buying is done, the
    price pressure is no longer supported: liquidity providers and event-driven traders who sold to the index funds
    at an inflated price buy back over the following days and weeks, and the excess return reverts. The trade is
    to be short the new member right after the effective date, hedged with the rest of the index, and collect the
    reversion while it happens.'
  why_not_arbitraged: Index arbitrageurs mostly compete on the announcement-to-effective window (buy on announcement,
    sell to the index funds); fewer hold the short side after the effective date because the event count is small
    (a few dozen per year), positions are single-name and idiosyncratic, and each event carries real risk (a new
    member can keep rising on fundamentals). The capacity is limited by the size of the reverting move in a handful
    of names, which keeps large funds away.
signal:
  description: 'Universe: point-in-time S&P 500 members (universe kind sp500). Decision after the close of each
    trading day t using data up to that close; trades at the open of t+1. (1) Addition event: instrument j is a
    member on day t and was not a member on day t-1 (its first membership day, i.e. the effective date as recorded
    in the membership history), and j has a valid close on at least 21 of the 30 trading days before t (seasoned
    listing: excludes spin-offs and new listings added on their first trading days; if the panel holds no pre-membership
    price rows at all, the Builder must report this and drop the seasoning filter rather than silently remove every
    event). (2) Active short set A_t: every addition j whose event day e satisfies t - hold_days + 1 <= e <= t,
    still a member on t and tradable on t. So an addition with event day e is held from the open of e+1 to the open
    of e+1+hold_days. A member that leaves the index, is delisted or becomes untradable while active is dropped
    from A_t at the next decision (delisting returns are handled by the engine). (3) Weights: if A_t is non-empty,
    each j in A_t gets -0.5/|A_t|, and every other member of the universe on t that is tradable with a valid close
    gets +0.5/N_t (N_t = count of those members); gross = 1, net = 0. If A_t is empty the book is entirely in cash
    (all weights 0). (4) Rebalanced daily, but the long leg changes only marginally between days, so turnover is
    dominated by entering and leaving the short names. Missing data: an instrument without a valid close on t is
    excluded from both legs on t.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
  timeframes:
  - 1d
mechanism_test:
  event: A stock becomes a member of the point-in-time S&P 500 universe on day t (member on t, not on t-1) after
    at least 21 valid closes in the 30 trading days before t; side = -1 (the mechanism says the new member underperforms
    the other members as the inclusion price pressure reverts).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
