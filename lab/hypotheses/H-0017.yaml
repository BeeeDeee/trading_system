falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of new S&P 500 members (short side) does not exceed the 95th
  percentile of the 200 time-shifted placebos.'
- 'Mechanism: the side-adjusted abnormal return has the wrong sign in two of three dev sub-periods, or the gross
  abnormal return per event is below the round-trip cost of trading it.'
- Net Sharpe on dev below 0.5 or below T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe difference is
  not above zero.
- Neighbors of hold_days 5 (3 and 10) do not beat the T-bill benchmark.
- At doubled costs the strategy no longer beats the T-bill benchmark.
- More than 60 % of the dev log return comes from one of three sub-periods (e.g. only the early, high-addition years).
notes: 'Brief fit: US single stocks, cross-sectional, short horizon (5 days), with a mechanism test. Gap filled:
  prior_studies lists index rebalancing among untried flow effects; no lab card uses index-membership events. Family:
  new, because the counterparty is the index-fund demand shock at inclusion, not the month-end balanced-fund rebalancing
  of rebalancing-flow-pressure (H-0002) nor a liquidity-provision reversal of past returns (short-term-reversal:
  the event is defined by membership, not by any past return, so it is not another conditioning variable on weekly
  reversal). Data: no new dataset; the event comes from the point-in-time membership of the sp500 universe. Timing
  is conservative: the membership change is announced days before the effective date, but the card only reacts after
  the close of the first membership day, so the reversion on the effective day itself is given up. Deletions (the
  symmetric rebound) are not tradable here because a deleted stock leaves the sp500 universe; the card is additions-only
  on purpose. Exposure: the book is in cash when no addition is active; with roughly 20-50 additions a year on fewer
  distinct dates and a 5-day hold the expected mean gross exposure is around 25-45 %, above the 20 % floor but not
  by much at hold_days 3. Entries: each event re-enters the long hedge and the short name, so entries are in the
  hundreds. Known risks: (a) the dev period starts in the late-1990s tech run, when new members kept rising (momentum,
  not reversion); (b) the reversion may unfold over 2-6 weeks rather than 5 days, so the 5-day gross per event may
  be small - the mechanism test at horizons 10 and 20 (descriptive) will show this; (c) the short book is a few
  single names, so volatility on active days is idiosyncratic; (d) no borrow cost is modelled, but new S&P members
  are large and easy to borrow. Patel and Welch (2017) is in the dev period, so the publication-decay check will
  compare 2017-2020 with earlier years on few events.'
