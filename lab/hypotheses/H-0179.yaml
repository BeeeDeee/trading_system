falsification_criteria:
- 'Mechanism: the side-adjusted 42-session return of the event trusts minus the other trusts is not above the 95th
  percentile of the time-shifted placebos, keeps its sign in fewer than 2 of 3 sub-periods, or its gross per event
  is below the round-trip cost of the trusts.'
- 'Mechanism shape: if the 5-session abnormal return is larger than the 42-session one (the effect is a fast news
  or momentum effect, not a slow belief-driven adjustment), the delayed-overshooting reading is rejected even if
  the gate passes.'
- 'Mechanism decay: a wrong-signed latest third of dev counts against the hypothesis (K-0060 pattern) and is reported
  as such.'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills (plus the 0.10 margin), or the bootstrap bound of the Sharpe
  difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors (lookback_months 2 and 6, hold_months 1 and 3) beat the benchmark,
  or one sub-period carries more than 60 % of the log return.'
- 'Costs: the book does not beat T-bills at doubled costs.'
notes: 'Brief fit: medium horizon (2-month cohorts, monthly decisions), cross-asset (signal from government bond
  yields, a macro series; trades in currency trusts). Relation to earlier cards, stated so the trial count can be
  judged honestly: H-0062 (long-term-reversal) traded the same six trusts on a five-year value score, a persistent
  level that passed the mechanism test but missed the absolute Sharpe floor; this card uses yield changes over months,
  so a currency''s leg membership is set by recent rate news rather than by identity, and the time-shifted placebo
  tests timing directly (K-0201, K-0217 identity trap). H-0087 (cross-asset-momentum) used local bond returns to
  predict unhedged country equity ETFs; here the predicted asset is the currency and the mechanism is the FX-specific
  uncovered-interest-parity / delayed-overshooting puzzle, with the opposite economic sign convention (a bond sell-off,
  i.e. rising yields, is bullish for the currency). If the Librarian judges it to be cross-asset-momentum, the family
  can be merged; it is not named to escape a count. Known weaknesses: the OECD series are monthly averages with
  a conservative two-month stamp lag and latest-vintage revisions (small for market yields), so the signal sees
  rate news one to three months late; delayed overshooting in the literature lasts one to three years, so a lagged
  signal is still inside the window, but the fast part is lost. The 10-year yield mixes policy expectations with
  term premia; a yield rise driven by country risk (fiscal stress) would predict depreciation and dilutes the effect.
  Six currencies give few independent picks per date; the event count (about 650 on about 165 dates) clears the
  minimum, but the placebo cloud may be wide. Costs: currency trusts other than FXE are thin, so the ETF cost tier
  may be high; monthly turnover is about one unit of gross per month. No forward data for ETFs, so G4 is the ceiling.
  No dates, episodes or performance-based instrument choices: the six trusts are all G10 CurrencyShares trusts with
  a matching OECD yield key that exist from 2006 (the Swedish trust is left out for its very low dollar volume).'
