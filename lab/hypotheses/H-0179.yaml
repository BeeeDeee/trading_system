mechanism:
  counterparty: 'FX participants whose positions do not respond to rate news at the speed of the bond market: corporate
    and fund hedgers on fixed hedge-ratio and rolling schedules, official reserve managers with slow allocation
    committees, and investors who anchor on the current rate differential and extrapolate it as transitory (the
    distorted-beliefs channel). They sell the appreciating currency too early, and the strategy takes the other
    side for the remaining part of the adjustment.'
  why: 'Delayed overshooting (Eichenbaum and Evans 1995): after news that raises a country''s interest rates relative
    to others, its currency does not jump to its new level at once, as uncovered interest parity and Dornbusch overshooting
    predict, but keeps appreciating for months. Gourinchas and Tornell (2004) and Engel (2016) explain it with beliefs:
    FX investors treat interest-rate shocks as more transitory than they turn out to be and update slowly, so the
    exchange rate inherits the underreaction of consensus rate forecasts. The signal comes from a different market
    than the trade: government bond yields record the rate news (here the change in the home 10-year yield, a market
    price that moves with expected policy paths), and the currency, traded through US-listed currency trusts, is
    predicted to keep moving in the same direction over the following one to three months. Because the sort uses
    changes, not the yield level, it is not the carry level (persistent identity of high- and low-yield currencies)
    nor the five-year value score of H-0062; it times when rate news has arrived.'
  why_not_arbitraged: The premium is small relative to FX volatility (a G10 cross-section of six currencies gives
    a book with modest Sharpe), it competes with carry and momentum books for the same risk budget, it reverses
    at long horizons (Engel 2016 predictability reversal) so it cannot be held indefinitely, and the public yield
    data are noisy proxies of policy news; large macro funds trade rate news in futures and forwards within days,
    which removes the fast part but not, in this hypothesis, the slow belief-driven part.
signal:
  description: 'Inputs: total returns (ret_co, ret_oc) of the six CurrencyShares trusts FXA (AUD), FXB (GBP), FXC
    (CAD), FXE (EUR), FXF (CHF), FXY (JPY); the OECD 10-year government bond yields from fred_oecd_10y_yields_1d
    with keys AU, GB, CA, DE (as the euro-area yield for FXE), CH, JP (monthly averages, each value stamped on the
    first XNYS session of month m+2; the strategy only uses the last stamped value available at the decision close,
    carried forward). Decision dates: after the close of the third XNYS session of each calendar month (so the stamp
    of that month is already in the data under any next-morning clock); trades at the next open. Signal: for each
    currency c, dy_c = (latest available monthly yield of c) - (the yield of c lookback_months monthly observations
    earlier), in percentage points. Using the home yield alone is the same ranking as the differential to the US
    yield, because the US yield is common to all six. A currency whose latest or lagged yield is missing, or whose
    trust has no tradable bar at the decision close, is excluded from that month''s ranking; with fewer than 5 ranked
    currencies no cohort is formed that month. Cohort: rank the eligible currencies by dy_c; the 2 with the largest
    dy_c form the long leg, the 2 with the smallest form the short leg (ties broken by the larger absolute dy_c,
    then alphabetically). Each new cohort is held hold_months x 21 sessions and then closed at the open after its
    last session; with hold_months overlapping cohorts alive, each cohort has weight +0.25/hold_months per long
    name and -0.25/hold_months per short name (gross 1/hold_months per cohort, total gross <= 1, dollar-neutral).
    No rebalancing of a cohort''s weights inside its holding period other than what the engine does for constant
    fractions; the book''s position in a trust is the sum over live cohorts. A trust that stops trading while held
    is closed at its last available price. Before the first cohort is formed the book is in cash.'
  params:
    hold_months:
      grid:
      - 1
      - 2
      - 3
      value: 2
    lookback_months:
      grid:
      - 2
      - 3
      - 6
      value: 3
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At each monthly decision date (after the close of the third XNYS session of the month), the two currency
    trusts whose home 10-year yield rose most over the last lookback_months monthly observations enter a new cohort's
    long leg (side +1) and the two whose yield fell most enter its short leg (side -1); each cohort is a fresh entry,
    about four events per month over roughly 165 months.
  horizons:
