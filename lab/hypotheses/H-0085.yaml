- dataset: coinmetrics_supply_1d
  description: 'NEW DATASET (free, public, no API key): Coin Metrics Community API, endpoint https://community-api.coinmetrics.io/v4/timeseries/asset-metrics
    with metrics=SplyCur and frequency=1d. SplyCur is the current supply of the asset in native units, computed
    by Coin Metrics from the chain: the sum of all native units ever created and visible on the ledger, or the contract
    total supply for tokens. Wanted: one daily series per Binance USD-M perp base asset that Coin Metrics covers
    (BTC, ETH, LTC, BCH, XRP, ADA, DOT, SOL, LINK, UNI, AAVE, ... whatever the community tier serves), keyed by
    the Binance perp id (e.g. SOLUSDT.P) with the Binance-to-Coin-Metrics ticker map stored in the report. Ambiguous
    or reused tickers (a ticker that mapped to two different assets over time) should be dropped, not guessed. Clock
    crypto: Coin Metrics daily values are end of UTC day. The strategy reads them with a one-day lag anyway. History
    from the earliest available date (2019 or earlier wanted, so that the first lookback is covered if the framework
    delivers signal history before the view start). Forward source: same endpoint, refreshed daily. Please report
    per asset the first date, the number of days with one-day supply changes above 20 %, and whether Coin Metrics
    documents retroactive recomputation of SplyCur.'
  fields:
  - SplyCur
  frequency: 1d
