id: H-0085
version: 1
title: Token supply dilution, beta-matched - top-40 Binance perps, short the fastest-growing token supply and long
  the slowest within beta halves, 26-week overlapping cohorts
author_agent: scout
family: new-listing-overhang
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 40
mechanism:
  counterparty: Spot holders and leveraged perp longs who value coins by unit price and narrative and ignore the
    dilution of the unit (they look at the price chart, not at supply). On the other side are the issuance recipients
    who sell (miners, validators, farmers, treasuries). In perps the long side is speculators paying a funding rate
    set by leverage demand, not by the dilution of the underlying.
  why: 'New tokens enter circulation at a known, steady rate from protocol issuance: mining and staking rewards,
    liquidity-mining emissions, and treasury or ecosystem mints. A large part goes to recipients who are structural
    sellers. Miners and validators have fiat costs and taxes, yield farmers harvest and sell the reward token, and
    treasuries fund operations. The price therefore has to absorb a continuous supply flow, and holders who do not
    receive the issuance lose value at roughly the issuance rate. The equity analogue is net share issuance predicting
    lower returns (Pontiff and Woodgate 2008). In crypto the channel is more direct and much larger: annual supply
    growth runs from about 2 % for old proof-of-work coins to tens of percent for young emission-heavy tokens. The
    claim: over the following months, coins whose supply grew fastest over the last half year lag coins with the
    slowest supply growth and similar market beta, by a sizable fraction of the issuance gap.'
  why_not_arbitraged: 'Harvesting the dilution needs a short. Spot shorting is scarce. Perp shorts on high-emission
    tokens face squeeze risk, high funding volatility and an 80-150 % volatility per coin, so the strategy is a
    slow, noisy, months-long premium with large tracking error: unattractive for desks that mark to market weekly.
    The cash-and-carry alternative (stake the spot, short the perp) needs capital on two venues and has unbonding
    lockups of days to weeks, slashing and custody risk. It is limited in size and does not cover emissions paid
    to non-stakers (farm rewards, treasury mints) at all. Supply data sits in on-chain analytics, not on trading
    screens.'
signal:
  description: 'Inputs: daily perp bars of binance_perp_1d (ret_co, ret_oc, close, quote_volume); daily current
    token supply per coin from the new dataset coinmetrics_supply_1d (Coin Metrics SplyCur, native units). Decision
    schedule: weekly, after the daily close (00:00 UTC) that ends each Sunday, trading at the next open. Universe
    on a decision day: the point-in-time top 40 perps of the judge''s crypto_top_n universe. Eligible coins are
    universe members that meet all three of these conditions: (a) at least 91 daily perp returns in the last 91
    days; (b) a supply value on the decision day and on the day lookback_days earlier (supply is read with a one-day
    lag: the value stamped on the day before the decision day); (c) no single-day absolute log change of supply
    above 0.20 inside the lookback window. This drops token migrations, redenominations and bridge-accounting jumps.
    The view starts at the perp panel start, so the first formation is lookback_days after the view start. Scores
    per eligible coin j: (1) dilution g_j = ln(S_j(t-1) / S_j(t-1-lookback_days)) * 365 / lookback_days; (2) beta_j
    = OLS slope of the coin''s daily close-to-close log return on the equal-weight mean daily log return of the
    eligible coins, over the last 91 days. Cohort formation on each decision day, when at least 12 coins are eligible
    (otherwise no new cohort that week): split the eligible coins at the median beta into a low-beta half and a
    high-beta half (an odd coin goes to the high half). Within each half, rank by g_j. The floor(n_half/3) coins
    (at least 1) with the lowest g go to the long leg, and the floor(n_half/3) coins with the highest g go to the
    short leg. Ties are broken by instrument id. Inside the cohort, the long names together get +0.5 and the short
    names together get -0.5, equal weights within each leg (dollar-neutral, beta-matched by construction). Book:
    overlapping cohorts. Each cohort is held for hold_weeks weeks and enters the book with weight 1/hold_weeks.
    The target weight of a coin is the sum over the cohorts that are still active, so gross is at most 1. In the
    first hold_weeks weeks the book ramps up; the slots of cohorts not yet formed are cash. Weights of the active
    cohorts are fixed at formation (no drift rebalancing inside a cohort beyond what the engine applies to target
    weights). Leaving the universe: if a coin held by a cohort drops out of the point-in-time universe or has no
    bar, its weight in that cohort goes to zero at the next decision day (cash, not refilled), as the point-in-time
    universe rule demands (K-0051). It is not re-entered by that cohort. Missing data: a coin with no supply series
    is never eligible. The strategy must raise an error if the supply dataset is absent or entirely empty, instead
    of holding cash silently. Funding is charged by the engine (longs pay positive funding, shorts receive it).
    It is not part of the score.'
  params:
    hold_weeks:
      grid:
      - 13
      - 26
      - 39
      value: 26
    lookback_days:
      grid:
      - 91
      - 182
      - 273
      value: 182
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At each weekly formation (after the close that ends each Sunday UTC) on the eligible coins of the point-in-time
    top-40 perps: within each half split at the median 91-day beta to the equal-weight eligible universe, the floor(n_half/3)
    coins with the highest annualized supply growth over the last lookback_days (primary 182) are marked side -1,
    and the floor(n_half/3) coins with the lowest growth are marked side +1. The middle coins are the unmarked peers.
    Same eligibility and supply lag as the strategy. The mechanism says the -1 coins underperform and the +1 coins
    outperform the peers over the following months.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
