falsification_criteria:
- 'Mechanism: the side-adjusted 60-day abnormal return of the marked coins does not exceed the 95th percentile of
  the time-shifted placebos, or its gross per event is below the round-trip cost.'
- 'Mechanism shape: the side-adjusted abnormal return is not larger at 60 days than at 21 days. A dilution drift
  must build steadily with the horizon; a peak at 5 days followed by a give-back means it is something else (a reversal
  or a news reaction).'
- 'Mechanism era: the latest third of dev has the wrong sign (K-0060). Then the pooled result counts as one boom
  episode, not a dilution premium.'
- 'Strategy: net Sharpe on dev below 0.5 or below the T-bill Sharpe + 0.10, or the one-sided bootstrap bound of
  the Sharpe difference against T-bills not above zero.'
- 'Funding, not dilution: the book''s return before costs and excluding funding (price P&L only) is not positive.
  Then any profit is funding received by the short leg, not the supply mechanism.'
- 'Robustness: fewer than 75 % of the lookback_days x hold_weeks neighbors (91/273 days, 13/39 weeks) beat the benchmark,
  or one third of dev carries more than 60 % of the log return.'
- 'Costs: at twice the modeled costs (including funding as charged) the net Sharpe no longer beats the benchmark.'
notes: 'Brief fit: a long holding horizon in crypto. Each cohort is held 26 weeks (grid 13-39). The signal is a
  slow characteristic, so the book turns over little and a coin typically stays in its leg for many months. The
  mechanism test can only see the first 60 days of that hold (the judge''s cap). The book is built from perps, because
  the short leg is essential and spot shorts carry no borrow cost in the engine.

  Why the data is essential: no loadable dataset holds token supply. Listing age was used as a proxy in H-0058 and
  its lesson names ''listing age from token launch or unlock data is not loadable'' as the open question. Coin Metrics
  Community is free, public, needs no key, covers 140+ assets daily and has a daily forward source, so the card
  could reach G5.

  Family: reused new-listing-overhang on purpose. H-0058 (''token vesting overhang'') filed the same economic claim,
  new supply reaching sellers depresses the price, under that family, so the trials should count together.

  Why this is not a near-copy of H-0004, H-0058 or H-0082 (K-0107): (1) it measures supply growth directly instead
  of listing age; (2) it excludes coins with fewer than 91 days of perp history, so it is not a new-listing or launch-pump
  test; (3) it answers K-0107''s and K-0074''s demand to neutralize beta. Long and short legs are formed inside
  beta halves, with equal counts on each date, so the pooled side-adjusted event return is about half the long-minus-short
  spread of beta-matched coins, and generic market direction mostly cancels. The one known confound left is prior
  run-up. Prior returns are not matched, to keep the card to two parameters.

  Expected size, written before any test: in liquid perps the supply growth of the top third is plausibly tens of
  percent a year and of the bottom third a few percent. If half of a 30-60 %/y issuance gap passes into relative
  price, the spread is 15-30 %/y. The book earns about half of it at gross 1 (0.5 per leg), so 7-15 %/y, against
  a residual volatility of a beta-matched 5-8-name-per-leg book of roughly 20-30 %/y. That gives an expected net
  Sharpe of about 0.3-0.7, so the absolute 0.5 floor is the likely strategy death. Per event, a 60-day side-adjusted
  gross of roughly 1.2-2.5 % against a perp round trip of about 0.3 % puts the cost ratio well above 1. The placebo
  bar is probably 2-4 % (60-day crypto windows, overlapping weekly formations, about 2.5 years of formations), so
  a ''cannot tell'' near miss is likely unless the effect is at the top of this range (K-0034, K-0109).

  Known risks: (a) Persistent characteristic: dilution is fairly persistent per coin, so the time-shifted placebo
  of the same coins absorbs part of a true premium (K-0025, H-0059). What the test can see is the time variation:
  emission launches and decays, halvings and burns move coins between legs. (b) Warm-up (K-0108): signal history
  before the view start is not delivered, so with lookback 182 the first formation comes about half a year into
  the perp panel. Formations then cover roughly two and a half years: about 130 weekly decision dates, enough for
  the 36-date and 30-event-date minimums, but a short sample (K-0006). (c) Funding: in boom phases short legs on
  speculative coins receive funding, which would flatter the book. Hence the price-only falsification line (H-0039
  caution). (d) Survivorship: Coin Metrics coverage is chosen today. Dead coins are likely missing. They are more
  likely to be high-dilution tokens, so missing them biases against this card, not in its favour. (e) SplyCur counts
  minted supply. Tokens minted at genesis and released from vesting contracts show no change, so unlocks are invisible
  and the signal measures protocol issuance only. That dilutes the test but adds no look-ahead. (f) Possible retroactive
  recomputation by Coin Metrics, a K-0002-like risk: the Archivist is asked to report it. (g) Ticker mapping errors
  between Binance and Coin Metrics are possible: ambiguous tickers are dropped.

  Benchmark: market-neutral, so T-bills with the absolute 0.5 Sharpe bar. Mean exposure is about 0.6-0.7 after the
  ramp and universe exits, and the rebalancing dates count as bets (exposure >= 0.5).'
