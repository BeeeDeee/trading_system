id: H-0009
version: 1
title: Disposition-gated news drift - after a stock-specific volume shock, follow the move only when it has the
  same sign as holders' 12-month capital gain, LIQ-500 long/short, hold 5 days
author_agent: scout
family: disposition-news-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Disposition-prone holders (retail and also fund managers) who sell winners into good news to lock
    in gains and hold losers through bad news to avoid realizing losses; they supply the stock below value after
    good news and withhold supply above value after bad news.
  why: 'A day with a stock-specific volume shock and a stock-specific price move is almost always a news day (earnings,
    guidance, analyst action, M&A rumour). Prices underreact to such news when the stock''s holders sit on unrealized
    gains or losses of the same sign as the news (Frazzini 2006): on good news, holders with capital gains sell
    into the rise to realize gains (disposition effect), their supply holds the price below its new value; on bad
    news, holders with capital losses refuse to sell, so the negative information enters the price slowly. The price
    then drifts toward its new value over the following days. The slow timeframe (12-month volume-weighted reference
    price = where the average holder bought) decides whether the fast daily event is traded; the misaligned cells
    (good news on stocks with losses, bad news on stocks with gains) should show little drift and are not traded.'
  why_not_arbitraged: 'The drift is a few days long and event-driven: harvesting it needs daily event processing,
    a short book in names right after bad news (borrow, squeeze and gap risk), and turnover that large funds avoid.
    Event risk per name is idiosyncratic and large relative to the expected drift, so capital is limited. Disposition
    behaviour itself is persistent (documented across decades and investor types).'
signal:
  description: 'Data: sharadar_sep daily ret_co, ret_oc, dollar_volume, tradable, universe LIQ-500 (point-in-time).
    Decision after the close of day t using data up to that close; trades at the open of t+1. (1) Total return index
    P_i from compounded (1+ret_co)(1+ret_oc). Daily close-to-close return r_i,t. (2) Event detection on day t, for
    stocks in LIQ-500 on day t and tradable on t: volume ratio VR_i,t = dollar_volume_i,t / median(dollar_volume_i
    over t-63..t-1) (needs >= 40 valid days, else skip). Abnormal volume AV_i,t = VR_i,t / cross-sectional median
    of VR over all LIQ-500 stocks on day t (removes market-wide volume days: index rebalances, option expiries,
    crash days). Event if AV_i,t >= volume_ratio. Event direction = sign of the market-adjusted return r_i,t - median_j(r_j,t)
    over LIQ-500 on day t (zero = no event). (3) Capital-gain overhang, computed as of the close of t-1 (before
    the event): reference price R_i = dollar-volume-weighted average of P_i over the ref_window trading days ending
    at t-1 (needs at least half of ref_window valid days, else skip). Overhang G_i = P_i,t-1 / R_i - 1. (4) Aligned
    events only: LONG if direction > 0 and G_i > 0; SHORT if direction < 0 and G_i < 0. Other events (misaligned)
    open no position. (5) Position life: enter at the open of t+1, exit at the open of t+1+hold_days. If the same
    stock has a new event while held, the newest event decides: an aligned event restarts the clock with its direction,
    a misaligned event closes the position at the next open. (6) Weights, recomputed every day over the active positions:
    long side gross 0.5 split equally over active longs, short side gross 0.5 split equally over active shorts,
    each name capped at 0.10 (a side with fewer than 5 names is under-invested, the rest is cash; a side with no
    names is cash). Gross <= 1. Missing data on a held name: hold until the exit date or until the engine''s delisting
    handling. Stocks that leave LIQ-500 while held are kept until their exit date.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
    ref_window:
      grid:
      - 126
      - 252
      - 504
      value: 252
    volume_ratio:
      grid:
      - 2
      - 3
      - 4
      value: 3
  selection_procedure: None. One pre-registered primary configuration (3, 252, 5); the grid exists for the G2 neighbor
    test only.
  timeframes:
  - 1d
  - 1q
  - 1y
