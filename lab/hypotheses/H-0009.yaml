falsification_criteria:
- Net Sharpe on dev (LIQ-500) below 0.5, or the one-sided 90 % bootstrap bound of the Sharpe difference vs T-bill
  not above 0.
- Net Sharpe at costs x2 below the T-bill benchmark bar.
- Fewer than 75 % of the grid neighbors of (volume_ratio 3, ref_window 252, hold_days 5) beat the benchmark.
- More than 60 % of the log return in one of the three dev sub-periods (e.g. only the pre-decimal era).
- 'Mechanism (disposition gate): the misaligned book built with the same rules (long good-news events on stocks
  with G < 0, short bad-news events on stocks with G > 0) has a Sharpe at least as high as the aligned book; then
  the overhang gate adds nothing and the disposition mechanism is refuted.'
- 'Mechanism (event drift): a placebo that enters the same aligned names 21 trading days after the event, same hold
  and weights, earns a Sharpe at least as high as the event book; then the return is a slow characteristic (momentum/overhang),
  not post-news drift.'
notes: 'Brief: short holding (1-5 days), US single stocks cross-sectional, multi-timeframe: a slow 12-month capital-gain
  regime per stock (1y) gates a fast daily news event (1d) whose abnormality is measured against a quarterly volume
  baseline (1q). Why it is not the short-term-reversal family (studies 5, 7, H-0007, K-0012): those bet AGAINST
  price moves without information (liquidity provision) and lost in the S&P names and after the early era. This
  card bets WITH the move, and only on information days identified by a stock-specific volume shock; the expected
  sign is the opposite of reversal. It is also not H-0008 (earnings-announcement premium): that bought predicted
  announcers regardless of news direction; here the event is observed (not predicted) and the direction of the news
  decides the side. Known risk, stated up front: post-earnings drift has weakened in large caps after the mid-2000s
  (Martineau 2022, Rest in Peace Post-Earnings Announcement Drift, Critical Finance Review), so the sub-period and
  publication-decay checks may kill it; that outcome would be informative (news is priced on the day in liquid names).
  Costs: the book turns over about every 5 days (~50 round trips a year at 3-6 bps half spread); the gate at costs
  x2 is the other likely killer. Exposure: earnings seasons supply most events; outside them the book may be thinner,
  mean exposure should still exceed 20 % with ~1 000+ aligned events a year in LIQ-500. The engine charges no explicit
  borrow on stock shorts as far as the card knows; liquid LIQ-500 names are mostly general collateral. The overhang
  uses dollar-volume weights as a proxy for Grinblatt-Han turnover weights (no shares-outstanding field).'
