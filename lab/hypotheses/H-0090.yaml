id: H-0090
version: 1
title: Dual-class twin-share gap reversion - LIQ-500, fade a 2-sigma 5-session gap between two share classes of
  the same company (return correlation >= 0.95), long laggard / short leader, hold 5 days
author_agent: scout
family: etf-premium-arbitrage
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Impatient one-class liquidity demanders: index and benchmarked funds trading one class on rebalancing
    or flow days, retail buyers of the cheaper class, holders forced to sell a specific class. They pay the concession;
    the book collects it by holding the cheap class against the rich one for a few days.'
  why: 'Two share classes of one company (voting and non-voting or low-vote classes with equal or near-equal cash-flow
    rights) are claims on the same cash flows. Their relative price moves when liquidity demand hits one class only:
    index funds and benchmarked funds that hold only one class or weight the classes differently, retail preference
    for the lower-priced or more visible class, and mandate-restricted funds. The gap is a temporary price concession,
    not information (news about the company moves both classes alike), so it should close over the following days
    as one-sided traders switch to the cheaper class and arbitrageurs lean against it. Schultz and Shive (2010)
    find exactly this for US dual-class shares: gaps revert, the more liquid class is usually the one that moved,
    and one-sided trades rather than long/short arbitrage close most gaps, which makes the correction slow enough
    for a daily book. Unlike twin ETFs (H-0037), there is no creation/redemption link that closes the gap intraday;
    this is the case K-0105 found to work (closed-end fund gaps against their anchor) moved to a much cheaper cost
    tier.'
  why_not_arbitraged: 'Convergence is not guaranteed: the voting premium can shift (control contests, governance
    events, index-rule changes for one class), so the trade carries basis risk and needs short-sale capacity in
    the rich class. Few pairs exist, the capacity per pair is small for a dedicated fund, and the gross per event
    is tens of basis points, too small for most arbitrage desks once borrow and capital are charged.'
signal:
  description: 'Inputs: sharadar_sep close-to-close total return r = (1+ret_co)*(1+ret_oc)-1, tradable, listed,
    and the point-in-time LIQ-500 membership. All decisions after the close of day t, trades at the open of t+1.
    (1) Pair identification, at the first session of each calendar month: for all stocks that are LIQ-500 members
    on that day and have at least 240 valid daily returns in the trailing 252 sessions, compute the pairwise correlation
    of daily total returns over those 252 sessions (pairwise-complete days). Every pair with correlation >= 0.95
    is a twin pair for that month (fixed design constant that defines a claim on the same cash flows; it is not
    a tuned parameter: unrelated large-cap stocks essentially never reach it). If a stock appears in several pairs
    (three share classes), all its pairs are kept, but a stock can be in at most one open position. (2) Gap and
    z-score, every day t for each twin pair (i, j) with both members in the universe and tradable on t: spread change
    d_s = log(1+r_i,s) - log(1+r_j,s); gap g_t = sum of d_s over s = t-4..t (5-session relative total return); sigma_t
    = standard deviation of d_s over s = t-125..t (at least 100 valid values); z_t = g_t / (sigma_t * sqrt(5)).
    (3) Event: |z_t| >= z_entry, neither stock currently held, and no event in this pair in the previous hold_days
    sessions. The laggard (lower 5-session return) gets side +1, the leader side -1. (4) Book: fixed slots, at most
    2 open pair positions; each pair position is long the laggard with weight +0.25 and short the leader with weight
    -0.25 (gross 0.5 per pair, gross <= 1). If more events fire than free slots, take the largest |z_t| first and
    drop the rest (no queue). Entry at the open of t+1; exit at the open of t+1+hold_days (decided after the close
    of t+hold_days). No stop-loss, no re-sizing while open. Early exit of both legs at the next open if either leg
    leaves the LIQ-500 universe or stops being tradable; a delisting (e.g. a class collapse into the other) closes
    at the dataset''s terminal return, the other leg is closed at the next open. Missing return on any day in the
    gap or sigma window: no event for that pair on that day. Cash otherwise.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_entry:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: After the close of day t, a twin pair (two LIQ-500 members whose daily total returns correlated >= 0.95
    over the trailing 252 sessions, identified monthly) shows a 5-session relative total-return gap of |z| >= 2
    against its own trailing 126-session spread volatility, with no event in that pair in the previous 5 sessions.
    Side +1 on the laggard, -1 on the leader (both marked on the same date).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
