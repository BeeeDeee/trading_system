falsification_criteria:
- 'Mechanism: side-adjusted abnormal return at the 5-session horizon not above the 95th percentile of the time-shifted
  placebos, or gross per marked event below the round-trip cost (the idea is wrong or untradable at taker cost).'
- 'Mechanism: the latest third of the event period (roughly 2014-2020) has a negative side-adjusted mean: the gap
  no longer reverts, or reverts only in the early years (K-0060 decay).'
- 'Mechanism shape: the 1-session horizon is negative or the 10-session mean is below half of the 5-session mean
  with the sign flipping, i.e. no gradual closing of the gap; a concession should show from the first session and
  not give back.'
- 'Strategy: net Sharpe on dev below 0.5, or below T-bill + 0.10, or bootstrap bound of the Sharpe difference vs
  T-bill not above zero.'
- 'Strategy: mean gross exposure below 0.20 or fewer than 100 position entries (too few twin pairs in LIQ-500 for
  a book).'
- 'Robustness: fewer than 75 % of the neighbors (z_entry 1.5/2.5, hold_days 3/7) beat T-bills, or net Sharpe at
  doubled costs below the T-bill Sharpe.'
notes: 'Brief fit: US single stocks, cross-sectional inside LIQ-500, 5-session hold, mechanism test declared. FAMILY:
  filed under etf-premium-arbitrage on purpose, because the mechanism is the same as twin ETFs (H-0037) and the
  closed-end fund cards (H-0077..H-0079): two claims on the same cash flows diverge on one-sided liquidity demand
  and the gap reverts. The trials should count together. Why this is not a retry of H-0037: twin ETFs have a creation/redemption
  link that closes the gap intraday, so daily closes measure noise; share classes have no such link (K-0105: reversion
  showed only where none exists). Why this is not the closed-end fund cards again: different instruments, and the
  cost tier is 3-6 bps half-spread instead of thinly traded funds, which is what killed H-0079''s net Sharpe (gross
  cleared the floor). Why this is not peer-lead-lag-diffusion (H-0013, H-0066): those used ordinary correlated peers
  (correlations around 0.6-0.8) and an information-diffusion story; the 0.95 threshold restricts the set to claims
  on the same company, where no information can be ''diffusing'' and the gap is a pure price concession. The threshold
  is a definition, not a tuned parameter, and is held fixed. FORECAST (written before any test, uncertain): about
  3-8 twin pairs in LIQ-500 at a time, fewer in the first third; 30-60 pair events a year, so roughly 600-1200 pair
  events (1200-2400 marked instruments) on 500-1000 dates over 2001-2020. Gross gap reversion over 5 sessions after
  a 2-sigma gap: 25-60 bps of the pair, i.e. 12-30 bps per marked leg, against a round-trip cost of 6-12 bps per
  leg (3/6 bps half-spread tiers): cost ratio about 1.5-3. Placebo: sides are arbitrary at shifted dates and the
  two legs hedge each other, so the placebo mean should be near zero and the bar a few bps per leg, below cost (K-0034):
  a failure would mean untradable, not a power problem. Exposure arithmetic (K-0098/K-0104): 45 pair events/yr x
  5 sessions / 252 = about 0.9 demanded positions, capped at 2 -> about 0.8 open on average -> mean gross exposure
  about 0.4 (0.2 if exposure counts one leg: this is the floor risk, named in falsification). Book: net about 15-30
  bps of pair per event x 0.25 weight x 45 events = roughly 2-3 %/yr over cash with annual vol about 1.5-2 % (spread
  vol of a twin pair is a fraction of a stock''s vol), so the absolute Sharpe floor of 0.5 is reachable only if
  the gross reversion is near the forecast; at the low end of the forecast doubled costs erase it. Most likely deaths:
  (a) too few pairs for exposure/entries; (b) gross per leg near cost because the liquid class arbitrage is mostly
  intraday now (latest third weak); (c) persistent voting-premium drifts in a pair that the fade fights. Known contamination:
  Alphabet, Berkshire, Comcast, Discovery, News Corp, Fox, Viacom-type pairs exist in the period; the rule is ticker-blind
  and finds pairs only from return correlation, never by name. A stock-for-stock merger target can correlate >=
  0.95 with its acquirer only after a near year-long pending deal; rare, kept in (it is also a claim on the same
  cash flows while the deal stands). No stock data has forward data, so G4 is the ceiling.'
