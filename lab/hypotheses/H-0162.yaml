id: H-0162
version: 1
title: Treasury-curve news into funding structure, learned - LIQ-500 beta-balanced legs in curve-shock weeks, LightGBM
  on deposits, short-term debt, interest burden x shocks, 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity investors who trade financials and leveraged firms on market beta, sector flows and sentiment
    and who update on rate news only when it shows up in reported net interest margin or interest expense; they
    sell (buy) exposed names late, after the bond market has already priced the move.
  why: 'A move in the Treasury curve changes the cash flows of firms through their funding structure, and the link
    is explicit in the balance sheet: deposit-funded lenders reprice assets faster than their sticky deposit costs,
    so a bear steepening (long yields up more than the 2-year) widens their margin, while a front-end rise hurts
    firms that must roll short-term debt and firms whose interest expense is already a large share of revenue. A
    bull steepening in a rate-cut episode has the opposite meaning for the same lenders (credit losses ahead). The
    claim is that generalist equity investors map these Treasury moves to balance sheets with a delay of days: the
    funding-structure consequence of a rate week is priced fully only as analysts revise margin forecasts and the
    next weekly flows arrive, so stocks whose funding structure is exposed to the week''s curve move keep drifting
    in the implied direction over the following five sessions. This is the explicit economic mapping (banks and
    rates, rollover need and the front end) that the H-0116 lesson listed as untested after statistical rate betas
    failed.'
  why_not_arbitraged: The trade is a weekly long/short across hundreds of names whose rate exposure must be read
    from quarterly filings, it carries market and sector risk in the same weeks the bond market is volatile, and
    specialist bank analysts cover only part of the exposed set (insurers, brokers, REIT-like and leveraged non-financials
    are mapped by few). The expected edge per name is small, so it is left to capital that is scarce in rate-shock
    weeks.
signal:
  description: 'Decisions after the close of the last trading day of each week (t); trades at the open of the next
    session (t+1); every position is held 5 sessions and closed at the open 5 sessions after entry; flat in weeks
    that are not shock weeks. Rate inputs (fred_macro, clock next_morning): for each series S in {T10Y2Y, DGS2}
    take the latest value available by the close of t under the dataset clock (in practice the value of t-1), its
    change over the previous 5 available observations, and divide by the standard deviation of such 5-observation
    changes over the trailing 252 observations (needs 252 observations, otherwise the date is not a decision date).
    Call them z_curve and z_2y. Shock week: |z_curve| >= shock_z or |z_2y| >= shock_z (primary shock_z = 1.0). Stock
    features per member and date, all known at the close of t (SF1 usable from the day after the filing; stale after
    400 days -> missing): (1) deposit share = sf1_arq_deposits / sf1_arq_assets, with deposits missing or zero read
    as 0 when assets are present; (2) short-term debt share = sf1_arq_debtc / sf1_arq_assets; (3) total debt share
    = sf1_arq_debt / sf1_arq_assets; (4) interest burden = sf1_art_intexp / sf1_art_revenue, clipped to [0, 2],
    missing if revenue <= 0; (5) own 5-session total return to the close of t minus the universe mean (has the stock
    already priced the week). Features 1-5 are z-scored across the point-in-time members of the date with the framework
    helper (winsorized at +-4). z_curve and z_2y are date-level inputs passed unchanged to every member (NOT cross-sectionally
    z-scored, which would make them constant). Rows of non-shock weeks get z_curve = z_2y = NaN, so they are neither
    trained on nor scored; members without assets or without a 5-day return are not scored. Label: total return
    from the open of t+1 to the open 5 sessions later, ranked across members on the date (framework label, horizon
    5). Model: LightGBM (framework gbm, num_leaves 15, learning_rate 0.05, min_child_samples 200, n_estimators from
    the grid), trained by lab.framework.ml.walk_forward on an expanding window of shock-week rows only, first fit
    when at least 504 trading rows of history with labels exist, refit every 126 rows. Book (score_weights then
    only_on shock weeks): among scored members, long the top 10 % (fixed, not a grid parameter) and short the bottom
    10 % of the score, equal weight inside each leg; the two legs are then scaled so the book''s trailing 252-session
    beta to the equal-weight universe is zero and gross exposure is 1 (if the scaling would put one leg above 0.7
    gross, cap it at 0.7 and give the rest to the other leg, accepting residual beta). Fewer than 50 scored members
    on a date: flat that week. Positions are not renewed in consecutive shock weeks: each shock week opens a new
    5-session cohort after the previous one closed.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    shock_z:
      grid:
      - 0.75
      - 1.0
      - 1.25
      value: 1.0
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: At a weekly decision date that is a Treasury-curve shock week (|z_curve| or |z_2y| >= shock_z), a scored
    LIQ-500 member is in the top 10 % of the walk-forward gbm score among scored members (side +1) or in the bottom
    10 % (side -1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'Deposit share: SF1 quarterly deposits / total assets (0 for firms without deposits); measures how much of the
    balance sheet is funded by sticky-rate deposits, the bank margin channel of a curve move.'
  - 'Short-term debt share: SF1 quarterly current debt / total assets; measures rollover need, the channel of a
    front-end (2-year) yield move into funding cost.'
  - 'Total debt share: SF1 quarterly total debt / total assets; general leverage, how strongly equity value reacts
    to any change in the discount and funding rate.'
  - 'Interest burden: SF1 trailing-twelve-month interest expense / revenue, clipped to [0, 2]; how much a funding-cost
    change matters relative to the firm''s income today.'
  - Own 5-session total return minus the universe mean to the close of t; whether the stock has already moved with
    the week's rate news (the underreaction claim needs it not to have).
  - 'z_curve: 5-observation change in the FRED 10y-2y Treasury spread (T10Y2Y) divided by its trailing 252-observation
    std of such changes; date-level, the steepening or flattening shock.'
  - 'z_2y: same transformation of the FRED 2-year Treasury yield (DGS2); date-level, the front-end (policy-expectation)
    shock that separates bear from bull steepening.'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'In a cross-sectional ranking a date-level shock adds the same number to every stock''s ridge
    score, so a ridge on these features can only rank stocks by a fixed combination of deposit share, debt and interest
    burden: the same static balance-sheet tilt in every shock week, whatever the sign of the shock. The mechanism
    says the sign of the deposit-share and debt slopes must follow the sign of the shock (deposit-funded lenders
    long after a bear steepening, short after a front-end-led flattening), and that a steepening means opposite
    things for lenders when it comes with a rising 2-year (margin gain) or a collapsing 2-year (rate cuts into a
    credit cycle): a three-way interaction of two date-level shocks with a stock characteristic, with a threshold
    in shock size. A tree can split on the shocks and then on the balance sheet; a ridge cannot. The counterparty
    is the generalist holder who trades the exposed names on beta and sector flow and reprices funding exposure
    only with a lag. If a ridge on the same features is as good, what pays is a static financial-or-leverage tilt
    in volatile rate weeks, not the transmission.'
