falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the event (model top/bottom leg members in shock weeks)
  is not above the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of dev has the wrong sign (the delayed-mapping claim should not have faded if generalists
  still map rates to balance sheets slowly).'
- 'Mechanism shape: the abnormal return is all in the first session and flat afterwards (priced at once, no delayed
  transmission), or it grows steadily to 21 sessions while the 5-session value is small (slow style drift, not rate
  news).'
- 'Linear baseline: a ridge (framework ridge) on the same seven features with the same schedule and book is as good
  as or better than the gbm; then the shock-dependent transmission is not what pays.'
- 'Strategy: net Sharpe on dev below T-bill + 0.10 or below the absolute 0.5 bar, or the bootstrap bound of the
  Sharpe difference is not above zero.'
- 'Robustness: fewer than 75 % of the neighbours of shock_z 1.0 and n_estimators 100 beat T-bills with Sharpe >=
  0.5, or one third of dev carries more than 60 % of the log return.'
- 'Owner diagnostic (descriptive, if the framework can report it): deposit share and the two shocks are not among
  the model''s top splits, i.e. the model did not use the bank-margin channel.'
notes: 'Brief fit: short hold (5 sessions), cross-asset (Treasury market signal from FRED, trades in US stocks),
  learned model with a stated nonlinearity. Family: this is the same economic mechanism as oil-shock-equity-underreaction
  (delayed stock response to a macro price through an exposure), so it is filed there and its trials count with
  H-0056, H-0114, H-0116, H-0119, H-0126, H-0128, H-0129, H-0158 and H-0159. Why it is not a rerun: H-0116 used
  statistical betas from a year of daily regressions and pooled rates with dollar and credit; its lesson listed
  the explicit economic mapping (banks and rates) as the untested route. H-0129 used inflation news and real-asset
  intensity; H-0126/H-0158/H-0159 used credit spreads. Here the shock is the Treasury curve itself (curve and front
  end separately) and the exposure is read from funding structure (deposits, short-term debt, interest burden),
  a new information source for the family, with the bull/bear distinction only a nonlinear model can use. Placebo
  identity trap (K-0025, K-0074): the side of the same stock flips with the sign of the shock, so a static bank
  or leverage tilt and its beta should cancel over weeks in the same-stock placebo; within a week the legs are beta-balanced
  in the book, but the G1 event study is raw against peers, so a bull-steepening crash week can still read as market
  direction (stress rebound, K-0084): that is the most likely confound and why the latest-third and shape conditions
  are kill conditions. No references on purpose: I am not certain of an exact citation for delayed bond-to-stock
  transmission, and contemporaneous bank interest-rate-risk studies do not make this claim. Forecasts (K-0120 says
  my forecasts run high, so these are cautious): shock weeks about 35-45 % of weeks at shock_z 1.0, so mean exposure
  about 0.35-0.45 and several hundred decision dates; events about 100 per shock week (50 per leg) times 300-400
  shock weeks after the model''s warm-up (first fit after about two years, so the first third of dev 1998-2005 is
  partly empty, K-0163); gross per event central 15 bps over 5 sessions, pessimistic 0, against a LIQ-500 round
  trip that is probably of the same order, so the cost check is the likeliest death after the placebo test. Expected
  per-leg composition: lenders (deposit share > 0) are about a tenth of LIQ-500, so the legs will mix banks with
  leveraged non-financials; that is intended (rollover channel), but it means the bank channel is diluted if the
  model leans on leverage only, hence the descriptive split request. Missing SF1 deposits: Sharadar leaves deposits
  empty for most non-banks; read as 0 only when assets exist, never filled from later filings. Mechanism test event
  matches the book: each shock-week decision date marks the members in the top leg (+1) and bottom leg (-1) of the
  model score.'
