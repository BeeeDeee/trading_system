id: H-0193
version: 1
title: Conviction-sized insider purchases - LIQ-500 market-neutral, long stocks whose trailing 91-day open-market
  insider buying first crosses $500k, liquid-basket hedge, hold 5 days
author_agent: scout
family: insider-purchase-information
asset_classes:
- us_equity
- alt
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Outside holders who keep selling or ignore the filing: investors who sold the stock in the decline
    that usually precedes insider buying (momentum and loss-averse sellers, de-risking funds), and investors who
    discount insider purchases in large caps as public-relations signalling. They sell to, or fail to buy from,
    a better-informed insider and the traders who follow the filing.'
  why: 'Officers and directors know more about their firm''s prospects than outside investors, and open-market purchases
    (unlike sales, which are mostly diversification and liquidity) are the trades in which that information shows:
    purchase portfolios earn positive abnormal returns while sale portfolios do not (Lakonishok and Lee 2001; Jeng,
    Metrick and Zeckhauser 2003), and the abnormal return sits in the non-routine, opportunistic trades rather than
    the routine ones (Cohen, Malloy and Pomorski 2012). Most purchases in large caps are small token or routine
    buys by directors; a purchase programme that puts a large personal sum at risk is the costly, credible version
    of the signal. The claim: when an insider''s cumulative open-market buying in a liquid US stock over the trailing
    91 days first reaches a large dollar amount, the price has not fully absorbed the information by the time the
    Form 4 is usable, and the stock beats the other liquid stocks over the following week.'
  why_not_arbitraged: 'Insiders themselves cannot scale the trade: the short-swing rule (Section 16(b)) forces them
    to disgorge profits from a purchase and a sale within six months, trading windows close them out for most of
    the quarter, and personal wealth caps the size. Outside followers face a soft signal (signalling purchases exist),
    the falling-knife risk of the stocks insiders buy after declines, events that are rare per stock and clustered
    in selloffs, and small capacity. Jeng, Metrick and Zeckhauser report that only a sixth of the abnormal return
    arrives in the first five days after the trade, so the information is absorbed slowly rather than at the filing.'
signal:
  description: 'Inputs per stock j and session t: ins_buy_value_91d (sum of open-market insider purchase value,
    transaction code P, filed in the trailing 91 calendar days) and ins_buy_n_91d (number of such purchase transactions),
    both as delivered by the sharadar_insiders loader, which makes a Form 4 usable only from the day after its SEC
    filing date (never the transaction date). Event: after the close of session t, stock j is a LIQ-500 member and
    tradable, ins_buy_value_91d[t-1, j] < X and ins_buy_value_91d[t, j] >= X with X = min_buy_usd, and ins_buy_n_91d[t,
    j] > ins_buy_n_91d[t-1, j] (a new purchase filing became usable on t). Missing (NaN) insider values on t or
    t-1 mean no event (the dataset is NaN before 2008 plus one window). A stock can fire again only after its trailing
    value has fallen back below X (purchases age out of the 91-day window), so a buying spree is one event. Book
    (market-neutral, decided after the close of t, traded at the open of t+1): each event opens a slot held for
    exactly 5 sessions (entered at the open of t+1, closed at the open of t+6). A slot is long the event stock with
    weight 0.08. If more than 5 slots are open, every slot''s long weight is 0.40 / k (k = open slots), so total
    long never exceeds 0.40. The hedge is a short of the same total dollar amount as the open long weights, spread
    equally over the 50 most liquid LIQ-500 members by liq_rank at the decision date (all members if fewer than
    50), excluding stocks that hold an open slot. The hedge basket and its weights are recomputed only on sessions
    when the set of open slots changes, to keep turnover to the slot openings and closings. Gross exposure is at
    most 0.80. With no open slot the book is flat (cash earns the T-bill rate). If a slot''s stock leaves LIQ-500
    or becomes untradable during the hold, the slot is closed at the next tradable open. P&L uses total returns
    (ret_co, ret_oc); no price filter, no other condition.'
  params:
    min_buy_usd:
      grid:
      - 250000
      - 500000
      - 1000000
      value: 500000
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of session t, a LIQ-500 member''s trailing 91-day open-market insider purchase value (as
