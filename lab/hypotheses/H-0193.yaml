falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of crossing events is below the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost: large insider purchase programmes carry
  no tradable week-scale drift in LIQ-500.'
- 'Mechanism: the event average is at or below the placebo mean (same stocks on shifted dates), as in H-0012: the
  size cut selects beaten-down stocks, not an information moment.'
- 'Mechanism: the latest third of the dev period (about 2016-2020) has a negative abnormal return at the primary
  horizon: the effect is absent or gone in recent large-cap data.'
- 'Horizon shape: the 1-session average exceeds the 5-session average (a bounce that is spent at the open, not slow
  absorption); or the 5-session average is below cost while only the 21-session average is large (slow drift beyond
  the hold: the claim fails at this horizon and must not be rescued by a longer hold on the same events).'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference against
  T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the min_buy_usd neighbours (250k, 1M) beat the benchmark, or net Sharpe at doubled
  costs is below the T-bill Sharpe.'
notes: 'Why this is not H-0012 again. H-0012 (same family, one trial) marked the first purchase filing after a half-year
  without any, regardless of size, and found a slightly negative 5-day average below the placebo middle. Its lesson
  named purchase size as the missing feature ("features the loader lacks (purchase size, officer role, several insiders
  buying together)"); the loader now delivers the dollar value (ins_buy_value_91d). In large caps most purchase
  filings are token director buys, so an unsized event set is mostly routine trades, which Cohen, Malloy and Pomorski
  find carry no information. This card drops the quiet-window rule (not a retune of it) and asks one different question:
  does a large personal commitment, measured in dollars, carry information that a token purchase does not? Absolute
  dollars rather than a fraction of market cap or dollar volume: the signal is the insider''s personal wealth at
  risk, and a $500k purchase is material for nearly any executive or director, while scaling by firm size would
  demand hundreds of millions in mega caps. Round grid values, no threshold fitted to history. Brief fit. Short
  horizon, US single stocks, cross-sectional, LIQ-500, with a mechanism test. The literature places most of the
  insider-purchase abnormal return over months (JMZ: a sixth in the first five days after the trade, a third in
  the first month). With filings within two business days and the loader''s day-after rule, entry comes about two
  to four sessions after the trade, so the 5-day hold catches part of the early absorption, not the whole drift.
  The card accepts that handicap on purpose: the brief asks for a short horizon, and the falsification list says
  in advance that a drift visible only at 21 sessions does not rescue the claim. Forecasts (stated so the Librarian
  can check them; earlier Scout forecasts ran high, K-0144, K-0171). Events: about 120-300 crossings a year at $500k
  across LIQ-500, clustered in Q4 2008 to Q1 2009 and in March 2020 and in the weeks after earnings releases (open
  trading windows); 12.5 dev years give about 1,500-3,700 events on 800-1,800 dates, pessimistic case 600 events.
  Round trip about 10-12 bps (LIQ-500 half-spread tiers with the 5 bps floor). Gross 5-session abnormal return vs
  unmarked members: pessimistic 0, central +0.20 %, optimistic +0.45 %. Placebo bar: event-level 5-day abnormal
  sd about 4-5 % in these beaten-down names, so with about 2,000 events and date clustering the 95th placebo percentile
  should sit roughly 0.15-0.25 % above the placebo mean, about at or above cost. The central case is therefore a
  near miss; only the optimistic case passes clearly. Book: each slot pays the stock round trip plus a hedge round
  trip (about 16 bps together), so net per slot is small at the central case and the net Sharpe floor of 0.5 is
  reachable only if gross per event is about 0.4 % or more. Likeliest death: mechanism percentile or cost at G1;
  second: the Sharpe floor (K-0064). Confounds named in advance. (1) Earnings-reaction drift: insiders buy in the
  open window after releases, often after a negative reaction, and negative reactions drift down (K-0046); that
  works against this card. (2) Beta: insiders buy after declines, so event stocks may carry higher beta than the
  peers, and the raw G1 comparison partly measures market direction (K-0074); the dev window holds both the 2008-2009
  crash and the 2009 rebound. (3) Falling knife: H-0012''s middle third was negative, read as buying into declines
  that continued. A by-size split (250k vs 1M events) and a split by prior 21-session return would separate conviction
  from contrarian timing; they cannot be reported by G1 (K-0218), so only the G2 neighbours give a partial size
  gradient. No forward data for stocks: the card can pass at most G4.'
