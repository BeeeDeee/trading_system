market_exposure: market_neutral
references:
- cite: Jegadeesh (1990) Evidence of predictable behavior of security returns, Journal of Finance
  year: 1990
- cite: Lehmann (1990) Fads, martingales, and market efficiency, Quarterly Journal of Economics
  year: 1990
- cite: 'Chan (2003) Stock price reaction to news and no-news: drift and reversal after headlines, Journal of Financial
