id: H-0030
version: 1
title: No-news shock reversal in the S&P 500 - dollar-neutral, buy peer-adjusted daily losers and sell winners on
  sessions without an 8-K earnings release, staggered 5-day hold, 2005-2020
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Impatient traders who demand immediacy in one stock on one day (fund flows, forced de-risking, rebalancing,
    momentum and stop-loss orders) and pay the temporary concession to whoever takes the other side for a few days.
  why: 'A large one-day move of a single stock relative to its peers has two possible causes: new information about
    the firm, or a non-informational demand shock (a fund liquidating or building a position, a hedge rebalance,
    a stop-loss cascade) that liquidity providers absorb only at a price concession. Information moves drift (post-earnings-announcement
    drift), concession moves revert as the providers unwind (Grossman-Miller; Campbell, Grossman, Wang 1993). Chan
    (2003) and Savor (2012) show this split directly: price shocks with public news or analyst reports drift, shocks
    without them reverse. Earlier reversal books in this lab pooled both kinds of moves, so the drift of the news
    moves diluted the reversal of the others. With real earnings-release dates (sec_8k_item202) the main scheduled
    news session of a large cap can now be removed, so the event set is closer to the pure liquidity shocks the
    reversal mechanism is about.'
  why_not_arbitraged: Providing liquidity across many names for days ties up balance sheet and carries inventory
    risk that peaks exactly when liquidity providers are constrained; the edge per trade is small relative to the
    spread, so capacity is limited and the premium is the price of that risk. It may well be competed away in large
    caps after decimalization and the growth of electronic market making; that is what this card tests.
signal:
  description: 'Daily decision after the close of day t, using data up to that close; trades at the open of day
    t+1. Universe: point-in-time S&P 500 members on day t that are tradable on t and have at least 252 sessions
    of return history. (1) Close-to-close return r_j(t) = (1+ret_co)(1+ret_oc)-1. (2) Peers: on the first session
    of each month, using returns up to the previous close, each member''s peers are the 10 other members with the
    highest correlation of daily returns over the previous 252 sessions (at least 126 common observations; otherwise
    the stock has no peers and is not eligible that month). (3) Peer-adjusted shock e_j(t) = r_j(t) minus the mean
    r(t) of its peers that have a return on t. (4) Standardized shock z_j(t) = e_j(t) / standard deviation of e_j
    over sessions t-63..t-1 (at least 40 observations, else not eligible). (5) News exclusion: the stock is not
    eligible on t if ea_reaction_day is 1 on t or on t-1 (earnings-release reaction session or the session after
    it), or if ea_reaction_day is NaN on t (no EDGAR coverage, so a no-news day cannot be confirmed). (6) Among
    eligible members, the top leg_pct fraction by z (rounded, at least 1 name) are the day''s short cohort and the
    bottom leg_pct fraction the day''s long cohort. (7) Staggered tranches: each daily cohort is held for hold_days
    sessions, from the open of t+1 to the open of t+1+hold_days; it carries +1/(2*hold_days) of capital split equally
    over its long names and -1/(2*hold_days) split equally over its short names, with no re-equalising during the
    hold. The book is the sum of the active cohorts (gross at most 1, dollar-neutral by construction; weights of
    a stock in several cohorts are netted). (8) A position whose stock stops being a member, stops trading or delists
    is closed at the next available open (delisting returns per the dataset policy); its cohort slot stays in cash
    until the cohort expires. No date literals, no named stocks.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    leg_pct:
      grid:
      - 0.01
      - 0.02
      - 0.03
      value: 0.02
  timeframes:
  - 1d
mechanism_test:
  event: After the close of day t, an S&P 500 member that had no 8-K Item 2.02 earnings-release reaction on t or
    t-1 (and has EDGAR coverage) is in the top (side -1) or bottom (side +1) leg_pct fraction of the day's eligible
    members by its peer-adjusted, volatility-standardized one-day return.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
