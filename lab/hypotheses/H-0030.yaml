falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the no-news shock events is not above the 95th percentile
  of the 200 time-shifted placebos.'
- 'Mechanism: gross abnormal return per event at 5 days is below the round-trip cost of trading it, or has the predicted
  sign in fewer than 2 of the 3 dev sub-periods.'
- 'Mechanism, era: the latest third of the dev events (the one that predicts the future, K-0030) has a non-positive
  abnormal return; then the reversal is a pre-2010 or crisis artefact, not a live liquidity premium.'
- 'Strategy: net Sharpe on dev below the T-bill bar (Sharpe 0.5), or the bootstrap bound of the Sharpe difference
  against T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (leg_pct 0.01 / 0.03, hold_days 3 / 7) clear the T-bill bar, or
  the book no longer clears it at costs x2.'
- 'Concentration: more than 60 % of the dev log return comes from one sub-period (e.g. the crisis years), which
  would make it the evaporating-liquidity market bounce of studies 6-7, not a stock-selection premium.'
notes: 'Brief fit: short horizon (5 sessions), US single stocks, cross-sectional, daily events, so the book is invested
  every day (no part-time window, K-0027) and the mechanism test runs first. Why another card in short-term-reversal
  (honest family, all trials count): this is the diagnostic the lessons asked for and never got. H-0007''s open
  question: run the mechanism check restricted to after 2005 and to large caps; K-0012 and study 5 found the profit
  in early years and less liquid names. This card is S&P 500 only and starts in 2005 by construction (the 8-K data
  begin in 2004-08), so neither early-era nor small-name profit can carry it. The mechanism-level difference from
  studies 5, 7 and H-0007 is the news split: those books pooled information moves (which drift, see the PEAD family
  and H-0028) with non-informational shocks (which should revert); here the real release sessions are removed and
  the shock is measured against correlated peers, so industry-wide factor moves (which continue) are not traded
  as reversals. No trend, VIX, volume or intraday-split conditioning, no tuned threshold: rank legs only. Expected
  outcome, stated in advance: Chan (2003) found the no-news reversal mainly in small illiquid stocks at a monthly
  horizon, so the prior in S&P 500 at 5 days is low. A clean failure of the mechanism test would close the family
  for large caps post-2005 even with the news filter, which is worth one trial; a pass with a latest-third effect
  above cost would be the first evidence that a liquidity premium survives there. Known limits: Item 2.02 covers
  only earnings releases (M&A, guidance, FDA and analyst news remain in the event set and bias it toward drift,
  i.e. against the card); some firms file releases under item 7.01 and are missed; EDGAR coverage gaps exclude a
  stock rather than mislabel it (rule 5). Costs: S&P 500 names sit in the lowest cost tiers; turnover is about 0.4
  of capital per day (one cohort in, one out), so the event effect must exceed roughly 20 bps per 5-day event to
  clear costs x2; the cost-ratio gate at the mechanism stage checks the per-event part of this first. Feasibility
  (K-0032): the event subject is a current S&P 500 member at the event date by construction, and positions in stocks
  that leave the index are closed at the next open, so no weight falls outside the declared universe. The card needs
  ea_reaction_day delivered for the sp500 universe kind; if the loader only attaches it to liq_n, the fallback is
  liq_n with n = 500 (Chair decision, not a silent switch). G0 note (K-0040): the synthetic market needs a few release
  flags and peer structure for the look-ahead check to exercise the code; the Skeptic should read the event code
  for the t vs t-1 release exclusion and for peers computed from data before the month start.'
