id: H-0106
version: 1
title: ETF-arbitrage flow pressure in S&P 500 stocks, learned - dollar-neutral 5-day cohorts, LightGBM on sector-ETF
  push x ETF volume x own news
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Traders who demand immediacy through sector ETFs on flow days (rotation and hedging flow, leveraged
    and inverse sector products rebalancing at the close). APs and basket arbitrageurs lay the trade off on the
    constituents at a concession; the patient side of the single names earns it back as prices revert.
  why: 'Sector SPDR ETFs are used for fast, cheap sector bets and hedges. When a sector ETF receives a large non-fundamental
    order flow (rotation, hedging, leveraged-ETF rebalancing), authorized participants and basket arbitrageurs pass
    it into the constituent stocks: every heavy constituent is bought or sold in proportion to its index weight,
    whatever its own news. The part of a constituent''s move that came through the wrapper on such a day is price
    pressure, and liquidity providers who absorb it are paid by a partial reversal over the following days (Ben-David,
    Franzoni and Moussawi 2018: ETF ownership raises volatility and the negative autocorrelation of constituent
    returns; Brown, Davies and Ringgenberg 2021: ETF flows signal non-fundamental demand that reverses). On ordinary
    days a sector move is mostly industry information, which tends to continue for days. So the sign of the predictive
    slope of the wrapper-driven component depends on the flow state of the wrapper and on whether the stock had
    its own news: that interaction is what the model must find.'
  why_not_arbitraged: Absorbing the pressure means holding single-name inventory for days against a sector-wide
    move, i.e. taking sector risk exactly on days of abnormal volume, which cluster in stress when arbitrage capital
    is short. The AP arbitrage itself is what transmits the shock, it does not correct it. Per-name gains are small
    next to the spread, so only a selective, model-ranked book can collect them. The channel should have grown with
    ETF assets, which is a testable prediction (latest third of dev at least as strong as the first).
signal:
  description: 'Data: sharadar_sep total returns and dollar volume of S&P 500 point-in-time members; sharadar_sfp
    ret_co, ret_oc and dollar_volume of SPY and the nine original sector SPDRs (XLB, XLE, XLF, XLI, XLK, XLP, XLU,
    XLV, XLY), used as signals only and never traded; 8-K flags ea_reaction_day and nonearn_8k_reaction_day. Close-to-close
    total return r = (1 + ret_co) * (1 + ret_oc) - 1 for stocks and ETFs. Sector excess return of ETF k on day s:
    x_k,s = r_k,s - r_SPY,s. Stock excess return e_i,s = r_i,s - r_SPY,s. Sector assignment (recomputed after the
    close of the first session of each month, held through the month): over the trailing 252 sessions ending at
    that close (at least 189 valid pairs, else the stock is unassigned and not scored), correlate e_i with x_k for
    each of the nine ETFs; assigned sector k* = the ETF with the highest correlation, loading rho_i = that correlation,
    beta b_i = OLS slope of e_i on x_k* over the same window. Features per stock and decision date t, all from data
    up to the close of t, z-scored across the members of date t with the framework helper (the news flag enters
    as 0/1): (1) push_1d = b_i * x_k*,t; (2) push_5d = b_i * sum of x_k*,s over s = t-4..t; (3) etf_flow = log(DV_k*,t
    / median DV_k* over t-63..t-1), DV = dollar volume of the assigned ETF; (4) idio_5d = sum over s = t-4..t of
    (e_i,s - b_i * x_k*,s); (5) own_flow = log(DV_i,t / median DV_i over t-63..t-1); (6) own_news = 1 if ea_reaction_day
    or nonearn_8k_reaction_day equals 1 on any session t-4..t, else 0; (7) loading = rho_i. A stock with any feature
    missing is not scored. Label (framework): total return from the open of t+1 to the open of t+6 (horizon 5),
    cross-sectional rank. Model: framework gbm (LightGBM) via lab.framework.ml.walk_forward, n_estimators from params,
    num_leaves 15, learning_rate 0.05, min_child_samples 500, other settings framework defaults; expanding training
    window, refit every 126 rows, training only on labels fully realized by the decision date (framework purge).
    Book (score_weights): every session t with at least 100 scored members, a new cohort goes long the top `top`
    fraction and short the bottom `top` fraction of scores, equal weight within each leg, 0.1 gross per leg (cohort
    gross 0.2), entered at the open of t+1 and closed at the open of t+6. The book is the sum of the five live cohorts
    (gross <= 1.0, dollar-neutral). A stock that leaves the S&P 500 is closed at the first decision row outside
    the universe (engine rule), not kept to schedule. Before the first walk-forward score the book is flat. No other
    filter, no regime switch.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
mechanism_test:
  event: 'Flow-day entry: at decision date t, stock i newly enters the long leg (top `top` fraction of model scores,
    not in it at t-1; side +1) or the short leg (bottom `top` fraction, not in it at t-1; side -1), and its assigned
    sector SPDR had a flow session at t: the ETF''s dollar volume >= 2 times its median over t-63..t-1 and its |excess
    return over SPY| on t >= 2 times the standard deviation of that excess return over t-63..t-1.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'push_1d: assigned sector SPDR excess return over SPY on day t times the stock''s 252-day beta to it (the part
    of today''s move that came through the wrapper); sharadar_sfp + sharadar_sep'
  - 'push_5d: the same over the last 5 sessions (a week of wrapper-driven move, which may be information or pressure)'
  - 'etf_flow: log of the assigned ETF''s dollar volume on t over its 63-session median (flow state of the wrapper;
    the variable that should flip the sign of push)'
  - 'idio_5d: the stock''s 5-session return net of SPY and of its sector-wrapper component (own, stock-specific
    move)'
  - 'own_flow: log of the stock''s dollar volume on t over its 63-session median (did the stock trade on its own
    account or only as part of the basket)'
  - 'own_news: 1 if an 8-K earnings release or non-earnings 8-K reaction session fell in t-4..t (sec_8k_item202,
    sec_8k_items), else 0 (a filed reason for the stock''s own move)'
  - 'loading: 252-day correlation of the stock''s SPY-excess return with its sector ETF''s SPY-excess return (how
    tightly the wrapper binds the stock; proxy for index weight and ETF arbitrage exposure)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The claim is a sign flip, not an additive effect: the wrapper-driven component (push) should
    continue on normal-volume days (industry information diffuses) and reverse on abnormal-volume days of the wrapper
    (non-fundamental flow), and only for tightly bound constituents without their own news. A ridge on the same
    seven features fits one slope for push averaged over both states, close to zero, and cannot condition it on
    etf_flow, loading or own_news without hand-made products; a depth-limited tree can split on etf_flow first and
    fit opposite slopes below. The ones who pay are sector-ETF flow traders through the AP and basket channel; if
    a ridge on the same rows does as well, the plain reversal or continuation of push is the whole story and the
    flow interaction found nothing.'
