falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of flow-day entries (event below) is not above the 95th
  percentile of the time-shifted placebos, or its gross per event is below the round-trip cost.'
- 'Mechanism era: the latest third of dev (about 2015-2020) is not positive. The channel should grow with ETF assets,
  so a pooled pass carried by the earliest third (2008-type stress) refutes the ETF-arbitrage reading even if the
  gate passes it.'
- 'Mechanism shape: the 1- and 3-session averages are not positive while the 10-session average is larger than the
  5-session one by more than half, i.e. a slow drift rather than a concession that reverses within the week.'
- 'A ridge (framework ridge) on the same seven features, rows, label and refit schedule gives flow-day entries with
  the same or a larger abnormal return: the sign-flip interaction is not what pays.'
- Net Sharpe on dev below 0.5, or below T-bill + 0.10, or the bootstrap bound of the difference below zero.
- Fewer than 75 % of the grid neighbours of n_estimators 100 and top 0.1 beat the benchmark, or net Sharpe at doubled
  costs is not above the benchmark.
notes: 'Why this is not a dead idea again. Peer lead-lag (H-0013, H-0066) bought laggards to catch up with correlated
  peers'' information; here the claim is the opposite sign for the wrapper-driven component on wrapper-flow days,
  a price-pressure story. H-0075 traded sector ETFs after rate shocks with no flow state. H-0094, H-0099 and H-0103
  reversed a stock''s own move conditioned on stock- or market-level state; here the reversed object is the part
  of the move transmitted through a sector wrapper, the state is that wrapper''s own volume, and the universe is
  the S&P 500 because the sector SPDRs hold exactly those stocks. Filed under short-term-reversal on purpose: liquidity
  provision against non-fundamental pressure is the family''s mechanism, and its trials should count. New information
  channel for the lab: ETF dollar volume as a flow proxy for constituent stocks. Forecasts (K-0120, K-0144, written
  before any data): flow sessions (wrapper dollar volume >= 2x its 63-session median and |sector excess return|
  >= 2 sigma of its 63 sessions) on roughly 1-2 % of sessions per ETF, about 20-35 sector-days a year, 300-600 in
  2005-2020, clustered in stress (2008, 2011, 2015, 2020); flow-day entries 1 500-8 000 on 250-500 dates (low end
  if the model ignores the flow features). Round trip about 11 bps in the S&P 500 tier. Gross per flow-day entry:
  ceiling 30-40 bps, central 10-20 bps, a tenth of the ceiling 3-4 bps; at the tenth the mechanism dies on cost
  and the lesson is that wrapper pressure in S&P 500 names is priced out by the next open. Book arithmetic (K-0064):
  all entries, not only flow-day ones, carry the book; at 10 bps gross per entry the dollar-neutral daily-cohort
  book earns about 5 % a year gross against about 5.5 % of cost, so it only clears the 0.5 Sharpe floor if the model''s
  ordinary-day entries also earn about 20 bps; the most likely death after a mechanism pass is the strategy gate
  (as H-0028, H-0092). The mechanism test is the informative part: does wrapper-flow pressure exist and grow lately?
  Expected beta gap between event legs: small, both sides are marked and legs come from the same sectors on the
  same dates (K-0074). Timing: features use closes up to t, sector assignment uses data to the first close of the
  month, trades at the open of t+1. The wrapper''s closing-auction pressure that reverses overnight is lost to a
  next-open entry; only the part that reverts over days can be collected. Warm-up: the 252-session assignment window
  and the walk-forward minimum sample mean first scores around 2006 (K-0108: no signal history before the period
  start), so the first third of dev is shorter in practice; the period starts with the 8-K data so that no block
  is empty (K-0145). Implementation risks: the ETFs are signal instruments outside the tradable S&P 500 universe;
  if the engine or G0 refuses them, fail loudly, do not drop the flow features. Descriptive requests (not gate items):
  the same model''s entries on large sector-move days with normal wrapper volume, as the control that separates
  flow pressure from generic sector reversal; the split of flow-day entries by side (pushed-down long vs pushed-up
  short); the gbm feature importance of etf_flow.'
