id: H-0205
version: 1
title: Quarterly index share-update pressure as a long-only tilt - SPY core, 20 % of NAV in the 50 S&P 500 members
  with the largest pending share increase for the 20 sessions before each quarterly rebalance
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Passive S&P 500 funds and benchmarked mandates that must buy the added shares at or near the rebalance
    close regardless of price (tracking error to the index is their binding constraint), and the dealers who sell
    them the inventory at the close. The tilt is paid by them through a slightly higher price at R.
  why: 'Index funds and index-tracking desks hold S&P 500 members in proportion to the index share count, and the
    index applies most ordinary share-count changes (issuance, employee stock, conversions) only at its quarterly
    share rebalance, effective after the close of the third Friday of March, June, September and December. A member
    whose filed share count has risen since the last rebalance therefore faces a known, dated, price-insensitive
    buy order from passive holders at the rebalance close. Demand curves for single stocks slope down (Shleifer
    1986; Harris and Gurel 1986 for index-list changes), so the buying is partly absorbed by price in the weeks
    before the close as pre-positioning traders take inventory they expect to sell to the index funds at R. In H-0201
    the pending-increase side carried the event: the increase names beat other members over the window with the
    gain in its second half, the shape of pre-positioning. This card takes only that side, as a tilt on an always-invested
    SPY core, so the excess over SPY is the long-leg effect alone, with no short leg and no idle cash.'
  why_not_arbitraged: The effect is small per name (of the order of the round-trip cost of a large-cap stock) and
    lives four times a year in fifty names, so capacity for a dedicated arbitrageur is small and the trade carries
    idiosyncratic risk of 20 sessions per name; the index funds' mandate makes them insensitive to the concession.
    Pre-positioning competition is the reason the effect is thin, not absent.
signal:
  description: 'Definitions are those of H-0201 and the Builder reuses H-0201''s implementation of them unchanged
    (pending share count, eligibility filters, split guard, rebalance calendar); they are restated here. (1) Rebalance
    date R: for each calendar quarter, the third Friday of March, June, September and December, or the last XNYS
    session before it if that Friday is not a session. R_prev is the previous such date. (2) Decision date d = the
    XNYS session W sessions before R (d + W sessions = R). Decisions use data up to the close of d; trades happen
    at the open of d+1. (3) Share counts, split-consistent: shares at a filing = sf1_arq_marketcap / sf1_arq_price
    (both frozen at the same filing date, so the ratio is the share count in that date''s share units). Never sharesbas
    x close_u (K-0168). S_old = this ratio as known (point-in-time, usable from the day after the filing) at the
    close of R_prev; S_new = this ratio as known at the close of d. Pending share increase g = S_new / S_old - 1.
    (4) Eligible at d: a point-in-time S&P 500 member at d that is tradable at d; S_old and S_new both available
    and not stale (sf1 400-day staleness rule); the latest sf1 filing as of d was filed after the close of R_prev
    (a new share count is pending); split guard: no session t in the interval from 5 sessions before the filing
    behind S_old to d on which the unadjusted close ratio close_u(t)/close_u(t-1) differs from the total return
    1 + ret_cc(t) (ret_cc = ret_co x ret_oc compounded) by more than 20 % in either direction (a split, reverse
    split or data break makes the two share counts incomparable); and 0.005 <= g <= 0.25 (below: no material update;
    above: mergers and data breaks the index applies off-cycle). (5) Book: all year the book holds 100 % SPY (sharadar_sfp).
    After the close of d, the 50 eligible members with the largest g are selected (fewer if fewer are eligible;
    if fewer than 20 are eligible, no tilt that quarter); at the open of d+1 the book moves 20 % of NAV from SPY
    into them, equal weight (0.4 % of NAV each with 50 names, 20 % / k each with k names), and keeps 80 % in SPY.
    No intra-window rebalancing; a name that leaves the S&P 500 or stops trading inside the window is sold at the
    next open (delisting terminal return per the dataset policy) and the proceeds go to SPY. After the close of
    R the book decides to return to 100 % SPY and trades at the open of R+1. Outside the windows the book equals
    SPY_TR exactly, so the core-only control (K-0153) is the benchmark itself and every difference from it is the
    tilt. Fixed by the owner, not in the grid: the tilt share 20 % of NAV and the 50 names. One parameter: W.'
  params:
    window_sessions:
      grid:
      - 15
      - 20
      - 25
      value: 20
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'Long side only (the event definition is the long leg, K-0218): a stock is marked on decision date d (W
    = 20 sessions before the quarterly rebalance R) when it is among the 50 eligible S&P 500 members with the largest
    pending share increase g, as defined in the signal; side +1. Unmarked peers are all other S&P 500 members on
    the same date, so the side-adjusted abnormal return is the selected names against the equal-weighted rest of
    the index over the same window, which is the expected return of a random choice of 50 members in that window.'
  horizons:
  - 5
  - 10
  - 15
  - 20
  primary_horizon_days: 20
