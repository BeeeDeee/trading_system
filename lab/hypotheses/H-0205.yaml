falsification_criteria:
- 'Mechanism, long side alone: the marked top-50 pending-increase names do not beat the other S&P 500 members from
  the open of d+1 to the close of R (20 sessions) above the 95th percentile of the time-shifted placebos, or their
  gross average per event is below the stock round-trip cost, or fewer than 2 of 3 dev thirds are positive.'
- 'The tilt does not beat a random choice of 50 members in the same windows: the G1 side-adjusted event average,
  measured against the equal-weighted other members on the same decision dates, is not above the placebo bar (criterion
  above); and at G2 the book is below the 95th percentile of the random-entry null.'
- Net Sharpe on dev below SPY_TR Sharpe + 0.10, or the 75 % bootstrap bound of the Sharpe difference to SPY_TR is
  not above zero.
- 'Active return over SPY is not positive in the latest third of dev: the book''s Sharpe in the latest G2 sub-period
  is below SPY_TR''s.'
- Either neighbor window (15 or 25 sessions) does not beat SPY_TR, or the book does not beat SPY_TR with doubled
  costs.
notes: 'owner_seed: G2V-4

  Variant of H-0201 (rejected at G1 on net Sharpe, K-0240), as the owner queued it: same event, same window grid
  15/20/25 (not widened), same g, filters, split guard and marketcap/price share counts; short leg and cash dropped,
  replaced by an always-held SPY core with a fixed 20 % tilt sleeve. The card of H-0201 is not in this workspace;
  the definitions in signal.description are restated from the lab record (K-0240, K-0168, lessons H-0201/H-0113).
  Where H-0201''s implementation differs in a detail (staleness, g bounds, guard threshold), the Builder must use
  H-0201''s version, so that the event set of the mechanism test is the long side of H-0201''s event set at W =
  20, and report the difference. No learned model (H-0113''s result was the core artefact K-0168). Why a different
  form, not a retune: the parent''s book failed through a losing short leg and two thirds idle cash; here neither
  exists, and outside the windows the book is identical to the benchmark, which is the core-only control K-0153
  asked for (any margin is the sleeve).

  Mechanism-test design: the long side is the whole event (K-0218), because G1 reports no side split and H-0201''s
  pooled pass may have leaned on the increase side. It is a new trial of the family on a subset of H-0201''s events,
  so it is not independent evidence of the parent''s pass; a fail here says the pooled pass came from the decrease
  side or from noise near the bar.

  Forecasts (dev 1998-2020, W = 20). Events: about 89 rebalances from the third quarter of 1998 (S_old needs a previous
  rebalance) x up to 50 names = 4,000-4,500 events on 85-90 dates (fewer names in early years if fewer filings pass
  the filters). Round trip of a member: about 6-12 bps (3-6 bps half-spread tiers, x2.5 before decimalization),
  SPY a few bps. Gross per event against other members: central 13 bps, range 5-25 bps (owner: pooled effect about
  1.5 x cost; the long side alone may be smaller or larger than pooled). Book: 20 % of NAV active for 80 of 252
  sessions a year, 8 sleeve round trips a year in stocks (0.2 x ~10 bps x 4 x 2 sides is about 0.08 %/yr cost drag
  plus SPY legs). Active return over SPY_TR, net: central +0.03 %/yr, range -0.15 to +0.20 %/yr (0.2 x 4 x (gross
  - cost)). Tracking error to SPY_TR: about 0.7-1.2 %/yr (an equal-weight 50-name sleeve differs from SPY by about
  7-9 %/yr of relative volatility, x 0.2 of NAV, active about a third of the year). Implied information ratio about
  0.0-0.15, so the Sharpe difference to SPY_TR is expected near +0.00 to +0.02, well under the G1 margin of +0.10.
  Mean exposure 1.0, position entries about 4,400, decision dates with turnover about 178, drawdown equal to SPY''s.
  Most likely death: G1 on min_sharpe_excess (a 20 % sleeve a third of the time cannot carry a +0.10 Sharpe margin
  unless the sleeve beats SPY by about 2.5 % per window, ten times the event effect); second most likely: G1 mechanism,
  the long side alone under the placebo bar. A beta and size gap is expected: an equal-weight sleeve of index members
  is smaller-cap than SPY, so the sleeve''s raw excess carries a size and market-direction component over 20 sessions
  (K-0074); the mechanism test''s peers (other members, equal-weighted) neutralize the size part but not the beta
  part.

  Benchmark: long-only us_equity, so SPY_TR; SPY is held from sharadar_sfp as the core instrument, not as a signal.
  If the engine cannot hold an ETF next to an sp500 universe, the fallback the owner should decide is a split-consistent
  cap-weighted core (sf1 marketcap anchored at its last change and grown by total return, K-0168), with a core-only
  run reported. The family carries many trials and references add the literature prior at G3, so even a G1 pass
  faces a high deflated-Sharpe hurdle.'
