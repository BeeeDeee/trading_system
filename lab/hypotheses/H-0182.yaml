falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of top-fifth (+1) and bottom-fifth (-1) score entrants
  within each sleeve is below the 95th percentile of the time-shifted placebos, or below the placebo mean.'
- 'Mechanism: the event average is wrong-signed in two of the three dev blocks, or wrong-signed in the latest block
  (decay kill condition, K-0060).'
- 'Mechanism: gross abnormal return per event is below the round-trip cost of the traded ETFs.'
- Net Sharpe on dev below the 60/40 SPY/IEF benchmark + 0.10, or the bootstrap bound of the Sharpe difference below
  zero.
- Fewer than 75 % of the grid neighbors of n_estimators 100 and top 0.2 beat the benchmark.
- Net Sharpe at 2x costs below the benchmark Sharpe.
- 'Ridge on the same five features with the same schedule and book (framework ridge) gives an equal or better event
  average or net Sharpe than the gbm: then the nonlinear life-cycle claim is false and whatever exists is additive
  value plus momentum.'
notes: 'Brief fit: the brief asks for 6-24 month holds; the schema caps the label horizon and the mechanism horizon
  at 60 sessions, so this is the closest fit: the inputs are long-horizon (12-month trend, 3-year overextension),
  decisions are every 20 sessions, each tranche is held 60 sessions and the score is persistent, so the effective
  holding of a pick is several months. It is a learned card on ETFs, the thin end of the data limit: 47 ETFs x about
  4000 daily rows, highly overlapping labels, so the model is kept small (8 leaves, min_child_samples 1000, 50-200
  trees) and only two parameters are gridded. Universe rule (not performance-picked): the main liquid representative
  ETF of each US equity segment, select sector, major single-country market, Treasury maturity bucket, credit, TIPS,
  muni, gold, broad commodity, oil, silver and each CurrencyShares trust plus the dollar index fund that lists before
  2008. Family: long-term-reversal, because the distinctive claim and the new input is overextension relative to
  a multi-year average reverting (DeBondt-Thaler / Hong-Stein overreaction); trend is the conditioner. This is honest
  reuse: the same family holds H-0060 (country 4-year price reversal, wrong-signed), H-0062 and H-0088 (currency
  value, mechanism passed twice) and H-0151/H-0153. If the Chair judges the trend input to make it cross-sectional-momentum,
  I accept that relabel. Difference from earlier ETF cards: H-0060 was a plain linear 4-year price sort skipping
  the last year on country ETFs only; H-0143 conditioned momentum on path smoothness, jumps and attention (no value
  input, no reversal claim); H-0176 used drawdown from the one-year high and vol direction (no multi-year anchor).
  None asked whether trend and multi-year overextension interact. I do not retune H-0062/H-0088''s currency score:
  the currency trusts are here only as members of a cross-asset cross-section with a different, price-based input
  set. Expected events (state for G0): top and bottom fifth entrants in two sleeves every 20 sessions; with persistent
  inputs about 3-6 new entrants per date over about 200 scored dates (2002-2020) gives about 600-1200 events. The
  first dev block (1998-2005) will be thin: the 756-session window and the first model fit leave only the 1998-2000
  equity ETFs scored from about 2002 and the bond/currency ETFs from about 2008 (K-0163), so the block check rests
  on the later two blocks. Both sides are marked within the same sleeve, so the beta gap between marked and unmarked
  instruments is small (K-0074): a cheap EM ETF on the +1 side and an overextended sector ETF on the -1 side are
  both risk assets. Expected gross per event over 60 sessions: central +0.5 to +1.0 %, pessimistic about zero; round
  trip of these ETFs well under 0.3 %, so cost is not the binding check. Expected book: an always-invested 60/40-sleeve
  book whose only active bet is selection inside each sleeve; the margin over 60/40 must come from that selection
  (the RISK picks are more concentrated than SPY, so volatility can be higher). Most likely death: the placebo test
  (same-ETF placebos absorb ETF identity, K-0025) or G1 Sharpe excess over 60/40. Please have the judge or Builder
  report the ridge event average next to the gbm one (K-0135, K-0182); the conclusion if ridge wins is stated in
  the falsification criteria. No new data needed.'
