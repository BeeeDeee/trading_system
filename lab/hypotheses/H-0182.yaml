mechanism:
  counterparty: Late trend chasers and performance-chasing allocators who buy an asset-class ETF after a multi-year
    run, when its price is far above its own 3-year average and trading in it has surged; and capitulating sellers
    who dump an asset class that is already cheap while its trend is still down. Both trade on past performance,
    not on value.
  why: 'Hong and Stein (1999): slow-diffusing information makes asset prices underreact, so moderate trends continue
    for months; momentum traders and performance-chasing flows then push the trend past fundamental value, and the
    overshoot reverses over the following quarters. Asset-class ETFs are the vehicle of choice for exactly these
    flows (advisers, retail and model portfolios that rotate into whatever region, sector or commodity has run).
    The prediction is a life cycle, not a monotone slope: an asset whose 12-1 month trend is positive but which
    is not yet far above its own 3-year average (in its own volatility units) keeps outperforming; an asset that
    is far above its 3-year average after a strong run with surging trading activity (crowded, late-stage) stops
    and reverts; an asset far below its 3-year average pays (value) once its trend has stopped falling, not while
    it is still falling (falling knife). Asness, Moskowitz and Pedersen (2013) show value and momentum both pay
    across asset classes and are negatively correlated; this card claims their payoff is non-additive in the joint
    state.'
  why_not_arbitraged: 'Asset-class mispricing is macro: correcting it means holding a concentrated region, sector
    or commodity bet for quarters against a still-running trend, with large tracking error and career risk (Samuelson''s
    dictum: micro efficient, macro inefficient). Value at asset-class level has long losing spells and few independent
    bets per decade, so arbitrage capital is thin and slow.'
signal:
  description: 'Data: daily total returns of each ETF (compounded from ret_co and ret_oc into a total-return index
    TR) and dollar_volume, sharadar_sfp, up to the close of day t. Decisions after the close of every 20th XNYS
    session (row index of the dev view divisible by 20), trades at the open of t+1. Features per ETF and date t
    (an ETF is scored only if every feature has at least 90 % non-missing days in its window; otherwise it has no
    score): (1) trend = log TR change from t-252 to t-21 divided by (252-day stdev of daily log total returns x
    sqrt(231)); (2) overextension = (log TR at t minus the mean of log TR over sessions t-755..t) divided by (756-day
    stdev of daily log total returns x sqrt(252)); (3) recent = log TR change from t-21 to t divided by (252-day
    stdev x sqrt(21)); (4) trading surge = log(mean dollar_volume over t-62..t / mean dollar_volume over t-251..t);
    (5) vol regime = log(63-day stdev / 756-day stdev of daily log total returns). Each feature is z-scored across
    the scored universe members of the date with the framework helper (all 47 ETFs together, one model). Label:
    total return from the next open to the open 60 sessions later, ranked across the universe on each date (framework
    label, horizon_days 60, purge by the framework). Model: framework walk_forward with model gbm (LightGBM), n_estimators
    from params, num_leaves 8, learning_rate 0.05, min_child_samples 1000, subsample 0.5, other settings framework
    default; expanding window, refit every 63 rows, framework seeds and minimum training sample. Book (score_weights):
    the universe is split into two fixed sleeves by asset class: RISK (SPY, QQQ, IWM, XLB, XLE, XLF, XLI, XLK, XLP,
    XLU, XLV, XLY, IYR, EFA, EEM, EWJ, EWG, EWU, EWC, EWA, EWH, EWS, EWT, EWY, EWZ, EWW, FXI, DBC, USO, SLV, HYG,
    EMB) and DEFENSIVE (SHY, IEF, TLT, LQD, AGG, TIP, MUB, GLD, FXE, FXY, FXF, FXB, FXA, FXC, UUP). At each decision
    date a tranche is formed: RISK gets 60 % and DEFENSIVE 40 % of the tranche; inside each sleeve the round(top
    x number of scored sleeve members) members (at least 2) with the highest model score get equal weight. The target
    book is the average of the last three tranches (each tranche held 60 sessions, then replaced), so target weights
    change only on decision dates and the book is always fully invested. Fallbacks: a sleeve with fewer than 5 scored
    members (feature warm-up, before the first model fit) is held equal weight in its members that are tradable
    and have at least 63 sessions of price history; a sleeve with no such member puts its weight in cash. An ETF
    that is not tradable on a trade day keeps no new weight; its share goes equally to the other picks of its sleeve
    in that tranche. ETFs not yet listed are simply absent (no score, no weight).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.15
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1mo
  - 1y
mechanism_test:
  event: At a decision date an ETF newly enters the top fifth of the model score within its sleeve (side +1) or
    newly enters the bottom fifth within its sleeve (side -1), having not been in that bucket at the previous decision
    date.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
ml:
  features:
  - 'overextension: log total-return index minus its 756-session mean, in units of annualized 756-day volatility
    (asset-class value / overshoot, the reversal state)'
  - 'trend: 12-1 month log total return divided by 252-day volatility (risk-adjusted underreaction trend, comparable
    across bonds, equities, commodities, currencies)'
  - 'recent: last 21-session log total return divided by 252-day volatility (has a falling knife stopped falling;
    short-term reversal state)'
  - 'trading surge: log of 63-day over 252-day mean dollar volume (crowding of trading interest by performance-chasing
    flows)'
  - 'vol regime: log of 63-day over 756-day realized volatility (stress state: overshoot and capitulation happen
    with elevated volatility)'
  horizon_days: 60
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is a life cycle with a sign switch. A ridge on these z-scored features gives each a
    single monotone slope: it must say either ''more trend is better'' or ''more overextension is worse'' everywhere,
    so it averages the continuation of moderate trends with the reversal of overextended crowded ones into one weak
    momentum-plus-value sum. The mechanism says the trend slope is positive only while overextension is moderate,
    and turns negative when overextension is high and trading has surged (late chasers are the marginal buyer);
    and that cheapness pays only when the recent and 12-1 trend have stopped falling (capitulation over), not while
    they are falling. Those are thresholds and products of two or three inputs, which depth-3 trees (8 leaves) can
    represent and an additive linear score cannot. Who pays: the late chasers on the overextended side and the capitulating
    sellers on the cheap side. If ridge on the same five features does as well, the effect is plain additive value
    plus momentum and the learned claim is false.'
