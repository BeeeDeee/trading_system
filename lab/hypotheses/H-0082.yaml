id: H-0082
version: 1
title: Perp-listing short-constraint relief - short Binance perps of seasoned-spot coins in their first 8 weeks
  after the perp launch, hedged with the other top-50 perps, weekly
author_agent: scout
family: short-sale-constraint-relief
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 50
mechanism:
  counterparty: Long-only spot holders and new leveraged longs who bought the coin while only optimists could express
    a view (the exchange tends to launch perps for coins that already draw attention), and who keep paying positive
    funding to shorts after the launch. They hold because of conviction, staking or lockups and do not sell into
    the gradual repricing.
  why: 'Miller (1977): when short selling is costly, a price is set by the most optimistic holders and sits above
    the average valuation; when a cheap shorting instrument appears, pessimists can trade, and the price falls toward
    the consensus over the following weeks to months. Danielsen and Sorescu (2001) show the stock-market version:
    option introductions, which relax short-sale constraints, are followed by negative abnormal returns of the underlying;
    Hale, Krishnamurthy, Kudlyak and Shultz (2018) argue the same for the launch of bitcoin futures. In crypto,
    the Binance USD-M perpetual is the deepest and cheapest way to short a coin; before it exists, an altcoin listed
    on Binance spot can only be shorted through thin, rationed margin borrowing. The perp launch therefore marks
    a discrete relaxation of the short-sale constraint for a coin whose spot price was formed by long-only holders.
    The claim is a slow relative decline of that coin against the other liquid perps over the first one to three
    months after the launch, not a one-day listing-pump reversal.'
  why_not_arbitraged: 'Shorting a newly listed altcoin perp is risky and capacity-limited: very high idiosyncratic
    volatility, squeeze risk while open interest is thin, exchange-specific margin and position limits on new contracts,
    and the repricing is slow and noisy, so a single short is a poor bet; only a diversified, hedged book across
    many launches extracts it, and most crypto funds are long-biased by mandate.'
signal:
  description: 'Data: daily Binance USD-M perp bars (binance_perp_1d, crypto close 00:00 UTC) and daily Binance
    spot bars (binance_spot_1d, signal only). Definitions, all point-in-time: (1) perp listing day L_j of perp j
    = date of its first bar in the perp panel; perps whose first bar is within the first 30 days of the panel are
    treated as pre-existing and are never events. (2) Spot seasoning: the matching spot pair (perp id without the
    ''.P'' suffix, via the dataset''s perp-spot mapping) must have its first spot bar at least min_spot_age_days
    calendar days before L_j; if no spot pair can be matched, j is never an event. (3) Perp age a_j(t) = t - L_j
    in days. Decision: weekly, after the close of each Sunday UTC day t, using data up to that close; trades at
    the next open (Monday 00:00 UTC). Short leg at t: all members of the point-in-time crypto_top_n (n = 50) universe
    on t that satisfy (2) and have 7 <= a_j(t) <= 7 + hold_days. A coin that joins the universe late enters with
    the remaining part of its window; a coin is never re-entered after its window ends. Weights: each short-leg
    coin gets -min(0.5 / k, 0.10), k = number of short-leg coins; the long hedge is the same total amount split
    equally over all other universe members on t (BTC and ETH included), so the book is dollar-neutral with gross
    at most 1. If k = 0 the book is flat (no hedge). Positions are reset to these target weights at every weekly
    decision. A position whose instrument leaves the universe is closed at the first decision at which it is not
    a member (point-in-time universe rule, K-0051). Missing bar on a decision day: the instrument is skipped for
    that week. Funding is charged by the engine (shorts receive positive funding).'
  params:
    hold_days:
      grid:
      - 28
      - 56
      - 84
      value: 56
    min_spot_age_days:
      grid:
      - 90
      - 180
      - 365
      value: 180
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a weekly decision (after the Sunday UTC close), a perp in the PIT top-50 universe whose perp is 7 to
    63 days old (7 <= age <= 7 + hold_days) and whose matching spot pair was listed at least 180 days before the
    perp launch; side -1 (predicted to underperform the other universe members). Each coin is marked at every weekly
    decision inside its window, the same rows the strategy holds short. Unmarked peers are the other universe members
    on the date.
  horizons:
  - 7
  - 14
  - 28
  - 56
  primary_horizon_days: 28
data_requirements:
- dataset: binance_perp_1d
  description: 'tradable: perps of the PIT top-50 universe; first bar date per perp defines the listing day; extras
    funding/funding_paid charged by the engine'
  fields:
  - ret_co
  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2019-12-01'
  - '2022-12-31'
- dataset: binance_spot_1d
  description: 'signal only, never traded: first spot bar date of the spot pair matching each perp, for the seasoning
    rule'
  fields:
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2017-08-17'
  - '2022-12-31'
holding_period:
  rebalance: weekly
  typical_days: 56
market_exposure: market_neutral
references:
- cite: Miller (1977) Risk, uncertainty, and divergence of opinion. Journal of Finance
  year: 1977
- cite: Danielsen, Sorescu (2001) Why do option introductions depress stock prices? A study of diminishing short
    sale constraints. Journal of Financial and Quantitative Analysis
  year: 2001
- cite: Hale, Krishnamurthy, Kudlyak, Shultz (2018) How futures trading changed bitcoin prices. FRBSF Economic Letter
    2018-12
  year: 2018
falsification_criteria:
- 'Mechanism: the side-adjusted 28-day abnormal return of the marked coins is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost (G1 mechanism gate).'
- 'Mechanism (beta confound): marked coins are higher-beta alts than the average peer, so a bear market favors the
  short side. If the pooled result is positive only because of the 2022-type latest third while both earlier thirds
  are negative, read it as market beta, not constraint relief: the card is wrong.'
- 'Mechanism (horizon shape): if the 7-day abnormal return is as large as or larger than the 56-day one, the effect
  is a short listing-pump reversal, not the slow repricing claimed, and this weekly 8-week book is the wrong form.'
- 'Strategy: net Sharpe on dev below 0.5, or not above T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  vs T-bill at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (hold_days 28/84, min_spot_age_days 90/365 and their combinations)
  beat T-bill, or net Sharpe at doubled costs below the T-bill bar.'
- 'Concentration: one third of dev carries more than 60 % of the log return.'
notes: 'Brief fit: crypto, medium horizon (hold 8 weeks, primary horizon 28 days, descriptive to 56). Event arithmetic
  (estimates, not data): the perp panel lists 78 perps in 2020, 128 in 2021, 146 in 2022; net of those already trading
  when the panel starts and of new tokens launched with spot and perp together, I expect about 80-130 perp launches
  on seasoned spot coins in dev, most of them in the top-50 at some point of their first 9 weeks. Each is marked
  at up to 9 weekly decisions, so about 600-1000 marked events on about 120-150 weekly dates (independent episodes
  only about 100: K-0026, the placebo cloud will be wide; the gate stays the gate). Builder: please report events
  per year and the number of distinct coins next to the marked count; if fewer than 200 marked events or 30 dates
  appear, fail loudly rather than relax a rule. Exposure: with about 5-10 coins in the window at a time and the
  0.10 per-coin cap, the short leg is near 0.5 most weeks; weeks with no coin in the window are flat. Mean gross
  exposure about 0.7-0.9 if launches are spread over the three years, entries about 100-130 coins plus hedge legs,
  weekly decisions about 160. Expected gain: if the marked coins lag peers by 2-4 % per 28 days, a 0.5 short leg
  of about 7 coins with ~30 % diversified idiosyncratic vol gives a Sharpe of about 0.7-1.5 before costs; round
  trip on mid-cap perps is about 30-50 bps per coin over an 8-week hold plus weekly hedge re-equalization, small
  next to that; if the true effect is under ~1.5 % per 28 days the book will miss the 0.5 floor. Funding received
  by the short leg flatters the strategy (not the event study); the G1 gross/net split should show how much. Relation
  to earlier cards: new-listing-overhang (H-0004 young spot listings, H-0058 coins aged 30-365 days on perps) is
  a supply/vesting story on token youth and found young coins leading in the boom and lagging in the bear (beta).
  This card removes token youth by requiring a spot pair seasoned at least half a year before the perp launch, and
  its event is the launch of the shorting instrument, not listing age; it also differs from perp-leverage-crowding
  / short-term-reversal (H-0039 funding-level sort, 5 days) because it does not condition on funding or a past move.
  I file it as a new family because the economic channel (short-sale constraint relief, Miller) has no card yet;
  if the Chair judges the event set too close to H-0058, merge it into new-listing-overhang and count the trial
  there. Beta (K-0074): marked coins are mid-cap alts, peers include BTC and ETH, so the marked set likely has a
  beta 1.1-1.3 times the peer mean; this works against the card in the 2020-2021 boom thirds and for it in 2022,
  hence the second falsification criterion. Contamination, stated openly: while checking the references I saw practitioner
  commentary (2023-2025) claiming that coins tend to fall after Binance perp launches. That covers the holdout years,
  so a G4 pass would be partly anticipated; dev 2020-2022 is not covered by what I saw, and the forward paper period
  is clean. No parameters were chosen on data; 7-day entry lag, 0.10 cap and top-50 are round choices for liquidity.
  The pre-launch run-up (exchanges launch perps for coins in focus) is part of the mechanism, not a control; a control
  of seasoned coins without a launch at the same dates is what the placebo approximates.'
