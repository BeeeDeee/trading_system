falsification_criteria:
- 'Mechanism: the pooled side-adjusted 5-session abnormal return of the two entries is at or below the 95th percentile
  of the time-shifted placebos, or its gross per event is below the round-trip cost: no tradable window-dressing
  cycle in LIQ-500.'
- 'Mechanism: the placebo mean is more than half of the event mean (the number belongs to which stocks are picked,
  not to the quarter-end date).'
- 'Mechanism: the latest third of the dev period has the wrong sign (fade after publication or a gone effect, K-0060),
  even if the pooled test passes.'
- 'Strategy: net Sharpe on dev below the T-bill bar (absolute 0.5 and T-bill + 0.10) or the bootstrap bound of the
  difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (pre_days 5/15, post_days 3/8, leg_quantile 0.1/0.3) beat the T-bill
  bar, or net Sharpe at doubled costs below the bar.'
- 'Robustness: more than 60 % of the log return in one of the three dev blocks (for example only the fourth quarters
  or only one crisis).'
notes: 'Brief fit: US single stocks, cross-sectional LIQ-500, mechanism horizon 5 sessions. The release phase holds
  5 sessions; the pressure phase holds pre_days = 10 because a release-only book would be invested about 8 % of
  the time and fail the 20 % exposure floor by construction (K-0027). Pressure plus release give about 15 of 63
  sessions per quarter at gross 1 (mean exposure about 0.24), about 400 position entries and 3 rebalancing dates
  per quarter (about 235 over 2001-2020). Why this is not an old family: it is not short-term-reversal or cross-sectional-momentum
  in disguise. The claim is calendar-specific (only the two quarter-end windows), and the mechanism test pools a
  momentum-signed and a reversal-signed entry on the same residual sort, so a generic one-to-three-month momentum
  or reversal effect cancels in the event mean (K-0044 says those effects are small in LIQ-500 anyway); what remains
  is the quarter-end cycle. It is not turn-of-month-flows (H-0016, H-0025: a beta spread at every month turn driven
  by inflows): ranks are on beta-adjusted residual returns, so the expected beta gap between legs is near zero (K-0074),
  only quarter ends are used, and the pressure phase lies before the turn. Earnings contamination is small by timing:
  the last two weeks of a calendar quarter and its first week fall mostly before the earnings season; any post-earnings
  drift that is in the sort would help one phase and hurt the other and largely cancel. No 8-K, SF1 or 13F fields
  are needed (13F starts too late to give 30 quarter dates). Expected size (honest prior): if the large-cap quarter-end
  momentum premium of Sias is of the order of one to two percent per month for a quintile spread, the pressure entry
  should earn roughly 20-40 bps per marked stock over 5 sessions against unmarked peers and the release entry less;
  round-trip cost for LIQ-500 tiers is about 6-12 bps, so the cost ratio should be 1.5-3 if the cycle exists. The
  book turns over about 4 units of gross per quarter (enter, flip, exit), roughly 20 bps of book per quarter, so
  the expected net Sharpe is around 0.4-0.7: the absolute 0.5 bar is the most likely strategy death even if the
  mechanism passes. Fourth quarters (tax-loss selling) probably carry a disproportionate share; a G2 block check
  would expose a single-season effect. If a by-phase report becomes possible, please report pressure and release
  entries separately: a pass driven only by the pressure phase reads as quarter-end momentum, one driven only by
  the release phase as a turn-of-quarter reversal.'
