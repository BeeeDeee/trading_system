id: H-0065
version: 1
title: Quarter-end window-dressing cycle - LIQ-500 dollar-neutral, follow residual QTD winners minus losers in the
  last 10 sessions of a quarter, fade them in the first 5 of the next
author_agent: scout
family: quarter-end-window-dressing
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Window-dressing fund managers and tax-loss sellers, who trade for the reporting date at any price:
    the strategy front-runs their selling of losers and buying of winners before the quarter end, and supplies the
    other side when the pressure is released after it (it holds the losers they dumped and is short the winners
    they inflated).'
  why: 'Fund managers disclose holdings and report performance at calendar quarter ends. Managers with career and
    flow concerns window-dress: in the last weeks of the quarter they sell stocks that did badly this quarter and
    buy stocks that did well, so the reported portfolio looks prescient (Lakonishok, Shleifer, Thaler, Vishny 1991;
    Agarwal, Gay, Ling 2014), and in the fourth quarter tax-loss sellers add to the pressure on losers. This trading
    is driven by the reporting date, not by news, so it should (a) push quarter-to-date losers down and winners
    up in the final sessions of the quarter (Sias 2007: momentum profits several times larger in quarter-ending
    months, stronger in stocks with heavy institutional trading, i.e. large liquid names), and (b) partly reverse
    once the snapshot is taken and the pressure stops, in the first sessions of the new quarter (Carhart, Kaniel,
    Musto, Reed 2002 document quarter-end price inflation of fund holdings that reverses the next day; Ng and Wang
    2004 the turn-of-the-year rebuying of losers). The card trades both phases of this one cycle on idiosyncratic
    (beta-adjusted) quarter-to-date returns.'
  why_not_arbitraged: 'The effect sits exactly where liquidity supply is thinnest: dealers and banks shrink balance
    sheets at quarter ends for their own regulatory snapshots (the quarter-end spikes in covered-interest-parity
    deviations of Du, Tepper, Verdelhan 2018), so market-making capital is scarce at the moment the dressers trade.
    The trade is small per quarter, needs gross long/short capital for a few weeks, and the pressure phase carries
    momentum-crash risk; arbitrageurs who are themselves quarter-end reporters face the same window-dressing incentives.'
signal:
  description: 'Universe: point-in-time LIQ-500 members that are tradable on the decision day. Daily total return
    r[t,j] = (1 + ret_co[t,j]) * (1 + ret_oc[t,j]) - 1 (close to close). Market return m[t] = equal-weight mean
    of r over universe members with a return that day. Beta b[t,j] = OLS slope of r[.,j] on m over the 252 sessions
    ending at t (at least 200 valid pairs, otherwise the stock is not ranked). Residual quarter-to-date return RQ[t,j]
    = sum over the sessions s of the current calendar quarter up to and including t of (r[s,j] - b[t,j] * m[s]);
    a stock needs returns on at least 80 % of those sessions to be ranked. Calendar: L = the last XNYS session of
    each calendar quarter (March, June, September, December), computed from weekdays minus the scheduled NYSE holiday
    list (a calendar rule, never from price rows after t, so truncating the data cannot change earlier decisions);
    E = the session that lies pre_days sessions before L. Pressure phase: after the close of E, rank ranked stocks
    by RQ[E,.]; go long the top leg_quantile (equal weights summing to +0.5) and short the bottom leg_quantile (equal
    weights summing to -0.5); fill at the open of E+1; hold these fixed target weights unchanged through the close
    of L. Release phase: after the close of L, re-rank by the full quarter RQ[L,.] and replace the book with the
    mirror: long the bottom leg_quantile (+0.5 total), short the top leg_quantile (-0.5 total), filled at the open
    of L+1 (the first session of the new quarter) and held unchanged for post_days sessions; after the close of
    session L+post_days set all weights to 0 (exit at the next open). Flat on all other days. Gross is 1 inside
    both phases, dollar-neutral, no leverage. A stock that leaves the universe or stops being tradable inside a
    phase is closed at the first decision after that (weight 0, the rest of its leg is not re-scaled); delistings
    take the dataset''s terminal return. No date literals, no named stocks.'
  params:
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    post_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
    pre_days:
      grid:
      - 5
      - 10
      - 15
      value: 10
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'Two entries per calendar quarter, pooled. (1) Pressure entry: after the close of session E (pre_days sessions
    before the quarter''s last session L), stocks in the top leg_quantile of residual quarter-to-date return RQ[E]
    get side +1 and stocks in the bottom leg_quantile get side -1 (window-dressing pressure continues into the quarter
    end). (2) Release entry: after the close of L, stocks in the top leg_quantile of the full-quarter RQ[L] get
    side -1 and the bottom leg_quantile side +1 (the pressure reverses in the new quarter). Unmarked universe members
    are the peers. Because the two entries sort on almost the same quarter-to-date residual with opposite sides,
    a generic (non-calendar) momentum or reversal effect of that sort cancels between them, and the symmetric +1/-1
    marking keeps the placebo mean near zero.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
