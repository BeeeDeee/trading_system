id: H-0147
version: 1
title: 'VWAP Wave setup 1 - price-discovery continuation after acceptance outside the UTC-session VWAP value area,
  BTC/ETH perps 5m: buy (sell) the first pullback to the old band edge, hold to session end'
author_agent: scout
family: session-vwap-bands-crypto
asset_classes:
- crypto_perp
universe:
  instruments:
  - BTCUSDT
  - ETHUSDT
  kind: instruments
mechanism:
  counterparty: Responsive / mean-reversion traders who sell the move outside value expecting a return to VWAP (on
    crypto perps largely retail and short-horizon bots fading band touches), and who are squeezed or stopped out
    when the auction stays outside; plus breakout traders who take profit into the first pullback and hand inventory
    to the initiative side at the old band edge.
  why: 'Auction-market reading of the session VWAP. The session VWAP V and its volume-weighted dispersion bands
    U = V + k*sigma, L = V - k*sigma mark the price range where most of the day''s volume has traded (the value
    area). Most closes outside the band are rejected (responsive traders fade them back toward V). When price instead
    holds outside the band (three closes in a row beyond it, or one close half a sigma further out), the auction
    has accepted new prices: someone with size (a parent order being worked through the session, a re-pricing after
    news, forced position changes) keeps lifting offers above the old value. Such initiative flow is executed over
    hours, not in one candle, so the move should continue for the rest of the session. The first pullback to the
    old band edge is where late faders add and breakout traders take profit; if the initiative buyer is still present,
    that dip is absorbed and price resumes upward (the close above the high of the pullback candle is the evidence).
    The trade buys the resumption with a stop just behind the pullback low, so it loses little when the acceptance
    was false. Shorts mirror it below L.'
  why_not_arbitraged: 'The continuation is conditional and noisy: most band breaks are rejected, so the faders win
    most of the time and keep fading; the setup needs a multi-hour hold with a hard stop, which is unattractive
    to market makers and to fast arbitrage that is flat within minutes. The edge per trade, if it exists, is of
    the same order as taker costs, so capacity for a cost-paying participant is limited.'
signal:
  description: 'Data: Binance USD-M perpetual 5-minute candles (o, h, l, c, qv) for BTCUSDT and ETHUSDT, each instrument
    handled independently. Decisions after every closed 5m candle t using data up to and including candle t; every
    order fills at the open of candle t+1. Candles flagged not real (gap rows) never create, update or trigger a
    signal and are skipped in all counts. SESSION: the UTC calendar day, 00:00 to 24:00 UTC (288 candles). Per candle
    the typical price is tp = (h + l + c) / 3 and the estimated base volume is bv = qv / tp. Session VWAP after
    candle t: V_t = sum(qv) / sum(bv) over the session''s candles up to t. Session dispersion: sigma_t = sqrt( sum(bv
    * (tp - V_t)^2) / sum(bv) ) over the same candles. Bands U_t = V_t + k*sigma_t, L_t = V_t - k*sigma_t. ATR_t
    = Wilder 14-candle average true range of 5m candles (runs across sessions). tol_t = 0.25 * ATR_t. WARM-UP: no
    state is tracked and no entry is taken on candles closing before 01:00 UTC (the first 12 candles of the session
    feed V and sigma only). ENTRY CUTOFF: no entry signal on candles closing after 22:00 UTC. All state resets at
    00:00 UTC. LONG SETUP, entry_mode = backtest (primary): (1) breakout: close_t > U_t; count consecutive closes
    above U. (2) acceptance: becomes active on the candle where that count reaches 3, or on any candle with close_t
    >= V_t + (k + 0.5) * sigma_t. (3) backtest candle: after acceptance (strictly later than the accepting candle),
    candle b with low_b <= U_b + tol_b AND close_b >= U_b - tol_b; a newer such candle replaces b (and restarts
    the 6-candle window). (4) entry signal: the first candle t with b < t <= b + 6 and close_t > high_b; checked
    before the backtest test of (3) on the same candle, so a candle that closes above high_b is an entry, not a
    new b. If 6 candles pass without an entry, b lapses; acceptance stays active and a new backtest candle can form.
    (5) cancel: any close_t < V_t ends the acceptance and drops any pending b; a new breakout/acceptance may form
    later in the session. Stop for the long = (lowest low from candle b through the signal candle) - 0.25 * ATR
    at the signal candle. SHORT SETUP, mirrored: breakout close_t < L_t; acceptance on 3 consecutive closes below
    L or one close <= V_t - (k + 0.5) * sigma_t; backtest candle b with high_b >= L_b - tol_b AND close_b <= L_b
    + tol_b; entry on the first close < low_b within 6 candles after b; cancel on any close_t > V_t; stop = (highest
    high from b through the signal candle) + 0.25 * ATR. entry_mode = aggressive (grid alternative): long signal
    on the first candle t (after warm-up, before the cutoff) with close_t > U_t and close_{t-1} <= U_{t-1}; stop
    = low_t - 0.25 * ATR_t. Short mirrored (close_t < L_t after close_{t-1} >= L_{t-1}; stop = high_t + 0.25 * ATR_t).
    No acceptance or backtest. POSITION: on an entry signal go long (short) with weight 0.5 of equity in that instrument
    at the next open (gross <= 1 with both instruments). At most one open position per instrument (signals are ignored
    while a position is open) and at most one entry per side per instrument per session. EXITS (first that applies;
    all evaluated after a candle''s close, filled at the next open): stop: the candle''s low <= stop (long) / high
    >= stop (short), including the entry candle itself; target (exit_mode = target_2r only): with R = |fill price
    - stop|, the candle''s high >= fill + 2R (long) / low <= fill - 2R (short); if stop and target are touched in
    the same candle the stop wins; session end (both exit modes): after the close of the 23:55 UTC candle every
    position is closed at the 00:00 open. If the fill price is already beyond the stop, the position is closed at
    the next decision. No position is held across a session boundary. exit_mode = session_end (primary) has no target
    ("let the trade breathe").'
  params:
    entry_mode:
      grid:
      - backtest
      - aggressive
      value: backtest
    exit_mode:
      grid:
      - session_end
      - target_2r
      value: session_end
    k:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
  timeframes:
  - 5m
