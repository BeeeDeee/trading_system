falsification_criteria:
- 'Fewer than 300 trades on 2020-2022 dev at the primary configuration: the test cannot tell (forecast 400-900);
  this is not a refutation and must not be rescued by loosening tol, the window or k.'
- 'G1: net Sharpe below 0.5, or the one-sided 75% bootstrap bound of the mean net trade at or below zero: the setup
  does not pay at taker cost.'
- 'Gross mean trade (net mean trade plus modeled cost per trade) below one taker round trip (about 13-16 bps): no
  edge large enough to trade, whatever the sign.'
- 'Owner''s timing control (judge G2 random entry): the primary does not beat the 95th percentile of the same trades
  placed at random times; then the acceptance-backtest setup has no timing edge and any profit is the session''s
  drift.'
- 'Mechanism: the aggressive neighbor (first band cross, no acceptance, no backtest) earns at least as much per
  trade as the backtest primary; then waiting for acceptance and the pullback adds nothing and the result is plain
  band-breakout momentum (the ORB family of study 16 / H-0137), not acceptance of new value.'
- 'Mechanism: the target_2r neighbor earns more per trade than session_end; then the move after the trigger is a
  short burst, not session-long price discovery as the card claims.'
- 'G2: k = 1.0 or k = 2.0 neighbor has a negative net Sharpe (isolated peak), or a one-candle later fill leaves
  less than half of the primary Sharpe (front-loaded edge a taker reaches too late, as in H-0063).'
- 'G2: costs x2 make the net Sharpe negative, or one third of dev carries more than 60% of the return (a single
  trend regime, the study 16 bull-market artefact).'
notes: 'owner_seed: VWAP-C1

  DATA. The owner asks for 5m; binance_perp_5m is in the catalog with loader: intraday (same 107-symbol basket and
  build as the 15m panel, untouched by earlier research at 5m). BTCUSDT and ETHUSDT exist from the start of the
  dev period (2020-01). Dev 2020-2022, holdout from 2023-01-01. Intraday data has no forward source, so the card
  can pass at most G4. No mechanism_test is declared because the intraday judge has none.

  CHOICES I MADE WHERE THE OWNER LEFT THEM OPEN (fixed, not gridded, round values, not tuned): session = UTC day
  (the crypto daily close, the anchor most VWAP tools use on Binance); VWAP from quote volume with base volume estimated
  as qv / typical price (the panel has no base volume); sigma = volume-weighted standard deviation of typical price
  around the session VWAP (standard VWAP bands); tol = 0.25 ATR (same unit as the owner''s stop buffer); ATR = Wilder
  14 on 5m; warm-up of 1 hour because sigma from a handful of candles is near zero and every candle would be a ''breakout'';
  no entries after 22:00 UTC because a trade with under two hours of session left cannot earn a taker round trip;
  one entry per side per instrument per session to keep the setup selective. Stops and targets are evaluated on
  candle highs and lows after the close and filled at the next open (the engine has no resting orders), so realized
  R differs from nominal R and gaps through the stop are paid in full.

  K GRID. The owner asks for k in {1, 2} around the primary; the lab requires a neighbor on each side of the primary,
  so the primary is the midpoint k = 1.5 and k = 1 and k = 2 are exactly the G2 neighbors. Entry and exit modes
  are the owner''s grid; the primary is backtest entry + session-end exit as the owner specified. With k = 1.5 acceptance-by-extension
  needs a close beyond 2 sigma.

  OWNER''S CONTROL. The owner wants the same trades with random entry candles on the same day, same side, same stop
  distance: if those do as well, the setup has no timing edge. The intraday judge''s G2 random-entry check (same
  trades at random times, 95th percentile of 100 runs) is the closest judge-run version and is the falsification
  criterion above. The stricter owner version, if the Chair can have it run: for each trade, draw the entry candle
  uniformly among the session candles from the accepting candle (breakout candle for aggressive) to the 22:00 cutoff,
  same side, same stop distance in price, same exit rule; restricting to candles after acceptance keeps the control
  from knowing the future. K-0193 records that controls written into strategy.py are not executed by the judge,
  so I do not rely on it.

  FORECASTS (pre-registered). Trades at primary on dev: 400-900 (both instruments, both sides); aggressive mode
  2-3 times as many; k = 2 about half of k = 1.5. Mean hold about 6-10 hours. Win rate 35-45 % with winners larger
  than losers. If the mechanism is real: gross mean trade +20 to +40 bps against a round trip of about 13 bps on
  BTC and up to 16 bps on ETH in 2020; net Sharpe around 0.5-1.0. My honest central expectation is lower: gross
  +5 to +20 bps.

  PRIOR AND MOST LIKELY DEATH. The lab''s evidence is against intraday taker continuation on BTC/ETH: study 16 (opening-range
  breakout a bull-market artefact; holds under about two days lose on 15 bps round trips), H-0137/H-0138/H-0140
  (US-open range breakout, gross at or just below cost), H-0063 (compression breakout died on a one-candle delay).
  What differs here, and why it is worth one trial: (1) the reference is the session''s own volume-weighted value,
  not a clock-anchored range; (2) entry is not on the break itself but on the first held pullback after acceptance,
  with a stop at the pullback low, which should cut the losers that made ORB gross small, and is less sensitive
  to a one-candle delay because the trigger is not the impulse candle; (3) the aggressive neighbor is the ORB-like
  break and acts as a built-in comparison. Most likely death: G1 bootstrap bound of the mean net trade (gross close
  to cost), or G2 costs x2. Closest family relatives: us-open-range-breakout-crypto and stop-cascade-breakout (intraday
  breakout continuation on the same perps); I keep the owner''s family name because the reference level and entry
  differ, but the Chair may decide to pool trials with us-open-range-breakout-crypto.

  REFERENCES. None listed: the setup comes from a trading leaflet (Market Profile / VWAP-band practice), not from
  a paper that tests this rule. The broader intraday-momentum literature (e.g. Gao, Han, Li, Zhou, Market intraday
  momentum, JFE 2018) concerns first-half-hour returns predicting the last half hour of US equity index sessions,
  which is a different rule; I do not claim it as support.'
