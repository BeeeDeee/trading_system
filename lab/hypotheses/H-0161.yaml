  kind: instruments
mechanism:
  counterparty: US investors who sell a single-country ETF during US hours while its home market is on holiday (risk-off
    sellers, hedgers using the ETF as the only open instrument for that country), and the market makers who absorb
    that flow at a discount because they cannot hedge it in the closed underlying. The tilt buys from them and is
    paid when the home market reopens and the creation/redemption link pulls the ETF back to its basket.
  why: 'A US-listed Asia-Pacific country ETF trades in US hours while its home exchange is shut. Its price is then
    set by US market makers and US investors'' flow, not by the creation/redemption arbitrage against a live basket.
    Market makers quote it off US index futures with a high hedge ratio and charge for inventory risk they cannot
    hedge in the home market. US-hours moves therefore overshoot what the home market later does (Levy and Lieberman
    2013 document this overreaction to US returns while the foreign market is closed). On an ordinary day the next
    home session re-anchors the price before the next US open, so a trader who enters at the open finds nothing
    left. On the eve of a scheduled home holiday nothing re-anchors the price before the next US open, so the flow
    part of the gap is still in the price at that open and closes when the home market reopens. In the lab, H-0133
    (fading both directions, peer-hedged) cleared the G1 placebo test with exactly this shape: small on the first
    session, larger after the reopening. Its book failed because the peer hedge doubled traded gross and the short
    side lost. This card keeps only the down-move side, the side that carried the gain, as a tilt inside the equity
    sleeve of an always-invested 60/40 book. The core is the benchmark itself, so any excess comes from the tilt
    (K-0005, K-0027).'
  why_not_arbitraged: The usual arbitrage (create or redeem against the basket) is shut until the home market reopens.
    Holding the gap means carrying unhedged single-country equity risk over a holiday, and the events are scattered
    over the calendar of twelve exchanges, a few times a month in total. That is too small and irregular for a dedicated
    desk and too much inventory risk for a market maker. The cost of the round trip in the smaller country ETFs
    eats most of the edge for anyone who also hedges (H-0133).
signal:
  description: 'Daily, after the US close of day t (all inputs known at that close; the holiday flags are a pre-published
    schedule stamped on day t), trades at the open of day t+1. (1) Home exchange map: EWJ->XTKS, EWH->XHKG, FXI->XHKG,
    EWY->XKRX, EWT->XTAI, EWS->XSES, EWM->XKLS, EWA->XASX, THD->XBKK, EIDO->XIDX, EPHE->XPHS, ENZL->XNZE, INDA->XBOM.
    SPY and IEF have no home flag. closed_next_X(t) is the exchange_holidays_1d key X.closed_next on row t (1 =
    home market X has no regular session before the next US session). (2) Unanchored window of ETF j at day t: a
    = the most recent US session s <= t with closed_next_X(s-1) = 0 (the home market traded between US session s-1
    and the open of s); window capped at the last 10 sessions. U_j(t) = ln(1+ret_oc_j(a)) + sum over s = a+1..t
    of [ln(1+ret_co_j(s)) + ln(1+ret_oc_j(s))], i.e. the ETF''s log move from the US open of a to the close of t;
    U_SPY(t) the same for SPY over the same rows. n = t - a + 1 sessions. (3) Scale: sigma_j(t) = standard deviation
    of d_j(s) = ln(1+ret_oc_j(s)) - ln(1+ret_oc_SPY(s)) over the 63 sessions s = t-63..t-1 (at least 50 valid values,
    else no signal). (4) z_j(t) = (U_j(t) - U_SPY(t)) / (sigma_j(t) * sqrt(n)). (5) Entry: ETF j enters the tilt
    at the open of t+1 if closed_next_X(t) = 1, z_j(t) <= -z_threshold, j is not already held, and j has a tradable
    bar at t+1. Missing or NaN flags mean no event. (6) Exit: at the close of every day d >= t+1, if closed_next_X(d)
    = 0 (the home market will trade before the next US open) the position is closed at the open of d+1; it is also
    closed after 5 sessions held (closed at the open after the 5th held session). For a one-day home holiday this
    means holding from the open of t+1 to the open of t+2, across the home reopening. (7) Weights (targets set every
    day, the engine rebalances drift): IEF 0.40 always. Each held tilt ETF gets slot_weight; the sum of slots is
    capped at 0.60 (if more slots are active, all are scaled down equally); SPY = 0.60 minus the sum of slots. Gross
    is always 1.0, no shorts, no leverage. With no active tilt the book is exactly 60/40 SPY/IEF. (8) Missing data:
    an ETF before its first price or without 63 sessions of history cannot enter; if a held ETF has no tradable
    bar on an exit day it is closed at the next tradable open.'
  params:
    slot_weight:
      grid:
