mechanism_test:
  event: 'An Asia-Pacific country ETF enters the tilt: after the US close of day t its home exchange has no regular
    session before the next US session (closed_next = 1) and its unanchored move since the last home session, net
    of SPY over the same window, is at or below -1.0 times its 63-session US-hours residual volatility scaled by
    the square root of the window length (z_j(t) <= -z_threshold as in the signal). Side +1: the ETF should outperform
    the other universe instruments from the next open through the home reopening.'
