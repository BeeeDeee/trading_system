falsification_criteria:
- 'Mechanism (G1): the side-adjusted abnormal return at 2 sessions is not above the 95th percentile of the time-shifted
  placebos, or gross per event is below the round-trip cost, or it is not positive in at least 2 of the 3 thirds
  of dev.'
- 'Mechanism shape: if the 1-session abnormal return (before any home reopening) is as large as or larger than the
  2-session one, the gain is generic short-term reversal, not re-anchoring at the reopening; the card then counts
  as refuted even if the gate passes.'
- 'Strategy (G1): net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the 75 % bootstrap bound of the Sharpe
  difference at or below zero.'
- 'Robustness (G2): fewer than 75 % of the neighbors (z_threshold 0.5 / 1.5, slot_weight 0.2 / 0.4) beat 60/40,
  or with doubled costs the book does not beat 60/40.'
- 'Decay (G2 sub-periods): the book does not beat 60/40 in the latest third of dev; H-0133''s latest third was much
  weaker, so a loss there kills the card.'
- 'Random entry (G2): the book is not above the 95th percentile of random tilts with the same slot sizes and holding
  times.'
notes: 'Provenance and fit to the brief: the brief asks for a short-horizon cross-asset card (signal from one market,
  trade in another). The signal here is the state of twelve foreign stock exchanges (their scheduled closures) plus
  the US equity move; the trade is in US-listed ETFs. It is not a macro-series lead-lag card, because the lab''s
  706k-test lead-lag scan (mrel) and many later cards show daily cross-market lead-lag does not survive. The only
  cross-market short-horizon effect that cleared the placebo test with the right shape is the cut arbitrage link
  of H-0133 (K-0198). This card is the open follow-up its lesson names: long-only, down-moves only, no hedge round
  trip. It is filed in the same family on purpose (honest trial count); it adds one trial to etf-premium-arbitrage,
  and the reference adds the literature prior.

  Differences from H-0133: (a) the down-move side only, as a tilt from SPY into the ETF inside an always-invested
  60/40 core (no peer hedge, no short leg, no cash); (b) the move is measured net of SPY over the unanchored window,
  not against a peer basket; (c) the parameter values are my own round defaults. I have not seen H-0133''s card
  or code (K-0161, K-0188), so its min_z and vol window may differ. This is a new design with its own trial, not
  a retune of H-0133 aimed at its percentile. The mechanism test sees the long-side entries only; H-0133''s pooled
  pass is the prior that it exists, not a guarantee.

  Forecasts (write-down per K-0098, K-0120, K-0181): closed_next = 1 marks about 10-15 sessions a year per exchange.
  With 7-8 ETFs live in 2001-2007 and 13 from 2012, that is about 90-160 ETF-closure sessions a year. z <= -1 one-sided
  catches about a sixth, so about 15-25 entries a year. That is about 300-450 events on 200-350 dates over dev (pessimistic
  200-250 events), above the 200/30 minimum. Lunar New Year and Golden Week put several ETFs on the same dates,
  so independent dates are fewer than events. Round trip: about 10 bps for EWJ/EWH/FXI/EWY/EWT/EWA, more for THD/EIDO/EPHE/ENZL;
  take 15-20 bps as the pooled event cost. Gross per event: central 30-40 bps, pessimistic 10-15 bps (would fail
  the cost check). Book arithmetic: mean hold about 1.5 sessions, so mean tilt is about 20 x 1.5 / 252 x 0.3, about
  4 % of the book. Expected annual tilt gain = 20 x 0.3 x 35 bps, about 2.1 %/yr gross. Cost per event is about
  0.3 x 2 x (ETF + SPY side cost), 20 x 0.3 x 12-14 bps, about 0.7-0.85 %/yr. That leaves about 1.3 %/yr net, against
  the roughly 0.9 %/yr (0.10 Sharpe at about 9 % volatility) the G1 margin requires. Added tracking error is about
  2 %/yr, small next to the 60/40 volatility. So the central case passes G1 narrowly and the pessimistic case fails.
  Most likely death: the +0.10 Sharpe margin or doubled costs (K-0064 pattern), or the latest third of dev (K-0060),
  which was weakest in H-0133.

  Beta gap (K-0074): the marked ETF has an equity beta near one, while the peers'' mean includes IEF and other country
  ETFs (about 0.8-0.9), so the raw abnormal return carries a small market-direction component. The same-ETF placebo
  absorbs the average of it. Owner diagnostics worth running if the card survives G1 (not gate-run): the same z
  rule on ordinary days (closed_next = 0), which should show no effect (H-0037, H-0080); and a split by exchange
  and by holiday length.

  Data limits: exchange_holidays_1d ends 2023-01-12, so the holdout is only 2021-01-01..2023-01-12. SFP has no forward
  data, so the card can pass at most G4. The holiday flags are compiled after the fact (special closures announced
  at short notice are kept as holidays). That is a mild look-ahead on a few rare days; the Skeptic may want those
  dates excluded. Taiwan typhoon closures before 2024 show as sessions (conservative). Exchange-to-ETF mapping is
  by listing venue of the holdings: FXI holds Hong Kong-listed shares, INDA Indian shares (BSE/NSE share holidays).'
