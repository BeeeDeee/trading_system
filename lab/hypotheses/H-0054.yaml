version: 1
title: Residual momentum, beta-neutral - LIQ-500 monthly, long top / short bottom quintile of vol-scaled market-adjusted
  12-2 month residual return
author_agent: scout
family: cross-sectional-momentum
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Disposition-prone and anchoring investors who realise gains on residual winners early and hold on
    to residual losers, and contrarian or fixed-weight rebalancers who sell recent relative winners and buy recent
    relative losers; they supply the slow price adjustment the strategy collects.
  why: 'Firm-specific news diffuses slowly into large-cap prices: investors under-react to it (conservatism, limited
    attention) and disposition-prone holders sell residual winners too early and hold residual losers, so a stock
    whose return net of the market has been consistently positive over the past year keeps outperforming for several
    months, and the mirror for consistent residual losers (Jegadeesh and Titman 1993; Grundy and Martin 2001). Total-return
    momentum mixes this underreaction effect with a time-varying market beta: after a market fall the loser leg
    is full of high-beta stocks, and the book crashes in the rebound (Daniel and Moskowitz 2016). Ranking on market-adjusted
    residual returns scaled by their own volatility (Blitz, Huij and Martens 2011) and sizing the legs to zero estimated
    beta isolates the firm-specific underreaction component, which is the claim tested here.'
  why_not_arbitraged: Momentum is widely known, so some decay is expected; what remains is protected by the short
    leg (shorting large-cap losers ties up capital and carries recall and squeeze risk), by career risk from momentum's
    drawdowns, and by the fact that most momentum capital trades total-return momentum, whose crash risk keeps leverage
    on the trade limited. Long-only mandates can hold winners but cannot take the loser leg.
signal:
  description: 'Inputs: daily total returns of sharadar_sep (close-to-close return of session s computed as (1 +
    ret_co[s]) * (1 + ret_oc[s]) - 1), the point-in-time LIQ-500 membership mask and the tradable flag. Rebalance:
    after the close of the last XNYS session of each calendar month (date t), using data up to that close only;
    trades at the open of the next session. Blocks: counting back from t, block k (k = 1..36) is the 21 sessions
    ending 21*(k-1) sessions before t (block 1 = the 21 sessions ending at t); a stock''s block return is its compounded
    daily total return over the block (missing if fewer than 15 valid sessions). Market block return = equal-weighted
    mean of the block returns of the stocks that were LIQ-500 members on the first session of that block and have
    a valid block return. Step 1 (beta): for each stock that is a LIQ-500 member and tradable at t, regress its
    block returns on the market block returns over blocks 1..36 by OLS with intercept, requiring at least 24 valid
    blocks; residual e_k = r_k - alpha - beta * m_k. Step 2 (score): over the formation blocks k = 2..formation_months
    (block 1, the most recent month, is skipped to avoid short-term reversal), score = sum(e_k) / std(e_k) (sample
    std); all formation blocks must be valid, otherwise the stock gets no score. Step 3 (legs): rank scored stocks;
    the long leg is the top leg_quantile, the short leg the bottom leg_quantile (rounded down, at least 10 names
    each). Step 4 (weights): equal weights within each leg. Leg betas b_L, b_S = mean of the members'' betas from
    step 1. Gross of the long leg g_L = b_S / (b_L + b_S), short leg g_S = b_L / (b_L + b_S), so g_L * b_L = g_S
    * b_S (zero estimated beta) and g_L + g_S = 1; if either leg beta is below 0.3, or g_L or g_S falls outside
    [0.35, 0.65], use 0.5 / 0.5 (dollar-neutral). Between rebalances weights are not re-equalised. A held stock
    that leaves the LIQ-500 universe or stops being tradable is closed at the next open and its weight is held in
    cash until the next rebalance; a delisting realises the dataset''s terminal return. Stocks without 36 blocks
    of history simply cannot be scored (the first rebalance is about 36 months after the start of the data). No
    other filters, no sector neutrality (not loadable).'
  params:
    formation_months:
      grid:
      - 9
      - 12
      - 15
      value: 12
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At a monthly rebalance date t (last session of the month), a stock ENTERS the long leg (top leg_quantile
    of the residual-momentum score, after not being in it at the previous monthly rebalance; side +1) or ENTERS
    the short leg (bottom leg_quantile, not in it at the previous rebalance; side -1), computed exactly as in steps
    1-3 of the signal. Stocks staying in a leg are not new events. Unmarked peers on the date are all other scored
    LIQ-500 members.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
