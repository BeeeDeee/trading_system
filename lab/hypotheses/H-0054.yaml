falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of leg entries does not exceed the 95th percentile of
  the 200 time-shifted placebos, or has the same sign in fewer than 2 of the 3 dev sub-periods.'
- 'Mechanism: the latest third of dev shows a negative side-adjusted abnormal return at the 60-session horizon (decay
  or regime change, K-0060).'
- 'Mechanism shape: the descriptive 60-session abnormal return is smaller than the 21-session one, i.e. the move
  reverses within the holding period (a short-lived liquidity effect, not slow underreaction).'
- 'Mechanism: gross abnormal return per entry below the round-trip cost of its tier.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills at or
  below zero.'
- 'Robustness: fewer than 75 % of the parameter neighbours (formation_months 9/15, leg_quantile 0.1/0.3) meet the
  T-bill bar, or the median neighbour Sharpe is below 0.7 times the primary.'
- 'Robustness: Sharpe at doubled costs below the bar, or one of the three dev sub-periods carries more than 60 %
  of the log return.'
- 'Publication decay: post-2011 Sharpe excess below half of the pre-2011 excess.'
notes: 'Brief: medium horizon (positions held about three months on average, monthly decisions), US single stocks,
  cross-sectional, LIQ-500, with a mechanism test. Relation to what died: study 1 (a walk-forward ensemble that
  included total-return momentum) and the calibration run of 12-1 momentum (K-0019, died at G1) share the underreaction
  mechanism, so this family should carry their trials; the family name is new only because no registry card has
  used intermediate-horizon momentum. The mechanism-level reason this variant differs: the known failure of total-return
  momentum is its time-varying market beta (loser leg loaded with high-beta names after sell-offs, crashes in rebounds),
  which is a beta-timing bet, not the underreaction claim; ranking on market-adjusted residuals scaled by residual
  volatility and sizing legs to zero beta removes that part. It is not a K-0044 one-month sort: formation skips
  the last month and the horizon is months, not a week. Residuals are against the equal-weighted universe market
  only (no Fama-French factors are loadable), so the claim is a CAPM-residual version of Blitz et al.; the regression
  window (36 blocks) is fixed from the literature and not a parameter. Costs: monthly rebalance in LIQ-500 (3-6
  bps half-spread); the score uses 11 overlapping months, so leg membership is persistent and turnover moderate;
  the expected gross of an entry over 60 sessions (order of a percent) should exceed its round trip several times,
  so the cost check should not bind and the placebo percentile is the real test. Expected book: gross 1, a quintile
  spread at half weight per leg; a plausible net Sharpe near the 0.5 bar, so this can fail at G1 on the absolute
  bar even if the mechanism passes. Event count: roughly 15-30 entries per side per month over about 20 years of
  rebalances (first rebalance about 2001), so thousands of events on about 240 dates; both sides are marked, so
  the placebo mean should sit near zero. Contamination: momentum and its residual version are famous and their history
  is known to the model; the literature prior and the publication-decay check apply, and the stock holdout was consumed
  by the owner''s research 1-7 (catalog), so G4 is weak evidence. Expected death: the latest third (decay after
  publication) or the middle third (2009 rebound) failing the sub-period checks.'
