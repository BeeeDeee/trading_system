falsification_criteria:
- Net Sharpe on the 2020-2022 dev period is below 0.5 after the lab's costs, or there are fewer than 300 trades
  (G1).
- The mean net return per trade is not positive at the lab's bootstrap bound (G1).
- The result is not stable across the neighbours of k_sigma and hold_candles, or is not better than the same positions
  placed at random times (G2).
- Doubling the costs or filling one candle later removes the profit (G2).
- The effect lives in one of the three dev sub-periods only (G2).
- The 2023-2026 holdout shows a clearly negative net result (G4).
notes: 'PROVENANCE (read before the verdict). This is not a fresh idea. It is the rule `LEAD_K3_LONG` of the owner''s
  qlab research 16 (8 intraday families, 30 variants, selected on the ETH holdout 2022-2026) and research 17 (same
  fixed rule on the monthly top-10 altcoins, 2020-05..2026-09: net Sharpe 0.80, 946 BTC events, passed 6 of 6 pre-registered
  criteria; Sharpe 0.06 at doubled costs, 1.39 in 2020-05..2022-12 and 0.26 in 2023-01..2026-09; K = 2.0 and a short
  side both lose). The lab''s holdout (2023-2026) is therefore NOT unseen for this rule, and the lab''s family trial
  count undercounts at least 46 earlier configurations on the same data (research 15-17). A forward paper test of
  the same rule runs separately (docs/research17/FORWARD.md, from 2026-10-01). DEVIATIONS from research 17, imposed
  by the lab''s contract: (1) leader is the BTC perpetual (research 17: BTC spot; the perp-leader variant had Sharpe
  0.62 vs 0.80); (2) membership is the lab''s universe re-ranked every UTC day by trailing 30-day quote volume,
  taken as the top 12 so that, with BTC and ETH removed, about 10 followers remain (research 17: monthly top 10
  ex BTC/ETH, fixed at the start of each month); (3) costs are the lab''s tiers (5 bps fee + 1.5-15 bps slippage
  by liquidity) instead of a flat 10 bps per side; (4) fill at the next candle''s open instead of the signal candle''s
  close; (5) a follower that leaves the universe is closed early (the lab forbids holding non-members; research
  17 let the position run to its 4-hour exit). The grid includes k_sigma = 2.5 although research 17 found k_sigma
  = 2.0 unprofitable; that is intended (honest neighbourhood test), do not narrow it.'
