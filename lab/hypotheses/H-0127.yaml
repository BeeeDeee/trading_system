  - VGSH
  - SCHO
  kind: instruments
mechanism:
  counterparty: 'End investors who buy duration at the auction or just after it at a concession (real-money accounts
    that need the new on-the-run issue for benchmark reasons, foreign official buyers), and the dealers who must
    hold inventory through the auction and are paid the concession for it. The strategy is on the dealers'' side
    of the trade: it sells duration before supply arrives and buys it after, i.e. it supplies a little of the risk-bearing
    capacity that is scarce around auctions.'
  why: The US Treasury sells a pre-announced, large amount of 5- to 30-year coupon debt in clusters twice a month
    (10y/30y around mid-month, 5y/7y around month-end). Primary dealers must absorb most of each auction and then
    distribute it to end investors who arrive slowly. Because dealers have limited risk-bearing capacity and end
    investors' capital is not perfectly mobile, dealers and other short-horizon holders reduce duration in the days
    before the auction to make room (and short in when-issued trading), which pushes long Treasury prices down;
    once the supply is placed and gradually distributed, prices recover over the following days. Lou, Yan and Zhang
    (2013) document exactly this cycle in the secondary market (prices fall in the few days before, recover shortly
    after, even though dates and sizes are announced) and tie it to dealer capacity. Long-duration Treasury ETFs
    (TLT, IEF) hold the same securities and are priced by APs against them, so the concession should show in their
    prices; short-Treasury ETFs (SHY, SHV, BIL, VGSH, SCHO) hold bills and 1-3y notes that are not part of these
    auctions and serve as unmarked peers.
  why_not_arbitraged: 'The concession is the price of inventory risk on very large sizes: a few basis points of
    yield on tens of billions per auction. Arbitrage capital that could absorb it faces duration risk several times
    larger than the expected gain per cycle, balance-sheet costs (post-2008 leverage ratio limits on dealers) and
    a payoff that is small per event, so it is only partly competed away. The paper estimates an issuance cost of
    9-18 bps of the auction size, i.e. the effect survived in the most liquid market in the world because it is
    a compensation for risk-bearing, not a free lunch.'
signal:
  description: 'Inputs: the signal-only calendar dataset treasury_auctions_1d (clock us_close) with keys next_coupon5_sessions
    (XNYS sessions from day t to the next announced nominal coupon auction with original term >= 5 years, absent
    if none is announced yet) and last_coupon5_sessions (sessions since the most recent such auction, 0 on the auction
    day); daily ETF returns (ret_co, ret_oc) of TLT and IEF from sharadar_sfp. Parameter h = hold_sessions (primary
    3). Decision after the close of day t, using only values known at that close: (1) PRE event: next_coupon5_sessions[t]
    == h + 1 AND (last_coupon5_sessions[t] is absent OR last_coupon5_sessions[t] >= 3). That is, the first auction
    of a cluster is h+1 sessions ahead and no auction happened in the last two sessions. Then hold the PRE book
    from the open of t+1 to the open of t+h+1 (h sessions, ending at the open of the auction day; the auction session
    itself is not held). (2) POST event: last_coupon5_sessions[t] == 0 (an auction happened on day t) AND (next_coupon5_sessions[t]
    is absent OR next_coupon5_sessions[t] >= 3). That is, day t is the last auction of its cluster (auctions on
    consecutive or next-but-one sessions, e.g. 10y then 30y or 5y then 7y, belong to one cluster). Then hold the
    POST book from the open of t+1 to the open of t+h+1. Books: PRE = TLT -0.5, IEF -0.5. POST = TLT +0.5, IEF +0.5.
    If windows overlap on a day, add the weights of all active windows per instrument and clip each instrument to
    [-0.5, +0.5] (a PRE and a POST window on the same day cancel to flat). Outside windows the book is flat (cash).
    SHY, SHV, BIL, VGSH and SCHO are never traded; they are in the universe only as unmarked peers for the mechanism
    test. Gross exposure never exceeds 1.0. Missing data: a window is opened only if the instrument has a price
    on t and is tradable at t+1; if the calendar keys are absent on t no event fires (no filling, no inferred dates).
    Index calendar values directly so that a missing series raises instead of silently producing no events (K-0010).
    Rebalancing is event-driven, with at most one weight change per day.'
  params:
    hold_sessions:
      grid:
      - 2
      - 3
      - 4
      value: 3
  timeframes:
  - 1d
mechanism_test:
  event: 'PRE: after the close of day t, the first nominal 5y-30y coupon auction of a cluster is exactly h+1 = 4
    sessions ahead (next_coupon5_sessions == 4) and no such auction took place in the last two sessions (last_coupon5_sessions
    >= 3 or absent): TLT and IEF are marked with side -1. POST: day t is an auction day (last_coupon5_sessions ==
    0) and no further such auction is announced within the next two sessions (next_coupon5_sessions >= 3 or absent):
    TLT and IEF are marked with side +1. SHY, SHV, BIL, VGSH and SCHO are never marked and are the peers. Both phases
    are marked, so generic duration drift largely cancels in the placebo mean.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 3
