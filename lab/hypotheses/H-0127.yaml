falsification_criteria:
- 'Mechanism: the side-adjusted 3-session abnormal return of TLT/IEF against the short-Treasury peers is not above
  the 95th percentile of the 200 time-shifted placebos, or gross per event is below the round-trip cost of TLT/IEF:
  there is no tradable auction cycle in Treasury ETF prices.'
- 'Mechanism decay (K-0060): the latest third of the event window (about 2016-2020) has the wrong sign. Declared
  kill condition even if the pooled test passes.'
- 'Horizon shape: if the abnormal return is near zero at 1-3 sessions and only grows toward 10 sessions, the result
  is generic duration drift, not a supply concession that reverses within the week; the card is then wrong even
  if the percentile clears.'
- 'If a by-phase split is reported: either phase (PRE short or POST long) wrong-signed on its own means the cycle
  claim is wrong and the pooled number is one-sided drift.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the 75 % bootstrap bound of the
  Sharpe difference to T-bills not above zero.'
- 'Robustness: the neighbors hold_sessions 2 and 4 do not beat T-bills, or doubled costs leave Sharpe below the
  T-bill benchmark, or more than 60 % of the log return comes from one third of dev.'
notes: 'BRIEF FIT. The brief asked for a cross-asset idea (signal from one market, trade in another) with a 1-5
  day hold. The lab has exhausted short-horizon cross-asset lead-lag between liquid markets: the 706k-test mrel
  scan, H-0047, H-0056, H-0070, H-0075, H-0081, H-0087, H-0116 and H-0119 all found nothing, and the only cross-asset
  passes (H-0114, H-0126) are slow balance-sheet diffusions into single stocks whose books failed. I therefore chose
  the closest fit with a documented flow and a named counterparty: the signal comes from the Treasury''s primary
  market (the auction calendar from Treasury Fiscal Data, a government macro series like the FRED ones the brief
  allows) and the trade is in exchange-traded bond funds, a different market whose prices are set by APs and ETF
  investors. The hold is 3 sessions.

  RELATION TO H-0038 (same family, counted as its second trial). H-0038 tested a very similar cycle (short TLT 3
  sessions before, long 3 after, SHY as control) and ended with ZERO events at G1 although G0 counted 241, so its
  mechanism was never measured. K-0086 (written after H-0038) found the most likely cause: G1 needs at least three
  unmarked peers per date, and H-0038''s universe held only TLT and SHY. This card is built around that: five short-Treasury
  ETFs that are never marked (three from mid-2007), a data period starting after the third peer lists, both phases
  marked so generic duration drift cancels, explicit cluster rules from the two calendar keys, and the auction session
  itself excluded from both windows. It is not a parameter rescue of H-0038 (no result exists to tune on). If the
  Chair considers it a re-run of H-0038, the trial count is the Chair''s call; I am filing it under the same family
  on purpose. If G0 again reports events but G1 none, the cause is not the peer rule and the card should be parked,
  not resubmitted.

  FORECASTS (write-down before data, K-0098/K-0120). Clusters: about two per month (10y/30y mid-month, 5y/7y month-end;
  20y from 2020) = about 24 a year x 13.5 years = about 320 clusters. PRE events at lead 4 need the next auction
  to be announced 4 sessions ahead; most are (announcements come about a week ahead), I expect 80-100 % of clusters.
  Events: about 2 instruments x (280-320 PRE + 300-320 POST) = 1100-1300 events on 560-640 dates; G1 may count somewhat
  fewer than G0 (K-0095). Round trip: TLT and IEF are among the most liquid ETFs, I expect about 2-6 bps per round
  trip in the us_etf tier. Gross per event (3-session abnormal return, averaged over TLT and IEF): pessimistic 3
  bps (concession arbitraged away under QE), central 10 bps, optimistic 25 bps (about 1-2 bps of yield on the duration
  of TLT/IEF). Placebo bar: per-date noise of the TLT/IEF average over 3 sessions is about 1.1 %, so with about
  600 dates the 95th percentile sits roughly 7 bps above the placebo mean: the central case passes narrowly, the
  pessimistic case fails, i.e. this is a fair test, not a ''cannot tell'' by design. Mean exposure: windows of 3
  + 3 sessions per cluster, about 140 sessions a year out of 252, gross 1.0 inside windows = about 0.5. Book Sharpe:
  at the central case, per-window Sharpe about 0.1 over about 48 windows a year gives a gross Sharpe near 0.7 and
  a net Sharpe near 0.5-0.6, so the absolute Sharpe floor vs T-bills (0.5) is the most likely strategy death even
  if the mechanism passes; the 2007-2020 window also contains three QE programmes in which Fed purchases offset
  auction supply, which should weaken the middle third.

  DESIGN CHOICES. Study and book use the same two instruments and the same windows, so a mechanism pass should translate
  into the book (avoids the study/book mismatch of K-0064 and H-0044). Equal 0.5 weights are fixed, not tuned. hold_sessions
  = 3 follows the paper''s ''few days before, shortly after''; the lead is tied to it (h+1) so the PRE window always
  ends at the open of the auction day. Shorts in TLT/IEF carry no modelled borrow cost; both are easy to borrow,
  but a real implementation would pay a small fee. No forward source exists for ETFs, so G4 is the ceiling (K-0014).'
