falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return at 5 sessions is not above the 95th percentile of the time-shifted
  placebos, or gross per event does not cover the round-trip cost, or fewer than two of the three dev blocks have
  the predicted sign.'
- 'Mechanism decay: the abnormal return in the latest third of dev is negative (K-0060); then the reversion is treated
  as gone, even if the pooled test passes.'
- 'Mechanism shape: if the 1-session abnormal return is at least as large as the 5-session one and the 10- and 20-session
  ones fall below it, the effect is a one-day bid-ask bounce, not a discount catch-up; reported, and read as a refutation
  of the slow-capital story.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference at or below zero.'
- 'Pooling claim: mean exposure below 0.20 or fewer than 100 position entries means the pooled slot book did not
  cure the sparsity of H-0077/H-0078; the pooling idea is then refuted, not a sizing problem to tune.'
- 'Robustness: fewer than 75 % of the neighbors (z_entry 1.5/2.5, hold_days 3/7 and their combinations) beat T-bills
  with Sharpe >= 0.5, or the book does not beat T-bills at doubled costs, or one dev third carries more than 60
  % of the log return.'
notes: 'Brief fit. The brief asks for a 1-5 day cross-asset card. The lab''s record says cross-market information
  transfer in liquid assets is flat (K-0080, mrel, H-0013, H-0047, H-0056, H-0066, H-0075) and stress rebounds sit
  near generic drift (K-0084). The one cross-market relation that cleared the placebo test twice, in two asset classes,
  is a segmented CEF reverting toward its open-end anchor (K-0100). So this card takes the closest fit with a demonstrated
  mechanism: the signal comes from the anchor market and the trade is in the CEF. It is the same family as H-0037,
  H-0043, H-0077 and H-0078 (etf-premium-arbitrage), so its trials count there. What is new, and why it is not a
  retry. The Librarian''s lessons for H-0077 and H-0078 say "change the book, not the event" and name "one pooled
  book sharing slots across fund classes" as an open question. Both books failed G1 for reasons pooling addresses:
  (a) thin exposure (sparse, clustered events, many empty slots), and (b) an absolute Sharpe floor missed even gross,
  because each book bet on one asset market''s stress episodes. Five classes are new to the lab (high yield, loans,
  US equity / option income, REIT, utility), and their shocks come from different markets. The muni and country
  classes repeat the earlier event type with a different fund list, rule and anchor estimate, so these events are
  not identical to the earlier ones, but they are not independent evidence either. z_entry, hold and slot rules
  were not lowered or enlarged after seeing results (lessons forbid that). The hold stays at 5 sessions, inside
  the brief, although both earlier studies saw the effect build for about two weeks; the 10- and 20-session horizons
  are reported descriptively only. Exposure arithmetic (K-0098, K-0101). Expected fund-years with a valid score
  in dev: about 520 (muni 12 x ~12, HY 4 x ~13, loans 5 x ~9, US equity 7 x ~16, REIT 3 x ~15, utility 3 x ~17,
  country 4 x ~16). At the earlier cards'' rate of about 2-3 events per fund-year, that is 1,000-1,600 events on
  roughly 500-900 dates, about 70 a year (fewer before 2008, when the bond anchors start). With a 5-session hold
  the average demand is about 1.4 open slots; with a cap of 2 and clustering, expect about 1.0-1.2 slots open on
  average, so mean exposure is about 0.25-0.30 if the gate counts one leg (long 0.25 per slot) and 0.5-0.6 if it
  counts gross. Both clear 0.20. Position entries are several hundred a year counting both legs, so well above 100.
  Expected gross. Earlier cards: gross per event several times the round-trip cost, single-class books with gross
  Sharpe about 0.4-0.6. If the class books are only partly correlated, a pooled book should be more stable, but
  stress episodes (2008, 2020) hit every class at once and the cap of 2 then drops most events, so the diversification
  gain is uncertain. Honest prior: the mechanism test should pass again (it is largely the same regularity); the
  strategy needs net Sharpe 0.5 and is a coin flip at best. Known weaknesses, stated in advance. (1) Survivorship:
  the fund list leans toward funds still listed today (chosen to avoid G0 ticker failures, K-0102); funds that died
  after a discount blow-out are missing, which flatters the long leg. (2) The anchor is an imperfect hedge: CEF
  leverage and holdings differ (DNP, PHK and GAB carry persistent premiums; IFN vs EPI differ in index); the beta-adjusted
  residual addresses leverage only roughly. In both earlier cards the anchor short lost money on its own over a
  bull-market dev. (3) The G1 abnormal return is raw against unmarked peers (K-0074); a shocked CEF has a beta near
  or above one to its class, so a market rebound adds a little to the event average. (4) CEF costs are the binding
  risk at doubled costs; the cost tier of small CEFs is high. (5) Single-fund concentration: each slot is 25 % long
  in one CEF. If any ticker is missing from Sharadar SFP, please drop that CEF (and an anchor that is left with
  no CEF) rather than substitute; the rule is unchanged. Ticker coverage could not be checked from the workspace
  (K-0102). No forward data for ETFs/CEFs, so G4 is the ceiling.'
