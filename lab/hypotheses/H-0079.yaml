mechanism:
  counterparty: Retail CEF holders who sell into a temporary liquidity shortage of the CEF market (selling after
    a distribution cut, harvesting tax losses, de-risking a levered income portfolio in a sell-off), and who accept
    a price below what the fund's assets are worth in the open-end market. The strategy is the patient buyer that
    absorbs that selling and hedges the asset-market risk with the anchor ETF.
  why: 'A closed-end fund (CEF) holds a portfolio that also trades, in open-end form and with a creation and redemption
    link, in a liquid asset-class ETF (muni bonds in MUB, high yield in HYG, loans in BKLN, US large caps in SPY,
    REITs in VNQ, utilities in XLU, a country''s stocks in its iShares country ETF). The CEF itself has no such
    link: its shares cannot be created or redeemed, so when its mostly retail holders sell (distribution cuts, tax-loss
    selling, panic in a sell-off, a margin call on a levered retail account) the price can fall far below what the
    move of its asset market implies, and the discount widens. Nothing forces it back quickly; it closes as slow
    arbitrage capital (CEF specialists, activists) and returning retail demand absorb the selling. So the signal
    is read in one market (the open-end ETF that prices the CEF''s assets) and the trade is made in another (the
    segmented CEF market), long the CEF and short the anchor. The lab has seen this reversion clear the placebo
    test in two separate fund classes (H-0077 muni CEFs vs MUB, H-0078 country CEFs vs country ETFs), each time
    above cost and positive in every third, but both books failed because events were sparse and clustered in one
    class (thin exposure, absolute Sharpe floor missed even gross). This card changes the book, not the event: seven
    fund classes whose shocks come from different asset markets share one small slot book, so the same per-event
    edge is taken more often and with less dependence on one market''s stress episodes.'
  why_not_arbitraged: 'The textbook arbitrage (buy the CEF, short its actual holdings) is costly: munis, loans and
    high-yield bonds are expensive or impossible to short, and the anchor ETF is only an approximate hedge (different
    holdings, the CEF''s leverage, its own discount risk). Discounts can widen further before they close (noise-trader
    risk, Pontiff 1996), positions are small because CEFs are thinly traded, and specialist capital is limited and
    lumpy, so a temporary discount shock is closed over days to weeks, not minutes.'
signal:
  description: 'Inputs: daily total returns of every instrument from sharadar_sfp, r = (1 + ret_co) * (1 + ret_oc)
    - 1, as log returns. Each CEF has exactly one anchor ETF (fixed map, declared here, not chosen from data): muni
    CEFs NUV, NEA, NAD, NZF, NVG, PML, VKQ, VGM, EIM, MMU, MQY, MYI -> MUB; high-yield CEFs HYT, HIX, PHK, EHI ->
    HYG; senior-loan CEFs EFT, FRA, JFR, BGT, VVR -> BKLN; US equity / option-income CEFs ETY, ETV, BXMX, GAB, ADX,
    TY, USA -> SPY; REIT CEFs RQI, RNP, RFI -> VNQ; utility / infrastructure CEFs UTG, UTF, DNP -> XLU; single-country
    CEFs GF -> EWG, MXF -> EWW, IFN -> EPI, JOF -> EWJ. Anchors are never traded long and never carry events; they
    are traded only as the short hedge leg. Score, after the close of each session t, for each CEF i with anchor
    a (only data up to and including t): (1) beta_i = OLS slope of CEF i''s daily log return on anchor a''s daily
    log return over the 252 sessions ending at t, requiring at least 200 sessions where both have a bar; clip to
    [0.25, 2.0]. (2) e_i(s) = 5-session log return of i minus beta_i times the 5-session log return of a, over sessions
    s-4..s. (3) sd_i = standard deviation of e_i(s) for s in the 252 sessions ending at t-5 (overlapping windows,
    at least 200 values). (4) z_i(t) = e_i(t) / sd_i. If either instrument lacks a bar on any of the last 5 sessions,
    or the history rules in (1) or (3) are not met (an instrument or its anchor not yet listed long enough), CEF
    i has no score that day. Event: CEF i has an event at close t when z_i(t) <= -z_entry and CEF i has no open
    slot and had no event in the previous hold_days sessions. Book: at most 2 slots open at any time. Each slot
    = long CEF i with weight 0.25 of equity and short its anchor with weight 0.25 (dollar-neutral per slot; two
    slots on the same anchor add their short weights). Entry at the open of session t+1. If more new events occur
    on one date than free slots, take the most negative z first; events that find no free slot are dropped, not
    queued. A slot is closed at the open of session t+1+hold_days (held hold_days sessions). If the CEF has no tradable
    bar at the entry open the event is skipped; if it stops trading during the hold, the slot is closed at the first
    open where the engine allows it. No other positions: cash otherwise. Gross exposure never exceeds 2 x (0.25
    + 0.25) = 1.0. Weights are fixed at entry (no daily re-equalizing).'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_entry:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  selection_procedure: Primary configuration fixed before any run (z 2.0 = a round two-sigma shock, hold 5 sessions
    = the horizon at which H-0077 and H-0078 passed the mechanism test and the brief's 1-5 day range). Slot weight
    0.25 per leg and slot cap 2 are fixed by the gross limit, not tuned. The fund list and anchor map were written
    from fund categories (national muni, high yield, loans, US equity, REIT, utility, single-country) without looking
    at any result; funds were limited to long-lived ones the author believes are still listed under the same ticker,
    to avoid the missing-ticker G0 failure of H-0078 (K-0102).
  timeframes:
  - 1d
mechanism_test:
  event: 'A closed-end fund''s 5-session log return falls at least z_entry (2.0) standard deviations below what
    its declared open-end anchor ETF implies (beta-adjusted residual, beta and residual volatility from the prior
    year), first crossing only: the fund has had no event in the previous hold_days sessions. Side +1 (the fund
    should outperform afterwards). Anchor ETFs are never marked and serve, with the CEFs without an event that day,
    as unmarked peers; with 48 instruments there are always well over three unmarked peers per date.'
