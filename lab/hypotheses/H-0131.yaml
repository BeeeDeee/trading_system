falsification_criteria:
- 'Mechanism: the side-adjusted 5-session return of the marked equity ETFs against the bond peers is not above the
  95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost (G1).'
- 'Mechanism era: the latest third of the dev event sample has a side-adjusted average at or below zero (K-0060
  decay; rallies of the late bull market kept running).'
- 'Mechanism shape: the 1- and 3-session averages are not positive and the effect appears only at 10-21 sessions.
  That would be slow drift, not a rebalancing concession that builds within a week.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference at or below zero.'
- 'Robustness: fewer than 75 % of the k (1.0, 2.0) and tilt (0.3, 0.6) neighbours beat the 60/40 benchmark, or the
  book falls below the benchmark at doubled costs.'
- 'Control reading: if the mechanism fails here while H-0046 passed, the H-0046 pass belonged to the stress side
  (equities after large underperformance), i.e. stress rebound (K-0084), not rebalancing pressure after rallies.'
notes: 'Brief fit: cross-asset with a short hold. The signal is the relative performance of the US stock and Treasury
  markets, and the book trades both, held 5 sessions. FRED series were not used: their next_morning clock adds a
  day of lag that a 5-session flow cannot afford, and the stock-bond relative move itself is the flow trigger. Why
  this is not a retry. H-0046 (same family) marked band breaches of a simulated 60/40 in both directions and held
  one session. Its lesson and K-0068 ask for a control that separates rebalancing from generic stress reversal.
  This card is that control: a different trigger (short-window rally state, no simulated band), the upward side
  only, so no crash-rebound days (H-0041 and studies 6-7 are the downward side), and a 5-session hold matching the
  build-up H-0046 saw. H-0002 (month-end month-to-date drift) is a calendar trigger. This one is state-triggered
  at any date. Family trials (H-0002, H-0044, H-0046, H-0050) count against it on purpose. Forecasts (K-0120, K-0177
  style): rally-state sessions at k = 1.5 about 5-8 % of sessions, so roughly 220-350 event dates from mid-2003
  to 2020 and 900-1400 marked events (4 per date). Expect G1 to count somewhat fewer. Round trip about 2-6 bps (liquid
  ETF tier). The event-study placebo mean should be negative for side -1 (equity premium over bonds, about -10 to
  -20 bps over 5 sessions), so it is a harder bar than a raw zero (K-0025). Central case: equities lag bonds by
  10-20 bps over the 5 sessions after the state, side-adjusted, which is 25-35 bps below the placebo mean. Pessimistic
  case: equal to the placebo mean. Book arithmetic (K-0064): the tilt is active on about 12-18 % of sessions. With
  30 bps per 5 sessions below normal and tilt 0.45 the gain is about 0.8-1.0 % a year over the 60/40 at a benchmark
  volatility near 8 %, so roughly +0.10 to +0.12 Sharpe. The book can pass the +0.10 margin only near the central
  case. The likely deaths are inside the placebo cloud (week-long stock-bond spreads are noisy) or a negative latest
  third. The tilt is always partial (never below 15 % SPY), so this is not a whole-book switch (K-0005), and average
  equity weight stays close to the benchmark''s. k = 1.5 and tilt 0.45 are round, mid-grid values chosen before
  any data. No dates, no episodes. The reference is from 2025, after dev, so the publication-decay check has no
  pre/post split.'
