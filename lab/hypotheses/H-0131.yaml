  kind: instruments
mechanism:
  counterparty: Rule-bound rebalancers (pensions, target-date and balanced funds) that sell equities after rallies
    at predictable times and pay a price concession to the dealers and front-runners who take the other side first.
  why: 'Fixed-weight multi-asset holders (target-date and balanced funds, pension plans with calendar or band rules,
    robo-advisers) must sell the asset class that just outperformed and buy the one that lagged. After a large equity-over-Treasury
    rally that leaves them overweight equities, their predictable selling of equities and buying of bonds, and the
    front-running of it, should push the stock-minus-bond spread down over the following sessions (Harvey, Mazzoleni
    and Melone document this price pressure and its cost to pensions). The lab saw the effect clear the placebo
    test once (H-0046), but its events were band-breach days that mixed both directions, so it could not be told
    apart from the generic rebound of equities after stress (K-0068, K-0084). This card keeps only the rally side,
    where no stress rebound exists: if equities still lag bonds after their own large rallies, the reversal is rebalancing
    pressure, not a crash bounce.'
  why_not_arbitraged: The trade is a few tens of basis points on a week-long stock-bond spread whose weekly volatility
    is several percent. Macro investors and CTAs following momentum trade the other way. Front-running capital has
    to carry equity-market risk for a gain the size of noise, and the size of rebalancing flows is not public in
    advance.
signal:
  description: 'Decision after the close of each XNYS session t, using data up to that close; trades at the open
    of t+1. (1) Daily total return of SPY and IEF: r = (1 + ret_co) * (1 + ret_oc) - 1. Daily difference d(t) =
    r_SPY(t) - r_IEF(t). (2) rel5(t) = sum of d over sessions t-4..t; rel21(t) = sum of d over sessions t-20..t.
    (3) s(t) = standard deviation of d over sessions t-251..t times sqrt(5); require at least 200 valid d values
    in that window, else no event. (4) Rally state on session t: rel5(t) >= k * s(t) AND rel21(t) > 0 (holders rebalanced
    a month ago are overweight equities). Only the upward side is used: there is no rule after equity underperformance.
    (5) Book, always fully invested in SPY and IEF only: base target 0.60 SPY / 0.40 IEF. If the rally state held
    on any of sessions t-4..t, the target for t+1 is (0.60 - tilt) SPY / (0.40 + tilt) IEF; otherwise the base target.
    Rebalance to the target at the next open whenever the target changes (state window opens or closes) and on the
    first session of each month (as the 60/40 benchmark does); weights drift in between. (6) If SPY or IEF has no
    bar on session t, no new rally state that day and current weights are kept. VTI, DIA, IWM, TLT, SHY and AGG
    are read only by the mechanism test and are never traded.'
  params:
    k:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
    tilt:
      grid:
      - 0.3
      - 0.45
      - 0.6
      value: 0.45
  timeframes:
  - 1d
  - 1w
  - 1mo
mechanism_test:
  event: 'Rally state on session t (as in the signal, k = 1.5): the 5-session SPY-minus-IEF total-return difference
    is at least k times its trailing 252-session daily volatility scaled by sqrt(5), and the 21-session difference
    is positive. On such days SPY, VTI, DIA and IWM are marked with side -1 (they should lag bonds over the next
    sessions as rebalancers sell equities). IEF, TLT, SHY and AGG are never marked and are the peers: three from
    2002-07-30, four from 2003-09-29. With the 252-session warm-up the first possible event falls around mid-2003.
    Every session in the rally state is marked, not only the first one, because the pressure lasts while holders
    are overweight.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
