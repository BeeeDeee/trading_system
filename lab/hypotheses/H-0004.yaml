id: H-0004
version: 1
title: Crypto new-listing supply overhang - short recently listed Binance pairs, long seasoned pairs, dollar-neutral,
  weekly
author_agent: scout
family: new-listing-overhang
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 100
mechanism:
  counterparty: Retail buyers who chase newly listed, heavily marketed tokens (lottery-like demand, exchange listing
    as a quality signal), and who absorb the vesting supply sold by early investors and teams. They keep doing it
    because each listing is a new story and outcomes are highly skewed (a few listings do rise a lot).
  why: Tokens reach a large exchange when attention and optimism about them peak, while their tradable float is
    still small and most of the supply (team, investors, treasury, ecosystem allocations) is locked and vests over
    the following months. Right after listing the coin cannot be shorted (no margin borrow, perp contracts arrive
    later or with thin open interest), so the price is set by the most optimistic buyers (Miller 1977 disagreement
    + short-sale constraints). As short constraints relax and vested supply is sold, the price drifts down relative
    to seasoned coins. This is the crypto analogue of long-run IPO underperformance (Ritter 1991) and of post-lockup
    selling, and the long-run underperformance of the median listed ICO token has been documented directly (Momtaz).
    The strategy is long an equal-weight basket of seasoned coins and short an equal-weight basket of coins listed
    2 weeks to 3 months ago, so the generic altcoin beta largely cancels and what remains is the listing-age spread.
  why_not_arbitraged: Shorting new listings is hard and expensive exactly in the window where the overpricing is
    largest (no borrow, then high borrow/funding costs, squeeze risk from the small float); the short leg has unbounded
    upside risk and fat right tails, which deters capital-constrained arbitrageurs; capacity is small because new
    listings are thin; and early holders sell for liquidity/vesting reasons regardless of price.
signal:
  description: 'Data: binance_spot_1d, daily bars closing at 00:00 UTC. Listing date of a pair = the first UTC day
    on which it has a bar in the dataset (point-in-time: known from that day on). Listing age on day t = calendar
    days between the listing date and t. Decision schedule: weekly, after the close of each Sunday UTC bar (the
    bar ending Monday 00:00 UTC), using only data up to and including that bar; trades are executed at the open
    of the next bar (Monday) and held until the next weekly decision. Eligible set on decision day t: the pairs
    in the loader''s crypto_top_n(100) universe as of t (ranking by trailing quote volume known at t; if the loader
    does not rank point-in-time, rank by median daily quote_volume over the 30 days ending at t), that have a bar
    on t. Short leg S: eligible pairs with skip_days <= listing age <= max_age_days. Long leg L: eligible pairs
    with listing age >= 365 days (fixed constant, "seasoned"). Weights: if |S| >= 3 and |L| >= 3, each pair in S
    gets -0.5/|S| and each pair in L gets +0.5/|L| (dollar-neutral, gross exposure 1.0). Otherwise hold no position
    (cash) until the next decision date. Every decision date rebalances fully to these target weights. Missing data:
    a pair without a bar on the execution day keeps its previous weight until it trades again; a pair handled as
    delisted by the loader (gap > 7 days) is closed at the loader''s delisting price and is not re-entered. No other
    filters, no return-based conditioning, no stop-losses. Trading starts at the first decision date at which both
    legs have at least 3 pairs.'
  params:
    max_age_days:
      grid:
      - 60
      - 90
      - 120
      value: 90
    skip_days:
      grid:
      - 7
      - 14
      - 28
      value: 14
