  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2017-08-17'
  - '2022-12-31'
holding_period:
  rebalance: weekly
  typical_days: 75
market_exposure: market_neutral
references:
- cite: Momtaz, P. P. (2021) The pricing and performance of cryptocurrency. European Journal of Finance 27(4-5)
  year: 2021
- cite: Ritter, J. R. (1991) The long-run performance of initial public offerings. Journal of Finance
  year: 1991
- cite: Miller, E. M. (1977) Risk, uncertainty, and divergence of opinion. Journal of Finance
  year: 1977
falsification_criteria:
- Net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the one-sided 90 % bootstrap CI of the Sharpe
  difference includes 0.
- Fewer than 75 % of the neighbors (max_age_days 60/120, skip_days 7/28 and their combinations) beat the T-bill
  bar, or their median Sharpe is below 0.70 x the primary Sharpe.
- Net Sharpe at costs x2 does not beat the benchmark bar.
- 'Mechanism: the strategy does not exceed the 95th percentile of random-entry portfolios with the same turnover
  and exposure (i.e. shorting random eligible pairs does as well as shorting recent listings, so the result is generic
  altcoin weakness, not listing age).'
- 'Mechanism: the short leg''s weekly return minus the long leg''s weekly return is not negative on average in at
  least 2 of the 3 dev sub-periods, or one sub-period carries more than 60 % of the strategy''s log return.'
notes: 'Why this is not a re-run of prior studies: studies 9 and 10 sorted crypto on past returns (trend, momentum)
  and their short legs were time-series trend shorts; this card sorts only on listing age, never on returns, and
  the long leg is seasoned altcoins (not BTC), so the altcoin beta is mostly hedged. Known data caveats, all biased
  against the hypothesis: (1) the listing date is the first USDT-pair bar, so coins that traded on Binance against
  BTC earlier and only got a USDT pair later are wrongly counted as new listings, which dilutes the short leg; (2)
  delisted pairs are only partly in the archive, so the worst recent listings (those delisted soon after a collapse)
  are partly missing from the short leg; (3) the -2 % delisting convention credits a short only 2 %. Implementation
  caveat for the Skeptic: shorting spot pairs is a modelling simplification; live execution would use USD-M perpetuals
  (binance_perp_1d and binance_funding have no loader yet), and borrow/funding costs on the short leg are not in
  the cost model. skip_days exists for the same reason: the first days after listing are typically not shortable
  and are dominated by listing-day volatility. Most likely ways to die: short squeezes in an altcoin bull phase
  concentrate the loss in one sub-period, or the dev window (crypto dev ends 2022-12-31) is too short for G3 with
  the 20-trial literature prior. No dates, episodes or specific coins were used to design it.'
