falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of R (+1) versus N (-1) at 2 sessions is not above the 95th percentile
  of the time-shifted placebos, or gross per event is below the round-trip cost, or fewer than 2 of 3 dev blocks
  have the predicted sign.'
- 'Shape: the 1-session average (the restricted session itself) is zero or negative: then whatever shows at 2 sessions
  is not the restriction.'
- 'Reversal: the 10-session average is below zero, i.e. the gain is given back after the restriction is lifted (a
  Miller-style relief, the opposite of the claim).'
- 'Decay: the latest third of dev is wrong-signed.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbours (near_band 0.01 / 0.02, alpha 1 / 100) beat the benchmark.'
- 'Linear baseline (owner diagnostic, not run by the judge): the plain rule book (long all R, short all N, same
  sizing and hold) does as well or better than the ridge-ranked book, so the model adds nothing over the rule.'
notes: 'Brief fit: the brief asks for a learned card on US single stocks at 1-5 days. The lab''s knowledge closes
  most learned conditioners in LIQ-500 at this horizon (K-0143, K-0162, K-0169, K-0182, K-0238), and every remaining
  candidate I found sits in a heavily tried family. This card brings a new information source, a regulatory threshold,
  and uses a learned model honestly: a walk-forward ridge with the threshold coded from the rule''s text, because
  a gbm finding a public threshold would be capacity to overfit. The mechanism test is the rule event (R versus
  N), not the model''s top-score event, because the claim is the step; if the step is absent, the card is dead whatever
  the model does. Period: Rule 201 compliance began at the end of February 2011, a public regulatory date known
  in advance, not an episode. Before it there was the old tick test (to mid-2007) and then no price test at all,
  so earlier rows would be placebo-era events mixed into the test; the period keeps them out. An owner diagnostic
  worth running: the same R-versus-N contrast from mid-2007 to February 2011 (no price test) should be about zero;
  a step there means the -10 % line itself, not the rule, carries the effect. Identification limits: SEP has no
  intraday low, so N contains stocks that touched -10 % intraday and were in fact restricted (estimated a third
  or more of those closing near -10 %); this dilutes the contrast, it does not flip its sign. R is certain. Band
  widths: R spans 5 points and N 1.5 points because the density of daily drops falls steeply with size; with a cubic
  tail the two sets have about equal counts, which keeps the pooled side-adjusted average from being dominated by
  one side (a generic dropper response then mostly cancels). The near_band neighbours (1 and 2 points) test that
  choice. Not reversal or earnings drift: both legs are large droppers on the same day, with news type, drop size
  and volume as ridge controls, so generic short-term reversal and post-earnings drift are confounds the design
  nets out, not the claim. The deeper R drops can still carry a little more reversal than N (about 2 points more
  drop); at the slopes the lab measured this is a few bps against the 35 bps step of the literature. If the Chair
  reads the book as reversal, short-term-reversal should be added to related_families. Forecasts (2011-03 to 2020-12,
  LIQ-500): R 1,000-2,000 events, N 900-1,800, on 700-1,300 dates, heavy in earnings seasons and in market selloffs
  (August 2011-type and March 2020-type weeks put dozens on one date). Gross: central +15 bps per event at 2 sessions
  pooled (the restricted side''s step of 20-35 bps, diluted by contaminated near misses and by entry at the open
  after part of the support is already in the price), pessimistic 0-5 bps. Round trip about 6-12 bps (rank tiers
  3/6 bps per side), so the cost ratio is the most likely mechanism death, then the placebo bar (clustered selloff
  dates widen the cloud). Book: about 1-1.5 candidates per session on average, 0.15 per name, two overlapping cohorts:
  mean exposure forecast 15-35 %, so the exposure floor is a named risk; Sharpe of a single-name crash book with
  this per-event edge is likely under 0.5, so the strategy gate is the likely book death even if the mechanism passes.
  The value of the card is the mechanism verdict on a regulatory step that no lab card has used. Data caveat: if
  liq_n membership needs 252 bars inside the view (K-0108-like), the first year has no members; the Builder should
  report the first date with members. The ridge warm-up leaves the first refit window flat in the book only.'
