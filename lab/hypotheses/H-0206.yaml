universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'On the short (near-miss) leg: dip buyers and liquidity providers in near-miss stocks, who face
    unrestricted aggressive short selling and momentum sellers in the sessions after the drop. On the long leg:
    holders who liquidate a crashed stock at the next open (risk-limit and stop-driven sellers) before the support
    of a session without marketable short sales shows up in the price.'
  why: 'SEC Rule 201 (Regulation SHO, compliance from the end of February 2011) is a mechanical threshold: once
    a stock trades 10 % or more below the previous close, short sales may not execute at or below the national best
    bid for the rest of that day and the whole next session. Aggressive (marketable) short selling, the most price-pressing
    part of the sell side after bad news, is switched off for about 1.6 sessions, while a stock that closed at -9
    % without touching -10 % keeps it. Barardehi, Bird, Karolyi and Ruchti (2025) compare stocks on either side
    of the threshold and find that the restriction lowers short volume and raises returns by about 35 bps per restricted
    day, and that the gain does not reverse after the restriction is lifted; this fits predatory or momentum selling
    into a fallen stock (Brunnermeier and Pedersen 2005) being blocked, not a Miller overpricing that unwinds. A
    stock that closed at or below -10 % (or opened 10 % below the prior close) is certainly restricted for the whole
    next session, which is known at the close and tradable at the next open. The near misses carry the same news
    severity, size and volatility, so the contrast isolates the step.'
  why_not_arbitraged: Per event the step is a few tens of basis points on a stock that just lost 10 %, with daily
    idiosyncratic volatility of several percent, so the trade is a small edge on a very noisy, single-name position;
    events are one or two a day and cluster in market selloffs, so capacity and diversification are small. Desks
    that would harvest it are the short sellers the rule constrains.
signal:
  description: 'Data from 2011-03-01 (Rule 201 in force) to the end of dev. Decisions after the close of each session
    t, trades at the open of t+1. Per LIQ-500 member: r_t = (1 + ret_co_t) * (1 + ret_oc_t) - 1 (day-t total return
    from the previous close), g_t = ret_co_t (day-t open vs previous close). Candidate sets on date t: RESTRICTED
    R_t = members with (r_t <= -0.10 or g_t <= -0.10) and r_t >= -0.15 (the short-sale price test is certainly in
    force through the close of t+1; drops beyond -15 % are excluded as a different event class). NEAR MISS N_t =
    members with -0.10 < r_t <= -0.10 + near_band and g_t > -0.10 (most of these were never restricted). Members
    with missing returns on t are not candidates. Features per member and date (each z-scored across the point-in-time
    universe by the framework helper): (1) restricted flag = 1 if r_t <= -0.10 or g_t <= -0.10, else 0; (2) r_t;
    (3) g_t; (4) log of day-t dollar volume over its median of sessions t-63..t-1; (5) ea_reaction_day on t (8-K
    Item 2.02 release session, NaN treated as 0); (6) realized volatility of daily total returns over t-63..t-1.
    A member without a full feature vector is not scored. Label: total return from the open of t+1 to the open of
    t+3 (horizon 2), ranked across the universe on each date. Model: framework `ridge`, alpha = alpha, trained by
    lab.framework.ml.walk_forward on all scored member-dates, expanding window, refit every 63 rows. Book (score_weights
    then only_on the candidate set R_t union N_t): on a date with at least 2 scored candidates, rank the candidates
    by model score; go long the floor(k/2) highest and short the floor(k/2) lowest (k = number of candidates; with
    odd k the median-scored candidate gets no weight), each at 0.15 of equity, so every cohort is dollar-neutral.
    Each cohort is entered at the open of t+1 and closed at the open of t+3 (two sessions); overlapping cohorts
    add. If the summed gross exceeds 1.0 on a date, all cohort weights are scaled down proportionally. Dates with
    fewer than 2 candidates open no cohort. A stock leaving the universe is closed at the next open.'
  params:
    alpha:
      grid:
      - 1.0
      - 10.0
      - 100.0
      value: 10.0
    near_band:
      grid:
      - 0.01
      - 0.015
      - 0.02
      value: 0.015
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of day t, for LIQ-500 members: side +1 if the stock is in R_t (day-t total return between
    -15 % and -10 % inclusive, or opened at least 10 % below the previous close with the day''s total return not
    below -15 %), i.e. the Rule 201 price test certainly binds through the close of t+1; side -1 if it is in N_t
    (day-t total return in (-10 %, -10 % + near_band] and opened above -10 %), the near misses. Rule-based, independent
    of the model, so warm-up does not empty any block.'
  horizons:
  - 1
  - 2
  - 5
  - 10
  primary_horizon_days: 2
ml:
  features:
  - 'restricted flag: day-t close at or below -10 % or open at or below -10 % vs the previous close; the Rule 201
    price test then binds for the whole next session (the regulatory step the card is about)'
  - 'day-t total return from the previous close: the running variable, so the step is separated from the smooth
    response to drop size (reversal or continuation)'
  - 'day-t overnight return (open vs previous close): whether the drop came as an overnight gap, when restricted
    and near-miss stocks differ in how much of the day was already restricted'
  - 'log day-t dollar volume over its 63-session median: selling intensity on the drop day, the demand for liquidity
    that aggressive short sellers would add to'
  - '8-K Item 2.02 release flag on day t: earnings drops drift, no-news drops partly revert; a control so the step
    is not confounded with news type'
  - '63-session realized volatility: scale of the stock''s ordinary moves, so a -10 % day in a calm stock and in
    a volatile one are not treated alike'
  horizon_days: 2
  model: ridge
  retrain_every_days: 63
  why_not_linear: 'Linear on purpose. The nonlinearity is a known regulatory step at -10 %, coded as a feature from
    the text of the rule; a tree would only rediscover a threshold that is public and add capacity to overfit the
    smooth part. The ridge''s job is to price the step net of the smooth responses (drop size, gap, volume, news
    type, volatility) that differ slightly between restricted stocks and near misses, which the plain rule cannot
    do. Who pays is the same as for the rule: dip buyers of near-miss stocks facing unrestricted short sellers,
    and next-open liquidators of restricted stocks.'
