id: H-0191
version: 1
title: Post-split ex-date demand drift - LIQ-500 market-neutral, long stocks the session after their forward-split
  ex-date, hedged with the other members, hold 5 days
author_agent: scout
family: split-nominal-price-demand
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Small investors who buy because the per-share price now looks affordable or because a broker promotes
    the newly cheaper stock, and who pay a temporarily inflated price and a wider relative spread; the strategy
    buys before the bulk of that flow and sells into it. Existing holders and market makers supply the shares.
  why: 'A forward stock split carries no new information on its ex-date: the split was announced weeks earlier and
    its signal is priced at the announcement. What changes on the ex-date is the nominal share price and, with it,
    the clientele and the trading economics of the stock. The event-study literature finds positive abnormal returns
    not only on the ex-date but on the sessions after it (Grinblatt, Masulis and Titman 1984 report about +0.5 %
    on the day after the ex-date), and attributes them to buying pressure from a rising number of small shareholders
    after the split (Lamoureux and Poon 1987) and to broker promotion, because a lower price makes the relative
    tick and the dealer margin larger (Schultz 2000, who documents a surge of small buy orders after splits). That
    is a predictable, information-free, price-insensitive demand flow that arrives over several sessions after a
    date the data reveals at the ex-date close. If it exists in large liquid stocks, the split stock should beat
    the other LIQ-500 members from the next open over the following sessions.'
  why_not_arbitraged: The effect per event is small (tenths of a percent) and arrives in a few dozen events a year,
    so it is a poor use of capital for a dedicated arbitrageur; the split stock is usually a past winner with above-average
    volatility, so a single-name position carries idiosyncratic risk far larger than the edge; and the demand is
    behavioural (nominal-price illusion, broker incentives), so it persists as long as retail clienteles exist.
    It should be weaker after decimalization (2001) shrank tick-size incentives and weaker again once fractional-share
    trading spread, which this card states as a kill condition rather than an excuse.
signal:
  description: 'Data: sharadar_sep daily ret_co (total return previous close to open of t), ret_oc (total return
    open to close of t), close_u (unadjusted close) and tradable; LIQ-500 point-in-time membership from the universe.
    Event detection after the close of day t, using data up to that close only: for every stock j that is a LIQ-500
    member and tradable on t, with valid close_u on t-1 and t and valid ret_co and ret_oc on t, compute the total
    close-to-close return r = (1 + ret_co[t]) * (1 + ret_oc[t]) - 1 and the implied split factor f = close_u[t-1]
    * (1 + r) / close_u[t]. Day t is a forward-split ex-date of j if f is within 3 % (|f / R - 1| <= 0.03) of a
    standard split ratio R in {1.25, 4/3, 1.5, 5/3, 2, 2.5, 3, 4, 5, 6, 8, 10} and R >= min_ratio. The ratio list
    excludes spin-off ex-dates and ordinary dividends (f close to 1 or a non-standard factor). A stock can trigger
    at most one event in any 21 sessions (a later trigger inside 21 sessions of an earlier one is ignored). Missing
    inputs on t-1 or t mean no event; nothing is filled. Book (event slots, market-neutral): for each event on day
    t, at the open of t+1 buy the split stock with weight 0.25 and short 0.25 spread equally over all other LIQ-500
    members tradable on t that are not themselves in an open long slot. Keep the slot''s target weights constant
    for hold_days sessions and close it at the open hold_days sessions after entry (the long is held from the open
    of t+1 to the open of t+1+hold_days). If the split stock leaves LIQ-500 or stops being tradable during the hold,
    close its slot at the next decision. Slots add up; whenever total gross exposure would exceed 1.0, scale all
    open slots down proportionally on that decision. With no open slot the book is flat (cash at the T-bill rate).
    Decisions are daily after the close, trades at the next open, no other trading.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    min_ratio:
      grid:
      - 1.25
      - 1.5
      - 2.0
      value: 1.5
  timeframes:
  - 1d
mechanism_test:
  event: 'Stock j, a LIQ-500 member, has a forward-split ex-date on day t: its unadjusted close fell by an implied
    factor f = close_u[t-1] * (1 + total close-to-close return of t) / close_u[t] that matches a standard split
    ratio of at least min_ratio (1.5) within 3 %, with no earlier event of j in the last 21 sessions. side = +1
    (the split stock should outperform the other members from the next open).'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sep
  description: LIQ-500 point-in-time universe; close_u (unadjusted) against total returns reveals split ex-dates
    at the close of the ex-date.
  fields:
  - ret_co
  - ret_oc
  - close_u
  - tradable
  frequency: 1d
  period:
  - '1998-01-02'
  - '2020-12-31'
holding_period:
  rebalance: event
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Grinblatt, Masulis, Titman (1984) The valuation effects of stock splits and stock dividends, Journal of
    Financial Economics
  year: 1984
- cite: Lamoureux, Poon (1987) The market reaction to stock splits, Journal of Finance
  year: 1987
falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of split stocks after the ex-date (next open to close
  of t+5, against the other members) is not above the 95th percentile of the 200 time-shifted placebos, or is below
  the round-trip cost per event, or is positive in fewer than 2 of the 3 dev blocks: no information-free post-split
  demand drift in large liquid stocks.'
- 'Mechanism, decay: the abnormal return in the latest third of dev is zero or negative. The card then counts as
  dead for forward use even if the pooled test passes (expected decay after decimalization and the spread of fractional
  shares; K-0060).'
- 'Mechanism, identity: the event mean is not above the placebo mean by more than the placebo spread, i.e. split
  stocks merely do well in any week (past-winner identity, K-0025, K-0184).'
- 'Strategy: net Sharpe of the market-neutral book against T-bills below 0.5, or the bootstrap bound of the Sharpe
  difference not above zero, or mean exposure below 0.20.'
- 'Robustness: fewer than 75 % of the neighbours (min_ratio 1.25 / 2.0, hold_days 3 / 7) beat the benchmark, or
  the book does not beat T-bills at 2x costs.'
notes: 'Why this is not a near-copy of a dead card: no card in the registry or prior studies uses split ex-dates.
  The closest families are high-volume-visibility-premium (attention via volume bursts, H-0014, H-0067) and index-inclusion-price-pressure
  (mandated index flow); this event is neither a volume signal nor index flow but a scheduled change of nominal
  price with no information content on the day, i.e. the kind of non-information flow event K-0024 names as the
  remaining candidate in large caps. New family on purpose: the counterparty (nominal-price-sensitive retail buyers
  and promoting brokers) is not that of any existing family; the Chair may merge it if he sees otherwise. References:
  the anomaly (ex-date and post-ex-date returns) was published in 1984 and 1987, before dev. The sponsorship mechanism
  of Schultz (2000, Journal of Finance, Stock splits, tick size, and sponsorship) is cited in the mechanism text
  as the explanation of the flow; it falls inside dev (2000), so if the Chair wants it as a formal reference the
  publication-decay check would compare 1998-1999 with 2000-2020, which the card would very likely fail (the decimalization
  reading predicts exactly that decay). Forecasts (pessimistic first, K-0120, K-0202): split ex-dates in LIQ-500
  with ratio >= 1.5 about 400-900 events over 1998-2020 (central 600), on nearly as many distinct dates (splits
  rarely share a day), heavily front-loaded: roughly half in the first third of dev (1998-2005), a quarter in the
  middle, 60-150 in the latest third, so the latest block is thin and its sign noisy. Round trip per event from
  the cost tiers: 6-12 bps after 2001-04, 15-30 bps before (x2.5), about 15 bps on average. Gross abnormal return
  per event over 5 sessions from the next open: pessimistic 0.1 %, central 0.35 %, optimistic 0.7 %; the ex-date
  itself and the overnight into t+1 are lost because the event is only known at the ex-date close. The placebo spread
  of a mean over about 600 single-stock 5-day returns of volatile past winners is about 0.2 %, so the 95 % bar sits
  about 0.3-0.4 % above the placebo mean: the central case is a coin flip at the bar, and the bar lies above cost,
  so a near miss would be a ''cannot tell'' (K-0034). Beta gap (K-0074): split stocks are past winners with beta
  around 1.2 against about 1.0 for the peers; over 5 sessions that is a few bps of market drift, small next to the
  claim. Events cluster in bull markets, so the latest-third kill condition and the identity criterion are the guards.
  Book arithmetic (K-0098, K-0104): mean exposure about entries x hold / sessions x gross per slot = 600 x 5 / 5800
  x 0.5 = about 0.26 (0.17 at 400 events), so the exposure floor may bind in the pessimistic case; in busy months
  of the early years the gross cap scales slots down. Expected annual gain at the central case: about 25 events
  a year x 0.25 x (0.35 % - 0.15 % long cost - 0.10 % hedge cost) = about 0.1-0.6 % a year on single-name risk of
  several percent a year: the book is very unlikely to clear the absolute Sharpe floor of 0.5 unless gross per event
  exceeds about 1 %. The mechanism test is the question of this card; the book is the simplest implementable form,
  and a mechanism pass with a failing book would point to a tilt on an always-invested core as the next design.
  Implementation details for the Builder: the split factor must use the dataset''s adjusted total returns (they
  already contain the split adjustment) against close_u (not split-adjusted, K-0168); a vendor glitch in close_u
  gives a factor that rarely hits a standard ratio within 3 %, and the 21-session rule stops an echo. Please report
  the event count per year and the split of events by ratio (1.5, 2, 3+) at G0 if possible.'
