id: H-0190
version: 1
title: Quant-crowding unwind rebound, learned - LIQ-500 long-only weekly top fifth of a LightGBM 5-day score on
  value, momentum, quality and low-vol exposures x the week's style-composite and market moves
author_agent: scout
family: trend-follower-deleveraging
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Crowded quantitative long/short equity funds and factor products that deleverage at the same time,
    under risk-limit or funding pressure (Brunnermeier and Pedersen 2009). They sell their high-exposure longs and
    cover junk shorts below fair value. Whoever supplies that liquidity for a few days earns the concession.
  why: 'Systematic equity managers hold largely the same multi-factor book (long cheap, past-winner, profitable,
    low-volatility stocks; short the mirror). When some of them must cut gross exposure (risk-limit breach, margin
    call, redemptions, losses elsewhere) they sell the common long leg and buy back the common short leg at the
    same time. The quant style composite then drops sharply in a week when the broad market moves little, and the
    drop is a price concession, not news. It should partly revert over the following days once the deleveraging
    ends (the August 2007 quant episode is the textbook case, Khandani and Lo 2007). A sharp composite drop together
    with a strong market rally is a different state: a risk-on junk rally, which tends to continue. The model has
    to tell the two apart from the market-move input.'
  why_not_arbitraged: The natural buyers of a factor-level fire sale are other factor investors, and they are losing
    money on the same book at the same moment, so their arbitrage capital shrinks exactly when it is needed (limits
    to arbitrage). Unwinds are rare, can go on for several weeks, and are hard to tell apart from a real factor
    repricing in real time. A liquidity provider takes the risk that the unwind continues.
signal:
  description: 'Universe: point-in-time LIQ-500 members; non-members are masked per row (no ever-member column lists,
    K-0134). Decisions after the close of the last session of each calendar week (t), trades at the next session''s
    open, hold until the next weekly decision. Stock-level exposures, all from data up to the close of t and each
    z-scored across that date''s members by the framework helper: (1) value = 1 / sf1_arq_pb as frozen at the latest
    filing, multiplied by the stock''s total-return index at that filing day divided by its value at t (book-to-market
    moved with the price since the filing); pb <= 0 or missing -> not scored; (2) momentum = total return from t-252
    to t-21 sessions; (3) quality = sf1_art_roe of the latest filing (missing -> not scored); (4) low volatility
    = minus the standard deviation of the last 63 daily total returns (at least 50 valid). Composite exposure per
    stock = mean of the four z-scores. Date-level state inputs (raw, identical for all stocks on a date, not cross-sectionally
    z-scored): (5) style unwind = 5-session total return (t-5 to t, close to close) of the equal-weight top-quintile
    minus equal-weight bottom-quintile portfolio of the composite exposure, where the quintiles are formed at t-5
    from the exposures known at t-5. It is divided by the standard deviation of the same 5-session spread return
    over the previous 252 sessions (overlapping windows, at least 200 valid); (6) market move = 5-session return
    of the equal-weight average of all members, divided by its own trailing 252-session standard deviation in the
    same way. Label (framework): total return from the open of t+1 to the open 5 sessions later, ranked across members.
    Model: LightGBM (framework gbm), num_leaves 15, min_child_samples 200, learning_rate 0.05, n_estimators from
    params; walk_forward with an expanding window, refit every 126 rows. Book: at each weekly decision hold the
    `top` fraction of members with the highest score, equal weight, gross 1.0, long only. Members with any missing
    feature are not scored; with fewer than 50 scored members the book holds all scored members equally. Delistings
    follow the engine''s terminal-return policy.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a weekly decision date t on which the style-unwind state is at or below -1.5 (the equal-weight top-minus-bottom-quintile
    composite-exposure portfolio fell by at least 1.5 trailing standard deviations over the last 5 sessions), a
    member stock is in the top fifth of that date's model score (side +1) or in the bottom fifth (side -1).
  horizons:
  - 1
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'value exposure: frozen-at-filing 1/pb (sf1_arq_pb) moved with the total-return index since the filing; a cheap-stock
    leg of the crowded quant book'
  - 'momentum exposure: total return t-252 to t-21 sessions; the past-winner leg of the crowded book'
  - 'quality exposure: trailing-twelve-month ROE (sf1_art_roe) of the latest filing; the profitability leg'
  - 'low-volatility exposure: minus the 63-session standard deviation of daily total returns; the defensive leg'
  - 'style-unwind state (date-level, raw): 5-session top-minus-bottom-quintile return of the composite exposure,
    in units of its trailing 252-session sd; large negative = quant longs sold, shorts bought'
  - 'market-move state (date-level, raw): 5-session equal-weight universe return in units of its trailing sd; separates
    a market-neutral unwind (flat market) from a risk-on junk rally (strong market) or a crash'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The claim is that the payoff to a stock''s quant exposures changes sign with the state of the
    week: after a market-neutral composite drop (unwind) high-exposure stocks rebound, in a junk rally that comes
    with a strong market they keep lagging, and in ordinary weeks there is only a small static tilt. The rebound
    is an interaction between a stock-level exposure and two date-level states, and it has a threshold (it is only
    there when the unwind is large). A ridge regression on the same six cross-sectionally ranked features cannot
    use the date-level inputs at all, because they are constant across stocks on a date. It reduces to a static
    exposure tilt. Who pays: deleveraging quant funds who sell their common longs below fair value in unwind weeks;
    nobody pays a ridge for the static tilt beyond the known style premia. If ridge on the same features is as good,
    the unwind interaction is not what pays.'
