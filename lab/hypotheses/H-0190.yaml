falsification_criteria:
- 'Mechanism: in style-unwind weeks (composite spread 5-session return at or below -1.5 of its trailing sd), the
  side-adjusted 5-session abnormal return of the model''s top-fifth (+1) and bottom-fifth (-1) members does not
  exceed the 95th percentile of the time-shifted placebos, or its gross does not cover round-trip cost.'
- 'Mechanism: the latest of the three dev blocks is wrong-signed (K-0060 decay), or the effect at 10 sessions is
  larger than at 5 while 1 session is negative (slow factor drift rather than a concession that is absorbed in days).'
- Net Sharpe on dev below SPY_TR + 0.10, or the bootstrap bound of the Sharpe difference below zero.
- 'Neighbors of n_estimators 100 or top 0.2: fewer than 75 % beat SPY_TR.'
- 'A ridge regression on the same six features with the same schedule and book (framework ridge, a static exposure
  tilt) reaches the same or a higher net Sharpe: then the book is paid by static style premia (low volatility, quality),
  not by the unwind interaction.'
- Net Sharpe at doubled costs below SPY_TR.
notes: 'Family: reuses trend-follower-deleveraging (H-0169, H-0176) on purpose. The mechanism is the same, forced
  deleveraging of a crowded systematic strategy leaving a temporary price concession in what it trades. Here the
  strategy is the equity multi-factor quant book, not CTA trend. It is not filed under short-term-reversal because
  the trigger is a factor-level move of a portfolio of exposures, not a stock''s own past return; the Chair may
  merge it if they disagree. Why this is not a dead variant: H-0099 (date-level VIX and drawdown state on reversal
  features) and H-0178 (macro-factor trends x exposure) used states unrelated to who holds what. Here the state
  is the return of the crowded portfolio itself, which is the direct footprint of the deleveraging. No date literals:
  the 2007 episode is only the motivation and nothing in the rule refers to it. Forecasts (K-0120): composite unwind
  weeks at -1.5 sd should be roughly 5-8 % of weeks. After the warm-up (momentum needs 252 sessions, the first fit
  needs about two years) that is about 40-70 event dates in about 1000 scored weeks, with 200 marked members each,
  i.e. about 8000-14000 events. Central gross guess 30-60 bps per event at 5 sessions against a LIQ-500 round trip
  of about 12-13 bps (x2.5 before 2001-04). Pessimistic case: about zero, if unwinds and junk rallies are mixed
  and the model cannot separate them with few episodes. Independent evidence is the number of event weeks, not the
  events, so the placebo cloud will be wide (K-0026, K-0034). By leg (K-0207): the top-fifth side should carry most
  of it. Beta: the high-exposure side has lower beta than the junk side, and unwind weeks with a falling market
  are followed by rebounds that favour high beta, so the raw-peer confound (K-0074) works against the claim. Book
  arithmetic (K-0147): in ordinary weeks the top fifth is close to a static quality and low-volatility tilt with
  low turnover. The unwind weeks (about 3-4 a year) have to add the margin: at about +1 % excess for the held fifth
  per unwind week, about +3 %/y before costs. Turnover spikes in those weeks. The static tilt can pass G1 on its
  own (study 1: low-vol beat SPY in dev and failed in the holdout), and that is why the ridge criterion above is
  the decisive control; please run and report it if the framework can (K-0135). Not reported by G1 but asked for:
  the event average split by market state (market move above +1 sd, between, below -1 sd) to see whether junk-rally
  weeks go the other way. The likely death is the mechanism test: few independent unwind weeks and sign mixing.'
