falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return at 3 sessions is below the 95th percentile of the time-shifted placebos,
  or gross per event is below the round-trip cost: no tradable cut-link reversion in single-stock receipts.'
- 'Mechanism shape: if the 1-session horizon (home still closed) is as large as or larger than the 3-session horizon,
  the gain is generic next-day reversal of a large move, not re-anchoring at the reopening; the card is wrong even
  if the placebo bar is cleared.'
- 'Decay: the latest third of dev (about 2014-2020) has the wrong sign (K-0060).'
- 'Horizon: if the 10-session horizon is clearly larger than the 3-session one, the move is slow drift, not a reopening
  correction.'
- 'Feasibility tripwire (not a refutation): G0 counts fewer than 200 events or fewer than 30 event dates in dev,
  meaning the panel holds too few Asian receipts; then park the card instead of tuning z_min or the correlation
  threshold.'
- 'Strategy: net Sharpe below T-bills + 0.10 or below the absolute floor 0.5, or mean exposure below 0.20 (expected,
  see notes).'
- Neighbors z_min 0.0/0.5 and hold_days 2/5 do not beat T-bills.
notes: 'Brief fit: US single stocks, cross-sectional in LIQ-500, 3-session hold. Why this and not another 1-5 day
  sort: the knowledge base shows that large-cap short-horizon sorts in LIQ-500 stay below taker cost (K-0024, K-0053,
  K-0169) and that the only wrapper effect that cleared the placebo bar needed a cut arbitrage link (K-0183, H-0133).
  This card moves that claim to a new set of instruments (single-stock depositary receipts, never tested in the
  lab) instead of retuning H-0133 on the same ETFs. Family: etf-premium-arbitrage, because the mechanism is wrapper-versus-underlying
  parity with a cut link; its trials count there. The holiday dates are shared with H-0133, so a pass would be partly
  the same evidence; the instruments, flows and cost tier differ. Forecasts (written before any data, from rough
  counts, K-0098, K-0120): the number of Asian receipts in LIQ-500 is unknown to me (roughly 5-25 at a time, more
  Chinese and Hong Kong names after 2010); closures that span two or more US sessions occur about 1-2 times a year
  per exchange (Lunar New Year in HK, Korea, Taiwan, Singapore, Malaysia; Golden Week and New Year in Tokyo; Chuseok
  in Korea). Events after the z filter: 250-700, central 450; event dates 80-130 (about 5 a year), so the placebo
  cloud will be wide and its upper bar may lie above cost: a near miss would be a ''cannot tell'' (K-0026, K-0034).
  Round trip about 12 bps (LIQ-500 tier, K-0125). Gross per event at 3 sessions: pessimistic 0, central 20 bps,
  optimistic 40 bps; lead with the pessimistic case because the premise is one ETF pass (K-0181). Beta gap: receipts
  carry country beta, but both signs are marked by the move direction, so the placebo mean should be near zero (K-0074).
  Expected strategy death, stated in advance: the book is invested only around the few closure dates (about 15 sessions
  a year x up to 0.5 event gross plus hedge), so mean exposure will be about 0.05-0.10, below the 0.20 floor, whatever
  the slot size (K-0027, K-0098). The value of this card is the mechanism verdict, which the judge runs first and
  which is cheap; if the mechanism passes, the next step is not a bigger slot but an always-invested design (a tilt
  on an Asia-receipt sleeve against a matched benchmark), which needs a Chair decision on the benchmark. Feasibility:
  if the lab''s SEP panel excludes ADRs, the correlation rule assigns nothing and G0 shows zero events; that is
  a data fact to report to the owner, not evidence about the mechanism. No episode or instrument was chosen with
  hindsight: the rule assigns stocks only by trailing correlation, and every scheduled closure of the seven exchanges
  counts.'
