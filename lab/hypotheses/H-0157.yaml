id: H-0157
version: 1
title: Home-closure anchoring in Asian ADRs - LIQ-500, fade an ADR's excess move while its home exchange is shut
  for a multi-day holiday, net-hedged, hold 3 days
author_agent: scout
family: etf-premium-arbitrage
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: US-hours traders who demand liquidity in the receipt while the home market is shut (momentum and
    index-hedging flows, US investors reacting to US-session news or to the US market's move) and push it away from
    where local investors will price the ordinary shares; the liquidity providers who take the other side are paid
    when the home reopening re-anchors the price.
  why: 'A depositary receipt on a Japanese, Hong Kong, Korean, Taiwanese, Singaporean, Malaysian or Australian company
    is normally anchored every US morning by a fresh home-market session: the home price, set by the local investors
    who hold most of the float and most of the information, sets the ADR''s opening level, and depositary conversion
    (creating or cancelling receipts against ordinary shares) closes any gap. When the home exchange is shut for
    a holiday that spans two or more US sessions (Lunar New Year, Golden Week, Chuseok, the Japanese New Year),
    the ADR keeps trading in New York with no home price discovery and no conversion arbitrage: its price is set
    by US-hours traders who extrapolate from the US market and from their own flows. The claim is that this unanchored
    excess move partly overshoots and is corrected once the home exchange reopens and local investors set the price
    again. The lab saw exactly this shape in country ETFs (H-0133: little on the first still-closed session, most
    after the reopening, less by a week) and in closed-end funds (K-0103): wrapper deviations revert where the arbitrage
    link is cut (K-0183). This card asks whether the same cut-link reversion exists in single-stock wrappers, which
    are a different set of instruments with their own idiosyncratic flows and a far cheaper cost tier than thin
    closed-end funds.'
  why_not_arbitraged: The normal arbitrage (convert receipts into ordinary shares and sell them at home) is impossible
    while the home exchange is closed, so the only remaining arbitrageurs carry multi-day unhedgeable risk until
    the reopening; the events are few (a handful of holiday dates a year) and small in capacity, which keeps dedicated
    capital away.
signal:
  description: 'Inputs (all point-in-time, decision after the close of US session t, trades at the open of t+1):
    LIQ-500 members'' daily total returns r = (1+ret_co)(1+ret_oc)-1; the eight Asia-Pacific country ETFs below
    (signal only, never traded); the exchange_holidays_1d flags X.anchored and X.closed_next for the seven home
    exchanges XTKS, XHKG, XKRX, XTAI, XSES, XKLS, XASX. (1) Daily excess return of any instrument = its total return
    minus the equal-weight mean total return of the LIQ-500 members on that session (the same peer mean the G1 event
    study uses). (2) Home assignment, recomputed after the close of the first session of each calendar month and
    held until the next recomputation: for each LIQ-500 member, the Pearson correlation of its daily excess returns
    with each country ETF''s daily excess returns over the last 252 sessions (at least 200 sessions where both are
    valid; an ETF without 252 sessions of history is skipped). ETF-to-exchange map: EWJ->XTKS, EWH->XHKG, FXI->XHKG,
    EWY->XKRX, EWT->XTAI, EWS->XSES, EWM->XKLS, EWA->XASX. The stock is assigned to the exchange of its highest-correlation
    ETF if that correlation is >= 0.5, otherwise it is unassigned (the threshold is fixed, not a parameter). Data-blind:
    the rule never names a stock. (3) Event: at the close of session t, for an assigned stock j with home exchange
    X: X.anchored(t) = 0 (no home session since the previous US session) and X.closed_next(t) = 1 (no home session
    before the next US session either), and X.anchored(t-1) = 1 (t is the first unanchored session of this closure,
    so each closure gives at most one event per stock). Move m = excess return of j on session t. Scale s = standard
    deviation of j''s daily excess returns over the 63 sessions ending at t-1 (at least 50 valid). z = m / s. If
    |z| >= z_min the event fires with side = -sign(m) (fade the unanchored move). Uses only rows up to t. (4) Book
    (market-neutral): each event opens a slot of weight 0.20 x side in stock j at the open of t+1, held for hold_days
    sessions (closed at the open of t+1+hold_days), or closed at the first decision row on which j is no longer
    a LIQ-500 member or not tradable. Net hedge: every session the net sum of open slot weights is offset by an
    equal and opposite position split equally over the 50 LIQ-500 members with the highest 63-session median dollar
    volume that are unassigned to any Asian exchange and have no open slot. If the event slots'' gross exceeds 0.5,
    all slots are scaled down to 0.5 (gross with hedge <= 1.0). Cash otherwise. A missing ETF, flag or return raises
    an error rather than silently producing no event (K-0010).'
  params:
    hold_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    z_min:
      grid:
      - 0.0
      - 0.25
      - 0.5
      value: 0.25
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 stock whose daily excess returns correlate >= 0.5 with an Asia-Pacific country ETF (its assigned
    home exchange X) has, at the close of the first US session of a home closure that spans at least two US sessions
    (X.anchored = 0 today, X.anchored = 1 yesterday, X.closed_next = 1), an excess return of at least z_min = 0.25
    of its 63-session excess-return volatility in absolute value. Side = minus the sign of that unanchored excess
    move (the stock should give back the move once the home exchange reopens).
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 3
