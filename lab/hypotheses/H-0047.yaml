falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the release-day events is not above the 95th percentile
  of the time-shifted placebos.'
- 'Mechanism: gross abnormal return per event at 5 sessions is below the round-trip cost of the marked ETFs.'
- 'Mechanism: the 5-session abnormal return has the wrong sign in two of three dev sub-periods, or is negative in
  the latest third (decay kill condition, K-0060).'
- 'Mechanism shape: the 1-session abnormal return is positive but the 5- and 10-session returns are not larger (a
  quick partial move that is not the slow continuation the mechanism claims), or the 5-session sign is negative
  (release moves reverse: overreaction, not slow-moving capital).'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference to T-bills
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (top_k 2 or 4, hold_days 3 or 7) beat the T-bill bar, or net Sharpe
  at doubled costs falls below the bar.'
- 'Concentration: one dev third carries more than 60 % of the log return (for example only the 2008 crisis releases).'
notes: 'Brief: short horizon, cross-asset. The signal comes from the macro calendar (BLS and Fed schedules) and
  from the cross-asset reaction to the release, and the trade is a cross-section of 19 asset-class ETFs (equity
  regions, rate- and credit-sensitive sectors, Treasuries, credit, TIPS, metals, commodities, currencies). Family:
  a new name, post-macro-announcement-drift. It shares the release calendar with macro-announcement-premium (H-0042,
  H-0045) but makes a different claim. Those cards tested an unconditional premium of high beta or equity over bonds
  on or around release days, the same side every time. This card has no fixed side: its direction comes from each
  asset''s own release-day reaction, and the claim is continuation (underreaction / slow-moving capital), not risk
  compensation. Its mechanism class is the one behind the lab''s strongest mechanism result, the release-session
  reaction drift in stocks (K-0046), here applied to macro news and asset classes. If the Chair thinks it belongs
  in macro-announcement-premium or post-earnings-announcement-drift for trial counting, I accept that. Placebo:
  shifting the event set in time breaks the link between side and reaction, so the placebo mean should be near zero.
  Generic asset-class momentum would also lift the placebo, which makes the test stricter. Generic continuation
  after any large day (not only release days) is not separated by this test. The lab''s daily lead-lag and autocorrelation
  scan (study mrel) found no such continuation in liquid ETFs, which is why the claim is tied to dated release news.
  Why this is not a stress rebound (K-0056): the side is continuation, not reversal. If stress-period releases reverse,
  the card dies on the sub-period or sign criteria, and that is informative. Expected size against the bar (K-0053,
  K-0064): about 30 release days a year (some coincide), and with 5-session holds the book is invested roughly 55-65
  % of sessions. Turnover is about 60x gross a year. At liquid-ETF tiers that costs roughly 1.5-2 % a year, 3-4
  % at doubled costs. The book''s volatility when invested should be about 8-10 % a year, so a net Sharpe of 0.5
  needs a gross relative return of about 20 bps per cohort per 5 sessions (about 6 % a year gross). By Brooks-Katz-Lustig''s
  size estimates, a Treasury drift of a few bp of yield over a week is 20-50 bps on TLT, so the bar is within reach
  only if drift also shows up outside the bond ETFs. Weights: inverse-vol with a 0.25 cap so that low-vol ETFs (TIP,
  LQD, FXE, FXY) do not dominate. The sentinel limit per instrument is also 0.25. Point in time: the calendar dataset
  uses realized release dates. For the 2013 shutdown, the postponed CPI and jobs dates were not known in advance
  (catalog known_biases), a handful of events. Releases on NYSE holidays are counted on the next session by the
  dataset. All ETFs existed in dev: TLT and LQD from 2002-07, TIP 2003-12, EEM 2003-04, GLD 2004-11, FXE 2005-12,
  DBC 2006-02, SLV 2006-04, FXY 2007-02, UUP 2007-03, HYG 2007-04. Instruments join the ranking once they have 63
  sessions of history, so the early cross-section has about 11-13 ETFs and always at least 3 unmarked peers (K-0055).
  No ICE BofA FRED series are used (H-0043 found them empty). ETFs have no forward data, so G4 is the ceiling.'
