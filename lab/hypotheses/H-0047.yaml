mechanism:
  counterparty: 'Slow allocators who trade on the release news days later: retail bond and equity fund investors
    whose flows follow realized performance, allocation committees and rebalancers, and intermediaries who faded
    the first move and unwind it. They pay the continuation to whoever positions on the release-day close.'
  why: 'Scheduled US macro releases (CPI, the Employment Situation report, FOMC statements) are the main dated news
    events for whole asset classes, and they move them a lot on the day. Much of the capital that ends up absorbing
    that news moves slowly. Bond and equity fund investors react to the realized move with a lag of days to weeks.
    Brooks, Katz and Lustig document that fund outflows after rate increases gradually add supply, so long Treasury
    yields keep drifting in the direction of the FOMC surprise long after the announcement day. Multi-asset allocators
    rebalance on weekly or monthly committee schedules, and dealers who took the first order flow lay off inventory
    over several days. With slow-moving capital (Duffie 2010), the release-day move is only the first part of the
    adjustment: the asset classes that moved most on the release day (vol-standardized, relative to the others)
    should keep outperforming the ones that moved least over the following week, as the delayed allocation flows
    arrive. The signal comes from the macro calendar and from the cross-asset reaction it causes, and the trade
    is in the asset-class ETFs.'
  why_not_arbitraged: Positioning across asset classes after a macro release means carrying large macro risk for
    a small expected gain per event, about 30 events a year with a low Sharpe per event. Macro funds' capital is
    limited and drawdown-constrained, and mutual funds cannot front-run their own investors' flows. The effect is
    spread over many asset classes and several days, so no single desk is set up to harvest it.
signal:
  description: 'Inputs: daily total returns of the 19 ETFs (close-to-close return of session t = (1 + ret_co) *
    (1 + ret_oc) - 1, where ret_co is the close t-1 to open t return and ret_oc the open t to close t return) and
    the macro_release_calendar_1d key next_release_sessions. Release day: session t is a release day when next_release_sessions
    observed at the close of session t-1 equals 1 (the next CPI, Employment Situation or scheduled FOMC statement
    day is session t). The schedules are published in advance, so this is known at the close of t-1. Eligibility
    on release day t: an ETF is eligible if it has a valid close-to-close return on t and at least 63 valid daily
    returns in the sessions t-63 .. t-1. ETFs not yet listed or without data are ignored. Reaction score: z_j =
    r_j,t / sigma_j, where sigma_j is the standard deviation of the ETF''s daily close-to-close returns over sessions
    t-63 .. t-1 (the 63-day window is fixed, not a parameter). Cohort: after the close of each release day t, rank
    the eligible ETFs by z_j. Long leg = the top_k ETFs, short leg = the bottom_k ETFs. If fewer than 2 * top_k
    + 3 ETFs are eligible, no cohort is formed that day. Weights inside each leg are inverse-volatility: w_j = 0.5
    * (1 / sigma_j) / sum over the leg of (1 / sigma), positive for the long leg and negative for the short leg.
    Each weight is capped at 0.25 in absolute value and the capped excess stays in cash (not redistributed). A cohort
    has gross 1 or less and is dollar-neutral up to the cap. Holding: a cohort is entered at the open of session
    t+1 and held for hold_days sessions; it expires after the close of session t+hold_days and is exited at the
    next open. The book on any day is the simple average of the target weights of all cohorts active that day (an
    expired cohort drops out; with no active cohort the book is flat in cash). Netting across cohorts is allowed,
    so gross stays at or below 1. Weights are recomputed only when a cohort starts or expires (no daily drift re-equalising
    in between). Decisions are made after the US close of day t using data up to that close and are traded at the
    open of t+1.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    top_k:
      grid:
      - 2
      - 3
      - 4
      value: 3
  timeframes:
  - 1d
mechanism_test:
  event: 'On each scheduled US macro release session t (CPI, Employment Situation or scheduled FOMC statement day,
    known from next_release_sessions at the close of t-1 equal to 1), after the close of t: among the eligible universe
    ETFs, the top_k (=3) with the highest vol-standardized same-day return z = r_t / sigma_63 are marked with side
    +1 and the bottom_k (=3) with the lowest z with side -1. The other eligible ETFs on that date are unmarked and
    serve as peers (at least 3 by construction; dates with fewer eligible ETFs are not events). The mechanism says
    marked +1 ETFs outperform and -1 ETFs underperform the peers from the next open over the following sessions.'
