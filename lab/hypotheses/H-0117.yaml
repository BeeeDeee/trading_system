id: H-0117
version: 1
title: Buffered beta-neutral book on the linear liquidity-provision score - LIQ-300 high-volatility half, weekly,
  ridge 5-day score, enter top/bottom 15 %, exit past 40 %
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 300
mechanism:
  counterparty: Liquidity demanders in volatile large caps who sell (buy) with market orders after a move and accept
    a price concession for immediacy; on the short side, buyers chasing the recent rise.
  why: 'Investors who need to trade quickly in volatile large caps (fund outflows, de-risking, stop-outs, news-free
    rebalancing) push prices away from value with market orders; liquidity providers who absorb that flow ask for
    a temporary concession that they earn back over the following days as the price reverts (Nagel 2012: the reversal
    return is the price of liquidity provision and is larger when volatility is high). The lab already found this
    concession in the high-volatility half of LIQ-300: a ridge score on recent intraday, overnight, prior-week and
    volume information gave weekly entries far above the same-stock placebo cloud, gross above round-trip cost,
    the right sign in every third and a build-then-ease shape over about a week (H-0115, K-0155). Its book failed
    only the absolute net Sharpe floor because weekly rebuilding of both legs paid a lot of spread and the short
    leg lost money, plausibly through a beta gap between legs (K-0074). This card keeps the claim and the score
    and changes only the two things the Librarian named: a rank buffer so that names whose concession is still building
    are not sold and bought back, and leg sizes that make the book beta-neutral.'
  why_not_arbitraged: The concession is small per name and needs a diversified two-sided book that turns over every
    week, so it pays only to whoever trades at low cost; market makers and statistical-arbitrage desks take most
    of it, and their capital is scarcest in the volatile names and periods where the concession is largest. A taker
    can keep part of it only by trading less, which is exactly what this card tests.
signal:
  description: 'Decisions after the close of the first trading session of each week (day t), trades at the open
    of t+1. Eligible set on day t: point-in-time LIQ-300 members with a complete feature vector whose 63-day realized
    volatility of daily total returns is at or above the median of that day''s members with a valid volatility (the
    high-volatility half). Features per stock and date, computed only from data up to the close of t and z-scored
    across the eligible set of that date by the framework helper: (1) sum of the last 5 intraday (open-to-close,
    ret_oc) returns minus the eligible-set mean of the same sum; (2) sum of the last 5 overnight (close-to-open,
    ret_co) returns minus the eligible-set mean; (3) the prior-week total return (sessions t-9 to t-5) minus the
    eligible-set mean; (4) log of the 5-day mean dollar volume divided by the 63-day mean dollar volume; (5) log
    of the 63-day realized volatility. Model: framework ridge (`lab.framework.ml.walk_forward`, model ridge, parameter
    alpha), label = total return from the next open to the open 5 sessions later, ranked across the eligible set
    on each date (framework label and purge), expanding window, refit every 63 rows, trained and scored on eligible
    rows only, with non-members masked per row (no ever-member column set, K-0134); before the first fit the book
    is flat. Book (hand-written rule after `score_weights`): rank the scores of the eligible set on day t into percentiles.
    Long leg: keep every currently held long name that is still eligible and whose percentile is at or above 1 -
    exit_frac; add every eligible name with percentile at or above 1 - entry_frac. Short leg: the mirror at the
    bottom (keep while percentile at or below exit_frac, add at or below entry_frac). A name never sits in both
    legs (the new side wins; impossible when entry_frac < 0.5). Names that leave the LIQ-300 membership or the eligible
    set are sold at the next open. Equal weight inside each leg. Beta-neutral leg sizes: beta of each stock = slope
    of its daily total return on the equal-weight mean daily total return of that day''s LIQ-300 members over the
    last 252 sessions (at least 126 valid days, else beta = 1), leg beta = mean beta of its names; long gross =
    b_short / (b_long + b_short), short gross = b_long / (b_long + b_short), each clipped to [0.3, 0.7] and renormalized
    to a total gross of 1.0. Fewer than 5 names in either leg means flat that week. Weights are held unchanged between
    weekly decisions.'
  params:
    alpha:
      grid:
      - 1.0
      - 10.0
      - 100.0
      value: 10.0
    entry_frac:
      grid:
      - 0.1
      - 0.15
      - 0.2
      value: 0.15
    exit_frac:
      grid:
      - 0.3
      - 0.4
      - 0.5
      value: 0.4
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At a weekly decision, an eligible stock newly enters the long leg (side +1: score percentile at or above
    1 - entry_frac and not held long before) or newly enters the short leg (side -1: percentile at or below entry_frac
    and not held short before); continuing holdings are not events.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 5-day sum of intraday (open-to-close) returns, demeaned across the eligible set (who just sold or bought during
    the session, the order-flow imbalance the concession pays for)
  - 5-day sum of overnight (close-to-open) returns, demeaned (news-like gaps, which revert less than session moves;
    lets the model weight the two parts differently)
  - prior-week total return, sessions t-9 to t-5, demeaned (the older part of the move, where the concession should
    be partly earned back already)
  - log ratio of 5-day to 63-day mean dollar volume (whether the move came with heavy forced trading or on thin
    volume)
  - log 63-day realized volatility within the high-volatility half (size of the concession scales with volatility
    per Nagel 2012)
  horizon_days: 5
  model: ridge
  retrain_every_days: 63
  why_not_linear: 'Deliberately linear. The brief asks for a learned card, and the instructions say to propose the
    linear card when no interaction can be named that a ridge would miss. The lab''s evidence is that the interaction
    claims on this information have failed: a gbm with news features stayed under cost (H-0094), a TCN on the same
    kind of paths was wrong-signed against a ridge (H-0103), and a gbm-versus-ridge disagreement added nothing on
    flow days (H-0112); only the ridge (H-0115) cleared the placebo bar and cost (K-0142, K-0155). The claim here
    is an additive concession that is already selected by restricting the universe to the volatile half. The open
    question is not the score but whether a book that trades less and carries no beta gap can keep it after costs,
    so the model is held fixed and only the book changes. A tree on the same five features would be a separate trial
    in this family and is not proposed.'
data_requirements:
- dataset: sharadar_sep
  description: US stocks, point-in-time LIQ-300 membership; total returns for features, label and P&L, dollar volume
    for the volume feature.
  fields:
  - ret_co
  - ret_oc
  - dollar_volume
  frequency: 1d
holding_period:
  rebalance: weekly
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Nagel (2012) Evaporating Liquidity, Review of Financial Studies
  year: 2012
falsification_criteria:
- Net Sharpe on dev below 0.5, or not above the T-bill Sharpe + 0.10, or the bootstrap bound of the difference below
  zero (G1).
- Gross Sharpe of the book (G1 gross/net split) below 0.5, meaning that the buffered beta-neutral book has no tradable
  concession even before costs and the H-0115 pass does not survive leg persistence.
- The mechanism event (new entries into either leg at a weekly decision) does not beat the 95th percentile of the
  time-shifted placebos at 5 sessions, or its gross per event is below the round-trip cost.
- The latest third of dev has a negative event-study mean (the decay of K-0060), even if the pooled test passes.
- Fewer than 75 % of the entry_frac, exit_frac and alpha neighbors beat T-bills by the required margin, or the median
  neighbor Sharpe is under 0.7 of the primary (G2).
- Net Sharpe at doubled costs does not beat T-bills (G2 cost stress).
- One of the three dev sub-periods carries more than 60 % of the log return (G2), which would repeat the early-era
  pattern of study 5 and H-0007.
notes: 'Why this is not a near-copy of H-0115: the score, features, universe tier and label are the same on purpose
  (so the mechanism test reproduces a known pass and is not a new search), while the book changes in the two ways
  the H-0115 lesson and K-0155 name as the next card: leg persistence by a rank buffer argued from the build-then-ease
  shape over the week (a name entered in the top 15 % stays while it is in the top 40 %, so a concession that is
  still building is not sold and bought back), and beta-neutral leg sizes, because the H-0115 short leg lost money
  and K-0074 says a beta gap between legs tests market direction. Holding period: every position is decided anew
  each week for the next 5 sessions, which is what the 5-day label predicts (typical_days 5 = label horizon); because
  of the buffer a name can be re-decided into the same leg, so a stock''s run in a leg averages about 8-12 sessions,
  made of consecutive 5-session decisions. I did not see the exact H-0115 feature windows or alpha; the windows
  here follow its lesson text (recent intraday and overnight moves, prior week, volume shock, volatility), and alpha
  10 is a mid value on z-scored features with tens of thousands of rows, where ridge shrinkage barely matters. Arithmetic
  (K-0098, K-0120, K-0159). Eligible set about 150 names; entry 15 % about 22 per leg, the buffer gives legs of
  about 30-45 names. New leg entries per week about 15-25 in total, so about 1050 weekly decisions from about 2000
  give 15000-25000 events on about 1000 dates. Round trip: half-spread 3 bps for ranks up to 200 and 6 bps for 200-300
  (x2.5 before 2001-04); the volatile half leans toward the lower ranks, so about 8-11 bps round trip after 2001.
  Mean exposure about 1.0 gross (always invested once the first model is fit). Turnover: without a buffer about
  85-95 % of each leg is replaced weekly; with this buffer I expect 50-65 %, which would cut cost drag from about
  4-5 % to about 2.5-3.5 % a year. Gross Sharpe forecast: central 0.7 (H-0115 gross cleared 0.5, beta neutrality
  should remove some short-leg loss), pessimistic 0.35, and about 0 if the H-0115 pass was the volatile half''s
  market exposure; net central 0.4, which is under the floor, so the most likely death is the same absolute Sharpe
  floor at G1, now with the cost drag and the beta gap removed as excuses. Even a G1/G2 pass faces the family''s
  large trial count at G3 (study 5 alone has 993 configurations), and US stocks have no forward data, so G4 is the
  ceiling. What the lab learns either way: whether the only clean liquidity-provision pass in liquid stocks can
  become a taker strategy when turnover and beta are handled, or whether the family should be closed for taker books
  on daily US bars.'
