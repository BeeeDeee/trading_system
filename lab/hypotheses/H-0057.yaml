falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of selected ETFs at 42 sessions is not above the 95th percentile
  of the time-shifted placebos, or has the wrong sign in two of the three dev sub-periods.'
- 'Mechanism: the latest third of the dev period has a negative side-adjusted abnormal return at 42 sessions (decay
  or regime change, K-0060).'
- 'Mechanism: gross abnormal return per event at 42 sessions below the round-trip cost of the ETFs traded.'
- 'Mechanism shape: the abnormal return at 5 or 21 sessions is of the opposite sign to the one at 42 sessions (a
  short-term flow reversal, the liquidity premium of Kang, Rouwenhorst, Tang, would dominate instead of a slow insurance
  premium).'
- 'Strategy: net Sharpe on dev below 0.5 or not above the T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors of z_window_weeks 156 and avg_reports 4 beat the benchmark, or net
  Sharpe at doubled costs below the benchmark.'
- 'Publication: post-2013 Sharpe excess less than half of the pre-2013 excess.'
notes: 'Brief fit: medium horizon (monthly rebalance, positions typically held about a quarter, primary horizon
  42 sessions, i.e. two monthly holding steps; the schema caps the gate horizon at 60, and 60 is reported descriptively)
  and cross-asset in the brief''s sense: the signal is the futures market''s trader positioning (CFTC), the trades
  are ETFs in other markets (physical metal trusts, currency deposit trusts, futures-holding commodity funds), across
  two asset classes. Relation to H-0051 (speculator-flow-liquidity-provision, BLOCKED_DATA at last read): same CFTC
  data and almost the same ETF list, but the opposite claim at a different horizon. H-0051 fades weekly CHANGES
  in speculator positions over 5 days (speculators demand liquidity and pay for it, the short-term premium of Kang,
  Rouwenhorst, Tang 2020). This card follows the LEVEL of speculator positioning relative to its own history over
  months (speculators supply insurance to hedgers and get paid, the hedging-pressure premium). KRT document these
  as two distinct premia of opposite sign, so I filed a separate family; if the Chair judges them one mechanism,
  fold the trials together. The 21-versus-63-session falsification criterion is there to keep the two apart. Honest
  prior: KRT find the level-based hedging premium much weaker than the flow premium after controls, so this can
  fail. Differences from earlier dead ideas: not trend (study 2, H-0003) - the sort is within past-return halves
  so the legs are not momentum legs; not a lead-lag of prices (mrel, K-0072) - the signal is who holds the risk,
  not where a price moved first; why information is slow here: it is not information, it is a risk premium paid
  by hedgers who must hedge. The z-score against each market''s own history is deliberate: a time-shifted placebo
  keeps the same ETFs, so a static structural tilt (always long gold, always short natgas) would earn nothing against
  the placebo; only the time variation of hedging pressure is tested, which is the claim. Expected numbers (K-0071,
  K-0064): published hedging-pressure long/short spreads in futures are of the order of 5-10 %/y; my guess is a
  side-adjusted gross per event of about 0.4-1.0 % over 42 sessions, against an ETF round trip of roughly 0.1-0.4
  % (several thin ETFs: CANE, SOYB, WEAT, CPER, UGA). The placebo bar at a 42-session horizon is wide with about
  165 monthly dates and 4-8 events per date (about 1000 events from 2007), so a ''cannot tell'' near miss is the
  most likely mechanism outcome, and the absolute Sharpe bar of 0.5 vs T-bills the most likely strategy death: half
  the markets are G10 currencies, where the effect is smaller than in commodities. Data and timing: COT values are
  stamped on the computed public release date (Friday 15:30 ET), clock us_close, so a decision at that session''s
  close uses only published data; shutdown weeks are missing and must not be filled. The 18 CFTC codes in the catalog
  map one-to-one to the 18 ETFs. Coverage: about 10 ETFs from 2007, 14 from 2010, 18 from late 2011; the 156-report
  window needs COT from 2004, so the first decision is in early 2007. Biases that would flatter the result: ETF
  short borrow fees (UNG, USO, thin commodity funds) are not modelled; ETF tracking error to the futures is part
  of the traded return, which is correct. No mechanism event depends on a date or episode. Expected events: about
  4 per date until 2011 and 8 after, about 165 dates, about 1000 marked events in dev.'
