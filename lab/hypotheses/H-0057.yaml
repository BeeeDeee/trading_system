mechanism:
  counterparty: Commercial hedgers whose hedge is mandated by their business and risk policy (a producer locking
    in output prices, an exporter hedging receivables) and who accept a negative expected return on the hedge as
    an insurance cost; also passive long-only commodity ETF holders who roll into contango regardless of positioning.
  why: 'Keynes-Hicks normal backwardation, in its hedging-pressure form (de Roon, Nijman, Veld 2000; Basu, Miffre
    2013): commercial hedgers (producers, processors, exporters, corporates hedging FX receivables) pay an insurance
    premium to the speculators who take the other side of their net hedge. When hedgers are unusually net short
    in a market, speculators must be unusually net long to absorb it and are paid through a futures price set below
    the expected future spot price, which then drifts up over the following months (positive roll and drift). The
    reverse holds when hedgers are unusually net long. The CFTC legacy report shows this imbalance weekly as the
    non-commercial net position. The signal comes from the futures market (positioning), the trade is in a different
    market: ETFs that hold the futures (USO, UNG, UGA, CORN, WEAT, SOYB, CPER, CANE), physical metal (GLD, SLV,
    PPLT, PALL) or foreign-currency deposits (FXE, FXY, FXB, FXA, FXC, FXF). For futures-holding ETFs the premium
    also shows up directly as roll yield, which is large in these products; de Roon et al. report that hedging pressure
    also explains returns of the underlying, which is what the physical and deposit ETFs earn.'
  why_not_arbitraged: 'It is a compensation for bearing commodity and currency price risk, not a free lunch: speculative
    capital is limited and risk-averse, the premium rises with volatility (Basu, Miffre 2013), and holding it means
    sitting on volatile, crash-prone single-commodity positions for months. Many commodity ETFs are thin and costly
    to short, and institutional mandates rarely allow a long/short book across commodity and currency ETFs.'
signal:
  description: 'Inputs: for each ETF its CFTC market code (GLD 088691, SLV 084691, USO 067651, UNG 023651, UGA 111659,
    CORN 002602, WEAT 001602, SOYB 005602, CPER 085692, PPLT 076651, PALL 075651, CANE 080732, FXE 099741, FXY 097741,
    FXB 096742, FXA 232741, FXC 090741, FXF 092741; for all six currency futures a long position is long the foreign
    currency, the same direction as the ETF). From cftc_cot_legacy_1d, each report r gives S_r = (nc_long - nc_short)
    / open_interest, stamped on its public release date and usable from the close of that XNYS session (if the release
    day is not a session, from the first session after it). Score of market j at a decision date: P = mean of S
    over the last avg_reports reports released on or before the decision date; z = (P - mean(S)) / std(S), where
    mean and std are over the last z_window_weeks reports released on or before the decision date (require at least
    75 % of that many reports; shutdown gap weeks are missing, never filled). The z-score is relative to the market''s
    own history, so structural differences in how traders are classified across markets do not enter the ranking.
    Trend neutralization: speculators follow trends, so z partly restates past price moves. At each decision date
    take every eligible ETF''s total return over the last 63 sessions and split the eligible set at the median into
    a high-return half and a low-return half (if the count is odd, the middle ETF goes to the low half). Within
    each half rank by z: long the k highest-z ETFs and short the k lowest-z ETFs, with k = 1 when the half has fewer
    than 8 ETFs and k = 2 when it has 8 or more (fixed rule, not tuned; it always leaves at least 3 unmarked ETFs
    per date). Weights: within the long set weights proportional to 1 / (63-session realized volatility of daily
    total returns), scaled to sum to +0.5; same for the short set, scaled to sum to -0.5. Dollar-neutral, gross
    1.0. Eligibility: an ETF is eligible at a decision date only if it has at least 63 sessions of price history,
    traded on the decision day, and its market has a valid z (latest report at most 21 calendar days old). If fewer
    than 8 ETFs are eligible, hold no positions that month. An ETF that is not yet listed is simply not eligible
    (the COT history of its market may be older than the ETF; that is allowed, the z-score uses only reports released
    by then). Schedule: decisions once a month, after the close of the first XNYS session of the calendar month
    on which a new COT report has been released (normally the first Friday); trades at the next session''s open.
    Positions are held unchanged until the next monthly decision. If no new report is released in a calendar month
    (shutdown), positions are kept and no rebalance is done.'
