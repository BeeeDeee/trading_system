mechanism_test:
  event: 'At each monthly decision date, an ETF is selected into the long set (side +1: its market''s speculator
    net position is unusually long relative to its own history, within its past-63-session-return half) or into
    the short set (side -1: unusually short). Every selected ETF on every monthly decision date is one event; the
    ETFs not selected on that date (always at least 3) are the unmarked peers.'
