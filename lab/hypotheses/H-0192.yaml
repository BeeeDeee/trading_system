falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism (decay, K-0060): the latest third of the dev events (about 2015-2020) has the wrong sign.'
- 'Mechanism (anchoring adds nothing): the 5-session event average is not larger than the all-large-reaction average
  the lab measured for plain reaction drift (H-0028/H-0031/H-0033, no anchor condition); then nearness to the anchor
  only re-selects plain post-earnings drift (Librarian comparison, the judge cannot split it).'
- 'Mechanism (shape): the 1-session abnormal return is at or below zero and the average only appears at 10-21 sessions,
  the slow identity-drift shape of H-0083/H-0136, not under-reaction at the anchor.'
- 'Strategy: net Sharpe on dev below SPY_TR + 0.10, or the bootstrap bound of the Sharpe difference not above zero.'
- 'Robustness: fewer than 75 % of the neighbours (z_min 1.5/2.5, band 0.02/0.05 and their combinations) beat SPY_TR,
  or the book does not beat SPY_TR at doubled costs, or it does not beat 95 % of random-timed tilts with the same
  turnover.'
notes: 'Why this is not a refile. K-0184 and the H-0083 lesson close plain near-high sorts (they pick persistent
  winners) and explicitly leave open ''nearness to the high as a conditioner on a dated own-price event''; this
  is that card, a plain rule with no learner (K-0143 closed learned reaction conditioners). The events are a subset
  of the release reactions used by the post-earnings-announcement-drift family (H-0028, H-0031, H-0033), so the
  Chair may also count the trial there; I filed it under the anchoring mechanism because the claim under test is
  the anchor, and both sides are marked so the placebo mean should sit near zero (K-0063) and the same-stock placebo
  removes winner identity (K-0025). Brief fit: US single stocks, cross-sectional, 5-session hold, mechanism test
  declared. Timing: the reaction session is known at its close (catalog), the trade is at the next open, so the
  release-session jump itself is never earned. Data start 2004-08-23 (first 8-K Item 2.02 row, K-0091); the 252-session
  anchor needs a year of warm-up, so events start about 2005-08 while the core is invested from the start; the first
  third of dev therefore holds about four years of events, not none. The 2004 reference year falls before the first
  event, so the publication-decay check has no pre-period; the latest third and the holdout are the out-of-publication
  evidence. Forecasts (K-0120 says Scout forecasts run high, so ranges): about 1,700 S&P releases a year with 8-K
  coverage, roughly 40 % with |z| >= 2, of which about a quarter to a third close near the relevant anchor: 1,500-3,500
  events in dev (about 55-60 % positive), several hundred event dates. Round trip 6-12 bps (S&P members are liquidity
  ranks <= 500). Plausible gross 0.3-0.8 % per event over 5 sessions against a placebo bar I expect near 0.25-0.35
  %. Book arithmetic (stated in advance, K-0083 asks for the annual gain): about 100-150 positive events a year
  x 5 sessions x 5 % overweight gives an average overweight sleeve of about 7-10 % of the book (the 50 % cap binds
  only in peak weeks). At 0.5 % gross per event that is about 1.8-2.5 % a year before costs and about 0.4 % of costs
  (sleeve turnover plus pro-rata funding), i.e. roughly +1.5-2 %/y over a core built to track SPY, a Sharpe gain
  of about 0.08-0.12 at SPY-like volatility: the 0.10 margin is reachable only if gross per event is at the upper
  half of the range. Zeroing negative events removes only core weight (about 0.2 % each), so the negative side tests
  the mechanism but adds little to the book. Core design addresses K-0153 / H-0113: the core is a split-safe cap-weighted
  proxy of the same S&P 500 members as SPY, so the core alone should track SPY closely and the margin over SPY should
  be the tilt; a core-only run (tilt_w = 0) is the control the owner can run to verify that, and if the core alone
  already beats SPY by a visible margin the result is not evidence for the tilt. Most likely death: G1 strategy
  margin under +0.10 Sharpe like H-0033 (thin sleeve), or the mechanism test passing at the level of plain reaction
  drift with no visible anchoring increment, or a latest-third fade.'
