id: H-0192
version: 1
title: Earnings news at the 52-week anchor - S&P 500 cap-weighted core, 5-day overweight after large positive 8-K
  reactions closing near the 52-week high, zero weight at the low
author_agent: scout
family: 52-week-high-anchoring
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Holders and short-horizon traders who sell at the 52-week high (profit-taking at a salient level,
    'resistance' sellers, disposition sellers whose paper gain peaks there) after good news, and bargain or 'support'
    buyers who step in at the 52-week low after bad news. They supply liquidity at the anchor at a price that does
    not yet reflect the release, and the drift is the transfer from them to holders of the news side.
  why: 'Investors use the 52-week high (and low) as a reference point when they judge how far news should move a
    price (George and Hwang 2004). When an earnings release pushes a stock up to or through its 52-week high, holders
    and traders who anchor on that level treat it as a ceiling and sell into the move, so the price under-reacts
    to the good news and keeps drifting up over the following sessions as the information is absorbed; the mirror
    holds when bad news pushes a stock down to its 52-week low (anchored ''support'' buyers slow the fall). George,
    Hwang and Li report that post-earnings drift is concentrated in exactly these cases. The lab''s own record fits
    the first half of the claim and not yet the second: the plain release-session reaction drift clears the same-stock
    placebo over the first week (H-0028, H-0031, H-0033; K-0046, K-0185), while nearness to the high WITHOUT a dated
    news event only picks persistent winners (H-0011, H-0083; K-0184). This card tests the combination the Librarian
    named as untested: nearness to the anchor as a conditioner on a dated own-price event (open question of H-0083,
    K-0184).'
  why_not_arbitraged: The drift per event is a fraction of a percent to about one percent over a week against several
    percent of idiosyncratic volatility right after a release, so a single-name arbitrageur carries a lot of risk
    per unit of edge; events bunch in four earnings seasons, so capacity is limited and the book is part-time; and
    in large caps the effect is small enough that it survives as a tilt for long-only managers rather than as a
    stand-alone arbitrage (the lab's market-neutral reaction books lost to T-bills, H-0028, H-0031).
signal:
  description: 'Universe: point-in-time S&P 500 members (sp500). All quantities use data up to the close of session
    t; trades happen at the open of t+1. (1) Total-return index per stock: TRI = cumulative product of (1+ret_co)(1+ret_oc),
    so splits and dividends do not create false highs or lows (close_u is never used for the anchor). Daily total
    return r_t = (1+ret_co_t)(1+ret_oc_t) - 1. (2) Release reaction: on a session t with ea_reaction_day = 1 (sec_8k_item202,
    known at the close of t), residual e_t = r_t minus the cross-sectional median r_t of members with data; sigma
    = standard deviation of the stock''s daily residuals (same definition) over sessions t-63..t-1, at least 40
    valid; z = e_t / sigma. (3) Anchor: H = max of TRI over sessions t-252..t-1 and L = min over the same window
    (at least 240 valid sessions, otherwise no event). Near-high if TRI_t >= (1 - band) * H; near-low if TRI_t <=
    (1 + band) * L. (4) Events: POSITIVE event if z >= z_min and near-high; NEGATIVE event if z <= -z_min and near-low.
    Book (long-only, always invested): core = S&P 500 members weighted by a point-in-time market-cap proxy, cap_i,t
    = sf1_arq_marketcap (value frozen at its filing date f) * TRI_t / TRI_f, i.e. the filing-date market cap moved
    by the stock''s own total return since that filing (split-safe; never shares x close_u, K-0168); a member without
    a marketcap value gets the median cap of members that have one. Core weights c_i = cap_i / sum(cap), recomputed
    on the first session of each month and otherwise left to drift. Tilt: each POSITIVE event adds an overweight
    of tilt_w = 5 % of the book to that stock, entered at the open of t+1 and removed at the open of t+6 (5 sessions);
    each NEGATIVE event sets that stock''s weight to 0 for the same 5 sessions. The sum of open overweights is capped
    at 50 % of the book (if more, every open overweight is scaled down equally). Final weight of every other member
    = c_i * (1 - sum of overweights - sum of core weights of zeroed names) / (sum of c over the non-event names),
    so weights sum to 1, gross = 1, no shorts. A stock that leaves the S&P 500 during its 5 sessions is sold at
    the next open (engine rule); a missing return on t means no event. Each release gives at most one event.'
  params:
    band:
      grid:
      - 0.02
      - 0.03
      - 0.05
      value: 0.03
    z_min:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
  - 1y
mechanism_test:
  event: After the close of an 8-K Item 2.02 reaction session t, an S&P 500 member whose standardized release-session
    residual return z (own return minus the members' median, divided by the stock's 63-session residual volatility)
    is at least z_min AND whose total-return index closes within band of, or above, its prior 252-session high (side
    +1); or whose z is at most -z_min AND whose total-return index closes within band of, or below, its prior 252-session
    low (side -1). Primary horizon 5 sessions from the open of t+1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
