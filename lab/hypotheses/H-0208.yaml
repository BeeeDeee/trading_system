market_exposure: market_neutral
references:
- cite: 'Mou, Y. Limits to Arbitrage and Commodity Index Investment: Front-Running the Goldman Roll. Working paper,
    SSRN 1716841'
  url: https://papers.ssrn.com/abstract=1716841
- cite: Bessembinder, H., Carrion, A., Tuttle, L., Venkataraman, K. (2016) Predatory or sunshine trading? Evidence
    from crude oil ETF rolls. Journal of Financial Economics 121(1), 142-166
  year: 2016
falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the month-start event at 5 sessions is not above the 95th percentile
  of the 200 time-shifted placebos of the same funds. The roll pressure is then not visible beyond the spread''s
  unconditional contango and beta drift.'
- 'Mechanism: gross abnormal return per event at 5 sessions below the round-trip cost of the funds traded (USL and
  DBO are the thin legs). The pressure then exists at most below a taker''s cost.'
- 'Mechanism: fewer than 2 of 3 dev blocks with the predicted sign, or the latest third of dev events wrong-signed.
  The latter reads as roll pressure arbitraged away (K-0060), not as a timing error.'
- 'Mechanism shape: if the 1-session abnormal return carries all of the 5-session average and the 3- and 5-session
  values are not larger, the effect is a month-turn move of the first session, not a pressure that builds toward
  the roll.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill benchmark + 0.10, or the stationary-bootstrap bound
  of the Sharpe difference below zero.'
- 'Robustness: hold_sessions 3 or 7 does not beat T-bills, net Sharpe at 2x costs below the benchmark, or more than
  60 % of the log return from one dev block (a single super-contango episode).'
notes: 'Brief fit. The brief asks for cross-asset signals at a 1-5 day hold. The lab''s daily cross-asset routes
  are closed: daily lead-lag between liquid markets (mrel, research 7), stress rebounds across classes (K-0084,
  K-0209), macro-calendar premia (K-0070), VIX and real-yield states into crypto (K-0179, K-0197), rate and credit
  shocks into stocks, sectors and currencies (K-0204, K-0212, K-0248), implied vol into ETFs (K-0208). FRED signals
  arrive one day late for crypto cards (clock next_morning). The closest fit with a real counterparty is a flow
  from one investor market into another: commodity index allocators'' scheduled roll moves the crude futures curve,
  and the trade is in ETFs that hold that curve. The signal is the index provider''s public roll schedule, not a
  price of the traded market. So this is a closest fit, not a literal ''signal in market A, trade in market B''.
  Why it differs from dead lines. K-0024 and K-0240 found that only mandated, scheduled flows cleared placebos in
  this lab; this is one, and the lab has never tested it. The CFTC cards (K-0090) used weekly positions published
  three days late, which say nothing about timing; here the dates are exact and public. The Treasury-flow cards
  (K-0210) failed partly because a few basis points of pressure in specific bonds do not reach a diversified ETF
  basket; here USO holds exactly the contract being sold, and USL and DBO hold the contracts being bought or no
  rolled contract at all. Design choices. Calendar only, one parameter, round values. The hold length follows Mou''s
  5-day front-running variant and ends inside the published roll window. The legs are sized to the trailing beta
  so the book does not bet on the oil price (the front month is more volatile than the strip, so an equal-dollar
  short would be a net short on oil). The placebo mean should be positive (USO loses to the strip in contango on
  any date, and oil fell over much of the dev window), which is why the event has to beat placebos of the same funds,
  not zero. Expected numbers (forecast, written down per K-0120). About 155 month-start dates from 2008 to 2020,
  three funds each, so about 460 events on about 155 dates. Mean gross exposure about 5/21 = 24 % (hold_sessions
  3: 14 %, 7: 33 %). About 465 position entries and 310 rebalancing dates. The beta-neutral spread probably has
  0.3-0.4 % daily volatility, so 0.7-0.9 % per window. Round trip per window: USO is in the most liquid tier (a
  few bps); USL and DBO are thin funds whose round trip could be 10-30 bps each, about 10-20 bps for the book. For
  a pass the pressure must be about 25 bps or more per window; Mou''s pre-2010 crude examples were larger, but later
  years are expected to be smaller. Likely deaths, in order: (1) placebo percentile, because 155 dates give a wide
  cloud and sunshine trading may have absorbed the pressure. (2) Cost, because the deferred funds are thin. (3)
  Latest-third decay. (4) One episode: the super-contango month in which USO changed its holdings could dominate
  a block. G2 sub-periods would show it. There is no fix in the rule, because excluding it would need a date. Known
  limits. ETF holdings and roll dates are taken from the funds'' published methods, not observed in the data. USO''s
  own roll starts inside the window, so later sessions of a 7-session hold measure a fund that is partly rolled.
  DBO in backwardation can hold a near contract, which dilutes the contrast. ETF short borrow cost for USO is not
  modeled by the engine. No forward data for ETFs, so G4 is the ceiling. Natural gas (UNG against UNL) and Brent
  (BNO) are left out on purpose: UNL is too thin, and the Brent-WTI basis adds noise to the contrast.'
