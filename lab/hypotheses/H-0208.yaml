- dataset: sharadar_sfp
  description: USO (front-month WTI fund), USL (12-month WTI strip fund), DBO (optimum-yield WTI fund); USL lists
    last (December 2007), so the period starts in 2008.
  fields:
  - ret_co
  - ret_oc
  frequency: 1d
  period:
