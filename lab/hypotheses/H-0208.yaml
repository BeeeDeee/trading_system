id: H-0208
version: 1
title: Commodity-index roll pressure in crude ETFs - short front-month USO vs deferred USL/DBO, oil-beta-neutral,
  month start into the GSCI roll, 5 sessions
author_agent: scout
family: commodity-index-roll-pressure
asset_classes:
- us_etf
universe:
  instruments:
  - USO
  - USL
  - DBO
  kind: instruments
mechanism:
  counterparty: Index investors and swap dealers hedging index swaps, who roll mechanically on the schedule and
    accept the price impact; USO holders, whose fund also rolls on a published schedule. They keep doing it because
    the index rules and fund prospectuses fix the dates and the cost is spread thinly over many holders.
  why: 'Long-only commodity index money (pensions, endowments, total-return swaps written on the S&P GSCI and similar
    indices, index ETFs) must sell the expiring front WTI contract and buy the next one on a published schedule:
    the S&P GSCI rolls 20 % a day from the 5th to the 9th business day of each month. The order is large, known
    in advance and price-insensitive. Arbitrageurs who know it sell the front contract and buy the second ahead
    of the window and unwind into the index sellers (Mou, front-running the Goldman roll), so the front-minus-deferred
    spread is pushed down in the days before and at the start of the roll. A fund that holds the front contract
    (USO, which holds the front month until its own roll later in the window) loses against funds that hold the
    deferred curve (USL, twelve consecutive months; DBO, the optimum-yield contract, usually a deferred one). The
    claim is about a flow from one investor market (index allocators'' commodity exposure) into the futures curve,
    read through ETFs that hold exactly the contracts being rolled.'
  why_not_arbitraged: It is arbitraged, which is the mechanism. The remaining question is whether arbitrage capital
    is now large enough to absorb the pressure. Calendar-spread trading needs futures margin and balance sheet,
    the spread carries contango and Samuelson-volatility risk, and the gain per roll is a few tens of basis points.
    That suits specialist desks, and the profit shrinks as more of them enter. Bessembinder et al. find more liquidity
    provision and narrower spreads on USO roll dates (sunshine trading), so the remaining impact may be small. That
    is the risk this card tests.
signal:
  description: 'Calendar: XNYS sessions on which USO has a bar. Session k of a month = the k-th such session of
    that calendar month. Decision after the close of the last session of month m-1 (day t), using data up to that
    close: if USO, USL and DBO all have a bar on t and at least 63 prior daily total returns each, compute beta_d
    = OLS slope of the equal-weight USL+DBO daily close-to-close total return on the USO daily close-to-close total
    return over the 63 sessions ending at t, clipped to [0.5, 1.0]. Set short notional S = beta_d / (1 + beta_d)
    and long notional L = 1 / (1 + beta_d), so that gross = 1 and the book is neutral to the front-month oil move
    (L * beta_d = S). Target weights: USO = -S, USL = +L/2, DBO = +L/2. Trades at the open of session 1 of month
    m. Weights are held unchanged (no intra-window rebalancing) through the close of session hold_sessions of month
    m. The exit is decided after that close and executed at the next open (session hold_sessions + 1). Flat (cash)
    at all other times. With hold_sessions = 5 the window covers the four sessions before the first S&P GSCI roll
    day and the first roll day itself (the 5th business day). If any of the three funds lacks a bar on t, that month
    is skipped. A bar missing during the hold changes nothing (the position is held). No thresholds, no state filters,
    no use of the futures curve level. Total returns from ret_co and ret_oc only.'
  params:
    hold_sessions:
      grid:
      - 3
      - 5
      - 7
      value: 5
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'After the close of the last XNYS session of each month (all three funds with a bar that day): USO is marked
    with side -1 (the front-month holder should underperform while the front contract is sold ahead of and at the
    start of the S&P GSCI roll), USL and DBO are marked with side +1 (deferred-curve holders should outperform).
    Each fund''s abnormal return is measured against the other two funds of the universe on the same date, so the
    event measures the front-minus-deferred crude spread over the first sessions of the month. Time-shifted placebos
    of the same three funds carry the unconditional contango and oil-beta drift of the spread. The event has to
    beat them.'
  horizons:
  - 1
  - 3
  - 5
  - 7
  - 10
  primary_horizon_days: 5
