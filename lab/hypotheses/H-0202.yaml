id: H-0202
version: 1
title: BTC-led catch-up sized by expected catch-up - after a 3-sigma 1h BTC move, trade lagging top-10 alts in BTC's
  direction sized by beta*r_BTC - r_alt, hold 4h
author_agent: scout
family: btc-lead-altcoin-lag
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 12
mechanism:
  counterparty: 'Slow altcoin liquidity: resting limit orders and passive market makers in the altcoin books that
    are picked off at stale prices before they reprice to the BTC move, and slow holders who keep stale quotes or
    sell/buy late. On the down side, longs in altcoins who have not yet de-risked after a BTC drop and sell into
    the following hours.'
  why: 'BTC is the price-discovery hub of crypto: market-wide news, macro headlines and large directional flow hit
    the BTC perp and spot books first, and liquid market makers and cross-asset desks reprice BTC within minutes.
    Altcoin books are thinner, their market makers hedge with a delay and their holders (retail, spot-only accounts,
    bots that rebalance on a timer) react more slowly, so in the hour after a large BTC move part of the altcoins
    have not yet moved by their usual beta. The beta-implied gap E_j = beta_j * r_BTC(1h) - r_j(1h) is the part
    of the common move that altcoin j still owes. If the lag is information diffusion, the subsequent move of j
    in BTC''s direction should be larger the larger E_j is, so positions are sized in proportion to E_j instead
    of selecting altcoins by a hard lag cut-off (H-0040''s "moved less than half as much"). The same logic applies
    to a BTC drop: altcoins that have not fallen by their beta should fall further.'
  why_not_arbitraged: The fast part of the lead-lag is arbitraged within seconds to minutes by co-located market
    makers; what remains at a 15-minute decision and 4-hour hold is the slower diffusion, which is risky to harvest
    (the BTC move itself can reverse, altcoin idiosyncratic volatility is large), capacity-limited by altcoin depth,
    and clustered in a few volatile days, so it carries episode risk that market-neutral funds avoid. It may also
    simply be too small after taker costs, which is what this card tests.
signal:
  description: 'Data: binance_perp_15m, 15-minute candles, all times UTC. Leader = BTCUSDT (not traded). Tradable
    set on each candle = the 10 highest members by 30-day quote volume of the point-in-time top-12 universe after
    removing BTCUSDT and ETHUSDT (if fewer than 10 remain, use those). Log returns throughout. (1) After every closed
    candle t: r_BTC = log(close_BTC[t] / close_BTC[t-4]) (the last hour). sigma_BTC = standard deviation of BTC''s
    rolling 4-candle log returns over the 2880 candles (30 days) ending at candle t-4 (so the window excludes the
    move being tested). z = r_BTC / sigma_BTC. (2) Event: |z| >= k_sigma (the only threshold on the leader). If
    a book is already open, the candle is ignored (no stacking, no re-entry until the open book is closed). (3)
    For each tradable altcoin j: r_j = log(close_j[t] / close_j[t-4]) over the same four candles. beta_j = OLS slope
    of j''s non-overlapping 1-hour log returns (every 4th candle, aligned on t-4) on BTC''s over the trailing beta_days
    days ending at candle t-4, using only hours where both candles are real; skip j if fewer than 80 % of those
    hours are real or if beta_j <= 0. Expected catch-up E_j = beta_j * r_BTC - r_j. (4) Keep only the lag side:
    sign(E_j) == sign(r_BTC) (after a BTC rise, altcoins that rose less than their beta implies; after a BTC drop,
    altcoins that fell less). Altcoins that overshot BTC are not traded (that would be a reversal bet, a different
    mechanism). Skip j if |E_j| is below its own modeled round trip, 2 * (5 bps fee + j''s slippage tier) - a cost
    floor implied by the cost model, not a tuned cut-off. Skip j if any of the five candles t-3..t+1 is a gap candle
    (not real). (5) Weights: w_j = sign(r_BTC) * min(|E_j| / 0.02, 1) / 10, i.e. one tenth of equity per altcoin
    at full size, reached when the expected catch-up is 2 % or more, and linearly smaller below. Gross <= 1 by construction.
    0.02 is a fixed scale, not a parameter: below the cap it only scales the whole book and leaves Sharpe and the
    ratio of gross to cost unchanged. (6) Entry: market orders at the open of candle t+1. Exit: all positions of
    the book at the open of candle t+1+hold_candles with hold_candles = 16 (4 hours, the parent''s hold, fixed).
    No stops, no rescaling while open. Funding on settlement candles is charged by the engine. (7) Logging for the
    falsification checks: for every trade record E_j, beta_j, side, the gross return of j from entry to exit and
    BTC''s log return over the same interval.'
  params:
    beta_days:
      grid:
      - 14
      - 30
      - 60
      value: 30
    k_sigma:
      grid:
      - 2.5
      - 3.0
      - 3.5
      value: 3.0
  timeframes:
  - 15m
  - 1h
data_requirements:
- dataset: binance_perp_15m
  description: OHLC, quote volume, gap flag (real) and funding of BTCUSDT and the PIT top-12 perps; BTCUSDT is read
    as the leader, ETHUSDT is excluded from trading.
  frequency: 15m
  period:
  - '2020-01-01'
  - '2022-12-31'
holding_period:
  rebalance: event
  typical_days: 0.1667
market_exposure: long_short
falsification_criteria:
- Net Sharpe on dev 2020-2022 after modeled costs below 0.5, or the one-sided 75 % stationary-bootstrap bound of
  the mean net trade return at or below zero.
- 'Proportional sizing does not cure the threshold dependence of H-0040: fewer than 75 % of the neighbours (k_sigma
  2.5 / 3.5, beta_days 14 / 60) positive, or their median Sharpe below 0.70 of the primary; in particular, k_sigma
  = 2.5 with Sharpe below 0.70 of the primary falsifies the claim that sizing by E_j makes the threshold matter
  less.'
- 'Realised catch-up does not grow with the expected catch-up: over all dev trades of the primary configuration,
  the mean side-adjusted gross return from entry to exit of the trades in the top tercile of |E_j| is not larger
  than that of the bottom tercile (owner''s criterion; computed from the trade log).'
- 'The profit is BTC continuation, not altcoin catch-up: the mean side-adjusted BTC-hedged trade return (r_j over
  the hold minus beta_j times BTC''s return over the hold) is at or below zero.'
- Latest third of dev has a negative net return, fewer than two of three thirds are positive, or one third carries
  more than 60 % of the net profit (the failure of H-0040).
- Sharpe with doubled costs at or below zero, Sharpe with a one-candle later fill below 0.5 of the primary, or the
  book does not beat the 95th percentile of the same trades placed at random times.
- 'The down side does not exist: the mean net trade of the trades opened after BTC drops is at or below zero (reported
  from the trade log; if so the short half of the mechanism is falsified even if the pooled book passes).'
notes: 'owner_seed: G2V-3

  Provenance and contamination. This is an owner-queued variant of H-0040 (rejected at G2: median neighbour Sharpe
  ratio 0.62, one dev third carried most of the return, latest third lost). It is filed after H-0040''s dev result
  was seen, so it is a new trial of btc-lead-altcoin-lag, not a rescue, and the family counter must carry it together
  with H-0040, H-0074 (parked), the four LEAD variants of study 16, the 30 post hoc variants and the H2 filter of
  study 18 (lessons H-0040/H-0074, K-0058, K-0059). The 2023-2026 holdout is contaminated for this family (research
  16-18 selected on it), so a G4 pass would not be out-of-sample evidence. The lessons of H-0040 say not to add
  the short side or refile as beta catch-up; the owner asked for exactly this variant, so it is filed under the
  same family with its trials counted, and the short side has its own kill condition.

  What changed versus H-0040, and only this: (a) the binary lag rule ("moved less than half as much as BTC") is
  replaced by the beta-adjusted expected catch-up E_j and positions proportional to E_j (capped at one tenth of
  equity), so the book no longer depends on where a lag cut-off sits; (b) both BTC directions are traded. The jump
  threshold (3 sigma), the 1-hour measurement window, the 4-hour hold, the leader (BTCUSDT perp) and the universe
  rule (top-volume altcoins, ETH excluded) are kept at the parent''s values on purpose, so the comparison isolates
  the sizing change; none of them was retuned. Why k_sigma stays at 3 and is the only leader threshold: an hourly
  BTC move of three of its own trailing standard deviations is rare enough to be market-wide news or forced flow
  rather than noise, and frequent enough (both directions, one book at a time) to give several hundred events in
  2020-2022; with sizing by E_j, smaller BTC moves produce smaller expected catch-ups and therefore smaller positions,
  which is the mechanism-level reason to expect the k_sigma = 2.5 neighbour to lose less than in H-0040. The cost
  floor in step (4) is derived from the gate''s own cost model (a position whose expected gross is below its round
  trip is negative in expectation even if the mechanism is right), not fitted.

  Why only the lag side: E_j < 0 after a BTC rise (an altcoin that overshot) would be a short-horizon reversal bet
  on that altcoin, which the lab found harvestable only as a maker (prior study mrel-1h, K-0049 / H-0035). Mixing
  it in would turn the card into a cross-sectional residual-reversal book of another family; "both sides" here means
  both BTC directions, each traded in BTC''s direction on the laggards.

  Difference from the owner''s forward test (research 17, LEAD_K3_LONG on the top-10 altcoins, forward paper test
  2026-10-01 to 2027-03-31): LEAD is long-only, equal weight, with a binary "alt lags" condition on raw returns
  and no beta; this card uses a beta-adjusted gap, proportional sizing, a cost floor and the down side. It does
  not touch that test: it is evaluated only by the lab''s intraday judge on 2020-2022 dev (and at most the contaminated
  2023+ holdout), intraday cards cannot reach the paper bots, and nothing in it changes the forward registration.
  Because its up-side trades overlap heavily with LEAD''s, a pass here is not evidence independent of research 17,
  and the forward test remains the arbiter for the family.

  No mechanism_test block: the intraday judge has none. The owner''s tercile criterion and the BTC-hedged and side-split
  criteria need the per-trade log of step (7); the Builder should write it so the Librarian can check them even
  if the gates do not compute them.

  Data: everything is in binance_perp_15m (loader: intraday). No reference block: the idea is not taken from a published
  crypto result, and the family''s prior trial count already exceeds a literature prior.

  Forecast (honest): around 300-600 events in dev and 1,000-2,500 altcoin trades; the up side similar to H-0040
  per unit of gross, the down side weaker (study 17: shorts lost). Most likely death: G2 sub-periods (one boom and
  bust in dev, K-0060) or the down side diluting a thin edge below the bootstrap bar; if it survives G2, the family''s
  trial count makes G3 DSR hard.'
