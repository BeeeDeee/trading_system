id: H-0005
version: 1
title: Stablecoin net issuance as crypto inflow gauge - hold liquid Binance coins only while aggregate USD stablecoin
  supply is growing, weekly
author_agent: scout
family: stablecoin-flow-pressure
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 10
mechanism:
  counterparty: Holders who stay fully invested while net capital is leaving the system (they bear the drawdowns
    of outflow phases, often retail buy-and-hold and illiquid-alt holders), and late buyers who enter after prices
    have already absorbed an inflow. In outflow phases the strategy sells to dip buyers who rely on price alone.
  why: 'USD stablecoins are the main funding currency of crypto spot markets: fiat that enters the crypto trading
    system is first minted into a stablecoin and then spent on coins over the following days and weeks, and capital
    that leaves is redeemed (supply is burned). Net issuance is therefore a direct, public measure of aggregate
    net capital flow into the asset class, unlike price trend, which only measures its effect. Crypto markets are
    thin relative to these flows and have no fundamental anchor, so demand is inelastic and flows move prices (inelastic-markets
    argument of Gabaix and Koijen applied to a market with no valuation arbitrageurs). Minted balances are deployed
    gradually (OTC desks, exchange deposits, staged buying), so the price pressure follows issuance with a lag;
    when supply shrinks, capital is leaving and the remaining holders absorb the selling. The strategy holds coins
    while the trailing net issuance is positive and sits in cash while it is negative.'
  why_not_arbitraged: Shorting most coins is costly or impossible on spot, perpetual funding is volatile, and crypto
    has no large valuation-based arbitrage capital with a mandate to lean against flows. The signal is public but
    noisy at daily frequency (treasury mints in large round batches, chain migrations), so it is only usable as
    a slow multi-week regime filter, which has low capacity value for fast arbitrageurs and is uncomfortable for
    funds benchmarked to BTC because it can sit in cash during rallies.
signal:
  description: 'Inputs: (a) S_d = total circulating supply in USD of all USD-pegged stablecoins at the end of UTC
    day d (new dataset stablecoin_supply_1d); (b) Binance spot daily bars (close, quote_volume, ret_oc, ret_co).
    Schedule: weekly decisions after the daily close of every Sunday UTC day t (the bar ending 00:00 UTC Monday);
    trades at the open of day t+1 (Monday bar open); positions held until the next weekly decision. Point-in-time:
    the strategy uses the supply value of day t-1 (one extra day of lag against late snapshots), i.e. G_t = ln(S_{t-1}
    / S_{t-1-L}) with L = lookback_days calendar days. If S is missing on t-1, use the last available value at or
    before t-1; if fewer than L+1 days of supply history exist, or the last available value is older than 7 days,
    the strategy is in cash. Regime: risk-on if G_t > 0, risk-off otherwise (fixed threshold 0, not tuned). Universe
    at each decision: the top 10 Binance USDT spot pairs (stablecoins and wrapped assets excluded by the loader)
    by median daily quote_volume over the 30 UTC days ending at t, among pairs with at least 60 daily bars up to
    t. Pairs not yet listed are not eligible; a pair that stops trading is exited at the loader''s delisting rule.
    Weights when risk-on: inverse volatility, w_i proportional to 1 / sigma_i with sigma_i the standard deviation
    of daily close-to-close log returns over the 60 days ending at t; weights normalised to sum to 1, then capped
    at 0.25 per pair with the excess redistributed proportionally to uncapped pairs (repeat until no weight exceeds
    0.25). Gross exposure = 1, long only. Weights when risk-off: all weights 0 (cash). Rebalancing: at every weekly
    decision the target weights are recomputed and traded in full.'
  params:
    lookback_days:
      grid:
      - 14
      - 28
      - 56
      value: 28
data_requirements:
- dataset: binance_spot_1d
  fields:
  - close
  - quote_volume
  - ret_co
  - ret_oc
  frequency: 1d
  period:
  - '2018-01-01'
  - '2022-12-31'
- dataset: stablecoin_supply_1d
  description: 'NEW dataset, free and public, one value per UTC day: total circulating supply in USD of all USD-pegged
    stablecoins (USDT, USDC, BUSD, DAI, TUSD, ... summed across chains). Primary source: DefiLlama stablecoins API,
    endpoint https://stablecoins.llama.fi/stablecoincharts/all, field totalCirculatingUSD.peggedUSD with its daily
    unix timestamp (00:00 UTC). Fallback / cross-check: sum of the current supply metric (SplyCur) of USDT and USDC
    from the free Coin Metrics community API. Needed from the earliest available date (2017 or 2018) to today; signal
    series only, not tradable. Clock: crypto (value for UTC day d known at 00:00 UTC of d+1); the strategy lags
    it by one further day. Forward source: the same free API, updated daily, so G5 paper trading is possible.'
  fields:
  - total_circulating_usd
  frequency: 1d
  period:
  - '2018-01-01'
  - '2022-12-31'
holding_period:
  rebalance: weekly
  typical_days: 7
market_exposure: long_only
references:
- cite: Griffin, Shams (2020) Is Bitcoin Really Untethered? Journal of Finance
  year: 2020
- cite: 'Gabaix, Koijen (2021) In Search of the Origins of Financial Fluctuations: The Inelastic Markets Hypothesis'
  year: 2021
falsification_criteria:
- Net Sharpe on dev below BTC buy-and-hold Sharpe + 0.10, or the one-sided 90 % bootstrap CI of the Sharpe difference
  includes 0.
- Neighbor lookbacks (14 and 56 days) do not beat BTC buy-and-hold (fewer than 75 % of neighbors).
- Fails at costs x2 or below the 95th percentile of random entries with the same exposure and turnover.
- More than 60 % of the log return comes from one of the three dev sub-periods.
- 'Mechanism: the stablecoin signal adds nothing beyond price trend - the same strategy with the regime set by the
  sign of the BTC trailing 28-day log return instead of G_t has an equal or higher net Sharpe on dev; then the result
  is the already-killed crypto trend filter (prior study 9) in disguise.'
- 'Mechanism: risk-off weeks (G_t <= 0) do not have a lower mean forward 1-week return of the risk-on portfolio
  than risk-on weeks.'
notes: 'Why the new dataset is essential: the mechanism is about capital flows into the crypto system, and the only
  daily, public, point-in-time measure of those flows is stablecoin net issuance; no field in the catalog (prices,
  volumes, funding) measures fund flows, and using price trend instead would be prior study 9 (crypto trend filter,
  killed). Difference to study 9: that signal was BTC''s own price relative to its moving average; this one is an
  exogenous flow quantity that can diverge from price (supply grows while prices fall when new money buys a dip,
  shrinks during rallies driven by leverage). The mechanism falsification criterion explicitly compares against
  the price-trend version so the test dies for an informative reason if the flow signal is just trend. Lineage:
  Griffin and Shams link Tether issuance to subsequent BTC price increases (a manipulation interpretation for the
  early period); this card uses aggregate issuance of all USD stablecoins as an organic flow gauge, and the publication-decay
  check (2020 inside dev) applies. Universe of 10 pairs with inverse-volatility weights and a 0.25 cap keeps the
  portfolio near BTC/ETH risk, satisfies the sentinel weight limit, and yields >100 position entries from regime
  switches and weekly membership changes. Weekly rebalancing of top-10 liquid pairs keeps costs moderate. Threshold
  0 and lookback 28 days are round, untuned choices. Risk acknowledged: dev covers only 2018-2022 for this signal
  (about 260 weekly decisions), so the bootstrap CI may be wide.'
