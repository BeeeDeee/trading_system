title: 'Return seasonality net of seasonal reversal - LIQ-500 dollar-neutral, monthly: long same-month-minus-other-month
  winners, short losers, hold 1 month'
author_agent: scout
family: return-seasonality
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Calendar-driven traders who must or want to trade on a fixed date regardless of price (tax-loss
    sellers, window-dressing managers, scheduled flow money, dividend-month buyers), and investors who price each
    month as if a stock's expected return were the same in every month.
  why: 'Some investor groups trade the same stocks in the same calendar month every year for reasons unrelated to
    value: year-end tax-loss selling and the January buy-back, fiscal-year-end window dressing by funds, recurring
    contribution and bonus flows, seasonal dividend clienteles, annual benchmark reviews, and firms'' own fixed
    reporting calendars. Because a stock''s clientele and characteristics are persistent, the same stocks receive
    the same pressure in the same month each year. Heston and Sadka (2008) show that a stock''s relative return
    in a calendar month predicts its relative return in the same month for up to twenty years; Keloharju, Linnainmaa
    and Nyberg (2021) show that the seasonal highs are offset by seasonal reversals in the other months, so over
    a year they add up to about zero: temporary, calendar-recurring mispricing, not a permanent risk premium. The
    cleanest score is therefore the stock''s past same-month relative return minus its past other-month relative
    return (annual minus non-annual lags), which also strips out the stock''s average level (long-run drift, long-term
    reversal, persistent style premia).'
  why_not_arbitraged: Each stock gives one noisy observation per calendar month per year, so the signal needs years
    of history and is weak name by name; the payoff per month is small next to idiosyncratic risk, so it has to
    be taken with a broad book of 100-200 names that rotates almost fully every month, which costs spread and capital;
    the gain is spread across many small names-months and offset in the other months, which makes it unattractive
    for capacity-constrained long-only managers who cannot short the mirror.
signal:
  description: 'Decision once a month, after the close of the last XNYS session of calendar month m-1 (call it t);
    trades at the open of the first session of month m; positions are held until the next month-end decision. (1)
    Monthly relative returns: for every stock in the loaded sharadar_sep panel and every past calendar month, compound
    the daily close-to-close total return ((1+ret_co)*(1+ret_oc)-1) over the sessions of that month; a stock-month
    counts only if the stock has a return on at least 15 sessions of that month. Subtract the equal-weighted mean
    of this monthly return over all stocks of the panel that count in that month, giving the relative return r(i,
    month). Months before 1998 do not exist. (2) Score for target month m, with Y = years_back: annual_mean(i) =
    mean of r(i, m-12k) for k = 1..Y (the same calendar month in each of the past Y years); other_mean(i) = mean
    of r(i, L) over the monthly lags L = 13..12Y that are not multiples of 12 (the other calendar months of years
    2..Y; the most recent 12 months are excluded from the other-month mean so that momentum and short-term reversal
    do not enter the score). score(i) = annual_mean(i) - other_mean(i). A stock is eligible only if all Y same-month
    observations exist and at least 75 % of the other-month lags exist; otherwise it gets no score and is not traded.
    (3) Book: among stocks that are LIQ-500 members and tradable at t and have a score, rank by score; long the
    top leg_quantile fraction, short the bottom leg_quantile fraction (rounded down, at least 10 names per leg,
    otherwise hold nothing that month), equal weight, +0.5 total long and -0.5 total short (gross 1, dollar-neutral).
    No other filters, no beta adjustment. (4) Between decisions weights are not re-equalized. A stock that leaves
    the universe or stops being tradable before the next decision is closed at the next open and its weight goes
    to cash; a delisting takes the terminal return. Missing data never fills: a missing month simply does not count
    (rule in 1-2). Everything used at t is from months that ended at least 12 months before month m, so the score
    is known long before t; universe membership is the point-in-time LIQ-500 at t.'
  params:
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    years_back:
      grid:
      - 3
      - 5
      - 7
      value: 5
  timeframes:
  - 1d
  - 1mo
  - 1y
mechanism_test:
  event: 'At each month-end decision t, a stock enters the long leg (side +1: top leg_quantile of the same-month
    minus other-month seasonal score for the coming month) or the short leg (side -1: bottom leg_quantile) of the
    book described in the signal; all other scored LIQ-500 members (about 60 % at the primary quantile) are the
    unmarked peers. The time-shifted placebo moves the scores to dates whose coming calendar month is a different
    one, so it should earn about zero unless the result is driven by persistent stock identity.'
  horizons:
