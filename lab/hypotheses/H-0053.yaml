falsification_criteria:
- 'Mechanism test: the 21-session side-adjusted abnormal return of leg members does not exceed the 95th percentile
  of the 200 time-shifted placebos, or gross per event is below the round-trip cost: reject, the seasonal-demand
  mechanism is not visible in LIQ-500.'
- 'Mechanism test: the abnormal return is negative in the latest third of the dev period: reject even if the pooled
  result passes (expected decay after the 2008 publication, K-0060).'
- 'Mechanism (descriptive): if the placebo average is at least half of the event average, the result belongs to
  stock identity, not to the calendar month, and does not support the mechanism (K-0025).'
- 'Strategy: net Sharpe on dev below 0.5, or below T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  to T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (years_back 3 and 7, leg_quantile 0.1 and 0.3 and their combinations)
  beat T-bills, or net excess over T-bills is not positive at doubled costs.'
- 'Publication decay: Sharpe excess over T-bills after 2008 below half of that before 2008.'
notes: 'Brief fit: the brief asks for a 1-6 month horizon in US single stocks. A calendar-month seasonality is held
  for exactly one month by construction (the next month is a different calendar month with a different ranking),
  so this sits at the lower edge of the brief; a longer hold would mix months and dilute the signal by design. Why
  this and not a slower anomaly: the lab''s time-shifted placebo absorbs any persistent style (K-0025: low vol,
  profitability, value would score like their own placebos), and trend-selected events inherit their run-up in the
  placebo (H-0011). Seasonality is the rare cross-sectional signal whose placebo is clean: shifting the dates moves
  each score to the wrong calendar month, so the placebo mean should be near zero, and the score is demeaned against
  the stock''s own other months, so persistent identity is netted out twice. Relation to existing families: not
  earnings-announcement-premium or dividend-month premium (quarterly corporate calendars; K-0039 found the earnings-date
  premium absent in LIQ-500): the score uses annual lags and puts quarterly lags 15, 18, 21 ... into the other-month
  mean, so a purely quarterly event effect is partly cancelled; if the Librarian judges it the same mechanism, merge
  the family. Not momentum or reversal: the last 12 months enter only through lag 12, and never through the other-month
  mean. Not the turn-of-month family: all calendar months, cross-sectional, month-long hold. Expected size, stated
  before the run (K-0053, K-0064): the papers report about 1 % per month top-minus-bottom decile in broad US samples;
  in the 500 most liquid names after 2003 I expect a third to a half of that for quintiles, so about 0.15-0.25 %
  per event-month side-adjusted against a round trip of roughly 0.06-0.12 % (cost ratio about 2); the book (0.5
  long / 0.5 short) would earn roughly 1.5-3 %/y gross, turn over almost fully each month (about 1-1.5 %/y cost),
  for a net Sharpe near 0.3-0.6: the absolute Sharpe bar of 0.5 is the likely strategy death even if the mechanism
  passes. Event counts (K-0069): at years_back 5 the first decision is at the end of 2002, so about 216 event dates
  in dev; with about 450 scored members per date and two legs of 20 % about 180 marked events per date, about 39,000
  marked events in total (years_back 7: about 192 dates, from 2004). Known risks: decay after 2008 (latest-third
  kill condition above); January may carry much of it (tax-loss reversal in the smaller members); the dollar-neutral
  book may carry beta in some months (no beta adjustment by design, to keep one primary configuration); time-shifted
  placebos that happen to land a multiple of about 252 sessions away realign the calendar and will look like the
  event (a small share of 200 runs). No dates, episodes or named stocks are used.'
