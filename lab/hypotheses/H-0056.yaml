id: H-0056
version: 1
title: Oil-specific shock underreaction - weekly tilt of a 60/40 SPY/IEF book against the past month's WTI move
  not explained by the stock market, hold ~1 month
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - TLT
  - AGG
  - SHY
  kind: instruments
mechanism:
  counterparty: Equity investors and equity-only mandates that do not monitor the oil market (or treat its moves
    as sector news for energy stocks only) and so hold or buy the broad market after an oil-specific cost shock
    at a price that does not yet reflect it; they are slow, not forced, and their loss is a delayed repricing.
  why: 'Oil price changes carry news about the future cash flows of most listed firms (input costs, consumer spending),
    but equity investors process news from another market slowly: Driesprong, Jacobsen and Maat (2008) find that
    a rise in the oil price in one month predicts lower stock returns in the next month in most countries, consistent
    with gradual diffusion of information across markets (Hong and Stein 1999; Hong, Torous and Valkanov 2007).
    Kilian and Park (2009) show that the stock response depends on WHY oil moved: demand-driven oil moves go together
    with rising stocks (the equity market prices them at once), oil-specific (supply or precautionary) shocks are
    bad news for stocks. This card therefore uses only the oil-specific part of the oil move: the WTI return over
    the past month minus its rolling beta times the SPY return over the same window. That residual is, by construction,
    the part of the oil news the stock market has not yet reflected, which is exactly what an underreaction story
    says should be priced later. A large positive residual shock should be followed by US equities underperforming
    Treasuries over the next month, a large negative one by equities outperforming.'
  why_not_arbitraged: 'The signal is a market-timing bet on the whole equity index at a monthly horizon: one independent
    bet a month, low Sharpe per bet, large tracking error for any benchmarked manager, and an effect that is noisy
    and episodic (it needs oil-specific shocks, which come in clusters). Capacity is large but the risk per unit
    of expected return is high, so specialized arbitrage capital is small; macro funds that do trade it face the
    same noise.'
signal:
  description: 'Inputs: SPY daily total return (from ret_co and ret_oc of sharadar_sfp, close-to-close) and WTI
    spot DCOILWTICO from fred_macro (clock next_morning: the value of day d is usable from the close of d+1). Oil
    daily return: on each XNYS session, simple return of DCOILWTICO between the last two available positive values;
    a missing or non-positive value is treated as missing (the last positive value is carried forward, return 0
    on that session). Because oil is known one day late, every window below ends at session t-1 for BOTH oil and
    SPY, so the two returns cover the same days. (1) beta_t: OLS slope of oil daily returns on SPY daily returns
    over the 252 sessions ending t-1. (2) shock_t = R_oil(L) - beta_t * R_SPY(L), where R_x(L) is the compounded
    return of x over the L sessions ending t-1 (L = lookback_days). (3) z_t = shock_t / std(shock over the 756 sessions
    ending t), computed on the daily (overlapping) shock series, not demeaned; z is clipped to [-2, 2]. Decision:
    after the close of the last XNYS session of each calendar week, set target weights w_SPY = clip(0.60 - tilt_per_z
    * z_t, 0.20, 1.00) and w_IEF = 1 - w_SPY; trade at the next open; hold the targets until the next weekly decision.
    TLT, AGG and SHY are never held (weight 0): they are in the universe only as unmarked peers for the mechanism
    test. Warm-up: signals are computed from 1998 on (SPY and oil exist), the first decision is the first weekly
    date on which IEF has a price and beta and the 756-session std are fully defined; before that, no position.
    If z cannot be computed on a decision date (missing inputs), hold 60/40 (z = 0). The book is always fully invested
    (gross 1, long only), so average equity weight stays near the benchmark''s 60 %.'
  params:
    lookback_days:
      grid:
      - 10
      - 21
      - 42
      value: 21
    tilt_per_z:
      grid:
      - 0.1
      - 0.15
      - 0.2
      value: 0.15
  timeframes:
  - 1d
  - 1w
  - 1mo
mechanism_test:
  event: 'On the last XNYS session of each calendar week, the oil-specific shock z_t of the signal (WTI return over
    the past 21 sessions ending t-1 minus rolling beta times the SPY return over the same sessions, divided by its
    trailing 756-session std) satisfies |z_t| >= 1.0. SPY is marked with side = -sign(z_t) (oil-specific rise: SPY
    should underperform; fall: outperform). IEF, TLT, AGG and SHY are never marked and serve as the unmarked peers,
    so the abnormal return is SPY minus the mean of the Treasury/aggregate bond ETFs from the next open to the close
    of t+h. Both signs are marked, so generic equity-over-bond drift cancels in the placebo mean. The diagnostic
    uses the primary lookback (21) and the fixed event threshold 1.0 (a round one-sigma cut, not a strategy parameter).'
  horizons:
  - 1
  - 5
  - 10
  - 21
  - 42
  primary_horizon_days: 21
