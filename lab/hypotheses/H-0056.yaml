falsification_criteria:
- 'Mechanism: the side-adjusted 21-session abnormal return of SPY against the unmarked bond ETFs after |z| >= 1
  events does not exceed the 95th percentile of the time-shifted placebos, or has the same sign in fewer than 2
  of 3 dev sub-periods.'
- 'Mechanism (decay, K-0060): the side-adjusted abnormal return in the latest third of dev is negative.'
- 'Mechanism (shape): the descriptive 21-session abnormal return is not larger than the 5-session one; an underreaction
  that diffuses over weeks must build with the horizon, a quick reaction would be a different claim.'
- 'Mechanism: fewer than 200 events on dev (expected roughly 230-300 events on as many weekly dates); then the test
  could not tell and the card must not be retuned to a lower threshold.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (lookback_days 10/42, tilt_per_z 0.10/0.20 and combinations) beat
  the 60/40 benchmark, or the book fails to beat it at doubled costs.'
- 'Publication decay: post-2008 Sharpe excess over 60/40 below half of the pre-2008 excess (G2 publication check).'
notes: 'Brief fit: cross-asset (signal from the oil market via FRED, trades US equity and Treasury ETFs), holding
  about one month (the low end of the 1-6 month brief), weekly decisions so that a monthly-horizon claim still gets
  enough events and rebalancing dates. The horizon follows the published one-month lag; a longer hold would dilute
  it. Why this is not a near-copy of anything killed: (a) the mrel study scanned 706k DAILY lead-lag pairs and found
  nothing out of sample; this card is one a-priori, economically motivated predictor at a monthly horizon, residualized
  on the stock market, so it is not a mined daily lead-lag. The Chair may judge it belongs with cross-market lead-lag;
  I named the family after the economic mechanism (underreaction to oil-specific news) and flag the overlap here
  so the decision is visible. (b) It is not a binary switch (H-0001, H-0003): a continuous tilt with average equity
  weight near 60 %, as K-0005 and H-0003''s open question ask, trading exactly the benchmark''s two instruments
  (H-0005 lesson). (c) The event study marks SPY only, the same equity instrument the book trades, against bond
  peers (K-0064 warned about pooling four equity ETFs while trading SPY). (d) Unlike the stress-rebound cards (K-0056),
  the event is an oil shock not explained by stocks, not a large equity move, and both signs are marked. Why residualize:
  the literature reports that the raw oil-stock predictability weakened after 2008, when oil and stocks were driven
  together by global demand (Kilian-Park logic). Demand-driven oil moves are priced in equities at once and positively;
  mixing them in would blur or flip the signal. Removing the part of oil''s move explained by SPY over the same
  window keeps the oil-specific news. If the residual signal still dies on the post-2008 sub-period or on publication
  decay, that is an informative answer: the oil underreaction has been arbitraged or never was robust. Power and
  size estimate (K-0053, K-0064, K-0071): round-trip cost of SPY/IEF is a few bps, so cost is not binding; the placebo
  bar is. SPY-minus-bonds 21-session std is about 5-6 %; about 250 weekly events overlapping by ~4 weeks give roughly
  100 independent observations, so the placebo 95th percentile should sit near 0.8-1.0 % per event. The published
  effect (a 10 % oil move shifting next-month US returns by about one percentage point) implies about 1-1.5 % for
  |z| >= 1 events if it survives at full size; half size would likely miss the bar (a ''cannot tell'', not a refutation).
  Strategy: with tilt 0.15 per z the equity-weight deviation has std of about 0.13; at the full published effect
  the gain is roughly 1.5 % a year for about 2-2.5 % added tracking volatility, which lifts the 60/40 Sharpe by
  about the required 0.10; at half the effect it would not. So the card passes only if the effect is near its published
  size, and I expect that the most likely death is the placebo bar or the latest-third / post-publication check.
  Data handling: DCOILWTICO has holidays (missing) and one non-positive print in dev; both are handled by the missing-value
  rule in the signal description. IEF, TLT and SHY start mid-2002 and AGG in late 2003; until AGG exists the event
  study still has three unmarked peers (IEF, TLT, SHY), which K-0055 indicates is the minimum. ETFs have no forward
  data, so G4 is the ceiling.'
