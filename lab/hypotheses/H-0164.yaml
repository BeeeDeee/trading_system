id: H-0164
version: 1
title: Fed purchase-day local supply flow - 60/40 SPY/IEF book whose bond sleeve moves, duration-matched, into the
  Treasury ETF of the maturity bucket the New York Fed has scheduled to buy next session
author_agent: scout
family: fed-purchase-local-supply
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - SHY
  - IEI
  - TLH
  - TLT
  - TIP
  kind: instruments
mechanism:
  counterparty: The Fed itself, which by mandate buys a fixed par amount in the scheduled range and is not trying
    to minimise price impact across sectors (its offers are accepted from primary dealers at the prices they submit),
    and the dealers and relative-value funds whose limited balance sheet cannot fully pre-position the sector before
    every operation. The book is paid by being long the sector the Fed is about to lift, funded by the sectors it
    is not buying that day.
  why: When the Federal Reserve runs an asset-purchase programme, the New York Fed Desk buys Treasuries in pre-announced
    outright operations, each limited to one maturity range (for example 4-7 years or 17-30 years, or TIPS) on a
    scheduled day. The Desk buys a fixed amount whatever the price, so it is a price-insensitive demand shock concentrated
    in one maturity sector on one session. Under preferred-habitat / limited dealer balance sheet, the purchased
    sector's yields fall relative to other sectors on the operation day (the flow effect; D'Amico and King 2013
    measure about 3.5 bp in the purchased sector on operation days for the first programme, beyond the persistent
    stock effect). A Treasury ETF that holds that maturity sector should therefore outperform the ETFs holding the
    other sectors from the open to the close of the operation session. The signal comes from a policy-flow series
    outside the traded market (the Desk's operation schedule), the trade is in listed Treasury ETFs inside an always-invested
    60/40 book.
  why_not_arbitraged: Pre-positioning before each operation needs dealer balance sheet and carries duration risk
    in a specific sector for a gain of a few basis points; dealers are capital-constrained (post-crisis leverage
    rules) and many operations fall on consecutive days in different sectors, so inventory cannot be rotated in
    time. The effect per operation is small, too small for most funds' turnover budget, and runs only while a purchase
    programme is on.
signal:
  description: 'Inputs: the new signal dataset nyfed_tsy_operations_1d (keys per XNYS session d, see data_requirements):
    buy_next.<bucket> = 1 if an outright purchase operation of nominal coupons (or TIPS) in that maturity bucket
    is scheduled for the next XNYS session after d and was announced on or before d (known at the close of d), else
    0; buckets by the midpoint m of the operation''s maturity range in years: b0_3 (0.75 <= m < 3) -> SHY, b3_7
    (3 <= m < 7) -> IEI, b7_10 (7 <= m < 10) -> IEF, b10_20 (10 <= m < 20) -> TLH, b20_30 (m >= 20) -> TLT, tips
    -> TIP. Bill operations (m < 0.75) and sale operations are ignored. Daily total returns of the seven ETFs (ret_co,
    ret_oc) give trailing volatility. Decision after the close of day d, trade at the open of d+1. Core book: SPY
    0.60, IEF 0.40 (the 60/40 benchmark mix, rebalanced to these weights at every decision where the book changes,
    otherwise only on the first session of each month). Tilt: let B(d) be the set of buckets with buy_next = 1 at
    the close of d (the bucket is held for exactly one session, the operation session, from the open of d+1 to the
    open of d+2; if the next session again has an operation in the same bucket the position simply stays). If B(d)
    is empty, or B(d) contains only the IEF bucket, the bond sleeve is 0.40 IEF. Otherwise a fraction tilt_fraction
    of the 0.40 sleeve, T = 0.40 * tilt_fraction, is moved and split equally into k = |B(d)| shares of T / k (the
    rest, 0.40 - T, stays in IEF); each share goes into the bucket''s ETF with weight (T / k) * min(1, sigma_IEF
    / sigma_b), where sigma is the annualized volatility of daily total returns over the last vol_lookback sessions
    up to d (so a long-bucket share carries about the rate risk of the same share in IEF), and the unused part of
    the share goes into SHY. A share whose bucket is IEF stays in IEF. SPY stays at 0.60. Gross is 1.0, long only,
    no leverage. If an ETF has no price on d or fewer than vol_lookback valid returns, its bucket is treated as
    not purchased. If the dataset has no value for d (outside the period it covers), B(d) is empty. No sale-side
    trades.'
  params:
    tilt_fraction:
      grid:
      - 0.5
      - 0.75
      - 1.0
      value: 0.75
    vol_lookback:
      grid:
      - 42
      - 63
      - 126
      value: 63
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of session d, a New York Fed outright purchase operation is scheduled (announced by d)
    for session d+1 in the maturity bucket of Treasury ETF j (SHY, IEI, IEF, TLH, TLT or TIP, mapping as in the
    signal). Mark j on d with side +1. Peers on that date are the unmarked Treasury ETFs among SHY, IEI, IEF, TLH,
    TLT, TIP only; SPY is never marked and must not be used as a peer (as in H-0048, where the Treasury ETFs were
    the peer set of a 60/40 tilt). Dates on which five or more of the six Treasury ETFs are marked are dropped (no
    peer left to compare). The claim: the marked ETF beats the unmarked Treasury ETFs from the open of d+1 to the
    close of d+1 (the operation session).'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 1
