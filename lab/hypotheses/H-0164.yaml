- dataset: nyfed_tsy_operations_1d
  description: 'NEW DATASET (free, public): Federal Reserve Bank of New York, Desk outright Treasury operations
    (permanent open market operations): historical operation results and the published tentative operation schedules,
    from newyorkfed.org (Historical Transaction Data / Treasury securities operations pages, or the Markets Data
    API at markets.newyorkfed.org/api/tsy/...). Per operation: operation date, operation type (outright coupon purchase,
    TIPS purchase, bill purchase, sale), maturity range (start and end, in years or dates), and the date the operation
    was first announced in a published schedule. Wanted as a daily XNYS-session calendar: for each session d and
    bucket key, buy_next.<bucket> = 1 if a purchase operation whose maturity-range midpoint m falls in the bucket
    (b0_3: 0.75 <= m < 3, b3_7: 3 <= m < 7, b7_10: 7 <= m < 10, b10_20: 10 <= m < 20, b20_30: m >= 20; tips: any
    TIPS purchase) is scheduled for the next XNYS session after d AND was announced on or before d; else 0; one
    row per session over the requested period (0 in periods without operations, not missing). Optional extra keys
    if easy: buy_next_par.<bucket> (announced expected size, USD, summed) and buy_today_par.<bucket> (accepted par
    on d, known after d''s operation). Point-in-time rule: an operation the Desk announced only on the day it took
    place must NOT set buy_next on the previous session; if announcement dates cannot be recovered for some operations,
    state which and stamp them conservatively (dropped rather than assumed known).'
  fields:
