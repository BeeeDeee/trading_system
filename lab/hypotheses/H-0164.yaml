references:
- cite: 'D''Amico, S., King, T. B. (2013) Flow and stock effects of large-scale treasury purchases: Evidence on
    the importance of local supply. Journal of Financial Economics 108(2), 425-448'
  year: 2013
falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the marked Treasury ETF over the operation session (open to close
  of d+1) minus the unmarked Treasury ETFs is not above the 95th percentile of the 200 time-shifted placebos, or
  the gross per event is below the round-trip cost of the marked ETF.'
- 'Mechanism: the sign is negative in the latest third of dev (K-0060 decay kill), or positive in fewer than two
  of three thirds.'
- 'Mechanism shape: the 1-session abnormal return is less than half of the 3-session one (a slow drift, not an operation-day
  flow), even if the gate passes; then the operation-day claim is refuted.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark Sharpe + 0.10, or the one-sided bootstrap bound
  of the Sharpe difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (tilt_fraction 0.5 / 1.0, vol_lookback 42 / 126 and their combinations)
  beat the 60/40 benchmark, or the book fails at doubled costs.'
- 'Publication decay: excess Sharpe after the 2013 reference year below half of the excess before it.'
notes: 'Brief fit: the brief asked for a cross-asset signal at a 1-5 day horizon. The closest fit with a real counterparty
  I found is a policy-flow signal (the Fed Desk''s scheduled purchases, a public non-price series from outside the
  traded market) traded in Treasury ETFs inside a cross-asset 60/40 book; plain cross-market price lead-lag is dead
  (study mrel), and stress-rebound, VIX-gated crypto, oil/credit-shock-into-stocks and macro-calendar designs are
  dead or low-prior in knowledge.md (K-0070, K-0084, K-0179, K-0206). Relation to earlier cards: treasury-auction-supply-concession
  (H-0038, H-0127) tested dealer inventory concessions around new supply and found nothing at the ETF level; its
  lesson left ''before/inside the Fed''s purchase programmes'' open. This card is a different mechanism (a price-insensitive
  buyer removing supply in one named sector on a known day, preferred-habitat local supply), tested sector-against-sector,
  so a new family name; the Skeptic may judge otherwise. H-0048 (month-end TLT extension) found that a long-versus-belly
  pair cancels a common duration concession; here the event is sector-specific by construction (the Fed buys one
  range, not all durations), and the peers are the other Treasury sectors. Why the new dataset is essential: no
  loadable series carries the Desk''s operation schedule; without it the mechanism cannot be timed. If the Archivist
  cannot recover point-in-time announcement dates, the card should be parked, not run on realized operation dates.
  Forecasts (no data seen): purchase operations cluster in the purchase programmes, so several dev years have none
  and the event set concentrates in a few years; I expect roughly 800-1600 marked events on 600-1100 dates in 2008-2020,
  all three thirds non-empty. Gross: a 3.5 bp sector yield move is about 7 bp of price for SHY, 15 bp IEI, 25 bp
  IEF, 40-50 bp TLH/TLT (the paper finds a weaker flow effect at the longest maturities, and later programmes were
  larger but better anticipated, so I expect well under the full amount at the ETF level, 5-15 bp, against a round
  trip of a few bp for SHY/IEF/TLT and more for TLH and IEI). Book arithmetic: the tilt moves a duration-matched
  0.30 of the 0.40 sleeve (tilt_fraction 0.75), i.e. about 0.30 x IEF dollar duration, so each non-IEF event earns
  about 0.3 x (sector flow effect expressed in IEF-duration price, 3-10 bp) minus about 2-4 bp of switching cost;
  with around 60-100 switching events a year on average that is roughly 0 to +3 %/yr over 60/40, against about +0.9
  %/yr needed for +0.10 Sharpe at 60/40 volatility. The most likely death is the cost check (gross per event at
  or under a round trip, as in H-0048) or a placebo near miss if the effect lives only in purchased CUSIPs and not
  in the ETF baskets. Mean exposure is 1.0 (always invested); position entries are the bucket switches (hundreds);
  decision dates with turnover are hundreds. No date literals are needed in strategy.py: the schedule dataset is
  the only clock.'
