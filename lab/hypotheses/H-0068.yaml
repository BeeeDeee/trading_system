id: H-0068
version: 1
title: Post-release attention unwind in past winners - LIQ-500 market-neutral, short 12-month winners for 5 days
  after a real 8-K release with a non-extreme reaction
author_agent: scout
family: earnings-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Attention-driven buyers (mostly individual investors, Barber and Odean 2008) who buy salient past
    winners around their earnings release and pay a temporary premium; liquidity providers who sold to them are
    the natural other side, and this card takes that side for a few days after the attention peak.
  why: 'Limited attention (Aboody, Lehavy, Trueman 2010): individual investors buy attention-grabbing stocks, and
    past-year winners heading into an earnings release are the most salient of all. Their net buying lifts the price
    above value in the days before and on the release; once the release has passed, attention moves on, the buying
    stops and the temporary premium is given back over the next sessions. The paper reports the strongest prior
    winners earning about +1.6 % market-adjusted in the five sessions before the announcement and about -1.9 % in
    the five sessions after. This card tests only the after-release give-back, entered after the release session
    is over, on real 8-K Item 2.02 dates, so it needs no prediction of the date. Releases with an extreme reaction
    are excluded, so the events do not overlap the reaction-drift events of the post-earnings-announcement-drift
    family and the give-back is not mixed with news drift.'
  why_not_arbitraged: Shorting the year's strongest stocks right after news carries momentum-crash and squeeze risk
    and an idiosyncratic five-day volatility that dwarfs the expected give-back per name, so few arbitrageurs size
    it; the effect is a small per-event premium spread over many names and earnings seasons, and capacity in each
    name is limited by the short horizon.
signal:
  description: 'Inputs: sharadar_sep total returns (ret_co, ret_oc), tradable and listed flags, universe membership
    (point-in-time LIQ-500), and sec_8k_item202 ea_reaction_day. Daily return r[t] = (1+ret_co[t])(1+ret_oc[t])
    - 1. Decision after the close of each session t, trades at the open of t+1. (1) Formation return F[t,j] = product
    of (1+r) over sessions t-formation_days-5 .. t-6 minus 1 (the window ends six sessions before t, so the five
    sessions before the release and the release session itself are excluded). Require at least 90 % non-missing
    returns in the window, else j is not eligible. (2) Winner flag: among all universe members on day t with a valid
    F, j is a winner if F[t,j] is at or above the (1 - winner_quantile) cross-sectional quantile. (3) Reaction filter
    (fixed, not a parameter): m[t] = equal-weight mean of r over universe members on t; e[s,j] = r[s,j] - m[s];
    sd[t,j] = standard deviation of e over sessions t-65 .. t-6 (at least 40 valid); z[t,j] = e[t,j] / sd[t,j].
    The event requires |z| <= 2.0 (non-extreme release reaction). (4) Event: ea_reaction_day[t,j] == 1, j is a universe
    member and tradable on t, winner flag true, reaction filter passed. NaN in ea_reaction_day counts as no event.
    Book (market-neutral, dollar-neutral): each event opens a short slot from the open of t+1 that is held for 5
    sessions and closed at the open of t+6 (closed earlier at the first decision row where the stock is no longer
    a universe member or not tradable). A stock already in an open slot that triggers again keeps one slot whose
    clock restarts. On each day with n active slots the weight of each short is -min(0.04, 0.5 / n). The hedge is
    long, equal-weight, the 100 universe members with the best liquidity rank (liq_rank) on t that are not in an
    active slot, with total weight equal to the absolute short total, so net weight is zero and gross is at most
    1. With no active slot the book is flat (cash). Rebalancing is daily as slots open and close.'
  params:
    formation_days:
      grid:
      - 189
      - 252
      - 315
      value: 252
    winner_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1y
mechanism_test:
  event: A LIQ-500 member has its real earnings-release session on day t (ea_reaction_day = 1), its return over
    the formation window ending six sessions before t is in the top winner_quantile of the universe on t, and its
    release-session reaction relative to the equal-weight universe is within 2 of its own 60-session residual standard
    deviation. side = -1 (the stock should underperform the other members from the open of t+1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
