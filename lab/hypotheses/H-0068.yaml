references:
- cite: Aboody, Lehavy, Trueman (2010) Limited attention and the earnings announcement returns of past stock market
    winners, Review of Accounting Studies
  year: 2010
- cite: 'Barber, Odean (2008) All that glitters: the effect of attention and news on the buying behavior of individual
