falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events does not exceed the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of the dev events has the wrong sign (winners do not lag the other members after
  the release); treat the idea as decayed even if the pooled test passes.'
- 'Mechanism shape: the 1- and 3-session abnormal returns are wrong-signed and the effect appears only at 10-20
  sessions; that is slow momentum or style drift, not an attention give-back right after the release.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbors (formation_days 189/315, winner_quantile 0.1/0.3 and their combinations)
  beat the T-bill bar, or the book fails at doubled costs.'
notes: 'Brief: US single stocks, cross-sectional, 1-5 day hold, mechanism test declared. Family: reuses earnings-announcement-premium
  because the mechanism is the same attention-induced buying around releases that H-0008, H-0015 and H-0023 tested
  (from the long side, before the date); this card is the other half of that story, so its trials should count there.
  Why it is not a near-copy: (a) H-0008/H-0015/H-0023/H-0026/H-0032 needed a predicted release date whose hit rate
  was never measured; this card enters only after the real release session is known at its close, so date prediction
  plays no part. (b) H-0064 (short-term-reversal) bought 3-session losers before a predicted release; this card
  shorts 12-month winners after the actual release, a different sort, side and timing. (c) Releases with |z| > 2
  are excluded so the events are disjoint from the reaction-drift events of H-0028/H-0031/H-0033 (post-earnings-announcement-drift);
  the 2.0 cut is fixed in advance, not tuned. K-0081 notes that only own-price-move sorts at or near releases passed
  the event study in this lab; the 12-month winner sort is an own-price sort, but a slow one, so the prior is moderate,
  not high. Expected numbers (rough, stated before any test): about 2,000 releases per year in LIQ-500 with 8-K
  coverage, 20 % winners, roughly half to two thirds pass the reaction filter: about 200-260 events per year from
  2005 to 2020, so roughly 3,000-4,000 events on well over 1,000 dates. Round-trip cost about 10-12 bps (half-spread
  tier 5-6 bps, post-decimalization). The paper''s -1.9 % is for the strongest percentile of all stocks in an earlier
  sample; in LIQ-500 quintiles and after publication I expect -0.2 % to -0.5 % over five sessions, which would clear
  cost; below about -0.12 % it would not. Average active slots about 5-8, so the short leg is about 0.2-0.3 and
  gross about 0.4-0.6 in earnings seasons, lower in between; mean exposure should stay above 0.2 but the off-season
  months will be near cash, which caps the Sharpe (K-0027). Expected beta gap (K-0074): past winners may carry a
  higher beta than the average member, so in falling markets the raw abnormal return favours the card; the placebo
  on the same stocks absorbs the level, not a time-varying beta. Publication 2009/2010 falls inside dev, so G2''s
  publication check applies; K-0060 says expect decay, hence the latest-third kill condition. Most likely deaths:
  placebo bar (the same winners lag in any five-session window because of short-horizon reversal of their pre-release
  run-up, which a time-shifted placebo also captures), or the book falling short of the absolute 0.5 Sharpe bar
  with part-time exposure. No borrow fee is modelled for the shorts; LIQ-500 names are normally easy to borrow.
  Data caveat K-0035: 8-K coverage misses some firms, likely delisted ones.'
