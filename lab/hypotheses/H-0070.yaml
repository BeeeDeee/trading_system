version: 1
title: Equity-stress carry-unwind reversal in currencies - after an SPY down-shock day, long the CurrencyShares
  trust that fell most and short the one that rose most (relative to the six), hold 5 sessions
author_agent: scout
family: short-term-reversal
asset_classes:
- us_etf
universe:
  instruments:
  - FXA
  - FXB
  - FXC
  - FXE
  - FXF
  - FXY
  kind: instruments
mechanism:
  counterparty: Levered currency speculators and risk-limited macro funds forced to cut positions by margin calls
    and VaR limits on equity-stress days; they sell the currency hit hardest and buy back the one that rallied,
    paying a concession to whoever warehouses the flow.
  why: 'Currency speculators (carry traders, macro funds, levered retail) hold positions financed in low-yield funding
    currencies and sized by risk limits and margin that tighten when equity volatility jumps. On an equity down-shock
    day those limits bind together, so they unwind at the same time: the high-beta / high-yield currency is sold
    and the funding / safe-haven currency is bought back regardless of news about either economy (Brunnermeier,
    Nagel and Pedersen document that carry unwinds cluster when risk appetite and funding liquidity fall). Because
    the selling is forced by a shock that originates in another market (equities), part of the currency move is
    a liquidity concession rather than new information about rates or trade, and it should partly reverse over the
    following days as dealers and unconstrained capital absorb the inventory (Brunnermeier and Pedersen: market
    liquidity dries up when funding liquidity does, and prices overshoot). The trade takes the other side of the
    forced unwind for one week.'
  why_not_arbitraged: 'Providing liquidity requires risk capital exactly when it is scarce: the same funding shock
    that forces the unwind constrains dealers and arbitrageurs, the position is long the currency that is crashing,
    and unwinds can cascade for days (crash risk), so few balance sheets are willing to warehouse it. The gain is
    episodic and comes with negative skew, which keeps it unattractive to most mandates.'
signal:
  description: 'Inputs: daily total returns of the six CurrencyShares trusts FXA (AUD), FXB (GBP), FXC (CAD), FXE
    (EUR), FXF (CHF), FXY (JPY) and of SPY (signal only, never traded), r = (1 + ret_co) * (1 + ret_oc) - 1, all
    known at the US close of day t. Stress trigger: sigma_t = standard deviation of SPY daily log total returns
    over the 63 sessions t-63..t-1 (day t excluded; at least 60 valid values required, otherwise no signal); z_t
    = r_SPY,t / sigma_t; day t is a stress day if z_t <= -k. On a stress day, for each trust with a valid day-t
    return compute the relative return u_j = r_j - mean of r over the trusts with a valid day-t return (at least
    5 of the 6 must be valid, otherwise no cohort). L = the trust with the lowest u_j (fell most against the others),
    S = the trust with the highest u_j (rose most). Decision after the close of day t, trades at the open of day
    t+1: a cohort is opened, long L and short S with equal absolute weight, and is closed at the open of session
    t+1+hold_days. Several cohorts can be active at once (consecutive stress days): total gross is 1, split equally
    across active cohorts (each cohort +0.5/n_active in L and -0.5/n_active in S); positions of the same trust across
    cohorts are netted. Weights are recomputed only on days when a cohort opens or closes (no daily drift re-equalising).
    If L or S has no tradable open on t+1 the cohort is skipped entirely (to stay dollar-neutral). No stress cohort
    active: flat (cash). No other instruments are ever traded.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
    k:
      grid:
      - 0.5
      - 1.0
      - 1.5
      value: 1.0
  timeframes:
  - 1d
mechanism_test:
  event: After the close of a day t on which SPY's total return is at or below -1.0 times its trailing 63-session
    daily volatility (sessions t-63..t-1), among the six CurrencyShares trusts (at least 5 with a valid day-t return)
    the trust with the lowest day-t return relative to the cross-sectional mean is marked side +1 (forced selling
    should reverse, it should outperform) and the trust with the highest relative return is marked side -1 (forced
    buying should reverse, it should underperform). The other trusts are unmarked peers. Two marked events per stress
    date.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
