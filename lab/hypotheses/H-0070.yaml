falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the marked trusts (from the open of t+1) does not exceed
  the 95th percentile of the time-shifted placebos, or its gross per event is below the round-trip cost of the trust.'
- 'Mechanism: the pooled abnormal return is not positive in at least 2 of the 3 dev thirds; in particular a negative
  latest third (about 2016-2020) is read as the card being wrong, not as an episode (K-0060).'
- 'Mechanism shape: if the 1-session abnormal return is negative and the 10-session value is more than twice the
  5-session value, the result is read as slow currency drift (carry or value), not as a liquidity concession after
  a forced unwind, even if the gate passes.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill benchmark + 0.10, or the bootstrap bound of the Sharpe
  difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors (k 0.5 / 1.5, hold_days 3 / 8 and their combinations) beat the T-bill
  benchmark, or Sharpe at doubled costs below the benchmark.'
- 'Concentration: one dev third (for instance the 2007-2011 block with the financial crisis) carries more than 60
  % of the log return.'
notes: 'Brief fit: short horizon (5 sessions), cross-asset (the trigger is an equity-market shock measured on SPY,
  the trades are in currencies), mechanism test declared. Why this is not a re-run of the dead stress-rebound cards
  (H-0006, H-0041, H-0049, K-0056): those bet that the shocked asset itself rebounds against cash or bonds, so generic
  market drift and persistent crashes dominate. Here both sides are marked on every stress date (one long, one short,
  inside one asset class), so equity or dollar drift cancels within the date, and the placebo keeps the same trusts
  on shifted dates, so the ordinary AUD-minus-JPY carry drift is in the placebo, not in the event. The family is
  honestly short-term-reversal (liquidity provision after forced selling), so the trials count there. Persistent-crash
  risk is not filtered away: the trigger is standardised by trailing volatility, so in a long crash only the largest
  days fire, and the latest-third and block-concentration criteria above will show whether 2008-style continuation
  dominates. Known confound (K-0074): the long side (typically AUD/CAD) has a higher equity beta than the short
  side (typically JPY/CHF), so the event return partly measures whether equities rebound after the shock; the 1-session
  and 10-session horizons and the per-third signs are the only separation the gate offers. Expected numbers (rough,
  not looked up): about 12-15 % of sessions are stress days at k = 1.0, so about 400-500 stress dates in mid-2007..2020
  and 800-1000 marked events; with clustering, the book is invested about a third of the sessions (k = 1.5 would
  give about half the dates and an exposure near the 0.20 floor, which is why 1.0 is primary). Forecast gross: a
  1-sigma down day moves the extreme pair of the six by about 1-2 % against each other; if 25-35 % of that reverses
  within five sessions, the pair earns about 0.3-0.6 % gross per cohort, 0.15-0.3 % per marked event against a round
  trip of roughly 10-25 bps for these trusts (lower liquidity than SPY; FXF, FXB, FXC are the thinnest). Annual
  gain of the book: about 15-20 non-overlapping cohort-weeks a year at 0.2-0.4 % net each, 3-7 % a year at an annualised
  volatility of about 8-10 %, a net Sharpe of about 0.4-0.7: the absolute 0.5 floor is the most likely strategy
  death even if the mechanism is real (as for H-0062 on the same trusts). Part of the reversal may happen in the
  Asian session before the US open of t+1, which the next-open fill cannot capture. References are for the mechanism
  (carry unwinds cluster when funding liquidity falls; prices overshoot when it does), not for this exact reversal
  trade; their 2009 year makes the publication-decay pre-period very short (2007-2008, crisis only), which the Chair
  may want to read with that in mind. No dates, episodes or instrument choices tuned to history: the six trusts
  are the full set of G10 CurrencyShares trusts already used by H-0062, chosen before any result. SPY appears only
  as a signal input; if the engine needs it in the universe, the strategy must still never trade it and the event
  study should not count it as a peer.'
