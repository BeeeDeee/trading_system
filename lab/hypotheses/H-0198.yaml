id: H-0198
version: 1
title: Reporting-cycle reversal concession, learned linearly - LIQ-500 long-only weekly top decile of a ridge 5-day
  score on reversal x pre-release window x news x vol; mechanism = interaction-only picks
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Liquidity demanders who sell (buy) a stock with market orders in the days before its scheduled earnings
    release, such as institutions finishing a rebalance or de-risking ahead of the event and traders reacting to
    pre-release news; they pay the market maker's inventory premium, which is earned by whoever buys the pressured
    stock and holds it into and through the release.
  why: 'Market makers who absorb order imbalances demand a larger price concession when they would have to carry
    the inventory through a scheduled information event: in the days before a stock''s earnings release, the reversal
    of liquidity-driven moves is several times larger than at other times (So and Wang 2014), and the concession
    is larger in volatile stocks, where inventory risk is larger (Nagel 2012). Right after a release the opposite
    holds: a move that contains earnings news is information, not liquidity demand, and it drifts instead of reverting.
    So the slope of next-week returns on last week''s move should depend on where the stock is in its quarterly
    reporting cycle. The lab has two pieces of this: pre-release reversal as a hand rule on in-window stocks only
    cleared the placebo bar but its long/short book missed the Sharpe floor (H-0064), and a linear reversal score
    in the volatile half cleared it too (H-0115); learned neutral books earn on the long leg and lose on the short
    leg (K-0207). This card scores every member weekly with one linear model that is told the reporting cycle, and
    holds only the long side.'
  why_not_arbitraged: Inventory carried through a binary information event cannot be diversified away by an intermediary
    with risk limits, so the premium is a compensation for real risk. The concession is tens of basis points per
    stock, needs weekly turnover, and is eaten by taker costs for most players; capacity in any one name in the
    window is small.
signal:
  description: 'Data: sharadar_sep daily total returns (ret_co, ret_oc), dollar_volume, point-in-time LIQ-500 membership,
    and the sec_8k_item202 flag ea_reaction_day (1 on the reaction session of an 8-K Item 2.02 earnings release,
    known at that session''s close). All features use data up to the close of decision day t. Predicted release
    dates of a stock: for each of its past reaction sessions s, the first XNYS session on or after s + 364 calendar
    days (last year''s release plus 52 weeks). Features per member and day t: (1) rev5 = minus the stock''s 5-session
    total return (sessions t-4..t, compounded from ret_co and ret_oc) minus the equal-weighted mean of the same
    return over members; (2) pre = 1 if a predicted release date falls 1 to pre_window sessions after t and the
    stock had no actual reaction session in the last pre_window sessions (t-pre_window+1..t), else 0; (3) rev5 x
    pre; (4) rev5 x post, where post = 1 if an actual reaction session lies in t-4..t, else 0; (5) rev5 x vol, vol
    = 63-session standard deviation of daily total returns; (6) rev5 x vlm, vlm = log of the mean dollar volume
    over t-4..t divided by the mean over t-67..t-5. rev5, vol and vlm are z-scored across members of the date before
    the products are formed (flags stay 0/1); then all six columns go through the framework cross-sectional z-score
    helper; a column with no dispersion on a date is set to 0 for that date. A stock with ea_reaction_day NaN (no
    EDGAR history) has pre = post = 0 and is still scored; a stock without rev5, vol or vlm is not scored. Label:
    total return from the open of t+1 to the open of t+6 (5 sessions), ranked across members (framework label).
    Model: ridge (framework `ridge`, alpha 100) via lab.framework.ml.walk_forward, refit every 63 rows on an expanding
    window, all columns kept and non-members masked per row (K-0134). Rows are training or scoring rows only from
    the first session on which at least 100 members have a predicted release date (about one year after the view
    start); before that the book is flat. Book: long-only. Decisions after the close of the first session of each
    week, trades at the next open. K = round(top x number of scored members). Held names that still rank in the
    top 2 x top of the score are kept, then the highest-ranked names not held are added until the book holds K names;
    equal weight 1/K, gross 1.0. A held stock that leaves the universe is sold at the next decision row. Fewer than
    100 scored members on a decision date: flat until the next decision.'
  params:
    pre_window:
      grid:
      - 5
      - 10
      - 15
      value: 10
    top:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: At a weekly decision (first session of the week) a member ranks in the top `top` fraction of the interaction
    ridge's score and did not at the previous weekly decision, while the plain ridge (same label, schedule, alpha
    and members, fitted on the five raw inputs rev5, pre, post, vol, vlm without product terms) does not rank it
    in its own top `top` fraction; side +1. These are the picks the reporting-cycle and volatility interaction terms
    add.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'rev5: minus the 5-session market-adjusted total return to the close of t (sharadar_sep ret_co, ret_oc): the
    liquidity-demand move whose reversal is the concession'
  - 'pre: 0/1 flag, a predicted earnings release (last year''s 8-K Item 2.02 reaction session + 52 weeks) is 1..pre_window
    sessions ahead and no actual release happened in the last pre_window sessions: scheduled information risk ahead
    (also absorbs any announcement-premium main effect)'
  - 'rev5 x pre: the So-Wang claim, a larger concession when the market maker must carry inventory through the release'
  - 'rev5 x post (post = an actual Item 2.02 reaction session in t-4..t): a move that contains earnings news is
    information, expected negative weight (drift, not reversal)'
  - 'rev5 x vol (63-session volatility of daily total returns): inventory risk and the concession scale with volatility
    (Nagel; the open volatile-half question of H-0115)'
  - 'rev5 x vlm (log of 5-session over prior 63-session mean dollar volume): whether the move came with heavy demand,
    which needs more concession, or on thin volume'
  horizon_days: 5
  model: ridge
  retrain_every_days: 63
  why_not_linear: 'Deliberately linear, with the interaction written as product terms. The claim is that the slope
    of next-week returns on rev5 changes with event time in the reporting cycle (larger just before a scheduled
    release, reversed to drift just after one), with volatility and with volume. A ridge on the five raw inputs
    (rev5, pre, post, vol, vlm) can only add one constant reversal slope and separate main effects (an announcement
    premium, a volatility tilt), so it cannot represent a slope that depends on the cycle; that plain ridge is the
    control, and the mechanism event is defined against it. A tree or network on the raw inputs could in principle
    find the same interaction, but it would have to discover a band of 5-15 sessions from 5-day returns whose cross-sectional
    R2 is a fraction of a percent; six gbm-versus-ridge cards in the lab found no nonlinear gain (K-0182), which
    asks for the linear form as the primary claim. Who pays: liquidity demanders trading a stock in the days before
    its release, when market makers lean against order flow because they do not want inventory through the announcement.'
