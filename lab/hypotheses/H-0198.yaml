falsification_criteria:
- 'Mechanism: the interaction-only entrants (mechanism_test event) have a 5-session side-adjusted abnormal return
  at or below the 95th percentile of the time-shifted placebos, or gross per event below the round-trip cost, or
  fewer than two of the three dev blocks positive.'
- 'Mechanism: the latest third of dev is negative even if the pooled test passes; read as decay (K-0060), not as
  a live effect.'
- 'A ridge on the five raw inputs without product terms (the plain ridge) is as good: its picks are not beaten by
  the picks only the interaction ridge makes, i.e. the mechanism event shows no abnormal return; then the reporting
  cycle does not enlarge the reversal concession beyond plain reversal.'
- Net Sharpe on dev below SPY_TR + 0.10, or the bootstrap bound of the Sharpe difference at or below zero.
- Fewer than 75 % of the grid neighbors of pre_window 10 (5, 15) and top 0.1 (0.05, 0.2) beat SPY_TR, or the median
  neighbor Sharpe is below 0.7 of the primary.
- Sharpe at doubled costs below SPY_TR.
notes: 'Difference from H-0064 (pre-announcement reversal, hand rule, in-window stocks only, unhedged long/short,
  mechanism passed, book under the floor, latest third wrong-signed; its lesson says not to add a long-only leg
  to the same events): this card does not re-sort the same events. It scores every LIQ-500 member every week with
  one walk-forward linear model and tests only what the reporting-cycle and volatility terms add over a plain ridge
  on the same raw inputs, which is the control H-0064''s open question asks for (the same sort away from the predicted
  release). If the interaction-only picks do not beat peers, the lab learns that the window does not enlarge the
  concession beyond plain reversal and that the H-0064 pass was plain reversal in a subset or an era. Family short-term-reversal
  on purpose: the counterparty is the liquidity demander of H-0064 and H-0115, and its large trial count is the
  honest penalty. Forecasts (K-0120, K-0144, lead with the pessimistic case): view 2004-09..2020-12; predicted dates
  exist from about 2005-09, plus the walk-forward warm-up, so scored weeks from about 2006-2007, roughly 700-740
  weekly decision dates. About 10-15 % of members are in the pre window at a time (10/63 of the cycle times 8-K
  coverage). Interaction-only entrants: about 5-20 a week (the two ridges share the rev5 slope, so overlap of the
  top deciles is high), i.e. about 3500-14000 events on about 700 dates; the G1 minimum is safe unless the overlap
  is above 90 %. Round trip: LIQ-500 half spread 3-6 bps per side, about 11-12 bps (K-0125). Gross per event: pessimistic
  3 bps, central 12, optimistic 25. The first block (2004-2009) holds the 2008 crisis, when reversal was largest;
  the latest block is the expected weak one. Book: long-only, mean exposure about 0.85-0.9 (flat during warm-up),
  weekly turnover of about 60-80 % of the book with the 2 x top buffer, cost drag about 3.5-4.5 %/yr, so the book
  needs a gross excess of about 6 %/yr over SPY at similar risk; that is the most likely strategy death even if
  the mechanism passes. The top decile tilts to volatile recent losers, so its beta is above one; the abnormal return
  is against raw peers (K-0074), and a beta gap between interaction-only and plain picks is limited because both
  come from the same rev5-driven top decile. Not measured by the judge: the predicted-date hit rate (K-0035), the
  ridge coefficients, a side split. Likely deaths in order: placebo bar (same-stock placebos of volatile losers),
  latest third wrong-signed, G1 Sharpe margin after costs, G3 deflated Sharpe from the family''s trial count. Publication
  decay (2012, 2014 in dev) is an expected G2 risk.'
