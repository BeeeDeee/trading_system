falsification_criteria:
- Net Sharpe of the primary configuration on dev is below BTC buy & hold Sharpe + 0.10, or the one-sided 90 % bootstrap
  bound of the Sharpe difference is not above 0.
- Fewer than 75 % of the parameter neighbors (k_sigma 1.5/2.5, hold_days 2/4, regime_weeks 10/30 and their combinations)
  beat BTC buy & hold.
- With costs x2 the net Sharpe no longer beats BTC buy & hold.
- The strategy is not above the 95th percentile of random-entry runs with the same exposure and turnover.
- 'Mechanism (regime): the mean hold_days forward return (entry at t+1 open) of triggers in regime ON is not higher
  than that of the same trigger rule applied in regime OFF; then the leverage-bias condition carries no information
  and the regime filter is just a trend filter (already killed in study 9).'
- 'Mechanism (deleveraging): among triggers with a matching perp, those where the perp''s funding on day t is below
  its mean of days t-7..t-1 (leverage being flushed) do not have a higher mean forward return than those where it
  is not.'
- 'Mechanism (cascade shape): among triggers covered by binance_1h_features, drops where the worst UTC session carries
  at least two thirds of the day''s log decline (jump-like) do not rebound more than diffuse drops.'
notes: 'Brief: crypto, 1-5 day holding, combined timeframes. The weekly BTC regime gates a daily extreme-move entry
  (timeframes 1w + 1d); hourly-derived session returns are used only as a pre-registered mechanism diagnostic, to
  avoid a fourth tuned threshold in the rule. Family: filed under short-term-reversal on purpose. The economic mechanism
  (being paid for supplying liquidity to price-insensitive sellers) is the same as in the owner''s studies 5-7 (stock
  reversal, reversal when VIX > 25), so their trials should count against it. What is different and why it is worth
  a run: (a) the sellers are identifiable and truly forced (margin liquidations on 24/7 leveraged perps), not generic
  order imbalance; (b) study 7 concluded that the VIX-conditioned effect was the market bounce, not stock selection;
  this card does not try cross-sectional selection, it is a long-only timing of the bounce itself and is judged
  against BTC buy & hold and random entries with the same exposure and turnover; (c) the regime filter conditions
  on the side of leverage, which is a crypto-specific reason for the bounce, not a tuned trend filter. Known counter-evidence:
  Liu and Tsyvinski (Risks and returns of cryptocurrency, RFS) find time-series momentum in crypto at weekly horizons,
  so unconditional dip-buying should lose; the card bets that extreme one-day moves in long-leveraged regimes are
  dominated by forced flow. If it dies, the diagnostics say whether the regime, the deleveraging fingerprint or
  the cascade shape carried any information. Main risks: costs (about one entry per day of 0.25 weight in regime
  ON, 3-day holds: annual turnover is high and costs x2 is a hard gate); mean exposure near the 20 % floor because
  the strategy is in cash whenever the regime is OFF and no pair has triggered; few pairs exist in 2017-2018, so
  early dev contributes few trades. Perpetuals were considered and rejected for the long leg: in uptrend regimes
  funding paid by longs is high and would be a direct cost of exactly these trades; spot carries no funding.'
