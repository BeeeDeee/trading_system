id: H-0006
version: 1
title: Crypto liquidation-flush rebound - buy liquid coins after an extreme daily drop, only while BTC is in a weekly
  uptrend, hold 3 days
author_agent: scout
family: short-term-reversal
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 50
mechanism:
  counterparty: Over-leveraged long perp traders (mostly retail, high leverage) whose positions are closed at market
    by the liquidation engine at the worst price, plus stop-loss and panic sellers in spot who demand immediacy
    at the bottom of the cascade. They keep doing it because high leverage in a rising market is profitable most
    of the time and liquidation is involuntary once margin is gone.
  why: 'In crypto, a large share of open interest is leveraged perpetual-futures positions with exchange-enforced
    margin. When the market is in an uptrend, leverage is overwhelmingly long (traders chase the trend and pay funding
    to hold it), so an extreme down day is disproportionately a liquidation cascade: the exchange liquidation engine
    sells at market regardless of price, each forced sale pushes price into the next liquidation level, and arbitrageurs
    transmit the perp selling to spot. This is price pressure from forced, information-free sellers (the crypto
    analogue of the fire sales in Coval and Stafford 2007, and of the liquidity spirals in Brunnermeier and Pedersen
    2009). Price pressure of this kind is temporary: once the leverage is flushed the selling stops and prices partly
    revert over the next days, and whoever supplies liquidity in the flush is paid for it (Nagel 2012: returns to
    liquidity provision rise when liquidity evaporates). The weekly regime filter is part of the mechanism, not
    a tuning device: in a downtrend leverage is more balanced or short, and large drops are more often information
    or de-risking that continues (consistent with the time-series momentum documented for crypto), so those drops
    are not bought.'
  why_not_arbitraged: 'Supplying liquidity into a cascade means catching a falling knife: the drop may continue
    (a real crash, a hack, an exchange failure), so the trade has large left-tail risk exactly when market makers''
    and funds'' risk budgets are hit and when their own leverage is being cut (Brunnermeier and Pedersen). Capital
    that can act within a day across many altcoins is limited, the edge is per-event and volatile, and many crypto
    funds have mandates or drawdown limits that prevent buying after large losses.'
signal:
  description: 'Data: binance_spot_1d daily bars (UTC days, close at 00:00 UTC). Decisions after the close of day
    t using data up to that close; trades at the open of day t+1. (1) Universe on day t: the 50 USDT spot pairs
    with the highest mean daily quote_volume over the 30 days ending at t, among pairs with at least 60 days of
    price history at t (stablecoins and wrapped assets already excluded by the loader). If fewer than 50 pairs qualify,
    use all that qualify. (2) Weekly regime (1w): weeks run Monday 00:00 UTC to Sunday 24:00 UTC; the weekly close
    is the BTCUSDT daily close of the Sunday. At each weekly close compute SMA_N = mean of the last regime_weeks
    weekly closes of BTCUSDT (including the current one). Regime is ON for the whole following week if the weekly
    close is strictly above SMA_N, OFF otherwise (OFF until regime_weeks weekly closes exist). The regime used on
    day t is the one set at the last weekly close on or before t. (3) Daily trigger (1d): for each pair i in the
    universe, r_i,t = log(close_t / close_t-1) and sigma_i,t = the standard deviation of daily log returns over
    the 30 days ending at t-1 (today excluded). Pair i triggers on day t if regime is ON and r_i,t <= -k_sigma *
    sigma_i,t. Pairs with a missing close on t or t-1, or fewer than 30 return observations, do not trigger. (4)
    Positions: a trigger opens a long position at the open of t+1 that is held for hold_days days and closed at
    the open of t+1+hold_days. A new trigger on a pair already held does not add a second position; it resets the
    exit date to hold_days days after the new entry. Positions already open are held to their exit date even if
    the regime turns OFF or the pair leaves the top 50. (5) Weights: every day each open position gets weight 1
    / max(4, n_open), where n_open is the number of positions open after today''s entries and exits (so at most
    0.25 per pair and gross <= 1). Weights are recomputed daily; the remainder is cash (earns the T-bill rate per
    the engine). Long only, no leverage. (6) If a held pair has no bar (delisting or gap), the engine''s delisting
    rule applies.'
  params:
    hold_days:
      grid:
      - 1
      - 2
      - 3
      - 4
      - 5
      value: 3
    k_sigma:
      grid:
      - 1.5
      - 2.0
      - 2.5
      - 3.0
      value: 2.0
    regime_weeks:
      grid:
      - 10
      - 20
      - 30
      - 40
      value: 20
  selection_procedure: None. The primary configuration (k_sigma 2.0, hold_days 3, regime_weeks 20) is pre-registered;
    the grid only serves the G2 neighbor test. Universe size 50 and the 30-day volatility and volume windows are
    fixed conventions, not tuned.
  timeframes:
  - 1w
  - 1d
