falsification_criteria:
- 'Mechanism: the pooled side-adjusted twin-spread return at 5 sessions does not exceed the 95th percentile of the
  200 time-shifted placebos, or its gross per event is below the round-trip cost, or it has the wrong sign in two
  of the three sub-periods.'
- 'Mechanism shape: if the 1-session abnormal return is negative while the 10-session one is larger than the 5-session
  one, the gap is a slow drift (index difference), not flow pressure being arbitraged; treat as refuted even if
  the 5-session test passes.'
- Net Sharpe on dev below 0.5 (benchmark T-bill) or the bootstrap bound of the Sharpe difference to T-bills not
  above zero.
- Fewer than 75 % of the lookback_days x z_entry neighbors (10/40, 1.5/2.5) reach the T-bill benchmark Sharpe, or
  the median neighbor Sharpe is below 0.7 of the primary.
- With costs x2 the net Sharpe no longer beats T-bills, or more than 60 % of the log return comes from one of the
  three sub-periods (a single stress episode).
notes: 'Brief: short horizon (5 sessions), US ETFs across asset classes (credit, aggregate bonds, inflation-linked
  bonds, EM and developed equity), mechanism test declared. Fills the gap listed in prior_studies (''ETF creation/redemption''):
  no lab card or study has used the ETF wrapper itself. Why this is not the dead short-term-reversal family: the
  lab''s reversal cards (study 5, H-0007, H-0030, H-0006, H-0035) bet that an asset''s own return reverts against
  the cross-section; here asset-level reversal cancels by construction, because both legs hold the same basket and
  only the wrapper gap is traded, and the economic force is AP arbitrage of a premium, not investor overreaction.
  It is still liquidity provision; if the Chair judges the family to be short-term-reversal, count it there. It
  is also not the mrel lead-lag/autocorrelation result (MUB own autocorrelation): that was an unconditional own-return
  pattern found by a scan, this is a conditional twin spread with an arbitrage bound. Pair choice is a rule, not
  a return-based pick: every twin in the dev period that tracks the same or a near-identical index, has an underlying
  less liquid than the ETF or closed during US hours, and has two liquid legs; exact twins on liquid underlyings
  are excluded ex ante. Known risks, stated before the test: (1) index differences (JNK vs HYG indices; IEMG and
  IEFA include small caps) create fundamental spread moves that do not revert and dilute the effect; (2) events
  cluster in credit and EM stress, so the placebo cloud may be wide (K-0034) and the profit may sit in one block;
  the lab knows in general that bond ETF discounts widen in stress, which is why the block and cost checks are listed
  as kill conditions; (3) borrow fees on shorted ETFs are not modelled, so a pass is flattered; (4) the 25 bps floor
  and the 10 M USD liquidity screen are fixed, round, cost-motivated and not grid parameters; (5) with one open
  pair a leg weighs 0.5, above the paper sentinel''s 0.25 cap, irrelevant until ETF forward data exists (K-0014:
  at most G4). Benchmark is T-bill (market-neutral); idle cash is expected to earn the T-bill rate. Data start 2007-04-10
  (BND and HYG list in April 2007, JNK in December 2007); SCHP, IEMG, IEFA start later and join when they have L+1
  bars.'
