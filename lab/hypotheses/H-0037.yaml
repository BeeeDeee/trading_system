version: 1
title: Twin-ETF premium reversion - market-neutral, fade a large price gap between two US ETFs holding the same
  basket (HY credit, aggregate bonds, TIPS, EM and developed equity), hold 5 days
author_agent: scout
family: etf-premium-arbitrage
asset_classes:
- us_etf
universe:
  instruments:
  - HYG
  - JNK
  - AGG
  - BND
  - TIP
  - SCHP
  - EEM
  - IEMG
  - EFA
  - IEFA
  kind: instruments
mechanism:
  counterparty: Investors who demand immediacy in one specific wrapper (hedgers and tactical allocators selling
    or buying the most liquid credit or EM ETF in a hurry) and accept a price away from the twin; the strategy provides
    the liquidity across wrappers and is paid when APs and the flow reversal close the gap.
  why: 'Two ETFs that track the same (or a near-identical) index hold claims on the same basket, so their relative
    total return should be close to zero apart from small fee and index differences. When one wrapper takes a burst
    of one-sided flow (institutions use HYG, EEM, EFA, AGG as their liquid hedging and tactical vehicle, while advisors
    and retail sit in JNK, BND, IEMG, IEFA, SCHP), its price is pushed away from NAV and from its twin. Authorized
    participants close the gap only through creation and redemption, which for bonds and foreign stocks is costly
    and slow: the underlying trades less liquidly than the ETF or is closed during US hours, so the gap survives
    for days within an arbitrage band (Petajisto 2017 finds bands of up to about 100-200 bps, widest in bond and
    international funds, and short-term mean reversion of ETF prices measured relative to similar ETFs). Comparing
    an ETF with its twin, not with its NAV, removes the stale-NAV problem: both wrappers see the same stale underlying,
    so what remains of their price gap is wrapper-specific flow pressure, and the gap should shrink over the next
    days.'
  why_not_arbitraged: Creation/redemption needs AP balance sheet and trading of illiquid bonds or closed foreign
    markets, with creation fees and minimum unit sizes, so APs only act outside a band; a twin long/short needs
    ETF shorting (borrow fees for HYG/JNK can be high in stress) and has small capacity per pair; dealers' balance
    sheets are most constrained exactly when the gaps are widest.
signal:
  description: 'Pairs (A, B), fixed in advance: (HYG, JNK) US high yield, (AGG, BND) US aggregate bonds, (TIP, SCHP)
    US TIPS, (EEM, IEMG) emerging-market equity, (EFA, IEFA) developed ex-US equity. Exact twins on liquid underlyings
    (SPY/IVV, IJH/MDY, GLD/IAU) are excluded by rule because their gaps are arbitraged intraday and cannot cover
    costs. Daily, after the close of day t, using data up to that close only: for each instrument build a total-return
    index from ret_co and ret_oc (cumulative product of (1+ret_co)(1+ret_oc)). For each pair, x_t = ln(TR_A,t) -
    ln(TR_B,t). Using the previous lookback_days sessions t-L..t-1 (L = lookback_days), m_t = mean of x, s_t = sample
    standard deviation of x; z_t = (x_t - m_t) / s_t and d_t = x_t - m_t. A pair triggers on day t when |z_t| >=
    z_entry AND |d_t| >= 0.0025 (a fixed 25 bps floor so that a gap can cover the round trip of two legs) AND both
    legs have a bar on day t and on all L previous sessions AND both legs have a 20-session median dollar volume
    of at least 10 million USD. Direction: if d_t > 0 (A rich versus B) short A and long B; if d_t < 0 long A and
    short B. Holding: a triggered pair is opened at the open of t+1 and held for 5 sessions, i.e. it is set to zero
    by the decision after the close of t+5 and traded out at the open of t+6. A new trigger of an open pair in the
    same direction restarts the 5-session clock; a trigger in the opposite direction flips the pair at the next
    open. Weights: with n pairs open after the close of t, each open pair gets gross 1/n, split +1/(2n) on the cheap
    leg and -1/(2n) on the rich leg (total gross <= 1, net zero). Target weights change only when the set of open
    pairs or a direction changes. A pair whose leg has no bar on a day (not yet listed, or a vendor-spike day dropped
    by the loader) cannot trigger that day; an open position in it is kept and closed at the first session after
    the scheduled exit on which both legs trade. Pairs are eligible only after both legs exist with L+1 bars, so
    (TIP, SCHP) enters after SCHP lists and the equity pairs after IEMG and IEFA list; before that the book trades
    the pairs that exist. Cash when no pair is open.'
  params:
    lookback_days:
      grid:
      - 10
      - 20
      - 40
      value: 20
    z_entry:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: 'A twin pair triggers after the close of day t (|z_t| >= z_entry and |d_t| >= 25 bps as in the signal).
    The event is marked on both legs: the rich leg with side -1 and the cheap leg with side +1. Every trigger day
    is an event. Because both legs of a pair are marked together, the pooled side-adjusted abnormal return equals
    (up to a factor) the twin spread return from the open of t+1 to the close of t+h; market and asset-class moves
    cancel.'
  horizons:
  - 1
  - 2
  - 5
  - 10
  primary_horizon_days: 5
