title: Intraday liquidation-cascade rebound on Binance perps - fade 1-hour moves of 4+ sigma on 3x volume dominated
  by aggressive takers, both sides, hold 2 hours
author_agent: scout
family: short-term-reversal
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Over-leveraged traders whose positions are force-closed at market by the liquidation engine (and
    stop-loss orders clustered at the same levels). They do not choose the price or the timing, so they pay the
    concession. They keep doing it because high leverage is cheap and marketed on perpetual venues, and each new
    cohort of retail leverage repeats the pattern.
  why: 'On Binance USD-M perpetuals a leveraged position whose margin runs out is closed by the exchange''s liquidation
    engine with a market order, regardless of price. When price moves fast, each forced market order pushes price
    further and triggers the next band of liquidations (a cascade), so the move overshoots the price that voluntary
    traders would accept. The footprint is a very large move over about an hour, several times the normal volume,
    executed mostly by aggressive takers on one side (taker-sell for a long cascade, taker-buy for a short squeeze).
    Liquidity providers who absorb that flow demand a price concession, and it is repaid as the forced flow stops
    and the order book refills, over minutes to hours (Grossman-Miller inventory story; Brunnermeier-Pedersen liquidity
    spirals). The strategy is the late liquidity provider: after a flagged cascade it takes the other side for a
    fixed two hours.'
  why_not_arbitraged: Absorbing a cascade means buying into a falling market at the moment of maximum volatility,
    when market makers widen or pull quotes, their own margin is under stress and inventory limits bind; capital
    that can stand in is scarce exactly then (limits to arbitrage). The concession is episodic and capacity is small,
    which does not interest large funds, and a cascade can continue (falling knife), so the premium is compensation
    for real risk. Taking the trade one candle late with taker orders, as here, gives up the first part of the rebound;
    the card claims only that enough is left over two hours.
signal:
  description: 'Data: binance_perp_15m candles (o, h, l, c, qv, tbq, real, listed, universe). All quantities use
    only candles closed up to and including candle t; the decision is made after the close of candle t and filled
    at the open of candle t+1. Eligible instrument at t: in the point-in-time top-20 universe at t, listed, at least
    672 real candles of history, and the four candles t-3..t all real (no gap-filled candle). Features for each
    eligible instrument at t (window of W = 4 candles = 1 hour, fixed): (1) r_w = ln(c[t] / c[t-4]), the 1-hour
    log return; (2) sigma = standard deviation of the 15-minute log returns over the 672 candles (7 days) ending
    at candle t-4 (the window itself excluded); z = r_w / (sigma * 2), i.e. the 1-hour move in units of its normal
    1-hour volatility (sqrt(4) = 2); (3) vol_ratio = sum of qv over t-3..t divided by (4 x the mean qv per candle
    over the same 672 candles ending at t-4); (4) taker_buy_share = sum of tbq over t-3..t / sum of qv over t-3..t.
    Long-cascade event (go LONG): z <= -z_threshold AND vol_ratio >= 3 AND taker_buy_share < 0.5. Short-squeeze
    event (go SHORT): z >= +z_threshold AND vol_ratio >= 3 AND taker_buy_share > 0.5. Position: on an event, open
    a position of weight +1/20 (long event) or -1/20 (short event) of equity at the open of t+1, and close it at
    the open of candle t+1+hold_candles (time exit only, no stop, no target). One position per instrument at a time:
    events on an instrument that already holds a position are ignored (no extension, no reversal, no pyramiding).
    Several instruments may hold positions at once (a market-wide cascade fires on many names together); the fixed
    1/20 slot keeps gross exposure at or below 1 without any re-normalization. An instrument that leaves the top-20
    universe while in a position is still closed on schedule. Funding is charged by the engine when a position spans
    a settlement candle. Missing or gap candles: no new event can fire on them (eligibility rule); an open position
    exits at the first real candle at or after its scheduled exit. Constants fixed by design and not on the grid:
    W = 4 candles, 672-candle reference window, volume multiple 3, taker-share split 0.5, slot 1/20.'
  params:
    hold_candles:
      grid:
      - 4
      - 8
      - 16
      value: 8
    z_threshold:
      grid:
      - 3
      - 4
      - 5
      value: 4
  timeframes:
  - 15m
