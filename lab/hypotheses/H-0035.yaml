falsification_criteria:
- 'Fewer than 300 trades in the 2020-2022 dev period at the primary configuration (z 4, hold 8): the event is too
  rare to be a strategy.'
- Net Sharpe of the primary configuration below 0.5, or the 75 % bootstrap bound of the mean net trade return at
  or below zero.
- 'At doubled costs the mean net trade is not positive: the concession is smaller than about four taker legs plus
  slippage and is not harvestable as a taker.'
- 'Sharpe with a one-candle later fill below half the primary Sharpe: the edge would be a first-print bounce of
  a few minutes, not the hours-long liquidity concession the mechanism claims.'
- 'The same trades placed at random times are not beaten at the 95th percentile: the profit belongs to holding perps
  in volatile periods, not to the cascade timing.'
- 'Mechanism: the mean gross trade return does not rise from z_threshold 3 to 5 (in the neighbor runs). Larger forced
  dislocations must leave larger concessions; if they do not, the rebound is not a liquidity premium.'
- Fewer than 75 % of the parameter neighbors (z 3/5, hold 4/16 and their combinations) have a positive net Sharpe,
  or fewer than two of three sub-periods are positive, or one sub-period carries more than 60 % of the profit.
notes: 'Family: short-term-reversal, reused on purpose. H-0006 (crypto liquidation-flush rebound, daily, long-only,
  BTC weekly trend gate) shares the liquidity-provision mechanism, so this card counts against the same family.
  Why it is different from what died: (1) H-0006 measured the flush with a daily drop, which mixes forced liquidations
  with slow news-driven repricing; its lesson asked for a jump-like versus diffuse split. Here the event is the
  jump itself, on 15-minute candles, identified by its liquidation footprint (one-hour move of 4+ sigma, 3x volume,
  aggressive takers on the moving side), and the hold (2 hours) matches the time an order book needs to refill,
  not 3 days. (2) No BTC trend filter and not long-only: short squeezes are the mirror case and double the events,
  so the book is not a disguised dip-buy (study 9, 13, H-0006 lesson). (3) mrel-1h found unconditional hourly reversal
  real but untradable as a taker because of turnover; this card trades only a rare extreme subset where the expected
  rebound per trade should be several times the 13-25 bps round trip, so turnover is a small fraction of mrel-1h''s.
  If the conditional rebound is not large enough to pay taker costs, this card dies on cost and doubled cost, and
  that settles that crypto reversal is a maker-only effect at every horizon the lab can test. Costs: top-20 names
  pay 5 bps fee + 1.5 to 6 bps slippage per side, so 13 to 22 bps round trip (26 to 44 at 2x). Volatility at the
  event is high, so modeled slippage is optimistic (catalog known bias); the doubled-cost gate is the guard. Clustering:
  market-wide cascades fire on many names at once, so trades are correlated; the fixed 1/20 slot caps gross, and
  the sub-period gate checks that a single crash episode does not carry the result. Expected trade count at z 4
  with the volume and taker filters is several hundred to a few thousand over three years in 20 names, but this
  is not measured; z 5 may fall near 300. No mechanism_test, as required for the intraday branch. No 5m data needed:
  a one-hour cascade is visible on 15m candles. Funding is not used as a signal (kept to two grid parameters); a
  funding-crowding split would be a separate card. References are theory of liquidity provision, not a published
  backtest of this rule; they are cited because the mechanism rests on them, accepting the literature-prior trials.'
