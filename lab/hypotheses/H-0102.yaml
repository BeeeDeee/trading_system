id: H-0102
version: 1
title: Sophistication-conditioned earnings-reaction drift, learned - LIQ-500 long-only 5-day slots in 8-K reactions
  ranked by LightGBM on reaction x 13F ownership x idio vol
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Less sophisticated holders (retail and non-13F holders, who make up more of the register in low-IO
    firms) who underweight the new earnings information and keep selling into good news or holding through bad news
    at pre-release valuations. The strategy buys from them after a good release.
  why: 'After an earnings release the price keeps moving in the direction of the release-session reaction, because
    part of the shareholder base anchors on old earnings and updates slowly (Bernard and Thomas 1989). The literature
    says the drift is not uniform: it is larger where fewer holders are sophisticated, measured by the share held
    by institutions (Bartov, Radhakrishnan and Krinsky 2000), and where the stock''s idiosyncratic risk makes arbitrage
    expensive (Mendenhall 2004). So the claim is about the slope on the reaction: the slope should be steep where
    institutional ownership is low and idiosyncratic volatility is high, and flat in widely held low-risk names.
    The lab has shown the plain reaction drift in LIQ-500 (H-0028, H-0031, H-0033) and that second variables tried
    so far did not change it (release load, overnight gap). Institutional ownership from 13F is a new information
    source for this family. It measures who holds the stock, not when the news came out. The test is whether a small
    gradient-boosted model can pick out the reactions with the steepest slope, giving gross drift per entry clearly
    above round-trip cost in 2014-2020. That is the part of dev where the pooled effect has been weakest.'
  why_not_arbitraged: The drift is a few tens of basis points per week. Taking it means holding single names with
    high idiosyncratic risk over a few days (Mendenhall's arbitrage risk). Low-IO large caps are often controlled
    or closely held firms that institutions underweight by mandate. Releases cluster in a few weeks per quarter,
    so capital that wants to harvest it needs to be idle most of the time.
signal:
  description: 'Data up to the close of day t; trades at the open of t+1. Rows used: release rows, i.e. (t, stock)
    with ea_reaction_day = 1 on t (sec_8k_item202) while the stock is a point-in-time LIQ-500 member on t. Only
    release rows with all six features present are trained on and scored. Features (each computed from data up to
    the close of t for every universe member, then z-scored across all universe members on date t with the framework
    helper, so a feature means the same on busy and quiet release days): (1) reaction_z = release-session close-to-close
    total return of t, (1 + ret_co of t) x (1 + ret_oc of t) - 1, minus the cross-sectional median of the same return
    over all members on t, divided by the standard deviation of the stock''s daily close-to-close total returns
    over the 63 sessions ending t-1; (2) f13_io = institutional ownership of the latest usable 13F quarter (sharadar_13f,
    as delivered by the loader: quarter usable 46 days after its end, stale after 166 days -> NaN, row not scored);
    (3) liquidity = log of the mean dollar_volume over the 63 sessions ending t-1; (4) release_volume = dollar_volume
    on t divided by the median dollar_volume over the 63 sessions ending t-1, log; (5) runup = total return over
    the 21 sessions ending at the close of t-1 minus the cross-sectional median of the same; (6) idio_vol = standard
    deviation over the 63 sessions ending t-1 of the stock''s daily total return minus the equal-weight mean return
    of all members that day (a market-adjusted residual). Label (framework): total return from the open of t+1 to
    the open of t+6 (horizon_days 5), ranked across the universe on each date. Model: lab.framework.ml.walk_forward
    with model gbm, training sample = release rows only (sample mask), expanding window, refit every 63 trading
    rows (about one earnings season), purge by the framework. Fixed gbm settings (not tuned): num_leaves 8, min_child_samples
    200, learning_rate 0.05, subsample 0.8, colsample 1.0; n_estimators from params. No row is scored before the
    first fit; the first fit happens as soon as the framework''s minimum training sample of release rows is reached.
    Entry rule: on each date t, a scored release row is an entry if its score is at or above the (1 - top) quantile
    of the scores of all scored release rows in the trailing 126 sessions including t (point in time, the quantile
    is computed only from rows already scored; if fewer than 100 scored rows exist, no entries). Book (long-only,
    slots): each entry buys at the open of t+1 with fixed weight 1/slots (slots = 20, weight 0.05) and is sold at
    the open of t+6 (5 sessions). Weights are not re-equalized while held. If the open positions plus new entries
    would exceed gross 1.0, new entries are admitted in descending score order until gross is 1.0 and the rest are
    skipped. Everything not in slots is cash (T-bill rate of the engine). A held stock that leaves the LIQ-500 universe
    before its exit is sold at the next open at which the engine refuses its weight (exit rule tolerating universe
    changes, K-0051). A stock with a second release row while held keeps its single slot (no stacking).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: A release row (ea_reaction_day = 1 on day t, stock a LIQ-500 member on t) whose walk-forward gbm score
    is at or above the (1 - top) quantile of all scored release rows in the trailing 126 sessions including t; side
    +1 (expected to outperform the other members from the open of t+1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'reaction_z: release-session close-to-close total return minus the cross-sectional median, divided by the stock''s
    63-session daily return std up to t-1. This is the news: the market''s own read of the surprise.'
  - 'f13_io: institutional ownership of the latest usable 13F quarter (sharadar_13f, lag 46 days). It measures how
    sophisticated the holders are. Bartov et al. find drift decreasing in IO.'
  - 'liquidity: log 63-session mean dollar volume up to t-1. It proxies size and analyst coverage, and it is the
    control Bartov et al. found to lose power once IO is present.'
  - 'release_volume: log of release-session dollar volume over its 63-session median. It measures how much attention
    and disagreement the release drew.'
  - 'runup: 21-session market-adjusted return before the release session. Information that leaked before the release
    leaves less to drift afterwards.'
  - 'idio_vol: 63-session std of market-adjusted daily returns. This is arbitrage risk (Mendenhall 2004): high idiosyncratic
    risk keeps arbitrageurs from closing the drift.'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The mechanism is multiplicative. The drift is reaction x (low sophistication, high arbitrage
    risk), so the slope on the reaction changes with IO and idiosyncratic volatility. The response to the reaction
    is also threshold-like: small standardized reactions are noise and only large ones carry information beyond
    the release day (the lab''s reaction cards used a z threshold for that reason). A ridge on the same six z-scored
    features gives the reaction one slope in every state and adds IO and volatility as level effects. Those levels
    on their own predict persistent style returns that the same-stock placebo absorbs, not timing. Shallow trees
    (8 leaves) can split the reaction by IO and volatility and find the steep-slope cells. Who pays is the less
    sophisticated holder base of low-IO, high-risk names, where institutions do not trade the news away within a
    week. If ridge on the same features, rows, schedule and book does as well, the claim is false and the edge,
    if any, is the plain reaction drift.'
