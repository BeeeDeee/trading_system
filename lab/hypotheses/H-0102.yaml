falsification_criteria:
- 'Mechanism test: entries (top-fifth model score on release rows) do not beat the 95th percentile of the time-shifted
  placebos at 5 sessions, or their gross abnormal return per entry is below the round-trip cost.'
- The latest third of the event-study period (about 2018-2020) has a negative abnormal return. That is the decay
  that K-0060 expects, and it is a declared kill condition.
- The effect is absent at 1 and 3 sessions and appears only at 10 (slow style drift, not a release response).
- Net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the difference at or below zero (G1).
- Fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat SPY_TR, or doubled costs leave Sharpe below
  SPY_TR (G2).
- A ridge regression (framework ridge) on the same six features, release rows, refit schedule, entry rule and book
  is as good as or better than the gbm (event gross and book Sharpe), so the interaction with sophistication and
  arbitrage risk is not what pays.
- Entries in the top fifth are not tilted toward below-median f13_io among same-quarter reporters (Builder's descriptive
  check). The model then does not use the sophistication channel, whatever the result.
notes: 'Why this is not a retry of H-0095, H-0100 or H-0101: those cards conditioned the same reactions on price
  shape (gap versus intraday), release load or reaction features alone. This card adds who holds the stock (13F
  institutional ownership), the variable Bartov et al. found to absorb size, price and volume, together with Mendenhall''s
  arbitrage risk. K-0141 asked for a new information source or different stocks; low-IO, high-idio-vol reporters
  are the less covered corner of LIQ-500. It is filed in post-earnings-announcement-drift on purpose, so its trials
  count there. Period: 13F data start with the quarter ending 2013-06 (usable from about mid-August 2013), so the
  card''s view runs from mid-2012 to the end of dev. The year before 13F only warms up the 63-session features and
  LIQ-500 membership (in case membership history is computed inside the view). With the first fit after the framework''s
  minimum sample of release rows, scored entries start about one to two earnings seasons later. The first third
  of the view (mid-2012 to about mid-2015) therefore holds only about a year of entries. That is a known weakness
  (cf. H-0101) and the reason the view does not start earlier. Do not fill IO before 2013. No date literals in code:
  the view period does it. Forecast (write-down before any run, K-0098/K-0120/K-0140): release rows in LIQ-500 about
  1,500-1,800 per year, so about 9,000-11,000 scored rows from 2014 to 2020; entries at top 0.2 about 1,800-2,300
  on 700-1,000 dates. Round trip about 10-12 bps (LIQ-500, decimal era). Gross abnormal 5-session return per entry:
  the lab''s positive-reaction sets cleared cost (H-0033), so the forecast is 15-30 bps. If it is a quarter of that
  (4-8 bps), the card dies on cost, and the conclusion is that sophistication conditioning does not make large-cap
  drift tradable after 2013. Placebo bar: probably about 8-12 bps (H-0100 measured about 8 on release rows), so
  a pass needs the upper half of the forecast. Exposure: releases cluster. In peak weeks the 20 slots fill to gross
  1.0 and later entries are skipped. Off season the book is mostly cash. Expected mean exposure 0.3-0.45 (the floor
  is 0.2), about 5-15 names at a time. Beta gap (K-0074): entries are recent good-news names with about market beta.
  Low-IO names may have a slightly lower beta than peers, which would bias the raw G1 comparison against the card
  in 2014-2020 up markets, not for it. Strategy risk: a slot book of 5-20 names carries idiosyncratic risk. To beat
  SPY_TR + 0.10 it needs net drift of roughly 20 bps or more per entry. That is the most likely death after the
  mechanism test, as in H-0033. Requests to the Builder (descriptive, if a channel exists): event-study gross for
  the ridge model with the same entry rule, share of entries with IO below the reporters'' median, and events per
  year.'
