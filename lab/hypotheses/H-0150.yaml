falsification_criteria:
- Fewer than 300 trades on BTCUSDT + ETHUSDT in the 2020-2022 dev period with the primary configuration (the setup
  is too rare to judge).
- Net Sharpe of the primary configuration on dev below 0.5, or the one-sided 75 % bootstrap bound of the mean net
  trade at or below zero.
- 'Mean gross return per trade below the round-trip cost of the same trades (about 13 bps at BTC/ETH tiers): the
  held VWAP test carries no move a taker can harvest.'
- 'With a one-candle later fill the Sharpe falls below half of the primary''s: the edge is the confirmation candle''s
  microstructure, not a rotation to the far band.'
- Fewer than 75 % of the grid neighbors (confirm_bars 0 and 6, i.e. the owner's test-candle entry variant and a
  slower confirmation; tol_atr 0.0 and 0.25; the 2R target) have a positive net Sharpe, or their median Sharpe is
  below 0.7 x the primary's.
- The strategy does not beat the 95th percentile of the same trades placed at random times, or fewer than 2 of 3
  dev sub-periods are positive, or one sub-period carries more than 60 % of the return.
- 'Mechanism: the claim is symmetric (a held VWAP shows which side controls, in either direction); if the long and
  short trades do not both have a positive mean gross return, the result is a 2020-2021 bull-market drift artefact,
  not VWAP rotation.'
- 'Leaflet claim ''higher volatility days are better'': cutting the primary configuration''s dev trades into terciles
  of ATR/price at the signal candle, if the top tercile''s mean net trade is not above the bottom tercile''s, the
  claim is refuted for this setup.'
notes: 'owner_seed: VWAP-C4

  What this is: setup 4 of the owner''s VWAP Wave leaflet, written as an exact rule. The owner''s description is
  followed literally (24-candle context window, test candle low <= V + tol and close > V, confirmation = first close
  above the test candle''s high within 3 candles, a close below V cancels, stop = lowest low since the test candle
  - 0.25 ATR, target = band U at the signal or 2R). Details I had to fix because the leaflet leaves them open, chosen
  as round values and not tuned: UTC-day session with 00:00 UTC anchor (the convention of H-0147 to H-0149); value
  area = +-1.0 volume-weighted sigma around VWAP; VWAP weights = qv/tp (base volume, since the panel has quote volume
  only); ATR = Wilder 14 on 5m candles; tol expressed in ATR units (tol_atr); no events in the first hour of a session
  (bands degenerate) and no new signals in the last hour (no time to reach the target); stops and targets checked
  on closes and filled at the next open (the intraday engine fills only at candle opens; an intrabar stop is not
  implementable honestly); time exit at the session end, because the bands and VWAP that define the trade reset
  at 00:00 UTC; for the band target, a signal whose close is already beyond the band is skipped (the target would
  be behind the entry).

  Owner''s variants as grid neighbours, so the judge runs them in G2 if G1 passes: confirm_bars = 0 is the owner''s
  ''second entry variant at the close of the test candle''; target 2R is the owner''s alternative target. Primary
  = confirmation within 3 candles and band target, because the band is the mechanism''s own target (the rotation
  to the far side of value) and the confirmation is the leaflet''s anti-trap rule. target is a two-value categorical,
  so its only neighbour is 2R.

  Owner''s volatility claim: the judge does not report terciles (K-0193, K-0191), so the strategy logs ATR/price
  at each signal and the claim is pre-registered as a falsification criterion; the Builder or Chair must produce
  the tercile table from the primary run''s trade log on dev (top vs middle vs bottom tercile: trades, gross and
  net mean per trade). Pre-registered expectation: the claim does NOT hold after costs. H-0138 found the same kind
  of claim (high-volatility sessions are better for an intraday breakout) refuted on BTC/ETH 15m in 2020-2022. A
  fixed-bps cost is a smaller share of a larger ATR, which favours the top tercile mechanically, so a top-tercile
  win is only informative if gross per trade in R units (not bps) is also higher there.

  Relation to siblings, why this is not a near-copy: H-0149 (setup 3) traded the re-entry itself toward VWAP and
  died at G1 on Sharpe. Setup 4 trades a later and different event: the first VWAP test after a re-entry, in the
  direction of the side of VWAP that held, toward the far band. After an excursion above U, setup 3 shorts the re-entry
  toward V; setup 4 buys a held VWAP test back toward U, i.e. it partly takes the other side of H-0149''s trade,
  which is where its counterparty argument comes from. H-0147 (acceptance outside value, pullback to the old band
  edge) and H-0148 (rejected band-edge test, target VWAP) use band edges, not VWAP, as the decision level. Same
  family by design: the mechanism is the same session VWAP/value-area structure, and this card''s trials count against
  session-vwap-bands-crypto.

  Forecast (honest): BTC and ETH together, roughly 0.5-1.5 primary trades per instrument-day after the filters,
  so about 1,000-3,000 dev trades (well above 300). Typical risk R about 1.5-2 ATR (roughly 30-70 bps on 5m BTC
  in 2020-2022), distance to the band target often 1-3 R. Central expectation for mean gross per trade +5 to +15
  bps against a round trip of about 13 bps, i.e. net near zero or slightly negative; holding times of 30 minutes
  to a few hours. Most likely death: G1, net Sharpe below 0.5 and the bootstrap bound of the mean net trade below
  zero, like the three sibling setups and the 15m taker rules (K-0187, K-0189, K-0194, study 16: holds under about
  two days lose on a 13-15 bps round trip). Second most likely: the one-candle delay in G2, because the confirmation
  close is a 5-minute breakout whose first minutes may carry the move. If it dies at G1 the lab learns that a held
  VWAP test after a return to value, the leaflet''s best-defined continuation setup, does not cover taker cost on
  the two most liquid perps; that would close the family for taker execution.

  No mechanism_test: the intraday judge has none (scalping cards must not declare one). No references: the setup
  comes from a trading leaflet, not the literature; I know of no paper testing it.

  Data: binance_perp_5m is in the catalog with loader intraday and covers the dev period, so nothing is missing.
  Gross per trade, the side split and the tercile table should be reported by the Builder from the dev trade log
  of the primary run whatever the gate result (K-0193).'
