id: H-0150
version: 1
title: 'VWAP Wave setup 4 - VWAP hold after a return into the UTC-session value area, BTC/ETH perps 5m: enter on
  a close beyond the test candle, target the far band, both sides'
author_agent: scout
family: session-vwap-bands-crypto
asset_classes:
- crypto_perp
universe:
  instruments:
  - BTCUSDT
  - ETHUSDT
  kind: instruments
mechanism:
  counterparty: Traders who faded the return into value expecting a full rotation through VWAP (the H-0149 trade
    direction after an excursion above the band) and placed protective stops just above the test candle's high;
    their covering is the flow the confirmation close front-runs. Also late sellers who treat a touch of VWAP as
    a breakdown and are squeezed when VWAP holds, and VWAP-benchmarked execution (OTC desks, execution algos) that
    buys below session VWAP and steps back above it, which makes VWAP a soft floor while their orders last.
  why: 'The session VWAP (anchored at 00:00 UTC) is the average cost of everyone who traded this session, and the
    +-1 sigma volume-weighted bands around it mark the session''s value area. After price has been outside value
    and comes back inside, the market is undecided about which side of value it rotates to. The first test of VWAP
    after that return is where the decision shows: if a candle probes down to VWAP and closes above it, and the
    next few candles close above that test candle''s high, buyers defended the session''s average cost and the rotation
    should continue toward the upper band (mirror for shorts). The claim is that a held VWAP test that is confirmed
    by a close beyond the test candle predicts a move to the far band large enough to pay a taker round trip; the
    confirmation close and the stop below the test low (minus a quarter ATR) are the leaflet''s protection against
    VWAP break-and-reclaim traps.'
  why_not_arbitraged: 'Small, fast and noisy: each setup is worth tens of basis points, the round trip at taker
    cost is about 13 bps on BTC/ETH and more in fast markets, and break-and-reclaim traps make the per-trade distribution
    wide, so capital-heavy arbitrageurs do not size into it. Whether anything is left after a taker round trip is
    exactly what this card tests; the prior from the three sibling setups (all rejected at G1 on Sharpe) is low.'
signal:
  description: 'Data: Binance USD-M perpetual 5-minute candles of BTCUSDT and ETHUSDT (o, h, l, c, qv, real). Each
    instrument is handled independently; each holds at most one position at a time with weight +0.5 (long) or -0.5
    (short) of equity, flat otherwise, so gross <= 1. Decisions after the close of each 5-minute candle t use data
    up to that close only; every order fills at the open of candle t+1. (1) Session and bands. A session is one
    UTC calendar day (first candle opens 00:00 UTC). For every closed candle t of the session, typical price tp
    = (h+l+c)/3, base volume w = qv/tp; V_t = sum(w*tp)/sum(w) over the session''s candles up to and including t;
    sigma_t = sqrt(sum(w*(tp-V_t)^2)/sum(w)) over the same candles; U_t = V_t + 1.0*sigma_t, L_t = V_t - 1.0*sigma_t
    (value area [L, U]). Candles with real = false (gap rows) get weight 0 and can be neither a re-entry, a test,
    nor a signal candle. Bands are undefined (no events) in the first 12 candles of a session (00:00-00:55 UTC).
    ATR_t = 14-candle Wilder average true range of the 5m candles through candle t. (2) Return into value (context).
    A re-entry happens at candle r when c[r-1] is outside [L_{r-1}, U_{r-1}] (above U or below L, either side) and
    c[r] is inside [L_r, U_r]; both candles in the current session and after the warm-up. (3) Long test candle b:
    there was a re-entry r with b-24 <= r <= b-1 in the same session; c[b-1] is inside value and above V (V_{b-1}
    < c[b-1] <= U_{b-1}); l[b] <= V_b + tol_atr*ATR_b; and V_b < c[b] <= U_b. Short test candle (mirror): re-entry
    within the 24 candles before b; L_{b-1} <= c[b-1] < V_{b-1}; h[b] >= V_b - tol_atr*ATR_b; and L_b <= c[b] <
    V_b. (4) Entry signal. Long: the first candle s in b+1 .. b+confirm_bars with c[s] > h[b]; the setup is cancelled
    if any candle from b+1 up to s closes below its V, or if no such s occurs within confirm_bars candles. Short
    mirrored (c[s] < l[b]; cancelled by a close above V). confirm_bars = 0 is the owner''s second entry variant:
    the signal is the test candle itself (s = b), no confirmation. No signal is taken if the instrument already
    holds a position, in the last 12 candles of the session (signal candles closing at or after 23:00 UTC), or,
    for the band target, if c[s] is already at or beyond the target band (c[s] >= U_s for a long, c[s] <= L_s for
    a short). If a long and a short signal occur on the same candle (impossible by construction, listed for completeness)
    none is taken. Enter at the open of s+1. (5) Stop, target, exits. Long stop = (lowest low of candles b .. s)
    - 0.25*ATR_s; short stop = (highest high of b .. s) + 0.25*ATR_s. R = |c[s] - stop|. Target, fixed at the signal
    candle: target = band means U_s for a long and L_s for a short; target = 2R means c[s] + 2R (long) or c[s] -
    2R (short). After each closed candle while in a position: exit if the close is at or beyond the stop (long c
    <= stop, short c >= stop), or at or beyond the target (long c >= target, short c <= target); the exit fills
    at the next open. Any position still open after the close of the session''s last candle (23:55 UTC) is closed
    at the 00:00 UTC open of the next session. Stop and target never move. After an exit a new trade needs a new
    test candle after the exit candle. (6) Logging for the owner''s report (descriptive, not a filter): for every
    trade record side, entry and exit time, gross and net return, exit reason (stop, target, session end) and ATR_s
    / c[s] at the signal candle.'
