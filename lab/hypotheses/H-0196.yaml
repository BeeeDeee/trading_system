falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos, or keeps its sign in fewer than two of the three dev blocks.'
- 'Mechanism size: gross abnormal return per event below 1.5 x the round-trip cost of the event stock (about 18
  bps at a 12 bps round trip). Generic no-news droppers in LIQ-500 already earned about one round trip (H-0030,
  H-0195), so a smaller number means the buyback channel adds nothing visible.'
- 'Mechanism shape: the abnormal return keeps growing from 5 to 10 sessions by more than half of its 5-session value
  (slow drift of the buyback or quality anomaly, not a concession absorbed while the window is open), or the 1-session
  value is negative.'
- 'Era: the first dev block (the one holding the recession, when firms cut buybacks while generic stress rebounds
  peak) carries more than 60 % of the event average while the latest block is zero or negative: that is stress rebound
  (K-0084), not buyback support.'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbours of z_min 2.0 (1.5, 2.5) and window_close 35 (25, 45) clear the
  bar, or the book fails at doubled costs.'
notes: 'Why this is not another refiling of the no-news reversal (K-0237 says another price filter on LIQ-500 droppers
  has a low prior and asks for a new information source): the new element is a counterparty the lab has not used,
  the firm''s own buyback demand, identified with two non-price inputs, the reported trailing repurchases (SF1 ncfcommon)
  and the insider-trading window inferred from the real 8-K release dates. The price filter is deliberately plain
  (one-day standardized drop, no news). Family: the payoff is a rebound after a non-information drop, i.e. liquidity
  provision, so I kept short-term-reversal with its trial count instead of a new name; the buyback inputs also overlap
  with trading-window-flows (H-0019 passed at the filing anchor, H-0027 failed at the release anchor with no price
  condition). The difference to H-0027 is state dependence: the claim is that the buyback bid has price impact when
  there is selling to absorb, not on average. Point in time: ncfcommon and marketcap are ART as reported, usable
  from the day after the filing (marketcap frozen at the filing, used only as a scale); the window uses the 8-K
  reaction session, known at its close. In a recession firms suspend buybacks that the trailing figure still shows,
  which works against the card in the earliest block; that is why the era criterion is written as a kill condition.
  Forecasts (K-0120, K-0098): drop days with |z| >= 2 are about 2-3 % of stock-days, about 2 % without any 8-K;
  times about half of sessions inside the window and one third repurchasers gives about 250-450 events a year over
  roughly 16 dev years: 4000-7000 events on 2000+ dates (pessimistic 2500). Events cluster in high-dispersion weeks,
  so expect fewer slots filled than the average suggests. Concurrent slots about 5-8, so mean exposure about 0.3-0.45
  on the long leg (0.6-0.9 gross). Costs: event stock round trip about 12 bps, hedge (most liquid names) about 5-6
  bps, so about 18 bps per event in total. Book arithmetic: with about 350 entries a year at 0.06, the yearly gain
  is 350 x 0.06 x (gross - 18 bps); idiosyncratic risk of about 6 slots at 35 % annualized vol gives about 5 % vol.
  Sharpe 0.5 needs gross of about 30 bps per event; at the generic rebound (about 12 bps) the book loses, so the
  strategy passes only if the buyback channel is real and roughly doubles the rebound. Expected beta gap: event
  stocks are mature repurchasers (beta near 1) against mega-cap hedges, and the hedge is scaled by the stock''s
  own beta, so the raw-peer event study should carry little market direction (K-0074). Side split is not an issue
  (one side). Controls I would want next, not run by the judge: the same drops in repurchasers during the blackout
  window, and in non-repurchasers inside the window; if those rebound as much, the channel is generic reversal.
  No date literals and no named stocks; the window bounds are round numbers from typical insider-trading policies
  (opens one or two full sessions after the release, closes about two weeks before the quarter end), not fitted.'
