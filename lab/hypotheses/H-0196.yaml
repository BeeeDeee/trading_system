universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Sellers who push a large stock down on a day without news by demanding liquidity: index and style
    funds trimming, risk-limited managers cutting a position, stop and margin selling. They sell to whoever is bidding,
    and when the firm''s own buyback bid is active the rebound goes to the firm and to the liquidity providers who
    trade next to it.'
  why: 'A large firm that is buying back its shares runs a repurchase program that buys more when its price falls
    (10b5-1 price grids, discretionary desks told to buy weakness, Rule 10b-18 volume caps that bind less on heavy-volume
    days). So the company is a price-sensitive buyer of last resort for its own stock (Hong, Wang and Yu 2008),
    but only while it is allowed to trade: insider-trading policies close the window from a few weeks before the
    fiscal quarter end until the earnings release. Claim: after a large idiosyncratic drop that has no filed news
    behind it, an active net repurchaser whose window is open gets extra demand over the next days from its own
    buyback desk, on top of the generic liquidity concession, so its price rebounds against the other members over
    about a week. Generic no-news droppers in LIQ-500 rebound only by about the round-trip cost (lab H-0030, H-0195);
    the claim is that the buyback channel makes the rebound clearly larger than that.'
  why_not_arbitraged: Repurchase execution is not disclosed day by day (only quarterly totals in the 10-Q), so outsiders
    see the bid only through its price effect. The concession per event is small next to idiosyncratic risk after
    a drop, events are scattered across names and days, and a liquidity provider has to hold single-name risk for
    a week. Generic reversal books have not paid after costs in large caps, which keeps capital away from the subset
    where the corporate bid adds to the rebound.
signal:
  description: 'Universe: point-in-time LIQ-500 members (liq_n, n = 500); a stock must be a member on day t to be
    entered and on every day it is held (if it leaves, close it at the next open). All inputs are known at the close
    of day t; trades are at the open of day t+1. (1) Idiosyncratic drop: r[t,j] = close-to-close total return of
    day t ((1+ret_co)(1+ret_oc)-1); e[t,j] = r[t,j] minus the equal-weight mean of r over all members on t; s[t,j]
    = standard deviation of e[., j] over sessions t-63..t-1 (at least 50 valid values, else not eligible); z[t,j]
    = e[t,j] / s[t,j]. Drop condition: z[t,j] <= -z_min. (2) No filed news: ea_reaction_day == 0 and nonearn_8k_reaction_day
    == 0 on both t and t-1 (NaN = not eligible). (3) Open trading window: k = number of sessions since the most
    recent session with ea_reaction_day == 1 (k = 0 on the release session). Eligible when 3 <= k <= window_close;
    not eligible when no release in the last 100 sessions. (4) Active net repurchaser: buyback yield b = -sf1_art_ncfcommon
    / sf1_art_marketcap (trailing-twelve-month net purchase of common stock over market cap at the filing, both
    as reported, usable from the day after the filing, NaN if missing or stale). Eligible when b > 0 and b is in
    the top third of b across members with a valid b on day t. Event on (t, j) = (1) and (2) and (3) and (4). Book
    (event slots, market-neutral): each event opens a long slot of weight 0.06 in stock j at the open of t+1, held
    for 5 sessions (closed at the open of t+6). At most 8 slots open at once; when more events arrive than free
    slots, take the most negative z first; extra events are dropped (no queue). A stock already held is not re-entered
    while its slot is open. Hedge: against each open slot, short the equal-weight basket of the 20 members with
    the highest 63-day median dollar volume on the entry date (excluding the event stock), notional 0.06 x clip(beta_j,
    0.5, 1.5), where beta_j is the OLS slope of stock j''s daily close-to-close returns on the equal-weight return
    of those 20 stocks over sessions t-252..t-1 (at least 200 valid; else beta 1). The hedge is set at entry and
    closed with the slot. If gross exposure would exceed 1.0, all weights are scaled down proportionally. No other
    positions; cash otherwise. Decisions daily after the close.'
  params:
    window_close:
      grid:
      - 25
      - 35
      - 45
      value: 35
    z_min:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: Stock j (a LIQ-500 member) after the close of day t has an idiosyncratic close-to-close return at least
    z_min (2.0) of its own trailing 63-session residual standard deviations below the equal-weight member mean,
    with no 8-K earnings release and no non-earnings 8-K on t or t-1, 3 to window_close (35) sessions after its
    latest 8-K Item 2.02 release session (open trading window), and a positive trailing-twelve-month net buyback
    yield (-ncfcommon / marketcap) in the top third of members. Side +1 (j should outperform the other members from
    the next open).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
