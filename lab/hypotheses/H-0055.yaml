notes: 'Brief fit: medium horizon (the tilt is re-set weekly but the signal is persistent and the claimed effect
  lives at one to three months, primary horizon 42 sessions); cross-asset: the signal comes from the S&P 500 index-option
  market (VIX via FRED) combined with realized equity variance, and it is traded as an allocation between US equity
  and Treasury ETFs. FRED VIX is a market series that is not revised. Relation to earlier work: H-0003 (volatility-managed-exposure)
  switched the whole book on realized volatility alone and lost to 60/40; studies 6/7 conditioned stock reversal
  on a VIX level. This card uses neither realized vol nor the VIX level by itself but the gap between them, whose
  sign often disagrees with a realized-vol rule (after a spike, realized variance falls faster than implied, so
  VRP is high and the book overweights equities while a vol-target rule would still be underweight). It is a continuous
  tilt around the benchmark weights with the same average equity weight (s is a trailing percentile, so its mean
  is about zero), as K-0005, K-0027 and the H-0003 lesson ask, not a binary switch. Because the realized-variance
  leg overlaps with volatility management, part of any Sharpe gain may be vol reduction rather than return predictability;
  the mechanism test (return spread only, both sides marked) is what separates the two, and the Librarian should
  read a strategy pass with a mechanism fail as volatility management, not as the VRP. Family is new because the
  mechanism (a priced variance-risk premium) differs from vol-management (volatility not compensated); if the Chair
  prefers to count it under volatility-managed-exposure, that is acceptable. Separation from stress rebounds (K-0056):
  both sides are marked; the low-VRP side is the ''sell-off still running'' state where the card is underweight,
  so a generic post-crash bounce would count against the card, not for it. Expected size (K-0064): at a plausible
  out-of-sample rank IC of 0.1-0.2 between s and the next two-month SPY-minus-IEF return, with tilt 0.3, a signal
  standard deviation of about 0.58 and a spread volatility of about 17-19 % a year, the return gain is about 0.3-0.7
  % a year on a book with roughly 8-9 % volatility, i.e. +0.04 to +0.08 Sharpe from predictability alone; the +0.10
  margin then needs either the upper end of the IC range or some volatility reduction from underweighting equities
  when realized variance exceeds implied. This is the most likely way the card dies (G1 margin), which would still
  be informative if the mechanism test has passed. Event counts (K-0069): signal from about mid-2003 (252 valid
  VRP values after the 2002-08 start) to the end of dev minus the 42-session horizon gives about 890 weekly dates;
  top plus bottom quintile is about 40 %, so about 350 events on about 350 event dates (one marked instrument per
  date). IEF, TLT and SHY start 2002-07-30 and AGG 2003-09-29, so there are at least three unmarked peers on every
  event date (K-0055). Event thresholds 0.2/0.8 are the conventional quintiles, not tuned. rv window 21 sessions
  is fixed because the VIX is a 30-calendar-day (about 21-session) implied volatility; it is not a parameter. Costs:
  SPY and IEF are among the cheapest instruments; weekly re-weights are small because p moves slowly. ETFs have
  no forward data, so G4 is the ceiling. Decay: the main reference (2009) lies inside dev, so the publication-decay
  check applies; K-0060 suggests the latest third is the risk.'
