  - AGG
  kind: instruments
mechanism:
  counterparty: 'Investors whose demand for equity risk is driven by fear rather than by expected return: when insurance
    is expensive relative to realized risk they cut equity allocations and buy protection (institutions with drawdown
    limits, risk-budgeted and VaR-constrained portfolios, retail outflows), selling equities at a discount to holders
    willing to bear variance risk; when realized variance overshoots implied variance, they are still holding equities
    that pay little for the risk they carry.'
  why: The variance risk premium (VRP), the gap between the risk-neutral expectation of next-month S&P 500 variance
    priced in index options (VIX squared) and the variance actually realized, measures how much investors pay to
    insure against equity variance and crash risk at a given moment. Bollerslev, Tauchen and Zhou (2009) show that
    this gap predicts the equity premium over the next one to several months, with the strongest predictability
    at about a quarter, and that the information is largely separate from valuation ratios and the term spread.
    In the equilibrium story (time-varying risk aversion or time-varying volatility-of-volatility, Drechsler and
    Yaron 2011) a high VRP marks moments when the marginal investor is unusually averse to equity risk, so the equity
    premium demanded over the next months is high; a low or negative VRP (realized variance above what options priced,
    typically while a sell-off is still running) marks moments when the compensation is low relative to the risk
    being carried. The signal comes from the index-option market and from realized equity variance, and it is traded
    in the cash ETF market as an allocation between US equities and Treasuries.
  why_not_arbitraged: 'It is a risk premium, not a free lunch: the overweight is taken exactly when investors are
    most afraid, and paying out requires carrying equity risk through episodes when risk aversion is high. Most
    allocators are bound to static strategic weights and rebalancing policies and cannot lever into fear; option
    sellers who harvest the VRP directly face crash risk and margin constraints. The predictability is low R-squared
    at monthly frequency, so it is too noisy for capital with short evaluation horizons.'
signal:
  description: 'Inputs: SPY daily total returns (sharadar_sfp, ret_co and ret_oc; daily log return = log(1+ret_co)
    + log(1+ret_oc)) and the VIX close (fred_macro key VIXCLS, clock next_morning, so at the close of session t
    the latest usable VIX value is that of session t-1). Daily VRP series, for every session d: VRP_d = VIX_d^2
    / 12 - RV_d, where VIX_d is the VIXCLS value of session d (annualized percent, so VIX^2/12 is a monthly variance
    in percent squared) and RV_d is the sum over the 21 SPY sessions ending at d (inclusive) of (100 x daily log
    return)^2 (monthly realized variance in percent squared). If fewer than 21 SPY returns are present in the window
    (dropped vendor-spike days), RV_d = sum of the present squared returns x 21 / n_present, and VRP_d is missing
    if n_present < 15. If VIXCLS has no value for d (FRED holiday), use the last value at most 5 sessions old, else
    VRP_d missing. Decision: after the close of the last XNYS session of each calendar week (session t), take v
    = VRP_{t-1} (the latest VRP computable with the VIX that is usable at t; RV also ends at t-1 so both cover the
    same window). Compute p = percentile rank of v among the valid VRP values of the trailing rank_days sessions
    ending at t-1 (v included; p = (number of values <= v) / count, in (0, 1]); the window is expanding until rank_days
    values exist, and no signal is formed with fewer than 252 valid values. Signal s = 2p - 1 in [-1, 1]. Weights:
    SPY = 0.6 + tilt x s, IEF = 1 - SPY (always fully invested, no shorts, gross 1). TLT, SHY and AGG are never
    held (they are only the unmarked bond peers of the mechanism test). Before a signal can be formed (warm-up),
    or if v is missing, hold the previous weights (60/40 during warm-up). Weights are set at the open of the next
    session (t+1) and held until the next weekly decision; no intra-week rebalancing. A missing SPY or IEF bar on
    the trade day defers the trade to the next session with bars.'
  params:
    rank_days:
      grid:
      - 504
      - 756
      - 1008
      value: 756
    tilt:
      grid:
      - 0.2
      - 0.3
      - 0.4
      value: 0.3
  timeframes:
  - 1d
  - 1w
  - 1mo
mechanism_test:
  event: 'At a weekly decision date t (after the close of the last session of the calendar week), the percentile
    rank p of the variance risk premium VRP_{t-1} = VIX_{t-1}^2/12 - RV_{t-1} (RV = 21-session SPY realized variance)
    within its trailing 756 sessions (expanding, at least 252 valid values) is in the top quintile (p >= 0.8: event
    on SPY with side +1, equities should beat Treasuries) or in the bottom quintile (p <= 0.2: event on SPY with
    side -1). Only SPY is ever marked; IEF, TLT, SHY and AGG are the unmarked peers on every date, so the abnormal
    return is SPY minus the mean of the bond ETFs, the same spread the book trades. Both sides are marked, so generic
    equity-over-bond drift cancels in the placebo mean.'
