id: H-0045
version: 1
title: FOMC-cycle equity tilt - 60/40 SPY/IEF book overweight SPY in even weeks and underweight in odd weeks of
  FOMC cycle time, weekly switches
author_agent: scout
family: macro-announcement-premium
asset_classes:
- us_etf
- macro
universe:
  instruments:
  - SPY
  - IEF
  - TLT
  - SHY
  - LQD
  kind: instruments
mechanism:
  counterparty: Investors who rebalance or de-risk on a calendar unrelated to the Fed's communication rhythm (monthly
    balanced funds, risk-parity and volatility-target books that hold constant equity weights through the cycle),
    and investors who sell equities in odd weeks after weakness, before the dovish news arrives, and so sell the
    equity premium to holders who time the cycle.
  why: 'Cieslak, Morse and Vissing-Jorgensen (2019) document that the US equity premium is earned in the even weeks
    of FOMC cycle time (weeks 0, 2, 4, 6 counted from the last scheduled FOMC statement), while odd weeks earn about
    nothing. They tie it to the Fed: even weeks coincide with internal Board meetings and systematic informal communication
    of policymakers with media and the financial sector, through which news about accommodative policy (the Fed
    reacting to stock market weakness) reaches prices. The signal comes from the monetary-policy schedule (the Fed''s
    calendar, a money-market event clock) and the trade is in another market: equities against intermediate Treasuries.
    Monetary-policy news arrives in a biweekly rhythm, so the price of risk falls in those weeks and equity holders
    are paid for carrying policy uncertainty into them.'
  why_not_arbitraged: The tilt adds equity risk exactly in the weeks when news is expected; the gain per week is
    small relative to weekly equity volatility (Sharpe of a single week pattern is low), so a leveraged arbitrageur
    faces large tracking risk for a modest edge. The pattern depends on the Fed continuing its informal communication
    style, a regime risk no one can hedge, and it was only published in 2019, after most of the dev sample.
signal:
  description: 'Inputs: macro_release_calendar_1d key next_fomc_sessions (XNYS sessions from day d to the next scheduled
    FOMC statement day strictly after d; known at the close of d), and SPY/IEF total returns from sharadar_sfp.
    Step 1 (FOMC days, past information only): session d is an FOMC statement day if next_fomc_sessions on the previous
    session equals 1. Let k(d) = number of sessions since the most recent FOMC statement day (k = 0 on the statement
    day). Step 2 (cycle week of session d, Cieslak-Morse- Vissing-Jorgensen definition, sessions = trading days):
    if next_fomc_sessions(d) == 1 (d is the session before a statement day), week = 0; else if 0 <= k <= 3, week
    = 0; else if 4 <= k <= 33, week = 1 + floor((k - 4) / 5) (so weeks 1..6); else (k >= 34, unusually long cycles)
    week = none. Sessions before the first FOMC statement day in the data have week = none. Step 3 (offset): the
    target for session d+1 uses week(d + 1 + offset_sessions) computed from the schedule; because next_fomc_sessions
    is a pre-announced schedule, the Builder must compute it from values known at the close of d only (for a session
    ahead, use next_fomc_sessions(d) to know whether d+1 is day -1 or the statement day, and k(d)+1 for counting
    forward; never read a future row). Step 4 (weights for session d+1, decided after the close of d and traded
    at the open of d+1): even week (0, 2, 4, 6): SPY = 0.6 + tilt, IEF = 0.4 - tilt; odd week (1, 3, 5): SPY = 0.6
    - tilt, IEF = 0.4 + tilt; week none: SPY 0.6, IEF 0.4. TLT, SHY and LQD are never held (weight 0; they are only
    unmarked peers of the mechanism test). Orders are sent only on sessions where the target changes (week boundaries);
    between boundaries the book holds its target weights (no other trading). If SPY or IEF has no bar on a day,
    keep the previous weights. Fail loudly if next_fomc_sessions is missing for a dev session after the first valid
    value.'
  params:
    offset_sessions:
      grid:
      - -1
      - 0
      - 1
      value: 0
    tilt:
      grid:
      - 0.2
      - 0.3
      - 0.4
      value: 0.3
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At the close of the session before each FOMC-cycle week starts (as defined in signal Step 2, with the
    primary offset 0), SPY is marked: side +1 if the starting week is even (0, 2, 4, 6), side -1 if it is odd (1,
    3, 5). No event for week none. Only SPY is ever marked; IEF, TLT, SHY and LQD are always unmarked peers, so
    the abnormal return is SPY minus the mean of the four bond ETFs from the next open to the close five sessions
    later. The claim: SPY beats bonds in even weeks and lags them in odd weeks, more than at time-shifted placebo
    phases of the same event set.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sfp
  fields:
  - ret_co
  - ret_oc
  frequency: 1d
  period:
  - '2002-08-01'
  - '2020-12-31'
- dataset: macro_release_calendar_1d
  fields:
