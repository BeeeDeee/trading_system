market_exposure: long_only
references:
- cite: Cieslak, Morse, Vissing-Jorgensen (2019) Stock Returns over the FOMC Cycle, Journal of Finance 74(5)
  year: 2019
falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of SPY versus the bond peers (even weeks +1, odd weeks
  -1) is not above the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip
  cost of SPY plus IEF.'
- 'Mechanism: the side-adjusted abnormal return is negative in the latest third of dev (the post-2014 part, which
  includes the publication), or has the right sign in fewer than two of three thirds.'
- 'Mechanism shape: if the 1-session horizon carries all of the effect and 3-5 sessions add nothing, the result
  is the FOMC announcement day already tested in H-0042, not the even-week cycle; record it as such.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the tilt/offset neighbors (tilt 0.2 or 0.4, offset -1 or +1) beat 60/40, or the
  strategy no longer beats 60/40 at doubled costs.'
- 'Publication decay: excess Sharpe over 60/40 after 2019 below half of the pre-2019 excess (G2 check).'
notes: 'Brief fit: the brief asks for a cross-asset 1-5 day idea. Pure daily lead-lag between markets is dead in
  this lab (mrel scan, H-0013, H-0040), and FRED market series arrive with a one-day lag (clock next_morning), so
  a fast information spillover cannot be traded at the next open. The closest fit with a real mechanism is a signal
  from the monetary-policy side (the Fed''s pre-announced FOMC schedule, a money-market event clock) traded across
  asset classes (equities against Treasuries) at a weekly horizon. Family: filed under macro-announcement-premium
  (H-0042) on purpose. The mechanism is related but not identical: H-0042 tested the risk premium on the scheduled
  announcement sessions themselves (and found it confined to the announcement session, not kept at 3-5 sessions);
  this card claims a biweekly rhythm of informal Fed news over the whole cycle, with weeks 2, 4 and 6 far from any
  scheduled release. Week 0 overlaps H-0042''s FOMC events; the third falsification criterion says how to read it
  if the effect sits only there. Reusing the family keeps the trial count honest. Design follows K-0005 and K-0027:
  an always-invested 60/40 book with a symmetric tilt, so average equity weight stays near the benchmark (slightly
  above, because even weeks are more frequent than odd ones; about 0.63 at tilt 0.3), and the mechanism test marks
  both even (+1) and odd (-1) weeks so generic equity-over-bond drift largely cancels and the placebo measures the
  phase of the cycle, not equity drift (the H-0041 and H-0042 caveat). Four unmarked bond peers satisfy the peer
  rule of K-0055; only SPY is marked. Events: about 6-7 week starts per cycle, 8 cycles a year, 2002-08 to 2020
  (IEF, TLT, SHY, LQD start 2002-07-30) gives roughly 900-1000 events on as many dates, so power is not the problem
  of H-0017. Costs: every week boundary moves 2 x tilt of the book between SPY and IEF (1.2 of notional per boundary
  at tilt 0.3, about 55 boundaries a year), in the two most liquid ETFs of their class. Expected gross per boundary
  is tilt x the even-odd spread of SPY minus IEF; it survives doubled costs only if the spread is several basis
  points per week above the SPY+IEF round trip. That is the most likely way the strategy dies even if the mechanism
  passes. Expected decay (K-0060): the latest third is a declared kill condition. Holdout 2021-2026 is untouched
  by this card, but the paper''s sample (1994-2016) overlaps most of dev, so a dev pass is partly in-sample for
  the literature; the +20 literature trials and the post-2019 decay check account for that. ETFs have no forward
  source yet (K-0014): at most G4. Point-in-time: the FOMC schedule is published a year or more ahead; the dataset
  lists only scheduled meetings (unscheduled calls excluded, as in the paper). Cycle weeks are counted with past
  statement days and the pre-announced next date only.'
