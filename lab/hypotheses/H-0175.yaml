falsification_criteria:
- 'Mechanism: the 21-session side-adjusted abnormal return of the fund events is below the 95th percentile of the
  time-shifted placebos, or its gross is below the round-trip cost of trading the fund, or fewer than 2 of the 3
  dev thirds are positive.'
- 'Mechanism shape: the 21-session abnormal return is not larger than the 5-session one (no build-up beyond a week),
  which removes the reason for the one-month hold.'
- Net Sharpe of the hedged book on dev below 0.5, or the bootstrap bound of its Sharpe minus the T-bill Sharpe below
  zero.
- Fewer than 75 % of the grid neighbors (hold 10 / 42, z_entry 1.5 / 2.5 and their combinations) reach the T-bill
  bar, or the median neighbor Sharpe is below 0.7 of the primary.
- The book does not beat T-bills at doubled costs.
- The latest third of dev (about 2014-2020) is negative for the book (decay pattern of K-0060).
- 'Owner diagnostic (not a gate): if G1 reports a long-leg Sharpe that is positive while the hedged gross Sharpe
  is at or below zero, the event-study pass was market or class beta after selloffs (K-0074, K-0084), not discount
  reversion.'
notes: 'Brief fit: the brief asks for a 1-6 month horizon on US ETFs across asset classes. This card trades US-listed
  funds from sharadar_sfp across seven asset classes (US equity, small caps, munis, high yield and credit, REITs,
  utilities, country/EM equity), hedged with 13 asset-class ETFs, at a one-month hold. It is the closest fit with
  a mechanism the lab has already seen in its own data: no pure-ETF idea I could write with a counterparty passes
  a same-ETF placebo at this horizon (ETF sorts died in K-0195, macro timing of SPY/IEF in H-0061 and K-0209, currency
  value H-0062/H-0088 must not be refiled). Closed-end funds are not ETFs; that is the deviation. Lineage and family:
  same family as H-0037, H-0077, H-0078, H-0079 and the other wrapper-gap cards, on purpose, so the trial count
  carries the penalty. The event is the H-0077/H-0079 event type (5-session 2-sigma shortfall against a beta-adjusted
  ETF anchor), rebuilt from the lesson text because the earlier code and fund lists are not in my workspace (K-0161):
  it is not guaranteed to be the identical event set. What changes is the book, as the lessons of H-0077, H-0078
  and H-0079 asked (''a slower hold argued from the build-up, with events, slots, weight and mean exposure written
  down in advance''): 21-session hold instead of 5, five pooled slots of gross 0.20 with beta-sized hedges, and
  a liquidity floor of 500k USD median dollar volume to keep the thinnest funds (the cost that killed H-0079''s
  net Sharpe) out. Arithmetic written in advance (K-0098, K-0104): raw events with about 44 funds, most of which
  become eligible only once their anchor has a year of history (MUB 2008-09, HYG 2008-04, others 2001-2004), forecast
  1500-3500 over dev, 60-150 per year, on 600-1500 dates (pessimistic 900). Slot capacity is 5 x 252 / 21 = 60 entries
  a year, so slots are mostly full from 2008 and entries are capacity-bound: forecast 600-1000 entries over dev.
  Mean exposure by entries x hold / sessions x leg weight: about 45 entries/yr x 21 / 252 x 0.10 = 0.38 (fund leg),
  gross about 0.75; well above the 0.20 floor even if entries are half the forecast. Round trip: CEF tier probably
  20-40 bps plus about 10 bps for the anchor (K-0181); forecast gross per event at 21 sessions 1.0-2.0 % (pessimistic
  0.5 %, where the cost check binds). Book: with 5 concurrent slots of 0.10 fund weight, a 1 % net gain per slot
  and about 45 slots a year gives roughly 4.5 %/yr over T-bills at a book volatility of 4-7 %/yr, so a central net
  Sharpe of 0.6-0.9 and a pessimistic 0.3, which would fail the absolute floor of 0.5 again. Known risks, stated
  before the run: (a) the fund list is from memory of long-lived, still-listed funds, so it leans to survivors (K-0102)
  and some ticker may be missing in SFP or reused; the Builder should drop a missing ticker and report it rather
  than substitute; (b) shortfalls cluster in market selloffs and CEFs are levered, so the raw event study can pass
  on post-selloff beta (K-0074, K-0084); the hedged book is the real test and the last falsification line reads
  it; (c) the build-up flattened after about two weeks in H-0079, so the 21-session study adds noise and could land
  inside the placebo cloud even if the effect is unchanged (K-0034: then a ''cannot tell''); (d) ETF short borrow
  cost is not modelled, small for these anchors. Most likely death: G1 net Sharpe just under 0.5 again, or the 21-session
  study inside the cloud. No date literals, no episodes; the universe is the declared list only.'
