mechanism:
  counterparty: Retail CEF holders who sell into a widening discount (tax-loss sellers, income investors reacting
    to a distribution cut, investors de-risking in a selloff) and accept a price below portfolio value for immediacy;
    the strategy is the patient liquidity provider that buys the fund and sells the liquid ETF.
  why: 'A closed-end fund cannot be created or redeemed, so its price can leave its portfolio value when its (mostly
    retail) holders sell in a wave: tax-loss sales, distribution cuts, sentiment shocks, margin and mandate selling
    in stress. The discount widens, and because the portfolio itself did not lose that value, the gap closes as
    patient buyers (activists, discount funds, other retail) absorb the supply. Without NAV data the lab sees the
    discount shock as a residual: the fund''s 5-session return far below what its asset-class ETF (whose price is
    held to its NAV by creation/redemption) and the fund''s own beta to it imply. Three earlier lab cards on this
    event (H-0077 muni, H-0078 country, H-0079 pooled seven classes) all cleared the placebo test with gross several
    times cost, and the effect built over about two weeks and then flattened, so a five-session hold left part of
    it unharvested and paid a full round trip per week. This card keeps the event and changes the book: a one-month
    hold that harvests the whole build-up with a quarter of the turnover per unit of exposure.'
  why_not_arbitraged: 'Closing the gap requires holding a thinly traded fund with noise-trader risk (the discount
    can widen further for months), a short in the anchor that does not hedge the fund''s manager, leverage and duration
    exactly, and round-trip costs of tens of basis points; capacity per fund is a few hundred thousand dollars a
    day, too small for arbitrage desks (Pontiff 1996: arbitrage costs explain discount persistence).'
signal:
  description: 'Decisions after the close of each session t using data up to that close; trades at the open of t+1.
    Inputs: daily total return of each instrument r = (1+ret_co)(1+ret_oc)-1, dollar_volume, tradable. Fixed fund-to-anchor
    map (each CEF has exactly one anchor ETF): ADX, GAB, USA, TY, GAM -> SPY; RVT, RMT -> IWM; NAD, NEA, NUV, NZF,
    NVG, NMZ, MQY, MYI, BFK, VKQ, PML, PMF -> MUB; PHK, DHY, HIX, EHI, DSU, HYT, PCN, PTY -> HYG; RQI, RNP, IGR,
    JRS -> IYR; UTF, UTG, DNP, GUT -> XLU; MXF -> EWW; TWN -> EWT; KF -> EWY; GF -> EWG; SWZ -> EWL; JOF -> EWJ;
    TDF, EMF, IFN -> EEM. (1) Beta and residual scale, per fund i with anchor a, from the 252 sessions ending at
    t-5 (the five formation sessions excluded), requiring at least 189 sessions where both returns exist: Dimson
    beta b_i = b0 + b1 from the OLS regression r_i(s) = c + b0 r_a(s) + b1 r_a(s-1) + e(s) (the lag absorbs stale
    CEF closes), clipped to [0.3, 2.5]; sigma_i = standard deviation of the daily residual u(s) = r_i(s) - b_i r_a(s)
    over the same window. (2) Formation residual: R_i(t) = sum over the last 5 sessions (t-4..t) of r_i(s) - b_i
    r_a(s); z_i(t) = R_i(t) / (sigma_i * sqrt(5)). (3) Eligibility on t: fund and anchor tradable on t, both with
    a valid return on each of the last 5 sessions, fund median dollar_volume over the last 63 sessions >= 500,000
    USD, beta window valid. A fund or anchor not yet listed or lacking history is simply ineligible. (4) Event:
    an eligible fund with z_i(t) <= -z_entry while z_i(t-1) > -z_entry (first crossing), and no event of the same
    fund in the previous hold_sessions sessions. (5) Book (pooled event slots shared by all classes): at most 5
    open slots. Each slot opened on event (i, t) buys fund i with weight 0.20 / (1 + b_i) and sells its anchor a
    with weight 0.20 * b_i / (1 + b_i), so every slot has gross 0.20 and the book gross never exceeds 1.0. If more
    events than free slots occur on a date, the most negative z first; events that find no free slot are dropped,
    not queued. A fund already in an open slot cannot open a second one; two slots on the same anchor are netted
    in the anchor position. Slot weights are fixed at entry (no drift rebalancing). A slot is closed at the open
    of the session hold_sessions after its entry (entry at the open of t+1, exit at the open of t+1+hold_sessions).
    If the fund or the anchor stops trading, the slot is closed at the first open where the remaining leg trades.
    Cash otherwise. No other exit rule (no stop, no target).'
  params:
