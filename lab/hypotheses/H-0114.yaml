id: H-0114
version: 1
title: Delayed stock response to oil-specific news, learned - LIQ-500 dollar-neutral weekly in oil-shock weeks,
  LightGBM on oil exposure x two-week oil shock, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Generalist and sector-specialist holders of stocks with indirect oil exposure who do not translate
    oil news into earnings expectations until it shows up in reported results or guidance, and who keep trading
    at prices that have not yet absorbed it; liquidity providers who fill them at those prices are not the losers,
    the slow updaters are.
  why: 'Oil prices are public, dated news, but what a given oil move means for a given company''s cash flows takes
    work: producers and oil services gain, airlines, trucking, chemicals and other fuel or feedstock users lose,
    and the size depends on hedging, pass-through and demand effects. Under limited attention (Hong and Stein) investors
    who hold indirectly exposed stocks update slowly, so stock prices absorb an oil-specific shock over days to
    weeks rather than on the day. Industry-level studies find oil changes predict about a fifth of US industry returns
    with a delay of roughly two trading weeks and a horizon of about a month (Fan and Jahan-Parvar), and lagged
    oil changes predict the aggregate market (Driesprong, Jacobsen and Maat). The claim here is the cross-sectional,
    stock-level form: after a large oil-specific move over the last two weeks, stocks with a positive measured oil
    exposure keep outperforming those with a negative exposure (oil up), and the reverse after an oil drop, over
    the following week.'
  why_not_arbitraged: The exposure must be estimated (it is noisy and time-varying), the trade is a cross-asset
    bet that concentrates in a few sectors with high volatility, it is active only after large oil moves, and the
    per-week edge is small relative to sector risk; desks that trade oil rarely run single-stock books on it and
    equity sector desks rarely model oil exposure stock by stock.
signal:
  description: 'Inputs: sharadar_sep daily total returns of the point-in-time LIQ-500 members (close-to-close total
    return r_i(d) built from ret_co and ret_oc), and the WTI spot price W(d) from fred_macro DCOILWTICO (clock next_morning:
    the value observed on session d is usable from session d+1, so at a decision after the close of t the newest
    usable oil observation is that of t-1). Oil daily change o(d) = log(W(d)/W(d_prev)) between consecutive sessions
    with a valid positive WTI value (missing or non-positive values are treated as missing, never filled), clipped
    to +/-0.20. Market return m(d) = equal-weight mean of r_i(d) over the members of d. At each decision t, using
    only sessions d in [t-252, t-1] where o(d) exists: (a) per stock, OLS of r_i(d) on a constant, m(d) and o(d),
    requiring at least 200 valid pairs, giving the market beta b_m, the oil beta b_o and the t-statistic of b_o;
    (b) OLS of o(d) on a constant and m(d), giving c; the oil-specific daily change is u(d) = o(d) - c*m(d) and
    s_u its standard deviation over the same window. U10(t) = sum of u(d) over sessions t-10..t-1, U10lag(t) = sum
    over t-20..t-11 (each needs at least 8 valid u values, else missing); S10(t) = U10(t) / (s_u * sqrt(10)). Features
    (7): b_o, t-stat of b_o, P10 = b_o*U10, P10lag = b_o*U10lag, resid5 = sum of r_i - b_m*m over sessions t-4..t,
    vol63 = standard deviation of r_i over t-62..t, each z-scored across that date''s members by the framework helper;
    and S10, a date-level input passed unscaled (not z-scored). A stock without all features is not scored. Label:
    total return from the next open to the open 5 sessions later, ranked across the universe (framework). Model:
    framework walk_forward with gbm, expanding window, refit every 126 rows, n_estimators from params, learning_rate
    0.05, num_leaves 15, min_child_samples 1000, subsample 0.8, colsample 1.0, seeds and purge by the framework.
    Decisions after the close of the first session of each calendar week. A decision date is active when |S10| >=
    1.0 (a fixed round threshold, not tuned). On an active date, with at least 50 scored members: long the top fraction
    `top` of scored members by score and short the bottom fraction `top`, equal weight within each leg, +0.5 gross
    long and -0.5 gross short; held to the next weekly decision (about 5 sessions) and then replaced. Inactive dates
    and dates with fewer than 50 scored members: flat. A stock that leaves the universe while held is closed at
    the first decision row where it is no longer a member. Book pieces: features -> walk_forward(gbm) -> score_weights(top/bottom
    `top`, dollar-neutral) -> only_on(|S10| >= 1.0).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a weekly decision date where the two-week oil-specific shock |S10| >= 1, a scored LIQ-500 member is
    in the top fraction `top` of the gbm score (side +1, should outperform) or in the bottom fraction `top` (side
    -1, should underperform) over the next 5 sessions.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
ml:
  features:
  - 'b_o: 252-session OLS oil beta of the stock''s daily total return on the same-day WTI log change, controlling
    for the equal-weight universe return (cash-flow exposure: producers positive, fuel users negative)'
  - 't-stat of b_o from the same regression (how reliable and how direct the oil link is: producers precise, indirect
    users noisy)'
  - 'S10: last two weeks'' oil-specific WTI move (WTI change net of its market co-movement), standardized by its
    own 252-session volatility; date-level, unscaled (size and sign of the news)'
  - P10 = b_o x oil-specific WTI change of sessions t-10..t-1 (the oil-implied move of the stock; the linear underreaction
    score a ridge can use directly)
  - 'P10lag = b_o x oil-specific WTI change of sessions t-20..t-11 (the same two weeks earlier: lets the model see
    a delay of about two weeks)'
  - 'resid5: the stock''s own 5-session return net of b_m x market (generic weekly reversal state, so reversal is
    not credited to oil)'
  - 'vol63: 63-session realized volatility of daily total returns (risk scale of the stock)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The underreaction claim is conditional in three ways a ridge on the same seven features cannot
    express. (1) Threshold: only oil moves that are large relative to oil''s own recent volatility should be slow
    to be absorbed and worth acting on; small moves are noise, so the payoff is a step in |S10| interacted with
    exposure, not a straight slope in P10. (2) Non-monotone exposure: producers have large, precise b_o and are
    followed by specialists who price oil the same day, while moderately exposed users (airlines, transports, chemicals,
    autos) with noisier b_o are where generalist holders lag, so the delayed response should depend on the t-stat
    and size of b_o jointly, not proportionally. (3) Sign and timing asymmetry: oil-up and oil-down news (supply
    versus demand shocks) and news of the last two weeks versus the two before (P10 versus P10lag) should carry
    different delays. A ridge gets one slope on P10, one on P10lag and additive date-level terms that cancel in
    a cross-sectional rank. The ones who pay are the slow updaters in indirectly exposed stocks.'
