falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the event (top / bottom `top` of the score on active weeks) over
  5 sessions is not above the 95th percentile of the time-shifted placebos, or its gross per event is below the
  round-trip cost: the stock-level delayed oil response is not visible or not tradable.'
- The latest third of dev has the wrong sign (declared kill condition, K-0060), even if the pooled test passes.
- 'Horizon shape: if the 1- and 3-session averages are wrong-signed and only the 10-20 session averages are positive,
  it is slow sector drift, not a two-week delayed oil response; if the 20-session average has the opposite sign
  of the 5-session one, it is overreaction, not underreaction.'
- 'A ridge (framework ridge) on the same seven features, rows, label, schedule and book is as good as or better
  than the gbm: the threshold / exposure-type interaction is not what pays, the plain P10 sort is.'
- Net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills below zero.
- Fewer than 75 % of the grid neighbors of n_estimators 100 and top 0.1 beat the benchmark, or Sharpe at doubled
  costs does not beat it.
notes: 'Fit to the brief: the brief asks for a learned US single-stock cross-sectional card at 1-5 days. The lab
  has exhausted the obvious inputs of that space (own-return sorts, volume, earnings releases and filings, ownership,
  calendar and volatility states, distribution shape: K-0133, K-0137, K-0143, K-0152), so this card brings a new
  information source with a stock-specific economic link instead of another conditioner on own returns: an external,
  dated price (WTI) times the stock''s measured exposure to it. It is filed under the existing family oil-shock-equity-underreaction
  (H-0056) on purpose, so the trial counts there. H-0056 tested the aggregate form (SPY against IEF) and found it
  wrong-signed; its lesson names the stock and sector-level response (producers versus users) as untested, which
  is the question here. The event is not a mirror of H-0056: the market-level sign is not used and both sides are
  marked. K-0080 asks why information would travel slowly through a channel: the mapping from oil to a non-energy
  firm''s cash flows is indirect and needs modeling that equity holders of those firms rarely do until earnings;
  industry studies report a delay of about two weeks. Honest prior: low, because cross-asset diffusion in liquid
  assets has come out flat in this lab. Forecasts (K-0120, K-0151): weekly decision dates with scores about 1000
  (walk-forward warm-up takes the first years); |S10| >= 1 on about 28-35 % of them, so about 280-350 active dates;
  events = both tails, about 2 x 10 % of about 480 scored members, so about 90-100 per date and 25000-35000 events
  in total. The extreme tails will be dominated by oil producers and services (largest |b_o|) on one side and fuel
  users on the other, so independent episodes are the active weeks, not the events. Round trip: half-spread tiers
  3/6 bps with a 5 bps floor give about 10-12 bps for LIQ-500 names. Gross per event: a top-decile P10 of about
  3-5 % (b_o 0.3-0.6 times a two-week oil-specific move of about 10 %) with a few percent of it arriving the next
  week gives a central 15-20 bps per event; at a quarter of that (about 4-5 bps) it dies at the cost check, at a
  tenth (about 2 bps) it is noise. Beta gap (K-0074): the long and short tails swap sectors with the sign of the
  oil shock, and the shock is net of its market co-movement, so the marked-minus-peer gap should not carry a persistent
  market beta; energy and airline betas both changed across eras, which is why the latest-third sign is a kill condition.
  Book arithmetic: active about a third of weeks at gross 1.0, mean exposure about 0.3; with 15-20 bps per side
  the long-short spread is about 15-20 bps per active week net of about 11 bps of turnover cost, a few percent a
  year at a volatility of a sector pair, so even a mechanism pass may die at the 0.5 Sharpe floor (K-0027): the
  mechanism test is the main question. WTI data: a negative print exists in the series; non-positive values are
  missing and daily log changes are clipped at +/-0.20 so one print cannot dominate a beta or a shock. Linear baseline:
  ridge on the same features; if the ridge is as good, the result is a plain oil-exposure-times-shock sort and the
  gbm found nothing.'
