id: H-0187
version: 1
title: Daily stop-cascade breakout on Binance perps - top-30, follow the first close outside a quiet 20-day range
  (coin-specific, volume-confirmed), BTC-hedged, hold 3 days
author_agent: scout
family: stop-cascade-breakout
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Leveraged perp traders on the wrong side of the range (shorts above a quiet top, longs below a quiet
    bottom) whose stops and liquidations are price-insensitive market orders; range-trading liquidity providers
    who sold the top or bought the bottom of the range and must cover; and late breakout followers who buy from
    the strategy at the exit.
  why: 'While a coin trades in an unusually tight range, stop-loss orders, liquidation prices of leveraged perp
    positions and range-faders'' exits pile up just beyond the range edges (Osler 2003, 2005: stop orders cluster
    beyond obvious levels, and once triggered they create self-feeding price cascades). The first daily close outside
    such a quiet range shows that the cluster was hit. The forced flow does not finish in one session: liquidation
    engines and stops at levels further out keep firing as the price extends, and slower daily-bar breakout followers
    (channel/Donchian systems run by crypto funds and retail bots, Brock-Lakonishok-LeBaron trading-range-break
    rules) enter at the next sessions. The card claims that this pushes the coin further in the breakout direction,
    relative to the other liquid perps, for a few days. H-0063 found the same continuation at 15 minutes, but it
    was front-loaded and a one-candle later fill erased it. This card asks the open question of that lesson: does
    a compressed-range breakout defined on daily closes keep running for days, where a fill one session later matters
    less?'
  why_not_arbitraged: Following breakouts in single altcoins means carrying large idiosyncratic and crash risk for
    a few days, with many false breakouts that reverse; capital that can take directional alt risk is small and
    mostly retail. The forced flow is created by leverage that keeps being rebuilt in quiet ranges, so it recurs.
signal:
  description: 'Data: Binance USD-M perps (binance_perp_1d), point-in-time top 30 by trailing 30-day quote volume
    (crypto_top_n, n = 30). Daily decisions after the 00:00 UTC close of day t, using closes and quote volume up
    to and including day t; trades at the open of day t+1. (1) Range: for coin j, R_t = log(max(close over days
    t-N .. t-1) / min(close over days t-N .. t-1)), N = range_days (the N closes before day t, so day t itself is
    not inside the range). (2) Compression: the range is quiet if R_t is at or below the 25th percentile of the
    coin''s own values R_{t-90} .. R_{t-1} (90 prior daily values, each computed the same way). A coin needs N +
    90 valid closes before t to be eligible; otherwise no event. (3) Breakout: up-event if close_t > max(close over
    t-N .. t-1); down-event if close_t < min(close over t-N .. t-1). Because close_{t-1} lies inside its own range,
    this is always the first close outside the quiet range. (4) Volume confirmation: quote_volume_t >= median quote
    volume of days t-20 .. t-1. (5) Coin-specific: the coin''s return on day t (close_{t-1} to close_t) minus the
    BTCUSDT.P return on day t has the sign of the breakout (positive for up, negative for down), so a breakout that
    is only the market moving is not an event. BTCUSDT.P is never an event itself but stays in the universe. (6)
    The coin must be in the universe on day t. Book (event slots, BTC-hedged): each event opens a slot at the open
    of day t+1, weight +0.15 of equity in the coin for an up-event, -0.15 for a down-event, held for hold_days days
    and closed at the open of day t+1+hold_days. Each slot carries an opposite BTCUSDT.P position of the same notional
    (-0.15 for an up-slot, +0.15 for a down-slot); the BTC hedges of all open slots are summed into one net BTCUSDT.P
    weight, so opposite slots net out. A coin that already holds a slot ignores new events until that slot is closed.
    If the coin leaves the top-30 universe while held, the slot and its hedge are closed at the next decision row
    (early exit). If total gross (sum of absolute coin weights plus the absolute net BTC weight) would exceed 1,
    all weights are scaled down proportionally to gross 1 (no leverage). Funding is charged by the engine (longs
    pay positive funding, shorts receive it). Missing close or volume on day t: no event for that coin that day.
    The hedge makes the book trade the same relative effect the mechanism test measures, instead of adding a market-timing
    bet.'
  params:
    hold_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    range_days:
      grid:
      - 10
      - 20
      - 40
      value: 20
  timeframes:
  - 1d
mechanism_test:
  event: Coin j's daily close on day t is the first close outside its prior range_days-day close range, that range
    is in the bottom quarter of the coin's own last 90 values, day-t quote volume is at or above its 20-day median,
    and the coin beat (up-breakout) or lagged (down-breakout) BTCUSDT.P on day t. side = +1 for an up-breakout,
    -1 for a down-breakout. Measured from the open of t+1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 3
data_requirements:
- dataset: binance_perp_1d
  fields:
  - ret_co
  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2019-12-01'
  - '2022-12-31'
holding_period:
  rebalance: daily
  typical_days: 3
market_exposure: long_short
references:
- cite: 'Osler, C. L. (2003) Currency orders and exchange rate dynamics: an explanation for the predictive success
    of technical analysis. Journal of Finance'
  year: 2003
- cite: Osler, C. L. (2005) Stop-loss orders and price cascades in currency markets. Journal of International Money
    and Finance
  year: 2005
- cite: Brock, W., Lakonishok, J., LeBaron, B. (1992) Simple technical trading rules and the stochastic properties
    of stock returns. Journal of Finance
  year: 1992
falsification_criteria:
- 'Mechanism: the side-adjusted 3-day abnormal return of the breakout events (vs the unmarked top-30 perps on the
  same date) is not above the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip
  cost.'
- 'Mechanism shape: the 1-day abnormal return is negative or the 3-day average is below the 1-day average (the cascade
  is spent on the breakout day itself, the H-0063 shape at daily scale): the card is wrong, not just weak.'
- 'Mechanism decay: the latest third of dev (2022) has the wrong sign (K-0060 kill condition, declared in advance).'
- Net Sharpe on dev below 0.5 (T-bill benchmark for a long/short book) or the bootstrap bound of the Sharpe difference
  below zero.
- Fewer than 75 % of the grid neighbours (range_days 10/40, hold_days 2/5) beat the benchmark, or the book fails
  at doubled costs.
notes: 'Why this is not a refile of H-0063: H-0063 (15-minute bars, taker-flow trigger, 6-hour hold) died at G2
  because the continuation was front-loaded and a one-candle later fill erased it; its lesson leaves open ''does
  the continuation exist at a slower horizon (many hours to days) where a late fill matters less'' and ''whether
  market-wide breakouts separate real runs from single-coin noise''. This card changes the clock (daily closes,
  1-5 day hold) and makes the event coin-specific (step 5); it uses no taker flow and is filed in the same family
  so the trials count together. It is also not the near-high sort of H-0135/K-0184: it is a dated own-price event,
  both directions marked, so coin identity should largely cancel in the placebo (a trending coin is marked +1 and
  -1 at different times). Not short-term-reversal or momentum-sort: the claim is about a conditional event (quiet
  range broken), not about the sign of past returns; K-0229 found plain own-return sorts empty, and this card would
  read a failure as ''compressed-range breakouts carry no forced-flow continuation over days either''. Forecasts
  (K-0120, K-0098): perps in the panel 78 (2020) to 146 (2022), top 30 eligible; warm-up N + 90 days means events
  start around April 2020 for range_days 20 (first block partly empty). Rough count: a first close outside a 20-day
  range happens on roughly one day in eight per coin, the quiet filter keeps about a quarter to a third, the volume
  and coin-specific filters about half: about 400-900 events on 300-500 dates in dev (pessimistic 250). Mean gross
  exposure about events x 3 / 1000 days x 0.15 x (1 + hedge share, about 1.6) = 0.3-0.6 before clustering, lower
  in quiet months, so the 0.20 floor is a real risk in the pessimistic case. Round trip on liquid perps per catalog
  tier: 10 bps fee per side plus slippage, about 30-90 bps for the weaker top-30 names (K-0120 saw ~91 bps modelled);
  the event gross must be above about 1 % over 3 days to pass the cost ratio. Beta caveat (K-0074): marked coins
  may have a higher beta than peers; marking both sides means a beta gap times market continuation would also favour
  the card, so the coin-specific filter (step 5) and the 1-day vs 3-day shape are the checks. Most likely death:
  the cascade is finished within the breakout day, so gross after the next open is near zero or reverses (K-0049
  reversal paid to liquidity providers), or the event book misses the absolute Sharpe floor because it is invested
  a third of the time unhedged. Expected annual gain if the mechanism is real at 2 % gross per event: about 600
  events x 0.15 x (2 % - 0.8 % cost incl. the BTC hedge) / 3 years ~ 3.6 % a year at roughly 10-14 % volatility
  (hedged residual), Sharpe ~0.3: the book needs about 3 % gross per event to clear the 0.5 floor. The mechanism
  test shows the size of the effect cheaply first; a pass with gross below about 3 % should be read as a real but
  untradable effect for a daily taker.'
