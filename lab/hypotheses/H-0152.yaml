id: H-0152
version: 1
title: Lumpy equity issuers shorted for a year - LIQ-500 beta-neutral, short stocks whose filed share count jumped
  10 %+ in a quarter, hedged with other members
author_agent: scout
family: trading-window-flows
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'The buyers of the new shares and the target shareholders who accept acquirer stock as payment.
    Also index and benchmark-hugging funds, which must absorb the larger float at any price: an issue raises the
    stock''s index weight, so passive money buys it mechanically. Sell-side coverage tied to the underwriting or
    advisory mandate stays optimistic after the deal.'
  why: 'Managers time discretionary equity issues: they sell new shares, or pay for acquisitions with shares, when
    they think their stock is overvalued (Baker and Wurgler 2002; Shleifer and Vishny 2003). The market treats the
    issue as only a mild signal at announcement, and the overvaluation corrects slowly over the next one to three
    years. That is the long-run underperformance after seasoned offerings (Loughran and Ritter 1995) and after stock-financed
    acquisitions (Loughran and Vijh 1997), and it is one of the few anomalies that Fama and French (2008) found
    in big stocks as well as small ones. The claim tested here is about timing within a firm: a stock does worse
    in the year after a large one-quarter jump in its share count than the same stock does at other times, and worse
    than the other liquid stocks.'
  why_not_arbitraged: The correction takes about a year and is small next to the stock's own volatility, so a short
    must be held through drift and squeeze risk. Shorting recent issuers costs borrow, and many institutions cannot
    short at all. The signal comes from the quarterly filing, months after the deal headlines, when attention has
    moved on. The trade is also confounded with growth and beta exposure, which makes it hard to hold against a
    benchmark.
signal:
  description: 'Inputs: daily total returns of LIQ-500 stocks (from ret_co and ret_oc), point-in-time LIQ-500 membership,
    and the attached as-reported quarterly basic share count sf1_arq_sharesbas. The share count becomes usable on
    the day after the SEC filing. Never multiply it by close_u (K-0168); only ratios of consecutive values of this
    one split-adjusted series are used. EVENT (same as diagnostic.py): stock j has an event after the close of session
    t if all of the following hold. (1) On t, sf1_arq_sharesbas shows a new value: it differs from its value on
    t-1, so a new filing became usable. (2) The previous value (the one on t-1) is present and positive, and it
    changed less than 150 sessions before t. A longer unchanged stretch means a gap in filings, and the event is
    skipped. (3) ratio = new / previous satisfies 1 + issuance_min <= ratio <= 3.0. The upper cap removes data errors
    and reverse mergers. (4) ratio is not within +/-3 % of 1.5, 2.0 or 3.0. This guards against a stock split left
    unadjusted in one row. (5) The stock''s total return over the 252 sessions ending at t is above -50 %. Rescue
    recapitalizations of collapsed firms are a different mechanism (forced, not timed). Fewer than 200 valid returns
    in that window means no event. (6) j is a LIQ-500 member and tradable at t. (7) j had no event in the previous
    hold_days sessions, so a stock is marked at most once per holding window. Side = -1 (expected to underperform).
    BOOK (monthly, market-neutral): decisions after the close of the first session of each calendar month; trades
    at the next open. Short leg: every stock with an event in the last hold_days sessions that is still a LIQ-500
    member. Events filed since the last rebalance enter at this rebalance. A position exits at the first rebalance
    at least hold_days sessions after its event. Long hedge leg: all other current LIQ-500 members, equal weight,
    excluding any stock with an event in the last hold_days sessions. Leg betas: each stock''s beta is the OLS slope
    of its daily total return on the equal-weight mean return of LIQ-500 members over the previous 252 sessions
    (at least 200 valid days; otherwise beta 1.0), clipped to [0.3, 2.5]. A leg''s beta is the mean of its members''
    betas. Sizing: short gross s and long gross l with s * beta_short = l * beta_long and s + l = 1.0, which gives
    a beta-neutral book at gross 1. Within the short leg names are equal-weighted at s / n_short, capped at 0.05
    per name. If the cap binds, s falls to 0.05 * n_short, l is rescaled to keep beta neutrality, and the rest is
    cash. Within the long leg, equal weight l / n_long. Weights are set at each rebalance and held as targets until
    the next one. A stock that leaves LIQ-500 between rebalances is closed at the first decision row outside the
    universe (K-0051); its weight goes to cash until the next rebalance. With no active event the book is flat (cash).
    Missing data on a stock means no event and no short position for it. A missing share-count series on the hedge
    side does not matter: the hedge needs only membership and returns.'
  params:
    hold_days:
      grid:
      - 126
      - 252
      - 378
      value: 252
    issuance_min:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'After the close of session t a newly usable quarterly filing shows that a LIQ-500 stock''s basic share
    count rose by at least issuance_min (10 %) against its previous filing. The full rule is EVENT (1)-(7) in the
    signal: ratio cap 3.0, split-ratio guard, trailing 252-session return above -50 %, at most one event per stock
    per hold_days. Side -1: the stock should underperform the other LIQ-500 members over the following months.'
