falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the issuance events does not exceed the 95th percentile
  of the 200 time-shifted placebos, or its gross is below the round-trip cost, or fewer than 2 of 3 dev blocks have
  the predicted sign (G1 mechanism gate).'
- 'Mechanism (decay kill condition, read by the Librarian even if the pooled test passes): the latest third of dev
  has the wrong sign (issuers at or above their peers). That would mean the effect was arbitraged away after publication
  (K-0060).'
- 'Mechanism (horizon shape): the 60-session average is no larger than the 5-session average. That would be a filing-day
  news reaction, not the slow correction of overvaluation this card claims.'
- 'Strategy: net Sharpe of the market-neutral book on dev below 0.5, or its stationary-bootstrap bound of the Sharpe
  difference to T-bills not above zero (G1).'
- 'Strategy: in the G1 leg decomposition the issuer short leg has a non-positive contribution while the hedge long
  leg carries the return. Then the book is earning market or style drift, not the issuance effect (K-0172).'
- 'Robustness: fewer than 75 % of the neighbors (issuance_min 0.05 / 0.20, hold_days 126 / 378) beat T-bills, or
  the book fails at doubled costs (G2).'
notes: 'BRIEF FIT. Long holding (12 months, grid 6-18) on US single stocks, cross-sectional, LIQ-500, with a mechanism
  test. The 60-session test horizon sees only the first quarter of a year-long claim (schema cap). The card forecasts
  the build-up shape over that quarter, not the full-year size. WHY THIS FAMILY, AND WHY IT IS NOT A REFILE. The
  economic mechanism is equity issuance timed to overvaluation. The Librarian files share-count, net-issuance and
  equity-financing sorts under trading-window-flows (H-0019, H-0027, H-0086, K-0110), so this card reuses that family
  and adds to its trial count rather than escaping it. It differs from the three earlier cards on the points K-0110
  and H-0086 left open: (a) Issuer side only. H-0086 pooled entries to both extreme quintiles of a net-repurchase
  sort with no side split, and K-0110 lists an issuer-only test as untested. (b) Lumpy, discretionary issues. It
  uses one-quarter jumps of 10 %+ in the filed share count, not a trailing yield. The repurchase/issuance yield
  of H-0019/H-0086 is dominated by buybacks and stock-compensation dilution, and a cash-flow-based score cannot
  see stock-for-stock acquisitions at all, because no cash changes hands. Yet those are the largest issuance channel
  and the one with the strongest long-run evidence (Loughran-Vijh). A share-count jump catches SEOs, stock mergers
  and conversions alike. (c) Distress recapitalizations are excluded by rule (trailing return above -50 %). The
  overvaluation story does not apply to forced rescue financing, which in this sample sits in the 2008-2009 bank
  recapitalizations. Those were followed by a violent rebound that would flip the middle third for a reason unrelated
  to the claim. The -50 % cut is a fixed round number, not tuned and not in the grid. (d) Beta-neutral book sizing
  (K-0074, K-0110). The G1 event study is raw against unmarked peers, but the placebo shifts the same stocks in
  time, so a persistent higher beta or growth tilt of issuers enters the placebo mean as well. That is why the card
  claims timing, not a style. FORECASTS (K-0098, K-0120, K-0181), stated pessimistically first. Events: about 1
  % of LIQ-500 firm-quarters (central), so about 20-30 a year. That gives 400-650 marked events on 300-450 filing
  dates over the usable years 1999-2020. Pessimistic case: 250 events, close to the G1 minimum of 200. Each event
  is one stock on one date, so marked events and event dates are nearly equal. Gross per event at 60 sessions: central
  1.0-1.5 % (a quarter of a 4-6 %/yr large-cap underperformance), and pessimistic 0.3 %. Round trip: the LIQ-500
  tier is about 11-12 bps, so the cost ratio is not expected to bind. The placebo bar for a slow entry design is
  wide (K-0071, K-0111). I expect it near 0.8-1.2 % with these dispersed filing dates. The central case sits about
  at the bar, so a miss would be a ''cannot tell'' unless the sign is wrong or the result is placebo-equal. Book:
  the short leg holds about 20-30 names on average, and the long leg about 470. Mean exposure is about 0.9-1.0 gross
  from 1999. Entries: about 500 short entries plus hedge rebalances, with roughly 264 monthly decision dates. Expected
  annual gain: about 0.45 gross on the short leg times a 4-6 % underperformance, which is about 2-3 %/yr over T-bills.
  Tracking volatility is about 4-6 %/yr, so net Sharpe is around 0.4-0.6 and the absolute floor of 0.5 is reachable
  only in the central-to-good case. LIKELIEST DEATHS, in order: (1) G1 placebo percentile under a wide bar (slow-horizon
  power). (2) The latest third has the wrong sign: the issuance anomaly was published 1995-2008, and 2013-2020 was
  a growth-led bull market. (3) The absolute Sharpe floor of 0.5 for a thin, beta-neutral spread. (4) Dilution by
  routine issuers. REITs and utilities fund growth with equity as a matter of course, and that is not timing. No
  sector field is loadable, so they cannot be excluded. DATA. sf1 sharesbas is split-adjusted to today (K-0168).
  Ratios of consecutive values are therefore consistent, and the split guard only protects against single unadjusted
  rows. The series is never combined with close_u. No forward data for stocks, so G4 is the ceiling. No date literals,
  no named stocks. The dev data ends 2020-12-31, and events whose 60-session window runs past dev are dropped by
  the judge.'
