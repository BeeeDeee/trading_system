id: H-0145
version: 1
title: Slow leverage-crowding unwind - top-30 Binance perps dollar-neutral, short own-history basis risers, long
  fallers (net of run-up, within beta halves), 26-week cohorts
author_agent: scout
family: perp-leverage-crowding
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Retail and trend-chasing traders who keep paying a rich basis and funding for leveraged long exposure
    to coins that just became popular, and who are liquidated or give up when the move stalls. The long leg is on
    the other side of de-levering holders, who sell coins whose leverage demand is draining.
  why: 'The perp basis (perp price over spot minus one) is the price leveraged traders pay for upside exposure.
    Schmeling, Schrimpf and Todorov (BIS WP 1087, "Crypto carry") find that this basis is driven mainly by trend-chasing
    smaller investors who want leverage and by too little arbitrage capital on the other side, and that a high basis
    predicts later crashes. Arbitrageurs who short the perp to collect the basis hedge by buying spot, so leveraged
    perp demand is passed into the spot price. When a coin''s basis rises well above its own normal level, more
    of its price than usual is held up by short-term leveraged demand. That demand is fragile. Funding costs build
    up, positions are liquidated in the next market-wide drawdown (crypto has one every few months), and when the
    basis closes the arbitrageurs unwind and sell spot. So over the following months the coin should do worse than
    coins whose leverage demand fell. The claim is cross-sectional and about timing within each coin: the score
    is each coin''s basis compared with its own past, not its basis level, so coins that always run a rich basis
    do not get marked every week (the coin-identity trap of K-0128, K-0184, K-0196). The score also takes out the
    part of the basis change explained by the coin''s own 30-day price move, so the claim is about leverage beyond
    what the price move explains, not about momentum.'
  why_not_arbitraged: Cash-and-carry arbitrage takes out the basis itself but not the spot overpricing it brings
    with it. The arbitrageur is hedged and passes the demand into spot. Shorting crowded alt perps outright for
    months means facing squeezes, mark-to-market losses in the boom and exchange margin risk, and the capital that
    could do it is scarce and moves in and out with the cycle (that is the BIS paper's point). The horizon is months,
    which is too slow for market makers and too noisy for most funds.
signal:
  description: 'Data: binance_perp_1d daily bars of the point-in-time top 30 perps by trailing 30-day median daily
    quote volume (crypto_top_n n=30). If the gate passes no universe, build it the same way from quote_volume, computed
    only from data up to the decision close, and accept views shorter than any window. Also used: extras basis (perp
    close / spot close - 1, daily) and close. Decisions are made after the 00:00 UTC daily close of every seventh
    day (one formation date per week, fixed weekday from the start of the data). Trades happen at the next daily
    open. FORMATION on date t, for each coin j in the universe on t, with L = lookback_days: (1) b_recent = mean
    of daily basis over days t-L+1..t. b_ref = mean and s_ref = standard deviation of daily basis over the 120 days
    before that (t-L-119..t-L). A coin is eligible only if both windows have at least 80 % valid basis days and
    s_ref > 0. raw_j = (b_recent - b_ref) / s_ref. (2) r30_j = log(close_t / close_{t-30}). Across the eligible
    coins on t, regress raw on r30 with OLS and an intercept. The score is the residual e_j. (3) beta_j = OLS slope
    of the coin''s daily log close-to-close returns on BTCUSDT.P''s over the last 90 days (at least 60 valid days,
    otherwise not eligible). BTCUSDT.P has beta 1. (4) If fewer than 10 coins are eligible, no cohort is formed
    that week. Otherwise split the eligible coins at the median beta into a low half and a high half. Within each
    half, the k = max(1, round(0.2 x half size)) coins with the HIGHEST score go to the short leg and the k with
    the LOWEST score go to the long leg. COHORT weights: long leg +0.5 / n_long each, short leg -0.5 / n_short each
    (gross 1, dollar-neutral). Each cohort is held for H = hold_weeks weeks (H x 7 days) and then removed at the
    next open. BOOK: target weight of a coin = the sum over active cohorts of its cohort weight divided by the number
    of active cohorts (at most H). So gross is <= 1 at all times and the book is fully invested from the first cohort.
    Target weights are reapplied daily (drift rebalancing only). A coin that leaves the top-30 universe gets weight
    0 at the next decision in every cohort. The other weights of that cohort are not rescaled. If the coin comes
    back, it does not re-enter that cohort (K-0051 exit rule). Missing basis or close on t makes a coin ineligible
    for that week''s cohort only. Funding is charged to positions by the engine: shorts in rich-basis coins usually
    receive it, and that is part of the P&L, reported separately if possible.'
  params:
    hold_weeks:
      grid:
      - 13
      - 26
      - 39
      value: 26
    lookback_days:
      grid:
      - 14
      - 30
      - 60
      value: 30
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At each weekly formation date t, a coin enters the long leg (side +1: its basis fell most below its own
    120-day history, net of its 30-day return, within its BTC-beta half) or the short leg (side -1: its basis rose
    most above its own history, net of its return). Both sides are marked in equal numbers within each beta half,
    so the beta gap between marked longs and shorts roughly cancels in the pooled average (K-0074).'
  horizons:
  - 7
  - 21
  - 42
  - 60
  primary_horizon_days: 60
