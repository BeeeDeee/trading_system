falsification_criteria:
- 'Mechanism: the side-adjusted 60-day abnormal return of leg entries is not above the 95th percentile of the time-shifted
  placebos, or gross per event is below the round-trip cost.'
- 'Mechanism, decay: the latest third of dev (mostly 2022) has the wrong sign. This is a kill condition even if
  the pooled test passes (K-0060), because H-0039''s crowding effect lived in the 2021 boom.'
- 'Mechanism, shape: the 7-day abnormal return is larger than the 60-day one. That would mean a fast basis reversal,
  not a slow leverage unwind, and would refute the reason for a half-year hold.'
- 'Mechanism, identity: the placebo mean is at least half of the event mean. Then the score picks persistent coin
  identity, not timing.'
- 'Strategy: net Sharpe on dev below 0.5 (and below T-bill + 0.10), or the bootstrap bound of the Sharpe difference
  vs T-bills below zero.'
- 'Robustness: fewer than 75 % of the neighbors (lookback_days 14/60, hold_weeks 13/39 and their combinations) keep
  Sharpe >= 0.5, or the median neighbor Sharpe is below 0.7 x the primary.'
- 'Costs: Sharpe at 2x costs falls below the T-bill bar.'
- 'Carry, not unwind: if funding received by the short leg is more than the whole net return (price P&L of the book
  <= 0), the mechanism claim is refuted even if the book passes.'
notes: 'Brief fit: the hold is 26 weeks (grid 13-39), at the short end of the 6-24 month brief. The judge''s mechanism
  test is capped at 60 days, so it sees only the first third of a cohort''s life; the half-year hold is argued from
  the leverage cycle (liquidation waves every few months, the BIS crash-prediction result), not from a dev result.
  Why this is not a near-copy of H-0039 (same family on purpose, so the trials count together): H-0039 ranked the
  trailing funding LEVEL across coins, inside past-week-return halves, with a 5-day hold. Its lesson names two problems:
  ties at the default funding rate turn the score into a liquidity sort, and the score has no timing within each
  coin. This card uses the basis, which is continuous and has no default clamp, measured against each coin''s own
  120-day history. It removes the coin''s own 30-day return by cross-sectional regression and matches sides inside
  BTC-beta halves. These are the tie-free, own-history score and the beta and identity controls that H-0039''s open
  questions and K-0128 / K-0074 ask for. So the events are different, not H-0039''s events with a longer hold. Honest
  disclosure: H-0039''s lesson says its effect grew with the horizon. I know that, and the shape kill condition
  above (7-day > 60-day refutes the claim) is meant to stop this card from being a dev-informed horizon stretch.
  Expected size and power: a gross long-minus-short gap of a few percent over 60 days against a perp round trip
  of well under 1 %. Cost is not the binding constraint. The placebo bar for a 60-day horizon on volatile alts is
  wide (K-0071, K-0076), and dev has one boom-and-bust cycle (K-0006), so a near miss should be read as cannot tell.
  Events start only once coins have about 150 days of perp history (mid-2020), so the first third of dev is thin
  (K-0163). About 6 longs and 6 shorts per week over about 120 formation weeks give well over 200 events on more
  than 30 dates. Turnover is low (about 2/26 of gross per week plus drift), so costs x2 should not bind. The reference
  is from 2023, after dev ends, so there is no in-dev publication-decay check. Its claim is mainly time-series (BTC/ETH
  carry predicts crashes); the cross-sectional within-coin form here is my extension, not the paper''s result.'
