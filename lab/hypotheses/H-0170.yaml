falsification_criteria:
- 'Mechanism: the event set (top and bottom fifth of the score on shock-week decision dates, sides +1 / -1) does
  not beat the 95th percentile of the time-shifted placebos at 5 sessions, or its gross abnormal return per event
  is below the round-trip cost (about 12 bps for LIQ-500).'
- 'Mechanism: the latest third of dev is wrong-signed (expected decay, K-0060, stated as a kill condition), or the
  effect is absent at 3 and 5 sessions and appears only at 10 (slow style drift, not a delayed response to the shock).'
- 'Mechanism: the placebo mean (same stocks, shifted dates) is as large as the event mean: the picks are stocks
  that do well on any date, not a shock-signed response.'
- 'Linear control: a ridge on the same six features with the same schedule (framework ridge), which can only rank
  on a static mix of the four fundamentals, gives shock-week picks that are as good or better: then the shock interaction
  is not what pays and the card is a static value/profitability tilt.'
- 'Strategy: net Sharpe on dev below SPY_TR + 0.10, or the stationary-bootstrap bound of the Sharpe difference below
  zero.'
- 'Robustness: fewer than 75 % of the neighbors of shock_z 1.0 and n_estimators 100 beat SPY_TR, or the book does
  not beat SPY_TR at doubled costs.'
notes: 'Family: this is the lab''s macro-news-into-stocks family (oil-shock-equity-underreaction, the name is legacy;
  it also holds the rate, dollar, credit, curve, inflation and commodity cards), so the card carries that family''s
  trial count on purpose. What is new: the shock is the TIPS real yield (no stock card in the lab has used DFII10)
  and the mapping is valuation duration built from payout, book, profitability and growth, not a statistical rate
  beta (H-0116, null), not debt and funding structure (H-0162, H-0158, H-0126, which used leverage, short-term debt,
  deposits, interest burden), not real versus monetary assets on breakevens (H-0129) and not the quarter-long reaching-for-income
  tilt on dividend yield and nominal yield changes (H-0154, which died below its same-stock placebo mean because
  the high-dividend picks earn on any date). Here the side flips with the shock sign, so the same stocks sit at
  the top in some shock weeks and at the bottom in others, and the placebo mean should be near zero; if it is not,
  criterion 3 kills the card. Excluded on purpose: the stock''s own past return and volatility, so that the model
  cannot rebuild short-term reversal or a stress rebound (K-0084, K-0119, K-0204 suspect volatility as the carrier
  of earlier passes); the score can only use duration and the shock. Background for the duration proxies (not the
  source of the conditional claim, so no references block and no literature trials): Dechow, Sloan and Soliman,
  implied equity duration; Weber, cash-flow duration and the term structure of equity returns; Hong, Torous and
  Valkanov, gradual diffusion of information across markets. Forecasts (K-0098, K-0120, written before any data):
  DFII10 exists from the view start, so z_t starts about one year later and the first model fit needs a further
  stretch of shock weeks; |z| >= 1 on overlapping 5-session changes should hold on roughly a quarter to a third
  of weeks, about 12-16 shock weeks a year, about 170-240 scored shock-week dates in dev; events about 190 per date
  (top and bottom fifth of about 480 scored members), about 30 000-45 000 in total; the first G1 block will be thin
  because of warm-up (K-0163), so the later two blocks must both be right-signed. Expected gross per event 10-30
  bps against a round trip of about 12 bps: the cost check may bind. Book arithmetic (K-0064, K-0147): mean exposure
  1.0; in a shock week about 80 % of the book rotates from the core into the top fifth and back, about 1.6 one-way
  turnover, about 10 bps a shock week, about 1.2-1.6 % a year; if the top fifth beats the equal-weight members by
  20 bps a shock week the gross tilt gain is about 2.5-3 % a year, net about 1-1.5 %, on a book with about 19 %
  volatility: a Sharpe gain of about 0.05-0.08 over the core, so the G1 margin of 0.10 over SPY_TR is reachable
  only if the effect is at the upper end or the equal-weight core does not lag SPY_TR. The most likely death is
  therefore the strategy margin after a mechanism verdict, which is still informative for the family. The book is
  long-only because five learned neutral books in the lab earned on the long leg and lost on the short leg (K-0207);
  the mechanism test uses both tails for power and beta balance, the book harvests only the top tail, and the study
  and the book measure the same thing (top fifth against equal-weight members), so they should reconcile (K-0097).
  The equal-weight core against the cap-weighted SPY_TR is a known confound (H-0025): the tilt''s contribution is
  book minus core, and a pass that comes from the core alone is not evidence. If the ridge control is as good, the
  conclusion is that real-yield news adds nothing to a static fundamentals tilt, and the linear form should not
  be filed as a timing claim (K-0182). Desired diagnostics if the judge can give them: event average split by shock
  sign (real yield up against down) and by side (top against bottom fifth).'
