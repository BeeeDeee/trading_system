id: H-0170
version: 1
title: Real-yield news into equity cash-flow duration, learned - LIQ-500 long-only EW core, 5 sessions in the top
  fifth of a LightGBM duration x TIPS-shock score
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity holders who rebalance or reprice slowly after bond-market news (generalist funds, investors
    trading through style baskets that sort on labels rather than on each firm's cash-flow timing), who sell long-duration
    names too late after a real-yield rise and buy them too late after a fall, and the opposite for short-duration
    names. They pay the five-session drift to whoever reads the shock through the fundamentals first.
  why: 'A move in the 10-year TIPS real yield is news about the discount rate of real cash flows. Its effect on
    a stock''s value scales with the stock''s cash-flow duration: firms that pay out little, are unprofitable today,
    grow fast and have little book value carry their value in distant cash flows and lose most when real yields
    rise (and gain most when they fall); high-payout, high-book, profitable slow growers are short-duration. Duration
    is not observed: it has to be built from reported fundamentals (payout, book-to-market, profitability, growth),
    and equity investors who do not watch the TIPS market, or who reprice through broad style labels, map a real-yield
    move into the individual stock with a lag of days. The claim is a delayed, shock-signed duration response: in
    the week after a large real-yield move, the stocks whose fundamentals imply the largest gain from it (long-duration
    after a fall, short-duration after a rise) outperform the other liquid stocks over the next five sessions. The
    same macro-news-to-balance-sheet build has cleared the event test when the mapping was explicit and the shock
    market-based (credit news into leverage, H-0126; curve news into funding structure, H-0162, gain present by
    the third session and gone by the tenth); discount-rate duration is a mapping the lab has not tested.'
  why_not_arbitraged: 'The trade is a part-time, macro-conditioned stock tilt: it needs fundamentals, a bond-market
    series and a nonlinear duration map at once, earns only in a minority of weeks, carries market and style risk
    while held, and its gain per position is a few tens of basis points, small next to the cost of fast rotation
    for a dedicated arbitrageur. Cross-market attention is limited, so the slow-moving-capital argument for bond-to-
    equity transmission applies (gradual diffusion of information across markets).'
signal:
  description: 'Universe: point-in-time LIQ-500 members on each date; a stock that is not a member on a decision
    date gets no weight. Decision dates: the last trading session of each calendar week, after the close of t; trades
    at the open of t+1; positions held until the next weekly decision (about 5 sessions). All inputs use data up
    to the close of t. (1) Real-yield shock (date-level): r = the latest DFII10 value available at the close of
    t (FRED clock next_morning, so normally the value of session t-1; a missing day carries the last earlier value),
    s_t = r minus the latest value available five XNYS sessions earlier, z_t = s_t divided by the standard deviation
    of the same overlapping 5-session changes over the trailing 252 sessions (at least 200 valid values, otherwise
    z_t is missing and the week is not a shock week). A decision date is a shock week when |z_t| >= shock_z. (2)
    Market move (date-level): m_t = equal-weight mean total return of the members over the 5 sessions ending at
    t, divided by the trailing 252-session standard deviation of that 5-session mean. (3) Stock fundamentals (point-in-time,
    usable from the day after the SEC filing as the loader delivers them): dividend yield sf1_art_divyield; book-to-market
    = 1 / sf1_art_pb (missing if pb is 0 or missing; negative book gives a negative value); profitability sf1_art_roe;
    revenue growth = sf1_art_revenue at t divided by sf1_art_revenue 252 sessions earlier minus 1 (missing if either
    is missing or the earlier value is <= 0). Each stock feature is winsorized at the cross-sectional 1st/99th percentile
    and z-scored across the members of the date with the framework helper; the two date-level features z_t and m_t
    are fed raw (not cross-sectionally z-scored, which would make them zero). Feature rows exist only on shock-week
    decision dates: on every other date all features are missing, so those rows are neither used for training nor
    scored. A stock with any missing stock feature is not scored. Label: the framework label, total return from
    the open of t+1 to the open 5 sessions later, ranked across members on each date. Model: LightGBM (framework
    gbm) via lab.framework.ml.walk_forward, expanding window, refit every 126 rows, learning_rate 0.05, num_leaves
    15, min_child_samples 200, n_estimators as the parameter; the framework owns purge, seeds and refit dates. Book
    (score_weights then only_on): on a shock-week decision date with at least 100 scored members, hold the top fifth
    of scored members by score, equal weight, gross 1.0. On every other decision date (no shock, too few scored
    members, or no model fitted yet) hold the core: all current members with a valid price, equal weight, gross
    1.0. No shorts, no leverage, no cash except when the universe is empty. A position in a stock that leaves the
    universe is closed at the next decision.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    shock_z:
      grid:
      - 0.75
      - 1.0
      - 1.5
      value: 1.0
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: On a shock-week decision date (|z_t| of the 5-session DFII10 change >= shock_z), a scored LIQ-500 member
    in the top fifth of the walk-forward gbm score (side +1) or in the bottom fifth (side -1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'Real-yield shock z_t: 5-session change of the 10-year TIPS yield (FRED DFII10, next-morning clock) over the
    trailing 252-session sd of such changes; date-level, raw. The news whose sign decides which end of the duration
    spectrum gains.'
  - 'Market move m_t: equal-weight 5-session member return over its trailing 252-session sd; date-level, raw. Separates
    discount-rate news (real yield up, stocks down) from growth news (real yield up, stocks up), where the duration
    response differs.'
  - 'Dividend yield sf1_art_divyield (TTM, frozen at filing): payout, the share of value paid out near term (high
    = short duration).'
  - 'Book-to-market 1/sf1_art_pb (at filing): value in assets in place rather than distant growth (high = short
    duration).'
  - 'Return on equity sf1_art_roe (TTM): current profitability; unprofitable firms carry their value in distant
    cash flows (long duration).'
  - 'Revenue growth: TTM revenue over TTM revenue 252 sessions earlier minus 1 (sf1_art_revenue): growth pushes
    cash flows outward (long duration).'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The claim is a sign flip: the same long-duration profile should rank at the top after a real-yield
    fall and at the bottom after a rise, and duration itself is a nonlinear function of payout, profitability, growth
    and book (implied-duration formulas compound growth and profitability over the horizon, so a low-payout unprofitable
    fast grower is far longer than the sum of its parts). A ridge on the same six features cannot express any of
    this: z_t and m_t are constant across stocks on a date, so they shift every score equally and drop out of the
    ranking, and the ridge ranks on a fixed linear mix of the four fundamentals in every shock week, a static style
    tilt whose sign cannot follow the shock. A tree can split on the shock sign (and on whether stocks fell with
    it) first and on the duration profile second. Who pays: the slow repricers of the counterparty, more after large
    shocks than small ones, which is a threshold a tree can find and a linear model cannot.'
