falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events does not exceed the 95th percentile of the time-shifted
  placebos, or keeps its sign in fewer than 2 of 3 sub-periods, or the gross abnormal return per event is below
  the round-trip cost.'
- 'Mechanism (drift, not pressure): the descriptive 10- and 21-day side-adjusted abnormal returns are smaller than
  the 5-day one; a drift from under-reaction must not reverse within a month.'
- 'Mechanism (era): the latest third of dev shows an abnormal return per event below the round-trip cost; then the
  effect is a pre-2006 artefact as Martineau (2022) reports, and no strategy is worth trading.'
- 'Strategy: net Sharpe on dev below 0.5 or the one-sided bootstrap bound of the Sharpe excess over T-bills at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbors (quantile 0.1/0.3, vol_mult 1.5/3.0) beat T-bills, or the book no
  longer beats T-bills at costs x2.'
notes: 'Brief fit: short horizon (5 days), US single stocks, cross-sectional LIQ-500, mechanism test declared. Difference
  from dead cards: H-0009 (disposition-news-drift) followed the PRICE direction of any volume shock and lost; its
  lesson asked for an event study by news direction on true news days. Here the news day is identified by an SEC
  periodic filing and the side by the ACCOUNTING surprise, and the event study runs first, so a death is cheap.
  H-0008/H-0015 (earnings-announcement-premium) bet on the date of an announcement being ahead, not on the direction
  of its content; this card enters after the news and is a different mechanism (under-reaction), hence a new family.
  H-0019 (trading-window-flows) passed its mechanism on the same filing dates, and its lesson asks whether that
  spread was flow or news; this card tests the news channel on the same clock. Known risks, stated up front: K-0024
  and Martineau (2022) say large-cap drift is gone after the mid-2000s, so the most likely death is era fade (sub-period
  3) or a cost ratio below 1. The concurrency filter is what gives the idea a chance: non-concurrent filings arrive
  weeks after the release, when most of any drift is spent. Not every filing with a volume spike is the release
  (10-K filed with other news, amendments); amendments of the same period give S near zero and rarely reach the
  extremes. Market cap and net income are both frozen at the filing (K-0023), so S uses no post-filing price. The
  252-session pool and 63-session volume median are fixed round windows (one year of filing seasons, one quarter
  of volume), not tuned. Hold length is fixed at the mechanism horizon (5 sessions); the descriptive horizons cover
  longer holds without adding strategy trials. Expected density: about 2 000 filings per year in LIQ-500, of which
  the concurrent ones in the two quintiles give a few hundred events a year, a handful of active names per side
  in earnings seasons and none between them; the 0.10 per-name weight keeps mean gross exposure above the 0.20 floor.
  Builder: please fail loudly if sf1_art_marketcap is not loadable rather than silently dropping the scaling.'
