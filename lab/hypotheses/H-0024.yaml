id: H-0024
version: 1
title: Concurrent-filing earnings-surprise drift - LIQ-500 dollar-neutral, long/short top/bottom quintile earnings
  change at filings that coincide with a volume spike, hold 5 days
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors who update slowly on earnings news: holders who sell into good news and hold on after
    bad news (disposition), and attention-constrained traders on crowded announcement days. They trade at prices
    that have not yet absorbed the surprise and lose the subsequent drift.'
  why: 'Post-earnings-announcement drift (Bernard and Thomas 1989): prices under-react to the information in a quarterly
    earnings surprise, because investors anchor on the previous level of earnings and do not fully see how a year-over-year
    change carries into later quarters. Under-reaction is strongest right after the release, when attention is spread
    over many announcements on the same days. The lab cannot see release dates (K-0004), but it can see SEC filing
    dates (SF1), and a filing that arrives together with an abnormal trading-volume spike is very likely the release
    itself (firms that file the 10-Q/10-K with the press release). Restricting to these concurrent filings puts
    the entry one or two sessions after the news, where the drift per day is largest, instead of the weeks later
    where non-concurrent filings land. The surprise is measured from the accounts (change of trailing-twelve-month
    net income versus the previous filing, scaled by market value), not from the price move, so the card follows
    accounting news, not volume-shock momentum.'
  why_not_arbitraged: 'In large caps it may well be arbitraged away (Martineau 2022 finds no drift in large stocks
    after the mid-2000s); that is exactly what the mechanism test will show. What keeps any residual alive: earnings
    seasons cluster thousands of announcements in a few weeks, so arbitrage capital and attention are stretched
    at the same time, and a five-day single-name book carries idiosyncratic risk and spread costs.'
signal:
  description: 'Inputs (all point-in-time): SF1 attached fields sf1_art_netinc (trailing-twelve-month net income
    as reported) and sf1_art_marketcap (market value frozen at the filing date); the loader already makes a new
    filing usable only from the day after its SEC filing date. SEP dollar_volume. Universe LIQ-500, point-in-time
    membership. (1) Filing detection: a stock has a new filing on day t when sf1_art_netinc or sf1_art_marketcap
    on t differs from its value on t-1 and both the new and the previous values are non-missing (a value appearing
    after a missing/stale stretch is not an event). The filing date is t-1. (2) Surprise: S = (sf1_art_netinc on
    t - sf1_art_netinc on t-1) / sf1_art_marketcap on t, i.e. the seasonal (year-over-year) change of quarterly
    net income scaled by market value. Skip if marketcap <= 0. (3) Concurrency: the filing counts as concurrent
    with the earnings release if dollar_volume on t-1 or on t is at least vol_mult times the median dollar_volume
    over sessions t-64 .. t-2 (63 sessions; at least 40 valid values required, else skip). (4) Extremes: on each
    day t, compute the q and 1-q quantiles of S pooled over ALL detected filings (concurrent or not) of universe
    members in the 252 sessions up to and including t (at least 200 filings in the pool, else no events). A concurrent
    filing with S >= the (1-q) quantile is a long event (side +1); one with S <= the q quantile is a short event
    (side -1). (5) Book: decide after the close of t, trade at the open of t+1. Each event is held for 5 sessions
    (enter at the open of t+1, exit at the open of t+6). A new event for a stock already held replaces the old one
    (new side, clock restarts). Target weight +0.10 per active long name and -0.10 per active short name; if a side''s
    total exceeds 0.5 the side is scaled down proportionally to 0.5. The net (long total - short total) is hedged
    with an equal-weighted position in all other current universe members (not active event names), so the book
    is dollar-neutral and gross <= 1. No active events: flat (cash). Weights are recomputed daily only when the
    set of active names changes. (6) Missing data: a stock that leaves the universe, stops trading or delists is
    exited at the next open (delisting terminal return as in the loader); no forward filling of prices or fundamentals.'
  params:
    quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    vol_mult:
      grid:
      - 1.5
      - 2.0
      - 3.0
      value: 2.0
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: After the close of day t a LIQ-500 stock has a new SF1 filing (usable from t, filed on t-1) whose dollar
    volume on t-1 or t is at least 2 times its 63-session median (filing concurrent with the earnings release),
    and whose surprise S = change in TTM net income / filing-date market value is in the top quintile (side +1)
    or bottom quintile (side -1) of all filings of the past 252 sessions.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
