falsification_criteria:
- 'Mechanism test fails: new leg entrants on high call-demand weeks do not beat the 95th percentile of time-shifted
  placebos, or gross per entry is below the round-trip cost, or fewer than two of three dev blocks have the predicted
  sign.'
- The latest third of the dev period has the wrong sign for the mechanism event (declared kill condition, K-0060),
  even if the pooled test passes.
- 'A ridge regression on the same seven features (framework ridge, same label, schedule and book), which cannot
  use the date-level option state, gives the same or a better result than the gbm: then the call-demand interaction
  is not what pays.'
- Net Sharpe on dev below 0.5, or not above T-bills with the bootstrap bound, after costs; or below the bar at doubled
  costs.
- Fewer than 75 % of the n_estimators / num_leaves grid neighbours of (100, 15) clear the benchmark bar.
- Mechanism-event average larger at 10 sessions than at 5 with nothing at 1 session (slow style drift, not a pressure
  unwind).
notes: 'Why this is not a refile. H-0165 (same family) used the aggregate equity put/call ratio to time SPY against
  IEF and was a near miss with a contrarian sign; its lesson lists ''a stock-level cross-section'' as untested.
  This card asks the cross-sectional question: does aggregate call demand re-order speculative against conservative
  names over the next week? It is not another conditioner on the reversal sort: ret_5 is in the feature set only
  so that plain weekly reversal is not credited to the option state, and the ridge baseline (which by construction
  is the static sort without the state) is named as the kill. skewness-lottery-preference and short-term-reversal
  are listed as related families because the static part of the score overlaps them; their trials should count.
  Earlier date-level-state learned cards (H-0098, H-0099, K-0162) used VIX, drawdown or calendar clocks; none used
  option-flow data. Data and periods. The Cboe series ends 2019-10-04 and its holdout starts 2014-12-01, so the
  card''s dev period is about 2003-10 to 2014-11; the sharadar_sep period is cut to the same end (and starts a year
  earlier so the 252-session stock features are ready when the Cboe series starts). The date-level features need
  126 Cboe sessions, and the walk-forward needs its minimum training sample, so the first dev block (roughly the
  first three to four years) will be partly or mostly empty (K-0163): the later two blocks must both carry the sign.
  Cboe volume is Cboe-exchange only and its market share drifted, which is why both date features are deviations
  from a 126-session norm, not levels. Holdout (2014-12 to 2019-10) exists for G4; there is no forward data, so
  the card can pass at most G4. Forecasts (K-0120, K-0098). Scored weeks about 2005-2014, roughly 450-500 weekly
  dates; high call-demand weeks about a third, 150-170 dates; new entrants per leg per week perhaps 25-45, so about
  7000-14000 events on 150-170 dates. Round trip in LIQ-500 about 12-15 bps. Central gross per event guess 10-25
  bps over five sessions, so the cost check is the most likely death; a pessimistic case is zero. The marked short-leg
  set will carry higher beta than its peers (K-0074): a positive market week works against the short side, which
  the mkt_ret_5 feature only partly controls. Expected by leg (K-0207): the claim lives in the short leg in surge
  weeks; if only the long leg earns, the option-demand reading is not supported. Book arithmetic. Always invested
  on scored weeks, gross 1, weekly rotation of two 100-name legs; turnover maybe 60-80 % of gross per week, cost
  drag of several percent a year, so the book needs a large gross edge; the death at the absolute Sharpe floor after
  costs is likely even if the mechanism passes.'
