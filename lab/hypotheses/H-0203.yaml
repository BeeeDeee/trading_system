id: H-0203
version: 1
title: Aggregate call-buying waves and speculative-stock pressure, learned - LIQ-500 dollar-neutral weekly, LightGBM
  5-day score on stock speculativeness x Cboe equity call-volume surge
author_agent: scout
family: option-demand-pressure
related_families:
- skewness-lottery-preference
- short-term-reversal
asset_classes:
- us_equity
- sentiment
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Retail call buyers and momentum-chasing retail stock buyers, who pay a premium for lottery-like
    exposure in call-demand waves; the premium reaches the stock through market makers' delta hedges and is given
    back when the wave and the hedges unwind.
  why: 'When retail call buying surges market-wide (Cboe equity call volume far above its recent norm, equity put/call
    ratio below its norm), the demand lands mostly on speculative names: high-beta, high idiosyncratic volatility,
    recent winners with rising trading activity. Option market makers who sell those calls delta-hedge by buying
    the underlying shares, and sentiment-driven investors buy the same names directly. Both push speculative stocks
    above value for a few days, and the pressure reverses when the wave ebbs and hedges are unwound. Speculative
    stocks are the ones most exposed to sentiment and hardest to arbitrage (Baker and Wurgler 2006), and option-market-maker
    hedging moves stock prices (Ni, Pearson, Poteshman and White 2021). So the claim is conditional: next-week relative
    returns of speculative names are lower after aggregate call-demand surges than in normal weeks, and not lower
    (or higher) in normal weeks. The lab has tested the aggregate put/call ratio only on index ETFs against bonds
    (H-0165), never on the stock cross-section.'
  why_not_arbitraged: Shorting high-volatility, high-beta names exactly when speculative demand is strongest carries
    squeeze and beta risk, the effect is a few days long and dispersed over many names, and an arbitrageur would
    need daily aggregate option-flow data next to a stock-level speculativeness model. Short horizons in large caps
    are cost-bound, which keeps the trade small.
signal:
  description: 'Point-in-time daily panel of LIQ-500 members. Decisions once a week after the close of the last
    trading session of each calendar week (day t), trades at the open of the next session, positions held until
    the next weekly decision. Stock-level features, computed from sharadar_sep total returns (daily close-to-close
    return = (1+ret_co)(1+ret_oc)-1) and dollar volume up to the close of t, each z-scored across the members of
    date t with the framework helper: (1) beta_252 = OLS slope of the stock''s daily return on the equal-weight
    mean return of the members of each day, over the last 252 sessions, at least 200 valid; (2) ivol_21 = standard
    deviation of the daily residual from that beta over the last 21 sessions, at least 18 valid; (3) ret_5 = compounded
    total return over the last 5 sessions; (4) dv_ratio = log of mean dollar volume over the last 21 sessions divided
    by mean dollar volume over the last 252 sessions. Date-level features, identical for every stock on a date and
    fed raw (NOT z-scored across stocks): from cboe_putcall_1d, using only values stamped t-1 or earlier (the series
    has clock next_morning, so the value of t is not used at the close of t): (5) call_surge = log of the mean of
    equity_call over the last 5 available Cboe sessions divided by its mean over the last 126 available Cboe sessions;
    (6) pc_dev = mean of equity_pc over the last 5 available Cboe sessions minus its mean over the last 126; and
    from the stock panel (7) mkt_ret_5 = compounded equal-weight mean return of the members over the last 5 sessions
    (controls for the fact that the put/call ratio falls in rallies). If the latest Cboe value is older than 5 sessions,
    features (5) and (6) are missing for that date: the date is not scored and the book is flat until the next weekly
    decision with valid features. Stocks with any missing stock-level feature are not scored. Label: total return
    from the open of t+1 to the open of t+6 (horizon_days 5), ranked across members of date t (framework label).
    Model: LightGBM (framework gbm) via lab.framework.ml.walk_forward on all daily member rows, expanding window,
    refit every 63 rows, first fit when the framework''s minimum training sample is reached; fixed settings learning_rate
    0.05, min_child_samples 10000 (a leaf must span roughly twenty dates, so that splits on the date-level features
    cannot isolate single weeks), subsample and colsample framework defaults; n_estimators and num_leaves as in
    params. Book (score_weights + only_on weekly dates): rank scored members by the model score; long the top 20
    % equal weight with total weight +0.5, short the bottom 20 % equal weight with total weight -0.5 (gross 1, dollar-neutral).
    Fewer than 50 scored members on a decision date means flat. A stock that leaves the universe is closed by the
    framework at the next open; delistings take the dataset''s terminal return. Non-members are masked per row,
    never removed as columns (K-0134).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    num_leaves:
      grid:
      - 7
      - 15
      - 31
      value: 15
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At a weekly decision date t whose call_surge is in the top third of its own trailing 252-session distribution
    (known at t, lagged Cboe data; a high market-wide call-demand week), a stock newly enters a leg of the gbm score:
    side +1 when it enters the long (top 20 %) leg, side -1 when it enters the short (bottom 20 %) leg. Stocks that
    were already in the same leg at the previous weekly decision are not events.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'beta_252: 252-session beta of the stock''s daily total return on the equal-weight member mean (sharadar_sep),
    z-scored across members; speculative high-beta names are where call demand and its hedges land'
  - 'ivol_21: 21-session residual volatility from that beta (sharadar_sep), z-scored; lottery-like names that retail
    call buyers prefer and that are hardest to arbitrage'
  - 'ret_5: 5-session compounded total return (sharadar_sep), z-scored; call buyers chase recent winners, and it
    also absorbs plain weekly reversal so the state is not credited for it'
  - 'dv_ratio: log 21-session over 252-session mean dollar volume (sharadar_sep), z-scored; rising trading activity
    marks names in the current speculative wave'
  - 'call_surge: log of 5-session over 126-session mean Cboe equity call volume, lagged one session (cboe_putcall_1d),
    date-level raw; the size of the market-wide call-buying wave'
  - 'pc_dev: 5-session minus 126-session mean Cboe equity put/call ratio, lagged one session (cboe_putcall_1d),
    date-level raw; call demand relative to put demand, robust to Cboe market-share drift in volume levels'
  - 'mkt_ret_5: 5-session equal-weight member return (sharadar_sep), date-level raw; separates call-demand waves
    from ordinary rallies that also lower the put/call ratio'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim lives entirely in an interaction. The date-level features (call_surge, pc_dev, mkt_ret_5)
    are the same for every stock on a date, so in a cross-sectional ranking a ridge adds the same constant to every
    score and they cannot change who is long or short: a ridge on these seven features is exactly a static sort
    on beta, idiosyncratic volatility, weekly reversal and volume trend. Only a model that lets the slope on speculativeness
    depend on the call-demand state can use the option data, and the expected shape is a threshold: speculative
    recent winners rank low only in surge weeks (call_surge high, pc_dev low, not explained by mkt_ret_5) and roughly
    neutral otherwise. Who pays: retail call buyers and the market makers'' hedge flow they induce. The ridge on
    the same features is the named baseline; if it is as good, the option state adds nothing.'
