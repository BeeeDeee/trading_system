id: H-0039
version: 1
title: Perp leverage-crowding unwind - top-20 Binance perps, dollar-neutral, short the highest and long the lowest
  trailing funding within past-week-return halves, hold 5 days
author_agent: scout
family: perp-leverage-crowding
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Trend-chasing retail traders on high leverage who pay above-peer funding to stay long (or short)
    and are liquidated or give up when the move stalls; their forced exits are the price pressure the strategy bets
    on.
  why: 'The funding rate of a perpetual is the price leveraged traders pay to hold a position; it is set by the
    derivatives market and measures how crowded the leveraged side is relative to the spot market. Schmeling, Schrimpf
    and Todorov (Crypto carry, BIS WP 1087) attribute high crypto carry to trend-chasing small investors seeking
    leveraged upside and to scarce arbitrage capital, and find that high carry predicts price crashes. The cross-sectional
    version: a coin whose funding is high relative to peers with a similar past-week return carries a crowded, highly
    levered long base. Those longs bleed funding every eight hours and sit close to their liquidation prices, so
    over the next days they are closed voluntarily or forcibly (liquidation cascades, margin calls), and the perp
    and spot prices fall relative to peers. A coin with unusually low or negative funding has a crowded short base
    that is squeezed in the same way. The signal comes from the derivatives market''s positioning price, and the
    trade bets on the price path it predicts, not on collecting the carry.'
  why_not_arbitraged: The natural arbitrageur (long spot, short perp) is market-neutral and only collects the basis.
    They do not take the directional side, and their capital is scarce and leaves exactly when margins spike in
    drawdowns (Schmeling et al.). Taking the directional short in crowded altcoins means facing squeeze risk with
    exchange margin, which limits the capacity of funds. Many coins lack spot borrow, so the perp is the only short,
    and crowding builds on the perp itself.
signal:
  description: 'Data: binance_perp_1d, daily bars closing at 00:00 UTC; extras funding = the day''s sum of funding
    rates (known after the close). Universe: point-in-time top 20 perps by 30-day quote volume (crypto_top_n). Decision
    after the close of day t, trades at the open of day t+1. (1) Eligibility at t: in the universe at t, funding
    non-missing on each of the last funding_days days (t-funding_days+1 .. t), and a price on each of the last 7
    days. (2) Crowding score F_j = sum of daily funding over the last funding_days days. (3) Momentum control: R_j
    = compounded perp total return over the last 7 days (close t-7 to close t, from ret_co and ret_oc). Split the
    eligible names at the cross-sectional median of R into a low half and a high half (the extra name of an odd
    count goes to the high half). (4) Within each half, rank by F. Take k = max(1, floor(0.25 x half_size + 0.5))
    names with the highest F into the short leg and k names with the lowest F into the long leg. Ties are broken
    by quote volume (more liquid first). (5) Weights: each long name +0.5 / N_long, each short name -0.5 / N_short
    (dollar-neutral, gross 1.0). (6) Schedule: rebalance every hold_days days, on decision rows whose index since
    the first row with at least 8 eligible names is a multiple of hold_days. Between rebalances the weights are
    kept unchanged (no drift rebalancing). Exception: a held name that leaves the universe, or loses its price,
    is set to weight 0 at the next decision row, without renormalising the others (the engine refuses weights outside
    the universe, K-0051). If fewer than 8 names are eligible on a rebalance row, the book goes flat until the next
    rebalance row. Funding is charged by the engine (longs pay, shorts receive); it is part of the P&L but not of
    the signal test.'
  params:
    funding_days:
      grid:
      - 1
      - 3
      - 7
      value: 3
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'After the close of day t, perp j (eligible in the top-20 universe as in steps 1-4 of the signal, with
    funding_days = 3) is among the k highest trailing funding sums within its past-7-day-return half (side -1: crowded
    longs, should underperform) or among the k lowest (side +1: crowded shorts, should outperform). Evaluated on
    every day, not only rebalance days.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
data_requirements:
- dataset: binance_perp_1d
  description: USD-M perps of the PIT top-20 universe; extras funding (signal and charged funding) and basis are
    delivered with the dataset.
  fields:
  - ret_co
  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2020-01-01'
  - '2026-09-30'
holding_period:
  rebalance: event
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Schmeling, Schrimpf, Todorov (2023) Crypto carry, BIS Working Paper No 1087
  url: https://www.bis.org/publ/work1087.htm
  year: 2023
falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events (price only, funding excluded) is not above
  the 95th percentile of the time-shifted placebos.'
- 'Mechanism: the gross abnormal return per event is below the round-trip cost, or its sign is wrong in two of the
  three dev sub-periods.'
- 'Mechanism shape: the 1-day horizon carries more than the 5-day horizon and the 10-day horizon is no larger than
  the 1-day one; that would mean a one-day reversal, not a multi-day crowding unwind (descriptive, read by the Librarian).'
- Net Sharpe on dev below 0.5 or not above the T-bill, or the bootstrap bound of the difference to T-bills below
  zero (G1).
- At doubled costs the net Sharpe no longer beats the T-bill hurdle, or fewer than 75 % of the neighbours of funding_days
  3 / hold_days 5 beat it (G2).
- One of the three dev sub-periods carries more than 60 % of the log return, or fewer than two beat the benchmark
  (G2).
notes: 'Brief fit: the brief asks for cross-asset short-horizon ideas. I checked the TradFi-to-X routes against
  what the lab has learned, and each fails for a known reason. Daily lead-lag between liquid markets died out of
  sample (mrel). FRED FX rates are noon fixings and gave spurious lead-lag. Home-market catch-up of country ETFs
  happens before the US open, where the engine fills. One-day macro-announcement premia in ETFs are of the order
  of the cost of switching in and out. Month-end FX hedge-rebalancing flows (Melvin and Prins) would be invested
  about one day a month, under the exposure floor. The closest fit with a real counterparty is across markets inside
  one asset: the signal is the positioning price of the derivatives market (funding), and the trade bets on the
  price path it predicts. Not a near-copy: study 8 (funding carry) was delta-neutral long spot / short perp and
  harvested the carry only. This card bets on relative price moves and is tested on prices only: the event study
  excludes funding. H-0006 and H-0035 fade a liquidation flush after it has happened; this card positions before
  the forced exit. Study 10''s crypto short leg was a trend short. Here the past-week-return split holds momentum
  roughly fixed, so a pass cannot be plain short-term momentum or reversal. Known confounds, stated up front: (a)
  The short leg receives funding in the engine, and in 2020-2022 funding was high (catalog: a regime change after
  mid-2024), so the strategy P&L is flattered by carry. The price-only mechanism test is the honest gate. If possible
  the Builder should report the funding P&L separately from the price P&L. (b) High-funding names may be the more
  volatile, recently listed names, so a low-volatility effect could pose as crowding; a volatility-matched control
  would separate them. (c) The dev period is short (2020-2022, K-0006), but decisions are daily over a 20-name cross-section,
  so the event set is large. Cost estimate: rebalancing every 5 days with part of the names rotating means roughly
  one unit of notional traded per rebalance at perp tier costs, a high single-digit percentage per year. That is
  why the hold is 5 days rather than 1-3, and why it may still die on costs x2. Parameter values are round and not
  tuned. The 0.25 leg fraction and the median split are fixed structural choices, not parameters.'
