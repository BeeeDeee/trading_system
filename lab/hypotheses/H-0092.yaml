id: H-0092
version: 1
title: Accrual information at the 10-Q/10-K filing - LIQ-500 long/short, long low-accrual and short high-accrual
  filers from the second session after the SEC filing, hold 5 days
author_agent: scout
family: anomalies-at-earnings-news
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Earnings-fixated holders and momentum or earnings-surprise traders who bought the headline number
    at the release and do not re-read the filed cash-flow statement; they hold or keep buying high-accrual firms
    and under-buy low-accrual firms in the days after the filing.
  why: 'Earnings fixation (Sloan 1996): investors price the headline earnings number and underweight how much of
    it is backed by operating cash flow, so firms whose earnings are mostly accruals are overpriced relative to
    firms whose earnings are mostly cash. For a large share of firms the full cash-flow statement, and with it the
    accrual component of the quarter, becomes public only with the 10-Q or 10-K filing, which often comes days or
    weeks after the earnings press release. Balsam, Bartov and Marquardt (2002) find that prices react to the quarter''s
    unexpected accruals around the 10-Q filing date, and that the reaction is slower where the investor base is
    less sophisticated. The claim of this card is that the price adjustment to the newly filed accrual is not finished
    by the session after the filing becomes usable: low-accrual filers keep beating high-accrual filers over the
    following week. The event is the arrival of the accrual information itself, not a later earnings release that
    resolves an old anomaly.'
  why_not_arbitraged: Each signal is small per name, appears on scattered dates through a seven-week filing season,
    needs parsing of the filed statements, and pays only a fraction of a percent over a week against the idiosyncratic
    risk of single names; shorting high-accrual growth names carries squeeze and borrow risk. Sophisticated traders
    take the first sessions (which this card does not try to capture, see notes), and capacity for the slower remainder
    is limited by the spread cost of a week-long single-name book.
signal:
  description: 'Inputs: sharadar_sep (ret_co, ret_oc, dollar_volume, tradable, extras liq_rank) and the as-reported
    quarterly SF1 fields sf1_arq_netinc, sf1_arq_ncfo, sf1_arq_assets (usable from the session after the SEC filing
    date, as the loader delivers them). Decisions after the close of each session t, trades at the open of t+1.
    (1) Filing event: stock j has a filing event on session t if j is a LIQ-500 member at t, the tuple (sf1_arq_netinc,
    sf1_arq_ncfo, sf1_arq_assets) at t differs from the tuple at t-1 in at least one field (NaN to a value counts
    as a change), all three values are non-NaN at t, sf1_arq_assets > 0, and j had no accepted filing event in the
    previous 40 sessions (drops amendments and re-filings of the same quarter). No events in the first 63 sessions
    of the data view (warm-up: values loaded on the first rows are not new filings). (2) Score: quarterly accruals
    acc = (sf1_arq_netinc - sf1_arq_ncfo) / sf1_arq_assets, all three from the same latest filing. (3) Breakpoints:
    on each session t, compute acc for every current LIQ-500 member with non-NaN values (the latest filing of each,
    whatever its date, as delivered by the loader); if fewer than 100 members have a value, no events that day.
    Let lo = the leg_quantile quantile and hi = the (1 - leg_quantile) quantile of that cross-section. (4) Side:
    a filing event with acc <= lo is a long event (+1), with acc >= hi a short event (-1); filers in between are
    not events. (5) Book: each event opens a position at the open of t+1 with a fixed weight of +0.04 (long event)
    or -0.04 (short event), held for hold_days sessions and closed at the open of session t+1+hold_days. No re-equalizing
    of weights between entry and exit. If a stock leaves LIQ-500 or is not tradable during the hold, its position
    is closed at the first decision row where that happens (the engine allows no weight outside the universe). A
    stock already held gets no second position; a new event on a held stock is ignored. If the new entries of a
    session would take the gross above 1.0, all of that session''s new entries are scaled by the same factor so
    that gross equals 1.0. Cash otherwise. Long and short legs are not forced to balance (market_exposure long_short).'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: A LIQ-500 stock's new 10-Q/10-K filing becomes usable on session t (the as-reported quarterly net income,
    operating cash flow and assets change, first change in 40 sessions) and its quarterly accruals (net income minus
    operating cash flow, over assets) fall in the bottom leg_quantile (side +1) or the top leg_quantile (side -1)
    of the current LIQ-500 cross-section of latest accruals.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
