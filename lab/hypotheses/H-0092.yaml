references:
- cite: Sloan (1996) Do stock prices fully reflect information in accruals and cash flows about future earnings?
    The Accounting Review
  year: 1996
- cite: 'Balsam, Bartov, Marquardt (2002) Accruals management, investor sophistication, and equity valuation: evidence
    from 10-Q filings. Journal of Accounting Research 40(4)'
  year: 2002
- cite: Livnat, Santicchia (2006) Cash flows, accruals, and future returns. Financial Analysts Journal 62(4)
  year: 2006
falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return after entry is at or below the 95th percentile of the
  time-shifted placebos, or below the round-trip cost per event: no exploitable accrual adjustment after the filing
  in LIQ-500.'
- 'Mechanism shape: if the 1- and 3-session abnormal returns are about zero or wrong-signed and the effect appears
  only at 10-21 sessions, the filing-information claim is wrong (it is the slow always-on accrual style of H-0032),
  even if the pooled 5-session test passes.'
- 'Mechanism decay: the latest third of dev (about 2013-2020) has the wrong sign: the anomaly is gone (Green, Hand
  and Soliman''s demise reading) and the card is dead regardless of the pooled result.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of Sharpe minus T-bill at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (leg_quantile 0.1/0.3, hold_days 3/8) clear the T-bill bar, or doubled
  costs leave Sharpe below the bar.'
notes: 'Brief fit: US single stocks, LIQ-500, cross-sectional, 5-session hold, mechanism test declared. Why this
  is not a retry of H-0032 (anomalies-at-earnings-news, accruals-profitability-asset-growth composite in a window
  around the predicted 8-K release, failed with a slow shape): that card assumed an old anomaly is corrected at
  the next earnings news; this card times the trade to the arrival of the accrual number itself (the SEC filing,
  real filing date from SF1, no date prediction) and uses accruals alone. Filed in the same family on purpose, so
  the trials count together. Why it is worth one trial: H-0019 passed its mechanism test clearly when anchored to
  the filing and failed when moved to the release (H-0027), and its sort (repurchases, stock issuance) is also cash-flow-statement
  information; K-0110 left open whether that pass was filing-linked news. This card tests the filing-news reading
  with the canonical cash-flow-statement signal. If it fails with a flat first week, filing-anchored information
  in LIQ-500 is closed; if it passes with a front-loaded shape, H-0019 was news, not flow. Timing: SF1 values are
  usable from the session after the SEC filing date, so with a decision at that close the entry is two sessions
  after the filing. The filing-window reaction of Balsam et al. is therefore NOT harvested; only the slower remainder
  is tested. The same-stock time-shifted placebo absorbs the always-on level of a stock''s accruals (K-0025), so
  the test asks exactly whether the week after the filing is special. Forecasts (K-0098, K-0120): about 500 members
  x 4 filings x 85-90 % SF1 coverage = 1700-1800 filing events per year, 40 % in the two legs = about 700 events
  per year, roughly 14,000-16,000 events on 3,000-4,000 dates over 1998-2020 (fewer in the 63-session warm-up and
  if ARQ coverage is thinner early). Clustered in filing seasons (about weeks 3-10 after each quarter end, plus
  off-calendar fiscal years). Mean open positions about 700 x 5 / 252 = 14, gross about 14 x 0.04 = 0.55, capped
  at 1.0 at season peaks; mean exposure forecast 0.4-0.55. Round trip per event leg: half-spread 3-6 bps by rank
  (x2.5 before 2001-04), so about 8-12 bps after decimalization and 20-30 bps before; pooled roughly 12-15 bps.
  Expected gross per event at 5 sessions: an annual accrual spread of 5-8 % in large caps spread evenly would give
  only about 5-8 bps per event-side, under cost; the card needs the filing week to carry two to three times its
  share (15-25 bps) to clear cost. Book: at 15-20 bps net per event x 700 events x 0.04 = 4-6 %/yr against a vol
  of roughly 5 %, a Sharpe near the 0.5 floor. Most likely deaths, in order: decay in the latest third (accrual
  anomaly reported to fade after the early 2000s, and more firms now put the cash-flow statement in the press release,
  so less is new at the filing); gross under cost; strategy under the absolute Sharpe floor. Biases against the
  card: high-accrual firms lean to growth and higher beta (K-0074), so bull years favour the short leg; high accruals
  often come with an earnings beat whose release drift (K-0046) also favours the short leg. Quarterly accruals have
  industry seasonality; firms in the same filing season mostly share the fiscal quarter, which limits it. Banks
  and insurers have accruals that mean little; the universe is ticker-blind and SF1 carries no sector, so they stay
  in (their scaled accruals are mostly mid-distribution). Untested splits that the gate cannot report: filings that
  come separately after the release versus filed on the release day; long versus short side.'
