title: Stop-cascade breakout from compressed ranges on Binance perps - follow the first taker-dominated, high-volume
  15m close outside an unusually narrow 24h range, both sides, hold 6 hours
author_agent: scout
family: stop-cascade-breakout
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 15
mechanism:
  counterparty: 'Leveraged traders whose stop-loss orders and forced liquidations sit just beyond the range: they
    buy (sell) at market after the break, regardless of price, and pay the continuation to whoever is already positioned
    in the break direction. They keep doing it because tight stops near obvious levels are the standard way to cap
    risk on high leverage, and liquidation prices are set mechanically by margin rules.'
  why: During a quiet, narrow trading range, leveraged perp traders open positions with tight stops and liquidation
    prices that cluster just beyond the range edges (the obvious levels). When price closes outside the range on
    heavy aggressive (taker) volume, those stops and the exchange's liquidation engine turn into market orders in
    the direction of the break. This positive-feedback flow (Osler 2005 documents it for stop-loss clusters in FX)
    carries price further over the following hours. The narrower the prior range relative to the instrument's own
    history, the more stops and liquidation levels sit close to the edge, and the more the break carries. A taker-dominated,
    high-volume break candle shows the cascade has started; a break on light or balanced flow is more often a drift
    that falls back.
  why_not_arbitraged: The payoff is per event and small in capacity (a few hours of cascade flow per instrument),
    false breaks are frequent so the edge only shows after costs on a selective subset, and the trade carries gap
    and reversal risk that market makers, who are the natural takers of the other side, avoid by widening quotes
    rather than by trading direction. Exchanges cannot remove the stop and liquidation clustering because it follows
    from leverage and margin rules.
signal:
  description: "Data: binance_perp_15m candles (o, h, l, c, qv, tbq, funding) of the point-in-time top-15 perpetuals\
    \ by 30-day quote volume. Decisions after the close of every 15-minute candle t, fills at the open of candle\
    \ t+1 (engine convention). Let W = range_hours * 4 candles. For each instrument j in the universe at t with\
    \ at least 30 days of history: (1) Prior range: HI = max(h) and LO = min(l) over candles t-W .. t-1 (excluding\
    \ t); R = (HI - LO) / c[t-1]. (2) Compression: CR = R / median of the same quantity R computed at every candle\
    \ over the previous 30 days\n    (2880 candles, ending at t-1). The instrument is compressed if CR <= compression_ratio.\n\
    (3) Break: long candidate if c[t] > HI, short candidate if c[t] < LO. (4) Flow confirmation (fixed, not tuned):\
    \ qv[t] >= 2 x the mean qv of candles t-W .. t-1, and taker-buy share\n    tbq[t]/qv[t] >= 0.55 for a long,\
    \ <= 0.45 for a short.\n(5) Exclusion of the H-0035 event region (fixed): skip if the absolute log return over\
    \ the last 4 candles\n    (c[t-4] to c[t]) exceeds 4 x the standard deviation of non-overlapping 1-hour log\
    \ returns over the past\n    30 days. Such moves are already-extended cascades where the lab saw a rebound,\
    \ not a continuation.\n(6) Cooldown: no new entry on instrument j if j had an entry in the previous W candles.\
    \ Entry: a candidate that passes (2)-(6) opens a position of weight +0.25 (long) or -0.25 (short). At most 4\
    \ positions at once (gross <= 1). If more candidates than free slots arrive on the same candle, take those with\
    \ the highest qv[t] / mean qv ratio; candidates that find no free slot are dropped, not queued. Exit (whichever\
    \ comes first): (a) time stop after hold_hours * 4 candles; (b) failed break: a candle closes back on the other\
    \ side of the range midpoint (LO + HI)/2 of the entry signal (below it for a long, above it for a short); (c)\
    \ the instrument leaves the point-in-time universe (close at that decision row, per K-0051). Exits are decided\
    \ at a candle close and filled at the next open like entries. No pyramiding, no reversal into the opposite side\
    \ on the same candle (a new signal waits for the cooldown). Funding is charged by the engine to open positions\
    \ on settlement candles. Missing candles (gap rows, real == 0) never trigger a signal; an instrument with any\
    \ gap row inside the W window is skipped at t. All windows use only candles up to t."
  params:
    compression_ratio:
      grid:
