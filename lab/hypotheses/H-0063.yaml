falsification_criteria:
- 'Intraday G1: fewer than 300 trades in dev, net annualized Sharpe below 0.5, or the 75 % bootstrap bound of the
  mean net trade return at or below zero.'
- 'Mechanism (continuation, not noise): the mean gross return per trade (before costs) is below 26 bps, i.e. below
  the doubled round-trip cost of the most liquid tier, so the cascade does not carry far enough to pay a taker.'
- 'Mechanism (fill timing): with a one-candle later fill the Sharpe falls below half of the primary; a stop cascade
  that runs for hours should not be exhausted within one candle (if it is, it is the front-loaded H-0035 shape and
  the card is wrong).'
- 'Neighbors: fewer than 75 % of the parameter neighbors (range_hours 12/48, compression_ratio 0.5/0.7, hold_hours
  3/12) have a positive net Sharpe, or their median Sharpe is below 0.7 x the primary.'
- 'Sub-periods: fewer than two of three dev blocks are net positive, or one block carries more than 60 % of the
  log return (the latest block negative is a kill condition by itself, K-0060).'
- 'Costs x2: net Sharpe at doubled costs not positive. Random timing: the same trades at random times reach the
  95th percentile.'
notes: 'Brief: SCALPING, 15m Binance perps; fits the brief''s ''range compression and expansion'', ''forced liquidations''
  and ''taker-flow imbalance'' directions in one rule. No mechanism_test, as the intraday judge has none. Relation
  to H-0035 (short-term-reversal, 15m perps): H-0035 faded 1-hour moves of 4+ sigma on 3x volume and found a front-loaded
  rebound. This card claims continuation on a different event set: the first break out of an unusually narrow range,
  and step (5) removes the H-0035 event region explicitly, so the two event sets are disjoint and the results cannot
  contradict each other on the same candles. The claim is that cascades are continuations at their start (breaking
  stop clusters) and reversals once extended; the lab has evidence only for the second half. Relation to prior studies:
  study 1 included daily breakout rules on US stocks and study 9 crypto trend filters on daily bars; this is intraday,
  conditional on compression and aggressive flow, with a hours-long hold, and it is long/short symmetric, so it
  does not depend on the market direction of a boom or bust year. The family name is new (stop-cascade-breakout);
  if the Chair considers it part of a breakout or trend-following family from study 1 or research 15 (which used
  the same 15m basket), the trial count should be merged. Cost arithmetic: round trip is 13 bps at the BTC/ETH tier,
  16 bps at >=200M USD, 22 bps at >=50M; the top-15 in 2020 includes names in the 50-200M tier, so the card needs
  a mean gross of roughly 30+ bps per trade to survive doubled costs. A 6-hour move after a compressed-range break
  in liquid alts is typically one to a few percent in absolute size, so the claim is a modest directional edge on
  large moves, not a small edge on small moves. Expected trade count: about one to two qualifying breaks per instrument
  per month across 15 names over 36 months, i.e. several hundred to about a thousand trades; the tightest neighbor
  (ratio 0.5) has fewer. The failed-break exit at the range midpoint caps losses on false breaks without being a
  tuned stop. Thresholds in (4) and (5) are fixed round values (2x volume, 55/45 taker share, 4 sigma borrowed from
  H-0035), not part of the grid. Most likely death: false breaks plus costs leave the mean net trade near zero (G1),
  or the edge sits in the 2021 boom block (G2 sub-periods). The dev window is one boom-and-bust cycle (K-0006),
  so thirds are regimes.'
