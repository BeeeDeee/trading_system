  kind: instruments
mechanism:
  counterparty: Liquidity demanders who use the credit ETF as the fast exit or entry (multi-asset and risk-parity
    funds de-risking, tactical allocators, hedgers shorting HYG) and pay a concession to the AP and dealer who warehouses
    the bond basket; the strategy is a slow, small liquidity provider next to them.
  why: 'Corporate bonds are illiquid and trade OTC, while their ETFs (HYG, JNK, LQD) trade on the exchange all day.
    Investors who need to shed credit risk fast (redemption-hit funds, risk-parity and multi-asset desks, hedgers)
    sell the ETF rather than the bonds, so the ETF price can fall further than the value of the bonds it holds.
    Authorized participants close the gap only when it exceeds the cost of redeeming in kind and selling the bonds,
    which is large and balance-sheet intensive for high yield, so gaps inside that band close slowly over days as
    the selling pressure fades and arbitrage capital arrives (Petajisto 2017: ETF price deviations from value mean-revert,
    larger for illiquid holdings; Ben-David, Franzoni, Moussawi 2018: non-fundamental ETF demand moves prices and
    arbitrage is limited). The value of the bonds is observed from a different market: the ICE BofA option-adjusted
    spread of the matching index (FRED) plus Treasury yields. The signal is the part of the ETF return that the
    bond-market moves do not explain (a NAV-gap proxy), not the ETF return itself, so a credit selloff that the
    bonds share is not an event; only the wrapper''s excess move is. The symmetric case (ETF bid up above what the
    bonds justify, e.g. by inflows chasing a rally) should reverse too.'
  why_not_arbitraged: Arbitrage requires redeeming the ETF and selling or warehousing hundreds of illiquid bonds,
    with dealer balance-sheet costs that rise exactly when gaps open (stress), and the bond NAV itself is an evaluated
    (partly stale) price, so the true gap is uncertain. The capacity is limited and the trade is lumpy, so large
    arbitrageurs do not fully close gaps inside the redemption-cost band.
signal:
  description: 'Inputs: daily total returns of HYG, JNK, LQD (sharadar_sfp, close-to-close = ret_oc of day d plus
    ret_co of day d), and from fred_macro the ICE BofA US High Yield OAS (BAMLH0A0HYM2, for HYG and JNK), the ICE
    BofA US Corporate (IG) OAS (BAMLC0A0CM, for LQD) and the 2-year and 10-year Treasury yields (DGS2, DGS10). FRED
    series have the next_morning clock: at the decision after the close of day t only FRED observations dated t-1
    or earlier are used, so every computation below ends at session t-1. Step 1 (residual): for each credit ETF
    j and each session d <= t-1, the bond-implied return is the fitted value of an OLS regression of j''s daily
    total return on the same-day changes (d minus d-1, in percentage points) of its OAS, DGS2 and DGS10 plus an
    intercept, estimated on the 252 sessions ending at d-1 (no same-day information in the coefficients; need at
    least 200 valid sessions, else no signal). Residual e_j(d) = actual return minus fitted return. Days where any
    input is missing (FRED holidays) are skipped in the regression and their residual is not computed; changes are
    taken between consecutive valid FRED days. Step 2 (gap): G_j(t) = sum of e_j over the last gap_days valid sessions
    ending at t-1; z_j(t) = G_j(t) / (sqrt(gap_days) * standard deviation of e_j over the 252 sessions ending at
    t-1). Step 3 (event): a discount event for j fires after the close of day t when z_j(t) <= -z_entry and j has
    had no event (either sign) in the previous hold_days sessions; a premium event fires when z_j(t) >= +z_entry
    under the same spacing rule. Events are used in the mechanism test with both signs; the long-only book trades
    only discount events. Step 4 (book, long-only, always invested): core weights SPY 0.60, IEF 0.40, reset to these
    weights at the first session of each month (as the 60/40 benchmark). A discount event in j opens a tilt slot
    in j at the open of t+1 that lasts exactly hold_days sessions (closed at the open of the session after the last
    held one; a new discount event on j can only fire after the slot ends). Each active slot gets weight 0.40 /
    max(2, number of active slots), taken out of IEF (so one active slot = 0.20 in the credit ETF and 0.20 left
    in IEF; two or three active slots take the whole IEF sleeve). SPY stays at 0.60 between monthly resets; weights
    are re-set only when a slot opens or closes or at the month reset. Premium events do not change the book (no
    shorts in a long-only card). Before an instrument has 252 sessions of history it has no events; missing bars
    mean no event and an open slot is held until its scheduled end (if the ETF is not tradable on that day, it is
    closed at the next tradable open). Gross exposure is always 1.0, no leverage.'
  params:
    gap_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
    z_entry:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of day t, credit ETF j (HYG, JNK or LQD) has a gap z-score z_j(t) beyond 2.0 in absolute
    value: its cumulative return over the last 5 sessions ending t-1 differs from the return implied by the same
    days'' changes in its ICE BofA OAS and in 2y and 10y Treasury yields (rolling 252-session regression, fitted
    out of sample) by at least 2 standard deviations, and j had no event in the previous 5 sessions. side = +1 for
    a discount (ETF fell more than its bonds imply: it should outperform), -1 for a premium. SPY, IEF, TLT and SHY
    are never marked, so every event date keeps at least four unmarked peers.'
