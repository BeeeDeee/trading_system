title: Credit-ETF gap to its bond index - tilt the IEF sleeve of a 60/40 book into HYG/JNK/LQD for 5 days after
  the ETF falls well below what its ICE BofA OAS and Treasury yields imply
author_agent: scout
family: etf-premium-arbitrage
