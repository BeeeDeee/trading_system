falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the gap events is below the 95th percentile of the
  time-shifted placebos.'
- 'Mechanism: the gross abnormal return per event is below the round-trip cost of trading the credit ETF.'
- 'Mechanism: the sign of the abnormal return is negative in the latest third of dev (expected decay, K-0052, stated
  as a kill condition) or positive in fewer than two of three thirds.'
- 'Mechanism shape: the descriptive 10-session abnormal return is more than twice the 5-session one, i.e. the effect
  keeps growing like a credit risk-premium drift rather than a gap that closes within days.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors (z_entry 1.5 / 2.5, gap_days 3 / 10) beat the 60/40 benchmark, or
  the book no longer beats it at doubled costs.'
notes: 'Brief fit: short horizon (5 sessions), cross-asset: the signal comes from the bond market (ICE BofA OAS
  and Treasury yields from FRED, i.e. the value of the bonds) and the trade is in exchange-traded wrappers. Family:
  etf-premium-arbitrage, the same mechanism as H-0037 (counted together). Why this is not H-0037 again: H-0037 faded
  the daily price gap between two wrappers of the same basket, which mostly measures noise common to both; its lesson
  says the AP-band story needs price against NAV, which the catalog does not hold. Here the value side is the underlying
  bond index itself (a NAV proxy built from a different market), as that open question asks. Why this is not another
  stress rebound (K-0056, studies 6-7, H-0041): the regression nets out the bond-market move on the same days, so
  a credit selloff the bonds share is not an event; only the wrapper''s excess move is, and premium events (ETF
  too rich, mostly in calm rallies) are tested with the same sign rule. The most likely way the mechanism dies:
  ICE OAS are evaluated, partly stale prices, so much of the measured gap may close by the index catching up to
  the ETF (the ETF leads), not by the ETF price reverting; the event study measures the ETF''s own forward return,
  so that case fails the placebo test, which is the informative answer. Timing: FRED has the next_morning clock,
  so the gap window ends at t-1 and entry is at the open of t+1; a day of reversion is lost by construction. ICE
  index pricing is earlier in the day than the 16:00 ETF close, which adds noise but no look-ahead. Peers (K-0055):
  SPY, IEF, TLT, SHY are never marked; TLT and SHY are in the universe only as peers and are never traded by the
  book. Strategy design follows K-0005 and K-0027: an always-invested 60/40 core with a tilt only inside events,
  so average exposure equals the benchmark''s and the window''s Sharpe is not the ceiling; the long-only book can
  only use discount events. Rough expectation: 3 credit ETFs, roughly a few hundred two-sided events on well over
  30 dates over 2003-2020; HYG, JNK and LQD are among the most liquid ETFs (0.7-2.3 bn USD a day), so a round trip
  costs a few bps against a typical 5-session HY ETF move of 1-2 %. Data risk: FRED serves the ICE BofA series under
  licence; if the lab''s copy of BAMLH0A0HYM2 or BAMLC0A0CM does not cover 2003-2020 the Builder must fail loudly
  (K-0010) rather than run on a short window. No mechanism parameters were tuned: 2 standard deviations, 5 sessions
  and a 252-session regression are round defaults.'
