falsification_criteria:
- 'Mechanism: entries into the LOW (side -1) and HIGH (side +1) sets do not beat the 95th percentile of the time-shifted
  placebos at 5 sessions, or gross per entry is below the round-trip cost, or fewer than 2 of 3 dev blocks have
  the predicted sign.'
- 'The latest third of dev (about 2015-09 to 2020-12) has the wrong sign: decay or a gone effect (K-0060), even
  if the pooled test passes.'
- 'Horizon shape: the abnormal return is about zero or wrong-signed at 1 and 3 sessions and keeps growing to 10
  sessions; that is a slow volatility or momentum style drift, not a release-time resolution of disagreement.'
- Net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills not above zero.
- Neighbors of num_leaves 8 or tail 0.2 fail the G2 share or median-ratio checks.
- 'A ridge (framework ridge) on the same six features, the same window rows, label and refit schedule gives LOW/HIGH
  sets with the same or larger gross per entry: the nonlinearity is not what pays and the card reduces to a linear
  disagreement sort.'
- If the LOW set is mostly the top run-up fifth of entrants, the model has rediscovered the pre-release reversal
  of H-0064 (short-term-reversal family), not the Miller conjunction; the card then counts as evidence for that
  family, not this one.
notes: 'Why this is not a near-copy. H-0023 tested the pooled announcement premium (long every predicted announcer)
  and found it inside the placebo cloud; this card claims a sign split within announcers, both sides marked, so
  the placebo mean should be near zero and same-stock placebos (shifted dates) absorb the generic idiosyncratic-volatility
  underperformance: only the concentration at the release can pass. H-0096 trained on all rows with a window flag
  the model probably never used; its lesson asked for a design that trains on window rows only, which this is (it
  still shares the predicted-date rule, so it is filed in earnings-announcement-premium and its trials count with
  H-0008, H-0015, H-0023, H-0068; the Miller mechanism also underlies short-sale-constraint-relief (H-0082), and
  the Chair may prefer to count it there as well). H-0064 sorted on 3-session return before the release; here run-up
  is one input of a conjunction and the last falsification criterion catches a plain rediscovery. H-0102 used 13F
  ownership at the release reaction (after the news), this card trades into the release. 13F ownership, the classic
  constraint proxy, is left out on purpose: it starts in 2013 and would leave about seven dev years and an empty
  first block (K-0145); dollar-volume rank inside LIQ-500 is a weaker but full-period proxy. Why the mechanism event
  is the whole LOW/HIGH set and not the gbm-versus-ridge disagreement design of K-0142: the disagreement subset
  would hold about a third of the entries, and with release-window volatility its placebo bar would sit well above
  the round-trip cost, so a failure could only be read as ''cannot tell'' (K-0034). With the full sets the forecast
  bar is about the cost, so a failure is informative. The ridge baseline stays a falsification criterion; if G1
  can report the ridge sets beside the gbm sets (K-0135), please do. Forecasts, written down in advance (K-0098,
  K-0120, K-0144). Window entrants: LIQ-500 has about 600 names a year, 8-K Item 2.02 coverage misses some firms,
  and the 40-session and feature filters drop more, so about 1500-1900 entrants a year from 2005-09 and scored entries
  from about 2006-2007 (first fit). Entries with tail 0.2: about 600-750 a year, about 8000-10000 over dev, on about
  150-200 entry dates a year (earnings seasons cluster). Round trip for LIQ-500 ranks 200-500 about 11-12 bps (6
  bps half-spread, 5 bps floor). Release-window 5-session volatility about 6-7 % per name, placebo windows about
  4 %, so the placebo bar should sit about 10-12 bps above the placebo mean, near the cost. Gross per entry (side-adjusted):
  the literature ceiling for an extreme disagreement split is of the order of 50 bps per side over a few days in
  all US stocks; in LIQ-500 a quarter of it (about 12 bps) is my central case, which is about the cost, and a tenth
  (about 5 bps) is the pessimistic case, under which the card dies at G1 on cost with a bar below cost: a real negative
  for Miller overpricing at releases in large caps. Book: mean gross about 0.35-0.5 (seasonal clustering hits the
  1.0 cap in peak weeks, K-0125), about 700 slots a year at 0.04. At 12 bps gross per entry the book earns roughly
  nothing net; it needs about 25-30 bps gross per entry (about 2.5 times cost) to reach the 0.5 Sharpe floor against
  T-bills (annual net about 4-5 % on about 6 % volatility). So the card''s own arithmetic says the strategy gate
  passes only if the effect is near the upper half of the literature; the mechanism test is the informative part.
  Beta: the LOW set (high volatility, run-up) has a higher beta than the HIGH set, so in up-markets the raw side-adjusted
  return is biased against the claim (K-0074); same-stock placebos carry the same bias. Predicted-date hit rate
  (anniversary within the 5-session hold) is unmeasured (K-0035); dilution by missed dates biases toward zero, not
  toward a false pass. Period starts 2004-09 so that every G1 block holds events.'
