# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0109
version: 1
title: 'Disagreement resolution at earnings releases (Miller overpricing), learned - LIQ-500 long/short 5-day slots:
  short predicted-release entrants a LightGBM ranks overpriced, long those it ranks clean'
author_agent: scout
family: earnings-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Optimistic holders (retail and trend buyers) who bid a contested stock up into its release and absorb
    the re-pricing when the release resolves the disagreement; on the long side, holders who demand to be paid for
    carrying announcement risk in names where opinions do not diverge.
  why: 'Miller (1977): when investors disagree and pessimists cannot or do not short, the price reflects the optimists''
    valuation and is biased upward. An earnings release is a scheduled public signal that narrows the disagreement,
    so the upward bias of exactly those stocks shrinks around the release. Berkman, Dimitrov, Jain, Koch and Tice
    (2009) find that stocks with high differences of opinion earn lower returns around earnings announcements than
    low-disagreement stocks, more so where shorting is hard, and that constrained high-disagreement stocks run up
    just before the release and fall more after it. Outside that corner the same variables carry the opposite sign:
    announcers with high announcement risk and volume earn a positive announcement premium (Frazzini and Lamont).
    The claim is therefore a cross-section within upcoming announcers, not the pooled premium that H-0023 found
    inside the placebo cloud.'
  why_not_arbitraged: In the overpriced corner the obvious arbitrage is the short sale, which is what the constraint
    limits (borrow supply, recall risk, cost of shorting a stock with a known event and high volatility). Holding
    through a release carries jump risk that market makers and stat-arb books avoid. The effect, if it exists in
    large caps at all, should be small because shorting LIQ-500 stocks is mostly cheap; that is the most likely
    way this card dies.
signal:
  description: 'Decisions after the close of each session t, using data up to that close; trades at the open of
    t+1. (1) Window entrants. For stock j, every past session s with ea_reaction_day = 1 has an anniversary A(s)
    = calendar date of s + 364 days (same weekday a year later). Stock j is a window entrant on decision date t
    if, for some past reaction session s of j, t is the first session whose calendar date is at least A(s) - 5 days
    and that date is still before A(s); and j had no reaction session (ea_reaction_day = 1) in the 40 sessions up
    to and including t (the quarter''s release is not already out); and j is a LIQ-500 member on t with all six
    features present. ea_reaction_day NaN counts as no release. Each anniversary yields at most one entry. (2) Features
    per stock and date, computed for all columns and masked to members of that date (never a column set chosen over
    the whole view, K-0134), each z-scored across the members of that date with the framework helper: (a) idiosyncratic
    volatility = standard deviation over the last 63 sessions of the stock''s daily total return (ret_oc + next
    ret_co, i.e. close to close) minus the equal-weight mean of members that day; (b) abnormal turnover = log of
    the 21-session mean dollar volume over the 252-session mean dollar volume; (c) pre-window run-up = total return
    over the last 21 sessions to the close of t minus the members'' equal-weight mean over the same sessions; (d)
    shortability proxy = log of the 63-session median dollar volume (within LIQ-500 the smaller, less traded names
    are the harder and costlier to borrow); (e) announcement risk = mean absolute value, over the stock''s last
    4 reaction sessions (at least 2 required), of the reaction-session total return (close to close) minus the members''
    equal-weight mean that session; (f) 12-month return skipping the last month = total return from t-252 to t-21
    sessions. (3) Model. Framework walk_forward with model gbm (LightGBM), trained ONLY on window-entrant rows (a
    point-in-time row subset: entry status uses past reaction dates only). Label = total return from the open of
    t+1 to the open of t+6 (horizon 5), ranked across the universe on t by the framework; purge by the framework.
    n_estimators 100, learning_rate 0.05, min_child_samples 200, num_leaves from the grid, other settings framework
    defaults. Expanding window, refit every 63 rows (about once per earnings season). Before the framework''s minimum
    training sample is reached there are no scores and the book is flat. (4) Sets. Each window entrant on t gets
    its out-of-sample score. It is LOW (predicted overpriced) if its score is at or below the `tail` quantile, and
    HIGH if at or above the 1 - `tail` quantile, of all entrant scores issued in the trailing 63 sessions including
    t (point-in-time thresholds, because few names enter on a single day). At least 50 scored entrants in that trailing
    set are required; otherwise no new entries on t. (5) Book. Each LOW entrant opens a short slot and each HIGH
    entrant a long slot at the open of t+1, weight 0.04 of equity each, held for exactly 5 sessions and closed at
    the open of t+6; slots are fixed (no daily re-equalising, no hedge basket). If a new slot would push gross exposure
    above 1.0, all new slots of that day are scaled down equally to fit; existing slots are not touched. A stock
    that leaves LIQ-500 during a hold is closed at the first decision row outside the universe (K-0051). A stock
    already in a slot cannot open a second one. Long and short counts are about equal by construction (same tail
    on both sides), so net exposure stays near zero without a hedge.'
  params:
    num_leaves:
      grid:
      - 4
      - 8
      - 16
      value: 8
    tail:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
mechanism_test:
  event: A window entrant (predicted earnings release within the next 5 calendar days, none in the last 40 sessions)
    enters the LOW set (gbm score in the bottom `tail` of trailing entrant scores; side -1) or the HIGH set (top
    `tail`; side +1) at decision date t.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - idiosyncratic volatility over 63 sessions (dispersion of opinion; Berkman et al. use return volatility as a
    proxy)
  - abnormal turnover, 21-session over 252-session mean dollar volume (trading on divergent opinions)
  - pre-window 21-session excess run-up (optimists bidding the price into the release)
  - 'log 63-session median dollar volume (shortability within LIQ-500: smaller, less traded names are harder to
    borrow)'
  - announcement risk, mean absolute excess reaction of the last 4 releases (the risk the announcement premium pays
    for)
  - 12-month return skipping the last month (longer-horizon optimism already in the price)
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The Miller corner is a conjunction: wide disagreement (high idiosyncratic volatility and abnormal
    turnover) AND a binding constraint (the less liquid names of LIQ-500) AND a run-up in which optimists have already
    bid the price into the release. Only there should the release lower the price. Elsewhere the same variables
    carry the opposite sign: high volatility and high announcement risk earn the positive announcement premium,
    and run-up alone carries the pre-release reversal of H-0064. A ridge on the six z-scores can only add main effects,
    so it averages a negative corner and positive surroundings into flat or wrong slopes. A tree with 8 leaves can
    split volatility by liquidity by run-up and isolate the corner. Who pays: the optimistic holders of contested
    stocks (short side) and the holders who need compensation for announcement risk in uncontested names (long side).
    If a ridge on the same window rows ranks as well, the effect is a linear disagreement sort and the nonlinearity
    claim is false.'
