references:
- cite: Miller (1977) Risk, uncertainty, and divergence of opinion, Journal of Finance
  year: 1977
- cite: 'Berkman, Dimitrov, Jain, Koch, Tice (2009) Sell on the news: Differences of opinion, short-sales constraints,
