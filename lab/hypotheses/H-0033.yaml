falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return after positive release-session reactions does not exceed
  the 95th percentile of the time-shifted placebos, or is below the round-trip cost, or has the wrong sign in two
  of three sub-periods. That would mean the long side alone carries no drift and the H-0028 pass lived in the negative
  side.'
- 'Mechanism: the latest third of the event sample (by date) has a non-positive abnormal return. Treat this as decay
  even if the pooled test passes.'
- 'Strategy: net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or
  below zero.'
- 'Strategy: under 75 % of the neighbours of (z_threshold 2.0, hold_days 5, max_name_weight 0.04) beat SPY_TR, or
  the book fails to beat the benchmark at doubled costs.'
- 'Strategy: the book does not beat 95 % of random-entry books with the same turnover. In that case the cap-weighted
  core, not the tilt, explains any margin over SPY.'
notes: 'Brief fit: short horizon (5-session slots), US single stocks, cross-sectional event selection in LIQ-500,
  with a mechanism test. Family: this is honestly the 4th trial of post-earnings-announcement-drift (H-0024, H-0028,
  H-0031). It is not a retune of H-0028. The z threshold and hold are set to round values, not taken from H-0028.
  The changes answer the open questions the Librarian recorded for H-0028 and K-0042/K-0027: (1) Positive side only,
  tested on its own in the mechanism test. The lab does not know which side carried H-0028''s pass, so this test
  is informative whichever way it goes. (2) No shorts and no equal-weight hedge basket. Those remove squeeze risk
  and hedge turnover, the leading suspects for the book gap. (3) Fixed slot weights with no re-equalisation (as
  H-0031 had), but on an always-invested cap-weighted core, so there is no cash drag and no part-time exposure (K-0027).
  (4) The cap-weighted core tracks the SPY_TR benchmark closely. The gates then mainly judge the tilt, not an equal-weight
  or low-beta style bet (the confound flagged in H-0025). The random-entry check in G2 is the control for the core.
  Book gross estimate, as K-0042 asks (assumptions, not data): about 250-350 positive events a year with z >= 2
  in LIQ-500, at an average slot weight near 3.5 % (the budget binds in peak weeks). That gives roughly 10 NAV of
  slot entries a year. At an assumed +0.4 % 5-session abnormal return, gross is about +4 %/yr. Cost: each slot trades
  its weight 4 times (stock in and out, plus the offsetting core scaling) at 3-6 bps half-spread, about 1.5-2 %/yr.
  Net is about +2 %/yr at a tracking error near 4 %. The break-even abnormal return is about 0.2 %, and passing
  costs x2 needs about 0.4 %. So the most likely death is an effect that is real but too small for the long side
  alone. Feasibility (K-0032): every event subject is a LIQ-500 member on its reaction session, as in H-0028, which
  used the same 8-K flag in LIQ-500. sf1_arq_marketcap is frozen at filing dates. The text above says how to roll
  it forward with total returns. If the column name differs in the loader, the Builder should use the SF1 market-cap
  column of the ARQ dimension and say so. The period starts 2004-09 so that the 63-session sigma has warmed up by
  the time 8-K coverage begins. Events exist from about 2004-12. Decision timing: everything uses data up to the
  close of t (the reaction session is known at its close, per the catalog). Trades happen at the open of t+1. The
  sec_8k dataset misses some firms (K-0035). Those firms only sit in the core.'
