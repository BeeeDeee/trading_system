id: H-0033
version: 1
title: Positive earnings-reaction tilt on a cap-weighted core - LIQ-500 long-only, overweight stocks after a large
  positive 8-K release-session reaction for 5 days, no shorts, no hedge basket
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders who sell into good news too early (disposition-driven selling of winners, investors anchored
    on the pre-release price) and slow-moving institutions whose staged buying supplies the drift. Also passive
    and benchmark-constrained managers who cannot move weights on news within days.
  why: 'The market''s own release-session reaction is a price-revealed earnings surprise. After a large positive
    surprise, prices keep moving in the same direction for several sessions because (a) investors anchor on their
    prior view and update slowly (conservatism, limited attention), and (b) institutions that decide to add the
    stock build the position over days to limit price impact, so their buying arrives after the release session.
    The lab already saw this in K-0043: H-0028''s same-direction drift after large release-session reactions cleared
    the placebo test by a wide margin, covered cost and was positive in every third, mostly in the first sessions.
    But both long/short books (H-0028, H-0031) lost to T-bills, and the suspects named in K-0042 are all short-side
    or hedge effects: squeezes on names that just fell several deviations, hedge-basket turnover, and per-name weights
    that swing as release counts change. This card keeps only the long side, as a bounded overweight on a cap-weighted,
    always-invested core that tracks the benchmark. So the test is whether the positive side alone carries an exploitable
    drift.'
  why_not_arbitraged: In large caps the per-event effect is small next to post-release idiosyncratic volatility.
    It can only be harvested with many bets at once, and those cluster in earnings seasons. Long/short harvesting
    runs into short squeezes and hedge costs (the lab's own two failed books). Long-only managers with tracking-error
    budgets can only tilt modestly, and quant capital that trades it competes away the first sessions. The remaining
    drift is plausibly just above the cost of a long-only overweight.
signal:
  description: 'Data: sharadar_sep total returns ret_co (previous close to open) and ret_oc (open to close), tradable
    flag; sec_8k_item202 ea_reaction_day; sharadar_sf1 sf1_arq_marketcap (market cap frozen at the filing date).
    Universe: point-in-time LIQ-500 members, tradable on the day. (1) Daily close-to-close return r[t,j] = (1+ret_co[t,j])*(1+ret_oc[t,j])
    - 1. Abnormal return a[t,j] = r[t,j] minus the equal-weight mean of r over LIQ-500 members tradable on t (excluding
    j). sigma[t,j] = standard deviation of a[t-63..t-1, j] (at least 40 valid observations, else no event). (2)
    Event: after the close of session t, if ea_reaction_day[t,j] == 1 and a[t,j] / sigma[t,j] >= z_threshold, stock
    j has a positive reaction event (NaN in ea_reaction_day = no event). Negative reactions are ignored (no underweight,
    no short). (3) Core: cap-weighted LIQ-500. Cap estimate cap[t,j] = sf1_arq_marketcap at the last day its value
    changed (the filing anchor) times the total-return growth of j from that anchor day to t (the product of (1+r)
    over the sessions after the anchor). That way the estimate drifts with the price like a buy-and-hold weight,
    and holding cap weights causes no daily drift trading. Members with no marketcap value (NaN or stale per the
    loader) get no core weight. Core weights c[t,j] = cap[t,j] / sum of cap over members with a value. (4) Tilt
    slots: a positive event detected after the close of t is entered at the open of t+1 with a fixed tilt weight
    s = min(max_name_weight, (B_max - B_used) / n_new), where B_max = 0.50 is a fixed budget, B_used = the sum of
    tilt weights of slots still open and n_new = the number of new events detected that evening. If the budget is
    full, s = 0 (the event is skipped). The slot keeps weight s (no re-equalisation) and is closed at the open of
    session t+1+hold_days, i.e. after hold_days sessions. A new event on a stock with an open slot does not add
    a second slot (the old slot runs to its exit). If a slot''s stock leaves the universe or stops trading, that
    slot is closed at the next open. (5) Target weight of stock j on day t+1: w = (1 - B_used_after_today) * c[t,j]
    + (sum of open tilt slots on j). Long-only, gross = 1, always invested. Trades happen daily at the open, only
    when slots open or close (plus the matching pro-rata scaling of the core) and when universe membership changes.
    Missing data: a stock without enough return history gets no event. A stock with no 8-K coverage simply never
    gets a tilt but stays in the core. Missing input datasets must raise, not silently produce an empty tilt (K-0010).'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    max_name_weight:
      grid:
      - 0.02
      - 0.04
      - 0.06
      value: 0.04
    z_threshold:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'LIQ-500 member j has its 8-K Item 2.02 reaction session on day t (ea_reaction_day == 1), and its close-to-close
    return that day minus the equal-weight universe mean is at least 2.0 times the standard deviation of its daily
    abnormal returns over the previous 63 sessions (a large positive price-revealed earnings surprise). side = +1
    (j should outperform the other members afterwards). Positive reactions only: negative reactions are not events,
    because this card trades only the long side.'
  horizons:
