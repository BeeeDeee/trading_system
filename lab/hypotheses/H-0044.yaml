falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the currency ETFs from the open of T-4 to the close of T is not
  above the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the signed abnormal return in the latest third of dev (after the 2015 fix-window reform and the publication)
  is zero or negative.'
- 'Mechanism: the signed move at the 3-session horizon (to the close of T-2) is as large as or larger than at the
  5-session horizon (to the close of T, the fix day): then the move is not concentrated into the month-end fix and
  the hedge-flow story is not supported (generic drift or currency momentum instead).'
- 'Strategy: net Sharpe on dev below 0.5 or below T-bill + 0.10, or not above T-bill at doubled costs.'
- 'Strategy: the neighbors entry_lead 3 and 5 do not beat T-bill.'
notes: 'Brief: short horizon, cross-asset. The signal is computed from equity markets (SPY and six country ETFs),
  the trade is in currencies (CurrencyShares ETFs), the hold is 5 sessions. Family: reused rebalancing-flow-pressure
  (H-0002, SPY vs IEF month-end 60/40 rebalancing) because the economic mechanism is the same class, mandated month-end
  rebalancing by price-insensitive institutions; this card answers H-0002''s open question (''does the pressure
  exist at all, on higher-impact instruments?'') with the best documented month-end rebalancing flow, FX hedge re-sets
  at the London fix, where the flow is large relative to the instrument and its sign is computable from public prices.
  It differs from H-0002 in market (FX, not stock/bond), in the flow (hedge ratio re-sets, not asset-mix rebalancing)
  and in having a per-currency signal with a cross-section of six. Not lead-lag (study mrel): the claim is a dated
  flow at one point of the month, not a daily leading relationship; the event study against time-shifted placebos
  (same currencies, other dates) separates the two. Event study peers: K-0055 says the judge needs at least three
  unmarked peers per date; every currency is marked every month, so SHY, SHV and BIL are in the universe only as
  unmarked near-cash peers. This makes the abnormal return the currency''s move against the dollar, which is what
  the mechanism predicts (the dominant part of the flow is dollar selling or buying, common to all currencies).
  If the judge''s peer set also included marked instruments, the common dollar component would be netted out; the
  Builder should check that only unmarked instruments are peers. Expected size (K-0053): month-end hedge flows are
  reported to move major currencies by tens of basis points into the fix in large-signal months and much less in
  quiet months; my expectation for the pooled signed move over the window is roughly 10-25 bps against an ETF round
  trip of perhaps 5-20 bps depending on the cost tier of each currency ETF (FXE and FXY are the most liquid, FXF
  and FXC the least). So the cost check may bind; a gross near cost should be read as untradable, not as promise.
  Exposure: 5 of about 21 sessions a month at gross 1, about 24 % (entry_lead 3 gives about 19 %). The book is flat
  between windows, so its Sharpe is capped by the window''s own (K-0027); the absolute bar of 0.5 is a real risk
  even if the mechanism passes. Known limits: the effect is documented intraday around the 4 p.m. London fix (11:00
  New York); the engine trades at US opens, so the window captures the run-up to the fix and the fix-day close,
  and includes any post-fix reversal on the afternoon of T and overnight to the exit open. The local-currency equity
  return mechanically contains the month-to-date currency move, so part of the signal is within-month currency momentum;
  the horizon-3 versus horizon-5 criterion is the check that the move sits at the fix. Equal flow weights per unit
  of equity return for the US leg and the foreign leg are a simplification (hedged holdings differ by country).
  UK or US holidays can make the last London business day differ from T in rare months. Data: currency ETFs start
  2005-12 to 2007-02 and BIL 2007-05, hence the 2007-06 start; dev runs to 2020-12 (about 160 month-ends, about
  960 events on about 160 dates). No date literals or episodes in the rule.'
