mechanism_test:
  event: After the close of session T-5 (T = last XNYS session of the calendar month), every currency ETF j with
    a valid signal is an event with side +1 if D_j > 0 (US equities outperformed home market j in local currency
    month to date, so hedgers sell dollars for currency j into the fix) and side -1 if D_j < 0. The three T-bill
    ETFs (SHY, SHV, BIL) are never marked, so the abnormal return is the currency ETF's move against the dollar
    from the open of T-4 to the close of T (net of the T-bill peers).
