mechanism:
  counterparty: 'The hedgers themselves: benchmark-bound, price-insensitive programs that must transact at (or close
    to) the month-end fix to keep tracking error to their hedged benchmark at zero. Their order size is predictable
    from public equity prices days in advance, and they pay the price concession to dealers and to anyone positioned
    ahead of the flow.'
  why: 'International equity investors with currency-hedged mandates (pension funds, insurers, hedged share classes,
    currency-overlay managers) hedge a fixed share of the value of their foreign equity holdings and, by convention,
    re-set the hedge only once a month, at the last WM/Reuters 4 p.m. London fix of the month. The size and sign
    of the re-hedge is a mechanical function of how the hedged equity markets moved during the month, measured in
    the currency of the holdings. If US equities rose during the month, foreign holders of hedged US equities must
    sell more dollars forward; if the equities of country j rose in local currency, holders of hedged country-j
    equities must sell more of currency j. So for each currency j the month-end flow is roughly proportional to
    D_j = (US equity month-to-date return) - (country-j equity month-to-date return in local currency): D_j > 0
    means net dollar selling against currency j into the fix, so currency j should appreciate against the dollar
    over the last sessions of the month; D_j < 0 the opposite. Melvin and Prins (2015) document exactly this: equity
    appreciation over the month predicts depreciation of that market''s currency before the month-end fix. The signal
    comes from equity markets, the trade is in currencies.'
  why_not_arbitraged: Dealers do pre-position (that is part of how the move shows up before the fix), but the flow
    size is only estimated (bank month-end models have a mixed hit rate), a few-day currency position carries volatility
    several times the expected gain, and balance-sheet capacity for warehousing month-end risk is limited. The hedgers
    cannot move away from the fix without tracking error against benchmarks that are priced at the fix. The 2015
    widening of the fix window after the FX-benchmark investigations may have spread or reduced the effect, which
    is why the latest third of dev is a declared kill condition.
signal:
  description: 'Calendar: T = the last XNYS session of each calendar month, determined from the exchange calendar
    (weekdays minus NYSE holidays, known in advance), never inferred from future rows of the data. Decision date
    d = T - (entry_lead + 1) sessions, i.e. with entry_lead = 4 the decision is after the close of T-5. Inputs (sharadar_sfp
    total returns from ret_co and ret_oc): US equity = SPY; home equity markets by currency: FXE <- EZU, FXY <-
    EWJ, FXB <- EWU, FXA <- EWA, FXC <- EWC, FXF <- EWL. Month-to-date window = from the close of the last session
    of the previous month to the close of d. For each currency j: R_US = mtd total return of SPY; R_j_usd = mtd
    total return of the country ETF; F_j = mtd total return of the currency ETF; local-currency return R_j_loc =
    (1 + R_j_usd) / (1 + F_j) - 1; signal D_j = R_US - R_j_loc. Weights: w_j = D_j / sum_k |D_k| over the currencies
    with a valid signal (gross exposure 1; positive weight = long the currency ETF, i.e. long the foreign currency
    against the dollar; negative = short it). Trade at the open of d + 1 (= T - entry_lead), hold unchanged, close
    all positions at the open of T + 1 (first session of the next month). Flat (zero weights) on all other days.
    SHY, SHV and BIL are never traded: they are in the universe only as unmarked T-bill peers for the event study
    (see mechanism_test and notes). Missing data: a currency is skipped for the month if its currency ETF, its country
    ETF or SPY lacks a price at the previous month-end close or at d, or is not tradable at d + 1; if fewer than
    3 currencies remain the book stays flat that month. Instruments that are not yet listed are skipped the same
    way.'
  params:
