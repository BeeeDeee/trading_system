falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of bystanders at 5 sessions is not above the 95th percentile of
  the time-shifted placebos, or its gross per event is below the round-trip cost of the ETFs traded.'
- 'Mechanism: the latest third of dev (roughly 2015-2020, when managed-futures assets were largest) has a side-adjusted
  mean at or below zero; a deleveraging flow should not be weakest when the trend-following industry is biggest.'
- 'Mechanism (reading of the horizons): if the abnormal return at 1 session is already at least as large as at 5
  and 10 sessions, the effect is a one-day reversal, not a multi-day de-risking flow; if it keeps growing steadily
  to 10 sessions like the placebo, it is a trend-regime change (information), not a temporary concession.'
- 'Strategy: net Sharpe on dev below 0.5, or the one-sided bootstrap bound of the Sharpe difference against T-bills
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (trend_lookback_days 84/189, shock_k 1.0/1.5 and their combinations)
  beat the T-bill bar, or the book loses its edge at doubled costs.'
- 'Concentration: more than 60 % of the log return comes from one third of dev (e.g. a single crisis year).'
notes: 'Brief fit: short holding (5 sessions), cross-asset in the strict sense: the trigger is the loss of a trend
  book driven by other markets, and only the markets that did not lose are traded, so the event is not the traded
  ETF''s own price move. What is new against the registry: no card has used trend-follower positioning. H-0050 (vol-control
  re-leveraging, rebalancing-flow-pressure) tilted SPY/IEF on a vol-window roll-off and its lesson forbids refiling
  that SPY/IEF design; this card uses a different institution (CTAs, trend-signed positions in both directions),
  a loss trigger, and a cross-section of 18 ETFs in four sectors with both sides marked (K-0063 calls both-sided
  marking the cleaner test). It is also the opposite sign of the stress-rebound family (K-0084): a bystander equity
  ETF in an uptrend is SHORTED after a CTA loss day, so a generic rebound after stress would make this card fail,
  not pass. If the Chair judges risk-rule flows to be one mechanism with rebalancing-flow-pressure, merging the
  family is fine with me. No references on purpose: the specific spillover claim is not a published anomaly that
  I know of; background only (not the source of the claim): Moskowitz, Ooi and Pedersen (2012) on time-series momentum,
  Brunnermeier and Pedersen (2009) on deleveraging spirals, and a 2026 arXiv paper by Kurth, Eisler, Rej and Bouchaud
  arguing that CTA impact sustains trends (which implies the reverse impact when they cut). The judge''s universe
  trades exactly the 18 listed ETFs; SHY was left out because near-cash returns cannot pay a round trip, UNG because
  its roll drift dominates any 5-day effect. Forecasts, pessimistic first (K-0120, K-0181): the replicated book
  is valid from about 2004 (trend + 63-day vol + 252-day standard deviation warm-up on the 2002-2003 ETFs; commodity
  and currency trusts join 2005-2007). About 4100 usable sessions. Shock days at k = 1.25: about 8 % of sessions
  for a fat-tailed daily series standardized by its trailing year, so 250-350 dates (pessimistic 200), clustered
  in trend reversals. Bystanders per shock date: 3-7 of 9-18 eligible ETFs (fewer before 2007), so 800-1800 marked
  events (pessimistic 600); unmarked peers per date at least 5, above the G1 minimum of 3. Mean exposure: union
  of 5-session windows about 25-35 % of sessions at gross 1, so 0.25-0.35; with heavy clustering it could approach
  the 0.20 floor, which is why k is 1.25 and not 1.5. Round trip: about 10 bps for the liquid ETFs (K-0181), up
  to 20-30 bps for the thinner currency trusts and DBA/DBB. Gross per event at 5 sessions: pessimistic 0, central
  12-15 bps, optimistic 30 bps. Expected annual gain of the book (K-0064): about 20-25 cohorts a year; at a 15 bps
  gross edge, net is near zero and the absolute Sharpe floor fails; the book clears 0.5 only if gross is about 30
  bps per event (book vol when invested about 0.6 % a day, about 5 % a year at 0.3 exposure). So the likeliest deaths
  are the cost ratio and, if the flow is real but small, the absolute Sharpe floor; the mechanism verdict is the
  main information: whether a common trend-follower loss moves the markets it did not come from. Expected beta gap
  between marked and peers is small, because sides are mixed (long-trend and short-trend bystanders on the same
  dates) and peers are the same asset classes; bonds were mostly in uptrends in dev, so a bystander bond leg is
  usually short and its drift is absorbed by the same-instrument placebo.'
