mechanism:
  counterparty: The trend followers themselves, who sell (or cover) bystander positions on a schedule set by risk
    rules and allocator drawdown limits rather than by prices; the strategy is the liquidity provider who takes
    the other side of that de-risking and is paid the temporary price concession.
  why: 'Managed-futures funds (CTAs) hold trend-signed, volatility-scaled positions in the same futures markets
    at once and run portfolio-level risk rules: volatility targets on the whole book and drawdown limits set by
    allocators. A day on which their common trend book loses heavily raises the portfolio''s volatility estimate
    and its drawdown, and the rules then cut gross exposure across every market over the next days, including markets
    that did not lose that day. In those bystander markets the cut is a pure flow with no news: CTAs that are long
    the trend sell, CTAs that are short buy back, so prices are pushed against the prevailing trend for a few sessions.
    The signal comes from other markets (the losses that drive the trend book), the trade is in the markets that
    only receive the flow: equity, Treasury, commodity and currency ETFs that track the futures CTAs hold.'
  why_not_arbitraged: The flow is spread over several days and many markets, is triggered by a portfolio state that
    outsiders must replicate, and arrives on stressful, high-volatility days when liquidity providers are themselves
    de-risking; the concession is small per market, so it is not worth a dedicated desk, and standing against trends
    after a CTA loss day carries the risk that the trend reversal is informational and keeps going.
signal:
  description: 'Data: daily total returns r[j,d] (close-to-close, built from ret_co and ret_oc) of the 18 ETFs,
    grouped in four sectors: equity {SPY, IWM, EFA, EEM, EWJ}, bonds {IEF, TLT}, commodities {GLD, SLV, USO, DBA,
    DBB}, currencies {FXE, FXY, FXB, FXA, FXC, FXF}. Instrument j is eligible on day t if it has a valid bar on
    t and on t-1, at least L+1 valid daily returns up to t-1 and at least 50 valid returns in the 63 sessions ending
    t-1 (ETFs not yet listed are simply not eligible). Per instrument and day: trend sign s[j,d] = sign of the cumulative
    total return over the L sessions ending at the close of d (exactly zero = not eligible); volatility sig[j,d]
    = standard deviation of daily returns over the 63 sessions ending at d. Replicated trend book (what CTAs held
    into day t): u[j,t] = s[j,t-1] * r[j,t] / sig[j,t-1] for each eligible j; average u within each sector over
    its eligible members, then P[t] = mean of the sector averages over the sectors with at least one eligible member.
    P[t] is computed only if at least 6 instruments in at least 3 sectors are eligible, otherwise it is missing.
    z[t] = P[t] / standard deviation of P over the 252 sessions t-252..t-1 (at least 200 valid values, else missing).
    Shock day: z[t] <= -k. Bystanders of a shock day t: eligible instruments with s[j,t-1] * r[j,t] >= 0 (their
    own trend position did not lose on day t). Side of a bystander = -s[j,t-1] (against its trend). Instruments
    that lost on day t (the drivers) are never traded. Book: every shock day t with at least one bystander opens
    a cohort with weights -s[j,t-1] / n_t on its n_t bystanders (gross 1 per cohort, equal weights, no volatility
    scaling). Decisions after the close of t with data up to that close; the cohort is entered at the open of t+1
    and closed at the open of t+6 (5 sessions). On each session the book is the plain average of the weight vectors
    of all active cohorts (m active cohorts -> each counts 1/m), so gross <= 1 and an instrument in two cohorts
    with the same side simply adds up. Sessions with no active cohort are in cash. An instrument with no tradable
    bar on a session has weight 0 that session (no re-normalisation). Hold is fixed at 5 sessions (not a parameter).'
  params:
    shock_k:
      grid:
      - 1.0
      - 1.25
      - 1.5
      value: 1.25
    trend_lookback_days:
      grid:
      - 84
      - 126
      - 189
      value: 126
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of day t, the replicated sector-balanced trend book of the 18 ETFs (trend sign over trend_lookback_days
    sessions, positions scaled by 63-day volatility) has a daily return of at most -shock_k times its trailing 252-session
    standard deviation, and ETF j is a bystander: its own trend position did not lose on day t (s[j,t-1] * r[j,t]
    >= 0). mask[t,j] = True for every bystander of a shock day; side[t,j] = -s[j,t-1] (the mechanism says j moves
    against its prevailing trend afterwards). Drivers (eligible ETFs whose trend position lost on day t) and non-shock
    days are unmarked and serve as peers.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
