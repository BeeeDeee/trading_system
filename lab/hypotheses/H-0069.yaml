version: 1
title: Retail opening-auction attention premium - LIQ-500 market-neutral, short both extreme up- and down-movers
  at the next open, hedged with the most liquid members, hold 1 session
author_agent: scout
family: retail-attention-opening-pressure
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Retail investors who buy attention-grabbing stocks with market or market-on-open orders after a
    big move (including contrarian retail buying after big drops) and pay an opening price above the intraday level;
    the strategy sells to them at the open.
  why: 'Individual investors are net buyers of attention-grabbing stocks, whatever the direction of the move that
    drew their attention (Barber and Odean 2008): they cannot short, so attention turns into buy orders. They submit
    those orders mostly overnight and outside trading hours, so the orders arrive together as market or marketable
    orders at the next open. The resulting buy imbalance at the opening auction pushes the opening price above where
    the stock trades later in the day, and the price falls back during the session as institutional liquidity takes
    over (Berkman, Koch, Tuttle and Zhang 2012: high overnight return followed by an intraday reversal, concentrated
    in stocks that recently drew retail attention). The claim here is that the inflated open after an extreme, stock-specific
    move exists in the most liquid US stocks, is larger than the round-trip cost, and is the same sign after extreme
    up-moves and after extreme down-moves. That last part separates it from short-term reversal (which predicts
    opposite signs for winners and losers) and from earnings-reaction drift (same sign as the move): both cancel
    in a book that shorts both sides, an attention-driven opening premium does not.'
  why_not_arbitraged: Providing liquidity at the open of a stock that just moved several sigma means short inventory
    in a stock with elevated volatility and news risk, overnight and intraday; the premium is a few tenths of the
    daily volatility, so it pays only with many small, diversified positions and low costs. Market makers and wholesalers
    who internalize retail flow capture part of it, which is why it is expected to be smaller in large caps than
    in the all-stock samples of the literature, and why it may sit close to cost.
signal:
  description: 'Universe: the point-in-time LIQ-500 members on each date. Inputs from sharadar_sep: ret_co and ret_oc
    (total-return components), tradable, and the liquidity rank liq_rank. Daily total return of stock j on day t:
    r[j,t] = (1 + ret_co[j,t]) * (1 + ret_oc[j,t]) - 1 (close t-1 to close t). Decision after the close of day t,
    using data up to that close only: (1) For each member j that is tradable at t, sigma[j,t] = standard deviation
    of r[j,.] over the lookback_days sessions t-lookback_days .. t-1 (day t itself excluded); require at least two
    thirds of those sessions with a valid return, otherwise j cannot be an event on day t. (2) m[t] = cross-sectional
    median of r[j,t] over all members with a valid return on day t. (3) z[j,t] = (r[j,t] - m[t]) / sigma[j,t]. (4)
    Event: |z[j,t]| >= k_sigma. Up-moves and down-moves are both events, with the same side: short. (5) Short leg:
    rank the events of day t by |z| descending and keep at most 20; each kept event gets weight -0.025 (so the short
    leg is at most 0.50 of equity). (6) Hedge: long, equal weights, in the 100 members with the best liq_rank on
    day t that are not events on day t and are tradable, total long weight equal to the absolute total short weight
    (dollar-neutral, gross at most 1.0). If day t has no event, the book is flat (cash) for the next session. (7)
    Execution: all target weights are traded at the open of day t+1 and held until the open of day t+2, when the
    weights computed after the close of t+1 replace them (a stock that is an event again keeps its short; every
    other short is covered). Holding is therefore one session (open to open). Missing data: a stock without a valid
    return on t, without enough history, not tradable, or not a member on t is neither an event nor a hedge name.
    A position whose stock leaves the universe is closed at the next decision, which with a one-session hold is
    the scheduled exit anyway.'
  params:
    k_sigma:
      grid:
      - 2.5
      - 3.0
      - 3.5
      value: 3.0
    lookback_days:
      grid:
      - 40
      - 60
      - 90
      value: 60
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of day t, a LIQ-500 member''s close-to-close total return minus the cross-sectional median
    return of the day is at least k_sigma (3.0) times its own daily return standard deviation over the previous
    60 sessions, in either direction (an attention-grabbing stock-specific move). Side = -1 for every event, up-moves
    and down-moves alike: the mechanism says the stock''s next opening price is inflated by retail buy orders, so
    it should underperform the other members from the next open to the close.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 1
