falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the events from the next open to the close (horizon 1) is not
  above the 95th percentile of the time-shifted placebos.'
- 'Mechanism: gross abnormal return per event at horizon 1 is below the round-trip cost of the event stocks.'
- 'Mechanism: the latest third of the dev period has a negative side-adjusted abnormal return at horizon 1 (decay
  or regime change, K-0060).'
- 'Mechanism shape: the descriptive horizon-2 abnormal return is less than half of the horizon-1 value, i.e. the
  next overnight gives the intraday gain back; then the open-to-open book cannot keep the effect and a strategy
  failure is expected for that reason.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference to T-bills not above zero.'
- 'Strategy: at doubled costs the net Sharpe no longer beats T-bills (G2 cost stress).'
- 'Robustness: fewer than 75 % of the neighbours (k_sigma 2.5 / 3.5, lookback_days 40 / 90) beat T-bills.'
notes: 'Why this is not a refiling. Short-term reversal (study 5, H-0007, H-0030, H-0064) predicts that up-movers
  fall and down-movers rise; earnings-reaction drift (H-0028/H-0031/H-0033) predicts both continue. This card shorts
  both sides, so a pure reversal or a pure drift effect nets to about zero in the pooled event study and only a
  sign-independent effect (an inflated open after any attention-grabbing move) can pass. It is also the opposite
  claim to the visibility premium (H-0014, H-0067: attention raises returns over weeks); here attention creates
  a temporary overpricing at the open that is gone by the close. The trigger is a standardized price move, not volume,
  so it is not another abnormal-volume card. I chose a new family because the mechanism (liquidity provision against
  retail opening order imbalance) is neither reversal nor a visibility premium; if the Chair counts it under short-term-reversal
  or high-volume-visibility-premium I accept that. Why horizon 1 and a one-session hold. The judge measures from
  the next open to the close of t+h, so h = 1 is exactly the trading-day reversal the literature describes. The
  engine cannot exit at the close, so the book also carries the next overnight (where an attention premium could
  partly reappear); horizon 2 is reported so the give-back can be seen, and a falsification criterion names it.
  Expected size against cost (K-0053, K-0083). Literature: for the 3,000 largest US stocks 1996-2008 the generic
  pattern is about +10 bps overnight and -7 bps intraday per day (cancelled here by subtracting the same-day mean
  of the other members); in high-attention, low-institutional-ownership subsamples the intraday reversal is -20
  to -40 bps. In LIQ-500 I expect 10-20 bps per event at horizon 1 against a round trip of 6 bps (rank <= 200) to
  12 bps (rank 201-500), so the cost check is a real risk; events lean to ranks 201-500. Event rate: |z| >= 3 hits
  roughly 1.5-2 % of members a day, about 7-10 events a day, tens of thousands of events on almost every session,
  so power is not the issue (the placebo bar should sit below cost, K-0034), and a failure will mean the effect
  is absent or too small in large caps. Book estimate: about 2,000 events a year at 2.5 % each, mean gross exposure
  about 35-45 %. If the open-to-open gross is 15 bps and the cost 9 bps per event, the short leg earns about 50
  x 6 bps = 3 %/yr over cash with a daily volatility near 0.25 %, a Sharpe near 0.7-0.8; at 12 bps gross it is about
  zero, and doubled costs would most likely make it negative. So the most likely deaths are the cost ratio at G1
  or the cost stress at G2; I state that up front. Confounds. Beta: event stocks tend to have higher beta than the
  hedge (top-100 liquidity); intraday market drift is small historically, so the horizon-1 test is little affected
  (K-0074), but the dollar-neutral book is slightly net short beta overnight. Stock identity: standardizing by each
  stock''s own volatility spreads events across many stocks, so the same-stock placebo should not inherit a high-volatility
  intraday drift. Borrow costs are not modelled; LIQ-500 names are mostly easy to borrow, but some attention stocks
  after big moves (notably in 2020) were not. The Sharadar open is taken as the opening auction price; a short sold
  into the auction gets that price, and the engine still charges the half-spread tier. Retail activity was high
  early in the sample and again in 2020, so the latest third is not expected to be empty of the effect; a negative
  latest third is a declared kill condition. No date literals, no named stocks, no use of hindsight about specific
  episodes in the rule.'
