falsification_criteria:
- 'Mechanism: the 60-session side-adjusted TIPS-minus-IEF return after event weeks is not above the 95th percentile
  of the time-shifted placebos, or keeps its sign in fewer than 2 of 3 dev blocks, or gross per event is below the
  round-trip cost.'
- 'Mechanism (side split, reported by the Builder from diagnostic output): the cheap side alone (z <= -1, long TIPS)
  has a non-positive 60-session average; then the liquidity-premium reading is wrong whatever the pooled result.'
- The latest third of dev events has the wrong sign (decay by default, K-0060).
- Net Sharpe on dev below 0.5 (T-bill benchmark), or the stationary-bootstrap bound of the Sharpe difference is
  not above zero.
- Fewer than 75 % of the grid neighbors of (lookback_days 756, hold_weeks 52) beat the T-bill bar, or the median
  neighbor Sharpe is below 0.7 of the primary.
- More than 60 % of the dev log return comes from one third of the period (one crisis episode, not a mechanism).
- Post-2011 Sharpe excess below half of the pre-2011 excess (publication decay of the cited paper).
- Net Sharpe at 2x costs below the bar.
notes: 'Brief fit: the brief asks for a long hold (6-24 months) and a cross-asset signal. Here the signal comes
  from the inflation-compensation market as a FRED macro series and is traded in ETFs, but both legs are Treasuries,
  so it is the closest fit rather than a pure cross-asset card: the lab''s cross-asset monthly cards (K-0228: bond
  momentum into equities, yields into currencies, dollar cycle into EM, default spread into SPY) died on the placebo,
  often because the target was a beta or carry carrier. Trading TIPS against a duration-matched nominal ETF removes
  market beta and most rate direction by construction (TIP and IEF have similar duration), so the event study''s
  raw peer comparison (K-0074) measures the breakeven move and the inflation accrual, which is the claim. Novelty
  vs the registry: H-0129 used daily breakeven shocks to sort stocks for 5 days; H-0183/H-0184 timed duration with
  the curve slope and auction supply; study 3 compared passive bond types unconditionally. No card has traded TIPS
  against nominals on the breakeven level. Forecasts (K-0120): weekly decision dates with a valid z run from about
  2006 (756-session warm-up from 2003) to 2020, about 780 weeks; I expect |z| >= 1 on roughly 35-50 % of them, so
  about 270-390 event dates and 450-650 marked events (TIP all, SCHP from 2010). Independent evidence is far smaller:
  a breakeven regime lasts months, so perhaps 6-10 episodes, and the placebo cloud will be wide (K-0026, K-0034).
  Round trip: TIP and IEF are liquid tier ETFs, a few bps per side; gross at 60 sessions should be tens of bps if
  the claim holds. Book arithmetic (K-0064, K-0098): mean gross exposure about the share of active cohorts (0.35-0.5),
  spread vol of TIP minus IEF about 3-5 % a year, so the net Sharpe floor of 0.5 needs an information ratio of the
  active spread near 0.7; that is the most likely strategy death. The 2008-2009 liquidity episode may dominate the
  return (block-concentration kill is pre-registered). The event study sees only the first 60 sessions of a 52-week
  hold. A de-anchoring of inflation expectations would break the mechanism by definition; that is a falsification
  route, not a filter. No dates or episodes are used in the rule; the 1-sd entry level is a round value fixed in
  advance.'
