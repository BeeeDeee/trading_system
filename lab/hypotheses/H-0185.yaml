id: H-0185
version: 1
title: Breakeven-inflation reversion in TIPS vs nominal Treasuries - weekly 52-week cohorts, long TIP/SCHP and short
  IEF when the 5y breakeven sits 1 sd below its 3-year mean, the reverse 1 sd above
author_agent: scout
family: tips-breakeven-reversion
asset_classes:
- us_etf
- macro
universe:
  instruments:
  - TIP
  - SCHP
  - IEF
  kind: instruments
mechanism:
  counterparty: Forced and liquidity-motivated sellers of TIPS in stress (levered funds, mutual funds facing outflows
    after negative CPI accruals, dealers cutting inventory), and investors who extrapolate headline inflation, both
    ways, into medium-term inflation compensation; on the rich side, inflation-hedge buyers chasing a recent CPI
    rise who overpay for protection.
  why: 'The 5-year breakeven (nominal minus TIPS yield, FRED T5YIE) is the market''s inflation compensation plus
    a TIPS liquidity premium. With an inflation-targeting central bank, medium-term expected inflation is anchored,
    so large deviations of the breakeven from its own multi-year norm are mostly transitory components: (a) a liquidity
    premium that spikes when leveraged and constrained holders dump the less liquid TIPS first in stress and dealers
    will not warehouse them, and (b) extrapolation of the current headline CPI, driven by energy prices, into five-year
    inflation. Both revert over months to a year as liquidity returns and headline shocks wash out. When the breakeven
    is far below its norm, TIPS are cheap relative to duration-matched nominals and also carry better (realized
    inflation accrual above the low breakeven); when it is far above, the opposite. Pflueger and Viceira find a
    time-varying TIPS liquidity premium that predicts inflation-indexed bond excess returns; this card tests the
    tradable ETF form at a 6-18 month hold.'
  why_not_arbitraged: The relative-value trade needs balance sheet exactly when the premium is widest (funding stress),
    it can widen further for months before reverting, the TIPS market is a small and less liquid part of the Treasury
    market, and inflation-swap or futures hedges are unavailable to most mandate-constrained holders. Real-money
    investors hold TIPS and nominals in fixed strategic buckets and do not time the spread.
signal:
  description: 'Data: FRED T5YIE (5-year breakeven inflation rate, clock next_morning) and Sharadar SFP total returns
    of TIP, SCHP and IEF. Decisions weekly, after the close of the last trading session of each week (t); orders
    fill at the open of t+1. Point-in-time: on decision day t only T5YIE values dated t-1 or earlier are used (forward-fill
    gaps from holidays with the last valid value). Score: z_t = (BE_{t-1} - mean(BE over the lookback_days sessions
    ending t-1)) / std(BE over the same window); if fewer than 80 % of the window has valid values, z is missing
    and the new cohort is flat. Book: 52-week overlapping cohorts (hold_weeks). At each decision a new cohort is
    formed and the oldest is dropped; each cohort has capital 1/hold_weeks. A cohort formed with z <= -1.0 holds
    +0.5/hold_weeks in the TIPS leg (split equally between TIP and SCHP, TIP alone before SCHP has a price) and
    -0.5/hold_weeks in IEF; a cohort formed with z >= +1.0 holds the mirror (-0.5 TIPS leg, +0.5 IEF, scaled by
    1/hold_weeks); a cohort with -1 < z < 1 is flat (cash). Each cohort keeps its sign and target weights unchanged
    for its whole life (no re-scoring); the book target is the sum of live cohorts, so gross is at most 1 and net
    is zero. Targets are set only at the weekly decision and held to the next one. Before the first z exists (lookback
    warm-up) the book is flat. An instrument without a price on a day carries no weight; if TIP is untradable the
    TIPS leg of that cohort goes to SCHP and vice versa, and if no TIPS leg exists the cohort is flat. The 1-sd
    entry level is fixed, not a parameter.'
  params:
    hold_weeks:
      grid:
      - 26
      - 52
      - 78
      value: 52
    lookback_days:
      grid:
      - 504
      - 756
      - 1008
      value: 756
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At each weekly decision date (last trading session of a week) where the 5-year breakeven (T5YIE through
    the prior session) is at least 1 standard deviation below its trailing 756-session mean, each TIPS ETF with
    a price (TIP, SCHP) is marked with side +1 (TIPS should outperform the nominal Treasury ETF IEF afterwards);
    where it is at least 1 standard deviation above, each is marked with side -1. IEF is never marked and is the
    peer. Weeks with |z| < 1 or without a valid z have no event.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
