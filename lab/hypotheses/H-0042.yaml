- dataset: macro_release_calendar_1d
  description: 'NEW dataset (free, public, daily calendar series, signal only, not tradable), built like treasury_auctions_1d.
    Scheduled US macro announcement days from 1998: (a) CPI release dates and (b) Employment Situation release dates
    (BLS release schedules / FRED-ALFRED release dates API, releases ''Consumer Price Index'' and ''Employment Situation''),
    (c) scheduled FOMC meeting statement days (Federal Reserve FOMC calendars, federalreserve.gov/monetarypolicy/fomc_historical.htm;
    the statement day is the last day of a scheduled meeting; unscheduled meetings and conference calls excluded).
    Keys per XNYS session d: next_cpi_sessions, next_empsit_sessions, next_fomc_sessions = sessions from d to the
    next such day strictly after d (0 is never used; absent if none known), and next_release_sessions = the minimum
    of the three. Clock us_close. These schedules are published months to a year ahead, so the realized scheduled
    dates are point-in-time two sessions ahead except for rare reschedulings (e.g. a government shutdown), which
    should be flagged in known_biases.'
  fields:
  - next_release_sessions
  - next_cpi_sessions
  - next_empsit_sessions
  - next_fomc_sessions
  frequency: 1d
