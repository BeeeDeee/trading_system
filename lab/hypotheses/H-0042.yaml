  kind: instruments
mechanism:
  counterparty: Investors and intermediaries who cut market exposure into scheduled releases (risk-managed funds,
    dealers and leveraged traders facing higher margins and VaR around the release, hedgers buying Treasuries as
    event insurance). They accept a lower expected return for not carrying the jump; the strategy is paid for carrying
    it.
  why: 'Scheduled macro announcements (inflation = CPI, unemployment = Employment Situation, interest rates = scheduled
    FOMC statements) resolve a large part of aggregate macro uncertainty on a few known days. Investors with an
    aversion to this resolution risk (Ai and Bansal''s generalized risk sensitivity) demand compensation for holding
    market risk through the release, so the reward for bearing market beta is concentrated on announcement days:
    Savor and Wilson find that on these days returns rise with market beta across stocks, portfolios, Treasury bonds
    and currencies, while on other days beta earns little or nothing. The claim tested here is cross-asset: on announcement
    windows, the highest-SPY-beta ETFs (equity) should beat the lowest-beta ETFs (Treasuries, gold), more than on
    random windows of the same length.'
  why_not_arbitraged: 'It is a risk premium, not a mispricing: the payoff is compensation for non-diversifiable
    macro jump risk concentrated on a few days, so arbitrage capital would have to bear exactly that risk. Leverage
    and VaR limits bind most on those days, which is why the price of the risk is high then. Capacity is not an
    issue for the investor but the premium cannot be removed without someone holding the risk.'
signal:
  description: 'Inputs: daily total returns of the ten universe ETFs (sharadar_sfp ret_co, ret_oc) and the scheduled
    release calendar of the new dataset macro_release_calendar_1d (key next_release_sessions = XNYS sessions from
    day d to the next scheduled CPI, Employment Situation or FOMC-statement day that was on the published schedule
    on or before d). (1) Announcement day A = any session with a scheduled CPI release, Employment Situation release
    or scheduled FOMC statement (unscheduled FOMC actions are not in the dataset). (2) Month-turn exclusion: drop
    every A for which A-1 or A lies in the month-turn window (the last session of a calendar month through the third
    session of the next month), so the test cannot pick up the turn-of-month flow already studied by H-0016/H-0025.
    (3) Tilt sessions = the union of {A-1, A} over all remaining A. (4) Beta: for each ETF, OLS beta of its daily
    close-to-close total return on SPY''s over the last beta_lookback sessions up to and including the close of
    the decision day; an ETF is eligible once it has beta_lookback sessions of returns; SPY''s beta is 1. Tilts
    and events need at least 9 eligible ETFs; before that the book holds the core only. (5) Weights decided after
    the close of day d for the session d+1 (trade at the open of d+1): core (no tilt in d+1): SPY = 0.60 - tilt/5,
    IEF = 0.40 + tilt/5. Tilted (d+1 is a tilt session): SPY = 0.60 - tilt/5, IEF = 0.40 + tilt/5 - tilt, and tilt/3
    in each of the three eligible ETFs other than IEF with the highest beta on day d (if SPY is among them its tilt/3
    is added to SPY''s core weight). The top three are fixed at the entry decision (close of A-2) for the whole
    window, including windows that join (e.g. CPI and FOMC on consecutive days). The SPY weight never changes at
    a window; only IEF is swapped into the high-beta ETFs and back. The constant -tilt/5 on SPY and +tilt/5 on IEF
    offsets the extra beta carried in the windows (about a sixth of sessions), so the average market beta stays
    near the 60/40 benchmark''s. (6) Target weights are re-applied only when the tilt state changes and on the first
    decision of each calendar month; otherwise positions drift. Fully invested, long only, gross 1. An ETF without
    a bar on a decision day keeps its weight; a missing calendar value means no announcement is known (core weights).
    Holding: two sessions (open of A-1 to the open after A), about 20-25 windows a year.'
  params:
    beta_lookback:
      grid:
      - 126
      - 252
      - 504
      value: 252
    tilt:
      grid:
      - 0.3
      - 0.4
      - 0.5
      value: 0.4
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'After the close of session t = A-2, where A is a scheduled CPI, Employment Situation or FOMC-statement
    day whose window {A-1, A} does not touch the month-turn window (last session of a month through the third session
    of the next): among the eligible universe ETFs, the three with the highest trailing beta_lookback beta to SPY
    get side +1 and the three with the lowest beta get side -1; the remaining ETFs (at least three) are unmarked
    peers. Overlapping windows each count as their own event set (dates differ).'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 2
