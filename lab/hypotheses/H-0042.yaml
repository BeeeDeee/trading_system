falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return at the 2-session horizon is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost of the ETFs.'
- 'Mechanism: the effect is negative in the latest third of dev (K-0052 decay condition), or positive in fewer than
  two of the three thirds.'
- 'Mechanism (shape): if the descriptive 1-session horizon (the pre-announcement session A-1 alone) is as large
  as or larger than the 2-session effect, the spread is not tied to the release itself and the announcement-risk
  story is rejected even if the gate passes.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Strategy: fewer than 75 % of the neighbors (tilt 0.3/0.5, beta_lookback 126/504) beat the 60/40 benchmark, or
  the strategy no longer beats it at doubled costs.'
- 'Strategy: the tilt fails to beat the benchmark in two of three sub-periods, or one sub-period carries more than
  60 % of the log return.'
notes: 'Brief fit: short horizon (two sessions) and cross-asset: the signal comes from the macro release calendar
  (BLS, Federal Reserve) and from SPY betas, the trades are in equity, Treasury, credit and gold ETFs. The new calendar
  dataset is essential (the mechanism is the release date itself; a calendar proxy would repeat the H-0008 mistake)
  and goes to BLOCKED_DATA for the Archivist; FRED/ALFRED release dates and the Fed''s FOMC calendar are free and
  public. Why the two-session window: CPI and payrolls are released at 08:30 ET, before the open, so the release
  jump sits in the overnight gap into A; an entry at the open of A would miss it, and the engine cannot trade at
  the close, so the position must be opened at the open of A-1. The exit is at the open after A (one extra overnight)
  while the event study ends at the close of A: a small, stated mismatch. Differences from dead families: not turn-of-month
  (windows touching the month turn are excluded on purpose, which removes most payroll days); not earnings-announcement-premium
  (firm-level, idiosyncratic news, H-0008/ H-0015/H-0023), here the news is systematic and the claim is about beta;
  not a stress rebound (H-0041, K-0056): the event is a calendar date known in advance, not a price move; not lead-lag
  (mrel): no return predicts another return. Follows K-0005/K-0027: a tilt on an always-invested 60/40-like core
  with roughly the benchmark''s average beta, not a flat-otherwise book; only IEF is swapped, the cheapest swap
  per unit of beta (IEF beta is negative, the top-three ETFs are about 1.2), turnover about four times the tilt
  per window. Cost back-of-envelope (K-0053): a tilt of 0.4 swaps about 1.6 of the book per window in liquid ETFs;
  the literature''s announcement premium is roughly ten times the normal-day premium per unit of beta, so the expected
  gross per window is about 0.4 x 1.5 beta x 10-15 bps, against about 1.6 x the ETF half-spread; the margin is thin,
  which is the most likely strategy death even if the mechanism passes. FOMC days are included because they belong
  to the canonical definition (inflation, unemployment, interest rates); the pre-FOMC drift is reported to have
  weakened in later years, so the latest third is a declared kill condition rather than something tuned around.
  No ETF forward source exists, so this card can pass at most G4. Ten instruments with three marked on each side
  leaves at least three unmarked peers per date (K-0055).'
