id: H-0112
version: 1
title: Index-basket pressure in low-turnover S&P 500 members, learned - dollar-neutral 5-day cohorts after market-wide
  flow days, LightGBM on own move x inverse turnover
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Index and ETF basket traders (authorized participants, index-fund rebalancing, futures-cash arbitrageurs)
    who must trade every member at the close in fixed proportions and pay the concession in the members where their
    trade is large relative to normal volume; the liquidity providers who absorb it are paid by the reversal, and
    this book takes their side one session later.
  why: 'Index funds, index ETFs (creations and redemptions) and index-futures arbitrage trade S&P 500 members as
    one basket, in proportion to index weight, not in proportion to each stock''s own liquidity. On a day of heavy
    market-wide basket flow the same dollar flow per unit of index weight hits every member, so the price impact
    per stock scales with weight divided by the stock''s own dollar volume, i.e. with inverse turnover (market cap
    / dollar volume). Low-turnover members are therefore pushed beyond what their beta to the market implies on
    a flow day, high-turnover members less, and the non-fundamental part reverses over the following sessions as
    liquidity providers unwind. Ben-David, Franzoni and Moussawi (2018) show that stocks with more ETF ownership
    have more non-fundamental volatility and more negative return autocorrelation; Barberis, Shleifer and Wurgler
    (2005) show that index membership itself creates excess comovement. Within the S&P 500 the passive ownership
    share is roughly the same for every member, so the cross-sectional variation in basket pressure comes from inverse
    turnover, which is observable. This card is the separation test the lab asked for after H-0106/H-0107 (K-0148):
    is the flow-day reversal generic stress rebound, which should not depend on inverse turnover once beta and the
    own move are controlled, or basket pressure, which should be concentrated where index trading is a large share
    of a stock''s volume?'
  why_not_arbitraged: The concession per stock is small, lasts days, and sits on market-wide stress-or-euphoria
    days when liquidity-providing capital is scarce and risk limits bind; the trade needs short positions on hundreds
    of names at once. Basket traders are mandated to trade and cannot avoid the days.
signal:
  description: 'Data: S&P 500 point-in-time members (universe sp500), daily total returns from ret_co and ret_oc
    (close-to-close return r_t = (1+ret_co_t)(1+ret_oc_t)-1), dollar_volume, and sf1_arq_marketcap (frozen at the
    filing date, usable from the day after the filing). All values up to the close of day t; decisions after the
    close of t, trades at the open of t+1. Market series (built from members only, no ETF): m_t = marketcap-weighted
    mean of members'' r_t (weights from sf1_arq_marketcap of day t, members without a marketcap excluded from the
    mean); z_t = m_t / standard deviation of m over the 63 sessions t-63..t-1; vshock_t = log(sum of members'' dollar_volume
    on t / mean of that sum over t-63..t-1). A flow day is a day with |z_t| >= flow_sigma. Features per member and
    date (cross-sectional z-score over members of that date by the framework helper, except the two date-level features,
    passed raw): (1) own r_t; (2) inverse turnover log(sf1_arq_marketcap / mean dollar_volume over t-62..t); (3)
    beta: OLS slope of r on m over t-251..t, at least 126 valid pairs; (4) own compounded return over t-5..t-1 (excludes
    t); (5) date-level z_t; (6) date-level vshock_t. A member missing any feature is not scored that day. Label:
    total return from the open of t+1 to the open of t+6 (horizon_days 5), ranked across members by the framework.
    Model: framework gbm (LightGBM), num_leaves 15, learning_rate 0.05, min_child_samples 200, n_estimators from
    params; trained by lab.framework.ml.walk_forward on an expanding window, refit every 126 rows, using only training
    rows of days with |z_t| >= 1.0 (the lowest grid value of flow_sigma, so every flow_sigma neighbor uses the same
    model; the row mask is point-in-time). The same walk_forward with model ridge on the same features, rows, label
    and schedule is the linear control used by the mechanism test. Book (score_weights + only_on): on each decision
    date t that is a flow day (|z_t| >= flow_sigma), open a cohort among scored members: long the top `top` fraction
    of the gbm score, short the bottom `top` fraction, equal weight within each leg, 0.25 gross per leg (cohort
    gross 0.5, dollar-neutral). Each cohort is entered at the open of t+1 and closed at the open of t+6 (5 sessions);
    cohorts overlap; if the sum of active cohorts exceeds gross 1.0, all active cohorts are scaled down proportionally.
    A name that leaves the S&P 500 during a hold is closed at the first open at which it is no longer a member.
    No trades on non-flow days except cohort exits. Fewer than 100 scored members on a flow day: no cohort.'
  params:
    flow_sigma:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
mechanism_test:
  event: On a flow day (|z_t| >= 1.5), a member that is in the top fifth of the gbm score but not in the top fifth
    of the ridge score (side +1), or in the bottom fifth of the gbm score but not in the bottom fifth of the ridge
    score (side -1); both walk-forward models on the same features, training rows, label and refit schedule.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - own close-to-close total return of day t (the flow-day move to be partly reversed), from ret_co and ret_oc
  - 'inverse turnover: log(sf1_arq_marketcap / 63-session mean dollar volume) - index-basket dollars per dollar
    of the stock''s own liquidity, the intensity of basket pressure'
  - 252-session beta of the stock's daily return to the members' cap-weighted market return (at least 126 pairs)
    - the fundamental exposure that the pressure must be measured against
  - own compounded return over the 5 sessions before t, excluding t - generic short-term reversal state, a control
    so the model need not attribute ordinary reversal to the flow day
  - 'date-level market flow-day size z_t: cap-weighted member return of day t over its trailing 63-session standard
    deviation (signed), passed raw'
  - 'date-level basket-volume shock: log of members'' total dollar volume on t over its trailing 63-session mean,
    passed raw'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The claim lives only in interactions. The predicted 5-day return of a member is roughly minus
    (own move - beta x market move) x inverse turnover, larger on high basket-volume days, with the sign set by
    the direction of the market move. In a cross-sectional ranking a ridge cannot use the two date-level features
    at all (they shift every member equally), and its inverse-turnover coefficient is a static low-turnover tilt
    that the same-stock placebo absorbs; it can express only plain reversal and a beta tilt. A small tree ensemble
    can condition the reversal slope on inverse turnover and on the size and sign of the flow day. Who pays: basket
    traders who trade every member in index proportions on flow days and pay the concession in low-turnover names;
    the reversal is the liquidity providers'' compensation. If the ridge picks earn as much as the gbm-only picks,
    the interaction is absent and what remains is ordinary reversal (K-0133).'
