falsification_criteria:
- 'Mechanism: on flow days, the members the gbm puts in its top (bottom) fifth that the ridge does not, side +1
  (-1), earn no 5-session abnormal return above the 95th percentile of the time-shifted placebos, or gross per event
  is below the round-trip cost.'
- 'Mechanism shape: the abnormal return at the 1-session horizon is not positive, or the effect keeps growing to
  10 sessions (slow drift, not a pressure reversal).'
- 'Decay: the latest third of dev (about 2014-2020) has a negative abnormal return (K-0060).'
- Net Sharpe on dev below T-bill + 0.10 or below the absolute 0.5 floor, or the bootstrap bound of the difference
  is below zero.
- Neighbors of flow_sigma 1.5, top 0.2 or n_estimators 100 do not beat the benchmark (fewer than 75 %).
- 'A ridge on the same features, rows, label and schedule gives the same or a better book than the gbm: the nonlinearity
  (basket-pressure interaction) does not pay.'
notes: 'Why this is not a retry. H-0106 (sector-ETF push x ETF volume x own news) passed its mechanism test but
  its flow days were mostly market-wide, and H-0107 (push residual to SPY) found nothing; K-0148 left open whether
  the H-0106 pass was generic stress rebound (K-0084) or basket flow, and asked for a control that separates them.
  Here the flow day is market-wide by construction and the separating variable is cross-sectional: inverse turnover,
  the observable intensity of basket pressure per stock, with beta and the own move as controls, and the mechanism
  event is the gbm-versus-ridge disagreement design of K-0142, so the linear control runs inside G1 (K-0135). Both
  sides are marked on both up and down flow days, so the market''s own rebound after down days cancels to first
  order; a residual beta gap between gbm-only longs and shorts (K-0074) is the main confound and is not neutralized
  by G1. Family short-term-reversal on purpose (flow_structural reversal, with H-0106 and H-0107), so its trial
  count applies. Data period starts 2001-05 to stay out of the pre-decimalization cost era; with an expanding window
  and the framework''s minimum training sample the first scores come about two years later, so all three thirds
  hold events. Forecasts, written before any run (K-0120, K-0151): flow days at 1.5 sigma about 12-15 % of sessions
  (about 30-38 per year, 500-650 dates over 2003-2020); gbm-only picks per side per flow day about 30-50 of the
  100 top-fifth names, so roughly 30000-60000 events. Round trip in the S&P 500 about 12-14 bps (H-0106 measured
  13.5). Gross per event: central 10-15 bps (below the 28 bps H-0106 measured for all flow-day entries, since the
  disagreement set is narrower), pessimistic 3 bps (K-0151: Scout forecasts have run 3-10x high). At the central
  case the cost ratio is about 1 and the book would be marginal; at the pessimistic case it dies at the cost check,
  which still answers the lab question if the placebo percentile is read: inverse turnover adds timing information
  or it does not. Book arithmetic: cohort gross 0.5 on about 35 flow days a year with a 5-session hold gives mean
  gross exposure about 0.3 (clusters capped at 1.0). Not a learned-calendar card (K-0137): the date-level inputs
  gate the size of a stock-level reversal whose cross-sectional variable is new to the lab.'
