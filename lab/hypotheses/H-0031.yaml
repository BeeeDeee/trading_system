id: H-0031
version: 1
title: Earnings-reaction drift, fixed risk-scaled event slots - LIQ-500, follow large 8-K release-session reactions,
  no gross normalization, liquid net hedge, hold 5 days
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who anchor on the pre-release price or trade against the move (retail contrarians selling
    winners on good news, the disposition effect), and liquidity providers who absorb the release-session imbalance
    and lean against it in the next sessions.
  why: 'Investors under-react to the information in an earnings release: the price moves in the release session
    but does not move all the way, and the rest arrives over the following sessions as slower investors, analysts
    revising forecasts and benchmarked funds react (Bernard and Thomas 1989). The market''s own release-session
    reaction, standardized by the stock''s normal volatility, is a direct measure of how much news hit the price.
    In this lab the effect exists among liquid stocks in an equal-weight event study (K-0043, H-0028: far above
    the placebo cloud, above cost, positive in every third). This card claims that the effect can be harvested as
    a book when each event gets a fixed risk-scaled slot. H-0028''s book lost to T-bills; the likely cause is the
    book design, not the signal (K-0042).'
  why_not_arbitraged: The drift per event is small next to the idiosyncratic risk of a single name after news. Event
    books are clustered in earnings seasons, so their exposure and risk swing a lot. Most of the published drift
    sits in illiquid names where costs consume it (Chordia et al. 2009), so capital that targets PEAD at scale ends
    up elsewhere. Among liquid names the remaining edge is too small for a stand-alone fund after fees. It does
    not need to be large to beat T-bills with a well-sized book at 3-6 bps half-spread.
signal:
  description: 'Inputs: sharadar_sep total returns ret_co and ret_oc (close-to-close total return of session t:
    r[t,j] = (1+ret_co[t,j])*(1+ret_oc[t,j]) - 1), the PIT LIQ-500 membership and liq_rank, and the sec_8k_item202
    flag ea_reaction_day. All decisions are taken after the close of day t with data up to that close; trades happen
    at the open of day t+1. (1) Abnormal return: a[t,j] = r[t,j] - mean over universe members of r[t,.]. (2) Volatility:
    sigma[t,j] = standard deviation of a[s,j] over the 63 sessions s = t-63..t-1 (the reaction session itself is
    excluded), requiring at least 50 valid values, otherwise no event. (3) Event: ea_reaction_day[t,j] == 1, j is
    a universe member at t, sigma valid, and |z| >= z_threshold where z = a[t,j] / sigma[t,j]. side = sign(z). NaN
    flags count as 0. (4) Event slot: entered at the open of t+1 with target weight w_j = side * event_weight *
    clip(median_sigma_t / sigma[t,j], 0.5, 2.0), where median_sigma_t is the cross-sectional median of sigma over
    universe members at t (risk scaling with a fixed clip, no tuning). The target weight stays fixed (no re-normalization)
    for hold_days sessions and the position is closed at the open of session t+1+hold_days. A new event of the same
    stock during the hold replaces the old slot. A stock that leaves the universe or is not tradable is closed at
    the next possible open. (5) Hedge: N_t = sum of the signed event weights. The book holds -N_t spread equally
    over the 100 universe members with the best liq_rank that have no open event slot. The hedge basket membership
    is refreshed on the first trading day of each month, and names that leave the universe drop out (re-equalized).
    Its size is reset every day to -N_t. (6) Gross cap: if the sum of |event weights| + |N_t| exceeds 1.0, all weights
    are scaled down proportionally for that day (earnings-season peaks). The book is flat (cash) when no slot is
    open. The essential difference from H-0028: event weights are never normalized to fill a gross target, so a
    quiet-season day with one or two events does not concentrate the book in single names, and a peak-season day
    does not dilute each event below its fixed slot unless the gross cap binds.'
  params:
    event_weight:
      grid:
      - 0.015
      - 0.025
      - 0.035
      value: 0.025
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_threshold:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: After the close of an earnings-release reaction session t (ea_reaction_day = 1) of a LIQ-500 member, the
    stock's abnormal close-to-close return divided by its prior 63-session abnormal-return volatility has absolute
    value >= z_threshold (2.0). side = +1 if the reaction was positive, -1 if negative.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
