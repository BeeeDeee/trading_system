falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return from the open of t+1 to the close of t+5 does not beat the 95th
  percentile of the 200 time-shifted placebos, has the same sign in fewer than 2 of 3 sub-periods, or does not cover
  the round-trip cost.'
- 'Mechanism: the latest third of the dev period has a negative side-adjusted 5-day abnormal return (the drift has
  been arbitraged away in liquid names).'
- 'Strategy: net Sharpe on dev (2004-09 to 2020) below 0.5 or not above T-bills + 0.10, or the bootstrap bound of
  the Sharpe difference at or below zero.'
- 'Book-versus-study gap: if the mechanism passes again and this fixed-slot book still loses to T-bills, weight
  normalization was not the cause of H-0028''s gap; the family should then stop filing reaction-following books
  until the gate output gives a gross/net and long/short split.'
- 'Robustness: fewer than 75 % of the neighbors (z_threshold 1.5/2.5, hold_days 3/7, event_weight 0.015/0.035) beat
  T-bills by the G1 bar, or the strategy fails at costs x2.'
notes: "Brief fit: short horizon (5 sessions), US single stocks, cross-sectional, LIQ-500, mechanism test declared.\
  \ This is deliberately the same family as H-0024 and H-0028 (post-earnings-announcement-drift) and uses the same\
  \ kind of events as H-0028, so its trials count together. It is not a rename and it does not tune z or the hold:\
  \ z = 2.0 is a round value, and the hold of 5 matches H-0028. It is the follow-up that the H-0028 lesson and K-0042\
  \ ask for: the mechanism passed clearly but the book lost to cash with a deep drawdown, and the suspects are (a)\
  \ event weights that shrink when many names report and, presumably, swell into one or two single-name positions\
  \ when few do, (b) hedge-basket turnover and (c) costs and squeezes in names that just moved several standard\
  \ deviations. This card changes exactly those things: - a fixed per-event slot that is never normalized (a); -\
  \ risk scaling that shrinks the most volatile, most squeeze-prone names (c); - a hedge only for the net imbalance,\
  \ in the 100 most liquid members (3 bps tier), with monthly basket\n  membership (b).\nFeasibility estimate per\
  \ K-0042: about 500 members x 4 releases x ~85 % 8-K coverage gives ~1 700 releases a year. If abnormal release-session\
  \ moves are ~2.5x normal daily volatility, roughly 40-45 % reach |z| >= 2, which gives ~700 events a year and\
  \ ~14 concurrent slots at a 5-session hold. At 2.5 % per slot that is a mean event gross of ~35 %, plus the hedge,\
  \ so it should be above the 20 % exposure floor. The cap binds only at season peaks. At an assumed gross drift\
  \ of 20-30 bps per event, book gross is ~3.5-5 % a year. Round-trip costs on the event names are ~0.2 %/yr, plus\
  \ a small hedge-resizing cost. Idiosyncratic book volatility is ~3-4 %/yr, so the Sharpe is plausible if the study's\
  \ effect carries into the book. Period starts 2004-09 because the 8-K flag starts 2004-08-23. Earlier dev years\
  \ have no events and would only add cash days. Risk named up front: earnings seasons cluster, so the book is near\
  \ flat between seasons. If exposure lands under 20 % at the primary event_weight, that is a design failure, not\
  \ something to tune. The vol window, the 0.5-2.0 clip and the 100-name hedge basket are fixed design choices,\
  \ not tuned to any outcome. No look-ahead: the reaction flag is known at the close of session t (acceptance time\
  \ at or before that close), sigma uses sessions before t, and entry is at the t+1 open. Ask for the Builder to\
  \ report the realized mean gross, the number of events and the share of days the cap binds if the framework allows\
  \ it (K-0045: G0 with an 80-name synthetic market and no flags may be vacuous; the Skeptic should read the event\
  \ code)."
