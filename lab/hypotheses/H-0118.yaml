id: H-0118
version: 1
title: Tax-deadline loss-selling pressure and release, learned - LIQ-500 market-neutral weekly 5-day cohorts inside
  the October and December tax windows, LightGBM on loss state x deadline clock
author_agent: scout
family: capital-gains-tax-timing
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Tax-motivated sellers (funds before their October year end, individuals before December 31) who
    accept a price concession because the tax value of realizing the loss before the deadline exceeds it, and who
    cannot rebuy for 30 days; liquidity providers that absorb the seasonal supply are paid the rebound.
  why: 'Two groups of holders face a hard tax deadline for realizing losses: US mutual funds, whose excise-tax year
    ends with October (they must distribute gains realized through the end of October, so they harvest losses before
    it), and taxable individuals, whose year ends with December. Before each deadline these holders sell stocks
    in which they sit on losses (losses measured over THEIR tax year and against their purchase prices), and the
    wash-sale rule keeps them from buying the same stock back for 30 days. This is a predictable, non-informational
    supply that should push loss stocks down relative to other stocks in the weeks before the deadline, and its
    end (plus the delayed repurchases) should let them rebound in the weeks after it (Gibson, Safieddine and Titman
    2000 for the October fund deadline; Grinblatt and Moskowitz 2004 for December losers and the January rebound).
    The sign of the loss effect therefore FLIPS with the position in the tax calendar: losers underperform before
    a deadline and outperform after it, and only the loss side matters (gains carry no deadline motive). That is
    the conditional claim the model is asked to learn.'
  why_not_arbitraged: The supply is small next to large-cap volume and the concession is small, so arbitrage capital
    is limited and the trade is only live a few weeks a year; it is well published, so the honest prior is that
    it is mostly gone in liquid stocks (K-0060 decay expected). The card tests whether any of it survives in LIQ-500.
signal:
  description: 'Data: sharadar_sep daily total returns (ret_co, ret_oc) and dollar_volume of the point-in-time LIQ-500
    members. TRI = cumulative total-return index per stock built from ret_co and ret_oc. Decisions after the close
    of day t, trades at the open of t+1. Tax deadlines (calendar rule, no date literals): D_fund = the last XNYS
    session of calendar month 10, D_ind = the last XNYS session of calendar month 12, each year. FEATURES per stock
    and date, using data up to the close of t only: (1) tax_year_ret = TRI_t / TRI at the most recent D_ind strictly
    before t, minus 1 (individuals'' tax-year return); (2) fund_year_ret = TRI_t / TRI at the most recent D_fund
    strictly before t, minus 1 (funds'' excise-year return); (3) overhang = log(TRI_t / R_t) with R_t the dollar-volume-weighted
    mean of TRI over sessions t-251..t (unrealized gain of the average recent buyer, Grinblatt-Han style; negative
    = holders sit on losses); (4) ret_21 = TRI_t / TRI_{t-21} - 1 (recent move, control for generic one-month reversal);
    (5) vol_63 = standard deviation of daily total returns over t-62..t (a loss in a volatile stock is worth more
    as a tax option and is harder to arbitrage); (6) clock_to = number of XNYS sessions from t to the next deadline
    (D_fund or D_ind, whichever comes first, 0 on a deadline day), capped at 63; (7) clock_since = number of XNYS
    sessions since the most recent deadline (0 on the deadline day), capped at 63. Features (1)-(5) are cross-sectionally
    z-scored with the framework helper on each date among members with a full vector; (6) and (7) are date-level
    (identical for all stocks on a date) and are passed UNSCALED, so the model can only use them through interactions
    with the stock features. A stock with any missing stock feature (less than 252 sessions of history, not a member)
    is not scored. LABEL: total return from the open of t+1 to the open of t+1+horizon (horizon = 5 sessions), ranked
    across members on each date (framework label). MODEL: lab.framework.ml.walk_forward with model gbm (LightGBM),
    num_leaves 15, learning_rate 0.05, min_child_samples 500, n_estimators from params, expanding window, refit
    every 252 rows, training on ALL dates and members (not only window dates) so the clock features vary across
    training rows; the framework''s purge and minimum training history apply; no score before the first fit. BOOK
    (score_weights + only_on): decision dates are the first session of each XNYS week whose date lies inside a TAX
    WINDOW, defined as clock_to <= 15 (pressure phase, the 15 sessions up to and including a deadline) or 1 <= clock_since
    <= 15 (release phase, the 15 sessions after a deadline). On a decision date: long the top `leg` fraction of
    scored members by model score, short the bottom `leg` fraction, equal weight, 0.5 gross per side (dollar-neutral,
    gross 1.0). Hold until the next decision date; if the next session is outside both windows (the week-start falls
    outside), the positions of the last in-window decision are closed at the open 5 sessions after they were opened
    and the book is flat until the next in-window decision date. Fewer than 50 scored members on a decision date:
    flat. A stock that delists while held takes its delisting return (engine policy). The window gate is a hand
    rule; the side within the window comes from the model.'
  params:
    leg:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
  timeframes:
  - 1d
  - 1y
mechanism_test:
  event: At a weekly decision date inside a tax window (clock_to <= 15 or 1 <= clock_since <= 15), a scored LIQ-500
    member enters the model's long leg (top `leg` fraction of the gbm score, side +1) or its short leg (bottom `leg`
    fraction, side -1) after not being in that leg at the previous decision date.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'tax_year_ret: return since the last December deadline - the individuals'' realized-loss motive'
  - 'fund_year_ret: return since the last October deadline - the mutual funds'' excise-year loss motive'
  - 'overhang: log of price over the dollar-volume-weighted 252-session reference price - how far recent buyers
    sit below cost'
  - 'ret_21: past 21-session return - controls the generic one-month reversal the tax story must beat'
  - 'vol_63: 63-session realized volatility - tax-option value of a loss and arbitrage risk'
  - 'clock_to: sessions to the next tax deadline (date-level, unscaled) - where the selling pressure should sit'
  - 'clock_since: sessions since the last tax deadline (date-level, unscaled) - where the release should sit'
  horizon_days: 5
  model: gbm
  retrain_every_days: 252
  why_not_linear: 'The mechanism is a sign flip: the loss features (tax_year_ret, fund_year_ret, overhang) should
    predict LOW 5-day returns when clock_to is small (pressure before a deadline) and HIGH returns when clock_since
    is small (release after it), and roughly nothing in the rest of the year; it should also be one-sided (only
    losses, not gains, carry a deadline motive), which is a threshold at zero. A ridge on the same features cannot
    use the date-level clocks at all (they are constant across stocks on a date, so they cannot change a cross-sectional
    ranking) and can only give each loss feature one year-round slope, which averages the pre-deadline and post-deadline
    effects toward zero. A tree can split on the clock and then on the loss state. Who pays: the tax-motivated sellers
    before the deadline (short side) and, after it, the same group through the concession that is released (long
    side).'
data_requirements:
- dataset: sharadar_sep
  fields:
