  - '2020-12-31'
holding_period:
  rebalance: weekly
  typical_days: 5
market_exposure: market_neutral
references:
- cite: 'Gibson, Safieddine, Titman (2000) Tax-motivated trading and price pressure: an analysis of mutual fund
    holdings, Journal of Financial and Quantitative Analysis'
  year: 2000
- cite: 'Grinblatt, Moskowitz (2004) Predicting stock price movements from past returns: the role of consistency
    and tax-loss selling, Journal of Financial Economics'
  year: 2004
falsification_criteria:
- 'Mechanism: new entries into the model''s legs at in-window decision dates do not beat the 95th percentile of
  time-shifted placebos (same stocks on other dates) over 5 sessions, or gross per entry is below the round-trip
  cost.'
- 'Mechanism: the effect does not have the predicted sign in at least two of the three thirds of dev; a wrong-signed
  latest third is a kill condition for the card even if the pooled test passes (K-0060).'
- 'Mechanism shape: if the 10- and 21-session abnormal returns are much larger than the 5-session one (slow drift
  rather than a release within a few weeks of the deadline), the tax-pressure reading is refuted.'
- Net Sharpe on dev below 0.5 or not above T-bill + 0.10, or the bootstrap bound of the difference below zero.
- 'Neighbors of n_estimators 100 or leg 0.1: fewer than 75 % beat the benchmark.'
- 'A ridge on the same features with the same schedule and book (framework ridge) gives the same or a better result:
  then the deadline interaction is not what pays (the ridge can only hold a static loser or winner tilt inside the
  windows).'
notes: 'Brief: short horizon (5 sessions), US single stocks, learned model. New mechanism for the lab: no card has
  tested tax-deadline loss selling (October fund year end, December individual year end). It is filed under the
  existing family capital-gains-tax-timing (H-0110, the one-year holding-period clock), because both are tax-motivated
  timing of realizations; H-0110 used a different event (anniversary of a volume spike) and found nothing, which
  is noted as a low prior together with K-0121 (gain overhang wrong-signed in large caps) and K-0137 (learned date-level
  clocks added nothing in H-0098/H-0099). What differs from those: the clock here is a legal deadline with a forced,
  dated supply and a wash-sale-delayed repurchase, not a statistical calendar effect, and the placebo of the mechanism
  test (same stocks, shifted dates) nets out generic loser/winner drift, which is exactly the confound in this literature.
  Ridge baseline: same seven features, same schedule and book; a ridge cannot use the clocks, so the difference
  measures the interaction. Expected numbers (honest, likely too high, K-0120): about 50 new leg entries per decision
  date, about 14 in-window decision weeks a year, so several thousand events on roughly 250-300 dates after the
  warm-up; gross per entry plausibly 10-40 bps over 5 sessions in large caps, against a round trip of roughly 10-25
  bps, so the cost check is the most likely death, then the latest third (published effect). Mean exposure: in-window
  weeks are about 28 % of the year and the book is fully invested in them, so about 0.25-0.28, just above the 0.20
  floor; the Sharpe floor of 0.5 for a part-time market-neutral book is the most likely strategy death even if the
  mechanism passes. Training on all dates is deliberate (H-0096 lesson: a model trained only on window rows cannot
  learn the flip; one trained on all rows sees the clock vary). The date-level clocks must not be z-scored (they
  would become zero). Builder: please report, if a channel exists, the event average by phase (pressure vs release)
  and by deadline (October vs December), and the gbm feature importance of the two clocks, so that a failure can
  be read as ''no tax effect'' versus ''the model never used the clock''.'
