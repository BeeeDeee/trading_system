id: H-0124
version: 1
title: US-stress switch for crypto short-term momentum, learned - top-20 Binance perps dollar-neutral 5-day cohorts,
  LightGBM on coin momentum x VIX and BTC-trend state
author_agent: scout
family: short-term-momentum
asset_classes:
- crypto_perp
- macro
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: 'In calm US states: late, attention-driven buyers of recent winners and holders who sell coin-specific
    losers too slowly. In US-stress states: forced or mandate-driven cross-asset sellers who cut crypto exposure
    by beta, not by coin news, and momentum traders who stay short high-beta losers into the rebound.'
  why: 'Cross-sectional crypto returns show short-horizon momentum: coins that outperformed over the past one to
    four weeks keep outperforming over the next week (Liu, Tsyvinski and Wu 2022). The usual explanation is slow
    diffusion of coin-specific news among attention-constrained retail holders who arrive late and chase winners.
    Momentum also has a known failure state (Daniel and Moskowitz 2016): after a broad sell-off in a high-volatility
    "panic" state, the loser leg is mostly high-beta names marked down with the market, not names with bad news,
    and it rebounds sharply when the pressure stops. This card claims that a signal from another market, US equity
    implied volatility (VIX), tells the two cases apart for crypto. When US implied volatility is high, crypto weakness
    is largely caused by cross-asset deleveraging (multi-asset funds, leveraged traders meeting margin calls elsewhere,
    risk-parity style cuts), which sells high-beta coins regardless of their own news. So a coin''s three-week underperformance
    then says little about the coin, and losers should revert relative to winners. When US implied volatility is
    low and crypto still moved, the moves are crypto-specific information and momentum should continue. A walk-forward
    gradient-boosted model on four coin features plus two date-level state variables (VIX level and BTC trend) is
    asked to learn which sign the momentum slope has in which state.'
  why_not_arbitraged: Crypto long/short needs perps with funding costs, coin-level jump risk and exchange risk.
    Most crypto-native capital does not watch US option-implied volatility, and most TradFi capital cannot short
    altcoins. Momentum crashes are exactly when leveraged arbitrage capital is constrained, and a one-week horizon
    on 20 coins is too small for large funds.
signal:
  description: 'Universe: on each UTC day t, the point-in-time top 20 Binance USD-M perps of binance_perp_1d by
    trailing 30-day mean daily quote volume, using only days up to t (if the gate supplies no crypto_top_n universe,
    build exactly this; rolling windows must accept views shorter than the window and return NaN, never raise).
    BTCUSDT.P is also read as a signal input on every day whether or not it is a member. Decisions after the 00:00
    UTC close of day t use data up to that close; trades at the open of day t+1. Features per coin and day, from
    the coin''s own perp total returns (all windows end at the close of t): (1) ret_21 = total return over the last
    21 days; (2) ret_5 = total return over the last 5 days; (3) vol_30 = standard deviation of daily log returns
    over the last 30 days; (4) beta_60 = OLS slope of the coin''s daily returns on BTCUSDT.P daily returns over
    the last 60 days (BTC itself = 1). Features 1-4 are z-scored across the members of day t with the framework
    helper. Date-level features, identical for all coins on day t and NOT z-scored across the universe (pass the
    raw value): (5) log_vix = natural log of the latest FRED VIXCLS value usable at t (fred_macro, clock next_morning,
    so the US close of day d is first used on day d+1; carried forward over weekends and US holidays, never filled
    backwards); (6) btc_ret_21 = BTCUSDT.P total return over the last 21 days. A coin with fewer than 60 days of
    returns or any missing feature is not scored that day. Label: total return from the open of t+1 to the open
    of t+6 (horizon 5 days), ranked across members on each day, as lab.framework.ml.walk_forward builds it, with
    its purge. Model: LightGBM (framework gbm), expanding window, refit every 63 rows, num_leaves 15, learning_rate
    0.05, min_child_samples 400 (about 20 dates per leaf, so a state split cannot isolate a handful of days), subsample
    0.8, colsample 1.0; n_estimators from params. Book: daily cohorts held 5 days. Each day t with at least 10 scored
    members, rank members by score; the long leg is the top round(top x scored members) coins (at least 2), the
    short leg the same number at the bottom. The cohort opened at the open of t+1 has gross 0.2: +0.1 split equally
    across the long leg, -0.1 split equally across the short leg, and is closed at the open of t+6. The book is
    the sum of the five live cohorts (gross <= 1, dollar-neutral); a coin in both a long and a short cohort is netted.
    A coin that leaves the universe or stops trading is closed at the next open and its slot stays empty. Days before
    the first model fit hold cash. Funding is charged by the engine (long pays, short receives).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.15
      - 0.2
      - 0.25
      value: 0.2
  timeframes:
  - 1d
mechanism_test:
  event: A perp enters the long leg (top fraction `top` of the gbm score among scored members; side +1) or the short
    leg (bottom fraction; side -1) on day t, having not been in that leg on day t-1. Only days after the first model
    fit count.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'ret_21: coin total return over the last 21 days, z-scored across members (formation return of short-horizon
    momentum; who has been winning or losing)'
  - 'ret_5: coin total return over the last 5 days, z-scored (whether the last week continues or partly gives back
    the formation move)'
  - 'vol_30: 30-day standard deviation of daily log returns, z-scored (how much of a move is noise; crash exposure
    of the loser leg)'
  - 'beta_60: 60-day OLS beta of daily returns on BTCUSDT.P, z-scored (how much of a coin''s move is market-wide;
    the loser leg of a momentum crash is high beta)'
  - 'log_vix: log of the latest FRED VIXCLS usable at t, raw date-level value (the cross-asset state: US equity
    implied volatility as a gauge of cross-asset deleveraging pressure)'
  - 'btc_ret_21: BTCUSDT.P total return over the last 21 days, raw date-level value (crypto market state: a sell-off
    versus a rally, the bear-market condition of momentum crashes)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The label is a within-day cross-sectional rank, so in a ridge regression the two date-level features
    (log_vix, btc_ret_21) add the same constant to every coin on a day and cannot change the ranking: a ridge on
    these six features is exactly a fixed-weight linear sort on the four coin features, with one sign on momentum
    in all states. The claim is that the sign of the momentum slope depends on the cross-asset state: in calm US
    states recent winners keep winning (slow diffusion of coin news, paid by late chasers), in high-VIX states with
    a falling BTC the three-week losers are high-beta coins sold indiscriminately by cross-asset deleveragers and
    they revert (paid by the forced sellers and by momentum traders short the loser leg). Only a model that can
    split on log_vix or btc_ret_21 and then on ret_21 and beta_60 can express that switch. If the gbm does not beat
    the ridge on the same rows, the cross-asset state adds nothing and what remains is plain crypto momentum.'
data_requirements:
- dataset: binance_perp_1d
  description: Top-20 USD-M perps by trailing 30-day quote volume (tradable), plus BTCUSDT.P as a signal input;
    funding charged by the engine
  frequency: 1d
- dataset: fred_macro
  description: CBOE VIX close (signal only, clock next_morning), carried forward over non-US days
  fields:
  - VIXCLS
  frequency: 1d
holding_period:
  rebalance: daily
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Daniel, Moskowitz (2016) Momentum crashes, Journal of Financial Economics
  year: 2016
- cite: Liu, Tsyvinski, Wu (2022) Common risk factors in cryptocurrency, Journal of Finance
  year: 2022
falsification_criteria:
- 'Mechanism test: new long/short leg entries do not beat the 95th percentile of the time-shifted placebos at 5
  days, or gross per entry is below the round-trip cost.'
- 'Mechanism test: with the first third of dev expected to be almost empty (model warm-up), either of the two later
  thirds has the wrong sign; in particular a negative latest third kills the card (K-0060).'
- Net Sharpe on dev below 0.5 or not above the T-bill benchmark by 0.10, or the bootstrap bound of the difference
  below zero.
- 'Neighbors of n_estimators 100 or top 0.2: fewer than 75 % beat the benchmark.'
- 'A ridge on the same six features (framework ridge, same rows, label and schedule; equivalent to a linear sort
  on the four coin features) is as good as or better than the gbm: the cross-asset state switch is not what pays.'
- 'Descriptive: the side-adjusted 5-day return of entries made on days with log_vix above its dev median is not
  different from entries on days below it; then the model did not use the US state.'
- Net Sharpe at doubled costs does not beat the benchmark.
notes: 'Brief fit: short horizon (5 days), learned model, cross-asset (the switching signal comes from the US equity
  option market, the trades are in crypto perps). Crypto rather than US stocks because the stock-side cross-asset
  constructions are used up: estimated exposure times macro shock (H-0114, H-0116, H-0119), macro-cleaned reversal
  (H-0123 pending), sector-ETF flow (H-0106, H-0107). A 20-coin cross-section over about 2.5 scored years gives
  about 15-18k (date x coin) training rows by the end of dev; a model on 2-3 instruments was not an option. Why
  this is not a refile of H-0081 (VIX-gated crypto reversal, short-term-reversal, dead): H-0081 sorted on the one-day
  BTC-residual move and bet on a 3-day reversal only on high-VIX days. Its lesson and K-0119 report a continuation
  shape at 5-10 days in liquid perps, which is the default this card builds on: formation over three weeks, momentum
  by default, with the US state as a learned switch of the sign rather than a gate on a reversal trade. Family short-term-momentum
  (H-0029) because the features are momentum features; not cross-sectional-momentum (12-1 month stock sleeves).
  Study 9''s long-only weekly altcoin momentum on 2022-2026 is a different book (long-only, no state, holdout years);
  it is related and counts against this family''s prior. K-0162 found date-level states useless for learned stock
  sorts; this card tests the same question in a market where the state comes from outside it, and states the descriptive
  check of whether the model used the state. Forecasts (K-0120 asks for them): scored days from the first fit (after
  the framework''s minimum training sample, roughly the middle of the first dev year) to the end of dev, about 800-880
  days. New leg entries per day about 1-1.5 per leg, so about 1500-2500 events on 600-850 dates (pessimistic 1000).
  The first third of dev will hold few or no events (K-0163), so both later thirds must carry the sign. Round trip:
  K-0120 says G1 priced liquid perps near 90 bps in H-0081; top-20 is the same order, so assume 60-90 bps. Gross
  per entry at 5 days: central 0.8-1.2 %, pessimistic 0.3 %; the placebo bar will probably lie near or above cost,
  so a modest effect ends as ''cannot tell''. Beta gap (K-0074): the long leg in calm bull states is likely higher
  beta than the peers, which tests partly market direction; beta_60 is a feature, but legs are dollar-neutral, not
  beta-neutral. Funding: winners usually carry higher funding, so the long leg pays and the short leg receives;
  the engine charges it. Point-in-time: the universe is recomputed daily from trailing volume; no column set may
  be chosen from the whole view (K-0134), so features, labels and walk_forward run on all perp columns with non-members
  masked per row. VIX history before the view start is not delivered (K-0108), which is why log_vix is a level and
  not a ratio to a long trailing median. Holdout: binance_perp_1d has forward data, but my knowledge of recent crypto
  history is contaminated; the judge''s holdout is the arbiter, not my expectation. Most likely death: the dev window
  holds one boom-and-bust cycle, so the model may learn mostly a regime dummy (low VIX in the boom, higher VIX in
  the bust) rather than a stable switch, so the latest third flips sign, or gross per entry stays under the near-90-bps
  round trip.'
