  typical_days: 5
market_exposure: market_neutral
references:
- cite: Cohen, Malloy, Pomorski (2012) Decoding Inside Information, Journal of Finance 67(3)
  year: 2012
- cite: Lakonishok, Lee (2001) Are Insider Trades Informative?, Review of Financial Studies 14(1)
  year: 2001
falsification_criteria:
- 'Mechanism test: side-adjusted 5-day abnormal return after the event does not beat the 95th percentile of the
  200 time-shifted placebos, or changes sign in two of three sub-periods.'
- 'Mechanism test: gross abnormal return per event at 5 days is below the round-trip cost of trading it.'
- Net Sharpe of the market-neutral book on dev below T-bill + 0.10 or below 0.5 absolute.
- Fewer than 75 % of the neighbor configurations (quiet window 91/365, hold 3/7) beat T-bill with Sharpe >= 0.5.
- Net Sharpe at costs x2 below the T-bill bar.
- 'Mechanism (descriptive, for the Skeptic): if the 5-day abnormal return of events is no larger after a quiet window
  of 182 days than with the shortest window (91 days), the non-routine proxy adds nothing; if events whose prior
  5-day return is above the universe median earn nothing, the effect is short-term reversal of pre-purchase losses,
  not insider information.'
notes: 'Brief fit: short holding (5 days), US single stocks cross-sectional (LIQ-500), multi-timeframe: a slow firm-level
  state (half-year without insider purchases, 1q/1y) qualifies the daily filing event (1d). New family: no registry
  card used insider data; the owner''s study 11 used insider counts only as features in a monthly LightGBM selection
  (different mechanism, horizon and turnover), which I name here to be transparent. Differences from dead stock
  cards: H-0009 and H-0011 traded price/volume patterns; this trades a disclosed information event with a documented
  informed counterparty, and the event set is defined by filings, not by prices. Known risks: (1) large caps react
  fast, and our entry is the open two days after a filing made after hours, so the drift may be gone (that is what
  the mechanism test checks); (2) insiders buy after declines, so short-term reversal is a confound (descriptive
  check in the falsification list); (3) events cluster in market sell-offs, making the book concentrated in some
  periods and thin in others; (4) the publication-decay check has only 2009-2012 before the 2012 reference, a short
  pre-period. The 182-day primary is the middle of the only three windows the dataset offers, not a tuned value.
  No stock-attached field beyond three insider counts (RAM cap 6). No forward data, so at most G4.'
