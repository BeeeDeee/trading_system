id: H-0012
version: 1
title: Non-routine insider purchase drift - LIQ-500 market-neutral, long stocks with a first open-market insider
  purchase filing after a half-year without any, hold 5 days
author_agent: scout
family: insider-purchase-information
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who sell or do not buy during the days after the filing because they have not processed
    the Form 4 (it is one of hundreds filed daily and rarely covered for large caps unless large), and liquidity
    sellers in stocks that have often been falling before insiders buy.
  why: 'Open-market insider purchases are one of the few voluntary, costly signals insiders send: buying with their
    own money (unlike sales, which are driven by diversification, liquidity and option exercises). Cohen, Malloy
    and Pomorski (2012) show that the information is concentrated in non-routine (opportunistic) trades, while routine
    trades that recur on a calendar carry none. We cannot identify individual insiders, so we use a firm-level proxy
    for non-routine buying on a slow timeframe: the first purchase filing after a long quiet period (no open-market
    purchase filed for the firm in the prior 182 days) is a deliberate departure from the firm''s normal behaviour,
    not a plan or habit. The daily timeframe gives the entry: the filing becomes public, and attention-constrained
    investors incorporate the Form 4 slowly, so part of the repricing happens in the days after the filing rather
    than on it.'
  why_not_arbitraged: The per-event edge is small relative to the idiosyncratic risk of holding a handful of single
    names for a few days; events are sparse and clustered, so a dedicated book has uneven capacity and exposure;
    most quant users fold insider data into slow monthly composites (as the owner's study 11 did) rather than trading
    the filing-day drift; and separating routine from opportunistic trades requires work most attention-constrained
    investors do not do.
signal:
  description: 'Data: daily matrices of the sharadar_insiders fields ins_buy_n_91d, ins_buy_n_182d, ins_buy_n_365d
    (number of open-market purchase transactions filed in the trailing 91/182/365 calendar days, as the loader makes
    them usable, i.e. from the day after the SEC filing date), plus sharadar_sep total returns and the LIQ-500 point-in-time
    membership. EVENT on day t for stock j (computed after the close of t with data up to t): j is a LIQ-500 member
    and tradable on t, ins_buy_n_<Q>d[t-1, j] == 0 (no purchase filing usable in the quiet window of Q calendar
    days before), and ins_buy_n_91d[t, j] > 0 (a new purchase filing became usable on t). Q is the parameter quiet_window_days
    in {91, 182, 365}, mapped to the field with that window. NaN in either field (before the insider data starts,
    or missing) means no event. BOOK: after the close of t, the long set L_t = all stocks with an event on any of
    the last H trading days t-H+1 .. t (H = hold_days) that are still tradable; a stock re-triggering during its
    hold simply stays in the set (no extension beyond H days from its latest event). Each name in L_t gets weight
    min(0.05, 0.5 / |L_t|), so the long leg is at most 0.5 and at most 5 % per name. The short leg is an equal-weighted
    short of all other LIQ-500 members tradable on t (not in L_t), scaled so its total equals minus the long leg
    total (dollar neutral, gross <= 1). If L_t is empty the book is flat (cash). Trades at the open of t+1; a name
    leaves at the open after its H-th holding day. Delistings take the terminal return of the dataset. Rebalanced
    daily but only event entries/exits and the matching short leg size change.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    quiet_window_days:
      grid:
      - 91
      - 182
      - 365
      value: 182
  timeframes:
  - 1d
  - 1q
  - 1y
mechanism_test:
  event: 'Stock j (LIQ-500 member, tradable) has its first open-market insider purchase filing usable on day t after
    a quiet window: ins_buy_n_182d[t-1, j] == 0 and ins_buy_n_91d[t, j] > 0. Side +1 (the stock should outperform
    the other universe members from the next open).'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
