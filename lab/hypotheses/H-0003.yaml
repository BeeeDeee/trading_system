id: H-0003
version: 1
title: Volatility-timed equity exposure - SPY when short-term SPY volatility is below its long-run level, IEF otherwise,
  weekly
author_agent: scout
family: volatility-managed-exposure
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  kind: instruments
mechanism:
  counterparty: Investors whose risk-bearing capacity is reduced exactly when volatility spikes (levered and margin-constrained
    investors, funds hit by redemptions, VaR- and drawdown-limited desks) sell equities into high-volatility periods
    without being compensated proportionally; and static-weight investors who keep the same equity share regardless
    of the risk they are carrying, thereby holding the most variance when its compensation is lowest. The premium
    is slow to adjust because expected-return beliefs move more slowly than realized volatility.
  why: 'Equity volatility is highly persistent at horizons of weeks, but the equity premium does not rise in proportion
    to it: when short-term realized volatility jumps above its long-run level, expected returns per unit of risk
    (mean/variance) are low, and when volatility is calm they are high (Moreira and Muir 2017; Fleming, Kirby and
    Ostdiek 2001). A rule that holds equities only while short-term volatility is not elevated, and Treasuries otherwise,
    therefore earns most of the equity premium with a lower share of equity variance, which raises the risk-adjusted
    return relative to a static 60/40 mix that keeps a constant equity weight through volatility spikes.'
  why_not_arbitraged: Exploiting it means increasing equity exposure in calm markets and cutting it after volatility
    spikes, which large balanced mandates and benchmarked managers cannot do (tracking-error limits against a static
    policy portfolio), and which looks pro-cyclical and loses during sharp V-shaped rebounds that occur while volatility
    is still high. The edge is a modest Sharpe improvement, not an arbitrage, and it carries the risk of whipsaw
    around volatility regime changes.
signal:
  description: 'Inputs: daily total returns of SPY and IEF from sharadar_sfp. Daily close-to-close total return
    of day d is r_d = (1 + ret_co_d) * (1 + ret_oc_d) - 1, where ret_co_d is previous close to open of d and ret_oc_d
    is open to close of d. Decision dates: the last trading day of each calendar week (XNYS calendar), after its
    close t, using only data up to and including that close. On each decision date compute sigma_short = sample
    standard deviation of SPY daily log total returns over the last short_window_days trading days ending at t,
    and sigma_long = the same over the last long_window_days trading days ending at t (days without a SPY bar, e.g.
    vendor-error days dropped by the loader, are simply skipped; the window then extends back to collect the required
    number of valid returns). Rule: if sigma_short <= sigma_long the target portfolio is 100 % SPY, 0 % IEF ("calm"
    state); otherwise 100 % IEF, 0 % SPY ("stressed" state). There is no other threshold, no leverage and no cash
    leg; gross exposure is always 1. Trades are executed at the open of the next trading day t+1; positions are
    held until the next decision date that changes the state (no trade when the state is unchanged). Start: SPY
    history from the beginning of its data period is used only to fill the volatility windows; the strategy is evaluated
    from the first decision date on which IEF has a price and both windows are full. If either instrument has no
    tradable bar at the open of t+1, the previous holdings are kept and the switch is executed at the next open
    on which both are tradable.'
  params:
    long_window_days:
      grid:
      - 126
      - 252
      - 504
      value: 252
    short_window_days:
      grid:
      - 10
      - 21
      - 42
      value: 21
data_requirements:
- dataset: sharadar_sfp
  description: SPY daily total returns; history before IEF exists is used only to fill the volatility windows.
  fields:
  - ret_co
  - ret_oc
  frequency: 1d
  instruments:
  - SPY
  period:
  - '1999-01-04'
  - '2020-12-31'
- dataset: sharadar_sfp
  description: IEF daily total returns, the defensive asset in the stressed state.
  fields:
  - ret_co
  - ret_oc
  frequency: 1d
  instruments:
  - IEF
  period:
  - '2002-07-30'
  - '2020-12-31'
holding_period:
  rebalance: weekly
  typical_days: 40
market_exposure: long_only
references:
- cite: Moreira, Muir (2017) Volatility-Managed Portfolios, Journal of Finance
  year: 2017
- cite: Fleming, Kirby, Ostdiek (2001) The Economic Value of Volatility Timing, Journal of Finance
  year: 2001
- cite: Cederburg, O'Doherty, Wang, Yan (2020) On the performance of volatility-managed portfolios, Journal of Financial
    Economics
  year: 2020
falsification_criteria:
- Net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the one-sided 90 % bootstrap CI of the Sharpe difference
  includes 0.
- Fewer than 75 % of the neighbor configurations (short window 10 or 42, long window 126 or 504, and their combinations)
  beat the 60/40 Sharpe.
- Fewer than 2 of 3 dev sub-period blocks beat 60/40, or one block contributes more than 60 % of the log return.
- Sharpe at costs x2 below the 60/40 Sharpe, or below the 95th percentile of random-entry runs with the same switching
  frequency and SPY exposure.
- 'Mechanism: SPY''s annualized mean daily return divided by its variance (reward per unit of variance) over the
  days spent in the calm state is not higher than over the days spent in the stressed state; then volatility does
  not forecast lower risk-adjusted equity returns and the rule is not volatility timing.'
- 'Mechanism: with IEF replaced by zero return (cash) in the stressed state, the strategy''s Sharpe is not above
  SPY buy-and-hold Sharpe; then the result is driven by Treasury flight-to-quality returns, not by avoiding equity
  variance.'
notes: 'Gap named in prior_studies.md ("volatility-managed exposure" not tried). Different from the killed trend
  filters (study 2: 9-ETF inverse-vol allocation with per-class trend filters, whose loss vs 60/40 came from holding
  many low-Sharpe risk assets; study 9: crypto SMA filter): the signal here uses no price level or past return,
  only the ratio of short- to long-run realized volatility, and the risky asset is SPY alone. The threshold is the
  natural one (short-run vol equal to its own long-run level, computed point-in-time), not tuned. Binary switching
  rather than continuous 1/variance scaling is chosen so that the strategy has discrete position entries (expected
  several regime switches per year, i.e. well over 100 entries and over 36 trading decision dates), and no leverage
  is needed. Cederburg et al. (2020) is cited as the main counter-evidence: volatility management does not improve
  Sharpe out of sample for many factors, although the market factor is among the better cases; the literature prior
  (+20 trials) is accepted. Known risk: in the dev period stock-bond correlation is mostly negative, so IEF tends
  to rally in the stressed state; the second mechanism criterion is there to separate that from the volatility-timing
  effect. Costs: SPY and IEF are among the most liquid ETFs, a few switches per year.'
