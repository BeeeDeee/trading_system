falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the cheapest/richest-currency events at 60 sessions is not above
  the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the abnormal return has the wrong sign in two of the three dev sub-periods, or the latest third of
  dev is negative (decay or regime change, K-0060).'
- 'Mechanism shape: the abnormal return at 60 sessions is not larger than at 5 sessions. Slow convergence toward
  PPP must build with the horizon; a result concentrated in the first sessions would be short-term reversal, not
  value.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbours (lookback 4 and 6 years, n_per_leg 1 and 3, and their combinations)
  beat T-bills, or the strategy no longer beats T-bills with costs doubled.'
- 'Publication decay: excess Sharpe after the 2013 publication of the value-everywhere factor is below half of the
  excess Sharpe before it.'
- 'Concentration: one dev third carries more than 60 % of the log return (one currency episode, not a premium).'
notes: 'Fit to the brief. The brief asks for a 6-24 month horizon and cross-asset signals. The signal comes from
  FRED macro series (interbank noon fixings), and the trades are US-listed currency trusts that also earn deposit
  interest. The underlying exposure is the same currency, so this is only the closest fit to "signal from one market,
  trade in another". I chose it over truly cross-asset macro timing (term spread into sectors or stocks against
  bonds, credit or real yields into equities) for two reasons. First, a single US macro series gives only a handful
  of independent episodes in 1998-2020, and the lab has seen those designs end inside the placebo cloud (H-0055,
  H-0061, K-0071). Second, the lab''s cross-market information-diffusion claims came out flat or wrong-signed (K-0072),
  and Cenedese, Payne, Sarno and Valente (2016) find that equity return differentials tell little about exchange
  rates, so I dropped the equity-to-FX rebalancing variant. Per-currency value signals give six partly independent
  cycles in an asset class the lab has not tested apart from H-0044 (a month-end flow, different mechanism and horizon).
  The holding horizon fits: a 5-year-average deviation changes slowly, so a currency typically stays in a leg for
  many months. FRED spot is used instead of the ETF prices because the ETF NAVs carry accrued interest (they would
  mix carry into the value score), and because FRED gives the full 5-year history before the trusts listed. Family.
  The value score is mechanically a long-horizon reversal of the exchange rate, so I file it under the existing
  long-term-reversal family (H-0060, cross-country equity ETFs) rather than a new name. The difference from H-0060:
  the anchor here is a fundamental one (purchasing-power parity: goods arbitrage and trade-flow adjustment), not
  equity overreaction, and the traded asset is the currency alone, without local equity risk. H-0060''s failure
  is a prior against, because the FX component is part of USD country returns. That is why the card states the latest-third
  sign and the horizon shape as kill conditions. Known weaknesses, stated in advance. (1) The score is nominal:
  no daily CPI exists in the catalog, and a monthly CPI series would not fit the daily-dataset rule. Persistent
  inflation differentials (Japan and Switzerland below the US, Australia above) bias the score: low-inflation currencies
  look rich because of trend appreciation that is consistent with PPP. Measuring against the trailing average, not
  the 5-year point change, halves that bias but does not remove it. (2) Carry is not separated. The legs earn their
  deposit rates through the trusts'' total returns, and rich currencies can be high-yield ones, so the book may
  pay negative carry in overshoot phases. That is part of why the premium exists, but it means the result mixes
  value and carry. (3) Borrow costs of shorting currency trusts are not modelled. (4) Six instruments is little
  breadth. Expected numbers (K-0053, K-0064, K-0071). If the extreme-cheap minus extreme-rich spread earns a literature-sized
  4-6 %/y, each side earns about 2-3 %/y against the peers, about 0.5-0.7 % per event at 60 sessions. That is several
  times a currency-ETF round trip (roughly 10-20 bps at these liquidity tiers). The 60-session vol of one currency
  against the mean of four peers is about 4 %, and picks persist across months, so effective independent windows
  number about 60-90. That puts the placebo 95 % bar near 0.6-0.7 %, about where the expected effect sits: a coin
  flip if the premium is at its literature size. A miss with the right sign, growing with the horizon and positive
  in every third, should be read as cannot-tell (K-0026, K-0034). The book holds two cheap against two rich at 0.25
  each, with vol around 4 %/y, so the expected net Sharpe is about 0.4-0.5 against the bar of 0.5. The likely strategy
  death is the absolute Sharpe bar. Exposure and counts: always invested at gross 1 (mean exposure about 1.0), and
  about 166 monthly rebalances with non-zero turnover because weights are reset every month (continuous-exposure
  rule, K-0018). There are no shorts of non-universe instruments and no date literals. ETFs have no forward data,
  so G4 is the ceiling.'
