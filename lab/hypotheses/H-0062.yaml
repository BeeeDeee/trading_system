  kind: instruments
mechanism:
  counterparty: Trend-following and carry capital that extrapolates multi-year currency moves and pushes rates past
    fundamentals (overshooting). Return-chasing international portfolio flows that buy the currency of markets that
    recently did well. Price-insensitive flows such as corporate hedging programmes, reserve managers and official
    intervention that do not trade on valuation. Over the convergence horizon these holders give back the overshoot
    to whoever holds the cheap currency against the rich one.
  why: 'Exchange rates drift far from purchasing-power parity for years and then revert slowly. The PPP literature
    puts the half-life of real exchange-rate deviations at roughly three to five years (Rogoff 1996), so a currency
    that is far below its own multi-year average level tends to appreciate against one far above it over the following
    one to three years. Asness, Moskowitz and Pedersen (2013) and Menkhoff, Sarno, Schmeling and Schrimpf (2017)
    document this currency value premium in the cross-section of currencies. The claim here: among six G10 currencies,
    the one whose USD spot rate is furthest below its trailing 5-year average outperforms the other currencies over
    the next months, and the one furthest above underperforms. The mechanism is slow convergence toward a fundamental
    anchor (relative goods prices and trade flows), not a quick reversal of a recent move.'
  why_not_arbitraged: The horizon is years and deviations can widen for a long time before they close. Rich currencies
    are often the high-yield ones during the overshoot, so the value position can pay negative carry. Currency value
    has low Sharpe on its own and large drawdowns in trend phases, which makes it hard to hold for capital measured
    on short horizons (career risk). The capacity of each currency is huge, but few allocators hold a pure multi-year
    FX value book, and banks' balance-sheet constraints limit long-horizon FX positions.
signal:
  description: 'Inputs: FRED noon New York fixings from dataset fred_macro, keys DEXUSEU, DEXJPUS, DEXUSUK, DEXUSAL,
    DEXCAUS, DEXSZUS. Convert each one to the USD price of one unit of the foreign currency: P_EUR = DEXUSEU, P_JPY
    = 1/DEXJPUS, P_GBP = DEXUSUK, P_AUD = DEXUSAL, P_CAD = 1/DEXCAUS, P_CHF = 1/DEXSZUS. Map each currency to its
    ETF: EUR->FXE, JPY->FXY, GBP->FXB, AUD->FXA, CAD->FXC, CHF->FXF. FRED rows use clock next_morning: at the decision
    after the close of XNYS session t only fixings stamped before t, as delivered by the loader, are used. Missing
    fixings (holidays) are filled forward for up to 5 sessions, never further. Value score at decision date t for
    currency i: v_i = mean(log P_i over the last lookback_years x 252 sessions of available fixings up to the last
    usable fixing) - log P_i(last usable fixing). A high v means the currency is cheap against its own multi-year
    average. If a currency has fewer than 90 % of the window''s sessions with a fixing, or its ETF has no tradable
    bar at t, it is left out at that date (raise an error if fewer than 5 currencies remain; that should not happen
    after the period start). Rebalance: monthly, after the close of the last XNYS session of each calendar month.
    Rank the eligible currencies by v. Long the n_per_leg currencies with the highest v and short the n_per_leg
    with the lowest v, each with weight +0.5/n_per_leg (long) or -0.5/n_per_leg (short), so gross = 1.0 and net
    = 0 (dollar-neutral: the book is a set of cross-rate positions). Weights are reset to these targets at every
    monthly rebalance even when the ranks did not change (small re-equalising trades). Orders are filled at the
    open of the next session; positions are held until the next monthly rebalance. P&L is the ETFs'' total returns
    (spot move plus the trusts'' deposit interest minus fees), so the carry of each leg is included and not modelled
    separately. No other instruments are traded.'
  params:
    lookback_years:
      grid:
      - 4
      - 5
      - 6
      value: 5
    n_per_leg:
      grid:
      - 1
      - 2
      - 3
      value: 2
  selection_procedure: 'Primary configuration fixed before any data: 5-year lookback is the convention of the PPP
    and currency value literature (Asness, Moskowitz and Pedersen use a five-year horizon); 2 per leg is one third
    of the universe per side. The grid holds one neighbour on each side of each value; nothing was tuned.'
  timeframes:
  - 1d
  - 1mo
  - 1y
mechanism_test:
  event: At each monthly rebalance (after the close of the last XNYS session of the month), among the six currencies,
    the one with the highest value score v (spot furthest below its trailing 5-year average log level) is an event
    with side +1, and the one with the lowest v (furthest above) is an event with side -1. The other four currencies
    are unmarked peers on that date. One long and one short event per month, about 166 months in the dev window,
    so about 330 events on about 166 dates.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
