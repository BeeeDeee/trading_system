falsification_criteria:
- Net Sharpe of the book on dev below 0.5, or the bootstrap bound of its Sharpe over T-bills not above zero.
- Mechanism event (new entries into the long or short leg of the daily cohort) earns no 5-day side-adjusted abnormal
  return above the 95th percentile of the time-shifted placebos, or its gross per event is below the round-trip
  cost.
- The mechanism event has the predicted sign in fewer than two of the three dev blocks; since the first block is
  expected to be mostly empty from model warm-up, a negative latest block (2022) refutes the claim.
- Fewer than 75 % of the grid neighbors of horizon 5 (3, 7) and leg_frac 0.3 (0.2, 0.4) beat T-bills with Sharpe
  0.5, or the median neighbor Sharpe is below 0.7 of the primary.
- 'Net Sharpe at doubled costs below 0.5: the effect is not large enough for a daily-cohort taker book on alt perps.'
notes: 'Why this is not a refile: H-0134 (same family) scored a gbm on momentum x basis over 21-day weekly cohorts
  and its event was the disagreement between gbm and ridge picks; it never ran the plain score or a book. H-0124
  (VIX-switched momentum) never produced a score. This card is the unconditional linear control both lessons asked
  for, on a different horizon (5 days) with daily cohorts. K-0182 warns against trading the ridge side of H-0134
  as a mirror: this card does not use the sign of that comparison, its features and horizon differ, and its claim
  (positive continuation) comes from the published literature, not from that result. Study 9 found no positive long-only
  altcoin momentum in 2022-2026; that was long-only in a falling alt market, and this card is dollar-neutral on
  dev only; the 2023-2026 holdout stays untouched. Family short-term-momentum is reused on purpose (H-0029, H-0124,
  H-0134), and the reference adds the literature trials. Warm-up (K-0163): with an expanding window on a panel that
  starts 2019-12 and needs 60 days of volume history, the first third of dev (2020) will hold few or no events,
  so both later blocks have to be positive. Universe (K-0131, K-0213): perps listed in 2020 number 78, so 15 scored
  members should be reached early in 2020; if the gate does not pass the crypto_top_n universe on daily perp data,
  the Builder''s fallback (top 30 by trailing 30-day quote volume) is the intended definition. Expected size: event
  count about 2-4 new leg entries per side per day on about 700 scored dates (several thousand events). Round trip
  on top-30 perps is about 20-35 bps; with daily cohorts and persistent momentum scores the cost drag should be
  near 8-12 % a year, so the book needs a gross spread of well over 20 % a year to survive doubled costs. Expected
  by leg (K-0207): the long leg should carry the 2021 boom block and the short leg the 2022 sell-off; a book that
  earns only on one leg in one block is the boom- and-bust regime reading of K-0006, not momentum. Requested report
  (not a kill criterion, the judge cannot compute it): the mean ridge coefficients on F2 and F3 across refits; if
  they are not positive, the model learned something other than continuation even if the book earns. Most likely
  deaths: momentum crashes on rebound days in 2022 make the latest block negative; funding on long winners eats
  the long leg; or the placebo bar sits above cost because the coins are so volatile (a cannot-tell).'
