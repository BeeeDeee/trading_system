id: H-0186
version: 1
title: Linear short-term momentum in liquid crypto perps, learned - top-30 Binance perps dollar-neutral, walk-forward
  ridge on 1-28 day returns, daily 5-day cohorts
author_agent: scout
family: short-term-momentum
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Holders who sell recent winners too early and buy recent losers ("buy the dip", the disposition
    pattern of retail crypto accounts), and passive quoting that leans against a sustained one-sided flow; both
    delay the adjustment of relative prices and give it up to whoever holds the winners and shorts the losers over
    the following days.
  why: 'In the cross-section of liquid cryptocurrencies, returns over the past one to four weeks predict the next
    week''s return with a positive sign (Liu, Tsyvinski and Wu 2022: a weekly-rebalanced momentum factor is one
    of three factors that price the crypto cross-section). The proposed reason is slow price adjustment to coin-specific
    news in a market dominated by retail holders whose attention moves in waves: a coin that starts to outperform
    draws attention, flows and listings coverage over the following days, so its relative move continues for about
    a week. This card asks the plain, linear version of that claim on Binance USD-M perps, which the lab has never
    scored (H-0124 produced no scores, H-0134 only tested a gbm-versus-ridge disagreement on a monthly horizon).
    The weights on the 1-day, past-week and weeks-2-4 returns are learned walk-forward by a ridge regression instead
    of being chosen by the Scout, so the lookback is not picked from memory of the period; volume, volatility and
    funding enter as controls for attention, risk and leverage crowding.'
  why_not_arbitraged: The spread lives in coins with 100-200 % annual volatility, so a market-neutral book has large
    idiosyncratic risk per unit of expected return; momentum crashes on sharp rebounds of beaten-down coins; long
    winners pay high funding on perps (charged by the engine) while short losers often pay negative funding in sell-offs;
    capacity in alt perps is small, and before perps shorting alts was hardly possible.
signal:
  description: 'Data: binance_perp_1d, daily bars closing 00:00 UTC. Universe: the point-in-time top 30 perps by
    30-day quote volume (crypto_top_n, n = 30), BTC and ETH included as ordinary members. Decision after the 00:00
    UTC close of day t using data up to that close only; trades at the open of day t+1 (the same 00:00 UTC timestamp).
    Features per member on day t, each computed from the coin''s own perp data and then z-scored across the scored
    members of date t with the framework helper: (F1) total return of day t; (F2) compounded total return from the
    close of t-7 to the close of t-1; (F3) compounded total return from the close of t-28 to the close of t-7; (F4)
    standard deviation of daily total returns over t-27..t; (F5) log of the mean quote volume over t-6..t divided
    by the mean quote volume over t-59..t; (F6) sum of the daily funding rate (extras funding, the rate a long pays)
    over t-6..t. A member is scored on day t only if it has at least 21 valid daily returns in t-27..t, at least
    45 valid volume days in t-59..t and funding on at least 5 of the last 7 days (missing days of the window are
    skipped, not filled); otherwise it gets no score that day. Label (framework): cross-sectional rank of the total
    return from the open of t+1 to the open of t+1+horizon. Model: framework ridge (alpha = 1.0, fixed) through
    lab.framework.ml.walk_forward, expanding window, refit every 63 rows, purge and minimum training sample owned
    by the framework; rows before the first fit have no score. Book: every day t a new cohort is formed from the
    scores of day t: rank the scored members, long the top leg_frac of them and short the bottom leg_frac (number
    per leg = floor(leg_frac x scored members), at least 3), equal weight inside each leg, each leg sized 0.5 /
    horizon of equity, so a cohort is dollar-neutral with gross 1 / horizon. Each cohort is held for horizon days
    and closed at the open of t+1+horizon. The book is the sum of the live cohorts (gross at most 1; the engine
    nets overlapping weights). If fewer than 15 members are scored on day t, or no model has been fitted yet, no
    cohort is formed that day and its slice stays in cash. A coin that leaves the point-in-time universe while held
    is closed at the next decision row (the engine refuses weights outside the universe), its slice stays in cash
    until the cohort expires. Funding is charged by the engine to every held position.'
  params:
    horizon:
      grid:
      - 3
      - 5
      - 7
      value: 5
    leg_frac:
      grid:
      - 0.2
      - 0.3
      - 0.4
      value: 0.3
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: On decision day t, a perp enters the long leg (side +1) or the short leg (side -1) of the new 5-day cohort
    formed from the ridge score, having not been in that leg of the cohort formed on day t-1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - F1 total return of the last day t (one-day reversal or continuation; separates liquidity-driven last-day jumps
    from the slower weekly drift)
  - F2 compounded return from t-7 to t-1 (the past week, the horizon at which crypto momentum is documented)
  - F3 compounded return from t-28 to t-7 (weeks two to four, the slower part of the attention wave)
  - 'F4 28-day standard deviation of daily returns (risk control: the leg should not simply be the most volatile
    coins)'
  - F5 log ratio of 7-day to 60-day mean quote volume (attention and flow arriving in the coin)
  - 'F6 7-day sum of perp funding (leverage crowding: winners carried by levered longs may give back, and the book
    pays this rate on its longs)'
  horizon_days: 5
  model: ridge
  retrain_every_days: 63
  why_not_linear: Deliberately linear. The claim is a monotone continuation of relative returns over one to four
    weeks, which a ridge expresses directly; the learned part is only the relative weight of the 1-day, past-week
    and weeks-2-4 returns and of the three controls, so the Scout does not pick a lookback. The lab's six disagreement
    cards (K-0182), including the crypto momentum-by-basis card H-0134, found no nonlinear gain over a ridge, and
    the Librarian asked for the linear form as the primary claim (K-0182, H-0134 lesson, K-0119). A tree on the
    same features (for example momentum continuing only on rising volume) is a later card if and only if this linear
    score shows a real effect; proposing it first would again test an interaction on top of an unscored main effect.
