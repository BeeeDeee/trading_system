falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return from the open of t+1 to the close of t+5 is not above the 95th percentile
  of the 200 time-shifted placebos, or is negative: release-session abnormal volume carries no visibility premium
  in LIQ-500.'
- 'Mechanism: the latest third of the dev event sample has a negative side-adjusted abnormal return at 5 sessions
  (decay or absence, K-0060): the card counts as refuted even if the pooled test passes.'
- 'Mechanism: gross abnormal return per event at 5 sessions below the round-trip cost of the event legs: not tradable
  in this form.'
- 'Mechanism shape: if the 10- and 21-session abnormal returns are of opposite sign to the 5-session one, the effect
  is temporary price pressure, not the persistent demand of a widened investor base, and the visibility story is
  wrong.'
- 'Strategy: net Sharpe on dev below 0.5, or the one-sided bootstrap bound of Sharpe minus T-bill Sharpe not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbors (leg_quantile 0.2/0.4, hold_days 3/7 and combinations) beat the
  T-bill bar, or the book fails at doubled costs.'
notes: 'Brief fit: US single stocks, cross-sectional, 5-session hold, mechanism test declared. Why this family and
  not a new one: it is the visibility mechanism of H-0014 (high-volume-visibility-premium), so its trials count
  there. Why it is not a re-run of H-0014: H-0014 sorted ALL LIQ-500 stocks weekly on abnormal volume with no event
  and found nothing; its lesson''s open question was that a volume effect ''needs volume tied to an identified event''.
  Here the event is a real 8-K release session (no date prediction, so the hit-rate problem of H-0023/H-0026/H-0032
  does not arise), only announcers are compared, and only with announcers of the same reaction sign and size tercile.
  Why it is not post-earnings-announcement-drift again: the side does not follow the sign of the reaction (long
  and short legs both contain good and bad news in equal bins), so PEAD continuation cancels to first order; the
  PEAD stop rule (H-0031) is about following the reaction sign, which this card does not do. Both sides are marked,
  so the placebo mean should sit near zero (K-0025), and the sort is on volume relative to the stock''s own history,
  so the marked and unmarked sets should not differ much in beta (K-0074). Expected size (K-0053, K-0064): the literature
  finds the premium strongest in smaller firms; for LIQ-500 I expect roughly 15-35 bps gross per event over 5 sessions
  against a round trip of about 6-12 bps (cost tiers 3/6 bps half-spread by liquidity rank). With about 1,000 marked
  events a year (8-K coverage is incomplete, K-0035) and 1/30 slots, a 25 bps gross effect gives roughly 5 %/y net
  on about 6 %/y volatility (Sharpe near 0.8); a 15 bps effect gives a Sharpe near 0.3, which fails the T-bill bar.
  So the most likely deaths are the cost ratio or the strategy bar, or the latest-third decay that K-0060 predicts.
  Timing: all inputs are known at the close of the reaction session (the 8-K flag is set on the first session whose
  close is at or after the EDGAR acceptance time); entry at the next open. Publication check: GKM (2001) falls before
  the first 8-K event (2005), so there is no pre-publication window for it; Garfinkel-Sokobin (2006) leaves only
  about a year before publication, so the publication-decay ratio will be noisy. Events start about 2005-08 (252-session
  pool after the 8-K start). The hedge basket of the 50 most liquid members is banded at 5 % of equity to avoid
  the daily re-equalising turnover suspected in H-0019 and H-0031.'
