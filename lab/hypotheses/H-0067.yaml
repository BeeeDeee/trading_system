id: H-0067
version: 1
title: Earnings-release volume visibility premium - LIQ-500 dollar-neutral, long announcers with abnormally high
  release-session volume, short abnormally low, matched on reaction sign and size, hold 5 days
author_agent: scout
family: high-volume-visibility-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors who set prices on the release day without accounting for the later demand of newly attentive
    buyers: the sellers into the post-release demand of investors who learned about the stock through its heavy
    trading (late-arriving attention buyers pay up), and holders of quiet announcers who are not replaced by new
    buyers. In the short leg, the counterparty is the attention premium of the quiet announcer that fails to materialize.'
  why: 'Investor-recognition / visibility (Merton 1987; Gervais, Kaniel and Mingelgrin 2001): a stock that trades
    unusually heavily becomes visible to more investors, the investor base widens and demand rises over the following
    days and weeks, so price rises. At an earnings release every announcer gets some attention, but how much the
    release-session volume exceeds the stock''s own normal volume measures how much NEW attention (and opinion divergence,
    Garfinkel and Sokobin 2006) the release created. Holding the size and the sign of the price reaction fixed,
    an announcer whose release drew abnormally high volume should outperform an announcer whose release drew abnormally
    little, independently of the direction of the news. Lerman, Livnat and Mendenhall report that this volume effect
    is incremental to earnings-surprise drift. The claim tested here is the one the lab left open after H-0014 (a
    volume effect needs volume tied to an identified event): real 8-K release sessions, a volume measure relative
    to the stock''s own history, and both sides compared inside the same reaction-sign and reaction-size bin, so
    earnings drift (PEAD) cancels to first order.'
  why_not_arbitraged: The premium per event is small (tens of basis points over a week) next to the idiosyncratic
    risk of a stock that just reported, so only a diversified, high-turnover book can collect it and spread costs
    eat a large share; the release-session volume is an ambiguous signal (it also accompanies bad news and disagreement),
    and the effect has to be harvested from both a long and a short leg across thousands of small, clustered positions
    during earnings seasons, which ties up capacity for a modest Sharpe.
signal:
  description: 'Inputs per stock j and session t: total return r = (1+ret_co)(1+ret_oc)-1, dollar_volume, tradable,
    and ea_reaction_day (sec_8k_item202). Decisions after the close of session t using data up to that close; trades
    at the open of t+1. (1) Event candidates: ea_reaction_day[t,j] == 1, j is a LIQ-500 member and tradable at t,
    and j had no candidate in the previous hold_days sessions (a second Item 2.02 filing within the hold is ignored).
    NaN ea_reaction_day = no event. (2) Reaction size: e = r[t,j] minus the equal-weight mean r of all LIQ-500 members
    at t; sigma = standard deviation of the same market-adjusted daily return of j over sessions t-68..t-6 (63 sessions,
    skipping the 5 sessions just before the release); z = e / sigma. Require at least 50 valid sessions in the window,
    otherwise no event. (3) Abnormal volume: AV = ln(dollar_volume[t,j]) - ln(mean dollar_volume[j] over t-68..t-6),
    same validity rule. (4) Matching bins: the reference pool is all event candidates of LIQ-500 members in sessions
    t-252..t-1 (strictly before t). Cut |z| of the pool into terciles; the candidate''s bin is (sign of z, |z| tercile
    of the pool cutpoints), 6 bins. Within its bin, compare the candidate''s AV with the AV of pool candidates in
    the same bin: AV at or above the (1 - leg_quantile) quantile -> side +1 (long); AV at or below the leg_quantile
    quantile -> side -1 (short); otherwise no event. A bin with fewer than 30 pool candidates gives no event. Before
    the pool covers 252 sessions of 8-K data, no events. (5) Positions: each event opens at the open of t+1 with
    a fixed slot of side x 1/30 of equity and is held for hold_days sessions (closed at the open after the close
    of t+hold_days). Slots are not resized while held. If opening the day''s new slots would push gross (events
    plus hedge) above 1, the new slots of that day are scaled down equally to fit. A position whose stock leaves
    the universe or becomes untradable is closed at the next decision; delistings take the engine''s terminal return.
    (6) Hedge: the net dollar exposure of the event slots is offset with an equal-weight basket of the 50 most liquid
    LIQ-500 members by liq_rank (excluding names with an open event slot), rebalanced only when the hedge differs
    from minus the event net by more than 5 % of equity, so the book stays dollar-neutral within the band without
    daily re-equalising of the event slots. With no open event slots the book is in cash.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    leg_quantile:
      grid:
      - 0.2
      - 0.3
      - 0.4
      value: 0.3
  selection_procedure: Primary configuration fixed ex ante (round values, no tuning); the grid exists only for the
    G2 neighbor test.
  timeframes:
  - 1d
mechanism_test:
  event: Session t is a real 8-K Item 2.02 reaction session of LIQ-500 member j (no candidate for j in the previous
    5 sessions), and j's release-session abnormal dollar volume (log of day-t dollar volume over its 63-session
    mean from t-68 to t-6) is in the top 30 % (side +1) or bottom 30 % (side -1) of the abnormal volumes of the
    past 252 sessions' release candidates that fall into the same bin of reaction sign and reaction-size tercile
    (market-adjusted day-t return divided by its own 63-session volatility).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
