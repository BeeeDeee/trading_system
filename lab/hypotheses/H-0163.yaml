falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events is not above the 95th percentile of the time-shifted
  placebos, or its gross per event is below the round-trip cost of the marked ETF.'
- 'Mechanism: the latest third of the dev period has the wrong sign (K-0060 decay), or fewer than two of three thirds
  share the predicted sign.'
- 'Mechanism: the effect has the opposite sign (ETFs move away from the feared side after excess protection buying):
  that is a fear premium being paid, not information, and refutes this card; no sign flip may be refiled as the
  same idea.'
- 'Mechanism: the 1-day horizon is negative and the effect only appears at 10 days (slow drift or stress rebound,
  not options-led news).'
- 'Strategy: net Sharpe on dev below 0.5 or not above T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  below zero.'
- 'Robustness: fewer than 75 % of the z_entry (1.5, 2.5) x hold_days (3, 7) neighbors beat T-bills, or Sharpe below
  T-bills at doubled costs.'
notes: 'Brief: short horizon, cross-asset. The signal is read in one market (listed options, via the CBOE implied-vol
  indices FRED serves) and traded in another (the ETF), across equity, EM, energy, metals, oil and FX wrappers.
  Why it is not an existing family: the variance-risk-premium-timing cards (H-0055, H-0073, H-0084, H-0155, VIXY
  cards) bet that rich implied vol pays a premium to its seller or to the holder of the feared asset, at levels
  and over months; this card bets the opposite sign at days, on the change in implied vol that the day''s price
  move does not explain, as information flowing from options to the underlying. If the result comes out with the
  premium sign, criterion 3 says this card is refuted and the evidence belongs to the premium reading. It is not
  daily lead-lag between ETFs (mrel): the trigger is a conditional excess move in a derivative market, not a lagged
  return. It is not stress rebound (K-0084): the price-move control removes the day''s own drop, and the excess-fall
  side gives events on calm days too. Timing caveat: the FRED vol series have clock next_morning, so an option-market
  shock of session s is acted on at the open of s+2; any information the price takes in on s+1 is lost to this card,
  which biases it against passing. Forecasts (K-0120, K-0181, lead with the pessimistic case): about 29,000 pair-sessions
  after warm-up (QQQ, IWM, USO, FXE, GLD from 2008; the six 2011 indices from about 2012-03); |eps| >= 2 on about
  2-4 % of them with the feared-side guard dropping some pairs on some dates, so about 400-900 events on 300-600
  dates (pessimistic 300), roughly 30-65 a year, each third populated (the first third only with the five early
  pairs). G1 needs at most 3 of 12 marked per date, so at least 9 unmarked peers from 2008. Round trip about 10
  bps for the marked ETF (gate tier), plus about 3 bps for the SPY hedge in the book. Gross per event: pessimistic
  0-10 bps (dies at the cost check), central 30 bps, optimistic 60 bps against a 5-day residual sd of about 3-4
  %; the placebo bar is probably 20-35 bps, so a pass needs the central case or better. Book arithmetic (K-0098,
  K-0104): 600 events x 5 sessions / 3270 sessions x 0.30 = about 0.28 mean exposure on the ETF legs (about 0.45
  gross with hedges), above the 0.20 floor but with little margin at the pessimistic count; at 30 bps net of about
  13 bps cost per event and 60 events a year the book earns about 1 % a year on a volatility of about 2 %, a Sharpe
  near 0.5, so the absolute Sharpe floor is the likely strategy death even if the mechanism passes; I state that
  now rather than tune slots later. Most likely deaths: placebo cloud (most excess vol moves are scheduled-event
  premia: elections, OPEC, ECB, with no direction), then the Sharpe floor. Instruments chosen because a CBOE vol
  index on them exists on FRED, not for past returns; the four indices discontinued in 2022 end after dev, so a
  pass could be judged in the holdout only on the seven continuing pairs; ETFs have no forward source, so the card
  can pass at most G4.'
