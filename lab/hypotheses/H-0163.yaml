mechanism:
  counterparty: ETF holders and index traders who trade on the ETF's price and the market-wide VIX and do not watch
    the option market of each asset class; option dealers whose delta hedge moves the underlying only slowly; and
    the hedgers' own counterparties in the ETF, who sell at prices that do not yet reflect the risk the options
    price.
  why: Traders with directional information, or hedgers who see a risk coming before it shows in the price, often
    act first in options because options give leverage and hide direction (Easley, O'Hara and Srinivas 1998). Option
    dealers who sell them that protection hedge only the delta, so the price of the underlying takes in the news
    slowly, while the implied volatility of the options jumps at once. Single-stock studies find that changes in
    implied volatility predict the stock's return over the next days and weeks (An, Ang, Bali and Cakici 2014).
    Here the signal comes from the options market of twelve asset-class ETFs (equity indices, emerging markets,
    energy, gold miners, silver, gold, oil, the euro), read through the CBOE volatility indices on FRED, and the
    trade is in the ETF itself. The event is not any vol jump (most come with a price move and add nothing) but
    the part of the ETF's implied-vol change that neither the market-wide VIX change nor the ETF's own price move
    on that day explains. An excess rise means option buyers paid for protection on the side this market usually
    fears (down for equity ETFs, oil and the euro, where vol rises in selloffs; the side estimated from each pair's
    own trailing spot-vol correlation), and the ETF should drift toward that side over the next week. An excess
    fall means that protection was sold or unwound and the ETF should drift the other way.
  why_not_arbitraged: The signal is noisy (most excess vol moves are scheduled-event premia or dealer inventory,
    not information), it fires a few dozen times a year spread across unrelated markets, it needs a factor model
    of each volatility index, and the short side needs ETF borrow. Desks that trade vol-versus-spot relative value
    work in the options, not in the ETF over a week. Capacity is small relative to a fund's interest.
signal:
  description: 'Pairs (ETF, implied-vol index): QQQ-VXNCLS, IWM-RVXCLS, EEM-VXEEMCLS, EWZ-VXEWZCLS, FXI-VXFXICLS,
    XLE-VXXLECLS, GDX-VXGDXCLS, SLV-VXSLVCLS, GLD-GVZCLS, USO-OVXCLS, FXE-EVZCLS. SPY with VIXCLS is the market
    factor and the hedge and is never marked. Decisions after the close of each XNYS session t, trades at the open
    of t+1. (1) Observation day. The vol series have clock next_morning, so at decision t the newest usable value
    is normally that of session t-1. Let s be the newest session for which IV_i(s), IV_i on the previous session
    with a value, VIX(s) and VIX on its previous session are all available at decision t; if s is more than 2 sessions
    before t, no event for pair i at t. (2) Inputs on s: dv_i = ln IV_i(s) - ln IV_i(previous value); dv_m = the
    same for VIXCLS; x_i = the ETF''s close-to-close total return on s (from ret_co and ret_oc) minus b_i times
    SPY''s, where b_i is the OLS beta of the ETF''s daily total returns on SPY''s over the 252 sessions ending s,
    clipped to [0, 1.5]. (3) Excess vol shock. Over the 252 observations ending the session before s (strictly before
    s; at least 200 valid ones, else no event), fit by OLS dv_i = a + c * dv_m + g * x_i + e; eps_i = (dv_i(s) -
    a - c * dv_m(s) - g * x_i(s)) / std(e). Feared side f_i = sign of the correlation between dv_i and the ETF''s
    raw daily total return over the same 252 observations; if its absolute value is below 0.10, no event for pair
    i at t. (4) Event: eps_i >= z_entry gives side = f_i (toward the feared side); eps_i <= -z_entry gives side
    = -f_i. (5) Book, event slots: each event opens a slot that holds the ETF at side * 0.30 and SPY at -side *
    b_i * 0.30 from the open of t+1 to the open hold_days sessions later. A pair with an open slot ignores new events
    until the slot closes. At most 3 slots are open; if more events arrive than free slots, take the largest |eps_i|.
    SPY legs of all slots are netted; if the sum of absolute net weights exceeds 1.0, all weights are scaled down
    proportionally. Flat (cash) otherwise. An ETF without a price on t (not yet listed, no bar) cannot be entered;
    a slot whose ETF has no bar at the scheduled exit closes at the next available open. Missing vol values are
    never filled.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_entry:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: 'Pair i is marked at decision t when the newest usable ETF-specific implied-vol change, net of the VIX
    change and of the ETF''s own SPY-residual return that day (trailing 252-observation regression), is at least
    z_entry residual standard deviations above zero (side = the pair''s feared side f_i: -1 when its vol usually
    rises in selloffs, +1 when it rises in rallies) or at least z_entry below zero (side = -f_i). SPY and the other
    unmarked ETFs of the universe are the peers.'
