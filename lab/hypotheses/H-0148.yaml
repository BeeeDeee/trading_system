falsification_criteria:
- 'G1: fewer than 300 trades in dev 2020-2022, or net Sharpe below 0.5, or the one-sided 75 % bootstrap bound of
  the mean net trade at or below zero, or max drawdown above 50 %.'
- 'G2 delay: with a one-candle later fill the net Sharpe falls below half of the primary''s. The rotation back to
  the VWAP takes tens of candles, so a front-loaded edge (the H-0035 / H-0063 shape) would contradict the mechanism.'
- 'G2 costs: net Sharpe at doubled costs is not positive.'
- 'G2 random timing (owner criterion): the same trades placed at random times do as well, i.e. the strategy does
  not beat the 95th percentile of the judge''s random-entry runs. The owner''s stricter version, the same trades
  (instrument, side, holding time) placed at random 5m candles of the same UTC session, should be reported as a
  diagnostic; if those earn as much, the edge is the session (its volatility or drift), not the band test.'
- 'G2 neighbors: fewer than 75 % of the neighbors (confirm_candles 0 / 6, target_frac 0.25 / 1.0 and their combinations)
  have positive net Sharpe, or their median Sharpe is below 0.7 of the primary''s. confirm_candles 0 is the owner''s
  second entry variant (enter at the test candle''s close, stop low[b] - 0.25 ATR); target_frac 1.0 is the owner''s
  opposite-band target.'
- 'G2 sub-periods: fewer than two of three dev thirds positive, or one third carries more than 60 % of the return.'
- 'Mechanism (owner criterion, diagnostic): split trades by the tercile of their session''s full UTC range ((session
  high - session low) / session open, known only after the session, never used by the signal; terciles per instrument
  over dev). The balanced-day mechanism predicts the fade pays on bottom-tercile (rotational) sessions and loses
  on top-tercile (trend) sessions. It is falsified if the bottom-tercile mean net trade is at or below zero, or
  if mean net trade does not fall from the bottom to the top tercile.'
- 'Mechanism (diagnostic): long and short sides must each have positive mean gross trade; a fade that pays on one
  side only is the 2020-2022 drift, not responsive liquidity at the band.'
notes: 'owner_seed: VWAP-C2

  Relation to H-0147 (setup 1 of the same leaflet, same family, rejected at G1 on Sharpe): setup 1 followed acceptance
  OUTSIDE the value area (continuation); this card fades a rejected test of the band while price is still INSIDE
  value (6 closes inside before the test, a close back inside on the test candle, a confirmation close). The two
  event sets are disjoint by construction (a close outside the band cancels this setup), so this is the sibling
  claim, not a near-copy. Setup 1''s failure does not support the fade: if it failed on costs rather than direction,
  the fade faces the same cost wall; the cost filter (target at least 0.25 % away, about two round trips at the
  1.5 bps tier) and the multi-hour holding period are the design answers to that wall and to the one-candle-delay
  deaths of H-0035 and H-0063.

  Choices the owner left open, fixed here before seeing any data: session = UTC day (as in H-0147, VWAP reset at
  00:00 UTC); band = VWAP +/- 1.0 volume-weighted standard deviation of the typical price (the conventional ''value
  area'' of about 68 % of volume); tol = 0.25 ATR (same buffer as the owner''s stop); ATR = 14-candle mean true
  range; no test candles in the first 3 hours (index < 36, the bands are too narrow to mean anything) and no new
  signals in the last 2 hours (index > 264); flat at the session end because the VWAP and bands reset; stop and
  target are price levels frozen at the signal and checked on each closed candle (the engine has no intrabar orders,
  so a touch is filled at the next open: worse than a resting order, which is the honest taker version). Only two
  parameters are gridded, and both grids exist to test the owner''s alternatives: confirm_candles 0 = enter at the
  test candle''s close, target_frac 1.0 = opposite band. 8 neighbors.

  Forecast (dev 2020-2022, primary): roughly 600-1500 trades over the two instruments (at most one per side per
  instrument per session, the cost filter removes narrow-band sessions); typical hold 30 minutes to 3 hours; exposure
  small (about 5-10 % of candles), which the intraday judge does not floor. Gross per trade central +15 bps against
  a round trip of about 13 bps, so net per trade near +2 bps: a thin edge at best. Pessimistic case (gross 5-10
  bps, the level H-0137 and study 16''s ''range'' family saw) dies at G1 on the bootstrap bound of the mean net
  trade. Most likely death: G1, gross below the taker round trip, i.e. the rotation exists but passive liquidity
  already takes it (mrel-1h: hourly reversal real, harvestable only as a maker). Second most likely: G2 neighbors,
  if confirm_candles 0 (no confirmation) loses, which would itself say the confirmation is load-bearing.

  Diagnostics the owner asked for (range terciles, same-session random times, side split) are written as falsification
  criteria, but per K-0186 / K-0191 / K-0193 the intraday judge runs only its own controls and reports no gross
  per trade, side split or tercile split; if G1 fails they will not be produced. The Builder should still emit them
  if a diagnostic channel exists (trade log with session range tercile and side). No mechanism_test is declared
  (the intraday judge has none).

  References: none listed. The value-area / responsive-versus-initiative vocabulary is practitioner Market Profile
  language (Dalton, Mind Over Markets; Steidlmayer), not an empirical study of this rule, and the owner''s source
  is a leaflet; I am not claiming a published anomaly, so no literature prior is invoked. No data is missing: binance_perp_5m
  (loader intraday) covers both instruments from 2020.'
