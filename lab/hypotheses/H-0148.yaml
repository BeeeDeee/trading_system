mechanism:
  counterparty: Short-horizon taker momentum and stop-entry breakout traders who buy the top (sell the bottom) of
    the session range on a probe that carries no information, plus small leveraged positions stopped or liquidated
    at the obvious range edge; on balanced sessions their market orders are absorbed at the band and they unwind
    on the way back to the centre. They keep doing it because some probes do become trend days (the continuation
    of setup 1, H-0147), and ex ante they cannot tell which.
  why: 'On a balanced (rotational) session, price that has spent time inside the session''s developing value area
    (the volume-weighted band V +/- 1 sigma around the UTC-session VWAP) is trading where most of the day''s volume
    already agreed on value. A probe to a band edge that is not driven by new information draws responsive liquidity:
    market makers leaning against their inventory, range and mean-reversion bots, and hedgers who sold (bought)
    higher (lower) earlier in the session take the other side, and the probe fails. The rejection candle (a wick
    through or near the band that closes back inside) shows that the probe found no follow-through; the confirmation
    close beyond the test candle''s extreme shows the responsive side has taken control. Price then rotates back
    toward the volume-weighted centre of the session, where it spent most of its time. The gross move to the VWAP
    is a sizeable fraction of the session''s band width, which is the only reason a taker can hope to keep part
    of it after a 13 bps round trip.'
  why_not_arbitraged: Passive market makers already harvest most of this rotation from inside the spread, so the
    part left to a taker is small and exists only when the band is wide relative to costs; capacity is small and
    the fade carries open-ended trend-day risk (the losing tail is exactly the day that keeps trending), which short-horizon
    risk budgets do not like. Whether anything is left for a taker after fees and slippage is the question this
    card tests.
signal:
  description: 'Data: Binance USD-M perpetual 5-minute candles of BTCUSDT and ETHUSDT (o, h, l, c, qv, real). A
    decision is taken after the close of every 5m candle using only candles closed so far; fills at the open of
    the next candle. SESSION: the UTC day; candle index i = 0 for the candle opening at 00:00 UTC, 287 for the one
    opening at 23:55. BANDS (recomputed at every candle j of the session, from the session''s real candles 0..j
    only): typical price tp = (h + l + c) / 3, weight w = qv; V_j = sum(w*tp) / sum(w); sigma_j = sqrt(max(0, sum(w*tp^2)
    / sum(w) - V_j^2)); L_j = V_j - 1.0*sigma_j, U_j = V_j + 1.0*sigma_j (the band multiplier 1.0 is a fixed constant,
    not a parameter). Candles with real == False (gaps) or qv == 0 get weight 0. ATR_j = mean of the true range
    max(h, c_prev) - min(l, c_prev) over the last 14 real candles (may span the session boundary). LONG SETUP (short
    is the exact mirror): (1) context: the closes of the 6 candles b-6 .. b-1 are all inside their own bands, L_k
    <= c_k <= U_k, and all 6 are real candles of the same session; (2) test candle b, with session index i_b >=
    36 (the first three hours only build the value area) and i_b <= 264: l_b <= L_b + 0.25*ATR_b and c_b >= L_b;
    (3) entry signal candle s: if confirm_candles = 0, s = b; otherwise s is the first candle among b+1 .. b+confirm_candles
    with c_s > h_b, and the setup is cancelled if any candle from b+1 up to s (or up to b+confirm_candles if no
    signal came) closes below its own L_k, or if the window crosses the session end; s must also have session index
    <= 264; (4) target T = L_s + target_frac*(U_s - L_s), frozen at the signal (target_frac 0.5 is exactly V_s,
    1.0 is U_s); stop S = min(l_b .. l_s) - 0.25*ATR_s, frozen at the signal; (5) cost filter: skip the trade if
    (T - c_s) / c_s < 0.0025 (the move to target must be at least about two taker round trips; a fixed constant
    derived from the cost model, not tuned). ENTRY: buy at the open of candle s+1 with weight +0.5 of equity (short
    mirror: -0.5). EXIT (evaluated after each candle close k >= s+1, fill at the open of k+1): target touched (h_k
    >= T for a long, l_k <= T for a short); stop touched (l_k <= S for a long, h_k >= S for a short; if both are
    touched in the same candle the stop counts); or k is the last candle of the session (index 287), i.e. every
    position is flat at 00:00 UTC when the VWAP resets. A gap candle never triggers an entry; an exit due on a gap
    candle is filled at the next real candle''s open. LIMITS: one open position per instrument; at most one long
    and one short entry per instrument per session; signals that arrive while the instrument already has a position
    are ignored. Mirror for shorts: test candle h_b >= U_b - 0.25*ATR_b and c_b <= U_b; signal = first close below
    l_b; a close above U_k cancels; T = U_s - target_frac*(U_s - L_s); S = max(h_b .. h_s) + 0.25*ATR_s; cost filter
    (c_s - T)/c_s >= 0.0025. Funding is charged by the engine on positions held over a settlement candle.'
  params:
    confirm_candles:
      grid:
      - 0
      - 3
      - 6
      value: 3
    target_frac:
      grid:
      - 0.25
      - 0.5
      - 1.0
      value: 0.5
  timeframes:
  - 5m
