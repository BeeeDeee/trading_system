mechanism:
  counterparty: Return-chasing allocators (retail country-fund flows, plan sponsors and consultants screening on
    3-5 year performance, regional mandates that are cut after long underperformance) who buy multi-year winners
    and sell multi-year losers at prices that later revert.
  why: 'National equity markets overshoot over multi-year horizons and then mean-revert (De Bondt and Thaler 1985
    at the stock level; Richards 1997 and Balvers, Wu and Gilliland 2000 for national indices). The channel is return-chasing
    allocation keyed to multi-year track records: international portfolio flows follow past market returns (Bohn
    and Tesar 1996), and institutional allocators hire and fire on 3- to 5-year trailing performance, so capital
    piles into markets with a long run of good returns and leaves markets with a long run of bad ones, pushing prices
    away from fundamentals for years. In USD-denominated country ETFs the effect combines equity overshooting with
    real-exchange-rate overshooting (long-horizon currency value), which point the same way. The most recent 12
    months are skipped so the sort does not pick up the opposite-signed 12-month country momentum.'
  why_not_arbitraged: The trade pays over years, not weeks, and can lose for several years in a row while a market
    keeps winning (career and redemption risk of a contrarian manager, Shleifer-Vishny limits of arbitrage). Loser
    markets are often in visible crises with political, currency and liquidity risk that mandates and risk committees
    avoid. Country index mispricing is large-capacity but horizon-constrained, not capital-constrained.
signal:
  description: 'Inputs: daily total returns of the 21 ETFs from sharadar_sfp (ret_co and ret_oc combined into a
    daily close-to-close total return; a day without a bar counts as zero return in the cumulation). Decision dates:
    the first XNYS trading day of each calendar month, after its close (day t); trades at the open of day t+1. Formation
    score of ETF i on day t: cumulative total return from the close of session t-(F+252) to the close of session
    t-252, where F = 21 x formation_months sessions (the last 252 sessions are skipped). Eligibility: the ETF has
    a price at the close of session t-(F+252) and on day t (so it has existed for at least F+252 sessions); others
    are ignored that month. If fewer than 2 x leg_size + 3 ETFs are eligible, the book is flat that month. Ranking:
    among eligible ETFs, the leg_size ETFs with the lowest score form the long leg (side +1), the leg_size ETFs
    with the highest score form the short leg (side -1); ties broken by ticker order in the universe list. Weights:
    for each selected ETF compute sigma_i = standard deviation of daily total returns over the last 252 sessions
    to day t; raw weight = side_i / sigma_i; scale all raw weights so the sum of absolute weights is 1.0 (gross
    1, no leverage; net dollar exposure is whatever the inverse-vol weights give, typically close to zero). All
    other ETFs have weight 0. Rebalance every month to the new targets (names that stay in a leg keep their position
    and are only re-weighted). Between decision dates the weights drift with prices. Because the 48-month score
    moves slowly, a name typically stays in its leg for many months, so the economic holding period is 6-24 months
    even though targets are refreshed monthly.'
  params:
    formation_months:
      grid:
      - 36
      - 48
      - 60
      value: 48
    leg_size:
      grid:
      - 4
      - 5
      - 6
      value: 5
  timeframes:
  - 1d
  - 1mo
  - 1y
mechanism_test:
  event: 'On each monthly decision date (first XNYS trading day of the month, after the close), every ETF selected
    into the long leg (bottom leg_size by the 48-month return ending 12 months ago) is an event with side +1 and
    every ETF selected into the short leg (top leg_size) is an event with side -1. The remaining eligible ETFs (at
    least 3 by construction) are the unmarked peers. Expected count: about 216 decision dates (from early 2003 to
    2020) x 10 marked ETFs = about 2,100 marked events on about 216 dates.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
