falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of leg members against unmarked peers is not above the
  95th percentile of the time-shifted placebos.'
- 'Mechanism: the abnormal return is negative in the latest third of the dev period (decay or regime change; K-0060
  kill condition).'
- 'Mechanism: the 5-session abnormal return is larger than the 60-session one (a short-term effect, not slow multi-year
  reversal).'
- 'Mechanism: gross abnormal return per event at 60 sessions does not cover the round-trip cost of the ETFs traded.'
- 'Strategy: net Sharpe on dev below 0.5 or below the T-bill benchmark Sharpe + 0.10, or the bootstrap bound of
  the difference is not above zero.'
- 'Robustness: fewer than 75 % of the formation_months (36, 60) and leg_size (4, 6) neighbors beat the benchmark,
  or the strategy fails at doubled costs.'
- 'Robustness: one third of the dev period carries more than 60 % of the log return, or fewer than two thirds beat
  the benchmark.'
notes: 'Brief fit: long holding (6-24 months) on US ETFs. The universe is one asset class (national equity markets)
  rather than several, on purpose: a reversal sort across asset classes would mostly rank volatility and duration
  (bonds against equities against gold), and most non-equity ETFs start in 2003-2007, so with a 60-month window
  they would enter the sort only in the last few dev years. Single-country ETFs from 1996-2000 give the longest
  dev window the catalog allows (first signal early 2003). Each country ETF is also a currency position, so the
  test covers the cross-asset combination of equity and currency long-horizon value. Not a near-copy: the lab''s
  reversal family is short-term-reversal (liquidity provision, days to a week, single stocks and crypto); this is
  multi-year overreaction in national indices with the last 12 months skipped, a different mechanism, horizon and
  universe, hence the new family name long-term-reversal. Momentum (12-1) is deliberately excluded by the skip;
  the cross-sectional-momentum family is not reused because the sign and window are different. Universe choice is
  rule-based (every iShares MSCI single-country ETF listed before 2001 plus SPY for the US), not picked on performance.
  Honest expectations: published country reversal spreads are several percent per year for the full long-minus-short;
  at gross 1 (half per leg) the book earns about half of that with maybe 6-9 % volatility, so the 0.5 absolute Sharpe
  bar against T-bills is the most likely strategy death even if the mechanism is real; the mechanism test is the
  informative part. Per K-0071 a 60-session primary horizon meets a wide placebo cloud (monthly events, persistent
  ranks, overlapping windows), so a near miss should be read as ''cannot tell''. Expected gross per event at 60
  sessions is roughly 0.5-1 %, against a round trip of a few to ~20 bps for the less liquid country ETFs (EWK, EWO,
  EWM), so the cost ratio should not bind; the placebo bar may. ETF short positions carry no borrow fee in the engine;
  country ETFs are generally easy to borrow, but this flatters the short leg slightly. Holdout 2021 on is untouched
  by this card; ETFs have no forward data, so G4 is the ceiling. Related evidence: Goyal and Wahal (2008) document
  plan sponsors hiring managers after 3-year outperformance that does not persist, the behavioural channel assumed
  here (cited in notes only, it is about managers, not countries).'
