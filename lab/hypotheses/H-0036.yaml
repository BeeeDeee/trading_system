falsification_criteria:
- 'Mechanism: the side-adjusted 1-day abnormal return of the events (speculative stocks over the last and first
  sessions of the week, open to close) is not above the 95th percentile of the time-shifted placebos.'
- 'Mechanism: the gross abnormal return per event is below the round-trip cost of trading it (cost ratio < 1): the
  mood effect exists or not, but it is not tradable by a taker in LIQ-500.'
- 'Mechanism: the effect has the declared sign in fewer than two of the three dev sub-periods, or the latest third
  (roughly 2013-2020) has the wrong sign (treated as decayed, even if the pooled test passes).'
- 'Strategy: net Sharpe on dev below 0.5 over T-bills, or the 75 % bootstrap bound of the Sharpe difference to T-bills
  below zero.'
- 'Robustness: fewer than 75 % of the neighbors (ivol_lookback_days 42/126, leg_quantile 0.1/0.3) beat T-bills,
  or the book does not beat T-bills at doubled costs.'
notes: 'Fits the brief directly: US single stocks, cross-sectional, holding one session, with a mechanism test at
  h = 1, which in this judge measures the next session open to close, i.e. exactly the intraday part of the F and
  M sessions where Birru locates the effect. The strategy holds open to open, so it also carries one overnight (the
  weekend gap for the F book); the placebo comparison is unaffected, since time-shifted events carry the same overnight
  structure. Why this is not a retry of a dead family: it sorts on a slow variable (idiosyncratic volatility) and
  the only conditional claim is the weekday. It is not short-term reversal or momentum (no past-return sort: K-0012,
  K-0044), not the unconditional low-volatility premium of study 1 (the Friday long and Monday short of the same
  names roughly cancel the unconditional IVOL premium, and the placebo nets it out anyway), and not the month-turn
  beta spread (H-0016/H-0025, family turn-of-month-flows): the window is weekly, the sort is idiosyncratic volatility
  rather than beta, and the book is beta-neutral so the index weekend effect is not what is being tested. New family
  because the mechanism (weekday mood acting on hard-to-value stocks) is not a flow or a month-turn effect; if the
  Librarian prefers to count it with the calendar family, that is a fair call. Known risks, stated up front: (1)
  Costs. The book turns over about four times its gross per week (enter, flip, exit) in LIQ-500 at 3-6 bps half-spread,
  roughly 9-10 % a year; the effect in large liquid names is likely a fraction of the full-CRSP magnitude, so the
  most likely death is the mechanism cost ratio or the G1 Sharpe bar, which would say "the mood effect does not
  reach a tradable size in liquid stocks" (cheap and informative). (2) Placebo periodicity. The events recur every
  week, so placebo shifts that are close to a multiple of five sessions partly re-align events with the same weekday;
  this raises the placebo cloud and makes the test conservative, never lenient. (3) Publication is 2018 (working
  paper earlier), so the post-publication slice of dev is short; G2''s decay check will be noisy. (4) Exits of names
  that leave the point-in-time universe during the hold are closed at the next open (K-0051), not on schedule. The
  XNYS calendar is needed only to know whether the next session is the last or first of its week; it is known in
  advance and is not data look-ahead, but the Builder should make sure G0 truncation does not see it as such (compute
  it from the calendar, not from the next data row). No new data needed.'
