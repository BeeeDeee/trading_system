id: H-0036
version: 1
title: Day-of-week mood in speculative stocks - LIQ-500 beta-neutral, long high-idiosyncratic-volatility stocks
  over the last session of the week, short them over the first session, flat otherwise
author_agent: scout
family: day-of-week-mood
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Mood-driven, mostly retail and attention-driven buyers who bid up speculative names on the last
    session of the week and sell or abstain on the first, i.e. traders who pay a sentiment premium on Fridays and
    accept a sentiment discount on Mondays. The strategy provides the other side: it sells speculative names to
    them going into the weekend (by closing the Friday long at Monday''s open and shorting) and buys them back after
    the Monday discount.'
  why: 'Birru (2018) documents that the returns of speculative, hard-to-value stocks (high idiosyncratic volatility,
    the speculative leg of the classic anomalies) depend on the day of the week: they are relatively high on Fridays
    and relatively low on Mondays, the variation sits in the intraday (open to close) part of the return, and it
    comes from the speculative leg, not the safe one. The proposed channel is investor mood: mood rises into the
    end of the week and falls at its start, and mood moves the valuation of stocks whose value is a matter of opinion
    (high idiosyncratic risk, little anchoring in fundamentals) far more than that of easy-to-value stocks. Sentiment-driven
    demand therefore pushes speculative stocks up relative to the rest on the last session of the week and lets
    them fall back on the first session. The claim is conditional on the calendar only: the stock ranking is a slow
    variable (63-day idiosyncratic volatility), so the effect being tested is when, not which.'
  why_not_arbitraged: The effect is a few basis points per stock per day, it lives in the most volatile names where
    shorting is riskier and borrow is dearer, and harvesting it requires turning the whole book over twice a week,
    so spread costs eat most of it for anyone but a low-cost market maker; a long-horizon arbitrageur gains nothing
    by holding the position. Calendar effects in the cross-section are also much less visible than in the index
    (the index weekend effect is famous; the speculative-minus-safe spread by weekday was documented late), and
    the mispricing reverses within a session, so there is no slow drift for momentum-style capital to absorb.
signal:
  description: 'Universe: point-in-time LIQ-500 members on decision day t that are tradable on t and have valid
    close-to-close total returns ((1+ret_co)(1+ret_oc)-1) on at least 80 % of the last L = ivol_lookback_days sessions.
    Market return m = equal-weighted mean return of those eligible members on each day. For each eligible stock
    regress its last L daily returns on m (OLS with intercept): beta = slope, IVOL = standard deviation of the residuals.
    All inputs use data up to and including the close of t. Calendar (known in advance, from the XNYS exchange calendar,
    never from the data rows after t): F = the last trading session of a calendar week (normally Friday; Thursday
    when Friday is a holiday); M = the first trading session of a calendar week (normally Monday; Tuesday after
    a Monday holiday). Decision A (after the close of the session immediately before an F session): speculative
    leg S = eligible stocks in the top leg_quantile by IVOL; hedge basket H = all other eligible stocks. Target
    weights for the F session: each stock in S long a/|S|, each stock in H short b/|H|, with a = beta_H / (beta_S
    + beta_H) and b = beta_S / (beta_S + beta_H), where beta_S and beta_H are the equal-weighted mean betas of S
    and H (ex-ante beta-neutral, gross exposure exactly 1). If beta_S or beta_H is not positive, use a = b = 0.5.
    Trades at the open of the F session. Decision B (after the close of the F session): recompute S, H, a and b
    with data up to that close and take the mirror book for the following M session: each stock in S short a/|S|,
    each in H long b/|H|. Trades at the open of the M session (the F book is replaced, not added to). Decision C
    (after the close of the M session): target weights zero (flat); trades at the next open. No position on any
    other session. If an F session is immediately followed by an M session (always the case) the F book is held
    from the F open to the M open, the M book from the M open to the next open. If an F session and an M session
    coincide (a one-session week), skip that week''s books. A stock that stops being tradable or leaves the universe
    while held is closed at the next open; its weight is not redistributed. Missing data for a stock removes it
    from eligibility for that decision only.'
  params:
    ivol_lookback_days:
      grid:
      - 42
      - 63
      - 126
      value: 63
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'A LIQ-500 stock is in the speculative leg (top leg_quantile by 63-day idiosyncratic volatility versus
    the equal-weighted universe) at decision A (after the close of the session before the last session of a calendar
    week: side +1, it should outperform the other members during the last session) or at decision B (after the close
    of the last session of a week: side -1, it should underperform the other members during the first session of
    the next week). Only speculative-leg stocks are events; the hedge basket is not.'
  horizons:
  - 1
  - 2
  - 5
  primary_horizon_days: 1
