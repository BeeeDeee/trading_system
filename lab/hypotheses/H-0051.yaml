falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of marked ETFs (next open to close of t+5, minus the mean
  of the unmarked eligible ETFs) is not above the 95th percentile of the time-shifted placebos: speculator flow
  carries no short-term liquidity premium visible in the ETFs at the report lag.'
- 'Mechanism: gross abnormal return per event is below the round-trip cost of the marked ETFs, or fewer than two
  of the three dev sub-periods have the predicted sign; in particular a negative latest third is a kill condition
  (decay, K-0060).'
- 'Mechanism shape: if the 1- and 2-session horizons carry the opposite sign of the 5-session horizon and the 10-
  and 20-session horizons are not of the predicted sign either, the result is noise rather than a reverting concession.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference against T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbor configurations (leg_fraction 0.15 / 0.3, z_window_weeks 26 / 104
  and their combinations) beat the T-bill bar, or the book does not beat it at doubled costs.'
notes: 'Brief fit: short horizon (5 sessions, weekly) and cross-asset in the sense of the brief: the signal comes
  from the futures market''s reported positions (CFTC), the trades are in US-listed ETFs, and the book spans commodities
  (energy, metals, grains, softs) and currencies. It is not an index-to-index lead-lag (study mrel, lesson 7): no
  price series of one market is used to predict another; the input is who traded, not what the price did. It is
  not a stress rebound (K-0056): nothing is conditioned on large price moves or crashes. FRED is not used. Family:
  the economic mechanism is liquidity provision, like short-term-reversal, but the event is defined on reported
  trader flows in the futures market and never on the instrument''s own return, so I file it as a new family; KRT
  note that speculators trade on momentum, so the flow sort will correlate with last week''s return. If the Chair
  judges that this makes it the same family as short-term-reversal, I accept the reassignment and the higher trial
  count. A price-matched control (same past-week return, different flow) would separate the two and cannot be reported
  through a single event mask; worth a follow-up if the mechanism passes. Data (essential, hence the new dataset):
  no loadable dataset holds trader positions; CFTC COT history is free and public. The point-in-time danger is the
  release date: positions are as of Tuesday and published on Friday, later in holiday weeks and much later during
  government shutdown backlogs, so the card requires stamping on the actual release date and dropping reports whose
  release date is unknown. The paper''s working-paper version circulated from about 2013 under the title ''The Role
  of Hedgers and Speculators in Liquidity Provision to Commodity Futures Markets'', so the effective post-publication
  window starts before the 2020 journal year. Expected counts (state separately, K-0069): about 600-700 weekly rebalance
  dates from about 2007 to 2020 (the 52-report z window and the 252-session price history push the first decision
  to roughly two years after the first data); with 6-14 eligible ETFs, k = 1-3 per leg, so about 2,000-3,500 marked
  events, with 3-10 unmarked peers per date (K-0055 needs at least three). In the earliest years only the liquid
  ETFs (GLD, SLV, USO, UNG, some currency ETFs) pass the 5 million USD filter; weeks with fewer than 6 eligible
  ETFs have no events and the book is flat, so mean exposure could fall in the first years; it should stay well
  above 20 % overall. Costs (K-0053): GLD, SLV, USO and UNG are very liquid; the currency and smaller commodity
  ETFs are in higher cost tiers, plausibly 5-15 bps per side, so a round trip averages perhaps 10-20 bps per marked
  ETF. The paper''s effect is measured on futures from Tuesday to Tuesday; here entry is about four sessions after
  the as-of date, so part of the concession is likely gone before entry. Gross per event must therefore be of the
  order of 0.2 % or more over 5 sessions to pass the cost check; I do not know whether it is, which is exactly what
  the mechanism test is for. With weekly turnover of a large part of a gross-1 book, cost drag is roughly 2-4 %
  a year, so the strategy gate (Sharpe 0.5 against T-bills, market-neutral) is the likeliest place to die even if
  the mechanism passes. Instruments: chosen as every US-listed ETF that holds a single CFTC-reported commodity future
  or a single currency and existed in dev, not by performance. Treasury and equity-index futures are excluded on
  purpose: their legacy non-commercial category is dominated by basis and spread trades of leveraged funds, whose
  position changes are not directional liquidity demand. Multi-commodity baskets (DBC, DBA, GSG) have no single
  matching market and are excluded. ETFs and the COT dataset have no forward source in the lab today, so the ceiling
  is G4.'
