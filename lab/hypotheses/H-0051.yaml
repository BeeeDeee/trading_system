mechanism:
  counterparty: Speculators who trade on momentum and need to get into or out of positions within the week (trend
    followers rebalancing on their own signals, funds facing flows) and pay the price impact; the premium goes to
    whoever provides the other side, here a weekly contrarian ETF book that is one more liquidity provider next
    to the commercials.
  why: 'In commodity and currency futures, non-commercial traders (CTAs, hedge funds, other speculators) change
    their positions impatiently, largely by following momentum, and so demand immediacy; commercial traders (producers,
    merchants, dealers) absorb these weekly position changes and are paid for doing so through a temporary price
    concession that reverts over the following weeks. Kang, Rouwenhorst and Tang (2020) show, on CFTC Commitments
    of Traders data, that commodities most heavily bought by speculators in a week earn lower returns in the following
    weeks than those most heavily sold, and that this short-term liquidity premium has the opposite sign of the
    long-run hedging premium (de Roon, Nijman and Veld 2000). The signal comes from one market (the futures market''s
    reported trader positions, published by the CFTC) and is traded in another (US-listed ETFs that hold the same
    futures or the same currency), across two asset classes. The claim is about flow, not price: the sort uses only
    the reported change in speculators'' net position, never the ETF''s own past return.'
  why_not_arbitraged: Providing liquidity to speculative flow means standing against trends with risk-bearing capital
    that is scarce in exactly the weeks when speculative flow is largest; commercials have hedging mandates and
    limited balance sheets; the information arrives with a three-day reporting lag and is noisy (the legacy report
    lumps different speculators together), and the premium is small per week, so it is unattractive to large funds
    and costly for small ones. Capacity in the smaller commodity ETFs is low.
signal:
  description: 'Inputs: for each ETF its mapped CFTC futures market (GLD gold COMEX, SLV silver COMEX, USO WTI crude
    NYMEX, UNG Henry Hub natural gas NYMEX, UGA RBOB gasoline NYMEX, CORN corn CBOT, WEAT SRW wheat CBOT, SOYB soybeans
    CBOT, CPER copper COMEX, PPLT platinum NYMEX, PALL palladium NYMEX, CANE sugar No. 11 ICE US, FXE euro FX CME,
    FXY Japanese yen CME, FXB British pound CME, FXA Australian dollar CME, FXC Canadian dollar CME, FXF Swiss franc
    CME), from the legacy futures-only Commitments of Traders report: non-commercial long and short positions and
    total open interest, stamped on the report''s public release date (dataset cftc_cot_legacy_1d). A report becomes
    usable at the close of the XNYS session on or after its release date (normally the Friday after the Tuesday
    as-of date, later for holiday or shutdown delays; a report is never used before its actual release date). (1)
    For market m and report week w: flow_m,w = [(NC_long - NC_short)_w - (NC_long - NC_short)_(w-1)] / OI_w, using
    two consecutive reports of the same market (as-of dates 7 days apart; if the previous report is missing, flow
    is missing). (2) Standardize: z_m,w = flow_m,w / standard deviation of flow_m over the previous z_window_weeks
    reports of that market (strictly earlier reports; at least half of the window must be present, otherwise missing);
    no demeaning. (3) Eligibility at the decision date: the ETF has at least 252 sessions of price history, its
    median daily dollar volume over the last 63 sessions is at least 5 million USD, it is tradable, and its market
    has a non-missing z from a report released within the last 10 calendar days. (4) Decision: after the close of
    the session on which a new weekly report becomes usable (normally Friday), if at least 6 ETFs are eligible,
    rank eligible ETFs by z; k = max(1, round(leg_fraction x N_eligible)); long the k lowest z (speculators sold
    most), short the k highest z (speculators bought most). (5) Weights: within each leg proportional to 1 / (63-session
    volatility of daily total returns), each leg scaled to gross 0.5, so the book is dollar-neutral with gross 1.0.
    (6) Trade at the next session''s open; hold until the next rebalance (normally the following Monday open, 5
    sessions). If no new report becomes usable within 10 calendar days of the last rebalance, or fewer than 6 ETFs
    are eligible, close all positions at the next open and stay flat until the next valid rebalance. An ETF that
    loses eligibility is dropped at the next rebalance. Missing price days (dropped vendor spikes) do not trigger
    trades; positions are kept. Returns are total returns (ret_co, ret_oc); dollar_volume and tradable are filters
    only.'
  params:
    leg_fraction:
      grid:
      - 0.15
      - 0.2
      - 0.3
      value: 0.2
    z_window_weeks:
      grid:
      - 26
      - 52
      - 104
      value: 52
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At each weekly rebalance (after the close of the session on which a new CFTC report becomes usable, with
    at least 6 eligible ETFs), an eligible ETF is in the long leg (the k lowest standardized one-week changes in
    its futures market''s net non-commercial position as a share of open interest; speculators sold most): side
    +1; or in the short leg (the k highest; speculators bought most): side -1. Unmarked eligible ETFs are the peers.'
