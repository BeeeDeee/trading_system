id: H-0189
version: 1
title: Earnings-season beta premium - LIQ-500 long-only weekly, top beta quintile in predicted peak 8-K release
  weeks, bottom beta quintile otherwise, hold 5 days
author_agent: scout
family: macro-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors who hold constant beta through the quarter: leverage-constrained and benchmark-bound
    holders who keep high-beta stocks in quiet weeks (when beta is not paid) and de-risk or stay low beta into earnings
    season because the news is risky. The premium is a risk compensation paid by holders who want to avoid bearing
    aggregate-news risk; nobody is fooled, they pay to not hold it.'
  why: 'Earnings releases of many large firms in the same weeks resolve uncertainty about aggregate cash flows,
    so they are systematic news, not only firm news (Savor and Wilson 2016). Investors who bear market risk through
    those weeks are paid for it: the security market line is steep on scheduled information days and flat or inverted
    on other days (Savor and Wilson 2014, macro announcements; Penman 1987, aggregate returns early in the quarter
    when releases cluster). The cross-sectional consequence is that high-beta stocks should beat low-beta stocks
    by more than their average beta payoff during the weeks when most large firms report, and low beta should be
    the better risk-adjusted holding in the quiet weeks between seasons (the low-beta anomaly lives there). The
    peak weeks are predictable a week ahead from last year''s real 8-K Item 2.02 dates, because firms keep their
    reporting calendar from year to year.'
  why_not_arbitraged: 'It is a risk premium, not an arbitrage: the high-beta book in peak weeks carries concentrated
    market and news-jump risk, and tilting beta by season adds tracking error that benchmarked managers avoid. Leverage
    constraints (Frazzini-Pedersen style) keep the low-beta side cheap in quiet weeks.'
signal:
  description: 'Inputs: daily total returns of LIQ-500 members from ret_co and ret_oc (total return of day t = (1+ret_co)(1+ret_oc)-1),
    and the daily flag ea_reaction_day from sec_8k_item202. All decisions are taken after the close of the last
    session of each calendar week (t) using data up to that close; trades fill at the open of the next session (t+1).
    (1) Market proxy: the equal-weighted mean daily total return of the LIQ-500 members of each day. (2) Beta: for
    every current member, OLS slope of its daily total return on the market proxy over the last beta_lookback sessions
    up to t; require at least 80 % non-missing days, otherwise the stock has no beta and cannot be held. (3) Predicted
    release intensity S_t of the coming week: among the stocks that are LIQ-500 members at t and whose ea_reaction_day
    is not NaN one year earlier, the number of reaction sessions (flag = 1) on sessions whose calendar date lies
    in [date(t) + 1 - 364 days, date(t) + 7 - 364 days], divided by the number of such stocks. This uses only flags
    that are a year old. (4) Peak week: rank S_t among the last 52 weekly values S_(t-51) .. S_t (inclusive); the
    coming week is a peak week when S_t is at or above the (1 - peak_fraction) empirical quantile of those 52 values.
    No decision is made before 52 weekly values of S exist (the book is then equal-weight in the bottom beta quintile,
    see below, which is the off-peak state). (5) Book, long-only, fully invested, equal weights: in a peak week
    hold the top quintile by beta of members with a valid beta; otherwise hold the bottom quintile by beta. Rebalance
    weekly to equal weights of the selected quintile; a stock that stays in the selected quintile is only re-weighted.
    Stocks that leave the universe or delist are sold by the engine rule; a stock without a beta or without a tradable
    bar at t+1 is skipped and the rest re-weighted. Positions are held until the next weekly decision (5 sessions).'
  params:
    beta_lookback:
      grid:
      - 126
      - 252
      - 504
      value: 252
    peak_fraction:
      grid:
      - 0.25
      - 0.33
      - 0.5
      value: 0.33
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: On a weekly decision date t whose coming week is a predicted peak release week (step 4 of the signal, with
    the primary beta_lookback and peak_fraction), each LIQ-500 member in the top beta quintile is an event with
    side +1 and each member in the bottom beta quintile is an event with side -1 (the mechanism says high beta should
    beat low beta in peak weeks by more than on other dates). No events on non-peak dates.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
