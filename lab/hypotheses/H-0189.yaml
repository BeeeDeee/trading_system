falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the peak-week beta-quintile events is not above the
  95th percentile of the time-shifted placebos (i.e. high minus low beta in predicted peak weeks is no larger than
  at random dates).'
- 'Mechanism: gross abnormal return per event is below the round-trip cost, or the latest third of dev has a negative
  sign (expected decay, K-0060, stated as a kill condition).'
- 'Mechanism shape: the 1-session horizon is negative and only the 10-session horizon is positive (slow drift, not
  a news-week premium).'
- 'Strategy: net Sharpe on dev below SPY total return Sharpe + 0.10, or the stationary-bootstrap bound of the Sharpe
  difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors of beta_lookback 252 and peak_fraction 0.33 beat SPY.'
- 'Cost: the book does not beat SPY at doubled costs.'
notes: 'Brief fit: US single stocks, cross-sectional, 5-day holds with weekly decisions, mechanism test declared.
  Family: the mechanism is the same as H-0042 (beta priced on scheduled information days), so it is filed under
  macro-announcement-premium, which the Chair merged into variance-risk-premium-timing for the trial count (K-0089);
  I accept that heavier penalty. What is new versus the dead cards: (a) the information days are the aggregate earnings
  season measured from real 8-K dates, not CPI/FOMC days (H-0042, H-0045, H-0098) and not the month turn (H-0016,
  H-0025, turn-of-month-flows); (b) the traded asset is the single-stock beta cross-section with thousands of events
  on ~250 peak-week dates, not three ETFs; (c) the book follows K-0027: always invested, long-only, no cash windows,
  and switches beta only about eight times a year, so cost is a small share of gross (unlike the twice-a-month rotation
  of H-0025). It is not a firm-level earnings-announcement premium card (H-0008, H-0015, H-0023): the stocks held
  in a peak week are chosen by beta, not by whether they report. Expected size, written down per K-0053/K-0064:
  top-minus-bottom beta gap in LIQ-500 about 0.8-1.0, so each side earns about half of that times the 5-day market
  move in peak weeks; with a peak-week market gain of roughly 0.3-0.5 % this is about 15-25 bps gross per event,
  against a large-cap round trip of roughly 10-20 bps: the cost ratio is the most likely way the mechanism test
  dies, and a placebo bar above cost would make a miss a cannot-tell. K-0074 applies by design (the claim is about
  beta); the time-shifted placebo nets out the average beta payoff of the same quintiles. Known confound for the
  strategy: two thirds of the time the book holds the low-beta quintile equal-weighted, and low volatility beat
  SPY in dev (study 1), so a strategy pass alone cannot be credited to the season clock; the mechanism test is the
  evidence for the timing, and a static bottom-quintile book is the control the owner should compare (K-0153). The
  intensity predictor needs one year of 8-K flags plus 52 weekly values, so the first real decision is about two
  years after the 2004-08 start of the 8-K data; the book is in the off-peak state before that. No date literals:
  weeks, the 364-day lag and the quantile are all computed from the calendar and data.'
