id: H-0139
version: 1
title: US-cash-open range breakout on BTC/ETH perps after a narrow-range weekday (NR4) - 15m, H-0137's rule only
  when the prior weekday UTC range is the smallest of 4
author_agent: scout
family: us-open-range-breakout-crypto
asset_classes:
- crypto_perp
universe:
  instruments:
  - BTCUSDT
  - ETHUSDT
  kind: instruments
mechanism:
  counterparty: Short-term traders whose stop-losses sit just outside the compressed range (forced to buy above
    / sell below it), and range/mean-reversion traders and passive liquidity providers who sold the top and bought
    the bottom of the narrow range and are run over when it breaks; on perps, leveraged positions near the band
    add liquidation flow in the breakout direction.
  why: 'Crabel-style volatility contraction before range expansion. A weekday whose full UTC range is the narrowest
    of the last few weekdays means that participants have stopped pushing price and that resting stop-loss and breakout-entry
    orders have piled up just outside a tight band (short-term traders place stops a fixed distance beyond recent
    highs and lows, so the tighter the recent range, the closer and denser the clusters). The US cash-equity open
    is the daily moment when a new, largely directional flow arrives in crypto (US-hours ETF/equity-linked hedging,
    US retail and desks starting their day). On a session that follows a contraction day, the first clean break
    of the 30-minute opening range is therefore more likely to run into those order clusters and trigger a cascade
    (stop fills and breakout entries trading in the same direction) than on an ordinary session, so a larger share
    of the session''s move should go in the breakout direction and the move per trade should be larger relative
    to the fixed round-trip cost. The claim is conditional: the unconditional ORB on these instruments (H-0137)
    earned a gross a little below the taker round trip; this card asks whether the post-contraction subset is the
    part that pays.'
  why_not_arbitraged: The edge, if any, is small per trade, one trade per instrument on roughly a quarter of weekdays,
    and only exists at the US open on two instruments, so capacity is small and the return is lumpy; most sessions
    after a contraction day still fail to expand (volatility clusters, so a quiet day usually predicts another quiet
    day), which makes the rule look like a loser for long stretches. Market makers who could fade or front-run the
    stop clusters bear inventory risk exactly when the cascade happens.
signal:
  description: 'Data: Binance USD-M perpetual 15-minute candles of BTCUSDT and ETHUSDT (o, h, l, c; a row is a closed
    candle; decisions after a candle''s close are filled at the open of the next candle). New York time is UTC-4
    from 02:00 local on the second Sunday of March to 02:00 local on the first Sunday of November (US daylight saving
    rule), UTC-5 otherwise; implement this rule explicitly (no timezone library needed) and unit-test it on the
    March and November transitions of each dev year. (1) Daily bars and the narrow-range flag. For every UTC calendar
    day build a bar from its 96 candles 00:00-23:45 UTC: H = max high, L = min low, range R = ln(H / L). Only Monday-Friday
    UTC bars are used for the flag (weekend bars are excluded from the comparison because weekend ranges are structurally
    smaller and would turn the filter into a Monday filter). A trading session on weekday D (Monday-Friday, New
    York date D) is eligible when the previous weekday UTC bar (Friday for a Monday session, else D-1) has R less
    than or equal to the minimum R of the nr_n most recent weekday UTC bars ending with it (itself included; nr_n
    = 4 primary). The flag uses only bars that are complete by 00:00 UTC of day D, i.e. long before the session
    opens. If any of those nr_n bars has more than 4 non-real (gap) candles, or fewer than nr_n weekday bars exist
    yet, the session is not eligible. Every Monday-Friday counts as a session, US exchange holidays included (no
    holiday calendar). (2) Opening range (only on eligible sessions, per instrument independently). OR_H = max high
    and OR_L = min low of the two candles opening at 09:30 and 09:45 New York time (13:30/13:45 UTC in summer, 14:30/14:45
    UTC in winter). If either candle is a gap candle, skip the session. (3) Entry. Starting with the candle that
    opens at 10:00 New York time and ending with the candle that opens at 14:45 New York time (closes 15:00), take
    the first candle whose close is above OR_H (go long) or below OR_L (go short); fill at the next candle''s open.
    At most one entry per instrument per session; no entry if no candle in that window closes outside the range.
    (4) Exit. Close the position at the first of: (a) a candle that closes beyond the opposite side of the opening
    range (close below OR_L for a long, above OR_H for a short), filled at the next open, no re-entry that session;
    (b) the open of the candle that opens at 16:00 New York time (decided after the 15:45 candle closes). No position
    is ever held across 16:00 New York time. (5) Sizing. Each open position has weight 0.5 of equity (+0.5 long,
    -0.5 short), so gross is at most 1.0 with both instruments in a trade; an instrument without a position has
    weight 0. Funding on positions open at a settlement candle is charged by the engine. Parameters: nr_n, the length
    of the narrow-range window (primary 4; neighbors 3 and 7, NR7 being Crabel''s other standard window). Nothing
    else is tuned: opening range 30 minutes, entry cut-off 15:00 and exit 16:00 New York time are fixed, the same
    as the family''s unconditional rule. Diagnostic the Builder must also write (descriptive, not a gate; K-0186):
    for each instrument and pooled, over all dev weekday sessions with a valid opening range, the mean of |ln(open
    of the 16:00 NY candle / open of the 09:30 NY candle)| on eligible (post-NR4) sessions and on all other sessions,
    with session counts; and the mean gross per trade, by side, of the same entry/exit rule on eligible sessions
    and on all other sessions.'
  params:
