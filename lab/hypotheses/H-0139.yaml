falsification_criteria:
- 'Owner criterion (mechanism): in the dev period, pooled over BTC and ETH, the mean absolute US-session move |ln(open
  at 16:00 NY / open at 09:30 NY)| on post-NR4 sessions is not larger than on all other weekday sessions (from the
  Builder''s diagnostic). If this holds, the contraction-precedes-expansion premise is refuted for these instruments
  whatever the strategy result.'
- 'Filter adds nothing: the mean gross per trade on post-NR4 sessions is not above the mean gross per trade of the
  same rule on the other weekday sessions (from the Builder''s diagnostic).'
- 'G1: net Sharpe of the primary (nr_n = 4) below 0.5, or the one-sided 75 % bootstrap bound of the mean net trade
  at or below zero, or max drawdown above 50 %.'
- 'G1 power: fewer than 300 trades at nr_n = 4 in 2020-2022 (forecast 300-380); then the result is a power failure,
  not a verdict on the mechanism.'
- 'G2: either neighbor (nr_n = 3 or 7) has a negative net result, or the median neighbor Sharpe is below 0.7 of
  the primary''s.'
- 'G2: Sharpe with a one-candle later fill below half of the primary''s, or net result negative at doubled costs,
  or fewer than two of three sub-periods positive, or one sub-period above 60 % of the return.'
- 'G2: the rule does not beat the same number of trades placed at random times (below the 95th percentile of random
  entries).'
- 'Bull-artefact check (study 16): if the long trades carry all of the gross and the short trades lose before costs,
  the result is read as the 2020-2021 crypto drift, not as a breakout effect, even if the gates pass.'
notes: 'owner_seed: ORB-C3

  What this is. The family''s unconditional US-open range breakout on BTC/ETH perps (H-0137, the ORB-C1 rule) traded
  only on sessions that follow a narrow-range weekday, as the owner queued it. The Builder has no sibling code (K-0188),
  so the card text above is the full specification: 30-minute opening range from 09:30 New York, first 15m close
  outside it between 10:00 and 15:00, stop on a close beyond the opposite side, flat at 16:00. If H-0137''s implementation
  differed (e.g. stop), this card''s text wins and the Builder should report the difference.

  Choices I made and why. (a) The NR comparison uses weekday UTC bars only. On calendar days the weekend bars are
  structurally the narrowest, so NR4/NR7 on the ''previous day'' would select mostly Mondays after a quiet Sunday
  and almost never Tuesday-Thursday: that would be a weekday conditioner, which the H-0138 lesson lists among the
  forbidden refits. Comparing like with like (days on which the US cash market opens) is the honest Crabel analog.
  (b) Range as ln(H/L) rather than H-L so that the comparison is scale-free; over 3-7 days the two orderings are
  nearly identical. (c) Primary nr_n = 4, not 7: NR7 selects about 1 weekday in 7, roughly 200 trades on two instruments
  in three years, below the 300-trade minimum, so it can only be a neighbor. The grid is [3, 4, 7] so that 4 has
  a neighbor on each side; 3 is not a Crabel window, only the nearest robustness step. (d) No mechanism_test (the
  intraday judge has none); the owner''s falsification criterion is a Builder diagnostic. Per K-0186, a G1 failure
  would leave it unevaluated, so I ask the Chair to have the diagnostic (absolute session move and gross per trade
  on post-NR vs other sessions, by side) reported with the G0/G1 output regardless of the gate result: it is cheap,
  descriptive, and is the only part of this card that answers the owner''s question.

  Relation to H-0138 (honest flag). H-0138''s lesson says not to flip its rule to low-volatility days. NR4 is not
  that flip: it is a one-day relative contraction (yesterday versus the previous 3 weekdays), queued by the owner
  from Crabel''s pre-registered pattern, not chosen from H-0138''s result, and NR days occur in every volatility
  tercile. But it is correlated with low trailing volatility, and the Skeptic should treat it as a third trial of
  this family (plus the ORB configurations of study 16 and Crabel''s literature prior of 20 trials), which makes
  G3 hard even if G1 and G2 pass.

  Forecast. Trades at nr_n = 4: 300-380 (NR3 about 420-480, NR7 about 190-230); round trip 13 bps at the top liquidity
  tier (up to 16 bps when ETH''s 30-day median volume was below 1 bn). Gross per trade: central 12-20 bps, pessimistic
  3-8 bps. To reach net Sharpe 0.5 with ~120 half-weight trades a year the mean gross needs to be roughly 20-25
  bps, so even the central case is marginal. Most likely death: G1 on net Sharpe, because volatility clusters, so
  post-NR sessions probably have SMALLER absolute moves than ordinary ones (the owner criterion would then fail
  too), which shrinks gross in bps against a fixed cost, exactly the way H-0138''s conditioning moved gross in the
  wrong direction. Second risk: trade count just under 300 if the breakout rate on narrow days is lower than the
  ~90 % I assume. If it dies, the family should be closed for taker execution; the open question that remains is
  a judge-reported clock-anchor measurement, not another conditioner.

  Data: everything is in binance_perp_15m (loadable). Dev 2020-01-01 to 2022-12-31; the first weekdays of 2020 are
  warm-up for the flag.'
