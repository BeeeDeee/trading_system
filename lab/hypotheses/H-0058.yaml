id: H-0058
version: 1
title: Token vesting overhang on Binance perps - beta-neutral, short coins aged 30-365 days since listing, long
  coins listed over 2 years, weekly
author_agent: scout
family: new-listing-overhang
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Retail and momentum buyers who pay for a new token at listing and hold it through the vesting period,
    and who anchor on the circulating supply rather than the fully diluted one. Insiders and early backers sell
    to them as their tokens unlock.
  why: 'Most tokens list on Binance close to their token generation event, with a small free float and a large locked
    supply held by the team, early backers and the foundation. That supply unlocks on fixed vesting schedules: commonly
    a cliff 6 to 12 months after launch, then linear monthly releases over 1 to 3 years. Every unlock gives insiders
    whose cost basis is near zero tokens they can sell. Retail demand at listing rests on the visible float and
    the listing news (the catalog itself notes that Binance lists coins after they are already popular), so it does
    not fully discount supply that arrives later. The claim is a slow supply overhang. Over the first year after
    listing, from the second month on, young coins should underperform seasoned coins of similar liquidity and beta.
    The effect should build roughly linearly with the holding horizon (supply arrives month by month), not sit in
    the first days. This is the crypto version of the long-run underperformance of new issues (Ritter 1991; Loughran
    and Ritter 1995). The overpricing persists because optimists set the price when shorting is constrained (Miller
    1977).'
  why_not_arbitraged: Shorting young tokens is costly and risky. Spot borrow is scarce or absent. Perp funding on
    hyped new listings is often negative (shorts pay longs). Squeezes of more than 100 % in days are common, and
    many young tokens have no perp, or only a thin one, in their first weeks. Vesting schedules are public but scattered
    across project documents. A dedicated short book faces career and margin risk in alt rallies. The capacity of
    the trade is limited by the liquidity of young perps.
signal:
  description: 'Data and clock: daily Binance USD-M perp bars (binance_perp_1d, ids <SYMBOL>.P); the UTC day closes
    at 00:00 UTC. Decisions are made weekly, after the close of each Sunday UTC day, using data up to that close,
    and are filled at the next daily open (Monday 00:00 UTC). Universe: the judge''s point-in-time top 30 perps
    by 30-day quote volume on the decision date. Listing age: for every perp j, listing_date_j = the earlier of
    (a) the first daily bar of its underlying Binance spot pair in binance_spot_1d (SYMBOL without .P, e.g. ABCUSDT
    for ABCUSDT.P) and (b) the first daily bar of the perp itself. age_j(t) = calendar days from listing_date_j
    to t. Pairs whose first spot bar is the first day of the spot dataset are simply old (age censored from below;
    they are always seasoned by the dev period of the perps). If a perp has neither a spot nor a perp first bar
    on or before t it is not eligible (fail loudly if a universe member has no listing date at all; do not drop
    it silently). Legs at each weekly decision date t, among universe members with at least 30 daily perp returns:
    short leg S = members with min_age_days <= age_j(t) <= young_max_days; long leg L = members with age_j(t) >
    730 days; members with ages in between are not held. If S or L has fewer than 3 members, the book is flat until
    the next weekly decision. Beta-neutral sizing: beta_j = OLS slope of the perp''s daily close-to-close log return
    on the equal-weight mean daily log return of all universe members, over the trailing 60 days (at least 30 observations,
    else not eligible), shrunk as 0.5 * beta_j + 0.5. B_L, B_S = mean shrunk beta of each leg. Long gross G_L =
    B_S / (B_L + B_S), short gross G_S = B_L / (B_L + B_S) (total gross 1, net beta zero ex ante). Equal weights
    within a leg: each long member +G_L / |L|, each short member -G_S / |S|. All weights are reset to these targets
    at every weekly decision. Between decisions positions are not traded. The only exception: a position in a coin
    that leaves the point-in-time universe is closed at the first decision row on which the engine requires it (K-0051),
    and its weight is left in cash until the next weekly rebalance. A short coin leaves S on its own when age_j
    passes young_max_days, so each young coin is held short for about (young_max_days - min_age_days) days, about
    11 months at the primary values. Seasoned coins stay long for as long as they are in the universe. Funding is
    charged by the engine (longs pay positive funding, shorts receive it, and shorts pay when funding is negative).
    No date literals and no named instruments: the legs come only from listing age and the universe.'
  params:
    min_age_days:
      grid:
      - 14
      - 30
      - 60
      value: 30
    young_max_days:
      grid:
      - 270
      - 365
      - 540
      value: 365
  selection_procedure: The primary values were fixed before any data was seen. 365 days is the conventional vesting
    cliff, and 30 days skips the first month, in which Benedetti and Kostovetsky report continued post-listing appreciation.
    The grid is for the G2 neighbor test only and is never used to choose a configuration.
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At each weekly decision date t (after the close of the Sunday UTC day), every point-in-time top-30 perp
    whose underlying listing age is between min_age_days and young_max_days (the short leg S as defined in the signal,
    with at least 30 daily perp returns) is an event with side -1 (it should underperform). No other instrument
    is marked: seasoned and middle-aged universe members are the unmarked peers, so every date keeps well over 3
    unmarked peers. The claim is that, from the next open, young coins underperform the other universe members over
    the following 60 days, and that the gap grows with the horizon.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
