falsification_criteria:
- 'Mechanism: the side-adjusted 60-day abnormal return of the young-coin events is not above the 95th percentile
  of the time-shifted placebos, or has the wrong sign in two of the three dev sub-periods.'
- 'Mechanism: the latest third of dev does not show young coins underperforming their peers at 60 days (an overhang
  that exists only early is not the claimed supply mechanism; K-0060).'
- 'Mechanism shape: the descriptive 60-day abnormal return is not larger in magnitude than the 21-day one. A supply
  overhang builds with time; an effect that sits in the first weeks is a listing-hype reversal, not vesting.'
- 'Strategy: net Sharpe on dev (after costs and funding) below 0.5, or not above T-bill Sharpe + 0.10, or the bootstrap
  bound of the Sharpe difference against T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (young_max_days 270/540, min_age_days 14/60 and their combinations)
  beat the T-bill bar, or the book fails at doubled costs.'
- 'Sub-periods: one third of dev carries more than 60 % of the log return, or fewer than two thirds beat T-bills.'
notes: 'Family and history. This reuses new-listing-overhang (H-0004, and H-0021, which found no events). It is
  the follow-up that the H-0004 lesson left open: an implementable version on perps with funding charged, and a
  control for beta and liquidity. Changes from H-0004: (1) the short leg trades perps, so shorting has a real cost
  through funding, instead of free spot shorts; (2) the legs are sized beta-neutral, and both sides come from the
  same point-in-time top-30 liquidity universe, so the spread is not just high beta or illiquidity against BTC;
  (3) a mechanism test runs first, which H-0004 never had; (4) the horizon is set by the vesting-schedule argument
  (cliff at about a year), not tuned. The listing-age window is not a rescue of H-0004: the primary values are the
  conventional ones, and the neighbors are pre-registered. The "longer history" that the lesson asked for cannot
  be had on perps (dev 2020-2022). This is a ''cannot tell'' risk the card accepts (K-0006), and the mechanism test
  is the main deliverable. Brief fit: the brief asks for a long holding horizon in crypto. Each young coin is held
  short for about 11 months and seasoned coins are held for years. The book rebalances weekly only to admit new
  listings, retire coins that come of age and keep the beta neutral. The mechanism horizon is capped at 60 days
  by the schema, so 60 is the primary horizon. Only the age signal is long-horizon; nothing is traded on a short-term
  signal. Power and cost, stated in advance (K-0053, K-0071). Round-trip cost on liquid perps is about 25-35 bps,
  which is negligible against a 60-day horizon, so the cost check should not bind. The placebo bar will: 60-day
  idiosyncratic moves of altcoins are tens of percent, and young coins share alt beta within a date. My rough guess
  is a placebo 95th-percentile bar of the order of 7-10 % per 60 days, so the effect must be large (young coins
  lagging peers by roughly 40 % a year) to pass. A near miss with the right sign in every third should be read as
  ''cannot tell'', not as promise. Expected events: about 3-10 young coins in the top 30 on each of about 140 weekly
  dates, so several hundred marked events (overlapping) on well over 30 dates. Early 2020 may have fewer than 3
  young coins in the universe (the book is flat then), and the mechanism test will skip those dates. Biases and
  their direction. Delisted pairs are only partly present in the archive, and dead young tokens are the likeliest
  to be missing. That biases against this card: the short leg loses its best shorts. Listing age is censored at
  the start of the spot data (mid-2017). This affects only coins that are seasoned in every case by 2020. The point-in-time
  top-30 filter means only young coins that became liquid are shorted. These are the ones with the most retail demand,
  which is the claimed counterparty, but also the ones with squeeze risk. Negative funding on crowded young shorts
  is charged by the engine. If the price effect exists but funding eats it, the mechanism test passes and the strategy
  fails: that answer is informative too. Study 10 found crypto short legs flipping sign between dev and holdout.
  This card''s short leg is chosen by a structural supply variable, not by trend, but the same risk applies and
  G4 is the arbiter. Benedetti and Kostovetsky (ICO-era sample) report positive abnormal returns in the first 30
  trading days after listing. The card skips that window (min_age_days) rather than fighting it, and min_age_days
  14 is the neighbor that tests whether this matters. No dates, episodes or named coins are used. The age rule fires
  on any coin in the universe.'
