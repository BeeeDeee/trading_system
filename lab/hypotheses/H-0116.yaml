id: H-0116
version: 1
title: Delayed stock response to rate, dollar and credit news, learned - LIQ-500 beta-neutral weekly in macro-shock
  weeks, LightGBM on estimated factor exposure x factor-specific shock, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors who trade a stock at prices that do not yet reflect last week''s rate, dollar or credit
    news because they only revalue on firm-specific news: generalist and retail holders who sell (buy) exposed names
    after the macro news is already public but before its firm-level impact is priced, and index or flow traders
    who are indifferent to the firm-level mapping.'
  why: 'Macro news (a move in Treasury yields, in the dollar or in credit spreads that the stock market as a whole
    did not explain) changes the cash flows and discount rates of individual firms by very different amounts. For
    firms with an obvious link (banks, homebuilders, exporters) it is priced at once; for firms whose exposure is
    real but indirect, investors with limited attention, who update a firm''s value mainly when firm-specific news
    arrives, map the macro move into its price only over the following days (gradual information diffusion, Hong,
    Torous and Valkanov 2007; slower in less visible names and for bad news, Hong, Lim and Stein 2000). The lab
    saw exactly this once, for oil: each stock''s estimated oil exposure times the oil-specific move of the last
    two weeks predicted the next days (H-0114, K-0156). This card asks whether the same diffusion exists for the
    three other macro prices a liquid US stock is most exposed to, using an exposure estimated from the stock''s
    own history, and lets a small gradient-boosted model learn where the delayed part of the response sits (stock
    has not yet moved, low visibility, negative news).'
  why_not_arbitraged: The exposure is estimated, noisy and indirect, so no single name offers a clear trade; harvesting
    it needs a weekly, many-name, beta-hedged book whose per-name edge is a few tens of basis points, which taker
    costs eat most of. Shocks cluster in a few episodes a year, so the trade carries episode risk and long idle
    periods, and sophisticated macro investors express rate and dollar views in futures, not in second-order equity
    exposures.
signal:
  description: 'Timing: decisions after the close of day t, trades at the open of t+1. Stock returns are used up
    to the close of t; the macro series (FRED, clock next_morning) only with values stamped on or before t-1. (1)
    Macro factors, daily changes: RATE = change of DGS10 (percentage points); DOLLAR = minus the log change of DEXUSEU
    (dollar strength against the euro); CREDIT = change of DBAA minus DAAA (percentage points). A missing macro
    day carries no change; the change over a gap is assigned to the next day with a value. MARKET = equal- weight
    mean daily total return of the LIQ-500 members of that day. (2) Factor-specific shocks: for each factor f, on
    each day regress its daily change on MARKET over the trailing 252 sessions ending t-1 (OLS with intercept) and
    keep the residuals; shock_f = sum of the residual daily changes over the 10 sessions ending t-1; z_f = shock_f
    / (std of the daily residuals over those 252 sessions x sqrt(10)). (3) Stock exposures, re-estimated on the
    first session of each month from the trailing 252 sessions ending the day before (a stock needs at least 200
    valid daily total returns, otherwise it is not scored): OLS of the stock''s daily total return on MARKET and
    the three market-residual factor changes of the same day. This gives beta_mkt, beta_rate, beta_dollar, beta_credit
    and the residual (idiosyncratic) return series. (4) Features per stock and day (each z-scored across the point-in-time
    members of that day by the framework helper): implied_rate = beta_rate x shock_rate; implied_dollar = beta_dollar
    x shock_dollar; implied_credit = beta_credit x shock_credit; realized = the stock''s total return over the 10
    sessions ending t minus beta_mkt x MARKET return over the same sessions; ivol = std of the stock''s residual
    daily return over the 63 sessions ending t-1; visibility = log of the stock''s mean dollar volume over the 63
    sessions ending t. (5) Gate: the gate is on for day t when max over f of |z_f| >= shock_z (factors without a
    valid z are ignored). (6) Model: lab.framework.ml.walk_forward with model gbm (LightGBM: n_estimators 100, num_leaves
    15, learning_rate 0.05, min_child_samples 500, other settings framework defaults), label = cross-sectional rank
    of the total return from the open of t+1 to the open of t+6 (horizon 5), training rows = member-days on which
    the gate is on (point-in-time rule, no future information), expanding window, refit every 63 rows, purge as
    the framework does. All columns are kept and non-members are masked per row (K-0134). (7) Book: on the first
    trading day of each week, if the gate is on, rank scored members by the model score; long the top `top` fraction
    and short the bottom `top` fraction, equal weight within each leg. Leg grosses L and S satisfy L + S = 1 and
    L x (mean beta_mkt of the long leg) = S x (mean beta_mkt of the short leg), each clipped to [0.35, 0.65], so
    the book is about beta-neutral at gross 1. Positions are held until the next weekly decision (about 5 sessions);
    if the gate is off at that decision, the book goes flat. Fewer than 50 scored members, or no trained model yet,
    means flat. A name that leaves the universe is closed at the next decision row where it is not a member (K-0051).'
  params:
    shock_z:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: On a weekly decision date with the gate on (max factor |z| >= shock_z), a stock enters the long (short)
    leg of the model score (top / bottom `top` fraction of scored members, not in the same leg at the previous weekly
    decision) and the sum implied_rate + implied_dollar + implied_credit (unstandardized, return units) is positive
    (negative); side +1 for long-leg entries, -1 for short-leg entries.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'implied_rate: monthly-estimated beta of the stock to market-residual daily changes of the 10y Treasury yield
    (252 sessions) x the yield''s market-residual move over the last 10 sessions (FRED DGS10, values to t-1); the
    rate news the stock should have priced'
  - 'implied_dollar: same construction for the dollar against the euro (minus log change of FRED DEXUSEU); the currency
    news the stock should have priced'
  - 'implied_credit: same construction for the Moody''s Baa-Aaa yield spread (fred_moody_yields_1d); the credit
    news the stock should have priced'
  - 'realized: the stock''s 10-session total return to the close of t minus beta_mkt x the equal-weight market return;
    how much of any news the price already shows'
  - 'ivol: 63-session std of the stock''s residual daily return from the exposure regression; limits to arbitrage
    and noise of the exposure estimate'
  - 'visibility: log of 63-session mean dollar volume; attention, diffusion should be slower in less visible names'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is a catch-up, not a level effect: a delayed move is predicted where the implied move
    is large AND the stock has not yet moved with it, and it should be larger in low-visibility, high-noise names
    and for negative implied moves (bad news travels slowly). A ridge on the same six features can only add them:
    it would put a reversal coefficient on realized everywhere and a drift coefficient on each implied move everywhere,
    so it cannot express ''implied minus what is already priced, only when the gap is large'' nor the sign and visibility
    dependence; a small tree ensemble can. Who pays: holders who revalue only on firm news and trade the exposed
    names at stale prices in the days after the macro move. If a ridge on the same rows does as well, the gain is
    plain diffusion (or plain reversal), not the conditional catch-up.'
