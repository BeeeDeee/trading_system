falsification_criteria:
- 'Mechanism: entries into the model''s legs on gate-on weeks whose summed implied move agrees with the side earn
  no abnormal return above the 95th percentile of the time-shifted placebos at 5 sessions, or gross per event is
  below the round-trip cost.'
- 'Decay: the mechanism average is wrong-signed in the latest third of dev (K-0060); then the diffusion is not a
  live effect even if the pooled test passes.'
- 'Shape: the 1- and 3-session averages are zero or negative while the 10-session average is the largest; that is
  slow drift, factor momentum or beta, not a diffusion that is priced within days.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbors of shock_z 1.5 and top 0.2 beat the benchmark, or doubled costs
  leave Sharpe below the benchmark.'
- 'Linear baseline: a ridge (framework ridge) on the same six features, rows, label and schedule gives the same
  or a better result, so the conditional catch-up the gbm is meant to find is not what pays.'
notes: 'Relation to H-0114 (same family on purpose): H-0114 found that each stock''s estimated oil exposure times
  the oil-specific move predicted the next days (mechanism passed, latest third wrong-signed, book under the absolute
  floor). This card deliberately leaves oil out, so none of H-0114''s shock episodes is reused as an event: it is
  an out-of-sample test of the same diffusion mechanism on three new macro news sources with their own episodes
  (rate shocks, dollar shocks, credit shocks), which also addresses H-0114''s main weakness, few independent oil
  episodes. Family reused because the mechanism (gradual diffusion of macro-price news to stocks through an exposure
  estimated from their own history) is the same; the name says oil, and the Chair may rename the family, but a new
  name to escape the trial count would be wrong. Differences that answer the H-0114 lesson: beta-neutral leg sizing
  (its short leg lost, K-0074), the ridge named as falsification, a declared shape and latest-third kill. Forecasts
  (written before any result, K-0120/K-0157): gate-on share of weekly dates at shock_z 1.5 about 25-40 % (three
  factors, partly independent, 10-session shocks persist), so about 280-450 gate-on weekly dates in 2000-2020; legs
  of 100 names each, about half new each week, about half of those with an agreeing implied sign: roughly 50 events
  per date, 14000-22000 events. Round trip in LIQ-500 about 12-15 bps (x2.5 before decimalization). Gross per event:
  central 15 bps, pessimistic 1.5 bps; H-0114''s oil version covered cost. Mean exposure about 0.25-0.4 (gross 1
  while the gate is on), so the absolute Sharpe floor of 0.5 for a market-neutral book is the likeliest strategy
  death even if the mechanism passes. First block of G1 (1999-2006) starts thin: exposures need 252 sessions and
  the first refit needs gate-on rows, so first scores come about 2000-2001. Rivals the event study cannot separate:
  factor momentum (the yield or dollar keeps trending, so exposed stocks keep moving through beta, not diffusion)
  and residual market beta of the legs (raw abnormal return, K-0074); both would show as a slow build with horizon,
  which the shape criterion names. Timing caveat: DEXUSEU is a noon fixing and Moody''s yields follow the bond calendar;
  using values to t-1 makes them conservative. No mechanism-irrelevant calendar or state feature is included (K-0137).'
