id: H-0168
version: 1
title: Hedge-failure rebound - after a session where US stocks fall sharply and Treasuries fall too, move a 60/40
  SPY/IEF book's bond sleeve into five US equity ETFs for 5 sessions
author_agent: scout
family: short-term-reversal
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - QQQ
  - IWM
  - DIA
  - MDY
  - IEF
  - TLT
  - SHY
  kind: instruments
mechanism:
  counterparty: 'Mechanical de-risking money: volatility-target and managed-volatility balanced funds, risk-parity
    books, and leveraged multi-asset investors whose risk limits are set on portfolio volatility or VaR. They sell
    equities (and bonds) after the stock-bond hedge fails, whatever the price, and buy back only once trailing volatility
    has come down, weeks later.'
  why: 'On most sessions when US stocks fall sharply, Treasuries rally, so a stock-bond portfolio''s loss and measured
    volatility rise only a little. On the sessions when stocks fall sharply and Treasuries fall as well, the hedge
    fails. The realized volatility and VaR of every balanced, risk-parity and volatility-targeting book jump at
    once, because the stock-bond correlation flips positive just when equity volatility spikes. Those books, and
    leveraged investors with margin or redemption limits, then cut gross exposure in everything liquid, stocks and
    Treasuries alike, regardless of price. That is the funding-liquidity spiral of Brunnermeier and Pedersen. The
    selling is non-informational, so the price concession it leaves in equities should be paid back to whoever provides
    liquidity over the following week. The claim is that equity ETFs beat Treasury and cash-like ETFs over the next
    5 sessions after such hedge-failure sessions. The signal comes from the bond market: the same equity drop is
    an event only when Treasuries did not rally.'
  why_not_arbitraged: The would-be liquidity providers (dealers, multi-strategy and relative-value funds) hold the
    same stock-bond hedges. Their own VaR and margin rise on the same sessions, and dealer balance sheets are tightest
    exactly then. The events cluster in stress episodes with fat-tailed outcomes, so buying them takes risk capital
    that is scarce at that moment. A rebound bet is also a market-timing bet that most mandates cannot take.
signal:
  description: 'Data: daily total returns of SPY, QQQ, IWM, DIA, MDY, IEF, TLT and SHY from sharadar_sfp. The total
    return of instrument j on session t is r_j(t) = (1 + ret_co_j(t)) * (1 + ret_oc_j(t)) - 1, i.e. close t-1 to
    close t. Volatility: sigma(t) is the standard deviation of SPY''s daily total returns over the 63 sessions t-63
    .. t-1 (session t excluded), and needs at least 50 valid values, otherwise no event. Event (decided after the
    close of session t, using data up to that close only): r_SPY(t) <= -k_sigma * sigma(t) AND r_IEF(t) < 0 (Treasuries
    fell on the same session). If SPY or IEF has no bar on t, there is no event. Book (long-only, gross always 1.0,
    no cash): outside a window the target is the benchmark mix, 60 % SPY and 40 % IEF, reset to target on the first
    session of each month like the 60/40 benchmark, so that outside windows the book equals the benchmark. A window
    starts at the open of session t+1 after an event at the close of t. During a window the target is 68 % SPY and
    8 % each in QQQ, IWM, DIA and MDY, with 0 % IEF: the 40 % bond sleeve is moved in equal parts (8 % each) into
    the five equity ETFs. The window lasts hold_days open-to-open steps. At the open of session t+1+hold_days the
    book returns to 60 % SPY / 40 % IEF. If a new event occurs while a window is active, the window is restarted
    from the open after the new event (the count restarts; tilts never stack). If an equity ETF has no tradable
    bar at the open of the window, its 8 % goes to SPY. TLT and SHY are never traded: they are in the universe only
    as unmarked peers for the mechanism test. No other filters, no stops, no volatility scaling. Expected events
    (forecast, k_sigma 1.5): SPY at or below -1.5 sigma on roughly 5-7 % of sessions. In 2002-2020 the stock-bond
    correlation was mostly negative, so IEF also falls on perhaps a quarter to a third of those sessions: about
    3-6 event sessions a year, 50-110 event dates in dev, i.e. 250-550 marked ETF events (5 per date). Windows cover
    about 6-12 % of sessions.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
    k_sigma:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
  timeframes:
  - 1d
mechanism_test:
  event: After the close of session t on which SPY's total return is at or below -k_sigma times its trailing 63-session
    daily volatility (sessions t-63..t-1) AND IEF's total return is below zero (the stock-bond hedge failed), the
    five US equity ETFs SPY, QQQ, IWM, DIA and MDY are each marked with side +1. IEF, TLT and SHY are never marked
    and are the unmarked peers. The mechanism says the marked equity ETFs outperform the Treasury and cash-like
    peers from the open of t+1 over the next 5 sessions.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sfp
  description: SPY, QQQ, IWM, DIA, MDY, IEF, TLT, SHY; IEF/TLT/SHY start 2002-07-30, so the first event is possible
    after about 63 sessions (late 2002).
  fields:
  - ret_co
  - ret_oc
  - tradable
  frequency: 1d
  period:
  - '2002-07-30'
  - '2020-12-31'
holding_period:
  rebalance: event
  typical_days: 5
market_exposure: long_only
references:
- cite: Brunnermeier, Pedersen (2009) Market liquidity and funding liquidity, Review of Financial Studies
  year: 2009
falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of the marked equity ETFs (vs IEF, TLT, SHY) is not above
  the 95th percentile of the 200 time-shifted placebos.'
- 'Mechanism: fewer than 2 of the 3 dev thirds have a positive abnormal return, or the latest third (roughly 2015-2020)
  is negative (K-0060 decay kill condition).'
- 'Mechanism: gross abnormal return per event is below the round-trip cost of the equity ETFs (cost ratio < 1).'
- 'Mechanism shape: if the 1- and 3-session abnormal returns are negative and only the 10-21-session ones are positive,
  the de-risking is slower than the hold and the 5-day claim is refuted, even if the 5-day number passes.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (k_sigma 1.0 / 2.0, hold_days 3 / 8) beat the 60/40 benchmark, or
  the book no longer beats it at doubled costs.'
- 'Interpretation versus H-0041: if the abnormal return per event is not larger than H-0041''s flight-to-safety
  events (equity drop with Treasuries rallying), the Treasury condition adds nothing. Equity stress rebound is then
  one generic effect, and the hedge-failure de-risking story is not supported.'
notes: 'Why this card, and why it is not a near-copy: it is the control that the lesson of H-0041 asked for in its
  open questions ("the control (equity drops with Treasuries falling) could not be reported and needs its own card").
  H-0041 used equity drops on which long Treasuries rallied, a flight to safety. This card uses the disjoint set
  of equity drops on which Treasuries fell, a failed hedge. The two event sets do not overlap, and the mechanisms
  predict different things: generic stress rebound (K-0084) predicts the same rebound in both sets, while forced
  de-risking by volatility-target and risk-parity books predicts a larger rebound after hedge failures, because
  only then does the stock-bond portfolio''s measured risk jump. The family stays short-term-reversal on purpose:
  the payoff is liquidity provision after forced selling, the same economic family as H-0041 and studies 6-7, so
  its trials count there. No dataset is new; the bond-market condition uses IEF''s own close, because FRED yields
  have a next-morning clock. Book design, following K-0005, K-0027 and K-0064: an always-invested 60/40 book that
  equals the benchmark outside windows, and inside a window trades exactly the instruments the mechanism test marks
  (the bond sleeve moved into the five equity ETFs). The study and the book therefore measure the same spread, unlike
  H-0046, where the study pooled four equity ETFs but the book held SPY only. Arithmetic of the required effect
  (K-0064, K-0098): with about 3-6 windows a year and 40 % of the book moved, beating 60/40 by 0.10 Sharpe (60/40
  vol about 8 %, so about +0.8 %/yr at equal risk, plus a penalty for the extra equity risk inside windows) needs
  an equity-minus-Treasury gain of roughly 0.5-0.7 % per 5-session window. That is about the size the event study
  must show to clear its own placebo bar, so the two gates ask for roughly the same effect. If the study passes
  with a smaller effect, the likely death is G1 Sharpe excess, and the lab learns that the effect exists but is
  too small at this frequency. Most likely deaths, in order: (1) placebo percentile, because 50-110 event dates
  cluster in a few stress episodes, so the cloud is wide (K-0026, K-0034); (2) a negative latest third (K-0060);
  (3) G2 block concentration, if one crisis carries the result. Event-count risk: scout forecasts ran high before
  (K-0120). If G0 shows fewer than 200 marked events, the card cannot be judged, and it should not be rescued by
  lowering k_sigma after the fact. Cost: SPY, QQQ, IWM, DIA and MDY are among the most liquid ETFs, with a round
  trip of a few bps against an expected gross effect of tens of bps per event. Costs should not bind. A reference
  is included (theory of funding-liquidity spirals, 2009). G2''s publication-decay check therefore compares 2002-2008
  with 2009-2020, which is a fair test, since forced-selling rebounds should not decay with publication of a theory
  paper. No dates, episodes or instruments were chosen from known outcomes; the five equity ETFs are the standard
  broad US index trackers that existed in 2002.'
