falsification_criteria:
- 'Mechanism test: the side-adjusted TLT-minus-SHY return over 3 sessions after the pre- and post-auction events
  is not above the 95th percentile of the time-shifted placebos, or keeps its sign in fewer than 2 of 3 sub-periods,
  or gross per event is below the round-trip cost of TLT.'
- 'Mechanism shape: if the descriptive 1-session horizon after pre-auction events is positive (TLT outperforming
  SHY right before supply) while only longer horizons carry the sign, the effect is drift, not a supply concession.'
- Net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills at or below zero
  (G1).
- Fewer than 75 % of the window_days neighbors (2 and 4) beat the T-bill benchmark, or the median neighbor Sharpe
  is below 0.7 of the primary (G2).
- Net Sharpe at doubled costs does not beat T-bills (G2 costs).
- Sharpe excess after the 2013 publication year is below half of the pre-publication excess (G2 publication decay),
  or one of the three dev sub-periods carries more than 60 % of the log return.
notes: 'Brief fit: the brief asks for a 1-5 day horizon on US ETFs across asset classes. The mechanism here is specific
  to Treasury supply, so the book trades only a long-duration Treasury ETF, with a short-Treasury ETF as the control;
  spreading it across equities or credit would add noise without a mechanism. This is the closest fit with a real
  counterparty: a scheduled, mandated flow (K-0024 says the surviving short-horizon candidates are flow events)
  in the most liquid duration ETF, where the round trip costs a few bps against an expected concession of several
  bps of yield times a duration near 17. Why not a repeat: not lead-lag (mrel), not month-end rebalancing (H-0002
  used month-to-date stock/bond drift), not the turn-of-month family, not ETF premium arbitrage (H-0037). New family,
  one trial. Real auction dates are essential (auction weeks shifted over 2002-2020: 30y suspended 2001-2006, 7y
  reintroduced 2009, monthly 10y/30y reopenings), so a calendar proxy would be the H-0008 mistake (unvalidated date
  proxy); hence the new dataset request, built point-in-time on announcement dates so G0 truncation cannot see future
  auctions. Design choices: symmetric pre and post windows of equal length cancel the long-bond drift of the dev
  period, so the book does not win simply by being long duration in a bond bull market (K-0005); both directions
  in one event set double the events for placebo power (K-0026); about two clusters a month since 2008 and one to
  two before give several hundred events on several hundred dates. Known confound to watch: the end-of-month cluster
  (5y, 7y) has its post-auction long window spanning the month end, when index duration extension also lifts long
  Treasuries. If the Builder can report it, the mid-month cluster (10y, 30y) alone should show the same sign; if
  only end-of-month clusters carry the effect, read it as month-end duration flow, not auction concession. Idle
  cash: about half of the days are flat; if the engine does not credit T-bill interest on idle cash the T-bill comparison
  is handicapped (K-0048 open question). Most likely death: publication decay after 2013 or a gross effect per window
  too small next to TLT volatility for a 0.5 Sharpe.'
