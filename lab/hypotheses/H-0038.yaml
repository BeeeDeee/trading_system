title: Treasury auction supply cycle - short TLT in the 3 sessions up to each 5y-30y coupon auction cluster, long
  TLT in the 3 sessions after it, flat otherwise (SHY as duration control)
author_agent: scout
family: treasury-auction-supply-concession
asset_classes:
- us_etf
universe:
  instruments:
  - TLT
  - SHY
  kind: instruments
mechanism:
  counterparty: Dealers and hedgers who must take down and pre-hedge auction supply (they are paid the concession,
    but as insurers of inventory risk, not as informed traders), and the Treasury itself, which pays a hidden issuance
    cost; also duration holders that rebalance or sell into the pre-auction weakness for mandate reasons.
  why: 'Every few weeks the US Treasury sells tens of billions of new 5- to 30-year notes and bonds on a schedule
    announced in advance. Primary dealers must absorb most of the supply at the auction and lay it off over the
    following days; their risk-bearing capacity is limited and end investors do not move capital in time to pre-position,
    so dealers pre-hedge (sell) duration in the days before the auction and secondary-market prices fall to offer
    a concession, which is recovered as the new supply is distributed after the auction (Lou, Yan, Zhang 2013 document
    exactly this for Treasuries: prices drop in the few days before auctions and recover shortly after, although
    time and size are known in advance). Long-duration Treasury ETFs (TLT) carry this duration price pressure; short
    Treasuries (SHY, duration about 2) carry little of it, so TLT minus SHY isolates the duration concession.'
  why_not_arbitraged: Pre-positioning against the cycle means carrying unhedged duration for days for a premium
    of a few basis points of yield, small next to the daily volatility of long bonds; dealer balance sheets are
    constrained (capital, leverage ratio) and real-money investors move slowly (slow-moving capital). The effect
    is a compensation for inventory risk, so it should shrink but not vanish when dealer capacity is plentiful.
signal:
  description: 'Inputs: the daily PIT auction-calendar series of the requested dataset treasury_auctions_1d (see
    data_requirements), using only nominal fixed-coupon notes and bonds with original term of 5 years or more (5,
    7, 10, 20, 30 years; new issues and reopenings; bills, 2y, 3y, TIPS and FRNs excluded), each auction usable
    only from the close of its announcement date. Two series per session d (us_close clock): next_sessions(d) =
    number of XNYS sessions from d to the next such auction announced on or before d (1 = auction on the next session;
    NaN if none announced), and last_sessions(d) = sessions since the most recent such auction (0 on the auction
    day itself, known at its close because results are public at 13:00 ET). Rule, evaluated after the close of each
    session d, position held from the open of d+1 (filled at the next open): (1) if 1 <= next_sessions(d) <= window_days,
    weight TLT = -1 (pre-auction short; this includes the auction day itself, and an auction inside the window keeps
    the short on, so a cluster of auctions on consecutive days such as 10y then 30y is one window ending at the
    open after the last auction); (2) else if 0 <= last_sessions(d) <= window_days - 1, weight TLT = +1 (post-auction
    long, for window_days sessions starting at the open after the last auction of the cluster); (3) else weight
    0 (cash). Rule (1) takes precedence over rule (2). SHY always has weight 0 in the strategy: it is in the universe
    only as the low-duration reference of the mechanism test. If TLT has no bar on a session, keep the previous
    weight; if the auction series is NaN (nothing announced), rule (1) does not fire. Gross is at most 1, no leverage.
    Implementation note: weights change only on window starts, the pre-to-post flip and window ends, so the book
    trades about four units of turnover per auction cluster.'
  params:
    window_days:
      grid:
      - 2
      - 3
      - 4
      value: 3
  timeframes:
  - 1d
mechanism_test:
  event: 'Two event types on TLT only, in one mask. Pre-auction: after the close of the session on which the strategy
    first enters the short state of an auction cluster (next qualifying 5y-30y coupon auction is window_days sessions
    ahead, i.e. the short starts at the next open), side -1. Post-auction: after the close of the last auction day
    of a cluster with no further qualifying auction within window_days sessions (the long starts at the next open),
    side +1. Abnormal return = side x (TLT return from the next open to the close of t+h minus SHY over the same
    span), since SHY is the only other instrument. SHY never has an event.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 3
