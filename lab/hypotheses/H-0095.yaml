# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0095
version: 1
title: Learned selection of drifting earnings reactions - LIQ-500 long-only cap-weighted core plus 5-day tilt into
  top-scored 8-K release reactions (LightGBM on release events)
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who anchor on their prior view of the firm and update only part of the way on the release
    (underreaction to earnings news, strongest for news that confirms the last quarter); opening-auction traders
    who fade the gap; slow institutional capital that builds positions over several sessions after the release and
    pays the drift to whoever buys first.
  why: 'The market''s own reaction on the real earnings-release session predicts same-direction abnormal returns
    over the next sessions in liquid US stocks (the lab''s strongest mechanism result, K-0046: H-0028, H-0031, H-0033
    all cleared the placebo bar, positive in every third, mostly in the first sessions after entry). But it is too
    small after costs when every large reaction is traded alike. The claim here is that underreaction is not uniform.
    It is larger when the reaction shows real news, not opening noise: the opening gap is confirmed by the regular-session
    move of the same day (institutions trading with the news during the day, not fading a retail-driven open), it
    comes on heavy release-session volume, it was not anticipated by a pre-release run-up in the same direction,
    and it has the same sign as the stock''s previous release reaction (serially correlated earnings news, which
    investors treat as independent each quarter; Bernard and Thomas). These are sign-conditional and threshold conditions,
    so a small tree model trained only on release events should rank reactions by expected drift better than the
    reaction size alone. The higher gross per traded event is what should lift a long-only tilt over the margin
    H-0033 missed.'
  why_not_arbitraged: The drift per event is small next to the round trip, the risk is idiosyncratic and event-clustered
    (earnings seasons), and harvesting it needs daily trading in names that just moved several standard deviations.
    A market-neutral book on it did not beat T-bills in the lab (H-0028, H-0031), so arbitrage capital earns little
    on the plain version. Only a cheaper way to take it (a long-only tilt on a benchmark-like core, entering only
    the best events) can keep a margin.
signal:
  description: 'Data: sharadar_sep (ret_co, ret_oc, dollar_volume, close_u, tradable), sec_8k_item202 (ea_reaction_day)
    and sharadar_sf1 (sf1_arq_marketcap) on the point-in-time LIQ-500 universe. Decisions after the close of day
    t using data up to that close; trades at the open of t+1. EVENT ROWS: (t, stock) pairs where ea_reaction_day
    == 1 on session t (known at the close of t) and the stock is a LIQ-500 member on t. Only event rows are trained
    on and scored. FEATURES (computed for every member and date from data up to the close of t; then z-scored across
    all universe members of date t with the framework helper; then kept only on event rows, NaN elsewhere, so the
    model never sees non-event rows): f1 gap_z = (ret_co_t minus the equal-weight universe mean ret_co_t) / the
    stock''s 63-session std of daily close-to-close abnormal returns (close-to-close return minus the universe mean),
    sessions t-63..t-1; f2 intraday_z = the same for ret_oc_t (open-to-close of the release session); f3 abvol =
    log(dollar_volume_t / median dollar_volume over t-63..t-1); f4 runup = compounded abnormal close-to-close return
    over t-21..t-1 divided by (63-session abnormal std x sqrt(21)); f5 prev_reaction_z = the stock''s release-session
    abnormal close-to-close return / its then 63-session abnormal std at its most recent earlier ea_reaction_day
    within the last 140 sessions (0 if none); f6 liq_rank = percentile of 63-session mean dollar volume among members
    on t. A row with any NaN in f1-f4 or f6 is not used. LABEL (framework): total return from the open of t+1 to
    the open of t+1+horizon (horizon = 5), cross-sectionally ranked over all universe members of date t (so an event''s
    label is its 5-session rank against the whole universe, not against the few other events of that date), then
    kept on event rows only. If walk_forward can only rank among training rows, rank the label over all members
    first and pass it as the target. MODEL: lab.framework.ml.walk_forward with model gbm (LightGBM), n_estimators
    from params, num_leaves 8, learning_rate 0.05, min_child_samples 200, subsample 0.8, colsample 1.0, expanding
    window, refit every 63 rows, framework purge (labels fully realized by the decision date), framework seeds.
    The first fit needs at least 504 rows of history from the first non-NaN ea_reaction_day; before it, no event
    is scored. ENTRY: each scored event on date t gets a percentile = share of the event scores produced in the
    previous 252 sessions (each scored by the model in force on its own date) that are below it. Enter the tilt
    if the percentile >= entry_quantile; while fewer than 126 sessions of earlier scores exist there is no entry.
    Entry at the open of t+1, exit at the open of t+6 (5 sessions); a stock that leaves the universe during the
    hold is closed at the first decision where it is no longer a member; a second event of the same stock inside
    its hold does not add a slot. BOOK (score_weights / only_on in the Builder''s skeleton): weights are target
    weights for the open of t+1. Core = all LIQ-500 members weighted by sf1_arq_marketcap (the latest filed value;
    if missing, the stock''s 63-session mean dollar volume rescaled to the median marketcap/dollar-volume ratio
    of the members that have both), recomputed on the first session of each month and held fixed in between (members
    that leave the universe are dropped and the rest renormalized at the next decision). Tilt = 0.02 per open slot,
    added on top of the slot stock''s core weight; if the open slots would exceed a total tilt of 0.30, all new
    slots of that date are scaled down equally so the total is 0.30 (existing slots keep their weight). Core weights
    are multiplied by (1 - total tilt) every day so that gross = 1.0. No shorts, no cash except when no member has
    data. Missing sf1 for every member (should not happen) means the dollar-volume core.'
  params:
    entry_quantile:
      grid:
      - 0.6
      - 0.7
      - 0.8
      value: 0.7
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 member's release-session reaction (ea_reaction_day == 1 on day t) is scored by the walk-forward
    model and its score is at or above the entry_quantile of the event scores of the previous 252 sessions, i.e.
    the stock enters the tilt at the open of t+1; side +1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'gap_z: overnight (previous close to release-session open) return of the release session minus the universe
    mean, scaled by the stock''s 63-session abnormal-return std; the news shock as first priced at the open (sharadar_sep
    ret_co)'
  - 'intraday_z: release-session open-to-close return minus the universe mean, same scaling; whether regular-session
    trading confirms or fades the gap (sharadar_sep ret_oc)'
  - 'abvol: log of release-session dollar volume over its 63-session median; how much new information and disagreement
    the release produced (sharadar_sep dollar_volume)'
  - 'runup: 21-session abnormal return before the release session, vol-scaled; how much of the news was anticipated
    and already priced (sharadar_sep returns)'
  - 'prev_reaction_z: the stock''s vol-scaled reaction at its previous 8-K Item 2.02 release within 140 sessions,
    0 if none; serial correlation of earnings news (sec_8k_item202 + returns)'
  - 'liq_rank: percentile of 63-session mean dollar volume among members; coverage and limits to arbitrage, drift
    is expected larger in the less liquid part of LIQ-500 (sharadar_sep dollar_volume)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The drift claim is sign-conditional, and a ridge on these six features cannot express that. (1)
    Confirmation: drift should follow when gap and intraday move have the same sign and be weak or reversed when
    the session fades the gap. That is a product of signs, while ridge only adds gap and intraday linearly, so a
    large faded gap and a large confirmed gap get similar scores. (2) Anticipation: a run-up in the same direction
    as the reaction should cut the drift and an opposite run-up should raise it, again an interaction of the run-up
    with the reaction sign. (3) Persistence: a reaction with the same sign as the previous release should drift
    more (Bernard and Thomas), an interaction of prev_reaction_z with the current sign. (4) Threshold: small reactions
    are noise, so the payoff is flat near zero and rises only beyond a size, and abnormal volume should amplify
    only large reactions. Depth-limited trees (8 leaves) can represent each of these in a few splits. Who pays:
    the underreacting holders and gap-faders named in the mechanism, and they pay most in the confirmed, unanticipated,
    persistent cases. If ridge on the same rows and features ranks events as well, the selection is only reaction
    size, i.e. H-0033 again, and this card has found nothing.'
