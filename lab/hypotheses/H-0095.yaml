falsification_criteria:
- Net Sharpe of the book on dev is below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference is
  not above zero (G1).
- 'Mechanism: tilt-entry events (top entry_quantile of trailing event scores) do not beat the 95th percentile of
  the time-shifted placebos at 5 sessions, or their gross abnormal return per event is below the round-trip cost.'
- 'Mechanism decay: the average abnormal return of the tilt-entry events in the latest third of dev is zero or negative
  (K-0060); the card is then dead even if the pooled test passes.'
- 'Horizon shape: the descriptive 1-session abnormal return of tilt-entry events is zero or wrong-signed, i.e. the
  gain is not a post-release reaction but slow drift.'
- 'Linear baseline: ridge (framework ridge, alpha 1.0) on the same six features, same event rows, label, schedule
  and book gives an equal or higher net Sharpe or event gross. The nonlinearity does not pay and the card is the
  plain reaction drift of H-0033.'
- 'G2: fewer than 75 % of the neighbors of n_estimators 100 and entry_quantile 0.7 beat SPY_TR, or the book does
  not beat SPY_TR at doubled costs.'
notes: 'Brief: short horizon (5 sessions), US single stocks cross-sectional, learned model. No idea in the lab''s
  evidence other than the earnings-release reaction has cleared cost at this horizon in LIQ-500 (K-0024, K-0133,
  K-0083), so this card builds on it and files under its family on purpose: the trials of H-0024, H-0028, H-0031,
  H-0033 and H-0034 count against it. How it differs from earlier cards: (a) from H-0033 (positive-reaction tilt
  on a cap-weighted core, just under the margin), it selects events by a learned score trained only on release events,
  with features about the reaction''s quality (gap versus regular session, volume, anticipation, persistence) rather
  than a reaction-size cut. Slot weight 0.02, cap 0.30 and hold 5 were set before seeing anything, from the K-0046
  finding that the drift sits in the first sessions. They were not tuned to H-0033''s miss (whose exact values I
  cannot see). (b) From H-0094 (learned score over all rows, own-move, release, volume and volatility features,
  dollar-neutral daily cohorts, died on cost): this model never sees non-release rows, so it does not mix no-news
  reversal and attention give-back into the score, and it has no short side, no hedge basket and no flat-otherwise
  book (K-0027, K-0031). Not a market-neutral reaction book, so the stop rule of H-0031 does not apply; the Skeptic
  may judge otherwise. FORECASTS (K-0098, K-0120, K-0125): release events among LIQ-500 members with 8-K coverage
  about 1,400-1,800 a year from 2005; first fit about two years later, so scored events about 2007-2020, about 20,000-24,000;
  tilt entries (top 30 %) about 6,000-7,000 on about 2,000-2,500 dates (G1 events), about 450-500 a year. Mean tilt
  about 0.18-0.20 (entries x 5 / 252 x 0.02); in peak weeks of earnings seasons the 0.30 cap binds, so the real
  tilt is lower in exactly those weeks (K-0125), probably about 0.15. Gross exposure is always 1.0. Round trip per
  slot: 6-12 bps for the event stock (3/6 bps half spread by rank) plus about 6 bps for the core funding trades,
  about 12-18 bps. Needed: about 40 bps gross abnormal return per entry over 5 sessions for about +2 %/year over
  the core, which is roughly +0.10-0.15 Sharpe at about 17 % book volatility. If the selected events earn only what
  a plain reaction-size cut earns (K-0130: treat forecasts as upper bounds), the book falls just short of the margin
  as H-0033 did, and the ridge criterion will show whether selection added anything. Confounds: the cap-weighted
  core built from filed market caps is a proxy for SPY (staleness up to a quarter, LIQ-500 rather than S&P 500 membership),
  so part of the difference to SPY can be the core. Tilt-entry stocks may have a higher beta than their peers (K-0074),
  which inflates the raw abnormal return in up markets. Training sample: a few thousand event rows at the first
  fit and tens of thousands by 2020, with 6 features and 8-leaf trees with min_child_samples 200, so the model capacity
  is small on purpose. 8-K coverage leans toward survivors (K-0035). No date literals, no named stocks. G4 is the
  ceiling (no forward stock data).'
