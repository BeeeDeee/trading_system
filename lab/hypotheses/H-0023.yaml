falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the predicted-announcement events does not exceed the
  95th percentile of the 200 time-shifted placebos, or keeps its sign in fewer than 2 of 3 sub-periods: no announcement
  premium in LIQ-500 even with real dates.'
- 'Mechanism: gross abnormal return per event below the round-trip cost of trading it, or (K-0030) below cost in
  the latest third of the dev period alone: the premium exists but is not tradable at this horizon.'
- 'Proxy check (diagnostic, not a gate): fewer than 60 % of predicted sessions p have an actual Item 2.02 reaction
  session within p-2 .. p+2; then the date prediction, not the premium, is the weak link.'
- 'Strategy: net Sharpe on dev below 0.5 or below T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  vs T-bills below zero.'
- 'Robustness: the neighbors window_days 3 and 7 do not beat the T-bill bar, or the strategy fails the bar at costs
  x2.'
- 'Publication: post-publication Sharpe excess below half the pre-publication one.'
notes: 'Brief fit: US single stocks, LIQ-500, cross-sectional, 5-session hold, mechanism test declared. Why this
  is not a third retry of a dead proxy: H-0008 predicted announcement weeks from volume seasonality and H-0015 from
  last year''s SF1-validated volume spike; both lessons (and K-0004, H-0009) name real announcement dates as the
  missing input, and H-0015''s placebo problem came from selecting names with a clean yearly volume spike. Here
  the dates come from the firms'' own 8-K Item 2.02 filings, so nearly every LIQ-500 firm enters the event set and
  no volume rule selects names. The family name is reused on purpose: this is the third trial of earnings-announcement-premium,
  counted as such. The prediction rule (same week 52 weeks later) is the standard one in this literature; Johnson
  and So (2018) show that firms deviating from it carry news, which here only adds noise to the window, not look-ahead.
  Data: the new dataset is essential, because the mechanism is about the announcement date and SF1 filing dates
  lag the press release by days to weeks (K-0004). The SEC submissions API is free and public, about one JSON per
  CIK; the hard part for the Archivist is the CIK to permaticker map (Sharadar tickers table) and parsing acceptanceDateTime.
  If the map cannot be built, park the card rather than substitute SF1 filing dates. Dev sample effectively starts
  about a year after the 2004 Item 2.02 introduction (first predicted dates) and runs to the end of dev. G0 note
  (K-0028): the synthetic market needs fake ea_reaction_day flags (one per stock per quarter) or the look-ahead
  check is vacuous. Expected weak points: the premium in large caps may be only a few basis points per session and
  close to the 6-12 bps round trip (K-0030/K-0031), the long leg carries single-name earnings jumps, and publication
  decay (references 2007-2018 fall inside dev).'
