id: H-0023
version: 1
title: Earnings-announcement premium on real 8-K dates - LIQ-500 dollar-neutral, long a 5-session window around
  last year's Item 2.02 date + 52 weeks
author_agent: scout
family: earnings-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders and liquidity providers who sell into announcement-driven buying by inattentive retail investors,
    and investors who reduce or hedge positions before announcements to avoid event risk (de-risking before the
    date), accepting a lower return for not carrying the announcement jump.
  why: 'Stocks earn abnormally high returns in the days around scheduled earnings announcements (Frazzini and Lamont
    2007; Barber, De George, Lehavy and Trueman 2013). Two non-exclusive channels: (1) attention-driven buying:
    an announcement puts the stock in the news, individual investors, who are net buyers of attention-grabbing stocks
    and rarely short, buy around the date, and the price is pushed up for a few days; (2) risk: earnings announcements
    carry systematic news (Savor and Wilson 2016), so holders bearing the announcement-window risk are compensated.
    Both predict a positive abnormal return concentrated in the few sessions around the announcement, for which
    the timing is highly predictable because firms announce in the same week of the same quarter every year. The
    lab has tested this twice with volume-based date proxies (H-0008, H-0015) and could not tell whether the premium
    or the proxy failed; this card uses real announcement dates from SEC 8-K Item 2.02 filings.'
  why_not_arbitraged: Harvesting it means carrying single-name earnings jump risk (a 5-10 % move per name is common)
    on many names at once with weekly full rotation, which is costly for a capacity-limited arbitrageur; if the
    channel is risk, it is a premium for bearing announcement risk and is not supposed to vanish.
signal:
  description: 'Inputs: the new dataset sec_8k_item202 (per sharadar_sep stock, a daily flag ea_reaction_day = 1
    on the reaction session of each 8-K filing that lists Item 2.02 ''Results of Operations and Financial Condition'';
    the reaction session is the first XNYS session whose 16:00 ET close is at or after the EDGAR acceptance time,
    so a filing accepted after the close maps to the next session) and sharadar_sep returns, tradable flags and
    LIQ-500 membership. (1) Primary announcements: a reaction session a of stock j counts only if j has no other
    Item 2.02 reaction session in the 45 calendar days before a (drops amendments, pre-announcements, duplicates).
    (2) Predicted next announcement: p = the first XNYS session on or after a + 364 calendar days (52 weeks, same
    weekday). Known at the close of a, so it is point-in-time long before it is used. (3) Event: after the close
    of day t, stock j is an event if t is exactly h = (window_days + 1) / 2 sessions before p (t + h = p), j is
    a LIQ-500 member and tradable at t, and j has had no Item 2.02 reaction session in the 45 calendar days up to
    and including t (it has not already announced this quarter). (4) Position: j is bought at the open of t+1 and
    held for window_days sessions, so the holding covers the sessions p - (window_days - 1)/2 .. p + (window_days
    - 1)/2, and is sold at the open of t + window_days + 1. The position is kept even if the actual announcement
    comes on another day (no use of the actual date while holding); it is closed early only if j leaves the universe
    or stops being tradable (engine exit). (5) Weights, recomputed after every close: each name in an open window
    gets long weight min(0.5 / N_long, 0.05), where N_long is the number of names in an open window; the short leg
    is the sum of the long weights spread equally (negative) over all other LIQ-500 members tradable at t that are
    not in an open window. Dollar-neutral, gross <= 1, cash when no name is in a window. The short leg is re-weighted
    only when the set of window names changes. Missing data: a stock without any Item 2.02 filing a year earlier
    simply has no event; if sec_8k_item202 is missing for the whole panel the strategy must raise, not hold cash
    (K-0010). Filings with Item 2.02 exist only from late 2004, so the first events fall about a year later.'
  params:
    window_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
  timeframes:
  - 1d
  - 1y
mechanism_test:
  event: After the close of day t, stock j (LIQ-500 member, tradable) has a predicted earnings announcement session
    p - the first session on or after 364 calendar days after the reaction session of its primary 8-K Item 2.02
    filing about a year earlier - exactly 3 sessions ahead (t + 3 = p), and has filed no Item 2.02 8-K in the 45
    calendar days up to t. Side +1 (j should outperform the other members over the next 5 sessions, open t+1 to
    close t+5, which covers p-2 .. p+2).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sep
  fields:
  - ret_co
  - ret_oc
