- dataset: sec_8k_item202
  description: 'NEW dataset (free, public): earnings-release filing dates of US companies from SEC EDGAR. Source:
    the EDGAR submissions API https://data.sec.gov/submissions/CIK##########.json (plus the older-filings files
    it links), whose filing lists carry form, filingDate, acceptanceDateTime and the 8-K ''items'' field (e.g. ''2.02,9.01'').
    Keep form 8-K (and 8-K/A flagged separately or dropped) with item 2.02, which exists since the August 2004 8-K
    reform. Map CIK to the sharadar_sep permaticker through the CIK in the Sharadar tickers table (secfilings URL).
    Deliver as a stock-attached daily matrix (like sharadar_insiders): field ea_reaction_day = 1 on the first XNYS
    session whose 16:00 ET close is at or after the acceptance time, 0 otherwise, NaN before the CIK''s first filing
    in the API. Usable from the close of that session (a filing accepted before 16:00 ET is public at that close).
    Forward data: the same API is updated daily.'
  fields:
  - ea_reaction_day
  frequency: event
  period:
  - '2004-08-23'
  - '2026-09-25'
