id: H-0165
version: 1
title: Excess single-stock put demand as contrarian timing - 60/40 SPY/IEF tilted toward SPY for 5 sessions after
  a price- and VIX-residual high equity put/call ratio, away after a low one
author_agent: scout
family: option-demand-pressure
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - QQQ
  - IWM
  - DIA
  - IEF
  - TLT
  - SHY
  - AGG
  kind: instruments
mechanism:
  counterparty: Retail and small-institution option buyers who pay up for single-stock puts in waves of fear and
    for calls in waves of euphoria. They lose through the option premium, and the price pressure from the dealers'
    delta hedges reverses against the direction they bet on. The 60/40 tilt takes the other side of that hedging
    flow at the index level.
  why: 'The Cboe equity-option put/call volume ratio covers single-stock options only, which are mostly customer
    orders from retail and small institutions. When these customers buy many more puts than the recent stock move
    and the level of index implied volatility (VIX) can explain, they are paying for protection or bearish bets
    on top of what the price already reflects. Option market makers take the other side and delta-hedge by shorting
    the underlying stocks. That hedge selling pushes stock prices below fair value for a while. As the puts lose
    delta, expire or are closed, dealers buy back the hedges and prices recover. The mirror case: excess call buying
    (an unusually low ratio) makes dealers buy stock to hedge, prices run above fair value, and they fall back over
    the following days. The claim is about the option-volume information source only. Price stress and implied volatility
    are regressed out, so this is not the VIX-gated or stress-day market bounce of studies 6-7, H-0041 and H-0081,
    and not the index-level implied-vol information reading of H-0163. Signal market: equity options (Cboe volume
    statistics). Traded markets: US equity and Treasury ETFs.'
  why_not_arbitraged: At the index level the effect is a few tenths of a percent over a week, small against equity
    volatility. Fear windows are exactly when a contrarian long is most uncomfortable, and fear is sometimes right.
    Dealers hedge because of risk limits and do not trade on price levels. Discretionary traders treat put/call
    ratios as folklore and do not net out the price and VIX component, which is the part that carries no new information.
signal:
  description: 'Inputs per XNYS session s: PC_s = Cboe equity-option put/call volume ratio (dataset cboe_putcall_1d,
    field equity_pc); SPY total return from sharadar_sfp (ret_co, ret_oc); VIX_s = FRED VIXCLS close (fred_macro).
    Timing: at the decision after the close of session t, use only values stamped on sessions up to and including
    t-1. This one-session lag covers the next-morning clock of the Cboe and FRED series. Trades happen at the open
    of t+1. Step 1: p_s = mean of ln(PC) over sessions s-4..s (needs at least 4 valid values, else NaN). x_s = SPY
    log total return over sessions s-4..s. v_s = ln(VIX_s). Step 2: over the 252 sessions s = t-252..t-1 (needs
    at least 200 rows with p, x and v all valid), fit ordinary least squares p_s = a + b*x_s + c*v_s + e_s. z_t
    = e_{t-1} / standard deviation of the window''s residuals. No data after t-1 enters the fit. Step 3: fear signal
    if z_t >= k; complacency signal if z_t <= -k. Step 4, the book: always fully invested in SPY and IEF only (the
    other six instruments are not traded). The base target is SPY 0.60 / IEF 0.40. A fear signal on decision date
    t sets the target to SPY 0.80 / IEF 0.20 for the H sessions starting at the open of t+1. A complacency signal
    sets SPY 0.40 / IEF 0.60 for those H sessions. A new signal of either sign on a later decision date restarts
    the window with its own sign: the latest signal wins. Repeated same-sign signals extend the window. With no
    active window the target is the base 0.60/0.40. Trade only when the target changes, and also re-set to the current
    target on the first session of each month, as the monthly 60/40 benchmark does. Weights drift with prices between
    those dates. Missing data: if z_t cannot be computed (a gap in the put/call series, warm-up, or after the end
    of the delivered put/call history), no new signal is issued, an active window runs to its end, and the book
    then stays at the base 60/40. Fixed constants (not tuned): the 5-session smoothing, the 252-session fit window,
    the tilt of 0.20.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_threshold:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: After the close of session t, the price- and VIX-residual z-score z_t of the 5-session mean log equity
    put/call ratio (computed exactly as in the signal from data up to t-1) is >= z_threshold (excess put demand,
    fear) or <= -z_threshold (excess call demand, complacency). On a fear date the four US equity ETFs SPY, QQQ,
    IWM and DIA are marked with side +1 (should beat the peers). On a complacency date they are marked -1. The four
    Treasury and aggregate bond ETFs IEF, TLT, SHY and AGG are never marked and serve as same-date peers. Every
    session that meets the condition is an event date, so both sides are marked, the placebo mean of the equity-minus-bond
    premium nets to about zero, and the beta gap between equity and bond ETFs does not decide the sign.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
