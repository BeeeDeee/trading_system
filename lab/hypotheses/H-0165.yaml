falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the marked equity ETFs against the bond peers is not
  above the 95th percentile of the 200 time-shifted placebos, or keeps its sign in fewer than 2 of 3 sub-periods
  of dev.'
- 'Mechanism, sign: a negative average (equities lag bonds after excess put demand and lead after excess call demand)
  rejects the contrarian dealer-hedging claim and supports the informed-flow reading of Pan and Poteshman instead.'
- 'Mechanism, decay: the latest third of the event dates (about 2015-2019) has a negative average. Treat this as
  a kill condition per K-0060, even if the pooled test passes.'
- 'Mechanism, horizon: an effect that is absent at 1 and 3 sessions and only grows toward 10 sessions reads as slow
  drift, not a hedge unwind, and counts against the claim.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (z_threshold 1.0 / 2.0, hold_days 3 / 7 and their combinations)
  beat 60/40, or the result fails at doubled costs.'
notes: 'Brief fit: cross-asset at a 1-5 session horizon. The signal comes from the options market (Cboe equity-option
  volume) and FRED VIX; the trades are in equity and Treasury ETFs. This is not price lead-lag (the mrel scan and
  the lead-lag lessons): option volume is not a price, and the price and implied-vol parts are regressed out. Why
  a new information source: K-0208 and the H-0163 lesson say that index-level implied vol is exhausted in both readings,
  that option-level volume was never tested, and that ''only a different information source than index-level implied
  vol deserves a new card''. Family: new name option-demand-pressure, because the claim is dealer-hedging price
  pressure that reverses, the opposite of the information reading in options-lead-underlying (H-0163). If the Skeptic
  judges them one mechanism, merge into options-lead-underlying; a wrong-signed result here would support that family.
  Why not stress rebound (K-0084, studies 6-7, H-0041, H-0081): the fear state is the part of put demand that the
  past week''s SPY return and the VIX level do not explain, and the complacency side is marked too. A pure bounce
  after falls would show up in the regressors and not in the residual. Design follows K-0005, K-0027 and K-0064:
  an always-invested 60/40 tilt rather than a flat-otherwise window book, events on the instruments the book trades
  plus a small equity set, both sides marked. Forecasts (K-0120, K-0098; I have not seen the series): |z| >= 1.5
  on about 10-16 % of sessions, so about 300-480 signal dates from late 2007 to late 2019 (warm-up is 5 + 252 sessions
  from 2006-11), 1200-1900 marked events, fear and complacency roughly balanced and clustered in runs. Share of
  sessions inside a tilt window about 25-40 %. Mean exposure 1.0. Round trip for SPY/IEF about 2-4 bps, so the cost
  ratio is not the binding check. Expected book gain: tilt 0.20 x an assumed 0.3 % excess SPY-over-IEF per 5-session
  window x about 20-25 independent windows a year, roughly 0.6-1.5 % a year gross, against the +0.10 Sharpe margin,
  which needs about 0.9 % a year on a 60/40 book of about 9 % vol. So even if the mechanism passes, the G1 Sharpe
  excess may bind; the most likely death is the placebo percentile. Data caveats: the archived Cboe file ends 2019-10-04.
  If the Archivist cannot extend it, the book is plain 60/40 for the last 15 months of dev, which dilutes but does
  not bias the test. Holdout 2021+ needs the daily pages, and ETFs have no forward source, so this card can at best
  reach G4. Cboe exchange volume lost market share to other option exchanges over the sample; the 252-session window
  and the residual z-score absorb slow level shifts. The put/call series is essential to the mechanism and no loadable
  dataset carries option volume, hence the new-dataset request. Publication: Simon and Wiggins (2001) predates the
  data, so no pre-publication window exists in dev.'
