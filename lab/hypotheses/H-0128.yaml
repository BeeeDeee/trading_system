id: H-0128
version: 1
title: Credit-market news into levered equities, plain rule - LIQ-500 beta-tercile-matched long/short on net market
  leverage in weeks of a credit-specific Baa spread move, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity investors in levered firms who trade on equity-market information and ignore the credit market
    for days (attention-constrained generalists, index and style funds that rebalance on price, not on credit news);
    they hold levered stock at stale prices after credit news.
  why: 'Corporate bond spreads carry information about firm asset value and asset risk that the equity of levered
    firms absorbs with a delay. In a structural (Merton-type) view the equity of a levered firm is a call on its
    assets, so a change in the market price of credit risk that is NOT explained by the stock market or by Treasury
    yields (a credit-specific spread move) should move the value of highly levered equity more than that of unlevered
    equity. Equity investors price the aggregate stock market and Treasuries instantly but watch corporate-bond
    desks'' news (dealer balance sheets, default expectations, risk appetite of credit funds) with a lag, and the
    mapping from an aggregate credit move to each firm''s balance sheet takes work. The lab''s learned version of
    this exact idea (H-0126: LightGBM on leverage, coverage, volatility x shock) passed the mechanism test with
    gross above cost and the right sign in every third, the only cross-asset exposure design besides oil to do so
    (K-0173). The open question the lab named is whether the plain balance-sheet link carries it or the tree found
    something; this card is that linear/rule control, with the leverage sort done inside beta terciles so the legs
    carry similar market beta (K-0074).'
  why_not_arbitraged: The effect is small per stock and spread over many names, it is a long/short book that must
    carry short legs in levered (high-volatility, high-borrow-cost) stocks, the signal fires only in some weeks,
    and capital-structure arbitrage desks focus on single-name CDS-equity gaps rather than an aggregate spread-to-cross-section
    mapping. Credit and equity desks are organisationally separate.
signal:
  description: 'All decisions after the close of the last XNYS session of each calendar week (decision day t), trades
    at the open of the next session, using only data known by the close of t. (1) Credit shock. Daily spread S_d
    = DBAA_d - DGS10_d (fred_moody_yields_1d and fred_macro, both clock next_morning, so on day t use values stamped
    up to t-1 only; days with a missing value carry the last value). Market return M_d = equal-weighted mean of
    the total daily returns (ret_co + ret_oc compounded) of the LIQ-500 members on day d. Over the 5 sessions ending
    t-1: dS = change of S, dY = change of DGS10, rM = sum of M, and rM_lag = sum of M over the 5 sessions before
    those. Regress dS on [1, rM, rM_lag, dY] over non-overlapping 5-session windows of the past 252 sessions ending
    t-1 (about 50 observations; skip the week if fewer than 40 valid windows). The residual of the current window
    divided by the standard deviation of the regression residuals is z_t (the credit-specific shock; rM_lag removes
    stale bond prices catching up with last week''s stocks). (2) Shock week if |z_t| >= z_news. If not a shock week,
    the book is flat (cash) for the coming week. (3) Leverage. For each LIQ-500 member on t with sf1 values: net
    market leverage L = (debt - cashneq) / (debt + marketcap) from sf1_arq_debt, sf1_arq_cashneq, sf1_arq_marketcap
    (latest filing usable on t; missing or stale > 400 days = ineligible; marketcap <= 0 ineligible). Beta = OLS
    slope of the stock''s daily total return on M over the 252 sessions ending t (at least 200 valid days, else
    ineligible). (4) Legs. Split eligible members into beta terciles on t. Inside each tercile rank by L; the top
    leg_quantile of L are HIGH, the bottom leg_quantile are LOW (pooled over the three terciles, so both legs hold
    the same count from each beta tercile). (5) Side. Credit-specific widening (z_t >= z_news): long LOW, short
    HIGH. Credit-specific tightening (z_t <= -z_news): long HIGH, short LOW. Equal weights, +0.5 gross long and
    -0.5 gross short (dollar-neutral, gross 1). (6) Hold to the next weekly decision (5 sessions typically). At
    that decision the book is rebuilt by the same rule (unchanged names are kept, so consecutive same-sign shock
    weeks cost little). A stock that leaves the universe or becomes untradable is closed at the first decision row
    where it is no longer a member, its weight goes to cash (not re-spread). No other parameters.'
  params:
    leg_quantile:
      grid:
      - 0.15
      - 0.2
      - 0.25
      value: 0.2
    z_news:
      grid:
      - 0.75
      - 1.0
      - 1.25
      value: 1.0
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: 'A LIQ-500 stock enters a leg at a weekly decision in a credit-shock week (|z_t| >= z_news, z_t as in the
    signal): side +1 for the long leg (LOW leverage after a widening, HIGH leverage after a tightening), side -1
    for the short leg. Members not in a leg on that date are the unmarked peers. Both widening and tightening weeks
    are marked, so generic leverage-style drift cancels in the placebo mean.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
