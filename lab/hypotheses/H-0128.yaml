falsification_criteria:
- 'Mechanism: side-adjusted 5-day abnormal return of leg entries at or below the 95th percentile of the time-shifted
  placebos, or gross per event below the round-trip cost: the plain leverage map does not carry H-0126''s pass,
  so the learned version found something else or was luck.'
- 'Mechanism: the latest third of dev (about 2014-2020) has the wrong sign: the credit-to-equity lag has closed.'
- 'Mechanism shape: the 1-session horizon is wrong-signed and the effect only appears at 20 sessions: that is slow
  leverage drift, not delayed news absorption.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills below zero.'
- 'Robustness: fewer than 75 % of the z_news (0.75, 1.25) and leg_quantile (0.15, 0.25) neighbours meet the T-bill
  bar, or the book loses its Sharpe bar at doubled costs.'
notes: 'Family: filed under oil-shock-equity-underreaction because H-0126 (the learned version of this mechanism)
  is filed there; the trials count together, as they should. Why this is not a near-copy: H-0126 was a LightGBM
  over leverage, coverage and volatility; K-0173, K-0135 and the H-0126 lesson all name the missing linear control.
  This card is that control as a rule (no model, two round parameters), with beta matching by terciles instead of
  model-chosen legs. Brief fit: cross-asset (signal from the corporate-bond and Treasury markets via FRED, trades
  in US stocks), hold 5 days, mechanism test declared. Forecasts (K-0120, K-0171): about 1140 weekly decisions 1999-2020
  after warm-up; |z| >= 1.0 on about 25-30 % of weeks if residuals are roughly normal, fewer if fat-tailed, so about
  250-330 shock dates; each marks about 2 x 0.2 x ~430 eligible names = ~170 stocks, so about 40000-55000 events.
  Round trip in LIQ-500 about 11-12 bps per event. Gross per event: central 15 bps, pessimistic 3 bps (mechanism
  absent), optimistic 30 bps. Mean exposure about 0.25-0.3 at gross 1 (shock weeks x 1). Expected annual gain at
  the central case: about 13-15 shock weeks a year x 15 bps = about 2 % a year gross, minus about 1.5 % of cost
  (a full entry and exit of a gross-1 book in most shock weeks); with a weekly leverage-spread volatility near 1.5
  % the annualised volatility in 14 active weeks is about 5-6 %, so gross Sharpe about 0.35-0.4 at the central case
  and above 0.5 only at the optimistic case. Likeliest death: the mechanism passes (or nearly) and the book misses
  the absolute Sharpe floor of 0.5 like H-0126, because it is flat most weeks (K-0027) and the short leg in levered
  names loses (K-0172). Second likeliest: the plain map fails, which says H-0126''s pass needed the coverage/volatility
  interaction or was luck. Known confounds: financials carry high reported debt and will crowd the HIGH leg (no
  sector field is loadable; beta terciles partly control it); marketcap is frozen at the filing date (leverage is
  slow, acceptable); Moody''s Baa averages are seasoned bonds and can be stale, which the lagged market term addresses
  only partly. Episode concentration (2001-2002, 2008-2009, 2020) is possible; G2''s block check will show it. No
  references: Merton''s structural model is theory, not an anomaly paper, and I did not verify a specific empirical
  paper for this exact lag.'
