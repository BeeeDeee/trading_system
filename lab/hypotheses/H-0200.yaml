id: H-0200
version: 1
title: Insider buying relative to firm size - LIQ-500, weekly, long the top fifth of 91-day purchase value / market
  cap among new purchase filers, beta-scaled EW hedge, hold 4 weeks
author_agent: scout
family: insider-purchase-information
asset_classes:
- us_equity
- alt
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'The sellers in the weeks after the filing: investors who sold the stock on its prior weakness (insiders
    tend to buy after declines) and do not update on a filing they read as small in dollars, and benchmark-tracking
    holders of a less followed LIQ-500 name who do not process Form 4s at all.'
  why: An open-market purchase by an insider puts the insider's own wealth at risk on private information about
    the firm. How much that tells the market depends on how big the bet is relative to the firm, not on its dollar
    amount. A $500k purchase is a material, deliberate bet for a small LIQ-500 member and a token or signalling
    trade for a mega cap. The relative measure, trailing 91-day purchase value divided by market capitalisation,
    scores the purchase by the insider stake it implies. Outside investors see the Form 4 at once, but they usually
    read it as a headline (who bought, how many dollars) and do not scale it by firm size. Firms with a large relative
    purchase are also the less covered, smaller members of LIQ-500. The information in such a purchase (an undervalued
    business, a coming improvement the insider expects) should therefore come into the price slowly, over weeks
    rather than in the session after the filing. The literature finds that purchase-based abnormal returns build
    over months and are larger in smaller firms.
  why_not_arbitraged: The signal is sparse (a few names a week), idiosyncratic and carries the risk of a stock that
    has just fallen. The edge is a fraction of a percent per month per name, which is too small and too undiversified
    for a fund to lever. Filings cluster in sell-offs, so the trade has the worst timing for capital-constrained
    arbitrageurs. Most quant users of insider data use count or dollar thresholds (as H-0193 did) rather than stake
    relative to firm size.
signal:
  description: 'Data: sharadar_sep (LIQ-500, point-in-time membership, total returns ret_co + ret_oc), attached
    sharadar_insiders fields ins_buy_value_91d and ins_buy_n_91d (open-market purchases by filing date, usable from
    the day after the filing as the loader attaches them), attached sharadar_sf1 field sf1_arq_marketcap (frozen
    at the filing date). Decision: weekly, after the close of the last trading session of each calendar week (day
    t), using only data up to that close; trades at the open of the next session. (1) Market cap at t (K-0168):
    take sf1_arq_marketcap at its last change (the filing anchor) and grow it by the stock''s cumulative total return
    from that anchor session to t. Never use sharesbas x close_u. NaN marketcap (missing or stale) means the stock
    is excluded at t. (2) New-filer pool at t: LIQ-500 members at t with ins_buy_n_91d(t) > ins_buy_n_91d(t-5 sessions)
    (at least one new open-market purchase row filed during the week) and ins_buy_value_91d(t) > 0. NaN insider
    fields (before the first full 91-day window) mean no pool. (3) Ratio: r = ins_buy_value_91d(t) / marketcap(t),
    purchases only (no subtraction of sales; see notes). (4) Cohort: let n be the pool size. If n < 3, no cohort
    this week. Otherwise k = max(1, round(top_frac x n)), capped so that 2k <= n. The top k by r (ties broken by
    larger r first, then by lower instrument id) form this week''s long cohort. (The bottom k form the mechanism-test
    short side only; they are not traded.) (5) Long leg: a stock entering a cohort is held for hold_weeks weekly
    rebalances, so it exits at the rebalance hold_weeks weeks after entry. If it re-enters a cohort while held,
    its exit clock restarts; it never gets double weight. A held stock that leaves LIQ-500 or delists is dropped
    at the next rebalance (or by the engine). Each weekly rebalance, the N active long names get equal weight w
    = min(0.40 / N, 0.05). (6) Hedge (beta-scaled, K-0074): short an equal-weight basket of all LIQ-500 members
    at t that are not in the long leg. Its total notional is H = sum over long names of w_i x clip(beta_i, 0.5,
    1.5), where beta_i is the OLS beta of the stock''s daily close-to-close total return on the equal-weight LIQ-500
    member return over the last 252 sessions to t (at least 126 observations, else beta_i = 1.0). Max gross = 0.40
    + 0.60 = 1.0. (7) If no name is active, the book is flat (cash). There is no other filter, no regime rule and
    no date logic.'
  params:
    hold_weeks:
      grid:
      - 2
      - 4
      - 8
      value: 4
    top_frac:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: At a weekly decision date t (last session of the calendar week), a LIQ-500 stock with a new open-market
    purchase filing in the last 5 sessions whose ratio of trailing 91-day insider purchase value to market cap (sf1
    marketcap anchored at its filing and grown by total return) ranks in the top k of that week's filer pool (side
    +1) or in the bottom k of the same pool (side -1), with k = max(1, round(0.2 x pool size)), 2k <= pool size,
    and pools of fewer than 3 filers skipped. The mechanism says large stakes relative to firm size outperform and
    token stakes do not, so with both sides marked the side-adjusted mean is the top-minus-bottom dose-response.
  horizons:
  - 5
  - 10
  - 20
  - 40
  primary_horizon_days: 20
