falsification_criteria:
- 'Mechanism (G1): the side-adjusted 20-session abnormal return of the event set (top fifth +1, bottom fifth -1
  of the same ratio among the week''s filers) is at or below the 95th percentile of the time-shifted placebos, or
  its gross per event is below the round-trip cost: the top fifth does not beat the bottom fifth.'
- 'Top fifth versus bottom fifth, by side: if the top-fifth (+1) events alone do not earn more over 20 sessions
  than the bottom-fifth events (raw, against the same peers), the relative-stake claim is false even if the pooled
  test passes on the short side.'
- 'Parent''s failure: the side-adjusted 20-session effect is zero or negative in the last third of dev, or more
  than 60 % of the strategy''s dev log return comes from the earliest third (the block holding the 2008-2009 window).
  Either one falsifies the card, whatever the pooled result.'
- 'Strategy (G1): dev net Sharpe below 0.5, or below T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference at or below 0.'
- 'Robustness (G2): fewer than 75 % of the neighbours (top_frac 0.1/0.3, hold_weeks 2/8 and their combinations)
  beat the T-bill bar, or net Sharpe at doubled costs falls below the bar, or the S&P 500 alternative universe keeps
  less than half of the Sharpe.'
- 'Random entry (G2): the book does not beat the 95th percentile of same-turnover, same-exposure random entries.'
notes: 'owner_seed: G2V-1


  Variant of H-0193 (rejected at G2: dollar-threshold neighbours failed, return concentrated in the earliest third).
  Changes and why: (a) No dollar threshold. Purchase value is scaled by market cap and ranked within each week''s
  new-filer pool, so the signal is a stake relative to firm size, not a firm-size proxy. Because the cohort is a
  fixed fraction of the week''s pool, crisis weeks with many filers do not get a larger share. Per-name weights
  are capped at 0.05 and the long leg at 0.40, so a crisis-week burst of names cannot dominate the book. These are
  the direct answers to the parent''s G2 failure. (b) Hold of 4 weeks instead of 5 days. Three family cards (H-0012,
  H-0193, H-0194) found no drift in the first week. The lessons left monthly horizons open (H-0194, K-0235), and
  the literature places purchase returns over months. This is not a retune of the parent''s hold to save its event:
  the measure and the event set are new. It counts as a new trial of the family, and the grid (2/4/8 weeks) is G2-tested.
  A longer hold also brings the cost per event under the expected gross. A 5-day hold on a monthly-scale effect
  would just pay the round trip four times. (c) Hedge: the parent shorted mega caps against beaten-down event stocks,
  which left a beta gap (K-0074, lesson of H-0193). This card shorts an equal-weight LIQ-500 basket, closer in size
  to the event names, scaled by the long names'' 252-session betas. (d) Numerator is purchases only. I chose not
  to subtract ins_sell_value_91d. Most insider sales are diversification, option-exercise and liquidity sales, which
  the literature finds weakly informative. Their dollar size scales with the insiders'' existing holdings, which
  are largest in founder-led growth firms. Netting them would make the ratio partly a growth and holdings marker,
  and would bring back the firm-size mixing the variant is meant to remove. It would also cost a field and a degree
  of freedom. One choice, fixed in advance. (e) Market cap is sf1_arq_marketcap anchored at its filing and grown
  by total return (K-0168). It is never sharesbas x close_u. Fields: 6 SEP fields plus 3 attached. If the checker
  counts the SEP fields against the 6-field RAM cap (K-0023), drop close_u, dollar_volume and listed: the card needs
  only total returns, tradable and membership. Known confounds, stated in advance: the top fifth is mostly smaller
  and beaten-down LIQ-500 members, and the bottom fifth is mostly mega caps with token buys. The two-sided mechanism
  test therefore also carries a size and beta gap: an expected top beta of about 1.2-1.3 against about 1.0 for the
  bottom. In the mostly rising market of dev that favours the claim by roughly 0.2-0.3 % per 20 sessions, and mega-cap
  leadership late in dev works against it. G1 compares raw returns (K-0074), so the Librarian should read the by-side
  split and the by-third signs, not only the pooled number. The strategy''s beta-scaled hedge removes most of this
  gap from the book. Forecast: weekly pools of about 3-15 filers give about 1-3 names per side per week, so about
  1 500 events per side and over 500 event dates over dev. Expected long names active: about 4-12, mean gross about
  0.5-0.9. The book needs about 0.8-1 % abnormal return per name per 20 sessions to reach a net Sharpe of 0.5. The
  large-cap literature suggests 0.3-0.6 %, so my prior for a G1 pass is low (about 15 %), in line with K-0235. The
  most likely death is at G1 on the mechanism test: a positive pooled effect carried by the earliest third, or the
  bottom side (mega caps) beating the top side in the later years. Mechanism test: required, defined above (both
  sides marked, primary horizon 20 sessions = 4 weekly holds).'
