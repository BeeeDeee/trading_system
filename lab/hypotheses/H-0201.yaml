id: H-0201
version: 1
title: Quarterly index share-update pressure, rule-based - S&P 500, dollar-neutral 20 sessions before each quarterly
  rebalance, long largest pending share increases, short largest decreases
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: S&P 500 index funds and closely benchmarked managers who trade the share update at the rebalance
    close regardless of price because tracking error, not price, is their objective. They pay the premium to the
    intermediaries and pre-positioners who supply the shares.
  why: 'The S&P 500 is cap-weighted and S&P updates the share counts of continuing members once a quarter, effective
    after the close of the quarterly rebalance session (third Friday of March, June, September, December), using
    the latest public filings. Index funds and benchmarked managers must then hold the new counts: a member whose
    share count grew since the last update (stock comp, conversions, small offerings) must be bought, and one that
    shrank (buybacks) must be sold, in proportion to the change and whatever the price. The pending change can be
    computed from the 10-K/10-Q filings weeks in advance. If demand curves for single stocks slope down (Shleifer
    1986; Harris and Gurel 1986 for S&P list changes), this predictable, price-insensitive flow pushes pending-increase
    names up and pending-decrease names down in the weeks before the rebalance close, as intermediaries pre-position
    and then sell to (buy from) the trackers at the close. The card is the plain, model-free, market-neutral test
    of that claim, with share counts that are split-consistent by construction (K-0168).'
  why_not_arbitraged: Each quarterly update is small per name (a share change of 0.5-5 % times the passive holding
    is a fraction of a day of volume), so it is not worth a dedicated desk's capital in most names; the pre-positioning
    trade carries 20 sessions of idiosyncratic and style risk (pending increases lean to growth / high stock-comp
    firms, decreases to mature buyback firms) for a few tens of basis points; and the net-issuance anomaly works
    against it (issuers underperform, buyback firms outperform), so the trade fights a known drift. The effect may
    well have been arbitraged away; that is what the card tests.
signal:
  description: 'Universe: point-in-time S&P 500 members (universe kind sp500). Calendar: the quarterly rebalance
    session R of a quarter is the third Friday of March, June, September and December, or the last trading session
    before it if that Friday is not a session; it is computed from the weekday and month of the session dates only
    (known in advance, no date literals). The decision date of the quarter is d = the session W sessions before
    R (R is the W-th session after d), with W = window_sessions. Implied share count: for each stock, every new
    sf1 ARQ filing (detected as the first day on which sf1_arq_marketcap or sf1_arq_price changes; both are frozen
    at the filing date) gives S = sf1_arq_marketcap / sf1_arq_price, both taken from the same filing. Never use
    sharesbas, and never multiply any share count by close_u (K-0168). The filing session f of that filing is the
    session before its first usable day. Pending change: S_new = S of the latest filing usable at the close of d;
    S_ref = S of the latest filing usable at the close of the session 5 sessions before the previous quarter''s
    rebalance session (the approximate reference date of the last update). g = ln(S_new / S_ref). g is set to missing
    (stock not eligible this quarter) when: S_new and S_ref come from the same filing (no new filing, nothing pending);
    either is missing or non-positive; |g| >= 0.05 (S&P applies changes of 5 % or more, offerings and mergers, at
    the event rather than at the quarterly update, and they carry deal news); or a split or reverse split happened
    between the two filing sessions f_ref and f_new, detected as |ln(close_u(f_new) / close_u(f_ref)) - ln(total-return
    growth from close f_ref to close f_new, from ret_oc and ret_co)| > 0.15 (this makes g split-safe whether or
    not the vendor adjusts sf1 price for later splits). Eligible at d: member of the S&P 500 at the close of d,
    tradable at d, g not missing. Legs (after the close of d): long leg = the 50 eligible stocks with the largest
    g among those with g > 0.0025; short leg = the 50 eligible stocks with the smallest g among those with g < -0.0025
    (the 0.25 % floor removes rounding noise of marketcap / price). If fewer than 50 qualify on a side, take all
    that qualify; if fewer than 10 qualify on either side, skip the quarter (no positions). Weights: +0.5 / n_long
    on each long name and -0.5 / n_short on each short name (dollar-neutral, gross 1.0), set at d and traded at
    the open of d+1. Holding: the weights stay unchanged through the close of R (W sessions: opens of d+1 ... close
    of R); after the close of R the book goes flat, traded at the open of R+1. No rebalancing inside the window.
    A name that leaves the S&P 500, stops being tradable or delists inside the window is closed at the first decision
    row on which it is outside the universe (its weight goes to zero, not redistributed; delisting uses the terminal
    return). Between windows the book holds cash (T-bill). P&L from total returns only (ret_oc, ret_co); close_u
    is used only in the split guard.'
  params:
    window_sessions:
      grid:
      - 15
      - 20
      - 25
      value: 20
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'After the close of the decision date d (window_sessions = 20 sessions before a quarterly S&P 500 rebalance
    session R), a member enters the long leg (one of the 50 largest pending implied share-count increases g, side
    +1) or the short leg (one of the 50 largest pending decreases, side -1), exactly as in the signal. The claim:
    side-adjusted, these names beat the other members from the next open to the close of the rebalance session R
    (horizon 20), and do not do so in placebo weeks (the same event set shifted in time).'
  horizons:
  - 5
  - 10
  - 15
  - 20
  primary_horizon_days: 20
