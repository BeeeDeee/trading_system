falsification_criteria:
- 'Mechanism, placebo weeks (owner): the side-adjusted 20-session abnormal return of the leg entries does not exceed
  the 95th percentile of the 200 time-shifted placebos (the same stocks and legs placed in other weeks), so the
  spread is not specific to the pre-rebalance window.'
- 'Mechanism: the event average keeps its sign in fewer than 2 of the 3 dev blocks (H-0113''s event study was early-loaded),
  or gross per event is below the round-trip cost of a member.'
- 'Decrease leg alone (owner): in the G1 leg decomposition the short (pending-decrease) leg has a gross Sharpe at
  or below zero while the long leg''s is positive, i.e. the decreases did not fall by more than the market drift
  and the spread is an increase-only effect; the two-sided tracker-flow reading is then rejected even if the pooled
  test passes.'
- 'Tracker-close reading: if the descriptive event average at horizon 20 is not above that at horizon 15 (nothing
  is gained in the last 5 sessions, which contain the rebalance close), the pooled effect is a slow drift, not tracker
  pressure at the update.'
- 'Strategy: net Sharpe on dev below 0.5 or below T-bill + 0.10, or the bootstrap bound of the excess not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbors (window_sessions 15 and 25) beat the T-bill bar, or the result fails
  at doubled costs.'
notes: 'owner_seed: G2V-2. Parent H-0113 (same family, passed G2, died at G3 with DSR 0.51): its margin came from
  a core built as sharesbas x close_u (K-0168: shares split-adjusted to the end of the data times an unadjusted
  price, so later splitters were overweighted); with a split-consistent core the book matched SPY and the learned
  window added nothing measurable. This card removes all three problems: no learned model, no index core, no benchmark-relative
  tilt; it is a dollar-neutral spread judged against T-bills. Share counts come only from sf1_arq_marketcap / sf1_arq_price
  of the same filing, and only the ratio of two filings is used, so any vendor split adjustment cancels; a split
  between the two filings is excluded by the close_u-versus-total-return guard, so the measure is split-safe whether
  sf1 price is adjusted or not. Builder: please confirm on a few stocks that marketcap / price moves with sharesbas
  between filings (a definition check, not a result).

  Deviation from the owner''s 5-session window, and why: a dollar-neutral book held 5 of about 63 sessions a quarter
  has a mean exposure of about 0.08, below the G1 floor of 0.20 (K-0098, K-0225: flat days count as zero), so the
  5-session version cannot be judged. Two ways out were considered. (a) Add a post-rebalance reversal leg (flip
  the book for 10-15 sessions after R): rejected because the flipped leg is long buyback firms and short issuers,
  which is the net-issuance anomaly, so a pass could come from a different family, and the book''s long/short decomposition
  would mix both windows and make the owner''s decrease-leg check unreadable. (b) Start the window earlier and keep
  all trading inside the pre-rebalance period: chosen. The pending change is computable from filings weeks ahead,
  so pre-positioning by intermediaries should build into the close of R (as documented for the Russell reconstitution).
  The owner''s 5-session claim is still read: the descriptive horizons 15 and 20 give the gain of the last 5 sessions
  (falsification 4). Exposure arithmetic: 20 sessions at gross 1.0 per ~63-session quarter = about 0.32 if every
  quarter trades; forecast 0.27-0.32 (March windows can be thin when 10-Ks are late, and a quarter with fewer than
  10 names on a side is skipped); neighbor 15 gives about 0.24, neighbor 25 about 0.40. Why window 20 and not shorter:
  20 is the smallest round window with clear margin over the exposure floor; the March window then opens in mid/late
  February, when most large-accelerated 10-Ks are filed; names without a new filing are simply not eligible. Leg
  size 50 and the 0.25 %, 5 % and 15 % thresholds are fixed by construction (noise floor, S&P''s off-cycle rule
  for large changes, split detection), not tuned; only the window is gridded to keep the family''s trial count low
  (K-0154).

  Difference from other family members: H-0017, H-0022, H-0018 and H-0181 are membership changes (additions, deletions);
  this card uses only continuing members and their share updates, a different and far more frequent event (about
  100 names a quarter). Different from H-0113 as above.

  Forecasts (written before any run): first window about March 1999 (the sp500 universe needs 252 bars of history
  from 1998-01-02, and S_ref needs the previous quarter); about 85-88 quarters, about 85 event dates (G1 may count
  somewhat fewer, K-0095); about 80-100 entries a quarter, so 7000-8500 events. Round trip per name: half-spread
  5-6 bps per side for S&P 500 members (ranks up to 500, 5 bps floor), x2.5 before 2001-04, so about 11-12 bps after
  decimalization and about 13-15 bps on average over dev; book turnover 2.0 gross per quarter. Gross per event over
  20 sessions: central +10 bps, pessimistic <= 0 (early-loaded like H-0113), optimistic +35 bps. Book: long-short
  vol about 8-10 % annualized while invested, about 5 % on the whole period; net Sharpe central about 0.2. The G1
  Sharpe floor of 0.5 needs about +30 bps gross per event, so the most likely death is the mechanism cost ratio
  or the absolute Sharpe floor; a placebo-percentile failure would say the share-update pressure is not there at
  all.

  Known confounds, stated in advance: (1) net-issuance / buyback drift runs against the book (long issuers, short
  buyback firms); the time-shifted placebo keeps the same stocks and so nets it out of the mechanism test, but it
  drags the book. (2) Style and beta: increases lean to growth and high-beta names, so the dollar-neutral book has
  positive market beta; the event study benchmarks against the other members'' mean, not beta-adjusted. (3) The
  book exits at the open of R+1, so the overnight reversal of the closing-auction pressure is paid by the book but
  not by the event study (which ends at the close of R). (4) The decrease-leg criterion uses the G1 leg Sharpe,
  which also carries the market drift (a short leg loses in a rising market, K-0207); it is therefore strict: the
  decreases must fall by more than the market drift. G1 has no side split of the event study (K-0218); if one becomes
  available, the decrease side''s placebo percentile is the better reading. Untested on purpose (possible later
  cards, not this one): scaling g by passive demand over dollar volume, a beta-matched control, the 5-session window
  on a core.'
