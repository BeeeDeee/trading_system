falsification_criteria:
- 'Mechanism: the side-adjusted 42-day abnormal return of the declared event (top fifth +1, bottom fifth -1 of the
  gbm score within its sleeve) is not above the 95th percentile of the time-shifted placebos, or gross per event
  is below the ETF round-trip cost.'
- 'Mechanism: the latest third of the dev period has the wrong sign (K-0060), even if the pooled average passes.'
- Net Sharpe on dev below the 60/40 SPY/IEF benchmark + 0.10, or the bootstrap bound of the Sharpe difference at
  or below zero.
- Fewer than 75 % of the neighbors of horizon 42 and n_estimators 100 beat the benchmark.
- 'Linear baseline: ridge (framework `ridge`, alpha 1.0) on the same six features, same label, schedule and book,
  gives the same or a better result than the gbm; then the path interaction is not what pays and the claim reduces
  to an additive momentum-plus-smoothness score.'
- 'Interaction check (descriptive, for the Librarian): among top-fifth RISK events, those with jump share above
  the date median earn as much as those below it; then the frog-in-the-pan conditioning is absent even if the score
  works.'
notes: 'Why this is not a retry of what died: study 1 used plain price momentum in single stocks, prior ETF work
  used trend filters and plain sector momentum on total past return, H-0087 used another market''s bond return,
  H-0060 country long-term reversal. None conditioned the momentum slope on the path of the past move. The family
  is cross-sectional-momentum on purpose: the mechanism is underreaction-driven momentum, so its large trial count
  is the honest penalty, and G3 will be hard. Book design follows K-0005 / K-0027: the 60/40 class mix of the benchmark
  is fixed and the model only chooses inside each sleeve, so asset-class timing is not part of the claim. Handicap
  stated up front: the RISK sleeve choices are countries, sectors and commodities, not SPY itself, so a selection
  that is no better than equal weight inside the sleeve can still lose to SPY (the H-0005 basket confound); SPY
  and IWM are members so the model can choose US exposure. GLD and DBC are included as the standard gold and broad-commodity
  funds, not because of their history; the model must rank them in. Mechanism test: both sides are marked inside
  each sleeve so the pooled average is roughly a within-class top-minus-bottom spread (top and bottom of the RISK
  sleeve are both equity-like), which limits the beta confound of K-0074; the long-only book trades only the top
  side, so a pass that lives only in the bottom side (losers continue) would not reach the book; a side split is
  requested. Unmarked peers per date: the middle three fifths, at least 3 from the first scored date. Forecast (pessimistic
  first, K-0181): monthly dates with a fitted model about 2006-2020, roughly 170-180; events per date about 7+7
  in RISK and 2+2 in DEFENSIVE, so 2500-3200 events; round trip about 10 bps (ETF tier, more for the smaller country
  funds in the 2000s); gross side-adjusted 42-day abnormal return per event pessimistic 10 bps, central 50 bps.
  Expected book gain: if the top fifth beats its sleeve''s average by 2 %/yr in RISK and 0.5 %/yr in DEFENSIVE,
  about +1.4 %/yr on a book with roughly 60/40 volatility, near the +0.10 Sharpe margin, so the margin and the publication-decay
  check (reference 2014) are the likely strategy deaths. Model warm-up and late ETF listings leave the first third
  of dev (from 2002-08) thin or empty of scored dates (K-0163), so both later thirds probably need the right sign.
  If ridge does as well as the gbm, the conclusion is that the next card should be the linear score, not another
  tree (K-0182). Timing: features use closes up to t, decisions after the month-end close, trades at the next open;
  the framework purges labels not realized by t.'
