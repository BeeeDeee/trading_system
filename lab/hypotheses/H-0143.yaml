mechanism:
  counterparty: Calendar rebalancers and benchmark-anchored allocators (60/40 and target-weight funds, country and
    sector allocators) who sell what has drifted up and buy what has drifted down without regard to how the drift
    happened, and inattentive holders who update only after a salient move. They supply the winners cheap while
    gradual news is still being priced.
  why: 'Investors with limited attention underreact to information that arrives continuously in small amounts and
    react quickly to information that arrives in a few large, salient moves (Da, Gurun and Warachka 2014, ''frog
    in the pan''). Momentum should therefore continue mainly where the past-year move was built from many small
    same-signed days and drew no attention (no volume surge), and be weak where a few jump days produced the same
    total move. Asset-class, country and sector ETFs are a natural place for this: their prices move on slow macro,
    policy and earnings-cycle information that accumulates gradually over months, and the allocators who hold them
    rebalance on a calendar, not on the news. The card claims the path of the past move, not momentum itself, carries
    the slow drift over the next two months.'
  why_not_arbitraged: Cross-asset momentum is a low-Sharpe, crash-prone premium (sharp losses at trend reversals),
    so large capital holds it only diluted; benchmark-relative mandates cannot concentrate into a few country or
    sector funds; the path-shape conditioning is not part of the standard trend-follower signal, which uses only
    the total move.
signal:
  description: 'Data: daily bars of the 43 listed ETFs (sharadar_sfp). Daily log total return r = log((1+ret_co)*(1+ret_oc)).
    Two fixed sleeves: RISK = [SPY, IWM, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, IYR, EFA, EEM, EWA, EWC, EWD,
    EWG, EWH, EWI, EWJ, EWL, EWN, EWP, EWQ, EWS, EWU, EWW, EWZ, EWT, EWY, FXI, DBC] with book weight 0.60, and DEFENSIVE
    = [SHY, IEF, TLT, TIP, AGG, LQD, HYG, EMB, MUB, GLD] with book weight 0.40, the benchmark''s mix. Features per
    ETF and date t, from data up to the close of t (formation window F = rows t-251 .. t-21, 231 rows, skipping
    the latest month): (1) mom = sum of r over F divided by (std of r over rows t-251..t times sqrt(231)); (2) path
    = (number of days with r > 0 minus number with r < 0 in F) / 231, unsigned; (3) jump = sum of the 5 largest
    r^2 in F divided by the sum of all r^2 in F; (4) recent = sum of r over rows t-20..t divided by (std of r over
    rows t-62..t times sqrt(21)); (5) volratio = std of r over the last 63 rows / std over the last 252 rows; (6)
    attention = log(mean dollar_volume over the last 21 rows / mean over the last 252 rows). An ETF is scored on
    t only if it has at least 230 valid returns in the last 252 rows and at least 200 valid dollar volumes; otherwise
    it is not scored (not yet listed or gaps). Each feature is z-scored across the scored ETFs of the date with
    the framework helper (all 43 together). Label: framework label, total return from the next open to the open
    `horizon` rows later, ranked across the universe on each date. Model: framework `walk_forward` with model gbm
    (LightGBM), n_estimators = param, learning_rate 0.05, num_leaves 8, min_child_samples 200, subsample 0.8, colsample
    0.8, expanding window, refit every 63 rows, framework purge and seeds. Book: decisions after the close of the
    last trading day of each calendar month, trades at the next open. At each decision a new cohort is formed and
    kept for K = horizon / 21 months (K = 2 at the primary); the book is the average of the K live cohorts (each
    cohort 1/K of capital). Inside a cohort: RISK weight 0.60 split equally over the top fifth of the scored RISK
    members by score (ceil(0.2 x n), at least 2), DEFENSIVE weight 0.40 split equally over the top fifth of the
    scored DEFENSIVE members (ceil, at least 2). If a sleeve has fewer than 2 scored members, or before the first
    model fit, that cohort holds the sleeve''s benchmark instrument (SPY for RISK, IEF for DEFENSIVE). Weights are
    set only on decision dates (only_on monthly) and drift in between; an ETF without a bar keeps its position.
    Long only, gross 1.0, always invested.'
  params:
    horizon:
      grid:
      - 21
      - 42
      - 63
      value: 42
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At a month-end decision date with a fitted model, an ETF is in the top fifth (side +1) or the bottom fifth
    (side -1) of the gbm score among the scored members of its own sleeve (RISK or DEFENSIVE as listed in signal.description;
    ceil(0.2 x n), at least 2 per side).
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 42
ml:
  features:
  - 'mom: vol-scaled log return over t-251..t-21 (the slow information already in the price; the momentum state)'
  - 'path: share of up days minus share of down days over the same window, unsigned (how continuously the information
    arrived)'
  - 'jump: share of the window''s squared returns in its 5 largest days (how much of the move came as salient, attention-grabbing
    news)'
  - 'recent: vol-scaled log return over the last 21 rows (news since formation, short-term reversal state)'
  - 'volratio: 63-day over 252-day realized volatility (stress state in which momentum tends to crash)'
  - 'attention: log of 21-day over 252-day mean dollar volume (investor attention and flow into the fund; attention
    should remove the underreaction)'
  horizon_days: 42
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The mechanism is conditional, not additive: momentum should predict the next two months where
    the past move was smooth (high |path| in the direction of mom, low jump share) and quiet (no attention surge),
    and predict little or nothing where the same move came from a few jump days or with a volume surge; in high-volatility
    states (volratio high) the slope should shrink or flip (momentum crashes). That is a product of mom with path,
    jump, attention and volratio. A ridge on the same six z-scored features can only add them, so it scores a jumpy
    winner as roughly half a smooth winner and gives the attention and stress states a constant effect whatever
    the momentum, where the claim says the momentum slope itself changes. A depth-limited gbm (8 leaves, min 200
    samples per leaf) can split mom by jump and path and learn a near-zero slope in one cell and a positive one
    in the other. Who pays: calendar rebalancers and inattentive allocators who trade against gradual drift and
    only react to salient moves.'
