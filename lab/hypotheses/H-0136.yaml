falsification_criteria:
- 'Mechanism: the mean side-adjusted abnormal return of entries from the next open to the close 60 sessions later
  is not above the 95th percentile of the 200 time-shifted placebos, or gross per entry is below the round-trip
  cost. Then reaction drift in LIQ-500 does not last a quarter.'
- 'Mechanism, decay (K-0060, Martineau 2022): the latest third of dev (about 2015-2020) has a negative mean 60-session
  abnormal return. Then the drift is gone in large caps even if the pooled average passes, and the card is refuted.'
- 'Mechanism, horizon shape: the 21-, 42- and 60-session averages are no larger than the 10-session average. Then
  the drift is a two-week effect that the earlier five-session cards already measured, and a quarter-long hold only
  adds noise.'
- 'Strategy: net Sharpe on dev below SPY total return Sharpe + 0.10, or the one-sided bootstrap bound of the Sharpe
  difference not above zero.'
- 'Strategy, selection versus vehicle: G2 random-entry books of LIQ-500 names with the same turnover and exposure
  reach the strategy''s Sharpe (percentile under 95). Then the result is the equal-weight liquid-stock exposure,
  not the reaction selection.'
- 'Robustness: fewer than 75 % of the neighbours (z_threshold 1.5 and 2.5) beat SPY, or the book does not beat SPY
  at doubled costs.'
notes: 'Brief: medium horizon (here about one quarter), US single stocks, cross-sectional, with a mechanism test.
  Family: post-earnings-announcement-drift, on purpose, because the events are the release reactions of H-0028/H-0031/H-0033
  and their trials must count together; the family is heavily tried (H-0024, H-0028, H-0031, H-0033, H-0034, H-0095,
  H-0100 to H-0102, H-0104, H-0105), so G3 will be harsh, and that is the honest price. Why this is not a retry
  of a killed variant: (a) horizon. Lessons H-0104 and K-0143 list ''the plain reaction rule held longer than a
  week'' as untested; the 60-session window is the literature''s canonical drift window (Bernard and Thomas) and
  the brief''s horizon, not a number read from dev. Honest disclosure: the lab already saw the five-session effect
  still building at ten sessions, so dev knowledge favours a longer horizon; the card does not choose 60 over 21
  or 42 from that, and the horizon-shape criterion above can refute it. (b) Plain rule: no learner and no second
  variable (K-0083, K-0143: second variables and learners added nothing). (c) Book: always invested from early 2005,
  long-only, no shorts, no hedge basket, no cap-weighted core (K-0064, K-0147, K-0153, K-0172: short legs and hedges
  lost, cores could not be attributed, part-time books could not reach the bars). (d) Exit at the next release instead
  of a fixed short hold: Bernard and Thomas (1990) put part of the drift at the next announcement; the 60-session
  event study stops a few sessions short of it, so it is a lower bound for the book. Forecasts (K-0098, K-0120):
  LIQ-500 has about 1 700 covered releases a year (8-K coverage gaps, K-0035); with a two-session reaction sd of
  about 2.4 times the stock''s daily sd, z >= 2 marks roughly 15-25 %, so about 250-400 entries a year, 4 000-6
  000 events in dev on 2 000-3 000 dates; G0 may count a few more than G1 (K-0095). Round trip about 10-12 bps (LIQ-500
  half-spread tiers). Gross per entry at 60 sessions: central +0.8 %, range 0 to +1.5 %. The placebo cloud at a
  60-session horizon is wide: per-entry abnormal sd about 10-12 %, so the bar is likely 0.4-0.8 % above the placebo
  mean; at the low end of the forecast this ends as ''cannot tell'' (K-0034). Placebo mean: probably slightly positive,
  because some stocks (secular winners) have repeated positive reactions (K-0025). Beta gap between entries and
  peers: about zero, because z is scaled by each stock''s own volatility (K-0074). Book: about 80-100 names held,
  mean exposure about 0.95 after the first two months of 2005, each name entered and exited about once a quarter,
  one-way turnover about 4-5 times a year, cost drag about 0.5 %/yr. Expected gain over SPY: equal-weight liquid
  stocks start about 0.05 Sharpe behind SPY over 2005-2020 (higher idiosyncratic volatility); a long-side alpha
  of about 3 %/yr at about 20 % volatility adds about 0.15, so the central case lands near the required +0.10 margin:
  the strategy gate is a coin flip even if the mechanism passes, and a mechanism pass with a strategy failure would
  say the equal-weight vehicle, not the drift, is the limit. Most likely death: the mechanism inside the placebo
  cloud with a weak or negative latest third (Martineau''s large-cap result). Ticker-blind, no dates, no named stocks;
  no forward data, so G4 is the ceiling.'
