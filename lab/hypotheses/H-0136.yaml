id: H-0136
version: 1
title: Quarter-long earnings-reaction drift, held release to release - LIQ-500 long-only, equal weight in every
  stock whose latest 8-K earnings-release reaction was strongly positive, until its next release
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Holders who anchor on the old earnings level and update slowly: analysts who revise forecasts in
    steps over the following weeks, institutions whose committees and rebalancing calendars add names with a lag,
    and holders who sell into the jump to realize a gain (disposition effect), which slows the price move. They
    sell the stock to the strategy below the value the next releases confirm.'
  why: 'Investors underreact to earnings news: after a release the price moves in the direction of the news on the
    release sessions but does not move far enough, and the rest of the adjustment arrives over the following quarter,
    partly at the next release when the predictable part of the next quarter''s earnings is announced (Bernard and
    Thomas 1989, 1990). Chan, Jegadeesh and Lakonishok (1996) show the same drift when the news is measured by the
    market''s own reaction around the announcement instead of an accounting surprise. The lab''s own evidence: on
    real 8-K Item 2.02 dates, following a large standardized release reaction drifted in the news direction over
    the first one to two weeks, above time-shifted placebos, positive in every third of 2004-2020, and the positive
    side alone carried it (H-0028, H-0031, H-0033; K-0046, K-0083). Every one of those cards held five sessions,
    while the literature places the drift over about sixty sessions up to and through the next release. The claim
    of this card is that the reaction drift in liquid US stocks lasts a quarter, so a slow, always-invested long-only
    book can hold it at a low turnover where the five-session books lost to costs, part-time exposure and losing
    short legs.'
  why_not_arbitraged: 'The trade is a quarter-long, idiosyncratic bet on roughly ninety names at a time: an arbitrageur
    must carry each name''s idiosyncratic risk through the next release, which ties up capital and risk budget for
    a few percent of gross per year. Martineau (2022) argues that this is now arbitraged away in large caps (accounting-surprise
    drift near zero since the mid-2000s); the lab''s five-session reaction results say it was not, at least at the
    front end. This card is the test between the two at the horizon where the literature puts the drift.'
signal:
  description: 'Inputs: sharadar_sep daily total returns (ret_co + ret_oc compounded into a close-to-close return),
    the point-in-time LIQ-500 membership, and sec_8k_item202 ea_reaction_day (1 on the reaction session of an earnings-release
    8-K, known at that session''s close). (1) Reaction. After the close of every session t on which ea_reaction_day[t,
    j] == 1 for a stock j that is a LIQ-500 member at t: abnormal two-session return a = (stock j''s compounded
    close-to-close return over sessions t-1 and t) minus (the equal-weighted mean of the same two-session return
    over all LIQ-500 members with a valid return). Scale: s = standard deviation of j''s daily abnormal return (stock
    minus equal-weighted LIQ-500 mean) over the 60 sessions ending at session t-2 (so the window excludes both reaction
    sessions); at least 40 valid days required, otherwise no signal for that release. z = a / (s * sqrt(2)). The
    two-session window covers releases whose 8-K was accepted a few hours after the press release. (2) Entry. If
    z >= z_threshold, stock j enters the book at the open of t+1. (3) Holding and exit. A held stock stays in the
    book until its next earnings release: at the close of its next reaction session t'' (next ea_reaction_day ==
    1) the new z is computed as in (1); if the new z >= z_threshold the stock simply stays (the clock restarts,
    no trade), otherwise it is sold at the open of t''+1. A stock with no new reaction session within 80 sessions
    of its entry (missing filing) is sold at the open after the 80th session. A stock that stops being a LIQ-500
    member is sold at the next open (the engine refuses weights outside the universe). Releases of stocks that are
    not members, or whose s cannot be computed, are ignored. (4) Weights. Every session after the close, target
    weight 1/N for each of the N held stocks (gross 1.0, long-only, no leverage). If N < 20 (only in the first weeks
    after the data start), each held stock gets 1/20 and the rest stays in cash. Trades at the next open; the engine
    charges costs on weight changes. (5) Nothing else: no shorts, no hedge, no cap-weighted core, no learner, no
    second variable. The decision uses only data up to the close of t; trades are at the open of t+1. No date literals.'
  params:
    z_threshold:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: 'After the close of an 8-K earnings-release reaction session t, a LIQ-500 member''s two-session abnormal
    reaction z (step 1 of the signal: sessions t-1 and t, net of the equal-weighted LIQ-500 mean, scaled by sqrt(2)
    times its own 60-session abnormal volatility ending at t-2) is at or above z_threshold, i.e. the stock enters
    the long book. Side +1 (it should outperform the other members afterwards). Negative reactions are not marked:
    the book does not trade them and the claim is about the long side.'
  horizons:
  - 1
  - 5
  - 10
  - 21
  - 42
  - 60
  primary_horizon_days: 60
