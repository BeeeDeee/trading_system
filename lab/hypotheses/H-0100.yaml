version: 1
title: Overnight gap vs intraday follow-through in earnings releases, learned - LIQ-500 long-only core plus 5-day
  tilt into top LightGBM-scored 8-K releases; mechanism test = gbm-only vs ridge-only picks
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who trade the release session against the overnight news (intraday faders who treat the
    gap as an opening-auction overreaction when it was information) and investors anchored on the pre-release price
    who under-react; when the gap is an attention imbalance, the retail and attention buyers at the open pay.
  why: 'The market''s reaction to an earnings release has two parts with different traders behind them. The overnight
    gap (previous close to the open of the reaction session) is set in thin after-hours and pre-open trading and
    in the opening auction, where attention-driven and retail orders are concentrated (Berkman et al. 2012 show
    that attention-grabbing stocks open high and give it back intraday). The intraday part (open to close of the
    reaction session) is traded by institutions that have the full release and usually the conference call. Recent
    work on overnight/intraday decomposition around releases reports that the overnight reaction carries the information
    about later returns while intraday trading often runs against it (a tug of war between clienteles, Lou, Polk
    and Skouras 2019). Drift after the release (Bernard and Thomas 1989) should therefore depend on how the reaction
    was split, not only on its total size, and the dependence is not additive: a gap carries information only when
    it is large relative to the stock''s own volatility (a news gap, not an opening-auction imbalance), its predictive
    sign can flip with the size of the intraday fade (a full reversal of the gap by institutions versus a partial
    clientele fade), and heavy release-session volume and a pre-release run-up in the same direction change how
    much is still unpriced. A tree model on the split can represent these thresholds and sign changes; a linear
    model with one slope per feature cannot.'
  why_not_arbitraged: The edge per release is a few tens of basis points in single names with high idiosyncratic
    risk on the release week, spread over hundreds of small positions a year; capacity is limited by the spread
    on the reaction day, and the split-dependent part is a small conditional refinement of a well-known but slowly
    decaying drift that most quantitative funds take only through the total surprise.
signal:
  description: 'Data: sharadar_sep daily (ret_co = previous close to open, ret_oc = open to close, dollar_volume,
    universe membership) and the attached sec_8k_item202 flag ea_reaction_day. A release row is (t, j) with ea_reaction_day[t,
    j] == 1 and j a point-in-time LIQ-500 member on t. All features are computed after the close of t from data
    up to that close, for all columns (not only members, never with an ever-member list, see K-0134), and z-scored
    across the members of date t by the framework helper. Features: (1) gap_z = ret_co[t] / sigma63, sigma63 = standard
    deviation of daily close-to-close total returns over t-63..t-1; (2) session_z = ret_oc[t] / sigma63; (3) vol_shock
    = log(dollar_volume[t] / median dollar_volume over t-63..t-1); (4) runup_z = total return over t-21..t-1 / (sigma63
    * sqrt(21)); (5) log sigma63; (6) log of the median dollar volume over t-63..t-1 (size and coverage proxy).
    Label: total return from the open of t+1 to the open of t+6 (horizon_days 5), ranked across the universe on
    each date by the framework. Model: lab.framework.ml.walk_forward with model gbm, trained only on release rows
    (sample mask = release rows; scores are produced only for release rows), expanding window, refit every 63 rows,
    fixed hyperparameters num_leaves 15, learning_rate 0.05, min_child_samples 200, subsample 0.8, colsample 1.0,
    and n_estimators from params. Before the first fit there are no scores. Entry rule: a release row (t, j) is
    a tilt entry when its gbm score is at or above the (1 - top_q) quantile of the gbm scores of all release rows
    in the trailing 252 sessions up to and including t (at least 100 scored rows in that window, otherwise no entries).
    Book (long-only, decided after the close of t, traded at the open of t+1): core = all LIQ-500 members of date
    t weighted by their 63-day median dollar volume (a capitalisation proxy), weights refreshed on the first session
    of each month and held as fixed fractions in between; sleeve = one slot of 0.05 for every active tilt entry,
    opened at the open of t+1 and closed at the open of t+6 (5 sessions), or earlier at the first decision row where
    the stock is no longer a member (engine rule, K-0051). Sleeve gross S_t = 0.05 x active slots, capped at 0.50
    (all slots scaled proportionally when the cap binds). Final weights = (1 - S_t) x core + sleeve; a tilt stock
    also keeps its core weight. Total gross 1.0, no shorts. Stocks with a missing feature are not scored; a missing
    return or delisting follows the engine''s terminal-return policy.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top_q:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
mechanism_test:
  event: 'On a release row (8-K Item 2.02 reaction session, LIQ-500 member), exactly one of two walk-forward models
    fitted on the same six features, rows and schedule puts the stock in its top_q of trailing-252-session release
    scores: side +1 when only the gbm does (a nonlinear pick), side -1 when only the ridge does (a linear pick).'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'gap_z: reaction-session overnight return ret_co[t] over the stock''s 63-day daily volatility (the after-hours
    / opening-auction part of the reaction, set by attention-driven and pre-open traders)'
  - 'session_z: reaction-session open-to-close return ret_oc[t] over 63-day volatility (the part traded by institutions
    with the full release and call)'
  - 'vol_shock: log of reaction-session dollar volume over its 63-day median (intensity of disagreement and attention
    on the release)'
  - 'runup_z: 21-session total return before the reaction session over 63-day volatility scaled to 21 days (how
    much of the news was anticipated)'
  - 'log sigma63: 63-day daily volatility (uncertainty and limits to arbitrage)'
  - log of the 63-day median dollar volume (size, analyst coverage and liquidity proxy; slower diffusion in less
    covered names)
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is that the drift is not an additive function of the two parts of the reaction. (a)
    Threshold: a gap smaller than about one own-volatility unit is an opening-auction imbalance that tends to revert,
    a larger gap is news that drifts, so the slope on gap_z changes sign with its size. (b) Sign interaction: a
    gap that institutions fully reverse during the session (session_z large and opposite) marks an opening overreaction,
    while a partial fade is clientele noise and the gap still drifts; the effect of session_z depends on the sign
    and size of gap_z. (c) Volume and anticipation gate both: heavy release-session volume and a run-up in the same
    direction leave less unpriced. A ridge on the same six z-scored features fits one slope per feature and can
    only express ''gap matters more than session''; it cannot express sign flips, thresholds or the gap x fade interaction.
    Who pays: intraday faders who trade against an informative gap, and attention buyers at the open when the gap
    was an imbalance. If ridge picks the same releases as the gbm, or its picks do as well, the nonlinearity claim
    is false; the mechanism test measures exactly that.'
