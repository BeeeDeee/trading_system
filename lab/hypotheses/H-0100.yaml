falsification_criteria:
- 'Mechanism (central claim): the side-adjusted 5-session abnormal return of gbm-only top picks (+1) versus ridge-only
  top picks (-1) on release rows does not exceed the 95th percentile of the time-shifted placebos, or its gross
  per event is below the round-trip cost: the nonlinear model adds nothing over a linear one on the same split features.'
- The latest third of the dev event sample has the wrong sign (K-0060), even if the pooled test passes.
- 'The disagreement return is wrong-signed at the 1-session horizon and appears only at 10 sessions or later: slow
  drift, not release information.'
- Ridge (framework ridge, alpha 1.0) on the same features, rows, schedule and book gives the same or a higher net
  Sharpe than the gbm book.
- Net Sharpe on dev below SPY_TR + 0.10, or the stationary-bootstrap bound of the Sharpe difference below zero.
- Fewer than 75 % of the neighbours of n_estimators 100 and top_q 0.2 beat SPY_TR, or the book does not beat SPY_TR
  at doubled costs.
notes: 'Relation to earlier cards. Same family as H-0024, H-0028, H-0031, H-0033, H-0034 and H-0095, filed here
  on purpose so the trials count together. What is new: (1) the reaction is split into the overnight gap and the
  intraday session part, an information source none of those cards used (K-0136 asks for a new source, not a new
  learner); (2) the mechanism test is not ''top-scored releases drift'' (H-0028/H-0033 already showed plain reaction
  drift passes) but the disagreement between a gbm and a ridge fitted on identical features, rows and schedule,
  which is the control K-0135 says has never run. diagnostic.py: run walk_forward twice (gbm with the card params,
  ridge alpha 1.0), compute each model''s trailing-252-session percentile on every release row as in the entry rule;
  mask = rows where exactly one model is in its top_q; side = +1 where only the gbm is, -1 where only the ridge
  is. Forecast: about 13 000 scored release rows in LIQ-500 2006-2020 (H-0096 counted 15 600 events on the same
  flag), top fifth about 2 600 per model, overlap of the two top fifths about half, so about 1 100-1 400 events
  per side on roughly 1 500 dates; with a 5-day single-stock idiosyncratic sd near 4.5 % the placebo bar should
  sit near 20 bps, above a round trip of about 9-12 bps (rank tiers 3/6 bps half spread). So a pass needs a gbm-minus-ridge
  spread of over about 20 bps per event: a large nonlinearity premium, low prior. A failure with a bar above cost
  is a ''cannot tell'' only if the average is clearly positive; an average near zero or negative closes the learned-model
  route on release events. Strategy arithmetic (K-0064, K-0098): about 195 entries a year x 5 sessions x 0.05 gives
  a mean sleeve near 0.19 (less in peak weeks where the 0.50 cap binds, K-0125); at 40-60 bps excess per entry the
  sleeve adds about 0.4-0.6 % a year, well under the roughly 1.5 % that a Sharpe margin of 0.10 over SPY needs.
  The book is therefore expected to fail the G1 margin unless top picks earn far more than the plain positive reactions
  of H-0033; the informative verdict is the mechanism test. Timing caveats: the reaction session is the first session
  whose close is at or after the 8-K acceptance; for releases inside market hours the gap holds no news (the model
  sees a small gap_z); when the 8-K is accepted a session after the press release the flagged session is one day
  late and its gap is not the reaction (dilution, not look-ahead). Pre-2004-08 rows have no events; the first fit
  needs a training sample, so events start about 2006. References: only Bernard and Thomas is listed formally; Berkman,
  Koch, Tuttle and Zhang (2012, JFQA, overnight returns and the cost of buying at the open) and Lou, Polk and Skouras
  (2019, JFE, tug of war between overnight and intraday returns) motivate the split but are not listed, to keep
  the publication-decay check on the drift itself. No new dataset is needed.'
