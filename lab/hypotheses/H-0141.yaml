title: US-open range breakout on top-10 crypto perps on US macro release days only - 15m, CPI/jobs anchored 09:30
  ET, FOMC 14:00 ET, both sides
author_agent: scout
family: us-open-range-breakout-crypto
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 10
mechanism:
  counterparty: 'Traders who fade the first post-release move: range-reverting market makers and grid/mean-reversion
    bots that sell strength and buy weakness inside the day''s range, and short-dated option sellers whose dealers
    must hedge in the direction of the move (short gamma) once price leaves the range. On the other side are slow
    US allocators who must take the risk-on/risk-off position the release implies and who trade in size during US
    hours whatever the price. They pay the momentum because their mandate puts them on a schedule, not because they
    are wrong.'
  why: 'On scheduled US macro release days the price-relevant news arrives at a known clock time, and it is digested
    by a sequence of participants. A fast group reacts at once; slower US capital (equity-index and ETF desks, basis
    and CTA books, US retail, and in crypto the US-hours spot and perp flow) adds its orders only once the US cash
    session opens and liquidity is deep. Gao, Han, Li and Zhou (2018) find that in the S&P 500 the return up to
    10:00 ET predicts the last half-hour return, and that this intraday momentum is stronger on macro news days.
    They attribute it to late-informed traders and to option/levered-ETF hedgers who trade in the direction of the
    day''s move. Since 2020 BTC and ETH have traded as US risk assets on CPI, payroll and FOMC days. Before that
    sample Corbet et al. (2020) found little response of Bitcoin to CPI. So on release days the US-session order
    flow in crypto should be more one-sided and the move larger than on ordinary days. The claim of this card: on
    release days the first 15-minute close beyond the post-anchor range marks the direction that the slower US flow
    then pushes for hours, and the move is large enough to pay a taker round trip (about 13-20 bps). On ordinary
    days the family''s gross per trade sat just under that cost (H-0137). For CPI and jobs reports (08:30 ET) the
    anchor is the 09:30 ET cash open, where equity-linked flow re-prices the release (the Gao et al. first half-hour
    window ends at 10:00 and includes the 08:30 news). For FOMC days a 09:30 range would be set before the news
    and the trade would be a coin flip on the 14:00 statement. So the anchor there is the statement itself: the
    range is the first minutes after 14:00 ET, and the breakout runs through the press conference and the US evening.'
  why_not_arbitraged: The events are few (about 32 days a year), the per-event P&L is very noisy (a release can
    reverse within minutes when the press conference contradicts the statement), and the strategy is flat 98 % of
    the time, so it carries little capital and has a long, uncertain track record before anyone can tell skill from
    luck. Crypto's sensitivity to US macro news is recent (post-2020), so the pattern has a short history. Taker
    costs eat most of any intraday edge on ordinary days, which keeps generic ORB players away. The release-day
    subset is too small to fill a book alone.
signal:
  description: 'Data: binance_perp_15m candles (o, h, l, c) of the point-in-time top-10 USD-M perpetuals by 30-day
    quote volume (crypto_top_n, n = 10), and the daily signal-only series macro_release_calendar_1d (fields next_cpi_sessions,
    next_empsit_sessions, next_fomc_sessions; keyed by XNYS session). All clock times are New York local time (America/New_York,
    daylight saving handled by the timezone conversion; 09:30 ET is 13:30 or 14:30 UTC). (1) Release-day flag, point-in-time:
    an XNYS session d is a CPI day if on the previous XNYS session p next_cpi_sessions(p) == 1; a jobs day if next_empsit_sessions(p)
    == 1; an FOMC day if next_fomc_sessions(p) == 1. Release schedules are published by BLS and the Fed months ahead,
    so the flag of d is known before d opens. If p is missing (first row of the view) the day is not traded. Days
    that are not release days are never traded. (2) Anchor A: on an FOMC day (including a day that is also a CPI
    or jobs day) A = 14:00 ET (statement time); on a CPI or jobs day without FOMC A = 09:30 ET. One anchor per day.
    (3) Range: for each instrument, high R_hi and low R_lo of the 15m candles whose open time lies in [A, A + range_minutes).
    Candles flagged not real (gap rows) are excluded; if any candle in the range window is a gap row the instrument
    is not traded that day. (4) Entry: scan the 15m candles closing after A + range_minutes up to and including
    the candle that closes at A + 4 h (entry window). On the first candle whose close > R_hi go long; on the first
    whose close < R_lo go short. Decision at that candle''s close, fill at the next candle''s open (engine default).
    At most one entry per instrument per day, no re-entry, no reversal. (5) Exit: flat at the open of the candle
    that starts at A + 6.5 h (16:00 ET for the 09:30 anchor, 20:30 ET for the 14:00 anchor). No stop, no target.
    If the instrument leaves the PIT top-10 while the trade is open the position is closed at the first decision
    row outside the universe (K-0051); this is the only early exit. (6) Size: each open trade has weight 1/10 of
    equity with the sign of the breakout (gross <= 1 even if all ten trigger). Instruments not yet listed, not in
    the universe at the anchor, or without real candles in the range window are skipped that day. Funding is charged
    by the engine on the settlement candle when a position is held across it. Pre-registered report requested (not
    gated, not to be used for selection): gross and net mean per trade split by event type (CPI, jobs, FOMC), by
    side, by year, for the BTCUSDT+ETHUSDT subset, and for the same rule with the 09:30 anchor on non-release weekdays
    (the H-0137 baseline on the same universe), plus the FOMC days with the 09:30 anchor instead of 14:00.'
  params:
    range_minutes:
      grid:
      - 15
      - 30
      - 60
      value: 30
  timeframes:
  - 15m
  - 1d
