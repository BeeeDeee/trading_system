falsification_criteria:
- 'Fewer than 300 trades in the 2020-2022 dev period (G1 min_trades): the event set is too small to judge, and the
  card is dead as a strategy.'
- Net Sharpe on dev below 0.5, or the one-sided 75 % bootstrap bound of the mean net trade at or below zero (G1).
- Either neighbor of range_minutes = 30 (15 or 60) has a net Sharpe at or below zero, or the median neighbor Sharpe
  is below 0.7 x the primary (G2).
- Net Sharpe at or below zero with a one-candle-later fill (below 0.5 x primary) or with doubled costs (G2).
- Fewer than two of the three dev thirds positive, or one third carrying more than 60 % of the log return (G2).
  In particular, if the earliest third (2020) carries most of the return, the post-2020 macro sensitivity premise
  is contradicted.
- 'The same trades placed at random times of the same days beat the strategy at the 95th percentile (G2 random timing):
  the release clock adds nothing.'
- 'Mechanism: mean gross per trade on release days is not larger than the mean gross per trade of the same rule
  (09:30 anchor) on non-release weekdays of the same universe and period. If so, release-day conditioning adds nothing
  over H-0137, whatever the Sharpe.'
- 'Mechanism: mean gross per trade on release days below the average round-trip cost (fee + slippage tier, about
  13-20 bps), which is the H-0137 verdict again.'
notes: 'owner_seed: ORB-C5. (1) Family: us-open-range-breakout-crypto, the owner''s choice and the honest one. This
  is the fifth trial of the family after H-0137 (all sessions, G1), H-0138 (high-vol days, G1), H-0139 (after NR4,
  G2) and H-0140 (aligned with the pre-session move, G1), plus study 16''s ORB. The Librarian''s H-0138 lesson warns
  against another conditioner ''including news day''. This card exists because the owner asked for this specific
  test. Unlike volatility or narrow-range filters, it conditions on an exogenous, pre-scheduled information event
  with a published equity-market mechanism (Gao et al. 2018). The conditioner was not read off any dev result, and
  the release dates are fixed by BLS and the Fed, not by price. (2) Why the universe is the PIT top-10 and not BTC/ETH
  only (the closest honest card): there are about 31-32 release days a year (12 CPI, 12 jobs, 8 scheduled FOMC;
  2020 lost the cancelled March meeting), so about 95 in 2020-2022. BTC and ETH can give at most about 190 trades,
  and fewer once untriggered days are dropped. That is far below the intraday judge''s 300-trade minimum, so a BTC/ETH-only
  card dies at G1 on trade count by construction and teaches nothing. The PIT top-10 by 30-day quote volume (no
  hand-picked coins) gives an estimated 600-800 trades. The BTC/ETH subset is requested in the report so the owner''s
  original question is still answered. Cost of this choice: altcoins pay a higher slippage tier (3-6 bps vs 1.5),
  and they lag or amplify BTC, so the ten trades of one day are strongly correlated. (3) Power problem, stated plainly.
  Independent information is about 95 release days, not 700 trades. The trades of one day move together (crypto
  cross-correlation at intraday horizons is about 0.7-0.9), so the trade-level bootstrap bound of the mean net trade
  will be optimistic unless the judge blocks by date. My forecasts: trigger rate about 80-90 % of instrument-days,
  600-800 trades; mean gross per trade 25-40 bps (vs a little under the round trip for H-0137 on all days), mean
  net 8-22 bps; day-level P&L std about 2-3 %; annualized net Sharpe 0.3-0.7. At the midpoint, the t-statistic over
  95 effective days is only about 1. Probability of passing G1: about 25-30 %; of passing G2 (three thirds, each
  about 32 days, need two positive and none above 60 %): about 10 %. A pass would be weak evidence. A fail that
  shows release-day gross clearly above non-release gross would still be informative for the family (it would say
  where the US-open effect lives). (4) FOMC anchor. The owner asked whether 09:30 or 14:00 is the right anchor on
  FOMC days. I pre-register 14:00 (statement time; 14:00 ET throughout 2020-2022) because a 09:30 range is set before
  the news and holding it through 14:00 turns the trade into a bet on the statement. The exit at A + 6.5 h keeps
  the same holding clock as the 09:30 rule (09:30 to 16:00) and spans the 14:30 press conference and the US evening.
  The press conference often reverses the first statement move, so FOMC breakouts may be whipsawed; the by-type
  report will show it. 09:30 on FOMC days is a report-only comparison, not a gridded alternative (a categorical
  choice cannot have grid neighbors, and picking it after seeing dev would be selection). (5) Data: macro_release_calendar_1d
  has loader generic and clock us_close. The intraday branch must deliver it next to binance_perp_15m. If it cannot
  read a generic daily signal series, this card waits in BLOCKED_DATA. What is missing then is an IntradayView accessor
  for generic daily series (a per-UTC-date or per-XNYS-session lookup of the three next_*_sessions fields), not
  new data. The flag uses only the previous session''s value of next_*_sessions == 1, a schedule known in advance,
  so the us_close clock adds no look-ahead for a same-day intraday trade after 09:30 ET. The calendar period starts
  a month before the perp data so that the previous-session value exists on the first days (K-0108: signal history
  before the view start may not be delivered; then the first days are skipped). The calendar''s own holdout_from
  is 2021-01-01, earlier than the intraday holdout (2023-01-01). The calendar is a published schedule with no returns
  in it, so I see no contamination, but the Chair may prefer to flag it. (6) Known calendar quirks: an Employment
  Situation release on a day the NYSE is closed (Good Friday) is stamped on the next XNYS session by the dataset,
  so the card trades the wrong day. This happens at most once in dev, and the Builder cannot detect it without date
  literals; accepted as noise. Unscheduled FOMC actions are not in the dataset and are not traded. The postponed
  2025 releases (holdout) were announced before their new dates, so a same-day intraday trade has no look-ahead
  even there. (7) Not declared: mechanism_test (the intraday judge has none). Single parameter on purpose (range_minutes),
  to limit trials; the entry window (A + 4 h) and the exit (A + 6.5 h) are fixed by the equity session clock, not
  tuned.'
