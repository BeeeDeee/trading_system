id: H-0022
version: 1
title: S&P 500 change price-pressure reversal, both directions, read inside LIQ-500 - long liquid stocks just deleted
  from the index, short just-added ones, dollar-neutral, hold 5 days
author_agent: scout
family: index-inclusion-price-pressure
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Index funds and closely benchmarked active managers. Their mandate makes them buy additions and
    sell deletions on the effective date at whatever price is quoted, and they accept the impact cost so they can
    track the index. The strategy is paid for absorbing that impact after the fact: it is short the stocks the funds
    just bought at a premium and long the stocks they just dumped.'
  why: 'Index funds and benchmarked managers have to trade a stock when it joins or leaves the S&P 500, and they
    trade at the close before the effective date whatever the price. This demand does not depend on any news, and
    because demand curves for single stocks slope down (Shleifer 1986; Harris and Gurel 1986) the price moves away
    from fundamental value: added stocks are pushed up, deleted stocks are pushed down. Once the forced trade is
    done, liquidity providers who took the other side unwind and the price partly reverts. Chen, Noronha and Singal
    (2004) find the reversal is asymmetric: deleted stocks recover most of their forced-selling loss after the effective
    date, while additions keep part of their gain. So after the effective date added stocks should lag the cross-section
    and deleted stocks should beat it. H-0017 (additions only, inside the sp500 universe) had the right sign in
    every sub-period and a gross effect well above costs, but missed the placebo percentile by a hair with only
    a few hundred events. This card adds the deletion leg, where the literature puts the larger reversal, to get
    more events and a second independent source of the same forced-flow mechanism.'
  why_not_arbitraged: Pre-effective-date arbitrage (buying additions and shorting deletions after the announcement)
    is crowded, but supplying liquidity after the event means holding concentrated idiosyncratic single-stock risk
    for days against a small expected gain, and the capacity is limited by how few events there are. Deleted stocks
    are also unpopular (falling, often distressed) and many mandates may not hold them, which slows their recovery.
    Index changes are lumpy and rare, so no large fund can make this a core strategy.
signal:
  description: 'Universe: point-in-time LIQ-500 (liq_n, n = 500). Membership input: the point-in-time S&P 500 mask
    that the sharadar_sep loader supplies as extras[''alt_universe''] (True on days the stock is an S&P 500 member).
    If that extra is not the PIT S&P 500 membership mask, the Builder must fail loudly and must not substitute anything
    else. Events, decided after the close of day t using data up to that close: (a) ADDITION of stock j: alt_universe[t-1,
    j] is False and alt_universe[t, j] is True (day t is its first session as a member). Side -1. (b) DELETION of
    stock j: alt_universe[t-1, j] is True and alt_universe[t, j] is False (day t is its first session as a non-member).
    Side +1. An event counts only if j is in LIQ-500 and tradable on both t-1 and t, has been listed for at least
    63 trading sessions before t (this drops spin-offs added on their first trading day), and has a valid return
    on day t. If a stock would have both an addition and a deletion on the same day (ticker or id artifact), it
    is skipped. Positions: each event opens at the open of t+1 and stays active for hold_days sessions, i.e. it
    is held over sessions t+1 .. t+hold_days and closed at the open of session t+hold_days+1. On any day, let A
    be the set of active event stocks that are still LIQ-500 members and tradable. If A is empty the book is flat
    (cash). Otherwise the event leg has a total gross of 0.5, split equally: each active stock gets weight side
    * 0.5 / |A|. The hedge is the negative of the net event weight (sum of event weights), spread equally over all
    other LIQ-500 members that are tradable that day, so the book is dollar-neutral and gross is at most 1.0. Target
    weights are recomputed only on days when A changes (entry, exit or an event stock dropping out); on other days
    the previous target weights are kept, to avoid daily re-equalising turnover. An event stock that leaves LIQ-500
    or becomes non-tradable gets weight 0 from the next open on (never a weight outside the declared universe).
    A delisting during the hold takes the terminal return from the data. Missing data: a stock without a return
    on day t is not an event; there are no lookback windows apart from the 63-session listing age.'
  params:
    hold_days:
      grid:
      - 3
      - 4
      - 5
      - 6
      - 7
      value: 5
  timeframes:
  - 1d
mechanism_test:
  event: 'A LIQ-500 stock, listed for at least 63 sessions and tradable on t-1 and t, changes S&P 500 membership
    between t-1 and t (extras alt_universe). Addition (first session as a member): side -1, it should underperform
    the other LIQ-500 stocks afterwards. Deletion (first session as a non-member, still in LIQ-500): side +1, it
    should outperform afterwards.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
