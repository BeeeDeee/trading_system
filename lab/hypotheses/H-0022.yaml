market_exposure: market_neutral
references:
- cite: Shleifer (1986) Do demand curves for stocks slope down? Journal of Finance
  year: 1986
- cite: 'Harris, Gurel (1986) Price and volume effects associated with changes in the S&P 500 list: new evidence
    for the existence of price pressures. Journal of Finance'
  year: 1986
- cite: Lynch, Mendenhall (1997) New evidence on stock price effects associated with changes in the S&P 500 index.
    Journal of Business
  year: 1997
- cite: 'Chen, Noronha, Singal (2004) The price response to S&P 500 index additions and deletions: evidence of asymmetry
    and a new explanation. Journal of Finance'
  year: 2004
falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the pooled addition and deletion events (next open to close
  of t+5, minus the mean of the other LIQ-500 stocks) does not exceed the 95th percentile of the 200 time-shifted
  placebos, or does not keep its sign in at least 2 of 3 sub-periods, or the gross per event is below the round-trip
  cost.'
- 'Mechanism (asymmetry): if the deletion events alone show a side-adjusted 5-day abnormal return at or below zero,
  the deletion-rebound story of Chen, Noronha and Singal is not present in liquid stocks, whatever the pooled result.'
- 'Strategy: net Sharpe on dev below 0.5 or below the T-bill Sharpe + 0.10, or the 75 % bootstrap bound of the Sharpe
  difference vs T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors hold_days 4 and 6 beat the benchmark, or the strategy no longer
  beats it at costs x2.'
- 'Decay: the latest third of the dev period does not beat T-bills, or post-2004 Sharpe excess is below half of
  the pre-2004 excess (publication decay).'
notes: 'Brief fit: short horizon (5 days), US single stocks, cross-sectional, mechanism test declared. Choice of
  mechanism: K-0024 says the only large-cap short-horizon events that cleared or nearly cleared the placebo bar
  are mandated flows (month-turn beta spread, index inclusion), while information and attention events (insider
  filings, 52-week highs, volume, earnings proxies, peers) were flat. So this card stays with a mandated flow instead
  of adding a 21st information anomaly. Relation to H-0017 and H-0018 (same family, honestly reused, so the trial
  count accumulates): H-0017 tested additions only in the sp500 universe and missed the placebo bar by a hair (K-0026:
  sparse events, wide cloud). Its lesson explicitly suggests ''both additions and deletions in one test'' for more
  power. H-0018 tried that inside the sp500 universe and stalled at G0 because a deleted stock is no longer a member
  (K-0029). This card is the variant H-0018''s open question names: the universe is LIQ-500 and S&P membership is
  only an input (extras alt_universe), so a deleted stock that is still liquid stays inside the declared universe
  and can be held. Price: additions outside LIQ-500 and deleted stocks that drop out of LIQ-500 are lost; deletions
  caused by acquisitions mostly vanish because the stock delists. This is not a retry with another hold on the same
  events: the hold stays at 5 days as in H-0017, and the new information is the deletion leg. Known risks, stated
  up front: (1) the event set is still sparse (a few hundred additions plus perhaps one or two hundred liquid deletions),
  so the placebo gate may again be close to a coin flip (K-0026, K-0031); the verdict stands either way. (2) The
  index effect is reported to have shrunk over time (Greenwood and Sammon, ''The disappearing index effect''), so
  era fade across sub-periods and the publication-decay check around 2004 are real threats; H-0017 also faded. (3)
  In G2 the alt universe for LIQ-500 is the S&P 500, where deleted stocks are not members, so the alt-universe run
  can only trade the addition leg; the strategy must simply give zero weight to non-members there, not fail. (4)
  The book is concentrated (event leg of 0.5 split over the few active names) and invested only while events are
  active; estimated mean exposure is around a quarter to a third, close to the 20 % floor. Weights are not re-equalised
  daily (K-0030 point 3). A Chair decision was mentioned in H-0018''s lesson for the liq_n variant; the design trade-off
  (losing non-liquid additions) is explained above so the Skeptic or Chair can make it on this card. If the PIT
  S&P membership is not available as extras[''alt_universe''] for a liq_n card, the Builder should fail loudly and
  the card should be parked, not rebuilt on a proxy.'
