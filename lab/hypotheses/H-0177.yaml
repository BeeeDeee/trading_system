title: Cross-asset time-series momentum on a 60/40 core - monthly, SPY tilted by the past year of Treasury (IEF)
  excess return, IEF tilted against the past year of SPY excess return, SHY absorbs the rest
author_agent: scout
family: cross-asset-momentum
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - SHY
  kind: instruments
mechanism:
  counterparty: Slow allocators (pension funds, target-date and balanced funds, retail switching between bond and
    stock funds after the fact) who buy equities and sell Treasuries months after the price signal, at worse prices.
    A second counterparty is the bond demand of risk-averse holders after equity losses, which a faster allocator
    supplies to.
  why: 'Pitkajarvi, Suominen and Vaittinen (2020) find in 20 countries that past bond-market returns predict future
    equity-market returns positively, and past equity returns predict future bond returns negatively, over the following
    months. They link it to slow-moving capital. After a Treasury rally, lower discount rates and lower yields on
    safe assets move balanced, pension and income investors into equities gradually: mandates are revisited quarterly
    or yearly, so the flow lasts for months, not days. After an equity rally, the same investors are over their
    equity targets and richer in risk capacity. They move money out of safe bonds slowly (de-allocation from the
    hedge asset, less demand for duration), so Treasuries underperform cash afterwards. The signal comes from one
    market and is traded in the other. It is not the market''s own trend: the bond position takes the opposite side
    of the equity trend, and the equity position follows the bond market, not itself.'
  why_not_arbitraged: Taking the trade means holding a market-direction position in equities and duration for a
    month or more, with equity-crash and rate-shock risk, at monthly frequency and few independent bets per decade.
    Arbitrage capital with short horizons does not hold it; long-horizon capital is the slow capital itself. The
    effect is a time-varying risk premium as much as a mispricing, so it need not vanish once known.
signal:
  description: 'Inputs: daily total returns (ret_co, ret_oc) of SPY, IEF and SHY from sharadar_sfp. SHY (1-3y Treasuries)
    stands in for cash. Decision dates: after the close of the last XNYS session of each calendar month t, using
    data up to that close; trades at the open of the next session; weights then held (drifting) to the next decision.
    (1) Bond signal B = cumulative total return of IEF over the last lookback_days sessions minus the cumulative
    total return of SHY over the same sessions. Equity signal E = the same for SPY minus SHY. sB = +1 if B > 0 else
    -1; sE = +1 if E > 0 else -1. (2) Target weights before scaling: w_SPY = 0.60 + 0.20 * sB (the equity leg follows
    the bond market); w_IEF = 0.40 - 0.20 * sE (the bond leg leans against the equity market). (3) If w_SPY + w_IEF
    > 1 (only when sB = +1 and sE = -1: 0.80 + 0.60), scale both proportionally so they sum to 1 (0.571 / 0.429),
    w_SHY = 0. Otherwise w_SHY = 1 - w_SPY - w_IEF. The four states: (sB, sE) = (+,+) -> 0.80/0.20/0.00; (+,-) ->
    0.571/0.429/0.00; (-,+) -> 0.40/0.20/0.40; (-,-) -> 0.40/0.60/0.00 for SPY/IEF/SHY. The tilt size 0.20 is fixed
    by design, not a parameter. The book is always fully invested (gross 1, long only). (4) Before the first decision
    date with a full lookback for all three ETFs, hold the benchmark weights 0.60 SPY / 0.40 IEF / 0 SHY, rebalanced
    monthly on the same dates. A missing return on a session (holiday or data gap) counts as 0 in the cumulative
    return. No other instruments, no leverage, no shorts.'
  params:
    lookback_days:
      grid:
      - 189
      - 252
      - 315
      value: 252
  timeframes:
  - 1d
  - 1mo
  - 1y
mechanism_test:
  event: 'At each monthly decision date (last XNYS session of the month, from the first month with a full lookback_days
    history for SPY, IEF and SHY), two events: SPY is marked with side sB (+1 if IEF''s trailing lookback_days total
    return exceeded SHY''s, else -1), and IEF is marked with side -sE (-1 if SPY''s trailing lookback_days total
    return exceeded SHY''s, else +1). SHY is never marked and serves as the cash-like peer. About 2 events per month
    (about 400 over dev, on about 200 dates). The claim: the side-adjusted 21-session return of the marked ETF,
    net of the others, is higher than for the same side series shifted in time.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 21
