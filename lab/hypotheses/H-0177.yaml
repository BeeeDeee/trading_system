  typical_days: 21
market_exposure: long_only
references:
- cite: Pitkajarvi, Suominen, Vaittinen (2020) Cross-asset signals and time series momentum, Journal of Financial
    Economics 136(1)
  year: 2020
falsification_criteria:
- 'Mechanism: the pooled side-adjusted 21-session abnormal return of the marked SPY/IEF events is not above the
  95th percentile of the 200 time-shifted placebos, or has the predicted sign in fewer than 2 of 3 sub-periods of
  dev.'
- 'Mechanism: gross abnormal return per event below the round-trip cost of trading it.'
- 'Mechanism (shape): if the 60-session abnormal return is smaller than the 5-session one, or is of the opposite
  sign to the 21-session one, the months-long slow-capital story is not supported, whatever the 21-session gate
  says.'
- 'Strategy: net Sharpe on dev below 60/40 SPY/IEF + 0.10, or the 75 % bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the lookback neighbors (189, 315) beat 60/40, or the result fails at doubled costs,
  or one sub-period carries more than 60 % of the log return.'
- Drawdown on dev more than 1.5 times the 60/40 drawdown.
notes: 'Version 2 (answer to the Builder, G0 g0_event_peer_set): version 1 marked SPY and IEF on every event date
  and left only SHY unmarked, below the three-peer rule (K-0174, K-0086). Fix: four peer-only near-cash Treasury
  ETFs (SHV, BIL, VGSH, SCHO) join SHY as the unmarked peer set, and an event date requires at least three of the
  five peers to be priced, so every event date has >= 3 unmarked eligible instruments by construction. Why near-cash
  peers and not TLT/LQD/AGG (which list earlier): the mechanism is about each market''s return over cash. A duration-matched
  bond peer set (TLT, LQD, AGG average duration near IEF''s) would remove the IEF leg''s term exposure and leave
  curve-shape noise, testing something else; equity peers would do the same to the SPY leg. Cash-like peers make
  the G1 abnormal return the paper''s excess return. Cost of this choice: the event study starts only when the third
  peer lists (BIL, mid-2007 by the fact of its listing, not a chosen episode), about 160 event dates instead of
  about 200; the strategy itself still runs over the full dev window from 2002 and is unchanged (the Builder said
  strategy and diagnostic pass; only the peer set and the event-date condition change). Beta gap (K-0074), stated
  before the test: SPY events carry the full equity premium over cash and IEF events the term premium; with sB mostly
  +1 and sE mostly +1, raw SPY events gain about the equity premium and raw IEF events lose about the term premium.
  The time-shifted placebo keeps the sides'' distribution, so only the gap over the placebo is evidence (K-0025).
  No result was looked at for this revision. Earlier notes still hold: brief fit is medium horizon, cross-asset;
  differs from H-0087 (cross-sectional country sort, demeaned away the common bond component), from study 2 / study
  10 / H-0003 (own trend, binary switch: here the equity leg never looks at equity prices and the bond leg is contrarian
  to equity strength), and from K-0005 / K-0027 (always invested at gross 1, benchmark held before the first signal).
  Main way it dies: a real but modest effect lost in a wide placebo cloud, because 12-month signs are persistent
  and the effective number of independent bets is small (K-0026). Dev is mostly a period of falling yields, so the
  bond leg fights a strong unconditional bond return. Publication year 2020 lies at the end of dev, so the post-publication
  check is one noisy year. One parameter (lookback), round grid around the paper''s 12 months.'
