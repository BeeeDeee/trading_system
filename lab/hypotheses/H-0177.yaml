falsification_criteria:
- 'Mechanism: the pooled side-adjusted 21-session abnormal return of the marked SPY/IEF events is not above the
  95th percentile of the 200 time-shifted placebos, or has the predicted sign in fewer than 2 of 3 sub-periods of
  dev.'
- 'Mechanism: gross abnormal return per event below the round-trip cost of trading it.'
- 'Mechanism (shape): if the 60-session abnormal return is smaller than the 5-session one, or is of the opposite
  sign to the 21-session one, the months-long slow-capital story is not supported, whatever the 21-session gate
  says.'
- 'Strategy: net Sharpe on dev below 60/40 SPY/IEF + 0.10, or the 75 % bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the lookback neighbors (189, 315) beat 60/40, or the result fails at doubled costs,
  or one sub-period carries more than 60 % of the log return.'
- Drawdown on dev more than 1.5 times the 60/40 drawdown.
notes: 'Brief fit: medium horizon (12-month formation, monthly decisions, a month-long hold), cross-asset (the equity
  position comes from the Treasury market and the bond position from the stock market). FRED series are not needed
  because IEF and SHY give the bond excess return directly and are tradable. Why this differs from what died: (1)
  H-0087 (same family, reused on purpose) was a cross-sectional sort of 15 country ETFs by their local 10-year bond
  rally. Cross-sectional demeaning removes exactly the common bond-market component that the paper''s time-series
  result is about, and each country ETF carried currency noise. The paper''s claim is time-series within a market,
  and this card tests that form, in the deepest market, with tradable bond and equity legs. (2) Study 2 and study
  10 (and H-0003) tested each asset''s own trend or a whole-portfolio binary switch. Here the equity leg never looks
  at equity prices, and the bond leg is contrarian to equity strength. In two of the four states one leg takes the
  opposite side to its own trend, so a pass cannot be own time-series momentum in disguise. (3) K-0005 and K-0027:
  the book is always invested at gross 1 and stays close to the benchmark. It is two independent +/-20 % tilts on
  a 60/40 core, with cash-like SHY absorbing room, and it holds the benchmark before the first signal (the cash-before-signal
  handicap of H-0088 does not apply). Entry count: rebalancing dates count as bets because mean exposure is 1 (continuous_min_exposure);
  about 210 monthly decision dates with non-zero turnover. Expected forecasts (K-0120, take them as rough): about
  400 events on about 200 dates; the sides are persistent (12-month signs flip a handful of times per decade), so
  the effective number of independent bets is small and the placebo cloud will be wide (K-0026). That is the main
  way this dies: a real but modest effect lost in a wide cloud. Turnover is low (most months only drift rebalancing),
  so cost is not the binding constraint; ETF round trips are a few bps against a 21-session gross that should be
  tens of bps if the effect is real. Known risks, stated before the test: dev is mostly a period of falling yields,
  so the bond leg (underweight IEF after equity rallies) fights a strong unconditional bond return. The placebo
  shares the same side distribution, so this hurts the strategy gate more than the mechanism gate. The SPY leg is
  +1 most of the time, so part of the raw abnormal return is the equity premium over IEF/SHY (K-0074). The placebo
  mean carries the same premium, so only the gap over the placebo is evidence (K-0025). Publication year 2020 lies
  at the very end of dev, so the post-publication check is a single year and will be noisy. The paper''s working-paper
  version circulated earlier, and I give the journal year honestly. No dates, no episodes, no instrument chosen
  for past performance: SPY/IEF are the benchmark''s own legs, and SHY is the standard cash-like Treasury ETF. One
  parameter (lookback), round grid around the paper''s 12 months; the 0.20 tilt and the 60/40 base are fixed by
  design (the base is the benchmark).'
