  kind: instruments
mechanism:
  counterparty: US investors in country funds who allocate on trailing USD returns (country-fund flows chase past
    performance, and a currency slide makes the trailing USD return of a country look bad), and global equity managers
    benchmarked in USD who cut exposure to markets whose currency has weakened, together with home-biased local
    investors who do not price the competitiveness gain until it shows in reported earnings.
  why: 'A developed-market currency that trades far below its own multi-year average USD price tends to recover
    over the following one to three years (purchasing-power anchor; currency value, Menkhoff, Sarno, Schmeling,
    Schrimpf 2017; the lab saw the same in G10 currency trusts, H-0062). An unhedged US-listed country equity ETF
    carries that currency one for one, so the currency recovery lands in its USD return. A second channel runs through
    the real economy: a cheap currency raises the local-currency profits of the country''s exporters and multinationals
    with a lag of several quarters (pricing-to-market, translation of foreign sales), which a market anchored on
    trailing earnings prices slowly. Both channels say the same thing for a USD investor: the country ETFs whose
    currency is cheap against its own history should beat those whose currency is rich, over months to years. The
    signal lives in the FX market (FRED noon spot rates); the trade lives in equity ETFs.'
  why_not_arbitraged: The payoff takes one to three years and comes with currency and equity risk at the same time;
    a value bet against the trend can lose for years (career risk, mandate limits on tracking error), currency value
    has no carry to pay for the wait among low-inflation developed currencies, and arbitrage capital in country
    allocation is small next to benchmark-hugging global equity money.
signal:
  description: 'Inputs: daily FRED noon spot rates of ten currencies against the USD (fred_macro, clock next_morning,
    so the value of day d is used from day d+1) and the ten country ETFs. Mapping ETF -> series -> USD price P of
    one unit of the foreign currency: EWA -> DEXUSAL (P = x); EWC -> DEXCAUS (P = 1/x); EWD -> DEXSDUS (P = 1/x);
    EWJ -> DEXJPUS (P = 1/x); EWL -> DEXSZUS (P = 1/x); EWS -> DEXSIUS (P = 1/x); EWU -> DEXUSUK (P = x); EZU ->
    DEXUSEU (P = x); NORW -> DEXNOUS (P = 1/x); ENZL -> DEXUSNZ (P = x). Decision dates: after the close of the
    last XNYS session of each month (day t); orders fill at the open of day t+1. Value score of country c on day
    t: V_c = mean of ln P_c over the FX observations available at t inside the last lookback_months x 21 XNYS sessions,
    minus ln P_c of the latest observation available at t. V_c > 0 means the currency is cheap against its own average.
    A country is eligible on day t only if (a) at least 80 % of the sessions in the window have an FX observation
    and the latest observation is at most 10 sessions old, and (b) its ETF has a tradable bar on day t (so ENZL
    and NORW enter only once listed and once their window is filled; EZU waits for a full euro window). Ranking:
    sort eligible countries by V_c; the n_per_leg highest (cheapest currencies) form the long leg, the n_per_leg
    lowest (richest) the short leg. If fewer than 2 x n_per_leg + 1 countries are eligible, no cohort is formed
    that month (that cohort stays in cash). Book: overlapping cohorts. Each month a new cohort is formed with weight
    1 / hold_months; inside a cohort each long name gets +0.5 / n_per_leg and each short name -0.5 / n_per_leg of
    the cohort weight (dollar-neutral, cohort gross 1). A cohort is held unchanged for hold_months monthly decisions,
    then dropped. The target weight of each ETF is the sum over the live cohorts (long and short slots of the same
    ETF net out); gross therefore never exceeds 1. If an ETF stops having a tradable bar, its slots in every live
    cohort go to cash until those cohorts expire; no other name replaces it. Targets are set only on decision dates
    (monthly); no intra-month trading. Missing FX values are never filled forward beyond the 10-session staleness
    rule.'
  params:
    hold_months:
      grid:
      - 6
      - 12
      - 18
      value: 12
    lookback_months:
      grid:
      - 36
      - 60
      - 84
      value: 60
    n_per_leg:
      grid:
      - 1
      - 2
      - 3
      value: 2
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At each monthly decision date (after the close of the last XNYS session of the month), a country ETF whose
    currency is among the 2 cheapest of the eligible countries by the 60-month value score V_c (side +1), or among
    the 2 richest (side -1). The other eligible country ETFs on that date are the unmarked peers. Events are marked
    only on dates with at least 7 eligible countries (4 marked + at least 3 unmarked peers); with lookback 60 this
    holds on every decision date from the first one (seven countries eligible from about 2003-01), so no strategy
    date is missing from the event study.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
