falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the marked country ETFs is not above the 95th percentile
  of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism sign: the side-adjusted abnormal return is negative in 2 of the 3 dev blocks, or negative in the latest
  third of dev (decay or regime, K-0060): either kills the card.'
- 'Mechanism shape: the mean side-adjusted abnormal return at 60 sessions is not larger than at 21 sessions. A value
  effect must build with the horizon; an effect concentrated in the first weeks is reversal or noise, not the currency
  anchor.'
- 'Strategy: net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference to T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (lookback 36/84, n_per_leg 1/3, hold 6/18 and their combinations)
  beat the T-bill benchmark, or Sharpe at doubled costs below the benchmark.'
- 'Concentration: one dev third carries more than 60 % of the log return, or fewer than 2 of 3 thirds beat T-bills.'
notes: 'Brief fit: cross-asset (signal from the FX market via FRED, trade in US-listed equity ETFs), holding 12
  months in overlapping monthly cohorts (inside the 6-24 month brief; neighbors 6 and 18). The judge caps the mechanism
  horizon at 60 sessions, so G1 sees only the first quarter of a 12-month claim; that is why the shape criterion
  (60 > 21) is part of the card.

  Relation to earlier cards. H-0062 (same family, long-term-reversal) traded the currency value score in six G10
  currency trusts and passed the mechanism test, then missed the absolute Sharpe floor. H-0060 (same family) sorted
  country equity ETFs on their own 48-month USD return and found no reversal (wrong sign early). K-0073 left the
  split open: currency value works, equity-return reversal does not, and USD country ETFs carry both. This card
  asks the question that sits between them: does the currency anchor, measured only in the FX market, predict the
  USD return of the equity vehicle? It is not the H-0060 score (a country whose equity soared while its currency
  slid is cheap here and a winner there), and not the H-0062 book (equity ETFs instead of trusts, ten countries
  instead of six: adds SEK, SGD, NOK, NZD; no currency trusts traded). The signal formula is the H-0062 score by
  design, so the family and its trial count are shared on purpose. Either verdict is informative: a pass says the
  FX value effect survives, and is perhaps reinforced by the competitiveness channel, inside liquid equity wrappers;
  a failure next to H-0062''s pass says the local equity leg offsets the currency recovery (a cheap currency marks
  a local slump that persists).

  Anchor and carry (K-0073). The anchor is the nominal 5-year average spot. The universe is restricted on purpose
  to developed, low-inflation currencies (no BRL, MXN, INR, KRW, CNY), where inflation gaps over five years are
  small, so the nominal score is close to a real one and does not turn into a permanent long on high-inflation,
  high-carry currencies. A residual carry tilt remains (AUD, NZD, NOK had higher rates than JPY, CHF for much of
  the sample); interest-rate data per country are not loadable, so this is stated, not removed. Because value scores
  cycle over a few years, the time-shifted placebo reshuffles which countries are marked; a static carry or country
  premium would show up in the placebo mean (K-0025), not in the percentile.

  Beta caveat (K-0074). The G1 abnormal return is raw against the unmarked country ETFs. Cheap currencies are often
  commodity or risk-on currencies after a slump (higher equity beta), rich ones often havens (JPY, CHF, lower beta),
  so the long leg may carry more world-equity beta than the short leg. Both legs are marked and the side alternates
  as currencies cycle, which limits but does not remove this. The Builder should report the mean trailing beta of
  the long and short legs to the equal-weight country set, and the by-side result, if the gate output allows.

  Data and timing. Both datasets start 1998-01-02 so the signal history is delivered from the view start (K-0108).
  FRED euro starts 1999-01, so with lookback 60 the first decision with a value score is about 2003-01 (seven countries;
  EZU from about 2004-01; ENZL and NORW listed late 2010, eligible from then since their currency windows are already
  full). Neighbor lookback 84 starts about 2005. FRED FX are New York noon fixings, stale for Asian hours (catalog),
  irrelevant at a multi-year anchor and a monthly decision. Instruments: EWA, EWC, EWD, EWJ, EWL, EWS, EWU from
  the 1990s, EZU from 2000; NORW and ENZL from late 2010. If any ticker is missing in SFP, G0 should fail loudly
  (K-0102), not drop the country silently.

  Expected counts and size (K-0069, K-0098, K-0034). Event dates: about 213 monthly dates in 2003-2020 with a 60-session
  forward window; marked events 4 per date, about 850 in total; unmarked peers per date: 3 (2003), 4 (2004-2010),
  6 (2011 on). The book is invested from the first cohort and near gross 1 after the first year (mean exposure about
  0.85-0.95 over dev, dollar-neutral); about 216 decision dates; turnover is 1/12 of the book per month, so costs
  (liquid iShares country ETFs, tier spread) are a few bps per year and survive x2. My own forecast of the placebo
  bar at 60 sessions: country-ETF relative returns over 60 sessions have a standard deviation of about 7-8 %, about
  70 effective independent dates after overlap, so the bar is roughly 0.8 % per side-adjusted event. The currency
  channel alone, at the size H-0062 saw, would give roughly 0.5-1 % per event at 60 sessions, near that bar; the
  card passes the mechanism test only if the equity channel adds to the currency recovery rather than offsetting
  it. Gross per event should be several times the round-trip cost of liquid country ETFs (roughly 10-20 bps), so
  the cost check is not expected to bind.

  Most likely death: the strategy gate. A dollar-neutral 2-versus-2 country book has a volatility of roughly 10-12
  %, so it needs about 5-6 % a year to reach the absolute Sharpe floor of 0.5; the currency channel alone gives
  perhaps half of that. A mechanism pass with a strategy failure would still settle K-0073''s open question. ETFs
  have no forward data, so G4 is the ceiling. No dates, episodes or instruments were chosen from hindsight: the
  universe is every developed-market country ETF in the catalog''s issuer families whose currency has a FRED daily
  rate in the lab''s fred_macro dataset (Hong Kong is pegged and has no FRED series here; Denmark, Israel, Taiwan
  and South Africa have no series in fred_macro).'
