falsification_criteria:
- 'Mechanism: qualification-crossing events (appreciated stocks marked -1, depreciated +1) earn a 5-session abnormal
  return that does not exceed the 95th percentile of the time-shifted placebos, or whose gross per event is below
  the round-trip cost: no tax clock tradable in LIQ-500.'
- 'Mechanism: the latest third of the dev period (about 2015-2020) has the wrong sign; the effect is then treated
  as gone (K-0060), whatever the pooled result.'
- 'Mechanism shape: the 1- and 3-session averages are zero or wrong-signed and only the 10- and 21-session horizons
  are positive. A supply bunch at the threshold shows in the first sessions; a slow build means momentum or reversal
  confounds, not tax selling.'
- 'Strategy: net Sharpe on dev below the T-bill bar (0.5) or a bootstrap bound of the difference below zero.'
- 'Neighbors of spike_mult 4, leg 0.2 or n_estimators 100: fewer than 75 % beat the benchmark, or doubled costs
  leave it below the bar.'
- 'Linear baseline: a ridge on the same five features, same rows, label and refit schedule, gives the same or a
  better net Sharpe than the gbm, so the sign-flip interaction is not what pays.'
notes: 'Brief fit: US single stocks (liq_n 500), cross-sectional, 5-session label and hold, learned model. Why a
  new family: no card in the registry or the prior studies uses a holding-period tax clock; the closest relatives
  are the volume-attention cards (H-0014, H-0067, K-0024 avoid list) and earnings-date cards. This is not a volume-attention
  claim: the volume spike only dates a purchase, the predicted sign comes from the gain since that day and the side
  of the threshold, and nothing is traded on the spike itself. Earnings sessions are excluded around the spike so
  that the anniversary does not fall on next year''s same-quarter release (H-0023 calendar), and market-wide volume
  days are excluded because index reconstitutions and expiries recur on the same calendar every year. Any recurring
  stock-specific annual event that does not depend on the sign of g is marked long and short in roughly equal measure
  and cancels in the side-adjusted average. Rivals and what they predict: 12-month momentum (g is close to a one-year
  return) works against the claim, since appreciated stocks are marked -1; a beta gap between appreciated and depreciated
  stocks (K-0074) moves with the market and should flip by third; generic short-term reversal is not a feature.
  Mechanism test design: the event is the rule the model has to learn (crossing of the qualification date, side
  from the sign of g), not the model''s leg entries, because the lab''s learned cards could never separate a wrong
  learner from an absent mechanism (K-0135, K-0142). A pass here with a failing book points at the learner or the
  book, a failure at the clock itself. Forecasts, written before any data (K-0120, K-0144): spike days roughly 400-900
  a year in LIQ-500 after the exclusions (to be confirmed by G0 counts), so about 300-700 crossing events a year
  on most trading days, about 4000-9000 events on well over 1000 dates in dev from late 2005; window stocks per
  decision date roughly 20-60, legs of 4-12 names. Gross per crossing event: Reese''s IPO setting (one shared purchase
  date, pre-1987, a heavily retail holder base) is the ceiling; in large caps most spike-day volume is institutional
  and much of it is tax-exempt, so the central forecast is 5-15 bps per event over 5 sessions against a round trip
  of about 11 bps, and at a tenth of the ceiling (1-3 bps) the card dies on cost. The book needs about 20 bps per
  leg entry or more to reach a net Sharpe of 0.5 with 10-25 names, so the most likely deaths are, in order: gross
  below cost at the mechanism test, a placebo percentile under the bar with few spikes per date, then the absolute
  Sharpe floor. Period starts 2004-09 because the 8-K flag starts in 2004-08 (K-0145); first anniversaries come
  about 13 months later and first model scores after the framework''s warm-up, so the first third of dev is thinner
  than the others. The 366-day rule is a tax-law constant, not a date. The long-term holding period was ''more than
  one year'' throughout 2004-2020. Diagnostics worth reporting if a channel exists: event averages by side (appreciated
  versus depreciated) and the share of the gbm''s long leg with c >= 0 and g < 0 or c < 0 and g > 0. Data size:
  window rows roughly 5000-15000 a year, enough for a 100-tree, 8-leaf model refit quarterly (about 60 refits).'
