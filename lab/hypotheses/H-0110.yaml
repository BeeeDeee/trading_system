id: H-0110
version: 1
title: 'Capital-gains holding-period clock, learned - LIQ-500 market-neutral weekly: LightGBM scores stocks near
  the one-year tax anniversary of a stock-specific volume spike on gain x clock, hold 5 days'
author_agent: scout
family: capital-gains-tax-timing
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Taxable individual investors (and tax-aware taxable accounts) who time sales to the holding-period
    threshold and accept a small price concession because the tax saving (15-20 percentage points of the gain) is
    far larger; liquidity providers who absorb the bunched supply earn the concession. The strategy is on the liquidity
    provider''s side: short appreciated stocks as their pressure begins, long depreciated stocks as their pre-qualification
    selling ends.'
  why: 'US tax law taxes gains on shares held more than one year at the long-term rate (15-20 % in 2004-2020) and
    gains on shares held one year or less at the ordinary rate (up to 35-39.6 %). A taxable holder who bought on
    a given day therefore defers selling an appreciated position until the day after its one-year anniversary and,
    conversely, realizes a losing position before it turns long-term (short-term losses offset income taxed at the
    higher rate; Constantinides 1984). When many shares change hands on one stock-specific day (a news-driven volume
    spike), the buyers of that day share one tax clock. One year later their tax-motivated trades bunch on known
    dates: supply of appreciated stock rises just after the qualification date (price pressure, then recovery),
    while supply of depreciated stock is front-loaded before it, so the pressure on losers ends at qualification.
    Reese (1998) found exactly this two-sided pattern around the long-term qualification date of IPO shares: appreciated
    stocks show more volume and lower returns just after qualification, depreciated stocks just before. The card
    asks whether the same clock, anchored on stock-specific volume spikes instead of IPO dates, is visible over
    1-5 sessions in liquid US stocks, and lets a small walk-forward model learn the shape of the window instead
    of hand-tuning it on dev.'
  why_not_arbitraged: It is not a mispricing that informed capital competes away but a predictable demand for immediacy
    that is rational for the seller. Each event is small, falls on an idiosyncratic date that has to be reconstructed
    from a purchase-day clock a year back, and is spread over hundreds of stocks a year; the concession per event
    is likely of the order of the trading cost, so capacity is small and dedicated capital uninterested.
signal:
  description: 'All quantities are computed after the close of day t from data up to that close; trades happen at
    the open of t+1. (1) Spike days. For every stock j and session s: volume multiple m(j,s) = dollar_volume(j,s)
    divided by the median of dollar_volume(j) over sessions s-63..s-1 (at least 50 valid values, otherwise undefined).
    Session s is a spike day of j if m(j,s) >= spike_mult AND ea_reaction_day of j is 0 (not 1, not NaN) on every
    session s-3..s+3 (no earnings release nearby, so the anniversary does not land on next year''s same-quarter
    release) AND the median of m(i,s) over all universe members i of day s is below 1.5 (a stock-specific spike,
    not a market-wide volume day such as an index reconstitution, option expiry or quarter end, which recur every
    year). Spike days are known at the close of s+3, a year before they are used. (2) Tax clock. The qualification
    date of a spike day s is q(s) = s + 366 calendar days (shares bought on s are long-term when sold the day after
    the one-year anniversary). For decision day t, the anchor of j is the spike day s with |date(t) - q(s)| <= 14
    calendar days and the largest m(j,s) (ties: the most recent). c(j,t) = date(t) - q(s) in calendar days (-14..+14).
    A stock with an anchor that is a universe member at t is a ''window stock''; every other stock has no features
    on that row (not trained, not scored). (3) Features of window stocks (raw values, not z-scored, because c =
    0 and g = 0 are the tax thresholds and must keep a fixed meaning across dates): c; g = cumulative log total
    return of j from the close of s to the close of t (gain or loss of the spike-day buyers); log m(j,s) (size of
    the spike-day clientele); total return of j on day s (whether the buyers bought into a jump or a drop); 63-session
    realized volatility of j''s daily total returns up to t (scale of g). Daily total return = (1 + ret_co)(1 +
    ret_oc) - 1. (4) Model. lab.framework.ml.walk_forward with model gbm (LightGBM), label = total return from the
    open of t+1 to the open of t+6 (horizon 5), ranked across the scored rows of each date by the framework; training
    rows = window-stock rows with a fully realized label (the framework''s purge); expanding window, refit every
    63 rows, first fit when the framework''s minimum training size is reached; fixed hyperparameters num_leaves
    8, learning_rate 0.05, min_child_samples 200, subsample 0.8, colsample 1.0; n_estimators from params. All columns
    are kept and non-members masked per row (no ever-member column list, K-0134). (5) Book. On the first trading
    session of each week, score the window stocks of that day. If fewer than 10 are scored, hold nothing. Otherwise
    k = max(2, floor(leg x number scored)); long the k highest scores at +0.5/k each, short the k lowest at -0.5/k
    each (dollar-neutral, gross 1.0), held until the next weekly decision. A stock that is not tradable gets no
    weight; a position whose stock leaves the universe is closed at the first decision row where it is not a member
    (engine rule, K-0051).'
  params:
    leg:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    spike_mult:
      grid:
      - 3
      - 4
      - 5
      value: 4
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of day t, a universe member crosses the long-term qualification date of its anchor spike
    (t is the first session with c >= 0, spike rule as in the signal with spike_mult): side -1 if g > 0 (appreciated,
    tax selling starts), side +1 if g < 0 (depreciated, pre-qualification selling ends); g = 0 is not an event.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'c: calendar days from the long-term qualification date (spike day + 366 days) of the stock''s anchor spike,
    -14..+14 (the tax clock; from sharadar_sep dates)'
  - 'g: cumulative log total return from the close of the spike day to the close of t (sign and size of the spike-day
    buyers'' unrealized gain, which decides whether they wait for or run from the threshold)'
  - log volume multiple of the spike day, dollar volume over its trailing 63-session median (how many shares carry
    this clock)
  - total return of the spike day (buyers chasing a jump versus buying a drop; a different clientele and gain profile)
  - 63-session realized volatility of daily total returns at t (puts g in units of the stock's own risk)
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The tax incentive changes sign at a threshold and depends on the sign of the gain: before qualification,
    holders of appreciated shares wait (supply withheld) and holders of depreciated shares sell (supply added);
    after qualification it is the reverse. The expected abnormal return is therefore roughly sign(g) x (1[c < 0]
    - 1[c >= 0]) scaled by the spike size, a product of a step in c and the sign of g whose main effects average
    to about zero over the window. A ridge on c, g, spike size, spike-day return and volatility can only add their
    effects and would see mainly the 12-month return in g (momentum); a tree splits on c near 0 and then on g. The
    width of the window and how large a gain must be to matter are unknown and would otherwise be tuned on dev;
    the model learns them walk-forward. The taxable sellers who bunch their sales at the threshold pay for it.'
