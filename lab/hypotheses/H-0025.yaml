id: H-0025
version: 1
title: Turn-of-month beta rotation, always invested - LIQ-500 long-only, high-beta quintile over the month turn
  (day -1 to +3), low-beta quintile the rest of the month
author_agent: scout
family: turn-of-month-flows
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Inside the window: flow-driven buyers (contribution-driven retirement money, month-start mutual
    fund inflows, retail investing pay cheques) who buy at whatever price on fixed dates and push prices up for
    a few days. Outside the window: leverage-constrained investors and benchmark-relative managers who overpay for
    high-beta stocks to reach their return targets.'
  why: 'Cash that investors receive around the end of the month (payroll, pension and 401k contributions, coupon
    and dividend cash, month-start fund inflows) is invested in equities over the first days of the new month (Ogden
    1990). The buying pressure concentrates much of the equity premium in a short window around the month turn (Ariel
    1987; Lakonishok and Smidt 1988; McConnell and Xu 2008), so market exposure, and therefore beta, is rewarded
    mainly inside that window. Outside the window the market premium is small, and high-beta stocks are on average
    overpriced because leverage-constrained and benchmarked investors buy beta through high-beta stocks instead
    of leverage (Frazzini and Pedersen 2014), so low-beta stocks earn as much or more per unit of risk. A book that
    holds high-beta stocks only over the month turn and low-beta stocks the rest of the time collects the window
    premium with leverage-like exposure while avoiding the high-beta discount the rest of the month. The lab''s
    own evidence: the month-turn high-minus-low beta spread cleared the placebo test in H-0016, but a flat-otherwise
    book could not carry it (K-0027); this card tests it as an always-invested rotation.'
  why_not_arbitraged: The window premium is a market-level effect worth a few tenths of a percent per month; capturing
    it needs timed equity exposure and twice-monthly full rotation, which most mandates (fully invested, low tracking
    error, low turnover) do not allow. Holding low-beta stocks lags the market in rallies (benchmark risk), the
    reason the low-beta anomaly persists (Baker, Bradley and Wurgler 2011). Arbitrageurs who would lever the trade
    face crash risk inside the window (high beta on the wrong days is expensive).
signal:
  description: 'Universe: point-in-time LIQ-500 members (liq_n, n = 500) on the decision date that are tradable
    and have at least 189 valid daily returns in the beta window. Daily total return r = (1 + ret_co) * (1 + ret_oc)
    - 1. Market proxy m_t = equal-weighted mean of r over that day''s LIQ-500 members. Beta_i = OLS slope cov(r_i,
    m) / var(m) over the last beta_lookback trading days ending at the decision close (days where r_i is missing
    are dropped pairwise). Calendar from the XNYS trading calendar (holidays are published in advance, no look-ahead):
    day -1 = last trading day of a month, days +1..+post_days = the first post_days trading days of the next month.
    Switch A (into the window): after the close of the trading day before day -1, rank eligible members by beta
    and set target weights 1/N on the top leg_quantile fraction (highest beta, N = round(leg_quantile * eligible),
    at least 20 names); trade at the open of day -1. Switch B (out of the window): after the close of day +post_days,
    rank eligible members by beta and set target weights 1/N on the bottom leg_quantile fraction (lowest beta);
    trade at the next open (day +post_days+1). This low-beta book is held until the next Switch A. So the book is
    always fully invested, long-only, gross 1, rotating twice a month. Between switches no rebalancing: weights
    drift with prices (if the engine needs daily targets, use the drifted weights). A holding that delists realises
    its terminal return; a holding that leaves the universe or becomes untradable is sold at the next tradable open
    and its proceeds stay in cash until the next switch. Stocks that are not yet listed or lack 189 returns are
    simply not eligible. Names held in both consecutive legs (rare, middle-beta stocks only at leg_quantile 0.3)
    are traded only by the weight difference.'
  params:
    beta_lookback:
      grid:
      - 126
      - 252
      - 504
      value: 252
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    post_days:
      grid:
      - 2
      - 3
      - 4
      value: 3
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'A switch decision (after the close of day t): at Switch A (close of the trading day before the month''s
    last trading day) every eligible stock in the top beta leg is an event with side +1 and every stock in the bottom
    beta leg an event with side -1; at Switch B (close of trading day +post_days of the new month) every stock in
    the bottom beta leg is an event with side +1 and every stock in the top beta leg an event with side -1. Legs,
    betas and eligibility exactly as in the signal with the primary parameters. The claim: beta pays inside the
    window and is penalised just after it.'
  horizons:
  - 1
  - 2
  - 4
  - 10
  - 15
  primary_horizon_days: 4
