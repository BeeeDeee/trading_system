falsification_criteria:
- 'Mechanism: the pooled side-adjusted abnormal return of the switch events at 4 days is at or below the 95th percentile
  of the 200 time-shifted placebos, or has the claimed sign in fewer than 2 of 3 sub-periods, or is below the round-trip
  cost per event.'
- Net Sharpe on dev below SPY total return + 0.10, or the one-sided bootstrap bound of the Sharpe difference (75
  %) at or below zero.
- Fewer than 75 % of the parameter neighbors (post_days 2/4, beta_lookback 126/504, leg_quantile 0.1/0.3 and their
  combinations) beat SPY, or the median neighbor Sharpe is below 0.70 of the primary.
- At costs x2 the Sharpe no longer beats SPY.
- The book does not beat the 95th percentile of random-entry books with the same turnover and exposure.
- Post-publication excess Sharpe over SPY below half of the pre-publication excess (publication-decay check), or
  more than 60 % of the log return in one of three sub-periods.
notes: 'Brief fit: the brief asks for a 1-5 day cross-sectional US stock idea. K-0024 and lessons H-0007..H-0024
  say that information and sentiment events in LIQ-500 at 1-5 days are gone (eight dead event studies), and the
  only short-horizon effect that cleared the placebo bar was the month-turn beta spread (H-0016), which died as
  a flat-otherwise book because it was invested a fifth of the time (K-0027, K-0030). This card is the follow-up
  both lessons ask for: the same 4-session window, held as a tilt inside an always-invested book. The window leg
  is a 4-session hold (inside the brief); the non-window leg has to last the rest of the month (about 17 sessions),
  so the average hold is about 10 days. That is the closest fit to the brief that has a mechanism the lab has not
  refuted. Family: turn-of-month-flows (third trial after H-0001 and H-0016), because the new claim is the month-turn
  flow. The non-window leg is the low-beta stock idea from study 1 (low-volatility family, which failed its holdout).
  It is here only as the right place to sit when beta is not paid, not as the claim. The mechanism test covers both
  halves, so if the low-beta leg is wrong just after the window, the test should fail. Requested diagnostics for
  the Builder and Librarian, if a channel exists: (a) the event study split by Switch A and Switch B events, (b)
  a static low-beta-quintile book with the same costs as a control, so a pass can be credited to the rotation and
  not to low beta alone. Parameter values come from the literature (window -1..+3 of Lakonishok-Smidt and McConnell-Xu,
  252-day beta, quintiles). They were not tuned, and H-0016''s exact primary values are unknown to me. Costs: each
  switch sells about 100 % and buys about 100 % of the book (2x gross, roughly 10 bps at LIQ-500 half-spreads),
  24 switches a year, roughly 2.4 % a year, about 4.8 % at x2. The high-beta leg must earn that back inside the
  window. Likely ways to die: (1) the window premium faded in the latest third (H-0016), and the low-beta leg lagged
  the market in the late dev years, so the publication-decay check or the sub-period test fails; (2) costs x2; (3)
  the high-beta leg on a crash month turn makes the drawdown worse. Benchmark is SPY total return (long-only us_equity);
  the card does not hold SPY itself, which the random-entry check partly controls. Timing: decisions after the close
  with data up to that close, trades at the next open. The engine cannot trade at the close, so the window starts
  at the open of day -1 and misses the day -2 to -1 overnight.'
