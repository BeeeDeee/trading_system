references:
- cite: Frazzini (2006) The Disposition Effect and Underreaction to News, Journal of Finance 61(4)
  year: 2006
- cite: Grinblatt, Han (2005) Prospect theory, mental accounting, and momentum, Journal of Financial Economics 78
  year: 2005
- cite: 'Shefrin, Statman (1985) The disposition to sell winners too early and ride losers too long: theory and
    evidence, Journal of Finance 40'
  year: 1985
falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos (the same stocks on other dates), or its gross is below the round-trip cost.'
- 'Mechanism: the latest third of the dev event sample has the wrong sign (K-0060 decay), even if the pooled test
  passes.'
- 'Mechanism shape: the 1-session abnormal return is negative and the effect appears only at 10 sessions; that is
  slow momentum or overhang drift, not underreaction to the release.'
- 'Strategy: net Sharpe on dev below 0.5 or below T-bill + 0.10, or the bootstrap bound of the difference to T-bills
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (z_min 0.5 / 1.5, ref_window 126 / 504) beat T-bills, or the book
  no longer beats T-bills at doubled costs.'
notes: 'WHY THIS CARD. It answers the open question of H-0009 (family disposition-news-drift, the one earlier trial):
  H-0009 gated volume-shock moves by the 12-month capital gain and lost money, and its lesson asked for real announcement
  dates to isolate true news days. Here the news day is a real 8-K Item 2.02 release with a large own-price reaction,
  the overhang is a volume-weighted reference price (Grinblatt-Han style) rather than a plain 12-month return, and
  the design is a contrast inside the news set, not news-following. The brief (US single stocks, 1-5 day hold, cross-sectional)
  fits directly. RELATION TO OTHER FAMILIES, stated so the Chair can count trials. The events are a subset of the
  release-reaction events of the post-earnings-announcement-drift family (H-0028, H-0031, H-0033), but the side
  is set by the overhang, not by the news sign: long and short legs both contain good-news and bad-news stocks,
  so a generic drift that does not depend on the overhang cancels (exactly when the four cells are balanced, roughly
  otherwise). A pass therefore says something PEAD cannot: that the drift depends on holders'' gains. If the Chair
  prefers to count this under post-earnings-announcement-drift I have no objection; I filed it under the family
  that names the mechanism. H-0068 (earnings-announcement-premium) found that 12-month winners give back after releases
  with a NON-extreme reaction; this card uses only large reactions and predicts the opposite sign for high-overhang
  stocks, so a wrong sign here would extend H-0068''s give-back to large reactions, which is informative too. RIVALS.
  (a) Momentum concentrated at earnings announcements (Jegadeesh-Titman, Chan-Jegadeesh-Lakonishok): CGO correlates
  with past return, and the same-stock placebo removes only the persistent part of momentum, not a news-day concentration.
  A by-news-sign split (gain-minus-loss spread among good news vs among bad news) would help separate them: disposition
  predicts the spread in both cells, driven by the gain leg in good news and the loss leg in bad news. The Builder
  should report the by-sign and by-side means if a channel exists. (b) Beta/size confound (K-0074): high-CGO stocks
  after a run-up may have a different beta from low-CGO stocks; the raw G1 study does not adjust for it. The book
  is dollar-neutral, not beta-neutral. FORECASTS (K-0098, K-0120). LIQ-500 has roughly 1600-1900 releases a year
  visible in the 8-K flag (coverage gaps, K-0035); about 40-45 % have |z| >= 1, two thirds of those fall in the
  outer terciles: roughly 400-550 events a year, 6000-8500 over 2004-08 .. 2020, on about 1500-2200 dates, clustered
  in earnings seasons. With a 5-session hold the active set averages about 10 names, and both sides have 3+ names
  on perhaps 50-65 % of sessions, so mean gross exposure about 0.5-0.6 over the event years; the 2002-08 .. 2004-08
  warm-up is flat and dilutes it by about a tenth. Round trip: LIQ-500 tiers 3-6 bps half-spread with a 5 bps floor,
  so about 10-12 bps per name. Frazzini reports monthly alphas above 200 bps for the aligned long-short in an all-stock
  1980-2002 sample; for large caps after 2004, a 5-session horizon and the misaligned contrast I expect 15-35 bps
  gross per event. Below about 12 bps it dies on the cost check; at 25 bps gross the book nets about 13 bps per
  5-day cycle, about 3-4 % a year at 0.55 exposure against a volatility of about 6 % (10 earnings names, 2 % daily
  idiosyncratic vol), a net Sharpe near 0.5-0.6: the absolute Sharpe floor is the most likely strategy death, as
  for the other market-neutral earnings books. A mechanism verdict is still informative: it tells whether disposition-driven
  underreaction exists in large caps at all. DATA AND TIMING. ea_reaction_day is known at the close of the reaction
  session; the overhang uses closes up to t-1 only; entry at the open of t+1. No dates or instruments are hard-coded.
  Stock-attached data has no forward source, so G4 is the ceiling. Two parameters only; terciles, the 63-session
  vol window, the 3-name minimum per side and the 5-session hold are fixed in advance and not tuned.'
