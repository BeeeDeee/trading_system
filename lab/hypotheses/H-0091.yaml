id: H-0091
version: 1
title: Disposition-gated earnings-news drift on real 8-K dates - LIQ-500 dollar-neutral, among large release reactions
  long stocks whose holders sit on gains, short those sitting on losses, hold 5 days
author_agent: scout
family: disposition-news-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Disposition-prone holders (retail accounts and benchmark-relative managers who realize winners
    and avoid realizing losers): they sell gain stocks into good news below the value the news implies, and they
    hold loss stocks through bad news, which keeps prices above that value for a few days.'
  why: 'Disposition effect (Shefrin and Statman 1985; Frazzini 2006): investors sell winners too early and hold
    losers too long. When news arrives for a stock whose holders sit on unrealized gains, good news triggers gain-realizing
    sales that slow the price rise; when holders sit on losses, bad news is met by holders who refuse to sell at
    a loss, so the price falls too slowly. Frazzini finds that stocks with large unrealized gains underreact only
    to positive news and stocks with large unrealized losses only to negative news, so post-news drift is largest
    when news and overhang have the same sign. Among stocks with a large earnings release reaction, high-overhang
    stocks should therefore beat low-overhang stocks in the following week: with good news because the gain stocks
    keep drifting up while the loss stocks do not, with bad news because the loss stocks keep drifting down while
    the gain stocks do not. A generic, overhang-independent earnings drift cancels in this contrast, so the test
    isolates the disposition channel.'
  why_not_arbitraged: The trade needs many single-name long and short positions right after earnings, when idiosyncratic
    risk is highest. The edge per name is a few tens of basis points over a week, so taking it at scale needs leverage
    on idiosyncratic risk and fast turnover. The disposition supply comes back every earnings season and is spread
    over hundreds of names. Reference prices are not observable, only estimated from volume, so the signal is noisy
    for any single trader.
signal:
  description: 'Universe: point-in-time LIQ-500 (liq_n, n = 500). All quantities use data up to the close of day
    t; trades at the open of day t+1. Daily close-to-close total return of stock j on day t: r[t,j] = (1 + ret_co[t,j])
    * (1 + ret_oc[t,j]) - 1. Market-adjusted return: a[t,j] = r[t,j] minus the equal-weighted mean of r[t,.] over
    LIQ-500 members with a return on t. (1) Reaction: on a session with ea_reaction_day[t,j] == 1 (sec_8k_item202)
    for a stock that is a LIQ-500 member and tradable on t, z[t,j] = a[t,j] / sd_j, where sd_j is the standard deviation
    of a[.,j] over sessions t-63 .. t-1 (at least 40 valid values, else no event). The release is a large reaction
    if |z| >= z_min. (2) Capital-gains overhang at the close BEFORE the reaction session (t-1), for every LIQ-500
    member: build a total-return price index P[.,j] (cumulative product of 1 + r); reference price R[t-1,j] = sum(dollar_volume[k,j]
    * P[k,j]) / sum(dollar_volume[k,j]) over sessions k = t-ref_window .. t-1 (at least 80 % of these sessions valid,
    else no overhang value); CGO[t-1,j] = P[t-1,j] / R[t-1,j] - 1. (3) Side: compute the 1/3 and 2/3 quantiles of
    CGO[t-1,.] over all LIQ-500 members with a value on t-1. A large-reaction stock is an event with side +1 if
    its CGO is at or above the 2/3 quantile (holders on gains), side -1 if at or below the 1/3 quantile (holders
    on losses); middle-tercile stocks are not events. The side does not depend on the sign of the news: the claim
    is that gain stocks beat loss stocks after both good and bad news. (4) Book: an event of day t is held from
    the open of t+1 to the open of t+6 (5 sessions). After each close, the active set is the events of the last
    5 sessions (t-4 .. t) whose stock is still a LIQ-500 member and tradable; a stock with two active events keeps
    the latest. If the active set has at least 3 long and at least 3 short names, the long names get equal weights
    summing to +0.5 and the short names equal weights summing to -0.5 (dollar-neutral, gross 1.0, recomputed every
    session); otherwise the book is flat (cash). No hedge basket. A stock that leaves the universe or becomes untradable
    is closed at the next open. Missing ea_reaction_day (NaN, before a company''s first filing) means no event.'
  params:
    ref_window:
      grid:
      - 126
      - 252
      - 504
      value: 252
    z_min:
      grid:
      - 0.5
      - 1.0
      - 1.5
      value: 1.0
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 stock has an 8-K Item 2.02 reaction session (ea_reaction_day == 1) on day t with a market-adjusted
    close-to-close return of at least z_min = 1.0 own 63-session standard deviations in absolute value, and its
    capital-gains overhang at the close of t-1 (total-return price over its dollar-volume-weighted average price
    of the past 252 sessions, minus 1) lies in the top third (side +1) or bottom third (side -1) of the LIQ-500
    cross-section on t-1. The side ignores the sign of the news.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
