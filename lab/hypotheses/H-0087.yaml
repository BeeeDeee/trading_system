falsification_criteria:
- 'Mechanism: the 60-session side-adjusted abnormal return of cohort members is below the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the side-adjusted mean in the latest third of dev is negative (kill condition even if the pooled test
  passes, K-0060).'
- 'Mechanism shape: the 60-session abnormal return is not larger than the 21-session one; slow rebalancing must
  build over months, a flat or front-loaded profile means this is not the claimed flow.'
- 'Strategy: net Sharpe on dev below 0.5, or below T-bill Sharpe + 0.10, or the bootstrap bound of the difference
  to T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (lookback 9 and 15 months, hold 3 and 12 months and their combinations)
  beat the T-bill benchmark, or their median Sharpe is under 0.7 of the primary.'
- 'Concentration: one third of dev carries more than 60 % of the log return, or net Sharpe at doubled costs falls
  below the benchmark bar.'
notes: 'Brief: long horizon (6-24 months), cross-asset (signal from one market, trades in another, FRED allowed).
  The signal comes from each country''s government bond market and the trade is in that country''s equity ETF; the
  hold is six months of overlapping monthly cohorts (12 in the grid). The mechanism test horizon is capped at 60
  sessions, so it sees only the first third of the hold; that is the closest fit the judge allows. WHY A NEW DATASET:
  the mechanism is country-specific (local bond move -> local equity flow), so it needs one bond market per equity
  market. The catalog has only US yields (fred_macro DGS10/DGS2), and international bond ETFs start after 2007 and
  are multi-country baskets. The FRED/OECD monthly series are free, public, one source and one format for all 15
  countries (all ids checked to exist on FRED). Monthly averages are enough for a 12-month signal; the two-month
  stamping lag gives up a little freshness to remove publication look-ahead. UNIVERSE RULE (not picked on performance):
  the US (SPY) plus every country with a US-listed iShares MSCI single-country ETF launched by 2010 that has its
  own floating currency and monetary policy and an OECD 10-year yield series on FRED. Euro-area members share one
  policy rate and their yields co-moved closely for much of the sample, so ranking them separately would put several
  near-identical signals in one leg; Germany (EWG) represents the euro area. Pegged or managed currencies (Hong
  Kong, Malaysia, Singapore, Taiwan, China) and countries without a FRED OECD 10-year series (Brazil, Turkey, Thailand,
  Indonesia, Peru) are out by the rule. Ten instruments are eligible from about 2000-2001 (KR and MX once their
  yield histories allow), 15 by 2011. Signal history before the view start is not delivered (K-0108), so the first
  cohort needs about 26 months of yields from 1998-01 (24 monthly changes for s_i plus the lag); I expect the first
  cohort around 2000-04. WHAT IS NEW vs the dead ideas: H-0060 sorted countries on their own multi-year equity return
  (reversal) and H-0056 timed SPY on oil; H-0061 timed SPY vs IEF on a credit spread; the mrel scan and K-0080 cover
  daily lead-lag. Here the signal is another asset class of the same country over 12 months, the horizon is months,
  and the trade is cross-sectional across countries with both sides marked, so the placebo mean should be near zero
  and the global equity factor cancels. Not SPY/IEF, not a binary switch (K-0005). Study 2 used each class''s own
  trend; this is a cross-asset signal. Family cross-asset-momentum is new; if the Chair thinks it belongs to an
  existing cross-market information family I accept the merge. CONFOUNDS I EXPECT (stated so the result can be read):
  (1) currency: ETF returns are in USD while the paper uses local or hedged equity returns; a local yield fall often
  comes with rate cuts and a weaker currency over the following months (lower carry), which works against the long
  leg. A failure with a flat or wrong sign would then say ''not harvestable through unhedged ETFs'', not ''the paper
  is wrong''. (2) beta (K-0074): vol-scaling keeps high-volatility emerging yields from sitting in the legs by construction,
  so the average beta gap between legs should be small, but in global risk-off emerging-market yields tend to rise
  and core yields fall, so the book can be short high-beta countries after stress; a stress-continuation reading
  is possible and the judge has no beta-adjusted abnormal return. NUMBERS (forecast, before any data): about 228
  formation dates in dev with 4-6 marked instruments each, so about 1000-1300 events on about 228 dates, 4 or more
  unmarked peers per date. I expect a gross side-adjusted abnormal return of about 0.6-1.2 % per event at 60 sessions
  (a country spread of roughly 3-5 % a year); per-event 60-session noise is about 5 %, and with overlapping windows
  the placebo bar is probably around 0.5-0.8 %, so the test can tell if the effect is at the middle of my range
  and is a coin flip at the low end. Round-trip cost for these ETFs is roughly 0.1-0.5 % (EIS, EPOL, ENZL, ECH,
  EZA in higher tiers), so the cost ratio should not bind. Book: gross 1, dollar-neutral, mean exposure about 0.95
  (ramp-up over the first H months), about 250 monthly rebalances, turnover about 1/H of the book per month (about
  0.5 % a year of cost). Expected net Sharpe 0.3-0.6 against a floor of 0.5: the absolute floor is the most likely
  strategy death, and I file the card anyway because the mechanism test is the informative, cheap part and the lab
  has never tested cross-asset momentum. The second most likely death is G2 sub-period concentration (few global
  rate cycles). ETFs and OECD yields have no forward source here, so G4 is the ceiling. Publication: the reference
  year is the end of dev, so there is no post-publication part in dev; the holdout is the only post-publication
  check.'
