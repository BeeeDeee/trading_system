mechanism:
  counterparty: Slow-rebalancing balanced investors who buy local equities months after the bond move instead of
    at once (they pay the drift), and equity-only investors who price country equities from equity-market information
    and ignore what the local bond market already priced.
  why: 'Pitkajarvi, Suominen and Vaittinen (2020, JFE) find in 20 countries that a country''s past 12-month government
    bond return positively predicts its future equity market return, and attribute it to slow-moving capital: investors
    who hold both a country''s bonds and its equities (home-biased pension funds, insurers, balanced and target-date
    funds with fixed strategic weights) rebalance slowly and in steps after a bond market shock. When local bonds
    rally (yields fall), the bond sleeve becomes overweight and the lower discount rate is priced first by rates
    investors; the cross-market investors move money into local equities over the following months (rebalancing
    bands, quarterly or annual committee cycles, liability reviews), so the local equity market drifts up relative
    to other countries. After a bond sell-off the same flow runs out of local equities. Because pension and insurance
    portfolios are strongly home-biased, the flow is country-specific, which is what a cross-section of country
    equity ETFs can isolate from the global factor.'
  why_not_arbitraged: Exploiting it means a country-allocation spread with large tracking error, a Sharpe well under
    one and long losing stretches; equity and rates desks are separate mandates, and the capital that could arbitrage
    across the two markets is itself the slow-moving capital the mechanism describes (Duffie 2010). Mandates of
    the rebalancers (strategic weights, governance cycles) are not changed by the predictability.
signal:
  description: 'Inputs: daily total returns of the 15 ETFs (sharadar_sfp) and, per country, the OECD monthly-average
    10-year government bond yield from the new dataset fred_oecd_10y_yields_1d (a daily step series of the monthly
    values; key per country: US for SPY, JP for EWJ, GB for EWU, CA for EWC, AU for EWA, CH for EWL, SE for EWD,
    DE for EWG, KR for EWY, MX for EWW, ZA for EZA, CL for ECH, IL for EIS, PL for EPOL, NZ for ENZL). A monthly
    yield value is usable only from the first XNYS session of the second calendar month after the month it averages
    (the value for month m from the first session of month m+2), which covers the OECD/FRED publication lag; the
    strategy always uses the latest usable value, never anything later. Decision dates: after the close of the last
    XNYS session of each calendar month (t); trades at the open of the next session. Score at t for country i: let
    y_i(0) be the latest usable monthly yield at t and y_i(-L) the usable monthly yield L months before it (L =
    lookback_months). dy_i = y_i(0) - y_i(-L) in percentage points. s_i = standard deviation of the month-over-month
    changes of y_i over the 36 usable months ending at y_i(0) (at least 24 changes required) times sqrt(L). score_i
    = -dy_i / s_i (a vol-scaled local bond return proxy: positive when the local bond market rallied). Eligibility
    at t: the ETF has a price bar on t and at least 63 sessions of history, and score_i exists. If fewer than 8
    instruments are eligible, no new cohort is formed at t (the existing cohorts are kept). Cohort at t: with N
    eligible instruments let k = floor(N / 4). Long the k highest scores, short the k lowest (ties broken by the
    larger absolute score magnitude, then alphabetically by ticker). Within each leg weights are proportional to
    1 / sigma_i, sigma_i = standard deviation of daily log total returns over the last 63 sessions, normalized so
    the long leg sums to +0.5 / H and the short leg to -0.5 / H (H = hold_months). Book: the target weight of each
    ETF is the sum of its weights in the H most recent cohorts (a cohort formed at month-end t is held through the
    next H month-end rebalances and dropped at the H-th one). Gross exposure is therefore at most 1 and dollar-neutral.
    Weights are reset to the target only at month-end rebalances. Missing data: an ETF without a price bar on a
    rebalance day gets target weight 0 in every cohort from that day on; a missing yield month makes the country
    ineligible for new cohorts until both yields and 24 changes exist again (no filling, no interpolation). Instruments
    listed later (EZA, ECH, EIS, EPOL, ENZL) enter only through the eligibility rule.'
  params:
