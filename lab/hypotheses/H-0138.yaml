mechanism:
  counterparty: Traders who fade the opening move (range-reversion scalpers and passive liquidity providers who
    sell the first push above the range and buy the first push below it) and traders whose stops and liquidation
    prices sit just beyond the opening range; in high-volatility regimes leverage is higher and stops are denser
    there, so their forced exits extend the move. Short-gamma option hedgers buy rallies and sell declines in the
    same direction.
  why: 'An opening-range breakout is a bet that the day is a trend day: that the order flow arriving with the US
    cash session (US desks, CME-basis and equity-correlated hedgers, US retail) is one-sided enough to carry price
    away from the first half hour''s range until the US close. Trend days are not spread evenly: they cluster in
    high-volatility regimes, when news flow is dense, leverage is being forcibly reduced and option dealers are
    more often short gamma and hedge in the direction of the move. Lundstrom finds ORB day-trading returns rising
    steeply from the lowest to the highest volatility state (crude oil and S&P 500 futures), and Gao, Han, Li and
    Zhou (2018) find market intraday momentum (first half hour predicting the last) markedly stronger on high-volatility
    days. A second, cost-side argument matters as much here: H-0137 (the same rule on every weekday) earned a gross
    per trade a little under the 13 bps taker round trip. Costs are fixed in bps while the size of a trend-day move
    scales with volatility, so restricting the same rule to the high-volatility third of days should raise gross
    per trade relative to a fixed cost even if the hit rate only holds. The claim of the card is the conjunction:
    per trade, the high-volatility days carry more than the rest, enough to clear costs.'
  why_not_arbitraged: The edge, if any, is a few tens of bps on a minority of days, needs a taker fill in fast markets
    and carries full directional intraday risk on volatile days, so it is small in capacity and unattractive to
    balance-sheet constrained market makers, whose own business is to fade the move. Unconditional ORB does not
    pay after costs (H-0137, study 16), which keeps generic breakout traders out and the conditional version unexploited
    by them.
signal:
  description: 'Instruments: BTCUSDT and ETHUSDT perpetuals, 15-minute candles (binance_perp_15m), traded independently,
    each with a fixed weight of 0.5 of equity when in a position (gross <= 1). Clock: New York time, i.e. 09:30
    NY = 13:30 UTC while US daylight saving time is in force (second Sunday of March to first Sunday of November)
    and 14:30 UTC otherwise; candles are labelled by their open time. Sessions: every Monday-Friday (US holidays
    are not removed; they are a few days a year). Part 1, the ORB rule (identical to H-0137): the opening range
    of instrument j on session t is the highest high and lowest low of the two candles opening at 09:30 and 09:45
    NY. After the close of each candle opening between 10:00 and 15:15 NY inclusive, if j has not yet traded on
    t: a close strictly above the range high opens a long, a close strictly below the range low opens a short, filled
    at the next candle''s open. Only the first breakout per instrument and session is traded; no re-entry. Stop:
    while long (short), a candle close below the range low (above the range high) exits at the next candle''s open.
    Time exit: any open position is closed at the open of the candle opening at 16:00 NY. Part 2, the volatility
    state (the only change versus H-0137), fixed for the session before the range forms: rv_t(j) = square root of
    the sum of squared 15-minute log close-to-close returns of j over the 672 candles (7 x 24 hours) ending at the
    close of the candle opening at 09:15 NY on session t. A 7-day window holds exactly one weekend for every session,
    so the state has no day-of-week artefact. rank_t(j) = share of the previous 60 sessions'' rv values of j (sessions
    t-60..t-1) that are strictly below rv_t(j). Session t is a high-volatility session for j when rank_t(j) >= vol_rank_min;
    part 1 is traded for j on t only then, otherwise j stays flat all session. BTC and ETH have their own state.
    Missing data: candles flagged not real are skipped in the rv sum; if fewer than 90 % of the 672 candles are
    real, or either opening-range candle is not real, j does not trade on t; signal candles that are not real cannot
    trigger an entry or a stop (the stop is checked at the next real close). Warm-up: no trade until j has 60 prior
    sessions with a valid rv. No other filters, no sizing by volatility.'
