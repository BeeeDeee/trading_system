falsification_criteria:
- Fewer than 300 trades in the 2020-2022 dev period at the primary vol_rank_min 0.667 (the filter left too little
  to test; the card is then untestable, not confirmed).
- Net Sharpe below 0.5 at the primary, or the 75 % one-sided bootstrap bound of the mean net trade at or below zero
  (G1).
- 'Owner criterion, high vs low volatility per trade: the mean gross trade (bps) of the primary is not above the
  mean gross trade of H-0137 (the same rule on all sessions) on the same dev window. Because the all-sessions mean
  is a mix of the top tercile and the other two, this is the same as the high-volatility tercile not beating the
  lower terciles per trade; then the mechanism is refuted, whatever the Sharpe.'
- 'Dose response: the mean net trade does not rise from vol_rank_min 0.5 to 0.667 to 0.75 (if per-trade gross is
  flat or falling as the filter tightens, the volatility state carries no trend-day information).'
- 'Scaling only: if the per-trade Sharpe (mean / standard deviation of trade returns) of the primary is not above
  H-0137''s, the filter only enlarged the bets relative to costs; the Gao et al. claim of stronger momentum on volatile
  days is then not supported (report, mechanism-level).'
- 'G2: fewer than 75 % of the neighbors (0.5, 0.75) with positive net Sharpe, Sharpe with a one-candle later fill
  below half the primary, net Sharpe at doubled costs not positive, fewer than 2 of 3 dev thirds positive or one
  third carrying more than 60 % of the profit, or the trades not beating the same trades placed at random times
  (95th percentile).'
notes: 'owner_seed: ORB-C2

  What this card is: H-0137 (ORB-C1, rejected at G1 on net Sharpe with gross a little under the round trip) with
  one added condition, the volatility state, as the owner asked. The ORB rule itself (range 09:30-10:00 NY, first
  15m close beyond it, opposite-edge stop on a close, exit 16:00 NY, both sides, 0.5 per instrument) is meant to
  be exactly H-0137''s; the lesson on H-0137 forbids changing range length, stop, anchor or exit hour, and none
  is changed. If the Builder finds that H-0137''s implemented stop or entry window differed from the text above,
  H-0137''s implementation should win so that the volatility filter is the only difference, and the deviation should
  be reported. Same family, so the trials count together (H-0137 plus study 16''s ORB).

  Why it is not a rescue by tuning: the filter is the owner''s pre-registered idea, argued from published results
  (Lundstrom on ORB by volatility state, Gao et al. on intraday momentum), with one measure and one parameter on
  a round grid (half, top tercile, top quartile). The mechanism-level reason it could differ from H-0137 is twofold:
  trend days cluster in high-volatility regimes, and fixed-bps costs shrink relative to the move when volatility
  is high (K-0187 asks cards to state expected gross against the round trip).

  Choice of measure: trailing 7-day realized volatility ranked in its own last 60 sessions, not the opening range
  width. The range width changes the geometry of the trade itself (a wide range puts the breakout level and the
  stop further away), so filtering on it would mix the volatility claim with a different stop and entry distance,
  which the H-0137 lesson says not to vary. The trailing measure is fixed before the range forms and leaves the
  rule untouched. Seven days so every window holds one weekend; 60 sessions (about three months) so the rank is
  relative to the current era of crypto volatility, not to the whole sample.

  Making the owner''s falsification measurable inside the judge (K-0186: intraday cards have no mechanism channel
  and manual controls never run when G1 fails): the high-vs-low comparison is read from numbers the judge already
  reports, the primary''s mean gross trade against H-0137''s (the all-sessions rule), plus the dose response across
  the grid neighbors. A direct bottom-tercile run (rank < 0.333) would be a useful extra for the Chair but the card
  does not depend on it. No mechanism_test block: the intraday judge has none.

  Forecasts (written before any result): about 1 300 breakout trades per three years on all sessions for the two
  coins, so about 400 at the primary (about 650 at 0.5, about 330 at 0.75). If the move scales with volatility,
  mean gross per trade should be roughly 1.5-2x H-0137''s, i.e. about 20-30 bps against a 13 bps round trip on BTC/ETH,
  net about 7-15 bps; with intraday trade volatility of one to three percent this gives a net Sharpe around 0.3-0.8.
  Most likely death: G1 on Sharpe or the trade bound, if the per-trade edge only scales with volatility and the
  trade noise scales just as fast. Second most likely: G2 sub-periods, because high-volatility sessions cluster
  in a few episodes and one dev third may carry most of the profit, and the doubled-cost test. Bull-market artefact
  (study 16): both sides are traded; the side split is not reported by the judge, so a long-only profit source cannot
  be excluded at G1-G2 and should be checked at G4 if it gets there. Intraday cards can pass at most G4 (no forward
  data).

  Builder: zoneinfo may be unavailable (K-0186); hand-coded US DST rules with unit tests at the transitions are
  acceptable. Timeframes list 1d because the volatility state is a multi-day quantity; it is computed from the 15m
  candles, no daily dataset is needed.'
