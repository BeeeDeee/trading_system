falsification_criteria:
- Net Sharpe on dev (costs x1) below 0.5, or not above T-bill by the G1 bootstrap bound.
- Net Sharpe at costs x2 below 0.5 (the edge does not pay for weekly turnover).
- Fewer than 75 % of the grid neighbors (fast_days 3/10, slow_days 126/504 and their combinations) reach Sharpe
  0.5 net.
- More than 60 % of the dev log return comes from one of the three sub-periods (in particular the 1998-2005 block
  that dominated study 5).
- 'Mechanism check 1 (decomposition): the identical construction using close-to-close returns for IR_fast and IR_slow
  has a net Sharpe at least as high as the intraday version; then the intraday split adds nothing and this is study
  5 again.'
- 'Mechanism check 2 (confirmation): the unconditional intraday reversal (long bottom quintile / short top quintile
  of IR_fast over the whole eligible set, no slow split) has a net Sharpe at least as high; then the slow timeframe
  adds nothing.'
- 'Mechanism check 3 (overnight placebo): sorting on the overnight component (sum of ln(1+ret_co)) instead of ret_oc
  in the fast window gives a reversal spread of the same size; then the news/trading distinction is not what drives
  it.'
notes: 'Brief fit: short holding (5 trading days), US single stocks, cross-sectional, two timeframes (a 1-week fast
  reversal signal confirmed by a 12-month slow momentum signal, both computed from daily bars). Relation to prior
  work: study 5 (short-term reversal with a trend filter) died on DSR (N = 993), on validation and on profit concentration
  in 1999-2002. This card is honestly in the same family (short-term-reversal) and accepts that trial count. The
  mechanism-level difference is the return decomposition: both the reversal and the confirming trend are computed
  only from the trading-driven intraday component, because the news-driven overnight component is not expected to
  revert at a one-week horizon and only dilutes the signal (more turnover per unit of edge). The slow filter is
  not a price trend of the market or of the stock''s total return but the stock''s own 12-month intraday drift (informed-flow
  proxy), applied symmetrically to both legs. Mechanism checks 2 and 3 are written so that a death says which half
  of the story failed. Known risks, stated up front: (a) profits of reversal strategies are reported to accrue largely
  overnight (Lou, Polk and Skouras on the tug of war between overnight and intraday returns); trading at the open
  of t+1 misses the first night after the signal, which may be the strongest; (b) pre-decimalization cost multiplier
  x2.5 hits the 1998-2001 part, so the strategy cannot live off that era; (c) short legs of high-intraday-return
  losers are crash-prone in sharp junk rallies. No hindsight: no dates or names are used, the universe is the PIT
  LIQ-500, parameters are round conventional values. No new data needed.'
