title: Intraday-component reversal confirmed by intraday-component momentum - weekly long/short in LIQ-500, buy
  last week's intraday losers among 12-month intraday winners, short the mirror
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Liquidity demanders who need immediacy within the week: funds meeting redemptions or inflows, index
    and risk-model rebalancers, stop-loss and margin-driven sellers, institutions completing split orders. They
    accept a temporary price concession; the strategy takes the other side, but only where the slow intraday drift
    says informed demand is on the strategy''s side, so it is less often run over by a continuing informed seller.'
  why: 'A stock''s daily return has two parts with different origins. The overnight part (close to next open) mostly
    reflects news released outside trading hours; the intraday part (open to close) mostly reflects the price impact
    of investors'' own trading. Barardehi, Bogousslavsky and Muravyev show that portfolios formed on past intraday
    returns display both short-term reversal and medium-term momentum, while portfolios formed on past overnight
    returns show neither at those horizons. Reading: a sharp intraday move over the last week is mostly temporary
    price pressure from liquidity-demanding trades (it reverts as liquidity providers are paid), while a persistent
    intraday drift over the past year is the slow incorporation of informed order flow that others underreact to
    (it continues). The strategy uses both timeframes of the same trading-driven component: it buys stocks whose
    last-week intraday return was among the worst while their 12-month intraday return is in the top half (a temporary
    liquidity push against a persistent informed-demand drift), and shorts the mirror image. Close-to-close reversal
    (lab study 5) mixes the news part, which does not revert, into the signal; removing it should raise the edge
    per unit of turnover, which is what decides survival after costs at a weekly horizon.'
  why_not_arbitraged: Liquidity provision at a weekly horizon needs balance sheet and bears inventory risk exactly
    when liquidity is scarce (reversal profits are highest in stressed markets, when providers withdraw). Turnover
    of roughly 50x per year caps the capacity and keeps large asset managers out; the residual premium is the compensation
    for that risk and for costs, which is why it is small in large caps and must be measured net of costs x2.
signal:
  description: 'Data: sharadar_sep daily ret_oc (open-to-close return of day d), ret_co (close of d-1 to open of
    d, only for P&L), tradable, listed, PIT liquidity rank. Universe: point-in-time liq_n with n = 500. Decision
    dates: the last trading day of each calendar week (XNYS), after the close of that day t, using data up to and
    including the close of t; orders are executed at the open of t+1 and held to the open after the next decision
    date (about 5 trading days). Inputs per stock i (log intraday returns l_d = ln(1 + ret_oc_d), missing days count
    as 0): IR_fast_i = sum of l_d over the last fast_days trading days d = t-fast_days+1 .. t. IR_slow_i = sum of
    l_d over trading days d = t-slow_days+1 .. t-21 (the most recent 21 trading days are skipped so the slow window
    does not overlap the reversal window). Eligibility at t: member of the PIT LIQ-500 at t, tradable at t, at least
    90 % of the days of the slow window and of the fast window with a valid ret_oc (stocks listed for less than
    slow_days are not eligible). Construction (double sort): split the eligible set at the cross-sectional median
    of IR_slow into W (top half) and L (bottom half). Long leg: the 20 % of W with the lowest IR_fast. Short leg:
    the 20 % of L with the highest IR_fast (rounded to the nearest integer, at least 10 names per leg, otherwise
    flat that week). Weights: +0.5 / n_long on each long, -0.5 / n_short on each short (dollar-neutral, gross 1.0,
    no leverage). Ties broken by instrument id. Holding: positions are held unchanged until the next decision date;
    at each decision date the whole book is re-formed and only the differences are traded. A stock not tradable
    at the open of t+1 is skipped (its weight stays in cash). A delisting during the hold realizes the dataset''s
    terminal return and the weight goes to cash until the next decision date. P&L uses total returns (ret_co and
    ret_oc compounded); unadjusted prices are not used.'
  params:
    fast_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
    slow_days:
      grid:
      - 126
      - 252
      - 504
      value: 252
  selection_procedure: None. Primary configuration fixed a priori (one-week reversal window, 12-month momentum window
    with a 1-month skip, the conventional choices); quintile legs within halves are a fixed convention, not a parameter.
  timeframes:
  - 1d
  - 1w
  - 1mo
