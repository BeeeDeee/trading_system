falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost: the reversal at the next release is not
  there.'
- 'Sign check: if the event average comes out with the opposite sign (previous positive reactors outperform at the
  next release), H-0197''s result was a sign inversion and the true direction is continuation; the card is refuted
  and the owner should be told.'
- 'Decay: the latest third of dev is negative or under a third of the pooled mean (K-0060).'
- 'Shape: the 1-session horizon (before the predicted release session) carries more than half of the 5-session mean,
  which would make it pre-release positioning, not a reset bar beaten or missed at the release.'
- 'Identity: the placebo mean (same stocks on shifted dates) is more than half the event mean: the result belongs
  to which stocks are picked, not to the release timing (K-0025).'
- 'Strategy: net Sharpe on dev below 0.5 (T-bill benchmark), or the bootstrap bound of the Sharpe difference below
  zero.'
- 'Robustness: fewer than 75 % of the neighbors (z_min 1.5 / 2.5, lead_sessions 1 / 3) beat the benchmark, or the
  book does not beat it at 2x costs.'
- 'Holdout: 2021-2026 Sharpe below half of dev, or the holdout event sign reverses: dev is contaminated by H-0197,
  so the holdout is the real test.'
notes: 'Why this is not a rescue of H-0197: H-0197 claimed continuation (Bernard-Thomas) and failed with the opposite
  sign; the lesson allows a mirrored card only as a new hypothesis that names who is on the other side and is counted
  as a new trial. This card does that, stays in H-0197''s family (post-earnings-announcement-drift) and lists earnings-announcement-premium
  (H-0068, the attention-based winner give-back at releases) as related, so the trials of both count. It is dev-selected
  in sign, so a G1 mechanism pass is expected and is NOT evidence; the evidence is G2 (sub-periods, neighbors, costs,
  random entry), G3 with the heavy family count, and the untouched 2021-2026 holdout. It also settles the open question
  of H-0197: if this card comes out wrong-signed, H-0197 had a silent sign inversion. Builder: please add a unit
  check on a synthetic stock (previous reaction z = +3 must give side -1, z = -3 side +1) and report the event count
  by side. Differences in definition from H-0197 (as far as the lesson describes it): the predicted date comes from
  last year''s real 8-K reaction session + 52 weeks, not a weekday-calendar approximation; sides use a fixed z threshold
  on the previous reaction, not a cross-sectional leg fraction; the book uses fixed slots with no hedge basket.
  Expected size (my estimate, not a measurement): LIQ-500 has about 2,000 releases a year; with 8-K coverage gaps
  and |z| >= 2 on about a third of reactions, about 400-600 events a year, 6,000-9,000 in dev on well over 1,000
  dates, roughly balanced by side. Mean concurrency about 8-12 slots, so mean gross 0.3-0.5 (floor 0.20), peak seasons
  near the cap, off-season mostly cash. Round-trip cost 6-12 bps (tiers 3/6 bps per side). The book needs a side-adjusted
  gross of about 0.3 % per event to reach the 0.5 Sharpe floor; at 0.5 % per event the estimate is about 8 % a year
  on 6-7 % volatility. Beta gap between the legs should be small: both legs are stocks entering an earnings window
  with large past reactions, the sign of the past reaction does not set the beta. Likeliest deaths: G3 (the family
  carries many trials plus the literature prior), the latest-third or holdout check if the H-0197 pattern was one
  era, or the absolute Sharpe floor if the per-event effect is nearer 0.2 % than 0.5 %. Brief fit: 5-session hold,
  US single stocks, cross-sectional, mechanism test declared. No ML block: a fixed rule is the cleanest sign test.'
