id: H-0204
version: 1
title: Expectation ratchet at the next release - LIQ-500, long last quarter's big negative 8-K reactors, short big
  positive ones, 5 sessions around the predicted release
author_agent: scout
family: post-earnings-announcement-drift
related_families:
- earnings-announcement-premium
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors who extrapolate the last release: momentum and attention buyers who hold or add to last
    quarter''s big positive reactors into the next release, and holders who sell or avoid last quarter''s big negative
    reactors before management has reset expectations. They pay when the reset bar is beaten (or missed) at the
    release.'
  why: 'A large earnings-release reaction resets the bar for the next release. After a strong positive reaction,
    analysts and investors extrapolate and push expectations up, and the stock draws attention money into the next
    release (Aboody, Lehavy and Trueman 2010: past winners earn negative returns around their next announcements,
    a limited-attention story). After a large negative reaction, management guides down and consensus is walked
    down to a level the firm can beat (Richardson, Teoh and Wysocki 2004). So at the next release the previous winners
    face a raised bar and the previous losers face a lowered one, and the release window returns run against the
    previous reaction. The lab measured this in H-0197: around the predicted next release, stocks with a strong
    positive previous reaction lagged and those with a strong negative one led, below every time-shifted placebo,
    in all three thirds of dev, strongest in the latest third, built from the release session over the week. H-0197
    bet the other way (Bernard-Thomas continuation). This card states the reversal as its own pre-registered claim,
    with a named counterparty, so that it is counted as a new trial and the holdout can judge it.'
  why_not_arbitraged: The trade carries release-day jump risk in single names, a few dozen positions at a time,
    and is only active in earnings seasons, so it has a low Sharpe per unit of capital and a lot of idiosyncratic
    risk. It also runs against the well-known post-earnings drift, which most quantitative investors trade in the
    opposite direction, and its short side is in recent winners, which are crowded longs.
signal:
  description: 'Universe: LIQ-500 members on day t (point-in-time). Data: total returns (ret_co, ret_oc) from sharadar_sep
    and ea_reaction_day from sec_8k_item202. All quantities use data up to the close of day t; trades happen at
    the open of t+1. (1) Reaction z of a release. For a reaction session R of stock j (ea_reaction_day = 1 on R),
    its abnormal reaction is the stock''s total return from the close of R-1 to the close of R+1 (two sessions,
    which catches after-close and pre-open releases) minus the equal-weight mean total return of all LIQ-500 members
    over the same two sessions. Divide by sqrt(2) times the standard deviation of the stock''s daily total return
    over the 63 sessions ending at R-2 (at least 40 valid returns, else no z). The z of R is known at the close
    of R+1 and is only used after that. (2) Last release. R_last(j, t) is the most recent reaction session of j
    with R_last + 1 <= t. The stock is eligible on t only if t - R_last is between 40 and 110 sessions (the last
    release was last quarter and the current quarter''s release has not happened yet; any ea_reaction_day = 1 in
    the 39 sessions before t makes it ineligible). (3) Predicted next release. Take the reaction sessions of j that
    lie between 230 and 290 sessions before t (last year''s releases). For each such R_old, the predicted date is
    the first XNYS session on or after R_old + 364 calendar days (same weekday one year later). Stock j has an event
    on t if one of these predicted dates is exactly lead_sessions sessions after t. If ea_reaction_day of j is NaN
    on any session needed (before the firm''s first EDGAR filing), there is no event. (4) Side. If z(R_last) >=
    z_min the event side is -1 (short); if z(R_last) <= -z_min the side is +1 (long); otherwise no event. (5) Book.
    Each event opens a slot of fixed weight 0.04 times its side at the open of t+1 and holds it for 5 sessions (closed
    at the open of t+6). Overlapping slots of the same stock do not stack (a stock holds at most one slot; a new
    event of a stock already in a slot is ignored). If opening the day''s new slots would take gross above 1.0,
    new slots are opened in order of |z(R_last)|, largest first, until gross would exceed 1.0; the rest are skipped
    (existing slots are never scaled down). No hedge basket: long and short slots net each other; the rest of the
    capital is cash. A stock that leaves the universe or stops trading closes its slot at the next tradable open
    (delisting returns as the engine applies them). Decisions are taken every session; there is no other rebalancing.'
  params:
    lead_sessions:
      grid:
      - 1
      - 2
      - 3
      value: 2
    z_min:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: After the close of day t, stock j (a LIQ-500 member) has its predicted next earnings release (last year's
    Item 2.02 reaction session + 364 calendar days, first XNYS session on or after) exactly lead_sessions sessions
    after t, its most recent release reaction was 40 to 110 sessions before t, and the standardized two-session
    abnormal reaction of that most recent release is at least +z_min (side -1, expected to underperform) or at most
    -z_min (side +1, expected to outperform).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
