falsification_criteria:
- 'Mechanism: the 60-session side-adjusted abnormal return of the R&D-increase events is not above the 95th percentile
  of the time-shifted placebos, or gross per event does not exceed the round-trip cost.'
- 'Mechanism: the 60-session abnormal return is negative in the latest third of dev (decay or regime, K-0060), even
  if the pooled test passes.'
- 'Mechanism shape: if the 5-session abnormal return is larger than the 60-session one (a quick repricing that then
  fades), the slow-underreaction story is wrong even if the pooled number passes.'
- 'Strategy: net Sharpe on dev below SPY total return Sharpe + 0.10, or the one-sided 75 % bootstrap bound of the
  Sharpe difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (growth_min 0.05 / 0.20, hold_months 6 / 18) beat SPY, or one third
  of dev carries more than 60 % of the log return.'
- 'Publication decay: excess Sharpe after 2004 below half of the excess before it (G2 publication check).'
notes: 'Brief: long horizon (6-24 months), US single stocks, cross-sectional, with a mechanism test. The book holds
  each event stock for 12 months (6-18 in the grid); the mechanism test uses the longest allowed horizon (60 sessions)
  because the claim is slow underreaction, so the event study sees only the first quarter of the claimed drift.
  New family: no card or prior study used R&D data; the closest lab work is H-0032 (accruals/profitability/asset-growth
  composite inside a 5-session earnings window), a different mechanism (anomaly resolution at news) and horizon;
  its lesson asked for slow, low-turnover tilts rather than window books, which this is. Study 11 (LightGBM on fundamentals)
  used SF1 broadly but not this conditional event. Why this event and not R&D intensity as a style: the time-shifted
  placebo keeps the same stocks (K-0025), so any generic premium of R&D-heavy names is netted out and the test asks
  whether the timing of the increase matters, which is the underreaction claim. Condition (d) removes stocks whose
  R&D grows only because the firm grows; condition (e) prevents quarterly re-firing of one increase. Expected numbers
  (K-0064, K-0071): roughly 120-180 LIQ-500 members carry R&D of at least 5 % of assets; perhaps a third to a half
  qualify in a given year, so about 50-80 events per year, about 1 000-1 500 events over 1999-2020 on several hundred
  distinct filing dates (filings cluster in seasons but spread across days). Round trip in LIQ-500 is about 6-12
  bps; the placebo bar at a 60-session horizon has sat several times above cost (K-0071), plausibly 50-80 bps. The
  literature effect (several percent per year in broad samples) would give roughly 0.5-1.5 % over 60 sessions, probably
  less in large caps after publication, so the pooled test is close to a coin flip unless the effect is at the upper
  end. Book: always invested once events exist (about 50-80 names), turnover about once a year per name, so costs
  are negligible; the strategy risk is that an equal-weight, technology- and health-care-heavy book is a high-beta
  growth tilt against cap-weighted SPY, which can cost more Sharpe in growth drawdowns than the effect earns; drawdown
  may approach the 1.5x limit. Engine rule (K-0032, K-0051): a stock leaving the LIQ-500 mid-hold is sold, not held
  to term. Approximation: the 252-session lag of the trailing figure stands in for the same fiscal quarter a year
  earlier; filing-date jitter shifts it by days, not quarters. No forward data for stocks: at most G4.'
