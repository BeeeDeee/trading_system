id: H-0059
version: 1
title: R&D-increase underreaction - LIQ-500 long-only, hold for 12 months stocks whose trailing R&D spending and
  R&D intensity just rose sharply, monthly rebalance
author_agent: scout
family: rd-investment-underreaction
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Earnings-fixated holders who sell or underweight a stock when an R&D step-up depresses current
    earnings and margins: value and quality screens on P/E or ROE, earnings-momentum and revision models, managers
    with short evaluation horizons. They supply the shares at a price that ignores part of the capitalized value
    of the new R&D.'
  why: US GAAP expenses R&D immediately, so a firm that steps up its R&D budget reports lower earnings and margins
    now while the asset it builds pays off over several years. Investors and analysts who anchor on reported earnings
    (P/E screens, earnings-revision models, margin-based quality screens) treat the step-up as a cost rather than
    an investment and price the future benefit slowly. Eberhart, Maxwell and Siddique (2004) find significantly
    positive long-run abnormal returns and abnormal operating performance after unexpected, economically significant
    R&D increases, i.e. the market under-reacts to the increase; Chan, Lakonishok and Sougiannis (2001) and Lev
    and Sougiannis (1996) document the same under-valuation of expensed R&D. The information arrives at a known,
    point-in-time moment (the filing that shows the higher trailing R&D) and is resolved slowly as the extra R&D
    turns into sales and earnings over the following quarters, which is why the claimed horizon is months to a year,
    not days.
  why_not_arbitraged: The payoff is slow (quarters to years), uncertain and idiosyncratic, so arbitrage capital
    faces long holding periods and tracking error against benchmarks; the stocks concerned are R&D-heavy growth
    names with high volatility and sector concentration (technology, health care), which mandate and risk limits
    penalize; and recognizing which R&D increases are value-creating requires patient fundamental judgment that
    does not scale.
signal:
  description: 'Inputs: sharadar_sep daily total returns and tradable flag for the point-in-time LIQ-500; attached
    sharadar_sf1 fields sf1_art_rnd (trailing-twelve-month R&D expense, as reported) and sf1_art_assets (total assets,
    as reported), both usable from the session after the SEC filing (loader rule). EVENT (computed after the close
    of every session t for every stock j that is a LIQ-500 member and tradable at t): a "new filing" is a session
    where sf1_art_rnd or sf1_art_assets of j differs from its value on session t-1 (NaN to number counts). On such
    a session let R0 = sf1_art_rnd at t, A0 = sf1_art_assets at t, R1 = sf1_art_rnd at session t-252, A1 = sf1_art_assets
    at session t-252. The event fires when all of: (a) R0, A0, R1, A1 are finite and R1 > 0, A0 > 0, A1 > 0; (b)
    R&D intensity R0/A0 >= 0.05 (fixed, economically significant R&D); (c) R&D growth R0/R1 - 1 >= growth_min (parameter);
    (d) intensity growth (R0/A0) / (R1/A1) - 1 >= 0.05 (fixed: R&D grows faster than the balance sheet, so plain
    size growth does not qualify); (e) no event for j in the previous 252 sessions (at most one event per stock
    and year, so the quarterly roll of the trailing figure does not re-fire the same increase). BOOK (long-only,
    monthly): after the close of the last session of each calendar month, the active set is every stock with an
    event in the last hold_months x 21 sessions (including that month-end) that is a LIQ-500 member and tradable
    at that close. Target weights: equal weight 1/max(N, 20) per active stock, where N is the size of the active
    set (so no stock exceeds 5 %); the remainder, if N < 20, is cash. Trades at the open of the next session. Between
    rebalances weights drift with prices; a stock that leaves the LIQ-500 or stops being tradable is sold at the
    next open after the first close at which it is out (engine rule), its weight stays in cash until the next month-end.
    A delisting is taken at the dataset''s terminal return. Stocks with missing SF1 values never fire; nothing is
    filled or carried beyond the loader''s 400-day staleness rule. Events start once 252 sessions of SF1 history
    exist, so the book holds cash until the first event.'
  params:
    growth_min:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
    hold_months:
      grid:
      - 6
      - 12
      - 18
      value: 12
  timeframes:
  - 1d
  - 1mo
  - 1q
  - 1y
mechanism_test:
  event: A LIQ-500 stock's new SEC filing (session after which sf1_art_rnd or sf1_art_assets changes) shows trailing-twelve-month
    R&D at least 5 % of total assets, at least growth_min (10 %) above the trailing R&D of 252 sessions earlier,
    and R&D-to-assets at least 5 % above its level 252 sessions earlier, with no such event for the stock in the
    previous 252 sessions. Side +1 (the stock should outperform the other LIQ-500 members over the following months).
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
