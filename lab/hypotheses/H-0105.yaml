# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0105
version: 1
title: Overnight news without a filing, drift or fade, learned - LIQ-500 market-neutral 5-day slots on peer-residual
  overnight gaps with no 8-K, LightGBM side; mechanism = gbm-vs-ridge disagreement
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'On the drift side: holders and liquidity providers who anchor on the pre-news price and underreact
    to news that has no filing behind it (no 8-K, no EDGAR alert, less systematic coverage). On the fade side: retail
    and attention traders who buy (sell) at the open on visibility rather than information, as in Berkman et al.
    (2012). They pay the overnight premium that later reverses.'
  why: 'Firm-specific news that is not an SEC filing (analyst rating and target changes, media reports, third-party
    or regulator decisions) mostly reaches large US stocks outside trading hours, so it shows up as an overnight
    gap. Chan (2003) finds that large moves with a news headline drift on in the same direction, while large moves
    without news reverse. Womack (1996) finds drift after analyst recommendation changes, and it is larger after
    downgrades. The lab has tested filed news (H-0034, flat: the filing session can come days after the press release)
    and earnings news (drift, K-0046), but never news timed by the overnight gap itself. A gap is not always news,
    though. Berkman et al. (2012) show that attention-driven retail buying at the open inflates overnight returns,
    which then reverse. The claim is that the same gap is news (and drifts) or attention noise (and fades) depending
    on unsigned conditions that a taker can see at the close of the gap day: did the intraday session confirm or
    undo the gap, how heavy was the volume, how volatile and how covered is the name, and how far is the gap day
    from the last earnings release. Analyst actions cluster right after releases; mid-quarter gaps are more often
    other news. The gap''s direction is sign(gap); whether it continues depends on those conditioners.'
  why_not_arbitraged: The drift is a few tens of basis points on single names, spread over days, mixed with gaps
    that reverse. Telling the two apart needs a conditional model, and the trade is a daily taker book with five-day
    hold risk on volatile names just after a jump. Capacity per event is small and the edge is only a fraction of
    the name's weekly volatility.
signal:
  description: 'All inputs are known at the close of session t; trades happen at the open of t+1. Universe: point-in-time
    LIQ-500 members of t. (1) Peers: on the first session of each month, for each member j, the 10 other members
    whose daily close-to-close total returns correlate most with j''s over the trailing 252 sessions (at least 200
    common valid sessions; otherwise j has no peers and no candidate rows that month). (2) Peer-residual components
    on session t: g_j(t) = ret_co_j(t) - mean over peers of ret_co(t) (overnight, close t-1 to open t). i_j(t) =
    ret_oc_j(t) - mean over peers of ret_oc(t) (intraday, open to close of t). zg = g / std(g over t-63..t-1) and
    zi = i / std(i over t-63..t-1), at least 50 valid values each. (3) Candidate row (j, t): j is a member at t,
    |zg| >= gap_z, ea_reaction_day = 0 (not NaN) on every session t-5..t, and nonearn_8k_reaction_day = 0 (not NaN)
    on t-1 and t. A filing accepted after the close of t-1 is flagged on t, so this removes any 8-K filed since
    the close of t-2. Rows with a NaN flag or a missing feature are not candidates. Before the 8-K data start (2004-08),
    no row is a candidate. (4) Features on every member row (z-scored across the members of the date by the framework
    helper): zg; zi; log(dollar_volume_t / median dollar_volume of t-63..t-1); sum of peer-residual close-to-close
    returns over t-21..t-1; 63-session realized volatility of daily total returns; sp500_member at t (0/1); sessions
    since the last ea_reaction_day, capped at 63. (5) Model: lab.framework.ml.walk_forward with training rows =
    candidate rows only (row mask). Label: the framework label, total return from the open of t+1 to the open of
    t+6, ranked across the members of t. horizon_days 5, framework purge, expanding window, refit every 63 rows.
    The first scores come once the framework''s minimum training sample of candidate rows is reached. gbm: n_estimators
    = param, num_leaves 15, learning_rate 0.05, min_child_samples 200, subsample 0.8, colsample 0.8, framework seed.
    In the same call and on the same rows, features and schedule, a ridge (alpha 1.0) is fitted as the linear control.
    It is used only by diagnostic.py. (6) Side of a model m on a scored candidate row: +1 if its score is above
    the median of model m''s scores on all scored candidate rows of sessions t-251..t, else -1. (7) Book (score_weights
    / only_on): each scored candidate of t opens a slot of weight 0.03 x gbm side at the open of t+1. The slot is
    held 5 sessions and closed at the open of t+6, or at the first decision row where the stock is no longer a member.
    The net of all open slots is offset every day by an equal-weight opposite position across the 100 most liquid
    members (by liq_rank) that hold no slot, so the book is dollar-neutral. If slot gross plus hedge gross exceeds
    1.0, every weight is scaled down in proportion. With no open slots the book is flat (cash).'
  params:
    gap_z:
      grid:
      - 2.0
      - 2.5
      - 3.0
      value: 2.5
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
  timeframes:
  - 1d
mechanism_test:
  event: A scored candidate row (a stock with a large peer-residual overnight gap on session t and no 8-K or earnings
    flag around it) on which the gbm and the ridge control (same features, rows, label and refit schedule) take
    opposite sides, each side defined against that model's trailing 252-session median score on candidate rows.
    side = the gbm's side (+1 if the gbm puts the row above its median, -1 below).
  horizons:
  - 1
  - 2
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'zg: signed peer-residual overnight gap of session t (ret_co minus the mean of the 10 most correlated members),
    divided by its own 63-session std. Size and direction of news that arrived outside trading hours.'
  - 'zi: signed peer-residual intraday return (ret_oc) of the same session, own 63-session std. Did the trading
    day confirm the gap (information) or undo it (attention-driven open, Berkman et al. 2012)?'
  - 'Abnormal dollar volume of session t: log of dollar_volume over its median of t-63..t-1. Broad participation
    versus a thin print; unsigned.'
  - Prior 21-session peer-residual return before the gap (signed). News with or against an existing move; separates
    underreaction from continuation of a running story.
  - 63-session realized volatility of daily total returns (unsigned). Information uncertainty and limits to arbitrage;
    drift is expected to be larger where valuation is harder.
  - sp500_member at t (0/1, point-in-time extra). Coverage and passive ownership as a speed-of-incorporation proxy;
    unsigned.
  - Sessions since the last ea_reaction_day, capped at 63 (sec_8k_item202). Analyst revisions cluster just after
    releases; mid-quarter gaps are more often other news. Unsigned.
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The prediction should be sign(gap) times a response whose size and sign depend on unsigned conditions:
    volume, volatility, index membership, time since the release, and whether the intraday move agreed with the
    gap. A confirmed heavy-volume gap should continue and an undone thin gap should fade, and bad-news gaps should
    drift more than good-news gaps (Womack 1996). A ridge on the same features can only add main effects: an unsigned
    feature moves up-gaps and down-gaps in the same direction, so it cannot flip or scale the response to the gap.
    Ridge collapses to ''continuation or fade proportional to zg and zi'' for every row. A shallow tree ensemble
    can split on the sign of zg first and on the conditioners next. Who pays differs by branch: underreacting holders
    where the gap is news, attention buyers at the open where it is not. If ridge does as well, the claim is wrong
    and the card is a linear news-gap card that should be filed as such.'
