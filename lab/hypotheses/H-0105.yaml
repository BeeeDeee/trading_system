falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of the gbm-vs-ridge disagreement events is not above the
  95th percentile of the time-shifted placebos, or the gross per event is below the round-trip cost. Either way
  the conditional (nonlinear) reading of overnight non-filed news is not supported, and ridge on the same features
  is as good.'
- 'Mechanism: the disagreement average is negative in the latest third of dev (K-0060), even if the pooled average
  passes.'
- 'Mechanism shape: the 1-session average is at least as large as the 5-session one (a move used up at the next
  open, not news processing), or the 10-session average is more than twice the 5-session one with the 1- and 2-session
  averages at or below zero (slow style drift of gap names, not a reaction to the news).'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbors of gap_z 2.5 and n_estimators 100 beat the benchmark, or the strategy
  fails at doubled costs.'
- 'Linear control: if a ridge-side book (same construction, ridge sides instead of gbm) can be reported, a ridge
  Sharpe at or above the gbm Sharpe refutes the card.'
- 'Design tripwire (report, not a trial verdict): fewer than 1500 scored candidate rows or fewer than 300 disagreement
  events in dev means the event definition is too narrow and the result says nothing about the mechanism.'
notes: 'FAMILY. The mechanism is underreaction to firm news. The lab''s precedent for non-earnings news drift (H-0034,
  filed 8-K news) sits in post-earnings-announcement-drift, so this card is filed there too and its trial counts
  with H-0024, H-0028, H-0031, H-0033, H-0034, H-0095, H-0100, H-0101, H-0102 and H-0104. A new family name would
  escape that count. HOW IT DIFFERS from the cards it is closest to. H-0034 dated news by the 8-K filing session,
  which can trail the press release by days; this card dates news by the overnight gap and keeps only rows with
  NO filing, so the two event sets are disjoint by construction. H-0094 scored all rows on close-to-close own moves
  with earnings flags and had no overnight/intraday split. H-0100 used earnings-release rows only. This card excludes
  every earnings window. H-0103 (pending) is a weekly all-stock path-shape score for metaorder reversal; this card
  trains only on news-gap event rows and claims drift or fade conditional on unsigned conditioners. H-0030 is no-news
  close-to-close reversal. The mechanism test uses the gbm-vs-ridge disagreement design of K-0138, so the linear
  control the lab keeps asking for (K-0135, K-0141) runs inside G1. WHY THESE FEATURES. Every feature comes from
  the papers cited or from lab findings (K-0094 filing-timing caveat, H-0069 open pressure), not from a dev screen.
  No feature or threshold was picked by looking at results. FORECASTS (K-0120, K-0140: earlier Scout forecasts ran
  2-4x too high). Candidates: peer-residual overnight gaps of 2.5 own-sigma happen on very roughly 1-3 % of member-days.
  Earnings windows hold a large share of them. After excluding earnings windows and filing sessions, I expect 0.6-1.5
  % of member-days, i.e. 3-7 candidates per session, about 10000-23000 scored candidate rows over about 2007-2020
  (the first two years go to the expanding training window). The gbm and ridge should disagree on 15-35 % of candidates:
  about 1500-8000 events on 1000-2500 dates. Round trip in LIQ-500 after 2001: about 10-12 bps (K-0140). Candidate
  gaps average about 3 %; if a tenth of the gap continues or reverses in the predicted direction, the gross per
  disagreement event is about 20-40 bps. A quarter of that, 5-10 bps, would sit below cost, and the card dies at
  the G1 cost check. That would mean: in large caps, overnight non-filed news carries no conditional drift or fade
  a next-open taker can collect. No follow-up card on the same events (no other threshold, hold or learner) should
  then be filed. BOOK ARITHMETIC (K-0098, K-0104). Weight 0.03 per slot, 5-session hold, 3-7 new slots per session:
  15-35 open slots, slot gross 0.45-1.0 plus a small hedge, mean exposure about 0.5-0.9. Busy news days are scaled
  down by the gross cap. At about 1250 candidates a year, a net gain of 10 bps per slot gives about 3.5-4 % a year
  at about 5 % volatility (Sharpe about 0.7). A gross of only 1.2x cost gives Sharpe about 0.15. So the book needs
  a gross of roughly twice the cost to clear the 0.5 floor, and about three times the cost to survive doubled costs
  in G2. I state this up front: a mechanism pass with gross near cost is not a strategy (K-0064). KNOWN LIMITS.
  (a) The hit rate of ''third-party news'' among non-filed gaps cannot be measured with loadable data. Some gaps
  are firm press releases whose 8-K arrives on t+1..t+4, and the claim is about overnight-timed, not-yet-filed gaps
  whatever their source. (b) The 8-K datasets miss some CIKs and lean to survivors (K-0035), so some earnings gaps
  may leak into the candidate set. (c) G1 compares raw returns with unmarked peers (K-0074). Both sides are marked
  in roughly equal numbers, so the placebo mean should be near zero. A beta gap between the gbm''s long and short
  calls is not neutralized in the event study. (d) Per K-0134, no column or row subset may use end-of-view information.
  Run walk_forward on all columns with per-row membership and candidate masks; peers and medians are trailing only.
  (e) Liquid gap names may face a slightly worse cost tier than the average member.'
