references:
- cite: 'Chan, W. S. (2003) Stock price reaction to news and no-news: drift and reversal after headlines, Journal
    of Financial Economics'
  year: 2003
- cite: Womack, K. L. (1996) Do brokerage analysts' recommendations have investment value?, Journal of Finance
  year: 1996
- cite: 'Berkman, H., Koch, P. D., Tuttle, L., Zhang, Y. J. (2012) Paying attention: overnight returns and the hidden
