- dataset: exchange_closures_mena_1d
  description: 'NEW DATASET (Archivist): scheduled session calendar of the Tel Aviv Stock Exchange (MIC XTAE) and
    the Saudi Exchange / Tadawul (MIC XSAU) aligned to XNYS sessions, built exactly like exchange_holidays_1d from
    the open-source exchange_calendars library (Apache-2.0, github.com/gerrymanoim/exchange_calendars; both MICs
    are in its calendar list), free and public. Keys per XNYS session d and exchange X: X.closed_next = 1 if X has
    no regular session on any local calendar date strictly after d up to and including the date of the next XNYS
    session, else 0; X.anchored = 1 if X had a regular session on any local date strictly after the previous XNYS
    session''s date up to and including d, else 0. Unlike exchange_holidays_1d, the exchange''s own weekmask must
    be used: Sunday sessions count as sessions and Friday/Saturday are non-sessions for both exchanges in 2008-2020
    (Tadawul moved its weekend to Friday-Saturday in mid-2013, before KSA lists; TASE moved to a Monday-Friday week
    in January 2026, which the series must reflect if the library encodes it). Rows on XNYS sessions from 2008-01-02
    to the latest available date, clock us_close (the calendar is published in advance). Signal only, not tradable.'
