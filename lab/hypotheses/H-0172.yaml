mechanism:
  counterparty: US-hours traders who use these ETFs as the only liquid way to express a view on Israel or Saudi
    Arabia (tactical EM and frontier allocators, macro hedgers trading on US-market or oil news) and the market
    makers who lean against their flow without a hedge; they pay a price concession that the home market's reopening
    removes.
  why: 'A US-listed country ETF whose home exchange is closed has no price anchor: authorized participants cannot
    create or redeem against live prices of the basket, market makers quote it from what the US session is doing,
    and US-hours order flow moves the wrapper by more than the home market later confirms. Levy and Lieberman (2013)
    show that country ETFs overreact to US market returns when their foreign markets are closed, and the overreaction
    reverses once the home market trades again. For ordinary markets that reversal happens at the home open before
    the next US open, so it sits in the overnight gap and a next-open taker cannot capture it (the reason the lab
    does not trade plain country-ETF overreaction). The Tel Aviv and Saudi exchanges trade Sunday to Thursday: at
    the US close of a Thursday the home market stays shut through the whole next US session (Friday) and reopens
    on Sunday, after a Friday-open entry and before the Monday US open. So the correction of Thursday''s unanchored
    US-hours move falls inside a position held from the Friday open, every week, not only on rare holidays. This
    is the closed-underlying mechanism that passed the lab''s mechanism test in H-0133 (Asia-Pacific holiday closures),
    moved to markets whose weekly calendar produces such a closure about fifty times a year. Cross-asset reading:
    the signal is the US-session move (driven by the US equity market and US investors), the traded exposure is
    a foreign equity market seen through its wrapper.'
  why_not_arbitraged: 'While the home exchange is shut there is no instrument to hedge the basket (no Friday trading
    of TA-35 or Tadawul futures, creation and redemption priced off stale NAV), the position carries two days of
    weekend gap risk, the ETFs are small and spreads are wide, shorting carries borrow risk, and capacity is a few
    million dollars: too small and too risky for arbitrage desks, and invisible to anyone who looks only at close-to-close
    returns of normal weekdays.'
signal:
  description: 'Inputs: sharadar_sfp ret_oc, ret_co and dollar_volume of the universe; dataset exchange_closures_mena_1d
    keys XTAE.closed_next, XTAE.anchored, XSAU.closed_next, XSAU.anchored (definitions in data_requirements). Home
    map (fixed by the ETF''s mandate): EIS and ISRA -> XTAE; KSA and FLSA -> XSAU. The other fourteen country ETFs
    have no home key: they are unmarked peers for the mechanism test and are never traded. Decision after the close
    of every XNYS session d, using data up to that close. For each mapped ETF j with a bar on d: z_j = ret_oc_j(d)
    / standard deviation of ret_oc_j over sessions d-63 .. d-1 (at least 40 valid values, otherwise not eligible);
    j is eligible if closed_next(home_j, d) == 1, its median dollar_volume over sessions d-63 .. d-1 is at least
    1,000,000 USD, and |z_j| >= z_entry. If at least one ETF is eligible, open a new book: w_j = -sign(z_j) * |z_j|
    / sum of |z_k| over the eligible k (gross exposure 1.0, both signs, no hedge), traded at the open of the next
    XNYS session d+1; an eligible ETF with no tradable bar at d+1 is dropped and the others are re-normalised to
    gross 1.0. Exit: the book is held until the close of the first XNYS session s > d on which anchored(home, s)
    == 1 for the ETF''s home exchange (the home exchange has traded since the previous XNYS session; in a normal
    week s is the Monday after the event Thursday), and that ETF''s weight is set to zero at the open of s+1 (normally
    Tuesday). If a new event date occurs while a book is open, the whole book is replaced by the new event''s weights
    at the next open (one book at a time). Missing calendar value, missing ret_oc on d, or an ETF not yet listed:
    not eligible. Cash (T-bill) otherwise. In a normal week the book is entered at the Friday open and closed at
    the Tuesday open, so it is invested on Friday and Monday rows; expected mean exposure about 0.25-0.35.'
  params:
    z_entry:
      grid:
      - 0.25
      - 0.5
      - 1.0
      value: 0.5
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of XNYS session d, a mapped ETF (EIS, ISRA -> XTAE; KSA, FLSA -> XSAU) whose home exchange
    has closed_next == 1 at d (it will not trade before the end of the next US session), with 63-day median dollar
    volume >= 1,000,000 USD and |z| >= z_entry, where z = ret_oc(d) / std of ret_oc over the prior 63 sessions.
    side = -sign(ret_oc(d)) (fade the unanchored US-hours move). The fourteen other country ETFs are never marked
    and serve as peers. In a normal week the event is the Thursday close and the primary horizon (two sessions:
    Friday open to Monday close) contains the Sunday home reopening; time-shifted placebos put the same ETFs on
    ordinary days, whose correction already happened in the overnight gap, so the placebo is the ordinary-day control.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 2
