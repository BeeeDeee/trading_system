falsification_criteria:
- 'Mechanism (G1): the side-adjusted abnormal return at the 2-session horizon is not above the 95th percentile of
  the time-shifted placebos, or gross per event is below the round-trip cost, or fewer than 2 of 3 dev thirds have
  the predicted sign.'
- 'Mechanism shape: the 1-session average (Friday session only, home exchange still shut) is at least as large as
  the 2-session average (which adds the weekend and the home reopening); then the gain is not tied to the reopening
  and the closed-underlying story is wrong.'
- 'Mechanism decay: the latest third of dev is wrong-signed (K-0060), declared in advance as a kill condition.'
- 'Strategy (G1): net Sharpe on dev below 0.5, or below T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  against T-bills not above zero.'
- 'Robustness (G2): fewer than 75 % of the z_entry neighbours (0.25, 1.0) beat the T-bill bar, or net Sharpe at
  doubled costs below the T-bill bar.'
- 'Sign: the fade earns less than its mirror (following the Thursday move), i.e. the abnormal return is negative:
  the US-hours move is information the home market confirms (for example oil news for Saudi Arabia), not overreaction.'
notes: 'Brief fit: the brief asks for a short-horizon cross-asset card. The lab has already tested most cross-asset
  short-horizon channels with ETFs, stocks and crypto (lead-lag scan mrel, macro-calendar cards K-0063/K-0070, macro-shock
  diffusion into stocks, VIX/real-yield into crypto, CFTC, implied vol, rebalancing flows), and almost all failed
  at the mechanism test; I found no fresh cross-asset predictor with a counterparty that clears costs on paper.
  The closest fit with a real mechanism is cross-market: the signal is the US-session move (US investors and the
  US equity market) and the trade is a foreign equity market through its wrapper, when the arbitrage link to the
  home market is cut. Relation to earlier cards: H-0133 (Asia-Pacific holiday closures, same closed_next rule) passed
  the mechanism test and failed as a book; H-0161 (down-moves only, as a tilt) was a near miss with too few closure
  dates, and its lesson asks for ''many more closure dates or a different wrapper''. This card is that follow-up:
  new exchanges, new events (about 50 closure Thursdays a year per market instead of a few holidays), none of them
  used by H-0133 or H-0161; it keeps the family name etf-premium-arbitrage so its trials count there. It is not
  the plain ordinary-day overnight overreaction the H-0133 lesson forbids: the event requires the home exchange
  to stay shut through the next US session, and the time-shifted placebo is exactly the ordinary-day control. Book
  design takes the H-0133 lessons: no peer hedge (it doubled cost and lost on its own), both sides marked because
  the side split was never established (choosing one would be a dev-selected sign), one parameter. Why the data
  request is essential: the event is defined by whether the home exchange trades before the next US session; a hard-coded
  Sunday-Thursday rule would need date literals for the weekend changes (Tadawul 2013, TASE 2026), which G0 forbids,
  and would miss Israeli and Saudi holiday closures. exchange_calendars is the same source the Archivist used for
  exchange_holidays_1d. Expected numbers (forecast, not data): EIS from 2008, ISRA from 2013, KSA from 2015-09,
  FLSA from 2018; roughly 800-900 events on 500-650 dates in dev with z_entry 0.5 (ISRA and FLSA often fail the
  liquidity floor); typical |US-hours move| about 1 %; if a quarter of it reverses at the reopening, gross is about
  25 bps per event against a round trip of roughly 10-20 bps in EIS and KSA. Pessimistic case (a tenth reverses):
  gross below cost, death at the cost ratio, which would still say the overreaction is too small to harvest. Placebo
  bar forecast about 10-15 bps (many independent weekly dates). Risks: Gulf and Israeli ETF moves in US hours may
  carry real information (oil, regional news) that the home market confirms, which would give the wrong sign (declared
  kill); Israeli dual-listed stocks trade in New York on Fridays and partly anchor EIS; borrow cost of short ETF
  positions is not modelled; a liquidity floor of 1,000,000 USD and the 63-session volatility window are fixed round
  constants, not tuned. Holdout (2021 on) includes the TASE switch to a Monday-Friday week in 2026, after which
  Israel stops producing weekly events; the Saudi leg continues. ETFs have no forward source, so G4 is the ceiling.
  Descriptive request for the gate output if possible: averages by home exchange and by side.'
