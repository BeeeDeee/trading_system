# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0049
version: 1
title: Flushed vs unflushed crashes in crypto perps - after a large bottom-tercile daily drop, long coins whose
  perp funding collapsed, short coins whose funding held, BTC/ETH hedged, hold 3 days
author_agent: scout
family: short-term-reversal
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Over-leveraged retail perp longs whose positions are liquidated at market by the exchange engine,
    regardless of price (forced sellers), and dip-buyers who keep leveraged longs open into an informational decline
    (they sell later, when they are liquidated).
  why: 'A large one-day crash in a liquid coin comes from one of two sources, and the perpetual-futures funding
    market tells them apart. (1) Forced deleveraging: leveraged perp longs get liquidated and stop-run, perps trade
    below the spot index during the day, so the day''s funding falls to a new weekly low and turns negative. The
    selling is non-informational and mechanically forced, so the price is pushed below value and partly recovers
    over the next days as liquidity providers are paid for absorbing it (Campbell, Grossman and Wang 1993: non-informational,
    liquidity-driven moves reverse, informational ones do not; Brunnermeier and Pedersen 2009: margin-driven liquidity
    spirals overshoot and then revert). (2) A crash during which funding did not fall: perp longs were not flushed
    (they held or added into the decline) and the selling came from spot or news (unlocks, delistings, hacks, project
    news). That move is informational, and the leverage that is still open is an overhang that gets liquidated later,
    so the coin should keep underperforming. The claim is the contrast: among same-day relative losers of similar
    size, flushed coins outperform unflushed ones over the next 1-5 days. Signal market: the funding (leverage-financing)
    market of the perps; traded market: the perp price.'
  why_not_arbitraged: Absorbing a liquidation cascade means buying a falling, high-volatility asset while the venue's
    risk engine is still selling, which needs balance sheet exactly when market makers widen quotes and cut inventory
    (crypto market makers are thinly capitalised and themselves face margin calls). The rebound is uncertain in
    timing and the next leg of a cascade can go deeper, so capital that could take the trade is scarce at the moment.
    The short leg is an alt-perp short with squeeze risk. Capacity in alt perps is small, so large arbitrageurs
    ignore it.
signal:
  description: 'Data: binance_perp_1d, point-in-time universe = top 30 perps by trailing 30-day quote volume (crypto_top_n,
    n = 30). Daily close = 00:00 UTC. Decision after the close of day t using data up to that close; orders fill
    at the open of day t+1. Notation per perp j: r(j,t) = close-to-close return of day t; sigma(j,t) = standard
    deviation of daily returns over days t-30..t-1 (needs 30 valid days, else j is not eligible that day); f(j,t)
    = extras funding of day t (daily sum of funding rates, known after the close of t). Event candidates on day
    t: eligible perps other than BTCUSDT.P and ETHUSDT.P (the hedge instruments) with r(j,t) at or below the 33.3rd
    percentile of r(.,t) across the eligible universe that day AND r(j,t) <= -k_sigma * sigma(j,t). Classification
    (needs f on days t-7..t; missing funding = no event): FLUSH (side +1) if f(j,t) < 0 and f(j,t) < min(f(j,t-7..t-1)),
    i.e. funding turned negative and fell to a new 7-day low on the crash day. UNFLUSHED (side -1) if f(j,t) >=
    median(f(j,t-7..t-1)), i.e. funding did not fall at all on the crash day (strict comparisons, so coins pinned
    at the default rate are never FLUSH). Candidates in neither class are not events. Book: each event opens a slot
    at the open of t+1 with weight +0.10 (FLUSH) or -0.10 (UNFLUSHED) in that perp, held for hold_days days and
    closed at the open of day t+1+hold_days. A perp that has an open slot does not open a second one; a new event
    on a perp with an open slot is ignored. If the sum of absolute slot weights exceeds 0.5, all slot weights are
    scaled down proportionally to sum to 0.5. Hedge: N = sum of signed slot weights; hold -N/2 in BTCUSDT.P and
    -N/2 in ETHUSDT.P, so the book is dollar-neutral and gross <= 1. Weights are recomputed every day (slots expire,
    new slots open, hedge follows N). If a slot''s perp leaves the top-30 universe or stops trading mid-hold, the
    slot is closed at the first decision row where it is outside the universe (no forced hold). Funding is charged/credited
    by the engine as usual. No other filters, no regime gate.'
  params:
    hold_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    k_sigma:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: After the close of day t, a top-30 perp (not BTC or ETH) whose day-t return is in the bottom third of the
    universe and at or below -k_sigma times its own 30-day daily volatility. Side +1 if its day-t funding is negative
    and below its minimum of the previous 7 days (leverage flushed); side -1 if its day-t funding is at or above
    its median of the previous 7 days (leverage not flushed). Abnormal return against the unmarked perps of the
    same date (at least the top two thirds of the universe stay unmarked).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 3
data_requirements:
- dataset: binance_perp_1d
  description: Perp prices and quote volume for the PIT top-30 universe; extras funding (signal, day t) and funding_paid
    (engine).
  fields:
  - ret_co
  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2020-01-01'
  - '2022-12-31'
holding_period:
  rebalance: daily
  typical_days: 3
market_exposure: market_neutral
references:
- cite: Campbell, Grossman, Wang (1993) Trading volume and serial correlation in stock returns, Quarterly Journal
    of Economics
  year: 1993
- cite: Brunnermeier, Pedersen (2009) Market liquidity and funding liquidity, Review of Financial Studies
  year: 2009
falsification_criteria:
- 'Mechanism test: the side-adjusted 3-day abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos, or keeps its sign in fewer than 2 of 3 dev blocks, or gross per event is below the round-trip
  cost.'
- 'Mechanism (decay / persistent-crash kill condition): the side-adjusted 3-day abnormal return is negative in the
  latest third of dev, i.e. flushed coins did not beat unflushed ones in the bear-market block.'
- 'Mechanism shape: the 1-day horizon is negative while only the 10-day horizon is positive (a slow drift, not a
  liquidation rebound).'
- Net Sharpe on dev below 0.5 or below the T-bill benchmark + 0.10, or the one-sided bootstrap bound of the Sharpe
  difference below zero.
- 'Neighbors (k_sigma 1.5 / 2.5, hold_days 2 / 5): fewer than 75 % beat the benchmark, or their median Sharpe is
  below 0.7 of the primary.'
- Net Sharpe at doubled costs does not beat the benchmark, or one dev third carries more than 60 % of the log return.
notes: 'Brief fit: the brief asks for a 1-5 day cross-asset card. The signal comes from the leverage-financing market
  of the perps (funding) and the trade is in the perp price; the cards'' crypto_perp class covers both, so this
  is cross-market rather than cross-asset-class. I chose it over a US ETF / FRED idea on purpose: (1) fills at the
  next open kill cross-time-zone ideas (country ETFs, home-market reopenings), because the home market trades before
  the US open; (2) the owner''s daily lead-lag scan (mrel, 706k tests) killed linear cross-market prediction among
  ETFs, FX, macro and crypto; (3) mixing FRED/ETF signals (holdout 2021) with crypto trades would probably cut crypto
  dev at 2020-12-31 and leave about three years of 2017-2020 crypto; (4) the ICE BofA credit series on FRED appear
  to have only recent history (likely cause of H-0043''s zero events), so I avoid them. Relation to earlier cards:
  this is the event study H-0006 asked for ("after extreme drops, do forward returns differ by falling funding versus
  not?"), filed in H-0006''s family short-term-reversal so the trials count together. Differences from H-0006: both
  sides are marked (flushed long, unflushed short), so generic reversal and the market bounce after stress (K-0056,
  studies 6-7) cancel in the contrast and the placebo mean should be near zero; no BTC trend gate; abnormal return
  against same-date unmarked perps, so a persistent market-wide crash does not drive the result (K-0056 asks how
  a design separates a one-off shock from a persistent crash: here the market-wide part is netted out and the flush/no-flush
  split is the separator). Differences from H-0039 (funding level cross-section): conditioned on a crash day and
  on the change of funding during it; strict comparisons so that perps pinned at the default rate are never classed
  as flushed (H-0039''s tie warning). Differences from H-0035: daily, not 15-minute, and conditioned on the derivatives
  signal, not taker share. Known risks: (a) K-0049: the rebound may be front-loaded and largely gone by the next
  00:00 UTC open, which the 1-day horizon will show; (b) K-0060: the latest third of dev (bear market, serial collapses)
  may be negative; that is a declared kill condition; (c) timing noise: the day-t funding sum covers settlements
  at 00:00, 08:00 and 16:00 UTC of day t, i.e. premiums from 16:00 UTC of t-1 to 16:00 UTC of t, so a crash in the
  last 8 hours of day t can be misclassified as unflushed; this dilutes, it does not look ahead; (d) the flushed
  class may contain the larger drops on average (size confound with plain reversal), which is why both classes must
  already be bottom-tercile 2-sigma losers; (e) both legs can collect funding (negative funding paid to the long,
  positive to the short), which flatters the book slightly; (f) the BTC/ETH hedge leaves alt beta (>1) partly open,
  mostly offset because both sides are traded. Expected size, for the record: if flushed minus unflushed is about
  1.5 % over 3 days, an event earns about 0.75 % gross side-adjusted against a round trip of roughly 25-40 bps on
  the event leg (perp tier), plus the hedge round trip; with a few hundred events a year at 0.10 weight this is
  roughly 15-25 %/y gross and well under half of that net, so the strategy needs the effect at about that size;
  at half of it, the book does not pass the 0.5 Sharpe bar even if the mechanism test passes. Mean gross exposure
  is expected around 0.3-0.5 (events on many but not all days, three-day slots, hedge). Exit on universe exit follows
  K-0051. No date literals; BTCUSDT.P and ETHUSDT.P are named only as hedge instruments and are always in the top-30
  universe.'
