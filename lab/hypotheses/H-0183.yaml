  - '2020-12-31'
holding_period:
  rebalance: monthly
  typical_days: 252
market_exposure: long_only
references:
- cite: Fama, Bliss (1987) The Information in Long-Maturity Forward Rates, American Economic Review
  year: 1987
- cite: 'Campbell, Shiller (1991) Yield Spreads and Interest Rate Movements: A Bird''s Eye View, Review of Economic
    Studies'
  year: 1991
- cite: Fama, French (1989) Business Conditions and Expected Returns on Stocks and Bonds, Journal of Financial Economics
  year: 1989
falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the marked TLT/SHY events does not exceed the 95th
  percentile of the time-shifted placebos, or keeps its sign in fewer than 2 of 3 dev blocks.'
- 'Mechanism: the latest third of dev has a negative side-adjusted abnormal return (expected decay, K-0060) - stated
  as a kill condition even if the pooled test passes.'
- 'Mechanism: the 5-session abnormal return is as large as the 60-session one (that would be a short-lived state
  effect or noise, not a slow term premium).'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (median_months 36/84, cohort_months 6/24) beat the 60/40 benchmark,
  or the book does not beat it at twice the cost.'
- 'Concentration: more than 60 % of the log excess return over the benchmark comes from one third of dev.'
notes: 'Revision 2 (G0 g0_event_peer_set, Builder message 1467, K-0174): LQD added to the universe as a third unmarked
  peer, held at weight 0 by the book. It lists on 2002-07-30 (fact sheet), the same day as TLT, IEF and SHY, so
  SPY, IEF and LQD give three eligible unmarked peers on every event date from the first possible state. I kept
  both legs marked rather than marking only TLT because one leg per date would halve the events (about 160 if the
  FRED view starts at the ETF start, under the 200 minimum) and would let the TLT-minus-peers duration drift into
  the test; with both legs marked it cancels between states. Strategy, signal, parameters, the event definition
  and falsification criteria are otherwise unchanged; no result was looked at. LQD is IG credit (equity correlation
  about 0.25, duration about 8 years), so it is a duration-like peer of the same order as IEF. Original notes: Brief:
  long horizon (6-24 months), US ETFs across asset classes. The idea is a slow, counter-cyclical duration premium
  applied as a tilt inside an always-invested 60/40 core (K-0005, K-0027: no binary switch of the whole book, equity
  weight equals the benchmark''s at every date, so the only bet is duration). Novel in the lab: no card in the registry
  or prior studies uses the curve slope; it is not trend (study 2), volatility timing (H-0003), default-spread timing
  (H-0061) or cross-asset momentum (H-0177, past returns). Family name is new because the mechanism (term premium
  / bond carry) has no existing family. Why the median of its own trailing 5 years rather than a fixed level: the
  slope''s level drifts with monetary regimes, and any fixed threshold would be tuned to history; the trailing median
  is self-calibrating, and steep/flat states then split roughly half and half, so average sleeve duration is about
  (17 + 2)/2 = 9.5 years against IEF''s 7.5, a small unconditional duration lean; the mechanism test marks both
  states, so this lean cancels there, and the strategy gates judge the tilt against the 60/40. T10Y3M rather than
  T10Y2Y: the 3-month bill is the funding rate of the duration position (the carry), and it is not a grid parameter
  to avoid a series choice in G2. Event arithmetic (K-0098, K-0120): 2 marked ETFs per month. If FRED history from
  1998 is delivered, states exist from about 2003-01 to 2020-12: about 215 dates, about 430 events. If it is not,
  states start about 2007-08: about 160 dates, about 320 events; the 84-month neighbor about 136 dates, 272 events.
  Above the 200-event / 30-date minimum in all cases, but events share few independent states: the slope regime
  changes maybe a dozen times in dev, so the placebo cloud will be wide (K-0026, K-0034); a near miss is a cannot-tell.
  Expected gross: on the order of 1 % over 60 sessions per event pair against an ETF round trip of a few bps: cost
  is not the binding check; the placebo bar and the block-sign check are. Beta note (K-0074): TLT has negative equity
  beta and SPY is an unmarked peer; steep states tend to follow recessions, when equities rebound, which biases
  the TLT side-adjusted return in steep states downward, against the claim. Expected book result: the tilt moves
  at most 40 % of the book and only 1/12 of it per month, so the expected excess over the 60/40 is modest; the +0.10
  Sharpe margin is the most likely place it dies, together with sub-period concentration. Mean exposure 1.0, about
  200 monthly rebalances with non-zero turnover. Paper trading is impossible for ETFs (no forward source, K-0014),
  so the card can pass at most G4.'
