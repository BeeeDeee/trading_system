id: H-0183
version: 2
title: Term-premium duration timing on a 60/40 core - bond sleeve in TLT when the 10y-3m Treasury slope is above
  its trailing 5-year median, in SHY when below, 12-month monthly cohorts
author_agent: scout
family: bond-term-premium-timing
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - TLT
  - SHY
  - LQD
  kind: instruments
mechanism:
  counterparty: Holders who demand safety and liquidity at the short end regardless of the premium (money funds,
    banks and reserve managers with preferred short habitats, liability-matching investors forced to the long end
    when the curve is flat), and investors who extrapolate rising rates when the curve steepens and sell duration
    at exactly the moment it is best compensated. They pay the premium to whoever bears duration risk counter-cyclically.
  why: 'The expectations hypothesis fails at the long end: when the Treasury curve is steep, long bonds earn a higher
    excess return over bills over the following year, because the slope measures a time-varying term (duration-risk)
    premium, not only expected rate rises (Fama and Bliss 1987; Campbell and Shiller 1991; Fama and French 1989
    for the business-cycle reading). The slope (10y yield minus 3-month bill) is also the carry of a duration position
    funded at the bill rate. A steep curve relative to its own recent history therefore marks a year in which long
    duration (TLT) should beat short duration (SHY), and a flat curve a year in which it should not. The effect
    is slow (forecast horizon of a year), so it is held in 12-month cohorts and costs are negligible.'
  why_not_arbitraged: 'The premium is compensation for a large systematic risk: a steep curve usually comes in or
    right after recessions, when risk-bearing capacity of dealers and leveraged funds is lowest, and a duration
    bet can lose for many months before the premium is earned (e.g. a steep curve that steepens further). The forecast
    horizon is a year with R-squared well under one half, so the trade is slow, noisy and career-risky for benchmarked
    managers; it is a premium, not a mispricing, and need not disappear.'
signal:
  description: 'Inputs: daily T10Y3M from fred_macro (10-year minus 3-month Treasury constant-maturity spread, percent),
    clock next_morning, so on a decision after the close of session t only values dated strictly before t are used.
    Monthly signal: at the decision after the close of the last XNYS session of each calendar month m, compute x_m
    = mean of the daily T10Y3M values dated in month m and strictly before that last session (missing days skipped).
    Trailing reference: median of the last L monthly values x_{m-L+1..m} (L = median_months, current month included);
    a reference exists only when all L monthly values exist (no partial window; FRED history before the view start
    counts only if the view delivers it). State S_m = +1 (steep) if x_m > median, else -1 (flat). If x_m is missing,
    S_m = S_{m-1}; if no state can be computed yet, the cohort is empty. Book (always fully invested, long only):
    60 % SPY plus a 40 % bond sleeve made of H = cohort_months equal slots of 40 %/H each. The cohort formed at
    month m occupies one slot for the H months that follow: TLT if S_m = +1, SHY if S_m = -1, IEF if the cohort
    is empty (warm-up), so before any state exists the book is exactly the 60/40 SPY/IEF benchmark. Target weights:
    SPY 0.60; TLT 0.40 x (steep slots)/H; SHY 0.40 x (flat slots)/H; IEF 0.40 x (empty slots)/H; LQD 0 always. LQD
    is in the universe only as an unmarked peer for the mechanism test and is never held by the book. Rebalance
    SPY, IEF, TLT and SHY to these targets at the open of the first session of month m+1 (the session after the
    decision); weights drift between monthly rebalances. The book starts when SPY, IEF, TLT and SHY all have prices
    (TLT, IEF and SHY list on 2002-07-30; before that no position is taken). No other instrument is traded; gross
    is 1.0, no shorts, no leverage. Missing ETF bar on a rebalance day: keep the old weight of that ETF until its
    next bar.'
  params:
    cohort_months:
      grid:
      - 6
      - 12
      - 24
      value: 12
    median_months:
      grid:
      - 36
      - 60
      - 84
      value: 60
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'At each monthly decision (after the close of the last session of month m) where a state S_m exists: if
    S_m = +1 (10y-3m slope above its trailing median_months median), TLT gets side +1 and SHY side -1; if S_m =
    -1, TLT gets side -1 and SHY side +1. SPY, IEF and LQD are never marked (three unmarked peers, all with prices
    from 2002-07-30, before the first possible state). Both states are marked every month, so the event set is the
    monthly duration bet the strategy makes, and generic duration drift of TLT over SHY cancels between the two
    states.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
