- dataset: fred_macro
  description: 10-year minus 3-month Treasury constant-maturity spread (FRED T10Y3M), signal only, clock next_morning.
    History from 1998 is requested so the 60-month median can exist from about 2003; if the view does not deliver
    history before the ETF start, the first state appears about five years after it.
  fields:
