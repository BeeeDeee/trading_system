falsification_criteria:
- 'Mechanism: the continuation calls (event below) do not beat the 95th percentile of the time-shifted placebos
  at 5 sessions, or their gross abnormal return per event is below the round-trip cost: the asymmetry-dependent
  continuation is absent or untradable in LIQ-500.'
- 'Mechanism: the latest third of the dev period (about 2016-2020) has the wrong sign for the continuation calls
  (decay kill condition, K-0060), even if the pooled test passes.'
- 'Mechanism: the one-session average is negative and the effect only appears at 10 sessions (slow style drift,
  not completion of an informed move).'
- 'Strategy: net Sharpe of the dollar-neutral book below 0.5, or the bootstrap bound of its Sharpe over T-bills
  at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors of num_leaves 15 / top 0.1 beat T-bills with Sharpe >= 0.5, or one
  third of dev carries more than 60 % of the log return.'
- 'Nonlinearity: a ridge (framework ridge, same eligible rows, features, label and schedule) gives a book or a long-short
  entry spread as good as the gbm''s: then the interaction is not what pays and the card is plain reversal.'
- 'Channel (descriptive, if the Builder can report it): continuation calls concentrate in the LOW tercile of the
  asymmetry markers (R&D intensity, earnings informativeness) rather than the high one: the model found something,
  but not the Llorente et al. channel.'
notes: 'Why this is not a retry of H-0094 or H-0108 (same family, counted there on purpose): H-0094 scored all LIQ-500
  rows and its strongest input was the earnings-release flag, i.e. post-earnings drift against no-news reversal;
  this card removes every row with a release in the formation week, so post-earnings drift (a separate family) can
  not drive it, and it adds three information-asymmetry markers no lab card has used as conditioners of the volume-return
  relation (R&D intensity, earnings informativeness from real 8-K dates, earnings-cycle position). H-0108 conditioned
  extreme drops on value/profitability anchors (a rebound-vs-value-trap claim); here both directions are scored
  and the claim is informed continuation, not value anchoring. The mechanism event is the model''s continuation
  calls only, because that is the part no reversal rule (and no ridge on these features) can make, so the event
  study tests the interaction directly. If the model never calls continuation, the event count fails and that is
  itself the answer (no asymmetry regime visible in large caps). Forecast, written before any result (K-0120, K-0098):
  eligible rows per weekly date about 120-160 (about a third of members move at least one weekly sigma, minus release
  weeks); legs of 12-16 names each at top 0.1. Continuation calls maybe a quarter to a half of leg names, mostly
  new each week: about 4000-8000 events on 650-750 dates from about 2007 (8-K history and the first fit need roughly
  two years after the 2005 start; the first G1 block will be thin but not empty, K-0163). Round trip about 11-12
  bps (half-spread tiers 5-6 bps in LIQ-500). Gross per event if the channel exists: 10-30 bps over 5 sessions,
  central 15; the placebo bar with clustered dates should sit near the cost, so a pass needs the upper half of the
  forecast. Book: always invested when at least 20 eligible rows, mean gross exposure about 1.0, about 25-30 entries
  a week, weekly decisions about 750: entry, exposure and decision minimums are not binding. Likeliest deaths, in
  order: gross below cost (K-0152: no conditioner has lifted a one-week large-cap sort above cost); latest-third
  decay; a book Sharpe under the 0.5 floor with a losing short leg even if the mechanism passes (K-0064). Beta caveat
  (K-0074): continuation longs are recent up-movers and shorts recent down-movers on a market-residual basis; up-movers
  in rising markets carry slightly higher beta, so the raw G1 comparison leans in the card''s favour in bull thirds.
  Data: insider filings were considered as an asymmetry marker but left out (start 2008, routine sales dominate
  counts in large caps). No date literals in the strategy; the data period is set at the 8-K dataset start so that
  no feature is blank in the first block.'
