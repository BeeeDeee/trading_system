id: H-0121
version: 1
title: Hedging vs informed volume moves, learned - LIQ-500 dollar-neutral weekly, LightGBM on non-earnings 5-day
  volume moves x information-asymmetry markers, hold 5 days
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'In high-asymmetry stocks: liquidity providers and short-horizon reversal traders who fade a volume
    move that was informed, and are adversely selected (they sell to the informed buyer and keep losing as the price
    completes its move). In low-asymmetry stocks: hedgers and rebalancers who demand immediacy with market orders
    and pay the concession. The same reversal capital serves both, and cannot tell them apart at the moment of the
    trade.'
  why: 'Llorente, Michaely, Saar and Wang (2002), building on Campbell, Grossman and Wang (1993): a large price
    move on high volume is either a liquidity/hedging trade, which market makers absorb at a concession that reverts,
    or a speculative trade on private information, which the price has only partly incorporated and which continues.
    Which of the two dominates depends on how much private information exists about the firm: in low-asymmetry stocks
    volume-accompanied moves revert, in high-asymmetry stocks they continue. The lab has seen both halves separately
    in liquid US stocks (no-news moves revert: H-0030, H-0115; moves on information-rich earnings releases drift:
    H-0028, H-0033) but never a stock-level measure of how informed the trading between releases is. This card excludes
    earnings-release weeks entirely (so it is not post-earnings drift) and lets a small gradient-boosted model learn,
    from the stock''s own information-asymmetry markers (R&D intensity, how much news its past releases revealed,
    how far the stock is into its earnings cycle), when a non-earnings volume move should be followed and when faded.
    The tested claim is the continuation half: the model''s continuation calls on non-earnings volume moves earn
    a positive abnormal return, which a plain reversal rule cannot produce.'
  why_not_arbitraged: Telling informed from uninformed flow is exactly the market maker's problem; a stock-level
    asymmetry prior is slow-moving and noisy, the edge per position is small next to taker costs, both legs carry
    idiosyncratic risk, and reversal capital is a scarce, crowded resource. The effect is published (2002), so decay
    is expected and is a stated kill condition.
signal:
  description: 'Data per stock j and session t, all known after the close of t. r = (1 + ret_co)(1 + ret_oc) - 1
    (close-to-close total return); e[t,j] = r[t,j] minus the equal-weight mean r of the LIQ-500 members of t (residual
    return); sigma[t,j] = standard deviation of e over the last 63 sessions (at least 40 valid). Release sessions:
    sessions with ea_reaction_day == 1 (sec_8k_item202). Features (each z-scored across the eligible rows of the
    date by the framework helper): F1 standardized 5-day move = sum of e over t-4..t divided by (sigma[t-5,j] *
    sqrt(5)); F2 abnormal dollar volume = log(mean dollar_volume over t-4..t / median dollar_volume over t-67..t-5);
    F3 earnings-cycle position = sessions since the most recent release session, capped at 126 (no release in the
    last 400 calendar days: not eligible); F4 earnings informativeness = mean over the last 4 release sessions within
    the last 504 sessions (at least 2 needed, else not eligible) of |e on the release session| / sigma of the session
    before it; F5 R&D intensity = sf1_art_rnd / sf1_art_revenue (trailing twelve months as reported, usable from
    the day after the filing), rnd missing with positive revenue -> 0, capped at 1, revenue missing or <= 0 -> the
    cross-sectional median of the date; F6 log sigma[t,j] (idiosyncratic volatility level). Eligible rows (used
    both for training and for scoring): LIQ-500 member at t, all six features finite, |raw F1| >= 1.0 (a move of
    at least one weekly idiosyncratic sigma), and no release session in t-4..t (earnings weeks are excluded). Label:
    total return from the open of t+1 to the open of t+6 (horizon 5), ranked across the universe on each date by
    the framework. Model: LightGBM via lab.framework.ml.walk_forward (model gbm, n_estimators 100, learning_rate
    0.05, min_child_samples 200, num_leaves from params), trained on the eligible rows of every session (daily rows,
    overlapping labels purged by the framework), expanding window, refit every 63 rows. Book: after the close of
    the last session of each calendar week, score the eligible rows of that date; long the top `top` fraction, short
    the bottom `top` fraction (at least 1 name per leg), equal weight, 0.5 gross per leg (dollar-neutral, gross
    1.0); hold until the next weekly decision; trades at the next open. Fewer than 20 eligible scored rows on a
    decision date: flat until the next one. A name that leaves the universe mid-week is closed by the engine. Missing
    feature or not yet listed: not eligible, never filled with future values. No row, column or sample subset is
    chosen with information from the end of the view (K-0134): features are built on all columns and non-members
    masked per row.'
  params:
    num_leaves:
      grid:
      - 7
      - 15
      - 31
      value: 15
    top:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: 'At a weekly decision date (last session of the week, after the close), an eligible stock (non-earnings
    week, |standardized 5-day residual move| >= 1) newly enters the gbm''s top-`top` leg while its 5-day residual
    move is positive (side +1), or newly enters the bottom-`top` leg while its 5-day residual move is negative (side
    -1): the model''s continuation calls. Reversal calls (top leg after a fall, bottom leg after a rise) are not
    marked.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'F1 standardized 5-day market-residual move: sum of residual returns over t-4..t over (63-day residual sigma
    x sqrt 5); the move whose continuation or reversal is predicted'
  - 'F2 abnormal dollar volume: log of 5-day mean over the median of t-67..t-5; separates volume-accompanied (trade-driven)
    moves from quiet drifts (Campbell-Grossman-Wang)'
  - 'F3 sessions since the last 8-K Item 2.02 release session (cap 126): private information accumulates over the
    earnings cycle and is reset at the release'
  - 'F4 earnings informativeness: mean |residual release-session return| / sigma over the last 4 releases; how much
    news the firm''s disclosures usually reveal, i.e. how much is private between them'
  - 'F5 R&D intensity (sf1_art_rnd / sf1_art_revenue, as reported, from the day after filing): intangible-heavy
    firms carry more information asymmetry and larger insider gains (Aboody-Lev)'
  - 'F6 log 63-day residual volatility: scale of the concession and arbitrage risk; lets the model separate size
    of move from its kind'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The mechanism predicts that the slope of next-week return on the volume-accompanied move changes
    SIGN with information asymmetry: negative (reversal) where asymmetry is low, positive (continuation) where it
    is high. That is a three-way interaction, move x abnormal volume x asymmetry marker (F3, F4, F5), with a sign
    flip. A ridge on F1-F6 can only add main effects: it gives every stock the same reversal slope and shifts the
    level by asymmetry, so it can never call continuation for an up-mover in a high-R&D, late-cycle, high-volume
    week while calling reversal for the same move in a low-asymmetry stock. A depth-limited tree ensemble (15 leaves,
    200 rows per leaf) can. Who pays: reversal capital that fades informed volume moves in high-asymmetry stocks.'
