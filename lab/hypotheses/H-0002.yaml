falsification_criteria:
- Net Sharpe on dev (primary window_days 5) below 0.5, or the one-sided 90 % bootstrap CI of the Sharpe difference
  vs T-bill includes 0.
- Fewer than 75 % of the neighbor configurations (window_days 4 and 6) reach net Sharpe 0.5 vs T-bill, or their
  median Sharpe is below 0.7 x the primary.
- Net Sharpe at costs x2 below 0.5.
- Mechanism, equity leg - the SPY leg alone (SPY weight times SPY return over the window, IEF leg removed) has a
  non-positive mean return on dev; the paper locates the pressure mainly in equities, so if only the bond leg earns,
  the rebalancing story is wrong.
- Mechanism, placebo window - the same rule applied to a mid-month window (decision after trading day 5 of the month
  using month-to-date drift, holding trading days 6-10) earns a net Sharpe of at least 0.7 x the month-end Sharpe;
  then the effect is generic short-term reversal of the stock/bond spread, not month-end rebalancing flow.
- More than 60 % of the dev log return comes from one of the three sub-period blocks (e.g. a single crisis year
  carrying the result).
notes: 'Gap from prior_studies: calendar and flow effects. Relation to H-0001 (turn-of-month-flows, rejected at
  G1): H-0001 was an unconditional long-equity bet on month-end/month-start cash inflows. This card is a different
  mechanism: an asset-allocation rebalancing flow whose sign is set by month-to-date relative performance, traded
  as a dollar-neutral spread that is short equities about as often as long, and it is flat during the first days
  of the month (the turn-of-month inflow window). If the Chair nevertheless counts it in turn-of-month-flows, that
  is acceptable. Not short-term reversal as in studies 5-7: the signal is a month-to-date (about 15 trading days)
  cross-asset drift, timed to the month-end calendar, and the placebo-window criterion tests exactly that distinction.
  Costs: two very liquid ETFs, about 24 round trips of gross 1.0 per year. Exposure: gross 1.0 for about 5 of 21
  trading days, mean gross exposure about 0.24 (above the 0.20 minimum for the primary; window_days 3 and 4 are
  below it and are only robustness neighbors). Position entries about 2 per month x about 220 months. Sample starts
  after IEF''s first price (2002-07-30). The reference is a 2025 working paper, outside dev, so no publication-decay
  split is possible in dev; the holdout (2021-2026) is mostly pre-publication. Suggested alternative universe for
  G2: IVV/TLT or VTI/IEF (same mechanism, different instruments).'
