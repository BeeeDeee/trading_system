id: H-0002
version: 1
title: Front-running month-end 60/40 rebalancing - SPY vs IEF spread in the last days of the month, direction set
  by month-to-date drift
author_agent: scout
family: rebalancing-flow-pressure
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  kind: instruments
mechanism:
  counterparty: Calendar rebalancers (defined-benefit pensions, balanced and target-date mutual funds, multi-asset
    mandates) whose policy documents fix both the target weights and the rebalancing schedule. They pay the price
    impact knowingly or unknowingly because tracking their policy portfolio, governance and benefit cash needs matter
    more to them than a few basis points of execution cost per month.
  why: 'Pension funds, balanced funds, target-date funds and other fixed-weight stock/bond mandates rebalance on
    a calendar schedule, much of it in the last week of the month (benefit payments and month-end valuation). The
    direction and size of their trade is mechanically determined by the month-to-date drift of stocks versus bonds:
    after stocks outperformed bonds they must sell equities and buy bonds, after stocks underperformed they must
    buy equities and sell bonds. These are large, price-insensitive orders concentrated in a few days, so they create
    temporary price pressure on the equity/bond spread (Harvey, Mazzoleni, Melone document roughly -17 bp next-day
    equity return per one-standard-deviation calendar rebalancing signal on S&P 500 and 10y Treasury futures). The
    strategy takes the other side in advance: it holds the spread the rebalancers will push, and closes at the month-end
    close when their flow is done.'
  why_not_arbitraged: 'The flow is enormous (trillions in fixed-weight mandates) relative to the risk capital willing
    to pre-position against it for a few days; the per-month edge is small compared with the spread''s volatility,
    so a front-runner bears real risk for a modest Sharpe. Rebalancers cannot easily change behaviour: schedules
    are written into investment policy statements and are slow to change, and switching to threshold or smoothed
    rebalancing has its own costs and committee overhead.'
signal:
  description: 'Instruments: SPY (equity leg) and IEF (bond leg), daily total returns from sharadar_sfp. Calendar:
    XNYS trading days. For each calendar month m let L be the last trading day of m and K = window_days. The window
    is the last K trading days of month m (L-K+1 .. L). Decision day t = the trading day immediately before the
    window (the (K+1)-th last trading day of m). After the close of t, compute the month-to-date total returns of
    SPY and IEF from the close of the last trading day of month m-1 to the close of t (compounded daily total returns),
    and D = R_SPY_mtd - R_IEF_mtd. If D > 0 (stocks outperformed, rebalancers will sell stocks / buy bonds): weights
    SPY -0.5, IEF +0.5. If D < 0: SPY +0.5, IEF -0.5. If D == 0 or either instrument has a missing return on any
    day from the start of month m to t, or either instrument is not tradable on the entry day: stay flat for that
    month. Entry at the open of the first window day (t+1). Exit: the whole position is closed at the close of L
    (a pre-scheduled calendar trade that uses no data; the month-end close is when calendar rebalancers execute).
    If the backtester cannot execute at the close, the only permitted fallback is to exit at the open of the first
    trading day of month m+1. Outside the window the strategy is flat (cash, earning the T-bill rate if the framework
    credits cash). Weights are fixed during the window (no daily rebalancing within the window). Gross exposure
    is 1.0 in the window and 0 outside, dollar-neutral. One decision per month; no other parameters, thresholds
    or filters.'
  params:
    window_days:
      grid:
      - 3
      - 4
      - 5
      - 6
      - 7
      value: 5
