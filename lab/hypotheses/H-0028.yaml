id: H-0028
version: 1
title: Earnings-reaction drift on real 8-K release dates - LIQ-500 dollar-neutral, follow the sign of a large standardized
  release-session reaction, hold 5 days
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who anchor on their pre-release valuation or process the release slowly (limited attention,
    slow analyst revisions, institutions that adjust positions over several days to limit impact) and therefore
    keep supplying stock at stale prices to drift followers after good news and buying it after bad news.
  why: 'Prices underreact to earnings news: part of the information in an earnings release is impounded over the
    following sessions rather than on the release session (Bernard and Thomas 1989; Chan, Jegadeesh and Lakonishok
    1996). The price reaction on the release session is a direct, model-free measure of the surprise (Brandt, Kishore,
    Santa-Clara and Venkatachalam 2008), so a large standardized reaction should be followed by a same-signed abnormal
    return over the next days. The card uses the real 8-K Item 2.02 reaction session, so it measures drift strictly
    after the news, with no announcement-date proxy.'
  why_not_arbitraged: 'In large caps it may well be arbitraged: Martineau (2022) reports no drift in large stocks
    after 2006, which is the main reason this card may die. What could keep a residual: the drift is a few tenths
    of a percent over days, carries the full idiosyncratic risk of a single name around its noisiest week, and requires
    daily event-driven turnover, so capacity per name is small for large funds and the risk per unit of expected
    return is high for small ones.'
signal:
  description: 'Daily decision after the close of session t, trades at the open of t+1. Inputs: sharadar_sep total
    returns (ret_co, ret_oc; close-to-close return r = (1+ret_co)(1+ret_oc)-1), tradable flag, LIQ-500 point-in-time
    membership, and sec_8k_item202 ea_reaction_day. (1) Daily abnormal return of stock i: a_i,s = r_i,s minus the
    equal-weight mean r of the LIQ-500 members on session s. (2) Event: ea_reaction_day[t, i] == 1, i is a LIQ-500
    member at the close of t and tradable. Reaction AR_i = (1+a_i,t-1)(1+a_i,t) - 1 (two sessions ending at the
    reaction session, so an 8-K filed one session after the press release is still captured). sigma_i = standard
    deviation of a_i,s over the 63 sessions ending at t-2 (pre-event only; at least 40 valid values, else no event).
    z_i = AR_i / (sigma_i * sqrt(2)). If z_i >= z_threshold the stock enters the long set, if z_i <= -z_threshold
    the short set; otherwise nothing. NaN ea_reaction_day (before the company''s first filing) means no event. (3)
    A position is held for hold_days sessions: entered at the open of t+1 and removed from the target at the close
    of t+hold_days (exited at the next open). A new event of the same stock inside the window replaces the old one
    (new side, clock restarted). A stock that leaves LIQ-500 or becomes untradable is dropped from the target at
    that close. (4) Weights each close: every active long gets +0.5 / max(nL, 10), every active short -0.5 / max(nS,
    10), where nL, nS are the numbers of active longs and shorts. The net (sum of event weights) is offset by an
    equal-weight position of -net spread over all other LIQ-500 members that are tradable and not in either set,
    so the book is dollar-neutral with gross <= 1. If there are no active events the book is flat (cash). No other
    trades: hedge weights change only through the net of the event legs and membership changes.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_threshold:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  selection_procedure: Primary configuration fixed in advance (z 2.0, hold 5); grids are for G2 neighbors only,
    no selection.
  timeframes:
  - 1d
mechanism_test:
  event: After the close of session t, a LIQ-500 member has ea_reaction_day = 1 (reaction session of an 8-K Item
    2.02 earnings release) and its two-session abnormal return (sessions t-1 and t, versus the LIQ-500 equal-weight
    mean) is at least 2.0 pre-event standard deviations (63-session sigma of its daily abnormal return ending at
    t-2, scaled by sqrt(2)) in absolute value. side = +1 if the reaction is positive, -1 if negative.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sep
  description: LIQ-500 point-in-time; starts early enough that the 63-session sigma exists when the 8-K data begins
  fields:
  - ret_co
  - ret_oc
  - tradable
  frequency: 1d
  period:
  - '2004-05-03'
  - '2020-12-31'
- dataset: sec_8k_item202
  description: reaction session of each primary 8-K with Item 2.02, known at the close of that session
  fields:
  - ea_reaction_day
  frequency: event
  period:
  - '2004-08-23'
  - '2020-12-31'
holding_period:
  rebalance: daily
  typical_days: 5
market_exposure: market_neutral
references:
- cite: 'Bernard, Thomas (1989) Post-earnings-announcement drift: delayed price response or risk premium? Journal
    of Accounting Research'
  year: 1989
- cite: Chan, Jegadeesh, Lakonishok (1996) Momentum strategies. Journal of Finance
  year: 1996
- cite: Brandt, Kishore, Santa-Clara, Venkatachalam (2008) Earnings announcements are full of surprises. Working
    paper, Duke University
  year: 2008
- cite: 'Martineau (2022) Rest in peace post-earnings announcement drift. Critical Finance Review (counter-evidence:
    no drift in large stocks after 2006)'
  year: 2022
falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return after the event is below the 95th percentile of the 200
  time-shifted placebos, or below the round-trip cost per event, or does not keep its sign in at least 2 of the
  3 sub-periods.'
- 'Mechanism: the side-adjusted 5-session abnormal return in the latest third of the dev events is zero or negative
  (drift arbitraged away in large caps, as Martineau 2022 reports); then the family should be closed for LIQ-500.'
- 'Mechanism: the 5-session abnormal return is not larger than the 1-session one (no continuation beyond the first
  session after the reaction, i.e. no drift but only a next-day effect).'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe excess over T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (z_threshold 1.5 / 2.5, hold_days 3 / 7) meet the bar, or the strategy
  fails at costs x2.'
notes: 'Brief fit: US single stocks, cross-sectional, 5-session hold, mechanism test declared. Why this card and
  not a repeat: H-0024 (same family, first trial) was a ''cannot tell'' near miss (placebo average near zero, gross
  above cost, percentile just under the bar) whose own open question was to replace its proxies with true release
  dates. It used the SF1 10-Q filing, which usually lags the press release by weeks, plus a volume-spike filter
  as a date proxy, and an accounting earnings change as the surprise. This card uses the real 8-K Item 2.02 reaction
  session (K-0035) and the market''s own reaction as the surprise, so the event is exactly the information release
  and the test settles whether any post-release drift exists in LIQ-500. It is not H-0009 (volume shocks on any
  day, gated by holders'' capital gain, lost money): events here are only earnings releases, and there is no disposition
  gate. It is not a reversal card and not a date-prediction card (H-0023, H-0026): no date is predicted, every event
  is known at the close of its reaction session. Honest prior: K-0039 and Martineau (2022) both point to no drift
  in large caps after the mid-2000s; the card is filed because the lab''s own evidence is a near miss with a bad
  proxy, and a clean negative here closes the family for liquid stocks. Two-session reaction window: absorbs 8-K
  filings accepted one session after the press release (a known gap of the dataset); it adds one pre-release session
  of noise for the others. Coverage: the dataset misses some CIKs, possibly leaning to survivors (K-0035); events
  are only what is flagged, the hedge is the whole universe, so missing firms reduce events but do not bias the
  hedge. Exposure (K-0027/K-0030): earnings releases occur on most sessions, the 10-name divisor floor prevents
  single-name concentration off-season, so gross is lower in quiet weeks and up to 1 in earnings season; expected
  mean exposure well above 20 %. Re-equalising turnover is limited because only event names and the net hedge change.
  Costs: LIQ-500 half- spreads are 3-6 bps, so a round trip is roughly 6-12 bps per event; the drift must exceed
  that. The dev window for this card starts with the 8-K data in late 2004 (none before), so the 1998-2004 era that
  dominated earlier stock cards is absent by construction. Skeptic: per K-0040 the G0 look-ahead check may be vacuous
  on the synthetic market; please read the event code (sigma must end at t-2, the event must use only data at the
  close of t, entry at t+1 open).'
