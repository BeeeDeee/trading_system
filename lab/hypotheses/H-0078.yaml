falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return at 5 sessions is not above the 95th percentile of the time-shifted
  placebos, or gross per event is below the round-trip cost (the gap does not close fast enough to pay the fund''s
  spread).'
- 'Mechanism: the latest third of dev has a negative pooled abnormal return at 5 sessions (decay, K-0060); this
  kills the card even if the pooled test passes.'
- 'Mechanism: the 1-session abnormal return is negative and the 5-session one is below cost (no catch-up shape;
  the relative fall continues, i.e. the ETF led and the fund is right to be cheap).'
- 'Strategy: net Sharpe on dev below 0.5, or the stationary-bootstrap bound of the Sharpe difference to T-bills
  at or below zero.'
- 'Strategy: fewer than 75 % of the neighbours (z_entry 1.5/2.5, hold_days 3/10) clear the benchmark, or Sharpe
  at doubled costs below the T-bill benchmark.'
- 'Design (not mechanism): mean gross exposure below 0.20 or fewer than 400 fund events in dev means the event-rate
  forecast in notes was wrong; record it as such, do not re-tune slots or thresholds.'
notes: 'Brief fit: the brief asks for cross-asset, signals from one market traded in another, 1-5 days. No idea
  with a living mechanism fitted better: daily cross-market lead-lag (mrel, K-0080), macro-calendar (K-0070), stress
  rebounds (K-0084) and forced-flow separators in crypto (K-0085) are closed in the lab, and FRED or ETF signals
  into crypto would run on series whose dev data end in 2020 while crypto dev runs to 2022. Here the signal is the
  foreign equity market (priced in US hours through an AP-arbitraged ETF) and the trade is in the segmented US closed-end
  fund market; same asset class, different market and clientele. Holding 5 sessions. Relation to H-0077 (same family
  on purpose, so trials count together): same discount-shock idea, but a disjoint set of funds in another asset
  class with a different anchor per fund, so it is a cross-sectional replication of K-0099, not a retune of H-0077
  (whose slot weight, slot cap and z were not touched; its funds are not included). Changes that answer H-0077''s
  lesson: (a) both legs are marked in the event study so the country move and beta are netted (K-0074); (b) the
  anchor is the same-country ETF, not one market-wide hedge; (c) the event-rate, slot and exposure arithmetic is
  written down in advance (K-0098); (d) delisted or merged funds (GCH, IF, TTF, SGF, ISL, TKF, BZF, SNF and others)
  are listed on purpose to reduce survivorship, the list is a class rule (all US single-country equity CEFs I could
  name with a same-country ETF), not a performance pick; a ticker that has no data is simply never eligible. Event
  forecast: about 12 pairs eligible in the early 2000s (several anchors start 2000-2009: EWY/EWT 2000, EEM 2003,
  FXI 2004, ECH 2007, EPI/THD/EIS/TUR 2008, IDX 2009, EIRL 2010), about 18 around 2010-2017 and about 12 at the
  end after mergers; average about 15. At z = 2.0, first crossings of a 5-session sum occur about 3-5 times per
  fund-year, so about 45-75 fund events per year, 900-1,500 in dev (each marks two instruments, fewer distinct anchor
  marks when funds share an anchor), on roughly 700-1,200 dates. They cluster on US sentiment days, so independent
  episodes are fewer. Exposure arithmetic: hold 5 sessions, 0.5 gross per event, cap 2 events. Uncapped mean open
  events = 60 x 5 / 252 = 1.2; with the cap the mean is about 1.0, so mean gross exposure about 0.5; at half the
  forecast rate about 0.29, still above the 0.20 floor. Position entries over 100 and rebalancing dates over 36
  are easy. Gross versus cost: a -2 sigma 5-session shortfall of a country fund against its ETF is about 4-6 %;
  if a quarter to a third closes within 5 sessions the pair earns about 1-2 % gross. The fund leg is in an illiquid
  ETF cost tier (assumed tens of bps per side), the anchor leg cheap; expected cost ratio about 2, which is thin
  if the engine''s tier for these funds is high. Expected book: about 60 events a year at about 0.5 % net of book
  each before clustering, i.e. a few percent a year at single-digit volatility; the absolute Sharpe floor of 0.5
  is the binding bar and the card can fail it as H-0077 did. Known risks: tracking noise of fund holdings versus
  the ETF (JOF holds small caps against EWJ, CHN/TDF/GCH hold China and Hong Kong stocks against FXI''s H-share
  large caps, EMF against EEM is broad EM) adds noise, not bias; underreaction catch-up and discount reversion are
  not separated (both are the claim); shorting the ETF leg is easy, no fund is shorted; ticker reuse after a fund
  delists could attach another security''s prices to an old ticker (Builder: check the first and last price dates
  per ticker and drop a ticker whose history is not one fund). Diagnostics wanted if the gate can report them: by
  side (fund leg against anchor leg), by era, and events on dates with many versus few funds firing (sentiment-wide
  versus fund-specific shocks). Revision v2 (owner, 2026-10-27, on the Builder''s request): CH (Chile Fund, anchor
  ECH) and MF (Malaysia Fund, anchor EWM) are not in Sharadar SFP and were removed with their two pairs; 22 pairs
  remain. Their absence is a data-coverage limit, not a selection, but it leans the fund list slightly towards survivors
  (two of the deliberately listed delisted funds are gone): the Skeptic should weigh this. ECH and EWM stay in the
  universe as unmarked event-study peers and never trade.'
