mechanism:
  counterparty: US holders of the closed-end fund who sell after it fell (sentiment-driven or tax and liquidity
    selling of a thinly traded fund) or who are slow to buy after the foreign market rose, and who accept a wider
    discount from the liquidity provider who buys the fund and hedges with the country ETF.
  why: 'A US-listed closed-end country fund holds stocks of one foreign market, but its share price is set in a
    different market: by US investors, mostly retail, during US hours, with no creation or redemption that ties
    the price to NAV. The open-end country ETF on the same market is held at NAV by authorized participants, so
    it shows within the same session what the foreign market is worth. Two documented frictions open a gap between
    the two prices. (1) Country fund prices underreact to NAV moves and catch up over the following days, except
    in weeks with salient news (Klibanoff, Lamont and Wizman 1998). (2) Country fund prices move with US market
    sentiment that their NAVs do not share, i.e. their discounts take non-fundamental shocks from US holders (Bodurtha,
    Kim and Lee 1995; Lee, Shleifer and Thaler 1991). Both predict that after the fund falls far behind its country
    ETF, the gap partly closes within days. The signal comes from one market (the foreign equity market, read through
    the AP-arbitraged ETF) and the trade is in another, segmented one (the US closed-end fund market). This extends
    the one wrapper result that cleared the lab''s placebo test (H-0077, muni CEFs against MUB, K-0099) to a different
    asset class with a different anchor per fund.'
  why_not_arbitraged: There is no creation or redemption, so closing the gap needs capital that holds an illiquid
    fund (often well under a few million dollars of daily volume) against a short ETF with no fixed date of convergence;
    discounts can widen further (noise-trader risk), and holding costs make arbitrage costly (Pontiff 1996). The
    capacity is a few million dollars per fund, too small for most arbitrage desks.
signal:
  description: 'Pairs (closed-end fund -> anchor ETF, fixed, never switched): MXF->EWW, MXE->EWW, KF->EWY, TWN->EWT,
    IFN->EPI, IIF->EPI, CHN->FXI, TDF->FXI, GCH->FXI, JOF->EWJ, JEQ->EWJ, SWZ->EWL, GF->EWG, IF->IDX, TTF->THD,
    SGF->EWS, ISL->EIS, TKF->TUR, EMF->EEM, BZF->EWZ, SNF->EWP, IRL->EIRL. Daily total log returns r = log(1 + ret_co)
    + log(1 + ret_oc) (close to close). For each pair i on day t, after the close: d_i,t = r_fund,t - r_anchor,t
    (hedge ratio 1, the fund''s NAV has unit exposure to its market). S_i,t = sum of d_i over the last 5 sessions
    (t-4..t). sigma_i,t = standard deviation of daily d_i over the 126 sessions ending t-5 (excludes the formation
    window), requiring at least 100 sessions where both legs have a bar; z_i,t = S_i,t / (sigma_i,t * sqrt(5)).
    A pair is eligible on day t only if both legs have a bar on each of the last 5 sessions, the warm-up above is
    met, and the fund''s median dollar_volume over the last 21 sessions is at least 100,000 USD (fixed feasibility
    floor, not a parameter). Event: z_i,t <= -z_entry and z_i,t-1 > -z_entry (first session of the crossing). Book:
    at the open of t+1 buy the fund with weight +0.25 and sell its anchor ETF with weight -0.25; close both legs
    at the open of session t+1+hold_days. At most 2 open events at a time (gross <= 1.0): if more eligible events
    occur than free slots on a day, take the most negative z first; skipped events are not queued. No new event
    on a fund that is already held. If two open events share an anchor, the anchor weights add. A leg without a
    bar on the exit open is closed at its next available open. A fund or anchor that is delisted or has no data
    simply produces no eligible days; nothing else is traded and the rest of the book is cash.'
  params:
    hold_days:
      grid:
