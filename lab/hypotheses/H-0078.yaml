mechanism_test:
  event: A US-listed single-country closed-end fund's 5-session return falls at least z_entry standard deviations
    (z_entry = 2.0) below its fixed anchor country ETF's 5-session return, first session of the crossing, eligibility
    as in the signal (both legs trading, 126-session warm-up, fund median dollar volume >= 100k). On that date the
    fund is marked side +1 and its anchor ETF side -1, so the pooled abnormal return measures the fund-minus-anchor
    catch-up and nets out the country's own move (K-0074).
