version: 1
title: Filing-day earnings quality vs headline reaction, learned - LIQ-500 long-only weekly top fifth of a LightGBM
  score (accruals, cash, 8-K reaction, time since 10-Q), 5-day label
author_agent: scout
family: anomalies-at-earnings-news
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders who bought the headline at the release and do not revisit the filed cash-flow statement
    (attention-constrained retail and momentum/attention buyers of positive reactions), and sellers of bad headlines
    whose cash flow was in fact strong. They sell, or fail to buy, at prices that still reflect the headline after
    the 10-Q shows otherwise.
  why: 'At the earnings release (8-K Item 2.02) the market prices the headline number. The cash-flow statement and
    balance sheet only reach the market with the 10-Q/10-K filing, usually days to weeks later, and only then can
    accruals (earnings not backed by operating cash) be read. Investors who fixate on headline earnings (Sloan 1996)
    or ignore the cash-flow detail out of limited attention (Hirshleifer and Teoh) leave a price that is too high
    for firms whose good headline rests on accruals and too low for firms whose cash flow beats their reported earnings.
    Balsam, Bartov and Marquardt (2002) find returns in a short window around the 10-Q filing that are negatively
    related to unexpected accruals, and that this relation depends on who holds the stock. The lab''s own filing-anchored
    test (H-0092) found accruals information at the filing date in LIQ-500 that beat same-stock placebos in every
    third of dev, already in the first session and building over the week. The card claims that this filing-day
    repricing is conditional, not additive: it is concentrated where the release reaction and the filed cash quality
    disagree (headline rally on high accruals; headline drop with strong cash flow), and it fades with the number
    of sessions since the filing. A walk-forward model on six point-in-time features is asked to find that conditional
    pattern; the book holds the stocks it scores highest.'
  why_not_arbitraged: The information is public but needs processing of a second document after the news cycle has
    moved on; it arrives for hundreds of firms in the same few weeks of each filing season, so attention and arbitrage
    capital are spread thin exactly then. Per-name gains are small relative to idiosyncratic risk over a week, and
    the long-known annual accrual anomaly has been arbitraged (Green, Hand and Soliman 2011), which is why the card
    looks only at the filing-day conditional effect and expects it to be small in large caps.
signal:
  description: 'Universe: point-in-time LIQ-500 members (liq_n 500) on each date. Data up to the close of day t,
    trades at the open of t+1. Inputs: total returns (ret_co, ret_oc) and dollar volume of sharadar_sep; attached
    sf1 quarterly as-reported fields sf1_arq_netinc, sf1_arq_ncfo, sf1_arq_assets (usable from the day after the
    SEC filing, as delivered by the loader); attached ea_reaction_day (sec_8k_item202). FILING EVENT: the filing-usable
    session of a stock is the first session on which any of the three sf1_arq fields differs from its value on the
    previous session or becomes non-missing (a new quarter has become usable). FEATURES per stock and date t (F1-F4
    and F6 winsorized at the 1st/99th cross-sectional percentile, then z-scored across the scored members of that
    date with the framework helper): F1 quarterly accruals = (sf1_arq_netinc - sf1_arq_ncfo) / sf1_arq_assets of
    the latest usable quarter. F2 quarterly cash profitability = sf1_arq_ncfo / sf1_arq_assets. F3 release reaction:
    r = the latest session within the last 126 sessions up to t with ea_reaction_day == 1; F3 = (the stock''s close-to-close
    total return on session r minus the cross-sectional median of members on r) divided by the stock''s 63-session
    standard deviation of daily total returns ending at session r-1. F4 post-release drift so far: compounded total
    return of the stock from the close of r to the close of t minus the equal-weight mean of members over the same
    sessions, divided by (the same 63-session standard deviation x sqrt(max(1, t - r))); 0 when r = t. F5 event
    time: number of sessions from the latest filing-usable session to t, capped at 126, entered as count / 126 (a
    fixed scale, not cross-sectional, so that ''fresh'' means the same on every date; if the framework helper must
    z-score every feature, it is z-scored like the others). F6 63-session realized volatility of daily total returns.
    A stock is scored on t only if all six features exist and sf1_arq_assets > 0 (no release within 126 sessions,
    no usable quarter, or under 63 sessions of returns = not scored). LABEL: total return from the open of t+1 to
    the open of t+6 (horizon 5), ranked across scored members on t (framework walk_forward). MODEL: LightGBM (framework
    gbm), n_estimators 100, learning_rate 0.05, num_leaves 15 (grid), min_child_samples 1000, subsample 0.8, colsample
    1.0, framework seeds; trained on all daily rows of scored members in a rolling window of up to 756 rows (starts
    as soon as the framework''s minimum history exists and grows to 756), refit every 63 rows; the framework''s
    purge excludes labels not realized by the decision date. BOOK (score_weights + only_on): decisions after the
    close of the last trading session of each calendar week; at the next open hold the top `top` fraction (0.2)
    of scored members by model score, equal weight, gross 1.0, long only; positions are held until the next weekly
    decision. Fewer than 50 scored members on a decision date: keep the previous book (flat before the first model
    fit). A stock that leaves the universe between decisions is sold at the first open the engine requires; delisting
    returns as the loader defines them. No date literals, no tickers.'
  params:
    num_leaves:
      grid:
      - 7
      - 15
      - 31
      value: 15
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: At a weekly decision date, a stock whose latest 10-Q/10-K became usable within the last 5 sessions (F5
    <= 4) is in the top fifth of the model score among scored members (side +1) or in the bottom fifth (side -1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'F1 quarterly accruals (sf1_arq_netinc - sf1_arq_ncfo) / sf1_arq_assets of the latest usable quarter: earnings
    not backed by operating cash, the part fixated investors over-price'
  - 'F2 quarterly cash profitability sf1_arq_ncfo / sf1_arq_assets: separates high-accrual firms with weak cash
    from high-earnings firms with strong cash'
  - 'F3 standardized release-session reaction on the latest 8-K Item 2.02 session within 126 sessions (return minus
    member median, over 63-session vol): the market''s own measure of the headline surprise'
  - 'F4 vol-scaled return relative to members since the release session: how much of the headline has already been
    priced or drifted before the filing information arrives'
  - 'F5 sessions since the latest 10-Q/10-K became usable, capped at 126, fixed scale: event time, lets the model
    concentrate the filing information in the days after the filing'
  - 'F6 63-session realized volatility of daily total returns: limits to arbitrage, mispricing should survive longer
    where idiosyncratic risk is high'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  train_days: 756
  why_not_linear: 'The claim is an interaction, not a sum. (1) Sign interaction: accruals should predict lower returns
    mainly when the release reaction was positive (the headline rally rested on accruals) and cash profitability
    should predict higher returns mainly when the reaction was negative (a bad headline with strong cash flow);
    a ridge on F1-F3 gives one slope per feature for every reaction sign, so it averages the two cells with the
    large set of stocks where headline and cash agree and nothing is mispriced. (2) Event-time interaction: the
    filing information should matter in the first sessions after the filing and fade with F5 (H-0092 saw it from
    the first session); a ridge applies the same accrual slope to a stock that filed yesterday and one that filed
    three months ago, which dilutes the fresh filers with stale ones. (3) Threshold: accrual mispricing sits in
    the tails (extreme accruals), where a tree can split and a line cannot. Who pays: holders who anchored on the
    headline and sell (or buy) only after the filed numbers are digested. If ridge on the same six features, schedule
    and book is as good, the result is a linear quality/drift composite, not this interaction, and the card says
    so.'
