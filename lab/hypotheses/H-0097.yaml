falsification_criteria:
- Net Sharpe on dev below SPY_TR Sharpe + 0.10, or the one-sided bootstrap bound of the Sharpe difference at or
  below zero (G1).
- 'Mechanism: side-adjusted 5-session abnormal return of fresh-filer top/bottom-fifth events is not above the 95th
  percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of the event study (roughly 2016-2020) has the wrong sign (K-0060 decay), even if
  the pooled test passes; the card counts this as a refutation of a live effect.'
- 'Mechanism shape: the effect is absent at 1-3 sessions and appears only at 10-21 sessions (slow style drift, not
  filing-day information), or the 1-session effect is the whole 5-session effect and reverses by 10 (reaction noise).'
- 'Linear control: ridge (framework ridge, same six features, label, schedule and book) reaches the gbm''s net Sharpe
  minus 0.05 or more; then the interaction claim is refuted and the card is a linear composite.'
- 'Neighbors of num_leaves 15 or top 0.2: fewer than 75 % beat SPY_TR, or median neighbor Sharpe below 0.7 x primary
  (G2).'
- Net Sharpe at doubled costs below SPY_TR Sharpe (G2).
notes: 'Lineage and family: this is the fourth-plus card of anomalies-at-earnings-news and builds directly on H-0092
  (accruals at the 10-Q/10-K filing, LIQ-500, 5 days: mechanism passed, every third positive, present from the first
  session; market-neutral book near cash, unbalanced short leg lost) and K-0126, which names a long-only form as
  untested. Differences: (a) long-only always-invested book, no short leg and no part-time exposure (K-0027, K-0125);
  (b) the release-session reaction from real 8-K dates as a second input, so the claim is the conditional disagreement
  between headline and filed cash quality, not the unconditional accrual sort; (c) a learned score with event time,
  tested against ridge. Not a duplicate of H-0095 (learned selection of 8-K reaction drift, a post-earnings-announcement-drift
  card; its event is the release session, mine is the later filing session and the score''s key input is filed cash
  quality) nor of H-0096 (predicted release window; mine uses the realized filing). Overlap with H-0095 on F3/F4
  is deliberate and declared: if this card works only through F3/F4 with fresh filings irrelevant, it is PEAD again,
  which the F5 importance and the fresh-filer event study show. FORECASTS (from H-0092, K-0098, K-0120, K-0125):
  model fits from about 2005-09 (8-K data from 2004-08, 126-session reaction window, minimum training history),
  so the scored dev window is about 15 years, about 790 weekly decisions. Scored members: about 60-75 % of LIQ-500
  (8-K coverage gaps, K-0035), i.e. 300-370 per date; book 60-75 names. Mechanism events: fresh filers (filing usable
  within the last 5 sessions) in the top or bottom fifth at a weekly decision; about 25-30 fresh filers per week
  on average, heavily clustered in filing seasons (peak weeks 80+, off weeks under 5), roughly 40 % of them in a
  tail fifth: 6,000-12,000 events on 550-750 dates (both sides marked, so the placebo mean should be near zero;
  legs are sorted on accruals and reaction, not on beta, but high-vol names may sit more in one tail: expected beta
  gap small, K-0074). Round trip from the LIQ-500 cost tiers about 10-12 bps (H-0092 measured about 12). Expected
  side-adjusted gross per event 15-30 bps over 5 sessions; per K-0130 a literature-based forecast is an upper bound,
  and if the model only reproduces H-0092''s accrual effect (about cost) the card dies on the cost check, which
  is the informative answer ''the reaction interaction adds nothing''. Strategy: mean exposure about 1.0, thousands
  of entries, weekly one-way turnover of the top fifth about 25-40 % (mostly fresh filers rotating in), cost drag
  about 1.5-2.5 %/yr; the book needs an excess of roughly 2-4 %/yr over SPY_TR at similar volatility to clear +0.10
  Sharpe. Known confound: an equal-weight top fifth of LIQ-500 against cap-weighted SPY_TR carries size/equal-weight
  tilt (H-0025 lesson); the mechanism test and the ridge control are the parts that do not depend on it. Runtime:
  rolling 756-row window bounds each fit to a few hundred thousand rows, about 60 refits, so G0 refits and the 8
  G2 neighbors should stay within limits. Four attached fields (RAM cap is six). The publication-decay check: Sloan
  (1996) predates dev; Balsam et al. (2002) falls in dev but before the first scored date (no 8-K data before 2004-08),
  so there is no pre-publication window for this card; the Chair should read the decay check as not applicable rather
  than as a pass. No forward data for US stocks: G4 is the ceiling. Kill conditions are pre-registered above; do
  not rescue by retuning top, num_leaves, the 126-session windows or the hold.'
