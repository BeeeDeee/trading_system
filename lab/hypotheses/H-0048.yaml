id: H-0048
version: 1
title: Month-end Treasury index-extension tilt - 60/40 SPY/IEF book that holds its bond sleeve in TLT instead of
  IEF over the last 2 sessions of each month
author_agent: scout
family: bond-index-extension-flow
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - TLT
  - SHY
  - LQD
  - AGG
  - TIP
  kind: instruments
mechanism:
  counterparty: Benchmarked bond buyers (index funds, insurers, LDI and total-return mandates) who buy duration
    at the month-end rebalancing date whatever the price, because their mandate measures them against the index
    on that date. They pay a small concession to dealers and to anyone who holds duration into the date.
  why: 'Bond benchmark indices (Bloomberg US Treasury / Aggregate) are rebalanced once a month, on the last business
    day: newly issued coupon Treasuries enter, bonds falling under one year leave, and index duration jumps up ("extension").
    Benchmarked managers (index funds, life insurers, pension LDI accounts, total-return funds) must buy duration
    into that date or carry tracking error, and some window-dress reported holdings at month end. Hartley and Schwarz
    document that coupon-Treasury excess returns are positive and concentrated in the last few sessions of the month
    (mostly the last one), near zero on other days, and that insurers that benchmark tightly are large net buyers
    exactly on the index rebalancing date. A demand shock that is known in advance and concentrated in time is paid
    for by the buyers to whoever supplies duration on those days. Since the extension is in duration terms, the
    price pressure is larger per dollar in long bonds (TLT) than in the 7-10y belly (IEF), so a stock-bond book
    that holds its bond sleeve in long bonds only over those sessions picks up the concession and keeps its equity
    weight unchanged.'
  why_not_arbitraged: Dealers who could pre-position are limited by balance-sheet constraints (leverage ratio, risk
    limits at month and quarter ends, when they also window-dress themselves). The gain per event is a few basis
    points of yield, small next to the duration risk of holding long bonds unhedged, so risk-limited arbitrageurs
    supply only part of it. The demand is mandate-driven and does not shrink when it is known.
signal:
  description: 'Calendar. For each XNYS session t let rem(t) = number of XNYS sessions after t that fall in the
    same calendar month as t (rem = 0 on the last session of the month). Compute rem from a deterministic XNYS holiday-calendar
    rule (the exchange schedule is published in advance), NOT from which data rows exist after t, so that truncating
    the data at t does not change the decision. Decisions are made after the close of session t using nothing but
    the calendar, and trade at the open of session t+1. Base state: SPY 0.60, IEF 0.40. Entry: after the close of
    the session t with rem(t) == window_sessions, set target weights SPY 0.60, TLT 0.40, IEF 0 (traded at the open
    of t+1, the first of the last window_sessions sessions of the month), and hold through the close of the last
    session of the month. Exit: after the close of the last session of the month (rem = 0), set target weights SPY
    0.60, IEF 0.40, TLT 0, traded at the open of the first session of the next month; this is also the monthly rebalance
    to 60/40. Between these two decision dates per month weights are not touched (they drift with prices). If TLT
    has no bar at the entry open, the sleeve stays in IEF for that month; if it has no bar at the exit open, the
    exit is done at the next open where both TLT and IEF trade. SHY, LQD, AGG and TIP are never traded: they are
    in the universe only as unmarked peers for the mechanism test (AGG and TIP enter the peer set when they first
    have prices). Gross exposure is always 1.0, no shorts.'
  params:
    window_sessions:
      grid:
      - 1
      - 2
      - 3
      value: 2
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'After the close of the session t whose number of remaining sessions in the calendar month equals window_sessions
    (2): TLT is marked with side +1 and IEF with side -1 (long the long bond against the belly into the month-end
    index rebalancing). SPY, SHY, LQD, AGG and TIP are never marked and form the peer set (at least three unmarked
    peers with data on every event date). Because TLT and IEF are marked on the same dates with opposite sides,
    the peer mean cancels in the pooled abnormal return, which therefore measures TLT minus IEF over the window
    against placebo windows of the same pair.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 2
