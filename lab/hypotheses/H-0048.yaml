references:
- cite: Hartley, J. and Schwarz, K. (2019) Predictable End-of-Month Treasury Returns. Working paper, Rodney L. White
    Center, Wharton.
  url: https://rodneywhitecenter.wharton.upenn.edu/wp-content/uploads/2019/12/17-19.Schwarz.pdf
