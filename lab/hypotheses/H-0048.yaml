falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return (TLT long, IEF short) at the primary horizon of 2 sessions is not
  above the 95th percentile of the 200 time-shifted placebos.'
- 'Mechanism: gross abnormal return per event is below the round-trip cost of trading TLT and IEF.'
- 'Mechanism: the latest third of dev has a negative sign (K-0060 decay expectation stated in advance as a kill
  condition), or fewer than two of three thirds are positive.'
- 'Mechanism shape: if the descriptive 10-session effect is much larger than the 2-session effect, the result is
  read as generic duration drift, not a month-end concession, even if the gate passes.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: neighbors window_sessions 1 and 3 do not beat the 60/40 benchmark; the book does not beat 60/40 at
  doubled costs.'
- 'Publication decay: excess Sharpe over 60/40 after 2019 below half of the excess before (G2 check).'
notes: 'Brief deviation, stated plainly: the brief asked for a short-horizon cross-asset idea (signal from one market,
  trade in another). I did not find one with a real counterparty that the lab has not already used up. Daily lead-lag
  across markets died out of sample (study mrel, K-0065). Stress rebounds of one asset after a shock in another
  are largely the same evidence again (K-0056, H-0041, studies 6-7). Macro calendar x ETFs has a low prior (K-0063,
  K-0065), and in crypto the macro-day beta spread would be a fraction of perp round-trip cost and invested under
  a fifth of the time. Leveraged-ETF closing rebalancing reverts at the next open, which a next-open entry cannot
  capture. The closest fit is this card: a short-horizon (1-3 session) flow event whose signal comes from a mandate
  rule outside the traded price series (the bond index''s month-end rebalancing schedule), traded in a cross-asset
  stock-bond book against the cross-asset 60/40 benchmark. Design follows the lab''s lessons: no binary SPY/IEF
  switch (H-0001, H-0003, K-0005). The equity weight is always 60 % and only the duration of the bond sleeve changes
  inside the window, so average equity exposure equals the benchmark''s (K-0027: a tilt on an always-invested book,
  not a stand-alone window book). The mechanism test is aligned with what the book earns (TLT minus IEF, the K-0064
  concern), and both sides are marked so that the placebo mean is near zero rather than generic duration drift (K-0063).
  At least three never-marked peers are present on every date (K-0055). Relation to existing families: turn-of-month-flows
  (H-0001, H-0016, H-0025) is about equity inflows around the month turn (day -1 to +3) and moves equity exposure;
  rebalancing-flow-pressure (H-0002, H-0046) is about stock-bond rebalancing whose direction depends on drift. This
  card never changes equity exposure, has no direction rule, and exits at the open of the first session, before
  the month-start equity window. The counterparty (benchmarked bond buyers at the index rebalancing date) is different,
  hence a new family. If the Chair judges it to be the same calendar mechanism as turn-of-month-flows, count the
  trial there. Expected size, stated before the run (K-0064): if TLT beats IEF by about 15-25 bps over the window,
  the 40 % sleeve adds about 0.7-1.2 % a year gross. Turnover is about 160 % of NAV a month (40 % out of IEF into
  TLT and back), roughly 0.3-0.5 % a year at ETF tiers, and doubled costs take twice that. On a 60/40 volatility
  of about 9 %, that is a Sharpe gain of roughly 0.05-0.10, at or under the +0.10 bar. The most likely way it dies
  is a real mechanism (the placebo test passes) with a strategy margin just under the bar, or failing at doubled
  costs. Second most likely: the effect fades in the latest third. The paper reports a weaker 2015-2018 subperiod,
  and the reference year 2019 leaves only two post-publication years in dev. The window is a pure calendar rule
  known years ahead; no dates or episodes are used. ETFs have no forward data, so G4 is the ceiling.'
