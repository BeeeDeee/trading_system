id: H-0111
version: 1
title: Realized-skewness lottery premium, learned - LIQ-500 dollar-neutral weekly, LightGBM on half-day realized
  skewness, volatility, overnight variance share, reversal state and release flag, hold 5 days
author_agent: scout
family: skewness-lottery-preference
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Skewness-seeking traders (mostly retail, option-like stock buyers) who buy stocks after a run of
    right-tail half-days and pay a premium for lottery-like payoffs, and holders who dump crash-prone (left-tail)
    stocks beyond what their fundamentals justify. The long leg is paid by sellers of recently crash-shaped stocks,
    the short leg by buyers of recently lottery-shaped stocks.
  why: 'Investors who weight probabilities nonlinearly overpay for stocks whose recent return distribution has a
    salient right tail and underpay for stocks with a fat left tail (Barberis and Huang 2008). Amaya, Christoffersen,
    Jacobs and Vasquez (2015) measure this with weekly realized skewness from intraday returns: low-skew stocks
    beat high-skew stocks the following week, and the effect survives controls for volatility, kurtosis, size and
    the past return. The lab has no intraday stock bars, but it has each session split into an overnight (close
    to open) and an intraday (open to close) return, so 21 sessions give 42 half-day returns from which a realized
    skewness, a realized volatility and the share of variance that arrived overnight can be computed point-in-time.
    The claim is that the shape of the recent distribution, not its level or the last week''s return, predicts the
    next week''s cross-sectional rank, and that it does so mainly where the tail is salient (high volatility) and
    came from trading rather than from a scheduled news gap.'
  why_not_arbitraged: The premium is small per stock and per week, so harvesting it needs weekly turnover of a broad
    book, and the left-tail (long) stocks carry real crash risk that arbitrageurs with risk limits avoid; the right-tail
    (short) stocks have squeeze risk. Probability weighting is a preference, not a mistake that learning removes.
signal:
  description: 'Decision dates: the first trading day of each week, after its close (data up to that close); trades
    at the open of the next trading day; positions held until the next weekly decision (about 5 sessions). Inputs
    per stock j and session t, from sharadar_sep: the overnight return ret_co and the intraday return ret_oc as
    the loader defines them (the two parts of the session''s total return), the total return, and from sec_8k_item202
    the flag ea_reaction_day. Features at decision date t (each over the last 21 sessions ending at t, using the
    42 half-day log returns log(1+ret_co) and log(1+ret_oc) of those sessions; a stock needs at least 36 valid half-day
    returns, otherwise it is not scored at t): (1) rskew21 = sample skewness of the 42 half-day log returns; (2)
    rvol21 = their standard deviation; (3) onshare21 = sum of squared overnight log returns divided by the sum of
    all 42 squared half-day log returns (0..1); (4) ret5 = total return over the last 5 sessions; (5) ret21 = total
    return over the last 21 sessions; (6) ea21 = 1 if ea_reaction_day equals 1 on any of the last 21 sessions, else
    0 (NaN, i.e. before the company''s first EDGAR filing, counts as 0). All six features are z-scored across the
    point-in-time universe members of date t with the framework helper. Model: LightGBM (framework gbm) via lab.framework.ml.walk_forward
    on all member rows (all columns, non-members masked per row, no ever-member column lists), label = cross-sectional
    rank of the total return from the next open to the open 5 trading rows later (horizon_days 5, purged by the
    framework), expanding window, refit every 126 rows, num_leaves 15, learning_rate and other settings at the framework
    defaults, n_estimators from params. Scores are produced on every row; the book uses only weekly decision dates.
    Book (score_weights + only_on the weekly decision rows): among members with a score, long the top `tail` fraction
    of scores and short the bottom `tail` fraction, equal weight inside each leg, +0.5 gross long and -0.5 gross
    short (gross 1, dollar-neutral). Fewer than 100 scored members on a decision date, or no fitted model yet (before
    the first refit has enough training rows), means flat. A stock that leaves the universe between decisions is
    closed at the first decision row where the engine refuses its weight (no promise of holding it to the scheduled
    exit).'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    tail:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
mechanism_test:
  event: At a weekly decision date a member stock enters the top or bottom `tail` fraction of the gbm score (it
    was not in that tail at the previous weekly decision) while its 5-session total return lies between the 20th
    and 80th percentile of the scored members on that date; side +1 for the top tail (predicted winners, mainly
    low or crash-shaped skew), -1 for the bottom tail (predicted losers, mainly lottery-shaped skew).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'rskew21: realized skewness of the 42 half-day (overnight ret_co, intraday ret_oc) log returns of the last 21
    sessions - the lottery/crash shape of the recent distribution (Amaya et al.)'
  - 'rvol21: standard deviation of the same 42 half-day log returns - how salient the tail is; probability weighting
    needs a visible tail'
  - 'onshare21: share of the 21-session realized variance that arrived overnight - separates tails made by news
    gaps (overnight) from tails made by trading (intraday), where lottery demand acts'
  - 'ret5: last 5-session total return - short-term reversal state, so the skew effect is learned net of it'
  - 'ret21: last 21-session total return - one-month reversal/momentum state, the other control the literature uses'
  - 'ea21: an 8-K Item 2.02 release session in the last 21 sessions (sec_8k_item202) - a tail made by an earnings
    release is information that drifts (H-0028), not a lottery shape'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'Three conditional effects a ridge on the same six z-scores cannot express. (1) Probability weighting
    acts on a salient tail: the skewness slope should be steep in high-volatility stocks and about zero in quiet
    ones, so the return depends on skew times vol, not skew plus vol. (2) The sign of the skewness slope should
    flip with the source of the tail: a right tail made at an earnings release (ea21 = 1, onshare21 high) is news
    and drifts in its own direction (the lab''s reaction-drift evidence), while a right tail made intraday without
    a release is lottery demand and gives back; a ridge can shift the level for ea21 but cannot flip the skew slope.
    (3) The left tail is non-monotone: moderately negative skew earns the crash premium, extremely negative skew
    with a large negative ret5 is a falling stock still in a sell-off. Who pays: lottery buyers in the right-tail
    intraday-made names and forced or fearful sellers of left-tail names. If a ridge on the same features is as
    good, the effect is a plain linear skewness (or reversal) sort and the trees found nothing.'
