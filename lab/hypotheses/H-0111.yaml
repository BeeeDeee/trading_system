falsification_criteria:
- 'G1 mechanism: entries into the score tails with a middle-60 % 5-session return have a side-adjusted 5-session
  abnormal return under the 95th percentile of the time-shifted placebos, or a gross per event below the round-trip
  cost, or the predicted sign in fewer than 2 of 3 thirds of dev.'
- 'The latest third of dev has the wrong sign for the mechanism event (post-publication decay, K-0060): the card
  then treats the premium as gone, whatever the pooled result.'
- Net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills not above zero.
- Neighbors of n_estimators 100 or tail 0.1 do not beat the T-bill bar (fewer than 75 % of them).
- Doubled costs leave net Sharpe below the T-bill bar.
- 'A ridge on the same six features, same label, schedule and book (framework ridge) gives an equal or higher net
  Sharpe: the nonlinearity is not what pays and the card is a linear skewness sort.'
notes: 'Why this is not a refiled dead idea. The lab has never sorted on the shape of the return distribution. It
  differs from H-0069 (sign-independent extreme movers, one session), H-0036 (idiosyncratic-volatility fifth by
  weekday), H-0007 / H-0103 (overnight-intraday split as a reversal or metaorder signal) and the short-term-reversal
  family: the half-day split is used only to measure skewness and where variance arrived, the reversal state is
  a control feature, and the mechanism event excludes the 5-session return tails, so a pass cannot be the reversal
  of K-0133. If the filtered event fails while the strategy''s tails earn, read it as reversal and count it there.
  Mechanism test: entries into the model''s tails, not the gbm-versus-ridge disagreement design of K-0142, because
  the first question for a new family is whether a skewness premium exists in LIQ-500 at all; the ridge comparison
  is a stated falsification criterion for the strategy gates (K-0135 says it has never reached a gate; please run
  it if the card gets that far). Both sides are marked, from the same high-volatility part of the cross-section,
  so the beta gap between marked and unmarked stocks (K-0074) mostly cancels in the side-adjusted mean and the placebo
  mean should sit near zero. Forecasts, from condition arithmetic (K-0149): about 50 tail names per side per week,
  roughly half new entries, 60 % of those with a middle 5-session return, so about 25-35 events per weekly date
  on about 780 dates (scores start after the first refit, about 2006) = 20000-27000 events. Round trip about 11
  bps in LIQ-500 (K-0149). Gross per event: the paper''s 19 bps per week is a decile spread with intraday-measured
  skew on all stocks, so about 10 bps per leg at best before publication; a learned score concentrated in high-volatility
  names could reach 12-18 bps per entry (central), the quarter case is about 4 bps and the tenth case 1-2 bps; the
  central case only just covers cost, the pessimistic cases die on the cost ratio, which is the most likely death.
  Book arithmetic: always invested (gross 1, exposure far above the 0.2 floor), about 60 % of names replaced per
  week, cost drag about 3-4 %/y; at 15 bps per week gross the book earns about 7-8 %/y gross, 4 %/y net on a 6-8
  %/y volatility, Sharpe about 0.5-0.6, so even the central case is marginal for the absolute T-bill bar. Data period
  starts 2005-01-03 because the 8-K flag starts 2004-08 (K-0145: no empty first block). One attached field only
  (RAM). The half-day returns need both ret_co and ret_oc of the same session; a session with either missing is
  dropped from the 42. Brief: US stocks, 5-day hold, learned model, followed as written.'
