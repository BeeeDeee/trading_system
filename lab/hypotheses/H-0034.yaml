# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0034
version: 1
title: Non-earnings 8-K news-reaction drift - LIQ-500, follow large standardized reactions on sessions with a non-earnings
  8-K filing, fixed event slots, hold 5 days
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who anchor on the pre-news price or process the news slowly (inattentive holders, analysts
    who revise late, rule-based funds that rebalance on a schedule), and liquidity providers who fade large moves
    on the assumption that they are non-informational; they sell to (buy from) the strategy after good (bad) news
    too cheaply (too dearly).
  why: 'Investors under-react to firm-specific news they have to process themselves. When a disclosed corporate
    event (merger agreement, executive departure, guidance, financing, litigation, regulatory decision, filed as
    an 8-K) moves the price, the first-session move is incomplete and the price keeps drifting in the same direction
    for several sessions (Chan 2003, news versus no-news; Jiang, Li and Wang 2021, news-driven returns drift for
    days without reversal, more so when attention is scarce). The lab has seen exactly this for earnings news: the
    release-session reaction on real 8-K Item 2.02 dates predicted same-direction returns in LIQ-500 far above the
    placebo cloud, positive in every third (K-0043, H-0028). Non-earnings news is less anticipated, gets less analyst
    coverage and no consensus benchmark, so if anything the under-reaction should be larger. The same lab also found
    that large moves on sessions WITHOUT an earnings release reverse (H-0030), but that set mixed true non-earnings
    news with pure liquidity moves; identifying the news with the filing is what separates drift from reversal.'
  why_not_arbitraged: Each event is a single-name bet with jump risk over a few days; events arrive at random, so
    a book holds only a handful of names at a time and cannot be scaled; non-earnings 8-K events are heterogeneous
    and need a filing feed plus a reaction measure, which most quantitative books do not track; and the short leg
    follows bad news, where borrowing and squeeze risk deter shorts.
signal:
  description: 'Inputs per stock: daily total return r(i,t) = (1 + ret_co) * (1 + ret_oc) - 1; LIQ-500 point-in-time
    membership; ea_reaction_day (sec_8k_item202) and nonearn_8k_reaction_day (sec_8k_items, requested below). Decision
    after the close of session t, using data up to that close only. (1) Abnormal return a(i,t) = r(i,t) minus the
    equal-weight mean of r over all LIQ-500 members with a valid return on t. (2) sigma(i,t) = standard deviation
    of a(i,.) over sessions t-60 .. t-1, at least 40 valid values, otherwise no event. (3) z(i,t) = a(i,t) / sigma(i,t).
    (4) Event on (i,t) when ALL of: i is a LIQ-500 member at t; nonearn_8k_reaction_day(i,t) = 1; ea_reaction_day(i,s)
    = 0 (not 1 and not NaN) for every s in t-2 .. t; |z(i,t)| >= z_threshold. Side = sign(z(i,t)). (5) Book: each
    event gets a fixed slot of target weight side * 0.10 (slot size is a fixed design constant, not tuned), bought/sold
    at the open of t+1 and held for hold_days sessions (exit at the open of session t+1+hold_days). If a stock with
    a live slot has a new event, the new event replaces the old slot (new side, clock reset). If the sum of absolute
    target weights exceeds 1.0, all live slots are scaled down pro rata to gross 1.0 on that date (no leverage);
    otherwise slots keep their 0.10 size and the remainder is cash. No hedge basket: long slots (good news) and
    short slots (bad news) offset each other only partly, so net market exposure varies and is part of the test.
    A stock that leaves the LIQ-500 universe or is not tradable while a slot is live is closed at the next open
    it can be traded (weight 0). Missing inputs (NaN flags, short history) mean no event, never a filled value.
    Daily decision schedule; trading only happens on dates where a slot opens, closes or is rescaled.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_threshold:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 stock has a non-earnings 8-K reaction session t (nonearn_8k_reaction_day = 1, no Item 2.02 reaction
    session in t-2 .. t) on which its return minus the universe mean, divided by its own 60-session standard deviation
    of that abnormal return, is at least 2.0 in absolute value. Side = sign of that standardized reaction (+1 after
    a large positive reaction, -1 after a large negative one).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
