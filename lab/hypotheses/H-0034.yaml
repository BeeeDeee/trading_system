falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is not above the 95th percentile of the
  200 time-shifted placebos, or keeps its sign in fewer than 2 of 3 sub-periods.'
- 'Mechanism: the gross side-adjusted 5-session abnormal return per event is below the round-trip cost of trading
  it (cost ratio < 1).'
- 'Mechanism (news vs no-news): the side-adjusted abnormal return is negative at the 5-session horizon, i.e. non-earnings
  8-K reactions reverse like the no-news moves of H-0030; then filing-identified news does not separate drift from
  reversal in LIQ-500.'
- 'Strategy: net Sharpe on dev below T-bill Sharpe + 0.10 or below the absolute bar of 0.5, or the bootstrap bound
  of the Sharpe difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (z_threshold 1.5 / 2.5, hold_days 3 / 7) beat the T-bill bar, or
  the book no longer beats it at costs x2.'
- The latest third of the dev period (roughly 2015-2020) has a negative net return (fade after publication).
notes: 'Brief fit: short horizon (5 sessions), US single stocks, cross-sectional, LIQ-500, mechanism test declared.
  FAMILY: filed under post-earnings-announcement-drift on purpose. The economic mechanism (under-reaction to the
  market''s own reaction to firm-specific news) is the one H-0028 found for earnings news; Jiang-Li-Wang treat PEAD
  as a special case of it. The events are disjoint from H-0024/H-0028/H-0031/H-0033 (earnings sessions are excluded),
  so this is not a near-copy, but the trials should count together; the Chair may decide otherwise. It is not H-0009
  (volume shock as news proxy, disposition gate) and it is the complement of H-0030 (non-earnings moves read as
  no-news): this card asks whether those sessions that carry a filed corporate event behave like news (drift) rather
  than no-news (reversal). WHY NEW DATA: essential. Every price/volume news proxy in the lab failed or was unvalidated
  (H-0008, H-0009, H-0015, K-0035); the only events that worked were dated by EDGAR. The requested sec_8k_items
  is the same EDGAR submissions fetch that already produced sec_8k_item202 (the items field of each filing), so
  it should be cheap; it would also let H-0030-style no-news tests exclude M&A/guidance news, which that lesson
  asked for. GROSS ESTIMATE (K-0042): LIQ-500 firms file roughly 5-10 non-earnings 8-Ks a year, so a few thousand
  candidate sessions per year; if 10 % have |z| >= 2, about 300-500 events a year, 1-2 per session, about 6-10 live
  slots at 0.10 each, i.e. mean gross roughly 0.6-1.0 (well above the 20 % exposure floor; even a 3x lower event
  rate keeps it above). Per-event round trip is about 0.10 * 2 * 3-6 bps; with an effect of E bps per event over
  5 sessions the book earns about events/yr * 0.10 * (E - round trip). Fixed slots with no pro-rata shrinking (except
  at the gross cap) and no hedge basket keep the book close to the equal-weight event study, which K-0042 named
  as the main suspect in H-0028''s study-vs-book gap. Non-earnings 8-Ks are far less date-clustered than earnings
  releases, so the cap should rarely bind. RISKS / how it most likely dies: (1) 8-Ks can be filed up to four business
  days after the event; when the press release came earlier, the filing session shows no large move and is filtered
  out by the z rule, but some filed sessions may catch the tail of an earlier reaction; (2) many 8-Ks (7.01 slides,
  2.03 debt issues, 8.01) are routine, so the large reactions may still be mostly liquidity moves that reverse (then
  falsification 3 tells the lab something useful); (3) EDGAR coverage misses some CIKs and leans toward survivors
  (K-0035); (4) unhedged net exposure adds market noise and the short slots follow bad news (squeeze risk, no borrow
  cost modelled); (5) dev starts in late 2004 (no 8-K items before the reform), about 16 years. G0 note (K-0045):
  the synthetic market must carry both flags or the look-ahead check is vacuous; the Builder should report the event
  count G0 sees. No dates, no named stocks; the 60-session window, slot size 0.10 and the 2.0 threshold are round
  values chosen before seeing any data.'
