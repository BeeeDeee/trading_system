references:
- cite: 'Chan (2003) Stock price reaction to news and no-news: drift and reversal after headlines, Journal of Financial
    Economics'
  year: 2003
- cite: 'Jiang, Li, Wang (2021) Pervasive underreaction: Evidence from high-frequency data, Journal of Financial
