falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the marked coins on shock dates is not above the 95th percentile
  of the 200 time-shifted placebos. That means the funding sort is no stronger after a US volatility shock than
  on random dates, and the transmission claim is false in this form.'
- 'Mechanism: the mean gross abnormal return per event is below the round-trip cost of the perps traded (cost ratio
  < 1).'
- 'Mechanism: the sign is predicted in fewer than 2 of the 3 dev blocks, or the latest block (2022) is wrong-signed.
  The latest-third sign is a kill condition stated in advance (K-0060).'
- 'Mechanism shape: the abnormal return is no larger at 3-5 days than at 1 day, or keeps growing to 10 days like
  the placebo. A deleveraging unwind should mostly happen within the week.'
- 'Strategy: net Sharpe on dev below 0.5, or the stationary-bootstrap bound of the Sharpe difference vs T-bill at
  or below 0.'
- 'Robustness: fewer than 75 % of the grid neighbors (vix_shock 0.075/0.125, funding_days 3/14) beat T-bill, or
  Sharpe at 2x costs is below T-bill.'
- 'Leg check (reported if G1 runs the book): if the long low-funding leg earns all the gain and the short high-funding
  leg loses, the crowding-unwind reading is wrong even if the total passes (K-0207).'
notes: 'Brief fit: the signal comes from the US equity options market (VIX via FRED) and the trades are in Binance
  perps, held 5 days, with a mechanism test declared. Why this is not a retry. (a) H-0166 (same family) put funding,
  basis and flush with a VIX shock into a LightGBM and never scored a single shock date. Model warm-up and a year-long
  VIX baseline used up the short perp window. Its lesson names this plain rule (VIX change only, short baseline,
  funding sort) as the open test of the channel. This card has no model and no VIX history beyond the previous observation,
  so every shock date from early 2020 can be scored (the 60-row beta needs about two months from the panel start).
  (b) H-0039 (perp-leverage-crowding) ran the funding sort on all weeks. It barely cleared the placebo and failed
  cost. Here the placebo is exactly that unconditional sort on shifted dates, so the gate tests the interaction
  directly. I kept the family crypto-flight-to-quality because the claim is TradFi-to-crypto transmission (as in
  H-0166), but the Chair may count it against perp-leverage-crowding too. (c) H-0081 gated a return-reversal sort
  by the VIX level. This card gates a positioning sort by a VIX change, and its sign is continuation of the unwind,
  not reversal. (d) K-0074 beta confound: both legs take 3 coins from each BTC-beta half, so the long and short
  legs are roughly beta-matched. The peers (the middle-funding coins of each half) come from both halves too, so
  no side is systematically higher-beta than its peers. Forecasts, written down in advance (K-0098, K-0120). These
  are rough base rates, not dev counts: daily VIX log changes of +10 % or more happen on the order of 8-10 % of
  US sessions, so about 20-25 shock dates a year, roughly 55-75 in 2020-02..2022-12. Events = 12 per date, so about
  650-900 marked events on 55-75 dates (minimum 200 on 30). Shocks cluster, so the union of 5-day windows is perhaps
  45-60 windows, 225-300 of about 1050 days. Mean exposure is about 0.2-0.3 at gross 1, right at the 0.20 floor:
  that is the most likely strategy failure even if the mechanism passes. Round trip: the top-30 perps sit in several
  crypto_perp cost tiers. Take 40-90 bps per position round trip from the weakest tier (K-0120 saw about 91 bps
  on a similar universe). Gross per event must clear that. The claim is a multi-percent 5-day spread in stress weeks,
  and short legs also collect funding (not in the event study, in the book). Expected result by leg: the short high-funding
  leg carries the effect, the long leg is mainly the hedge. Latest third: 2022 had many shock dates and broad deleveraging,
  so a wrong sign there kills it. The dev window is one boom-and-bust cycle (K-0006), so a near miss is a cannot-tell.
  Holdout 2023+ and forward Binance data exist, so the card can in principle reach G5. Timing: the VIX close is
  usable about 27 hours after the US close (next_morning clock on a UTC calendar). Fast liquidations are missed
  by design, and the claim is the slower risk-budget unwind of the following days.'
