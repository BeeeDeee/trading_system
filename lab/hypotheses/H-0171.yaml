id: H-0171
version: 1
title: VIX jumps unwind crowded crypto leverage, plain rule - top-30 Binance perps dollar-neutral, short high /
  long low 7-day funding within BTC-beta halves, hold 5 days
author_agent: scout
family: crypto-flight-to-quality
asset_classes:
- crypto_perp
- macro
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: Leveraged long holders of crowded perps (trend-chasing retail on high-leverage accounts, and multi-asset
    funds whose risk limits tighten after a VIX jump) who must cut size into thin books after a shock outside crypto.
    They pay the liquidity provider who is short the crowded coins and long the uncrowded ones.
  why: 'Perpetual funding measures how much leveraged long demand a coin carries: when longs crowd in, they pay
    shorts a high funding rate to keep the perp near spot. Schmeling, Schrimpf and Todorov (Crypto carry) find that
    high carry comes from trend-chasing small investors who want leveraged upside, that arbitrage capital is scarce,
    and that high carry predicts crashes. A crash needs a trigger. A jump in US implied volatility is a trigger
    from outside crypto that cuts the risk budget of every multi-asset holder at once. Vol-targeting and VaR-limited
    funds, cross-margined traders and prime-brokered desks reduce gross exposure over the following days as the
    higher volatility enters their risk windows (funding liquidity spirals, Brunnermeier and Pedersen). In crypto
    the positions cut first are the most levered and most crowded, the perps whose longs pay the most funding. Liquidations
    there push other levered longs over their margin limits. Perps whose funding is low or negative have few levered
    longs to unwind and may see short covering. So after a US volatility shock, high-funding perps should lag low-funding
    perps over the next several days, more than the same sort does on ordinary days. The test is about this interaction,
    not funding level alone.'
  why_not_arbitraged: Taking the other side means shorting high-momentum, high-volatility coins just as crypto volatility
    jumps, with squeeze risk and margin calls of its own. Arbitrage capital is scarcest exactly then, because the
    same shock tightens the providers' own funding (the Brunnermeier-Pedersen channel). The edge exists only on
    a few dozen shock dates a year, and capacity in altcoin perps is small, so large funds do not run it.
signal:
  description: 'Data and clock: Binance USD-M perps (binance_perp_1d), daily UTC bars, decision after the 00:00
    UTC close of crypto day t, fills at the open of day t+1. Universe: point-in-time top 30 perps by 30-day quote
    volume (crypto_top_n, n = 30), BTCUSDT.P and ETHUSDT.P included as ordinary members. VIX: FRED VIXCLS (fred_macro.VIXCLS,
    clock next_morning), so the close of US session d is first usable on crypto row d+1. (1) Shock: on each crypto
    row t, take the most recent VIX observation usable at t. If it was first usable on row t (a new observation)
    and log(VIX_obs / VIX_previous_obs) >= vix_shock, where VIX_previous_obs is the observation just before it,
    row t is a shock date. Weekend and holiday rows carry no new observation and never fire. The VIX change needs
    no history beyond the previous observation, so there is no warm-up. (2) Crowding: for every universe member
    at t, crowd = mean of the daily funding (extras funding, the day''s sum of funding rates, known after the close)
    over the last funding_days rows up to t. Needs funding_days valid values, otherwise the coin is ineligible.
    (3) Beta halves: beta = OLS slope of the coin''s daily close-to-close return on BTCUSDT.P''s over the last 60
    rows up to t, with at least 45 valid pairs, otherwise ineligible. Split the eligible members at the median beta
    into a low-beta and a high-beta half (BTCUSDT.P itself has beta 1 and is placed by that value). (4) Book on
    a shock date: within each half, rank eligible coins by crowd. Short the 3 highest and long the 3 lowest. 12
    positions, weight 1/12 each (gross 1.0, dollar-neutral, each leg holds 3 coins from each beta half). Ties are
    broken by higher 30-day quote volume. If a half has fewer than 6 eligible coins, no book is opened on that date.
    (5) Holding: positions are held for 5 crypto days and closed at the open of day t+6 (entry at the open of t+1).
    If a new shock date comes while a book is open, the old book is replaced by the new ranking at the next open,
    and the 5-day clock restarts. A coin that leaves the top-30 universe while held is closed at the first decision
    row where it is no longer a member and is not replaced. Outside the 5-day windows the book is flat (cash). Funding
    is charged by the engine: shorts in high-funding coins receive it, longs in low-funding coins pay little or
    receive it. There is no other filter.'
  params:
    funding_days:
      grid:
      - 3
      - 7
      - 14
      value: 7
    vix_shock:
      grid:
      - 0.075
      - 0.1
      - 0.125
      value: 0.1
  timeframes:
  - 1d
mechanism_test:
  event: 'On a shock date t (a new VIX observation whose log change from the previous observation is >= vix_shock),
    the 12 coins the book picks: the 3 highest-funding coins in each BTC-beta half get side -1 and the 3 lowest-funding
    coins in each half get side +1. The other eligible top-30 members on that date are the unmarked peers. Return
    from the open of t+1 to the close of t+h, side-adjusted, minus the peer mean. The time-shifted placebo puts
    the same sort on random dates, so it measures the plain funding sort on ordinary days (the H-0039 effect). Beating
    it is the claim: the shock adds to the sort.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
