id: H-0146
version: 1
title: Empire-building overinvestment, learned - LIQ-500 long-only 6-month cohorts of the top fifth of a LightGBM
  score on asset growth x cash-flow discretion x ROA change
author_agent: scout
family: asset-growth-overinvestment
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who extrapolate the growth story of expanding firms and pay for the new capital at its
    book value or more (growth funds, index-weight followers that buy bigger balance sheets, analysts rewarding
    revenue growth), and the shareholders of empire builders who hold on while managers spend the free cash flow.
    On the long side the counterparty is whoever sells dull, cash-rich, slow-growing firms that do not expand.
  why: 'Firms that sharply expand their asset base and capital spending earn lower returns over the following years
    (Titman, Wei and Xie 2004; Cooper, Gulen and Schill 2008). Titman, Wei and Xie find the negative relation concentrated
    where managers have discretion: high operating cash flow and low debt, i.e. where free cash flow can fund empire
    building without the discipline of creditors (Jensen''s free-cash-flow problem). Investors underreact to what
    the extra investment implies, because the bad news shows up only slowly as falling returns on the new capital.
    The q-theory rival says high investment is fine when the expected return on capital is high. So the two stories
    make opposite predictions only inside a cell: growth that comes with high discretion and no improvement in profitability
    is overinvestment, growth that comes with rising ROA or that is debt-financed is not. The card claims that this
    conditional cell, and its mirror (low-growth, cash-rich, low-debt firms that are not wasting their cash flow),
    predicts returns over the following months, and that the plain linear asset-growth slope is a diluted average
    of it.'
  why_not_arbitraged: The payoff is slow (quarters to years), comes with long stretches of underperformance against
    growth stocks, and the information arrives in 10-Q/10-K balance sheets that get less attention than earnings
    headlines. A benchmarked manager who bets against expanding growth firms carries large tracking error for years;
    the short side of high-growth firms is costly to hold through bull markets. Capacity is large but the Sharpe
    per year is modest, which keeps hedge-fund capital small relative to the flows that buy growth.
signal:
  description: 'Inputs (all point-in-time): sharadar_sep total returns; sharadar_sf1 ART (trailing twelve months,
    as reported, usable from the day after the SEC filing, NaN when stale per the loader) fields assets, capex,
    ncfo, debt, roa. Features per stock and decision date t (values as known at the close of t; the value "252 rows
    earlier" is the daily matrix value as it was known 252 trading rows before t, never a restated value), each
    z-scored across the point-in-time LIQ-500 members of date t with the framework helper, winsorized by the helper''s
    default: (1) asset_growth = log(assets_t / assets_{t-252}); (2) capex_change = |capex_t| / assets_t - |capex_{t-252}|
    / assets_{t-252} (abnormal capital spending); (3) cash_flow = ncfo_t / assets_t (free cash at managers'' discretion);
    (4) leverage = debt_t / assets_t (creditor discipline); (5) roa_change = roa_t - roa_{t-252} (is the new capital
    earning?); (6) ret_12_1 = total return from the close of t-252 to the close of t-21 (firms invest after run-ups;
    the model must separate investment from price momentum). A stock-date is scored only if it is a LIQ-500 member
    on t and all six features are finite and assets_t and assets_{t-252} are > 0; otherwise it has no score. Non-members
    are masked per row, never removed as columns (K-0134); no column, row or sample is chosen with information from
    after t. Label: total return from the open of t+1 to the open of t+1+60 rows, ranked across the universe on
    each date (framework label, horizon_days 60, purged by the framework). Model: framework gbm (LightGBM) via lab.framework.ml.walk_forward,
    expanding window, refit every 63 rows, fixed hyperparameters n_estimators 100, learning_rate 0.05, min_child_samples
    2000, subsample 0.8, colsample 1.0; num_leaves is the grid parameter (value 8). Seeds and compute budget are
    the framework''s. Book (score_weights -> only_on): decisions on the first trading day of each month, after the
    close, trades at the next open. At each decision a new cohort is formed: the top `top` fraction (value 0.2)
    of scored members by model score, equal weight. Each cohort is held for 126 trading rows (six months) and carries
    1/6 of the book; the book is the sum of the six live cohorts (a stock in several cohorts holds the sum of its
    weights), long only, gross <= 1. A stock that leaves LIQ-500 or delists is sold at the next open (its weight
    is dropped, not redistributed); delisting returns are the engine''s. While fewer than six cohorts exist (warm-up),
    the missing cohorts'' share is held in cash. Before the first model fit there is no score and the book is flat.
    A cohort with fewer than 20 scored members is not formed (its share is cash).'
  params:
    num_leaves:
      grid:
      - 4
      - 8
      - 16
      value: 8
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
  - 1y
mechanism_test:
  event: At a monthly decision date a scored LIQ-500 member newly enters the top fifth of the model score (side
    +1, predicted to outperform) or newly enters the bottom fifth (side -1, predicted to underperform), having not
    been in that fifth at the previous monthly decision.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
ml:
  features:
  - 'asset_growth: log change of ART total assets over 252 rows (sharadar_sf1 sf1_art_assets, point-in-time by filing
    date) - the investment the overinvestment story is about'
  - 'capex_change: change over 252 rows of |ART capex| / ART assets (sf1_art_capex, sf1_art_assets) - abnormal capital
    spending as in Titman-Wei-Xie'
  - 'cash_flow: ART operating cash flow / ART assets (sf1_art_ncfo) - free cash at managers'' discretion, the condition
    under which growth becomes empire building'
  - 'leverage: ART debt / ART assets (sf1_art_debt) - creditor discipline; debt-financed growth is the case where
    overinvestment should not show'
  - 'roa_change: ART ROA minus its value 252 rows earlier (sf1_art_roa) - separates productive investment (q-theory,
    ROA rising) from wasteful investment (ROA flat or falling)'
  - 'ret_12_1: total return from t-252 to t-21 (sharadar_sep) - firms invest after run-ups; lets the model separate
    the investment signal from price momentum and long-term reversal'
  horizon_days: 60
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is conditional: high asset growth and rising capex predict low returns only when cash
    flow is high and debt is low (managerial discretion, Titman-Wei-Xie) and ROA is not improving; with low cash
    flow, high debt or rising ROA the same growth is financed under discipline or is productive and should carry
    no penalty. That is a three-way product/threshold structure (growth x discretion x no-ROA-gain). A ridge on
    the same six z-scored features fits one slope per feature: it spreads the penalty over all expanding firms,
    so it shorts (here: avoids) productive growers and buys any slow grower, and it cannot express that cash flow
    is good news for non-investing firms but bad news for investing ones (the sign of the cash-flow slope flips
    with growth). A depth-limited tree ensemble with 8 leaves can isolate those corners. Who pays: holders of the
    cash-rich expanding firms in the discretion cell, who are the underreacting counterparty; the linear model''s
    diluted signal is what the plain asset-growth anomaly already offers, and if the ridge is as good the interaction
    claim is false.'
data_requirements:
- dataset: sharadar_sep
  frequency: 1d
- dataset: sharadar_sf1
  fields:
  - sf1_art_assets
  - sf1_art_capex
  - sf1_art_ncfo
  - sf1_art_debt
  - sf1_art_roa
  frequency: 1q
holding_period:
  rebalance: monthly
  typical_days: 126
market_exposure: long_only
references:
- cite: Titman, Wei and Xie (2004) Capital Investments and Stock Returns, Journal of Financial and Quantitative
    Analysis 39(4)
  year: 2004
- cite: Cooper, Gulen and Schill (2008) Asset Growth and the Cross-Section of Stock Returns, Journal of Finance
  year: 2008
falsification_criteria:
- Net Sharpe of the book on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or
  below zero.
- Fewer than 75 % of the grid neighbours of num_leaves 8 and top 0.2 beat SPY_TR, or their median Sharpe is below
  0.70 of the primary's.
- 'Mechanism: new entries into the top fifth (side +1) and bottom fifth (side -1) of the score earn a side-adjusted
  60-session abnormal return that does not exceed the 95th percentile of the time-shifted placebos, or has the predicted
  sign in fewer than two of three dev blocks, or does not cover the round-trip cost.'
- 'Decay: the latest third of dev is wrong-signed in the mechanism test (K-0060); the card treats that as a refutation
  even if the pooled test passes.'
- 'Shape: the abnormal return at 60 sessions is not larger than at 21 sessions (a slow fundamental mispricing must
  build; a front-loaded effect would be a filing-day reaction, not overinvestment).'
- 'A ridge regression on the same six features with the same schedule and book (framework ridge) is as good as or
  better than the gbm: then the discretion interaction does not pay and the card is only the published linear asset-growth
  anomaly.'
- 'Publication decay: post-2008 excess Sharpe below half of the pre-2008 excess Sharpe (G2 check).'
notes: 'Brief: long horizon (6-24 months), US single stocks, learned model. The schema caps the label and the mechanism
  horizon at 60 rows, so the label is the longest allowed (60 rows, about one quarter) and the holding period is
  126 rows through six overlapping monthly cohorts; the features change only at quarterly filings, so a 60-row prediction
  is the first part of the same signal the six-month position earns, and the mechanism test sees the first 60 sessions
  of each cohort (K-0076). This mismatch is forced by the schema, not chosen. Relation to earlier work: study 11
  (LightGBM on fundamentals, insiders and 13F, monthly top 50 of LIQ-1000) failed with 15x/year turnover and a fishing-net
  feature set; this card has six features with one stated interaction, a six-month cohort book (expected turnover
  about 2x/year one-way, since a cohort is replaced only every six months and the score moves mostly at filings)
  and a named linear control. H-0059 (rd-investment-underreaction) is a different mechanism (positive drift after
  R&D increases, intangible investment); H-0032 used asset growth inside a composite only in a 5-session earnings
  window (anomalies-at-earnings-news); neither tests capital-investment overinvestment over months, so a new family
  is used; the Chair may merge it with rd-investment-underreaction if it sees the same mechanism. Same-stock placebo
  (K-0025, K-0111): asset growth and capex changes are not persistent stock identities; a firm''s growth spikes
  in some years and not in others, so the events are new entries into the score tails and the placebo shifts them
  to dates when the same firms were not expanding. Expected numbers (forecasts, to be checked): scored LIQ-500 members
  about 380-450 per date (financials and firms without capex/ncfo drop out or score in the middle); first fit after
  about two years of history (features need 252 rows, labels 60, plus the framework''s minimum sample), so the first
  dev block has fewer events (K-0163); new entries per side per month about 8-15, so about 3500-6500 events on about
  240 monthly dates. Gross per event: the literature puts the large-cap asset-growth quintile spread at a few percent
  a year; per side against the universe mean over 60 sessions that is about 30-60 bps, against a round trip of about
  12 bps in LIQ-500 (6 bps half spread, x2.5 before 2001-04), so cost ratio about 2.5-5. Placebo bar: monthly entries
  with 60-session overlapping windows make the cloud wide (H-0054''s bar lay above cost), so a ''cannot tell'' near
  miss is a real outcome. Beta gap (K-0074): the long tail (slow-growing, cash-rich, low-debt) is likely lower beta
  than the peers and the short tail higher, so in a rising market the side-adjusted test is biased against the card
  by roughly 10-25 bps per 60 sessions; stated in advance, not a rescue. By side (K-0172): I expect the bottom-fifth
  (overinvestor) side to carry more of the event average than the top-fifth side, but the book is long-only, so
  a pass that lives only on the bottom side would not make the book. Strategy arithmetic (K-0064): the book is an
  equal-weight, always-invested ~100-name selection of LIQ-500 against cap-weighted SPY_TR, so part of any margin
  is equal weighting and the value/quality tilt of slow growers; no core-only control exists (K-0153). I expect
  the book to carry most of its margin in the first dev third (2000-2002 growth bust), which G2''s block-share rule
  (max 60 %) may punish; that is the likeliest strategy death. The ridge control is named but the gate has never
  run it (K-0135); please report it if possible, and if the ridge side wins, the lab learns that the linear asset-growth
  anomaly, not the interaction, is the object.'
