id: H-0052
version: 1
title: Macro-release volatility crush - short the VIX-futures ETP (VIXY) over the open-to-open step containing each
  scheduled CPI, payrolls or FOMC release plus one step, bond and gold ETFs as unmarked peers
author_agent: scout
family: macro-announcement-premium
asset_classes:
- us_etf
- macro
universe:
  instruments:
  - VIXY
  - SHY
  - IEF
  - TLT
  - AGG
  - GLD
  kind: instruments
mechanism:
  counterparty: Hedgers and leveraged long-volatility holders who pay up for protection over a known event (portfolio
    managers hedging release risk, VIX-call and VIX-ETP buyers), and who keep doing so because the hedge is mandated
    or worth more to them than its average cost; the premium goes to whoever sells volatility over the release.
  why: 'Scheduled macro releases (CPI, the Employment Situation report, FOMC statements) are known dates on which
    a lump of macro uncertainty is resolved. Ahead of them, investors buy protection against the release outcome,
    so equity implied volatility and the VIX futures curve carry an event premium; once the number is out the uncertainty
    is gone and implied volatility falls on average, whatever the news (Ederington and Lee 1996 for scheduled releases
    in rates and FX options; Fernandez-Perez, Frijns and Tourani-Rad 2017 for VIX and VIX futures falling after
    FOMC announcements). The signal comes from a different market than the trade: the macro release calendar (BLS
    and Fed schedules) decides when to sell equity volatility, through the short-term VIX-futures ETP VIXY. The
    claim is specific to the timing: VIXY should fall over the release window by more than its ordinary roll-down
    in a random window of the same length. This is the variance side of the macro-announcement premium the lab tested
    in equities (H-0042, H-0045); it changes the instrument, as K-0063 and K-0065 asked, from equity-versus-bond
    price levels to the price of macro risk itself, where the resolution of uncertainty should show directly and
    larger relative to cost.'
  why_not_arbitraged: 'Selling volatility into a release is exactly selling crash insurance on the day a crash is
    most likely to start: the payoff is negatively skewed, margin-intensive and capped by dealers'' and vol sellers''
    risk budgets, so the premium persists as compensation for jump risk. VIX ETP shorts also carry borrow fees and
    recall risk.'
signal:
  description: 'Inputs: macro_release_calendar_1d keys next_cpi_sessions, next_empsit_sessions, next_fomc_sessions
    (XNYS sessions from session s to the next CPI / Employment Situation / scheduled FOMC statement strictly after
    s, known at the close of s), and VIXY daily bars. Release timing: CPI and the Employment Situation are published
    at 08:30 ET, before the open, so for such a release on session d the open-to-open step that contains it is [open
    d-1, open d); FOMC statements come in the afternoon of d, so the step that contains it is [open d, open d+1).
    Rule: after the close of session s, a release step starts at the next open if next_cpi_sessions(s) == 2 or next_empsit_sessions(s)
    == 2 (release on s+2, step [open s+1, open s+2)) or next_fomc_sessions(s) == 1 (release on s+1, step [open s+1,
    open s+2)). The target position for the step starting at the open of s+1 is weight -1.0 in VIXY (short, full
    gross) if that step is a release step or one of the post_steps steps that follow a release step; otherwise 0
    (cash). Overlapping windows simply merge (the short is held while any window is active, never doubled). Decisions
    after every close, trades at the next open. SHY, IEF, TLT, AGG and GLD are never traded: they are in the universe
    only as unmarked peers for the event study. If VIXY has no bar on a session the position is unchanged; if the
    calendar keys are missing for a session (rows end before the dataset end) the strategy holds no position and
    the Builder raises if more than 5 consecutive dev sessions lack calendar data (K-0010). No lookback, no estimated
    parameter, no instrument selection.'
  params:
    post_steps:
      grid:
      - 0
      - 1
      - 2
      value: 1
  timeframes:
  - 1d
mechanism_test:
  event: 'VIXY is marked with side -1 after the close of session s when a scheduled release falls in the next open-to-open
    step: next_cpi_sessions(s) == 2 or next_empsit_sessions(s) == 2 (08:30 release before the open of s+2) or next_fomc_sessions(s)
    == 1 (afternoon statement on s+1). SHY, IEF, TLT, AGG and GLD are never marked and serve as same-date peers,
    so the abnormal return is VIXY against bond and gold ETFs, not against equities (whose own announcement premium
    would otherwise leak into the measure). With a 2-day horizon the measured window is open s+1 to close s+2: for
    08:30 releases it spans the release and the release session, for FOMC the statement session and the next one.
    Expected about 30 event dates a year, about 300 marked events on about 300 dates in 2011-2020.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 2
