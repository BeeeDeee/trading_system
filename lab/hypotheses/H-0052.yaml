falsification_criteria:
- 'Mechanism: the side-adjusted VIXY return against the bond and gold peers over the 2-day window is not above the
  95th percentile of the time-shifted placebos (which carry the same VIXY roll-down), i.e. release timing adds nothing
  to ordinary short-volatility carry.'
- 'Mechanism: gross abnormal return per event below the round-trip cost of VIXY, or the latest third of dev (about
  2017-2020) has the wrong sign (K-0060).'
- 'Mechanism shape: the 1-day horizon carries no part of the effect while 3 and 5 days are larger, which would mean
  generic roll-down drift rather than a release-time crush.'
- Net Sharpe on dev below 0.5 or below T-bills + 0.10, or the bootstrap bound of the difference below zero.
- Neighbors post_steps 0 and 2 do not beat T-bills (G2), or the book fails at doubled costs.
- 'The book does not beat random-timed short-VIXY books with the same turnover and exposure (G2 random entry): that
  would mean the return is short-volatility carry, not the release.'
notes: 'Brief fit: short horizon (two open-to-open steps per release) and cross-asset (a macro calendar decides
  the timing, equity volatility is traded); the closest real mechanism I found that is not a daily lead-lag between
  prices (killed by study mrel) and not a stress rebound (K-0056). Family: reused macro-announcement-premium because
  the economic story (resolution of scheduled macro uncertainty is priced) is the same as H-0042 and H-0045; this
  card changes the instrument from equity-vs-bond price levels to VIX futures, which K-0063 and K-0065 named as
  the remaining route. Expected size, stated before seeing data (K-0053, K-0064): the 2017 paper reports a short
  front-month VIX future on FOMC days earning about 10 % a year from 8 days, i.e. on the order of 1 % per FOMC day;
  CPI and payroll days are expected smaller. VIXY daily volatility is several percent, so with about 300 events
  the standard error of the mean is a few tenths of a percent: an effect of half a percent or more per event should
  clear the placebo bar, one of a tenth would not. Round-trip cost of VIXY is a few to ~20 bps depending on the
  tier, so cost should not bind if the effect exists. Design choices made on mechanism grounds, not results: entry
  at the open is forced by the engine, so for 08:30 releases the short must already be on the evening before (step
  [open d-1, open d)); post_steps = 1 is the minimal window that also keeps a little of the slower post-release
  decline the 2017 paper describes and gives mean exposure of roughly a quarter of sessions (above the 0.20 floor;
  post_steps 0 would be about an eighth). Peers exclude equities on purpose (Savor-Wilson premium would inflate
  the measure); at least five unmarked peers with data on every date (K-0055); VIXY starts in January 2011 and VXX
  is left out because the original ETN matured in 2019 and the ticker history is split. Known weaknesses: (1) short
  volatility has jump risk: a vol spike inside a window costs tens of percent of the book in a day; with gross 1.0
  on one instrument the drawdown can be deep, and that is a legitimate way to die. (2) Borrow fees on VIXY are not
  modelled by the engine as far as I know, so a pass is slightly flattered (exposure ~25 % of the time, so on the
  order of 1 %/yr at most). (3) Calendar is realized, not vintage: the 2013 shutdown moved a CPI and a jobs release,
  a handful of windows carry a few weeks of look-ahead. (4) The roll-down drift is common to event and placebo windows,
  so the placebo mean will be strongly positive for side -1; only the excess over the placebo is evidence (K-0025).
  (5) ETFs have no forward data, so G4 is the ceiling. No dates, no episodes and no instrument chosen for its past
  returns; VIXY is the only continuous short-term VIX-futures ETP in the dev window.'
