references:
- cite: 'Ederington, Lee (1996) The creation and resolution of market uncertainty: the impact of information releases
    on implied volatility, Journal of Financial and Quantitative Analysis'
  year: 1996
- cite: Fernandez-Perez, Frijns, Tourani-Rad (2017) When no news is good news - The decrease in investor fear after
