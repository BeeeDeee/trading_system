falsification_criteria:
- 'Mechanism test: side-adjusted 5-day abnormal return of overdue events does not exceed the 95th percentile of
  the 200 time-shifted placebos, or has the predicted sign in fewer than two of three sub-periods, or gross per
  event is below the round-trip cost.'
- 'Mechanism test: fewer than 200 overdue events on 30 dates in dev (the delay rule finds too few events in LIQ-500
  to test).'
- Net Sharpe of the market-neutral book on dev below 0.5, or not above T-bill + 0.10, or the bootstrap bound of
  the Sharpe difference below zero.
- 'Neighbors delay_sessions 1 and 5, or hold_days 3 and 8: fewer than 75 % beat the T-bill bar.'
- The latest third of the dev events (roughly 2016-2020) shows no negative abnormal return, i.e. the effect is concentrated
  in the early years.
- Under doubled costs the book no longer beats the T-bill bar.
notes: 'Brief: short horizon (5 days), US single stocks, cross-sectional, LIQ-500, with mechanism test. Why this
  is not a retry of a dead family: the earnings-announcement-premium family (H-0008, H-0015, H-0023) tested a long
  position around predicted release dates (a premium for announcing); this card tests an information signal in the
  timing (a delay past the firm''s own schedule), on the opposite side (short), and only for the subset of firm-quarters
  that are late. The H-0023 lesson explicitly lists date-shift conditioning as a different claim that must name
  its mechanism; the mechanism here is strategic disclosure timing (managers delay bad news) plus investor inattention
  to non-events, hence a new family name. It is also not PEAD (H-0024): no earnings surprise is used and the position
  is taken before the release. Evidence it might survive where other large-cap events died (K-0024): the payoff
  concentrates in the release session itself, whose returns are several times the round-trip cost, so even a modest
  skew in the sign of the news gives a gross effect above cost; and Johnson and So report that equity prices do
  not reflect the timing information before the announcement. Most likely ways to die: (1) in large caps the release
  date is pre-announced weeks ahead and closely tracked, so the information is priced before the anniversary passes
  (then the mechanism test fails with the placebo); (2) many delays are benign calendar shifts (52/53-week fiscal
  years, holidays, fiscal-year changes), which dilute the effect; (3) coverage gaps of sec_8k_item202 (K-0035):
  firms filing releases under item 7.01 or with a changed CIK produce false overdue events (condition ii limits
  this to one per firm) and missing delisted firms bias against the effect (the worst delays end in delisting).
  Feasibility (K-0032): the event subject is an ordinary LIQ-500 member at the event date and the only extra input
  is ea_reaction_day, already delivered to LIQ-500 cards for H-0023; the event count should be in the thousands
  (about four releases per member per year from 2005), but if large caps are too regular the event-count gate will
  say so. G0 note (K-0036): the synthetic market needs quarterly filing flags with some delayed quarters for the
  look-ahead check to exercise the event code; the Skeptic should read diagnostic.py. Exposure: the book is flat
  outside earnings seasons, so mean gross exposure may be modest; per-name weight 0.125 is fixed (not a parameter)
  to keep exposure above the 20 % floor without a single name over 12.5 %. timeframes: daily decisions with a 52-week
  (1y) anchor. The reference year 2018 lies in dev, so the publication-decay check will have only about two post-publication
  years.'
