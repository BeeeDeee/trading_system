id: H-0026
version: 1
title: Overdue earnings release - LIQ-500 market-neutral, short stocks whose Item 2.02 release is several sessions
  past last year's same-quarter date, hedged with the other members, hold 5 days
author_agent: scout
family: earnings-date-delay-signal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Holders and buyers of the overdue stock who anchor on the absence of news (no news is treated as
    neutral) and do not infer the manager''s private information from the delay: inattentive long-only holders and
    index or benchmark funds that keep the position mechanically, plus buyers who rely on consensus forecasts that
    are not revised for the delay.'
  why: 'Managers control when they release earnings and tend to delay bad news (more time to prepare, to manage
    the message, or in the hope that it improves), so a release that comes later than the firm''s own habitual schedule
    foreshadows worse news. Johnson and So (2018) show that firms scheduling later-than-expected announcement dates
    announce worse news, and that equity prices do not reflect the timing information until the announcement itself.
    This card does not use scheduling data (not loadable); it observes the delay directly: when a regular Item 2.02
    filer has not released earnings several sessions after the 52-week anniversary of last year''s same-quarter
    release, the stock is overdue, and the expected negative news should arrive within days. The claim is about
    the absence of an expected event (a non-event), which attention-constrained investors process poorly, not about
    the earnings-announcement premium tested in H-0008/H-0015/H-0023 (which is a risk premium for announcing at
    all, regardless of timing).'
  why_not_arbitraged: The signal is a non-event that does not appear in news feeds or screens; the per-event edge
    is small relative to the idiosyncratic risk of a single-name short over an earnings release (a few names at
    a time, fat right tail on a positive surprise), and short-selling around announcements is costly in margin and
    risk budgets. Capacity is small (a few events per day during earnings seasons), which is unattractive to large
    funds.
signal:
  description: 'Inputs: sec_8k_item202 field ea_reaction_day (1 on the reaction session of an earnings-release 8-K
    with Item 2.02, 0 otherwise, NaN before the company''s first filing; known at the close of that session), and
    the LIQ-500 point-in-time membership and tradable flags of sharadar_sep. EXPECTED DATE: for every reaction session
    A of stock j (ea_reaction_day == 1), the expected date of the same-quarter release one year later is E(A) =
    the first XNYS session on or after A + 364 calendar days (52 weeks, keeps the weekday). EVENT (overdue release),
    evaluated after the close of each session t using data up to that close: stock j is overdue at t if there is
    an anchor A with t = the session that lies delay_sessions XNYS sessions after E(A) (E(A) counts as session 0),
    and all of the following hold: (i) ea_reaction_day of j is 0 (not 1 and not NaN) on every session from E(A)
    - 25 sessions through t (no release since about five weeks before the expected date); (ii) j has at least one
    ea_reaction_day == 1 in the sessions E(A) - 125 through E(A) - 26 (it released the previous quarter, so it is
    still a regular Item 2.02 filer; this limits false events from firms that switched to item 7.01, changed CIK
    or stopped reporting to at most one per firm); (iii) j is a LIQ-500 member and tradable at t; (iv) j had no
    other overdue event in the previous 40 sessions (dedupe double anchors). POSITIONS: after the close of t the
    overdue stock enters the short set S, traded at the open of t+1, and stays in S for hold_days sessions (exit
    at the close of t + hold_days, implemented as a trade at the next open if the engine cannot exit at the close;
    the Builder states which). If the stock leaves the universe or stops being tradable while in S it is closed
    at the next open. Each name in S gets weight -0.125; if S has more than 4 names each gets -0.5 / |S| (short
    leg at most 0.5 gross). The long hedge is an equal-weight position in all other LIQ-500 members tradable at
    t (all members not in S, including stocks whose ea_reaction_day is NaN), sized to the same total as the short
    leg, so the book is dollar-neutral with gross at most 1. Weights are recomputed daily only because S changes
    (event-driven rebalance); when S is empty the book is in cash. Missing data: NaN in ea_reaction_day means the
    company has no filings yet (or is not covered): such a stock can never be overdue. Data starts 2004-08-23, so
    the first possible events are in 2005-08; the book is flat before.'
  params:
    delay_sessions:
      grid:
      - 1
      - 3
      - 5
      value: 3
    hold_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
  timeframes:
  - 1d
  - 1y
mechanism_test:
  event: 'A LIQ-500 stock that released earnings (8-K Item 2.02) in the previous quarter has had no Item 2.02 release
    from 25 sessions before through delay_sessions (3) sessions after the 52-week anniversary of last year''s same-quarter
    release (it is overdue), evaluated after the close of day t. side = -1 for every event: the mechanism says the
    overdue stock underperforms the other members afterwards.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
