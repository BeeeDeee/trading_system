id: H-0184
version: 2
title: Treasury duration-supply surge and the term premium - 60/40 SPY/IEF core whose bond sleeve sits in TLT after
  a surge in long-coupon auction sizes, in SHY after a cut, 12-month monthly cohorts
author_agent: scout
family: bond-term-premium-timing
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - SHY
  - IEI
  - IEF
  - TLH
  - TLT
  - AGG
  - LQD
  kind: instruments
mechanism:
  counterparty: 'Duration-constrained arbitrageurs (dealers, relative-value funds) who must be paid to warehouse
    the extra supply, and the issuer itself: Treasury debt management sets auction sizes to finance the deficit
    and to follow a regular, predictable schedule, not to minimize the term premium it pays. On the other side,
    after issuance cuts, habitat investors who still need duration pay up for scarce long bonds.'
  why: Preferred-habitat view of the yield curve (Vayanos and Vila; Greenwood and Vayanos 2014). Long-duration Treasuries
    are held mostly by investors with a fixed maturity habitat (pensions, insurers, foreign reserve managers) and
    by risk-averse arbitrageurs with limited capital. When the Treasury pushes much more duration into the market,
    by raising the size of 5- to 30-year coupon auctions well above what it sold in previous years, the arbitrageurs
    must carry the extra duration risk and only do so at a higher term premium. The expected excess return of long
    over short Treasuries then stays elevated for the next year, until the supply is absorbed. When long-coupon
    issuance is cut, the reverse holds and long bonds earn a smaller premium than short ones. Greenwood and Vayanos
    find that the maturity-weighted supply of Treasury debt predicts excess long-bond returns over a one-year horizon,
    also with the term spread as a control. The signal here is a fiscal financing series (auction sizes set by Treasury
    debt management), and the trade is in the secondary bond market.
  why_not_arbitraged: Harvesting it means holding one-year duration risk in size. The investors with the balance
    sheet to do that are the ones whose risk-bearing capacity is the binding constraint in the model. The premium
    is compensation for bearing risk at a time when it is scarce, not a free lunch. A long-only investor can only
    shift the maturity mix of a bond sleeve, and benchmark-tracking bond managers rarely move duration a whole sleeve
    on a supply signal.
signal:
  description: 'Inputs: sharadar_sfp total returns of SPY, SHY, IEI, IEF, TLH, TLT; treasury_auctions_1d keys last_coupon5_sessions,
    next_coupon5_sessions, next_coupon5_offering_usd (nominal 5y-30y coupon auctions, new issues and reopenings).
    (1) Auction size series: for every XNYS session d with last_coupon5_sessions(d) == 0 (a 5y-30y coupon auction
    day), the offering of that day is next_coupon5_offering_usd on the previous session p if next_coupon5_sessions(p)
    == 1 (that value points to d and already sums several auctions on one day); if the previous session has no such
    value, the day''s offering is missing and counts as 0 (the Builder reports how many auction days are missing).
    (2) Trailing supply S_t = sum of the day offerings over the 252 sessions ending at t. (3) Base B_t = mean of
    S at the sessions t-252, t-273, t-294, ... back to t-252*(1+base_years) (every 21 sessions, i.e. the average
    annual long-coupon issuance of the base_years years before the trailing year). (4) Supply surge g_t = ln(S_t
    / B_t). It is defined only when the view holds 252*(1+base_years) sessions of auction history; before that g_t
    is undefined. State on decision date t: HIGH if g_t >= supply_cut, LOW if g_t <= -supply_cut, NEUTRAL otherwise
    or undefined. Book: decisions after the close of the last XNYS session of each month, trades at the next open.
    Every month opens a cohort that holds 12 months (12 live cohorts, each 1/12 of the bond sleeve). A cohort''s
    sleeve is TLT if its state was HIGH, SHY if LOW, IEF if NEUTRAL; cohorts that would have started before the
    first decision date count as IEF. Target weights each month: SPY 0.60, and the 0.40 bond sleeve split over TLT,
    IEF and SHY in proportion to the live cohorts (e.g. 7 HIGH and 5 NEUTRAL cohorts = TLT 0.40*7/12, IEF 0.40*5/12).
    Rebalanced to these targets monthly; no trades between month-ends. Always fully invested; no shorts, no leverage.
    IEI and TLH are not traded by the book: they are only mechanism-test instruments (see mechanism_test). The book
    trades only from the first month-end at which SPY, SHY, IEF and TLT all have a price; it never holds an instrument
    before its first price. Hold horizon of each cohort is fixed at 12 months by the claim (one-year excess-return
    horizon of the reference), not a parameter.'
  params:
    base_years:
      grid:
      - 2
      - 3
      - 4
      value: 3
    supply_cut:
      grid:
      - 0.05
      - 0.1
      - 0.15
      value: 0.1
  timeframes:
  - 1d
  - 1mo
  - 1y
mechanism_test:
  event: 'At each month-end decision date t with state HIGH (long-coupon supply surge, g_t >= supply_cut): TLT and
    TLH are marked side +1 and SHY and IEI side -1 (long duration should beat short duration). With state LOW (g_t
    <= -supply_cut): TLT and TLH side -1, SHY and IEI side +1. NEUTRAL months have no events. IEF, SPY, AGG and
    LQD are never marked (peers only; AGG and LQD are peer-only instruments that the strategy never trades). An
    instrument is marked only from its first price on.'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
