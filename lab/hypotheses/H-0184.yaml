references:
- cite: Greenwood, Vayanos (2014) Bond Supply and Excess Bond Returns, Review of Financial Studies
  year: 2014
- cite: Vayanos, Vila (2021) A Preferred-Habitat Model of the Term Structure of Interest Rates, Econometrica
  year: 2021
falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of the marked Treasury ETFs is not above the 95th percentile
  of the time-shifted placebos, or has the predicted sign in fewer than two of the three dev blocks.'
- 'Mechanism: the latest third of dev is wrong-signed (the K-0060 decay pattern); the card treats that as a refutation
  of a standing supply premium.'
- 'Mechanism shape: the 60-session abnormal return is not larger than the 21-session one. A one-year term premium
  must build with the horizon; a gain that is complete in a few weeks is an auction-week concession (treasury-auction-supply-concession),
  not this mechanism.'
- Gross 60-session abnormal return per event below the round-trip cost of the marked ETFs.
- 'Strategy: net Sharpe on dev below 60/40 SPY/IEF + 0.10, or the bootstrap bound of the Sharpe difference at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbors (supply_cut 0.05 / 0.15, base_years 2 / 4 and their combinations)
  beat 60/40, or Sharpe at twice the costs falls below 60/40.'
- 'Publication: the post-2014 Sharpe excess over 60/40 is below half of the pre-2014 excess.'
notes: 'Brief fit: the brief asks for a 6-24 month cross-asset idea with signals from one market traded in another.
  The signal is a fiscal-financing series (Treasury auction sizes, from the Fiscal Data API), not a price of any
  market, and the trade is in secondary-market Treasury ETFs inside a stock-bond book. This is the closest fit with
  a mechanism that has a named counterparty and a one-year horizon in the literature. Cross-asset price-to-price
  ideas at monthly horizons are mostly used up in the lab: equity-bond momentum (H-0087, H-0177, H-0178) was null,
  and currency value (H-0062, H-0088) passed the event test but its 12-month book earned nothing. Relation to H-0183
  (same family, DATA_READY): same book (bond sleeve TLT / IEF / SHY in 12-month cohorts on a 60/40 core), so the
  lab can compare two state variables for the same claim (time-varying term premium). H-0183 uses the 10y-3m slope,
  a price signal. This card uses quantity supplied, which Greenwood and Vayanos show predicts excess returns also
  with the term spread as a control. Family kept as bond-term-premium-timing, so both trials count together. It
  is not treasury-auction-supply-concession (H-0038, H-0127): those claim a dealer concession of a few sessions
  around each auction, which K-0210 found invisible at the daily ETF level. This card claims a slow stock effect
  of a year''s supply, and its third falsification criterion separates the two by shape. Known weaknesses, stated
  in advance: (1) Fed purchases (QE) took duration out of the market in parts of dev while gross issuance was high,
  so gross auction sizes overstate net supply to private investors in those years. The bias runs toward a null,
  not toward a false pass. Netting it out would need the New York Fed series, whose history and holdout boundary
  do not match. (2) Issuance surges come with deficits in recessions, when the Fed cuts and long bonds rally for
  flight-to-quality reasons. A pass would not separate supply from recession, and the Librarian should read it so.
  (3) Nominal issuance grows with the economy, so the ln(S/B) center is above zero and HIGH months will outnumber
  LOW months; the placebo keeps the same sides, so this shows up in the placebo mean, not as a false effect. (4)
  Few independent supply cycles in dev (K-0026): the gate resolves only a large effect. Events forecast: the signal
  needs 4 years of auction history from the view start (2002-07-30), so decisions run from about 2006-08 (2005-08
  / 2007-08 for base_years 2 / 4). That gives about 170 month-ends; perhaps half to two thirds are non-neutral,
  with 2 marked ETFs before 2007 and 4 after, so about 300-450 events on 80-120 dates. Before the first signal,
  all cohorts are IEF, so the book equals the 60/40 benchmark: no cash dilution, but the margin is diluted over
  the warm-up years. Expected gain (K-0064): the tilt moves at most 40 % of the book between TLT (duration about
  17) and SHY (about 2) around IEF (about 8). If HIGH months earn a 2-4 %/y extra excess of TLT over IEF, the book
  gains roughly 0.4-0.8 %/y with somewhat higher volatility in HIGH states. The required Sharpe margin (+0.10 on
  about 8 % volatility, about 0.8 %/y) needs the optimistic end, so the strategy gate is the likely death even if
  the mechanism passes. Mean exposure 100 %, 160+ monthly decision dates. Hindsight: no dates or episodes are used;
  thresholds are round numbers. Only the auction calendar''s own announced offering amounts are used, never an amount
  before its announcement date.


  Revision v2 (owner, 2026-11-26): the first version failed the judge''s event-study rule (at least 3 unmarked eligible
  peers on every event date; K-0174, K-0226): with TLT, TLH, SHY and IEI marked only IEF and SPY were left. AGG
  (from 2003-09) and LQD (from 2002-07) are added to the universe as PEER-ONLY instruments: the strategy puts no
  weight on them, the mechanism test never marks them. The book, the rules and the parameters are unchanged; the
  strategy holds only SPY, IEF, TLT and SHY. Known limit (K-0074): AGG and LQD are not duration-matched to the marked
  funds; the placebo bar, not the raw peer mean, is the judge''s reference.'
