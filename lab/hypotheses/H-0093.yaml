id: H-0093
version: 1
title: Earnings-seasonality surprise - LIQ-500 market-neutral, long seasonally strong / short seasonally weak upcoming
  quarters, 5 sessions around the predicted 8-K release
author_agent: scout
family: anomalies-at-earnings-news
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Investors (and the consensus they follow) who extrapolate the latest quarterly earnings level:
    they sell or avoid firms coming off a seasonally weak quarter and bid up firms coming off a seasonally strong
    one, then are surprised at the next release. Liquidity traders who sell the high-seasonality name (or buy the
    low-seasonality name) into the release supply the other side.'
  why: 'Many firms have a stable seasonal earnings pattern: the same fiscal quarter is strong (or weak) relative
    to the neighbouring quarters year after year. Chang, Hartzmark, Solomon and Soltes (2017) show that investors
    and analysts underweight this predictable pattern and anchor on the most recent quarters, so expectations for
    a seasonally strong quarter are too low and for a seasonally weak quarter too high. The error is revealed when
    the quarter''s earnings are released: firms entering a positive-seasonality quarter earn higher returns at the
    release than firms entering a negative-seasonality quarter, and analyst forecast errors are more positive in
    positive-seasonality quarters, so the return is an expectation error corrected at the news, not a risk premium.
    The claim is concentrated at the release, so a short window around the release date is the natural test horizon.'
  why_not_arbitraged: The edge per release is small next to the idiosyncratic jump risk of an earnings release,
    so a book that harvests it carries large single-name event risk for a thin mean; it needs firm-level quarterly
    histories over five years and the release calendar of every firm; its capacity is concentrated in a few weeks
    per quarter; and the bias sits in analysts' and investors' expectation formation, which the paper shows had
    not disappeared over decades.
signal:
  description: 'Inputs (all point-in-time): LIQ-500 membership and liq_rank, total returns, the SEC 8-K Item 2.02
    flag ea_reaction_day (1 on the reaction session of an earnings release), and the as-reported quarterly net income
    sf1_arq_netinc (usable from the day after the filing). (1) Quarter history per stock: walk the daily sf1_arq_netinc
    series of each stock up to the decision day t. A change of value starts a new fiscal quarter if at least 40
    sessions have passed since the last accepted quarter started; a change within 40 sessions overwrites the value
    of the latest accepted quarter (amendment). Record each accepted quarter''s value and the session it became
    usable. If two consecutive accepted quarters are more than 120 sessions apart anywhere in the span used below,
    the stock has no score (a missing quarter would misalign the seasons). Lag 1 = the latest accepted quarter,
    lag 2 the one before, and so on; the upcoming quarter (the one to be released next) is lag 0. (2) Seasonality
    score S for the upcoming quarter, with Y = years_back: for each k = 1..Y, the same fiscal quarter k years earlier
    is lag 4k; compare its net income with its four neighbouring quarters at lags 4k-2, 4k-1, 4k+1, 4k+2 and set
    r_k = (number of neighbours it exceeds + 0.5 x number of ties) / 4, in [0, 1]. S = mean of r_1..r_Y. This needs
    lags up to 4Y+2 and is neutral to a linear earnings trend (the same-quarter observation sits in the middle of
    its five-quarter block). S = 1 means the upcoming quarter was the best of its neighbourhood every year; S =
    0 the worst. (3) Alignment guard: let R1 be the most recent reaction session of the stock in the sessions t-120
    .. t-40. The stock is scored only if R1 exists and the latest accepted quarter became usable no earlier than
    5 sessions before R1 (so lag 1 is the quarter released at R1, not the one before it). (4) Event (decision after
    the close of session t): stock j is a member of LIQ-500 on t; session t-248 was a reaction session of j (ea_reaction_day
    = 1) and it was the first reaction session of j within the 40 sessions up to and including t-248 (extra Item
    2.02 filings in a cluster do not anchor); j had no reaction session in t-39 .. t (the upcoming release has not
    come early); j is not already in an open event; S exists. Last year''s same-quarter release was 248 sessions
    ago, so this year''s release is expected about 251 sessions after it, i.e. around session t+3, and the holding
    window t+1 .. t+5 is centred on it. Side +1 (long) if S >= threshold, side -1 (short) if S <= 1 - threshold,
    no event otherwise. (5) Book: market-neutral. Each event opens at the open of t+1 with weight +0.05 (long) or
    -0.05 (short) and is closed at the open of t+6 (decision after the close of t+5), i.e. held 5 sessions; an event
    whose stock leaves LIQ-500 is closed at the next decision instead. Every day the net dollar exposure of the
    open events is hedged with equal weights across the 100 most liquid LIQ-500 members (lowest liq_rank) that are
    not in an open event, so the book is dollar-neutral. If gross exposure exceeds 1.0, all weights (events and
    hedge) are scaled down proportionally. Days without open events are in cash. Missing returns or a stock without
    the required history simply yield no event; no fills for non-tradable stocks.'
  params:
    threshold:
      grid:
      - 0.7
      - 0.75
      - 0.8
      value: 0.75
    years_back:
      grid:
      - 4
      - 5
      - 6
      value: 5
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: After the close of session t, a LIQ-500 stock whose same-quarter earnings release of last year was 248
    sessions ago (first Item 2.02 reaction session in a 40-session cluster), with no release in the last 40 sessions,
    has an earnings-seasonality score S for its upcoming quarter (mean over the last 5 years of the rank of that
    fiscal quarter's net income among its four neighbouring quarters) of at least 0.75 (side +1, expected to outperform
    the other members through the release window) or at most 0.25 (side -1, expected to underperform).
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
