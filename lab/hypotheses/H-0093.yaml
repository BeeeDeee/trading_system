falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is below the 95th percentile of the time-shifted
  placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of the dev event sample has the wrong sign (decay after publication or no effect
  in recent large caps); the card counts this as a refutation even if two thirds are right-signed.'
- 'Mechanism shape: if the 10-session abnormal return is more than twice the 5-session one, or the effect is already
  as large at the 1-session horizon as at 5 (before most releases fall in the window), the return is a slow style
  drift or stock-selection artefact, not a correction at the release, and the claim is wrong.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap lower bound of Sharpe minus T-bill Sharpe not above zero.'
- 'Robustness: fewer than 75 % of the neighbours (years_back 4 and 6, threshold 0.70 and 0.80, and their combinations)
  beat the T-bill bar, or the book loses its edge at doubled costs.'
notes: 'Brief fit: US single stocks, LIQ-500 cross-section, 5-session hold, mechanism test declared, and it combines
  a quarterly fundamental signal (1q) with a daily event clock (1d). Why this is not a retry. H-0053 (return seasonality,
  monthly, dead) named this test as its open question: ''the earnings-month component could be tested with real
  release dates''. H-0023 (date-only announcement premium) marked long only, so the premium itself drove its placebo
  comparison; here both sides are marked at the same release clock, so any generic announcement premium cancels
  and the placebo mean should be near zero. H-0032 (accruals/profitability/asset-growth composite around the predicted
  release) used slow style anomalies whose return is not specific to one release; earnings seasonality is a claim
  about the earnings of exactly the quarter being released, with a documented analyst forecast error, so it should
  show up in the window and not build for weeks (falsification criterion 3 checks this). Family: filed under anomalies-at-earnings-news
  because the mechanism is the same (a predictable expectation error corrected at earnings news), and the predicted-date
  clock is shared with H-0023, H-0026 and H-0032, so the trials should count together. Design choices argued in
  advance, not tuned: the five-quarter centred rank instead of the paper''s rank over 20 quarters, because the paper''s
  measure puts the same-quarter observations at the oldest end of each year and so tilts the long leg toward shrinking
  firms (a growth confound); net income instead of EPS so splits do not break the history; threshold 0.75 = ''beat
  three of four neighbours on average''; 248 sessions = one session before a 5-session window centred on last year''s
  date plus 52 weeks (about 251 sessions). Forecasts (K-0098, K-0120, K-0125): about 350-400 LIQ-500 members with
  5.5 years of consistent quarters and 8-K coverage, four anchors a year each, 20-30 % beyond the thresholds: roughly
  2500-7000 events on 1200-2000 dates from late 2005 to 2020 (state a shortfall below 2000 as a sign that the quarter-sequence
  rule drops too many stocks). Round trip from the cost tiers: 6 bps (rank up to 200) to 12 bps (rank 200-500),
  about 10 bps on average. Expected gross per event 10-30 bps (the paper''s long-short alpha is about 62 bps a month
  in announcement months, value-weighted about the same, so large firms carry it); the both-sides design should
  put the placebo bar near or under cost, so a tradable effect can pass. Book: about 7 open events on an average
  day, 20 or more in peak earnings weeks, slot weight 0.05, so mean exposure about 0.3-0.45 including the hedge,
  clustered in earnings seasons. Expected annual gain: with 15 bps net per event and about 375 events a year at
  0.05, roughly 2-3 % a year at an annual volatility of about 5 % (release-day jumps dominate), so a net Sharpe
  of about 0.4-0.6; the book clears the 0.5 floor only if gross per event is about 30 bps or more. Most likely deaths,
  in order: the latest third is weak or wrong-signed (published 2014 on SSRN, 2017 in print; dev holds about four
  post-print years), the predicted window misses many releases (dilution: the hit rate of ''last year plus 52 weeks''
  in large caps is unmeasured, K-0035), the book misses the absolute Sharpe floor although the event study passes
  (K-0064). Data caveats for the Builder: if Sharadar ARQ lacks fourth-quarter rows, the 120-session gap rule voids
  most scores; fail loudly (report the share of scored LIQ-500 members by year) rather than silently trading a handful
  of stocks. The beta gap between legs should be small (both legs mix sectors, which rotate with the season), but
  retailers dominate one leg in the fourth-quarter season; a by-side and by-season report would be welcome if the
  gate can give one.'
