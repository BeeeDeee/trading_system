id: H-0125
version: 1
title: Korean retail pump fade - after a Korea-specific Upbit KRW volume surge with a Binance up-move, short the
  coin's Binance perp vs a BTC/ETH hedge, hold 5 days
author_agent: scout
family: segmented-venue-premium-transmission
asset_classes:
- crypto_perp
- crypto_spot
universe:
  kind: crypto_top_n
  n: 50
mechanism:
  counterparty: Korean retail traders who buy a coin after it starts trending on Upbit (late, attention-driven and
    return-chasing buyers), and the global momentum followers who buy the lifted Binance price. They pay the reversal;
    the short side is paid for supplying liquidity against a non-informational flow.
  why: 'Upbit''s KRW market is a segmented retail venue: Korean residents cannot easily move won abroad, and foreign
    capital cannot easily enter, so Korean retail demand is concentrated there and cross-border arbitrage is limited
    (the capital-control and microstructure frictions behind the kimchi premium). When Korean retail piles into
    a coin, the Upbit trade value explodes far more than global volume. The local price runs ahead, and the arbitrageurs
    who can move coins out of Korea and sell them carry part of the buying pressure to the global venues: they buy
    on Binance to replace what they sell in Korea, so the Binance price is lifted by demand that carries no information.
    The claim is an overreaction: once that attention-driven Korean buying stops (it is short-lived, herding and
    return-chasing), the pressure reverses and the coin lags other liquid coins on Binance over the following days.
    The event separates a Korea-specific surge (Upbit volume up much more than the coin''s own Binance spot volume)
    from global news days (both venues surge together), which are not marked.'
  why_not_arbitraged: Shorting into a retail pump has squeeze risk (pumps can run for more days, funding spikes,
    perp liquidations of shorts); the arbitrage across the Korean border is capacity-limited by capital controls,
    KYC withdrawal limits and wallet maintenance, so the price link is imperfect in both directions; the trade is
    small, rare and volatile per event, unattractive for large funds.
signal:
  description: 'Daily, after the 00:00 UTC close of day t (crypto clock; Upbit candles are the same UTC day), using
    data up to that close; trades at the open of day t+1. Eligible coins on day t: members of the point-in-time
    top-50 Binance USD-M perps by 30-day quote volume (universe crypto_top_n, n = 50), excluding BTCUSDT.P and ETHUSDT.P
    (they are the hedge), whose base asset X has an Upbit series `upbit_krw_1d.X.value_krw` (map X -> XUSDT.P by
    identical base ticker only; no renames bridged, no 1000-multiplier ids) and a Binance spot pair XUSDT with `quote_volume`.
    For each eligible coin j: U(j,t) = Upbit KRW trade value of day t / median Upbit KRW trade value over days t-30..t-1;
    B(j,t) = Binance spot quote volume of day t / median Binance spot quote volume over days t-30..t-1; K(j,t) =
    U(j,t) / B(j,t) (Korea-specific surge; the won cancels because both ratios are against the coin''s own history).
    Both medians need at least 20 valid days in the window, else not eligible. Liquidity floor (fixed): the median
    Upbit trade value over t-30..t-1 is at least 1,000,000,000 KRW. Event (the mechanism event, side -1): U(j,t)
    >= k AND K(j,t) >= k AND the coin''s perp return of day t (close t-1 to close t) is above the cross-sectional
    median perp return of the universe on day t, AND coin j had no event in the previous hold_days days (no re-trigger
    while a slot is open). Book (event slots, long/short, no leverage): each event opens a slot at the open of t+1:
    short the coin''s perp at weight 0.15 of equity and long a hedge of 0.15 split 0.075 BTCUSDT.P and 0.075 ETHUSDT.P.
    A slot is held for hold_days daily bars and closed at the open of day t+1+hold_days. At most 3 open slots (gross
    <= 0.9); if more events than free slots on a day, take the largest K first and drop the rest. If a coin leaves
    the universe or loses its data while a slot is open, close that slot (both legs) at the next decision. Hedge
    legs of several slots add up. Missing Upbit or spot data on day t means no event for that coin on day t; nothing
    is filled. Funding is charged by the engine (shorts receive positive funding).'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    k:
      grid:
      - 1.5
      - 2
      - 3
      value: 2
  timeframes:
  - 1d
mechanism_test:
  event: 'Coin j (a top-50 Binance perp other than BTC and ETH, with an Upbit KRW series and a Binance spot pair)
    has, on UTC day t, Upbit KRW trade value at least k times its own 30-day median AND that Upbit surge at least
    k times the surge of its own Binance spot quote volume (Korea-specific), AND a perp return on day t above the
    universe median; no repeat within hold_days. Side -1: the coin should underperform the other universe perps
    from the next open over the following days.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
