falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events is not above the 95th percentile of the time-shifted
  placebos, or the gross per event is below the round-trip cost of the coin perp.'
- 'Mechanism shape: if the 1-day abnormal return is about zero or wrong-signed and the effect only appears at 10
  days, it is slow drift or beta, not a fade of retail pressure; the card is wrong even if the pooled 5-day number
  passes.'
- 'Decay or regime: the latest third of dev (mostly 2022) has the wrong sign (K-0060).'
- 'Fewer than 200 events or 30 event dates at k = 2: the test cannot tell; this is not a refutation, and the card
  is not to be rescued with a lower k.'
- 'Strategy: net Sharpe below 0.5 or the bootstrap bound of the difference to T-bills not above zero.'
- 'Robustness: the neighbors k = 1.5 / 3 or hold_days = 3 / 7 do not beat T-bills in at least 75 % of the neighbor
  set, or the book is not positive at doubled costs.'
- 'Korea-specific claim: if the Builder can report the control (same U >= k and up-move, but K < 1, i.e. global
  surges), and those events fade as much as the marked ones, the Korean segmentation adds nothing and the card is
  wrong.'
notes: 'Brief fit: holding 5 days (grid 3-7), signal from one market (the Korean won spot venue Upbit, a segmented
  retail market behind capital controls) traded in another (Binance USD-margined perps). It is cross-market rather
  than cross-asset-class; the classic cross-asset routes on daily data are mostly dead in this lab (daily lead-lag
  scan mrel, stress rebounds K-0084, macro-calendar K-0070, estimated-exposure diffusion K-0164, VIX-gated crypto
  reversal H-0081), so this is the closest fit with a mechanism that has a counterparty and an untested information
  source (Korean trade value). FRED is not needed: the won cancels in the ratio of ratios. Relation to H-0076 (same
  family on purpose, so the trial counts together): H-0076 ranked all coins every day on the Upbit/Binance PRICE
  premium and bet on catch-up (long rich, short cheap); it was slightly wrong-signed and far under cost. Its lesson
  forbids trading the mirror of the premium sort. This card does not sort on the premium at all: it marks rare Korea-specific
  VOLUME surges that come with a Binance up-move (the transmitted pump), one side only, and claims overreaction
  rather than underreaction. The two events overlap only partly (a premium can be rich without a surge, and arbitrage
  keeps the premium small while volume explodes). If the Skeptic or Chair judge it a mirror anyway, it should be
  parked rather than run under a new family. Reused family: the mechanism is the same segmented Korean demand channel.
  References: background on the segmentation (Choi, Lehar, Stauffer, ''Bitcoin Microstructure and the Kimchi Premium'',
  2019 working paper; Makarov and Schoar, ''Trading and arbitrage in cryptocurrency markets'', JFE 2020) explains
  the frictions, but neither publishes this trading rule, so no references block is given; the Chair may add the
  literature prior if it disagrees. Forecasts (written before any data, K-0120 / K-0159): Upbit-matched eligible
  coins in the top-50 about 12 in 2020, 20-25 in 2021, 25-30 in 2022; events at k = 2 about 300-700 on 200-450 dates
  (more in 2021-2022, so the first third is thinnest); at k = 3 about 150-300. Round trip of a mid-cap perp short
  about 40-90 bps (catalog crypto_perp tiers; K-0120 saw about 91 bps on liquid perps), hedge round trip about 25
  bps more in the book only. Gross per event: central 1.5 %, pessimistic 0.3 %, mechanism absent 0 or negative (pump
  continuation in the 2021 boom is the main rival). Placebo bar: 5-day residual sd of a mid-cap alt about 10 %,
  a few hundred clustered dates, so the bar is likely 0.8-1.2 %, at or above cost: an effect under about 1 % ends
  in ''cannot tell'' (K-0034). Exposure arithmetic (K-0098, K-0104): entries x hold / days x leg weight = 500 x
  5 / 1096 x 0.15 = 0.34 (0.21 at 300 entries, 0.17 at 250, below the 0.20 floor). Sharpe arithmetic: about 170
  events a year with residual 5-day sd about 10 % need a net of about 0.4-0.5 % per event for Sharpe 0.5, so gross
  must clear about 1-1.4 %. Known biases: Upbit series exist only for coins still listed in 2026 (delisted Korean
  coins, often after crashes, are missing); that removes some of the worst post-pump losers from the marked set,
  which biases AGAINST this short. Shorts receive positive funding, which flatters the book in the 2021 boom; the
  event study is price-only. Marked coins are mid-cap alts with a higher beta than the universe mean (K-0074): in
  the 2022 bear third that helps a short, in the 2021 boom it hurts, so the sign by third must be read with that
  in mind. The hedge is BTC/ETH at equal notional, not beta-scaled. The daily G0 path may get no crypto_top_n universe
  on binance_perp_1d (K-0131): the Builder should then rank by trailing 30-day quote volume and report it; rolling
  windows must accept views shorter than 30 rows. Spot data is signal only and its history starts with the view
  (K-0108). Dev window is one boom-and-bust cycle (K-0006); the holdout 2023+ and forward data (Upbit and Binance
  APIs) exist, so this is one of the few short-horizon ideas that could reach paper trading.'
