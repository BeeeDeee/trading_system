falsification_criteria:
- The event study is at or below the 95th percentile of the time-shifted placebos at 5 days (no concession beyond
  chance).
- Gross abnormal return per event at 5 days is below the round-trip cost of the event stock (not tradable even if
  real).
- The latest third of the dev period is negative (the concession is gone, the K-0060 decay pattern).
- The 10-day abnormal return is smaller than the 5-day one by more than half (a one-day bounce, not a redistribution
  over days) - descriptive.
- Net Sharpe of the hedged slot book below 0.5 or not above T-bills with the bootstrap bound.
- Neighbors gap_pct 2 and 4 or hold_days 3 and 7 fail the benchmark in more than a quarter of combinations.
notes: 'Brief: short horizon, US single stocks, cross-sectional, mechanism test declared. Family is short-term-reversal
  on purpose: the economics is liquidity provision to a seller who demands immediacy, which is that family''s counterparty,
  so the card carries the family''s large trial count honestly. What is new against H-0030 (no-news daily reversal,
  gross far under cost), H-0188 (monthly no-news reversal) and H-0105 (learned overnight gaps without a filing):
  the event is a supply-shock footprint, not a return rank. It needs a gap concentrated at the open (where blocks
  and overnight offerings are priced), abnormal volume (the block itself), no earnings release and, crucially, a
  session that does not continue lower (ret_oc >= 0), which is the market''s own same-day judgement that the gap
  was not news. The claim is that this subset has a concession several times the generic reversal, large enough
  to clear a single-name round trip of about 12 bps; the generic reversal of the lab did not. Expected counts (pessimistic
  first, K-0120): 60-250 events a year in LIQ-500 over 2005-2020, so about 1000-4000 events on 800-2500 dates; mean
  exposure about events x hold / 252 x 0.2 gross per slot = 0.25-0.8 (with the 5-slot cap binding in crisis weeks).
  Gross per event: pessimistic 10 bps (generic reversal size, card dies on cost), central 40-60 bps. Beta gap: event
  stocks are often higher-volatility names than the peers, and the hedge basket is the 100 most liquid members,
  so in a falling market the long leg can lose on beta; the event study is raw against unmarked peers (K-0074),
  and a crisis-era concentration (2008-2009) is the most likely way the latest third fails. A control the judge
  cannot run but that should be reported if possible: the same events with ret_oc < 0 (gap continued intraday, likely
  news) should show no rebound or continuation; if both subsets rebound equally, the intraday hold adds nothing
  and this is the generic reversal again. No date literals, no named instruments; the 8-K flag starts 2004-08, so
  the period starts 2005 to have the t-2 earnings exclusion defined everywhere. No references: no published paper
  tests this exact event; the block price-pressure literature (Scholes 1972; Mikkelson and Partch 1985) motivates
  it but is cited only in text.'
