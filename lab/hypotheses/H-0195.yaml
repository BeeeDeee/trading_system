id: H-0195
version: 1
title: Absorbed overnight supply shock - LIQ-500, long no-earnings heavy-volume gap-downs that held the open, liquid
  hedge, 5 days
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: The selling shareholder or issuer that pays a discount for immediacy (private-equity exits, founders,
    a fund liquidating a position, a company raising equity overnight), and the allocated buyers who flip their
    allocation in the first days.
  why: 'A large stock-specific gap down at the open on several times normal volume, on a session without an earnings
    release, that does not continue lower during the session (the close is at or above the open) is the footprint
    of a supply shock rather than of news: an overnight-marketed secondary offering, a block sold by a large holder
    through a dealer at a discount, or a forced seller hitting the opening auction. The block is placed at a concession
    to the prior close; the price then holds near the placement level because informed selling would keep pushing
    it down intraday. With downward-sloping short-run demand for a single stock, the concession is temporary and
    is earned back over the following days as the absorbed shares are redistributed to patient holders (Scholes
    1972 price-pressure reading of block sales). The intraday hold is the part that separates this event from the
    generic no-news reversal the lab already tested (H-0030, H-0188): it selects gaps that the market itself treated
    as non-informative on the day.'
  why_not_arbitraged: Absorbing a block ties up capital in a single-name position with idiosyncratic risk for days;
    the dealers and short-term funds who do it are capital constrained and charge exactly this concession. Without
    the offering or block data in real time a taker cannot tell a supply shock from bad news, so the concession
    survives as compensation for that uncertainty.
signal:
  description: 'Decisions after the close of each session t, using data up to that close; trades at the open of
    t+1. Inputs per stock j of the point-in-time LIQ-500: overnight return ret_co (close t-1 to open t), intraday
    return ret_oc (open t to close t), dollar_volume, the 8-K earnings flag ea_reaction_day, and extras liq_rank.
    Market-adjusted gap g[t,j] = ret_co[t,j] minus the cross-sectional median of ret_co[t] over LIQ-500 members
    with a valid value. EVENT at t for j (all conditions): (1) g[t,j] <= -gap_pct/100; (2) ret_oc[t,j] >= 0 (the
    session closed at or above its open); (3) dollar_volume[t,j] >= 4 x the median dollar_volume of j over sessions
    t-63..t-1 (at least 50 valid values, else no event); (4) ea_reaction_day of j is 0 (not 1) on sessions t-2,
    t-1 and t, and not NaN on t (stocks without 8-K coverage are not eligible); (5) j is a LIQ-500 member on t and
    has no event in the previous hold_days sessions (no re-entry while a slot is open). BOOK: each event opens a
    slot at the open of t+1: +0.10 of equity long in j and -0.10 spread equally over the 100 most liquid LIQ-500
    members by liq_rank on t that have no event (the hedge basket). The slot is closed at the open of t+1+hold_days
    (or at the first open after j leaves LIQ-500 or stops trading, whichever comes first). At most 5 slots open
    at once on each side of gross: if new events would exceed the cap, all open slot weights are scaled down equally
    so that gross (long plus hedge) is at most 1.0. No slot, no position: idle equity earns the T-bill rate. Missing
    ret_co, ret_oc or dollar_volume on t means no event for that stock on t.'
  params:
    gap_pct:
      grid:
      - 2
      - 3
      - 4
      value: 3
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of session t, a LIQ-500 stock has a market-adjusted overnight gap (ret_co minus the cross-sectional
    median ret_co) of -3 % or worse, closes the session at or above its open (ret_oc >= 0), trades at least 4 times
    its median dollar volume of the prior 63 sessions, and has no 8-K earnings release on t-2, t-1 or t (side +1:
    it should outperform the other members afterwards).'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
