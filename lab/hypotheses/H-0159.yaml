falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the leg events does not exceed the 95th percentile of the
  200 time-shifted placebos, or gross per event is below the round-trip cost. Read: volatility does not carry credit
  news into stocks, so the H-0126/H-0158 passes need their balance-sheet inputs or were luck.'
- 'Mechanism: the latest third of dev has the wrong sign, or fewer than two of three thirds have the predicted sign.'
- 'Mechanism shape: the effect at 1 session is about zero and grows steadily to 20 sessions. Read: slow volatility-style
  drift, not delayed absorption of a dated credit shock (the reading of H-0128 and H-0158).'
- 'Strategy: net Sharpe on dev below 0.5, or below T-bills + 0.10, or the bootstrap bound of the Sharpe difference
  to T-bills below zero.'
- 'Robustness: fewer than 75 % of the z_news / vol_days neighbors beat T-bills, or net Sharpe at 2x costs is below
  T-bills.'
- 'Leg claim: if the book runs and the HIGH-vol short leg in widening weeks loses money while the low-vol long leg
  carries the result, the distress channel is not what pays (it would be the long-leg pattern of K-0172 again).'
notes: 'Brief fit: cross-asset, short horizon. The signal comes from the corporate-bond market (Moody''s Baa-Aaa
  yields, a FRED series) net of the stock market''s own move, and the trade is in US stocks, held 5 sessions. It
  is the closest fit with a mechanism I could find. Cross-asset lead-lag, stress rebounds, macro-calendar ideas
  and wrapper ideas are covered by K-0072, K-0084, K-0070 and K-0198. I checked two ideas and dropped them because
  the event arithmetic fails: extending the home-closure fade (H-0133) to European and American closures gives only
  about two multi-day closures a year, since those markets reopen before or with the US open; and a post-FOMC Treasury
  drift has about 150 dates against noisy non-bond peers. Why this card: lessons H-0128 and H-0158 and K-0203 ask
  for exactly this control (''Does distress (interest coverage, volatility) rather than leverage carry H-0126''s
  pass?'', ''Volatility ... may be the carrier''). It keeps the family''s design: LIQ-500, weekly credit-specific
  Baa spread shocks, beta-tercile matched legs, 5-day hold, plain rule. Only the sort variable changes, from leverage
  to equity volatility (a different mapping, as the H-0128 avoid line requires; not a new threshold, credit series
  or model). Family reused on purpose (oil-shock-equity-underreaction holds the credit cards), so its trial count
  is the honest penalty. No literature reference is listed; the Merton-model logic is theory, not a published anomaly,
  so no literature prior is claimed. Caveat (K-0161): I could not see H-0128''s exact shock specification (window,
  residualization, threshold), so the shock is re-specified here. A difference against H-0128 may partly come from
  that, which is why the shock is written out in full. What each outcome means: pass with right sign in every third
  means volatility is enough and the learned cards'' balance-sheet inputs added little. Fail inside the cloud with
  the bar under cost means the passes need leverage or refinancing data, or were luck. A wrong sign, or a pass driven
  only by tightening weeks, points to a rebound of high-volatility stocks after stress (K-0084), not to credit news.
  Please report the event average split by widening and tightening weeks, and by leg, if the judge can. Forecasts,
  pessimistic first (K-0120, K-0202). Shock weeks: with fat-tailed residuals, |z| >= 0.75 should hold on roughly
  30-40 % of weeks, about 300-420 event dates in 2000-2020 (first about two years lost to warm-up). Marked events
  per date: 3 terciles x 2 legs x about 30 names = about 180, so 50k-75k events. Round trip about 10-12 bps (LIQ-500
  half-spread tiers 3/6 bps). Gross per event at 5 sessions: pessimistic 2-3 bps, central 10-12 bps (about cost),
  optimistic 25 bps. Book arithmetic: mean exposure equals the share of shock weeks (gross 1.0 when on), about 0.3-0.4,
  above the 0.20 floor. z_news 0.75 was chosen over 1.0 for that reason: at 1.0 the share could fall near 0.2. With
  central gross the book makes about 2 %/yr before and well under 1 %/yr after costs, a Sharpe of about 0.3, so
  the most likely death of the strategy is the absolute 0.5 floor (as with H-0126) even if the mechanism passes.
  The mechanism verdict is the main point of the card. Expected first G1 third: 2000-2007 including the 2001-2002
  credit episode, where H-0128 was wrong-signed.'
