id: H-0159
version: 1
title: Credit-specific spread news into high-volatility stocks, plain rule - LIQ-500 beta-tercile-matched long/short
  on 63-day volatility in weeks of a credit-specific Baa-Aaa move, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity holders who keep holding (or buying) high-volatility, distress-sensitive stocks in the week
    after the bond market has repriced default risk, and who sell the safe low-volatility names after a tightening.
    Generalist equity funds and retail holders do not watch the corporate-bond tape. The pressure is worst in the
    most volatile names, where shorting is costly.
  why: 'Corporate-bond investors (insurers, bond funds, dealers) price changes in aggregate default risk first.
    When the Moody''s Baa-Aaa spread moves more than the stock market explains, that is credit-specific news. In
    a Merton-style structural model a stock''s sensitivity to credit news rises with total equity volatility, because
    volatility combines asset risk and leverage into how close the equity is to being an option out of the money.
    If equity investors absorb credit-market news with a delay of days (segmented investors, limited attention to
    the bond market, short-sale frictions in distressed names), then after a credit-specific widening the most volatile
    stocks keep falling behind the least volatile stocks with the same market beta over the next week, and after
    a tightening they keep catching up. This is the volatility-only control the lab has asked for: two learned credit-shock
    cards (H-0126, H-0158) passed the event test with volatility among their inputs, and the plain leverage sort
    without volatility (H-0128) did not. The card checks whether volatility alone carries those passes.'
  why_not_arbitraged: The trade is a weekly long/short in which the legs differ sharply in idiosyncratic risk. It
    is exposed to credit episodes in which high-volatility stocks gap in either direction, and it is on only a minority
    of weeks, so a desk that carries the risk earns little per unit of capital. Credit and equity desks are usually
    separate, and the Moody's daily averages are not an instrument anyone trades.
signal:
  description: 'Decision schedule: weekly, after the close of the last XNYS session t of each calendar week (usually
    Friday), using only data available at that close. Trades fill at the open of the next session. Positions are
    held until the next weekly decision (about 5 sessions) and are then re-formed or closed. (1) Market return:
    the equal-weighted mean of the daily total returns ((1+ret_co)*(1+ret_oc)-1) of the stocks that are LIQ-500
    members on each session (point-in-time membership). (2) Credit spread: S = DBAA - DAAA from fred_moody_yields_1d,
    read through the dataset clock (next_morning). At the close of t the latest usable value is the one dated t-1
    or earlier; on a day with no value, carry the last usable value. Weekly spread change dS_t = S(usable at t)
    - S(usable at t-5 sessions). Matching market move Rm_t = sum of the daily log market returns over sessions t-5
    .. t-1, the same window as dS_t. (3) Credit-specific shock: on the trailing 104 weekly decision dates before
    t (non-overlapping weekly observations, the current week excluded, at least 78 valid), fit OLS dS = a + b*Rm.
    Residual e_t = dS_t - (a + b*Rm_t). z_t = e_t / standard deviation of the 104 in-sample residuals. A week is
    a shock week if |z_t| >= z_news: widening if z_t >= z_news, tightening if z_t <= -z_news. There is no signal
    before the first 78 valid weeks exist. (4) Stock characteristics at t, from daily total returns of each stock:
    beta = OLS slope of the stock''s daily return on the market return over the last 252 sessions (at least 200
    valid); vol = standard deviation of daily log total returns over the last vol_days sessions (at least 80 % valid).
    Only stocks that are LIQ-500 members and tradable at t and have both values are eligible. (5) Legs on shock
    weeks only: split eligible stocks into beta terciles. Within each tercile, rank by vol. HIGH = top quintile
    of vol, LOW = bottom quintile (round down, at least 5 names per tercile leg, otherwise skip that tercile). Widening
    week: long LOW, short HIGH. Tightening week: long HIGH, short LOW. Equal weights: the union of long names gets
    +0.5 in total, the union of short names -0.5 (gross 1.0, dollar neutral). Legs are matched in beta by construction;
    the expected beta gap between the legs is near zero. (6) Non-shock weeks: flat (all cash). A stock that leaves
    LIQ-500 or stops trading while held is closed at the first decision row where it is no longer allowed (engine
    rule). Missing price: not tradable, not eligible.'
  params:
    vol_days:
      grid:
      - 42
      - 63
      - 126
      value: 63
    z_news:
      grid:
      - 0.5
      - 0.75
      - 1.0
      value: 0.75
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'At the weekly decision after the close of t in a shock week (|z_t| >= z_news, credit-specific Baa-Aaa
    move as in the signal), every stock in a leg (the top or bottom vol quintile within its beta tercile) is an
    event. Side: in a widening week -1 for HIGH-vol and +1 for LOW-vol names; in a tightening week +1 for HIGH and
    -1 for LOW. Unmarked peers on the date are the other eligible LIQ-500 members (the middle three vol quintiles
    of each tercile), so every date has hundreds of peers.'
  horizons:
  - 1
  - 5
  - 10
  - 20
  primary_horizon_days: 5
