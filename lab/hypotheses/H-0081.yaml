falsification_criteria:
- 'Mechanism (G1): the side-adjusted 3-day abnormal return of the high-VIX events is not above the 95th percentile
  of the time-shifted placebos, or gross per event is below the round-trip cost, or the sign holds in fewer than
  two of three sub-periods.'
- 'Mechanism: the latest third of the dev event sample has the wrong sign (decay or a bear-market continuation regime,
  K-0060); this kills the card even if the pooled test passes.'
- 'Mechanism shape: if the abnormal return at 1 and 2 days is not positive and the effect appears only at 10 days,
  it is slow drift, not a liquidity concession given back within days; the card is wrong.'
- 'Cross-asset channel: if a descriptive split (same sort on days with VIX below vix_min) shows a reversal as large
  or larger than on high-VIX days, the TradFi-stress channel is refuted even if G1 passes; the effect would be generic
  crypto reversal.'
- 'Strategy (G1): net Sharpe on dev below 0.5 or below T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness (G2): fewer than 75 % of the neighbors (vix_min 20/30, hold_days 2/5) beat the T-bill bar, or the
  strategy does not beat it at doubled costs, or one third of dev carries more than 60 % of the log return.'
notes: 'Brief fit: short horizon (3 days, grid 2-5) and cross-asset (signal from US equity options via the FRED
  VIX series, trades in crypto perps), which the prior-studies gap list names as untried (''cross-asset signals
  into crypto other than lead-lag''). Not lead-lag: VIX does not predict the direction of any coin; it gates how
  large the reversal of each coin''s own idiosyncratic move should be. Why this is not a near-copy of earlier reversal
  cards (same family on purpose, so the trials count together): studies 6-7 used VIX>25 on US stocks and found the
  market bounce, not stock selection; here the sort is on BTC-beta residuals inside crypto and both sides are marked,
  so a market bounce cancels to first order. H-0006 and H-0049 conditioned on a coin''s own crash and on crypto-internal
  state (BTC trend, funding), H-0071 on venue volume, H-0035 on 15-minute cascades: none used a cross-asset stress
  gate, and none sorted every high-VIX day in both directions. K-0084''s stress rebounds condition on the traded
  asset''s crash; this conditions on another market''s stress and trades relative moves of any sign. Literature
  context, not used for selection: Bianchi, Babiak and Dickerson (2022, JBF, ''Trading volume and liquidity provision
  in cryptocurrency markets'') find liquidity-provision returns largest in smaller, less liquid pairs; Zaremba,
  Bilgin, Long, Mercik and Szczygielski (2021, IRFA, ''Up or down? Short-term reversal, momentum, and liquidity
  effects in cryptocurrency markets'') find that the handful of largest coins show daily momentum rather than reversal.
  The top-30 perp universe is a deliberate cost choice (liquid slippage tiers) that works against the effect: the
  most likely death is that liquid perps show no reversal, or momentum, even on stressed days. I did not widen the
  universe to chase the illiquid-pair effect, because costs there would eat it. Expected numbers (feasibility estimates,
  not tuned): the gate is ON on very roughly 35-45 % of dev days at vix_min 25 (concentrated in the first and last
  years of the perp dev window, thin in the middle year, so the middle third is the noisy block); about 400-500
  event dates with 6 marked coins per side, i.e. roughly 4000-6000 marked events, far above 200 events / 30 dates;
  unmarked peers about 16-18 per date. First cohorts after the 60-day beta warm-up, so a few months after the period
  start; VIX needs no warm-up. Round trip on liquid perps is about 25-35 bps (10 bps fee plus slippage per side).
  Book arithmetic at hold 3: three overlapping cohorts of gross 1/3, about two thirds of gross traded per active
  day, cost drag about 10 bps per active day. If the side-adjusted 3-day abnormal return per event is about 0.6
  %, the book earns about 0.2 % gross and 0.1 % net per active day, roughly 15 %/y net over about 150 active days
  a year with an annualized vol near 12 %: Sharpe near 1. At 0.3 % per event the book only covers costs and dies
  at G1; that is the honest break-even. Mean exposure is about the gate-on share (0.35-0.45), above the 0.2 floor;
  position entries are in the thousands. Timing: VIXCLS has clock next_morning, so the gate lags the US session
  by about one crypto day; VIX regimes are persistent, so the lag costs little and removes any look-ahead. Crypto
  daily close is 00:00 UTC, after the US close. A beta-neutral book was considered and not used to keep parameters
  few; residual ranking keeps the leg betas close, and the G1 abnormal return is raw against unmarked peers (K-0074),
  so a remaining beta gap would show as a sign that follows the market across the thirds. The holdout (2023 on)
  is untouched for this rule; crypto has forward data, so the card could reach G5.'
