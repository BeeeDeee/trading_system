id: H-0081
version: 1
title: TradFi-stress-gated liquidity provision in crypto perps - when VIX is high, buy the day's BTC-residual losers
  and short the winners among the top-30 Binance perps, dollar-neutral, hold 3 days
author_agent: scout
family: short-term-reversal
asset_classes:
- crypto_perp
- macro
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: 'Traders who demand immediacy in single coins on stressed days: forced de-leveraging and liquidations,
    stop-outs, holders exiting one coin, momentum takers chasing the day''s winner. They pay the concession to whoever
    takes the other side.'
  why: 'Returns to short-term reversal are the price of liquidity provision, and that price rises when the capital
    of liquidity providers is constrained (Nagel 2012: reversal profits in US stocks rise with VIX). Crypto liquidity
    is supplied largely by the same multi-asset market makers and leveraged funds that trade US equities and options,
    under firm-wide risk limits and shared margin. When US equity implied volatility is high, those limits bind
    across all their books, so crypto quotes thin and a day''s idiosyncratic order-flow imbalance moves a coin further
    from its value than in calm times; the concession is then given back over the next days as capital returns.
    The signal comes from one market (S&P 500 options, via VIX) and the trade is in another (crypto perpetuals).
    Ranking on the residual of each coin''s return after its BTC beta keeps the bet on the idiosyncratic concession,
    not on the market bounce that explained the owner''s US-stock VIX>25 reversal (studies 6 and 7).'
  why_not_arbitraged: 'The natural arbitrageurs are exactly the constrained liquidity providers: when VIX is high
    their value-at-risk and margin budgets shrink, and holding a dollar-neutral book of volatile altcoins for days
    is risky (jump risk, delistings, further cascades). Crypto-native capital is small and itself levered. The effect
    is a risk premium for bearing inventory in bad times, so it should not vanish, only shrink as capacity grows.'
signal:
  description: 'Decisions once a day after the crypto daily close (00:00 UTC) of day t, trades at the open of day
    t+1 (the next 00:00 UTC bar), using only data up to the close of t. (1) Universe: the point-in-time top 30 USD-M
    perps by trailing 30-day median daily quote volume as supplied by crypto_top_n; BTCUSDT.P is used only as the
    market factor and is never ranked or traded. (2) Returns: r_j,t = close-to-close return of perp j on day t.
    Beta: b_j,t = OLS slope of r_j on r_BTC over the 60 days ending t (inclusive), at least 30 joint observations,
    else j is not eligible on t. Residual: e_j,t = r_j,t - b_j,t * r_BTC,t. (3) Gate: V_t = the most recent VIXCLS
    value that the data layer exposes as known at the decision (under the next_morning clock usually the previous
    US session''s close; weekends and US holidays carry the last value). The gate is ON when V_t >= vix_min. (4)
    Cohort: when the gate is ON and at least 15 coins are eligible, rank eligible coins by e_j,t. The bottom fifth
    (floor(0.2 * N), at least 3 coins) is the long leg, the top fifth (same count) the short leg. The cohort has
    gross 1/hold_days: each long name +1/(2 * hold_days * n_leg), each short name -1/(2 * hold_days * n_leg). The
    cohort is entered at the open of t+1 and closed at the open of t+1+hold_days. When the gate is OFF no cohort
    is formed; live cohorts run to their scheduled exit. (5) Book: sum of live cohorts (a coin in several cohorts
    nets), dollar-neutral, gross <= 1, cash otherwise. A coin that leaves the top-30 universe while held is closed
    at the first decision row at which it is outside the universe (the engine refuses weights outside the universe).
    Missing return on t: the coin is not eligible on t. Funding is charged by the engine (longs pay positive funding,
    shorts receive it). No other filters, no stops.'
  params:
    hold_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    vix_min:
      grid:
      - 20
      - 25
      - 30
      value: 25
  timeframes:
  - 1d
mechanism_test:
  event: After the crypto close of day t, with the last known VIX close at or above vix_min (25), a perp of the
    point-in-time top 30 (BTC excluded, at least 15 eligible coins) whose 1-day BTC-beta-residual return is in the
    bottom fifth of the eligible coins (side +1, should outperform the other coins afterwards) or in the top fifth
    (side -1, should underperform). Unmarked peers are the middle three fifths of the same date.
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 3
