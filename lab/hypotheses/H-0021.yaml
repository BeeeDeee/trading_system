id: H-0021
version: 1
title: IPO lockup-expiry supply overhang - LIQ-500 beta-neutral, short stocks around the 180th calendar day after
  their first trading day, hedged with the other members, hold 5 days
author_agent: scout
family: new-listing-overhang
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders and buyers of the stock who do not track the lockup calendar (retail, index-agnostic and
    momentum-driven buyers of recent IPOs) and absorb the insider supply at the pre-expiry price, plus the selling
    insiders themselves, who accept a price concession because they must or want to sell a large block quickly.
    The strategy is paid for supplying the liquidity early, by shorting before the supply arrives.
  why: Almost every US IPO forbids insiders, venture funds and other pre-IPO holders from selling for a fixed period,
    by convention 180 calendar days after the offering. When the lockup ends, a block of shares that is often several
    times the free float becomes sellable on a date that is public and known months ahead. Pre-IPO holders sit on
    large gains, need to return capital to their funds (VC distribution mandates) or to diversify, and sell over
    the following days; demand for a single stock is downward sloping, so the price gives way. Field and Hanka (2001)
    found a three-day abnormal return of about -1.5 % and a permanent 40 % rise in volume around the expiry, larger
    in venture-backed firms. This is a mandated / contractual supply flow, the class of event that K-0024 says is
    the only one with a visible short-horizon effect in liquid US stocks, not an information or sentiment anomaly.
  why_not_arbitraged: 'Shorting a six-month-old IPO is hard and expensive: shares lent from IPO allocations are
    scarce, borrow fees are often special and recalls are frequent. The expected gain (about 1-2 % over a few days)
    is small against the idiosyncratic risk of one recently listed name (5-day volatility near 8 %), so an arbitrageur
    needs many events to diversify, and events arrive irregularly. Early releases, staggered lockups and waivers
    make the exact flow date uncertain. Capacity is limited by the borrow, not by the signal.'
signal:
  description: 'Data: sharadar_sep for the LIQ-500 universe (point-in-time membership). Decisions after the close
    of day t using data up to that close; trades at the open of day t+1. (1) Listing date: for every stock, its
    first trading day F = first date with a bar (listed and a close) in the loaded panel. Stocks whose first bar
    falls within the first 30 trading days of the loaded panel are treated as pre-existing listings and never produce
    events (the panel start is not an IPO). F is known from day F on, so the rule is causal. (2) Event: stock j
    fires an event after the close of day t if t is the FIRST trading day on which the calendar-day distance date(t)
    - date(F) is at least 180 - lead_days, AND j is a LIQ-500 member at t and tradable at t. Each stock fires at
    most once in its life. No information after t is used (no lookup of the future calendar). (3) Position: from
    the open of t+1, short j for hold_days trading days, exit at the open after the last held day. Short weight
    per active event = min(0.25, 0.5 / n_active), where n_active is the number of event stocks in their hold window;
    weights are recomputed only on days when the active set changes (no daily re-equalising otherwise). (4) Hedge:
    long an equal-weight basket of all other LIQ-500 members at t that are tradable and not themselves in an event
    window, with total long notional = sum over active events of |short weight| x beta_j, where beta_j is the OLS
    beta of j''s daily total return (ret_co + ret_oc, close to close) on the equal-weight LIQ-500 return over the
    days since F up to t (at most 126, at least 60; if fewer than 60 days, beta = 1.0), clipped to [0.5, 2.0]. The
    hedge basket composition is refreshed only when the active set changes. (5) If gross exposure exceeds 1.0, scale
    all weights proportionally to gross 1.0. Flat (cash) when no event is active. If an event stock becomes untradable
    or leaves the universe during the hold, close its short and the corresponding hedge at the next open. Missing
    data for a stock means no event for that stock; never fill.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    lead_days:
      grid:
      - 2
      - 4
      - 6
      value: 4
  timeframes:
  - 1d
mechanism_test:
  event: Stock j (LIQ-500 member, tradable at t, first trading day F at least 30 trading days after the start of
    the loaded panel) reaches, at the close of day t, for the first time a calendar-day distance of at least 180
    - lead_days (176 with the primary lead of 4) from F, i.e. its standard 180-day IPO lockup expires within the
    next few sessions. side = -1 (j should underperform the other members over the next hold_days sessions).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
data_requirements:
- dataset: sharadar_sep
  description: LIQ-500 point-in-time; first bar date of each stock defines its listing date
  fields:
  - ret_co
  - ret_oc
  - close_u
  - dollar_volume
  - tradable
  - listed
  frequency: 1d
  period:
  - '1998-01-02'
  - '2020-12-31'
holding_period:
  rebalance: event
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Field, Hanka (2001) The Expiration of IPO Share Lockups, Journal of Finance
  year: 2001
- cite: Brav, Gompers (2003) The Role of Lockups in Initial Public Offerings, Review of Financial Studies
  year: 2003
falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the lockup events (short side) is not above the 95th percentile
  of the 200 time-shifted placebos, or has the wrong sign in two of the three sub-periods, or the gross effect per
  event is below the round-trip cost.'
- 'Mechanism: fewer than 200 events or 30 event dates in LIQ-500 over dev; then the idea is untestable in this universe
  and must be reported as such, not as a refutation or a pass.'
- 'Strategy: net Sharpe on dev below 0.5 over T-bills, or the one-sided bootstrap bound of the Sharpe difference
  vs T-bills below zero.'
- 'Robustness: fewer than 75 % of the neighbors (lead_days 2/6, hold_days 3/7) reach the bar, or more than 60 %
  of the log return comes from one sub-period (in particular the first one, which holds the 1999-2000 IPO wave).'
- 'Publication: the post-2001 Sharpe excess over T-bills is below half of the pre-2001 one.'
- 'Mechanism shape: if the descriptive 1- and 3-day abnormal returns are positive while only the 10- and 21-day
  ones are negative, the result is generic IPO underperformance, not an expiry-dated supply effect.'
notes: 'Brief fit: US single stocks, cross-sectional, 5-day hold, mechanism test declared. Why this is not one of
  the dead large-cap short-horizon events (K-0024): those were information or attention events (insider filings,
  breakouts, volume, peers, earnings proxies); K-0024 concludes the only events with an effect were mandated flows
  with a known date. A lockup expiry is a contractual supply release on a date fixed at the IPO, and the side that
  loses is identifiable. Family: the economic mechanism (locked pre-listing supply becoming sellable after a listing)
  is the same as H-0004 (crypto new-listing overhang, token unlocks), so this card reuses `new-listing-overhang`
  instead of opening a new family; it differs from H-0004 by being a dated event with a 5-day hold instead of a
  listing-age spread, and by trading liquid US stocks with a hedged short. The 180-day anchor is the industry convention,
  not a tuned parameter; only the entry lead and the hold are on the grid. Point-in-time: the event uses only the
  date of t and the stock''s past first bar; no forward calendar lookup. Known risks, stated in advance: (1) feasibility
  - if the LIQ-500 construction requires more than about six months of trading history, recent IPOs are never members
  at day 176 and the event set is empty; the Builder should fail loudly (report the event count) rather than run
  an empty book. (2) Power - only IPOs liquid enough to rank in LIQ-500 after six months qualify, likely a few hundred
  events over dev; K-0026 applies, but the literature effect (about -1.5 % over 3 days) is several times the round-trip
  cost (two legs, 3-12 bps half spread), so the placebo bar should sit below a real effect. (3) Era concentration
  - the 1999-2000 IPO wave supplies many events and the first sub-period may dominate (G2 blocks, publication decay).
  (4) Alt universe - the S&P 500 rarely admits six-month-old IPOs, so the sp500 alt-universe check may have no events;
  that is a structural property, not evidence against the mechanism. (5) Spin-offs and exchange moves also produce
  a new first bar without a lockup; they dilute the effect but do not bias it in favour. (6) The engine charges
  no borrow cost on shorts, and recent IPOs are often special to borrow, so a pass is somewhat flattered; the Skeptic
  should weigh this. Exposure: flat when no event is active; with the per-name cap of 0.25 and a beta hedge a single
  event gives gross about 0.55, so mean exposure depends on how many days have an active event and could fall near
  the 20 % floor.'
