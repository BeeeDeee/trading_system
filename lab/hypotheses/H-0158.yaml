title: Credit-market news through debt rollover need, learned - LIQ-500 ex banks dollar-neutral weekly, LightGBM
  on short-term debt, cash, leverage and volatility x credit-specific Baa-Aaa shock, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity holders of rollover-exposed firms who keep the shares at pre-news prices for days after a
    credit-specific widening, and investors who sell insulated cash-rich firms along with the market. Both trade
    on headline proxies, not on the maturity profile. The mirror applies after a credit-specific tightening.
  why: A move in corporate credit spreads that the stock market has not explained is news about the price at which
    firms can refinance. The news does not hit every equity alike. A firm that must roll over a large slice of its
    debt within the year, and has little cash to pay it down, faces the new spread on its cash flows almost at once.
    A firm with long-dated debt or a cash pile is barely touched. Rollover-risk theory (He and Xiong 2012) and the
    2007 crisis evidence on debt maturity (Almeida, Campello, Laranjeira and Weisbenner 2012) both say the exposure
    is the short-term part of debt net of cash, scaled by the firm's size and leverage. Equity investors price aggregate
    credit news through simple proxies such as sector, beta and headline leverage. They do not read maturity schedules,
    which sit in the quarterly balance sheet (current debt), so the repricing of the rollover-exposed firms relative
    to the insulated ones should take days, not one session. The lab has one measured pass for credit news reaching
    levered large caps within a week (H-0126, a gbm on leverage, coverage and volatility). The plain leverage sort
    that followed (H-0128) did not repeat it. This card tests a different balance-sheet mapping, the refinancing
    channel, which is what the H-0128 lesson asks for.
  why_not_arbitraged: 'The signal needs three things: an aggregate credit series, quarterly balance-sheet detail
    and a residual shock. Equity desks that run sector or factor books seldom combine them, and credit desks do
    not trade the equity cross-section. The trade happens in a few weeks a year, is dollar-neutral with modest gross,
    and has a beta and sector tilt that changes with the sign of the shock. That is unattractive capacity for large
    funds. The news comes in bursts, so the trade is idle most of the time.'
signal:
  description: 'Point in time. Decisions are taken after the close of the last trading session of each calendar
    week (t), using data up to that close. Trades happen at the open of t+1. Stocks are LIQ-500 point-in-time members,
    minus banks and deposit takers (latest usable SF1 quarter has deposits > 0). Feature rows and model fits run
    on all columns, and non-members are masked per row (K-0134); no column or row subset is chosen with information
    from the end of the view. (1) Credit shock (date-level, one number per session, fed raw to the model and not
    z-scored across stocks). s_d = DBAA_d - DAAA_d from fred_moody_yields_1d, used with its next_morning clock,
    so on session d the last usable value is the one stamped before d. ds_d = change of s over the last 5 sessions
    with a usable value. m_d = equal-weight mean total return of the LIQ-500 members over the same 5 sessions. Over
    the trailing 252 sessions strictly before d, regress ds on m by OLS. e_d = ds_d - (a + b * m_d), and z_d = e_d
    / (std of the trailing 252 in-sample residuals). z needs 252 sessions with values; earlier it is NaN and the
    date is not scored. Positive z means credit spreads widened more than the equity market explains. (2) Stock
    features from the latest usable SF1 quarter (ARQ, usable from the session after the filing, stale after 400
    days). Each is z-scored across members on each date with the framework helper and winsorized at +/-3. (a) net
    rollover need = (debtc - cashneq) / assets; (b) short-term share of debt = debtc / debt, set to 0 when debt
    = 0; (c) book leverage = debt / assets; (d) 63-session realized volatility of daily total returns (at least
    50 valid days). A stock missing assets, debt, debtc or cashneq is not scored. (3) Label: the framework label,
    total return from the next open to the open 5 sessions later, ranked across members on each date. Model: LightGBM
    (framework gbm) on the 5 features (a)-(d) plus z. Expanding window, refit every 126 rows, framework purge and
    seeds. Fixed hyperparameters: learning_rate 0.05, num_leaves 15, min_child_samples 200, subsample 0.8, colsample
    0.8. n_estimators is a grid parameter. Training uses all daily rows, so the model sees calm and shock periods
    alike. (4) Book, built with score_weights and only_on at the weekly decision dates. With at least 100 scored
    members, go long the top `top` fraction of the score and short the bottom `top` fraction, equal weight inside
    each leg, each leg g/2 of equity, where g = min(1, |z_t|) if |z_t| >= 0.5 and g = 0 (flat) otherwise. Hold to
    the next weekly decision date, so about 5 sessions. The gbm decides the direction: z is one of its inputs. The
    size rule (g) is a hand-written cap and pays nothing by itself; it only keeps calm weeks out of the book. A
    stock that leaves LIQ-500 between decisions is closed at the first decision row outside the universe (K-0051).
    Fewer than 100 scored members, or z NaN: flat.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: At a weekly decision date (last session of the week) whose credit-specific shock satisfies |z_t| >= 1,
    a scored LIQ-500 non-bank stock is placed in the top `top` fraction of the gbm score (side +1) or in the bottom
    `top` fraction (side -1).
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'Credit-specific shock z: 5-session change of the Moody''s Baa-Aaa yield spread (fred_moody_yields_1d, next_morning
    clock), residual to the 5-session equal-weight LIQ-500 return by a trailing 252-session OLS, divided by the
    trailing residual std. Date-level and fed raw. It measures how much refinancing conditions changed beyond what
    stocks already priced.'
  - 'Net rollover need: (current debt - cash and equivalents) / total assets, latest usable SF1 ARQ quarter. Debt
    that must be refinanced within a year and cannot be paid from cash: the direct exposure to the new spread.'
  - 'Short-term share of debt: current debt / total debt (0 if no debt), SF1 ARQ. Maturity structure, separating
    firms that refinance soon from those locked into long-dated debt at old spreads.'
  - 'Book leverage: total debt / total assets, SF1 ARQ. Rollover need only matters when debt is material; also the
    H-0126/H-0128 proxy, so the model can show whether maturity adds to it.'
  - '63-session realized volatility of daily total returns. Equity''s option-like sensitivity to credit news (Merton):
    the same refinancing shock moves a volatile, distressed equity more.'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The label is ranked across stocks on each date and z is the same for every stock on a date. A
    ridge on these features gives score = a*z + b''x, and a*z is constant within the date, so its ranking is the
    same fixed sort on the balance-sheet features whatever the sign of the news. It cannot short rollover-exposed
    firms after a widening and buy them after a tightening, which is the whole claim. A tree can split on z first
    and sort on rollover need inside each branch. The refinancing channel is also expected to be thresholded and
    multiplicative: net rollover need matters only when leverage is material and cash does not cover current debt,
    and more so for volatile equity. A linear model with hand-made products z*x captures the sign flip but not the
    threshold. The falsification criteria name that stronger linear baseline. Who pays: holders of rollover-exposed
    equity who keep old prices after credit-specific widenings (and the mirror after tightenings), and holders of
    cash-rich firms sold along with the market.'
data_requirements:
- dataset: sharadar_sep
  frequency: 1d
- dataset: sharadar_sf1
  description: 'As-reported quarterly balance sheet: current debt, total debt, cash and equivalents, total assets,
    deposits (only to drop banks). Usable from the session after the SEC filing.'
  fields:
  - sf1_arq_debtc
  - sf1_arq_debt
  - sf1_arq_cashneq
  - sf1_arq_assets
  - sf1_arq_deposits
  frequency: 1q
- dataset: fred_moody_yields_1d
  description: Moody's seasoned Aaa and Baa corporate yields; the spread DBAA - DAAA is the credit series (same
    Baa series as H-0126/H-0128, not swapped).
  fields:
  - DAAA
  - DBAA
  frequency: 1d
holding_period:
  rebalance: weekly
  typical_days: 5
market_exposure: market_neutral
falsification_criteria:
- Net Sharpe on dev below 0.5, or below the T-bill benchmark Sharpe + 0.10.
- Fewer than 75 % of the grid neighbors of n_estimators 100 and top 0.2 beat the T-bill benchmark.
- 'Mechanism: the shock-week leg entries (mechanism_test event) are not above the 95th percentile of the time-shifted
  placebos, or their gross side-adjusted 5-session abnormal return is below the round-trip cost. Either kills the
  refinancing-channel claim in this universe.'
- 'Mechanism sign: fewer than 2 of 3 dev blocks share the sign. The first block is partly empty from model warm-up
  (K-0163), so in practice both later blocks must be positive; a negative latest block is a kill in spirit even
  if the pooled test passes.'
- 'Horizon shape: if the abnormal return is already complete at 1 session and flat or reversing by 5, the news was
  priced at once and a next-open taker is late. If it keeps growing evenly to 21 sessions, it is slow style drift,
  not delayed absorption of credit news. Either shape refutes the underreaction claim.'
- 'Linear baseline: a ridge (framework ridge) on the same five features plus the hand-made products z*(net rollover
  need), z*(short-term share), z*(leverage), z*(volatility) gives the same or a better shock-week result. Then the
  threshold claim is false and the linear interaction is the card.'
- 'Mapping control: a gbm on z, leverage and volatility only (no current-debt or cash features) gives the same shock-week
  result. Then debt maturity adds nothing over the distress proxies of H-0126.'
notes: 'Relation to earlier cards. H-0126 (gbm on leverage, coverage, volatility x credit shock) passed its mechanism
  test and failed only the absolute Sharpe floor: invested about a fifth of the time, with the short leg losing.
  H-0128 (plain leverage sort, same Baa series) and H-0129 (inflation via nominal/real assets) failed. The H-0128
  lesson says a third credit trial needs a different mapping, not a new threshold, and asks whether something other
  than leverage carried H-0126. This card changes the mapping to the refinancing channel (current debt net of cash,
  and maturity share). It keeps the Baa series, as that lesson asks, and does not reuse H-0126''s z_news or tree
  count. Interest coverage is left out on purpose, so the test does not rebuild H-0126. Family reused honestly:
  oil-shock-equity-underreaction is the lab''s macro-news-to-stocks family, with its trial count. Theory background,
  not a published trading rule as far as I know, so no `references` entry: He and Xiong (2012, Journal of Finance,
  ''Rollover Risk and Credit Risk''); Almeida, Campello, Laranjeira and Weisbenner (2012, Critical Finance Review,
  ''Corporate Debt Maturity and the Real Effects of the 2007 Credit Crisis''). The Skeptic may add them as a literature
  prior if it disagrees. Book design against known deaths. K-0147/K-0027: rare-state signals cannot carry an always-on
  book, so the book is flat in calm weeks (|z| < 0.5) and scales with |z| up to full gross. K-0104 exposure arithmetic:
  if z is close to normal, P(|z| >= 0.5) is about 0.62 and E[g] about 0.54 gross, or about 0.27 per leg. Either
  reading clears the 0.20 floor, but fat tails or a slowly varying z could push the per-leg figure toward it. About
  30 decision dates a year carry a position, so roughly 550-600 non-zero-turnover dates in dev. K-0172 leg expectation:
  after widenings I expect the short leg (rollover-exposed) to carry and the long leg (cash-rich) to be about flat.
  After tightenings it is the mirror, the long leg (rollover-exposed rebound) carrying. Pooled, neither leg should
  lose systematically. If the short leg loses after widenings, the claim is wrong. K-0074 beta gap: rollover-exposed
  firms are likely higher beta and more cyclical. The side flips with the sign of z, so the beta gap contributes
  the post-shock market return times the gap, with alternating sign. The z residualization on the market return
  keeps the shock from being just a market move. The G1 test is still against raw unmarked peers, so a market-rebound-after-credit-stress
  reading (K-0084) is the main confound; a side split (widening vs tightening weeks) and an episode split are requested
  controls, not run by the judge. Forecasts (K-0120: count from the series, take cost from the tier). Weekly dates
  with |z| >= 1: about a quarter to a third of about 1000 scored weeks (about 2001-2020 after warm-up), so 220-320
  event dates. Scored members about 380-430, so legs of about 75-85 each and 140-170 events per date: 30000-50000
  events. Round trip in LIQ-500 about 12-13 bps (K-0125). Gross per shock-week event needed: above about 13 bps.
  H-0126 reached about cost, so the central case is a cost-ratio near miss and the optimistic case is 20-30 bps.
  Expected annual book: about 30 % of weeks with a spread of 20-30 bps at about 0.8 gross give 2.5-4 % gross. Weekly
  turnover is high because the score flips with z: cost drag is about 2-3 % a year at about 0.54 mean gross. Net
  Sharpe is near the 0.5 floor in the central case. The most likely death is the cost ratio or the absolute floor,
  as for H-0126. First G1 block (1998-2005) will be thin: z needs 252 sessions and the gbm its minimum training
  sample. No mechanism event is defined on calm weeks on purpose: the claim is only about credit-news weeks.'
