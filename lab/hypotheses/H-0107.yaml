# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0107
version: 1
title: Wrapper-specific ETF flow-day reversal, learned - S&P 500 core plus 5-day tilt into no-news stocks pushed
  down by a SPY-residual sector/industry ETF flow day (LightGBM)
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Wrapper traders who sell a sector ETF with market orders on a sector-specific day (tactical rotation,
    hedging a sector book, shorting the sector through the ETF) and the basket arbitrage that forwards that pressure
    into constituents whose own fundamentals did not change; the liquidity providers who absorb the basket sales
    are paid the concession, and this book buys alongside them at the next open.
  why: 'When a sector or industry ETF trades abnormal volume with a large move that is NOT a market-wide move (its
    return residual to SPY is extreme), the flow comes from investors trading the wrapper (tactical rotation, hedgers,
    short sellers of the sector). Authorized participants and ETF arbitrageurs transmit that flow into the constituents
    by trading the whole basket, so every constituent is pushed in proportion to its tie to the basket, regardless
    of its own news. Constituents without own news that were pushed down are priced below their fundamental value
    by a non-fundamental shock and recover relative to the market over the following days, as liquidity providers
    who absorbed the basket sales unwind (Ben-David, Franzoni and Moussawi 2018 show ETF ownership adds non-fundamental
    volatility that partly reverses). The lab already saw this once: in H-0106 new leg entries on sector-SPDR flow
    days beat time-shifted placebos with gross about twice the round trip and a positive latest third (K-0146),
    but they were 4.5 % of a daily all-names book that earned nothing (K-0147). This card tests the event alone,
    in the vehicle K-0147 asks for, with three sharpenings that make the test more diagnostic: (1) the push is the
    wrapper''s SPY-residual move, so pure market stress days (the generic stress rebound of K-0084) are excluded
    by construction; (2) stocks with an own 8-K (earnings or other) on the flow day are excluded, so the move is
    the basket''s, not the stock''s; (3) four industry ETFs are added to the nine sector SPDRs, which adds flow
    days outside market-wide stress.'
  why_not_arbitraged: The concession is small per name, arrives on few days, sits in the stocks of one sector at
    once (sector risk that a market-neutral arbitrageur must hedge with the same ETF that is under pressure), and
    falls on days when the sector looks like it is repricing on news; telling flow from news in real time is the
    hard part, which is what the model is asked to do.
signal:
  description: 'All quantities use data up to the close of day t; trades at the open of t+1. Daily close-to-close
    total return r = (1+ret_co)(1+ret_oc)-1 for stocks (sharadar_sep) and for the signal-only ETFs (sharadar_sfp:
    SPY and the 13 wrappers XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, SMH, IBB, IYR, IGV; none of them is traded).
    (a) Residuals: for each wrapper k and each stock j, beta to SPY by OLS over the trailing 126 sessions (t-125..t,
    at least 100 valid returns); residual return e = r - beta * r_SPY. (b) Assignment: each S&P 500 member j on
    date t is assigned to the wrapper k with the highest correlation of e_j and e_k over the trailing 126 sessions,
    provided that correlation is at least 0.30; otherwise j is unassigned. b_jk = OLS slope of e_j on e_k over the
    same window. Recomputed every day, point in time. (c) Down-flow day of wrapper k at t: dollar volume of k at
    t >= 2 x its median over t-63..t-1 AND e_k,t <= -flow_sigma x the standard deviation of e_k over t-63..t-1.
    (An up-flow day is the mirror: same volume rule and e_k,t >= +flow_sigma x std.) (d) Flow rows: member j at
    t is a flow row if its assigned wrapper has a down-flow or up-flow day at t, and j has neither ea_reaction_day
    = 1 (sec_8k_item202) nor nonearn_8k_reaction_day = 1 (sec_8k_items) at t; NaN flags count as no filing. Down-push
    candidates = flow rows whose wrapper has a down-flow day. (e) Model: framework walk_forward with model gbm (LightGBM),
    label = cross-sectional rank of the total return from the open of t+1 to the open of t+6 (horizon 5) among all
    members, trained ONLY on flow rows (both directions; the row mask is the point-in-time flow-row condition),
    expanding window, refit every 126 rows, num_leaves 8, learning_rate 0.05, min_child_samples 200, n_estimators
    from params. Features (z-scored across members on each date by the framework helper, computed for every member,
    used only on flow rows): see ml.features. Before the first fit there are no scores and the book is core only.
    (f) Events: on each date, the down-push candidates whose model score is in the top half of that date''s down-push
    candidates (rounded up, e.g. 3 of 5); a date with fewer than 2 down-push candidates has no events. (g) Book,
    long-only, gross 1: core target weights c_j proportional to each current member''s 63-session median dollar
    volume (liquidity proxy for capitalization weight), recomputed on the first decision date of each month and
    held fixed otherwise (members that leave the index are dropped and the rest renormalized at the next decision).
    Each event opens a slot of 3 % of NAV in that stock for 5 sessions (decided after the close of t, bought at
    the open of t+1, removed from the target after the close of t+5, i.e. sold at the open of t+6); a stock that
    is an event again while in a slot has its slot renewed, not doubled. Total slot weight T is capped at 50 %:
    if new entries would exceed it, the new entries of that date are scaled down equally. A slot whose stock leaves
    the S&P 500 is closed at the next decision. Final target w_j = (1 - T) c_j + slot_j. Missing data: a stock without
    a complete feature vector is not a flow row; a wrapper without a price or volume on t has no flow day at t.'
  params:
    flow_sigma:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
  timeframes:
  - 1d
mechanism_test:
  event: After the close of day t, an S&P 500 member whose assigned wrapper ETF (highest trailing residual correlation
    >= 0.30 among nine sector SPDRs and four industry ETFs) has a down-flow day (wrapper dollar volume >= 2x its
    63-session median and SPY-residual return <= -flow_sigma x its 63-session residual std), with no earnings or
    non-earnings 8-K reaction session at t, and whose walk-forward gbm score is in the top half of that date's down-push
    candidates; side +1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'push: b_jk x e_k,t, the move the wrapper''s residual flow implies for the stock (size and sign of the non-fundamental
    shock delivered by the basket trade); 126-session betas, close of t'
  - 'idio: e_j,t - push, the stock''s own residual move beyond what the basket implies (own unfiled news or resistance
    to the push)'
  - 'flow intensity: log of wrapper dollar volume at t over its 63-session median (how large the wrapper flow was)'
  - 'relative flow size: log of wrapper dollar volume at t over the stock''s 63-session median dollar volume (price
    impact of the basket trade on this stock''s own liquidity, a proxy for ETF ownership share)'
  - 'tie strength: trailing 126-session correlation of e_j with e_k (how tightly arbitrage links the stock to the
    basket)'
  - 'own volume shock: log of the stock''s dollar volume at t over its 63-session median (absorbing the basket versus
    trading on own information)'
  - 'residual risk: 63-session standard deviation of e_j (inventory risk of the liquidity provider, which scales
    the concession)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'The claim is multiplicative and state-dependent: the expected next-week return should be about
    -push times a factor that grows with relative flow size and tie strength and switches off when the stock''s
    own volume shock and idio show own information (a stock that fell far beyond the push on its own heavy volume
    is repricing, one that fell by about the push on volume proportional to the basket is being pushed). A ridge
    on the same seven features can learn only an average reversal coefficient on push plus additive main effects;
    it cannot scale the reversal by relative size or turn it off with the own-news pattern, and it cannot treat
    up- and down-pushes asymmetrically. The model pays only if the concession is concentrated in the pushed-but-uninformed
    subset. The wrapper sellers pay for it.'
