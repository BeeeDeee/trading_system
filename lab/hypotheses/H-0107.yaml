falsification_criteria:
- 'Mechanism: the event average 5-session abnormal return is below the 95th percentile of the time-shifted placebos,
  or gross per event is below the round-trip cost (expected about 11-14 bps for S&P 500 names).'
- 'Mechanism decay: the latest third of dev (about 2015-2020) has a negative event average; then the effect is treated
  as gone (K-0060), whatever the pooled result.'
- 'Mechanism shape: the 1-session average is zero or negative and the gain appears only at 10 sessions; that is
  slow sector drift, not a flow concession that reverts within the week.'
- 'Mechanism versus H-0106: if the event average is inside the placebo cloud here while H-0106''s flow-day entries
  passed, the H-0106 pass belonged to market-wide stress days (generic stress rebound, K-0084), not to wrapper-specific
  flow.'
- 'Strategy: net Sharpe on dev below SPY_TR + 0.10, or the bootstrap bound of the Sharpe difference at or below
  zero.'
- 'Robustness: fewer than 75 % of the neighbors of flow_sigma 2.0 and n_estimators 100 beat SPY_TR, or the book
  fails at doubled costs.'
- 'Nonlinearity: a ridge on the same features, flow rows, label and schedule gives the same or a larger event gross;
  then the interaction claim is false even if the mechanism passes, and any follow-up should be the linear rule.'
notes: 'Why this is not a retry of H-0106 (same family, counted together): H-0106 defined pushes on total sector
  moves, so most of its flow days were market-wide stress days, used the own news only as a feature, trained on
  all member-days and traded a daily all-names dollar-neutral book whose short leg lost. Here (i) the push is residual
  to SPY, so the event set is mostly different days and the stress-rebound reading (K-0084) is removed by design;
  (ii) own 8-K sessions are excluded as a hard rule; (iii) the model is trained on flow rows only (K-0096 lesson:
  event rows must not be a tiny share of training rows); (iv) the book is the K-0147 vehicle, an always-invested
  long-only core with event slots, no shorts (K-0064, H-0106 short leg). The H-0106 top fraction and tree count
  were not tuned on its result; this card has its own grid. Forecasts (K-0120, K-0144, written before any data):
  wrapper flow days by the joint rule on roughly 2-4 % of sessions per wrapper, about half down; S&P members with
  residual correlation >= 0.30 to some wrapper about 60-75 %; down-push candidate rows 8,000-25,000 over dev, events
  (top half) 4,000-12,000 on 300-800 dates, i.e. 250-750 events a year. Gross per event: H-0106 measured about 28
  bps on flow-day entries including stress days; removing market-wide days probably lowers it, central forecast
  15-25 bps, pessimistic case (a tenth of the literature, a third of H-0106) 3-8 bps, which would fail the cost
  check and say the H-0106 pass was stress rebound. Round trip about 11-14 bps (K-0144, H-0106). Book arithmetic
  (K-0098, K-0104): mean slot weight = events x 5 / 252 x 3 % = about 15-45 % of NAV (the 50 % cap binds on clustered
  days, so less). Expected annual gain = events per year x net per event x 3 %: at 500 events and 12 bps net, about
  1.8 % a year over the core, tracking error about 2-3 %; with SPY-like volatility that is a Sharpe gain of about
  0.08-0.12, i.e. AT the +0.10 margin. So the strategy passes G1 only if gross per event is at the upper end of
  the forecast; the more likely ending, if the mechanism is real, is a mechanism pass with a book margin just under
  the bar (the H-0033 pattern). The core is a dollar-volume- weighted proxy of the cap-weighted index, which adds
  its own tracking difference to SPY_TR (it overweights high-turnover names); no core-only control can be reported.
  Risks named in advance: falling knife in a sector that keeps being sold on real news (financials in a credit crisis),
  where the residual push repeats day after day and slots renew; correlation-based wrapper assignment is a proxy
  for ETF membership (ticker-blind data); IYR and XLF, and XLK, SMH and IGV compete for the same stocks and assignment
  picks the tightest; the 8-K flags miss some filings (K-0035) so some news days stay in. Data period starts at
  the 8-K flag start so every G1 third has real flags (K-0145); wrapper betas and correlations warm up from the
  view start (K-0108), the model''s first fit needs about a year of flow rows, so the first third of dev has fewer
  scored events. Mechanism test event = the model''s top-half down-push candidates, so the test is about the model''s
  top-score event as required; the ridge comparison is listed as a falsification criterion and should be run if
  the mechanism passes. Beta gap (K-0074): events are a sector slice on a sector-specific down day, measured against
  all other members; their SPY beta is close to the average member''s because the push is residual to SPY, but sector
  exposure over the next week is the claim itself. No forward data for US stocks: G4 is the ceiling.'
