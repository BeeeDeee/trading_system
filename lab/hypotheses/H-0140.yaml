mechanism:
  counterparty: Liquidity providers and range traders who sell into a US-open breakout above the opening range (or
    buy below it) expecting the 24/7 market's usual intraday mean reversion, and traders who fade the overnight
    move into the US open; both supply liquidity to the US participants who are trading late on the pre-session
    information and lose the continuation the late flow produces.
  why: 'The move from 00:00 UTC to the 09:30 ET US cash open is made by Asian and European participants on thinner
    books; most US-based money (US desks trading CME, Coinbase and Binance, US equity-linked macro flow, US retail)
    acts on that information only once the US session opens. If information diffuses slowly across time zones (late-informed
    or infrequently rebalancing traders, the mechanism Gao, Han, Li and Zhou give for market intraday momentum,
    where the return from the previous close to 10:00 predicts the end of the day), then a US-open range breakout
    that agrees with the pre-session move marks the arrival of US flow that confirms the overnight news, and that
    flow keeps coming for the rest of the US session. A breakout against the pre-session move is, under this story,
    noise or a local correction and has no follow-through. This is the crypto analogue of trading an opening-range
    breakout only in the direction of the gap. The competing story (attention overshoot: thin-book pre-session moves
    are faded when US liquidity arrives, so aligned breakouts are exhaustion and against-move breakouts carry the
    move) predicts the opposite sign; the card bets on continuation and reports the against-move breakouts as the
    pre-registered control that would show the fade.'
  why_not_arbitraged: The edge per trade is small next to taker costs (the unconditional rule, H-0137, grossed a
    little under the round trip), it lives in a few hours of one session per weekday, so capacity is small for a
    fast desk, and the position carries open-ended intraday directional risk with fat tails. Whatever is left after
    intraday-momentum desks is thin; whether anything is left is exactly the question.
signal:
  description: 'Instruments BTCUSDT and ETHUSDT perps, 15-minute candles, decisions after each closed candle, fills
    at the next candle''s open (engine default). All times are converted from America/New_York local time to UTC
    with the timezone database, so daylight-saving shifts are handled (09:30 ET is 13:30 or 14:30 UTC); no date
    literals. Sessions: every Monday-Friday New York date (US holidays are not removed; there is no calendar input,
    and the few holiday sessions just dilute the result). For each instrument and session: (1) Opening range: OR_high
    = max(high), OR_low = min(low) of the two candles that start at 09:30 and 09:45 ET. (2) Pre-session move: r_pre
    = ln(open of the 09:30 ET candle / open of the 00:00 UTC candle of the same UTC date). Its scale s = sample
    standard deviation of r_pre over the previous 20 weekday sessions of the same instrument (today excluded; at
    least 15 valid values, else no trade that session); z_pre = r_pre / s. All of this is known at 10:00 ET, before
    any entry. (3) Breakout: scan the candles that close at 10:15 ET through 15:45 ET in order; the FIRST candle
    whose close is above OR_high gives direction d = +1, the first whose close is below OR_low gives d = -1. Only
    the first breakout of the session counts; if no candle closes outside the range there is no trade. (4) Alignment
    filter: trade only if d * z_pre > k (param k, primary 0.25 standard deviations). If the first breakout is not
    aligned the session is skipped (do not wait for a later breakout the other way). (5) Position: weight d * 0.5
    in that instrument (BTC and ETH can be open together, gross <= 1), entered at the open of the candle after the
    breakout candle. (6) Exit: time exit only, no stop and no reversal: the decision after the candle that closes
    at 16:00 ET sets the weight to 0, filled at the open of the 16:00 ET candle. At most one trade per instrument
    per session; nothing is held overnight or over weekends. Missing or gap-filled (not real) candles: if any candle
    of the opening range or the 00:00 UTC / 09:30 ET opens is missing, no trade that session; if the instrument
    is not real/listed at the exit candle, close at the first real candle. Control (pre-registered, not judged):
    the strategy function takes a fixed argument side_mode in {with, against, all}; the judged primary and all grid
    runs use ''with'' (step 4 as above); ''against'' trades only breakouts with d * z_pre < -k, ''all'' drops step
    4 (the unconditional rule of this card). The Builder keeps all three modes in the same code path so the control
    runs on identical entry/exit logic.'
  params:
