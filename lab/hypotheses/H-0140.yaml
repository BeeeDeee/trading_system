falsification_criteria:
- 'G1 (intraday): fewer than 300 trades in 2020-2022, net Sharpe below 0.5, or the 75 % bootstrap bound of the mean
  net trade at or below zero.'
- 'G2: the neighbors k = 0.0 and k = 0.5 are not both positive, or their median Sharpe is below 0.70 of the primary''s;
  a one-candle later fill keeps less than half the Sharpe; doubled costs make it non-positive; fewer than 2 of 3
  dev blocks positive or one block carries more than 60 % of the return; it does not beat 95 % of random-timing
  books.'
- 'Mechanism (control, read by the Chair from the side_mode runs): mean gross return per trade of ''with'' breakouts
  is not above that of ''against'' breakouts at k = 0.25. Then continuation through the US open is refuted; if ''against''
  is clearly above ''with'', that is evidence for the attention-overshoot fade, to be filed as a new counted trial
  of this family, never as a rescue of this card.'
- 'Mechanism (incremental value): mean gross per trade of ''with'' breakouts is not above that of ''all'' breakouts
  by at least one third of the round-trip cost (about 4-5 bps on BTC/ETH): then the alignment filter only thins
  the trade list and does not select better trades.'
- 'Mechanism (dose): mean gross per trade at k = 0.5 is below that at k = 0.0. Stronger agreement with the pre-session
  move should mean stronger continuation.'
- 'Bull-market artefact (study 16 verdict on ORB): the short ''with'' trades have negative gross per trade while
  the long ones carry the result, or 2020-2021 carries the result and 2022 loses.'
notes: 'owner_seed: ORB-C4

  What is new versus the family. H-0137 (all US-open breakouts), H-0138 (high-volatility days) and H-0139 (after
  a narrow-range weekday) conditioned the same breakout on the volatility state. This card conditions on direction
  agreement with information that arrived before the US open (the 00:00 UTC to 09:30 ET move), which is the intraday-momentum
  claim of Gao et al. (return measured from the previous close through the first half hour predicts the rest of
  the day) translated to 24/7 crypto with the US cash open as the anchor. It is a fourth trial of family us-open-range-breakout-crypto
  plus study 16''s ORB configurations; it does not escape the family count. It is not H-0139 again and does not
  combine with H-0138''s filter. The opening range (two candles, 09:30-10:00 ET) and the 16:00 ET exit are the owner''s
  ORB-C1 rule, not chosen here; I could not read H-0137''s code, so if H-0137 used a stop or a different last-entry
  candle, this card''s description governs, and all three comparisons that matter (with / against / all) are made
  inside this card on identical logic.


  The control the owner asked for. The intraday judge has no mechanism channel (K-0191): it reports neither side
  splits nor controls, and owner diagnostics written as separate modules never ran for H-0137 and H-0139. So the
  control is built into strategy.py as the side_mode argument (same code path), and the request is that the Builder
  or the Chair runs side_mode = against and side_mode = all at k = 0.25 on dev and reports for each: trade count,
  mean gross and net return per trade, split long/short, and per dev third. Note the arithmetic: ''with'' and ''against''
  partition ''all'' (except |z_pre| <= k), so if ''all'' grosses just under cost (H-0137) and ''with'' clears it,
  ''against'' must gross below ''all''. A large ''with'' minus ''against'' gap is the mechanism; a gap of either
  sign is informative, which is why the owner wants both. The owner is right that the sign is open: gap continuation
  (news) and gap fade (attention overshoot) both have support. The card pre-registers continuation as the judged
  side because that is the queue item; a fade card after seeing the control would be a dev-selected sign and must
  be counted as a new trial.


  Parameter. One parameter, k (alignment threshold in standard deviations of the pre-session move): 0 = any agreement
  of sign, 0.25 = primary (drops near-zero pre-session moves whose sign is noise), 0.5 = strong agreement. Round
  values, not tuned. The range length and exit hour are fixed by the seed on purpose: the family''s lessons forbid
  refiling with another range length or exit hour.


  Forecasts (dev 2020-2022, 2 instruments, about 780 weekdays each): about 85-90 % of sessions break out before
  the exit; agreement with the pre-session sign about half of them. Trades about 650 at k = 0, about 540 at k =
  0.25, about 420 at k = 0.5, all above the 300 minimum. Mean hold 3-4 hours. Round trip about 13 bps (5 bps fee
  + 1.5 bps slippage per side on BTC/ETH). If the mechanism holds, gross per ''with'' trade 20-30 bps against about
  10 bps for ''all'' (H-0137 was a little under cost) and near zero or negative for ''against''; net Sharpe 0.6-1.0.
  Probability of passing G1 about 30 %; of passing G2 given G1 about 40 %.


  Most likely deaths. (1) G1 on the mean net trade: alignment adds only a few bps, not enough over a rule that was
  below cost. (2) G2 on the one-candle delay or doubled costs: the post-breakout continuation is front-loaded and
  a late taker pays for it (H-0063). (3) G2 blocks: the 2020-2021 bull drift carries the long ''with'' trades (study
  16''s ORB verdict) and 2022 loses; the side split in the control report is meant to catch this. Exposure is low
  by design (a few hours per weekday at half weight per coin); the intraday judge has no exposure floor, but Sharpe
  is diluted by flat time. Intraday data has no forward source, so the card can pass at most G4.'
