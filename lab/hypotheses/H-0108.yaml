id: H-0108
version: 1
title: Value-anchored rebound vs value-trap continuation after extreme non-earnings drops, learned - LIQ-500 neutral
  within the tail, LightGBM, 5-day cohorts
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Long side: impatient sellers (redeeming funds, de-risking desks, basket and sector sellers) who
    sell profitable cheap firms into a drop with market orders and pay the concession. Short side: dip buyers who
    buy distressed cheap or expensive no-anchor names after a fall because they look cheap against their recent
    price, not against fundamentals.'
  why: 'A stock that falls sharply over a week with no earnings release has been hit either by non-information selling
    (fund redemptions, de-risking, basket and sector selling, margin calls) or by information that is not an earnings
    number (guidance, competitor news, sector repricing). Investors who sell for liquidity sell regardless of value.
    Liquidity providers and value investors only buy into a drop when they can anchor on fundamentals. If the firm
    is cheap on current earnings and book and is profitable, the drop pushed price further below an anchor and the
    concession reverts within days. If the firm is cheap but unprofitable (distress, a value trap) or expensive
    with no earnings anchor, nobody holds an anchor to buy against, the drop more likely carries information, and
    it continues. The claim: inside the same set of extreme droppers (same week, similar move, similar beta), the
    valuation x profitability state separates rebounders from continuers, and the spread over five sessions is larger
    than the round trip.'
  why_not_arbitraged: Liquidity-provision capital is scarce and leaves exactly when many names fall together. Fundamental
    investors react at monthly, not daily, speed, and the trade needs both a fundamental view and a five-day horizon,
    which few mandates combine. Each position is small, short-lived and costly to trade, which limits capacity and
    keeps large funds out.
signal:
  description: 'Data: sharadar_sep total returns (ret_co overnight, ret_oc intraday), dollar_volume, point-in-time
    LIQ-500 membership; sharadar_sf1 as-reported trailing fields netinc, equity and marketcap (usable from the day
    after the filing); sec_8k_item202 ea_reaction_day. Decisions after the close of each trading day t, trades at
    the open of t+1. Market return m = equal-weight mean total return of the members of that day. Beta = 252-session
    OLS beta of the stock''s daily total return on m (needs at least 200 valid sessions, else the stock is not a
    candidate). Residual 5-day return = sum over t-4..t of (r - beta * m). CANDIDATES on date t: members whose residual
    5-day return is in the bottom tail_q fraction (primary 5 %) of all members with a valid value that date, excluding
    any stock with ea_reaction_day = 1 on any of sessions t-4..t (earnings drops are a different, already-tested
    mechanism) and stocks without a current sf1 row (NaN fields). FEATURES (computed for every member every day;
    z-scored across the members of that date with the framework helper): (1) residual 5-day return; (2) overnight
    share of the drop = sum of residual overnight returns (ret_co - beta * m_co) over t-4..t divided by the residual
    5-day return, clipped to [-1, 2]; (3) volume shock = mean dollar volume t-4..t / mean dollar volume t-67..t-5;
    (4) earnings yield now = netinc / current market cap; (5) book-to-market now = equity / current market cap;
    (6) ROE = netinc / equity (NaN if equity <= 0, then the stock is not a candidate); (7) 12-month residual trend
    = sum of (r - beta * m) over t-251..t-5. Current market cap = sf1 marketcap (frozen at the filing) times the
    cumulative total return of the stock from the first session the current sf1 row is usable to t (the row change
    is detected as a change of the marketcap value; total returns, not unadjusted prices, so splits do not break
    it). LABEL and MODEL: framework walk_forward, model gbm (LightGBM), label = total return from the open of t+1
    to the open of t+6 ranked across the training rows of each date (horizon_days 5, purge by the framework), trained
    ONLY on candidate rows (the row mask is the candidate mask of each date, point-in-time; no ever-member or survivor
    column lists, K-0134), expanding window, refit every 63 rows, first scores once the framework minimum training
    sample is reached. Hyperparameters: n_estimators (grid), num_leaves 15, learning_rate 0.05, min_child_samples
    200. BOOK (score_weights + only_on): each date t, rank that date''s candidates by model score. Long the top
    third, short the bottom third (rounded down, at least 2 names per side, else no cohort that date). A cohort
    gets gross 0.2 split equally: +0.1 across its longs, -0.1 across its shorts, held exactly 5 sessions (entered
    at the open of t+1, closed at the open of t+6). Five overlapping cohorts give gross at most 1.0 and net zero.
    A stock that leaves the universe before its cohort ends is closed at the first decision row where it is no longer
    a member (engine rule, K-0051). A missing price on a scheduled exit day closes at the next available open.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    tail_q:
      grid:
      - 0.03
      - 0.05
      - 0.08
      value: 0.05
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: On date t, among LIQ-500 members whose 5-session beta-residual return is in the bottom 5 % and who had
    no 8-K earnings reaction session in t-4..t (the candidates), those in the top third of the walk-forward gbm
    score are marked side +1 and those in the bottom third side -1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'Residual 5-day return (t-4..t, total return minus 252-session beta times the equal-weight member return): depth
    of the shock inside the tail'
  - 'Overnight share of the residual drop (ret_co part / total residual, 5 sessions): overnight moves mark news-driven
    drops, intraday moves mark flow-driven selling'
  - 'Volume shock: 5-day mean dollar volume over the prior 63-session mean: intensity of the selling (liquidity
    demand versus quiet drift)'
  - 'Earnings yield now: sf1 ART netinc / current market cap (sf1 marketcap at filing times total return since):
    distance below an earnings anchor'
  - 'Book-to-market now: sf1 ART equity / current market cap: distance below a book anchor'
  - 'ROE: sf1 ART netinc / equity: profitability, separates a cheap anchored firm from a distressed value trap'
  - '12-month residual trend (t-251..t-5): whether the drop extends a long decline (falling knife, information)
    or interrupts a healthy trend'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'Training only on extreme droppers turns ''cheap names rebound'' into a main effect a ridge can
    find; the card''s claim is what a ridge cannot: (a) the value anchor pays only together with profitability (earnings
    yield high AND ROE positive rebounds; earnings yield high with ROE low or negative is distress and continues),
    a sign flip of the valuation slope across ROE, which a linear model averages to near zero; (b) the anchor matters
    only for flow-shaped drops (intraday-heavy, high volume), not for overnight news gaps, a second interaction;
    (c) both are threshold-like (deep distress, very large drops). Who pays: liquidity sellers of profitable cheap
    firms on the long side, dip buyers of value traps and no-anchor names on the short side. If a ridge on the same
    seven features, rows, label and schedule ranks the candidates as well, the interaction claim is false and only
    a linear value tilt among droppers remains.'
