falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the marked candidates (top third +1, bottom third -1)
  is not above the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of the event study (roughly 2016-2020) has a negative mean (decay kill condition,
  K-0060), even if the pooled result passes.'
- 'Mechanism shape: the 1-session abnormal return is negative and the effect only appears at 10 sessions (slow style
  drift of value, not a concession that reverts within the week).'
- 'Linear control: a ridge on the same features, candidate rows, label and refit schedule gives the same or a larger
  top-minus-bottom candidate spread than the gbm, so the interaction is not what pays.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of Sharpe minus T-bill below zero.'
- 'Robustness: neighbors of tail_q 0.05 or n_estimators 100 fall below the T-bill bar, or doubled costs leave the
  Sharpe below the bar.'
notes: 'Why this is not a retry of the dead reversal cards. H-0094 scored all members on own-move, earnings-release,
  volume and volatility; H-0099 used date-level state (VIX, drawdown); H-0103 used price paths; H-0030 a peer-adjusted
  no-news sort. None used fundamentals, and all ranked the whole universe, so most entries were ordinary small moves
  with gross far under cost. Here (1) only the extreme tail of non-earnings residual drops is traded, where moves
  and hence reversals or continuations are largest; (2) both legs come from the same tail on the same date, so beta,
  market bounce after stress (K-0084, K-0074, studies 6-7) and generic tail reversal cancel between legs; the only
  thing that differs is the fundamental state; (3) the time-shifted placebo of the same stocks absorbs any persistent
  value or quality tilt (K-0025), so a pass needs timing: the anchor must pay right after the drop. Family kept
  as short-term-reversal on purpose (liquidity provision after a drop; the short leg is the continuation side of
  the same question), so the trials count there. Background, not cited as references: Nagel (2012) on reversal as
  liquidity provision, Piotroski (2000) on separating cheap winners from cheap losers with financial statements.
  Forecast (K-0144: Scout forecasts ran 3-10x high; this one is written with that in mind). Candidates: about 5
  % of ~500 members minus earnings weeks, about 20-23 per date; marked 2 x 7 per date; about 3500 scored dates (2005-2020
  less the first training year or two) give about 40000-50000 marked events on about 3500 dates, so the placebo
  cloud should be narrow and the verdict decisive rather than ''cannot tell''. Round trip: LIQ-500 about 11 bps
  (K-0144), but tail droppers are more volatile; assume 12-15 bps. Gross per marked event: central 20 bps (a 40
  bps top-minus-bottom spread over five sessions), a quarter of that 5 bps, a tenth 2 bps. Book arithmetic (K-0064,
  K-0098): five cohorts of 0.1 per side; annual net about 252 x 0.1 x (spread - 2 x round trip). At the central
  40 bps spread and 13 bps per side that is about 3.5 % a year on a book with roughly 6-9 % volatility (about 70
  positions, idiosyncratic risk mostly diversified, a residual value-vs-growth tilt for five days at a time): Sharpe
  about 0.4-0.6, at the edge of the T-bill bar. So the card most likely dies at the cost ratio or at the absolute
  Sharpe floor unless the spread is near 50 bps or more; the quarter and tenth cases die on cost. That death is
  still informative: it says whether a fundamental anchor turns the sub-cost reversal of the LIQ-500 tail into a
  tradable one, a question no lab card has asked. Diagnostics wanted next to the gate (K-0135, K-0142): the ridge
  top-minus-bottom spread on the same candidates, the by-side split (long rebounders vs short continuers against
  unmarked peers), and the share of marked longs with ROE <= 0 (should be small if the model uses the interaction).
  Mean exposure about 0.9-1.0 (cohorts every day once scores exist), daily decision dates, entries in the tens of
  thousands. Period starts 2005-01-03 so that the 8-K flag (from 2004-08) covers every G1 block (K-0145); the walk-forward
  needs its first training sample before scores start, so the earliest months of 2005 trade nothing. Brief fit:
  short horizon (5 sessions), US single stocks cross-sectional, learned model with a stated linear control. The
  closest-fit caveat is that the lab''s short-horizon LIQ-500 record is almost all sub-cost; this card tries the
  one input the reversal cards never had.'
