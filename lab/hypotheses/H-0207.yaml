  - BIL
  kind: instruments
mechanism:
  counterparty: Slow-rebalancing currency holders and hedgers (asset managers resetting hedge ratios or FX allocations
    on a schedule, corporates hedging on fixed calendars) who complete the portfolio shift a rate surprise calls
    for days after the release, buying dollars at worse prices after hawkish news and selling them lower after dovish
    news.
  why: 'US monetary-policy news shows up first in the front of the Treasury curve: on scheduled CPI, payrolls and
    FOMC days the 2-year yield moves on the revised expected policy path. Delayed overshooting (Eichenbaum and Evans
    1995) says the dollar keeps moving in the direction of the rate surprise after the news instead of jumping to
    its new level at once. Bacchetta and van Wincoop (2010) give a mechanism: most FX holders (real-money managers,
    corporate hedgers, reserve managers) revise their currency allocation only infrequently, so the portfolio flow
    that a change in the expected rate differential implies arrives over days to weeks after the release, and the
    exchange rate follows that flow. The tradable claim is the short end of this: in the 5 sessions after the yield
    information is usable, foreign currencies keep falling against the dollar after a large rise of the US 2-year
    yield on a release day, and keep rising after a large fall.'
  why_not_arbitraged: The continuation is small next to daily FX noise and a single-currency or dollar-basket bet
    carries the full currency risk for a week; FX-specialist capital that would front-run it is limited and also
    faces the opposite pull of risk-on/risk-off flows on the same days. In the US-listed currency trusts the spread
    and the slow book further limit who can harvest it.
signal:
  description: 'Inputs: FRED DGS2 (2-year constant-maturity Treasury yield, fred_macro, clock next_morning: the
    value of session d is usable from session d+1), the scheduled release calendar (macro_release_calendar_1d, clock
    us_close) and daily total returns of the six CurrencyShares trusts. Release day: XNYS session d is a release
    day if, on the previous session d-1, next_cpi_sessions, next_empsit_sessions or next_fomc_sessions equals 1
    (known at the close of d-1). Yield news: dy_d = DGS2(d) - DGS2 of the last valid observation before d; if DGS2(d)
    is missing (bond-market holiday) there is no news for that day. Scale: sigma_d = standard deviation of all daily
    DGS2 changes over the 252 sessions ending at d (all days, not only release days; at least 126 valid changes
    required, otherwise no signal); z_d = dy_d / sigma_d. Event: after the close of session d+1 (the first close
    at which DGS2(d) is usable), if d was a release day and |z_d| >= z_threshold, set side = -sign(dy_d) for each
    of the six trusts FXE, FXY, FXB, FXA, FXC, FXF (US yields up -> foreign currencies expected to fall against
    the dollar -> short the trusts; yields down -> long). Book: from the open of session d+2, weight side/6 in each
    of the six trusts (a trust without a price or not tradable that day gets zero; its share stays in cash, no reweighting),
    held for hold_days sessions, so the exit order is placed after the close of session d+1+hold_days and filled
    at the next open. A new event while a position is open replaces it: the new side applies to all six trusts and
    the hold clock restarts from the new event; an event with the same side simply extends the hold. Gross exposure
    is 1.0 while invested and 0 otherwise (cash earns the T-bill rate). SHY, SHV and BIL are never traded: they
    are in the universe only as unmarked near-cash peers for the event study. No other data, no fitted parameters;
    the 252-session scale is the only look-back.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    z_threshold:
      grid:
      - 0.5
      - 1.0
      - 1.5
      value: 1.0
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of session d+1, where d is a scheduled CPI, payrolls or FOMC session on which the 2-year
    Treasury yield (FRED DGS2) changed by at least z_threshold (1.0) trailing-252-session standard deviations: each
    of the six currency trusts FXE, FXY, FXB, FXA, FXC, FXF is marked with side -sign(yield change) (short after
    a yield rise, long after a fall). Unmarked peers: SHY, SHV, BIL (near cash), so the abnormal return is close
    to the trusts'' own move against the dollar; both directions of news are marked, so the average dollar drift
    cancels.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
