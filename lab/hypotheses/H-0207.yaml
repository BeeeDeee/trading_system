falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the marked trusts is at or below the 95th percentile
  of the 200 time-shifted placebos, or its gross per event is below the round-trip cost of the trusts.'
- 'Mechanism sign: the average is negative in the latest of the three dev blocks (the dollar reverses after rate
  news lately), whatever the pooled result.'
- 'Shape: if the 1-session abnormal return is larger than the 5- and 10-session ones (front-loaded and fading),
  the effect is not delayed overshooting but a slow open-print of the release-day move; treat as falsified even
  if the 5-session bar is cleared.'
- 'Wrong sign: a pooled average below zero means overreaction, not delayed response; it must not be refiled with
  the sign flipped on the same events.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbors (z_threshold 0.5 / 1.5, hold_days 3 / 7) beat the T-bill benchmark,
  or Sharpe at doubled costs does not beat it.'
notes: 'Brief fit: short horizon (5 sessions), cross-asset (the signal is read in the Treasury market from a FRED
  series on dated macro releases; the trade is in currencies). Why this is not H-0179 or H-0047. H-0179 (same family,
  kept on purpose, no new family name) sorted the six trusts on 3-month changes of each home country''s 10-year
  yield, monthly, dollar-neutral: its near miss could not separate overshooting from carry and beta. This card uses
  a different information event (a dated US policy-path shock on scheduled days, read daily), a different horizon
  (days) and a different book (all six trusts on the same dollar side), so there is no carry or cross-currency beta
  sort at all: the claim is about the dollar itself, both directions are marked, and the cash-like peers make the
  test the trusts'' own move. H-0047 (related family, listed) sorted 19 asset-class ETFs on their own release-day
  reaction; it was wrong-signed, which is the main reason for a low prior here. This card does not use the trusts''
  own reaction, only the yield move, and does not flip H-0047''s sign: if the dollar overreacts the card dies wrong-signed
  (criterion 4). Not a duplicate of H-0185 (TIPS breakevens) or the macro-announcement premium cards (no position
  on the release day itself; entry is two sessions later). Timing: DGS2 has clock next_morning, so the earliest
  decision is the close of d+1 and the first fill the open of d+2; delayed overshooting claims a move over days
  to weeks, so the lost day should cost only part of the effect, and the horizons (1, 3, 5, 10, 21) show whether
  it builds. Forecasts (pessimistic first, K-0181): DGS2 warm-up of 126-252 sessions means first events in 2008;
  about 30 scheduled release days a year, of which roughly half clear |z| >= 1 because release days are more volatile
  than the all-day scale: about 13-18 event dates a year, 160-230 dates in dev, 950-1400 marked events (6 per date),
  all with 3 unmarked peers. Event dates thin out at the zero lower bound (2009-2015) only if the 2-year change
  is exactly zero (1 bp FRED resolution); the scale shrinks there, so small moves still count. Mean exposure: about
  15 events x 5 sessions minus overlaps = 60-80 sessions a year, 25-32 % at gross 1 (z 1.5 / hold 3 neighbor nearer
  15 %). Round trip: daily ETF tier about 10 bps for FXE and FXY, more for FXF, FXC, FXA, FXB; assume 12-18 bps
  per unit of book. Gross per event: pessimistic 0, central 10-15 bps, optimistic 30 bps over 5 sessions (dollar-basket
  5-session volatility about 1 %). Book arithmetic: at 15 events a year, net Sharpe is about (gross - cost) / 1
  % x sqrt(15); the 0.5 floor needs about 13 bps net, i.e. roughly the optimistic case. So the likeliest death is
  the mechanism test (inside the cloud or under cost); a pass of the event test with a gross near the central case
  still fails the strategy on the absolute Sharpe floor. Data notes: tickers are the six CurrencyShares trusts and
  SHY, SHV, BIL, all listed before the period start (FXY 2007-02, SHV 2007-01, BIL 2007-05). Release calendar: the
  2013 shutdown moved CPI and jobs dates and the dataset carries the late dates, a small look-ahead on two events.
  FRED DGS2 is a market series (not revised). ETFs have no forward data, so G4 is the ceiling; the holdout (2021
  on) includes a fast hiking cycle, a different rate regime from most of dev.'
