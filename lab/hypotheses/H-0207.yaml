id: H-0207
version: 1
title: Delayed dollar response to scheduled US rate news - after a large 2-year Treasury yield move on a CPI, payrolls
  or FOMC day, hold six G10 currency trusts on the dollar's predicted side for 5 sessions
author_agent: scout
family: fx-delayed-overshooting
related_families:
- post-macro-announcement-drift
asset_classes:
- us_etf
- macro
universe:
  instruments:
  - FXE
