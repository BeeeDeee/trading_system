version: 1
title: Flight-to-safety reversal - after a session where US stocks fall sharply while long Treasuries rally, tilt
  a 60/40 SPY/IEF book to 100 % SPY for 5 sessions
author_agent: scout
family: short-term-reversal
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - QQQ
  - IWM
  - IEF
  - TLT
  kind: instruments
mechanism:
  counterparty: 'Investors who sell equities and buy Treasuries in a stress session for non-fundamental reasons:
    equity mutual fund redemptions, risk-parity and volatility-target funds that cut risk after a volatility jump,
    margin-called and VaR-limited traders. They pay a liquidity and safety premium to whoever takes the other side.'
  why: 'A flight-to-safety (FTS) session is one where equities fall hard and long Treasuries rise on the same day.
    Such sessions coincide with large outflows from equity funds into government-bond and money-market funds (Baele,
    Bekaert, Inghelbrecht, Wei 2020) and with mechanical de-risking by VaR-, margin- and volatility-constrained
    investors who sell risk assets and buy duration regardless of price. That demand is not about fundamentals,
    so the equity discount and the Treasury safety premium it creates should partly unwind over the following days,
    and stocks should outperform Treasuries over the next week. The bond market is the cross-asset filter: an equity
    drop on a day when Treasuries also fall is a discount-rate or inflation repricing, a fundamental move with no
    forced flight into safety, so it is excluded. The claim tests at the asset-class level what study 6 saw at the
    stock level: the per-trade gain of reversal after high VIX came from a market-level bounce, not from stock selection.
    Here the bounce is tested directly, as equity versus Treasury, with its trigger defined by the joint stock-bond
    move instead of a VIX level.'
  why_not_arbitraged: Taking equity risk against Treasuries in a stress session needs risk capital exactly when
    intermediaries' funding and risk limits bind (Brunnermeier and Pedersen 2009; Nagel 2012 shows liquidity-provision
    returns rise with VIX). Most balanced mandates cannot raise equity weight in a drawdown, and the trade loses
    badly in episodes when selloffs keep going, so it is hard to hold through.
signal:
  description: 'Data: SPY and TLT daily total returns from sharadar_sfp, close-to-close r(t) = (1 + ret_co(t)) *
    (1 + ret_oc(t)) - 1. Decisions are taken after the close of day t using data up to that close; trades happen
    at the open of day t+1. (1) Volatility scale: sigma_SPY(t) = sample standard deviation of SPY close-to-close
    returns over the 63 sessions t-63 .. t-1 (day t excluded so the event day does not inflate its own threshold);
    require at least 60 valid returns, otherwise no event. (2) FTS event on day t: r_SPY(t) <= -k * sigma_SPY(t)
    AND r_TLT(t) > 0. Both returns must exist for day t; if either is missing there is no event. (3) Tilt state:
    an event on day t switches the tilt on for the decisions of days t, t+1, ..., t+hold_days-1, so the tilted position
    is held from the open of t+1 to the open of t+hold_days+1. A new event inside an open window restarts the count
    from the new event day (windows merge; there is never more than 100 % SPY). (4) Weights (long-only, gross 1.0,
    always fully invested): tilt on -> SPY 1.00, IEF 0.00. Tilt off -> SPY 0.60, IEF 0.40, the same constant mix
    as the benchmark. QQQ, IWM and TLT always have weight 0: they are in the universe only as signal input (TLT)
    and as peers for the mechanism test. Outside tilt windows, re-set the 60/40 target on the first session of each
    month (like the benchmark) and on the session the tilt ends; otherwise hold the drifted weights. The strategy
    minus the benchmark is the tilt alone. (5) Missing SPY or IEF price on a decision day: keep the previous weights.
    Start: data from 2002-08-01 (IEF and TLT first prices 2002-07-30); first possible event once 60 SPY returns
    exist.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    k:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
  selection_procedure: 'Primary configuration fixed before any data is seen: k = 1.5 (a clearly abnormal down day
    relative to the current volatility regime), hold_days = 5 (one trading week, the brief''s upper horizon). TLT
    > 0 is a sign condition, not a tuned threshold. Neighbors are tested at G2 as given.'
  timeframes:
  - 1d
mechanism_test:
  event: 'Flight-to-safety session: after the close of day t, SPY''s close-to-close return is at or below -k (1.5)
    times the standard deviation of its daily returns over the previous 63 sessions (t-63 .. t-1) AND TLT''s close-to-close
    return on day t is positive. On an event date the mask is True for all five universe instruments, with side
    +1 for the equity ETFs (SPY, QQQ, IWM: they should outperform) and side -1 for the Treasury ETFs (IEF, TLT:
    they should underperform), so the side-adjusted abnormal return measures equity minus Treasury from the open
    of t+1 to the close of t+h.'
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
