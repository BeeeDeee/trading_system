falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of FTS events (equity minus Treasury) is not above the
  95th percentile of the 200 time-shifted placebos, or is negative on average.'
- 'Mechanism: the abnormal return has the wrong sign in two of the three dev sub-periods, or is negative in the
  latest third (K-0052 decay condition).'
- 'Mechanism: gross abnormal return per event below the round-trip cost of the ETFs (cost ratio < 1).'
- 'Mechanism (descriptive, bond filter): if equity drops of the same size on days when TLT FALLS (rates-shock selloffs)
  reverse as much as or more than the FTS events at 5 sessions, the flight-to-safety story is false and the effect
  is plain index reversal; the Builder should report that complementary event set in the diagnostic output if the
  channel allows.'
- 'Mechanism (shape): if the 10-session abnormal return is much larger than the 5-session one while the 1-session
  one is negative, the effect is slow drift, not a premium paid back within a week.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF Sharpe + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Strategy: fewer than 75 % of the neighbors (k 1.0 / 2.0, hold_days 3 / 7) beat the 60/40 benchmark, or doubled
  costs remove the margin.'
- 'Strategy: max drawdown above 1.5 times the benchmark''s (the tilt adds equity risk exactly in stress), or one
  sub-period carries more than 60 % of the log excess return.'
notes: 'Brief fit: horizon 1-5 sessions (primary 5); cross-asset because the trigger uses the Treasury market to
  tell a forced flight into safety from a fundamental equity repricing, and the trade is equity against Treasuries.
  The FRED VIX series was deliberately not used: its clock is next_morning, which would delay a one-week mechanism
  by a full session. All inputs here are same-clock ETF closes. Family: filed under short-term-reversal on purpose.
  The mechanism is liquidity provision to non-informational sellers, the same as studies 5-7 and H-0006/H-0007/H-0030/H-0035,
  so their trials should count. Why it differs: (a) asset-class level, not stock cross-section, so K-0044 and K-0012
  (single-stock costs, small names, early era) do not apply directly, and SPY/IEF costs are a few bps, so the cost
  ratio that killed H-0030 should not bind; (b) the conditioning is a cross-market flow signature (stocks down AND
  duration up), not a stock-level filter; (c) it is built as a tilt around the exact benchmark mix (K-0005, K-0027,
  H-0001/H-0003 lessons), always fully invested, so exposure, entries and decision dates come from rebalances and
  not from a part-time book; the strategy minus the benchmark is the tilt alone (H-0005 lesson: no basket confound).
  Not a lead-lag claim (studies mrel): no market is assumed to lead another; the claim is that a joint stock-bond
  overshoot unwinds. Expected size: the gate needs an equity-minus-Treasury bounce of very roughly half a percent
  or more per 5-session window to clear the placebo bar; ETF round trips are a few bps, so cost is not the binding
  check, the placebo and the latest third are. Expected frequency at k = 1.5: on the order of 8-12 event sessions
  a year, clustered in stress, so roughly 150-200 event dates and about 750-1000 instrument events over 2002-2020,
  above the 200-event / 30-date minimum. A two-instrument universe produced zero events in H-0038 (K-0054), so the
  universe deliberately holds five instruments to give the abnormal-return step a peer set. Known risk, stated before
  seeing anything: in long crash episodes FTS sessions cluster and selloffs continue, so the tilt loads equity at
  the worst time. The drawdown limit and the sub-period checks are the kill conditions. No date or episode is used
  anywhere in the rule.'
