falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of VIXY on steep-contango days does not exceed the 95th
  percentile of the 200 time-shifted placebos. The placebo is VIXY shorted on random dates and earns the unconditional
  roll-down, so this reads as: the VIX/VIX3M slope adds nothing to the unconditional roll-down (the reading of H-0052
  generalizes), and the card is refuted.'
- 'Mechanism shape: the 1-session abnormal return is not positive. Roll-down accrues every session, so an effect
  that appears only at 10-20 sessions is equity or regime drift, not term-structure carry.'
- 'Mechanism era: the event average in the latest third of dev (roughly 2017-2020) is negative (K-0060 decay, or
  the carry eaten by its own tail events).'
- 'Strategy: net Sharpe on dev below the T-bill bar (excess Sharpe < 0.5 and below T-bill + 0.10), or the bootstrap
  bound of the Sharpe difference below zero.'
- 'Robustness: fewer than 75 % of the neighbors (k 0.95/1.05, d 0.05/0.15) beat the T-bill bar, or the median neighbor
  Sharpe is under 0.7 of the primary.'
- 'Concentration: one dev third carries more than 60 % of the log return (for example the calm years alone) or two
  of three thirds fail the bar: the timing did not keep the tail days from eating the carry.'
- 'Costs: net Sharpe at doubled costs does not beat the T-bill bar.'
notes: 'Brief fit: daily decisions, with a 1-5 session predictive horizon (roll-down accrues every session). The
  trade is cross-market: the signal is the SPX index-option implied-vol term structure (CBOE VIX and VIX3M via FRED)
  and the trade is in VIX futures through VIXY. It is not a lead-lag (study mrel) or a stress rebound (K-0084).
  It claims a risk premium paid by a mandated roll flow and by insurance buyers. typical_days = 5 is the bet horizon;
  the position is re-decided every session, but because the regime is persistent, a short spell often lasts for
  weeks. Relation to the lab: (1) same family as H-0055 (variance-risk-premium timing), because the economic premium
  is the same variance risk premium; H-0055 timed equity exposure on implied minus realized variance, while this
  card harvests the premium directly in VIX futures and times it with the implied term-structure slope. Its lesson
  forbids VIX-level or realized-only rules; this uses neither. (2) H-0052 (macro-announcement-premium) shorted VIXY
  around release dates and found that time-shifted placebo windows already earned over half of the gain through
  roll-down. Its lesson (and K-0070) names ''implied volatility measured directly (futures curve)'' as the missing
  control. VIX3M is that measurement, so this card asks the question H-0052 left open: does the slope separate paid
  from unpaid short-volatility days beyond the unconditional roll-down? A failure is informative either way. (3)
  Not studies 6-7 (VIX level gating stock reversal) and not H-0003 (realized-vol switch of SPY). Why a new dataset:
  the mechanism is the slope, and VIX alone gives only the level. A level-versus-own-average proxy would be a VIX-level
  rule that H-0055''s lesson rules out. VXVCLS is a free FRED series from the same source as VIXCLS. Timing: both
  FRED series are next_morning, so the signal is one session stale. This costs the card on spike days (a spike that
  starts in contango is shorted for one more session); it is a bias against the card, not look-ahead. Expectations
  (stated before any data, per K-0053/K-0064): steep-contango days are roughly half or more of dev sessions, so
  about 1,200-1,600 marked events on as many dates (VIXY only), with five peers on every date from 2011. Gross 5-session
  short return several times the VIXY round trip (liquid ETF, a few bps half-spread). Mean exposure about 0.5-0.6,
  so rebalancing dates should count as bets; the risk is that it lands just under 0.5. Expected net Sharpe about
  0.5-0.8 with deep one- to two-session drawdowns (a short VIX book loses tens of percent on volatility-spike days,
  which is the premium''s reason to exist). Known optimistic biases: the engine probably charges no borrow fee on
  the VIXY short (real fees are a few percent a year); VIXY reverse splits rely on the adjusted series (K-0001 spike
  filter). Beta caveat (K-0074): short VIXY carries positive equity beta and the peers are bond and gold ETFs, so
  the placebo removes the unconditional equity drift but not a higher equity drift in calm regimes. Most likely
  death: G1 strategy on the absolute Sharpe bar after the tail days (the stale signal lets the first day of each
  spike through), or G2 concentration and publication decay if the calm middle years carry the profit. Any diagnostic
  the Builder can report would help: a constant -0.5 VIXY short over the same dates as an untimed control, and the
  event average split by year.'
