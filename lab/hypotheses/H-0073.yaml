mechanism:
  counterparty: 'Holders of long VIX ETPs and other buyers of volatility insurance (tactical hedgers, retail traders
    who want convex crash exposure): they keep paying the roll because they want protection that pays in a crash,
    and many do not price the roll. The ETP''s own daily roll mechanically buys the dearer second-month contract
    and sells the cheaper expiring one, so the premium is paid by a mandated flow, not by a forecasting mistake.'
  why: 'VIX futures trade above the volatility that is later realized in the VIX index: the futures basis is a risk
    premium that hedgers pay, not a forecast of where spot VIX goes. Simon and Campasano (2014) show that the basis
    does not predict changes in spot VIX but does predict VIX futures returns. Cheng (2019) shows the premium falls
    or turns negative when risk rises, so the premium is large compared with risk in calm, upward-sloping (contango)
    term structures and small or negative in inverted (backwardation) ones. The slope of the S&P 500 implied-volatility
    term structure, 30-day VIX against 3-month VIX3M (both computed by CBOE from SPX index options), therefore marks
    when selling VIX futures is paid and when it is not. The signal comes from one market (SPX index options) and
    the trade goes in another (VIX futures, through a short-term VIX futures ETP that rolls from the first to the
    second month every day). The claim is short-horizon: roll-down accrues every session, so VIXY should lag its
    unmarked peers from the first session after a steep-contango close, and the payoff is re-decided each day.'
  why_not_arbitraged: 'Selling volatility has crash risk: a short VIX-futures position can lose tens of percent
    in one or two sessions, and inverse VIX products were terminated after such a day. Margin calls and career risk
    hit sellers exactly when shocks arrive, so capital that supplies this insurance is limited and demands a premium.
    Hedging demand is price-inelastic. The premium is compensation for this tail risk, so the strategy is expected
    to have deep, sudden drawdowns, and the gates have to judge whether the timing leaves enough after them.'
signal:
  description: 'Inputs: VIXCLS (fred_macro) and VXVCLS (new dataset fred_vxv_1d), both daily CBOE closes from FRED
    with clock next_morning, so at the decision after the close of session t the latest usable value is normally
    that of session t-1. Let r = VIXCLS / VXVCLS, computed from the most recent date on which both series have a
    value. If that date is more than 5 XNYS sessions older than t, or either value is missing or non-positive, the
    target weight is 0. Target weight of VIXY: w = -w_max * clip((k - r) / d, 0, 1) with w_max = 0.8 fixed. The
    book is flat when r >= k, scales linearly into the short as r falls below k, and is fully short (-0.8) when
    r <= k - d. The weight is never positive (no long VIXY). SHY, IEF, TLT, AGG and GLD are in the universe only
    as unmarked peers for the mechanism test and always have weight 0. The rest of the book is cash (T-bill). Rebalancing:
    decide after every close t and trade at the open of t+1. Trade VIXY only when |target - current weight| >= 0.05
    or when the target is 0 and the position is not (then close it fully). If VIXY has no bar or is not tradable
    on a session, keep the current position. No other instruments, no leverage (gross <= 0.8).'
  params:
    d:
      grid:
      - 0.05
      - 0.1
      - 0.15
      value: 0.1
    k:
      grid:
      - 0.95
      - 1.0
      - 1.05
      value: 1.0
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of session t, the latest usable VIX/VIX3M ratio r (same timing as the strategy) is at
    or below k - d (0.90 at the primary setting): the term structure is in steep contango and the strategy is fully
    short. VIXY is marked with side -1 (it should underperform). SHY, IEF, TLT, AGG and GLD are never marked and
    serve as peers (all have prices before VIXY''s first day, so three or more peers exist on every date). The abnormal
    return is the next-open-to-close(t+h) return of VIXY minus the mean of the peers, side-adjusted.'
  horizons:
  - 1
  - 2
  - 5
  - 10
  - 20
  primary_horizon_days: 5
