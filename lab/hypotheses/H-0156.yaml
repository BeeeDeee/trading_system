  selection_procedure: Pre-registered primary configuration lookback 12 months, hold 12 months (the conventional
    one-year trend window and the brief's one-year horizon); no other choice is made on data. The seven currencies
    are the old Federal Reserve major-currencies index set, the EM ETFs are the US-listed iShares MSCI single-country
    EM funds plus FXI, EPU and INDA where no iShares MSCI fund exists, all taken as listed.
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: 'On every monthly decision date with s_t != 0 (lookback_months, primary 12), every eligible EM country
    ETF (price on the date and at least 21 earlier sessions with prices) is marked with side = s_t: +1 after the
    dollar weakened against the DM majors over the lookback (EM should outperform US equity), -1 after it strengthened
    (EM should underperform). SPY, DIA, QQQ, IWM and MDY are never marked and are the peers (at least three of them
    have prices from the first event date). Expected about 245 event dates (2000-01 to 2020-09 for the 60-session
    window) and 2400-2700 marked ETF-dates (5 EM ETFs in 2000 rising to 15 by 2012).'
