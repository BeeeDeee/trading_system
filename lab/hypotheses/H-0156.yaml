mechanism:
  counterparty: Foreign and local equity investors who price EM stocks off current earnings and local conditions
    and treat a weaker EM currency as "cheap" rather than as a tightening of dollar funding that has not yet reached
    earnings; benchmark-bound EM funds whose flows chase recent performance and keep them fully invested through
    the adjustment; on the other side, US-only investors who do not hold EM at all.
  why: 'The dollar is a global funding currency. Emerging-market firms, banks and sovereigns carry large dollar-denominated
    debt against local-currency assets. When the dollar strengthens broadly, their balance sheets weaken, global
    banks and bond funds that lend to them cut risk (the risk-taking channel of Bruno and Shin), dollar credit to
    EM shrinks, and EM investment and earnings follow with a lag of quarters. A broadly weakening dollar does the
    reverse. The balance-sheet and lending adjustment is slow (loan books, bond issuance, capex plans and local
    monetary policy react over several quarters), so a dollar move measured over the past year should still predict
    EM equity returns relative to US equity over the following quarters. The signal is taken only from the dollar
    against the developed-market majors (EUR, JPY, GBP, CAD, CHF, AUD, SEK), so it measures global dollar funding
    conditions and is not the EM ETFs'' own past currency or price return: one market (G10 FX) predicts another
    (EM equities).'
  why_not_arbitraged: 'It is a slow macro timing bet with few independent episodes (a dollar cycle lasts years),
    large tracking error against any equity benchmark and long stretches of underperformance, so mandate-bound managers
    cannot hold it and global macro capital that could is small relative to EM equity capitalization. The payoff
    is also a risk premium in part: the losses arrive in global dollar squeezes, when funding is scarce.'
signal:
  description: 'Decision dates: the first XNYS session of each calendar month, after its close, using data up to
    that close (FRED values usable from the day after the observation, as the dataset clock says); trades at the
    next session''s open. (1) Dollar-majors index. For the seven majors use the FRED noon rates in fred_macro: DEXUSEU
    (USD per EUR), DEXUSUK (USD per GBP), DEXUSAL (USD per AUD), DEXJPUS (JPY per USD), DEXCAUS (CAD per USD), DEXSZUS
    (CHF per USD), DEXSDUS (SEK per USD). Dollar strength x_k = log(foreign units per USD), i.e. log(DEXJPUS), log(DEXCAUS),
    log(DEXSZUS), log(DEXSDUS) and -log(DEXUSEU), -log(DEXUSUK), -log(DEXUSAL). For each currency take the last
    value available at the decision date and the last value available at the session lookback_months x 21 sessions
    earlier; D_t = equal-weighted mean over currencies of the change in x_k between the two. At least 5 of the 7
    currencies must have both values, otherwise D_t is undefined. (2) Monthly signal s_t = +1 (long EM vs US) if
    D_t < 0 (dollar weakened over the lookback), -1 if D_t > 0, 0 if D_t is undefined or exactly 0. (3) Cohorts:
    position p_t = mean of s over the last hold_months monthly decision dates (including t; months with no signal
    count as 0), so each month''s signal is held for hold_months months; p_t is in [-1, 1]. (4) EM basket: equal
    weights over the EM country ETFs (EWZ, EWW, EWY, EWT, EWM, EZA, FXI, ECH, TUR, THD, EIDO, EPOL, EPHE, EPU, INDA)
    that have a price on the decision date and at least 21 earlier sessions with prices; an ETF that is not yet
    listed is simply absent and joins at the first decision date after it qualifies. Beta: b_t = OLS beta of the
    EM basket''s non-overlapping 5-session total returns on SPY''s over the trailing 260 sessions (52 observations;
    weekly returns avoid the asynchronous-close bias of daily returns), clipped to [0.5, 2.0]; if fewer than 40
    observations, b_t = 1. (5) Weights (beta-hedged, gross |p_t| <= 1): each EM ETF p_t / (1 + b_t) / n_EM; SPY
    -p_t * b_t / (1 + b_t). DIA, QQQ, IWM and MDY are never traded (weight 0); they are unmarked peers for the mechanism
    test only. Weights are set on decision dates and held until the next one. A missing bar on a held ETF keeps
    the position; it is re-split at the next decision.'
  params:
