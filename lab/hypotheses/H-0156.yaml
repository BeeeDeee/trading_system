falsification_criteria:
- 'Mechanism: the side-adjusted 60-session return of marked EM ETFs minus the unmarked US peers is not above the
  95th percentile of the 200 time-shifted placebos, or gross per event is below the round-trip cost, or fewer than
  2 of 3 dev thirds have the predicted sign (judge''s G1 mechanism checks).'
- 'Mechanism sign: a negative event average at 60 sessions (a strong dollar followed by EM outperformance) refutes
  the funding-cycle claim and supports the long-term reversal reading of H-0062/H-0088 instead; the mirror must
  not be traded.'
- 'Mechanism shape: the claim is a slow balance-sheet channel, so the 60-session average must exceed the 21-session
  average; a peak at 5 sessions that fades by 60 is a short-run FX-momentum spillover, not this mechanism.'
- 'Decay: the latest third of dev with a negative event average is a kill condition (K-0060), even if the pooled
  test passes.'
- 'Strategy: net Sharpe on dev below 0.5 or not at least T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  vs T-bills at or below zero (G1).'
- 'Robustness: fewer than 75 % of the grid neighbors (lookback 6/24, hold 6/24 and their combinations) clear the
  T-bill bar, or one dev third carries more than 60 % of the log return (G2).'
- 'Costs: net Sharpe at doubled costs below the T-bill bar (G2).'
notes: 'Brief fit: long horizon (12-month cohorts, 6-24 month grid), cross-asset (G10 FX -> EM equities), FRED signal.
  The 60-session mechanism horizon is the schema cap and shows only the first quarter of the one-year hold (K-0076).
  Family: new name dollar-funding-cycle because the mechanism is a common global funding factor acting on EM balance
  sheets, not slow diffusion of a country''s own asset-market news (cross-asset-momentum, H-0087) and not currency
  value (long-term-reversal, H-0062, H-0088). H-0088 sorted developed currencies against each other, which nets
  out the common dollar factor by construction; this card tests exactly that common factor, in time series, on EM,
  with a one-year trend instead of a five-year anchor. The two can point in opposite directions, and the falsification
  criteria say which reading a wrong sign supports. If the Skeptic judges this to be cross-asset momentum, merging
  into that family is acceptable to me. Hindsight: I know the broad outline of dollar and EM history in the dev
  period, which is unavoidable for any macro card. The rule has no dates, no episode filters, a conventional 12-month
  window, a fixed currency set and all US-listed EM country funds that exist; RSX (Russia) is left out only because
  Sharadar coverage of funds closed after 2022 is uncertain (K-0102), and that is a data choice, not a return choice.
  Beta (K-0074): EM ETFs have a US-equity beta above one and the dollar tends to weaken in risk-on years, so the
  raw event study (EM minus unmarked US peers) partly measures market direction. The book removes this with a trailing
  weekly beta hedge; the study cannot. A pass of the study with a book near zero would point to that confound. Power
  and forecasts (K-0120, K-0181): about 245 event dates, but the signal is persistent and 60-session windows overlap
  three months, so there are only some tens of independent observations and the placebo cloud will be wide; I forecast
  the placebo upper bar at roughly 1-1.5 % per event above the placebo mean. Gross per event: pessimistic 0, central
  +1 %, optimistic +2.5 % over 60 sessions, against a round trip of about 10-20 bps for these ETFs (cost ratio not
  binding). The central case sits at the bar: a pass is a coin flip, and a near miss with the bar above cost reads
  as ''cannot tell''. Book: turnover is low (1/12 of the position per month plus basket re-splits); mean gross exposure
  about 0.5-0.8 (|p| averaged over persistent signals), about 245 rebalancing dates. Book vol about 6-8 % a year;
  net Sharpe forecast 0.1-0.5, so the likeliest death even after a mechanism pass is the absolute 0.5 floor at G1
  (K-0064, K-0112). No forward data for ETFs: the card can pass at most G4.'
