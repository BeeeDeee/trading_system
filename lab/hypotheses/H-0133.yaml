  kind: instruments
mechanism:
  counterparty: US investors and hedgers who use the country ETF as their only live instrument for that market while
    it is closed. They demand immediacy in the direction of the US move. Market makers and authorized participants
    take the other side, but the basket cannot be traded and creation and redemption against a stale NAV is risky
    or suspended on home holidays. So they quote wider and lean prices with inventory. The liquidity demander pays
    the overshoot, which comes back at the reopening.
  why: 'A US-listed Asia-Pacific country ETF trades during US hours while its home market is shut. Its price then
    moves on US information and US order flow with no underlying basket to anchor it. Levy and Lieberman (2013)
    document that country ETFs overreact to US market returns in these non-synchronous hours, and that the overreaction
    corrects when the home market next trades. On a normal day that correction happens in the Asian session, overnight
    before the next US open. A taker who trades at the open cannot reach it: it shows up in the close-to-open return.
    A scheduled home-market holiday pushes the next home session past the next US open. A US-hours move made on
    the eve of the holiday then stays unanchored through one more full US session, and its correction comes only
    when the home market reopens. That window can be traded open to open. The signal comes from one market (the
    home exchange''s calendar and the absence of its price discovery) and the trade happens in another (the US-listed
    wrapper). It is hedged with Asian peer ETFs whose home markets did reopen, whose US prices already contain the
    correction.'
  why_not_arbitraged: 'The arbitrage link is physically cut: no underlying trades and the NAV is stale, so an AP
    cannot lock in the gap. Hedging with index futures is only partial: some home futures are closed too, and others
    trade in thin off-hours sessions. A holiday-eve position carries one or more days of gap risk across the reopening,
    in single small markets with modest capacity, on irregular dates that differ by country. That is unattractive
    for large arbitrage desks and invisible to anyone who trades only the normal overnight correction.'
signal:
  description: 'Data: Sharadar SFP daily ret_co (previous close to open) and ret_oc (open to close) total returns
    for the 13 Asia-Pacific country ETFs, plus EFA and SPY (unmarked peers; EFA is also the fallback hedge). Home
    exchanges: EWJ->XTKS, EWH->XHKG, FXI->XHKG, EWY->XKRX, EWT->XTAI, EWS->XSES, EWM->XKLS, EWA->XASX, THD->XBKK,
    EIDO->XIDX, EPHE->XPHS, ENZL->XNZE, EPI->XBOM. From the new dataset exchange_holidays_1d, for each XNYS session
    d and each home exchange X: X.closed_next = 1 if X has no regular session on any local calendar date after d
    up to and including the calendar date of the next XNYS session; X.anchored = 1 if X had a regular session on
    a local calendar date after the previous XNYS session''s date up to and including d (so the US open of d already
    reflects a fresh home close). Decision after the US close of day t, trades at the open of t+1. (1) Unanchored
    move: for ETF j let a be the latest XNYS session <= t with anchored = 1 for its home exchange. U_j,t = log(1+ret_oc_j,a)
    + sum over sessions d in (a, t] of [log(1+ret_co_j,d) + log(1+ret_oc_j,d)]. This is the ETF''s price change
    since its last home-anchored open, earned entirely while the home market had no new session. (2) Scale: sigma_j,t
    = standard deviation of ret_oc_j over the last vol_days sessions up to t (at least 80 % of them present); z_j,t
    = U_j,t / sigma_j,t. (3) Event: closed_next = 1 for j''s home exchange at t, j tradable at t, and |z_j,t| >=
    min_z. Side s_j = -sign(U_j,t): fade the unanchored move. (4) Book on day t+1: with n events, each event ETF
    gets weight s_j * 0.5 / n (event legs have total gross 0.5; an ETF is counted once even if two rules map to
    it). The hedge is -(sum of event weights), spread equally over the Asia-Pacific ETFs in the list whose home
    exchange has closed_next = 0 at t (re-anchored before the next US open) and that are tradable. If fewer than
    2 such ETFs exist, the whole hedge goes into EFA. SPY is never traded. Gross <= 1, net 0. (5) Holding: the book
    is recomputed at every decision. An event ETF stays in the book while its home exchange keeps closed_next =
    1 and |z| >= min_z (U keeps accumulating across a multi-day closure). It leaves at the first open after the
    decision at which closed_next = 0, i.e. at the US open that follows the home market''s reopening session. For
    a single-day home holiday this is a one-session hold (open t+1 to open t+2). With no events the book is flat
    (cash). Missing data: an ETF without a price at t or t+1, without enough history for sigma, or before its first
    listing date is neither an event nor a hedge leg. A home exchange with no calendar row is treated as never closed
    (no events).'
  params:
    min_z:
      grid:
      - 0.25
      - 0.5
      - 1.0
      value: 0.5
    vol_days:
      grid:
      - 42
      - 63
      - 126
      value: 63
  timeframes:
  - 1d
mechanism_test:
  event: 'After the US close of day t, a listed Asia-Pacific country ETF whose home exchange has no session before
    the next US open (closed_next = 1) has an unanchored US-hours move U (since its last home-anchored open) with
    |U| >= min_z times its vol_days open-to-close volatility. Side = -sign(U): the ETF should underperform the other
    instruments after an up move and outperform after a down move once its home market reopens. Unmarked peers are
    the other listed ETFs on the same date, including the Asian ETFs whose home markets reopen before the next US
    open, EFA and SPY.'
  horizons:
