falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return from the open of t+1 to the close of t+2 is not above the 95th percentile
  of the time-shifted placebos, or gross per event is below the round-trip cost of the event ETF.'
- 'Mechanism shape: if the 1-day horizon (open t+1 to close t+1, before the home market reopens) is as large as
  or larger than the 2-day horizon, the effect is not the reopening correction but generic ETF reversal (K-0105,
  K-0084), and the card is wrong.'
- 'Mechanism decay: the latest third of dev has the wrong sign (K-0060).'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference to T-bills at or below
  zero.'
- 'Robustness: fewer than 75 % of the min_z / vol_days neighbours (min_z 0.25 and 1.0; vol_days 42 and 126) beat
  T-bills with Sharpe >= 0.5, or the book does not beat T-bills at doubled costs.'
- 'Publication decay: post-2013 excess Sharpe below half of the pre-2013 excess Sharpe.'
- 'Exposure: mean gross exposure below 20 % or fewer than 100 entries (the book is in cash on days without an Asian
  holiday eve).'
notes: 'Brief fit: short horizon (1-3 sessions, mostly one), cross-asset in the sense of the brief. The signal is
  the state of another market (the home exchange is closed, so no price discovery there) together with the ETF''s
  US-hours move, which mostly comes from the US market. The trade is in the US-listed wrapper, hedged with wrappers
  whose home markets did reopen. FRED is not needed. Family: filed under etf-premium-arbitrage because the mechanism
  is a wrapper deviating from an underlying that cannot be arbitraged against. The trials of H-0037, H-0043, H-0077-H-0080
  and H-0090 count against it. Why this is not a retry of the dead ETF-gap cards: K-0105 and H-0037/H-0080 traded
  daily closes of ETFs while the underlying basket was open, so any wrapper gap closed inside the day and before
  the next open. Here the event is defined by the underlying being shut through the next US open. On normal days
  (which the time-shifted placebos mostly sample) the correction falls in the close-to-open return the strategy
  cannot earn. On holiday eves it is delayed into the open-to-open window. So the placebo comparison is the natural
  control: the same kind of move on days when the home market reopens overnight should show nothing from the next
  open on. Data: the holiday calendar is essential to the mechanism and is not in the catalog. Nothing in the loadable
  data reveals a foreign-exchange closure (FRED FX rates are New York noon fixings and the ETFs keep trading). Hence
  the new dataset. It is a free public calendar (exchange_calendars encodes the exchanges'' published schedules).
  Point-in-time risk is only unscheduled closures, which the description asks to exclude or flag. If some exchanges
  have no history before a year, they simply give no events before it. Rough expectations (Scout forecasts have
  run high, K-0120): about 10 holiday-eve sessions per ETF and year, about 60 % with |z| >= 0.5. About 200 ETF-years
  in dev gives on the order of 1,000-1,500 events on several hundred dates (Lunar New Year clusters several countries
  on the same dates). The book is invested on roughly a fifth to a quarter of sessions at gross about 1, so mean
  exposure is near the 20 % floor. That is a real risk (K-0027, K-0098). Gross per event: for a 1-1.5 % unanchored
  move, a reversal of 10-30 % of it is 0.1-0.4 %. That is comparable to the round trip of a mid-liquidity country
  ETF (EWM, THD, EIDO, EPHE, ENZL are the thin ones), and the hedge adds a second round trip in the book. Most likely
  death: gross below cost, or a strategy Sharpe under 0.5 because of part-time exposure. Second: the ETF is efficient
  during closures (price discovery moves to the wrapper, as in single-country closure episodes), so the 2-day abnormal
  return sits inside the placebo cloud. That would also be informative: wrapper overreaction would not be the reason
  the lab''s ETF-gap cards failed. Builder: do not compute closed_next or anchored from price gaps. Use only the
  dataset keys. A Lunar New Year eve can mark FXI, EWH, EWY, EWT, EWS and EWM together. Then the hedge basket is
  the remaining open-market Asian ETFs (EWJ, EWA, ENZL, EPI, THD, EIDO, EPHE when listed), or EFA if fewer than
  2 are open. Please report events by exchange and the 1-day versus 2-day horizon split if the gate output allows.'
