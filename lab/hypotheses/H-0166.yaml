  description: Top-20 USD-M perps, returns plus extras funding and basis (signals) and funding_paid (charged by
    the engine).
  frequency: 1d
- dataset: fred_macro
  description: CBOE VIX close from FRED, signal only, clock next_morning.
  fields:
  - VIXCLS
  frequency: 1d
holding_period:
  rebalance: event
  typical_days: 5
market_exposure: market_neutral
references:
- cite: Kyle and Xiong (2001) Contagion as a Wealth Effect, Journal of Finance
  year: 2001
- cite: Brunnermeier and Pedersen (2009) Market Liquidity and Funding Liquidity, Review of Financial Studies
  year: 2009
- cite: Adrian and Shin (2010) Liquidity and Leverage, Journal of Financial Intermediation
  year: 2010
falsification_criteria:
- 'Mechanism: coins entering the long or short leg on shock dates earn a side-adjusted 5-day abnormal return at
  or below the 95th percentile of the time-shifted placebos (the same coins and sides on other, mostly calm, dates),
  or below the round-trip cost: the shock does not change the cross-section.'
- 'Mechanism: with the first third of dev empty from model warm-up, either of the two later thirds (2021 boom, 2022
  bear) is wrong-signed.'
- 'A ridge on the same six features (framework ridge, same schedule and book) gives the same or a better shock-date
  result than the gbm: then the date-level shock is not used and the result is the plain crowding sort.'
- Net Sharpe on dev below 0.5, or not above T-bills by 0.10, or the bootstrap bound of the difference below zero.
- Neighbors of n_estimators 100 or shock_abs 0.10 do not beat the benchmark in at least 75 % of cases, or Sharpe
  at doubled costs falls below the benchmark.
- 'The short leg (the coins the model calls losers after a shock) loses money on its own while the long leg earns:
  that is the pattern of K-0207, not the forced-deleveraging claim, which says the crowded short side pays at least
  as much as the long side.'
notes: 'Family. This is the second trial of the TradFi-state-into-crypto idea after H-0130 (crypto-flight-to-quality);
  the H-0130 lesson says adding funding features to that sort is the same idea, so I file it there. It also touches
  perp-leverage-crowding (K-0197: funding and basis sorts empty on their own); the mechanism here is the outside
  shock, not the crowding premium. K-0179 lists ''funding or stablecoin data as the transmission channel'' as untested;
  this is that test. Differences from H-0130: perps with a short leg instead of spot long-only; the transmission
  variable is leverage (funding, basis, flush) instead of the beta/ivol/liquidity ladder; positions are opened only
  on shock dates, so the same-coin time-shifted placebo is essentially the calm-date control of the same sort; the
  VIX inputs are raw date-level features that a ridge cannot use for a ranking. Differences from H-0081: no BTC-residual
  reversal sort, the score is learned on leverage state. No sign was chosen from data: the card states the expected
  sign by side. Timing caveat, stated up front: VIX is next_morning, so the shock of US session d enters at the
  close of crypto day d+1 at the earliest; the first day of deleveraging is missed by construction. The claim is
  the VaR-lag part (several days), so a result that exists only at the one-day horizon would not support it. Forecasts
  (K-0120, K-0163). Perp data start 2019-12 and dev ends 2022-12, so the first fit eats most of 2020: expect the
  first third of dev to be EMPTY (warm-up) and the block check to need both 2021 and 2022 positive. US sessions
  with |log VIX change| >= 0.10 are roughly 25-40 a year in this window (my estimate, not counted from the series;
  Scouts overestimate, K-0120), so about 45-80 shock dates in 2021-2022, 8 marked coins each: about 350-650 events
  on 45-80 dates; at shock_abs 0.15 perhaps half of that, close to the 30-date minimum. Mean exposure: the book
  is invested about 35-45 % of crypto days in 2021-2022 (5-day windows after clustered shocks), but flat through
  the 2020 warm-up, so over the whole dev window perhaps 0.25-0.30, near the 0.20 floor. Costs: top-20 perps cost
  about 12-45 bps per side (fee plus volume tier; K-0120 saw about 91 bps round trip for a top-30 book), so a rebuild
  of a gross-1.0 book costs about 0.3-0.9 % of capital, and the 5-day long-minus-short spread per cohort must exceed
  about 1 % gross for the book to clear cost; with roughly 25-35 rebuilds a year the book needs about 25-30 % a
  year of gross spread on half- gross legs. That is a large effect: the most likely death is the cost check or an
  inside-the-cloud placebo result on few dates (a cannot-tell, K-0034), with the 2021 boom and 2022 bear blocks
  disagreeing. The placebo cloud is wide (volatile coins, few dates), so a small real effect cannot pass; only a
  big one can, which is also the only kind the costs allow. Requests for the gate output if possible (K-0069, K-0135):
  events and abnormal return split by risk-off (vix_shock > 0) and risk-on dates and by side; the ridge control
  on the same events.'
