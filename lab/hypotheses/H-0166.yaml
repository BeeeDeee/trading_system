id: H-0166
version: 1
title: VIX shocks unwind crowded crypto leverage, learned - top-20 Binance perps dollar-neutral 5-day books on VIX-shock
  dates, LightGBM on funding, basis, flush x shock
author_agent: scout
family: crypto-flight-to-quality
asset_classes:
- crypto_perp
- macro
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Levered crypto longs (retail on perps and cross-margined desks) whose positions are cut by margin
    calls and risk- limit reductions after a shock that did not originate in crypto; they sell or are liquidated
    at prices set by the risk cut, not by coin news, and keep paying positive funding while they hold.
  why: 'A large move in US equity volatility (VIX) is a funding-liquidity shock for the cross-asset holders of crypto
    leverage: multi-asset funds, prop desks and basis traders run value-at-risk or volatility-target limits across
    their whole book, so a TradFi shock raises their margin and risk usage and forces them to cut risk everywhere,
    including crypto (Kyle and Xiong 2001: losses in one market make leveraged traders liquidate in others; Brunnermeier
    and Pedersen 2009: margin spirals hit the most levered positions first; Adrian and Shin 2010: VaR- constrained
    intermediaries delever procyclically). Because the limits use trailing volatility, the cutting is spread over
    several days, not done on the shock session. The claim is about the cross-section: where the shock lands depends
    on where leverage is crowded. Coins whose perps carry crowded long leverage (high trailing funding, basis rich
    against the coin''s own history) and that have not yet been flushed (no large residual drop over the last days)
    should underperform the other liquid perps over the next week after a risk-off shock, and the order should weaken
    or reverse after a risk-on shock (re-leveraging into the same names). On calm dates funding and basis alone
    carry no reproducible edge (K-0197), so the effect is the interaction of an outside-market shock with the coin''s
    leverage state, not a stand-alone crowding premium.'
  why_not_arbitraged: The liquidity provider who would absorb this flow is hit by the same TradFi shock and the
    same VaR limits at the same moment (limits to arbitrage are tightest exactly when the trade appears); shorting
    crowded altcoin perps carries squeeze and listing risk; the events are rare and clustered in stress weeks, so
    the trade is small and lumpy for a dedicated fund.
signal:
  description: 'Data and timing. Daily Binance USD-M perps (binance_perp_1d), crypto day closes 00:00 UTC; decisions
    after the close of crypto day t using only data up to that close, trades at the open of day t+1. Universe: point-in-time
    top 20 perps by trailing 30-day quote volume (crypto_top_n n=20); a coin is scored on day t only if it is a
    member on t, has at least 30 days of price, funding and basis history and all features are finite. VIX = FRED
    VIXCLS (fred_macro, clock next_morning): the value of US session d is used only from the first crypto row on
    which the framework makes it usable, never earlier; weekends and US holidays carry the latest usable value.
    Features per coin and date (coin features z-scored across the scored members of that date with the framework
    helper; the two VIX features are date-level and fed RAW, not z-scored, because they are equal for every coin):
    (1) funding_7d = mean of extras[''funding''] (daily funding) over the last 7 days; (2) basis_rel = extras[''basis'']
    on day t minus the coin''s own median basis over the previous 30 days; (3) flush_5d = coin''s 5-day log return
    minus the 5-day log return of BTCUSDT.P (BTC itself gets 0); (4) rv_30d = standard deviation of the coin''s
    daily log returns over 30 days; (5) vix_shock = log(VIX_latest / VIX_previous), the change over the latest usable
    US session (signed); (6) vix_state = log(VIX_latest / median VIX of the previous 252 usable US sessions). Label
    (framework): total return from the open of t+1 to the open of t+6 (horizon 5), ranked across the universe on
    each date. Model: LightGBM (framework gbm) trained on ALL dates (shock and calm), expanding window, refit every
    63 rows, n_estimators per the grid, fixed num_leaves 8, learning_rate 0.05, min_child_samples 100, framework
    seeds. Trading rule (hand-written gate around the model score). A shock date is a crypto decision row on which
    a NEW VIX observation becomes usable (newer than on the previous row) and |vix_shock| >= shock_abs. On a shock
    date with at least 10 scored coins, rebuild the whole book from that date''s gbm scores: long the top fifth
    (k = round(0.2 x scored count), at least 2), short the bottom fifth, equal weights +0.5/k and -0.5/k (gross
    1.0, dollar-neutral). Hold 5 crypto days, then go flat; a newer shock date inside the 5 days replaces the whole
    book with its own scores and restarts the 5-day clock. No positions are opened on non-shock dates. A held coin
    that leaves the PIT universe is closed at the first decision row on which it is no longer a member (K-0051).
    Funding is charged by the engine. Before the first model fit there are no scores and the book is flat.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    shock_abs:
      grid:
      - 0.07
      - 0.1
      - 0.15
      value: 0.1
  timeframes:
  - 1d
mechanism_test:
  event: On a shock date (a new usable VIX observation with |log change| >= shock_abs), a coin enters the long leg
    (top fifth of the gbm score, side +1) or the short leg (bottom fifth, side -1) of the rebuilt book.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'funding_7d: 7-day mean of the perp''s daily funding (extras funding), z-scored across members - how crowded
    and costly the levered long side is'
  - 'basis_rel: today''s perp/spot basis minus the coin''s own trailing 30-day median basis, z-scored - fresh leverage
    demand relative to the coin''s normal level (tie-free, unlike raw funding at the default rate)'
  - 'flush_5d: 5-day log return of the coin minus that of BTCUSDT.P, z-scored - whether the leverage has already
    been flushed out by a drop'
  - 'rv_30d: 30-day realized volatility of daily log returns, z-scored - how much margin and VaR usage a position
    in the coin consumes when risk limits tighten'
  - 'vix_shock: log change of FRED VIXCLS over the latest usable US session, raw (date-level, signed) - the size
    and sign of the outside-market funding shock'
  - 'vix_state: log of the latest usable VIX over its trailing 252-session median, raw (date-level) - how stressed
    the cross-asset risk budget already is'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The label is a cross-sectional rank, so in a ridge on these six features the two VIX features
    add the same constant to every coin''s score on a date and cannot change the ranking at all: a ridge can only
    express the unconditional crowding and flush sorts that K-0197 found empty. The claim is that the shock changes
    WHICH coins lose - crowded, unflushed, volatile perps after a risk-off jump, the opposite after a risk-on drop
    - with a threshold in the shock size and an asymmetric sign, which a shallow tree can express by splitting on
    vix_shock and vix_state and then on funding_7d, basis_rel and flush_5d. If the gbm ranks shock-date coins no
    better than the ridge (or than the same coins on calm dates), the transmission channel does not exist. Who pays:
    levered longs cut by margin and risk-limit reductions in the days after a TradFi shock.'
data_requirements:
