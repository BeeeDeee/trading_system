falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of marked producer ETFs is not above the 95th percentile
  of the time-shifted placebos, or its gross per event is below the round-trip cost, or it has the predicted sign
  in fewer than 2 of 3 dev blocks.'
- 'Mechanism: the latest third of the dev period (about 2016-2020) has a negative side-adjusted average (decay reading
  of K-0060); the card counts that as a kill even if the pooled test passes.'
- 'Mechanism shape: if the 10- and 21-session abnormal returns are wrong-signed while the 5-session one is positive,
  or the effect grows steadily to 21 sessions, the reading is residual drift or identity, not a week-long concession.'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills, or the bootstrap bound of the Sharpe difference to T-bills
  not above zero.'
- 'Robustness: fewer than 75 % of the grid neighbours (z_entry 1.0 / 2.0, formation_days 3 / 10) reach the T-bill
  Sharpe bar, or the Sharpe at 2x costs is below the bar.'
- 'Robustness: one of the three dev sub-periods carries more than 60 % of the log return, or the book does not beat
  95 % of random entries with the same turnover.'
notes: 'Revision 2: short-term-reversal removed from related_families, because the lab''s family resolution treats
  it as this card''s own family (system message 1681), so its trials already count in G3 and G4 through the family
  itself; nothing else changed. Brief fit: cross-asset, signal from the commodity market (bullion, oil and gas ETFs)
  and the stock market, traded in producer equities, 5-day hold, mechanism test declared. Family: filed under etf-premium-arbitrage
  because the design (gap of a fund to a beta-adjusted anchor, catch-up within days) is the same as H-0080 and the
  closed-end fund catch-up cards; the overshoot half of the event is a residual reversal (as the lab filed H-0075
  and H-0123), which the family count already covers. related_families lists oil-shock-equity-underreaction (the
  lag half is commodity news reaching equities late, as in H-0119 and H-0173), so its trials count. Why this is
  not a retry of H-0037 / H-0080, whose lessons say wrapper pressure shows only against the basket''s own value:
  those anchors were twins or factor proxies (SPY/IEF) of the same asset class, where the ETF is itself the price-discovery
  venue. Here the anchor is the producer''s own output price, set in a different market by a different clientele,
  a cash-flow link rather than a wrapper link; the claim is clientele segmentation across asset classes. If it fails,
  that says the lab''s anchor-gap books fail even with the tightest economic anchor available, and the producer-commodity
  link is priced within a day (consistent with the mrel scan, which tested single daily lags, not a multi-session
  beta-adjusted gap). Peers: on every event date at least 7 of the 11 instruments are unmarked (only producers are
  ever marked; the five anchors are never marked); on the first possible event dates (after the 252-session warm-up
  from mid-2007) GDX, XOP, XLE, FCG, GLD, SLV, USO, UNG and SPY all exist; GDXJ and SIL join after their own warm-up.
  Beta gap (K-0074): marked producers have higher equity and commodity beta than the average peer, but the two sides
  occur in both directions, so a common drift cancels in the pooled side-adjusted mean; a side split would show
  it. Forecasts (K-0120, counted from the rule, not from data): residual first crossings beyond 1.5 sd of a 5-session
  sum about 6-10 per side per pair per year -> roughly 900-1500 events on 600-900 dates over 2008-2020; z_entry
  2.0 gives about a third as many. Expected gross per event if the claim holds: a 1.5 sd gap is about 4-6 % for
  miners (daily residual sd 1.5-2 %), so closing a tenth of it is 40-60 bps on the producer leg, against an event
  round trip of roughly 10-30 bps (K-0181: daily ETF tier about 10 bps; SIL, FCG, GDXJ thinner tiers). Book arithmetic:
  slot gross 0.4, about 6 pairs x 15 entries x 5 sessions / 252 ≈ 1.8 slots open on average, so mean gross about
  0.5-0.7 after the cap; producer weight per slot is only 0.4 / (1 + |b_c| + |b_m|) ≈ 0.1-0.2, hedges take the rest,
  so the hedge legs'' costs are a large share of the drag and doubled costs are the likely death of the book even
  if the mechanism passes. Expected result by side (K-0207): the long-producer side (lagged in equity risk-off)
  is the one the counterparty story favours most; the short side (ran ahead) is weaker. No references: a search
  found only practitioner material on gold vs miner spreads, no paper I can cite with certainty. Instruments chosen
  as the liquid US producer funds that have a direct single-commodity ETF anchor in the dev period, not by performance;
  USO''s 2020 restructuring and UNG roll costs affect only the hedge legs over 5-day holds.'
