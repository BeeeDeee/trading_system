  kind: instruments
mechanism:
  counterparty: 'Equity-side liquidity demanders in producer ETFs: sector-fund and generalist outflows in equity
    risk-off episodes, retail traders chasing or dumping miners and E&P funds on momentum, and leveraged sector-ETF
    products rebalancing in the producer basket. They trade the equity wrapper of commodity exposure without reference
    to the commodity''s own price and pay a concession to whoever holds the other side for a few days.'
  why: 'A gold, silver, oil or gas producer is a claim on its output price: with slowly moving costs, its cash flows
    move with the commodity (operating leverage), so its equity ETF should track a stable multiple of the commodity
    ETF plus a market component. But the two prices are set by different clienteles in different markets. The commodity
    is priced in futures and bullion markets by hedgers, futures traders and macro funds; the producer ETF is priced
    in the equity market by sector-fund, generalist and retail ETF traders whose buying and selling follow equity-market
    risk appetite, sector fund flows and attention (miners and E&P ETFs are among the most retail-traded sector
    funds). When equity-side flows push the producer ETF away from what its commodity and the market imply over
    a few sessions (dumped in an equity de-risking while the commodity holds, or chased after a commodity spike
    beyond the operating-leverage multiple), the gap is a temporary concession to equity-side liquidity demand and
    should close within about a week, mostly through the producer leg, because the commodity market is the deeper,
    better-informed price for the producer''s output. The same convergence covers the case where the commodity moved
    and the producer has not yet followed (slow cross-market diffusion).'
  why_not_arbitraged: There is no creation or redemption link between a miner ETF and bullion, so nothing forces
    the gap closed; the hedge ratio is estimated and drifts (hedging books, costs, mergers), and the residual carries
    firm-level news, so the trade is a risky statistical convergence, not an arbitrage. It needs capital on two
    desks (equity and commodity or futures), the small producer funds (SIL, FCG, GDXJ) are thin, and a gap can widen
    for weeks in a sector panic, which limits the capital that equity-neutral arbitrageurs commit.
signal:
  description: 'Daily decisions after the US close of day t, using total-return closes up to t (close-to-close total
    return from ret_co and ret_oc); trades at the open of t+1. Six pairs, producer -> anchor commodity ETF: GDX
    -> GLD, GDXJ -> GLD, SIL -> SLV, XOP -> USO, XLE -> USO, FCG -> UNG; SPY is the market anchor for every pair.
    Only the six producer ETFs are ever event instruments; GLD, SLV, USO, UNG and SPY are traded only as hedges.
    (1) Betas: for each pair on day t, OLS with intercept of the producer''s daily total return on the anchor commodity''s
    and SPY''s daily total returns over the trailing 252 sessions ending at t (all three must have a bar; require
    at least 200 valid sessions, else the pair is inactive that day) gives b_c, b_m and the daily residual standard
    deviation s. (2) Gap: e_t = sum over the last L = formation_days sessions of (r_producer - b_c * r_commodity
    - b_m * r_SPY), using the betas estimated at t; z_t = e_t / (s * sqrt(L)). (3) Entry: a pair enters when z first
    crosses beyond the threshold: z_t <= -z_entry with z_{t-1} > -z_entry (the producer lagged: side +1, long producer)
    or z_t >= +z_entry with z_{t-1} < +z_entry (the producer ran ahead: side -1, short producer). A pair with an
    open slot cannot re-enter until the slot closes. (4) Slot: at the open of t+1 the slot holds producer weight
    side * w, anchor commodity weight -side * b_c * w and SPY weight -side * b_m * w, with w = 0.4 / (1 + |b_c|
    + |b_m|) so that each slot has gross 0.4; weights are fixed at entry and the slot is closed at the open of t+6
    (held 5 sessions). Overlapping slots are summed per instrument; if the summed gross of all open slots exceeds
    1.0, all slot weights are scaled down proportionally that day. Cash otherwise. (5) Missing data or not-yet-listed
    instruments: a pair is inactive until all three of its instruments have 252 sessions of history and a bar on
    t and t+1; an open slot whose instrument has no bar keeps its weights and is closed at the first available open.
    No dates or instruments outside this list appear in the code.'
  params:
    formation_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
    z_entry:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: 'A producer-equity ETF (GDX, GDXJ, SIL, XOP, XLE, FCG) whose formation_days-session total-return residual
    to its own output commodity ETF (GLD, GLD, SLV, USO, USO, UNG) and SPY, with betas from the trailing 252 sessions,
    first crosses beyond z_entry residual standard deviations after the close of day t. Side +1 when the producer
    lagged (z <= -z_entry: it should outperform), -1 when it ran ahead (z >= +z_entry: it should underperform).
    Only producer ETFs are marked; the commodity ETFs, SPY and the unmarked producers are the peers.'
