mechanism:
  counterparty: Investors who trade rate-sensitive equities as a duration block on the day of a rate shock (income
    funds meeting flows, rate hedgers using sector ETFs, balanced/risk-parity books adjusting equity duration) and
    pay a price concession for immediacy; the liquidity providers are sector-rotation and value investors who need
    a few days to step in.
  why: 'On a day when the 10-year Treasury yield jumps or drops, rate-sensitive equity sectors are traded as a block
    by investors who hold them as bond substitutes or use them as rate hedges: income and dividend funds and their
    retail holders (utilities, REITs, staples), balanced and risk-parity books that treat them as duration, equity
    long/short funds that hedge rate exposure with sector ETFs, and the ETF creation/redemption that pushes those
    flows into the constituent stocks. On the other side financials and cyclicals are bought or sold as the ''rates-up''
    trade. This demand is for immediacy and is about the discount-rate move of the day, not about the sectors''
    cash flows, so the relative price of the rate-exposed sectors moves further than their change in value justifies.
    Sector rotators and value investors absorb the flow at a concession, and the rate-driven relative move partly
    reverses over the following week. The signal comes from the Treasury market (the yield change and each sector''s
    historical sensitivity to it); the trade is in equity sector ETFs.'
  why_not_arbitraged: 'The reversal trade carries rate-trend risk: yields can keep moving the same way for weeks,
    and a sector spread entered against a rate shock then loses before it reverts. Few desks run sector spreads
    against rate momentum, the effect per event is small next to the noise of a sector spread, and capital that
    could absorb it is slow. What is left is modest compensation for bearing rate-trend risk over a week.'
signal:
  description: 'Inputs: daily close-to-close total returns of the ten sector ETFs of the universe (from ret_co and
    ret_oc of sharadar_sfp) and the FRED 10-year constant-maturity Treasury yield DGS10 (fred_macro, percent, clock
    next_morning). Definitions: dy(t) = DGS10(t) - DGS10 of the previous valid observation, in percentage points,
    dated on its observation day t (days where FRED has no value give no dy). sigma_y(t) = standard deviation of
    the 63 valid dy observations before t (needs all 63). EW(s) = equal-weight mean return of the universe ETFs
    that have a return on session s; sigma_eq(t) = standard deviation of EW over the 63 sessions before t. For each
    ETF i, beta_i(t) = OLS slope of (r_i(s) - EW(s)) on dy(s) over the beta_days sessions s ending at t-1 on which
    both exist (at least 80 % of beta_days observations, otherwise i is not rankable). Event: dy(t) is at least
    k_sigma * sigma_y(t) in absolute value AND |EW(t)| is below 2 * sigma_eq(t) (rate shock on a day without an
    equity stress move). The event is acted on at the first session d at whose close dy(t) is available under the
    dataset clock (next_morning: normally d = the session after t). At d, compute for every rankable ETF the rate-explained
    relative move p_i = beta_i(t) * dy(t). The two ETFs with the lowest p_i (pushed down by the rate move) get weight
    +0.25 each, the two with the highest p_i (pushed up) get weight -0.25 each; all others 0 (gross 1, dollar-neutral).
    Trades at the open of d+1. Holding: 5 sessions; the position is set to zero after the close of d+5 (traded at
    the open of d+6). If a new event becomes known while a position is held, the new event''s weights replace the
    old ones and the 5-session clock restarts. Otherwise the book is flat (cash). Missing data: an ETF with no return
    on t or not tradable on d is not rankable and gets no weight; if fewer than 6 ETFs are rankable at d, no event
    is taken. IYR enters the ranking once it has beta_days of history; before that the ranking uses the nine Select
    Sector ETFs. Fixed design constants (not tuned): 63-session volatility windows, the 2-sigma equity-stress exclusion,
    two ETFs per side, 5-session hold.'
  params:
    beta_days:
      grid:
      - 126
      - 252
      - 504
      value: 252
    k_sigma:
      grid:
      - 1.0
      - 1.5
      - 2.0
      value: 1.5
  timeframes:
  - 1d
mechanism_test:
  event: 'The 10-year Treasury yield (FRED DGS10) changed on day t by at least k_sigma = 1.5 times its trailing
    63-observation standard deviation while the equal-weight return of the ten sector ETFs on t stayed within 2
    trailing standard deviations; the event is dated at the first session d at whose close the yield of t is available
    (next_morning clock). Marked: the two sector ETFs with the most negative rate-explained relative move beta_i
    * dy(t) (trailing 252-session slope of the ETF''s return minus the equal-weight return on dy) with side +1,
    and the two with the most positive with side -1; the other sector ETFs are the unmarked peers.'
