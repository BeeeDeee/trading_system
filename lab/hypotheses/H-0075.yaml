falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of the marked ETFs is at or below the 95th percentile
  of the time-shifted placebos, or the gross abnormal return per event is below the round-trip cost.'
- 'Mechanism decay: the side-adjusted mean at 5 sessions is negative in the latest third of dev; the card then counts
  as refuted for live use even if the pooled test passes.'
- 'Mechanism sign: a negative pooled side-adjusted mean at 5 sessions (rate-driven sector moves continue) refutes
  the overshoot story and favours the slow income-flow continuation reading.'
- 'Strategy: net Sharpe on dev below 0.5, or the bootstrap bound of the Sharpe difference against T-bills at or
  below zero.'
- 'Robustness: fewer than 75 % of the neighbours (k_sigma 1.0 / 2.0, beta_days 126 / 504) reach the T-bill bar,
  or the Sharpe at doubled costs falls below it, or the book does not beat random entries with the same turnover
  and exposure.'
notes: 'Brief fit: horizon 5 sessions (within 1-5); cross-asset in the strict sense: the signal is the Treasury
  market (FRED DGS10 and each sector''s sensitivity to it), the trade is equity sector ETFs. The FRED yield is used
  instead of a Treasury ETF on purpose: a Treasury ETF would have to sit in the universe and would then be an unmarked
  peer in the event study (K-0086), contaminating the abnormal return with its own post-shock drift. Cost of that
  choice: the yield is usable one session late (next_morning), so entry is at the open of t+2 and the first post-shock
  session is missed; the lab''s cross-asset reversals built over about five sessions (H-0046, H-0047), so the 5-session
  window should still hold most of an overshoot if it exists. How this differs from dead or related cards: (1) Not
  a stress rebound (K-0084, H-0041, H-0070, studies 6-7): equity-stress days (|EW move| >= 2 sigma) are excluded,
  so the event is a rate shock on an otherwise normal equity day, and both directions of the yield shock are marked,
  so generic equity drift cancels in the placebo. (2) Not H-0047 (macro-release reaction across 19 asset-class ETFs,
  sorted on their own reaction): events here are defined by the cause (the yield move) on any day, sorted by ex-ante
  rate sensitivity, inside one asset class (equity sectors), where the market-direction confound of mixing asset
  classes is smaller. (3) Not H-0072 (continuation in Treasury ETFs): the Treasury instrument is never traded. (4)
  Not the mrel linear lead-lag scan: the claim is a conditional cross-sectional reversal of the rate-explained sector
  move over a week, entered two sessions after the shock, not a next-day return regression. Family is short-term-reversal
  (liquidity provision after a flow-driven move), as H-0041 and H-0070 were filed, so the trial count is honest.
  Competing hypothesis, stated in advance: reaching-for-income flows (Daniel, Garlappi and Xiao, Monetary policy
  and reaching for income, Journal of Finance) predict that income-fund flows follow rate moves with a lag, which
  would make rate-driven sector moves CONTINUE; a wrong-signed result is therefore informative, not just a miss.
  No references are listed because no paper documents this exact reversal; the cited paper predicts the opposite
  sign. Expected counts: about 9-11 % of sessions have |dy| >= 1.5 sigma and most of them pass the equity filter,
  so roughly 400-500 event dates in 2000-2020 and 1600-2000 marked events (4 per date, 6 unmarked peers once IYR
  is in, 5 before); first events about 2000-01 after the 252-session beta warm-up from the card start (K-0075).
  Expected mean exposure about 35-40 % (gross 1 while invested, 5-session holds, replacement on new events). Typical
  marked sets: utilities, REITs and staples on the pushed-down side after yields rise, financials and cyclicals
  on the other; the sort is estimated point-in-time, not hand-picked. Beta confound (K-0074): rate-sensitive sectors
  are also low-market-beta sectors; marking both shock directions makes this cancel on average but adds noise. Expected
  size, honestly: a 1.5-sigma yield day moves the 2-vs-2 spread by very roughly 1 %; a reversal of a quarter of
  that gives about 0.1-0.15 % per marked ETF against peers over 5 sessions, a few times the round trip of these
  liquid ETFs (sector SPDRs are among the most liquid ETFs), and the placebo cloud for ~450 dates should be narrow
  enough (bar of order 0.1 %) to see an effect of that size. The most likely death is the strategy, not the mechanism:
  at that size a part-time dollar-neutral book has a Sharpe of order 0.2-0.4, below the 0.5 floor against T-bills
  (K-0027); it passes only if the effect is two to three times larger. ETFs have no forward data, so G4 is the ceiling.'
