falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the beta-quintile events at the month turn does not beat
  the 95th percentile of the 200 time-shifted placebos, or does not keep its sign in at least 2 of 3 sub-periods,
  or does not cover the round-trip cost per event.'
- Net Sharpe on dev below 0.5 (T-bill benchmark bar), or below T-bill Sharpe + 0.10, or the bootstrap 90 % lower
  bound of the Sharpe difference is not above zero.
- Fewer than 75 % of the neighbors (post_days 2 and 4, beta_lookback 126 and 504, and their combinations) still
  beat the benchmark, or the median neighbor Sharpe is below 0.7 times the primary.
- More than 60 % of the dev log return comes from one of three sub-periods, or fewer than 2 of 3 sub-periods beat
  the benchmark.
- At costs x2 the net Sharpe no longer clears the benchmark bar.
notes: 'Brief fit: holding 5 trading days, US single stocks, cross-sectional LIQ-500, mechanism test declared. Family
  reuse: this is the same economic mechanism as H-0001 (turn-of-month flows), so it is filed under turn-of-month-flows
  on purpose and adds to that family''s trial count. Why it is not a near-copy of H-0001: H-0001 switched the whole
  book between SPY and IEF and was benchmarked against 60/40. Its average equity weight was far below the benchmark''s,
  so it failed by design (lesson H-0001, K-0005), and its window mechanism checks never ran. Its lesson asked exactly
  for "window vs outside equity returns against random-window placebos". This card''s mechanism test does that:
  the placebo shifts the same beta-ranked event set to non-window dates, so it measures the window premium net of
  the unconditional beta premium. The strategy is dollar-neutral against cash, so there is no average-exposure handicap
  against a constant mix. Not short-term reversal: the ranking is on a 1-year beta and does not use recent returns.
  Known structural risk, stated up front: the book is a monthly market-timing bet spread over many stocks, so its
  Sharpe is capped by the window''s own market Sharpe. Even a real premium of a few tenths of a percent per window
  may land near the 0.5 bar after costs. If the mechanism passes and the strategy fails G1, that separates "the
  window premium exists" from "it is too small to trade alone". Exposure is about 5/21 of days at gross 1 (about
  24 %, above the 20 % floor). The post_days = 2 neighbor holds 4 days (about 19 %), which matters only for G2 Sharpe.
  About 200 stocks enter each month, two decision dates per month, so the entry and decision-date minimums are met.
  Costs: two full turnovers of gross 1 per month in LIQ-500 at 3-6 bps half-spread (x2.5 before 2001-04). Beta legs
  mix industries (tech vs utilities), which adds noise but no bias. The sp500 alt universe is a natural G2 check.
  References are cited honestly. McConnell-Xu (2008) is inside dev, so the publication-decay check applies. Etula
  et al. (2020) dates from the end of dev, so its dev pre/post comparison is degenerate. No literature value was
  tuned: the window (last day to day +3) is the classic definition, beta_lookback 252 is the standard one year,
  quintiles are fixed.'
