mechanism:
  counterparty: Calendar-bound flow investors and institutions with month-end liquidity needs. Payroll and retirement
    contributions and reinvested coupons and dividends buy equities at the month turn whatever the price. Institutions
    that sell before month end to raise cash sell at depressed prices and buy back at the turn (Etula et al. estimate
    their timing loss in the tens of billions of dollars a year). They do it because their payment schedules are
    fixed by contracts and mandates, not chosen for returns.
  why: The equity market premium is not spread evenly over the month. Payments in the US are standardized around
    the turn of the calendar month (wages, pension and 401k contributions, coupons, dividends), so cash that must
    go into equities arrives in bulk in the last day and first days of each month. In the days just before, institutions
    sell equities to meet month-end cash needs. Price-insensitive buying in the turn-of-month window lifts the market
    (Ogden 1990; Etula, Rinne, Suominen, Vaittinen 2020). McConnell and Xu (2008) report that over 1926-2005 the
    US market premium was earned on average almost only in the window from the last trading day to the third trading
    day of the new month. A dollar-neutral book that is long high-beta and short low-beta stocks has a net market
    beta near one. Held only inside the window, it collects the window's market premium against a cash benchmark.
    It does not hold equity beta during the rest of the month, when the premium is claimed to be near zero. Because
    the book does not switch between SPY and IEF, it avoids the handicap that killed H-0001 (K-0005). Rank-based
    legs give hundreds of position entries per month, and the claim becomes a cross-sectional event that the judge
    can test against time-shifted placebos.
  why_not_arbitraged: Collecting the premium means carrying full market risk for a few days every month for a few
    tenths of a percent. That is a small reward per unit of risk, and it does not scale with leverage for capital
    that pays for drawdowns. Desks that provide this liquidity are balance-sheet constrained exactly at month and
    quarter ends. The flow is mandated, so it does not shrink when the premium becomes known.
signal:
  description: 'Calendar: use the XNYS trading calendar (known in advance; the exchange calendar the framework uses
    for the catalog), never the data''s own row index, so that truncating the data cannot change which day is a
    month''s k-th-to-last or k-th trading day. Daily stock return r[t,j] = (1+ret_co[t,j])*(1+ret_oc[t,j]) - 1 (close-to-close
    total return). Market return m[t] = equal-weighted mean of r[t,j] over the stocks in the liq_n universe on day
    t with a valid return. Beta: for each stock, OLS slope of r[.,j] on m[.] over the last beta_lookback trading
    days ending at the decision day t (inclusive). Require at least 0.8*beta_lookback valid paired observations,
    otherwise the stock is not eligible on that date. ENTRY: after the close of the trading day that comes pre_days+1
    trading days before the last trading day of the month (with pre_days = 2, the third-to-last trading day), take
    the stocks that are in the liq_n universe and tradable on that day and have a valid beta. Rank them by beta.
    Long the top quintile with equal weights summing to +0.5 and short the bottom quintile with equal weights summing
    to -0.5 (gross 1, dollar-neutral). Trade at the next open, which is the open of the pre_days-th-to-last trading
    day of the month (with pre_days = 2, the second-to-last trading day). EXIT: after the close of trading day post_days
    of the new month (with post_days = 3, the third trading day), set all weights to 0 and trade at the next open.
    Between entry and exit, weights are not rebalanced, so they drift with prices. A stock that delists or becomes
    untradable inside the window keeps its engine terminal return, and its weight is not reallocated. Flat (all
    cash) outside the window. Why pre_days = 2: with execution at the open, a position must be held through the
    close of the second-to-last day to capture the literature window from the last trading day to the third trading
    day (close-to-close). The value comes from the open-execution constraint, not from tuning. Two decision dates
    per month: one entry, one exit.'
  params:
