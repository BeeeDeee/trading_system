  - 1mo
mechanism_test:
  event: 'After the close of the third-to-last XNYS trading day of a month, a stock in the liq_n universe is in
    the top quintile (side +1) or bottom quintile (side -1) of trailing 252-day beta to the equal-weighted universe
    return. Mechanism claim: over the 5 trading days from the next open (the second-to-last trading day) to the
    close of the third trading day of the new month, high-beta stocks beat the cross-sectional mean and low-beta
    stocks lag it, by more than the same beta ranking does in time-shifted (non-window) placebo dates.'
