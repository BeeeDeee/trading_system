falsification_criteria:
- 'Mechanism: gbm-only entries (event below) do not beat the 95th percentile of the time-shifted placebos at 5 sessions,
  or their gross abnormal return per event is below the round-trip cost: the event-time nonlinearity is not visible
  or not tradable.'
- 'Mechanism: the latest third of dev has a negative mean for the event (K-0060 decay), even if the pooled test
  passes.'
- 'Mechanism shape: the 1-session abnormal return of the event is negative while only the 21-session horizon is
  positive. That is slow generic drift, not event-time drift.'
- Net Sharpe on dev below SPY_TR + 0.10, or the bootstrap bound of the Sharpe difference at or below zero.
- 'Ridge on the same five features, rows, label, schedule and book (framework ridge) gives the same or a better
  net Sharpe than the gbm book: nonlinearity does not pay.'
- Fewer than 75 % of the neighbors (top 0.1 / 0.3, num_leaves 8 / 31) beat SPY_TR, or their median Sharpe is below
  0.7 of the primary.
- At doubled costs the book's Sharpe falls below SPY_TR.
notes: 'Brief fit: learned model, US single stocks cross-sectional (LIQ-500), 5-day label and weekly decisions.
  Names may persist in the top fifth for several weeks while their drift lasts; each decision is a 5-day bet. How
  this differs from the earlier members of the family, and why the trials belong here: H-0033 used a fixed 5-session
  slot after large positive reactions (passed the mechanism test, missed the Sharpe margin). H-0095 and H-0101 ranked
  release rows only. H-0100 split the reaction into gap and intraday parts. H-0102 adds 13F ownership. None of them
  scored all members on all dates with event time, the drift already realized and the pre-release run-up. This card
  follows K-0141 and K-0138 and reports the interaction directly. The mechanism event is the set of picks only the
  nonlinear model makes, judged against same-stock placebos, so a pass means the event-time shape pays and a failure
  means it adds nothing tradable over the linear score. Family post-earnings-announcement-drift is reused on purpose;
  this is one more trial of it. Data period: sec_8k_item202 starts 2004-08 (K-0035), so dev runs 2004-09 to 2020-12.
  Features need a previous reaction, and walk_forward needs labelled history, so the first fit falls around 2006.
  Before it the book holds the members equal weight instead of cash (a warm-up fallback, about 1.5 of 16 years,
  not model output). The judge should read the model-driven years separately if it can. Stocks without 8-K coverage
  are not scored (coverage gaps, survivor lean, K-0035). Forecasts, written before any run (K-0120, K-0140): about
  15-25 gbm top-fifth entries per week, of which roughly 30-50 % are not in the ridge top fifth. That gives about
  3000-8000 events on 600-750 weekly dates. Round trip for LIQ-500 after decimalization is about 11-12 bps. My forecast
  of gross per gbm-only event is 10-25 bps over 5 sessions, ratio about 1-2. If it is a quarter of that (3-6 bps),
  the card dies on cost, and the reading is that the event-time nonlinearity of reaction drift is not tradable in
  LIQ-500. The learned-PEAD line should then be closed. Expected beta gap between event stocks and peers: small.
  Picks are driven by firm-specific reactions, not by a volatility sort, and react_z is scaled by own residual volatility,
  but the model could still lean towards volatile names (K-0074). Book arithmetic: top fifth is about 100 names.
  Weekly turnover is expected at 25-35 % (scores jump mainly at releases). At about 6 bps per side that costs roughly
  1.6-2.2 %/yr (twice that at doubled costs). About 15-25 % of the book should be fresh reactions in their first
  week. If those earn 30-40 bps over 5 sessions over the others, the gross tilt is about 2.5-5 %/yr. Equal weight
  carries a small handicap against cap-weighted SPY_TR. A pass therefore needs the upper half of that range. The
  most likely death is the Sharpe margin at G1 or doubled costs at G2. Builder notes: run gbm and ridge with identical
  inputs; the event needs both top fifths on the same date. Compute features on all columns and mask to members
  per row. Rolling windows must accept views shorter than their window (K-0131). Report in the diagnostic output,
  if possible, the event mean by third and the overlap share between the gbm and ridge top fifths.'
