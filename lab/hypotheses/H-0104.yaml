id: H-0104
version: 1
title: Event-time decay of earnings-reaction drift, learned - LIQ-500 long-only weekly top fifth of a LightGBM 5-day
  score; mechanism = gbm-only vs ridge entries
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Holders who anchor on their pre-release expectations and update slowly (prices do not fully reflect
    what current earnings imply for future earnings), and attention-constrained or passive holders who do not trade
    on the release. They sell (or do not buy) at prices that have not absorbed the news yet.
  why: 'Investors underreact to earnings news: the market''s own release-session reaction is followed by same-direction
    drift (Bernard and Thomas 1989, 1990; in this lab the plain reaction-following events passed the placebo test
    in every third of dev, also on the long side alone: H-0028, H-0031, H-0033). The drift is not uniform in event
    time. It should be concentrated in the sessions right after the release and decay with the sessions since it;
    it should be smaller when the price has already moved in the reaction''s direction since the release (the underreaction
    has been worked off) and larger when the reaction contradicts the pre-release drift (news the market did not
    anticipate). Every earlier card in this family held a fixed five-session slot from the release or scored release
    rows only. This card scores every member on every weekly date with event-time features. The aim is to hold a
    stock while its remaining expected drift is high and drop it once the drift is realized, and to show whether
    that event-time shape adds anything over a linear score on the same inputs.'
  why_not_arbitraged: In large caps the drift left after the release session is small per week relative to spread
    costs. A taker who trades every release in and out and hedges it loses the edge (the lab's market-neutral reaction
    books lost to T-bills). Harvesting it needs a low-turnover, always-invested long-only stock book. That is a
    mandate that short-horizon arbitrage capital does not hold, and a long-only manager sees the drift only as a
    small tilt with tracking error. The drift is also clustered in earnings seasons, so it cannot be levered as
    a steady carry.
signal:
  description: 'Data: sharadar_sep daily total returns r (close to close, (1+ret_co)(1+ret_oc)-1) and the attached
    8-K flag ea_reaction_day (1 on the reaction session of an Item 2.02 release, known at that session''s close).
    Universe-relative return u[t,j] = r[t,j] minus the equal-weight mean of r over the LIQ-500 members on t. Scale
    s[j] = standard deviation of u over the 63 sessions ending the session before the reaction session (at least
    40 valid values, else NaN). Features per member and date t, all from data up to the close of t, each z-scored
    across the members on t by the framework helper: (1) react_z = u on the most recent reaction session R1 (R1
    <= t, within the last 126 sessions) divided by s; (2) react_z_prev = the same for the reaction session before
    R1 (within 126 sessions before R1), with its own scale; (3) sessions_since = number of sessions from R1 to t
    (0 when t is the reaction session); (4) post_car_z = sum of u from the session after R1 to t (0 when t = R1)
    divided by s; (5) pre_car_z = sum of u over the 21 sessions ending the session before R1, divided by s times
    sqrt(21). A member with any feature NaN (no 8-K reaction session in the last 126 sessions, short history) is
    not scored on t. Label (framework): total return from the open of t+1 to the open of t+6 (horizon_days 5), ranked
    across members on t. Model: LightGBM (framework gbm) through lab.framework.ml.walk_forward, expanding window,
    refit every 63 rows, fixed n_estimators 100, learning_rate 0.05, min_child_samples 200, subsample 0.8, colsample
    1.0; num_leaves is the grid parameter. Feature columns are computed on all stocks and masked to members per
    row (no ever-member column subset, K-0134). Book: decisions after the close of the last session of each week;
    at the next open hold, equal weight, the members whose gbm score is in the top `top` fraction of the scored
    members on that date; long-only, gross 1. If no model has been fitted yet or fewer than 50 members are scored
    on a decision date, hold all members equal weight (warm-up fallback, stated so that the warm-up years are not
    cash). A stock that leaves the universe between decisions is sold at the next decision row on which the engine
    requires it (no weight outside the universe). Ridge control: the Builder also runs walk_forward with model ridge
    (alpha 1.0) on exactly the same features, rows, label and refit schedule; it is used only by the mechanism diagnostic
    and as the named linear baseline, never by the book.'
  params:
    num_leaves:
      grid:
      - 8
      - 15
      - 31
      value: 15
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: At a weekly decision date, a LIQ-500 member enters the top fifth of the gbm score (it was not in the gbm
    top fifth at the previous weekly decision) while it is NOT in the top fifth of the ridge score fitted by walk_forward
    on the same features, rows, label and refit schedule on that date. Side +1 (the stock should outperform the
    other members). Dates before the first model fit have no events.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
ml:
  features:
  - 'react_z: universe-relative return of the latest 8-K Item 2.02 reaction session, scaled by the stock''s prior
    63-session residual volatility (the market''s own surprise measure)'
  - 'react_z_prev: the same for the previous quarter''s reaction (surprise persistence across quarters; whether
    the latest reaction confirms or reverses the last one)'
  - 'sessions_since: sessions since the latest reaction session (event time; the drift is expected to decay with
    it)'
  - 'post_car_z: universe-relative return accumulated since the reaction session, scaled (how much of the drift
    is already realized)'
  - 'pre_car_z: universe-relative return over the 21 sessions before the reaction session, scaled (anticipation;
    a reaction against the run-up is unanticipated news)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is an interaction in event time. The slope of the next-5-day return on react_z should
    be steep in the first sessions after the release and fade towards zero as sessions_since grows. It should shrink
    when post_car_z already has the reaction''s sign (drift realized) and grow when pre_car_z has the opposite sign
    (unanticipated news). A ridge on the same five features gives react_z one constant slope at every event time.
    It ranks a large reaction from 50 sessions ago as high as yesterday''s and can only add post_car_z and pre_car_z
    as separate tilts, which mostly load on generic reversal or momentum. A shallow tree ensemble can express react_z
    x decay(sessions_since) and the sign agreement with post_car_z and pre_car_z. Who pays: slow-updating holders
    of stocks with fresh, unanticipated, not-yet-drifted news. If ridge on the same rows does as well, the event-time
    story adds nothing and the plain rule of H-0033 is the whole effect.'
