id: H-0178
version: 1
title: Macro-trend pass-through into stock exposures, learned - LIQ-500 long-only, monthly 2-month sleeves of the
  top fifth of a LightGBM score on rate, oil and dollar betas x the factors' own trends
author_agent: scout
family: cross-asset-momentum
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity holders and sector-specialist analysts who anchor on firm-level news and treat a months-long
    move in yields, oil or the dollar as noise to be faded or ignored, plus index and benchmark-hugging money that
    holds exposures regardless of the macro trend; they sell exposed stocks too early in a factor trend and buy
    them back late.
  why: 'Macro prices (long Treasury yields, crude oil, the dollar) trend over months because policy cycles, supply
    adjustments and capital flows are slow (time-series momentum, Moskowitz, Ooi and Pedersen 2012). A stock whose
    cash flows load on a trending factor keeps receiving that factor''s continuation, and equity investors, who
    price firms mostly on firm and sector news, take the macro pass-through in with a lag (Hong, Torous and Valkanov
    2007; Driesprong, Jacobsen and Maat 2008 for oil). So the stocks that should earn over the next two months are
    not a fixed set: oil-exposed stocks while oil trends up, the same stocks underweighted while it trends down,
    rate-sensitive stocks according to the direction of the yield trend, exporters and importers according to the
    dollar trend. The signal comes from the bond, commodity and FX markets; it trades in stocks.'
  why_not_arbitraged: The exposure of a single stock to a macro factor is estimated noisily and drifts, so the trade
    is a diversified macro bet with factor-sized risk, not an arbitrage; macro funds take the trend in futures,
    not in the slow pass-through to hundreds of stocks, and equity long-only mandates cannot hold the factor itself.
    Trends reverse sharply at turning points, which caps the capital willing to run it.
signal:
  description: 'Data: LIQ-500 point-in-time members (sharadar_sep total returns) and three FRED series (fred_macro,
    clock next_morning, last value carried forward at most 5 rows): DGS10 (10y Treasury yield, percent), DCOILWTICO
    (WTI spot, USD; floored at 5 USD before any log so that a non-positive print cannot break the log), DEXUSEU
    (USD per EUR; dollar factor = -log(DEXUSEU)). Factor daily changes: dY = change of DGS10 in percentage points,
    dO = change of log(max(WTI, 5)), dD = change of -log(DEXUSEU). Decision dates: the first trading row of each
    calendar month; decisions after the close of row t with data up to that close, trades at the open of t+1. Features
    are computed only on decision rows (NaN elsewhere), so the model trains and scores on monthly (date x stock)
    samples. Stock features (3): on each decision row, for each stock, a multivariate OLS over the last 104 non-overlapping
    5-row returns ending at t: stock total return = a + b_m * market + b_y * dY5 + b_o * dO5 + b_d * dD5, where
    market = equal-weight mean total return of that row''s LIQ-500 members and dY5, dO5, dD5 are the factors'' 5-row
    changes over the same weeks. Require at least 78 valid weeks, else the stock is not scored. Features are b_y,
    b_o, b_d (partial betas, net of the market), winsorized at the 1st/99th cross-sectional percentile and z-scored
    across that date''s members with the framework helper. b_m is used only to net the market out and is not a feature.
    (Rolling sums of cross-products are an allowed implementation.) Date-level features (3): for each factor k,
    trend z_k = (change of the factor over the last L rows) / (std of its daily changes over the last 252 rows *
    sqrt(L)), L = trend_lookback. These are the same for every stock on a date and must be fed RAW, not through
    the cross-sectional z-score (which would set them to zero). Label and model: framework walk_forward, label =
    total return from the open of t+1 to the open 42 rows later, ranked across members on each date (horizon_days
    42, purge by the framework). Model gbm (LightGBM), n_estimators as in params, num_leaves 8, learning_rate 0.05,
    min_child_samples 500, subsample 0.8, colsample 1.0; expanding window, refit every 63 rows. No feature selection,
    no tuning, no early stopping; columns are all stocks of the view, masked per row by point-in-time membership
    (no ever-member subsets). Book (score_weights, only_on decision rows): two overlapping monthly sleeves. At each
    decision row a new sleeve holds the top fifth of that date''s scored members by score, equal weight, and keeps
    it for two decision dates (about 42 rows); the book weight of a stock is 0.5 * its weight in this month''s sleeve
    + 0.5 * its weight in last month''s sleeve. A stock that leaves the universe or stops trading is dropped from
    its sleeve at the next decision row and the sleeve is renormalized. A sleeve date with fewer than 50 scored
    members holds the equal-weight members instead. Until the first model score exists (warm-up), both sleeves hold
    the equal-weight universe, so the warm-up book is the same EW control, never cash. Long-only, gross 1.0, no
    leverage.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    trend_lookback:
      grid:
      - 42
      - 63
      - 126
      value: 63
  timeframes:
  - 1d
  - 1w
  - 1mo
  - 1q
mechanism_test:
  event: At a monthly decision date a LIQ-500 member enters the top fifth of the model score (it was not in the
    top fifth of scored members at the previous monthly decision); side +1. Only dates with a model score (after
    warm-up).
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 42
ml:
  features:
  - 'Partial beta of the stock''s weekly total return to weekly changes of the 10y Treasury yield (FRED DGS10),
    net of the equal-weight market, 104 weeks: the stock''s discount-rate / rate-cycle exposure.'
  - 'Partial beta to weekly log changes of WTI crude (FRED DCOILWTICO, floored at 5 USD), net of the market, 104
    weeks: the stock''s commodity-input or commodity-revenue exposure.'
  - 'Partial beta to weekly log changes of the dollar against the euro (minus log FRED DEXUSEU), net of the market,
    104 weeks: the stock''s foreign-revenue / import-cost exposure.'
  - 'Trend z of the 10y yield: change over the last trend_lookback rows divided by its trailing 252-row daily std
    times sqrt(lookback), date-level, fed raw: direction and strength of the rate cycle.'
  - 'Trend z of log WTI over the same window, date-level, fed raw: direction and strength of the oil trend.'
  - 'Trend z of the dollar over the same window, date-level, fed raw: direction and strength of the dollar trend.'
  horizon_days: 42
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The three trend inputs are the same for every stock on a date and the label is ranked across
    stocks per date, so a ridge on these six inputs can only use the betas: it becomes a static exposure sort (high
    oil beta always good or always bad), which is coin-flip identity that the same-stock placebo removes. The claim
    is an interaction whose sign flips: the payoff to an exposure has the sign of its factor''s trend. Beyond the
    product, trend payoffs are closer to sign than linear (weak trends are noise, strong ones persist, very strong
    ones are partly exhausted), and exposure estimates are reliable only in the tails, so the expected response
    surface is beta x saturated trend with thresholds, and possibly conditional across factors (a rate trend matters
    more when the dollar trends the same way). Small trees split on trend size and then on beta; a ridge cannot.
    The explicit linear version (ridge on the three products beta_k x trend_k) is the baseline the gbm must beat.
    Who pays: equity holders and sector analysts who take the macro pass-through in late.'
