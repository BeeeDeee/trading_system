falsification_criteria:
- Net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference at or below zero.
- Fewer than 75 % of the grid neighbors (n_estimators 50/200, trend_lookback 42/126 and combinations) beat SPY_TR,
  or their median Sharpe is below 0.70 of the primary.
- 'Mechanism: new entries into the top fifth (event below) do not beat the 95th percentile of the time-shifted placebos
  at 42 days, or the event mean is not above the placebo mean (the score picks stocks that earn on any date, i.e.
  static exposure identity, not trend timing).'
- 'Mechanism: the latest third of dev is wrong-signed, or gross per entry at 42 days is below the round-trip cost.'
- 'Linear baseline: a ridge on the same six features (a static beta sort) gives the same or a better result than
  the gbm, so the trend interaction is not what pays.'
- 'Linear baseline: a ridge on the three explicit products beta_k x trend_k is as good as the gbm, so the nonlinearity
  adds nothing and the lab should keep only the linear card.'
- The book does not beat the equal-weight LIQ-500 control by more than the cost drag after the warm-up, so any margin
  over SPY_TR is the equal-weight tilt, not the model.
notes: 'Why this family and not oil-shock-equity-underreaction: that family (H-0114, H-0116, H-0119, H-0126, ...)
  trades dated factor SHOCK weeks for five days and needs stock underreaction to a news event. This card has no
  shock events: it claims persistence of slow macro trends (time-series momentum in bonds, oil, FX) harvested through
  equity exposures over two months, the same mechanism as H-0087 (bond trend into country equity) and H-0177 (TS
  momentum across a 60/40 core), hence cross-asset-momentum. If the Skeptic judges the pass-through reading to dominate,
  I accept a re-labelling to oil-shock-equity-underreaction; I am not trying to escape its trial count. Differences
  from the dead cards: H-0087 used 15 country ETFs (few independent picks, wide cloud, K-0217); here ~500 stocks
  with continuously estimated exposures. H-0116 used shock weeks and 5-day holds; here every month, a two-month
  label, three slow trends. K-0201 (nine quarter-horizon stock sorts, all died on the same-stock placebo) is the
  main risk: those sorts were static characteristics; here the top fifth must rotate with the trend signs, which
  is exactly what the time-shifted placebo tests, and the event is new entries only. Lessons applied: date-level
  trends fed raw, not z-scored (K-0178); all columns masked per row, no ever-member subset (K-0134); features only
  on monthly decision rows to keep refits fast (80 refits on about 125k samples); warm-up book = EW universe, never
  cash, so the early bear years cannot flatter the book; the ridge controls named (K-0135, K-0182). Expected numbers
  (forecast, not seen): betas need 104 weeks, so features from about 2001 and first scores about 2002-2003 depending
  on the framework''s minimum sample; the first G1 third (1999-2006) will be partly warm-up (K-0163), so both later
  thirds must carry the sign. Entries: top fifth = ~100 names, monthly rotation from trend flips and beta drift
  maybe 20-40 new names a month -> about 4000-8000 events on about 200 decision dates. Round trip in LIQ-500: 6-24
  bps (half-spread tiers 3/6/12 bps, x2.5 before 2001-04). Annual turnover of the book about 3-5x, cost drag about
  0.5-1 %/y. A plausible gross gap per entry is 0.3-1 % over 42 days; the book''s expected gain over the EW universe
  is 1-3 %/y, which must also clear SPY_TR + 0.10 Sharpe. Beta gap (K-0074): betas are partial (market netted out)
  and the model has no market-beta input, but the top fifth can still differ in market beta from the peers; the
  same-stock placebo absorbs a static gap, not a time-varying one. Data: DCOILWTICO has a non-positive print, hence
  the 5 USD floor; FRED FX is a noon New York fixing (fx_noon), so weekly, not daily, changes are used for the betas.
  The independent sample for the interaction is the number of distinct macro-trend states (roughly 80 non-overlapping
  quarters in dev), not the stock count: that is why the model is kept small (100 trees, 8 leaves, 500 minimum child
  samples) and the grid has two parameters. Holdout and forward: no forward stock data, so the card can pass at
  most G4.'
