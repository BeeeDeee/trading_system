version: 1
title: Net share repurchasers held for a year - LIQ-500 long-only, monthly overlapping 12-month cohorts of the top
  quintile of trailing net repurchase yield
author_agent: scout
family: trading-window-flows
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors who sell to the company in its buyback program and buyers of newly issued shares (offering
    allocations, shareholders of targets paid in stock, the market absorbing shares sold by employees after option
    exercise), plus cap-weighted index funds that mechanically buy new shares at float updates. They trade for reasons
    unrelated to the insider-information content of the issuance decision.
  why: 'Managers know more about the long-run value of their firm than outside investors and time equity transactions
    on it: they issue shares (seasoned offerings, stock-financed deals, option and stock-plan issuance) when the
    stock is rich and buy shares back when it is cheap. Investors under-react to the information in these transactions,
    because each one is small relative to market value, spread over many quarters and disclosed in the cash-flow
    statement rather than as news, so prices adjust slowly over the following one to three years (new-issues puzzle,
    buyback under-reaction, net issuance anomaly). A stock that becomes a large net repurchaser relative to its
    size should therefore beat other liquid stocks over the next year, and a stock that becomes a large net issuer
    should lag them.'
  why_not_arbitraged: The effect is slow (it builds over years) and modest per year in large caps, so it pays only
    with long holding and patience; repurchasers are value-like and low-beta, so the tilt can lag a cap-weighted
    growth-led index for years (career and tracking-error risk for benchmarked managers); the short side (issuers)
    is concentrated in expensive growth names with squeeze risk and borrow cost, which keeps long/short arbitrageurs
    small.
signal:
  description: 'Inputs: LIQ-500 point-in-time membership; Sharadar SF1 as-reported trailing-twelve-month fields
    sf1_art_ncfcommon (net cash flow from issuance (+) or purchase (-) of equity shares) and sf1_art_marketcap (market
    value frozen at the filing date), each usable from the day after its SEC filing as the loader provides them.
    Score: net repurchase yield NRY = -sf1_art_ncfcommon / sf1_art_marketcap (positive = net repurchaser). A stock
    is eligible on a decision date only if it is a LIQ-500 member and both fields are present (not NaN, loader staleness
    rule applies) with marketcap > 0; otherwise it is unranked. Decision dates: after the close of the last trading
    day of each month t. On each decision date rank eligible members by NRY (descending, ties broken by the instrument
    id order) and form cohort c_t = the top `quantile` fraction (rounded down, at least 1 name). Book: the live
    cohorts are those formed on the current and the previous hold_months - 1 decision dates (all formed cohorts
    while fewer than hold_months exist, so the book is fully invested from the first decision). Each live cohort
    gets an equal share of capital; inside a cohort the share is split equally across its names that are still LIQ-500
    members and tradable on the decision date (names that left the universe or stopped trading are dropped from
    the cohort and their weight is spread over its remaining names; a cohort with no names left drops out and its
    share is spread over the other live cohorts). A stock in several live cohorts gets the sum of its weights. Target
    weights are set after the close of t and traded at the open of t + 1; between decision dates no trades, except
    that a stock that leaves the universe or delists is sold at the next possible open and the proceeds stay in
    cash until the next decision date. Long-only, gross <= 1, no shorts, no leverage. Event for the mechanism test
    (diagnostic.py): on each decision date, mask = True for a member that is in the top `quantile` of NRY now and
    was not in it at the previous decision date (side +1), and for a member that is in the bottom `quantile` of
    NRY now (heaviest net issuers) and was not in it at the previous decision date (side -1); on the first decision
    date no events.'
  params:
    hold_months:
      grid:
      - 6
      - 12
      - 18
      value: 12
    quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1mo
  - 1q
mechanism_test:
  event: 'At a month-end decision date a LIQ-500 member newly enters the top quintile of trailing-twelve-month net
    repurchase yield (-ncfcommon / marketcap), having been outside it at the previous month-end: side +1 (should
    outperform the other members). A member newly entering the bottom quintile (heaviest net issuers): side -1 (should
    underperform).'
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
