falsification_criteria:
- 'Mechanism: the side-adjusted 60-session abnormal return of new top/bottom-quintile entries does not exceed the
  95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of dev has the wrong sign (decay or no effect after publication, K-0060).'
- 'Mechanism shape: the 60-session abnormal return is not larger than the 21-session one (the claim is a slow drift,
  not a filing-week jump).'
- Net Sharpe of the primary book on dev below SPY total return Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference not above zero.
- The book does not beat the 95th percentile of random-entry books drawn from eligible LIQ-500 stocks with the same
  turnover (the repurchase sort adds nothing over an equal-weight liquid-stock basket).
- Fewer than 75 % of the neighbors (quantile 0.1 / 0.3, hold_months 6 / 18 and their combinations) beat SPY.
- Post-publication (from 2008) excess Sharpe over SPY below half of the pre-publication excess.
- S&P 500 alternative universe Sharpe below half the main Sharpe or below SPY; Sharpe at doubled costs below SPY.
notes: 'Brief fit: US single stocks, cross-sectional, holding horizon 6-24 months (hold_months 6/12/18, overlapping
  monthly cohorts, value 12). Family: the sort variable (net equity issuance from the cash-flow statement) is essentially
  the net-repurchaser vs stock-compensation-issuer score of H-0019 and H-0027, so I file it under trading-window-flows
  so the trials count together, although the mechanism argued here is different (managerial market timing plus slow
  under-reaction, a year-long style drift, not a flow in the days after the trading window opens). This is the follow-up
  the Librarian asked for in H-0027 and K-0041: "a low-turnover tilt on an always-invested book, argued as a style
  premium". Honest snooping caveat: the lab already saw that the five-session versions built slowly with the horizon;
  the 60-session horizon and the 12-month hold are set by the literature (one-to-three-year drifts), not tuned on
  those results, and the grid is round values only. Why large caps: Fama and French (2008) report that the net-issues
  anomaly is pervasive across size groups including big stocks, unlike most other anomalies, so LIQ-500 is not the
  hopeless universe it was for the short-horizon cards. Expected size: a net-issuance spread of a few percent a
  year in big stocks gives roughly 0.4-0.8 % per side-adjusted event over 60 sessions; K-0109 put the placebo bar
  of a monthly sort with a quarter horizon near 0.46 %, so the mechanism test is a real test but could end in ''cannot
  tell''. Using new entries (not all quintile members) as events keeps the same-stock placebo from absorbing a persistent
  repurchaser state (the H-0059 trap); the price is fewer events (expected roughly 5-15 per side per month, about
  3000 events on about 270 dates). Beta caveat (K-0074): repurchasers are lower-beta and issuers higher-beta than
  the peers, so in rising markets the raw side-adjusted return is biased against both sides; the test is conservative
  in the dev bull years. Strategy arithmetic: always invested (exposure about 1), about 270 monthly decision dates,
  each month a new cohort of about 100 names replaces the oldest, and because repurchase status is persistent the
  monthly one-way turnover should be well under 10 % of the book, so costs (3-6 bps half-spread tiers) are small
  and doubled costs should not matter. The benchmark is SPY total return: an equal-weight book of value-like repurchasers
  needs Sharpe about SPY + 0.10; my estimate is a book Sharpe 0.1-0.2 above SPY in dev, so the margin is thin, and
  the G2 random-entry null (equal-weight random liquid stocks) is the real test of the selection. The book holds
  only the long side; if the mechanism passes but the book fails the random-entry null, the effect lives in the
  issuer (short) side. Most likely deaths: placebo bar (sparse monthly dates), the latest third (growth-led 2014-2020
  markets and post-publication decay), or the publication-decay check from 2008. No forward data for stocks, so
  G4 is the ceiling. RAM: two SF1 fields.'
