id: H-0197
version: 1
title: Last quarter's earnings reaction priced at the next release - LIQ-500 dollar-neutral, long/short by previous
  8-K reaction, 5 sessions around the predicted release
author_agent: scout
family: post-earnings-announcement-drift
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Investors and analysts who anchor next-quarter expectations on a naive (random-walk) earnings model
    after a surprise and are surprised again in the same direction; holders of last quarter's losers who still expect
    mean reversion; and option and event-driven traders who take the release-session move as unpredictable.
  why: 'Bernard and Thomas (1990): investors treat each quarter''s earnings news as if it carried no information
    about the next quarter, although seasonal earnings changes are positively autocorrelated over the next quarters.
    The under-reaction is corrected mostly when the next earnings are actually announced: a predictable part of
    the next release''s surprise is still in the price, so the release-window return of last quarter''s good-news
    stocks is higher than that of last quarter''s bad-news stocks. Chan, Jegadeesh and Lakonishok (1996) find the
    same concentration of momentum returns around subsequent announcements. The lab''s own record agrees on two
    points: the only events that cleared the same-stock placebo on real 8-K dates were own-price reactions at the
    release (K-0083), and held for a whole quarter the reaction effect is identity, not timing (K-0185). This card
    asks the remaining timing question: does last quarter''s reaction pay when, and only when, the next release
    arrives? It concentrates the bet on the few sessions where the predictable surprise is resolved instead of holding
    the drift for a quarter.'
  why_not_arbitraged: 'The trade is a concentrated bet on earnings-day jumps: idiosyncratic variance in the window
    is several times normal-day variance, so a desk must spread it over many small positions and accept a book that
    is active only in the earnings seasons; release dates are only predicted (from last year''s date), so part of
    the window misses; and the short leg holds stocks that already fell, with squeeze and borrow risk around the
    event.'
signal:
  description: 'Inputs (point-in-time, all known at the close of the decision session t): LIQ-500 membership and
    tradability, daily total returns from ret_co (previous close to open) and ret_oc (open to close), and the sec_8k_item202
    flag ea_reaction_day. (1) Releases: a session R with ea_reaction_day = 1 is a release of the stock; a flagged
    session within 20 sessions after an earlier flagged session of the same stock is ignored (pre-announcements
    and repeat filings), so each quarter has at most one release. (2) Reaction of a release R: the stock''s two-session
    close-to-close return over sessions R and R+1 minus the equal-weight average return of the LIQ-500 members over
    the same two sessions, divided by sqrt(2) times the standard deviation of the stock''s daily market-adjusted
    return over the 60 sessions ending at session R-2 (at least 40 valid returns, else no reaction value). The reaction
    is known at the close of R+1. (3) Reference distribution: all reaction values of LIQ-500 members whose release
    session R+1 fell in the 252 sessions up to and including t (at least 200 values, else no events on t); lo_t
    and hi_t are its leg_fraction and 1 - leg_fraction quantiles. (4) Predicted next release: for every past release
    L of the stock, its anniversary A(L) is the first XNYS session on or after the calendar date of L plus 364 days.
    (5) Event on session t for stock j: j is a LIQ-500 member and tradable at t; some anniversary A(L) of j is exactly
    the second session after t (A(L) = t+2); j has no release in the 30 sessions up to and including t (the current
    release has not already happened early); j''s most recent release Rprev lies between 40 and 120 sessions before
    t (it is last quarter''s release); and the reaction of Rprev is >= hi_t (long, side +1) or <= lo_t (short, side
    -1). (6) Trading: an event on t enters at the open of t+1 (the session before the predicted release) and is
    held for hold_days sessions, exiting at the open of session t+1+hold_days whether or not the release came. A
    stock with a new event while already held keeps one position (the hold restarts). If a stock leaves LIQ-500
    or becomes untradable during the hold, the position is closed when the framework forces it. (7) Weights, recomputed
    every session from the set of open positions: each long position gets min(0.5 / n_long, 0.05), each short position
    gets -min(0.5 / n_short, 0.05), where n_long, n_short are the numbers of open long and short positions; the
    net (sum of longs + sum of shorts) is offset by an equal-weight basket of all other LIQ-500 members that are
    tradable and not in either leg, with weight -net spread equally, so the book is dollar-neutral and gross is
    at most 1. With no open position the book is in cash. Missing return data on a session make the stock ineligible
    for new events on that session; no forward-filled prices.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 8
      value: 5
    leg_fraction:
      grid:
      - 0.15
      - 0.25
      - 0.35
      value: 0.25
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: Stock j's predicted next earnings release (the first session on or after last year's 8-K Item 2.02 reaction
    date plus 364 days) is two sessions after the close of day t, j has not released in the last 30 sessions, and
    its previous release (40-120 sessions back) had a standardized two-session market-adjusted reaction in the top
    leg_fraction (side +1) or bottom leg_fraction (side -1) of all LIQ-500 reactions of the trailing 252 sessions.
    Both sides are marked, so persistent winners in the long side are offset by persistent losers in the short side.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
