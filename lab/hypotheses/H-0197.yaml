falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the events is not above the 95th percentile of the
  200 time-shifted placebos (the same stocks off their release window earn as much, so last quarter''s reaction
  carries no release-timing content).'
- 'Mechanism: gross abnormal return per event at 5 sessions is below the round-trip cost of trading it.'
- 'Mechanism: the latest third of dev (by event date) has the opposite sign or less than a third of the pooled average
  (decay reading, K-0060).'
- 'Mechanism shape: if the 1-session horizon (entry session, before the predicted release) is as large as the 3-
  and 5-session horizons, or the 10- and 21-session horizons keep growing at the same rate, the effect is pre-release
  or slow drift, not resolution at the release; the card counts as refuted even if the 5-session test passes.'
- 'Strategy: net Sharpe on dev below 0.5 or below the T-bill Sharpe + 0.10, or the bootstrap bound of the Sharpe
  difference below zero.'
- 'Robustness: fewer than 75 % of the leg_fraction / hold_days neighbors (0.15, 0.35; 3, 8) beat T-bills, or the
  strategy falls below T-bills at 2x costs.'
notes: 'Why this is not a near-copy. H-0028/H-0031/H-0033 trade the five sessions right after a reaction (front
  end); H-0136 held reactors release to release and lost to same-stock placebos (identity); H-0023 traded the predicted
  window without conditioning on news (date-only premium, inside the placebo cloud); H-0032 and H-0093 sorted slow
  fundamentals (composite, earnings seasonality) in the window and stayed below cost; H-0064 sorted the 3-session
  pre-window return (short-term reversal). This card sorts on last quarter''s own-price reaction, the one input
  that cleared the placebo on release dates, and trades it only at the next release, which is exactly where Bernard-Thomas
  locate the correction. Family is post-earnings-announcement-drift on purpose: it is the same under-reaction to
  earnings news, so the trials should count together even though the family is heavy. Expected magnitudes, stated
  in advance (K-0120 says Scout forecasts run high, so read these as upper central values): about 500 releases per
  year per side at leg_fraction 0.25 once the 364-day rule has a year of history (events from about the second dev
  year), roughly 7 000-8 000 events over dev on several hundred dates; side- adjusted gross per event 0.2-0.4 %
  at 5 sessions against a round trip of about 6-12 bps in LIQ-500 (half-spread tiers 3/6 bps), so gross should clear
  cost by 2x or more if the effect exists at a third of the published size. Book: about 15-25 open positions per
  side in peak season, far fewer between seasons; mean gross about 0.4-0.6, so above the 20 % exposure floor; expected
  net Sharpe 0.5-0.8 if per-event gross is 0.3 %, dead below about 0.2 %. Known weaknesses the gates will see: the
  predicted date misses some releases (calendar shifts, the dataset''s CIK gaps), which dilutes the window, and
  its hit rate is not reported by G1 (K-0036); the reaction is measured against raw LIQ-500 peers, and both legs
  are earnings-window stocks, so the beta gap of K-0074 is smaller than in one-sided cards but not removed; the
  hedge basket only absorbs the net, so a quiet season with one leg empty is a single-sided bet hedged by the market.
  The predicted window needs one year of releases, so the first dev year has no events. No date literals or names
  are needed by the code; the period in the data requirements starts at the first row of sec_8k_item202 (K-0091).'
