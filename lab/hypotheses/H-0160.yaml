falsification_criteria:
- 'Mechanism: the side-adjusted 5-session return of TLT/IEF minus the SHY/SHV/BIL mean on event dates is not above
  the 95th percentile of the 200 time-shifted placebos, or its gross is below the round-trip cost of TLT/IEF.'
- 'Mechanism: the latest third of the dev period is wrong-signed (decay or regime reading, K-0060), even if the
  pooled average passes.'
- 'Mechanism shape: the 10-session effect is below half of the 5-session effect AND the 1-session effect is above
  it (a one-day flow bounce, not a slow aggregation by the rate market).'
- 'Strategy: net Sharpe on dev below 0.5 or below T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Robustness: fewer than 75 % of the z_entry / norm_weeks neighbors (0.25, 0.75; 26, 60) beat T-bills, or Sharpe
  at 2x costs no longer beats T-bills.'
- 'Control (owner diagnostic, not run by the judge): the same rule driven by the plain LIQ-500 equal-weight market
  return of the week instead of the announcer-minus-market reaction is as good; then the signal is the stock-bond
  lead-lag the market_relations scan already rejected, not earnings news.'
notes: 'Brief fit: short horizon (5 sessions), cross-asset (signal from the US single-stock earnings cross-section,
  trades in Treasury ETFs), mechanism test declared. Why this is not a retry. (1) The information source is new
  to the lab: no card has used the aggregate of announcer-specific release reactions as a macro signal; the 8-K
  cards (H-0023..H-0136) all traded the announcing stocks themselves. (2) It is not the stock-bond lead-lag that
  the market_relations scan and study 7 killed: the signal nets out the same-day return of non-announcing stocks,
  so a plain SPY or market move does not enter it; the owner control in the falsification list separates the two.
  (3) It is not rebalancing-flow-pressure or stress rebound: the event is an earnings-season information state,
  both sides are marked, and market-wide moves are removed. Family is new (aggregate-earnings-macro-news); it shares
  the dispersed-news idea with oil-shock-equity-underreaction but runs the opposite way (micro news into a macro
  price) and on a different signal, so it is not a renaming of that family; the Chair may merge it if he reads it
  otherwise. Forecasts (K-0120, K-0181: pessimistic first). Qualifying weeks: about 15-22 a year (weeks 2-7 after
  each quarter end); z needs 20 earlier qualifying weeks, so events start about a year after the view start (2008-06),
  leaving about 12.5 years. Event dates with |z| >= 0.5: about 110-170 (roughly 60 % of qualifying weeks); marked
  events 2 per date, 220-340. If the count lands under 200, the z_entry 0.25 neighbor has about a third more. Three
  unmarked peers exist on every event date (BIL lists 2007-05-30), so G0 and G1 counts should agree (K-0174). Round
  trip: the daily-ETF tier, about 10 bps (K-0181), on TLT and IEF. Gross per event: pessimistic 0-5 bps (rates already
  price the news within the week), central 15-20 bps (about 1-1.5 bps of further 10-year yield move in the next
  week on the average TLT/IEF duration), optimistic 30-40 bps. Placebo cloud: TLT/IEF minus cash has about 1.5 %
  5-session volatility; with about 140 independent dates the 95th-percentile bar sits near 20 bps above the placebo
  mean, so only the central-to-optimistic case passes, and the bar is above cost (a miss in the central case is
  a ''cannot tell'', K-0034). Book arithmetic: invested about 15 weeks a year at gross 1.0, mean exposure about
  0.25-0.3 (floor 0.2; z_entry 0.75 drops near the floor). At 20 bps gross and about 8 bps cost per invested week
  the net is about 1.5-2 %/yr on about 5-6 % annual volatility, Sharpe about 0.3-0.4: the book most likely dies
  on the absolute T-bill Sharpe floor of 0.5 even if the mechanism passes; a pass needs the optimistic case. Both
  legs trade the same duration bet, so there is no short-leg drag of the K-0172 kind, but the event study reports
  no side split: if the effect comes only from the long-duration (weak-news) side it may be flight-to-quality, not
  aggregation. Point-in-time: ea_reaction_day is known at the close of its session; sigma_j uses data to d-1; the
  weekly decision uses closes up to t; trades at the open of t+1. LIQ-500 membership is the dataset''s point-in-time
  rank, no column subset is chosen with future information (K-0134). The SEP and 8-K data are signal-only: if the
  loader cannot attach them to an instruments universe, the Builder should report it rather than proxy the signal.
  No forward data for SEP, so the card can pass at most G4.'
