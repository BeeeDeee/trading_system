id: H-0160
version: 1
title: Aggregate earnings news into Treasuries - in earnings-season weeks, short TLT/IEF after strongly positive
  LIQ-500 8-K reactions net of market, long after negative, hold 5 days
author_agent: scout
family: aggregate-earnings-macro-news
asset_classes:
- us_etf
universe:
  instruments:
  - TLT
  - IEF
  - SHY
  - SHV
  - BIL
  kind: instruments
mechanism:
  counterparty: 'Treasury investors who update on official macro releases and Fed communication rather than on the
    cross-section of company reactions: price-insensitive holders (index and liability-driven funds, banks, foreign
    official accounts) and rate traders whose models take macro data, not micro earnings, as inputs. They hold duration
    a week too long into rising-yield news and sell it a week too late into falling-yield news.'
  why: News about aggregate corporate profitability arrives dispersed over several hundred earnings releases each
    reporting season. Each release is priced into its own stock within a session, but its macro content (stronger
    aggregate earnings mean stronger activity, higher future inflation and a tighter expected policy path) has to
    be aggregated across the cross-section before it reaches rates. Kothari, Lewellen and Warner (2006) show aggregate
    earnings surprises move with discount-rate news rather than with stock prices, and Gallo, Hann and Li (2016)
    show aggregate earnings surprises carry news about future Fed policy and relate positively to short and long
    Treasury yield changes, with less than half of the market effect in the immediate window. If the Treasury market
    completes this aggregation with a lag, a week of strongly positive announcer-specific reactions is followed
    by further yield increases (duration ETFs underperform cash-like ETFs) over the next week, and a week of strongly
    negative reactions by further yield declines.
  why_not_arbitraged: The signal exists only in earnings-season weeks, must be rebuilt from hundreds of stock reactions
    net of the market (costly aggregation, not on any terminal screen as a rate input), and is small next to rate
    volatility, so a macro desk earns a low Sharpe per bet and faces large drawdowns from unrelated rate news; dedicated
    capital is limited and the bet cannot be levered without that rate risk.
signal:
  description: 'Inputs. Stocks: sharadar_sep members of the point-in-time LIQ-500 on each session (extras liq_rank
    <= 500), total returns ret_co and ret_oc, and the sec_8k_item202 flag ea_reaction_day (NaN treated as 0). ETFs:
    TLT, IEF (traded), SHY, SHV, BIL (never traded; cash-like peers for the event study). Step 1 (daily, after the
    close of session d). For every LIQ-500 member j, close-to-close total return R_jd = (1 + ret_co_jd) * (1 + ret_oc_jd)
    - 1. Market return M_d = equal-weight mean of R_jd over LIQ-500 members WITHOUT a release on d (ea_reaction_day
    == 0) with a valid return. For each member with ea_reaction_day == 1 on d, the announcer reaction is s_jd =
    (R_jd - M_d) / sigma_j, where sigma_j is the standard deviation of R_j - M over the 63 sessions ending at d-1
    (at least 40 valid values, else the announcer is skipped), winsorized to [-5, +5]. Step 2 (weekly, after the
    close of the last XNYS session of each calendar week, t). A_t = mean of s_jd over all announcer-sessions since
    the previous weekly decision (the sessions of the week); N_t = their count. The week qualifies only if N_t >=
    25 (an earnings-season week). For a qualifying week, z_t = (A_t - mean of A over the previous norm_weeks qualifying
    weeks) / (std of those values); at least 20 previous qualifying weeks are required, else no signal. Step 3 (book).
    If z_t >= z_entry (strongly positive aggregate earnings news: yields expected to keep rising): weights TLT -0.5,
    IEF -0.5. If z_t <= -z_entry: TLT +0.5, IEF +0.5. Otherwise, or in a non-qualifying week, or if TLT or IEF has
    no bar on t: flat (cash). Positions are taken at the open of the next session and held until the next weekly
    decision replaces them (about 5 sessions); no other trades. Gross exposure is 1.0 when invested, never more.'
  params:
    norm_weeks:
      grid:
      - 26
      - 40
      - 60
      value: 40
    z_entry:
      grid:
      - 0.25
      - 0.5
      - 0.75
      value: 0.5
  timeframes:
  - 1d
  - 1w
mechanism_test:
  event: At a qualifying weekly decision date t (at least 25 LIQ-500 earnings-release reactions in the week, z_t
    available) with |z_t| >= z_entry, TLT and IEF are marked with side = -sign(z_t) (they should underperform after
    strongly positive announcer-specific aggregate earnings news and outperform after strongly negative news). SHY,
    SHV and BIL are never marked and serve as the cash-like peers. Return measured from the open of t+1.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
