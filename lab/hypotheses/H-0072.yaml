mechanism:
  counterparty: Mortgage duration hedgers who must trade with the move regardless of price because their mandate
    is a duration or hedge-ratio target, not a view (servicers protecting MSR values, retained portfolios, index-tracking
    MBS funds). They pay a concession to whoever supplies or takes duration ahead of their rebalancing; the strategy
    stands in front of the lagged part of that flow.
  why: US fixed-rate mortgages carry a prepayment option, so the duration of mortgage-backed securities falls when
    long rates fall (refinancing rises) and extends when rates rise. Holders that manage duration against a target
    (mortgage servicers hedging MSRs, GSE retained portfolios, MBS total-return funds and banks) must buy duration
    (Treasuries in the 7-10 year sector, receive-fixed swaps) after rates fall and sell it after rates rise. That
    hedging flow is in the direction of the move and is executed over the following days as hedge ratios are re-estimated
    and rebalanced against tolerance bands, so a large move in the 10-year sector should continue for several sessions.
    The amount of duration that has to be re-hedged per basis point (the negative convexity of the mortgage universe)
    is largest when a big share of outstanding mortgages sits near the refinancing threshold, i.e. when rates are
    close to the levels at which the most recent vintages were originated. A 10-year yield near its trailing one-year
    low is the proxy for that near-the-money state; far above the low the recent vintages are out of the money,
    duration is already extended and little re-hedging is forced. Hanson (2014) models MBS duration shocks as supply
    shocks to interest-rate risk that amplify yield moves; Perli and Sack (2003) estimate that mortgage hedging
    amplifies long-rate moves by roughly a fifth to a third.
  why_not_arbitraged: The flow is large relative to dealer balance sheets (post-2008 leverage and supplementary
    leverage constraints limit how much duration dealers warehouse), the exact hedge timing and size are not observable,
    the state is only known through noisy proxies, and taking the other side means holding outright duration risk
    through volatile, news-heavy sessions. The effect is a few basis points of yield, too small and too risky for
    most relative-value capital at scale, but it does not need leverage to show in a 7-10 year Treasury ETF.
signal:
  description: 'Inputs: IEF daily total returns from sharadar_sfp (close-to-close return of session t = (1 + ret_co(t))
    * (1 + ret_oc(t)) - 1, ret_co being the prior close to open of t, ret_oc open to close of t); FRED DGS10 (10-year
    constant-maturity Treasury yield, percent) from fred_macro, used only through the dataset''s next_morning clock,
    i.e. at the close of session t the latest usable value is the one the alignment delivers for t (in practice
    the observation of t-1). Computation after the close of each XNYS session t: (1) sd63(t) = standard deviation
    of IEF close-to-close returns over sessions t-63..t-1 (session t excluded), needing at least 50 valid returns,
    otherwise no event on t. (2) Convexity state: y = latest usable DGS10 value (forward-filled over at most 5 missing
    observations, otherwise state off); ymin = minimum of the last 252 usable DGS10 observations up to and including
    y (needs at least 200 valid observations, otherwise state off). State is ON when y - ymin <= band_pp (percentage
    points). (3) Event on t: state ON and |r_IEF(t)| >= k * sd63(t). side = sign(r_IEF(t)) (+1 after a rally, i.e.
    yields fell; -1 after a selloff, i.e. yields rose). Book: on an event at t the target weight of IEF becomes
    side * 1.0 (gross 1, no leverage), traded at the open of t+1, and is held for hold_days open-to-open steps,
    i.e. closed at the open of session t+1+hold_days. If a new event fires while a position is open, the target
    is set to the new event''s side (no trade if the side is unchanged) and the exit is reset to hold_days steps
    after the new event''s entry. Without an open position the book is flat and the capital earns the T-bill rate
    through the engine''s cash. SHY, SHV and BIL are never held: they are in the universe only as unmarked near-cash
    peers for the event study. No other instrument is traded. A missing IEF bar on t means no event on t; a missing
    IEF bar on a scheduled exit day moves the exit to the next session with a bar. Decisions at most once a day,
    after the close, using data up to that close.'
  params:
    band_pp:
      grid:
      - 0.5
      - 0.75
      - 1.0
      value: 0.75
    hold_days:
      grid:
      - 3
      - 5
      - 7
      value: 5
    k:
      grid:
      - 1.0
      - 1.25
      - 1.5
      value: 1.25
  selection_procedure: 'Primary values fixed before any data: k = 1.25 standard deviations (a clearly large but
    not rare day, so the event count clears the G1 minimum), band 0.75 pp (roughly the width of one refinancing
    wave''s origination range), hold 5 sessions (the days-to-weeks hedge rebalancing horizon of the mechanism and
    the brief''s 1-5 session range). Grids are one round step either side; no value was chosen from results.'
  timeframes:
  - 1d
mechanism_test:
  event: Session t on which IEF's close-to-close total return is at least k = 1.25 times its trailing 63-session
    standard deviation in absolute value while the latest usable FRED DGS10 value is within band_pp = 0.75 percentage
    points of its trailing 252-observation minimum (convexity state ON, exactly as in the signal). IEF is marked
    with side = sign of its session-t return (+1 after a rally, -1 after a selloff); SHY, SHV and BIL are never
    marked and serve as the near-cash peers, so the abnormal return is IEF's side-adjusted move against cash-like
    funds and the placebo mean should sit near zero because both sides are marked.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
