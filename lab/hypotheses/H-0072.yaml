falsification_criteria:
- 'Mechanism: the 5-session side-adjusted abnormal return of IEF against the near-cash peers is not above the 95th
  percentile of the time-shifted placebos, or gross per event is below the round-trip cost of IEF: no lagged hedging
  flow is visible.'
- 'Mechanism: the latest third of the dev event set has a negative mean side-adjusted return (decay or the hedging
  channel no longer works after the GSE portfolio run-off and Fed MBS holdings).'
- 'Mechanism shape: the descriptive 1- and 3-session side-adjusted returns are both zero or negative, i.e. nothing
  continues within the first days; a gain only at 10 sessions would be generic bond trend, not re-hedging flow.'
- 'Strategy: net Sharpe on dev below the T-bill bar of 0.5, or the bootstrap bound of the Sharpe difference to T-bills
  not above zero.'
- 'Robustness: fewer than 75 % of the parameter neighbours (k 1.0/1.5, band_pp 0.5/1.0, hold_days 3/7) clear the
  T-bill bar, or doubled costs remove it.'
- 'Publication / era: Sharpe excess after 2014 (Hanson) is less than half of the excess before.'
notes: 'Brief fit: holding 5 sessions, cross-asset in the sense that the state comes from the mortgage market''s
  position relative to the refinancing threshold (proxied by a FRED yield series against its own one-year history)
  and the trade is in the Treasury market that absorbs the hedging flow. It is the closest fit with a mandated-flow
  counterparty I could find: the lab''s diffusion and lead-lag claims across markets are dead (K-0080, mrel), stress
  rebounds are the same evidence again (K-0084), and the macro-calendar family is exhausted (K-0070). No direct
  MBS-duration series is free and daily, so the near-the-money state is a proxy; a free daily mortgage rate exists
  only from 2017, too short. Timing: the event trigger uses IEF''s own close-to-close return (clock us_close), never
  DGS10 of the same day, because fred_macro is next_morning; DGS10 only feeds the slow state, so its one-day lag
  is harmless. Why this is not a refile: no lab card has traded Treasury duration on its own moves. H-0047 (post-macro-release
  drift across 19 ETFs) found a reversal of extreme reactions and H-0041 / K-0084 a weak stress rebound; this card
  claims continuation only in the convexity state and for the 7-10 year sector, a conditional claim with a different
  counterparty. If the event set shows the generic reversal instead, that is an informative death: convexity hedging
  is not visible in daily Treasury ETFs after 2007. The trend family of studies 2 and 10 is a 3-12 month signal;
  this is a 5-session response to a single large day. Expected counts: with three near-cash peers only from 2007-06
  (BIL) the event study can use about 2007-2020; roughly 20-30 events a year, one marked instrument per date, so
  about 300-400 events on as many dates (stated separately as asked by K-0069: events = event dates here). If the
  judge needs only fewer peers, more dates count. The strategy itself can trade from about 2003 (IEF from 2002-07,
  DGS10 one-year warm-up; if K-0075 holds, the warm-up starts at the card''s first price date, so first signals
  around 2003-08). Expected strategy: if 1-2 bp of the amplification arrives after the event day, IEF (duration
  about 7.5) gains roughly 8-15 bp per 5-session event, 25 events a year, about 2-4 % a year gross on a book with
  about 4-5 % volatility (exposure 35-45 %), less about 0.5-1 % a year of costs: Sharpe excess about 0.3-0.8, so
  the 0.5 bar is in reach only if the effect is at the upper half of that range. Known risks: the main hedgers (GSE
  retained portfolios) shrank after 2008 and the Fed held a large unhedged MBS share from 2009, so the mechanism
  is probably weaker in dev than in the papers'' samples (latest-third kill condition stated); short IEF carries
  no modelled borrow fee (general collateral, cheap); macro-release days are among the events. Diagnostics wanted
  if the gate output allows: the same events with the state filter off (control: does the convexity state change
  the sign or size?), by side (rally vs selloff), by third.'
