falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of run-up entries at 3 sessions is not above the 95th percentile
  of the time-shifted placebos, or its gross per event is below the round-trip cost of the country ETF.'
- 'Mechanism shape: the horizon-1 abnormal return (US hours of d+1 only, before any home pre-holiday session) is
  as large as the horizon-3 one; then the gain is not earned in the home market''s pre-closure sessions and the
  pre-holiday reading is wrong.'
- 'Mechanism decay: the latest third of dev is wrong-signed (K-0060), i.e. the published effect is gone in these
  markets.'
- 'Strategy: net Sharpe on dev below the 60/40 SPY/IEF benchmark + 0.10, or the bootstrap bound of the Sharpe difference
  below zero.'
- 'Costs: with doubled costs the Sharpe does not beat 60/40 (the tilt pays a country-ETF round trip on every event).'
- 'Robustness: fewer than 75 % of the neighbors (pre_sessions 1 and 3, tilt_weight 0.15 and 0.35) beat 60/40, or
  one third of dev carries over 60 % of the log excess.'
notes: 'Brief fit: the brief asks for cross-asset (signal in one market, trade in another), 1-5 days. Here the signal
  is a foreign exchange''s holiday schedule and the pre-closure flow in that home market, and the trade is in the
  US wrapper and SPY, held 1-3 open-to-open steps. It is not a FRED-to-ETF signal: the macro-calendar, rate, credit,
  oil, VIX and stress-rebound routes on daily ETFs are heavily used and low-prior in knowledge.md (K-0070, K-0084,
  K-0180, K-0206, K-0208), and TradFi-into-crypto has K-0179 against it, so this is the closest fit with a documented
  mechanism that the lab has not tested. New family, no earlier card: pre-holiday returns are a calendar/flow effect
  of the home market, not wrapper mispricing. Relation to H-0133 / H-0161 (etf-premium-arbitrage, home-closure fade):
  same closure dates, but the windows do not overlap. Those cards trade from the US open after the closure night
  has started (wrapper unanchored while home is shut); this card exits at the US open of the session before the
  closure night, holds no position while the home market is closed and uses no return condition. If the Librarian
  considers the closure dates shared evidence, the trial should still count here, since the claim is different.
  Why a new dataset (essential): to enter at the US open of d+1 the strategy must know at the close of d that the
  home market closes after d+2 or d+3. exchange_holidays_1d only carries closed_next for the night after d, so using
  its value two or three rows ahead would be look-ahead in G0''s truncation test, although the schedules were public
  months ahead. exchange_holidays_ahead_1d is the same library calendar seen forward, a cheap derived build for
  the Archivist. Instruments: the seven iShares MSCI Asia-Pacific single-country ETFs that existed before the dev
  start (2002-08-01, set by IEF''s first price 2002-07-30). Chosen by listing date and liquidity, not by performance.
  The younger and thinner funds (THD, EIDO, EPHE, ENZL, India ETFs) are left out because their round trip would
  probably exceed the effect. Mechanism-test horizon: the judge measures from the next open to the close of t+h.
  h = 1 holds only US hours of d+1 (no home session yet) and is the built-in control, expected about zero. h = 2
  adds the second-to-last home session, h = 3 the last one. h = 3 also includes US hours of d+3, when home is closed
  next (noise, no expected sign). The book exits at the open of d+3, so it holds about 2 days (holding_period 2).
  Forecasts (K-0098, K-0120, K-0125): closure starts per year that are not shared region-wide, roughly Japan 10,
  Hong Kong 9, Korea 8, Malaysia 9, Singapore 7, Taiwan 6, Australia 4, about 45-55 a year. Over 18.4 dev years
  that is about 800-1000 run-up entries on about 600-800 dates, spread across the year (Lunar New Year clusters
  several markets on few dates). Mean exposure is 1.0 (always-invested core), decision dates with turnover about
  45-55 a year, and every tilt is one position entry. Costs: I have not seen the ETF tier table; I assume about
  4-8 bps a side for these funds (EWM and EWS thinnest) and 1-3 bps for SPY, so 12-20 bps round trip per event on
  the tilted 25 %. Expected annual gain against 60/40: about 50 events x 0.25 x e, where e is the ETF-minus-SPY
  gain over the two-session window. Central e = 30 bps gives about 3.7 %/yr gross tilt return minus about 2.0 %/yr
  costs, net +1.5-2 %/yr. That adds about 3 %/yr of mostly uncorrelated tracking volatility, so the Sharpe excess
  is about +0.10-0.15, right at the G1 bar. Pessimistic e = 15 bps: net about zero or negative, dies at G1. Optimistic
  e = 50 bps: clears G1 and costs x2. The mechanism test can pass while the book fails; that would still be a clean
  answer to whether the pre-holiday premium exists in these markets after 2002. Most likely death: decay. The effect
  was published 1988-1994 and the lab''s short-horizon calendar effects are weakest in the latest third (K-0060),
  so I expect the mechanism test to fail on the latest third or on gross per event below cost. Next most likely:
  G1 Sharpe excess under +0.10 because costs take most of a thin gain. No date literals; the holiday dates come
  only from the dataset.'
