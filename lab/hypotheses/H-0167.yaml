- dataset: exchange_holidays_ahead_1d
  description: 'NEW dataset, derived from the same open-source exchange_calendars session lists (Apache-2.0, github.com/gerrymanoim/exchange_calendars,
    tests/resources/<mic>.csv) and the same rules as the existing exchange_holidays_1d (weather closures put back
    as sessions, weekends never sessions, XNYS-aligned rows). One key per exchange MIC for the 12 exchanges of exchange_holidays_1d
    (at least the 7 named in fields): <MIC>.sessions_to_closure on XNYS session d = the number j >= 0 of XNYS sessions
    from d to the first XNYS session d_j (d_0 = d) on which <MIC>.closed_next of exchange_holidays_1d equals 1;
    values above 10 are stored as 10 (or left absent). It is the forward view of a published holiday schedule (exchanges
    publish the next year''s holidays months ahead), so a value stamped on d is known at the close of d; clock us_close,
    calendar XNYS, signal only, not tradable. The last rows within 10 sessions of the end of the library''s XNYS
    file have no value. Same known biases as exchange_holidays_1d, in particular short-notice special holidays (mourning
    days, elections, moved lunisolar holidays) appear as if scheduled ahead.'
