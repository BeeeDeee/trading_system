id: H-0167
version: 1
title: Asia-Pacific pre-holiday run-up via US country ETFs - 60/40 core, part of SPY moved into the ETF over its
  home market's last two sessions before a scheduled closure
author_agent: scout
family: pre-holiday-effect
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - EWJ
  - EWH
  - EWY
  - EWT
  - EWS
  - EWM
  - EWA
  kind: instruments
mechanism:
  counterparty: Home-market short sellers, market makers and hedgers who flatten short or inventory positions before
    a closure they cannot trade through, and pay a premium for immediacy to do so; plus the retail-buying pressure
    documented before holidays. The tilt buys the wrapper before that demand arrives and sells into it at the next
    US open.
  why: 'Stock markets earn abnormally high returns in the last session(s) before an exchange holiday (Lakonishok
    and Smidt 1988; Ariel 1990). Kim and Park (1994) show the effect also in Japan and the UK on their own holiday
    calendars, independent of the US one. The usual explanation is a flow imbalance before a closure: short sellers
    and liquidity providers do not want an open short or inventory position over a period when they cannot trade
    or hedge, so they cover before the holiday, and small investors buy while institutional sellers stay away. In
    Asia-Pacific markets the holiday calendar is local (Lunar New Year, Golden Week, Chuseok, Deepavali, national
    days) and is not the US one. A US-listed country ETF (iShares MSCI Japan, Hong Kong, Korea, Taiwan, Singapore,
    Malaysia, Australia) prices the home session overnight: the home market''s session on local date D happens while
    the US is closed, before the US open of D. So a position from the US open of session d+1 to the US open of session
    d+2 holds exactly the home sessions of local dates in (d+1, d+2]. The signal comes from another market (the
    home exchange''s schedule and its pre-closure order flow), the trade is in the US wrapper, and the whole window
    ends at the US open before the home market''s closure night, so the wrapper is never held while its underlying
    is shut.'
  why_not_arbitraged: The premium per event is small (tens of basis points) and occurs on a different calendar for
    each market, so a single-market arbitrageur gets few events a year with full country risk; harvesting it through
    US wrappers costs a round trip per event, and in the home market it requires local access during the holiday
    run-up when the same inventory constraint that causes the effect binds on the arbitrageur too.
signal:
  description: 'Inputs: total returns (ret_co, ret_oc) of the nine ETFs from sharadar_sfp; for each country ETF
    the key <MIC>.sessions_to_closure of its home exchange from the requested dataset exchange_holidays_ahead_1d
    (EWJ=XTKS, EWH=XHKG, EWY=XKRX, EWT=XTAI, EWS=XSES, EWM=XKLS, EWA=XASX). k_j(d) = sessions_to_closure of ETF
    j''s home exchange stamped on XNYS session d: the number of XNYS sessions from d to the first XNYS session d''
    >= d whose closed_next flag (exchange_holidays_1d definition) is 1, i.e. the closure night of the home market
    starts after XNYS session d_k (d_0 = d, d_1 = next session, ...). It comes from the published holiday schedule.
    Decision after the close of each XNYS session d, using data up to that close; trades at the open of d+1; target
    weights apply to the open-to-open step d+1 -> d+2. (1) Eligible country ETF: has a price bar on d and at least
    20 earlier bars, is tradable, and k_j(d) is not missing. (2) ETF j is marked for the step when 2 <= k_j(d) <=
    pre_sessions + 1: the step then contains one of its home market''s last pre_sessions regular sessions before
    a scheduled closure (k = 2 is the last one, k = 3 the one before). (3) Common-closure exclusion: if more than
    half of the eligible country ETFs have the same k(d) value as j on d (a closure that starts the same night in
    most of the region, e.g. Christmas), j is not marked. (4) Weights: n = number of marked ETFs; each marked ETF
    gets w = min(tilt_weight, 0.6 / n); SPY = 0.6 - n*w; IEF = 0.4; unmarked country ETFs 0. On days with no marked
    ETF the book is SPY 0.6 / IEF 0.4. Targets are re-applied every session (the engine trades drift and tilt changes);
    gross is always 1.0, long only. An ETF stays marked over consecutive steps of the same run-up (k = pre_sessions
    + 1 down to 2) without re-trading, and is unmarked from the step whose k is 1 (the closure step) on. A market
    that reopens and closes again within fewer sessions than pre_sessions simply has a shorter run. No other filters,
    no return-based conditions. Missing bars: an ETF without a bar on d is not eligible; IEF and SPY exist over
    the whole period.'
  params:
    pre_sessions:
      grid:
      - 1
      - 2
      - 3
      value: 2
    tilt_weight:
      grid:
      - 0.15
      - 0.25
      - 0.35
      value: 0.25
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of XNYS session d, a country ETF (EWJ, EWH, EWY, EWT, EWS, EWM, EWA) enters its pre-holiday
    run-up: it is marked by rules (1)-(3) of the signal with pre_sessions = 2 on d and was not marked on the previous
    session (entry of the run, normally k(d) = 3, so the window from the open of d+1 holds the home market''s last
    two regular sessions before a scheduled closure). Common-closure nights shared by more than half of the eligible
    country ETFs are excluded. side = +1 (the ETF should beat the other instruments). Peers are the other instruments
    of the universe on the same date.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  primary_horizon_days: 3
