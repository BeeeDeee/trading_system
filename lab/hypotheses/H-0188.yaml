falsification_criteria:
- 'Mechanism: the side-adjusted 21-session abnormal return of the leg assignments is not above the 95th percentile
  of the time-shifted placebos, or gross per event is below the round-trip cost (cost ratio < 1).'
- 'Mechanism: fewer than 2 of the 3 dev blocks are right-signed, or the latest block (about 2016-2020) is wrong-signed
  - the decay kill condition of K-0060; a pass carried only by the 2008-2009 block counts as a failure of the claim.'
- 'Mechanism shape: the 21-session abnormal return is not larger than the 5-session one. The claim is a concession
  released over about a month (H-0030''s slow build); a front-loaded effect means the monthly horizon is the wrong
  design.'
- 'Strategy: net Sharpe on dev below 0.5, or not at least T-bill Sharpe + 0.10, or the bootstrap bound of the difference
  to T-bills below zero.'
- 'Robustness: fewer than 75 % of the leg_quantile x peers_k neighbors beat T-bills, or the book no longer beats
  T-bills at 2x costs.'
- 'Robustness: Sharpe excess after 2014 (the Da-Liu-Schaumburg publication) below half of the excess before it.'
notes: 'BRIEF DEVIATION, stated on purpose. The brief asks for a 1-5 session hold in US single stocks. The lab''s
  own record says that window is exhausted for a taker in LIQ-500 / S&P 500 with the loadable data: K-0024 (large-cap
  short-horizon anomalies vanish), K-0039 / K-0083 / K-0143 (earnings-date and learned earnings cards), K-0094 (non-earnings
  8-K drift), K-0169 (learned conditioners), K-0160, and the cost deaths of H-0030, H-0036, H-0069. The calendar
  windows that are left (tax deadlines, pre-holiday, option expiry) cannot reach the 20 % exposure floor, and the
  stock-split ex-date effect has been reported to disappear after decimalization. So I took the closest fit: same
  asset group, cross-sectional, mechanism test declared, and the shortest horizon at which a mechanism the lab has
  already seen pass can plausibly cover cost. This is the follow-up the H-0030 lesson asked for in its open questions:
  "Does the reversal live at a monthly or slower horizon with much lower turnover? That would be one new trial in
  the same family, argued from the slow build seen here, not tuned." The 21-session horizon is the textbook one-month
  reversal horizon (Jegadeesh 1990; Chan 2003 uses monthly no-news returns), not one picked from H-0030''s descriptive
  horizons, and the formation window is set equal to the hold so there is no extra free parameter. FAMILY: filed
  under short-term-reversal on purpose; its large trial count is the right penalty, and I expect G3 (DSR) to be
  the hardest gate even if everything before it passes. HOW IT DIFFERS from the dead members of the family: not
  weekly (H-0007, H-0029, study 5), not a new conditioner on the five-session sort (H-0030 avoid list), not learned
  (H-0094, H-0099, H-0103, H-0115, H-0117, H-0121, H-0123), and restricted by construction to 2005-2020, when 8-K
  dates exist, so the 1999-2002 era that carried study 5 and H-0007 is not in the sample. S&P 500 members, where
  H-0007 had no edge but where H-0030 passed. CONTROLS: beta-neutral legs answer K-0074 (the raw-peer comparison
  would otherwise partly measure market direction); peer adjustment removes the industry component that continues
  at one month; the formation window is non-overlapping, so each month is a fresh draw and the same-stock placebo
  should be near zero unless the sort just picks persistent high-volatility identities. If the placebo mean is close
  to the event mean, read it as identity, not reversal (K-0025). EXPECTATIONS (modest, K-0120): events about 2 x
  0.2 x 300 eligible names x ~180 month-ends, i.e. roughly 20,000 events on ~180 dates; per-event round trip about
  10-12 bps (tiers 3-6 bps per side, 5 bps floor); I expect a gross abnormal return of roughly 20-40 bps per event
  over 21 sessions, so a cost ratio of about 2-3 if the effect is there. The book is always invested (mean exposure
  near 1, minus forced mid-month exits), rotates nearly fully every month (about 2x gross traded a month, about
  1.5 %/year of cost), and has ~180 decision dates and thousands of entries. The most likely death: the latest third
  is flat or negative (K-0060) or the net Sharpe stays under 0.5 because large-cap reversal is small after 2009;
  second most likely: G3 DSR given the family''s trial count. KNOWN DATA CAVEATS: earnings releases filed only under
  item 7.01/8.01 are missed by sec_8k_item202 and leak into the no-news set (dilutes, does not bias toward a pass);
  companies with no EDGAR coverage (NaN) are excluded. A deleted member is exited by the universe rule mid-month;
  that is a small cash drag, not look-ahead.'
