id: H-0188
version: 1
title: No-news residual reversal at the monthly horizon - S&P 500 beta-neutral, long peer-adjusted 21-session losers
  / short winners that had no 8-K earnings release in the month, monthly rebalance
author_agent: scout
family: short-term-reversal
asset_classes:
- us_equity
universe:
  kind: sp500
mechanism:
  counterparty: Investors whose trades are driven by their own needs rather than by news about the firm - redeeming
    or rebalancing funds, hedgers, levered holders facing margin calls - who demand immediacy in one name and pay
    the concession to whoever holds the other side for a few weeks.
  why: A large one-month move in a stock that is not shared by its closest economic peers and that happened without
    an earnings release is mostly non-informational order flow (a fund liquidating or building a position, an index
    or hedge trade, a margin call). Liquidity providers absorb it only at a price concession and release the inventory
    over the following weeks, so the idiosyncratic part of the move partly reverses over about a month. The industry
    (peer) part of a move carries slowly diffusing news and tends to continue, and moves around earnings releases
    carry firm news and tend to drift, so both dilute the raw one-month reversal (Chan 2003; Da, Liu and Schaumburg
    2014). Removing them should leave a cleaner concession. The lab's H-0030 saw exactly this sort (peer-adjusted,
    no earnings release, S&P 500, 2005-2020) clear the placebo test in all three blocks with an effect that kept
    growing with the horizon, while a five-session hold earned only a fraction of the round trip; a monthly hold
    takes the whole slow build at about a fifth of the turnover.
  why_not_arbitraged: Providing liquidity for weeks in single names ties up balance sheet and carries idiosyncratic
    and crash risk (reversal books lose in liquidity crises when the concession widens before it closes, Nagel 2012);
    the signal rotates nearly the whole book every month, so capacity is limited by trading cost, and short-horizon
    statistical-arbitrage capital is constrained exactly when concessions are largest.
signal:
  description: 'Universe and timing: point-in-time S&P 500 members (universe kind sp500). Decisions after the close
    of the last XNYS session of each calendar month (day t) using data up to that close; trades at the open of the
    first session of the next month (t+1); positions are held until the next month-end decision (about 21 sessions).
    Total returns per session are (1 + ret_co) * (1 + ret_oc) - 1. (1) Eligibility at t: member at t, tradable at
    t, at least 252 sessions of return history, no missing return in the last 21 sessions, and NO earnings news
    in the formation window: ea_reaction_day (sec_8k_item202) must be 0 on every session t-20 .. t; a stock with
    ea_reaction_day = 1 on any of those sessions, or with NaN on any of them (no EDGAR coverage), is not eligible
    this month. (2) Peers at t: for every member with 252 sessions of history, the peers_k other members (any member
    at t, eligible or not) with the highest correlation of daily total returns over sessions t-251 .. t. Recomputed
    every month-end, only from data up to t. (3) Formation (residual) return: R_j = cumulative total return of j
    over sessions t-20 .. t minus the equal- weight mean of the same cumulative return of its peers_k peers. (4)
    Legs: among eligible stocks, rank R_j; long the lowest leg_quantile fraction (losers), short the highest leg_quantile
    fraction (winners); equal weight within each leg. (5) Beta-neutral sizing: beta_j = OLS slope of j''s daily
    total return on the equal-weight mean return of all members over t-251 .. t; leg beta = mean beta of its names,
    floored at 0.3. Long-leg gross w_L = b_S / (b_L + b_S), short-leg gross w_S = b_L / (b_L + b_S), so w_L + w_S
    = 1 (gross 1, no leverage) and w_L * b_L = w_S * b_S. (6) Between rebalances no re-weighting: a name that leaves
    the index or delists mid-month is exited as the engine forces (its weight goes to cash, delisting return applied)
    and is not replaced until the next month-end. Missing data at t makes a name ineligible; it is never filled.'
  params:
    leg_quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
    peers_k:
      grid:
      - 10
      - 20
      - 40
      value: 20
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: At the month-end decision t, an eligible S&P 500 member (no earnings release and full 8-K coverage on sessions
    t-20 .. t) is assigned to the long leg (bottom leg_quantile of the peer-adjusted 21-session return, side +1)
    or to the short leg (top leg_quantile, side -1). Each monthly assignment is one event; formation windows of
    consecutive months do not overlap, so assignments are fresh. The mechanism says side +1 names outperform the
    other members over the next month and side -1 names underperform.
  horizons:
  - 1
  - 5
  - 10
  - 21
  primary_horizon_days: 21
