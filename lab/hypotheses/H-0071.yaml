id: H-0071
version: 1
title: Leverage-led vs spot-led big moves in Binance alts - after a 2-sigma day, fade coins whose perp-vs-spot volume
  ratio spiked, follow coins whose spot volume led, BTC-hedged, hold 3 days
author_agent: scout
family: perp-leverage-crowding
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: 'Leveraged perpetual traders who chase or are squeezed and liquidated: late longs who pay high funding
    in a squeeze and then unwind, and liquidated longs or shorts whose positions the liquidation engine closes at
    market regardless of value. Retail leverage demand on alt perps is persistent, so the flow recurs.'
  why: 'Every coin in the universe trades in two markets at once: the Binance spot pair (unlevered, fully paid)
    and the USD-M perpetual (levered, margin-based, liquidation engine). On a day with a large price move, the split
    of volume between the two markets shows who moved the price. A perp-led move (perp volume abnormally high relative
    to the coin''s own spot volume) is driven by leveraged positions: short squeezes and leveraged chasing on the
    way up, long liquidations and margin-call selling on the way down. That flow is non-informational and forced
    by margin, funding and the liquidation engine, so its price impact is temporary and partly reverses over the
    next days as liquidity providers are paid for absorbing it. A spot-led move (spot volume abnormally high relative
    to perp) is unlevered buying or selling on coin-specific news (listings, unlocks, exploits, exchange flows),
    which is closer to information and does not revert; crypto is known to underreact at the one-week horizon. Prediction:
    after a big move, leverage-led movers do worse in the direction of their move than spot-led movers over the
    next 1-5 days. The signal comes from one market (the spot venue''s volume against the derivatives venue''s volume)
    and is traded in the other (the perpetual).'
  why_not_arbitraged: Standing against a leveraged cascade in an alt is risky (cascades overshoot further, squeezes
    run for days), shorting alts carries funding and squeeze risk, market makers have per-coin inventory limits,
    and arbitrage capital in alt perps was thin and pro-cyclical in 2020-2022. The venue split is noisy and only
    known after the day closes, so it is not a signal fast desks trade on, and the payoff is a few-day relative
    return with high variance per event.
signal:
  description: 'Datasets: binance_perp_1d (tradable; universe = point-in-time top 30 perps by 30-day quote volume)
    and binance_spot_1d (signal only: quote_volume of the matching spot pair, spot id = perp id without ''.P'').
    Decisions after the 00:00 UTC close of day t using data up to that close; fills at the open of day t+1. (1)
    Event candidates: universe members except BTCUSDT.P and ETHUSDT.P. r = log close-to-close return of the perp
    on day t; sigma = standard deviation of the coin''s daily log returns over days t-30..t-1 (at least 25 valid
    days, else not a candidate). Big move if |r| >= k_sigma * sigma. (2) Venue ratio v = log(perp quote_volume /
    spot quote_volume) on day t; abnormal ratio a = v minus the median of v over days t-30..t-1 (at least 20 days
    with both volumes > 0). If the spot pair has no bar or zero volume on day t, the coin is not an event. (3) Reference
    level m_t = median of a over all big-move events of all coins with event day in t-180..t-1 (point-in-time; no
    events until at least 30 prior big moves exist). A big mover is leverage-led if a > m_t and spot-led if a <
    m_t (a = m_t: no event). (4) Side: leverage-led -> side = -sign(r) (expect reversal); spot-led -> side = +sign(r)
    (expect continuation, i.e. less reversal than leverage-led movers). (5) Book: each event opens side * w in the
    coin''s perp (slot weight w = 0.125) at the open of t+1 and holds it for hold_days days, closing at the open
    of day t+1+hold_days. A new event on a coin with an open position replaces that position (new side, hold restarts).
    The net of all event positions N is hedged with BTCUSDT.P at weight -N, so the book is dollar-neutral. If gross
    (sum of absolute weights including the hedge) exceeds 1, all event positions and the hedge are scaled down proportionally.
    Weights are otherwise constant during the hold (no re-equalizing). A coin that leaves the universe during its
    hold is closed at the first decision row where it is outside the universe. Missing bars: no new event; open
    positions keep their schedule. Funding is charged by the engine.'
  params:
    hold_days:
      grid:
      - 2
      - 3
      - 5
      value: 3
    k_sigma:
      grid:
      - 1.5
      - 2.0
      - 2.5
      value: 2.0
  timeframes:
  - 1d
mechanism_test:
  event: A top-30 Binance perp other than BTC and ETH moves at least k_sigma = 2 trailing 30-day sigmas close-to-close
    on UTC day t. Side = -sign(move) if its abnormal perp-vs-spot quote-volume ratio that day (log ratio minus its
    own 30-day median) is above the trailing 180-day median of that quantity over all prior big-move events (leverage-led),
    side = +sign(move) if below (spot-led). Both classes are marked, so a generic post-move reversal cancels and
    the pooled side-adjusted return measures leverage-led minus spot-led; marked coins carry both signs of beta,
    so a beta gap against unmarked peers mostly cancels too.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 3
data_requirements:
- dataset: binance_perp_1d
  description: Tradable perps (top 30 PIT by 30-day quote volume); daily returns for big-move detection and P&L,
    perp quote volume for the venue ratio.
  fields:
  - ret_co
  - ret_oc
  - close
  - quote_volume
  frequency: 1d
  period:
  - '2020-01-01'
  - '2022-12-31'
- dataset: binance_spot_1d
  description: 'Signal only, never traded: daily quote volume of the spot pair matching each perp (id without ''.P''),
    denominator of the venue ratio.'
  fields:
  - quote_volume
  frequency: 1d
  period:
  - '2020-01-01'
  - '2022-12-31'
holding_period:
  rebalance: daily
  typical_days: 3
market_exposure: market_neutral
falsification_criteria:
- 'Mechanism: the pooled side-adjusted 3-day abnormal return of the events is not above the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of dev (mostly the 2022 bear market) has the wrong sign; a leverage-unwind effect
  must not exist only in the 2021 boom.'
- 'Mechanism shape: if the 1- and 3-day side-adjusted returns are about zero and only the 10-day horizon is positive,
  the effect is slow drift, not a leverage unwind, and the card is wrong even if the pooled test passes.'
- 'Strategy: dev net Sharpe below 0.5 (T-bill bar plus margin) or the bootstrap bound of the Sharpe difference against
  T-bills not above zero.'
- 'Robustness: fewer than 75 % of the neighbors (k_sigma 1.5/2.5, hold_days 2/5) beat the bar, or the book does
  not beat T-bills at doubled costs.'
- 'Fewer than 200 events or 30 event dates in dev (expected roughly 800-1600 events on 400-700 dates): the event
  definition, not the market, failed.'
notes: 'Brief fit: the brief asked for a short-horizon cross-asset idea (signal in one market, trade in another).
  This card reads the signal in the spot market and trades the derivatives market of the same coins, which is the
  closest fit with a real counterparty that the lab has not tested. Truly cross-asset daily ideas in the lab fall
  into two saturated groups: information diffusion between liquid markets (mrel, H-0013, H-0047, H-0056, H-0066;
  K-0080: flat or wrong-signed) and stress rebounds after shocks in another market (H-0041, H-0070, studies 6-7;
  K-0084: largely the same evidence again). Market-level cross-asset claims into crypto (e.g. equity shock -> crypto)
  cannot be tested by the cross-sectional G1 event study either, because every coin is marked on such dates (K-0055).
  Relation to earlier cards: H-0049 split crash days by the change in funding and failed with the wrong sign; K-0066
  concluded funding does not tell forced from informational selling and left that question open. This card asks
  the same question with a different and more direct observable (where the volume traded, not what leveraged traders
  pay), on both up and down moves, with both classes marked so that generic reversal (K-0084, K-0068) and beta (K-0074)
  net out. It is filed under perp-leverage-crowding (H-0039) because the mechanism is the unwind of crowded leverage;
  the Chair may prefer to count it under short-term-reversal with H-0006/H-0035/H-0049, and I would not object.
  Do not read a pass as a dip-buying result: the claim is only the leverage-led minus spot-led difference. Expected
  size and the book: round-trip cost on top-30 alt perps is roughly 30-50 bps per event plus a small BTC hedge turnover.
  The pooled event mean is about half the leverage-led minus spot-led gap, so the gap has to be about 1.5-2 % over
  3 days for gross to clear cost comfortably. At about 1.5 events per day, 3-day holds and 0.125 slots the book
  carries 4-5 positions (gross about 0.5-0.7 with the hedge); a pooled side-adjusted gross of 1 % per event gives
  roughly 15 %/y net at about 15-20 % volatility (Sharpe about 1), 0.6 % gives a Sharpe near 0.3 and fails the T-bill
  bar. The most likely death is the 2022 latest third (liquidation-heavy drops kept falling, as in H-0049) or gross
  per event under cost. Data caveats: BTC and ETH are excluded from events (BTC is the hedge; Binance''s zero-fee
  spot promotions on BTC pairs from mid-2022 distort BTC spot volume). Spot wash volume in small caps is a level
  effect that the own-history baseline removes. The venue ratio uses Binance USDT spot only; volume on other quote
  pairs or venues is ignored. If the gate supplies no crypto_top_n universe on daily perps (K-0054), the Builder
  computes the top 30 by trailing 30-day perp quote volume point-in-time. Exits on leaving the universe follow K-0051.
  No date literals, no named episodes; parameters are round values set before any test.'
