# Generated by the lab framework from lab.db. Do not edit; send a REVISION.
id: H-0098
version: 1
title: Learned calendar timing of beta - LIQ-500 long-only 5-day cohorts, LightGBM on beta, ivol, liquidity and
  month-turn / macro-release clocks
author_agent: scout
family: turn-of-month-flows
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Month-end liquidity demanders (mutual funds and pension payers raising cash with market orders before
    the turn, inflow reinvestment at the start) who pay a temporary concession at the market level; investors who
    avoid holding systematic risk into scheduled releases; and, outside the windows, leverage-constrained investors
    who bid up high-beta stocks.
  why: 'Scheduled, pre-announced dates change what systematic risk earns over the following days, and the change
    is delivered through market beta, not through stock picking. (1) Month turn: institutions that need cash for
    month-end payments sell liquid equities in the last sessions of the month and reinvest payroll, pension and
    coupon inflows in the first sessions of the next (Ogden 1990; Etula, Rinne, Suominen and Vaittinen 2020), so
    the market return is concentrated around the turn and high-beta stocks collect most of it. (2) Scheduled macro
    releases (CPI, jobs report, FOMC statement): the beta-return relation is steeply positive on announcement days
    and flat or negative on other days (Savor and Wilson 2014). (3) On ordinary days leverage-constrained investors
    overpay for high-beta stocks, so a low-risk tilt is the better static holding. Taken together the best stock
    characteristic to hold for the next five sessions flips with the calendar position of the decision date. The
    lab has already seen part (1) clear the mechanism test twice in LIQ-500 (H-0016, H-0025) without a tradable
    book; this card asks whether a learned overlay that combines the calendar clocks with beta, volatility and liquidity,
    and holds a low-risk tilt outside the windows, turns that into an always-invested book that beats SPY.'
  why_not_arbitraged: 'The reward is a systematic-risk premium paid on a few sessions per month, not a riskless
    spread: harvesting it means rotating an equity book into high beta a few times a month, which costs spread on
    every switch and carries full market risk in the window. Mandated cash needs do not move with the price. The
    month-turn part is published and the lab saw it fade (K-0038), which is stated as a kill condition below.'
signal:
  description: 'Data: LIQ-500 point-in-time members (sharadar_sep), total returns ret = (1+ret_co)(1+ret_oc)-1,
    dollar_volume; macro_release_calendar_1d.next_release_sessions. Decision after the close of each session t using
    data up to that close; trades at the open of t+1. STOCK FEATURES (computed per stock from its own history up
    to t, then z-scored across the members of date t with the framework helper): (f1) beta_252 = OLS slope of the
    stock''s daily total return on the equal-weight mean daily total return of the LIQ-500 members over the last
    252 sessions (at least 189 valid days, else missing); (f2) ivol_63 = standard deviation of the residuals of
    that same regression over the last 63 sessions; (f3) liq_63 = log of the median daily dollar volume of the last
    63 sessions. DATE FEATURES (one value per date, identical for every stock on that date, passed RAW, NOT z-scored,
    because a cross-sectional z-score of a constant is undefined): (f4) wd_left = number of weekdays (Mon-Fri, computed
    from the calendar date of t alone, holidays ignored) strictly after t up to the last calendar day of t''s month,
    0 when t is the month''s last weekday; (f5) wd_in = number of weekdays from the first calendar day of t''s month
    up to and including t; (f6) rel = next_release_sessions at t (XNYS sessions from t to the next CPI, Employment
    Situation or scheduled FOMC day strictly after t), clipped at 10; missing -> 10. LABEL (framework): total return
    from the open of t+1 to the open of t+6 (horizon_days 5), ranked across the members of date t. MODEL: framework
    walk_forward with gbm (LightGBM), expanding window, refit every 63 rows, purge by the framework; fixed settings
    num_leaves 15, learning_rate 0.05, min_child_samples 2000, subsample 0.5, colsample 1.0; n_estimators from params.
    The first model is fitted as soon as walk_forward has its minimum history; before the first fit the book is
    flat (cash). BOOK (score_weights): on each date t, score every member with all six features present; if fewer
    than 50 members are scored the new cohort is cash. Take the top `top` fraction by score (top 0.2 -> about 100
    names), equal weight; each daily cohort gets 1/5 of capital and is held 5 sessions (open t+1 to open t+6), so
    five overlapping cohorts make gross 1.0 when all are filled; the engine trades only net changes. A stock that
    leaves the universe while held is closed at the first decision row on which it is not a member. Long only, no
    leverage, no shorts. No only_on gate: the book is always invested after the first fit.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 member enters the top fifth of the model score on a daily decision date (in the top fifth at
    t, not at the previous decision date); side +1. Placebos shift the whole entry set in time, so a static beta/volatility/liquidity
    tilt earns the same in placebo and event and only the calendar timing can clear the bar.
  horizons:
  - 1
  - 3
  - 5
  - 10
  primary_horizon_days: 5
ml:
  features:
  - 'beta_252: OLS slope of the stock''s daily total return on the equal-weight LIQ-500 member return, last 252
    sessions (who collects market-wide calendar flows and release-day risk premia)'
  - 'ivol_63: residual volatility of that regression, last 63 sessions (separates beta from speculative volatility;
    the low-risk demand on ordinary days)'
  - 'liq_63: log median daily dollar volume, last 63 sessions (month-end cash raising and index inflows hit the
    most liquid names first)'
  - 'wd_left: weekdays after the decision date to the end of its calendar month, from the date alone (position before
    the month turn; date-level, raw)'
  - 'wd_in: weekdays from the month start through the decision date, from the date alone (position after the month
    turn; date-level, raw)'
  - 'rel: XNYS sessions to the next scheduled CPI, jobs or FOMC day from macro_release_calendar_1d, clipped at 10
    (date-level, raw)'
  horizon_days: 5
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The calendar features are identical for every stock on a date. With a label ranked across stocks
    on each date, a ridge regression can only add the same number to every stock''s score on that date, which never
    changes the ranking: ridge on these six features is by construction a static tilt on beta, volatility and liquidity.
    The claim is that the sign of the beta and volatility tilt flips with the calendar position (high beta for windows
    that contain the month turn or a scheduled release, low risk otherwise), which only an interaction between a
    date feature and a stock feature can express; trees split on the calendar clock and then on beta. So the ridge
    baseline is the exact null ''calendar adds nothing'', and the time-shifted placebo of G1 (same stocks, other
    dates) removes the static tilt as well. Who pays: month-end liquidity demanders and release-risk avoiders inside
    the windows, leverage-constrained beta buyers outside.'
data_requirements:
- dataset: sharadar_sep
  frequency: 1d
- dataset: macro_release_calendar_1d
  description: 'Signal only: sessions to the next scheduled CPI, Employment Situation or FOMC day, known at the
    close (us_close clock).'
  fields:
  - next_release_sessions
  frequency: 1d
holding_period:
  rebalance: daily
  typical_days: 5
market_exposure: long_only
references:
- cite: 'Ogden (1990) Turn-of-month evaluations of liquid profits and stock returns: a common explanation for the
    monthly and January effects, Journal of Finance'
  year: 1990
- cite: 'Savor and Wilson (2014) Asset pricing: a tale of two days, Journal of Financial Economics'
  year: 2014
- cite: 'Etula, Rinne, Suominen and Vaittinen (2020) Dash for cash: monthly market impact of institutional liquidity
    needs, Review of Financial Studies 33(1)'
  year: 2020
falsification_criteria:
- Net Sharpe of the book on dev below SPY_TR Sharpe + 0.10, or the one-sided bootstrap bound of the Sharpe difference
  at or below zero (G1).
- 'Mechanism: entries into the top fifth earn a 5-session side-adjusted abnormal return at or below the 95th percentile
  of the time-shifted placebos, or gross per entry below the round-trip cost (the calendar timing is absent or untradable).'
- 'Decay kill condition: the abnormal return of the entries is negative in the latest third of dev (K-0038, K-0060),
  even if the pooled test passes.'
- 'Linear baseline: ridge on the same six features with the same schedule and book (a static beta/volatility/liquidity
  tilt by construction) reaches the same or a higher net Sharpe than the gbm, so the calendar interaction is not
  what pays.'
- 'Calendar dependence absent: the mean z-scored beta of the top-fifth cohort on dates whose 5-session window contains
  the month turn or a scheduled release is not higher than on other dates (Builder-reported diagnostic); then whatever
  passes is a static tilt.'
- 'Robustness: fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat SPY_TR, or the book no longer
  beats SPY_TR at doubled costs (G2).'
notes: 'BRIEF FIT. Short horizon (5-session label = holding), US single stocks cross-sectional (LIQ-500), learned
  model (gbm) with a ridge baseline named. I did not find a fresh price/volume, earnings, filing or ownership feature
  set for a 1-5 day learned card that the lab has not already used (H-0094 own-move/volume/vol, H-0095/H-0096 earnings
  releases, H-0097 filings, study 11 fundamentals/insiders/13F); date-level features are the one structural gap
  in the lab''s ML cards, and the only date-level effects with a mechanism pass in LIQ-500 are calendar flows. Weekday
  is deliberately not a feature: a 5-session open-to-open label covers each weekday once, so weekday mood (H-0036)
  cannot be learned from it. WHY THIS IS NOT A FOURTH COPY OF H-0016/H-0025 (lesson: ''no fourth month-turn beta
  book without a new reason''). (a) It answers the open question H-0025 left: ''is it the month-turn flow or low
  beta plus an equal-weight tilt? Only a same-universe control separates them.'' Here two controls do exactly that:
  the time-shifted placebo (same stocks, other dates) at G1 and the ridge baseline, which cannot use the calendar
  at all. (b) The window, the characteristic (beta vs volatility vs liquidity) and the static tilt outside the window
  are learned walk-forward, not chosen by me after seeing H-0016/H-0025, and the scheduled macro releases are added
  inside equities, the route K-0063 left open (''a beta sort inside equities on announcement days removes the equity-versus-bond
  drift''). (c) It is the always-invested overlay that the H-0016 and K-0027 lessons asked for. Nothing in it retunes
  post_days, beta_lookback or leg_quantile of H-0025. FAMILY. turn-of-month-flows, because the month-turn clock
  is the main expected driver. The release-day feature shares its mechanism with the former macro-announcement-premium
  cards (now merged into variance-risk-premium-timing); if the Chair prefers, count this trial there as well. I
  did not open a new family name. FORECASTS (K-0098, K-0120, K-0130). Events = entries into the top fifth: about
  10 per day on ordinary days and 50-80 on the 2-4 dates a month when the calendar tilt switches, so roughly 15-25
  per session, 70,000- 120,000 events on 4,500-5,000 dates (first fit about two to three years into dev, cash before).
  Round trip: 3 bps half-spread to rank 200 and 6 bps to rank 500, x2.5 before 2001-04, so about 8-12 bps for the
  mix. Gross per entry: switch-date entries carry a beta gap of roughly 0.5-0.8 over the members times a month-turn
  or release-window market excess that the lab saw clear the placebo bar; ordinary-day entries carry close to zero
  abnormal return. My central guess is 10-25 bps pooled, i.e. a cost ratio of about 1-2; per K-0130 literature-based
  sizes run high, so if the effect is a third of this the card dies on the cost check, which is informative (the
  calendar timing exists but is untradable even as an overlay). Mean exposure about 0.85 over dev (flat only before
  the first fit). Turnover: about two to four near-complete rotations a month plus cohort churn, roughly the H-0025
  cost profile. BENCHMARK AND CONFOUNDS. Long-only -> SPY_TR. An equal-weight book of liquid stocks differs from
  cap-weighted SPY even without timing (K-0074); the placebo removes the static part for the mechanism test, and
  the ridge baseline removes it for the strategy. The flat warm-up years fall on 1998-2000, when SPY mostly rose,
  so cash there works against the card, not for it. BUILDER NOTES. Date features f4-f6 must enter walk_forward raw
  (not cross-sectionally z-scored); if the framework helper cannot pass an unscaled column, please stop and report
  rather than z-scoring them (that would turn them into zeros and silently make the card a static tilt). f4/f5 come
  from the calendar date of t only (no lookup of future sessions), so G0 truncation cannot see the future. next_release_sessions
  uses realized release dates; the 2013 shutdown shifted two releases (catalog known bias), a small look-ahead I
  accept and flag. Please report, if possible, events by year and the mean beta z of the top fifth inside vs outside
  the windows (criterion 5). Publication decay: Savor and Wilson (2014) falls inside dev, so the G2 post/pre check
  applies; Ogden (1990) predates dev.'
