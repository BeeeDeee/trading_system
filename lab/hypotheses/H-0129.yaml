id: H-0129
version: 1
title: Inflation news into nominal balance sheets - LIQ-500 neutral, after a residual TIPS-breakeven shock, real-asset-heavy
  vs cash-heavy firms within leverage terciles, hold 5 days
author_agent: scout
family: oil-shock-equity-underreaction
asset_classes:
- us_equity
- macro
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Equity holders and generalist funds that price stocks on nominal earnings multiples and sector narratives,
    not on the inflation sensitivity of the asset side of the balance sheet; they keep holding cash- and receivable-heavy
    firms at unchanged prices after an inflation-expectations shift and sell them later as the news filters through
    analysts' notes and earnings guidance.
  why: 'Nominal contracting (French, Ruback and Schwert 1983): a surprise rise in expected inflation transfers real
    value from holders of nominal monetary assets (cash, receivables, short-term securities) to holders of real
    assets, because the monetary items are fixed in dollars. The TIPS breakeven is a clean, market-priced daily
    measure of that news, set by bond and inflation-swap traders. Equity investors who think in nominal terms (money
    illusion, Modigliani and Cohn 1979) and who do not map an inflation-expectations move into each firm''s balance-sheet
    composition reprice the cross-section slowly, so over the following week firms heavy in real assets should beat
    firms heavy in monetary assets after an up-shock in expected inflation, and the reverse after a down-shock.
    The lab found this kind of slow transfer for two other macro prices with an explicit link and a clean shock
    (oil, credit spreads, K-0173), but never for inflation news.'
  why_not_arbitraged: The signal needs a residual from the TIPS market (most equity desks do not watch it), a balance-sheet
    sort that is stale between filings, and a dollar-neutral book that is only invested in shock weeks; the payoff
    per event is small next to equity spread costs and the factor risk of the legs (sector tilts) is large, so capacity-constrained
    arbitrageurs leave it.
signal:
  description: 'Timing: decisions once a week after the close of the last XNYS session t of each calendar week,
    trades at the open of t+1, positions held 5 sessions (exit at the open of t+6), so cohorts do not overlap. (1)
    Inflation shock. FRED series have clock next_morning, so let s be the last session whose values of T5YIE, DFII10,
    DCOILWTICO, DBAA and DAAA are all available at the decision (normally t-1). Over the five sessions ending at
    s compute: y = change of T5YIE (percentage points); x1 = equal-weight mean log total return of the LIQ-500 members
    over the same five sessions (from ret_co and ret_oc); x2 = change of DFII10; x3 = change of ln(DCOILWTICO);
    x4 = change of (DBAA - DAAA). Fit OLS y = a + b.x on the trailing 252 sessions of these daily-rolling five-session
    changes ending at s (needs >= 200 valid rows, otherwise no signal), take the residual e at s and z = e / standard
    deviation of the window''s residuals. A shock week is one with |z| >= z_shock; sign(z) is the direction of the
    inflation news. Missing FRED days are not filled; a five-session change needs both end values. (2) Balance-sheet
    exposure, from sharadar_sf1 as reported (arq, usable from the day after filing, stale after 400 days as the
    loader enforces). Eligible: LIQ-500 member and tradable at t, assets > 0, liabilities present, deposits missing
    or zero (banks excluded). Monetary-asset share MA = (cashneq + receivables + investmentsc) / assets, a missing
    component counted as 0. Leverage L = liabilities / assets. Split the eligible stocks into terciles of L on date
    t; inside each tercile take the bottom leg_quantile of MA (real-asset-heavy) and the top leg_quantile of MA
    (monetary-asset-heavy). (3) Book. In a shock week with z > 0: long the real-asset-heavy legs of all three terciles,
    short the monetary-asset-heavy legs; with z < 0 the mirror. Equal weights, 0.5 gross long and 0.5 gross short
    (dollar-neutral, gross 1). Not a shock week: flat (cash). A stock that leaves the universe or stops being tradable
    during the hold is closed at the next open and not replaced. No other trades.'
  params:
    leg_quantile:
      grid:
      - 0.15
      - 0.2
      - 0.25
      value: 0.2
    z_shock:
      grid:
      - 0.75
      - 1.0
      - 1.5
      value: 1.0
  timeframes:
  - 1d
  - 1w
  - 1q
mechanism_test:
  event: On a weekly decision date with |z| >= z_shock (residual 5-session TIPS-breakeven shock), every eligible
    stock in a real-asset-heavy leg (bottom leg_quantile of monetary-asset share within its leverage tercile) gets
    side = sign(z), and every stock in a monetary-asset-heavy leg (top leg_quantile within its tercile) gets side
    = -sign(z). Unmarked LIQ-500 members are the peers. Both directions of the shock are marked, so the persistent
    style drift of either leg cancels against the same-stock placebo.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 20
  primary_horizon_days: 5
