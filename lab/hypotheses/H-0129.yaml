falsification_criteria:
- 'Mechanism: the side-adjusted 5-session abnormal return of the marked stocks is below the 95th percentile of the
  time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of dev (about 2015-2020) is wrong-signed; declared kill condition (K-0060), even
  if the pooled test passes.'
- 'Mechanism shape: if the 1-session average is about zero and the effect only grows steadily to 20 sessions, it
  is style drift of real-asset versus cash-rich firms, not diffusion of a dated news shock; if the 1-session average
  already holds most of the 5-session average, a taker at the next open is too late. Either reading refutes the
  card''s claim of a build over the first week.'
- 'Control (requested as a diagnostic): the same sort on non-shock weeks (|z| < 0.5, side by sign of z) earns as
  much as the shock weeks; then the breakeven news adds nothing.'
- 'Strategy: net Sharpe on dev below 0.5 or the bootstrap bound of the Sharpe difference against T-bills not above
  zero.'
- 'Robustness: fewer than 75 % of the neighbours (z_shock 0.75 / 1.5, leg_quantile 0.15 / 0.25) beat T-bills, or
  doubled costs leave Sharpe below T-bills.'
notes: 'Brief fit: the signal comes from the TIPS/Treasury market (FRED breakevens with oil, credit and real-yield
  controls), the trades are in US stocks, the hold is 5 sessions, and a mechanism test is declared. Family: oil-shock-equity-underreaction
  is the lab''s family for the slow diffusion of macro-price news into stocks through an exposure (H-0056, H-0114,
  H-0116, H-0119, H-0126, H-0128), so this card counts against it. How it differs from those cards: (a) the news
  is inflation expectations, never tested; (b) the exposure is an explicit balance-sheet link (the asset side''s
  nominal share) as K-0173 asks, not a return beta (H-0116 failed with betas); (c) leverage is held fixed by sorting
  within leverage terciles, so this is not H-0126/H-0128''s leverage sort, and credit-spread, oil (H-0114) and real-yield
  moves are regressed out of the shock, and the equity-market move too. Banks are excluded by deposits; insurers
  and brokers stay in (most are in the top leverage tercile). Known confounds I could not remove: monetary-asset-heavy
  firms are mostly cash-rich tech and healthcare, real-asset-heavy ones are industrials, energy, materials, utilities
  and REITs, so a sector rotation after reflation news is what is being measured; marking both shock directions
  and the same-stock placebo net out its average level but not a sector reaction to the news itself, which here
  is the claim. TIPS breakevens carry a liquidity premium that jumps in crises (late 2008, March 2020); there the
  ''inflation shock'' is partly TIPS illiquidity, which works against the card. Forecasts (K-0120, K-0171): T5YIE
  and DFII10 start 2003-01-02, so with the 252-session warm-up the first signal is in early 2004 and the first third
  of dev is 2004-2009. Weeks with |z| >= 1.0: about 25-32 % of about 880 weeks, so 220-280 event dates; eligible
  non-bank stocks about 420-460, legs of about 0.2 x 145 = 29 per tercile per side, so about 170 events per shock
  week and 37000-48000 events in total. Round trip about 11 bps (LIQ-500 tier, K-0171). Gross per event: pessimistic
  0 (mechanism absent), central 10 bps, optimistic 30 bps; so the central case already fails the cost check, and
  the placebo bar should sit near or below cost given the dated cohorts, so a fail is informative. Mean exposure
  about 0.25-0.30 (gross 1 in shock weeks only), close to the 0.20 floor; I did not lower z_shock to raise it. Expected
  leg results (K-0172): no prior that one side carries it, since the sides swap with the shock sign; please report
  the event average by shock sign (inflation up versus down) and by leg. Likeliest death: the mechanism test, with
  gross under cost or the latest third wrong-signed. If it passes, the part-time dollar-neutral book will most likely
  miss the absolute Sharpe floor (K-0027); a long-only tilt would then be the next card. No data purchase needed;
  all series are in the catalog with loaders.'
