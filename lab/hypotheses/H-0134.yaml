falsification_criteria:
- 'Mechanism: the 21-day side-adjusted abnormal return of the gbm-vs-ridge disagreement events is at or below the
  95th percentile of the time-shifted placebos, or below the round-trip cost: the learned interaction adds nothing
  tradable over the linear score.'
- 'Ridge baseline: a ridge on the same features with the same rows, label and schedule is as good as the gbm, i.e.
  the disagreement average is zero or negative (ridge side wins); then the momentum-x-crowding switch is not what
  pays.'
- The disagreement average is wrong-signed in either of the two populated thirds of dev (the 2021 boom block or
  the 2022 bust block); the first third is expected to be empty from model warm-up and cannot count.
- 'Strategy: net Sharpe on dev below 0.5 or not above T-bill + 0.10, or the bootstrap bound of the Sharpe difference
  at or below zero.'
- 'Neighbors of n_estimators 100 or n_leg 6: fewer than 75 % beat T-bills, or their median Sharpe is below 0.7 of
  the primary.'
- Doubled costs leave the book below T-bills.
notes: 'WHY THIS IS NOT A RETRY. H-0039 (perp-leverage-crowding, now in short-term-reversal) sorted on the trailing
  funding level unconditionally with a 5-day hold: it barely cleared the placebo bar, did not cover cost, lost in
  the latest third, and its effect grew with the horizon; its lesson flagged ties at the default funding rate. This
  card (a) does not sort on crowding alone but claims crowding flips the sign of the momentum slope, (b) uses the
  continuous perp/spot basis, never funding, (c) uses a 21-day horizon argued from the momentum horizon of the literature,
  not chosen from H-0039''s horizon profile, (d) tests the learned switch against its own ridge control inside G1
  (the K-0138/K-0142 design), so a failure says whether the interaction or the features are wrong. K-0119 (daily
  reversal conditioned on funding, perp/spot volume, VIX) and K-0179 (TradFi states) concern day-to-week reversal
  and date-level states; here every input is coin-level crypto-native and the horizon is a month. H-0124 (crypto
  momentum x VIX/BTC state) never scored, so crypto momentum itself is untested in the lab. FAMILY: the sort variable
  is the past-month return, so the card is filed in short-term-momentum (H-0029, H-0124); it also shares the crowding
  input with H-0039, and if the Chair prefers to count it under short-term-reversal as well, that is the stricter
  choice and fine. MECHANISM EVENT (diagnostic.py): at each decision row compute the gbm legs and the ridge legs
  (same n_leg). side +1 = coin in the gbm long leg but not the ridge long leg, or in the ridge short leg but not
  the gbm short leg; side -1 = coin in the gbm short leg but not the ridge short leg, or in the ridge long leg but
  not the gbm long leg (the two rules never conflict). Unmarked scored members are the peers (about 18-26 per date,
  so the three-peer rule of K-0174 holds). FORECASTS (K-0120, K-0165): scores start after warm-up, roughly late
  2020 to early 2021, so about 95-110 weekly decision dates in dev; if the two models share 3-5 of 6 names per leg,
  4-12 events per date, about 400-1200 events. Model-defined counts can run a tenth of forecast: at about 100 events
  the card ends at the event count and says nothing about the claim. Round trip for top-30 perps: take the gate''s
  tier, likely 40-90 bps (K-0120 saw about 91 bps). Gross per disagreement event over 21 days: central 2 %, pessimistic
  0. With 21-day coin volatility near 30 % and about 100 overlapping dates the placebo bar likely sits at 3-6 %,
  above cost, so a modest real interaction can still end as ''cannot tell'' (K-0034); I state that in advance. BLOCKS:
  dev of this dataset is 2019-12 to 2022-12; the first third will be empty or thin from warm-up (K-0163), so both
  the boom and the bust third must carry the predicted sign; one boom-and-bust cycle only (K-0006). LEGS (K-0172):
  the short leg holds rich-basis winners, likely higher beta in the 2021 boom, so the raw G1 comparison leans against
  the short side in the boom and toward it in 2022 (K-0074); I expect the long leg to carry more of the price effect
  and the short leg to collect funding. The engine credits funding to shorts: part of the book''s net may be funding
  carry, which the price-only event study does not include, so the mechanism verdict is clean of it. BOOK ARITHMETIC:
  about 12 entries per week, roughly 1000+ entries, about 100 decision dates, mean exposure about 0.6-0.7 over dev
  (cash before the first score). Weekly cohorts turn over about two thirds of gross a week before netting, so cost
  drag is several percent a year; the book needs a gross spread well above that, which is the likeliest strategy-level
  death. PRACTICAL (K-0131, K-0124, K-0178): the gate may hand no crypto_top_n universe on daily perps; the Builder
  should build it as the top 30 by trailing 30-day quote volume from data up to t, accept views shorter than 90
  rows, and report scored rows and events per year at G0. No VIX or spot dataset is needed (basis is in the perp
  extras), so the lab try gaps of K-0106 do not apply. Not a scalping card; decisions weekly, daily bars only.'
