title: Leverage-crowded vs spot-led trends, learned - top-30 Binance perps dollar-neutral 21-day weekly cohorts,
  LightGBM on momentum x basis; mechanism = gbm vs ridge picks
author_agent: scout
family: short-term-momentum
asset_classes:
- crypto_perp
universe:
  kind: crypto_top_n
  n: 30
mechanism:
  counterparty: 'Short side: retail trend-chasers who buy recent winners through perps with leverage, pay funding
    to the shorts and get liquidated or capitulate when the trend stalls. Long side: early profit-takers and slow
    holders who sell into an unlevered, spot-led trend before it has diffused.'
  why: 'Past-month winners in crypto keep outperforming over the next weeks (Liu, Tsyvinski, Wu 2022: 1-4 week momentum),
    because attention and information reach the slower holders gradually. But a trend that is carried by leveraged
    perp longs is a different object from one carried by spot buying: when small traders chase a coin with leverage
    the perp trades rich to spot (positive basis), they pay funding every eight hours, and the position is fragile;
    Schmeling, Schrimpf, Todorov (Crypto carry) find that a high basis reflects trend-chasing demand for leverage
    and predicts crashes. The claim of this card is that the sign of the momentum slope depends on crowding: among
    coins whose perp trades near or below spot, past-month winners continue; among coins whose perp trades rich,
    past-month winners give back (funding drain, forced deleveraging, exhausted marginal buyers), and a late volume
    surge with a 7-day spike on top of a rich basis marks the exhaustion. A cross-sectional model of next-month
    rank on momentum, basis, the recent leg, volume trend and volatility should learn this switch; a linear score
    cannot.'
  why_not_arbitraged: Shorting rich, rising altcoin perps carries squeeze risk exactly when the crowd is largest;
    cash-and-carry arbitrage capital is scarce and concentrates on BTC and ETH, not the 30th-largest perp; the trade
    needs a month of holding through 100 %+ volatility, which mandates and margin rules limit.
signal:
  description: 'Data: binance_perp_1d, point-in-time top-30 perps by trailing 30-day quote volume (universe crypto_top_n,
    n 30). Crypto day closes 00:00 UTC; all features use data up to the close of day t. FEATURES per coin and date,
    each z-scored across the scored universe members of that date with the framework helper: (1) mom28 = log(close_t
    / close_t-28) of the perp close; (2) ret7 = log(close_t / close_t-7); (3) basis7 = mean of the daily basis (extras
    basis = perp/spot - 1) over days t-6..t, at least 5 valid values; (4) volshock = log(mean quote volume over
    t-6..t / mean quote volume over t-89..t); (5) rvol28 = standard deviation of daily log close-to-close returns
    over t-27..t. A coin is scored on day t only if it is a universe member on t, has at least 80 valid closes in
    the last 90 rows and at least 5 basis values in the last 7; others are not scored (no fill). Funding is NOT
    a feature (many perps sit tied at the default rate). Rows are restricted per row to members, never to an ever-member
    list (K-0134). LABEL: framework label, total return from the next open to the open 21 rows later, ranked across
    the universe on each date (horizon_days 21 = holding period). MODEL: lab.framework.ml.walk_forward with model
    gbm (LightGBM), expanding training window, refit every 63 rows, n_estimators per the grid, learning_rate 0.05,
    num_leaves 8, min_child_samples 300, subsample 0.8, colsample 1.0, framework seeds and purge. BOOK (score_weights
    + only_on): decision rows are the closes of Sunday bars (00:00 UTC Monday); trades at the next open. At each
    decision row with at least 15 scored members a new cohort is formed: long the n_leg highest-scored coins, short
    the n_leg lowest, each at weight 1/(6 n_leg) (cohort gross 1/3, dollar-neutral), held 21 rows and then closed;
    three cohorts overlap, so the book is about gross 1, net 0. Weights of the same coin in different cohorts add
    up. A coin that leaves the point-in-time universe during a hold is closed at the first row it is outside the
    universe and its slot stays in cash until the cohort expires. Fewer than 15 scored members: no new cohort that
    week. Before the first walk-forward score the book is in cash. Funding is charged/credited by the engine (longs
    pay positive funding, shorts receive it). LINEAR CONTROL (diagnostic only, not traded): the same walk_forward
    call with model ridge (alpha 1.0) on the same five features, the same rows, label and refit schedule, giving
    ridge legs of the same n_leg.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    n_leg:
      grid:
      - 4
      - 6
      - 8
      value: 6
  timeframes:
  - 1d
mechanism_test:
  event: 'At a weekly decision row, the gbm and the ridge (same five features, rows, label and refit schedule) disagree
    on a coin''s leg: side +1 if the coin is in the gbm long leg but not the ridge long leg, or in the ridge short
    leg but not the gbm short leg; side -1 if it is in the gbm short leg but not the ridge short leg, or in the
    ridge long leg but not the gbm long leg.'
  horizons:
  - 5
  - 10
  - 21
  - 42
  primary_horizon_days: 21
ml:
  features:
  - 'mom28: 28-day log return of the perp close (the trend whose continuation is the claim; Liu-Tsyvinski-Wu horizon)'
  - 'ret7: 7-day log return (the latest leg of the trend: a spike on top of crowding marks exhaustion, a pause in
    an unlevered trend does not)'
  - 'basis7: 7-day mean of the daily perp/spot basis (leveraged-long demand: how rich trend-chasers pay for leverage
    in this coin)'
  - 'volshock: log ratio of 7-day to 90-day mean quote volume (new participation arriving: attention inflow late
    in a trend)'
  - 'rvol28: 28-day realized volatility of daily returns (fragility of the position and liquidation proximity; scales
    how far a crowded trend can unwind)'
  horizon_days: 21
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claim is a sign change of the momentum slope by crowding: next-month rank rises with mom28
    when basis7 is low and falls with mom28 when basis7 is high, with the give-back strongest when a 7-day spike
    and a volume surge arrive on top of the rich basis. A ridge on the same five features can only add a momentum
    slope and a basis slope: it can never rank a rich-basis winner below a rich-basis loser while ranking a cheap-basis
    winner above a cheap-basis loser, and it cannot make the ret7 and volshock effects depend on the basis. A tree
    splits on basis7 and then on mom28. Who pays: levered perp trend-chasers (funding paid to shorts, forced exits)
    on the short side; early sellers of spot-led trends on the long side. If ridge picks are as good, the learned
    interaction is not what pays and the card is refuted in its learned form.'
