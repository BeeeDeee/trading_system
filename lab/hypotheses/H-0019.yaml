falsification_criteria:
- 'Mechanism: the side-adjusted 5-day abnormal return of the events (next open to close of t+5, minus the mean of
  the other LIQ-500 stocks) is not above the 95th percentile of the 200 time-shifted placebos, or keeps its sign
  in fewer than 2 of 3 sub-periods, or its gross size per event is below the round-trip cost.'
- 'Mechanism (timing, not selection): if the event mean is no larger than the placebo average, the spread belongs
  to the stocks (buyback-yield / net-issuance anomaly) and not to the window opening; the flow-timing claim is then
  false even if the raw number is positive (K-0025).'
- 'Strategy: dev net Sharpe below 0.5 versus T-bills, or the one-sided 75 % bootstrap bound of the Sharpe difference
  versus T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (quantile 0.1/0.3, hold_days 3/10) beat T-bills, or the strategy
  no longer beats T-bills with costs x2.'
- 'Concentration: more than 60 % of the dev log return comes from one of three sub-periods, or the effect is absent
  in the S&P 500 alternative universe.'
notes: 'Brief fit: US single stocks, cross-sectional, 5-day hold, mechanism test declared. K-0024 says the only
  large-cap short-horizon events that survived the placebo were mandated flows; this card proposes a new, dense
  flow event (every quarterly filing of every LIQ-500 stock, ~4 events per stock per year, tens of thousands in
  dev, spread over all filing seasons) rather than another anomaly. Why it is not a near-copy: not short-term reversal
  (no past return enters the signal; side is set by cash-flow-statement flows); not the earnings-announcement premium
  (H-0008, H-0015 claimed a premium for announcers; here the filing date only anchors the window and the long and
  short legs are both filers, so a generic filing or announcement-day effect cancels between sides); not insider-purchase
  information (H-0012: informed insider buying, here uninformed employee selling and corporate buying); not dividend
  pressure (H-0010). New family because the mechanism (blackout-window flows) appears in no earlier card or study.
  The placebo shifts the same stocks to other dates, so it absorbs the known level anomalies (repurchase yield,
  net issuance, Pontiff-Woodgate style): only the timing after the filing is credited, which is the mechanism. Expected
  weaknesses, stated in advance: (a) the filing date lags the earnings release by days to weeks for some firms,
  so part of the post-blackout burst (Hartzmark-Solomon measure four days) may already be over at entry: this biases
  toward a null, not toward a false positive; (b) share-based compensation was expensed only from the mid-2000s
  (FAS 123R), so early-era scores are mostly the buyback leg; (c) the book is active only in and after filing seasons,
  so mean exposure is expected around a third of days: if it falls below 0.20 that is a structural failure, not
  a reason to lengthen the hold; (d) 10-Q/A amendments change marketcap and create a few spurious events. ART (trailing
  twelve months) is used instead of ARQ so the score does not depend on whether quarterly cash-flow items are year-to-date,
  and because it measures the persistent program rate. Three SF1 fields (RAM limit 6). No forward data for stocks,
  so at most G4. The 2022 reference is after dev, so no publication-decay split applies; the literature prior is
  accepted.'
