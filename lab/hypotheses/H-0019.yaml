universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: 'Price-insensitive sellers and buyers who must trade in the window regardless of price: employees
    liquidating vested equity (diversification, taxes on vesting), and corporate buyback desks executing a board-authorised
    program on a schedule. Liquidity providers who absorb the employee selling (or sell into the buyback) demand
    a temporary price concession that the strategy collects.'
  why: 'Two predictable, uninformed and mandated-by-policy flows switch on together when a company''s quarterly
    blackout ends after its earnings release: (1) the company resumes discretionary open-market repurchases, which
    it must pause during the blackout; (2) employees and insiders, barred from trading during the blackout, sell
    vested stock compensation once the trading window opens. Both flows are known in sign and rough size from the
    last filing (repurchase cash and stock-based compensation, scaled by market cap), and neither carries information
    about the next week''s fundamentals. With downward-sloping short-run demand, stocks whose net window flow is
    a large buy (repurchases far above stock compensation) should outperform in the days after the window opens,
    and stocks whose net flow is a large sell (high stock compensation, little or no buyback) should underperform.
    Hartzmark and Solomon document the employee-selling leg: high stock-expense firms earn lower returns in the
    days after blackout periods end. The lab has no earnings dates (K-0004), so the window opening is proxied by
    the day the quarterly SEC filing becomes usable; the 10-Q/10-K is filed at or after the earnings release, i.e.
    inside the open window.'
  why_not_arbitraged: 'The per-stock flow is small relative to idiosyncratic volatility (a few percent of daily
    volume), so harvesting it needs a diversified book traded on a staggered firm-specific calendar, with high turnover
    in names that are each only a few basis points of edge: capacity- and cost-limited, and invisible to anyone
    who does not track filing calendars, compensation expense and repurchase cash per firm. Buyback desks and employees
    face mandates (programs, vesting tax events) that do not let them time around it.'
signal:
  description: 'Inputs (all point-in-time): from sharadar_sf1 the trailing-twelve-month (ART) fields ncfcommon (issuance
    minus purchase of equity, cash flow statement; negative = net repurchase), sbcomp (share-based compensation
    expense) and marketcap (frozen at the filing date), as daily matrices usable from the day after the SEC filing.
    Score of stock j on day t: F[t,j] = (-ncfcommon - sbcomp) / marketcap, using the latest usable filing; missing
    if any input is NaN or marketcap <= 0. F > 0 means the company''s net window flow is a buy, F < 0 a sell. New-filing
    detection: a new filing of j becomes usable on day t when sf1_art_marketcap[t,j] is non-NaN, sf1_art_marketcap[t-1,j]
    is non-NaN and the two differ (marketcap is frozen at each filing date, so it changes exactly when a new as-reported
    period is loaded). NaN-to-value transitions are not events. Event at the close of day t: j is a LIQ-500 member
    on t, a new filing of j became usable on t, and F[t,j] is in the top `quantile` (long, side +1) or the bottom
    `quantile` (short, side -1) of the cross-section of F over all LIQ-500 members on t that have a valid F (each
    from its own latest filing). Book: each event opens a position at the open of t+1 and closes it at the open
    of t+1+hold_days (hold_days trading days). Every day after the close the target book is rebuilt from the events
    of the last hold_days days: active long names get equal weights summing to +0.5, active short names equal weights
    summing to -0.5 (dollar-neutral, gross 1). If either leg has fewer than 5 active names the whole book is flat
    that day (no unhedged single leg). A held stock that leaves LIQ-500 or stops trading is closed at the next open;
    delisting uses the dataset''s terminal return. A stock with a new event while already held restarts its hold
    clock with the new side. Decisions after the close of t with data up to that close, trades at the open of t+1.
    Cash earns the T-bill rate.'
  params:
    hold_days:
      grid:
      - 3
      - 5
      - 10
      value: 5
    quantile:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1q
mechanism_test:
  event: A LIQ-500 stock's new quarterly SEC filing becomes usable on day t (sf1_art_marketcap changes from one
    non-NaN value to another) and its net window-flow score F = (-ncfcommon - sbcomp) / marketcap (ART, latest filing)
    is in the top 20 % (side +1, net repurchaser) or bottom 20 % (side -1, net stock-compensation seller) of the
    LIQ-500 cross-section of F on t.
  horizons:
  - 1
  - 3
  - 5
  - 10
  - 21
  primary_horizon_days: 5
