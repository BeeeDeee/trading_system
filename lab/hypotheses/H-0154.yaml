market_exposure: long_only
references:
- cite: Daniel, Garlappi and Xiao (2021) Monetary Policy and Reaching for Income, Journal of Finance 76(3)
  year: 2021
- cite: Hartzmark and Solomon (2019) The Dividend Disconnect, Journal of Finance 74(5)
  year: 2019
falsification_criteria:
- 'Mechanism test fails: new entries into the top fifth of the model score earn no more over 60 sessions than the
  same stocks on time-shifted placebo dates (placebo percentile below 0.95), or gross per entry is below the round-trip
  cost, or fewer than 2 of 3 blocks have the predicted sign.'
- The latest third of dev has a negative event average (the expected decay of K-0060); the card treats that as a
  kill even if the pooled test passes.
- A ridge (framework ridge) on the same six features, same label, same schedule and same book is as good as or better
  than the gbm, in event gross or in net Sharpe. The ridge can only produce a static tilt, so this would mean the
  rate-state interaction does not pay and whatever remains is the low-volatility / high-dividend style premium.
- 'The model never switches: in dev, the average score gap between the top and the bottom dividend-yield quintile
  has the same sign after 6-month yield falls and after 6-month yield rises (for example, d10 below its 30th percentile
  against above its 70th). Then the gbm learned a static tilt and the reaching-for-income claim is unsupported,
  whatever the book earns.'
- Net Sharpe on dev below SPY_TR Sharpe + 0.10, or the bootstrap bound of the Sharpe difference is not above zero.
- Fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat SPY_TR, or doubled costs make it lose to
  SPY_TR.
notes: 'Brief fit: the brief asked for a 6-24 month hold. The schema caps both ml.horizon_days and the mechanism
  horizon at 60 sessions. So this is the closest fit: a 60-session label, 3-month sleeves rebuilt monthly, and date-level
  macro inputs that look back 6 months. The signal is cross-asset (Treasury market state from FRED), the trade is
  US stocks. The sleeve lives about 63 sessions against the 60-session label, a gap of 3 sessions forced by the
  cap. Family: new, reaching-for-income. The closest existing family is dividend-month-premium (H-0010, ex-day price
  pressure from dividend seekers). It shares the investor type but not the trigger: there the trigger was the dividend
  calendar, here it is the Treasury-yield state. If the Chair reads it as the same mechanism (demand for dividends
  moves prices), merge it; the extra penalty is one trial. Overlap with low volatility (study 1) is intended to
  be removed twice: the same-stock placebo removes the static style level, and the ridge falsification removes any
  static tilt. Why this differs from the dead state-switch cards (H-0098, H-0099, H-0130, K-0162, K-0179). Those
  used volatility, calendar or VIX states at a 5-day horizon, with no named investor whose flow follows the state.
  Here the state is the rate cycle, which has a documented, slow flow channel (fund flows and holdings in Daniel-Garlappi-Xiao),
  and the horizon is a quarter. Also different from the estimated-exposure diffusion family (H-0114 to H-0129):
  the link is an accounting characteristic (dividend yield) plus a price-based bond beta, the horizon is 60 sessions,
  and the claim is a slow flow plus a valuation phase, not delayed news. Forecast (K-0120, K-0144, K-0177; pessimistic
  case first). Scored rows: SF1 and 252-session betas start in 1999, and the first fit needs 60-session labels,
  so scores begin about 2000-2001. The first third (1998 to about 2005) will be thin, so both later thirds must
  carry the sign (K-0163). Top fifth is about 85-95 names. Monthly new entries are about 15-30, with bursts when
  the state flips. That gives about 3000-7000 events on about 230 monthly dates, so about 20-25 entry dates a year.
  Round trip for LIQ-500 is about 11-12 bps. Gross per entry over 60 sessions: pessimistic 0, central +60 bps against
  the placebo mean. The placebo bar for monthly entries at a quarter horizon is probably 80-150 bps (K-0109, K-0111),
  so the likeliest death is a right-signed ''cannot tell'' under the bar. Second likeliest: wrong-signed in the
  latest third (2013-2020, mostly zero-rate years). Mean exposure is about 1.0 (always invested). Entries and decision
  dates are far above the minimums. Requested diagnostics (owner/Builder, if the judge can produce them): (a) the
  event average split by rate state (d10 below its 30th percentile, middle, above its 70th); (b) the ridge event
  average on the same entries definition (K-0135); (c) the score-gap-by-state check named in the falsification criteria.
  Leakage: no column, row or sample subset is chosen with information from the end of the view (K-0134). Non-members
  are masked per row, the whole-view member list is never used, and FRED values are lagged one session.'
