id: H-0154
version: 1
title: Reaching for income across the rate cycle, learned - LIQ-500 long-only monthly 3-month sleeves, LightGBM
  on dividend yield, rate beta and 6-month return x Treasury-yield change, level and market state
author_agent: scout
family: reaching-for-income
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Income-seeking households, retirees and equity-income funds. They buy high-dividend stocks months
    after yields fall, they hold them in the low-rate phase regardless of valuation, and they sell them late when
    bond yields recover. They do not judge the trade by total return.
  why: 'Many households and income funds consume dividends and coupons, not total return, and treat dividends as
    separate from price (the dividend disconnect). When Treasury yields fall, their bond income shrinks and they
    reallocate toward high-dividend, bond-like stocks. They do this slowly, through fund flows and portfolio reviews
    over months, not on the day of the rate move (Daniel, Garlappi and Xiao 2021, from holdings and fund flows).
    So after a sustained fall in yields, high-dividend stocks with bond-like price behaviour should keep outperforming
    for a while: the flow phase. Once yields are low and the flows have arrived, those stocks are expensive and
    earn less afterwards (Hartzmark and Solomon 2019: demand for dividends is highest when rates are low and after
    poor market returns, and dividend payers then earn less): the valuation phase. After a sustained rise in yields,
    the income seekers go back to bonds and CDs and sell the same stocks with a lag. Signal and trade sit in different
    markets. The signal is the state of the Treasury market (from FRED); the trade is a cross-section of US stocks.
    The sign of the dividend tilt should depend on that state.'
  why_not_arbitraged: The trade is a slow style timing bet. Its risk is sector and duration exposure over quarters,
    and its payoff arrives in a few rate cycles per decade. Arbitrage capital with quarterly evaluation and tracking-error
    limits does not hold such bets at scale. The flow comes from investors whose preference for current income is
    a stable consumption rule, not an error that they learn away.
signal:
  description: 'Universe: point-in-time LIQ-500 members. Decisions after the close of the last trading day of each
    month; trades at the next open. FRED series (clock next_morning): at the close of day t only values dated up
    to t-1 are used, with the last available value carried forward. Stock-level features, z-scored across the members
    of each date with the framework helper: (1) dy = sf1_art_divyield, trailing dividend yield, usable from the
    day after the filing. If missing, it is set to 0 when the stock has any SF1 filing within the last 400 days
    (non-payer); otherwise the stock is not scored. (2) rbeta = OLS slope, over the last 252 sessions, of the stock''s
    daily total return minus that day''s equal-weight mean return of the universe members, regressed on the daily
    change of DGS10 in percentage points. Only sessions s <= t-1 with both values present are used, and at least
    180 pairs are required, else the stock is not scored. This is bond-likeness measured from prices, independent
    of the dividend: bond proxies have a negative slope. (3) r126 = the stock''s total return over the last 126
    sessions up to the close of t. Date-level features, fed raw (the same value for every stock on a date, not z-scored
    across the universe): (4) d10 = DGS10 at the last value <= t-1 minus DGS10 126 sessions earlier (pp). (5) y2
    = the DGS2 level at the last value <= t-1 (percent). (6) mkt126 = the 126-session cumulative return of the daily
    equal-weight mean return of universe members, up to t. Label: total return from the open of t+1 to the open
    60 sessions later, ranked across the universe on each date (framework label). Model: LightGBM (framework gbm)
    through lab.framework.ml.walk_forward, expanding window, refit every 126 rows, with num_leaves 15, min_child_samples
    500, learning_rate 0.05 and subsample 0.8 fixed, and n_estimators from params. No feature selection and no tuning
    beyond the declared grid. Book: three sleeves of weight 1/3. At each monthly decision one sleeve is rebuilt
    (the one formed three months earlier), so a sleeve lives about 63 sessions. A rebuilt sleeve holds the top `top`
    fraction of scored members by model score, equal weight within the sleeve. The other two sleeves are not traded.
    A name that leaves the universe is sold at the next open and its weight stays in cash in that sleeve until the
    sleeve is rebuilt. Fewer than 50 scored members on a decision date: that sleeve is rebuilt as the equal-weight
    universe. Before the first fitted model exists (warm-up), sleeves hold the equal-weight universe. This placeholder
    carries no signal and produces no mechanism events. Gross exposure 1.0, long only, no leverage.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1mo
mechanism_test:
  event: A stock enters the top fifth of the model score at a monthly decision date (it was not in the top fifth
    at the previous monthly decision); side +1. Warm-up placeholder sleeves produce no events.
  horizons:
  - 5
  - 21
  - 42
  - 60
  primary_horizon_days: 60
ml:
  features:
  - 'dy: trailing dividend yield sf1_art_divyield (z-scored); how much a holder''s income depends on the dividend,
    the characteristic income seekers buy'
  - 'rbeta: 252-session slope of the stock''s universe-relative daily return on daily DGS10 changes (z-scored);
    bond-likeness from prices, i.e. how much a stock trades as a bond substitute'
  - 'r126: 126-session total return of the stock (z-scored); whether a bond proxy has already repriced after the
    rate move, so the flow phase is used up'
  - 'd10: 126-session change of the 10-year Treasury yield, date-level raw; flow phase (yields fell) against exit
    phase (yields rose)'
  - 'y2: level of the 2-year Treasury yield, date-level raw; the income gap, the reach should be strongest when
    safe income is near zero (valuation phase)'
  - 'mkt126: 126-session equal-weight universe return, date-level raw; Hartzmark-Solomon find dividend demand rises
    after poor market returns'
  horizon_days: 60
  model: gbm
  retrain_every_days: 126
  why_not_linear: 'Three of the six inputs are date-level and the label is a cross-sectional rank. In a ridge, a
    date-level input adds the same constant to every stock''s score on that date and cannot change the ranking.
    A ridge on the same six features therefore reduces to a static sort on dividend yield, rate beta and 6-month
    return: an always-on bond-proxy / low-volatility tilt. The mechanism says the sign of the dividend and rate-beta
    tilt switches with the rate state. It is positive after a sustained fall in yields while the slow income flows
    are still arriving (and more so if the stock has not yet repriced). It is negative when yields are already low
    and the demand has been absorbed (valuation phase), and negative after a sustained rise in yields when income
    seekers return to bonds. A tree can split on d10 and y2 first and then on dy, rbeta and r126 inside each state;
    a ridge cannot. The people who pay are the lagging income seekers. They buy dividend stocks months after yields
    fall and sell them months after yields rise.'
