falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return of the marked equity ETFs against the bond peers at the 2-session
  horizon is not above the 95th percentile of the 200 time-shifted placebos, or the gross per event is below the
  round-trip cost.'
- 'Mechanism signature: the latest third of the dev window (the years with the largest vol-control AUM) has a non-positive
  abnormal return. The mechanism predicts the effect grows with vol-control AUM, so a result carried by the earliest
  third (before managed-volatility annuity funds were common) refutes the flow story even if the pooled test passes.'
- 'Mechanism shape: the 1-session abnormal return is not positive and the effect appears only at 5-10 sessions (slow
  drift of a high-volatility regime premium, not a close-auction flow concession).'
- 'Strategy: net Sharpe on dev below 60/40 SPY/IEF Sharpe + 0.10, or the one-sided bootstrap bound of the Sharpe
  difference at or below zero.'
- 'Robustness: fewer than 75 % of the neighbors (threshold 0.05/0.15, hold_days 1/3 and their combinations) beat
  the 60/40 benchmark, or the book does not beat 60/40 at doubled costs.'
notes: 'Brief fit: the brief asks for a cross-asset, 1-5 day card. This is the closest fit I could argue with a
  real counterparty: the signal is the S&P 500 volatility state as measured by an institutional rule (an equity-volatility
  estimate, not the equity price signal itself, and the event day is typically quiet), and the trade is an equity-versus-Treasury
  allocation, which is exactly the cross-asset trade the counterparty makes. Pure cross-market price lead-lag was
  killed by study mrel and macro-calendar x ETF cards by K-0065, so I did not file another of those. Family: filed
  under rebalancing-flow-pressure (H-0002, H-0044, H-0046) on purpose: the economic mechanism is the same (predictable,
  non-informational, rule-mandated stock/bond reallocation creating price pressure at the close), only the trigger
  differs (a volatility window roll instead of weight drift). The Chair may count it with them. It is not volatility-managed-exposure
  (H-0003): there the claim was a risk-return premium of timing; here vol is only the clock of someone else''s forced
  flow, and the book''s average exposure stays at the benchmark''s 60/40 except on event days (K-0005, K-0027).
  Difference from H-0046: H-0046''s breach days were large relative stock-bond move days, so generic spread reversal
  could not be separated. Here the trigger is the anniversary (20 or 60 sessions later) of a large day; on the event
  day itself nothing needs to move. Remaining confound, stated honestly: events sit in elevated-volatility regimes
  (a big day happened within the last 60 sessions), where the equity premium and the stock-bond spread variance
  are larger; the time-shifted placebo only partly controls for this. A clean control (same-regime days without
  a drop-out) cannot be reported by the gate. Expected numbers (rough, from typical S&P daily-return tails, not
  from data): with threshold 0.10 an event needs the leaving day to carry roughly a fifth or more of the 20-session
  squared-return sum while the 20-window binds (or an extreme day leaving the 60-window); I expect about 8-14 event
  dates a year, so roughly 150-250 event dates and 600-1000 marked events (4 ETFs) in 2004-2020. If the Builder''s
  G0 count is below 50 dates or above 600 dates, something is mis-specified: please flag before G1 (K-0067). Economics
  (K-0064): per event the book shifts 40 % of capital SPY<-IEF and back, about 1.6 one-way legs of ETF cost (a few
  bps). The required margin over 60/40 is about +0.10 Sharpe, i.e. roughly 0.9 %/year at 60/40 volatility. With
  ~10 events a year the book needs a 2-session SPY-minus-IEF effect of roughly 25-35 bps per event; a smaller real
  effect will pass the mechanism test and still fail G1 (the H-0046 pattern). I state this so a G1 death after a
  mechanism pass is read correctly. Main risks: (1) heterogeneous rules (EWMA, other windows, multi-asset vol targets)
  dilute a drop-out specific flow; (2) the drop-out is known 20 sessions ahead, so desks may front-run into the
  close of t, before our open-of-t+1 entry; (3) the flow may be too small relative to S&P closing liquidity. Timing:
  SPY close at 16:00 ET; all inputs are known at the close of t; trades at the open of t+1. No references: I know
  no paper documenting window drop-out flows; related work on mechanical rebalancing price pressure (Harvey, Mazzoleni,
  Melone, ''The Unintended Consequences of Rebalancing'', NBER WP 33554) and on volatility targeting performance
  (Moreira and Muir 2017) is a different claim, so I do not list them as the source and do not ask for the literature
  prior. Fixed rule constants (0.10 target, cap 1, 20/60 windows) are the industry convention, not tuned. ETFs have
  no forward data, so G4 is the ceiling.'
