id: H-0050
version: 1
title: Volatility-control re-leveraging flow - tilt a 60/40 SPY/IEF book to all SPY for 2 sessions when an old large
  S&P day is about to leave the 20/60-session realized-vol windows
author_agent: scout
family: rebalancing-flow-pressure
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IVV
  - VTI
  - DIA
  - IEF
  - TLT
  - SHY
  - AGG
  kind: instruments
mechanism:
  counterparty: The vol-control funds themselves (and the insurers hedging variable-annuity guarantees with the
    same rule), who trade a predictable, rule-mandated quantity at the close regardless of price; the liquidity
    providers who absorb it at the close are paid a concession that a holder positioned from the open earns.
  why: 'Volatility-control funds (managed-volatility variable-annuity sub-accounts, risk-control index products,
    vol-targeting overlays) set their equity exposure mechanically as target_vol / realized_vol, with a cap, where
    realized vol is a simple trailing window of S&P 500 returns, commonly the larger of the 20- and 60-session estimates.
    When a large daily move leaves the window, the measured volatility falls by construction, with no new information,
    and these funds must buy equity (futures/ETFs) and sell bonds or cash at the next rebalance (close of the session
    in which the window rolls, or one session later for lagged rules). The flow is large relative to closing liquidity,
    concentrated in one or two closes, and non-informational, so it should push large-cap US equity up relative
    to Treasuries over the next one to two sessions and partly give the move back afterwards. The event is chosen
    so that it is NOT a large stock or stock-bond move day: the shock that drives it happened 20 or 60 sessions
    earlier, which separates this flow from the generic spread reversal that confounded H-0046 and from the stress
    rebounds of studies 6/7 and K-0056.'
  why_not_arbitraged: The flow size depends on undisclosed AUM and heterogeneous rules (20 vs 60 sessions, EWMA,
    lags, caps), so its size on a given day is uncertain; the trade is a one- to two-session directional equity
    bet carrying full equity risk in an elevated-volatility regime, which balance-sheet-constrained dealers and
    risk-limited stat-arb desks take only partly. Front-running by sell-side desks may move part of the pressure
    earlier (see falsification and notes).
signal:
  description: 'Inputs: SPY daily close-to-close total return r_s = (1 + ret_co_s) * (1 + ret_oc_s) - 1 (ret_co
    = previous close to open, ret_oc = open to close), sessions s up to and including the close of day t. No other
    input. Fixed reference rule (institutional convention, not parameters): target volatility 0.10, exposure cap
    1.0, windows 20 and 60 sessions, annualization 252. Step 1, at the close of day t: V20_t = mean of r_s^2 over
    the 20 sessions t-19..t; V60_t = mean of r_s^2 over t-59..t; sigma_t = sqrt(252 * max(V20_t, V60_t)); E_t =
    min(1.0, 0.10 / sigma_t). Step 2, mechanical next-session window (known at the close of t, before day t+1 trades):
    the session that leaves the 20-window when day t+1 is added is t-19, the one that leaves the 60-window is t-59.
    Replace the unknown new return by a neutral day equal to the current window mean: V20n_t = V20_t + (V20_t -
    r_{t-19}^2) / 20; V60n_t = V60_t + (V60_t - r_{t-59}^2) / 60; sigman_t = sqrt(252 * max(V20n_t, V60n_t)); En_t
    = min(1.0, 0.10 / sigman_t). Step 3, event at t: (En_t - E_t) / E_t >= threshold (relative mechanical increase
    of the reference rule''s equity exposure; zero whenever the cap binds, i.e. in calm markets). Book (decision
    after the close of t, trades at the open of t+1): base target weights 60 % SPY / 40 % IEF. If an event occurred
    at t, target weights are 100 % SPY / 0 % IEF from the open of t+1 through the close of session t+hold_days,
    then back to 60/40 at the next open. A new event inside an active window extends it to hold_days sessions after
    the new event (no stacking, the tilt is at most 100 % SPY). Outside tilt windows the book is rebalanced to 60/40
    on the first session of each month and when a tilt window ends (weights may drift in between; if the engine
    needs constant targets, daily 60/40 targets are acceptable). Only SPY and IEF are ever traded; IVV, VTI, DIA,
    TLT, SHY and AGG are in the universe only for the mechanism test. Missing data: if any of the 60 SPY returns
    in the window is missing (vendor-spike day dropped by the loader), compute the means over the available returns
    in the window and evaluate the event only if at least 18 of 20 and 55 of 60 are present; otherwise no event
    that day. Before 60 SPY returns exist, no event and the book holds 60/40.'
  params:
    hold_days:
      grid:
      - 1
      - 2
      - 3
      value: 2
    threshold:
      grid:
      - 0.05
      - 0.1
      - 0.15
      value: 0.1
  timeframes:
  - 1d
mechanism_test:
  event: At the close of day t, the reference vol-control rule (target 0.10, cap 1, max of 20- and 60-session SPY
    realized variance) would mechanically raise its equity exposure by at least `threshold` (relative) when the
    oldest session leaves its window at t+1, with the new session replaced by the window mean (signal steps 1-3).
    On such a date mark SPY, IVV, VTI and DIA with side +1 (large-cap US equity should outperform); IEF, TLT, SHY
    and AGG are never marked and serve as the same-date peers (four unmarked peers on every event date, per K-0055).
    Abnormal return = marked ETF return from the open of t+1 to the close of t+h minus the mean of the unmarked
    bond peers.
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 2
