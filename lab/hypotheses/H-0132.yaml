falsification_criteria:
- 'Mechanism: side-adjusted 5-session abnormal return of marked ETFs below the 95th percentile of the 200 time-shifted
  placebos.'
- 'Mechanism: gross abnormal return per event below the round-trip cost of the marked ETFs.'
- 'Mechanism: the latest third of dev has the wrong sign (decay or episode dependence, K-0060); the card counts
  this as a refutation even if the pooled test passes.'
- 'Mechanism: the 1-session abnormal return is the largest and the 5-session one is smaller than half of it (a same-day
  reaction finishing overnight, not underreaction a next-open taker can collect).'
- 'Strategy: net Sharpe on dev below 0.5 or bootstrap bound of the Sharpe difference to T-bills below zero.'
- 'Robustness: fewer than 75 % of the shock_z and n_leg neighbours beat T-bills, or doubled costs leave Sharpe below
  the T-bill bar.'
notes: 'Brief fit: cross-asset (signal from the oil market via FRED, trades foreign equity ETFs), short horizon
  (5 days), mechanism test declared. Family: reuses oil-shock-equity-underreaction on purpose; trials count with
  H-0056, H-0114, H-0116, H-0119, H-0126, H-0128, H-0129. Why this is not a retry: H-0056 tested aggregate SPY against
  Treasuries (one market, wrong-signed); H-0114 passed inside LIQ-500 with a learned score and left open whether
  the latest-third reversal was a few US oil episodes or the effect gone; H-0116/H-0119 failed on non-oil prices
  (the lessons forbid more non-oil prices on this build; this is oil only). This card asks the one open question:
  does the oil underreaction appear in a second, independent cross-section (foreign markets, exposure that runs
  through local earnings AND the currency), with a plain rule and no learner. If it fails, the oil pass of H-0114
  is most likely US-specific or luck and the family should be closed. Exposures are estimated, never hand-labelled,
  and the instrument list is every liquid US-listed single-country equity ETF I know to exist in dev (no selection
  on results); late listings (RSX 2007, NORW, GXG, EPU, EIDO, EPOL around 2009-2010, INDA 2012) simply become eligible
  after 252 sessions. Forecasts (K-0120, K-0098): eligible ETFs about 20 in 2001-2007 and about 30 from 2011; events
  at |z| >= 1.5 with non-overlapping 5-session slots roughly 15-25 per year, i.e. 300-450 event dates in 2001-2020
  and 1800-2700 marked events (6 per date); mean exposure about 0.3-0.5 (event dates x 5 / 252), above the 0.20
  floor but not by much at the higher threshold. Gross: a |z| = 1.5 shock is roughly a 5-7 % oil- specific move;
  a top-minus-bottom exposure gap of about 0.2-0.3 gives a same-week differential of 1-2 %; underreaction of 20-30
  % of that means about 20-50 bps per marked event over 5 sessions. Round trip for these ETFs is probably 15-40
  bps (several are thinly traded: EWK, EWO, GXG, EPU, NORW); the cost check could bind, and the less liquid exporters
  (NORW, GXG) are often in the top leg. Placebo bar: per-ETF weekly residual vol about 3 %, three names per side,
  a few hundred dates, so a bar of perhaps 15-25 bps, near or below cost: a failure should be informative, not a
  coin flip. Known risks: oil shocks cluster in a few episodes (2008, 2014-2016, 2020), so blocks are episodes (K-0060);
  exporters are higher-beta EM markets (K-0074), partly cancelled because the side flips with the shock sign; WTI
  went negative in April 2020 (handled by the missing/winsorize rule); FRED oil is a next-morning series, so the
  shock window ends one session before the decision, which loses some of any fast response but adds no look-ahead.
  Most likely death: gross per event below the round trip, or the latest third wrong-signed as in H-0114. Requested
  gate outputs if possible: event average by shock sign (oil up vs down) and by leg (high vs low exposure).'
