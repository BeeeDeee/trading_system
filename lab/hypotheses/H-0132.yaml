mechanism:
  counterparty: US-based holders of single-country ETFs who price the day's oil move only partly into the country
    (anchored on the world equity move and the FX move), and local investors abroad who react to the oil news over
    the following sessions; the trader who follows the oil exposure buys from the underreacting side.
  why: 'Oil-specific news (a WTI move not explained by world equities) changes the cash flows of oil-exporting and
    oil-importing economies in opposite directions, through local equity earnings and through the currency. Driesprong,
    Jacobsen and Maat (2008) report that oil price changes predict stock market returns across many countries with
    a lag of days to weeks: investors underreact because the effect of oil on a whole country''s earnings is hard
    to quantify and most equity investors do not follow the oil market. The lab saw the same delayed response once
    inside US stocks (H-0114, oil-exposed tails beat same-stock placebos and peaked within days), but never in a
    second, independent cross-section. Country ETFs give one: different investors (US allocators to foreign markets),
    a direct and large exposure for exporters (Canada, Norway, Mexico, Brazil, Colombia, Russia) and importers (Japan,
    Korea, India, Turkey, euro area), and exposure measured statistically, not hand-labelled.'
  why_not_arbitraged: 'The trade is a low-capacity, noisy cross-country bet: a few country ETFs per leg, country-specific
    news dominates any single week, oil shocks cluster in a few episodes, and the gain per event is of the order
    of a few tenths of a percent, too small and too risky for macro funds that trade oil and FX directly and too
    cross-asset for single-country equity investors.'
signal:
  description: 'Decisions after the US close of each XNYS session t, trades at the open of t+1. Inputs: total returns
    of the universe ETFs (sharadar_sfp, close-to-close from ret_co and ret_oc) and WTI spot (fred_macro DCOILWTICO,
    clock next_morning, so the last usable oil value at decision t is that of session t-1). (1) Daily oil return
    o(d): simple return of DCOILWTICO between consecutive available values; set to missing when either price is
    <= 0 or missing, and winsorize at +-20 %. (2) World factor w(d): equal-weight mean daily return of the universe
    ETFs that have a return on d. (3) Oil-specific daily return e(d) = o(d) - b * w(d), with b the OLS slope of
    o on w over the 252 sessions ending at d (at least 200 joint observations, else e(d) missing). (4) Shock: S(t)
    = sum of e(d) over the 5 sessions t-5..t-1; z(t) = S(t) / (sqrt(5) times the standard deviation of daily e over
    the 252 sessions ending t-1). An event fires at t when |z(t)| >= shock_z AND no position is open (the book is
    flat), so 5-session windows of fired events never overlap. (5) Oil exposure of ETF j at t: OLS slope of (r_j(d)
    - w(d)) on e(d) over the 252 sessions ending t-1, requiring at least 200 joint observations and a price at t;
    ETFs without it are not eligible that day (not yet listed, missing data). Need at least 10 eligible ETFs, else
    no event. (6) Book: on an event, rank eligible ETFs by exposure; if z > 0 (oil up net of equities) go long the
    n_leg highest-exposure and short the n_leg lowest-exposure ETFs; if z < 0 do the mirror (long lowest, short
    highest). Equal weights 0.5/n_leg per name (gross 1.0, dollar-neutral). Hold exactly 5 sessions (enter at the
    open of t+1, exit at the open of t+6), no rebalancing inside the slot; then flat until the next event. A name
    that loses its price mid-slot is closed at its last available open and its weight goes to cash. No other instruments
    are traded.'
  params:
    n_leg:
      grid:
      - 2
      - 3
      - 4
      value: 3
    shock_z:
      grid:
      - 1.25
      - 1.5
      - 1.75
      value: 1.5
  timeframes:
  - 1d
  - 1w
  - 1y
mechanism_test:
  event: On a fired event date t (|z(t)| >= shock_z for the 5-session oil-specific WTI move ending t-1, book flat),
    the n_leg eligible country ETFs with the highest 252-session oil exposure get side = sign(z) and the n_leg with
    the lowest exposure get side = -sign(z); all other eligible ETFs are unmarked peers. Both sides are marked on
    every event date, so oil direction and market beta enter with alternating signs and the placebo mean should
    be near zero.
