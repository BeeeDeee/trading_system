references:
- cite: Harvey, C. R., Mazzoleni, M. G., Melone, A. (2025) The Unintended Consequences of Rebalancing. NBER Working
    Paper 33554
  url: https://www.nber.org/system/files/working_papers/w33554/w33554.pdf
  year: 2025
falsification_criteria:
- 'Mechanism: the one-session side-adjusted abnormal return of the marked equity ETFs against the bond peers is
  at or below the 95th percentile of the time-shifted placebos, or gross per event is below the round-trip cost.'
- 'Mechanism: the latest third of dev has the wrong sign (equities do not move against the rebalancers'' trade in
  the most recent years).'
- 'Mechanism shape: the descriptive 5- and 10-session abnormal returns are larger than the 1-session one in the
  same direction. That would be slow drift or momentum, not a transient flow concession that reverts within about
  two weeks.'
- 'Strategy: net Sharpe on dev below 60/40 SPY/IEF + 0.10, or the bootstrap bound of the Sharpe difference is at
  or below zero.'
- 'Robustness: fewer than 75 % of the threshold_pp / tilt neighbours (0.5 and 2.0; 0.2 and 0.6) beat the 60/40 benchmark,
  or the result does not beat 60/40 at doubled costs.'
notes: 'Brief fit: the brief asks for a short (1-5 day), cross-asset idea in which signals from one market trade
  in another. Here the trigger comes from the joint stock/bond path: a bond selloff alone can force equity selling,
  and the trade is in both markets. Instruments are the most liquid ETFs, so a one-session hold is affordable. This
  is the closest fit with a mandated-flow counterparty (K-0024: flow events are what survives in this lab); pure
  daily lead-lag between markets is dead (study mrel), so this card is deliberately not a lead-lag rule. Family:
  rebalancing-flow-pressure, reused honestly. Difference from H-0002: H-0002 used the calendar (month-end window,
  month-to-date drift sign, half-weight spread held over several days, flat otherwise). This card uses threshold
  breaches on any date, a one-session hold, and a tilt on an always-invested 60/40 book with the benchmark''s average
  exposure (K-0005, K-0027). It answers H-0002''s open question: does the next-day pressure exist at all, separately
  from a multi-day window? H-0044 (month-end FX hedging) is a different flow in the same family. Difference from
  H-0041 (flight-to-safety rebound, short-term-reversal): both directions are marked, and overweight breaches follow
  equity rallies or bond selloffs, which no stress-rebound story covers. Known confound, cannot be separated with
  a single event mask: a generic one-day reversal of the stock-minus-bond spread after large relative moves predicts
  the same sign. Only the absolute equity move after bond-driven breaches would separate the two, and the gate cannot
  report that split. If the mechanism passes, a follow-up control card (large relative moves that do not breach
  the band) is the natural next step. Expected gross against cost (K-0053): the paper reports roughly 17 bps lower
  next-day equity returns (futures, close to close). The engine fills at the next open, so the overnight part is
  lost; I expect perhaps half of it open-to-close, about 8-10 bps of equity-minus-bond abnormal return per event.
  Cost is a few bps per side on SPY/VTI/DIA/IWM, so the cost ratio may be only modestly above one. That is a stated
  risk. Event count: a 1 pp band breaks after roughly a 4 % relative move since the last reset. With a daily stock-bond
  spread volatility of about 1.4 %, I expect a few hundred breach dates in 2003-2020, times four marked ETFs. That
  is enough for min_events and min_event_dates. The 2.0 pp neighbour has about a quarter of the breaches, so it
  is the power-limited neighbour. Path dependence: the simulated book''s anchor is the first loaded session, so
  a different start date shifts the breach dates. That is inherent to threshold rules (real institutions have heterogeneous
  anchors) and is deterministic for a given data start. Timing caveat: the event study measures open(t+1) to close(t+1);
  the strategy holds from open(t+1) to open(t+2), so it also carries the next overnight, where part of the reversal
  may sit. Period starts 2003-10-01 because AGG starts 2003-09-29; every other instrument exists earlier. No forward
  data for ETFs, so G4 is the ceiling (K-0014). The publication year (2025) is outside dev, so the publication-decay
  check does not apply in dev; the holdout includes the publication year.'
