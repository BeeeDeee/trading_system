id: H-0046
version: 1
title: Threshold-rebalancing pressure - when a simulated 60/40 SPY/IEF book drifts past its band, tilt a 60/40 book
  against the rebalancers' next-session trade for one session
author_agent: scout
family: rebalancing-flow-pressure
asset_classes:
- us_etf
universe:
  instruments:
  - SPY
  - IEF
  - VTI
  - DIA
  - IWM
  - TLT
  - AGG
  - SHY
  kind: instruments
mechanism:
  counterparty: Mandate-driven rebalancers that trade a mechanical size on a mechanical date regardless of price
    and demand liquidity on the session after a band breach. They accept the concession because tracking their policy
    weights matters more to them than one day of execution cost.
  why: 'Large balanced investors (defined-benefit pensions, target-date and balanced funds, endowments) hold fixed
    stock/bond targets and many rebalance by a threshold rule: when the equity weight drifts more than a band away
    from target, they sell the asset that outperformed and buy the one that lagged, usually in index futures and
    ETFs on the next session. The trigger depends on the joint path of two markets: a bond selloff with flat equities
    pushes the equity weight up and causes equity selling just like an equity rally does, so the signal for the
    equity trade comes partly from the bond market. Harvey, Mazzoleni and Melone (2025) simulate 60/40 books with
    threshold and calendar rules and find that an overweight in equities predicts lower next-day equity returns
    and higher bond returns, with the pressure reverting within about two weeks. That is the signature of a non-informational
    flow that pays a temporary price concession.'
  why_not_arbitraged: 'The aggregate band breach is not observed: each institution has a private band and anchor
    date, so the trigger can only be estimated. The concession is small next to one day of index volatility, so
    a liquidity provider earns a thin reward per unit of risk. Daily index-level capital is limited on stress days,
    when breaches cluster. The evidence was published only in 2025, after the whole dev period.'
signal:
  description: 'Inputs: daily close-to-close total returns of SPY and IEF, built from the sharadar_sfp return fields
    ((1 + ret_co) * (1 + ret_oc) - 1, or a close-to-close total return field if the loader provides one). Simulated
    rebalancer book: on the first session of the loaded period both legs start at weights 0.60 (SPY) and 0.40 (IEF),
    with growth factors G_s = G_b = 1. After each close t, multiply G_s by (1 + r_SPY,t) and G_b by (1 + r_IEF,t),
    then compute the equity weight w_t = 0.6 G_s / (0.6 G_s + 0.4 G_b). If SPY or IEF has no bar on day t, its return
    counts as 0 for the drift and no trigger can fire on t. Trigger: if w_t > 0.60 + threshold_pp / 100, then d_t
    = +1 (equities overweight, rebalancers sell equities and buy bonds on t+1). If w_t < 0.60 - threshold_pp / 100,
    then d_t = -1 (equities underweight). Otherwise d_t = 0. On a trigger day, reset G_s = G_b = 1 after the close
    of t, because the simulated rebalancer is back at target. Only data up to the close of t is used. Book (long-only,
    fully invested, only SPY and IEF are ever traded): the default target is SPY 0.60 / IEF 0.40. If d_t != 0, the
    target for session t+1 is SPY = clip(0.60 - tilt * d_t, 0, 1) and IEF = 1 - SPY, traded at the open of t+1.
    After the close of t+1 the target goes back to 60/40 (traded at the open of t+2), unless a new trigger fired
    on t+1, in which case the new tilt applies. Hold length is one session by design (the paper''s pressure is a
    next-day effect) and is not a parameter. Outside tilts, hold constant 60/40 target weights. If the engine re-equalises
    target weights every day, that is acceptable (tiny turnover). Otherwise re-set to 60/40 at the first session
    of each month, like the benchmark. VTI, DIA, IWM, TLT, AGG and SHY are in the universe only as event instruments
    and peers for the mechanism test; the strategy never trades them.'
  params:
    threshold_pp:
      grid:
      - 0.5
      - 1.0
      - 2.0
      value: 1.0
    tilt:
      grid:
      - 0.2
      - 0.4
      - 0.6
      value: 0.4
  timeframes:
  - 1d
mechanism_test:
  event: 'After the close of day t, the simulated 60/40 SPY/IEF threshold book (primary threshold_pp = 1.0, rules
    exactly as in signal.description, including the reset) breaches its band. On such a day mark the four broad
    US equity ETFs SPY, VTI, DIA and IWM with side = -1 if equities are overweight (d_t = +1) and side = +1 if underweight
    (d_t = -1). Do not mark TLT, IEF, AGG or SHY: they are the unmarked bond peers, so the abnormal return is equity
    minus Treasury and aggregate bonds. This is the rebalancers'' trade: equities should underperform bonds on the
    session after an overweight breach and outperform after an underweight breach. Both directions are marked so
    that generic equity-over-bond drift cancels in the placebo.'
  horizons:
  - 1
  - 2
  - 3
  - 5
  - 10
  primary_horizon_days: 1
