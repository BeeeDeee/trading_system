id: H-0135
version: 1
title: 52-week-high anchoring in liquid crypto - Binance spot top-20 long-only, weekly 28-day cohorts of the coins
  whose close is nearest their trailing one-year closing high
author_agent: scout
family: 52-week-high-anchoring
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 20
mechanism:
  counterparty: Holders who bought near the previous high and sell at break-even as the price returns to it, and
    traders who treat the old high as 'resistance' and take profits or sell into it; both supply coins too cheaply
    while news is still being absorbed. They keep doing it because the break-even and resistance heuristics are
    how most retail crypto traders read charts, and because the loss is a few percent of drift spread over weeks,
    invisible trade by trade.
  why: 'Anchoring on the 52-week high (George and Hwang 2004): when good news lifts a price toward its trailing
    one-year high, traders use the old high as a reference point and are reluctant to bid the price through it,
    so the news is absorbed slowly and the price keeps drifting up over the following weeks; coins far below their
    high are, symmetrically, held up by holders and bargain hunters who anchor on the old high as ''fair''. Crypto
    is a strong setting for this: there is no cash-flow anchor, the market is retail-heavy, and the trailing high
    (and the all-time high) is the most quoted reference level on every chart and exchange screen. The claim of
    this card is the long side only: among the 20 most liquid Binance spot coins, the ones whose close is nearest
    their one-year closing high outperform the other liquid coins over the next four weeks.'
  why_not_arbitraged: The drift is slow and noisy (monthly cross-sectional return dispersion among liquid coins
    is tens of percent), so a fund harvesting it carries large tracking error against BTC; the natural hedge (short
    the far-from-high coins) needs perps with funding costs and short-squeeze risk, and spot shorting is not available;
    momentum-style books crash at sharp market rebounds, which limits leverage; and the dominant crypto investors
    are retail and trend traders, not cross-sectional arbitrageurs.
signal:
  description: 'Data: Binance spot daily bars (close, quote_volume); the daily close is 00:00 UTC. Decisions after
    the close of day t using data up to that close, trades at the open of day t+1. Universe on day t: the point-in-time
    top 20 USDT spot pairs by 30-day quote volume (crypto_top_n, n = 20, as supplied by the gate; if the gate supplies
    no universe, rank by the trailing 30-day sum of quote_volume up to t). Eligible on day t: universe member on
    t, a valid close on t, and at least 365 days of close history up to t (pairs younger than a year are never eligible).
    Score: NH(i,t) = close(i,t) / max(close(i, t-W+1 .. t)), with W = high_window_days; when an eligible coin has
    fewer than W days of history (only possible for W > 365) the max is taken over all its available history. NH
    is in (0, 1]; 1 means the coin closes at its trailing W-day closing high. Use closes, not intraday highs. Formation:
    every 7th day (one fixed weekday at the 00:00 UTC close, the first formation on the first day on which at least
    2 coins are eligible), rank eligible coins by NH (ties broken by higher 30-day quote volume) and select the
    k = min(n_hold, floor(E/2)) highest, where E is the number of eligible coins; if E < 2 the cohort is empty (cash).
    Book: four overlapping cohorts. Each new cohort gets one quarter of equity, equally weighted across its k coins,
    bought at the next open and held for 28 days, then dropped; the book weight of a coin is the sum over active
    cohorts. In the first three weeks fewer than four cohorts exist and the remainder is cash. No leverage (gross
    <= 1), long only, no shorts. A coin that leaves the PIT universe while held is sold at the next open after the
    first close outside the universe (the engine refuses weights outside the universe), and its slice stays in cash
    until that cohort ends. A pair whose data stops is handled by the engine''s delisting rule. No other filters,
    no stop losses, no regime switch.'
  params:
    high_window_days:
      grid:
      - 180
      - 365
      - 540
      value: 365
    n_hold:
      grid:
      - 3
      - 5
      - 8
      value: 5
  timeframes:
  - 1d
  - 1y
mechanism_test:
  event: At a weekly formation date t (after the 00:00 UTC close), an eligible coin of the point-in-time top-20
    spot universe (at least 365 days of history) is among the k = min(n_hold, floor(E/2)) eligible coins whose close
    is nearest its trailing high_window_days closing high (NH ranking of the signal); side +1 (the coin should outperform
    the other universe members over the next 28 days). Only the long side is marked, matching the long-only book;
    the unmarked eligible members are the peers.
  horizons:
  - 7
  - 14
  - 28
  - 56
  primary_horizon_days: 28
