  typical_days: 28
market_exposure: long_only
references:
- cite: George, Hwang (2004) The 52-Week High and Momentum Investing, Journal of Finance
  year: 2004
- cite: Jia, Simkins, Xu, Zhang (2022) Psychological Anchoring Effect, the Cross Section of Cryptocurrency Returns,
    and Cryptocurrency Market Anomalies
  year: 2022
falsification_criteria:
- 'Mechanism: the 28-day side-adjusted abnormal return of the near-high selections against the other eligible top-20
  coins is not above the 95th percentile of the time-shifted placebos, or the gross per event is below the round-trip
  cost.'
- 'Mechanism: the latest third of the event sample (the most recent dev block) has the wrong sign: anchoring drift
  that only lived in the earlier boom years is a regime, not a mechanism (K-0060).'
- 'Mechanism shape: the abnormal return at 7 days is larger than at 28 days (a fast bounce or short-term momentum
  burst, not slow absorption of news against an anchor), or the 28-day average is no better than the placebo mean
  (coin identity, K-0025).'
- 'Strategy: net Sharpe on dev below BTC buy-and-hold Sharpe + 0.10, or the one-sided bootstrap bound of the Sharpe
  difference not above zero.'
- 'Robustness: fewer than 75 % of the neighbors (high_window_days 180 / 540, n_hold 3 / 8 and their combinations)
  beat BTC buy-and-hold, or the book does not beat BTC at doubled costs.'
- 'Benchmark control: the book does not beat the equal-weight top-20 basket (second crypto benchmark) on Sharpe,
  which would mean the rule adds nothing over holding liquid coins.'
notes: 'Why this is not a repeat. (1) The family 52-week-high-anchoring has two dead cards, both on LIQ-500 stocks
  (H-0011 breakout events at 5 days, H-0083 matched cells at a quarter); the H-0083 lesson names ''another asset
  class'' as one of the few routes still worth a card, and I reuse the family name so its trials count. (2) It is
  not study 9''s weekly altcoin momentum: the sort is distance to the trailing high, not past return, BTC and ETH
  are eligible (the book can sit in BTC when it is the coin nearest its high), the hold is four weeks, and the claim
  is judged against BTC and against same-coin placebos rather than as an equal-weight altcoin basket. Nearness to
  the high is correlated with past return; this card does not separate the two (with 20 coins a matched-cell design
  leaves too few coins per cell), so a pass supports ''NH or momentum'', and a separate card would be needed to
  split them. (3) It is not a learned card and not a funding/basis sort (H-0039, H-0134). Why spot, long-only and
  from 2017: the perp panel starts 2019-12 and a one-year high would leave events only from 2021 (one cycle, K-0006).
  Spot from 2017-08 gives eligible coins from 2018-08 and about four and a half years of formations covering the
  2018 bust, 2019, the 2020-21 boom and the 2022 bust. Spot shorts would be unrealistic, so only the long side is
  traded and marked. Forecasts (K-0098, K-0120): about 52 formations a year from 2018-08 to 2022-12, roughly 225
  formation dates; k is 3 in the first months (6-10 eligible coins in 2018) and 5 later, so about 1000-1100 marked
  events on about 225 dates. Mean exposure close to 1 after the first three weeks (fully invested except universe
  exits). Turnover: NH ranks are persistent, so a new cohort repeats most of the coins it replaces; I expect one-way
  book turnover of roughly 3-6 times a year, i.e. a cost drag of about 1.5-3 % a year at a crypto spot round trip
  of roughly 30-90 bps for top-20 pairs (the weakest top-20 pairs in 2018-2019 sit in a worse tier). Expected effect:
  1-4 % per 28 days for selections against peers; the placebo bar at 28 days is probably 3-5 % because monthly coin
  dispersion is large and NH is persistent within a coin, so a ''cannot tell'' near miss is a real outcome and must
  be read as such (K-0034), not as promise. Known confounds: (a) beta (K-0074): near-high coins are the leaders
  in a boom and the defensive coins in a bust, so the raw comparison against peers mixes some market direction in;
  the sub-period criterion is the guard. (b) Partial survivorship: delisted pairs are only partly in the archive
  and get a -2 % terminal return; delisted coins are almost always far from their high, so they sit among the peers
  and flatter the peers, which biases the test against this card. (c) The 2022 reference lies inside dev, so G2''s
  publication-decay check compares 2022 with the earlier years; 2022 is a single bear year. Most likely death: the
  placebo test, because near-high status is persistent and the same coins shifted in time earn much of the same
  average (as in H-0011), or the latest block (2022) flips sign.'
