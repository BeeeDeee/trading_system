falsification_criteria:
- 'Mechanism: the side-adjusted abnormal return at 5 sessions does not exceed the 95th percentile of the 200 time-shifted
  placebos.'
- 'Mechanism: gross abnormal return per event at 5 sessions is below the round-trip cost of the fund (cost ratio
  < 1).'
- 'Mechanism: the latest third of the event sample (roughly 2016-2020) has a negative average abnormal return (K-0060
  decay condition).'
- 'Mechanism shape: if the 1- and 2-session horizons are at or below zero and the gain appears only at 10-20 sessions,
  the effect is slow discount drift, not a weekly concession; the card is then wrong even if the 5-session test
  passes narrowly.'
- 'Strategy: net Sharpe on dev below 0.5 against T-bills, or the one-sided bootstrap bound of the Sharpe difference
  to T-bills at or below zero.'
- 'Robustness: fewer than 75 % of the neighbours (z_entry 1.5/2.5, formation_days 3/10 and their combinations) beat
  T-bills, or net Sharpe at doubled costs does not beat T-bills.'
- 'Concentration: one of the three dev blocks carries more than 60 % of the log return (a single stress episode
  such as a market-wide discount blowout would do this).'
notes: 'Brief fit: the brief asks for a cross-asset signal at a 1-5 day horizon. The signal comes from the muni
  bond market as priced through the AP-arbitraged open-end ETF MUB and is traded in a different, segmented market,
  the retail closed-end fund market, which has no creation/redemption link to the bonds. It is a cross-market (bond
  market -> CEF wrapper) rather than cross-asset-class signal; I chose it over cross-class lead-lag ideas because
  the lab has already killed daily cross-market lead-lag (study mrel, K-0080) and, with next-open fills, a lead
  from one liquid market is priced into the other before the trade. The trigger market here is the slow one by construction.
  Why this is not H-0037 again (same family, reused on purpose so the trials count together): H-0037 faded gaps
  between two open-end ETFs on the same basket, where authorized participants close gaps intraday, and found gross
  about half of cost. Its lesson asked for wrapper evidence; closed-end funds are the wrapper where no AP exists,
  deviations are an order of magnitude larger (discount volatility of several percent a year against basis points
  for twin ETFs) and the literature documents their mean reversion. H-0043 asked the same question against bond
  index spreads and never ran (ICE BofA series empty in dev, K-0096); this card uses a loadable anchor. Expected
  size (K-0053, K-0064): a muni CEF''s 5-session gap to beta*MUB has a standard deviation of roughly 1.5 %; if a
  third to a half of a 2-sigma shock reverts within the week, gross per event is about 1.0-1.5 % against an estimated
  round trip of 0.2-0.6 % for funds trading at least 1 million USD a day plus a few bps for the MUB hedge. With
  about 2-3 open slots on average (long 15-20 %, gross 35-45 %), that would be roughly 1-3 % a year over T-bills
  at low volatility; if the true reversal is a quarter of the shock, net is near zero and the card dies on cost,
  which is informative too. Expected events: about 28 eligible funds x 4-8 events a year x 12 years = 1,300-2,700
  events on several hundred dates (G1 minimum 200 events on 30 dates); the first signals come about 250 sessions
  after MUB''s first price (K-0075), so the event study covers roughly late 2008 to 2020. Instrument choice: national
  (not single-state) municipal CEFs of the large sponsors (Nuveen, BlackRock, Eaton Vance, PIMCO, Invesco, DWS,
  Western, MFS, BNY) that were listed before MUB; high-yield muni funds (NMZ, MUA) were left out because their credit
  news is not in MUB''s investment-grade price. The list was picked by category and listing date, not by performance;
  it leans to funds that still exist (acquired funds dropped out), a mild survivorship that matters little for a
  relative reversal but should be named. If the checker rejects tickers that are absent from the dataset, they are
  removed, not replaced by hand-picked ones. Risks the Skeptic should check: (1) persistent discount blowouts (fund
  deleveraging when leverage becomes unavailable or expensive) where many funds trigger together and keep falling
  for weeks; the 5-slot cap limits but does not remove that, and the concentration criterion above is the kill condition;
  (2) fund- specific news (distribution cuts, mergers, rights offerings) that looks like a discount shock but is
  information and does not revert, which dilutes the effect; (3) the beta to MUB is estimated from weekly returns
  to absorb non-synchronous trading in thin funds; (4) shorting MUB is cheap to borrow, but no fund is ever shorted,
  so CEF borrow costs do not arise. ETFs have no forward data, so G4 is the ceiling. Requested report beside the
  G1 metrics, if the framework allows: event counts by year, and the abnormal return split by whether many funds
  (5 or more) triggered on the same date or few, to separate single-fund order-flow shocks from market-wide discount
  episodes.'
