mechanism:
  counterparty: Retail and advisor-driven sellers of muni CEFs who sell at the market price regardless of NAV (tax-loss
    selling, distribution-cut fears, redemption from income model portfolios), paying a temporary concession to
    whoever absorbs the shares.
  why: 'A closed-end fund (CEF) cannot be created or redeemed, so its price is set only by its own exchange order
    flow, which for national municipal CEFs is overwhelmingly retail (tax-motivated income buyers, advisors'' model
    portfolios). When a burst of retail selling (distribution worries, tax-loss selling, rate scares, advisor rebalancing)
    hits one fund, its price falls relative to the value of the bonds it holds and the discount widens; nothing
    forces it back except other investors stepping in, who demand a concession for holding a levered, illiquid wrapper.
    The open-end muni ETF MUB is the cross-market value anchor: its price is held to the muni bond market by authorized-participant
    creation/redemption, so a CEF move that MUB (scaled by the fund''s own beta, which carries its leverage and
    duration) does not explain is mostly a discount shock, i.e. wrapper order flow rather than bond-market news.
    The claim: such discount shocks partly revert over the following week as the selling exhausts and discount-value
    buyers and market makers unload inventory (Lee, Shleifer and Thaler 1991: discounts are driven by individual-investor
    sentiment; Pontiff 1996: arbitrage of CEF mispricing is costly and therefore incomplete, so deviations persist
    long enough to be harvested by a patient liquidity provider).'
  why_not_arbitraged: No creation/redemption mechanism; the only arbitrage is to buy the fund and short its holdings,
    but the holdings are thousands of illiquid muni bonds that cannot be shorted, so arbitrageurs carry the full
    discount (noise-trader) risk and the funds' leverage. Muni CEFs are small (a few million dollars of daily volume
    each), below the capacity of most hedge funds, and munis are tax-advantaged assets that taxable arbitrageurs
    value less. Discount risk is correlated across funds in stress, which limits how much capital any liquidity
    provider commits.
signal:
  description: 'Daily decisions after the close of day t using data up to that close; trades at the open of day
    t+1. Returns are the dataset''s total returns (ret_co and ret_oc compounded), so monthly distributions do not
    create false signals. Eligible CEF on day t: listed and tradable, at least 250 sessions of joint return history
    with MUB, and 63-session median dollar volume of at least 1,000,000 USD; otherwise it is ignored (missing data
    for a listed instrument must raise, not be skipped silently). MUB is never an event, only the anchor and the
    hedge. (1) Beta: beta_i = OLS slope of the fund''s non-overlapping 5-session total returns on MUB''s over the
    last 250 sessions (50 observations), clipped to [0.5, 1.75]. (2) Gap: e_i(t) = R_i(t-k+1..t) - beta_i * R_MUB(t-k+1..t),
    the fund''s k-session compounded return minus beta times MUB''s over the same k sessions, k = formation_days.
    (3) Scale: sigma_i = standard deviation of the same k-session gap over the previous 250 sessions (overlapping
    windows ending t-1 and earlier). z_i = e_i(t) / sigma_i. (4) Event: z_i <= -z_entry and the fund has no open
    slot. (5) Book: each event opens a slot at the open of t+1: long the fund with weight 0.07 and short MUB with
    weight beta_i * 0.07; the slot is held 5 sessions (through the close of t+5) and closed at the open of t+6 (decision
    after the close of t+5). At most 5 open slots; if more funds trigger than free slots, take the most negative
    z first. Total MUB short = sum of open slots'' hedges (maximum gross 5 * 0.07 * 2.75 = 0.96 <= 1). No other
    positions; the rest is cash. A fund that stops being listed or tradable during its slot is closed at the first
    open where it can be traded (or its last price if delisted); its hedge is closed at the same time. No date literals,
    no instruments outside the list.'
