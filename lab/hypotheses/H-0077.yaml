    the gap's own trailing 250-session volatility), with the fund liquid (63-session median dollar volume >= 1 million
    USD) and not already in an open event; side +1 (the fund should outperform the other funds and MUB afterwards).
    Unmarked peers on the same date are the other eligible funds and MUB.
