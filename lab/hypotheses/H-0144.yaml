falsification_criteria:
- 'Mechanism: the 56-day side-adjusted abnormal return of top-fifth entrants is not above the 95th percentile of
  the time-shifted placebos, or is below the round-trip cost.'
- 'Mechanism: the placebo mean is at or above the event mean (the score picks persistent coin identity, not life-cycle
  timing).'
- 'Mechanism: the latest third of dev (about 2021-03 to 2022-12) is wrong-signed; with the first third expected
  to be nearly empty from model warm-up, both later thirds must be positive.'
- Net Sharpe on dev below BTC_HOLD + 0.10, or the bootstrap bound of the Sharpe difference at or below zero.
- Fewer than 75 % of the neighbors of n_estimators 100 and top 0.2 beat BTC_HOLD, or the book fails at doubled costs.
- 'A ridge on the same five features (framework ridge, same label, schedule and book) gives the same or a better
  event result or Sharpe: the interaction is not what pays, and the result is plain trend or volatility ranking.'
notes: 'Brief fit: the brief asks for a 6-24 month horizon, but the schema caps ml.horizon_days and the mechanism
  horizon at 60, and horizon_days must equal the holding period. The closest fit is a half-year formation window
  (trend, stage, vtrend all read 6 months of history) with an 8-week (56-row) label and hold, which also equals
  the mechanism primary horizon. Data size: top-50 coins, 2018-2022, tens of thousands of coin-days per refit but
  strongly autocorrelated through overlapping 56-day labels; the model is kept small (8 leaves, 400 minimum leaf
  samples, 50-200 trees) for that reason. Family: the features are past returns and volume, so this is filed under
  cross-sectional-momentum with its trial count, not under a new name; the late-stage reversal leg could also be
  read as long-term-reversal. Difference from earlier cards: study 9 tested plain weekly altcoin momentum; H-0134
  crossed one-month momentum with perp basis in a dollar-neutral perp book and used gbm-vs-ridge disagreement as
  its event; H-0135 sorted on nearness to the one-year high and died on coin identity. Here the event is entry into
  the model''s top fifth (not every holding, to reduce identity), the state variables are run stage and volume trend,
  the hold is two months and the book is long-only with BTC as filler, so the comparison with BTC_HOLD isolates
  the picks and the warm-up period (BTC held) neither helps nor hurts. Forecasts (K-0120): scored members about
  20 in late 2018 rising to 50 from 2019; top fifth about 4-10 coins; new entrants about 2-4 per week; first scores
  expected around early 2019 (labels need 56 days, features 180 days, plus the framework minimum sample), so about
  180 weekly decision dates with scores and roughly 350-700 entrant events on 150-185 dates; the first third of
  dev will be nearly empty (K-0163). Round trip for the weaker top-50 spot pairs is perhaps 40-100 bps under crypto_spot_tiers;
  the cost check needs a 56-day gross per entrant above that, which a rank IC of a few hundredths on 56-day dispersions
  of tens of percent would give. Book: always fully invested, about 1/8 of the book replaced weekly before netting,
  annual one-way turnover at most about 6x, so cost drag of a few percent a year at most. Beta gap (K-0074): entrants
  are likely higher-volatility alts than the average member, so the raw event study will lean positive in up-markets
  and negative in the 2022 bear; the latest-third criterion is set to catch that. If the ridge on the same features
  does as well, the lab should conclude that a plain trend or volatility rank is what the data shows and file the
  linear card as the primary claim (K-0182); if neither passes, crypto intermediate-horizon momentum, conditioned
  or not, has its first scored verdict. Requests to the judge if possible: event average split by side of the market
  (BTC up vs down 56 days) and the ridge event result next to the gbm (K-0135). No WebSearch used; both references
  are standard Journal of Finance papers.'
