id: H-0144
version: 1
title: Momentum life cycle in liquid crypto, learned - Binance spot top-50 long-only, weekly 8-week sleeves of the
  top fifth of a LightGBM score on 6-month trend x run stage x volume trend, BTC as filler
author_agent: scout
family: cross-sectional-momentum
asset_classes:
- crypto_spot
universe:
  kind: crypto_top_n
  n: 50
mechanism:
  counterparty: Late retail trend-chasers who buy faded winners after the volume peak, and early holders who sell
    early-stage winners while attention is still arriving (disposition). The spot book collects the continuation
    side and avoids the faded side.
  why: 'Attention-driven trends in liquid altcoins have a life cycle. A coin whose half-year trend is still being
    joined (trading volume rising against its own half-year average, price near its formation-period peak) keeps
    outperforming its peers over the next weeks, because new buyers arrive slowly through social channels and exchange
    listings and early holders sell too soon (Hong and Stein 1999: slow diffusion plus momentum traders, then overshoot).
    A coin whose run is mature (volume fading from its peak, price already well below its formation-period high)
    underperforms, because the marginal buyer is a late extrapolator buying the dip of an exhausted story while
    early holders, teams and funds distribute into the remaining liquidity. Lee and Swaminathan (2000) show in stocks
    that past volume tells early-stage from late-stage momentum and so sets both the sign and the persistence of
    the past-return effect. The claim here is the crypto analogue at a two-month horizon: the sign of the 6-month
    trend effect depends on run stage and volume trend, so only the interaction ranks coins, not the trend alone
    (which study 9 and H-0134 found empty in plain or basis-crossed form).'
  why_not_arbitraged: 'The faded side can hardly be shorted: many top-50 spot coins have no perp or an expensive,
    squeeze-prone one, and short sellers face momentum crashes in a market with 100-200 % annual volatility. Crypto
    funds are mostly long-only or BTC-benchmarked by mandate, and the effect needs months of holding through large
    drawdowns, which limits the capital that trades it.'
signal:
  description: 'Universe and timing: Binance spot USDT pairs, point-in-time top 50 by 30-day quote volume (framework
    crypto_top_n). Decisions after the 00:00 UTC daily close of the first row of each ISO week (weekly), using data
    up to that close; trades at the next open. Features per coin and row t, from the coin''s own ret_co, ret_oc,
    close and quote_volume up to the close of t, each z-scored across the scored members of that row by the framework
    helper: (1) trend = log total return from t-180 to t-30; (2) recent = log total return from t-30 to t; (3) stage
    = log(close_t / max close over t-179..t), at most 0; (4) vtrend = log(mean quote volume t-29..t / mean quote
    volume t-179..t); (5) vol90 = standard deviation of daily log total returns over t-89..t. A coin is scored only
    if it is a universe member on row t and has at least 150 valid daily bars in t-179..t; otherwise it gets no
    score (new listings under about half a year are never scored). Non-members are masked per row on all columns,
    never by an ever-member list (K-0134). Label: total return from the next open to the open 56 rows later, ranked
    across the universe on each date (framework label). Model: LightGBM (framework gbm) inside lab.framework.ml.walk_forward,
    expanding window, refit every 56 rows, training only on labels realized by the decision date (framework purge);
    fixed hyperparameters num_leaves 8, learning_rate 0.05, min_child_samples 400, subsample 0.7, colsample 1.0;
    n_estimators from params. Book (score_weights + only_on weekly rows): capital is split into 8 sleeves of 1/8.
    At each weekly decision the sleeve formed 8 weeks earlier is closed and a new sleeve is formed: equal weights
    over the top `top` fraction (rounded down, at least 3 coins) of scored members by model score. If fewer than
    15 members are scored or the model has no fit yet, the new sleeve holds BTCUSDT. Book weight of a coin = sum
    over the 8 live sleeves of 1/8 x its weight in the sleeve; weights change only on weekly decision rows. A sleeve
    position in a coin that has left the universe (or is delisted) is moved to BTCUSDT at the next weekly decision
    row and stays there until the sleeve ends. So the book is always fully invested, and any difference from BTC
    buy-and-hold comes only from the model''s picks.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.1
      - 0.2
      - 0.3
      value: 0.2
  timeframes:
  - 1d
  - 1w
  - 1mo
mechanism_test:
  event: 'A coin enters the top fifth of the model score at a weekly decision date: it is a scored member of the
    PIT top-50 spot universe, ranks in the top `top` fraction of scores on this weekly decision row, and did not
    on the previous weekly decision row; side +1 (should outperform the other members over the next 56 days).'
  horizons:
  - 7
  - 14
  - 28
  - 56
  primary_horizon_days: 56
ml:
  features:
  - 'trend: log total return t-180 to t-30 (6-month formation return skipping the last month), the trend whose sign
    the life cycle is claimed to switch'
  - 'recent: log total return t-30 to t, whether the run is still going or has stalled in the last month'
  - 'stage: log(close_t / max close over the last 180 days), how far below its formation peak the coin trades (fresh
    run vs deflating bubble)'
  - 'vtrend: log(30-day mean quote volume / 180-day mean quote volume), attention arriving (rising) vs exhausted
    (fading)'
  - 'vol90: 90-day realized volatility of daily log total returns, the lottery/hype intensity where the effect should
    concentrate'
  horizon_days: 56
  model: gbm
  retrain_every_days: 56
  why_not_linear: 'A ridge gives the formation return one slope in every state. The life-cycle claim is that this
    slope changes sign with the state: positive (continuation) when vtrend is high and stage is near 0, negative
    (reversal) when vtrend is low and stage is deeply negative, and larger in magnitude in the high-vol90 tail.
    Pooled, the trend slope averages toward zero and a ridge ranks mostly on volatility and volume, so its top fifth
    holds different coins than a shallow tree that can split trend on vtrend and stage. The late extrapolators who
    buy faded winners pay for the reversal side and early sellers of fresh winners pay for the continuation side;
    both live only in the interaction cells.'
