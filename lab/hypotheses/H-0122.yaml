id: H-0122
version: 1
title: Round-number support and resistance, learned - LIQ-500 dollar-neutral daily, LightGBM on the unadjusted close's
  place on the dollar grid, 1-day hold; mechanism = gbm-only vs ridge picks
author_agent: scout
family: round-number-order-clustering
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  counterparty: Liquidity-demanding traders with left-digit bias who sell at a cent or a few cents above a round
    number and buy just below it (the losers in Bhattacharya-Holden-Jacobsen), plus the clustered round-number limit
    orders that keep absorbing flow on the wrong side of the level.
  why: 'Traders treat round prices as reference points. Limit orders (take-profit, stop and plain resting orders,
    largely retail) cluster at whole dollars, and more so at $5, $10, $50 and $100 levels. Liquidity demanders with
    left-digit bias buy just below round numbers and sell just above them (Bhattacharya, Holden and Jacobsen 2012,
    over 100 million US trades). The resting buy orders at the round number just below a close support the price
    during the next session, and the resting sell orders at the round number just above cap it. Stocks that close
    just above a round number should therefore beat stocks that close just below one over the next session. Zhang
    (2024) reports this next-day spread in US stocks. The price information is the UNADJUSTED close: that is the
    number traders see, and no input the lab has tested so far uses it. The claim here is that the effect is (a)
    still present in the most liquid 500 stocks, (b) still there when entering at the next open rather than the
    close, and (c) large enough per entry to pay a taker''s round trip.'
  why_not_arbitraged: The edge per stock is a few to a few dozen basis points over one session. Harvesting it needs
    a full daily rotation of a broad book, which taker costs largely eat. Market makers who see the order book capture
    part of it intraday, but they carry inventory limits and do not hold overnight positions sized to the level.
    The behaviour behind it is a stable cognitive bias, not a strategy that crowds out.
signal:
  description: 'Data: sharadar_sep stocks, point-in-time LIQ-500 members, from the card''s data period start (after
    US decimalization). Decision after the close of day t using data up to that close; trades at the open of t+1.
    Total daily return r_t = (1 + ret_co_t) * (1 + ret_oc_t) - 1 (ret_co = previous close to open, ret_oc = open
    to close). P_t = close_u (unadjusted close). Features per stock and date (six): (1) cents_off = P_t - round(P_t)
    in dollars, in [-0.50, +0.50): the signed distance to the nearest whole dollar (positive = just above it); (2)
    roundness of that nearest whole-dollar level L = round(P_t): 3 if L is a multiple of 50, else 2 if a multiple
    of 10, else 1 if a multiple of 5, else 0; (3) log(P_t); (4) crossing = +1 if close_u_{t-1} < L <= P_t (the level
    was crossed upward today), -1 if close_u_{t-1} >= L > P_t (crossed downward), else 0. Set it to 0 when close_u_t
    / close_u_{t-1} differs from 1 + r_t by more than 1 % (a split or other corporate action moved the unadjusted
    price); (5) r_t, the one-day total return (control for one-day reversal); (6) 21-day realized volatility of
    r (control for how far the price can travel relative to the grid). Features 1, 2 and 4 are positions on an absolute
    price grid and are passed raw. Features 3, 5 and 6 are z-scored across the members of the date with the framework
    helper. A member with any missing feature is not scored. Label: total return from the open of t+1 to the open
    of t+2 (horizon_days 1), ranked across members on each date (framework label). Model: LightGBM (framework gbm),
    num_leaves 15, min_child_samples 200, other settings framework default, n_estimators from params, expanding
    window, refit every 63 rows through lab.framework.ml.walk_forward (its purge and minimum training sample). Book
    (score_weights): each decision day, long the top `top` fraction of scored members by gbm score and short the
    bottom `top` fraction, equal weight within each leg, 0.5 gross per leg (dollar-neutral, gross 1.0), held to
    the next decision. A name that stays in its leg keeps its weight with no trade. Flat on days with fewer than
    100 scored members. Ridge control for the mechanism test (diagnostic only, never traded): framework ridge (alpha
    1.0) on the same six features, rows, label and refit schedule, with its own top and bottom `top` fractions.'
  params:
    n_estimators:
      grid:
      - 50
      - 100
      - 200
      value: 100
    top:
      grid:
      - 0.05
      - 0.1
      - 0.2
      value: 0.1
  timeframes:
  - 1d
mechanism_test:
  event: A LIQ-500 member enters the gbm's long leg (side +1) or short leg (side -1) after the close of day t, i.e.
    it is in the top (bottom) `top` fraction of the gbm score on t and was not in that leg on t-1, AND the ridge
    control on the same features does not place it in the same leg on t. These are the picks only the nonlinear
    model makes, which should be the round-number-grid picks.
  horizons:
  - 1
  - 2
  - 5
  primary_horizon_days: 1
ml:
  features:
  - cents_off - signed distance of the unadjusted close to the nearest whole dollar, in dollars (raw); where on
    the round-number grid the close sits
  - roundness - 0/1/2/3 for an ordinary dollar, multiple of 5, of 10, of 50 (raw); how much limit-order clustering
    to expect at the nearest level
  - log unadjusted close (z-scored); the same cents matter more for a low-priced stock, and whole dollars are not
    salient for high-priced ones
  - crossing - +1/-1/0 if today's close crossed the nearest level upward/downward (raw, 0 on split days); a level
    just crossed becomes support or resistance
  - one-day total return (z-scored); control so that generic one-day reversal is not read as a grid effect
  - 21-day realized volatility of daily total returns (z-scored); scales how much of the next session's range the
    level can hold
  horizon_days: 1
  model: gbm
  retrain_every_days: 63
  why_not_linear: 'The claimed effect is a step at the round number. A close one cent above a salient level is supported,
    one cent below is capped, and the effect dies out toward the middle of the grid. On the cents_off axis it is
    a sawtooth: positive just above zero, negative just below, about zero near +/-0.50, where a close of +0.49 and
    one of -0.51 sit equally far from the next level. Its height should grow with roundness and fall with the price
    level. A ridge on the same six features can only draw a straight line in cents_off. That line wrongly calls
    +0.49 the strongest long and -0.49 the strongest short. It also cannot make the step depend on roundness, price
    or a crossing today, so the ridge''s legs will be driven mostly by one-day reversal and volatility. A tree can
    place a split at cents_off = 0 and condition it on the other features. The left-digit-biased liquidity demanders
    and the clustered limit orders at the level pay for it.'
