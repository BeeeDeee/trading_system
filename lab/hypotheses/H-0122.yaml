falsification_criteria:
- 'Mechanism: the gbm-only leg entries (event below) earn a one-session side-adjusted abnormal return under the
  95th percentile of the time-shifted placebos, or a gross per event below the round-trip cost (expected about 11
  bps in LIQ-500).'
- 'Mechanism, decay: the latest third of the dev period has the wrong sign (K-0060). This is a kill even if the
  pooled test passes.'
- 'Nonlinearity: if the disagreement average is negative (the ridge''s own leg picks beat the gbm''s own picks),
  the round-number grid adds nothing beyond linear reversal and volatility, and the card is refuted, not ''cannot
  tell''. The mirror is dev-selected and not a lead.'
- Net Sharpe on dev below 0.5, or below the T-bill Sharpe + 0.10, or the bootstrap bound of the difference at or
  below zero.
- Neighbors of n_estimators 100 or top 0.1 fail to beat T-bills in at least 75 % of combinations, or the median
  neighbor Sharpe is under 0.7 of the primary.
- Sharpe with doubled costs does not beat T-bills.
- 'Descriptive (Builder report if a channel exists): if gbm leg entries are not concentrated at |cents_off| <= 0.10
  with roundness >= 1 relative to the universe share, the model did not use the grid and the claim was not tested.'
notes: 'Why this is not a near-copy of earlier lab work: it is the first card whose information is the price LEVEL
  (the unadjusted close on the dollar grid). Every earlier stock card used returns, volume, fundamentals, filings
  or calendars. The one-day return is in the feature set as a control, and the event keeps only picks the ridge
  does not make, so the generic reversal of the short-term-reversal family (H-0030, H-0094, H-0115) is netted out
  by design rather than re-tested. It is not 52-week-high anchoring (H-0011, H-0083) either: the reference is a
  fixed price grid common to all stocks, not a stock''s own history, and the claim is about the next session, not
  weeks. Family: a new name because the mechanism is order clustering on a fixed grid (microstructure plus left-digit
  bias), not drift or anchoring to own history. If the Chair prefers to file it under 52-week-high-anchoring, the
  card accepts that. Period: the data period starts 2001-05-01 because US equities quoted in 1/16 and 1/8 ticks
  until decimalization was completed in April 2001. Before that the ''one cent above/below a round number'' grid
  did not exist, and costs carry a x2.5 pre-decimal factor. This date comes from market structure, not from returns.
  The dev thirds are then about 2001-2007, 2007-2014 and 2014-2020. Timing caveat, stated up front: the literature
  measures close-to-close, while the lab enters at the next open. If the support acts through the resting orders
  during the next session, open-to-open keeps most of it. If the overnight gap already moves the price away from
  the level, it is lost. The 1-session horizon tests exactly this. Forecast (K-0120, K-0144, K-0159, K-0165): the
  event is model-defined, so counts are uncertain. Each day about 50 names per leg, perhaps 60-80 % of them new
  (grid positions change daily), and perhaps a third to a half not shared with the ridge. That gives a central 20-40
  events a day, about 80000-180000 over roughly 4700 scored dates. At a call rate a tenth of that there would still
  be well over 200 events on 30 dates. Round trip in LIQ-500 is about 11 bps (K-0165). Gross per event: central
  3 bps, optimistic 12 bps, mechanism-absent case 0 or below. The published spread is about 25 bps a day across
  all US stocks, dominated by low-priced small names, and large caps should carry a fraction of it. The likeliest
  death is therefore the G1 cost check: a real but sub-cost effect. With this many events the placebo bar should
  lie well under cost, so a failure is a real ''not tradable for a taker'', not a power problem. Book arithmetic
  (K-0064, K-0098): gross 1.0 always, mean exposure about 1.0. With daily leg turnover of about 70 %, cost drag
  is roughly 252 x 0.7 x 11 bps, near 19 % a year. The book can clear a 0.5 net Sharpe only if gross per new entry
  is about 15 bps or more, above the optimistic case. A mechanism pass with gross between 11 and 15 bps would still
  fail the strategy gate. That outcome would show a real round-number effect that only a maker could harvest.'
