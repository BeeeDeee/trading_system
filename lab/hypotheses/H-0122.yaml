references:
- cite: 'Bhattacharya, Holden, Jacobsen (2012) Penny Wise, Dollar Foolish: Buy-Sell Imbalances On and Around Round
    Numbers, Management Science 58(2)'
  year: 2012
- cite: 'Zhang (2024) Above Up, Below Down: The Impact of Limit Order Clustering on Stock Price Movements, SSRN
