title: 'Calibration: low-volatility stocks (lowest 20 % by 252-day volatility, monthly)'
family: calibration-lowvol
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  why: 'Calibration card: a known strategy from the literature or from the owner''s earlier studies, run through
    the judge to check that its verdict agrees with what is already known about it.'
  counterparty: calibration, not a real hypothesis
  why_not_arbitraged: calibration, not a real hypothesis
signal:
  description: 'Monthly, after the close of the first trading day: among the members of the universe with at least
    95 % of the lookback listed, rank by the standard deviation of daily total returns over the last lookback_days
    and hold the lowest pct share with equal weights.'
  params:
    lookback_days:
      value: 252
      grid:
      - 126
      - 252
      - 504
    pct:
      value: 0.2
      grid:
      - 0.1
      - 0.2
      - 0.3
data_requirements:
- dataset: sharadar_sep
  frequency: 1d
  period:
  - '1999-01-04'
  - '2020-12-31'
holding_period:
  typical_days: 21
  rebalance: monthly
market_exposure: long_only
falsification_criteria:
- 'Calibration run: the verdict is compared with the expected outcome in expected.yaml.'
references:
- cite: Ang, Hodrick, Xing, Zhang (2006) The cross-section of volatility and expected returns, Journal of Finance
  year: 2006
