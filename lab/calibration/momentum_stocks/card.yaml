title: 'Calibration: 12-1 momentum stocks (top 20 %, monthly)'
family: calibration-momentum
asset_classes:
- us_equity
universe:
  kind: liq_n
  n: 500
mechanism:
  why: 'Calibration card: a known strategy from the literature or from the owner''s earlier studies, run through
    the judge to check that its verdict agrees with what is already known about it.'
  counterparty: calibration, not a real hypothesis
  why_not_arbitraged: calibration, not a real hypothesis
signal:
  description: 'Monthly, after the close of the first trading day: among the universe members, rank by the total
    return from t-lookback_days to t-21 days and hold the top pct share with equal weights.'
  params:
    lookback_days:
      value: 252
      grid:
      - 189
      - 252
      - 315
    pct:
      value: 0.2
      grid:
      - 0.1
      - 0.2
      - 0.3
data_requirements:
- dataset: sharadar_sep
  frequency: 1d
  period:
  - '1999-01-04'
  - '2020-12-31'
holding_period:
  typical_days: 21
  rebalance: monthly
market_exposure: long_only
falsification_criteria:
- 'Calibration run: the verdict is compared with the expected outcome in expected.yaml.'
references:
- cite: Jegadeesh, Titman (1993) Returns to buying winners and selling losers, Journal of Finance
  year: 1993
