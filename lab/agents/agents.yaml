# Headless agent definitions (framework-owned; agents never edit this file).
#
# The orchestrator runs `claude -p` with the agent's prompt as the whole system prompt, the workspace as cwd,
# only the tools listed here, and `--permission-mode dontAsk` (anything not allowed is denied). After the run the
# transcript is audited: a tool call outside the workspace or a Bash command other than `lab <allowed verb>`
# rejects the whole outbox (PLAN §5, soft layer; the OS users of step 4 are the hard layer).
#
# context: framework files copied into the workspace before the run (see lab/framework/agents.py).
# Models and budget: decision Q4 (Opus for Scout, Builder, Skeptic; Sonnet for the rest).

defaults:
  timeout_s: 900
  effort: high
  tools: [Read, Write, Edit, Glob, Grep, Bash]
  lab_verbs: [send, check, inbox, context]

agents:
  scout:
    model: claude-opus-5-5
    prompt: scout.md
    tools: [Read, Write, Edit, Glob, Grep, Bash, WebSearch]   # literature search; no WebFetch (data-blind)
    timeout_s: 1500   # 16 of 107 runs hit the default 900 s (2026-10-05..11-01), in clusters
    context: [factsheets, prior_studies, lessons, knowledge, card_schema, card_example, card_example_ml, gates]

  builder:
    model: claude-opus-5-5
    prompt: builder.md
    tools: [Read, Write, Edit, Glob, Grep, Bash]
    lab_verbs: [send, try, inbox, context]
    timeout_s: 1500
    context: [gates, knowledge]

  skeptic:
    model: claude-opus-5-5
    prompt: skeptic.md
    tools: [Read, Write, Edit, Glob, Grep, Bash, WebSearch]   # WebSearch: references, publication dates
    lab_verbs: [send, try, inbox, context]
    timeout_s: 1500
    context: [gates, history, family, prior_studies, knowledge]

  archivist:
    model: claude-sonnet-5-5
    prompt: archivist.md
    tools: [Read, Write, Edit, Glob, Grep, Bash, WebSearch, WebFetch]   # WebFetch for API docs (data-blind by rule)
    lab_verbs: [send, fetch, inbox, context]
    timeout_s: 3000   # 1500 s was not enough either (3 timeouts 2026-11-01), once the Bash backgrounding was fixed
    context: [blocked, knowledge]

  librarian:
    model: claude-sonnet-5-5
    prompt: librarian.md
    tools: [Read, Write, Edit, Glob, Grep, Bash]
    lab_verbs: [send, inbox, context]
    timeout_s: 1200
    context: [cases, lessons, knowledge, prior_studies]

  chair:
    model: claude-sonnet-5-5
    prompt: chair.md
    tools: [Read, Write, Edit, Glob, Grep, Bash]
    lab_verbs: [send, inbox, context]
    timeout_s: 900
    context: [families, lessons, knowledge, prior_studies]

  steward:
    model: claude-sonnet-5-5
    prompt: steward.md
    tools: [Read, Write, Edit, Glob, Grep, Bash]
    lab_verbs: [send, inbox, context]
    timeout_s: 900
    context: [paper, knowledge, lessons]
