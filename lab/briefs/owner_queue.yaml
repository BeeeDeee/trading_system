# Owner queue: ideas the owner wants tested, taken by the Scout one per `propose` run, in this order, before the
# diversity brief (lab/framework/briefs.py: owner_seed). An entry is done once a card has `owner_seed: <id>` in its
# notes. Add `skip: true` to take an entry out. Append new entries at the end; never reuse an id.
#
# 2026-11-10, ORB batch: hypotheses from the owner's literature review "ORB strategie hypotezy a validace"
# (reports/ in the owner's workspace). Only the crypto analogues are queued: the lab has no US intraday stock,
# ETF or index-futures data, so the US-equity ORB hypotheses (MNQ/NQ volatility-conditioned ORB, relative-volume
# stocks in play, news-catalyst filter, long/short asymmetry, LLM news filter) wait for an owner data decision.
# All entries share ONE family (us-open-range-breakout-crypto) so their trials count together in the DSR.
#
# Shared background for every entry (from the review; treat as priors, not as facts about this data):
# - No credible published test of an opening-range breakout on BTC exists; only anecdotal backtests.
# - On US stocks/ETFs the gross ORB edge in independent replications is small (about +0.05..0.13 R per trade on
#   index ETFs) and of the same size as round-trip costs; the "stocks in play" version decayed after 2023.
# - The most consistent conditioning variable across studies is the volatility state (ORB profits cluster in
#   high-volatility regimes; Lundstrom: 150-200 bp/day difference between top and bottom volatility states).
# - BTC volatility clusters around the US cash open: the most volatile UTC hour tracks 09:30 ET (13:30 UTC in
#   US daylight time, 14:30 UTC in standard time), and US hours carry about half of daily variance in 2022-2025.
# - Costs: a scalp pays two taker fees plus slippage (at least ~13 bps round trip on BTC in this lab's engine), so
#   only a few large moves per day can pay; expect the base rule to fail and say so in the forecasts.

- id: ORB-C1
  title: US-open range breakout on BTC/ETH perps (base rule)
  text: |
    Opening range anchored at the US equity cash open, 09:30 America/New_York (DST-aware: 13:30 UTC in US daylight
    time, 14:30 UTC in standard time; use the `times` of the intraday view, never a fixed UTC hour). Data:
    binance_perp_15m (5m only if truly needed). Instruments: BTCUSDT.P and ETHUSDT.P (or crypto_top_n with small n).
    Range = high/low of the first 15 or 30 minutes after 09:30 ET (grid). Entry: the first candle that CLOSES
    beyond the range, filled at the next open (no fills at the range boundary), long above / short below, one
    trade per instrument per day. Exit: at the 16:00 ET close of the US session, or earlier when a candle closes
    beyond the opposite side of the range (grid: with that stop / without a stop, end of session only). These
    exit variants are the exit-design question from the review; keep them inside this card's grid, not as
    separate cards. Control the owner wants reported in notes or falsification: the same rule anchored at
    00:00 UTC (and/or a random anchor hour); if the 00:00 UTC anchor works as well, the US-open claim is wrong.
    Family: us-open-range-breakout-crypto.

- id: ORB-C2
  title: US-open range breakout on BTC/ETH only in high-volatility states
  text: |
    The ORB-C1 rule, traded only on days whose volatility state is high, decided with data available before the
    entry: e.g. the trailing realized volatility of the previous days in its own top tercile of a trailing window,
    or the opening-range width relative to its trailing average of the same window above a threshold (pick one
    measure, small grid, no fishing). Mechanism to argue: ORB is a bet on trend days, and trend days are far more
    frequent in high-volatility regimes (Lundstrom; Gao et al. find stronger intraday momentum on high-volatility
    days). Falsification must include: the high-volatility subset is not better per trade than the low-volatility
    subset. Family: us-open-range-breakout-crypto.

- id: ORB-C3
  title: US-open range breakout on BTC/ETH after daily range contraction (NR4/NR7)
  text: |
    The ORB-C1 rule, traded only on days that follow a narrow-range day on the 00:00 UTC daily bar built from the
    intraday candles (NR4 or NR7: the previous day's high-low range is the smallest of the last 4 / 7 days; grid
    over 4/7). Mechanism to argue: Crabel-style volatility contraction precedes range expansion. Prior: Crabel's
    1990 results are unverifiable and gross; modern re-tests are mixed. Falsification must include: the post-NR
    days do not have larger absolute session moves than other days. Family: us-open-range-breakout-crypto.

- id: ORB-C4
  title: US-open range breakout on BTC/ETH aligned with the pre-session move
  text: |
    The ORB-C1 rule, taken only when the breakout direction agrees with the move from 00:00 UTC to the 09:30 ET
    open (Asia + Europe session); the crypto analogue of "trade the ORB in the direction of the gap". The card
    must also report the opposite (breakouts against the pre-session move) as the control: the review found gap
    fade (attention overshoot) and gap continuation (news) both have support, so the sign is an open question.
    Family: us-open-range-breakout-crypto.

- id: ORB-C5
  title: US-open range breakout on BTC/ETH on US macro release days
  text: |
    The ORB-C1 rule, traded only on US macro release days (CPI and employment report at 08:30 ET, FOMC at 14:00 ET)
    from the dataset macro_release_calendar_1d, if the intraday branch can read it as a signal-only series; if
    it cannot, write the card anyway (BLOCKED_DATA) and say what is missing. Mechanism to argue: macro news days
    have stronger intraday momentum in equity indices (Gao et al.); BTC reacts to US macro news mainly after
    2020. For FOMC days consider whether the 09:30 ET range is the right anchor or the 14:00 ET release is.
    Expect few events (about 30 per year): state the power problem in the forecasts. Family:
    us-open-range-breakout-crypto.

- id: ORB-C6
  title: US-open range breakout on the altcoins "in play" by opening relative volume
  text: |
    Crypto analogue of the "stocks in play" ORB (Zarattini, Barbon & Aziz 2024): universe crypto_top_n
    (n about 20-30) on binance_perp_15m. At the end of the 09:30 ET opening range, rank coins by relative volume
    = quote volume of the opening-range window divided by the average quote volume of the same window on the
    previous 10-20 days (point in time); trade the ORB-C1 rule only on the top 3-5 coins with relative volume
    above a threshold (e.g. 2x; small grid). Prior: the equity version had Sharpe 2.81 in-sample 2016-2023 with
    no slippage, and a pre-registered out-of-sample test found it negative after 2023 even before costs; altcoin
    costs are higher than BTC (the engine's liquidity tiers), so the gross move must be large. Family:
    us-open-range-breakout-crypto.

# 2026-11-12, VWAP Wave batch: the four setups of the leaflet "VWAP Wave - Core Setup Guide" (Chris Drysdale,
# Drysdale Trading Group, 7 pages; written for ES 5m, discretionary, NO performance numbers in the document; the
# owner wants an honest test of a strategy that is marketed as very profitable). The lab has no US index intraday
# data, so these are crypto analogues on binance_perp_5m, instruments BTCUSDT.P and ETHUSDT.P only (also keeps the
# 5m panel small enough for the judge's MemoryMax at G4). All entries share ONE family (session-vwap-bands-crypto).
#
# Shared definitions for every entry (write them into the card exactly; they mirror qlab research 23, prereg v1.0.1
# in strategy_backtester_2026_sep/docs/research23/PREREGISTRATION.md):
# - Session = UTC day, anchor 00:00 UTC (TradingView's "Session" VWAP anchor on crypto). Candle price
#   p = quote_volume / volume (exact candle VWAP; (h+l+c)/3 when volume is 0). From the session start to candle t:
#   V = sum(v*p)/sum(v), sigma = sqrt(sum(v*p^2)/sum(v) - V^2). Bands U = V + k*sigma, L = V - k*sigma; the
#   "value area" is [L, U]; k = 1 (k = 2 as the neighbour). Everything uses candles closed up to t.
# - ATR = mean true range of the last 14 candles; stop buffer 0.25*ATR ("a few points"); band proximity
#   tol = 0.1*k*sigma ("band area"). Entries only at session positions 6..275 (not in the first 30 minutes, when
#   the bands are degenerate, nor in the last hour). Every position is flat at the end of the session (23:55 UTC).
# - Both sides are traded (short = mirror of long). "Strength" = a close above the high of the reference candle.
# - The lab engine decides at closes, so stops and targets are checked on candle closes (exit at the next open);
#   say so in the card as a deviation from the leaflet (intrabar stops).
# - Priors: qlab research 15/16 found that holds under ~2 days on BTC/ETH lose to ~15 bps round-trip costs in every
#   family tested; the typical target here is 0.2-0.6 % on BTC. Forecast honestly that the base rules fail.
#   Contamination (write it in every card's notes): qlab research 23 (2026-11-12) already ran these exact rules on
#   BTC/ETH 5m over 2020-2022, the lab's dev period, and rejected all four setups at its dev gate. The 2023-2026
#   holdout was NOT opened, so the lab's G4 period is still unseen for these rules. The lab run is an independent
#   check with a different engine (close-based stops, fill at the next open, lab cost tiers), not a fresh test.

- id: VWAP-C1
  title: VWAP Wave setup 1 - price discovery continuation after acceptance outside the value area (BTC/ETH 5m)
  text: |
    Long side (short mirrored). Breakout = close > U. Acceptance = 3 closes > U in a row OR one close >= V +
    (k+0.5)*sigma. After acceptance, a backtest candle b has low <= U + tol AND close >= U - tol; a newer backtest
    candle replaces b. Entry signal = the first close above high[b] within the 6 candles after b. A close below V
    cancels the acceptance and any pending backtest. Stop = lowest low since b - 0.25*ATR. Grid: exit
    {end of session only (leaflet: "let the trade breathe"), target 2R}, entry {backtest as above, aggressive =
    the first close > U after a close <= U, stop low[t] - 0.25*ATR}, k {1, 2} only around the primary
    (backtest + end of session). Mechanism to argue: acceptance outside value means the auction moved to new
    prices, so the pullback to the old value edge is bought by the participants who accept the new prices. Control
    the owner wants: the same trades with random entry candles on the same day, same side and same stop distance;
    if those do as well, the setup has no timing edge. Family: session-vwap-bands-crypto.

- id: VWAP-C2
  title: VWAP Wave setup 2 - fade the value area extremes after time inside value (BTC/ETH 5m)
  text: |
    Long at the lower band (short at the upper band mirrored). Context: the 6 closes before t were all inside
    [L, U]. Test candle b: low <= L + tol and close >= L. Entry signal = the first close above high[b] within 3
    candles after b (a close below L cancels: the band broke). Stop = lowest low since b - 0.25*ATR. Target =
    V at the signal (leaflet: "VWAP serves as a key magnet") or, as the grid alternative, the opposite band U at
    the signal. Second entry variant: enter right at the close of the test candle b (stop low[b] - 0.25*ATR).
    Mechanism to argue: on balanced (rotational) days the value-area edges are where responsive sellers/buyers
    take the other side. Falsification must include: the fade loses on days that later trend (report by the
    day's range terciles) and the same trades at random times of the same day do as well. Family:
    session-vwap-bands-crypto.

- id: VWAP-C3
  title: VWAP Wave setup 3 - return to value after an excursion outside the bands (BTC/ETH 5m)
  text: |
    Long side (short mirrored). Excursion = at least 3 closes < L in a row, during which some low <= L - 0.5*sigma
    (time AND distance). Return = the first close >= L after it. Conservative entry: after at least 2 closes >= L
    since the return, a pullback candle b with low <= L + tol (close >= L); entry signal = the first close above
    high[b] within 6 candles; a close < L cancels (back outside); the return expires 24 candles after it; one trade
    per return. Stop = lowest low since b - 0.25*ATR. Aggressive entry (grid): at the return candle itself, stop
    low[t] - 0.25*ATR. Target = V at the signal, or the opposite band U (grid). Mechanism to argue: failed price
    discovery (price rejected outside value) rotates back through value toward VWAP. Family:
    session-vwap-bands-crypto.

- id: VWAP-C4
  title: VWAP Wave setup 4 - VWAP bounce after a return into value (BTC/ETH 5m)
  text: |
    Context: within the last 24 candles price returned into value (a close inside [L, U] right after a close
    outside either band). Long (short mirrored): the previous close is inside value and above V; test candle b has
    low <= V + tol and close > V. Entry signal = the first close above high[b] within 3 candles (a close < V
    cancels). Stop = lowest low since b - 0.25*ATR. Target = the band U at the signal, or 2R (grid). Second entry
    variant: at the close of the test candle. The leaflet claims "higher volatility days are better" for this setup:
    report the result by terciles of ATR/price at entry and say whether the claim holds. Mechanism to argue: VWAP is
    the session's average cost; after a return into value, a hold of VWAP shows which side controls the rotation.
    Expect traps (the leaflet itself warns of VWAP break-and-reclaim games). Family: session-vwap-bands-crypto.

# 2026-11-23, G2 follow-up batch: variants and combinations of the cards that reached G2 (owner's request). Seven
# of 198 cards reached G2 (H-0007, H-0035, H-0040, H-0063, H-0139, H-0193; H-0113 also passed G2 and failed G3).
# Rules for every entry (write them into the card and the notes):
# - The parents were picked BECAUSE they did well on dev, so every card here is post hoc. `families:` of the entry
#   is binding (the tick checks it): the first name is the card's family, the others go to related_families, and
#   their trials count in G3/G4. A new family name to escape the penalty is refused.
# - Do not move the parent's parameters inside or next to the parent's grid; that is exactly what G2 already
#   tested. A variant changes the FORM of the signal (continuous instead of a hard threshold, a different measure
#   of the same mechanism), argued from the mechanism, and names in notes the parent G2 failure it addresses and
#   why the mechanism says it should not recur.
# - Write `parent: H-xxxx` in notes. Forecast honestly: the base rate of this lab is about 1 card in 30 past G1.
# - Families of short-term-reversal (110 trials, H-0007/H-0035/H-0063/H-0139 all count there after merges) are left
#   out on purpose: the DSR hurdle there is too high for a variant to be worth a run.
# - G2C-* combinations are stage 2 (`skip: true`): the owner releases them only if their components hold up.
#   Weights are fixed before any run (equal risk per sleeve), never chosen from how the sleeves fit in dev.
# Stop rule: if nothing of this batch passes G3, the line is closed and recorded with `lab knowledge add`.

- id: G2V-1
  title: Insider buying relative to firm size, cross-sectional rank (variant of H-0193)
  families: [insider-purchase-information]
  text: |
    Parent H-0193 (rejected at G2): the event "trailing 91-day insider buying crosses $X" worked at one threshold
    only (the neighbours did not), and most of the return came from the first third of dev. A fixed dollar
    threshold mixes firm size into the signal: $500k is a large bet for a small LIQ-500 member and noise for a
    mega cap. Variant: no dollar threshold. Signal = ins_buy_value_91d / market capitalisation (sf1 marketcap as
    attached; never sharesbas x close_u, see K-0168), only for stocks with a new purchase filing in the last
    week. Weekly, LIQ-500, long the top fifth of that ratio among stocks with a filing, short a liquid hedge
    basket (market neutral, like the parent). Optionally subtract insider selling (ins_sell_value_91d) in the
    numerator (one choice, argue it). Mechanism: the informative part of an insider purchase is the insider's
    wealth at risk relative to the firm, which a relative measure captures and a dollar threshold does not.
    Falsification must include: the effect is absent in the last third of dev (the parent's failure), and the
    top fifth does not beat the bottom fifth of the same ratio. Family: insider-purchase-information.

- id: G2V-2
  title: Quarterly index share-update pressure, rule-based and market neutral (variant of H-0113)
  families: [index-inclusion-price-pressure]
  text: |
    Parent H-0113 (passed G2, failed G3 with DSR 0.51): an S&P 500 core switched before each quarterly rebalance
    into LightGBM-scored pending share changes. Two problems: its share counts were split-inconsistent (K-0168:
    sf1 sharesbas is split-adjusted to the end of the data, close_u is not, so their product is look-ahead), and
    the edge was a thin excess over an SPY core, so the DSR hurdle buried it. Variant: no learned model and no
    index core. In the 5 sessions before each quarterly rebalance (same calendar rule as the parent), long the
    members with the largest pending share-count increase and short those with the largest decrease, measured
    point in time from sf1 marketcap / price consistently (never sharesbas x close_u), dollar neutral, S&P 500
    members only. Mechanism: index trackers buy the increases and sell the decreases at the rebalance close
    whatever the price. Falsification must include: the long-short spread is absent outside the pre-rebalance
    window (placebo weeks), and the decrease leg alone shows no pressure. Family: index-inclusion-price-pressure.

- id: G2V-3
  title: BTC-led catch-up sized by the expected catch-up, no hard thresholds (variant of H-0040)
  families: [btc-lead-altcoin-lag]
  text: |
    Parent H-0040 (rejected at G2): long altcoins that moved less than half as much as BTC after a 3-sigma
    1-hour BTC jump; the neighbours of the sigma threshold were weaker (median ratio 0.62). Two hard cut-offs
    (the jump size and the "less than half" rule) make the book depend on where they sit. Variant: after every
    closed 15m candle, the expected catch-up of altcoin j = beta_j * r_BTC(1h) - r_j(1h), with beta_j from a
    trailing window ending before the candle; trade only when the BTC move is large relative to its own
    volatility (one threshold, argued), weight positions in proportion to the expected catch-up, both sides
    (also short altcoins that overshot a BTC drop), same universe rule as the parent (ETH excluded). Note: qlab
    research 17 (LEAD on altcoins) is a related rule in a forward test until 2027-03-31; this card does not
    touch that test and must say how it differs. Falsification must include: realised catch-up does not grow with
    the expected catch-up (top vs bottom tercile). Family: btc-lead-altcoin-lag.

- id: G2C-1
  title: Equal-risk blend of US equity event books - insider buying and index share-update pressure
  families: [us-equity-event-blend, insider-purchase-information, index-inclusion-price-pressure]
  skip: true   # stage 2: release only if G2V-1 and G2V-2 both pass G1
  text: |
    Combination of the cards from G2V-1 and G2V-2 exactly as they were specified (no change to either rule).
    Universe: LIQ-500 (the index sleeve keeps only S&P 500 members inside it). Each sleeve is scaled to the same
    ex-ante volatility from a trailing window; weights are fixed before any run. Mechanism: two different
    counterparties (outside holders ignoring insiders, index trackers at the rebalance) whose events rarely
    coincide in time, so the blend should be steadier than each sleeve, not stronger per trade. Falsification
    must include: the blend's Sharpe is not above the better sleeve's, or the correlation of the sleeves is
    above 0.5. Family: us-equity-event-blend; related_families: insider-purchase-information,
    index-inclusion-price-pressure.

- id: G2C-2
  title: Equal-risk blend of crypto perp event books - BTC-led catch-up and US-open narrow-range breakout
  families: [crypto-perp-event-blend, btc-lead-altcoin-lag, short-term-reversal]
  skip: true   # stage 2: release only if G2V-3 passes G1; it carries the 110-trial short-term-reversal penalty
  text: |
    Combination of the G2V-3 card and H-0139 (US-open range breakout on BTC/ETH after an NR4 day, unchanged) on
    binance_perp_15m. Each sleeve scaled to the same ex-ante volatility from a trailing window, weights fixed
    before any run. Mechanism: market-wide information diffusing from BTC versus stop flows at the US open; the
    events are rarely at the same time. Falsification must include: the blend's Sharpe is not above the better
    sleeve's. Family: crypto-perp-event-blend; related_families: btc-lead-altcoin-lag, short-term-reversal.
