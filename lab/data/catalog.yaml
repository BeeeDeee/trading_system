      - "Consumed: research 15 used BTC/ETH and the basket 2020-2026 at 15m (the 5m panel itself is untouched by research)."
      - "Cross-checked against the 15m panel (BTC): open, close and volume agree on all but 1-4 of 236,640 15m candles (gap rows)."

