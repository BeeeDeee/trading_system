  - id: binance_perp_1d
    loader: true
    asset_class: crypto_perp
    instruments: "389 Binance USD-M perpetuals that have a spot pair (research 8 panel, 2019-12 .. 2026-09); ids <SYMBOL>.P, e.g. BTCUSDT.P. extras: funding (daily sum of funding rates, a signal), funding_paid (charged by the engine: longs pay, shorts receive), basis (perp/spot - 1)"
    frequency: 1d
    range: ["2019-12-01", "2026-09-30"]
    clock: crypto
    calendar: "24/7 (UTC days)"
    source: "data.binance.vision (free), snapshot binance_2026-10-03"
    location: "strategy_backtester_2026_sep/data/raw/binance_2026-10-03/{perp_1d,mark_1d}"
    quality: "research 8 audit"
    holdout_from: "2023-01-01"
    cost_model: crypto_perp_tiers
    forward_source: binance_public_api
    known_biases:
      - "Same survivorship and venue caveats as spot; only perps with a spot pair are in the panel."
      - "Funding regime change after mid-2024 (Ethena, basis trade crowding); research 8 used this data 2020-2026."
      - "No liquidation model: with gross <= 1 a perp position is fully collateralized, so liquidation does not occur."

  - id: binance_perp_15m
    loader: intraday
    asset_class: crypto_perp
    instruments: "Binance USD-M perpetuals (107 symbols that were ever in the point-in-time monthly top 10 by volume, 2020-2026) as 15-minute candles; the card's universe is the PIT top-n by 30-day quote volume (crypto_top_n, n <= 40) or an explicit list. IntradayView fields: o h l c, qv (quote volume), nt (trades), tbq (taker-buy quote volume), funding (rate a long pays, on the settlement candle), real, listed, universe"
    frequency: 15m
    range: ["2020-01-01", "2026-09-30"]
    clock: crypto
    calendar: "24/7 (UTC)"
    source: "data.binance.vision (free), snapshot binance_2026-10-03, built by lab.framework.intraday_data"
    location: "strategy_backtester_2026_sep/data/derived/binance_2026-10-03/lab_intraday_15m"
    quality: "lab intraday-build; candle gaps repeat the previous close and are not tradable"
    holdout_from: "2023-01-01"
    cost_model: crypto_perp_intraday
    forward_source: null   # the paper bots are daily: an intraday card can pass at most G4
    known_biases:
      - "Basket = symbols that were ever in the monthly top 10 of research 15 (survivorship toward symbols that became liquid); the PIT top-n inside it is point-in-time."
      - "Fills are modeled at the next candle's open with a fee + slippage tier by liquidity; real queue position, partial fills, latency and spread widening in fast markets are not modeled, so scalping results are optimistic."
      - "Positions are constant fractions of equity inside a trade (no drift rebalancing); no liquidation model (gross <= 1)."
      - "Consumed: research 15 used BTC/ETH and the basket 2020-2026 at 15m."

