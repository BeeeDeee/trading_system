# Data catalog of the research lab.
#
# Agents read this file to know what exists. They never edit it: entries are added by the deterministic
# ingest (`lab data ingest`) after validation, with the holdout boundary fixed at that moment.
#
# holdout_from: first day of the holdout (G4); dev ends the day before (PLAN §6.1, decision Q6).
# forward_source: how G5 (paper) gets new data; null = no paper trading possible (decision Q3).
# clock: when an observation becomes known (see market_relations `clocks`).
# loader: the gate runner can load it (lab/framework/data.py). Without a loader a hypothesis stays BLOCKED_DATA.

version: 1
datasets:
  - id: sharadar_sep
    loader: true
    asset_class: us_equity
    instruments: "US common stocks incl. delisted; loadable as universe kind liq_n (n <= 500, PIT liquidity rank among the LIQ1000 stocks) or sp500 (PIT membership). Ticker-blind: ids E<permaticker>."
    fields: [ret_co, ret_oc, close_u, dollar_volume, tradable, listed, delisting, "extras: liq_rank, alt_universe"]
    frequency: 1d
    range: ["1998-01-02", "2026-09-25"]
    clock: us_close
    calendar: XNYS
    source: "Sharadar SEP via Nasdaq Data Link, snapshot sharadar_2026-09-25 (subscription ended 2026-09-27)"
    location: "strategy_backtester_2026_sep/data/{parquet,derived}/sharadar_2026-09-25"
    quality: "audited: docs/audit/sharadar_2026-09-25.md, docs/DATA_FINDINGS.md"
    holdout_from: "2021-01-01"
    cost_model: us_equity_tiers
    forward_source: null
    known_biases:
      - "Survivorship: none for prices, delisted securities included with a DELISTED row."
      - "Terminal return of a delisting is a policy (acquisition = consideration, bankruptcy -100 %, performance -30 %, SPAC 0)."
      - "Prices are unadjusted; use only total returns for P&L, unadjusted close only for filters."
      - "Pre-2001-04 quotes in fractions: cost model applies x2.5 before decimalization."
      - "Consumed: 2020-2026 used as holdout by research 1-7, 10-11; all history known to the LLM."

  - id: sharadar_sfp
    loader: true
    asset_class: us_etf
    instruments: "US ETFs and funds (Sharadar SFP)"
    fields: [ret_co, ret_oc, close_u, dollar_volume, tradable]
    frequency: 1d
    range: ["1998-01-02", "2026-09-25"]
    clock: us_close
    calendar: XNYS
    source: "Sharadar SFP, snapshot sharadar_2026-09-25"
    location: "strategy_backtester_2026_sep/data/derived/sharadar_2026-09-25/panel_etf"
    quality: "audited: docs/research2/DATA_AUDIT.md"
    holdout_from: "2021-01-01"
    cost_model: us_etf
    forward_source: null   # a free source (stockanalysis/Stooq, cross-checked) is planned via the Archivist
    known_biases:
      - "Many ETFs start after 2003-2007; pre-inception proxies are not provided."
      - "Delisted/closed ETFs are present but sparse; check coverage per instrument."
      - "One-day spikes in closeadj that reverse the next day (191 cases in 67 funds over 1998-2026, e.g. SSO 2014-06-24 x3.95) are vendor errors; the loader drops those days (no bar, not tradable). A genuine >49 % one-day move that fully reverses the next day would be dropped too."
      - "Consumed: research 2, 3, 10 and market_relations used 2010-2026."

  - id: sharadar_sf1
    loader: sep_attached
    attaches_to: sharadar_sep
    asset_class: us_equity
    instruments: "fundamentals of US stocks (ARQ/ART dimensions, point-in-time by filing date column `date`)"
    frequency: 1q
    range: ["1998-01-02", "2026-09-24"]   # filings from 1990, prices only from 1998
    clock: next_morning
    source: "Sharadar SF1, snapshot sharadar_2026-09-25"
    location: "strategy_backtester_2026_sep/data/parquet/sharadar_2026-09-25/fundamentals.parquet"
    quality: "used in research 4 and 11"
    holdout_from: "2021-01-01"
    cost_model: null
    forward_source: null   # SEC EDGAR XBRL is the planned free replacement
    known_biases:
      - "Attached to sharadar_sep as daily matrices, at most 6 fields per card (RAM). Usable from the day after the SEC filing date; stale after 400 days; a later filing of an older period never overrides a newer one."
      - "Valuation fields (pe, pb, ps, ev, evebitda, marketcap, price) are frozen at the filing date, they do not move with the price between filings."
      - "Tickers are mapped through the SEP ticker table (current ticker per permaticker): reused tickers can mix two companies in old data."
      - "Point-in-time only via the filing date (`date`, Sharadar datekey); use ARQ/ART (as reported), never MRQ/MRT (restated)."
      - "Some restatements may be backfilled into as-reported rows."

  - id: sharadar_insiders
    loader: sep_attached
    attaches_to: sharadar_sep
    asset_class: alt
    instruments: "Form 4 insider transactions"
    frequency: event
    range: ["2008-01-02", "2026-09-24"]   # by filing date `date`
    clock: next_morning
    source: "Sharadar SF2, snapshot sharadar_2026-09-25"
    location: "strategy_backtester_2026_sep/data/parquet/sharadar_2026-09-25/insiders.parquet"
    quality: "used in research 11"
    holdout_from: "2021-01-01"
    cost_model: null
    forward_source: null   # SEC EDGAR Form 4 is free
    known_biases:
      - "Attached to sharadar_sep as daily matrices (open-market purchases P and sales S by filing date, trailing 91/182/365 calendar days). A row is one transaction, not one person. NaN before 2008 plus one window, 0 where nobody filed."
      - "Usable from the day after the filing date, never from the transaction date."
      - "Use the filing date (`date`), not `transactiondate` (filings lag up to 2 business days, older ones more)."

  - id: sharadar_13f
    loader: sep_attached
    attaches_to: sharadar_sep
    asset_class: alt
    instruments: "institutional holdings (13F)"
    frequency: 1q
    range: ["2013-06-30", "2026-06-30"]   # quarter-end report dates
    clock: next_morning
    source: "Sharadar SF3, snapshot sharadar_2026-09-25"
    location: "strategy_backtester_2026_sep/data/parquet/sharadar_2026-09-25/holdings*.parquet"
    quality: "used in research 11"
    holdout_from: "2021-01-01"
    cost_model: null
    forward_source: null
    known_biases:
      - "Attached to sharadar_sep as daily matrices: the quarter ending D is usable from D + 46 days, stale after 166 days; data from 2013-06."
      - "Institutional ownership (io) divides the value held by the market cap near the quarter end; positions of 13F filers only (no shorts, no non-US holders)."
      - "Quarter-end holdings become public up to 45 days later; the loader must lag by the filing date."

  - id: sharadar_sp500
    loader: false
    asset_class: us_equity
    instruments: "S&P 500 membership history"
    frequency: event
    range: ["1998-01-02", "2026-09-25"]
