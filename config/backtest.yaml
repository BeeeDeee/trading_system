instrument: BTC/USDT
timeframe: 1h
account_id: local-dev

# Paths are relative to the repository root
data_path: data/processed/BTCUSDT_1h.parquet
results_dir: results

initial_equity: "10000"
fee_bps: "10"          # 0.10% per fill
slippage_bps: "5"      # 0.05% adverse slippage

strategy:
  id: ema_cross
  fast_period: 12
  slow_period: 26
  target_fraction: "0.95"   # fraction of equity to deploy when long

risk:
  max_position_fraction: "0.95"
  allow_short: false

warm_up_bars: 30
