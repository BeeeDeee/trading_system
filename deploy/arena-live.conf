# systemd drop-in: zapne live executor (navíc nutné live.enabled: true v config/arena.yaml, SPEC §10).
# Instalace: sudo install -D -m 644 deploy/arena-live.conf /etc/systemd/system/arena.service.d/live.conf
#            sudo systemctl daemon-reload && sudo systemctl restart arena
# Vypnutí:   sudo rm /etc/systemd/system/arena.service.d/live.conf && sudo systemctl daemon-reload && sudo systemctl restart arena
[Service]
ExecStart=
ExecStart=/opt/arena5m/.venv/bin/arena --log-file /srv/arena/log/arena.log run --live
